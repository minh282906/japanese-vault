<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (忙)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #忙-bg[i]: Thời gian quả bóng số nảy lên
   - #忙-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#忙-bg1  { animation-delay: 0.05s; }
#忙-s1   { stroke-dasharray: 18.3476; stroke-dashoffset: 18.3476; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#忙-bg2  { animation-delay: 0.42s; }
#忙-s2   { stroke-dasharray: 12.7698; stroke-dashoffset: 12.7698; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#忙-bg3  { animation-delay: 0.79s; }
#忙-s3   { stroke-dasharray: 84.3867; stroke-dashoffset: 84.3867; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#忙-bg4  { animation-delay: 1.40s; }
#忙-s4   { stroke-dasharray: 24.6240; stroke-dashoffset: 24.6240; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#忙-bg5  { animation-delay: 1.77s; }
#忙-s5   { stroke-dasharray: 58.7111; stroke-dashoffset: 58.7111; animation: drawStroke 0.32s ease-out 1.90s forwards; }
#忙-bg6  { animation-delay: 2.24s; }
#忙-s6   { stroke-dasharray: 78.4333; stroke-dashoffset: 78.4333; animation: drawStroke 0.43s ease-out 2.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #忙-s[i]) -->
<path id="忙-s1"  class="stroke" stroke="#bf0909" d="M16.25,37.25C16.25,43.769999999999996,13.67,53.39,13,55.25"/>
<path id="忙-s2"  class="stroke" stroke="#bfbf09" d="M30.25,28.25C33.53,29.74,38.74,34.39,39.56,36.72"/>
<path id="忙-s3"  class="stroke" stroke="#09bf09" d="M25.37,12.25C26.37,13.25,26.830000000000002,14.5,26.830000000000002,16C26.830000000000002,16.86,26.91,67,26.87,88C26.86,92,26.86,94.93,26.86,96.25"/>
<path id="忙-s4"  class="stroke" stroke="#09bfbf" d="M66.16,15.48C67.59,16.91,68.11999999999999,18.25,68.11999999999999,20.87C68.11999999999999,25.87,68.21999999999998,34.75,68.21999999999998,39.57"/>
<path id="忙-s5"  class="stroke" stroke="#0909bf" d="M40.13,43.71C43.370000000000005,44.5,46.11,44.4,49.510000000000005,43.86C59.970000000000006,42.19,79.21000000000001,39.45,89.75,38.67C92.67,38.45,95.52,38.28,98.37,39.09"/>
<path id="忙-s6"  class="stroke" stroke="#bf09bf" d="M52.72,46.75C53.86,47.89,53.98,49.25,53.98,51.35C53.98,62.75,53.98,73.56,53.98,77.88C53.98,87,55.75,89.52,72.75,89.52C82.25,89.52,89.5,88.25,93.28,87.22999999999999"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="忙-bg1"  class="badge-group"><circle cx="16.25" cy="37.25" r="3.5" fill="#bf0909"/><text class="num-single" x="16.25" y="37.25" dx="0" dy="-0.5">1</text></g>
<g id="忙-bg2"  class="badge-group"><circle cx="30.25" cy="28.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="30.25" y="28.25" dx="0" dy="-0.5">2</text></g>
<g id="忙-bg3"  class="badge-group"><circle cx="25.37" cy="12.25" r="3.5" fill="#09bf09"/><text class="num-single" x="25.37" y="12.25" dx="0" dy="-0.5">3</text></g>
<g id="忙-bg4"  class="badge-group"><circle cx="66.16" cy="15.48" r="3.5" fill="#09bfbf"/><text class="num-single" x="66.16" y="15.48" dx="0" dy="-0.5">4</text></g>
<g id="忙-bg5"  class="badge-group"><circle cx="40.13" cy="43.71" r="3.5" fill="#0909bf"/><text class="num-single" x="40.13" y="43.71" dx="0" dy="-0.5">5</text></g>
<g id="忙-bg6"  class="badge-group"><circle cx="52.72" cy="46.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="52.72" y="46.75" dx="0" dy="-0.5">6</text></g>
</svg>