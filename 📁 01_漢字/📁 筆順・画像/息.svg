<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (息)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #息-bg[i]: Thời gian quả bóng số nảy lên
   - #息-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#息-bg1  { animation-delay: 0.05s; }
#息-s1   { stroke-dasharray: 18.2630; stroke-dashoffset: 18.2630; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#息-bg2  { animation-delay: 0.42s; }
#息-s2   { stroke-dasharray: 42.3882; stroke-dashoffset: 42.3882; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#息-bg3  { animation-delay: 0.80s; }
#息-s3   { stroke-dasharray: 73.8745; stroke-dashoffset: 73.8745; animation: drawStroke 0.41s ease-out 0.93s forwards; }
#息-bg4  { animation-delay: 1.36s; }
#息-s4   { stroke-dasharray: 33.0050; stroke-dashoffset: 33.0050; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#息-bg5  { animation-delay: 1.73s; }
#息-s5   { stroke-dasharray: 32.5897; stroke-dashoffset: 32.5897; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#息-bg6  { animation-delay: 2.10s; }
#息-s6   { stroke-dasharray: 32.2713; stroke-dashoffset: 32.2713; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#息-bg7  { animation-delay: 2.47s; }
#息-s7   { stroke-dasharray: 17.2760; stroke-dashoffset: 17.2760; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#息-bg8  { animation-delay: 2.84s; }
#息-s8   { stroke-dasharray: 74.8934; stroke-dashoffset: 74.8934; animation: drawStroke 0.41s ease-out 2.97s forwards; }
#息-bg9  { animation-delay: 3.40s; }
#息-s9   { stroke-dasharray: 11.7816; stroke-dashoffset: 11.7816; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#息-bg10  { animation-delay: 3.77s; }
#息-s10   { stroke-dasharray: 14.7428; stroke-dashoffset: 14.7428; animation: drawStroke 0.22s ease-out 3.90s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #息-s[i]) -->
<path id="息-s1"  class="stroke" stroke="#bf0909" d="M54.25,10C54.38,10.85,54.13,11.71,53.69,12.629999999999999C51.69,16.79,49.01,19.99,44.03,24.669999999999998"/>
<path id="息-s2"  class="stroke" stroke="#bf7609" d="M36.65,25.89C37.629999999999995,26.87,37.8,28.17,37.8,29.39C37.8,31.67,37.8,54.56,37.8,64.13C37.8,66.03,37.8,67.41,37.8,67.99"/>
<path id="息-s3"  class="stroke" stroke="#9abf09" d="M38.99,27.9C48.120000000000005,26.13,61.5,24.299999999999997,67.24000000000001,23.43C70.50000000000001,22.94,72.67000000000002,24.11,72.59,27.62C72.49000000000001,32.32,72.47,50.93,72.47,60.370000000000005C72.47,62.300000000000004,72.47,63.84,72.47,64.79"/>
<path id="息-s4"  class="stroke" stroke="#2dbf09" d="M38.69,40.23C49.25,38.5,61.25,36.629999999999995,71.36,35.56999999999999"/>
<path id="息-s5"  class="stroke" stroke="#09bf52" d="M38.95,52.79C48.75,51.12,60,49.5,71.22,48.269999999999996"/>
<path id="息-s6"  class="stroke" stroke="#09bfbf" d="M39.01,65.04C47.5,63.870000000000005,61.879999999999995,61.870000000000005,71.03,61.040000000000006"/>
<path id="息-s7"  class="stroke" stroke="#0952bf" d="M23.99,80.4C23.75,84.5,19.299999999999997,91.85000000000001,15.749999999999998,95.29"/>
<path id="息-s8"  class="stroke" stroke="#2d09bf" d="M32.25,78.2C43.5,93.25,54.75,99.75,84,98.63C91.77,98.33,92.75,95.86999999999999,83.75,90"/>
<path id="息-s9"  class="stroke" stroke="#9a09bf" d="M53.5,73.5C56.88,79.38,59.75,82.49,61,78.57"/>
<path id="息-s10"  class="stroke" stroke="#bf0976" d="M83.75,71.12C89.37,74.75,92.37,78.75,93.5,81.86"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="息-bg1"  class="badge-group"><circle cx="54.25" cy="10" r="3.5" fill="#bf0909"/><text class="num-single" x="54.25" y="10" dx="0" dy="-0.5">1</text></g>
<g id="息-bg2"  class="badge-group"><circle cx="36.65" cy="22.39" r="3.5" fill="#bf7609"/><text class="num-single" x="36.65" y="22.39" dx="0" dy="-0.5">2</text></g>
<g id="息-bg3"  class="badge-group"><circle cx="38.99" cy="31.4" r="3.5" fill="#9abf09"/><text class="num-single" x="38.99" y="31.4" dx="0" dy="-0.5">3</text></g>
<g id="息-bg4"  class="badge-group"><circle cx="38.69" cy="40.23" r="3.5" fill="#2dbf09"/><text class="num-single" x="38.69" y="40.23" dx="0" dy="-0.5">4</text></g>
<g id="息-bg5"  class="badge-group"><circle cx="38.95" cy="52.79" r="3.5" fill="#09bf52"/><text class="num-single" x="38.95" y="52.79" dx="0" dy="-0.5">5</text></g>
<g id="息-bg6"  class="badge-group"><circle cx="39.01" cy="65.04" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.01" y="65.04" dx="0" dy="-0.5">6</text></g>
<g id="息-bg7"  class="badge-group"><circle cx="23.99" cy="80.4" r="3.5" fill="#0952bf"/><text class="num-single" x="23.99" y="80.4" dx="0" dy="-0.5">7</text></g>
<g id="息-bg8"  class="badge-group"><circle cx="32.25" cy="78.2" r="3.5" fill="#2d09bf"/><text class="num-single" x="32.25" y="78.2" dx="0" dy="-0.5">8</text></g>
<g id="息-bg9"  class="badge-group"><circle cx="53.5" cy="73.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="53.5" y="73.5" dx="0" dy="-0.5">9</text></g>
<g id="息-bg10" class="badge-group"><circle cx="83.75" cy="71.12" r="3.5" fill="#bf0976"/><text class="num-double" x="83.75" y="71.12" dx="-0.4" dy="-0.475">10</text></g>
</svg>