<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (専)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #専-bg[i]: Thời gian quả bóng số nảy lên
   - #専-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#専-bg1  { animation-delay: 0.05s; }
#専-s1   { stroke-dasharray: 63.5705; stroke-dashoffset: 63.5705; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#専-bg2  { animation-delay: 0.55s; }
#専-s2   { stroke-dasharray: 29.0763; stroke-dashoffset: 29.0763; animation: drawStroke 0.22s ease-out 0.68s forwards; }
#専-bg3  { animation-delay: 0.92s; }
#専-s3   { stroke-dasharray: 76.7779; stroke-dashoffset: 76.7779; animation: drawStroke 0.42s ease-out 1.05s forwards; }
#専-bg4  { animation-delay: 1.49s; }
#専-s4   { stroke-dasharray: 45.0247; stroke-dashoffset: 45.0247; animation: drawStroke 0.25s ease-out 1.62s forwards; }
#専-bg5  { animation-delay: 1.89s; }
#専-s5   { stroke-dasharray: 39.7024; stroke-dashoffset: 39.7024; animation: drawStroke 0.22s ease-out 2.02s forwards; }
#専-bg6  { animation-delay: 2.26s; }
#専-s6   { stroke-dasharray: 44.1486; stroke-dashoffset: 44.1486; animation: drawStroke 0.24s ease-out 2.39s forwards; }
#専-bg7  { animation-delay: 2.65s; }
#専-s7   { stroke-dasharray: 79.6063; stroke-dashoffset: 79.6063; animation: drawStroke 0.44s ease-out 2.78s forwards; }
#専-bg8  { animation-delay: 3.24s; }
#専-s8   { stroke-dasharray: 49.4748; stroke-dashoffset: 49.4748; animation: drawStroke 0.27s ease-out 3.37s forwards; }
#専-bg9  { animation-delay: 3.66s; }
#専-s9   { stroke-dasharray: 14.0191; stroke-dashoffset: 14.0191; animation: drawStroke 0.22s ease-out 3.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #専-s[i]) -->
<path id="専-s1"  class="stroke" stroke="#bf0909" d="M22.75,21.79C25.37,22.38,28.6,22.15,31.119999999999997,21.84C46,20,66.09,17.76,77.25,17.2C80.11,17.05,83.2,16.93,86,17.61"/>
<path id="専-s2"  class="stroke" stroke="#bf8209" d="M27.63,33.11C28.57,34.05,29.45,35.11,29.71,36.43C31.12,43.63,32.1,48.33,33.43,56.480000000000004C33.68,57.980000000000004,33.92,59.53,34.15,61.13"/>
<path id="専-s3"  class="stroke" stroke="#82bf09" d="M29.83,34.3C44.5,31.749999999999996,63.42,29.79,73.62,28.679999999999996C78.24000000000001,28.179999999999996,80.45,28.899999999999995,79.74000000000001,34C79.12,38.39,77.72000000000001,44.63,76.16000000000001,51.54C75.84000000000002,52.96,75.51,54.39,75.18,55.83"/>
<path id="専-s4"  class="stroke" stroke="#09bf09" d="M32.69,45.89C42.129999999999995,44.25,59.75,41.88,77.37,40.43"/>
<path id="専-s5"  class="stroke" stroke="#09bf82" d="M35.05,57.91C47,56.379999999999995,61.959999999999994,54.54,74.52,53.669999999999995"/>
<path id="専-s6"  class="stroke" stroke="#0982bf" d="M52.29,10.5C53.08,11.29,53.73,12.78,53.73,14.28C53.769999999999996,29.08,53.709999999999994,50.43,53.709999999999994,54.29"/>
<path id="専-s7"  class="stroke" stroke="#0909bf" d="M15.88,72.92C19.380000000000003,74.12,23.47,73.89,26.630000000000003,73.5C44.63,71.25,67.41,69.89,84.01,68.7C87.7,68.44,92.38000000000001,68.38000000000001,95.13000000000001,69.07000000000001"/>
<path id="専-s8"  class="stroke" stroke="#8209bf" d="M68.04,59.58C69.04,60.58,69.47000000000001,62.37,69.47000000000001,64.35C69.47000000000001,71,69.48000000000002,88.00999999999999,69.48000000000002,92.97C69.48000000000002,105,62.41000000000002,94.75,60.350000000000016,93.22"/>
<path id="専-s9"  class="stroke" stroke="#bf0982" d="M38.69,79.62C42.15,81.34,47.62,86.69,48.48,89.37"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="専-bg1"  class="badge-group"><circle cx="22.75" cy="21.79" r="3.5" fill="#bf0909"/><text class="num-single" x="22.75" y="21.79" dx="0" dy="-0.5">1</text></g>
<g id="専-bg2"  class="badge-group"><circle cx="27.63" cy="29.61" r="3.5" fill="#bf8209"/><text class="num-single" x="27.63" y="29.61" dx="0" dy="-0.5">2</text></g>
<g id="専-bg3"  class="badge-group"><circle cx="29.83" cy="37.8" r="3.5" fill="#82bf09"/><text class="num-single" x="29.83" y="37.8" dx="0" dy="-0.5">3</text></g>
<g id="専-bg4"  class="badge-group"><circle cx="32.69" cy="45.89" r="3.5" fill="#09bf09"/><text class="num-single" x="32.69" y="45.89" dx="0" dy="-0.5">4</text></g>
<g id="専-bg5"  class="badge-group"><circle cx="35.05" cy="57.91" r="3.5" fill="#09bf82"/><text class="num-single" x="35.05" y="57.91" dx="0" dy="-0.5">5</text></g>
<g id="専-bg6"  class="badge-group"><circle cx="52.29" cy="10.5" r="3.5" fill="#0982bf"/><text class="num-single" x="52.29" y="10.5" dx="0" dy="-0.5">6</text></g>
<g id="専-bg7"  class="badge-group"><circle cx="15.88" cy="72.92" r="3.5" fill="#0909bf"/><text class="num-single" x="15.88" y="72.92" dx="0" dy="-0.5">7</text></g>
<g id="専-bg8"  class="badge-group"><circle cx="68.04" cy="59.58" r="3.5" fill="#8209bf"/><text class="num-single" x="68.04" y="59.58" dx="0" dy="-0.5">8</text></g>
<g id="専-bg9"  class="badge-group"><circle cx="38.69" cy="79.62" r="3.5" fill="#bf0982"/><text class="num-single" x="38.69" y="79.62" dx="0" dy="-0.5">9</text></g>
