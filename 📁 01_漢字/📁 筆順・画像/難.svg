<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (難)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #難-bg[i]: Thời gian quả bóng số nảy lên
   - #難-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#難-bg1  { animation-delay: 0.05s; }
#難-s1   { stroke-dasharray: 39.4346; stroke-dashoffset: 39.4346; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#難-bg2  { animation-delay: 0.42s; }
#難-s2   { stroke-dasharray: 18.5874; stroke-dashoffset: 18.5874; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#難-bg3  { animation-delay: 0.79s; }
#難-s3   { stroke-dasharray: 19.5825; stroke-dashoffset: 19.5825; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#難-bg4  { animation-delay: 1.16s; }
#難-s4   { stroke-dasharray: 15.1487; stroke-dashoffset: 15.1487; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#難-bg5  { animation-delay: 1.53s; }
#難-s5   { stroke-dasharray: 43.0825; stroke-dashoffset: 43.0825; animation: drawStroke 0.24s ease-out 1.66s forwards; }
#難-bg6  { animation-delay: 1.92s; }
#難-s6   { stroke-dasharray: 26.9018; stroke-dashoffset: 26.9018; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#難-bg7  { animation-delay: 2.29s; }
#難-s7   { stroke-dasharray: 28.2898; stroke-dashoffset: 28.2898; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#難-bg8  { animation-delay: 2.66s; }
#難-s8   { stroke-dasharray: 37.0989; stroke-dashoffset: 37.0989; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#難-bg9  { animation-delay: 3.03s; }
#難-s9   { stroke-dasharray: 61.1295; stroke-dashoffset: 61.1295; animation: drawStroke 0.34s ease-out 3.16s forwards; }
#難-bg10  { animation-delay: 3.52s; }
#難-s10   { stroke-dasharray: 18.5040; stroke-dashoffset: 18.5040; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#難-bg11  { animation-delay: 3.89s; }
#難-s11   { stroke-dasharray: 41.8236; stroke-dashoffset: 41.8236; animation: drawStroke 0.23s ease-out 4.02s forwards; }
#難-bg12  { animation-delay: 4.27s; }
#難-s12   { stroke-dasharray: 56.5611; stroke-dashoffset: 56.5611; animation: drawStroke 0.31s ease-out 4.40s forwards; }
#難-bg13  { animation-delay: 4.73s; }
#難-s13   { stroke-dasharray: 17.9551; stroke-dashoffset: 17.9551; animation: drawStroke 0.22s ease-out 4.86s forwards; }
#難-bg14  { animation-delay: 5.10s; }
#難-s14   { stroke-dasharray: 33.0764; stroke-dashoffset: 33.0764; animation: drawStroke 0.22s ease-out 5.23s forwards; }
#難-bg15  { animation-delay: 5.47s; }
#難-s15   { stroke-dasharray: 46.9743; stroke-dashoffset: 46.9743; animation: drawStroke 0.26s ease-out 5.60s forwards; }
#難-bg16  { animation-delay: 5.88s; }
#難-s16   { stroke-dasharray: 29.1020; stroke-dashoffset: 29.1020; animation: drawStroke 0.22s ease-out 6.01s forwards; }
#難-bg17  { animation-delay: 6.25s; }
#難-s17   { stroke-dasharray: 29.4119; stroke-dashoffset: 29.4119; animation: drawStroke 0.22s ease-out 6.38s forwards; }
#難-bg18  { animation-delay: 6.62s; }
#難-s18   { stroke-dasharray: 33.6527; stroke-dashoffset: 33.6527; animation: drawStroke 0.22s ease-out 6.75s forwards; }
]]>
</style>

