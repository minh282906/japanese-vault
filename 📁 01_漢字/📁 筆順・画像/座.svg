<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (座)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #座-bg[i]: Thời gian quả bóng số nảy lên
   - #座-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#座-bg1  { animation-delay: 0.05s; }
#座-s1   { stroke-dasharray: 12.4902; stroke-dashoffset: 12.4902; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#座-bg2  { animation-delay: 0.42s; }
#座-s2   { stroke-dasharray: 67.4176; stroke-dashoffset: 67.4176; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#座-bg3  { animation-delay: 0.94s; }
#座-s3   { stroke-dasharray: 66.5547; stroke-dashoffset: 66.5547; animation: drawStroke 0.37s ease-out 1.07s forwards; }
#座-bg4  { animation-delay: 1.46s; }
#座-s4   { stroke-dasharray: 27.1343; stroke-dashoffset: 27.1343; animation: drawStroke 0.22s ease-out 1.59s forwards; }
#座-bg5  { animation-delay: 1.83s; }
#座-s5   { stroke-dasharray: 14.4087; stroke-dashoffset: 14.4087; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#座-bg6  { animation-delay: 2.20s; }
#座-s6   { stroke-dasharray: 24.3046; stroke-dashoffset: 24.3046; animation: drawStroke 0.22s ease-out 2.33s forwards; }
#座-bg7  { animation-delay: 2.57s; }
#座-s7   { stroke-dasharray: 14.4616; stroke-dashoffset: 14.4616; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#座-bg8  { animation-delay: 2.94s; }
#座-s8   { stroke-dasharray: 56.5567; stroke-dashoffset: 56.5567; animation: drawStroke 0.31s ease-out 3.07s forwards; }
#座-bg9  { animation-delay: 3.40s; }
#座-s9   { stroke-dasharray: 42.6318; stroke-dashoffset: 42.6318; animation: drawStroke 0.23s ease-out 3.53s forwards; }
#座-bg10  { animation-delay: 3.78s; }
#座-s10   { stroke-dasharray: 66.7427; stroke-dashoffset: 66.7427; animation: drawStroke 0.37s ease-out 3.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #座-s[i]) -->
<path id="座-s1"  class="stroke" stroke="#bf0909" d="M53.81,13.88C55.03,15.100000000000001,55.32,16.75,55.32,18.28C55.32,19.07,55.25,23.240000000000002,55.25,25.990000000000002"/>
<path id="座-s2"  class="stroke" stroke="#bf7609" d="M21.13,28.82C24,29.5,27.68,29.3,30.74,29.06C46.25,27.869999999999997,63.39,26.77,79.25,25.959999999999997C82.38,25.799999999999997,85.3,25.659999999999997,88.38,26.24"/>
<path id="座-s3"  class="stroke" stroke="#9abf09" d="M24,29.5C24.88,30.38,25.2,31.63,25.16,32.86C24.5,54.629999999999995,23.38,73.75,10.31,92.97"/>
<path id="座-s4"  class="stroke" stroke="#2dbf09" d="M43.35,41.05C43.410000000000004,42.18,43.22,43.26,42.76,44.3C40.69,50.16,36,56.23,28.71,63.26"/>
<path id="座-s5"  class="stroke" stroke="#09bf52" d="M42.75,51C46.03,52.76,50.230000000000004,57.43,51.83,61.86"/>
<path id="座-s6"  class="stroke" stroke="#09bfbf" d="M78.77,39.42C78.85,40.52,78.86,41.550000000000004,78.31,42.52C76.28,47.400000000000006,72.11,54.28,66.57000000000001,59.940000000000005"/>
<path id="座-s7"  class="stroke" stroke="#0952bf" d="M78.62,49.75C82.57000000000001,52.63,85.61,56.24,87.97,60.62"/>
<path id="座-s8"  class="stroke" stroke="#2d09bf" d="M57.53,34.87C58.27,35.61,58.75,36.879999999999995,58.75,38.43C58.75,48.379999999999995,58.75,77.72,58.75,91.13"/>
<path id="座-s9"  class="stroke" stroke="#9a09bf" d="M37.31,74.62C38.88,75,41.32,75.12,42.870000000000005,74.96000000000001C51.82000000000001,74.02000000000001,63.28,72.60000000000001,72.63000000000001,72.13000000000001C74.9,72.02000000000001,77.53000000000002,72.01,79.74000000000001,72.52000000000001"/>
<path id="座-s10"  class="stroke" stroke="#bf0976" d="M25.73,93.33C28.52,94.32,32.37,93.88,35.26,93.67C49.47,92.64,69.99,91.82000000000001,83.25,91.22C86.33,91.08,89.29,91.32,92.28,91.96"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="座-bg1"  class="badge-group"><circle cx="53.81" cy="13.88" r="3.5" fill="#bf0909"/><text class="num-single" x="53.81" y="13.88" dx="0" dy="-0.5">1</text></g>
<g id="座-bg2"  class="badge-group"><circle cx="21.13" cy="25.32" r="3.5" fill="#bf7609"/><text class="num-single" x="21.13" y="25.32" dx="0" dy="-0.5">2</text></g>
<g id="座-bg3"  class="badge-group"><circle cx="24" cy="33.0" r="3.5" fill="#9abf09"/><text class="num-single" x="24" y="33.0" dx="0" dy="-0.5">3</text></g>
<g id="座-bg4"  class="badge-group"><circle cx="43.35" cy="41.05" r="3.5" fill="#2dbf09"/><text class="num-single" x="43.35" y="41.05" dx="0" dy="-0.5">4</text></g>
<g id="座-bg5"  class="badge-group"><circle cx="42.75" cy="51" r="3.5" fill="#09bf52"/><text class="num-single" x="42.75" y="51" dx="0" dy="-0.5">5</text></g>
<g id="座-bg6"  class="badge-group"><circle cx="78.77" cy="39.42" r="3.5" fill="#09bfbf"/><text class="num-single" x="78.77" y="39.42" dx="0" dy="-0.5">6</text></g>
<g id="座-bg7"  class="badge-group"><circle cx="78.62" cy="49.75" r="3.5" fill="#0952bf"/><text class="num-single" x="78.62" y="49.75" dx="0" dy="-0.5">7</text></g>
<g id="座-bg8"  class="badge-group"><circle cx="57.53" cy="34.87" r="3.5" fill="#2d09bf"/><text class="num-single" x="57.53" y="34.87" dx="0" dy="-0.5">8</text></g>
<g id="座-bg9"  class="badge-group"><circle cx="37.31" cy="74.62" r="3.5" fill="#9a09bf"/><text class="num-single" x="37.31" y="74.62" dx="0" dy="-0.5">9</text></g>
<g id="座-bg10" class="badge-group"><circle cx="25.73" cy="93.33" r="3.5" fill="#bf0976"/><text class="num-double" x="25.73" y="93.33" dx="-0.4" dy="-0.475">10</text></g>
</svg>