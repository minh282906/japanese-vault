<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (波)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #波-bg[i]: Thời gian quả bóng số nảy lên
   - #波-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#波-bg1  { animation-delay: 0.05s; }
#波-s1   { stroke-dasharray: 12.1038; stroke-dashoffset: 12.1038; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#波-bg2  { animation-delay: 0.42s; }
#波-s2   { stroke-dasharray: 13.2048; stroke-dashoffset: 13.2048; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#波-bg3  { animation-delay: 0.79s; }
#波-s3   { stroke-dasharray: 24.7603; stroke-dashoffset: 24.7603; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#波-bg4  { animation-delay: 1.16s; }
#波-s4   { stroke-dasharray: 60.1594; stroke-dashoffset: 60.1594; animation: drawStroke 0.33s ease-out 1.29s forwards; }
#波-bg5  { animation-delay: 1.64s; }
#波-s5   { stroke-dasharray: 58.3423; stroke-dashoffset: 58.3423; animation: drawStroke 0.32s ease-out 1.77s forwards; }
#波-bg6  { animation-delay: 2.11s; }
#波-s6   { stroke-dasharray: 41.4096; stroke-dashoffset: 41.4096; animation: drawStroke 0.23s ease-out 2.24s forwards; }
#波-bg7  { animation-delay: 2.49s; }
#波-s7   { stroke-dasharray: 88.2493; stroke-dashoffset: 88.2493; animation: drawStroke 0.49s ease-out 2.62s forwards; }
#波-bg8  { animation-delay: 3.13s; }
#波-s8   { stroke-dasharray: 54.1877; stroke-dashoffset: 54.1877; animation: drawStroke 0.30s ease-out 3.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #波-s[i]) -->
<path id="波-s1"  class="stroke" stroke="#bf0909" d="M21.13,19.5C24.439999999999998,20.97,28.369999999999997,23.12,30.75,26.59"/>
<path id="波-s2"  class="stroke" stroke="#bf9109" d="M14.38,40.88C18.04,42.17,23.840000000000003,46.75,24.76,48.760000000000005"/>
<path id="波-s3"  class="stroke" stroke="#64bf09" d="M14.07,89.41C15.75,89.63,17.02,89.2,17.75,87.96C20.5,83.25999999999999,24.25,75.50999999999999,26.75,69.50999999999999"/>
<path id="波-s4"  class="stroke" stroke="#09bf36" d="M40.69,34.49C41.79,35.59,42.28,36.88,42.28,38.82C42.28,68.5,39,81.5,28.37,90.62"/>
<path id="波-s5"  class="stroke" stroke="#09bfbf" d="M42.37,35.97C56.29,33.05,75.13,30.369999999999997,83.43,30.189999999999998C93.25,29.979999999999997,89.75,35,83.84,40"/>
<path id="波-s6"  class="stroke" stroke="#0936bf" d="M61.41,12.25C62.65,13.48,63.4,15.129999999999999,63.4,16.69C63.4,17.76,63.33,42.28,63.33,53.11"/>
<path id="波-s7"  class="stroke" stroke="#6409bf" d="M50.36,55C51.51,55.39,52.97,55.66,55.32,55.36C61,54.63,73.27,51.43,74.9,51.03C79,50.01,79.71000000000001,52.24,78.55000000000001,55.57C72.75000000000001,72.25,59.500000000000014,87.25,41.250000000000014,93.5"/>
<path id="波-s8"  class="stroke" stroke="#bf0991" d="M48.75,61.62C52.2,62.419999999999995,70.78,79.81,83.72,89.66C86.1,91.47,88.83,93.41,91.78,94.17999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="波-bg1"  class="badge-group"><circle cx="21.13" cy="19.5" r="3.5" fill="#bf0909"/><text class="num-single" x="21.13" y="19.5" dx="0" dy="-0.5">1</text></g>
<g id="波-bg2"  class="badge-group"><circle cx="14.38" cy="40.88" r="3.5" fill="#bf9109"/><text class="num-single" x="14.38" y="40.88" dx="0" dy="-0.5">2</text></g>
<g id="波-bg3"  class="badge-group"><circle cx="14.07" cy="89.41" r="3.5" fill="#64bf09"/><text class="num-single" x="14.07" y="89.41" dx="0" dy="-0.5">3</text></g>
<g id="波-bg4"  class="badge-group"><circle cx="40.69" cy="30.99" r="3.5" fill="#09bf36"/><text class="num-single" x="40.69" y="30.99" dx="0" dy="-0.5">4</text></g>
<g id="波-bg5"  class="badge-group"><circle cx="42.37" cy="39.47" r="3.5" fill="#09bfbf"/><text class="num-single" x="42.37" y="39.47" dx="0" dy="-0.5">5</text></g>
<g id="波-bg6"  class="badge-group"><circle cx="61.41" cy="12.25" r="3.5" fill="#0936bf"/><text class="num-single" x="61.41" y="12.25" dx="0" dy="-0.5">6</text></g>
<g id="波-bg7"  class="badge-group"><circle cx="50.36" cy="51.5" r="3.5" fill="#6409bf"/><text class="num-single" x="50.36" y="51.5" dx="0" dy="-0.5">7</text></g>
<g id="波-bg8"  class="badge-group"><circle cx="48.75" cy="65.12" r="3.5" fill="#bf0991"/><text class="num-single" x="48.75" y="65.12" dx="0" dy="-0.5">8</text></g>
</svg>