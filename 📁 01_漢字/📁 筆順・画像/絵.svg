<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (絵)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #絵-bg[i]: Thời gian quả bóng số nảy lên
   - #絵-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#絵-bg1  { animation-delay: 0.05s; }
#絵-s1   { stroke-dasharray: 39.2789; stroke-dashoffset: 39.2789; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#絵-bg2  { animation-delay: 0.42s; }
#絵-s2   { stroke-dasharray: 60.8331; stroke-dashoffset: 60.8331; animation: drawStroke 0.33s ease-out 0.55s forwards; }
#絵-bg3  { animation-delay: 0.90s; }
#絵-s3   { stroke-dasharray: 14.3459; stroke-dashoffset: 14.3459; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#絵-bg4  { animation-delay: 1.27s; }
#絵-s4   { stroke-dasharray: 36.3189; stroke-dashoffset: 36.3189; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#絵-bg5  { animation-delay: 1.64s; }
#絵-s5   { stroke-dasharray: 18.0498; stroke-dashoffset: 18.0498; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#絵-bg6  { animation-delay: 2.01s; }
#絵-s6   { stroke-dasharray: 14.9525; stroke-dashoffset: 14.9525; animation: drawStroke 0.22s ease-out 2.14s forwards; }
#絵-bg7  { animation-delay: 2.38s; }
#絵-s7   { stroke-dasharray: 43.4179; stroke-dashoffset: 43.4179; animation: drawStroke 0.24s ease-out 2.51s forwards; }
#絵-bg8  { animation-delay: 2.77s; }
#絵-s8   { stroke-dasharray: 42.3435; stroke-dashoffset: 42.3435; animation: drawStroke 0.23s ease-out 2.90s forwards; }
#絵-bg9  { animation-delay: 3.15s; }
#絵-s9   { stroke-dasharray: 23.0640; stroke-dashoffset: 23.0640; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#絵-bg10  { animation-delay: 3.52s; }
#絵-s10   { stroke-dasharray: 44.9676; stroke-dashoffset: 44.9676; animation: drawStroke 0.25s ease-out 3.65s forwards; }
#絵-bg11  { animation-delay: 3.92s; }
#絵-s11   { stroke-dasharray: 56.2754; stroke-dashoffset: 56.2754; animation: drawStroke 0.31s ease-out 4.05s forwards; }
#絵-bg12  { animation-delay: 4.38s; }
#絵-s12   { stroke-dasharray: 19.5903; stroke-dashoffset: 19.5903; animation: drawStroke 0.22s ease-out 4.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

