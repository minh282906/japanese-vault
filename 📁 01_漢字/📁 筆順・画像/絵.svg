<path id="絵-s10"  class="stroke" stroke="#6409bf" d="M47.75,67.36C49.25,67.61,52.019999999999996,67.77,53.5,67.61C63.87,66.5,77,64.75,87.27000000000001,64.31C89.77000000000001,64.2,91.27000000000001,64.43,92.52000000000001,64.56"/>
<path id="絵-s11"  class="stroke" stroke="#bf09bf" d="M65.12,69.57C65.69,71.16,65.30000000000001,72.75999999999999,64.37,74.08999999999999C62.040000000000006,77.39999999999999,58.910000000000004,81.72999999999999,53.53,87.76999999999998C51.85,89.65999999999998,52.34,90.97999999999998,55.120000000000005,90.61999999999998C60.980000000000004,89.85999999999997,73.59,85.73999999999998,83.13000000000001,83.95999999999998"/>
<path id="絵-s12"  class="stroke" stroke="#bf0964" d="M78.5,76.25C81.94,79.21,87.39,88.4,88.25,93"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
