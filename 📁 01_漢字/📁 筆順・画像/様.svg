<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (様)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #様-bg[i]: Thời gian quả bóng số nảy lên
   - #様-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#様-bg1  { animation-delay: 0.05s; }
#様-s1   { stroke-dasharray: 34.0129; stroke-dashoffset: 34.0129; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#様-bg2  { animation-delay: 0.42s; }
#様-s2   { stroke-dasharray: 84.0174; stroke-dashoffset: 84.0174; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#様-bg3  { animation-delay: 1.03s; }
#様-s3   { stroke-dasharray: 41.5243; stroke-dashoffset: 41.5243; animation: drawStroke 0.23s ease-out 1.16s forwards; }
#様-bg4  { animation-delay: 1.41s; }
#様-s4   { stroke-dasharray: 12.1766; stroke-dashoffset: 12.1766; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#様-bg5  { animation-delay: 1.78s; }
#様-s5   { stroke-dasharray: 13.0396; stroke-dashoffset: 13.0396; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#様-bg6  { animation-delay: 2.15s; }
#様-s6   { stroke-dasharray: 16.4776; stroke-dashoffset: 16.4776; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#様-bg7  { animation-delay: 2.52s; }
#様-s7   { stroke-dasharray: 41.1722; stroke-dashoffset: 41.1722; animation: drawStroke 0.23s ease-out 2.65s forwards; }
#様-bg8  { animation-delay: 2.90s; }
#様-s8   { stroke-dasharray: 36.2319; stroke-dashoffset: 36.2319; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#様-bg9  { animation-delay: 3.27s; }
#様-s9   { stroke-dasharray: 48.9153; stroke-dashoffset: 48.9153; animation: drawStroke 0.27s ease-out 3.40s forwards; }
#様-bg10  { animation-delay: 3.69s; }
#様-s10   { stroke-dasharray: 74.2235; stroke-dashoffset: 74.2235; animation: drawStroke 0.41s ease-out 3.82s forwards; }
#様-bg11  { animation-delay: 4.25s; }
#様-s11   { stroke-dasharray: 10.8213; stroke-dashoffset: 10.8213; animation: drawStroke 0.22s ease-out 4.38s forwards; }
#様-bg12  { animation-delay: 4.62s; }
#様-s12   { stroke-dasharray: 20.5953; stroke-dashoffset: 20.5953; animation: drawStroke 0.22s ease-out 4.75s forwards; }
#様-bg13  { animation-delay: 4.99s; }
#様-s13   { stroke-dasharray: 12.3916; stroke-dashoffset: 12.3916; animation: drawStroke 0.22s ease-out 5.12s forwards; }
#様-bg14  { animation-delay: 5.36s; }
#様-s14   { stroke-dasharray: 24.7126; stroke-dashoffset: 24.7126; animation: drawStroke 0.22s ease-out 5.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

