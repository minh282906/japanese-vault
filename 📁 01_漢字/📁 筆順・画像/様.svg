<path id="様-s10"  class="stroke" stroke="#0923bf" d="M68.02,31.83C69,32.75,70.03,34.37,70.03,35.849999999999994C70.03,50.41,70.02,87.00999999999999,70.02,91.97C70.02,100.09,65.11,95.39,61.309999999999995,92.22"/>
<path id="様-s11"  class="stroke" stroke="#3d09bf" d="M48.77,62.21C51.61,63.45,56.1,67.29,56.81,69.22"/>
