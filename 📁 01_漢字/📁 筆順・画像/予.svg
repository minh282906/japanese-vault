<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (予)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #予-bg[i]: Thời gian quả bóng số nảy lên
   - #予-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#予-bg1  { animation-delay: 0.05s; }
#予-s1   { stroke-dasharray: 74.3634; stroke-dashoffset: 74.3634; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#予-bg2  { animation-delay: 0.61s; }
#予-s2   { stroke-dasharray: 17.6470; stroke-dashoffset: 17.6470; animation: drawStroke 0.22s ease-out 0.74s forwards; }
#予-bg3  { animation-delay: 0.98s; }
#予-s3   { stroke-dasharray: 96.7936; stroke-dashoffset: 96.7936; animation: drawStroke 0.53s ease-out 1.11s forwards; }
#予-bg4  { animation-delay: 1.66s; }
#予-s4   { stroke-dasharray: 64.6587; stroke-dashoffset: 64.6587; animation: drawStroke 0.36s ease-out 1.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #予-s[i]) -->
<path id="予-s1"  class="stroke" stroke="#bf0909" d="M28.48,15.91C30.25,16.62,32.04,16.89,33.76,16.62C37.15,16.09,66.41999999999999,12.280000000000001,70,11.75C73.58,11.22,74.81,14,72.67,15.75C69,18.75,55.32,29.57,53.06,31.7"/>
<path id="予-s2"  class="stroke" stroke="#64bf09" d="M43.38,26.38C46.730000000000004,27.84,55.39,33.44,56.97,37.26"/>
<path id="予-s3"  class="stroke" stroke="#09bfbf" d="M13.92,42.58C15.5,43.37,18.75,43.75,21.84,43.5C27.86,43.01,81.67,37.46,86.34,36.83C90.86,36.23,92.27000000000001,38.1,89.52000000000001,41.19C86.14000000000001,45,81.20000000000002,49.66,78.76,52.08"/>
<path id="予-s4"  class="stroke" stroke="#6409bf" d="M52.67,43.92C53.94,45.19,55,47,55,48.5C55,50.5,55.08,87.17,55.08,90.83C55.08,103.5,47.62,93.37,45.41,90.83"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="予-bg1"  class="badge-group"><circle cx="28.48" cy="15.91" r="3.5" fill="#bf0909"/><text class="num-single" x="28.48" y="15.91" dx="0" dy="-0.5">1</text></g>
<g id="予-bg2"  class="badge-group"><circle cx="43.38" cy="26.38" r="3.5" fill="#64bf09"/><text class="num-single" x="43.38" y="26.38" dx="0" dy="-0.5">2</text></g>
<g id="予-bg3"  class="badge-group"><circle cx="13.92" cy="42.58" r="3.5" fill="#09bfbf"/><text class="num-single" x="13.92" y="42.58" dx="0" dy="-0.5">3</text></g>
<g id="予-bg4"  class="badge-group"><circle cx="52.67" cy="43.92" r="3.5" fill="#6409bf"/><text class="num-single" x="52.67" y="43.92" dx="0" dy="-0.5">4</text></g>
</svg>