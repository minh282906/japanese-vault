<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (上)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #上-bg[i]: Thời gian quả bóng số nảy lên
   - #上-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#上-bg1  { animation-delay: 0.05s; }
#上-s1   { stroke-dasharray: 70.2628; stroke-dashoffset: 70.2628; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#上-bg2  { animation-delay: 0.59s; }
#上-s2   { stroke-dasharray: 22.7910; stroke-dashoffset: 22.7910; animation: drawStroke 0.22s ease-out 0.72s forwards; }
#上-bg3  { animation-delay: 0.96s; }
#上-s3   { stroke-dasharray: 82.6169; stroke-dashoffset: 82.6169; animation: drawStroke 0.45s ease-out 1.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #上-s[i]) -->
<path id="上-s1"  class="stroke" stroke="#bf0909" d="M52.31,15.88C53.46,17.03,54.32,19,54.32,21C54.32,21.82,54.1,84.62,54.07,85.63"/>
<path id="上-s2"  class="stroke" stroke="#09bf09" d="M58,44.75C65,44.13,72.25,42.25,75.75,41.75C77.13,41.55,79.25,41.37,80.5,41.75"/>
<path id="上-s3"  class="stroke" stroke="#0909bf" d="M13.38,88.28C16.98,89.43,20.830000000000002,88.9,24.51,88.62C40.74,87.39,65.67,85.96000000000001,84.75,85.7C88.4,85.65,92.22,85.38000000000001,95.75,86.52"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="上-bg1"  class="badge-group"><circle cx="52.31" cy="15.88" r="3.5" fill="#bf0909"/><text class="num-single" x="52.31" y="15.88" dx="0" dy="-0.5">1</text></g>
<g id="上-bg2"  class="badge-group"><circle cx="58" cy="44.75" r="3.5" fill="#09bf09"/><text class="num-single" x="58" y="44.75" dx="0" dy="-0.5">2</text></g>
<g id="上-bg3"  class="badge-group"><circle cx="13.38" cy="88.28" r="3.5" fill="#0909bf"/><text class="num-single" x="13.38" y="88.28" dx="0" dy="-0.5">3</text></g>
</svg>