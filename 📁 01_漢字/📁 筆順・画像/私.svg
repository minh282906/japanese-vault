<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (私)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #私-bg[i]: Thời gian quả bóng số nảy lên
   - #私-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#私-bg1  { animation-delay: 0.05s; }
#私-s1   { stroke-dasharray: 31.5110; stroke-dashoffset: 31.5110; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#私-bg2  { animation-delay: 0.42s; }
#私-s2   { stroke-dasharray: 42.7252; stroke-dashoffset: 42.7252; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#私-bg3  { animation-delay: 0.80s; }
#私-s3   { stroke-dasharray: 66.9079; stroke-dashoffset: 66.9079; animation: drawStroke 0.37s ease-out 0.93s forwards; }
#私-bg4  { animation-delay: 1.32s; }
#私-s4   { stroke-dasharray: 43.0811; stroke-dashoffset: 43.0811; animation: drawStroke 0.24s ease-out 1.45s forwards; }
#私-bg5  { animation-delay: 1.71s; }
#私-s5   { stroke-dasharray: 15.1344; stroke-dashoffset: 15.1344; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#私-bg6  { animation-delay: 2.08s; }
#私-s6   { stroke-dasharray: 95.2213; stroke-dashoffset: 95.2213; animation: drawStroke 0.52s ease-out 2.21s forwards; }
#私-bg7  { animation-delay: 2.75s; }
#私-s7   { stroke-dasharray: 28.0546; stroke-dashoffset: 28.0546; animation: drawStroke 0.22s ease-out 2.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #私-s[i]) -->
<path id="私-s1"  class="stroke" stroke="#bf0909" d="M45.24,13.5C45.25,14.5,44.74,15.75,43.81,16.490000000000002C39.75,19.75,31.75,23.88,18.75,29"/>
<path id="私-s2"  class="stroke" stroke="#bfa509" d="M11.62,44.6C14.25,45.38,17.13,45.1,18.9,44.77C28.88,42.88,41.519999999999996,41.480000000000004,49.62,40.71C50.91,40.59,52.75,40.5,53.98,40.83"/>
<path id="私-s3"  class="stroke" stroke="#3dbf09" d="M36.08,26.66C37.03,27.61,37.489999999999995,29.5,37.489999999999995,31.35C37.489999999999995,35.18,37.489999999999995,71.53,37.449999999999996,86.75C37.44,90,37.42999999999999,92.34,37.419999999999995,93.25"/>
<path id="私-s4"  class="stroke" stroke="#09bf71" d="M35.93,43.47C35.93,44.5,35.22,46.44,34.57,47.67C29.27,57.83,21.15,69.5,10.5,77.5"/>
<path id="私-s5"  class="stroke" stroke="#0971bf" d="M41,49.75C45.4,52.26,49.13,57.269999999999996,51.5,60.5"/>
<path id="私-s6"  class="stroke" stroke="#3d09bf" d="M73.3,31.9C73.61999999999999,33.12,73.64,34.21,73.24,35.41C68.25,50.5,59.75,65.25,52.08,78.31C49.96,81.92,50.48,83.34,53.96,82.2C66,78.25,76.62,74.12,88.28,69.98"/>
<path id="私-s7"  class="stroke" stroke="#bf09a5" d="M82.81,60.54C87.26,64.91,94.3,78.50999999999999,95.42,85.31"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="私-bg1"  class="badge-group"><circle cx="45.24" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" x="45.24" y="13.5" dx="0" dy="-0.5">1</text></g>
<g id="私-bg2"  class="badge-group"><circle cx="11.62" cy="44.6" r="3.5" fill="#bfa509"/><text class="num-single" x="11.62" y="44.6" dx="0" dy="-0.5">2</text></g>
<g id="私-bg3"  class="badge-group"><circle cx="36.08" cy="26.66" r="3.5" fill="#3dbf09"/><text class="num-single" x="36.08" y="26.66" dx="0" dy="-0.5">3</text></g>
<g id="私-bg4"  class="badge-group"><circle cx="35.93" cy="43.47" r="3.5" fill="#09bf71"/><text class="num-single" x="35.93" y="43.47" dx="0" dy="-0.5">4</text></g>
<g id="私-bg5"  class="badge-group"><circle cx="41" cy="49.75" r="3.5" fill="#0971bf"/><text class="num-single" x="41" y="49.75" dx="0" dy="-0.5">5</text></g>
<g id="私-bg6"  class="badge-group"><circle cx="73.3" cy="31.9" r="3.5" fill="#3d09bf"/><text class="num-single" x="73.3" y="31.9" dx="0" dy="-0.5">6</text></g>
<g id="私-bg7"  class="badge-group"><circle cx="82.81" cy="60.54" r="3.5" fill="#bf09a5"/><text class="num-single" x="82.81" y="60.54" dx="0" dy="-0.5">7</text></g>
</svg>