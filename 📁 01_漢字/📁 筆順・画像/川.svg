<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (川)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #川-bg[i]: Thời gian quả bóng số nảy lên
   - #川-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#川-bg1  { animation-delay: 0.05s; }
#川-s1   { stroke-dasharray: 60.6712; stroke-dashoffset: 60.6712; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#川-bg2  { animation-delay: 0.53s; }
#川-s2   { stroke-dasharray: 52.5939; stroke-dashoffset: 52.5939; animation: drawStroke 0.29s ease-out 0.66s forwards; }
#川-bg3  { animation-delay: 0.97s; }
#川-s3   { stroke-dasharray: 79.4701; stroke-dashoffset: 79.4701; animation: drawStroke 0.44s ease-out 1.10s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #川-s[i]) -->
<path id="川-s1"  class="stroke" stroke="#bf0909" d="M27.22,25.68C28.13,27.25,28.4,29.13,28.41,31.05C28.5,43.5,28.5,69,17.39,84.15"/>
<path id="川-s2"  class="stroke" stroke="#09bf09" d="M53.75,23.63C54.69,24.57,55.16,26,55.16,27.529999999999998C55.16,28.109999999999996,55.15,56.01,55.08,69.24C55.059999999999995,72.55,55.04,74.97999999999999,55.019999999999996,75.86999999999999"/>
<path id="川-s3"  class="stroke" stroke="#0909bf" d="M85.56,15.63C86.65,16.720000000000002,87.32000000000001,18.25,87.32000000000001,19.880000000000003C87.32000000000001,20.62,87.55000000000001,66.74000000000001,87.41000000000001,86C87.38000000000001,90.31,87.35000000000001,93.61,87.32000000000001,94.63"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="川-bg1"  class="badge-group"><circle cx="27.22" cy="25.68" r="3.5" fill="#bf0909"/><text class="num-single" x="27.22" y="25.68" dx="0" dy="-0.5">1</text></g>
<g id="川-bg2"  class="badge-group"><circle cx="53.75" cy="23.63" r="3.5" fill="#09bf09"/><text class="num-single" x="53.75" y="23.63" dx="0" dy="-0.5">2</text></g>
<g id="川-bg3"  class="badge-group"><circle cx="85.56" cy="15.63" r="3.5" fill="#0909bf"/><text class="num-single" x="85.56" y="15.63" dx="0" dy="-0.5">3</text></g>
</svg>