<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (幅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #幅-bg[i]: Thời gian quả bóng số nảy lên
   - #幅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#幅-bg1  { animation-delay: 0.05s; }
#幅-s1   { stroke-dasharray: 37.0052; stroke-dashoffset: 37.0052; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#幅-bg2  { animation-delay: 0.42s; }
#幅-s2   { stroke-dasharray: 68.0430; stroke-dashoffset: 68.0430; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#幅-bg3  { animation-delay: 0.94s; }
#幅-s3   { stroke-dasharray: 83.3075; stroke-dashoffset: 83.3075; animation: drawStroke 0.46s ease-out 1.07s forwards; }
#幅-bg4  { animation-delay: 1.55s; }
#幅-s4   { stroke-dasharray: 40.6182; stroke-dashoffset: 40.6182; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#幅-bg5  { animation-delay: 1.92s; }
#幅-s5   { stroke-dasharray: 17.8583; stroke-dashoffset: 17.8583; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#幅-bg6  { animation-delay: 2.29s; }
#幅-s6   { stroke-dasharray: 44.0991; stroke-dashoffset: 44.0991; animation: drawStroke 0.24s ease-out 2.42s forwards; }
#幅-bg7  { animation-delay: 2.68s; }
#幅-s7   { stroke-dasharray: 26.2470; stroke-dashoffset: 26.2470; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#幅-bg8  { animation-delay: 3.05s; }
#幅-s8   { stroke-dasharray: 33.6390; stroke-dashoffset: 33.6390; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#幅-bg9  { animation-delay: 3.42s; }
#幅-s9   { stroke-dasharray: 72.2309; stroke-dashoffset: 72.2309; animation: drawStroke 0.40s ease-out 3.55s forwards; }
#幅-bg10  { animation-delay: 3.97s; }
#幅-s10   { stroke-dasharray: 25.7392; stroke-dashoffset: 25.7392; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#幅-bg11  { animation-delay: 4.34s; }
#幅-s11   { stroke-dasharray: 35.4541; stroke-dashoffset: 35.4541; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#幅-bg12  { animation-delay: 4.71s; }
#幅-s12   { stroke-dasharray: 31.4964; stroke-dashoffset: 31.4964; animation: drawStroke 0.22s ease-out 4.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

