<path id="幅-s8"  class="stroke" stroke="#0964bf" d="M52.36,60.54C53.16,61.339999999999996,53.37,62.13,53.54,63.62C54.16,69.14999999999999,55.26,78.94,55.96,88.25999999999999C56.1,90.16,56.230000000000004,91.99999999999999,56.35,93.74999999999999"/>
<path id="幅-s9"  class="stroke" stroke="#0909bf" d="M54.41,62.45C67.14999999999999,60.5,82.69999999999999,58.57,89.97,57.980000000000004C92.64,57.760000000000005,94,60.010000000000005,93.85,61.63C93.41,66.52,91.94999999999999,75.84,90.57,85.48C90.27999999999999,87.53,89.99,89.38000000000001,89.5,91.63000000000001"/>
<path id="幅-s10"  class="stroke" stroke="#6409bf" d="M72.04,62.78C72.94000000000001,63.68,73.14,64.89,73.14,66.5C73.13,73.92,73.13,85.85,73.13,88.25"/>
