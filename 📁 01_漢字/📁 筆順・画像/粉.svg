<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (粉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #粉-bg[i]: Thời gian quả bóng số nảy lên
   - #粉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#粉-bg1  { animation-delay: 0.05s; }
#粉-s1   { stroke-dasharray: 13.5790; stroke-dashoffset: 13.5790; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#粉-bg2  { animation-delay: 0.42s; }
#粉-s2   { stroke-dasharray: 16.7213; stroke-dashoffset: 16.7213; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#粉-bg3  { animation-delay: 0.79s; }
#粉-s3   { stroke-dasharray: 30.4147; stroke-dashoffset: 30.4147; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#粉-bg4  { animation-delay: 1.16s; }
#粉-s4   { stroke-dasharray: 77.6537; stroke-dashoffset: 77.6537; animation: drawStroke 0.43s ease-out 1.29s forwards; }
#粉-bg5  { animation-delay: 1.74s; }
#粉-s5   { stroke-dasharray: 38.6514; stroke-dashoffset: 38.6514; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#粉-bg6  { animation-delay: 2.11s; }
#粉-s6   { stroke-dasharray: 13.6574; stroke-dashoffset: 13.6574; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#粉-bg7  { animation-delay: 2.48s; }
#粉-s7   { stroke-dasharray: 33.4819; stroke-dashoffset: 33.4819; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#粉-bg8  { animation-delay: 2.85s; }
#粉-s8   { stroke-dasharray: 37.3315; stroke-dashoffset: 37.3315; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#粉-bg9  { animation-delay: 3.22s; }
#粉-s9   { stroke-dasharray: 78.6822; stroke-dashoffset: 78.6822; animation: drawStroke 0.43s ease-out 3.35s forwards; }
#粉-bg10  { animation-delay: 3.80s; }
#粉-s10   { stroke-dasharray: 39.4637; stroke-dashoffset: 39.4637; animation: drawStroke 0.22s ease-out 3.93s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #粉-s[i]) -->
<path id="粉-s1"  class="stroke" stroke="#bf0909" d="M15.25,27.12C18.06,29.150000000000002,22.3,34.89,23,38.05"/>
<path id="粉-s2"  class="stroke" stroke="#bf7609" d="M47.51,21.22C47.58,22.02,47.519999999999996,22.799999999999997,47.199999999999996,23.529999999999998C45.51,27.38,43.129999999999995,30.999999999999996,39.08,35.29"/>
<path id="粉-s3"  class="stroke" stroke="#9abf09" d="M14.85,46.27C16.87,46.63,18.62,46.440000000000005,20.259999999999998,46.190000000000005C25.86,45.36000000000001,34.75,43.75000000000001,40.89,42.46000000000001C42.17,42.190000000000005,43.56,41.940000000000005,44.86,42.27000000000001"/>
<path id="粉-s4"  class="stroke" stroke="#2dbf09" d="M30.77,15.96C31.78,16.970000000000002,32.11,18.62,32.11,19.900000000000002C32.11,22.360000000000003,31.98,70.34,31.939999999999998,87.75C31.929999999999996,90.5,31.929999999999996,92.45,31.929999999999996,93.29"/>
<path id="粉-s5"  class="stroke" stroke="#09bf52" d="M31.27,46.46C31.27,48,30.88,49.07,30.349999999999998,50.42C26.41,60.53,19.88,70.88,12,79.48"/>
<path id="粉-s6"  class="stroke" stroke="#09bfbf" d="M35,51.38C39,54.13,42.65,57.870000000000005,44.28,61.22"/>
<path id="粉-s7"  class="stroke" stroke="#0952bf" d="M62.77,21.52C63,22.75,62.77,23.6,62.38,24.64C59.25,33,54.38,42.120000000000005,46.6,50.25"/>
<path id="粉-s8"  class="stroke" stroke="#2d09bf" d="M68.84,18.5C73.2,18.5,81.97,34.03,88.17,40.21C89.93,41.97,92.03,44.09,94.15,45.38"/>
<path id="粉-s9"  class="stroke" stroke="#9a09bf" d="M53.98,54.12C56,54.629999999999995,57.62,54.669999999999995,59.37,54.41C65.42,53.55,75.53999999999999,51.529999999999994,80.49,50.73C84.97999999999999,50,86.3,51.54,85.74,55.879999999999995C84.72,63.739999999999995,80.74,81.64999999999999,77.33999999999999,87.78C74.83999999999999,92.28,71.63,88.99,69.75999999999999,87.54"/>
<path id="粉-s10"  class="stroke" stroke="#bf0976" d="M66.79,56.5C66.84,57.26,66.76,58.51,66.43,59.54C63.120000000000005,70.12,56.870000000000005,82.87,48.44000000000001,90.75"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="粉-bg1"  class="badge-group"><circle cx="15.25" cy="27.12" r="3.5" fill="#bf0909"/><text class="num-single" x="15.25" y="27.12" dx="0" dy="-0.5">1</text></g>
<g id="粉-bg2"  class="badge-group"><circle cx="47.51" cy="21.22" r="3.5" fill="#bf7609"/><text class="num-single" x="47.51" y="21.22" dx="0" dy="-0.5">2</text></g>
<g id="粉-bg3"  class="badge-group"><circle cx="14.85" cy="46.27" r="3.5" fill="#9abf09"/><text class="num-single" x="14.85" y="46.27" dx="0" dy="-0.5">3</text></g>
<g id="粉-bg4"  class="badge-group"><circle cx="30.77" cy="15.96" r="3.5" fill="#2dbf09"/><text class="num-single" x="30.77" y="15.96" dx="0" dy="-0.5">4</text></g>
<g id="粉-bg5"  class="badge-group"><circle cx="31.27" cy="42.96" r="3.5" fill="#09bf52"/><text class="num-single" x="31.27" y="42.96" dx="0" dy="-0.5">5</text></g>
<g id="粉-bg6"  class="badge-group"><circle cx="35" cy="54.88" r="3.5" fill="#09bfbf"/><text class="num-single" x="35" y="54.88" dx="0" dy="-0.5">6</text></g>
<g id="粉-bg7"  class="badge-group"><circle cx="62.77" cy="18.02" r="3.5" fill="#0952bf"/><text class="num-single" x="62.77" y="18.02" dx="0" dy="-0.5">7</text></g>
<g id="粉-bg8"  class="badge-group"><circle cx="68.84" cy="22.0" r="3.5" fill="#2d09bf"/><text class="num-single" x="68.84" y="22.0" dx="0" dy="-0.5">8</text></g>
<g id="粉-bg9"  class="badge-group"><circle cx="53.98" cy="54.12" r="3.5" fill="#9a09bf"/><text class="num-single" x="53.98" y="54.12" dx="0" dy="-0.5">9</text></g>
<g id="粉-bg10" class="badge-group"><circle cx="66.79" cy="56.5" r="3.5" fill="#bf0976"/><text class="num-double" x="66.79" y="56.5" dx="-0.4" dy="-0.475">10</text></g>
</svg>