<path id="測-s6"  class="stroke" stroke="#09bf64" d="M39.43,36.91C43.76,36.38999999999999,54.78,35.019999999999996,60.3,34.589999999999996"/>
<path id="測-s7"  class="stroke" stroke="#09bfbf" d="M39.35,50.2C45.730000000000004,49.510000000000005,53.33,48.470000000000006,59.8,48.120000000000005"/>
<path id="測-s8"  class="stroke" stroke="#0964bf" d="M39.39,65.22C44.42,64.47,53.43,63.43,59.84,63.129999999999995"/>
<path id="測-s9"  class="stroke" stroke="#0909bf" d="M42.6,72.91C42.92,74.25,42.67,75.66,42.08,76.67C39.41,81.21000000000001,34.699999999999996,86.89,30.88,90.38"/>
<path id="測-s10"  class="stroke" stroke="#6409bf" d="M55.62,73.75C59.599999999999994,77.79,64.3,85.11,65.39,88.65"/>
<path id="測-s11"  class="stroke" stroke="#bf09bf" d="M74.71,28.61C75.74,29.64,76.42999999999999,31.25,76.42999999999999,33.519999999999996C76.42999999999999,44.42999999999999,76.46,58.75,76.46,61.25C76.46,63.22,76.41,64.83,76.41,65.96"/>
<path id="測-s12"  class="stroke" stroke="#bf0964" d="M90.9,15.32C92.04,16.46,92.74000000000001,18.37,92.74000000000001,20.310000000000002C92.74000000000001,34.77,92.51,84.31,92.51,89.23C92.51,97.09,88.28,92.81,84.64,89.48"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="測-bg1"  class="badge-group"><circle cx="16.12" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="16.12" y="17" dx="0" dy="-0.5">1</text></g>
