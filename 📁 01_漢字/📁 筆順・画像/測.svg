<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (測)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #測-bg[i]: Thời gian quả bóng số nảy lên
   - #測-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#測-bg1  { animation-delay: 0.05s; }
#測-s1   { stroke-dasharray: 13.6647; stroke-dashoffset: 13.6647; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#測-bg2  { animation-delay: 0.42s; }
#測-s2   { stroke-dasharray: 13.5888; stroke-dashoffset: 13.5888; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#測-bg3  { animation-delay: 0.79s; }
#測-s3   { stroke-dasharray: 22.4573; stroke-dashoffset: 22.4573; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#測-bg4  { animation-delay: 1.16s; }
#測-s4   { stroke-dasharray: 46.7659; stroke-dashoffset: 46.7659; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#測-bg5  { animation-delay: 1.57s; }
#測-s5   { stroke-dasharray: 68.2747; stroke-dashoffset: 68.2747; animation: drawStroke 0.38s ease-out 1.70s forwards; }
#測-bg6  { animation-delay: 2.10s; }
#測-s6   { stroke-dasharray: 20.9997; stroke-dashoffset: 20.9997; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#測-bg7  { animation-delay: 2.47s; }
#測-s7   { stroke-dasharray: 20.5585; stroke-dashoffset: 20.5585; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#測-bg8  { animation-delay: 2.84s; }
#測-s8   { stroke-dasharray: 20.5634; stroke-dashoffset: 20.5634; animation: drawStroke 0.22s ease-out 2.97s forwards; }
#測-bg9  { animation-delay: 3.21s; }
#測-s9   { stroke-dasharray: 21.6421; stroke-dashoffset: 21.6421; animation: drawStroke 0.22s ease-out 3.34s forwards; }
#測-bg10  { animation-delay: 3.58s; }
#測-s10   { stroke-dasharray: 17.9262; stroke-dashoffset: 17.9262; animation: drawStroke 0.22s ease-out 3.71s forwards; }
#測-bg11  { animation-delay: 3.95s; }
#測-s11   { stroke-dasharray: 37.7804; stroke-dashoffset: 37.7804; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#測-bg12  { animation-delay: 4.32s; }
#測-s12   { stroke-dasharray: 87.1137; stroke-dashoffset: 87.1137; animation: drawStroke 0.48s ease-out 4.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #測-s[i]) -->
<path id="測-s1"  class="stroke" stroke="#bf0909" d="M16.12,17C19.78,18.52,25.580000000000002,23.23,26.5,25.59"/>
<path id="測-s2"  class="stroke" stroke="#bf6409" d="M13.38,42.5C17.310000000000002,43.82,23.520000000000003,47.94,24.5,50"/>
