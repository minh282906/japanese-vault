<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (羽)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #羽-bg[i]: Thời gian quả bóng số nảy lên
   - #羽-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#羽-bg1  { animation-delay: 0.05s; }
#羽-s1   { stroke-dasharray: 103.3600; stroke-dashoffset: 103.3600; animation: drawStroke 0.55s ease-out 0.18s forwards; }
#羽-bg2  { animation-delay: 0.75s; }
#羽-s2   { stroke-dasharray: 11.4223; stroke-dashoffset: 11.4223; animation: drawStroke 0.22s ease-out 0.88s forwards; }
#羽-bg3  { animation-delay: 1.12s; }
#羽-s3   { stroke-dasharray: 21.6976; stroke-dashoffset: 21.6976; animation: drawStroke 0.22s ease-out 1.25s forwards; }
#羽-bg4  { animation-delay: 1.49s; }
#羽-s4   { stroke-dasharray: 109.6620; stroke-dashoffset: 109.6620; animation: drawStroke 0.55s ease-out 1.62s forwards; }
#羽-bg5  { animation-delay: 2.19s; }
#羽-s5   { stroke-dasharray: 11.4086; stroke-dashoffset: 11.4086; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#羽-bg6  { animation-delay: 2.56s; }
#羽-s6   { stroke-dasharray: 23.6207; stroke-dashoffset: 23.6207; animation: drawStroke 0.22s ease-out 2.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #羽-s[i]) -->
<path id="羽-s1"  class="stroke" stroke="#bf0909" d="M18.5,25.25C20.25,26,22.25,26,24.82,25.59C30.04,24.75,39.69,22.62,41.28,22.49C44.86,22.2,45.760000000000005,22.88,45.760000000000005,26.04C45.760000000000005,29.64,45.59,74.27,45.59,86.19C45.59,95.27,37.870000000000005,87.25,36.980000000000004,86.50999999999999"/>
<path id="羽-s2"  class="stroke" stroke="#bfbf09" d="M21.77,41.08C24.79,42.379999999999995,28.25,45.37,30.31,48.46"/>
<path id="羽-s3"  class="stroke" stroke="#09bf09" d="M17,72C19.12,72.62,20.25,72.25,21.75,70.75C22.63,69.87,29.25,63,33,58.75"/>
<path id="羽-s4"  class="stroke" stroke="#09bfbf" d="M56.75,22.25C58.5,22.88,60,23,62.57,22.59C67.79,21.75,81.46000000000001,19.04,83.03,18.74C85.5,18.259999999999998,87.51,20.009999999999998,87.51,22.29C87.51,26.14,87.34,74.02,87.34,85.94C87.34,94.52,79.62,87,78.73,86.25999999999999"/>
<path id="羽-s5"  class="stroke" stroke="#0909bf" d="M61.77,39.58C64.79,40.879999999999995,68.75,44.5,70.31,46.96"/>
<path id="羽-s6"  class="stroke" stroke="#bf09bf" d="M56.75,71C58.63,71.5,60,71.25,61.5,69.75C63.01,68.24,70.2,60.2,73.75,56"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="羽-bg1"  class="badge-group"><circle cx="18.5" cy="25.25" r="3.5" fill="#bf0909"/><text class="num-single" x="18.5" y="25.25" dx="0" dy="-0.5">1</text></g>
<g id="羽-bg2"  class="badge-group"><circle cx="21.77" cy="41.08" r="3.5" fill="#bfbf09"/><text class="num-single" x="21.77" y="41.08" dx="0" dy="-0.5">2</text></g>
<g id="羽-bg3"  class="badge-group"><circle cx="17" cy="72" r="3.5" fill="#09bf09"/><text class="num-single" x="17" y="72" dx="0" dy="-0.5">3</text></g>
<g id="羽-bg4"  class="badge-group"><circle cx="56.75" cy="22.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="56.75" y="22.25" dx="0" dy="-0.5">4</text></g>
<g id="羽-bg5"  class="badge-group"><circle cx="61.77" cy="39.58" r="3.5" fill="#0909bf"/><text class="num-single" x="61.77" y="39.58" dx="0" dy="-0.5">5</text></g>
<g id="羽-bg6"  class="badge-group"><circle cx="56.75" cy="71" r="3.5" fill="#bf09bf"/><text class="num-single" x="56.75" y="71" dx="0" dy="-0.5">6</text></g>
</svg>