<g id="清-bg9"  class="badge-group"><circle cx="54.18" cy="58.42" r="3.5" fill="#4b09bf"/><text class="num-single" x="54.18" y="58.42" dx="0" dy="-0.5">9</text></g>
<g id="清-bg10" class="badge-group"><circle cx="54.18" cy="66.35" r="3.5" fill="#ae09bf"/><text class="num-double" x="54.18" y="66.35" dx="-0.4" dy="-0.475">10</text></g>
<g id="清-bg11" class="badge-group"><circle cx="54.48" cy="79.28" r="3.5" fill="#bf096c"/><text class="num-double" x="54.48" y="79.28" dx="-0.4" dy="-0.475">11</text></g>
</svg>