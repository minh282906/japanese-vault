<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (清)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #清-bg[i]: Thời gian quả bóng số nảy lên
   - #清-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#清-bg1  { animation-delay: 0.05s; }
#清-s1   { stroke-dasharray: 13.9885; stroke-dashoffset: 13.9885; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#清-bg2  { animation-delay: 0.42s; }
#清-s2   { stroke-dasharray: 12.7128; stroke-dashoffset: 12.7128; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#清-bg3  { animation-delay: 0.79s; }
#清-s3   { stroke-dasharray: 22.7045; stroke-dashoffset: 22.7045; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#清-bg4  { animation-delay: 1.16s; }
#清-s4   { stroke-dasharray: 34.3523; stroke-dashoffset: 34.3523; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#清-bg5  { animation-delay: 1.53s; }
#清-s5   { stroke-dasharray: 33.8082; stroke-dashoffset: 33.8082; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#清-bg6  { animation-delay: 1.90s; }
#清-s6   { stroke-dasharray: 39.0397; stroke-dashoffset: 39.0397; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#清-bg7  { animation-delay: 2.27s; }
#清-s7   { stroke-dasharray: 59.9987; stroke-dashoffset: 59.9987; animation: drawStroke 0.33s ease-out 2.40s forwards; }
#清-bg8  { animation-delay: 2.75s; }
#清-s8   { stroke-dasharray: 46.5045; stroke-dashoffset: 46.5045; animation: drawStroke 0.26s ease-out 2.88s forwards; }
#清-bg9  { animation-delay: 3.16s; }
#清-s9   { stroke-dasharray: 81.4031; stroke-dashoffset: 81.4031; animation: drawStroke 0.45s ease-out 3.29s forwards; }
#清-bg10  { animation-delay: 3.76s; }
#清-s10   { stroke-dasharray: 25.9549; stroke-dashoffset: 25.9549; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#清-bg11  { animation-delay: 4.13s; }
#清-s11   { stroke-dasharray: 25.5210; stroke-dashoffset: 25.5210; animation: drawStroke 0.22s ease-out 4.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #清-s[i]) -->
<path id="清-s1"  class="stroke" stroke="#bf0909" d="M21.38,14.75C25.04,16.35,30.83,21.35,31.75,23.84"/>
<path id="清-s2"  class="stroke" stroke="#bf6c09" d="M14.25,39.5C18.04,40.65,24.05,44.22,25,46"/>
<path id="清-s3"  class="stroke" stroke="#aebf09" d="M13.1,89.3C14.27,89.64,15.399999999999999,89.3,16.1,88.14999999999999C19.07,83.24999999999999,22.05,77.24999999999999,24.75,71"/>
<path id="清-s4"  class="stroke" stroke="#4bbf09" d="M48.05,22.25C49.87,22.63,51.9,22.65,53.64,22.38C60.75,21.259999999999998,71,19.88,77.12,19.369999999999997C78.81,19.229999999999997,80.47,19.179999999999996,82.17,19.319999999999997"/>
<path id="清-s5"  class="stroke" stroke="#09bf2a" d="M64.67,10.13C65.52,10.98,65.88,12.120000000000001,65.88,13.23C65.88,16.88,66.25,36,66.25,43.620000000000005"/>
<path id="清-s6"  class="stroke" stroke="#09bf8d" d="M45.84,33.49C48.13,33.88,49.99,33.74,51.900000000000006,33.510000000000005C59.38000000000001,32.620000000000005,71.44,31.000000000000007,78.15,30.280000000000005C80.23,30.060000000000006,82.55000000000001,30.070000000000004,84.65,30.200000000000006"/>
<path id="清-s7"  class="stroke" stroke="#098dbf" d="M37.13,46.49C39.95,47,42.82,47.02,45.61,46.59C59.25,44.49,76.16,42.32000000000001,87.13,41.52C90.61999999999999,41.260000000000005,93.86999999999999,41.260000000000005,96.75,41.7"/>
<path id="清-s8"  class="stroke" stroke="#092abf" d="M52.01,53.3C52.79,54.08,53.1,54.87,53.1,55.9C53.1,56.46,53.26,78.44,53.300000000000004,93.37C53.31,95.60000000000001,53.31,97.68,53.31,99.5"/>
<path id="清-s9"  class="stroke" stroke="#4b09bf" d="M54.18,54.92C56.35,54.77,76.05,51.730000000000004,77.65,51.480000000000004C80,51.120000000000005,81.27000000000001,52.370000000000005,81.27000000000001,54.67C81.27000000000001,60,81.23,81.25,81.23,94.48C81.23,102.62,75.75,97.25,73.57000000000001,95.12"/>
<path id="清-s10"  class="stroke" stroke="#ae09bf" d="M54.18,66.35C60.12,65.88,73.25,64.25,80.00999999999999,63.81999999999999"/>
<path id="清-s11"  class="stroke" stroke="#bf096c" d="M54.48,79.28C61.5,78.38,74.9,77.12,79.9,77.12"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="清-bg1"  class="badge-group"><circle cx="21.38" cy="14.75" r="3.5" fill="#bf0909"/><text class="num-single" x="21.38" y="14.75" dx="0" dy="-0.5">1</text></g>
<g id="清-bg2"  class="badge-group"><circle cx="14.25" cy="39.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="14.25" y="39.5" dx="0" dy="-0.5">2</text></g>
