<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (減)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #減-bg[i]: Thời gian quả bóng số nảy lên
   - #減-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#減-bg1  { animation-delay: 0.05s; }
#減-s1   { stroke-dasharray: 15.1981; stroke-dashoffset: 15.1981; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#減-bg2  { animation-delay: 0.42s; }
#減-s2   { stroke-dasharray: 13.5356; stroke-dashoffset: 13.5356; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#減-bg3  { animation-delay: 0.79s; }
#減-s3   { stroke-dasharray: 24.2695; stroke-dashoffset: 24.2695; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#減-bg4  { animation-delay: 1.16s; }
#減-s4   { stroke-dasharray: 58.5375; stroke-dashoffset: 58.5375; animation: drawStroke 0.32s ease-out 1.29s forwards; }
#減-bg5  { animation-delay: 1.63s; }
#減-s5   { stroke-dasharray: 49.7524; stroke-dashoffset: 49.7524; animation: drawStroke 0.27s ease-out 1.76s forwards; }
#減-bg6  { animation-delay: 2.05s; }
#減-s6   { stroke-dasharray: 17.4130; stroke-dashoffset: 17.4130; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#減-bg7  { animation-delay: 2.42s; }
#減-s7   { stroke-dasharray: 18.8592; stroke-dashoffset: 18.8592; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#減-bg8  { animation-delay: 2.79s; }
#減-s8   { stroke-dasharray: 30.3093; stroke-dashoffset: 30.3093; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#減-bg9  { animation-delay: 3.16s; }
#減-s9   { stroke-dasharray: 15.2557; stroke-dashoffset: 15.2557; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#減-bg10  { animation-delay: 3.53s; }
#減-s10   { stroke-dasharray: 95.7884; stroke-dashoffset: 95.7884; animation: drawStroke 0.53s ease-out 3.66s forwards; }
#減-bg11  { animation-delay: 4.21s; }
#減-s11   { stroke-dasharray: 52.5054; stroke-dashoffset: 52.5054; animation: drawStroke 0.29s ease-out 4.34s forwards; }
#減-bg12  { animation-delay: 4.65s; }
#減-s12   { stroke-dasharray: 11.8688; stroke-dashoffset: 11.8688; animation: drawStroke 0.22s ease-out 4.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #減-s[i]) -->
