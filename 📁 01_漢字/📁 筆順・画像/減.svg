<path id="減-s5"  class="stroke" stroke="#09bf09" d="M37.9,32.94C40.81,33.43,43.21,33.089999999999996,45.72,32.769999999999996C54.269999999999996,31.669999999999995,66.78999999999999,29.719999999999995,80.09,28.559999999999995C82.39,28.359999999999996,84.99000000000001,28.069999999999997,87.32000000000001,28.659999999999997"/>
<path id="減-s6"  class="stroke" stroke="#09bf64" d="M47.25,48.73C48.75,49,50.11,48.83,51.03,48.66C54.28,48.06999999999999,57.870000000000005,47.25,60.79,46.629999999999995C62.29,46.309999999999995,63.629999999999995,46.269999999999996,64.4,46.489999999999995"/>
<path id="減-s7"  class="stroke" stroke="#09bfbf" d="M45.75,61.11C46.63,61.99,47.11,62.99,47.15,64.15C47.73,67.10000000000001,48.19,71.27000000000001,48.64,75.5C48.8,76.99,48.95,77.99,49.1,79.45"/>
<path id="減-s8"  class="stroke" stroke="#0964bf" d="M48.1,62.35C54.010000000000005,61.160000000000004,57.900000000000006,60,61.370000000000005,59.4C63.980000000000004,58.949999999999996,65.56,59.9,64.97,62.769999999999996C64.27,66.2,63.87,67.75999999999999,62.72,72.97"/>
<path id="減-s9"  class="stroke" stroke="#0909bf" d="M50.15,76.38C54.51,75.58999999999999,57.3,74.96,61.36,74.3C62.51,74.11,63.75,73.92,65.17,73.72"/>
<path id="減-s10"  class="stroke" stroke="#6409bf" d="M64,12.75C65.43,14.41,66.11,16.009999999999998,66.33,18.7C68.62,46.620000000000005,75.75,75,90.17,89.92C94.8,94.72,94.93,90.99,94.21000000000001,83.63"/>
<path id="減-s11"  class="stroke" stroke="#bf09bf" d="M85.59,41.62C85.88000000000001,42.629999999999995,85.71000000000001,43.959999999999994,85.47,45.54C84.05,54.86,76.25,76.88,64.8,88.87"/>
<path id="減-s12"  class="stroke" stroke="#bf0964" d="M75.53,11.24C78.36,12.82,82.88,16.44,84.2,19.16"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
