<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (表)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #表-bg[i]: Thời gian quả bóng số nảy lên
   - #表-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#表-bg1  { animation-delay: 0.05s; }
#表-s1   { stroke-dasharray: 49.2488; stroke-dashoffset: 49.2488; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#表-bg2  { animation-delay: 0.47s; }
#表-s2   { stroke-dasharray: 37.4143; stroke-dashoffset: 37.4143; animation: drawStroke 0.22s ease-out 0.60s forwards; }
#表-bg3  { animation-delay: 0.84s; }
#表-s3   { stroke-dasharray: 46.7559; stroke-dashoffset: 46.7559; animation: drawStroke 0.26s ease-out 0.97s forwards; }
#表-bg4  { animation-delay: 1.25s; }
#表-s4   { stroke-dasharray: 76.5981; stroke-dashoffset: 76.5981; animation: drawStroke 0.42s ease-out 1.38s forwards; }
#表-bg5  { animation-delay: 1.82s; }
#表-s5   { stroke-dasharray: 43.6380; stroke-dashoffset: 43.6380; animation: drawStroke 0.24s ease-out 1.95s forwards; }
#表-bg6  { animation-delay: 2.21s; }
#表-s6   { stroke-dasharray: 50.7992; stroke-dashoffset: 50.7992; animation: drawStroke 0.28s ease-out 2.34s forwards; }
#表-bg7  { animation-delay: 2.64s; }
#表-s7   { stroke-dasharray: 18.9056; stroke-dashoffset: 18.9056; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#表-bg8  { animation-delay: 3.01s; }
#表-s8   { stroke-dasharray: 52.4846; stroke-dashoffset: 52.4846; animation: drawStroke 0.29s ease-out 3.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #表-s[i]) -->
<path id="表-s1"  class="stroke" stroke="#bf0909" d="M30,23.9C33,24.369999999999997,36.01,24.009999999999998,38.76,23.68C47.18,22.66,61.44,20.99,70.38,20.3C73.25,20.080000000000002,76.16,19.75,79,20.37"/>
<path id="表-s2"  class="stroke" stroke="#bf9109" d="M52.37,9.75C53.46,10.25,54.11,12,54.33,13C54.55,14,54.83,40.25,54.61,46.5"/>
<path id="表-s3"  class="stroke" stroke="#64bf09" d="M32.25,35.64C35.5,36,37.78,35.8,40.25,35.51C47.81,34.6,61.56,32.92,70,31.979999999999997C73,31.65,76,31.379999999999995,78.75,31.769999999999996"/>
<path id="表-s4"  class="stroke" stroke="#09bf36" d="M16.25,49.7C19.87,50.38,23.75,50.09,27.259999999999998,49.720000000000006C40.32,48.36000000000001,66.39,45.45,81.75,44.34C85.39,44.080000000000005,88.91,43.77,92.5,44.540000000000006"/>
<path id="表-s5"  class="stroke" stroke="#09bfbf" d="M44.72,51.64C44.81,52.46,44.56,53.96,43.79,54.93C36.8,63.81,28.35,72.41,13.25,80.5"/>
<path id="表-s6"  class="stroke" stroke="#0936bf" d="M37.5,65.75C38.31,66.56,38.75,67.63,38.75,68.75C38.75,80.87,38.68,88.46000000000001,38.68,90.94C38.68,92.94,40.11,93.83,41.61,92.33S55.21,80.24,57.21,78.74"/>
<path id="表-s7"  class="stroke" stroke="#6409bf" d="M77.25,52.14C77.37,53.12,77.07,54.19,76.75,54.75C74.75,58.25,71.75,61.25,65.25,66"/>
<path id="表-s8"  class="stroke" stroke="#bf0991" d="M50.75,60.75C54.5,61,75.96,78.82,85.14,85.86C87.93,88,90.5,89.62,93.63,90.62"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="表-bg1"  class="badge-group"><circle cx="30" cy="23.9" r="3.5" fill="#bf0909"/><text class="num-single" x="30" y="23.9" dx="0" dy="-0.5">1</text></g>
<g id="表-bg2"  class="badge-group"><circle cx="52.37" cy="9.75" r="3.5" fill="#bf9109"/><text class="num-single" x="52.37" y="9.75" dx="0" dy="-0.5">2</text></g>
<g id="表-bg3"  class="badge-group"><circle cx="32.25" cy="35.64" r="3.5" fill="#64bf09"/><text class="num-single" x="32.25" y="35.64" dx="0" dy="-0.5">3</text></g>
<g id="表-bg4"  class="badge-group"><circle cx="16.25" cy="49.7" r="3.5" fill="#09bf36"/><text class="num-single" x="16.25" y="49.7" dx="0" dy="-0.5">4</text></g>
<g id="表-bg5"  class="badge-group"><circle cx="44.72" cy="51.64" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.72" y="51.64" dx="0" dy="-0.5">5</text></g>
<g id="表-bg6"  class="badge-group"><circle cx="37.5" cy="65.75" r="3.5" fill="#0936bf"/><text class="num-single" x="37.5" y="65.75" dx="0" dy="-0.5">6</text></g>
<g id="表-bg7"  class="badge-group"><circle cx="77.25" cy="52.14" r="3.5" fill="#6409bf"/><text class="num-single" x="77.25" y="52.14" dx="0" dy="-0.5">7</text></g>
<g id="表-bg8"  class="badge-group"><circle cx="50.75" cy="60.75" r="3.5" fill="#bf0991"/><text class="num-single" x="50.75" y="60.75" dx="0" dy="-0.5">8</text></g>
</svg>