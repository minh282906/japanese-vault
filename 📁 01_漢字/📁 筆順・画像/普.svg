<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (普)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #普-bg[i]: Thời gian quả bóng số nảy lên
   - #普-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#普-bg1  { animation-delay: 0.05s; }
#普-s1   { stroke-dasharray: 12.4627; stroke-dashoffset: 12.4627; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#普-bg2  { animation-delay: 0.42s; }
#普-s2   { stroke-dasharray: 13.2218; stroke-dashoffset: 13.2218; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#普-bg3  { animation-delay: 0.79s; }
#普-s3   { stroke-dasharray: 60.0054; stroke-dashoffset: 60.0054; animation: drawStroke 0.33s ease-out 0.92s forwards; }
#普-bg4  { animation-delay: 1.27s; }
#普-s4   { stroke-dasharray: 23.4773; stroke-dashoffset: 23.4773; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#普-bg5  { animation-delay: 1.64s; }
#普-s5   { stroke-dasharray: 24.3516; stroke-dashoffset: 24.3516; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#普-bg6  { animation-delay: 2.01s; }
#普-s6   { stroke-dasharray: 13.6316; stroke-dashoffset: 13.6316; animation: drawStroke 0.22s ease-out 2.14s forwards; }
#普-bg7  { animation-delay: 2.38s; }
#普-s7   { stroke-dasharray: 15.9436; stroke-dashoffset: 15.9436; animation: drawStroke 0.22s ease-out 2.51s forwards; }
#普-bg8  { animation-delay: 2.75s; }
#普-s8   { stroke-dasharray: 81.8440; stroke-dashoffset: 81.8440; animation: drawStroke 0.45s ease-out 2.88s forwards; }
#普-bg9  { animation-delay: 3.35s; }
#普-s9   { stroke-dasharray: 32.5938; stroke-dashoffset: 32.5938; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#普-bg10  { animation-delay: 3.72s; }
#普-s10   { stroke-dasharray: 65.9119; stroke-dashoffset: 65.9119; animation: drawStroke 0.36s ease-out 3.85s forwards; }
#普-bg11  { animation-delay: 4.23s; }
#普-s11   { stroke-dasharray: 34.5719; stroke-dashoffset: 34.5719; animation: drawStroke 0.22s ease-out 4.36s forwards; }
#普-bg12  { animation-delay: 4.60s; }
#普-s12   { stroke-dasharray: 34.4392; stroke-dashoffset: 34.4392; animation: drawStroke 0.22s ease-out 4.73s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #普-s[i]) -->
<path id="普-s1"  class="stroke" stroke="#bf0909" d="M35.88,13.5C38.870000000000005,15.07,43.61,19.95,44.36,22.39"/>
<path id="普-s2"  class="stroke" stroke="#bf6409" d="M68.78,12.26C68.91,12.969999999999999,68.78,13.62,68.39,14.2C67.28,16.63,66.34,18.97,62.41,23.6"/>
