<path id="普-s5"  class="stroke" stroke="#09bf09" d="M62.87,29.25C63.809999999999995,30.19,64.11,31.48,64.08,32.5C63.879999999999995,39.88,63.379999999999995,45,62.86,53.25"/>
<path id="普-s6"  class="stroke" stroke="#09bf64" d="M23.62,39.12C26.35,41.059999999999995,30.67,47.12,31.35,50.14"/>
<path id="普-s7"  class="stroke" stroke="#09bfbf" d="M82.78,34.26C82.86,35.04,82.84,35.83,82.44,36.489999999999995C80.50999999999999,39.62,78.13,42.87,73.91,47.099999999999994"/>
<path id="普-s8"  class="stroke" stroke="#0964bf" d="M13.75,56.95C16.57,57.96,20.33,57.95,23.25,57.650000000000006C38.33,56.06,67.7,53.690000000000005,84.75,52.96000000000001C88.2,52.81000000000001,91.87,53.080000000000005,95.25,53.80000000000001"/>
<path id="普-s9"  class="stroke" stroke="#0909bf" d="M34.77,65.9C35.75,66.88000000000001,35.74,67.87,35.74,69.38000000000001C35.74,72.60000000000001,35.74,85.27000000000001,35.74,93.75000000000001C35.74,95.45000000000002,35.74,96.99000000000001,35.74,98.24000000000001"/>
<path id="普-s10"  class="stroke" stroke="#6409bf" d="M36.54,68.47C39.03,68.28999999999999,62.03,65.58,67.99,64.92999999999999C70.67,64.63999999999999,72.47,65.55,72.47,68.36999999999999C72.46,72.5,72.42,84.22,72.39,91C72.38,93.94,72.37,95.94,72.37,96"/>
<path id="普-s11"  class="stroke" stroke="#bf09bf" d="M37.03,81.25C42.63,80.63,67.26,78.15,71.45,78.04"/>
<path id="普-s12"  class="stroke" stroke="#bf0964" d="M36.86,95.56C44.41,94.85000000000001,60.75,93.5,71.19,92.83"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="普-bg1"  class="badge-group"><circle cx="35.88" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" x="35.88" y="13.5" dx="0" dy="-0.5">1</text></g>
<g id="普-bg2"  class="badge-group"><circle cx="68.78" cy="12.26" r="3.5" fill="#bf6409"/><text class="num-single" x="68.78" y="12.26" dx="0" dy="-0.5">2</text></g>
