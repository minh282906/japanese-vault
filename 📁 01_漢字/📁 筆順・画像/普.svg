<g id="普-bg9"  class="badge-group"><circle cx="34.77" cy="62.4" r="3.5" fill="#0909bf"/><text class="num-single" x="34.77" y="62.4" dx="0" dy="-0.5">9</text></g>
<g id="普-bg10" class="badge-group"><circle cx="36.54" cy="71.97" r="3.5" fill="#6409bf"/><text class="num-double" x="36.54" y="71.97" dx="-0.4" dy="-0.475">10</text></g>
