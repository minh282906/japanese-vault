<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (本)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #本-bg[i]: Thời gian quả bóng số nảy lên
   - #本-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#本-bg1  { animation-delay: 0.05s; }
#本-s1   { stroke-dasharray: 68.6617; stroke-dashoffset: 68.6617; animation: drawStroke 0.38s ease-out 0.18s forwards; }
#本-bg2  { animation-delay: 0.58s; }
#本-s2   { stroke-dasharray: 88.9033; stroke-dashoffset: 88.9033; animation: drawStroke 0.49s ease-out 0.71s forwards; }
#本-bg3  { animation-delay: 1.22s; }
#本-s3   { stroke-dasharray: 58.0061; stroke-dashoffset: 58.0061; animation: drawStroke 0.32s ease-out 1.35s forwards; }
#本-bg4  { animation-delay: 1.69s; }
#本-s4   { stroke-dasharray: 55.4709; stroke-dashoffset: 55.4709; animation: drawStroke 0.31s ease-out 1.82s forwards; }
#本-bg5  { animation-delay: 2.15s; }
#本-s5   { stroke-dasharray: 39.5055; stroke-dashoffset: 39.5055; animation: drawStroke 0.22s ease-out 2.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #本-s[i]) -->
<path id="本-s1"  class="stroke" stroke="#bf0909" d="M20.5,33.5C22.43,34.12,25.41,34.57,28.6,34.25C42.43,32.88,66,30.75,79.64,30C82.84,29.82,86.86,30.25,88.87,30.5"/>
<path id="本-s2"  class="stroke" stroke="#9abf09" d="M52.1,11.12C53.35,12.37,54.15,14.35,54.15,16.11C54.15,16.95,54.15,73.27,54.129999999999995,92.87C54.12,96.83,54.12,99.29,54.10999999999999,99.49000000000001"/>
<path id="本-s3"  class="stroke" stroke="#09bf52" d="M51.75,33.5C51.75,34.5,51.34,35.72,50.46,37.38C43.62,50.25,30.12,65.5,13.25,75.5"/>
<path id="本-s4"  class="stroke" stroke="#0952bf" d="M54.75,35.5C59.67,41.24,78.23,58.83,87.6,66.77C90.17999999999999,68.95,92.75999999999999,71.17999999999999,96.11999999999999,72"/>
<path id="本-s5"  class="stroke" stroke="#9a09bf" d="M33.88,73.92C35.38,74.38,36.620000000000005,74.67,39.18,74.51C49.129999999999995,73.88000000000001,60.379999999999995,72.38000000000001,67.14,71.56C69.07000000000001,71.33,70.76,71.25,73.14,71.54"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="本-bg1"  class="badge-group"><circle cx="20.5" cy="33.5" r="3.5" fill="#bf0909"/><text class="num-single" x="20.5" y="33.5" dx="0" dy="-0.5">1</text></g>
<g id="本-bg2"  class="badge-group"><circle cx="52.1" cy="11.12" r="3.5" fill="#9abf09"/><text class="num-single" x="52.1" y="11.12" dx="0" dy="-0.5">2</text></g>
<g id="本-bg3"  class="badge-group"><circle cx="51.75" cy="30.0" r="3.5" fill="#09bf52"/><text class="num-single" x="51.75" y="30.0" dx="0" dy="-0.5">3</text></g>
<g id="本-bg4"  class="badge-group"><circle cx="54.75" cy="39.0" r="3.5" fill="#0952bf"/><text class="num-single" x="54.75" y="39.0" dx="0" dy="-0.5">4</text></g>
<g id="本-bg5"  class="badge-group"><circle cx="33.88" cy="73.92" r="3.5" fill="#9a09bf"/><text class="num-single" x="33.88" y="73.92" dx="0" dy="-0.5">5</text></g>
</svg>