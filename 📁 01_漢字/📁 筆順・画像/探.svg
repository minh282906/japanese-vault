<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (探)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #探-bg[i]: Thời gian quả bóng số nảy lên
   - #探-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#探-bg1  { animation-delay: 0.05s; }
#探-s1   { stroke-dasharray: 27.3556; stroke-dashoffset: 27.3556; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#探-bg2  { animation-delay: 0.42s; }
#探-s2   { stroke-dasharray: 87.3328; stroke-dashoffset: 87.3328; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#探-bg3  { animation-delay: 1.05s; }
#探-s3   { stroke-dasharray: 30.6499; stroke-dashoffset: 30.6499; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#探-bg4  { animation-delay: 1.42s; }
#探-s4   { stroke-dasharray: 14.0823; stroke-dashoffset: 14.0823; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#探-bg5  { animation-delay: 1.79s; }
#探-s5   { stroke-dasharray: 52.6416; stroke-dashoffset: 52.6416; animation: drawStroke 0.29s ease-out 1.92s forwards; }
#探-bg6  { animation-delay: 2.23s; }
#探-s6   { stroke-dasharray: 22.1061; stroke-dashoffset: 22.1061; animation: drawStroke 0.22s ease-out 2.36s forwards; }
#探-bg7  { animation-delay: 2.60s; }
#探-s7   { stroke-dasharray: 31.6813; stroke-dashoffset: 31.6813; animation: drawStroke 0.22s ease-out 2.73s forwards; }
#探-bg8  { animation-delay: 2.97s; }
#探-s8   { stroke-dasharray: 45.0234; stroke-dashoffset: 45.0234; animation: drawStroke 0.25s ease-out 3.10s forwards; }
#探-bg9  { animation-delay: 3.37s; }
#探-s9   { stroke-dasharray: 54.2709; stroke-dashoffset: 54.2709; animation: drawStroke 0.30s ease-out 3.50s forwards; }
#探-bg10  { animation-delay: 3.82s; }
#探-s10   { stroke-dasharray: 38.6236; stroke-dashoffset: 38.6236; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#探-bg11  { animation-delay: 4.19s; }
#探-s11   { stroke-dasharray: 41.7889; stroke-dashoffset: 41.7889; animation: drawStroke 0.23s ease-out 4.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #探-s[i]) -->
<path id="探-s1"  class="stroke" stroke="#bf0909" d="M11.75,38.42C13.83,38.67,14.76,38.660000000000004,17,38.42C22.12,37.88,26.85,37.17,34.760000000000005,36.06C36.60000000000001,35.800000000000004,37.75000000000001,35.88,38.92,36"/>
