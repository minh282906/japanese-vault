<path id="探-s7"  class="stroke" stroke="#098dbf" d="M70.35,23.62C71.05,24.32,71.35,25.37,71.35,26.57C71.35,29,71.30999999999999,31.13,71.30999999999999,34.14C71.30999999999999,36.88,72.49999999999999,38.56,80.94999999999999,38.56C85.99,38.56,89.07,37.92,89.76999999999998,37.550000000000004"/>
<path id="探-s8"  class="stroke" stroke="#092abf" d="M43.55,55.58C46,56,48.19,55.879999999999995,50.37,55.629999999999995C57.51,54.839999999999996,72.85,53.38999999999999,82.62,52.67999999999999C84.48,52.54999999999999,86.99000000000001,52.489999999999995,88.39,52.85999999999999"/>
<path id="探-s9"  class="stroke" stroke="#4b09bf" d="M64.99,42.25C65.80999999999999,43.07,66.07,44.37,66.07,45.54C66.07,51.43,66.08999999999999,77.66,66,90.38C65.98,93.63,66.04,95.36,66,96.25999999999999"/>
<path id="探-s10"  class="stroke" stroke="#ae09bf" d="M64.09,54.97C64.09,56.25,63.1,58.39,62.13,59.97C56.69,68.9,49.75,77.5,39.73,84.1"/>
<path id="探-s11"  class="stroke" stroke="#bf096c" d="M66.78,55.3C70.38,59.629999999999995,81.25,71.19,88.24000000000001,78.5C89.96000000000001,80.3,93.75000000000001,83.5,96.02000000000001,85.05"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="探-bg1"  class="badge-group"><circle cx="11.75" cy="38.42" r="3.5" fill="#bf0909"/><text class="num-single" x="11.75" y="38.42" dx="0" dy="-0.5">1</text></g>
