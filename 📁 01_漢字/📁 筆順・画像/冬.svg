<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (冬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #冬-bg[i]: Thời gian quả bóng số nảy lên
   - #冬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#冬-bg1  { animation-delay: 0.05s; }
#冬-s1   { stroke-dasharray: 36.5916; stroke-dashoffset: 36.5916; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#冬-bg2  { animation-delay: 0.42s; }
#冬-s2   { stroke-dasharray: 96.5111; stroke-dashoffset: 96.5111; animation: drawStroke 0.53s ease-out 0.55s forwards; }
#冬-bg3  { animation-delay: 1.10s; }
#冬-s3   { stroke-dasharray: 64.8920; stroke-dashoffset: 64.8920; animation: drawStroke 0.36s ease-out 1.23s forwards; }
#冬-bg4  { animation-delay: 1.61s; }
#冬-s4   { stroke-dasharray: 17.8480; stroke-dashoffset: 17.8480; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#冬-bg5  { animation-delay: 1.98s; }
#冬-s5   { stroke-dasharray: 29.3679; stroke-dashoffset: 29.3679; animation: drawStroke 0.22s ease-out 2.11s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #冬-s[i]) -->
<path id="冬-s1"  class="stroke" stroke="#bf0909" d="M44.62,15.25C44.76,16.71,44.43,17.78,43.72,19.09C39.67,26.55,32.4,35.39,21.74,42.75"/>
<path id="冬-s2"  class="stroke" stroke="#9abf09" d="M45.86,21.96C46.67,22.25,48.07,22.39,49.75,22.14C55.5,21.26,59.36,20.82,63.11,19.97C67.15,19.049999999999997,67.78999999999999,21.759999999999998,66.08,24.66C58.5,37.5,42.25,59.38,13.75,70.75"/>
<path id="冬-s3"  class="stroke" stroke="#09bf52" d="M38.38,32.25C44.510000000000005,36.91,68.80000000000001,53.09,81.09,60.14C84.89,62.32,89.63,64.31,94,65"/>
<path id="冬-s4"  class="stroke" stroke="#0952bf" d="M47.25,65C52.81,66.41,61.61,70.8,63,73"/>
<path id="冬-s5"  class="stroke" stroke="#9a09bf" d="M40.5,81.75C49.41,84.4,62.75,91.37,66,95.75"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="冬-bg1"  class="badge-group"><circle cx="44.62" cy="11.75" r="3.5" fill="#bf0909"/><text class="num-single" x="44.62" y="11.75" dx="0" dy="-0.5">1</text></g>
<g id="冬-bg2"  class="badge-group"><circle cx="45.86" cy="25.46" r="3.5" fill="#9abf09"/><text class="num-single" x="45.86" y="25.46" dx="0" dy="-0.5">2</text></g>
<g id="冬-bg3"  class="badge-group"><circle cx="38.38" cy="32.25" r="3.5" fill="#09bf52"/><text class="num-single" x="38.38" y="32.25" dx="0" dy="-0.5">3</text></g>
<g id="冬-bg4"  class="badge-group"><circle cx="47.25" cy="65" r="3.5" fill="#0952bf"/><text class="num-single" x="47.25" y="65" dx="0" dy="-0.5">4</text></g>
<g id="冬-bg5"  class="badge-group"><circle cx="40.5" cy="81.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="40.5" y="81.75" dx="0" dy="-0.5">5</text></g>
</svg>