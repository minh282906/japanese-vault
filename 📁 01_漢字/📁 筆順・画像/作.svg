<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (作)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #作-bg[i]: Thời gian quả bóng số nảy lên
   - #作-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#作-bg1  { animation-delay: 0.05s; }
#作-s1   { stroke-dasharray: 50.3288; stroke-dashoffset: 50.3288; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#作-bg2  { animation-delay: 0.48s; }
#作-s2   { stroke-dasharray: 53.9179; stroke-dashoffset: 53.9179; animation: drawStroke 0.30s ease-out 0.61s forwards; }
#作-bg3  { animation-delay: 0.93s; }
#作-s3   { stroke-dasharray: 39.3487; stroke-dashoffset: 39.3487; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#作-bg4  { animation-delay: 1.30s; }
#作-s4   { stroke-dasharray: 39.3449; stroke-dashoffset: 39.3449; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#作-bg5  { animation-delay: 1.67s; }
#作-s5   { stroke-dasharray: 65.4577; stroke-dashoffset: 65.4577; animation: drawStroke 0.36s ease-out 1.80s forwards; }
#作-bg6  { animation-delay: 2.18s; }
#作-s6   { stroke-dasharray: 20.1542; stroke-dashoffset: 20.1542; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#作-bg7  { animation-delay: 2.55s; }
#作-s7   { stroke-dasharray: 23.0785; stroke-dashoffset: 23.0785; animation: drawStroke 0.22s ease-out 2.68s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #作-s[i]) -->
<path id="作-s1"  class="stroke" stroke="#bf0909" d="M35.5,14C35.73,16.23,35.44,18.15,34.7,20.06C30,32.24,24.03,43.68,13.25,58.5"/>
<path id="作-s2"  class="stroke" stroke="#bfa509" d="M27.66,40.75C28.75,41.87,29.44,44.23,29.44,45.480000000000004C29.44,58.02,29.28,75.68,29.130000000000003,87.5C29.1,90.08,29.080000000000002,92.37,29.080000000000002,94.25"/>
<path id="作-s3"  class="stroke" stroke="#3dbf09" d="M60.75,12C61.12,13.5,60.94,15.75,60.38,17.27C57.25,25.75,52.29,38.23,44.31,47"/>
<path id="作-s4"  class="stroke" stroke="#09bf71" d="M56.86,32.42C59.07,32.5,61.28,32.46,62.83,32.29C70.87,31.38,78.5,30,88.43,28.2C91.24000000000001,27.689999999999998,93.71000000000001,27.75,95.83000000000001,28.12"/>
<path id="作-s5"  class="stroke" stroke="#0971bf" d="M68.35,34.21C69.44999999999999,35.31,69.97,36.94,69.97,38.3C69.97,44.629999999999995,69.8,75.99,69.75,92.25C69.74,95.24,69.73,97.66,69.73,99.25"/>
<path id="作-s6"  class="stroke" stroke="#3d09bf" d="M72.75,52.78C77.87,52.19,83.25,51.38,88.5,50.49C90.11,50.22,91.9,50.370000000000005,92.72,50.510000000000005"/>
<path id="作-s7"  class="stroke" stroke="#bf09a5" d="M73.04,72.51C79.59,71.76,84.79,71.09,91.94,70.24000000000001C93.81,70.02000000000001,95.00999999999999,70.12,95.97,70.26"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="作-bg1"  class="badge-group"><circle cx="35.5" cy="14" r="3.5" fill="#bf0909"/><text class="num-single" x="35.5" y="14" dx="0" dy="-0.5">1</text></g>
<g id="作-bg2"  class="badge-group"><circle cx="27.66" cy="40.75" r="3.5" fill="#bfa509"/><text class="num-single" x="27.66" y="40.75" dx="0" dy="-0.5">2</text></g>
<g id="作-bg3"  class="badge-group"><circle cx="60.75" cy="12" r="3.5" fill="#3dbf09"/><text class="num-single" x="60.75" y="12" dx="0" dy="-0.5">3</text></g>
<g id="作-bg4"  class="badge-group"><circle cx="56.86" cy="32.42" r="3.5" fill="#09bf71"/><text class="num-single" x="56.86" y="32.42" dx="0" dy="-0.5">4</text></g>
<g id="作-bg5"  class="badge-group"><circle cx="68.35" cy="34.21" r="3.5" fill="#0971bf"/><text class="num-single" x="68.35" y="34.21" dx="0" dy="-0.5">5</text></g>
<g id="作-bg6"  class="badge-group"><circle cx="72.75" cy="52.78" r="3.5" fill="#3d09bf"/><text class="num-single" x="72.75" y="52.78" dx="0" dy="-0.5">6</text></g>
<g id="作-bg7"  class="badge-group"><circle cx="73.04" cy="72.51" r="3.5" fill="#bf09a5"/><text class="num-single" x="73.04" y="72.51" dx="0" dy="-0.5">7</text></g>
</svg>