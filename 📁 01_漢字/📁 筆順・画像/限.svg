<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (限)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #限-bg[i]: Thời gian quả bóng số nảy lên
   - #限-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#限-bg1  { animation-delay: 0.05s; }
#限-s1   { stroke-dasharray: 50.2074; stroke-dashoffset: 50.2074; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#限-bg2  { animation-delay: 0.48s; }
#限-s2   { stroke-dasharray: 36.3829; stroke-dashoffset: 36.3829; animation: drawStroke 0.22s ease-out 0.61s forwards; }
#限-bg3  { animation-delay: 0.85s; }
#限-s3   { stroke-dasharray: 76.7726; stroke-dashoffset: 76.7726; animation: drawStroke 0.42s ease-out 0.98s forwards; }
#限-bg4  { animation-delay: 1.42s; }
#限-s4   { stroke-dasharray: 60.8944; stroke-dashoffset: 60.8944; animation: drawStroke 0.33s ease-out 1.55s forwards; }
#限-bg5  { animation-delay: 1.90s; }
#限-s5   { stroke-dasharray: 26.6205; stroke-dashoffset: 26.6205; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#限-bg6  { animation-delay: 2.27s; }
#限-s6   { stroke-dasharray: 25.0087; stroke-dashoffset: 25.0087; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#限-bg7  { animation-delay: 2.64s; }
#限-s7   { stroke-dasharray: 95.3520; stroke-dashoffset: 95.3520; animation: drawStroke 0.52s ease-out 2.77s forwards; }
#限-bg8  { animation-delay: 3.31s; }
#限-s8   { stroke-dasharray: 20.3428; stroke-dashoffset: 20.3428; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#限-bg9  { animation-delay: 3.68s; }
#限-s9   { stroke-dasharray: 48.3264; stroke-dashoffset: 48.3264; animation: drawStroke 0.27s ease-out 3.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #限-s[i]) -->
<path id="限-s1"  class="stroke" stroke="#bf0909" d="M15.25,17.5C16.15,17.72,17.17,17.98,18.25,17.83C24.75,16.88,33.6,15.029999999999998,36.17,14.169999999999998C39.17,13.169999999999998,41.67,15.669999999999998,40.34,18C39,20.33,31.83,33.17,29.5,36.5"/>
<path id="限-s2"  class="stroke" stroke="#bf8209" d="M29.5,36.5C42.5,47.75,41.88,68.75,30.67,62.5"/>
<path id="限-s3"  class="stroke" stroke="#82bf09" d="M17.87,18.5C18.37,19,18.830000000000002,19.75,18.830000000000002,20.5C18.830000000000002,21.38,18.85,70.17,18.860000000000003,88.75C18.860000000000003,91.7,18.860000000000003,93.89,18.860000000000003,95"/>
<path id="限-s4"  class="stroke" stroke="#09bf09" d="M49.95,17.31C51.75,18.25,55,18.139999999999997,56.5,17.86C62.71,16.689999999999998,71.13,15.129999999999999,76.25,14.469999999999999C79.72,14.02,81.79,15.049999999999999,81.49,19.14C81.1,24.54,79.78,33.91,78.85,40.620000000000005C78.64999999999999,42.080000000000005,78.47,43.410000000000004,78.32,44.550000000000004"/>
<path id="限-s5"  class="stroke" stroke="#09bf82" d="M52.79,32.3C62.5,30.379999999999995,71.75,28.999999999999996,79.12,28.49"/>
<path id="限-s6"  class="stroke" stroke="#0982bf" d="M52.77,45.8C63,44,68.92,43.13,77.51,42.18"/>
<path id="限-s7"  class="stroke" stroke="#0909bf" d="M49.95,17.31C51.07,18.43,51.550000000000004,19.75,51.550000000000004,21.09C51.550000000000004,22.36,51.56,82.75,51.56,88.14C51.56,90.94,52.160000000000004,92.99,55.29,90.83S63.5,84.75,68.98,80.13"/>
<path id="限-s8"  class="stroke" stroke="#8209bf" d="M88.63,43.88C88.75999999999999,45.010000000000005,88.64999999999999,46.09,87.6,47.09C83.39999999999999,51.120000000000005,77.88,55.13,74.16999999999999,57.160000000000004"/>
<path id="限-s9"  class="stroke" stroke="#bf0982" d="M60.75,53C64.85,53,82.13,74.25,86.67,78.91C90.61,82.95,92.75,84.88,95.37,86.25"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="限-bg1"  class="badge-group"><circle cx="15.25" cy="14.0" r="3.5" fill="#bf0909"/><text class="num-single" x="15.25" y="14.0" dx="0" dy="-0.5">1</text></g>
<g id="限-bg2"  class="badge-group"><circle cx="29.5" cy="36.5" r="3.5" fill="#bf8209"/><text class="num-single" x="29.5" y="36.5" dx="0" dy="-0.5">2</text></g>
<g id="限-bg3"  class="badge-group"><circle cx="17.87" cy="22.0" r="3.5" fill="#82bf09"/><text class="num-single" x="17.87" y="22.0" dx="0" dy="-0.5">3</text></g>
<g id="限-bg4"  class="badge-group"><circle cx="49.95" cy="13.81" r="3.5" fill="#09bf09"/><text class="num-single" x="49.95" y="13.81" dx="0" dy="-0.5">4</text></g>
<g id="限-bg5"  class="badge-group"><circle cx="52.79" cy="32.3" r="3.5" fill="#09bf82"/><text class="num-single" x="52.79" y="32.3" dx="0" dy="-0.5">5</text></g>
<g id="限-bg6"  class="badge-group"><circle cx="52.77" cy="45.8" r="3.5" fill="#0982bf"/><text class="num-single" x="52.77" y="45.8" dx="0" dy="-0.5">6</text></g>
<g id="限-bg7"  class="badge-group"><circle cx="49.95" cy="20.81" r="3.5" fill="#0909bf"/><text class="num-single" x="49.95" y="20.81" dx="0" dy="-0.5">7</text></g>
<g id="限-bg8"  class="badge-group"><circle cx="88.63" cy="43.88" r="3.5" fill="#8209bf"/><text class="num-single" x="88.63" y="43.88" dx="0" dy="-0.5">8</text></g>
