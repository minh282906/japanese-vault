<path id="貸-s7"  class="stroke" stroke="#09bfbf" d="M38.04,51.07C41.16,50.93,65.17,48.41,68.00999999999999,48.24C70.38,48.1,72.05,49.13,72.05,52.04C72.05,55.24,71.89999999999999,68.06,71.88,79.62C71.88,81.44,71.88,83.21000000000001,71.88,84.87"/>
<path id="貸-s8"  class="stroke" stroke="#0964bf" d="M38.49,61.28C44.370000000000005,60.88,64.37,59,70.66,58.78"/>
<path id="貸-s9"  class="stroke" stroke="#0909bf" d="M38.25,71.98C48.75,70.88000000000001,61.5,69.88000000000001,70.8,69.32000000000001"/>
<path id="貸-s10"  class="stroke" stroke="#6409bf" d="M38.3,83.5C47.5,82.5,62.25,81.5,70.6,81.09"/>
<path id="貸-s11"  class="stroke" stroke="#bf09bf" d="M44.73,87.81C44.75,89.13,44.279999999999994,90.27,43.23,91.10000000000001C40.059999999999995,93.61000000000001,31.529999999999998,98.79,25.179999999999996,101.76"/>
<path id="貸-s12"  class="stroke" stroke="#bf0964" d="M63.7,87.96C70.16,91.39,77.8,97.6,79.57000000000001,100.58999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="貸-bg1"  class="badge-group"><circle cx="33.16" cy="10.76" r="3.5" fill="#bf0909"/><text class="num-single" x="33.16" y="10.76" dx="0" dy="-0.5">1</text></g>
