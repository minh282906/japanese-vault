<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (貸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #貸-bg[i]: Thời gian quả bóng số nảy lên
   - #貸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#貸-bg1  { animation-delay: 0.05s; }
#貸-s1   { stroke-dasharray: 38.2850; stroke-dashoffset: 38.2850; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#貸-bg2  { animation-delay: 0.42s; }
#貸-s2   { stroke-dasharray: 27.5203; stroke-dashoffset: 27.5203; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#貸-bg3  { animation-delay: 0.79s; }
#貸-s3   { stroke-dasharray: 38.2521; stroke-dashoffset: 38.2521; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#貸-bg4  { animation-delay: 1.16s; }
#貸-s4   { stroke-dasharray: 66.1904; stroke-dashoffset: 66.1904; animation: drawStroke 0.36s ease-out 1.29s forwards; }
#貸-bg5  { animation-delay: 1.67s; }
#貸-s5   { stroke-dasharray: 14.3247; stroke-dashoffset: 14.3247; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#貸-bg6  { animation-delay: 2.04s; }
#貸-s6   { stroke-dasharray: 37.0212; stroke-dashoffset: 37.0212; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#貸-bg7  { animation-delay: 2.41s; }
#貸-s7   { stroke-dasharray: 69.3687; stroke-dashoffset: 69.3687; animation: drawStroke 0.38s ease-out 2.54s forwards; }
#貸-bg8  { animation-delay: 2.94s; }
#貸-s8   { stroke-dasharray: 32.2685; stroke-dashoffset: 32.2685; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#貸-bg9  { animation-delay: 3.31s; }
#貸-s9   { stroke-dasharray: 32.6608; stroke-dashoffset: 32.6608; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#貸-bg10  { animation-delay: 3.68s; }
#貸-s10   { stroke-dasharray: 32.3933; stroke-dashoffset: 32.3933; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#貸-bg11  { animation-delay: 4.05s; }
#貸-s11   { stroke-dasharray: 24.7481; stroke-dashoffset: 24.7481; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#貸-bg12  { animation-delay: 4.42s; }
#貸-s12   { stroke-dasharray: 20.4262; stroke-dashoffset: 20.4262; animation: drawStroke 0.22s ease-out 4.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

