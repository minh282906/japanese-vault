<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (似)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #似-bg[i]: Thời gian quả bóng số nảy lên
   - #似-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#似-bg1  { animation-delay: 0.05s; }
#似-s1   { stroke-dasharray: 46.3736; stroke-dashoffset: 46.3736; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#似-bg2  { animation-delay: 0.46s; }
#似-s2   { stroke-dasharray: 54.2253; stroke-dashoffset: 54.2253; animation: drawStroke 0.30s ease-out 0.59s forwards; }
#似-bg3  { animation-delay: 0.91s; }
#似-s3   { stroke-dasharray: 38.9068; stroke-dashoffset: 38.9068; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#似-bg4  { animation-delay: 1.28s; }
#似-s4   { stroke-dasharray: 25.6580; stroke-dashoffset: 25.6580; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#似-bg5  { animation-delay: 1.65s; }
#似-s5   { stroke-dasharray: 15.3386; stroke-dashoffset: 15.3386; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#似-bg6  { animation-delay: 2.02s; }
#似-s6   { stroke-dasharray: 72.4197; stroke-dashoffset: 72.4197; animation: drawStroke 0.40s ease-out 2.15s forwards; }
#似-bg7  { animation-delay: 2.57s; }
#似-s7   { stroke-dasharray: 29.9694; stroke-dashoffset: 29.9694; animation: drawStroke 0.22s ease-out 2.70s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #似-s[i]) -->
<path id="似-s1"  class="stroke" stroke="#bf0909" d="M31.26,18.75C31.470000000000002,20.75,31.200000000000003,23.12,30.51,24.83C26.12,35.75,20.560000000000002,46.25,10.5,59.54"/>
<path id="似-s2"  class="stroke" stroke="#bfa509" d="M24.78,41.25C26.01,42.48,26.630000000000003,44.21,26.630000000000003,46.25C26.630000000000003,58.5,26.6,76.25,26.6,88.5C26.6,91.14,26.5,93.38,26.5,95"/>
<path id="似-s3"  class="stroke" stroke="#3dbf09" d="M43.78,35.34C44.660000000000004,36.220000000000006,45.28,37.75,45.28,39.27C45.28,46.510000000000005,45.36,61.13,45.36,73.87"/>
<path id="似-s4"  class="stroke" stroke="#09bf71" d="M37.65,75.83C39.379999999999995,76.63,41.79,76.31,43.23,75.35C48.26,72,54.48,68.07,59.76,64.38"/>
<path id="似-s5"  class="stroke" stroke="#0971bf" d="M56.48,40.84C59.93,42.88,65.39999999999999,49.21,66.25999999999999,52.38"/>
<path id="似-s6"  class="stroke" stroke="#3d09bf" d="M85.42,24.68C86.12,25.75,86.28,27.96,85.75,29.99C80.5,50.25,73.5,74,53.34,86.65"/>
<path id="似-s7"  class="stroke" stroke="#bf09a5" d="M79.68,62.66C86.13000000000001,67.61999999999999,95.38000000000001,79,97.67,86.24"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="似-bg1"  class="badge-group"><circle cx="31.26" cy="18.75" r="3.5" fill="#bf0909"/><text class="num-single" x="31.26" y="18.75" dx="0" dy="-0.5">1</text></g>
<g id="似-bg2"  class="badge-group"><circle cx="24.78" cy="41.25" r="3.5" fill="#bfa509"/><text class="num-single" x="24.78" y="41.25" dx="0" dy="-0.5">2</text></g>
<g id="似-bg3"  class="badge-group"><circle cx="43.78" cy="35.34" r="3.5" fill="#3dbf09"/><text class="num-single" x="43.78" y="35.34" dx="0" dy="-0.5">3</text></g>
<g id="似-bg4"  class="badge-group"><circle cx="37.65" cy="75.83" r="3.5" fill="#09bf71"/><text class="num-single" x="37.65" y="75.83" dx="0" dy="-0.5">4</text></g>
<g id="似-bg5"  class="badge-group"><circle cx="56.48" cy="40.84" r="3.5" fill="#0971bf"/><text class="num-single" x="56.48" y="40.84" dx="0" dy="-0.5">5</text></g>
<g id="似-bg6"  class="badge-group"><circle cx="85.42" cy="24.68" r="3.5" fill="#3d09bf"/><text class="num-single" x="85.42" y="24.68" dx="0" dy="-0.5">6</text></g>
<g id="似-bg7"  class="badge-group"><circle cx="79.68" cy="62.66" r="3.5" fill="#bf09a5"/><text class="num-single" x="79.68" y="62.66" dx="0" dy="-0.5">7</text></g>
</svg>