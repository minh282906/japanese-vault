<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (床)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #床-bg[i]: Thời gian quả bóng số nảy lên
   - #床-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#床-bg1  { animation-delay: 0.05s; }
#床-s1   { stroke-dasharray: 12.4780; stroke-dashoffset: 12.4780; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#床-bg2  { animation-delay: 0.42s; }
#床-s2   { stroke-dasharray: 65.4410; stroke-dashoffset: 65.4410; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#床-bg3  { animation-delay: 0.93s; }
#床-s3   { stroke-dasharray: 60.9085; stroke-dashoffset: 60.9085; animation: drawStroke 0.33s ease-out 1.06s forwards; }
#床-bg4  { animation-delay: 1.41s; }
#床-s4   { stroke-dasharray: 50.8799; stroke-dashoffset: 50.8799; animation: drawStroke 0.28s ease-out 1.54s forwards; }
#床-bg5  { animation-delay: 1.84s; }
#床-s5   { stroke-dasharray: 64.1355; stroke-dashoffset: 64.1355; animation: drawStroke 0.35s ease-out 1.97s forwards; }
#床-bg6  { animation-delay: 2.34s; }
#床-s6   { stroke-dasharray: 49.4477; stroke-dashoffset: 49.4477; animation: drawStroke 0.27s ease-out 2.47s forwards; }
#床-bg7  { animation-delay: 2.76s; }
#床-s7   { stroke-dasharray: 49.1647; stroke-dashoffset: 49.1647; animation: drawStroke 0.27s ease-out 2.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #床-s[i]) -->
<path id="床-s1"  class="stroke" stroke="#bf0909" d="M51.31,11.13C52.400000000000006,12.22,52.82,13.870000000000001,52.82,15.780000000000001C52.82,16.57,52.75,20.12,52.75,23.240000000000002"/>
<path id="床-s2"  class="stroke" stroke="#bfa509" d="M19.38,26.98C22.46,28.080000000000002,26.229999999999997,27.61,29.38,27.21C45.01,25.25,60.379999999999995,23.130000000000003,75.51,21.94C78.51,21.71,81.43,21.68,84.38000000000001,22.32"/>
<path id="床-s3"  class="stroke" stroke="#3dbf09" d="M22.75,28.25C23.63,29.13,23.74,30.5,23.67,32.45C23,49.88,21,71.5,9.56,86.22"/>
<path id="床-s4"  class="stroke" stroke="#09bf71" d="M31.5,49.98C34.22,50.87,37.01,50.36,39.769999999999996,50.019999999999996C48.55,48.959999999999994,63.48,46.69,74.35,45.67999999999999C76.99,45.43999999999999,79.39,45.279999999999994,82,45.809999999999995"/>
<path id="床-s5"  class="stroke" stroke="#0971bf" d="M54.25,32.75C55.5,34,55.75,35.5,55.75,37.25C55.75,45.63,55.87,73.5,55.87,88.75C55.87,92.46,55.8,95.24,55.75,96.5"/>
<path id="床-s6"  class="stroke" stroke="#3d09bf" d="M54.5,50.25C54.5,51.5,54.27,52.69,52.85,54.47C44.5,65,33.25,76.5,20.5,85.25"/>
<path id="床-s7"  class="stroke" stroke="#bf09a5" d="M56.5,49.5C60.41,52.84,76.43,66.92,85.17,74.48C88.01,76.94,91.12,78.91,94.5,80.5"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="床-bg1"  class="badge-group"><circle cx="51.31" cy="11.13" r="3.5" fill="#bf0909"/><text class="num-single" x="51.31" y="11.13" dx="0" dy="-0.5">1</text></g>
<g id="床-bg2"  class="badge-group"><circle cx="19.38" cy="23.48" r="3.5" fill="#bfa509"/><text class="num-single" x="19.38" y="23.48" dx="0" dy="-0.5">2</text></g>
<g id="床-bg3"  class="badge-group"><circle cx="22.75" cy="31.75" r="3.5" fill="#3dbf09"/><text class="num-single" x="22.75" y="31.75" dx="0" dy="-0.5">3</text></g>
<g id="床-bg4"  class="badge-group"><circle cx="31.5" cy="49.98" r="3.5" fill="#09bf71"/><text class="num-single" x="31.5" y="49.98" dx="0" dy="-0.5">4</text></g>
<g id="床-bg5"  class="badge-group"><circle cx="54.25" cy="32.75" r="3.5" fill="#0971bf"/><text class="num-single" x="54.25" y="32.75" dx="0" dy="-0.5">5</text></g>
<g id="床-bg6"  class="badge-group"><circle cx="54.5" cy="46.75" r="3.5" fill="#3d09bf"/><text class="num-single" x="54.5" y="46.75" dx="0" dy="-0.5">6</text></g>
<g id="床-bg7"  class="badge-group"><circle cx="56.5" cy="53.0" r="3.5" fill="#bf09a5"/><text class="num-single" x="56.5" y="53.0" dx="0" dy="-0.5">7</text></g>
</svg>