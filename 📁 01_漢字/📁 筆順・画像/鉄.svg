<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鉄)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鉄-bg[i]: Thời gian quả bóng số nảy lên
   - #鉄-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鉄-bg1  { animation-delay: 0.05s; }
#鉄-s1   { stroke-dasharray: 39.7847; stroke-dashoffset: 39.7847; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鉄-bg2  { animation-delay: 0.42s; }
#鉄-s2   { stroke-dasharray: 17.3136; stroke-dashoffset: 17.3136; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鉄-bg3  { animation-delay: 0.79s; }
#鉄-s3   { stroke-dasharray: 19.3822; stroke-dashoffset: 19.3822; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#鉄-bg4  { animation-delay: 1.16s; }
#鉄-s4   { stroke-dasharray: 28.6748; stroke-dashoffset: 28.6748; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#鉄-bg5  { animation-delay: 1.53s; }
#鉄-s5   { stroke-dasharray: 41.0164; stroke-dashoffset: 41.0164; animation: drawStroke 0.23s ease-out 1.66s forwards; }
#鉄-bg6  { animation-delay: 1.91s; }
#鉄-s6   { stroke-dasharray: 12.9704; stroke-dashoffset: 12.9704; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#鉄-bg7  { animation-delay: 2.28s; }
#鉄-s7   { stroke-dasharray: 12.1317; stroke-dashoffset: 12.1317; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#鉄-bg8  { animation-delay: 2.65s; }
#鉄-s8   { stroke-dasharray: 30.3356; stroke-dashoffset: 30.3356; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#鉄-bg9  { animation-delay: 3.02s; }
#鉄-s9   { stroke-dasharray: 27.3932; stroke-dashoffset: 27.3932; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#鉄-bg10  { animation-delay: 3.39s; }
#鉄-s10   { stroke-dasharray: 29.6199; stroke-dashoffset: 29.6199; animation: drawStroke 0.22s ease-out 3.52s forwards; }
#鉄-bg11  { animation-delay: 3.76s; }
#鉄-s11   { stroke-dasharray: 45.5122; stroke-dashoffset: 45.5122; animation: drawStroke 0.25s ease-out 3.89s forwards; }
#鉄-bg12  { animation-delay: 4.16s; }
#鉄-s12   { stroke-dasharray: 90.3861; stroke-dashoffset: 90.3861; animation: drawStroke 0.50s ease-out 4.29s forwards; }
#鉄-bg13  { animation-delay: 4.81s; }
#鉄-s13   { stroke-dasharray: 43.9899; stroke-dashoffset: 43.9899; animation: drawStroke 0.24s ease-out 4.94s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #鉄-s[i]) -->
<path id="鉄-s1"  class="stroke" stroke="#bf0909" d="M30.75,13.99C30.75,14.84,30.8,15.52,30.6,16.54C29.52,21.87,19.27,39.62,10.5,47.5"/>
