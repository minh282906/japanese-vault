<g id="鉄-bg7"  class="badge-group"><circle cx="41.54" cy="58.8" r="3.5" fill="#09bf95"/><text class="num-single" x="41.54" y="58.8" dx="0" dy="-0.5">7</text></g>
<g id="鉄-bg8"  class="badge-group"><circle cx="14.5" cy="88.5" r="3.5" fill="#0995bf"/><text class="num-single" x="14.5" y="88.5" dx="0" dy="-0.5">8</text></g>
