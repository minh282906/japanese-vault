<path id="鉄-s5"  class="stroke" stroke="#25bf09" d="M28.7,42.19C29.689999999999998,43.18,30.189999999999998,44.5,30.189999999999998,45.83C30.189999999999998,50.18,30.249999999999996,75,30.249999999999996,82.81"/>
<path id="鉄-s6"  class="stroke" stroke="#09bf41" d="M16.89,66.51C19.79,70.99000000000001,21.2,75.83000000000001,21.79,78.45"/>
<path id="鉄-s7"  class="stroke" stroke="#09bf95" d="M41.54,62.3C41.769999999999996,63.01,41.75,63.879999999999995,41.3,64.89999999999999C40.3,67.16,39.5,68.75999999999999,36.919999999999995,73.27999999999999"/>
<path id="鉄-s8"  class="stroke" stroke="#0995bf" d="M14.5,88.5C15.5,89.12,16.75,89.38,18.5,88.75C19.77,88.3,29.25,83.75,42.25,77.75"/>
<path id="鉄-s9"  class="stroke" stroke="#0941bf" d="M55.75,23.88C56,24.759999999999998,56.12,25.669999999999998,55.94,26.509999999999998C54.5,33.129999999999995,51.89,41.3,47,49.45"/>
<path id="鉄-s10"  class="stroke" stroke="#2509bf" d="M55.69,39.18C56.5,39.18,58.87,39.06,59.5,39C63.95,38.58,74.86,36.36,80.14,35.59C81.76,35.35,83.75,35.120000000000005,85,35.25"/>
<path id="鉄-s11"  class="stroke" stroke="#7909bf" d="M46.75,59C49.63,59.25,51.68,59.11,54.269999999999996,58.75C61.88999999999999,57.69,77.13,55.87,84.89,55.17C87.08,54.97,89.76,54.870000000000005,92.01,55.25"/>
<path id="鉄-s12"  class="stroke" stroke="#bf09b1" d="M66.23,13.25C67.12,14.14,67.5,15.379999999999999,67.55,16.64C70,76.25,59.5,82.5,42.75,94.5"/>
<path id="鉄-s13"  class="stroke" stroke="#bf095d" d="M67.23,59.09C73.16,68.85000000000001,81.27000000000001,80.33,87.75,87.25C89.56,89.18,91.87,91.5,94.74,93"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="鉄-bg1"  class="badge-group"><circle cx="30.75" cy="13.99" r="3.5" fill="#bf0909"/><text class="num-single" x="30.75" y="13.99" dx="0" dy="-0.5">1</text></g>
