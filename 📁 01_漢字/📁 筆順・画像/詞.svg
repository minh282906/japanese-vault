<path id="詞-s9"  class="stroke" stroke="#0909bf" d="M52.49,37.42C54.25,37.71,55.57,37.510000000000005,57,37.32C61.25,36.76,67.6,35.71,72.11,35.28C73.7,35.13,75.07,35.050000000000004,76.6,35.44"/>
<path id="詞-s10"  class="stroke" stroke="#6409bf" d="M52.19,52.29C53.01,53.11,53.41,54.07,53.68,55.21C54.37,58.21,55.31,63.36,55.98,67.96000000000001C56.23,69.67,56.44,71.30000000000001,56.589999999999996,72.72000000000001"/>
<path id="詞-s11"  class="stroke" stroke="#bf09bf" d="M54.56,53.93C61.58,52.56,69.33,51.39,73.3,50.73C75.94,50.29,77.21,51.58,76.74,54.25C76.07,58.01,75.25,60.63,73.86,67.02"/>
