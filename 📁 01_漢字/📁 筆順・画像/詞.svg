<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (詞)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #詞-bg[i]: Thời gian quả bóng số nảy lên
   - #詞-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#詞-bg1  { animation-delay: 0.05s; }
#詞-s1   { stroke-dasharray: 11.4793; stroke-dashoffset: 11.4793; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#詞-bg2  { animation-delay: 0.42s; }
#詞-s2   { stroke-dasharray: 34.9569; stroke-dashoffset: 34.9569; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#詞-bg3  { animation-delay: 0.79s; }
#詞-s3   { stroke-dasharray: 23.0457; stroke-dashoffset: 23.0457; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#詞-bg4  { animation-delay: 1.16s; }
#詞-s4   { stroke-dasharray: 21.9807; stroke-dashoffset: 21.9807; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#詞-bg5  { animation-delay: 1.53s; }
#詞-s5   { stroke-dasharray: 23.0475; stroke-dashoffset: 23.0475; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#詞-bg6  { animation-delay: 1.90s; }
#詞-s6   { stroke-dasharray: 38.2593; stroke-dashoffset: 38.2593; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#詞-bg7  { animation-delay: 2.27s; }
#詞-s7   { stroke-dasharray: 19.1597; stroke-dashoffset: 19.1597; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#詞-bg8  { animation-delay: 2.64s; }
#詞-s8   { stroke-dasharray: 130.9860; stroke-dashoffset: 130.9860; animation: drawStroke 0.55s ease-out 2.77s forwards; }
#詞-bg9  { animation-delay: 3.34s; }
#詞-s9   { stroke-dasharray: 24.2973; stroke-dashoffset: 24.2973; animation: drawStroke 0.22s ease-out 3.47s forwards; }
#詞-bg10  { animation-delay: 3.71s; }
#詞-s10   { stroke-dasharray: 21.0817; stroke-dashoffset: 21.0817; animation: drawStroke 0.22s ease-out 3.84s forwards; }
#詞-bg11  { animation-delay: 4.08s; }
#詞-s11   { stroke-dasharray: 38.2593; stroke-dashoffset: 38.2593; animation: drawStroke 0.22s ease-out 4.21s forwards; }
#詞-bg12  { animation-delay: 4.45s; }
#詞-s12   { stroke-dasharray: 19.3194; stroke-dashoffset: 19.3194; animation: drawStroke 0.22s ease-out 4.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

