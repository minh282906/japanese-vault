<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (固)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #固-bg[i]: Thời gian quả bóng số nảy lên
   - #固-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#固-bg1  { animation-delay: 0.05s; }
#固-s1   { stroke-dasharray: 77.3693; stroke-dashoffset: 77.3693; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#固-bg2  { animation-delay: 0.63s; }
#固-s2   { stroke-dasharray: 144.2620; stroke-dashoffset: 144.2620; animation: drawStroke 0.55s ease-out 0.76s forwards; }
#固-bg3  { animation-delay: 1.33s; }
#固-s3   { stroke-dasharray: 48.5998; stroke-dashoffset: 48.5998; animation: drawStroke 0.27s ease-out 1.46s forwards; }
#固-bg4  { animation-delay: 1.75s; }
#固-s4   { stroke-dasharray: 32.3163; stroke-dashoffset: 32.3163; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#固-bg5  { animation-delay: 2.12s; }
#固-s5   { stroke-dasharray: 22.4321; stroke-dashoffset: 22.4321; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#固-bg6  { animation-delay: 2.49s; }
#固-s6   { stroke-dasharray: 48.3903; stroke-dashoffset: 48.3903; animation: drawStroke 0.27s ease-out 2.62s forwards; }
#固-bg7  { animation-delay: 2.91s; }
#固-s7   { stroke-dasharray: 27.8147; stroke-dashoffset: 27.8147; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#固-bg8  { animation-delay: 3.28s; }
#固-s8   { stroke-dasharray: 66.5533; stroke-dashoffset: 66.5533; animation: drawStroke 0.37s ease-out 3.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #固-s[i]) -->
<path id="固-s1"  class="stroke" stroke="#bf0909" d="M20,17.53C20.86,18.39,21.61,20.16,21.61,21.970000000000002C21.61,34.52,21.37,69.26,21.31,88.13C21.299999999999997,90.53999999999999,21.299999999999997,92.69,21.299999999999997,94.50999999999999"/>
<path id="固-s2"  class="stroke" stroke="#bf9109" d="M22.23,20.24C41.5,18.369999999999997,73.13,16.119999999999997,85.5,15.499999999999998C88.25,15.359999999999998,90.25,17.869999999999997,90.25,20.729999999999997C90.25,34.03,90.25,64,90.25,85.25C90.25,88.6,90.25,90.75,90.25,93.63"/>
<path id="固-s3"  class="stroke" stroke="#64bf09" d="M29.75,39.56C32.25,40,34.19,39.86,36.519999999999996,39.6C44.63999999999999,38.71,61.28999999999999,36.44,71.12,36.07C73.43,35.98,75.83,35.89,78.12,36.27"/>
<path id="固-s4"  class="stroke" stroke="#09bf36" d="M53.11,23.49C54,24.38,54.53,25.75,54.53,27.09C54.53,39.730000000000004,54.620000000000005,49.5,54.620000000000005,55.44"/>
<path id="固-s5"  class="stroke" stroke="#09bfbf" d="M37.79,56.65C38.42,58.1,38.67,59.07,38.89,60.61C39.44,64.31,40.12,70.13,40.8,75.25C40.959999999999994,76.47,41.12,77.66,41.279999999999994,78.76"/>
<path id="固-s6"  class="stroke" stroke="#0936bf" d="M39.23,58.96C47.87,57.63,61.629999999999995,55.370000000000005,67.06,55.25C69.31,55.21,70.24000000000001,56,69.82000000000001,58.14C68.99000000000001,62.31,67.89,67.65,66.67,73.2"/>
<path id="固-s7"  class="stroke" stroke="#6409bf" d="M42.21,76.4C48.75,75.86,58.02,74.85000000000001,65.5,74.29C67.07,74.17,68.55,74.08000000000001,69.92,74.01"/>
<path id="固-s8"  class="stroke" stroke="#bf0991" d="M22.75,90.66C37.13,90.11999999999999,71.21000000000001,88.41,89.25,88.02"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="固-bg1"  class="badge-group"><circle cx="20" cy="14.03" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="14.03" dx="0" dy="-0.5">1</text></g>
<g id="固-bg2"  class="badge-group"><circle cx="22.23" cy="23.74" r="3.5" fill="#bf9109"/><text class="num-single" x="22.23" y="23.74" dx="0" dy="-0.5">2</text></g>
<g id="固-bg3"  class="badge-group"><circle cx="29.75" cy="39.56" r="3.5" fill="#64bf09"/><text class="num-single" x="29.75" y="39.56" dx="0" dy="-0.5">3</text></g>
<g id="固-bg4"  class="badge-group"><circle cx="53.11" cy="23.49" r="3.5" fill="#09bf36"/><text class="num-single" x="53.11" y="23.49" dx="0" dy="-0.5">4</text></g>
<g id="固-bg5"  class="badge-group"><circle cx="37.79" cy="53.15" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.79" y="53.15" dx="0" dy="-0.5">5</text></g>
<g id="固-bg6"  class="badge-group"><circle cx="39.23" cy="62.46" r="3.5" fill="#0936bf"/><text class="num-single" x="39.23" y="62.46" dx="0" dy="-0.5">6</text></g>
<g id="固-bg7"  class="badge-group"><circle cx="42.21" cy="76.4" r="3.5" fill="#6409bf"/><text class="num-single" x="42.21" y="76.4" dx="0" dy="-0.5">7</text></g>
<g id="固-bg8"  class="badge-group"><circle cx="22.75" cy="90.66" r="3.5" fill="#bf0991"/><text class="num-single" x="22.75" y="90.66" dx="0" dy="-0.5">8</text></g>
</svg>