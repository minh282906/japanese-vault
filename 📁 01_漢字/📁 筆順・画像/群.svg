<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (群)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #群-bg[i]: Thời gian quả bóng số nảy lên
   - #群-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#群-bg1  { animation-delay: 0.05s; }
#群-s1   { stroke-dasharray: 54.0987; stroke-dashoffset: 54.0987; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#群-bg2  { animation-delay: 0.50s; }
#群-s2   { stroke-dasharray: 42.2984; stroke-dashoffset: 42.2984; animation: drawStroke 0.23s ease-out 0.63s forwards; }
#群-bg3  { animation-delay: 0.88s; }
#群-s3   { stroke-dasharray: 31.0192; stroke-dashoffset: 31.0192; animation: drawStroke 0.22s ease-out 1.01s forwards; }
#群-bg4  { animation-delay: 1.25s; }
#群-s4   { stroke-dasharray: 55.5883; stroke-dashoffset: 55.5883; animation: drawStroke 0.31s ease-out 1.38s forwards; }
#群-bg5  { animation-delay: 1.71s; }
#群-s5   { stroke-dasharray: 22.7663; stroke-dashoffset: 22.7663; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#群-bg6  { animation-delay: 2.08s; }
#群-s6   { stroke-dasharray: 41.1463; stroke-dashoffset: 41.1463; animation: drawStroke 0.23s ease-out 2.21s forwards; }
#群-bg7  { animation-delay: 2.46s; }
#群-s7   { stroke-dasharray: 18.1930; stroke-dashoffset: 18.1930; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#群-bg8  { animation-delay: 2.83s; }
#群-s8   { stroke-dasharray: 13.5539; stroke-dashoffset: 13.5539; animation: drawStroke 0.22s ease-out 2.96s forwards; }
#群-bg9  { animation-delay: 3.20s; }
#群-s9   { stroke-dasharray: 22.0733; stroke-dashoffset: 22.0733; animation: drawStroke 0.22s ease-out 3.33s forwards; }
#群-bg10  { animation-delay: 3.57s; }
#群-s10   { stroke-dasharray: 35.8482; stroke-dashoffset: 35.8482; animation: drawStroke 0.22s ease-out 3.70s forwards; }
#群-bg11  { animation-delay: 3.94s; }
#群-s11   { stroke-dasharray: 33.7152; stroke-dashoffset: 33.7152; animation: drawStroke 0.22s ease-out 4.07s forwards; }
#群-bg12  { animation-delay: 4.31s; }
#群-s12   { stroke-dasharray: 44.8789; stroke-dashoffset: 44.8789; animation: drawStroke 0.25s ease-out 4.44s forwards; }
#群-bg13  { animation-delay: 4.71s; }
#群-s13   { stroke-dasharray: 58.7301; stroke-dashoffset: 58.7301; animation: drawStroke 0.32s ease-out 4.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

