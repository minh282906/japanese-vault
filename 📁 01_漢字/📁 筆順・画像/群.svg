<path id="群-s9"  class="stroke" stroke="#0941bf" d="M87.27,12.64C87.5,13.370000000000001,87.21,14.620000000000001,86.97,15.25C85.13,19.87,81.75,25.75,76.91,31.77"/>
<path id="群-s10"  class="stroke" stroke="#2509bf" d="M57.69,36.67C59.75,37.120000000000005,61.879999999999995,36.88,63.65,36.63C69.58,35.800000000000004,82.24,33.940000000000005,88.62,33.620000000000005C90.16000000000001,33.540000000000006,91.78,33.45,93.29,33.870000000000005"/>
<path id="群-s11"  class="stroke" stroke="#7909bf" d="M57.03,51.06C58.870000000000005,51.38,60.4,51.36,61.89,51.17C67.28,50.49,79.39,48.800000000000004,85.88,48.47C87.42,48.39,89.03999999999999,48.3,90.53999999999999,48.72"/>
<path id="群-s12"  class="stroke" stroke="#bf09b1" d="M53.28,66.44C55.63,66.87,58.25,66.86,60.5,66.63C67.27,65.94999999999999,80.89,64.47999999999999,91.37,63.94C93.61,63.82,95.78,63.71,97.98,64.25"/>
<path id="群-s13"  class="stroke" stroke="#bf095d" d="M73.12,38.31C73.97,39.160000000000004,74.22,40.25,74.22,41.5C74.22,42.21,74.1,75.50999999999999,74.06,90.50999999999999C74.05,93.38999999999999,74.05,95.58999999999999,74.05,96.75999999999999"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="群-bg1"  class="badge-group"><circle cx="17.22" cy="22.63" r="3.5" fill="#bf0909"/><text class="num-single" x="17.22" y="22.63" dx="0" dy="-0.5">1</text></g>
