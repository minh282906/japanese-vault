<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (捜)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #捜-bg[i]: Thời gian quả bóng số nảy lên
   - #捜-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#捜-bg1  { animation-delay: 0.05s; }
#捜-s1   { stroke-dasharray: 26.9146; stroke-dashoffset: 26.9146; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#捜-bg2  { animation-delay: 0.42s; }
#捜-s2   { stroke-dasharray: 85.9641; stroke-dashoffset: 85.9641; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#捜-bg3  { animation-delay: 1.04s; }
#捜-s3   { stroke-dasharray: 33.9319; stroke-dashoffset: 33.9319; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#捜-bg4  { animation-delay: 1.41s; }
#捜-s4   { stroke-dasharray: 27.6051; stroke-dashoffset: 27.6051; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#捜-bg5  { animation-delay: 1.78s; }
#捜-s5   { stroke-dasharray: 68.3272; stroke-dashoffset: 68.3272; animation: drawStroke 0.38s ease-out 1.91s forwards; }
#捜-bg6  { animation-delay: 2.31s; }
#捜-s6   { stroke-dasharray: 38.1778; stroke-dashoffset: 38.1778; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#捜-bg7  { animation-delay: 2.68s; }
#捜-s7   { stroke-dasharray: 33.6186; stroke-dashoffset: 33.6186; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#捜-bg8  { animation-delay: 3.05s; }
#捜-s8   { stroke-dasharray: 47.1368; stroke-dashoffset: 47.1368; animation: drawStroke 0.26s ease-out 3.18s forwards; }
#捜-bg9  { animation-delay: 3.46s; }
#捜-s9   { stroke-dasharray: 86.2795; stroke-dashoffset: 86.2795; animation: drawStroke 0.47s ease-out 3.59s forwards; }
#捜-bg10  { animation-delay: 4.08s; }
#捜-s10   { stroke-dasharray: 53.5016; stroke-dashoffset: 53.5016; animation: drawStroke 0.29s ease-out 4.21s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #捜-s[i]) -->
<path id="捜-s1"  class="stroke" stroke="#bf0909" d="M14,39.42C15.85,39.64,17.48,40.160000000000004,19.38,39.93C24.11,39.36,30.439999999999998,38.33,37.489999999999995,37.41C38.53999999999999,37.269999999999996,39.60999999999999,37.13999999999999,40.669999999999995,37"/>
<path id="捜-s2"  class="stroke" stroke="#bf7609" d="M28.77,16C29.82,17.05,30.53,19.38,30.53,21.52C30.53,36.75,30.52,74.48,30.52,85.92C30.52,100.17,24.7,89.7,23.25,88.17"/>
<path id="捜-s3"  class="stroke" stroke="#9abf09" d="M11.25,69.18C12.16,70.09,13.879999999999999,70.17,15.01,69.38000000000001C20.38,65.62,28,60,39.25,51.92"/>
<path id="捜-s4"  class="stroke" stroke="#2dbf09" d="M43.41,26.57C44.36,27.52,44.9,28.66,45.11,29.63C46.25,34.75,47.4,41.41,48.31,48.489999999999995C48.53,50.209999999999994,48.72,51.87,48.870000000000005,53.379999999999995"/>
<path id="捜-s5"  class="stroke" stroke="#09bf52" d="M45.58,27.69C56.14,26.23,73.65,24.630000000000003,82.38,23.770000000000003C86,23.42,88.8,23.92,88.21,28.140000000000004C87.66,32.11000000000001,85.94999999999999,40.38,84.82,46.02C84.49,47.64,84.21,49.050000000000004,84.02,50.07"/>
<path id="捜-s6"  class="stroke" stroke="#09bfbf" d="M48.1,39.08C56.25,38.12,75.87,36.25,86.14,35.93"/>
<path id="捜-s7"  class="stroke" stroke="#0952bf" d="M49.68,50.41C60,49.37,72.62,48.339999999999996,83.19,47.739999999999995"/>
<path id="捜-s8"  class="stroke" stroke="#2d09bf" d="M64.12,13C65.12,14,65.58,15.25,65.58,16.75C65.58,17.77,65.61,49,65.61,59.75"/>
<path id="捜-s9"  class="stroke" stroke="#9a09bf" d="M49.65,62.78C51,63.04,51.92,63.17,54.629999999999995,62.79C57.06999999999999,62.44,72.94,59.86,77.38,59.12C80.89,58.54,82.21,59.69,80.22999999999999,62.89C70.85,78.08,59.33999999999999,88.69,42.71999999999999,96.25999999999999"/>
<path id="捜-s10"  class="stroke" stroke="#bf0976" d="M48.27,68.42C53.040000000000006,68.72,69.37,82.38,84.5,91.59C87.36,93.33,90.79,94.7,94.02,95.61"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="捜-bg1"  class="badge-group"><circle cx="14" cy="39.42" r="3.5" fill="#bf0909"/><text class="num-single" x="14" y="39.42" dx="0" dy="-0.5">1</text></g>
<g id="捜-bg2"  class="badge-group"><circle cx="28.77" cy="16" r="3.5" fill="#bf7609"/><text class="num-single" x="28.77" y="16" dx="0" dy="-0.5">2</text></g>
<g id="捜-bg3"  class="badge-group"><circle cx="11.25" cy="69.18" r="3.5" fill="#9abf09"/><text class="num-single" x="11.25" y="69.18" dx="0" dy="-0.5">3</text></g>
<g id="捜-bg4"  class="badge-group"><circle cx="43.41" cy="23.07" r="3.5" fill="#2dbf09"/><text class="num-single" x="43.41" y="23.07" dx="0" dy="-0.5">4</text></g>
<g id="捜-bg5"  class="badge-group"><circle cx="45.58" cy="31.19" r="3.5" fill="#09bf52"/><text class="num-single" x="45.58" y="31.19" dx="0" dy="-0.5">5</text></g>
<g id="捜-bg6"  class="badge-group"><circle cx="48.1" cy="39.08" r="3.5" fill="#09bfbf"/><text class="num-single" x="48.1" y="39.08" dx="0" dy="-0.5">6</text></g>
<g id="捜-bg7"  class="badge-group"><circle cx="49.68" cy="50.41" r="3.5" fill="#0952bf"/><text class="num-single" x="49.68" y="50.41" dx="0" dy="-0.5">7</text></g>
<g id="捜-bg8"  class="badge-group"><circle cx="64.12" cy="13" r="3.5" fill="#2d09bf"/><text class="num-single" x="64.12" y="13" dx="0" dy="-0.5">8</text></g>
<g id="捜-bg9"  class="badge-group"><circle cx="49.65" cy="59.28" r="3.5" fill="#9a09bf"/><text class="num-single" x="49.65" y="59.28" dx="0" dy="-0.5">9</text></g>
<g id="捜-bg10" class="badge-group"><circle cx="48.27" cy="71.92" r="3.5" fill="#bf0976"/><text class="num-double" x="48.27" y="71.92" dx="-0.4" dy="-0.475">10</text></g>
</svg>