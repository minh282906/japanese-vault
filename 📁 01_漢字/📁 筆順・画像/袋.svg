<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (袋)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #袋-bg[i]: Thời gian quả bóng số nảy lên
   - #袋-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#袋-bg1  { animation-delay: 0.05s; }
#袋-s1   { stroke-dasharray: 33.4848; stroke-dashoffset: 33.4848; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#袋-bg2  { animation-delay: 0.42s; }
#袋-s2   { stroke-dasharray: 25.9852; stroke-dashoffset: 25.9852; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#袋-bg3  { animation-delay: 0.79s; }
#袋-s3   { stroke-dasharray: 39.9736; stroke-dashoffset: 39.9736; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#袋-bg4  { animation-delay: 1.16s; }
#袋-s4   { stroke-dasharray: 61.6534; stroke-dashoffset: 61.6534; animation: drawStroke 0.34s ease-out 1.29s forwards; }
#袋-bg5  { animation-delay: 1.65s; }
#袋-s5   { stroke-dasharray: 11.0430; stroke-dashoffset: 11.0430; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#袋-bg6  { animation-delay: 2.02s; }
#袋-s6   { stroke-dasharray: 9.8237; stroke-dashoffset: 9.8237; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#袋-bg7  { animation-delay: 2.39s; }
#袋-s7   { stroke-dasharray: 63.3453; stroke-dashoffset: 63.3453; animation: drawStroke 0.35s ease-out 2.52s forwards; }
#袋-bg8  { animation-delay: 2.89s; }
#袋-s8   { stroke-dasharray: 41.5793; stroke-dashoffset: 41.5793; animation: drawStroke 0.23s ease-out 3.02s forwards; }
#袋-bg9  { animation-delay: 3.27s; }
#袋-s9   { stroke-dasharray: 42.1588; stroke-dashoffset: 42.1588; animation: drawStroke 0.23s ease-out 3.40s forwards; }
#袋-bg10  { animation-delay: 3.65s; }
#袋-s10   { stroke-dasharray: 15.6137; stroke-dashoffset: 15.6137; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#袋-bg11  { animation-delay: 4.02s; }
#袋-s11   { stroke-dasharray: 49.8470; stroke-dashoffset: 49.8470; animation: drawStroke 0.27s ease-out 4.15s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #袋-s[i]) -->
<path id="袋-s1"  class="stroke" stroke="#bf0909" d="M36.72,13.21C36.93,14.56,36.66,16.32,36,17.47C31.77,24.82,27.95,31.39,18.25,40.34"/>
<path id="袋-s2"  class="stroke" stroke="#bf6c09" d="M30.22,29.33C31.07,30.18,31.529999999999998,31.38,31.529999999999998,32.55C31.529999999999998,39.03,31.549999999999997,44.669999999999995,31.56,50C31.56,51.83,31.57,53.51,31.57,54.97"/>
