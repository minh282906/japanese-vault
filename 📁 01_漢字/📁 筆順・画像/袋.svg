<path id="袋-s4"  class="stroke" stroke="#4bbf09" d="M55.08,10.54C56.699999999999996,11.42,57.53,12.77,58.21,14.54C63.62,28.75,69.5,40,86.75,50.09C92.42,53.410000000000004,92.2,50.470000000000006,91.4,46.59"/>
<path id="袋-s5"  class="stroke" stroke="#09bf2a" d="M78.6,11.46C81.58999999999999,12.65,86.36999999999999,15.39,87.77,17.43"/>
<path id="袋-s6"  class="stroke" stroke="#09bf8d" d="M53,48.45C54.15,49.6,54.5,51.120000000000005,54.5,52.13C54.5,54.010000000000005,54.5,55.35,54.5,57.88"/>
<path id="袋-s7"  class="stroke" stroke="#098dbf" d="M22.75,61.64C26.13,62.25,29.39,61.95,32.88,61.47C46.120000000000005,59.629999999999995,63.910000000000004,57.64,76.86,56.989999999999995C79.64,56.849999999999994,83.03999999999999,56.28999999999999,85.75,57.19"/>
<path id="袋-s8"  class="stroke" stroke="#092abf" d="M49.14,60.42C49.14,61.95,48.34,63.02,47.47,64.18C42.67,70.62,32.879999999999995,81.75,19.549999999999997,88.57000000000001"/>
<path id="袋-s9"  class="stroke" stroke="#4b09bf" d="M40.62,77.2C41.46,78.04,41.57,79.08,41.559999999999995,79.86C41.529999999999994,89.7,41.49999999999999,95.15,41.49999999999999,96.81S42.61999999999999,99.42,44.029999999999994,98.17C45.449999999999996,96.92,57.08,88.81,58.96999999999999,87.56"/>
<path id="袋-s10"  class="stroke" stroke="#ae09bf" d="M73.86,63.96C73.89,64.2,73.71,65.13,73.52,65.44C72.33999999999999,67.42999999999999,68.64999999999999,70.28,62.629999999999995,74.25"/>
<path id="袋-s11"  class="stroke" stroke="#bf096c" d="M48.51,67.91C51.37,68.63,70.25999999999999,83.17999999999999,80.32,89.77C83.47,91.83,87.25,94,90.25,94.92"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="袋-bg1"  class="badge-group"><circle cx="36.72" cy="13.21" r="3.5" fill="#bf0909"/><text class="num-single" x="36.72" y="13.21" dx="0" dy="-0.5">1</text></g>
<g id="袋-bg2"  class="badge-group"><circle cx="30.22" cy="29.33" r="3.5" fill="#bf6c09"/><text class="num-single" x="30.22" y="29.33" dx="0" dy="-0.5">2</text></g>
