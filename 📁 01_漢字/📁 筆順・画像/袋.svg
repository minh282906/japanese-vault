<g id="袋-bg9"  class="badge-group"><circle cx="40.62" cy="77.2" r="3.5" fill="#4b09bf"/><text class="num-single" x="40.62" y="77.2" dx="0" dy="-0.5">9</text></g>
<g id="袋-bg10" class="badge-group"><circle cx="73.86" cy="63.96" r="3.5" fill="#ae09bf"/><text class="num-double" x="73.86" y="63.96" dx="-0.4" dy="-0.475">10</text></g>
<g id="袋-bg11" class="badge-group"><circle cx="48.51" cy="67.91" r="3.5" fill="#bf096c"/><text class="num-double" x="48.51" y="67.91" dx="-0.4" dy="-0.475">11</text></g>
</svg>