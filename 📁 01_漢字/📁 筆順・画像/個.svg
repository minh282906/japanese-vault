<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (個)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #個-bg[i]: Thời gian quả bóng số nảy lên
   - #個-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#個-bg1  { animation-delay: 0.05s; }
#個-s1   { stroke-dasharray: 47.9658; stroke-dashoffset: 47.9658; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#個-bg2  { animation-delay: 0.46s; }
#個-s2   { stroke-dasharray: 53.3801; stroke-dashoffset: 53.3801; animation: drawStroke 0.29s ease-out 0.59s forwards; }
#個-bg3  { animation-delay: 0.90s; }
#個-s3   { stroke-dasharray: 64.9123; stroke-dashoffset: 64.9123; animation: drawStroke 0.36s ease-out 1.03s forwards; }
#個-bg4  { animation-delay: 1.41s; }
#個-s4   { stroke-dasharray: 114.4460; stroke-dashoffset: 114.4460; animation: drawStroke 0.55s ease-out 1.54s forwards; }
#個-bg5  { animation-delay: 2.11s; }
#個-s5   { stroke-dasharray: 31.1672; stroke-dashoffset: 31.1672; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#個-bg6  { animation-delay: 2.48s; }
#個-s6   { stroke-dasharray: 31.6816; stroke-dashoffset: 31.6816; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#個-bg7  { animation-delay: 2.85s; }
#個-s7   { stroke-dasharray: 15.2011; stroke-dashoffset: 15.2011; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#個-bg8  { animation-delay: 3.22s; }
#個-s8   { stroke-dasharray: 37.3704; stroke-dashoffset: 37.3704; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#個-bg9  { animation-delay: 3.59s; }
#個-s9   { stroke-dasharray: 22.5606; stroke-dashoffset: 22.5606; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#個-bg10  { animation-delay: 3.96s; }
#個-s10   { stroke-dasharray: 47.1444; stroke-dashoffset: 47.1444; animation: drawStroke 0.26s ease-out 4.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #個-s[i]) -->
<path id="個-s1"  class="stroke" stroke="#bf0909" d="M31.26,17.5C31.48,19.59,31.200000000000003,20.82,30.48,22.6C25.880000000000003,33.99,19.8,45.68,9.25,59.54"/>
<path id="個-s2"  class="stroke" stroke="#bf7609" d="M24.28,40.25C25.200000000000003,41.17,25.78,42.61,25.77,44.25C25.73,55.39,25.57,76.95,25.509999999999998,88C25.499999999999996,90.24,25.49,92.05,25.49,93.25"/>
<path id="個-s3"  class="stroke" stroke="#9abf09" d="M41.14,25.43C41.92,26.21,42.480000000000004,27.45,42.480000000000004,28.98C42.480000000000004,40.15,42.50000000000001,64.15,42.50000000000001,85.25C42.50000000000001,86.85,42.50000000000001,88.44,42.50000000000001,90"/>
<path id="個-s4"  class="stroke" stroke="#2dbf09" d="M43.65,26.81C56.65,25.48,77,23,86.83,22C89.73,21.71,91.85,23.12,91.85,26.43C91.85,37.65,91.96,64.43,91.97999999999999,82.87C91.97999999999999,85.29,91.97999999999999,87.58,91.97999999999999,89.66000000000001"/>
<path id="個-s5"  class="stroke" stroke="#09bf52" d="M50.36,44.11C52,44.37,53.28,44.31,54.879999999999995,44.13C60.91,43.43,70.69999999999999,41.81,77.25999999999999,41.28C78.71,41.160000000000004,79.89999999999999,41.1,81.30999999999999,41.4"/>
<path id="個-s6"  class="stroke" stroke="#09bfbf" d="M64.13,26.74C64.88,27.49,65.39999999999999,28.619999999999997,65.39999999999999,29.979999999999997C65.39999999999999,40.699999999999996,65.39999999999999,54.26,65.28999999999999,58.089999999999996"/>
<path id="個-s7"  class="stroke" stroke="#0952bf" d="M52.94,59.02C53.12,59.580000000000005,53.339999999999996,59.96,53.41,60.39C53.8,63.04,54.61,66.8,55.25,71.5C55.36,72.3,55.46,73.12,55.55,73.97"/>
<path id="個-s8"  class="stroke" stroke="#2d09bf" d="M54.2,60.39C59.88,59.51,70.48,57.43,75.75,56.89C78.34,56.63,79.87,57.99,79.47,60.25C78.85,63.71,78.47,65.29,77.67,69.6"/>
<path id="個-s9"  class="stroke" stroke="#9a09bf" d="M56.6,72.15C62.63,71.38000000000001,68.88,70.88000000000001,75.5,70.59C76.83,70.53,78.05,70.64,79.09,70.58"/>
<path id="個-s10"  class="stroke" stroke="#bf0976" d="M43.69,86.74C54.62,86,77.73,84.3,90.75,83.97"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="個-bg1"  class="badge-group"><circle cx="31.26" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="31.26" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="個-bg2"  class="badge-group"><circle cx="24.28" cy="40.25" r="3.5" fill="#bf7609"/><text class="num-single" x="24.28" y="40.25" dx="0" dy="-0.5">2</text></g>
<g id="個-bg3"  class="badge-group"><circle cx="41.14" cy="21.93" r="3.5" fill="#9abf09"/><text class="num-single" x="41.14" y="21.93" dx="0" dy="-0.5">3</text></g>
<g id="個-bg4"  class="badge-group"><circle cx="43.65" cy="30.31" r="3.5" fill="#2dbf09"/><text class="num-single" x="43.65" y="30.31" dx="0" dy="-0.5">4</text></g>
<g id="個-bg5"  class="badge-group"><circle cx="50.36" cy="44.11" r="3.5" fill="#09bf52"/><text class="num-single" x="50.36" y="44.11" dx="0" dy="-0.5">5</text></g>
<g id="個-bg6"  class="badge-group"><circle cx="64.13" cy="26.74" r="3.5" fill="#09bfbf"/><text class="num-single" x="64.13" y="26.74" dx="0" dy="-0.5">6</text></g>
<g id="個-bg7"  class="badge-group"><circle cx="52.94" cy="55.52" r="3.5" fill="#0952bf"/><text class="num-single" x="52.94" y="55.52" dx="0" dy="-0.5">7</text></g>
<g id="個-bg8"  class="badge-group"><circle cx="54.2" cy="63.89" r="3.5" fill="#2d09bf"/><text class="num-single" x="54.2" y="63.89" dx="0" dy="-0.5">8</text></g>
<g id="個-bg9"  class="badge-group"><circle cx="56.6" cy="72.15" r="3.5" fill="#9a09bf"/><text class="num-single" x="56.6" y="72.15" dx="0" dy="-0.5">9</text></g>
<g id="個-bg10" class="badge-group"><circle cx="43.69" cy="86.74" r="3.5" fill="#bf0976"/><text class="num-double" x="43.69" y="86.74" dx="-0.4" dy="-0.475">10</text></g>
</svg>