<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (勇)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #勇-bg[i]: Thời gian quả bóng số nảy lên
   - #勇-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#勇-bg1  { animation-delay: 0.05s; }
#勇-s1   { stroke-dasharray: 66.2125; stroke-dashoffset: 66.2125; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#勇-bg2  { animation-delay: 0.56s; }
#勇-s2   { stroke-dasharray: 15.4894; stroke-dashoffset: 15.4894; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#勇-bg3  { animation-delay: 0.93s; }
#勇-s3   { stroke-dasharray: 28.4233; stroke-dashoffset: 28.4233; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#勇-bg4  { animation-delay: 1.30s; }
#勇-s4   { stroke-dasharray: 81.7046; stroke-dashoffset: 81.7046; animation: drawStroke 0.45s ease-out 1.43s forwards; }
#勇-bg5  { animation-delay: 1.90s; }
#勇-s5   { stroke-dasharray: 20.3395; stroke-dashoffset: 20.3395; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#勇-bg6  { animation-delay: 2.27s; }
#勇-s6   { stroke-dasharray: 50.7497; stroke-dashoffset: 50.7497; animation: drawStroke 0.28s ease-out 2.40s forwards; }
#勇-bg7  { animation-delay: 2.70s; }
#勇-s7   { stroke-dasharray: 46.5081; stroke-dashoffset: 46.5081; animation: drawStroke 0.26s ease-out 2.83s forwards; }
#勇-bg8  { animation-delay: 3.11s; }
#勇-s8   { stroke-dasharray: 96.2214; stroke-dashoffset: 96.2214; animation: drawStroke 0.53s ease-out 3.24s forwards; }
#勇-bg9  { animation-delay: 3.79s; }
#勇-s9   { stroke-dasharray: 49.7496; stroke-dashoffset: 49.7496; animation: drawStroke 0.27s ease-out 3.92s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #勇-s[i]) -->
<path id="勇-s1"  class="stroke" stroke="#bf0909" d="M32.96,13.82C35.620000000000005,14.620000000000001,37.4,14.55,39.65,14.25C46.98,13.26,68.36,10.23,71.00999999999999,9.940000000000001C74.05,9.610000000000001,74.88,11.38,72.77999999999999,12.98C71.24999999999999,14.15,61.499999999999986,21.5,55.219999999999985,26.28"/>
<path id="勇-s2"  class="stroke" stroke="#bf8209" d="M44.87,22.77C49.25,24,54.88,26.5,58.4,30"/>
<path id="勇-s3"  class="stroke" stroke="#82bf09" d="M26.5,32.54C27.48,33.519999999999996,27.82,34.91,28.02,35.98C28.88,40.589999999999996,30.02,49.44,30.939999999999998,56.76C31.099999999999998,58.01,31.24,59.22,31.38,60.349999999999994"/>
<path id="勇-s4"  class="stroke" stroke="#09bf09" d="M29,34.44C44.38,32.5,70.38,29.81,79.81,29.49C83.13,29.38,84.5,31.25,83.97,33.91C83.19,37.83,81.63,45.809999999999995,80.09,53.37C79.85000000000001,54.54,79.62,55.699999999999996,79.38000000000001,56.83"/>
<path id="勇-s5"  class="stroke" stroke="#09bf82" d="M54,34.91C54.86,35.769999999999996,55.26,36.879999999999995,55.26,38.25C55.26,45.22,55.199999999999996,52.96,55.199999999999996,54.92"/>
<path id="勇-s6"  class="stroke" stroke="#0982bf" d="M30.73,46.17C38.75,45.25,73.88,42,81.28,41.71"/>
<path id="勇-s7"  class="stroke" stroke="#0909bf" d="M32.37,58.14C47,56.87,63.129999999999995,55.75,78.75999999999999,54.85"/>
<path id="勇-s8"  class="stroke" stroke="#8209bf" d="M24.63,71.17C27.009999999999998,71.81,29.229999999999997,71.56,31.64,71.32000000000001C42.52,70.23,66.38,67.88000000000001,75.5,67C79.87,66.58,81.6,68.62,80.44,73.12C78.96,78.87,73.55,90.87,69.75,94.76C66.38,98.21000000000001,62.63,93.88000000000001,60.5,92.26"/>
<path id="勇-s9"  class="stroke" stroke="#bf0982" d="M54.66,60.59C54.75,61.43000000000001,54.63999999999999,62.77,54.22,63.980000000000004C51.14,72.93,43.12,86.63,22.89,96.44"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="勇-bg1"  class="badge-group"><circle cx="32.96" cy="13.82" r="3.5" fill="#bf0909"/><text class="num-single" x="32.96" y="13.82" dx="0" dy="-0.5">1</text></g>
<g id="勇-bg2"  class="badge-group"><circle cx="44.87" cy="22.77" r="3.5" fill="#bf8209"/><text class="num-single" x="44.87" y="22.77" dx="0" dy="-0.5">2</text></g>
<g id="勇-bg3"  class="badge-group"><circle cx="26.5" cy="29.04" r="3.5" fill="#82bf09"/><text class="num-single" x="26.5" y="29.04" dx="0" dy="-0.5">3</text></g>
<g id="勇-bg4"  class="badge-group"><circle cx="29" cy="37.94" r="3.5" fill="#09bf09"/><text class="num-single" x="29" y="37.94" dx="0" dy="-0.5">4</text></g>
<g id="勇-bg5"  class="badge-group"><circle cx="54" cy="34.91" r="3.5" fill="#09bf82"/><text class="num-single" x="54" y="34.91" dx="0" dy="-0.5">5</text></g>
