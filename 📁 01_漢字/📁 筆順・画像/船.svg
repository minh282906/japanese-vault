<path id="船-s4"  class="stroke" stroke="#4bbf09" d="M30.28,39.52C32.25,42,33,44.5,33.62,46.49"/>
<path id="船-s5"  class="stroke" stroke="#09bf2a" d="M30.55,56.64C31.64,57.730000000000004,32.25,59.68,32.25,60.95C32.25,65.25,32.08,71.62,32.08,77.5C32.08,79.25,32.1,80.5,32.1,81.91"/>
<path id="船-s6"  class="stroke" stroke="#09bf8d" d="M10,56.5C10.88,57.75,12.35,57.81,13.75,57.5S42.25,50.5,49.25,48.75"/>
<path id="船-s7"  class="stroke" stroke="#098dbf" d="M64.75,25C65.37,26.12,65.25,27.62,64.72,29.13C62.83,34.54,57.62,46.37,54,51.62"/>
<path id="船-s8"  class="stroke" stroke="#092abf" d="M72.5,19.75C77.87,20.13,84.5,38.129999999999995,91.96000000000001,45.2C94.08000000000001,47.21,95.62,48.13,97.37,49"/>
<path id="船-s9"  class="stroke" stroke="#4b09bf" d="M57.1,63.97C58.190000000000005,65.06,58.76,66.32,58.96,67.69C59.87,73.75,60.87,79.3,61.76,86.42C61.93,87.81,62.1,89.18,62.25,90.49000000000001"/>
<path id="船-s10"  class="stroke" stroke="#ae09bf" d="M59.25,64.99C68.5,63.74999999999999,82.16,62.39999999999999,87.43,62.23C89.58000000000001,62.16,90.88000000000001,63.629999999999995,90.5,65.45C89.54,70.16,87.25,77.75,85.63,85.03"/>
<path id="船-s11"  class="stroke" stroke="#bf096c" d="M63.33,87.53C70.63,87,76.97,86.67,84.75999999999999,86.33C85.85,86.28,86.94999999999999,86.24,88.05999999999999,86.19"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="船-bg1"  class="badge-group"><circle cx="33.2" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" x="33.2" y="13.5" dx="0" dy="-0.5">1</text></g>
<g id="船-bg2"  class="badge-group"><circle cx="19.4" cy="26.22" r="3.5" fill="#bf6c09"/><text class="num-single" x="19.4" y="26.22" dx="0" dy="-0.5">2</text></g>
<g id="船-bg3"  class="badge-group"><circle cx="22.02" cy="34.65" r="3.5" fill="#aebf09"/><text class="num-single" x="22.02" y="34.65" dx="0" dy="-0.5">3</text></g>
