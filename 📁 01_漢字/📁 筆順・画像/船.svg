<g id="船-bg7"  class="badge-group"><circle cx="64.75" cy="25" r="3.5" fill="#098dbf"/><text class="num-single" x="64.75" y="25" dx="0" dy="-0.5">7</text></g>
<g id="船-bg8"  class="badge-group"><circle cx="72.5" cy="19.75" r="3.5" fill="#092abf"/><text class="num-single" x="72.5" y="19.75" dx="0" dy="-0.5">8</text></g>
<g id="船-bg9"  class="badge-group"><circle cx="57.1" cy="60.47" r="3.5" fill="#4b09bf"/><text class="num-single" x="57.1" y="60.47" dx="0" dy="-0.5">9</text></g>
<g id="船-bg10" class="badge-group"><circle cx="59.25" cy="68.49" r="3.5" fill="#ae09bf"/><text class="num-double" x="59.25" y="68.49" dx="-0.4" dy="-0.475">10</text></g>
<g id="船-bg11" class="badge-group"><circle cx="63.33" cy="87.53" r="3.5" fill="#bf096c"/><text class="num-double" x="63.33" y="87.53" dx="-0.4" dy="-0.475">11</text></g>
</svg>