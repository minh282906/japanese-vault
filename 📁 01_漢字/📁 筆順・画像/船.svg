<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (船)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #船-bg[i]: Thời gian quả bóng số nảy lên
   - #船-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#船-bg1  { animation-delay: 0.05s; }
#船-s1   { stroke-dasharray: 14.5646; stroke-dashoffset: 14.5646; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#船-bg2  { animation-delay: 0.42s; }
#船-s2   { stroke-dasharray: 67.5006; stroke-dashoffset: 67.5006; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#船-bg3  { animation-delay: 0.94s; }
#船-s3   { stroke-dasharray: 95.0877; stroke-dashoffset: 95.0877; animation: drawStroke 0.52s ease-out 1.07s forwards; }
#船-bg4  { animation-delay: 1.61s; }
#船-s4   { stroke-dasharray: 7.7805; stroke-dashoffset: 7.7805; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#船-bg5  { animation-delay: 1.98s; }
#船-s5   { stroke-dasharray: 25.6938; stroke-dashoffset: 25.6938; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#船-bg6  { animation-delay: 2.35s; }
#船-s6   { stroke-dasharray: 40.7005; stroke-dashoffset: 40.7005; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#船-bg7  { animation-delay: 2.72s; }
#船-s7   { stroke-dasharray: 29.2126; stroke-dashoffset: 29.2126; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#船-bg8  { animation-delay: 3.09s; }
#船-s8   { stroke-dasharray: 39.1202; stroke-dashoffset: 39.1202; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#船-bg9  { animation-delay: 3.46s; }
#船-s9   { stroke-dasharray: 27.2729; stroke-dashoffset: 27.2729; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#船-bg10  { animation-delay: 3.83s; }
#船-s10   { stroke-dasharray: 53.7133; stroke-dashoffset: 53.7133; animation: drawStroke 0.30s ease-out 3.96s forwards; }
#船-bg11  { animation-delay: 4.28s; }
#船-s11   { stroke-dasharray: 24.7674; stroke-dashoffset: 24.7674; animation: drawStroke 0.22s ease-out 4.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #船-s[i]) -->
<path id="船-s1"  class="stroke" stroke="#bf0909" d="M33.2,13.5C33.620000000000005,14.620000000000001,33.64,15.71,33.2,17.22C32.24,20.5,30.740000000000002,23.38,28.740000000000002,27"/>
<path id="船-s2"  class="stroke" stroke="#bf6c09" d="M19.4,29.72C20.59,30.91,21.09,32.72,21.15,34.31C22.5,71.5,17.5,87.75,11.5,95"/>
