<path id="組-s7"  class="stroke" stroke="#098dbf" d="M54.21,21.59C55.18,22.56,55.64,24.12,55.64,25.65C55.64,26.54,55.76,71.17,55.76,84.99000000000001C55.76,87.22000000000001,55.76,88.65,55.75,88.96000000000001"/>
<path id="組-s8"  class="stroke" stroke="#092abf" d="M56.8,23.76C63.64,22.91,79.32,20.71,80.61,20.57C83.64,20.26,85.42,22.240000000000002,85.42,24.3C85.42,27.12,85.22,60.83,85.15,81.74C85.15,83.21,85.14,84.61,85.13000000000001,85.92999999999999"/>
<path id="組-s9"  class="stroke" stroke="#4b09bf" d="M56.88,45.15C64.64,44.15,77.33,42.96,84.15,42.65"/>
<path id="組-s10"  class="stroke" stroke="#ae09bf" d="M57.34,65.11C64.88000000000001,64.25,75.75,63.38,83.67,63.05"/>
<path id="組-s11"  class="stroke" stroke="#bf096c" d="M43.79,90.07C45.78,90.5,49.18,90.38999999999999,51.16,90.25C63.5,89.37,78.5,88.12,92.66999999999999,87.84C95.97999999999999,87.77000000000001,97.96999999999998,88.05,99.62999999999998,88.26"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="組-bg1"  class="badge-group"><circle cx="29.36" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" x="29.36" y="13.5" dx="0" dy="-0.5">1</text></g>
