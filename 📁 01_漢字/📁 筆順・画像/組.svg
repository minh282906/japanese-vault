<path id="組-s5"  class="stroke" stroke="#09bf2a" d="M19.63,69.88C19.82,71.19,19.919999999999998,72.14,19.439999999999998,73.33999999999999C17.9,77.13,14.559999999999999,83.61999999999999,12.749999999999996,86.50999999999999"/>
