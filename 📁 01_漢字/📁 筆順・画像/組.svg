<path id="組-s1"  class="stroke" stroke="#bf0909" d="M29.36,13.5C29.89,15.5,29.57,16.82,28.43,18.53C24.81,24,20.5,30.75,16.47,35.03C15.829999999999998,35.71,15.749999999999998,37.25,16.97,37.730000000000004C20.509999999999998,39.120000000000005,24.479999999999997,40.650000000000006,27.549999999999997,42.99"/>
