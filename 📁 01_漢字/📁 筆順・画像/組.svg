<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (組)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #組-bg[i]: Thời gian quả bóng số nảy lên
   - #組-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#組-bg1  { animation-delay: 0.05s; }
#組-s1   { stroke-dasharray: 40.7821; stroke-dashoffset: 40.7821; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#組-bg2  { animation-delay: 0.42s; }
#組-s2   { stroke-dasharray: 68.0954; stroke-dashoffset: 68.0954; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#組-bg3  { animation-delay: 0.94s; }
#組-s3   { stroke-dasharray: 13.9108; stroke-dashoffset: 13.9108; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#組-bg4  { animation-delay: 1.31s; }
#組-s4   { stroke-dasharray: 37.4659; stroke-dashoffset: 37.4659; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#組-bg5  { animation-delay: 1.68s; }
#組-s5   { stroke-dasharray: 18.2976; stroke-dashoffset: 18.2976; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#組-bg6  { animation-delay: 2.05s; }
#組-s6   { stroke-dasharray: 16.3114; stroke-dashoffset: 16.3114; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#組-bg7  { animation-delay: 2.42s; }
#組-s7   { stroke-dasharray: 67.7216; stroke-dashoffset: 67.7216; animation: drawStroke 0.37s ease-out 2.55s forwards; }
#組-bg8  { animation-delay: 2.94s; }
#組-s8   { stroke-dasharray: 92.5594; stroke-dashoffset: 92.5594; animation: drawStroke 0.51s ease-out 3.07s forwards; }
#組-bg9  { animation-delay: 3.60s; }
#組-s9   { stroke-dasharray: 27.3898; stroke-dashoffset: 27.3898; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#組-bg10  { animation-delay: 3.97s; }
#組-s10   { stroke-dasharray: 26.4151; stroke-dashoffset: 26.4151; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#組-bg11  { animation-delay: 4.34s; }
#組-s11   { stroke-dasharray: 55.9571; stroke-dashoffset: 55.9571; animation: drawStroke 0.31s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

