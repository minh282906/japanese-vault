<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (初)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #初-bg[i]: Thời gian quả bóng số nảy lên
   - #初-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#初-bg1  { animation-delay: 0.05s; }
#初-s1   { stroke-dasharray: 13.3480; stroke-dashoffset: 13.3480; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#初-bg2  { animation-delay: 0.42s; }
#初-s2   { stroke-dasharray: 86.0058; stroke-dashoffset: 86.0058; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#初-bg3  { animation-delay: 1.04s; }
#初-s3   { stroke-dasharray: 47.1976; stroke-dashoffset: 47.1976; animation: drawStroke 0.26s ease-out 1.17s forwards; }
#初-bg4  { animation-delay: 1.45s; }
#初-s4   { stroke-dasharray: 12.9912; stroke-dashoffset: 12.9912; animation: drawStroke 0.22s ease-out 1.58s forwards; }
#初-bg5  { animation-delay: 1.82s; }
#初-s5   { stroke-dasharray: 14.1807; stroke-dashoffset: 14.1807; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#初-bg6  { animation-delay: 2.19s; }
#初-s6   { stroke-dasharray: 112.6190; stroke-dashoffset: 112.6190; animation: drawStroke 0.55s ease-out 2.32s forwards; }
#初-bg7  { animation-delay: 2.89s; }
#初-s7   { stroke-dasharray: 55.9326; stroke-dashoffset: 55.9326; animation: drawStroke 0.31s ease-out 3.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #初-s[i]) -->
<path id="初-s1"  class="stroke" stroke="#bf0909" d="M26.95,11.12C29.8,13.44,33.39,16.93,35.83,21"/>
<path id="初-s2"  class="stroke" stroke="#bfa509" d="M13.58,31C14.59,31.45,16.61,31.66,18.34,31.45C24.13,30.759999999999998,38.010000000000005,27.13,41.58,25.75C44.019999999999996,24.81,46,26.95,44.58,29.25C36.25,42.75,24.75,57.5,12.25,68.25"/>
<path id="初-s3"  class="stroke" stroke="#3dbf09" d="M31.75,49.86C32.51,50.62,33.02,51.88,33.02,53.75C33.02,62.51,33.050000000000004,81.41,33.07,91.13C33.07,93.89999999999999,33.08,95.92,33.08,96.75"/>
<path id="初-s4"  class="stroke" stroke="#09bf71" d="M46.5,42.14C46.7,42.99,46.4,43.97,46,44.59C44.8,46.46,41.35,50.040000000000006,38.95,52.25"/>
<path id="初-s5"  class="stroke" stroke="#0971bf" d="M36.75,54.62C40.38,57.07,43.730000000000004,60.23,46.83,64.49"/>
<path id="初-s6"  class="stroke" stroke="#3d09bf" d="M53.26,37.63C55.1,38.32,57.42,38.230000000000004,59.019999999999996,38C72.13,36.09,82.16,33.86,89.42999999999999,33.15C94.16,32.69,95.75999999999999,34.519999999999996,95.5,37.72C94.81,46.17,86.33,79.43,79.62,88.93C75.13000000000001,95.29,72.25,91.37,69.01,88.99000000000001"/>
<path id="初-s7"  class="stroke" stroke="#bf09a5" d="M70.13,40.12C70.56,41.279999999999994,70.47,42.94,69.97,44.43C65.12,58.88,57.38,76.5,43.75,88.08"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="初-bg1"  class="badge-group"><circle cx="26.95" cy="11.12" r="3.5" fill="#bf0909"/><text class="num-single" x="26.95" y="11.12" dx="0" dy="-0.5">1</text></g>
<g id="初-bg2"  class="badge-group"><circle cx="13.58" cy="31" r="3.5" fill="#bfa509"/><text class="num-single" x="13.58" y="31" dx="0" dy="-0.5">2</text></g>
<g id="初-bg3"  class="badge-group"><circle cx="31.75" cy="46.36" r="3.5" fill="#3dbf09"/><text class="num-single" x="31.75" y="46.36" dx="0" dy="-0.5">3</text></g>
<g id="初-bg4"  class="badge-group"><circle cx="46.5" cy="42.14" r="3.5" fill="#09bf71"/><text class="num-single" x="46.5" y="42.14" dx="0" dy="-0.5">4</text></g>
<g id="初-bg5"  class="badge-group"><circle cx="36.75" cy="58.12" r="3.5" fill="#0971bf"/><text class="num-single" x="36.75" y="58.12" dx="0" dy="-0.5">5</text></g>
<g id="初-bg6"  class="badge-group"><circle cx="53.26" cy="37.63" r="3.5" fill="#3d09bf"/><text class="num-single" x="53.26" y="37.63" dx="0" dy="-0.5">6</text></g>
<g id="初-bg7"  class="badge-group"><circle cx="70.13" cy="40.12" r="3.5" fill="#bf09a5"/><text class="num-single" x="70.13" y="40.12" dx="0" dy="-0.5">7</text></g>
</svg>