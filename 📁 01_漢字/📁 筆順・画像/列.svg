<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (列)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #列-bg[i]: Thời gian quả bóng số nảy lên
   - #列-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#列-bg1  { animation-delay: 0.05s; }
#列-s1   { stroke-dasharray: 41.3352; stroke-dashoffset: 41.3352; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#列-bg2  { animation-delay: 0.43s; }
#列-s2   { stroke-dasharray: 42.9387; stroke-dashoffset: 42.9387; animation: drawStroke 0.24s ease-out 0.56s forwards; }
#列-bg3  { animation-delay: 0.82s; }
#列-s3   { stroke-dasharray: 87.5092; stroke-dashoffset: 87.5092; animation: drawStroke 0.48s ease-out 0.95s forwards; }
#列-bg4  { animation-delay: 1.45s; }
#列-s4   { stroke-dasharray: 15.3804; stroke-dashoffset: 15.3804; animation: drawStroke 0.22s ease-out 1.58s forwards; }
#列-bg5  { animation-delay: 1.82s; }
#列-s5   { stroke-dasharray: 35.0994; stroke-dashoffset: 35.0994; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#列-bg6  { animation-delay: 2.19s; }
#列-s6   { stroke-dasharray: 85.5476; stroke-dashoffset: 85.5476; animation: drawStroke 0.47s ease-out 2.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #列-s[i]) -->
<path id="列-s1"  class="stroke" stroke="#bf0909" d="M16.25,24.98C18.75,25.62,21.41,25.400000000000002,23.759999999999998,25.080000000000002C30.979999999999997,24.1,42.93,22.130000000000003,50.239999999999995,21.470000000000002C52.62,21.250000000000004,54.919999999999995,21.1,57.239999999999995,21.76"/>
<path id="列-s2"  class="stroke" stroke="#bfbf09" d="M37.11,25.65C37.339999999999996,26.27,37.4,27.38,37.06,28.59C34.75,36.62,26.5,52.38,14.48,60.8"/>
<path id="列-s3"  class="stroke" stroke="#09bf09" d="M35.81,39.06C37,39.620000000000005,38,39.370000000000005,39.17,39.17C41.89,38.7,43.370000000000005,38.370000000000005,47.550000000000004,37.11C50.220000000000006,36.3,51.86000000000001,38.06,51.330000000000005,40.69C48.25,56,30,85.38,12.27,95.75"/>
<path id="列-s4"  class="stroke" stroke="#09bfbf" d="M26.25,54C30.259999999999998,55.77,36.6,61.29,37.6,64.05"/>
<path id="列-s5"  class="stroke" stroke="#0909bf" d="M68.77,28.87C69.95,30.05,70.53,31.380000000000003,70.53,33.64C70.53,45.1,70.53,53.14,70.53,58.379999999999995C70.53,60.339999999999996,70.53,62.01,70.53,63.49999999999999"/>
<path id="列-s6"  class="stroke" stroke="#bf09bf" d="M87.02,16.58C88.35,17.909999999999997,89.03,19.32,89.03,22.349999999999998C89.03,38.5,89.02,81.25,89.02,87.47C89.02,97.75,81.81,88.97,80.31,87.72"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="列-bg1"  class="badge-group"><circle cx="16.25" cy="24.98" r="3.5" fill="#bf0909"/><text class="num-single" x="16.25" y="24.98" dx="0" dy="-0.5">1</text></g>
<g id="列-bg2"  class="badge-group"><circle cx="37.11" cy="25.65" r="3.5" fill="#bfbf09"/><text class="num-single" x="37.11" y="25.65" dx="0" dy="-0.5">2</text></g>
<g id="列-bg3"  class="badge-group"><circle cx="35.81" cy="39.06" r="3.5" fill="#09bf09"/><text class="num-single" x="35.81" y="39.06" dx="0" dy="-0.5">3</text></g>
<g id="列-bg4"  class="badge-group"><circle cx="26.25" cy="54" r="3.5" fill="#09bfbf"/><text class="num-single" x="26.25" y="54" dx="0" dy="-0.5">4</text></g>
<g id="列-bg5"  class="badge-group"><circle cx="68.77" cy="28.87" r="3.5" fill="#0909bf"/><text class="num-single" x="68.77" y="28.87" dx="0" dy="-0.5">5</text></g>
<g id="列-bg6"  class="badge-group"><circle cx="87.02" cy="16.58" r="3.5" fill="#bf09bf"/><text class="num-single" x="87.02" y="16.58" dx="0" dy="-0.5">6</text></g>
</svg>