<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (事)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #事-bg[i]: Thời gian quả bóng số nảy lên
   - #事-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#事-bg1  { animation-delay: 0.05s; }
#事-s1   { stroke-dasharray: 80.7291; stroke-dashoffset: 80.7291; animation: drawStroke 0.44s ease-out 0.18s forwards; }
#事-bg2  { animation-delay: 0.64s; }
#事-s2   { stroke-dasharray: 14.0598; stroke-dashoffset: 14.0598; animation: drawStroke 0.22s ease-out 0.77s forwards; }
#事-bg3  { animation-delay: 1.01s; }
#事-s3   { stroke-dasharray: 54.7167; stroke-dashoffset: 54.7167; animation: drawStroke 0.30s ease-out 1.14s forwards; }
#事-bg4  { animation-delay: 1.46s; }
#事-s4   { stroke-dasharray: 41.6571; stroke-dashoffset: 41.6571; animation: drawStroke 0.23s ease-out 1.59s forwards; }
#事-bg5  { animation-delay: 1.84s; }
#事-s5   { stroke-dasharray: 72.5528; stroke-dashoffset: 72.5528; animation: drawStroke 0.40s ease-out 1.97s forwards; }
#事-bg6  { animation-delay: 2.39s; }
#事-s6   { stroke-dasharray: 79.7175; stroke-dashoffset: 79.7175; animation: drawStroke 0.44s ease-out 2.52s forwards; }
#事-bg7  { animation-delay: 2.98s; }
#事-s7   { stroke-dasharray: 48.9363; stroke-dashoffset: 48.9363; animation: drawStroke 0.27s ease-out 3.11s forwards; }
#事-bg8  { animation-delay: 3.40s; }
#事-s8   { stroke-dasharray: 97.4674; stroke-dashoffset: 97.4674; animation: drawStroke 0.54s ease-out 3.53s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #事-s[i]) -->
<path id="事-s1"  class="stroke" stroke="#bf0909" d="M14.25,24.95C16.09,25.49,19.48,25.63,21.32,25.49C38.09,24.25,67.71000000000001,21.25,88.28999999999999,21.259999999999998C91.36999999999999,21.259999999999998,93.21,21.52,94.74999999999999,21.79"/>
<path id="事-s2"  class="stroke" stroke="#bf9109" d="M30.51,34.23C30.860000000000003,34.459999999999994,31.220000000000002,34.65,31.37,34.93C32.410000000000004,36.88,33.27,41.79,34.01,45.71C34.18,46.59,34.239999999999995,46.92,34.36,47.49"/>
<path id="事-s3"  class="stroke" stroke="#64bf09" d="M32.94,35.01C41.25,34,65.44,32.059999999999995,74.02,31.419999999999998C76.45,31.24,77.83,32.75,77.06,35.01C76.33,37.15,75.54,39.58,74.58,42.25"/>
<path id="事-s4"  class="stroke" stroke="#09bf36" d="M35.28,45.51C39.49,45.21,62.400000000000006,43.58,72.63,42.83C74.08,42.72,75.63,42.489999999999995,76.82,42.82"/>
<path id="事-s5"  class="stroke" stroke="#09bfbf" d="M27.5,55.89C30,56.63,31.7,56.9,34,56.76C47.49,55.919999999999995,62.510000000000005,54.62,73.74000000000001,53.839999999999996C77.46000000000001,53.58,79.7,54.65,78.73,58.629999999999995C77.52000000000001,63.599999999999994,76.13000000000001,66.39,74.49000000000001,75.49"/>
<path id="事-s6"  class="stroke" stroke="#0936bf" d="M14.75,68C17.5,68.75,19.490000000000002,68.65,22.43,68.43C45.370000000000005,66.74000000000001,65.87,65.24000000000001,86.86000000000001,64.26C90.12000000000002,64.11,92.77000000000001,64.44000000000001,94.25000000000001,64.66000000000001"/>
<path id="事-s7"  class="stroke" stroke="#6409bf" d="M27.5,79.85C29.5,80.25,31.009999999999998,80.36999999999999,32.5,80.25C46.25,79.17,59,77.43,71.5,77C73.5,76.93,74.75,77,76.25,77.22"/>
<path id="事-s8"  class="stroke" stroke="#bf0991" d="M52.77,10.08C54.220000000000006,11.53,54.78,12.75,54.78,15.1C54.78,29.66,54.77,87.50999999999999,54.77,92.47C54.77,102.13,49.86,95.89,46.06,92.72"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="事-bg1"  class="badge-group"><circle cx="14.25" cy="24.95" r="3.5" fill="#bf0909"/><text class="num-single" x="14.25" y="24.95" dx="0" dy="-0.5">1</text></g>
<g id="事-bg2"  class="badge-group"><circle cx="30.51" cy="30.73" r="3.5" fill="#bf9109"/><text class="num-single" x="30.51" y="30.73" dx="0" dy="-0.5">2</text></g>
<g id="事-bg3"  class="badge-group"><circle cx="32.94" cy="38.51" r="3.5" fill="#64bf09"/><text class="num-single" x="32.94" y="38.51" dx="0" dy="-0.5">3</text></g>
<g id="事-bg4"  class="badge-group"><circle cx="35.28" cy="45.51" r="3.5" fill="#09bf36"/><text class="num-single" x="35.28" y="45.51" dx="0" dy="-0.5">4</text></g>
<g id="事-bg5"  class="badge-group"><circle cx="27.5" cy="55.89" r="3.5" fill="#09bfbf"/><text class="num-single" x="27.5" y="55.89" dx="0" dy="-0.5">5</text></g>
<g id="事-bg6"  class="badge-group"><circle cx="14.75" cy="68" r="3.5" fill="#0936bf"/><text class="num-single" x="14.75" y="68" dx="0" dy="-0.5">6</text></g>
<g id="事-bg7"  class="badge-group"><circle cx="27.5" cy="79.85" r="3.5" fill="#6409bf"/><text class="num-single" x="27.5" y="79.85" dx="0" dy="-0.5">7</text></g>
<g id="事-bg8"  class="badge-group"><circle cx="52.77" cy="10.08" r="3.5" fill="#bf0991"/><text class="num-single" x="52.77" y="10.08" dx="0" dy="-0.5">8</text></g>
</svg>