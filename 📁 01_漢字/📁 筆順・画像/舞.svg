<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (舞)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #舞-bg[i]: Thời gian quả bóng số nảy lên
   - #舞-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#舞-bg1  { animation-delay: 0.05s; }
#舞-s1   { stroke-dasharray: 27.9742; stroke-dashoffset: 27.9742; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#舞-bg2  { animation-delay: 0.42s; }
#舞-s2   { stroke-dasharray: 50.8597; stroke-dashoffset: 50.8597; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#舞-bg3  { animation-delay: 0.85s; }
#舞-s3   { stroke-dasharray: 80.5113; stroke-dashoffset: 80.5113; animation: drawStroke 0.44s ease-out 0.98s forwards; }
#舞-bg4  { animation-delay: 1.44s; }
#舞-s4   { stroke-dasharray: 23.2324; stroke-dashoffset: 23.2324; animation: drawStroke 0.22s ease-out 1.57s forwards; }
#舞-bg5  { animation-delay: 1.81s; }
#舞-s5   { stroke-dasharray: 23.6253; stroke-dashoffset: 23.6253; animation: drawStroke 0.22s ease-out 1.94s forwards; }
#舞-bg6  { animation-delay: 2.18s; }
#舞-s6   { stroke-dasharray: 24.8841; stroke-dashoffset: 24.8841; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#舞-bg7  { animation-delay: 2.55s; }
#舞-s7   { stroke-dasharray: 25.5414; stroke-dashoffset: 25.5414; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#舞-bg8  { animation-delay: 2.92s; }
#舞-s8   { stroke-dasharray: 68.3557; stroke-dashoffset: 68.3557; animation: drawStroke 0.38s ease-out 3.05s forwards; }
#舞-bg9  { animation-delay: 3.45s; }
#舞-s9   { stroke-dasharray: 24.7091; stroke-dashoffset: 24.7091; animation: drawStroke 0.22s ease-out 3.58s forwards; }
#舞-bg10  { animation-delay: 3.82s; }
#舞-s10   { stroke-dasharray: 70.4180; stroke-dashoffset: 70.4180; animation: drawStroke 0.39s ease-out 3.95s forwards; }
#舞-bg11  { animation-delay: 4.36s; }
#舞-s11   { stroke-dasharray: 9.5011; stroke-dashoffset: 9.5011; animation: drawStroke 0.22s ease-out 4.49s forwards; }
#舞-bg12  { animation-delay: 4.73s; }
#舞-s12   { stroke-dasharray: 23.9889; stroke-dashoffset: 23.9889; animation: drawStroke 0.22s ease-out 4.86s forwards; }
#舞-bg13  { animation-delay: 5.10s; }
#舞-s13   { stroke-dasharray: 16.4243; stroke-dashoffset: 16.4243; animation: drawStroke 0.22s ease-out 5.23s forwards; }
#舞-bg14  { animation-delay: 5.47s; }
#舞-s14   { stroke-dasharray: 45.4516; stroke-dashoffset: 45.4516; animation: drawStroke 0.25s ease-out 5.60s forwards; }
#舞-bg15  { animation-delay: 5.87s; }
#舞-s15   { stroke-dasharray: 49.0970; stroke-dashoffset: 49.0970; animation: drawStroke 0.27s ease-out 6.00s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
