<path id="舞-s9"  class="stroke" stroke="#099abf" d="M32.21,56.39C32.37,57.37,32.1,58.21,31.78,58.89C29.650000000000002,63.34,24.86,69.71000000000001,17.5,75.58"/>
<path id="舞-s10"  class="stroke" stroke="#0952bf" d="M33.95,60.7C34.21,60.730000000000004,36.34,60.78,37.07,60.6C40.5,59.75,43.07,58.86,46.33,57.67C48.67,56.82,49.8,58.72,49.05,60.46C44.75,70.5,32.38,88.62,13.5,97.5"/>
<path id="舞-s11"  class="stroke" stroke="#0909bf" d="M28.12,70C30.51,71.14,34.29,74.69,34.89,76.47"/>
