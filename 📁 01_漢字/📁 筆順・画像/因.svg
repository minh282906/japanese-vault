<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (因)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #因-bg[i]: Thời gian quả bóng số nảy lên
   - #因-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#因-bg1  { animation-delay: 0.05s; }
#因-s1   { stroke-dasharray: 81.4064; stroke-dashoffset: 81.4064; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#因-bg2  { animation-delay: 0.65s; }
#因-s2   { stroke-dasharray: 147.5330; stroke-dashoffset: 147.5330; animation: drawStroke 0.55s ease-out 0.78s forwards; }
#因-bg3  { animation-delay: 1.35s; }
#因-s3   { stroke-dasharray: 47.1568; stroke-dashoffset: 47.1568; animation: drawStroke 0.26s ease-out 1.48s forwards; }
#因-bg4  { animation-delay: 1.76s; }
#因-s4   { stroke-dasharray: 66.9418; stroke-dashoffset: 66.9418; animation: drawStroke 0.37s ease-out 1.89s forwards; }
#因-bg5  { animation-delay: 2.28s; }
#因-s5   { stroke-dasharray: 35.6191; stroke-dashoffset: 35.6191; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#因-bg6  { animation-delay: 2.65s; }
#因-s6   { stroke-dasharray: 66.2982; stroke-dashoffset: 66.2982; animation: drawStroke 0.36s ease-out 2.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #因-s[i]) -->
<path id="因-s1"  class="stroke" stroke="#bf0909" d="M18.75,16.32C19.97,17.54,20.61,19.33,20.61,21.23C20.61,33.43,20.56,69.83,20.55,89.63000000000001C20.55,92.59,20.55,95.17000000000002,20.55,97.25000000000001"/>
<path id="因-s2"  class="stroke" stroke="#bfbf09" d="M21.23,18.4C40.129999999999995,17.13,72.68,15.249999999999998,84.75,15.249999999999998C87.5,15.249999999999998,89.3,16.99,89.25,20C89.03,33.86,89.2,65.05,89.24,87.75C89.25,90.85,89.25,93.79,89.25,96.5"/>
<path id="因-s3"  class="stroke" stroke="#09bf09" d="M32.11,45.55C34.31,46.08,36.8,45.779999999999994,39,45.55C49.93,44.39,62.620000000000005,43.099999999999994,72.64,42.23C74.79,42.04,77,41.879999999999995,79.05,42.23"/>
<path id="因-s4"  class="stroke" stroke="#09bfbf" d="M53.55,24.5C53.959999999999994,25.31,54.169999999999995,26.23,54.16,27.97C54.12,56.38,46,73,29.75,83.25"/>
<path id="因-s5"  class="stroke" stroke="#0909bf" d="M54.97,54.31C63.15,59.85,73.46,69.81,78.41,80.61"/>
<path id="因-s6"  class="stroke" stroke="#bf09bf" d="M21.75,94.51C41.62,93.75,69.96,92.41,88,92"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="因-bg1"  class="badge-group"><circle cx="18.75" cy="12.82" r="3.5" fill="#bf0909"/><text class="num-single" x="18.75" y="12.82" dx="0" dy="-0.5">1</text></g>
<g id="因-bg2"  class="badge-group"><circle cx="21.23" cy="21.9" r="3.5" fill="#bfbf09"/><text class="num-single" x="21.23" y="21.9" dx="0" dy="-0.5">2</text></g>
<g id="因-bg3"  class="badge-group"><circle cx="32.11" cy="45.55" r="3.5" fill="#09bf09"/><text class="num-single" x="32.11" y="45.55" dx="0" dy="-0.5">3</text></g>
<g id="因-bg4"  class="badge-group"><circle cx="53.55" cy="24.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.55" y="24.5" dx="0" dy="-0.5">4</text></g>
<g id="因-bg5"  class="badge-group"><circle cx="54.97" cy="54.31" r="3.5" fill="#0909bf"/><text class="num-single" x="54.97" y="54.31" dx="0" dy="-0.5">5</text></g>
<g id="因-bg6"  class="badge-group"><circle cx="21.75" cy="94.51" r="3.5" fill="#bf09bf"/><text class="num-single" x="21.75" y="94.51" dx="0" dy="-0.5">6</text></g>
</svg>