<path id="頂-s1"  class="stroke" stroke="#bf0909" d="M10.2,28.38C12.139999999999999,29.14,15.469999999999999,28.869999999999997,17.509999999999998,28.65C24.589999999999996,27.91,34.43,26.869999999999997,40.76,26.15C42.83,25.91,45.379999999999995,25.63,47.309999999999995,25.9"/>
