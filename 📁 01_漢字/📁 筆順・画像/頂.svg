<path id="頂-s5"  class="stroke" stroke="#09bf2a" d="M54.14,33.71C55.03,34.6,55.43,36.03,55.43,37.410000000000004C55.43,38.370000000000005,55.38,60.580000000000005,55.37,73.62C55.37,75.45,55.37,77.11,55.37,78.5"/>
<path id="頂-s6"  class="stroke" stroke="#09bf8d" d="M56.06,35.09C59.04,34.92,83.25,32.03,85.96000000000001,31.830000000000005C88.22000000000001,31.660000000000004,89.81,32.870000000000005,89.81,35.040000000000006C89.81,37.870000000000005,89.71000000000001,56.71000000000001,89.69,72C89.69,73.84,89.69,75.61,89.69,77.25"/>
<path id="頂-s7"  class="stroke" stroke="#098dbf" d="M56.26,48.05C62.62,47.25,82.44,45.15,88.81,44.779999999999994"/>
<path id="頂-s8"  class="stroke" stroke="#092abf" d="M56.51,61.07C65,60.25,80.31,58.77,88.45,58.28"/>
<path id="頂-s9"  class="stroke" stroke="#4b09bf" d="M56.53,75.1C65.25,74,80.05,73.13,88.72,72.61"/>
<path id="頂-s10"  class="stroke" stroke="#ae09bf" d="M63.64,80.24C64.06,81.55,63.47,82.66,62.64,83.61C60.14,86.5,53.2,92.59,48.2,96"/>
<path id="頂-s11"  class="stroke" stroke="#bf096c" d="M79.27,80.01C85.42999999999999,84.32000000000001,92.69999999999999,92.13000000000001,94.38,95.9"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="頂-bg1"  class="badge-group"><circle cx="10.2" cy="28.38" r="3.5" fill="#bf0909"/><text class="num-single" x="10.2" y="28.38" dx="0" dy="-0.5">1</text></g>
