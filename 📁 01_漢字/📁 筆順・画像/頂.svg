<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (頂)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #頂-bg[i]: Thời gian quả bóng số nảy lên
   - #頂-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#頂-bg1  { animation-delay: 0.05s; }
#頂-s1   { stroke-dasharray: 37.3286; stroke-dashoffset: 37.3286; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#頂-bg2  { animation-delay: 0.42s; }
#頂-s2   { stroke-dasharray: 71.3928; stroke-dashoffset: 71.3928; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#頂-bg3  { animation-delay: 0.96s; }
#頂-s3   { stroke-dasharray: 45.8005; stroke-dashoffset: 45.8005; animation: drawStroke 0.25s ease-out 1.09s forwards; }
#頂-bg4  { animation-delay: 1.36s; }
#頂-s4   { stroke-dasharray: 13.9618; stroke-dashoffset: 13.9618; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#頂-bg5  { animation-delay: 1.73s; }
#頂-s5   { stroke-dasharray: 45.1060; stroke-dashoffset: 45.1060; animation: drawStroke 0.25s ease-out 1.86s forwards; }
#頂-bg6  { animation-delay: 2.13s; }
#頂-s6   { stroke-dasharray: 78.0254; stroke-dashoffset: 78.0254; animation: drawStroke 0.43s ease-out 2.26s forwards; }
#頂-bg7  { animation-delay: 2.71s; }
#頂-s7   { stroke-dasharray: 32.7165; stroke-dashoffset: 32.7165; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#頂-bg8  { animation-delay: 3.08s; }
#頂-s8   { stroke-dasharray: 32.0629; stroke-dashoffset: 32.0629; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#頂-bg9  { animation-delay: 3.45s; }
#頂-s9   { stroke-dasharray: 32.2908; stroke-dashoffset: 32.2908; animation: drawStroke 0.22s ease-out 3.58s forwards; }
#頂-bg10  { animation-delay: 3.82s; }
#頂-s10   { stroke-dasharray: 22.7538; stroke-dashoffset: 22.7538; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#頂-bg11  { animation-delay: 4.19s; }
#頂-s11   { stroke-dasharray: 22.0892; stroke-dashoffset: 22.0892; animation: drawStroke 0.22s ease-out 4.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

