<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (政)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #政-bg[i]: Thời gian quả bóng số nảy lên
   - #政-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#政-bg1  { animation-delay: 0.05s; }
#政-s1   { stroke-dasharray: 31.7776; stroke-dashoffset: 31.7776; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#政-bg2  { animation-delay: 0.42s; }
#政-s2   { stroke-dasharray: 51.5695; stroke-dashoffset: 51.5695; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#政-bg3  { animation-delay: 0.85s; }
#政-s3   { stroke-dasharray: 13.5151; stroke-dashoffset: 13.5151; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#政-bg4  { animation-delay: 1.22s; }
#政-s4   { stroke-dasharray: 31.3827; stroke-dashoffset: 31.3827; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#政-bg5  { animation-delay: 1.59s; }
#政-s5   { stroke-dasharray: 38.3886; stroke-dashoffset: 38.3886; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#政-bg6  { animation-delay: 1.96s; }
#政-s6   { stroke-dasharray: 34.7920; stroke-dashoffset: 34.7920; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#政-bg7  { animation-delay: 2.33s; }
#政-s7   { stroke-dasharray: 32.3644; stroke-dashoffset: 32.3644; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#政-bg8  { animation-delay: 2.70s; }
#政-s8   { stroke-dasharray: 64.6671; stroke-dashoffset: 64.6671; animation: drawStroke 0.36s ease-out 2.83s forwards; }
#政-bg9  { animation-delay: 3.21s; }
#政-s9   { stroke-dasharray: 55.5898; stroke-dashoffset: 55.5898; animation: drawStroke 0.31s ease-out 3.34s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #政-s[i]) -->
<path id="政-s1"  class="stroke" stroke="#bf0909" d="M16.63,25.09C18.02,25.6,19.93,25.37,21.38,25.31C27.88,25.049999999999997,37.379999999999995,23.279999999999998,43.9,22.29C45.449999999999996,22.06,46.61,21.93,48.129999999999995,22.259999999999998"/>
<path id="政-s2"  class="stroke" stroke="#bf8209" d="M31.46,27.37C32.550000000000004,28.46,33.22,30.25,33.22,32.160000000000004C33.22,46.78,33.21,73.53,33.21,78.5"/>
<path id="政-s3"  class="stroke" stroke="#82bf09" d="M34.28,48.98C36.75,48.5,41.25,47.75,45.63,47.13999999999999C46.34,47.03999999999999,47.28,47.21999999999999,47.63,47.29999999999999"/>
<path id="政-s4"  class="stroke" stroke="#09bf09" d="M16.04,52.62C17.029999999999998,53.61,17.599999999999998,55.28,17.759999999999998,57.239999999999995C18.58,67.07,19.049999999999997,73.78999999999999,20,83.5"/>
<path id="政-s5"  class="stroke" stroke="#09bf82" d="M11.46,86.32C12.420000000000002,87.17999999999999,14.13,87.02,15.030000000000001,86.64999999999999C22.82,83.39999999999999,30.450000000000003,80.74999999999999,47.25,73.94"/>
<path id="政-s6"  class="stroke" stroke="#0982bf" d="M64.62,16C64.65,16.75,64.84,17.99,64.55000000000001,19.03C62.72000000000001,25.68,58.84000000000001,39.05,52.500000000000014,48.25"/>
<path id="政-s7"  class="stroke" stroke="#0909bf" d="M61.84,38.03C63.32,37.97,64.81,37.99,66.27000000000001,37.75C73.13000000000001,36.63,80.88000000000001,35.25,88.77000000000001,33.75C90.22000000000001,33.47,92.35000000000001,33.45,93.80000000000001,33.86"/>
<path id="政-s8"  class="stroke" stroke="#8209bf" d="M78.6,41.25C79.13,42.53,79.16999999999999,43.94,78.61,46.28C73.57,67.53,63.25,84.5,45.51,93.4"/>
<path id="政-s9"  class="stroke" stroke="#bf0982" d="M54.19,53.43C60.93,59.87,76.45,79.25,87.4,88.5C89.26,90.07,90.74000000000001,91.26,93.24000000000001,92.8"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="政-bg1"  class="badge-group"><circle cx="16.63" cy="25.09" r="3.5" fill="#bf0909"/><text class="num-single" x="16.63" y="25.09" dx="0" dy="-0.5">1</text></g>
<g id="政-bg2"  class="badge-group"><circle cx="31.46" cy="27.37" r="3.5" fill="#bf8209"/><text class="num-single" x="31.46" y="27.37" dx="0" dy="-0.5">2</text></g>
<g id="政-bg3"  class="badge-group"><circle cx="34.28" cy="48.98" r="3.5" fill="#82bf09"/><text class="num-single" x="34.28" y="48.98" dx="0" dy="-0.5">3</text></g>
<g id="政-bg4"  class="badge-group"><circle cx="16.04" cy="52.62" r="3.5" fill="#09bf09"/><text class="num-single" x="16.04" y="52.62" dx="0" dy="-0.5">4</text></g>
<g id="政-bg5"  class="badge-group"><circle cx="11.46" cy="86.32" r="3.5" fill="#09bf82"/><text class="num-single" x="11.46" y="86.32" dx="0" dy="-0.5">5</text></g>
<g id="政-bg6"  class="badge-group"><circle cx="64.62" cy="16" r="3.5" fill="#0982bf"/><text class="num-single" x="64.62" y="16" dx="0" dy="-0.5">6</text></g>
<g id="政-bg7"  class="badge-group"><circle cx="61.84" cy="38.03" r="3.5" fill="#0909bf"/><text class="num-single" x="61.84" y="38.03" dx="0" dy="-0.5">7</text></g>
<g id="政-bg8"  class="badge-group"><circle cx="78.6" cy="41.25" r="3.5" fill="#8209bf"/><text class="num-single" x="78.6" y="41.25" dx="0" dy="-0.5">8</text></g>
<g id="政-bg9"  class="badge-group"><circle cx="54.19" cy="53.43" r="3.5" fill="#bf0982"/><text class="num-single" x="54.19" y="53.43" dx="0" dy="-0.5">9</text></g>
</svg>