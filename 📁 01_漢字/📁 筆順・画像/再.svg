<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (再)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #再-bg[i]: Thời gian quả bóng số nảy lên
   - #再-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#再-bg1  { animation-delay: 0.05s; }
#再-s1   { stroke-dasharray: 64.4562; stroke-dashoffset: 64.4562; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#再-bg2  { animation-delay: 0.55s; }
#再-s2   { stroke-dasharray: 63.9825; stroke-dashoffset: 63.9825; animation: drawStroke 0.35s ease-out 0.68s forwards; }
#再-bg3  { animation-delay: 1.05s; }
#再-s3   { stroke-dasharray: 121.5470; stroke-dashoffset: 121.5470; animation: drawStroke 0.55s ease-out 1.18s forwards; }
#再-bg4  { animation-delay: 1.75s; }
#再-s4   { stroke-dasharray: 49.2919; stroke-dashoffset: 49.2919; animation: drawStroke 0.27s ease-out 1.88s forwards; }
#再-bg5  { animation-delay: 2.17s; }
#再-s5   { stroke-dasharray: 46.4266; stroke-dashoffset: 46.4266; animation: drawStroke 0.26s ease-out 2.30s forwards; }
#再-bg6  { animation-delay: 2.58s; }
#再-s6   { stroke-dasharray: 85.8000; stroke-dashoffset: 85.8000; animation: drawStroke 0.47s ease-out 2.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #再-s[i]) -->
<path id="再-s1"  class="stroke" stroke="#bf0909" d="M20.75,17.62C23.63,18.12,26.41,17.98,29,17.8C39.51,17.060000000000002,63.77,14.72,76.88,14.120000000000001C79.6,14,82.32,14.06,85,14.64"/>
<path id="再-s2"  class="stroke" stroke="#bfbf09" d="M27.95,33.19C28.82,34.059999999999995,29.66,35.8,29.66,37.79C29.66,43.379999999999995,29.72,74.41,29.8,89.75C29.82,93.51,29.830000000000002,93.37,29.830000000000002,96.75"/>
<path id="再-s3"  class="stroke" stroke="#09bf09" d="M30.4,35.14C36.56,34.33,60.31,31.4,71.37,30.240000000000002C76.32000000000001,29.720000000000002,78.06,30.080000000000002,78.06,35.24C78.06,47.650000000000006,78.03,84.95,78.03,93.23C78.03,101.39,72.74,96.24000000000001,70.41,94.55"/>
<path id="再-s4"  class="stroke" stroke="#09bfbf" d="M51.92,19.12C52.65,19.85,53.190000000000005,21.630000000000003,53.190000000000005,23.01C53.190000000000005,35.010000000000005,53.120000000000005,52.39,53.120000000000005,68.13"/>
<path id="再-s5"  class="stroke" stroke="#0909bf" d="M30.64,52.05C43.75,51,60.5,49.379999999999995,76.94,48.669999999999995"/>
<path id="再-s6"  class="stroke" stroke="#bf09bf" d="M11.88,71.73C15.75,72.5,18.85,72.5,22.130000000000003,72.16000000000001C40.71,70.21000000000001,67.38,67.88000000000001,85.75,67.28000000000002C89.18,67.17000000000002,94,67.35000000000001,97.38,68.07000000000002"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="再-bg1"  class="badge-group"><circle cx="20.75" cy="17.62" r="3.5" fill="#bf0909"/><text class="num-single" x="20.75" y="17.62" dx="0" dy="-0.5">1</text></g>
<g id="再-bg2"  class="badge-group"><circle cx="27.95" cy="29.69" r="3.5" fill="#bfbf09"/><text class="num-single" x="27.95" y="29.69" dx="0" dy="-0.5">2</text></g>
<g id="再-bg3"  class="badge-group"><circle cx="30.4" cy="38.64" r="3.5" fill="#09bf09"/><text class="num-single" x="30.4" y="38.64" dx="0" dy="-0.5">3</text></g>
<g id="再-bg4"  class="badge-group"><circle cx="51.92" cy="19.12" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.92" y="19.12" dx="0" dy="-0.5">4</text></g>
<g id="再-bg5"  class="badge-group"><circle cx="30.64" cy="52.05" r="3.5" fill="#0909bf"/><text class="num-single" x="30.64" y="52.05" dx="0" dy="-0.5">5</text></g>
<g id="再-bg6"  class="badge-group"><circle cx="11.88" cy="71.73" r="3.5" fill="#bf09bf"/><text class="num-single" x="11.88" y="71.73" dx="0" dy="-0.5">6</text></g>
</svg>