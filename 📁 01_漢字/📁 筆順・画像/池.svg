<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (池)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #池-bg[i]: Thời gian quả bóng số nảy lên
   - #池-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#池-bg1  { animation-delay: 0.05s; }
#池-s1   { stroke-dasharray: 14.0949; stroke-dashoffset: 14.0949; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#池-bg2  { animation-delay: 0.42s; }
#池-s2   { stroke-dasharray: 13.4272; stroke-dashoffset: 13.4272; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#池-bg3  { animation-delay: 0.79s; }
#池-s3   { stroke-dasharray: 21.9691; stroke-dashoffset: 21.9691; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#池-bg4  { animation-delay: 1.16s; }
#池-s4   { stroke-dasharray: 93.7856; stroke-dashoffset: 93.7856; animation: drawStroke 0.52s ease-out 1.29s forwards; }
#池-bg5  { animation-delay: 1.83s; }
#池-s5   { stroke-dasharray: 53.7254; stroke-dashoffset: 53.7254; animation: drawStroke 0.30s ease-out 1.96s forwards; }
#池-bg6  { animation-delay: 2.28s; }
#池-s6   { stroke-dasharray: 103.6970; stroke-dashoffset: 103.6970; animation: drawStroke 0.55s ease-out 2.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #池-s[i]) -->
<path id="池-s1"  class="stroke" stroke="#bf0909" d="M21.75,19.75C25.63,21.25,31.78,25.92,32.75,28.25"/>
<path id="池-s2"  class="stroke" stroke="#bfbf09" d="M16.75,42.38C20.37,43.86,26.09,48.46,27,50.760000000000005"/>
<path id="池-s3"  class="stroke" stroke="#09bf09" d="M15.5,89.98C17.5,90.5,19.31,89.79,20.25,88.24000000000001C22.32,84.83000000000001,24.34,80.69000000000001,27.5,73.4"/>
<path id="池-s4"  class="stroke" stroke="#09bfbf" d="M35,54.06C37.96,54.97,40.47,54.63,43.39,53.79C54.1,50.68,80.11,40.95,85.5,39C88.13,38.05,90.75,39,90.26,41.86C89.33,47.26,85.76,60.14,84,64.25C81.75,69.5,79.75,68,76.75,64.25"/>
<path id="池-s5"  class="stroke" stroke="#0909bf" d="M65,19C65.94,19.94,66.75,21.62,66.75,22.75C66.75,27.87,66.57,52.620000000000005,66.38,66.25C66.33999999999999,69.05,66.3,71.18,66.25,72.25"/>
<path id="池-s6"  class="stroke" stroke="#bf09bf" d="M45.99,40.12C47.25,41.379999999999995,47.760000000000005,43.25,47.760000000000005,44.97C47.760000000000005,52.04,47.13,63.36,47.13,71.75999999999999C47.13,89.25999999999999,48.75,91.50999999999999,71.5,91.50999999999999S95.89,89.50999999999999,95.89,78.44"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="池-bg1"  class="badge-group"><circle cx="21.75" cy="19.75" r="3.5" fill="#bf0909"/><text class="num-single" x="21.75" y="19.75" dx="0" dy="-0.5">1</text></g>
<g id="池-bg2"  class="badge-group"><circle cx="16.75" cy="42.38" r="3.5" fill="#bfbf09"/><text class="num-single" x="16.75" y="42.38" dx="0" dy="-0.5">2</text></g>
<g id="池-bg3"  class="badge-group"><circle cx="15.5" cy="89.98" r="3.5" fill="#09bf09"/><text class="num-single" x="15.5" y="89.98" dx="0" dy="-0.5">3</text></g>
<g id="池-bg4"  class="badge-group"><circle cx="35" cy="54.06" r="3.5" fill="#09bfbf"/><text class="num-single" x="35" y="54.06" dx="0" dy="-0.5">4</text></g>
<g id="池-bg5"  class="badge-group"><circle cx="65" cy="19" r="3.5" fill="#0909bf"/><text class="num-single" x="65" y="19" dx="0" dy="-0.5">5</text></g>
<g id="池-bg6"  class="badge-group"><circle cx="45.99" cy="40.12" r="3.5" fill="#bf09bf"/><text class="num-single" x="45.99" y="40.12" dx="0" dy="-0.5">6</text></g>
</svg>