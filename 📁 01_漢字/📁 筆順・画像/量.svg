<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (量)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #量-bg[i]: Thời gian quả bóng số nảy lên
   - #量-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#量-bg1  { animation-delay: 0.05s; }
#量-s1   { stroke-dasharray: 23.9574; stroke-dashoffset: 23.9574; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#量-bg2  { animation-delay: 0.42s; }
#量-s2   { stroke-dasharray: 71.5226; stroke-dashoffset: 71.5226; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#量-bg3  { animation-delay: 0.96s; }
#量-s3   { stroke-dasharray: 46.7433; stroke-dashoffset: 46.7433; animation: drawStroke 0.26s ease-out 1.09s forwards; }
#量-bg4  { animation-delay: 1.37s; }
#量-s4   { stroke-dasharray: 41.1802; stroke-dashoffset: 41.1802; animation: drawStroke 0.23s ease-out 1.50s forwards; }
#量-bg5  { animation-delay: 1.75s; }
#量-s5   { stroke-dasharray: 86.3359; stroke-dashoffset: 86.3359; animation: drawStroke 0.47s ease-out 1.88s forwards; }
#量-bg6  { animation-delay: 2.37s; }
#量-s6   { stroke-dasharray: 23.8266; stroke-dashoffset: 23.8266; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#量-bg7  { animation-delay: 2.74s; }
#量-s7   { stroke-dasharray: 70.0592; stroke-dashoffset: 70.0592; animation: drawStroke 0.39s ease-out 2.87s forwards; }
#量-bg8  { animation-delay: 3.28s; }
#量-s8   { stroke-dasharray: 44.8003; stroke-dashoffset: 44.8003; animation: drawStroke 0.25s ease-out 3.41s forwards; }
#量-bg9  { animation-delay: 3.68s; }
#量-s9   { stroke-dasharray: 40.6758; stroke-dashoffset: 40.6758; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#量-bg10  { animation-delay: 4.05s; }
#量-s10   { stroke-dasharray: 40.4092; stroke-dashoffset: 40.4092; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#量-bg11  { animation-delay: 4.42s; }
#量-s11   { stroke-dasharray: 43.3999; stroke-dashoffset: 43.3999; animation: drawStroke 0.24s ease-out 4.55s forwards; }
#量-bg12  { animation-delay: 4.81s; }
#量-s12   { stroke-dasharray: 77.6523; stroke-dashoffset: 77.6523; animation: drawStroke 0.43s ease-out 4.94s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

