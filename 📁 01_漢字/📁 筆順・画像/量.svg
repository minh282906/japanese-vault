<path id="量-s1"  class="stroke" stroke="#bf0909" d="M27.75,13.57C28.53,14.35,28.89,15.33,29.05,15.98C29.46,17.7,31.380000000000003,27.46,32.42,32.980000000000004C32.84,35.160000000000004,33.120000000000005,36.68000000000001,33.120000000000005,36.77"/>
