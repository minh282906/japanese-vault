<path id="量-s10"  class="stroke" stroke="#6409bf" d="M53.83,54.87C54.67,55.71,55.03,56.87,55.03,58.5C55.03,69.68,55.09,92.22999999999999,55.09,94.97999999999999"/>
<path id="量-s11"  class="stroke" stroke="#bf09bf" d="M33.88,84.21C36.02,84.61999999999999,38.22,84.50999999999999,40.38,84.35C50.56,83.57,60.13,82.25,70.63,81.69C72.83,81.57,74.94,81.59,77.13,81.84"/>
<path id="量-s12"  class="stroke" stroke="#bf0964" d="M16.38,97.45C18.7,97.99000000000001,22.97,98.15,25.29,97.99000000000001C45.879999999999995,96.63000000000001,66.25,95.38000000000001,85.75,94.88000000000001C89.62,94.78000000000002,91.95,95.14000000000001,93.88,95.41000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="量-bg1"  class="badge-group"><circle cx="27.75" cy="10.07" r="3.5" fill="#bf0909"/><text class="num-single" x="27.75" y="10.07" dx="0" dy="-0.5">1</text></g>
