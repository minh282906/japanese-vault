<path id="量-s6"  class="stroke" stroke="#09bf64" d="M30.08,52.15C30.779999999999998,52.85,31.11,53.71,31.29,54.62C32.22,59.28,32.949999999999996,66.41,33.7,72.37C33.84,73.45,33.970000000000006,74.48,34.11,75.46000000000001"/>
<path id="量-s7"  class="stroke" stroke="#09bfbf" d="M32.3,53.41C47.629999999999995,52,64.75,50.519999999999996,77.27,49.779999999999994C79.88,49.62,81,51.49999999999999,80.67,53.81999999999999C80.2,57.10999999999999,78.62,63.31999999999999,77.02,69.03999999999999C76.74,70.03999999999999,76.46,71.02999999999999,76.19,71.97999999999999"/>
