<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (反)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #反-bg[i]: Thời gian quả bóng số nảy lên
   - #反-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#反-bg1  { animation-delay: 0.05s; }
#反-s1   { stroke-dasharray: 57.6878; stroke-dashoffset: 57.6878; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#反-bg2  { animation-delay: 0.52s; }
#反-s2   { stroke-dasharray: 70.3057; stroke-dashoffset: 70.3057; animation: drawStroke 0.39s ease-out 0.65s forwards; }
#反-bg3  { animation-delay: 1.06s; }
#反-s3   { stroke-dasharray: 116.4530; stroke-dashoffset: 116.4530; animation: drawStroke 0.55s ease-out 1.19s forwards; }
#反-bg4  { animation-delay: 1.76s; }
#反-s4   { stroke-dasharray: 67.3688; stroke-dashoffset: 67.3688; animation: drawStroke 0.37s ease-out 1.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #反-s[i]) -->
<path id="反-s1"  class="stroke" stroke="#bf0909" d="M28.13,22.29C29.97,22.77,33.35,22.93,35.19,22.77C50,21.5,64.62,19.12,79.06,18.04C82.12,17.81,83.97,18.02,85.5,18.259999999999998"/>
<path id="反-s2"  class="stroke" stroke="#64bf09" d="M31.24,23C32.37,24.13,32.73,25.69,32.64,27.89C31.75,50,29.62,73.25,15.81,89.47"/>
<path id="反-s3"  class="stroke" stroke="#09bfbf" d="M35.09,43.98C36.900000000000006,44.349999999999994,37.85,44.72,41.49,44.349999999999994C49.88,43.5,66.25,40,70.83,38.7C74.25,37.730000000000004,76,40.13,74.72,43.010000000000005C64.06,66.95,51.88,83.25,26,93.51"/>
<path id="反-s4"  class="stroke" stroke="#6409bf" d="M37.5,52.82C42.59,53.78,66.45,78.6,84.17,89.18C86.93,90.83000000000001,88.94,91.92,91.5,92.47000000000001"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="反-bg1"  class="badge-group"><circle cx="28.13" cy="18.79" r="3.5" fill="#bf0909"/><text class="num-single" x="28.13" y="18.79" dx="0" dy="-0.5">1</text></g>
<g id="反-bg2"  class="badge-group"><circle cx="31.24" cy="26.5" r="3.5" fill="#64bf09"/><text class="num-single" x="31.24" y="26.5" dx="0" dy="-0.5">2</text></g>
<g id="反-bg3"  class="badge-group"><circle cx="35.09" cy="43.98" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.09" y="43.98" dx="0" dy="-0.5">3</text></g>
<g id="反-bg4"  class="badge-group"><circle cx="37.5" cy="52.82" r="3.5" fill="#6409bf"/><text class="num-single" x="37.5" y="52.82" dx="0" dy="-0.5">4</text></g>
</svg>