<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (考)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #考-bg[i]: Thời gian quả bóng số nảy lên
   - #考-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#考-bg1  { animation-delay: 0.05s; }
#考-s1   { stroke-dasharray: 35.2967; stroke-dashoffset: 35.2967; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#考-bg2  { animation-delay: 0.42s; }
#考-s2   { stroke-dasharray: 27.8833; stroke-dashoffset: 27.8833; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#考-bg3  { animation-delay: 0.79s; }
#考-s3   { stroke-dasharray: 83.6969; stroke-dashoffset: 83.6969; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#考-bg4  { animation-delay: 1.40s; }
#考-s4   { stroke-dasharray: 90.5555; stroke-dashoffset: 90.5555; animation: drawStroke 0.50s ease-out 1.53s forwards; }
#考-bg5  { animation-delay: 2.05s; }
#考-s5   { stroke-dasharray: 24.4701; stroke-dashoffset: 24.4701; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#考-bg6  { animation-delay: 2.42s; }
#考-s6   { stroke-dasharray: 97.3126; stroke-dashoffset: 97.3126; animation: drawStroke 0.54s ease-out 2.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #考-s[i]) -->
<path id="考-s1"  class="stroke" stroke="#bf0909" d="M35,24.52C36.5,24.79,39.25,24.9,40.76,24.79C49.879999999999995,24.15,58.129999999999995,22.66,64.87,22.27C67.36,22.13,68.88000000000001,22.4,70.13000000000001,22.53"/>
<path id="考-s2"  class="stroke" stroke="#bfbf09" d="M52.17,10.87C53.15,11.85,53.940000000000005,13.25,53.940000000000005,14.76C53.940000000000005,21.72,54.07000000000001,33.18,54.02,38.26"/>
<path id="考-s3"  class="stroke" stroke="#09bf09" d="M13.25,42.28C16.04,42.97,20.57,42.980000000000004,23.36,42.72C46.29,40.62,62.45,38.12,87.17,37.29C91.8,37.13,94.31,37.37,96.63,37.72"/>
<path id="考-s4"  class="stroke" stroke="#09bfbf" d="M81.59,14.23C81.78,15.61,81.51,17.62,80.12,19.26C63,39.62,46.88,55.25,14.62,72.75"/>
<path id="考-s5"  class="stroke" stroke="#0909bf" d="M76.26,48.75C76,49.87,75.32000000000001,50.99,73.65,51.79C68.75,54.12,62,56.38,54.5,58.5"/>
<path id="考-s6"  class="stroke" stroke="#bf09bf" d="M53.25,50.25C53.75,51.5,53.03,53.35,51.52,55.83C49.75,58.75,46.760000000000005,62.66,46.260000000000005,63.28C44.25000000000001,65.75,44.75000000000001,67.64,47.400000000000006,67.53C50.870000000000005,67.38,71.12,65.01,76.91000000000001,64.29C80.26,63.870000000000005,81.75000000000001,66.26,80.84000000000002,68.89C78.54000000000002,75.61,73.05000000000001,90.22,68.76000000000002,95.27C66.24000000000002,98.25,63.49000000000002,96,61.22000000000002,92.7"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="考-bg1"  class="badge-group"><circle cx="35" cy="24.52" r="3.5" fill="#bf0909"/><text class="num-single" x="35" y="24.52" dx="0" dy="-0.5">1</text></g>
<g id="考-bg2"  class="badge-group"><circle cx="52.17" cy="10.87" r="3.5" fill="#bfbf09"/><text class="num-single" x="52.17" y="10.87" dx="0" dy="-0.5">2</text></g>
<g id="考-bg3"  class="badge-group"><circle cx="13.25" cy="42.28" r="3.5" fill="#09bf09"/><text class="num-single" x="13.25" y="42.28" dx="0" dy="-0.5">3</text></g>
<g id="考-bg4"  class="badge-group"><circle cx="81.59" cy="14.23" r="3.5" fill="#09bfbf"/><text class="num-single" x="81.59" y="14.23" dx="0" dy="-0.5">4</text></g>
<g id="考-bg5"  class="badge-group"><circle cx="76.26" cy="48.75" r="3.5" fill="#0909bf"/><text class="num-single" x="76.26" y="48.75" dx="0" dy="-0.5">5</text></g>
<g id="考-bg6"  class="badge-group"><circle cx="53.25" cy="50.25" r="3.5" fill="#bf09bf"/><text class="num-single" x="53.25" y="50.25" dx="0" dy="-0.5">6</text></g>
</svg>