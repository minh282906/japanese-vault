<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (当)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #当-bg[i]: Thời gian quả bóng số nảy lên
   - #当-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#当-bg1  { animation-delay: 0.05s; }
#当-s1   { stroke-dasharray: 37.1354; stroke-dashoffset: 37.1354; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#当-bg2  { animation-delay: 0.42s; }
#当-s2   { stroke-dasharray: 19.5310; stroke-dashoffset: 19.5310; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#当-bg3  { animation-delay: 0.79s; }
#当-s3   { stroke-dasharray: 24.9738; stroke-dashoffset: 24.9738; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#当-bg4  { animation-delay: 1.16s; }
#当-s4   { stroke-dasharray: 106.0210; stroke-dashoffset: 106.0210; animation: drawStroke 0.55s ease-out 1.29s forwards; }
#当-bg5  { animation-delay: 1.86s; }
#当-s5   { stroke-dasharray: 57.9997; stroke-dashoffset: 57.9997; animation: drawStroke 0.32s ease-out 1.99s forwards; }
#当-bg6  { animation-delay: 2.33s; }
#当-s6   { stroke-dasharray: 55.6071; stroke-dashoffset: 55.6071; animation: drawStroke 0.31s ease-out 2.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #当-s[i]) -->
<path id="当-s1"  class="stroke" stroke="#bf0909" d="M52.28,12.87C53.75,13.77,54.9,15.02,54.9,17.04C54.9,31.38,54.79,36.16,54.79,49"/>
<path id="当-s2"  class="stroke" stroke="#bfbf09" d="M24.27,24.83C28.259999999999998,27.589999999999996,34.57,36.17,35.56,40.46"/>
<path id="当-s3"  class="stroke" stroke="#09bf09" d="M83.99,19C84.08,20.19,83.6,21.8,82.99,22.83C79.5,28.75,75.25,34.25,70.3,39.459999999999994"/>
<path id="当-s4"  class="stroke" stroke="#09bfbf" d="M24.2,50.18C26.38,50.75,28.82,50.9,31.54,50.72C50.25,49.5,76,47.75,81.15,47.25C84.97,46.88,86.5,49.78,86.06,52.730000000000004C84.78,61.21000000000001,83.19,75.39,82.02,86.25C81.77,88.54,81.53999999999999,90.7,81.33999999999999,92.64"/>
<path id="当-s5"  class="stroke" stroke="#0909bf" d="M25.25,69.74C27.96,70.19,29.990000000000002,70.35,32.93,70.14C45,69.25,72.25,67,83.12,67.18"/>
<path id="当-s6"  class="stroke" stroke="#bf09bf" d="M24.22,92.41C26.7,93.11999999999999,29.21,93.09,31.75,92.85C44.95,91.61,65.11,90,79.67,90.03"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="当-bg1"  class="badge-group"><circle cx="52.28" cy="12.87" r="3.5" fill="#bf0909"/><text class="num-single" x="52.28" y="12.87" dx="0" dy="-0.5">1</text></g>
<g id="当-bg2"  class="badge-group"><circle cx="24.27" cy="24.83" r="3.5" fill="#bfbf09"/><text class="num-single" x="24.27" y="24.83" dx="0" dy="-0.5">2</text></g>
<g id="当-bg3"  class="badge-group"><circle cx="83.99" cy="19" r="3.5" fill="#09bf09"/><text class="num-single" x="83.99" y="19" dx="0" dy="-0.5">3</text></g>
<g id="当-bg4"  class="badge-group"><circle cx="24.2" cy="50.18" r="3.5" fill="#09bfbf"/><text class="num-single" x="24.2" y="50.18" dx="0" dy="-0.5">4</text></g>
<g id="当-bg5"  class="badge-group"><circle cx="25.25" cy="69.74" r="3.5" fill="#0909bf"/><text class="num-single" x="25.25" y="69.74" dx="0" dy="-0.5">5</text></g>
<g id="当-bg6"  class="badge-group"><circle cx="24.22" cy="92.41" r="3.5" fill="#bf09bf"/><text class="num-single" x="24.22" y="92.41" dx="0" dy="-0.5">6</text></g>
</svg>