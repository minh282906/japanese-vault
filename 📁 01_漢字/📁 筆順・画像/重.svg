<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (重)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #重-bg[i]: Thời gian quả bóng số nảy lên
   - #重-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#重-bg1  { animation-delay: 0.05s; }
#重-s1   { stroke-dasharray: 41.4214; stroke-dashoffset: 41.4214; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#重-bg2  { animation-delay: 0.43s; }
#重-s2   { stroke-dasharray: 81.5441; stroke-dashoffset: 81.5441; animation: drawStroke 0.45s ease-out 0.56s forwards; }
#重-bg3  { animation-delay: 1.03s; }
#重-s3   { stroke-dasharray: 28.2118; stroke-dashoffset: 28.2118; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#重-bg4  { animation-delay: 1.40s; }
#重-s4   { stroke-dasharray: 74.6945; stroke-dashoffset: 74.6945; animation: drawStroke 0.41s ease-out 1.53s forwards; }
#重-bg5  { animation-delay: 1.96s; }
#重-s5   { stroke-dasharray: 46.1733; stroke-dashoffset: 46.1733; animation: drawStroke 0.25s ease-out 2.09s forwards; }
#重-bg6  { animation-delay: 2.36s; }
#重-s6   { stroke-dasharray: 42.8751; stroke-dashoffset: 42.8751; animation: drawStroke 0.24s ease-out 2.49s forwards; }
#重-bg7  { animation-delay: 2.75s; }
#重-s7   { stroke-dasharray: 72.3150; stroke-dashoffset: 72.3150; animation: drawStroke 0.40s ease-out 2.88s forwards; }
#重-bg8  { animation-delay: 3.30s; }
#重-s8   { stroke-dasharray: 46.9853; stroke-dashoffset: 46.9853; animation: drawStroke 0.26s ease-out 3.43s forwards; }
#重-bg9  { animation-delay: 3.71s; }
#重-s9   { stroke-dasharray: 71.9475; stroke-dashoffset: 71.9475; animation: drawStroke 0.40s ease-out 3.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #重-s[i]) -->
<path id="重-s1"  class="stroke" stroke="#bf0909" d="M67.25,11.17C66.87,12.25,66.25,13.25,64.26,14.06C58.830000000000005,16.28,47.300000000000004,19.84,28.260000000000005,22.78"/>
<path id="重-s2"  class="stroke" stroke="#bf8209" d="M12.75,33.95C17.13,34.88,20.57,34.27,24.240000000000002,33.910000000000004C37.57,32.580000000000005,66.18,29.970000000000002,82.48,29.050000000000004C86.34,28.830000000000005,90.12,28.630000000000003,94,29.300000000000004"/>
<path id="重-s3"  class="stroke" stroke="#82bf09" d="M28.69,44.28C29.39,44.980000000000004,29.700000000000003,45.95,29.790000000000003,46.5C30.840000000000003,52.99,32.2,61.3,33.230000000000004,68.61C33.39,69.73,33.540000000000006,70.84,33.68000000000001,71.9"/>
<path id="重-s4"  class="stroke" stroke="#09bf09" d="M30.46,46.36C45.120000000000005,44.5,66.28999999999999,42.19,76.22,41.29C79.87,40.96,81.23,43.89,81.05,45.07C80.48,48.63,78.95,55.69,77.17,62.14C76.79,63.53,76.39,64.88,76,66.17"/>
<path id="重-s5"  class="stroke" stroke="#09bf82" d="M32.44,56.97C44.62,55.25,67.25,53.129999999999995,78.39,52.53"/>
<path id="重-s6"  class="stroke" stroke="#0982bf" d="M33.61,68.24C48.75,66.25,63.03,64.6,76.25,63.849999999999994"/>
<path id="重-s7"  class="stroke" stroke="#0909bf" d="M52.5,21.25C53.69,22.44,54.5,24,54.5,25.5C54.5,28.38,54.25,84.5,54.25,93"/>
<path id="重-s8"  class="stroke" stroke="#8209bf" d="M31.41,80.64C33.38,81.12,35.77,81.03,37.75,80.8C48,79.61999999999999,61.97,78.21,71.72999999999999,77.27C73.92999999999999,77.06,76.49999999999999,76.86999999999999,78.14999999999999,77.31"/>
<path id="重-s9"  class="stroke" stroke="#bf0982" d="M17.14,96.06C20.630000000000003,96.62,24.1,96.47,27.380000000000003,96.25C41.72,95.29,63.14,93.02,78.5,92.28C81.98,92.11,85.43,92.15,88.87,92.79"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="重-bg1"  class="badge-group"><circle cx="67.25" cy="11.17" r="3.5" fill="#bf0909"/><text class="num-single" x="67.25" y="11.17" dx="0" dy="-0.5">1</text></g>
<g id="重-bg2"  class="badge-group"><circle cx="12.75" cy="33.95" r="3.5" fill="#bf8209"/><text class="num-single" x="12.75" y="33.95" dx="0" dy="-0.5">2</text></g>
<g id="重-bg3"  class="badge-group"><circle cx="28.69" cy="40.78" r="3.5" fill="#82bf09"/><text class="num-single" x="28.69" y="40.78" dx="0" dy="-0.5">3</text></g>
<g id="重-bg4"  class="badge-group"><circle cx="30.46" cy="49.86" r="3.5" fill="#09bf09"/><text class="num-single" x="30.46" y="49.86" dx="0" dy="-0.5">4</text></g>
<g id="重-bg5"  class="badge-group"><circle cx="32.44" cy="56.97" r="3.5" fill="#09bf82"/><text class="num-single" x="32.44" y="56.97" dx="0" dy="-0.5">5</text></g>
<g id="重-bg6"  class="badge-group"><circle cx="33.61" cy="68.24" r="3.5" fill="#0982bf"/><text class="num-single" x="33.61" y="68.24" dx="0" dy="-0.5">6</text></g>
<g id="重-bg7"  class="badge-group"><circle cx="52.5" cy="21.25" r="3.5" fill="#0909bf"/><text class="num-single" x="52.5" y="21.25" dx="0" dy="-0.5">7</text></g>
<g id="重-bg8"  class="badge-group"><circle cx="31.41" cy="80.64" r="3.5" fill="#8209bf"/><text class="num-single" x="31.41" y="80.64" dx="0" dy="-0.5">8</text></g>
<g id="重-bg9"  class="badge-group"><circle cx="17.14" cy="96.06" r="3.5" fill="#bf0982"/><text class="num-single" x="17.14" y="96.06" dx="0" dy="-0.5">9</text></g>
</svg>