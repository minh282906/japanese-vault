<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (灰)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #灰-bg[i]: Thời gian quả bóng số nảy lên
   - #灰-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#灰-bg1  { animation-delay: 0.05s; }
#灰-s1   { stroke-dasharray: 63.3903; stroke-dashoffset: 63.3903; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#灰-bg2  { animation-delay: 0.55s; }
#灰-s2   { stroke-dasharray: 62.5595; stroke-dashoffset: 62.5595; animation: drawStroke 0.34s ease-out 0.68s forwards; }
#灰-bg3  { animation-delay: 1.04s; }
#灰-s3   { stroke-dasharray: 14.7303; stroke-dashoffset: 14.7303; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#灰-bg4  { animation-delay: 1.41s; }
#灰-s4   { stroke-dasharray: 20.3274; stroke-dashoffset: 20.3274; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#灰-bg5  { animation-delay: 1.78s; }
#灰-s5   { stroke-dasharray: 66.3445; stroke-dashoffset: 66.3445; animation: drawStroke 0.36s ease-out 1.91s forwards; }
#灰-bg6  { animation-delay: 2.29s; }
#灰-s6   { stroke-dasharray: 44.6951; stroke-dashoffset: 44.6951; animation: drawStroke 0.25s ease-out 2.42s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #灰-s[i]) -->
<path id="灰-s1"  class="stroke" stroke="#bf0909" d="M23.12,26.9C26.080000000000002,27.849999999999998,29.35,27.45,32.39,27.169999999999998C46.02,25.919999999999998,65.15,22.939999999999998,77.25999999999999,22.2C80.24,22.02,83.17999999999999,21.919999999999998,86.13,22.49"/>
<path id="灰-s2"  class="stroke" stroke="#bfbf09" d="M24.93,27.73C25.72,28.52,26.11,29.87,26.11,30.97C26.11,48,26.5,70,12.81,87.22"/>
<path id="灰-s3"  class="stroke" stroke="#09bf09" d="M39,50.25C41.03,53.06,43.980000000000004,61.03,44.53,63.84"/>
<path id="灰-s4"  class="stroke" stroke="#09bfbf" d="M80.39,44.04C80.5,45.13,80.39,46.03,79.64,47.19C78.89,48.349999999999994,73.5,55.5,68.14,59.66"/>
<path id="灰-s5"  class="stroke" stroke="#0909bf" d="M57.13,35.75C57.88,36.63,58.330000000000005,38.12,58.2,40.07C56.25,69.5,48,83.5,32.64,93.5"/>
<path id="灰-s6"  class="stroke" stroke="#bf09bf" d="M55.69,63.37C65.45,72.66,75.48,82.2,82.52,88C83.91,89.15,87.11999999999999,91.75,89.32,92.66"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="灰-bg1"  class="badge-group"><circle cx="23.12" cy="23.4" r="3.5" fill="#bf0909"/><text class="num-single" x="23.12" y="23.4" dx="0" dy="-0.5">1</text></g>
<g id="灰-bg2"  class="badge-group"><circle cx="24.93" cy="31.23" r="3.5" fill="#bfbf09"/><text class="num-single" x="24.93" y="31.23" dx="0" dy="-0.5">2</text></g>
<g id="灰-bg3"  class="badge-group"><circle cx="39" cy="50.25" r="3.5" fill="#09bf09"/><text class="num-single" x="39" y="50.25" dx="0" dy="-0.5">3</text></g>
<g id="灰-bg4"  class="badge-group"><circle cx="80.39" cy="44.04" r="3.5" fill="#09bfbf"/><text class="num-single" x="80.39" y="44.04" dx="0" dy="-0.5">4</text></g>
<g id="灰-bg5"  class="badge-group"><circle cx="57.13" cy="35.75" r="3.5" fill="#0909bf"/><text class="num-single" x="57.13" y="35.75" dx="0" dy="-0.5">5</text></g>
<g id="灰-bg6"  class="badge-group"><circle cx="55.69" cy="63.37" r="3.5" fill="#bf09bf"/><text class="num-single" x="55.69" y="63.37" dx="0" dy="-0.5">6</text></g>
</svg>