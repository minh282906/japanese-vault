<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (巻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #巻-bg[i]: Thời gian quả bóng số nảy lên
   - #巻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#巻-bg1  { animation-delay: 0.05s; }
#巻-s1   { stroke-dasharray: 14.7483; stroke-dashoffset: 14.7483; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#巻-bg2  { animation-delay: 0.42s; }
#巻-s2   { stroke-dasharray: 22.4381; stroke-dashoffset: 22.4381; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#巻-bg3  { animation-delay: 0.79s; }
#巻-s3   { stroke-dasharray: 47.1284; stroke-dashoffset: 47.1284; animation: drawStroke 0.26s ease-out 0.92s forwards; }
#巻-bg4  { animation-delay: 1.20s; }
#巻-s4   { stroke-dasharray: 75.6411; stroke-dashoffset: 75.6411; animation: drawStroke 0.42s ease-out 1.33s forwards; }
#巻-bg5  { animation-delay: 1.77s; }
#巻-s5   { stroke-dasharray: 79.2479; stroke-dashoffset: 79.2479; animation: drawStroke 0.44s ease-out 1.90s forwards; }
#巻-bg6  { animation-delay: 2.36s; }
#巻-s6   { stroke-dasharray: 53.7357; stroke-dashoffset: 53.7357; animation: drawStroke 0.30s ease-out 2.49s forwards; }
#巻-bg7  { animation-delay: 2.81s; }
#巻-s7   { stroke-dasharray: 39.5619; stroke-dashoffset: 39.5619; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#巻-bg8  { animation-delay: 3.18s; }
#巻-s8   { stroke-dasharray: 29.8830; stroke-dashoffset: 29.8830; animation: drawStroke 0.22s ease-out 3.31s forwards; }
#巻-bg9  { animation-delay: 3.55s; }
#巻-s9   { stroke-dasharray: 57.2234; stroke-dashoffset: 57.2234; animation: drawStroke 0.31s ease-out 3.68s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #巻-s[i]) -->
<path id="巻-s1"  class="stroke" stroke="#bf0909" d="M30.02,16.83C33.39,18.93,38.22,24.949999999999996,39.06,28.21"/>
<path id="巻-s2"  class="stroke" stroke="#bf8209" d="M72.77,12.89C72.88,13.84,72.91,14.82,72.44,15.63C70.25,19.37,66.49,24.79,60.559999999999995,31.21"/>
<path id="巻-s3"  class="stroke" stroke="#82bf09" d="M28,37.39C30.5,37.88,32.26,37.75,34.26,37.45C43.12,36.120000000000005,59.51,33.720000000000006,68.24,32.89C70.46,32.68,72.57,32.480000000000004,74.75,33.01"/>
<path id="巻-s4"  class="stroke" stroke="#09bf09" d="M15.25,52.7C18.22,53.760000000000005,22.17,53.39,25.259999999999998,53.050000000000004C37.06,51.74,65.16,48.480000000000004,80.75,47.68000000000001C84.02,47.510000000000005,87.27,47.36000000000001,90.5,48.050000000000004"/>
<path id="巻-s5"  class="stroke" stroke="#09bf82" d="M52.5,10.5C52.87,11.75,53.12,12.879999999999999,52.79,14.47C50.02,27.7,41.5,63,14.75,76.5"/>
<path id="巻-s6"  class="stroke" stroke="#0982bf" d="M54.5,35.5C61.1,42.730000000000004,75.69,57.72,83.74,65.52C86.50999999999999,68.2,89.38,71.25999999999999,93,72.75"/>
<path id="巻-s7"  class="stroke" stroke="#0909bf" d="M38.02,66.55C39.13,67.2,40.84,67.21,42.470000000000006,66.98C47.040000000000006,66.35000000000001,58.88000000000001,64.25,62.650000000000006,63.64C65.02000000000001,63.26,66.11,64.04,65.52000000000001,66.51C65.19000000000001,67.9,64.46000000000001,71.72,63.70000000000001,75.59"/>
<path id="巻-s8"  class="stroke" stroke="#8209bf" d="M35.78,78.59C36.620000000000005,79.12,37.81,79.42,39.230000000000004,79.29C45.17,78.71000000000001,54.81,77.55000000000001,61.99000000000001,76.86C63.220000000000006,76.74,64.25000000000001,76.62,65.39000000000001,76.8"/>
<path id="巻-s9"  class="stroke" stroke="#bf0982" d="M37.12,79.53C37.86,80.27,38.18,81.35,38.169999999999995,82.46000000000001C38.14999999999999,85.7,38.199999999999996,87.16000000000001,38.199999999999996,90.10000000000001C38.199999999999996,97.25000000000001,38.87,98.52000000000001,55.72,98.52000000000001C72,98.52000000000001,73.67,97.00000000000001,73.67,89.80000000000001"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="巻-bg1"  class="badge-group"><circle cx="30.02" cy="16.83" r="3.5" fill="#bf0909"/><text class="num-single" x="30.02" y="16.83" dx="0" dy="-0.5">1</text></g>
<g id="巻-bg2"  class="badge-group"><circle cx="72.77" cy="12.89" r="3.5" fill="#bf8209"/><text class="num-single" x="72.77" y="12.89" dx="0" dy="-0.5">2</text></g>
<g id="巻-bg3"  class="badge-group"><circle cx="28" cy="37.39" r="3.5" fill="#82bf09"/><text class="num-single" x="28" y="37.39" dx="0" dy="-0.5">3</text></g>
<g id="巻-bg4"  class="badge-group"><circle cx="15.25" cy="52.7" r="3.5" fill="#09bf09"/><text class="num-single" x="15.25" y="52.7" dx="0" dy="-0.5">4</text></g>
<g id="巻-bg5"  class="badge-group"><circle cx="52.5" cy="10.5" r="3.5" fill="#09bf82"/><text class="num-single" x="52.5" y="10.5" dx="0" dy="-0.5">5</text></g>
<g id="巻-bg6"  class="badge-group"><circle cx="54.5" cy="35.5" r="3.5" fill="#0982bf"/><text class="num-single" x="54.5" y="35.5" dx="0" dy="-0.5">6</text></g>
<g id="巻-bg7"  class="badge-group"><circle cx="38.02" cy="66.55" r="3.5" fill="#0909bf"/><text class="num-single" x="38.02" y="66.55" dx="0" dy="-0.5">7</text></g>
<g id="巻-bg8"  class="badge-group"><circle cx="35.78" cy="75.09" r="3.5" fill="#8209bf"/><text class="num-single" x="35.78" y="75.09" dx="0" dy="-0.5">8</text></g>
<g id="巻-bg9"  class="badge-group"><circle cx="37.12" cy="83.03" r="3.5" fill="#bf0982"/><text class="num-single" x="37.12" y="83.03" dx="0" dy="-0.5">9</text></g>
</svg>