<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (打)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #打-bg[i]: Thời gian quả bóng số nảy lên
   - #打-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#打-bg1  { animation-delay: 0.05s; }
#打-s1   { stroke-dasharray: 34.9254; stroke-dashoffset: 34.9254; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#打-bg2  { animation-delay: 0.42s; }
#打-s2   { stroke-dasharray: 90.8364; stroke-dashoffset: 90.8364; animation: drawStroke 0.50s ease-out 0.55s forwards; }
#打-bg3  { animation-delay: 1.07s; }
#打-s3   { stroke-dasharray: 34.1204; stroke-dashoffset: 34.1204; animation: drawStroke 0.22s ease-out 1.20s forwards; }
#打-bg4  { animation-delay: 1.44s; }
#打-s4   { stroke-dasharray: 43.9902; stroke-dashoffset: 43.9902; animation: drawStroke 0.24s ease-out 1.57s forwards; }
#打-bg5  { animation-delay: 1.83s; }
#打-s5   { stroke-dasharray: 72.5174; stroke-dashoffset: 72.5174; animation: drawStroke 0.40s ease-out 1.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #打-s[i]) -->
<path id="打-s1"  class="stroke" stroke="#bf0909" d="M13.17,35.25C14.75,35.63,16.509999999999998,35.59,18.5,35.5C23.88,35.25,35,33.88,45.14,32.73C46.18,32.61,47.12,32.599999999999994,47.92,32.589999999999996"/>
<path id="打-s2"  class="stroke" stroke="#9abf09" d="M33.02,12.83C34.160000000000004,13.97,34.78,16.12,34.78,18.35C34.78,32.910000000000004,34.77,83.75999999999999,34.77,88.72C34.77,98.25,30.000000000000004,93.38,26.310000000000002,89.47"/>
<path id="打-s3"  class="stroke" stroke="#09bf52" d="M14,67.9C15.61,68.55000000000001,17.17,68.48,18.92,67.29C20.560000000000002,66.17,35.400000000000006,55.74000000000001,42.38,50.370000000000005"/>
<path id="打-s4"  class="stroke" stroke="#0952bf" d="M54,31.38C56.38,31.75,58.75,31.68,60.5,31.49C69.96000000000001,30.43,81.53,29.34,91.58,28.27C94.49,27.96,96.28,28.56,97.74,28.86"/>
<path id="打-s5"  class="stroke" stroke="#9a09bf" d="M76.27,33.33C77.33999999999999,34.4,78.27,36,78.27,37.89C78.27,52.56,78.27,85.25,78.27,90.44C78.27,101.38,73.50999999999999,93.84,70.06,90.94"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="打-bg1"  class="badge-group"><circle cx="13.17" cy="35.25" r="3.5" fill="#bf0909"/><text class="num-single" x="13.17" y="35.25" dx="0" dy="-0.5">1</text></g>
<g id="打-bg2"  class="badge-group"><circle cx="33.02" cy="12.83" r="3.5" fill="#9abf09"/><text class="num-single" x="33.02" y="12.83" dx="0" dy="-0.5">2</text></g>
<g id="打-bg3"  class="badge-group"><circle cx="14" cy="67.9" r="3.5" fill="#09bf52"/><text class="num-single" x="14" y="67.9" dx="0" dy="-0.5">3</text></g>
<g id="打-bg4"  class="badge-group"><circle cx="54" cy="31.38" r="3.5" fill="#0952bf"/><text class="num-single" x="54" y="31.38" dx="0" dy="-0.5">4</text></g>
<g id="打-bg5"  class="badge-group"><circle cx="76.27" cy="33.33" r="3.5" fill="#9a09bf"/><text class="num-single" x="76.27" y="33.33" dx="0" dy="-0.5">5</text></g>
</svg>