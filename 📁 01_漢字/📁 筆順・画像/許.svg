<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (許)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #許-bg[i]: Thời gian quả bóng số nảy lên
   - #許-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#許-bg1  { animation-delay: 0.05s; }
#許-s1   { stroke-dasharray: 10.7624; stroke-dashoffset: 10.7624; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#許-bg2  { animation-delay: 0.42s; }
#許-s2   { stroke-dasharray: 32.4466; stroke-dashoffset: 32.4466; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#許-bg3  { animation-delay: 0.79s; }
#許-s3   { stroke-dasharray: 21.1489; stroke-dashoffset: 21.1489; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#許-bg4  { animation-delay: 1.16s; }
#許-s4   { stroke-dasharray: 21.0107; stroke-dashoffset: 21.0107; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#許-bg5  { animation-delay: 1.53s; }
#許-s5   { stroke-dasharray: 20.7528; stroke-dashoffset: 20.7528; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#許-bg6  { animation-delay: 1.90s; }
#許-s6   { stroke-dasharray: 38.2848; stroke-dashoffset: 38.2848; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#許-bg7  { animation-delay: 2.27s; }
#許-s7   { stroke-dasharray: 17.3119; stroke-dashoffset: 17.3119; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#許-bg8  { animation-delay: 2.64s; }
#許-s8   { stroke-dasharray: 37.6444; stroke-dashoffset: 37.6444; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#許-bg9  { animation-delay: 3.01s; }
#許-s9   { stroke-dasharray: 32.1507; stroke-dashoffset: 32.1507; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#許-bg10  { animation-delay: 3.38s; }
#許-s10   { stroke-dasharray: 53.9999; stroke-dashoffset: 53.9999; animation: drawStroke 0.30s ease-out 3.51s forwards; }
#許-bg11  { animation-delay: 3.83s; }
#許-s11   { stroke-dasharray: 60.4866; stroke-dashoffset: 60.4866; animation: drawStroke 0.33s ease-out 3.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #許-s[i]) -->
<path id="許-s1"  class="stroke" stroke="#bf0909" d="M24.63,15.75C26.88,17.25,30.439999999999998,21.92,31,24.25"/>
<path id="許-s2"  class="stroke" stroke="#bf6c09" d="M11.12,34.33C12.579999999999998,34.87,14.62,34.589999999999996,16.13,34.48C22.97,34,31.99,32.839999999999996,38.01,31.989999999999995C39.699999999999996,31.749999999999996,41.64,31.299999999999994,43.339999999999996,31.669999999999995"/>
