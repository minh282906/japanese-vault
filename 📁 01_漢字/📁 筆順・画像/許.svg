<g id="許-bg8"  class="badge-group"><circle cx="63.49" cy="13.14" r="3.5" fill="#092abf"/><text class="num-single" x="63.49" y="13.14" dx="0" dy="-0.5">8</text></g>
<g id="許-bg9"  class="badge-group"><circle cx="57.79" cy="35" r="3.5" fill="#4b09bf"/><text class="num-single" x="57.79" y="35" dx="0" dy="-0.5">9</text></g>
