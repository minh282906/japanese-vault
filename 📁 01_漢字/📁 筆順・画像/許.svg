<path id="許-s5"  class="stroke" stroke="#09bf2a" d="M17.14,73.15C17.830000000000002,73.73,18.25,74.62,18.490000000000002,75.60000000000001C19.360000000000003,79.21000000000001,20.21,84.92000000000002,20.990000000000002,90.00000000000001C21.160000000000004,91.12000000000002,21.330000000000002,92.22000000000001,21.500000000000004,93.25000000000001"/>
<path id="許-s6"  class="stroke" stroke="#09bf8d" d="M19.31,74.62C25.009999999999998,73.83,31.43,72.60000000000001,36.89,71.7C39.59,71.26,41.61,71.33,40.93,74.54C40.13,78.32000000000001,39.36,81.77000000000001,37.93,88.21000000000001"/>
<path id="許-s7"  class="stroke" stroke="#098dbf" d="M22.47,91.05C25.869999999999997,90.67,30.63,90.11999999999999,36.62,89.38C37.599999999999994,89.25999999999999,38.62,89.13,39.66,89"/>
<path id="許-s8"  class="stroke" stroke="#092abf" d="M63.49,13.14C63.63,14.120000000000001,63.510000000000005,15.24,63.14,16.35C60.62,24,55.08,36.35,46.61,46.28"/>
<path id="許-s9"  class="stroke" stroke="#4b09bf" d="M57.79,35C58.75,35.12,59.67,35.03,60.33,34.96C66.62,34.37,75.75,32.870000000000005,83.89,30.93C85.6,30.52,87.78,30.32,89.53,30.66"/>
<path id="許-s10"  class="stroke" stroke="#ae09bf" d="M45,57.13C48.06,57.75,50.9,57.760000000000005,53.61,57.470000000000006C65.13,56.25000000000001,79.13,54.50000000000001,89.71000000000001,54.00000000000001C93.61000000000001,53.81000000000001,95.93,53.900000000000006,98.75,54.45000000000001"/>
<path id="許-s11"  class="stroke" stroke="#bf096c" d="M70.57,36.52C71.58999999999999,37.540000000000006,72.08,39.25,72.08,40.88C72.08,41.580000000000005,72.05,73.78,72,89.13C71.99,92.85,71.97,95.58,71.96,96.64"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="許-bg1"  class="badge-group"><circle cx="24.63" cy="15.75" r="3.5" fill="#bf0909"/><text class="num-single" x="24.63" y="15.75" dx="0" dy="-0.5">1</text></g>
