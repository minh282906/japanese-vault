<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (室)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #室-bg[i]: Thời gian quả bóng số nảy lên
   - #室-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#室-bg1  { animation-delay: 0.05s; }
#室-s1   { stroke-dasharray: 15.1193; stroke-dashoffset: 15.1193; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#室-bg2  { animation-delay: 0.42s; }
#室-s2   { stroke-dasharray: 19.4465; stroke-dashoffset: 19.4465; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#室-bg3  { animation-delay: 0.79s; }
#室-s3   { stroke-dasharray: 82.9566; stroke-dashoffset: 82.9566; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#室-bg4  { animation-delay: 1.40s; }
#室-s4   { stroke-dasharray: 40.2782; stroke-dashoffset: 40.2782; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#室-bg5  { animation-delay: 1.77s; }
#室-s5   { stroke-dasharray: 59.2777; stroke-dashoffset: 59.2777; animation: drawStroke 0.33s ease-out 1.90s forwards; }
#室-bg6  { animation-delay: 2.25s; }
#室-s6   { stroke-dasharray: 17.0534; stroke-dashoffset: 17.0534; animation: drawStroke 0.22s ease-out 2.38s forwards; }
#室-bg7  { animation-delay: 2.62s; }
#室-s7   { stroke-dasharray: 44.9224; stroke-dashoffset: 44.9224; animation: drawStroke 0.25s ease-out 2.75s forwards; }
#室-bg8  { animation-delay: 3.02s; }
#室-s8   { stroke-dasharray: 31.9306; stroke-dashoffset: 31.9306; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#室-bg9  { animation-delay: 3.39s; }
#室-s9   { stroke-dasharray: 70.9051; stroke-dashoffset: 70.9051; animation: drawStroke 0.39s ease-out 3.52s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #室-s[i]) -->
<path id="室-s1"  class="stroke" stroke="#bf0909" d="M52.4,9.25C53.64,10.49,54.32,12.129999999999999,54.32,13.77C54.32,17.669999999999998,54.22,20.31,54.22,23.85"/>
<path id="室-s2"  class="stroke" stroke="#bf8209" d="M19.91,24.63C19.91,28.9,16.88,40.65,15.5,43.5"/>
<path id="室-s3"  class="stroke" stroke="#82bf09" d="M21.53,27.37C39.88,26,74.38,22.62,87.7,22.84C98.5,23.01,93,27.5,87.25,31.619999999999997"/>
<path id="室-s4"  class="stroke" stroke="#09bf09" d="M33.3,39.35C34.709999999999994,39.71,36.57,39.89,38.699999999999996,39.71C47,39,60,37.62,68.44,36.82C70.77,36.6,72.2,36.99,73.37,37.17"/>
<path id="室-s5"  class="stroke" stroke="#09bf82" d="M49.81,41.34C50,42.75,49.5,44.120000000000005,48.660000000000004,45.35C46.190000000000005,48.93,43.24,52.730000000000004,38.78,57.29C35.88,60.25,36.43,60.82,39.58,60.28C46.94,59.03,60.43,55.21,72.02,53.160000000000004"/>
<path id="室-s6"  class="stroke" stroke="#0982bf" d="M66.12,46.88C70.59,49.24,75.74000000000001,54.760000000000005,77.69,59.08"/>
<path id="室-s7"  class="stroke" stroke="#0909bf" d="M31.25,78.06C33,78.31,35.72,78.45,37.45,78.31C47.63,77.5,61.5,75.62,69.88,75.17C72.78999999999999,75.01,74.53999999999999,75.29,75.99,75.42"/>
<path id="室-s8"  class="stroke" stroke="#8209bf" d="M52.03,63.25C53.5,64.5,54.33,66.19,54.28,68.25C54.08,76.89,54.230000000000004,93.6,54.230000000000004,94.5"/>
<path id="室-s9"  class="stroke" stroke="#bf0982" d="M19.64,96.76C21.69,97.26,24.21,97.41000000000001,26.240000000000002,97.26C46.38,95.75,67.47,93.96000000000001,83.21000000000001,93.96000000000001C86.62,93.96000000000001,88.67,94.2,90.37,94.45"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="室-bg1"  class="badge-group"><circle cx="52.4" cy="9.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.4" y="9.25" dx="0" dy="-0.5">1</text></g>
<g id="室-bg2"  class="badge-group"><circle cx="19.91" cy="21.13" r="3.5" fill="#bf8209"/><text class="num-single" x="19.91" y="21.13" dx="0" dy="-0.5">2</text></g>
<g id="室-bg3"  class="badge-group"><circle cx="21.53" cy="30.87" r="3.5" fill="#82bf09"/><text class="num-single" x="21.53" y="30.87" dx="0" dy="-0.5">3</text></g>
<g id="室-bg4"  class="badge-group"><circle cx="33.3" cy="39.35" r="3.5" fill="#09bf09"/><text class="num-single" x="33.3" y="39.35" dx="0" dy="-0.5">4</text></g>
<g id="室-bg5"  class="badge-group"><circle cx="49.81" cy="41.34" r="3.5" fill="#09bf82"/><text class="num-single" x="49.81" y="41.34" dx="0" dy="-0.5">5</text></g>
<g id="室-bg6"  class="badge-group"><circle cx="66.12" cy="46.88" r="3.5" fill="#0982bf"/><text class="num-single" x="66.12" y="46.88" dx="0" dy="-0.5">6</text></g>
<g id="室-bg7"  class="badge-group"><circle cx="31.25" cy="78.06" r="3.5" fill="#0909bf"/><text class="num-single" x="31.25" y="78.06" dx="0" dy="-0.5">7</text></g>
<g id="室-bg8"  class="badge-group"><circle cx="52.03" cy="63.25" r="3.5" fill="#8209bf"/><text class="num-single" x="52.03" y="63.25" dx="0" dy="-0.5">8</text></g>
<g id="室-bg9"  class="badge-group"><circle cx="19.64" cy="96.76" r="3.5" fill="#bf0982"/><text class="num-single" x="19.64" y="96.76" dx="0" dy="-0.5">9</text></g>
</svg>