<path id="程-s7"  class="stroke" stroke="#09bfbf" d="M54.81,21.06C64.44,19.959999999999997,79.27000000000001,18.57,85.51,17.91C88.38000000000001,17.61,90.13000000000001,19.01,89.45,22.009999999999998C88.46000000000001,26.409999999999997,87.88000000000001,27.849999999999998,86.10000000000001,37.33"/>
<path id="程-s8"  class="stroke" stroke="#0964bf" d="M57.93,40.63C63.1,40.080000000000005,76.1,39.09,84.53,38.330000000000005C86,38.2,87.35,38.080000000000005,88.49,37.980000000000004"/>
<path id="程-s9"  class="stroke" stroke="#0909bf" d="M55.26,55.61C56.879999999999995,55.87,59.599999999999994,55.64,61.019999999999996,55.48C66.06,54.93,76.78,53.779999999999994,84.63,53.16C86.5,53.01,88.36999999999999,52.87,90.19999999999999,53.3"/>
<path id="程-s10"  class="stroke" stroke="#6409bf" d="M71.4,56.65C72.19000000000001,57.44,72.73,58.699999999999996,72.73,59.72C72.73,66.88,72.73,82.13,72.73,90.44"/>
<path id="程-s11"  class="stroke" stroke="#bf09bf" d="M54.46,73.12C56.35,73.54,58.32,73.33,60.24,73.16000000000001C67.93,72.48,77.07,70.9,85.88,70.22000000000001C87.52,70.09000000000002,89.42,69.89000000000001,91,70.34000000000002"/>
<path id="程-s12"  class="stroke" stroke="#bf0964" d="M45.75,92.99C48.37,93.5,51.08,93.30999999999999,53.26,93.11C70.62,91.49,81.12,90.63,93.5,90.44C95.92,90.39999999999999,98.87,90.5,100.74,91.17999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="程-bg1"  class="badge-group"><circle cx="38" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="38" y="12.5" dx="0" dy="-0.5">1</text></g>
