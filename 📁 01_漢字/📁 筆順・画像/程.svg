<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (程)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #程-bg[i]: Thời gian quả bóng số nảy lên
   - #程-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#程-bg1  { animation-delay: 0.05s; }
#程-s1   { stroke-dasharray: 27.9756; stroke-dashoffset: 27.9756; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#程-bg2  { animation-delay: 0.42s; }
#程-s2   { stroke-dasharray: 37.6189; stroke-dashoffset: 37.6189; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#程-bg3  { animation-delay: 0.79s; }
#程-s3   { stroke-dasharray: 73.8380; stroke-dashoffset: 73.8380; animation: drawStroke 0.41s ease-out 0.92s forwards; }
#程-bg4  { animation-delay: 1.35s; }
#程-s4   { stroke-dasharray: 42.1821; stroke-dashoffset: 42.1821; animation: drawStroke 0.23s ease-out 1.48s forwards; }
#程-bg5  { animation-delay: 1.73s; }
#程-s5   { stroke-dasharray: 14.6363; stroke-dashoffset: 14.6363; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#程-bg6  { animation-delay: 2.10s; }
#程-s6   { stroke-dasharray: 25.3948; stroke-dashoffset: 25.3948; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#程-bg7  { animation-delay: 2.47s; }
#程-s7   { stroke-dasharray: 53.5596; stroke-dashoffset: 53.5596; animation: drawStroke 0.29s ease-out 2.60s forwards; }
#程-bg8  { animation-delay: 2.91s; }
#程-s8   { stroke-dasharray: 30.6749; stroke-dashoffset: 30.6749; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#程-bg9  { animation-delay: 3.28s; }
#程-s9   { stroke-dasharray: 35.0956; stroke-dashoffset: 35.0956; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#程-bg10  { animation-delay: 3.65s; }
#程-s10   { stroke-dasharray: 34.1425; stroke-dashoffset: 34.1425; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#程-bg11  { animation-delay: 4.02s; }
#程-s11   { stroke-dasharray: 36.7647; stroke-dashoffset: 36.7647; animation: drawStroke 0.22s ease-out 4.15s forwards; }
#程-bg12  { animation-delay: 4.39s; }
#程-s12   { stroke-dasharray: 55.1888; stroke-dashoffset: 55.1888; animation: drawStroke 0.30s ease-out 4.52s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

