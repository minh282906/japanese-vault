<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (念)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #念-bg[i]: Thời gian quả bóng số nảy lên
   - #念-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#念-bg1  { animation-delay: 0.05s; }
#念-s1   { stroke-dasharray: 56.4978; stroke-dashoffset: 56.4978; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#念-bg2  { animation-delay: 0.51s; }
#念-s2   { stroke-dasharray: 54.0737; stroke-dashoffset: 54.0737; animation: drawStroke 0.30s ease-out 0.64s forwards; }
#念-bg3  { animation-delay: 0.96s; }
#念-s3   { stroke-dasharray: 22.8186; stroke-dashoffset: 22.8186; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#念-bg4  { animation-delay: 1.33s; }
#念-s4   { stroke-dasharray: 60.7956; stroke-dashoffset: 60.7956; animation: drawStroke 0.33s ease-out 1.46s forwards; }
#念-bg5  { animation-delay: 1.81s; }
#念-s5   { stroke-dasharray: 17.3101; stroke-dashoffset: 17.3101; animation: drawStroke 0.22s ease-out 1.94s forwards; }
#念-bg6  { animation-delay: 2.18s; }
#念-s6   { stroke-dasharray: 68.1299; stroke-dashoffset: 68.1299; animation: drawStroke 0.37s ease-out 2.31s forwards; }
#念-bg7  { animation-delay: 2.70s; }
#念-s7   { stroke-dasharray: 10.7171; stroke-dashoffset: 10.7171; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#念-bg8  { animation-delay: 3.07s; }
#念-s8   { stroke-dasharray: 13.1625; stroke-dashoffset: 13.1625; animation: drawStroke 0.22s ease-out 3.20s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #念-s[i]) -->
<path id="念-s1"  class="stroke" stroke="#bf0909" d="M52.17,10C52.27,10.95,52.14,12.54,51.46,13.81C46.25,23.5,34.5,36.62,14.25,50.31"/>
<path id="念-s2"  class="stroke" stroke="#bf9109" d="M52.41,13.33C57.41,18.4,76.64,32.85,85.97999999999999,39.65C89.22999999999999,42.019999999999996,92.24999999999999,43.62,95.99999999999999,44.989999999999995"/>
<path id="念-s3"  class="stroke" stroke="#64bf09" d="M42.48,37.76C43.519999999999996,38.22,45.15,37.94,46.239999999999995,37.8C49.78999999999999,37.37,57.74999999999999,36.519999999999996,61.03999999999999,36.22C62.32999999999999,36.11,63.879999999999995,35.97,65.14999999999999,36.3"/>
<path id="念-s4"  class="stroke" stroke="#09bf36" d="M32.25,49.86C33.25,50.25,34.31,50.519999999999996,36.75,50.4C44.5,50.01,59.25,48.05,65.99,47.04C69.97999999999999,46.44,71.11999999999999,48.57,68.5,51.29C63,57,60.38,59.75,54.75,64.25"/>
<path id="念-s5"  class="stroke" stroke="#09bfbf" d="M22.4,79.55C22.77,81.78,18.68,91.61,15.709999999999997,95.32"/>
<path id="念-s6"  class="stroke" stroke="#0936bf" d="M33.94,76C42.87,91.13,55.25,98.13,78.31,96.65C88.49,96,88.5,94.5,81.4,89.38"/>
<path id="念-s7"  class="stroke" stroke="#6409bf" d="M51.47,72.25C54.62,78.75,57.18,79.22,58.21,75.85"/>
<path id="念-s8"  class="stroke" stroke="#bf0991" d="M81.27,68.45C83.88,70.37,87.25,74.37,89.06,78.88"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="念-bg1"  class="badge-group"><circle cx="52.17" cy="6.5" r="3.5" fill="#bf0909"/><text class="num-single" x="52.17" y="6.5" dx="0" dy="-0.5">1</text></g>
<g id="念-bg2"  class="badge-group"><circle cx="52.41" cy="16.83" r="3.5" fill="#bf9109"/><text class="num-single" x="52.41" y="16.83" dx="0" dy="-0.5">2</text></g>
<g id="念-bg3"  class="badge-group"><circle cx="42.48" cy="37.76" r="3.5" fill="#64bf09"/><text class="num-single" x="42.48" y="37.76" dx="0" dy="-0.5">3</text></g>
<g id="念-bg4"  class="badge-group"><circle cx="32.25" cy="49.86" r="3.5" fill="#09bf36"/><text class="num-single" x="32.25" y="49.86" dx="0" dy="-0.5">4</text></g>
<g id="念-bg5"  class="badge-group"><circle cx="22.4" cy="79.55" r="3.5" fill="#09bfbf"/><text class="num-single" x="22.4" y="79.55" dx="0" dy="-0.5">5</text></g>
<g id="念-bg6"  class="badge-group"><circle cx="33.94" cy="76" r="3.5" fill="#0936bf"/><text class="num-single" x="33.94" y="76" dx="0" dy="-0.5">6</text></g>
<g id="念-bg7"  class="badge-group"><circle cx="51.47" cy="72.25" r="3.5" fill="#6409bf"/><text class="num-single" x="51.47" y="72.25" dx="0" dy="-0.5">7</text></g>
<g id="念-bg8"  class="badge-group"><circle cx="81.27" cy="68.45" r="3.5" fill="#bf0991"/><text class="num-single" x="81.27" y="68.45" dx="0" dy="-0.5">8</text></g>
</svg>