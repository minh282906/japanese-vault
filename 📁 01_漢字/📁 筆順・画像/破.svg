<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (破)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #破-bg[i]: Thời gian quả bóng số nảy lên
   - #破-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#破-bg1  { animation-delay: 0.05s; }
#破-s1   { stroke-dasharray: 27.3442; stroke-dashoffset: 27.3442; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#破-bg2  { animation-delay: 0.42s; }
#破-s2   { stroke-dasharray: 40.9006; stroke-dashoffset: 40.9006; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#破-bg3  { animation-delay: 0.79s; }
#破-s3   { stroke-dasharray: 22.4840; stroke-dashoffset: 22.4840; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#破-bg4  { animation-delay: 1.16s; }
#破-s4   { stroke-dasharray: 36.8136; stroke-dashoffset: 36.8136; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#破-bg5  { animation-delay: 1.53s; }
#破-s5   { stroke-dasharray: 16.8728; stroke-dashoffset: 16.8728; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#破-bg6  { animation-delay: 1.90s; }
#破-s6   { stroke-dasharray: 60.7814; stroke-dashoffset: 60.7814; animation: drawStroke 0.33s ease-out 2.03s forwards; }
#破-bg7  { animation-delay: 2.38s; }
#破-s7   { stroke-dasharray: 48.3225; stroke-dashoffset: 48.3225; animation: drawStroke 0.27s ease-out 2.51s forwards; }
#破-bg8  { animation-delay: 2.80s; }
#破-s8   { stroke-dasharray: 41.1321; stroke-dashoffset: 41.1321; animation: drawStroke 0.23s ease-out 2.93s forwards; }
#破-bg9  { animation-delay: 3.18s; }
#破-s9   { stroke-dasharray: 81.8806; stroke-dashoffset: 81.8806; animation: drawStroke 0.45s ease-out 3.31s forwards; }
#破-bg10  { animation-delay: 3.78s; }
#破-s10   { stroke-dasharray: 47.8564; stroke-dashoffset: 47.8564; animation: drawStroke 0.26s ease-out 3.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #破-s[i]) -->
<path id="破-s1"  class="stroke" stroke="#bf0909" d="M15.64,32.91C16.75,33.25,18.66,33.129999999999995,19.5,33.059999999999995C25.09,32.559999999999995,32.2,31.269999999999996,38.019999999999996,30.429999999999996C39.6,30.2,41.15,30,42.75,30"/>
<path id="破-s2"  class="stroke" stroke="#bf7609" d="M25.94,35.48C26.25,36.37,26.19,37.779999999999994,25.85,39C23.5,47.5,18.62,62,10.36,72.73"/>
<path id="破-s3"  class="stroke" stroke="#9abf09" d="M21.14,59.92C21.86,60.64,22.36,61.71,22.55,63.260000000000005C22.970000000000002,66.69000000000001,23.75,72.03,24.3,77.19C24.470000000000002,78.81,24.63,80.39999999999999,24.740000000000002,81.92"/>
<path id="破-s4"  class="stroke" stroke="#2dbf09" d="M22.99,61.08C27.43,60.589999999999996,35.75,59.239999999999995,40.019999999999996,58.76C42.79,58.449999999999996,44.08,59.14,43.449999999999996,62.15C42.779999999999994,65.38,42.05,68.17,40.55,75.24"/>
<path id="破-s5"  class="stroke" stroke="#09bf52" d="M25.47,78.19C28.189999999999998,77.88,33.93,76.95,38.739999999999995,76.39999999999999C40.059999999999995,76.24999999999999,41.24999999999999,76.14999999999999,42.209999999999994,76.11999999999999"/>
<path id="破-s6"  class="stroke" stroke="#09bfbf" d="M51.75,33.37C52.5,34.12,53,35.69,53.03,37.97C53.370000000000005,62.129999999999995,51.5,79.88,39.870000000000005,90.64"/>
<path id="破-s7"  class="stroke" stroke="#0952bf" d="M53.88,35.26C66.28,32.5,77.5,30.619999999999997,87.64,29.83C96.66,29.13,89.74,37.12,88.01,39.11"/>
<path id="破-s8"  class="stroke" stroke="#2d09bf" d="M69.72,12.5C70.67,13.45,71.16,14.75,71.16,16C71.16,17.04,71.05,43,71.05,53.25"/>
<path id="破-s9"  class="stroke" stroke="#9a09bf" d="M59.22,55.67C60.39,56,61.66,56.29,64,55.800000000000004C69.01,54.75000000000001,77.35,52.970000000000006,82.24,51.730000000000004C84.63,51.120000000000005,85.89999999999999,52.89,85.17999999999999,54.59C77.77,72.17,68.38,86.12,51.11999999999999,93.38"/>
<path id="破-s10"  class="stroke" stroke="#bf0976" d="M59.04,62.37C62.25,63.05,76.21000000000001,79.71,88.00999999999999,88.75C90.25999999999999,90.47,92.60999999999999,92.21,95.02999999999999,93.69"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="破-bg1"  class="badge-group"><circle cx="15.64" cy="32.91" r="3.5" fill="#bf0909"/><text class="num-single" x="15.64" y="32.91" dx="0" dy="-0.5">1</text></g>
<g id="破-bg2"  class="badge-group"><circle cx="25.94" cy="35.48" r="3.5" fill="#bf7609"/><text class="num-single" x="25.94" y="35.48" dx="0" dy="-0.5">2</text></g>
<g id="破-bg3"  class="badge-group"><circle cx="21.14" cy="56.42" r="3.5" fill="#9abf09"/><text class="num-single" x="21.14" y="56.42" dx="0" dy="-0.5">3</text></g>
<g id="破-bg4"  class="badge-group"><circle cx="22.99" cy="64.58" r="3.5" fill="#2dbf09"/><text class="num-single" x="22.99" y="64.58" dx="0" dy="-0.5">4</text></g>
<g id="破-bg5"  class="badge-group"><circle cx="25.47" cy="78.19" r="3.5" fill="#09bf52"/><text class="num-single" x="25.47" y="78.19" dx="0" dy="-0.5">5</text></g>
<g id="破-bg6"  class="badge-group"><circle cx="51.75" cy="29.87" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.75" y="29.87" dx="0" dy="-0.5">6</text></g>
<g id="破-bg7"  class="badge-group"><circle cx="53.88" cy="38.76" r="3.5" fill="#0952bf"/><text class="num-single" x="53.88" y="38.76" dx="0" dy="-0.5">7</text></g>
<g id="破-bg8"  class="badge-group"><circle cx="69.72" cy="12.5" r="3.5" fill="#2d09bf"/><text class="num-single" x="69.72" y="12.5" dx="0" dy="-0.5">8</text></g>
<g id="破-bg9"  class="badge-group"><circle cx="59.22" cy="52.17" r="3.5" fill="#9a09bf"/><text class="num-single" x="59.22" y="52.17" dx="0" dy="-0.5">9</text></g>
<g id="破-bg10" class="badge-group"><circle cx="59.04" cy="65.87" r="3.5" fill="#bf0976"/><text class="num-double" x="59.04" y="65.87" dx="-0.4" dy="-0.475">10</text></g>
</svg>