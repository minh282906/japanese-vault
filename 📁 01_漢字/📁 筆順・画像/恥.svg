<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (恥)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #恥-bg[i]: Thời gian quả bóng số nảy lên
   - #恥-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#恥-bg1  { animation-delay: 0.05s; }
#恥-s1   { stroke-dasharray: 41.6460; stroke-dashoffset: 41.6460; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#恥-bg2  { animation-delay: 0.43s; }
#恥-s2   { stroke-dasharray: 45.3673; stroke-dashoffset: 45.3673; animation: drawStroke 0.25s ease-out 0.56s forwards; }
#恥-bg3  { animation-delay: 0.83s; }
#恥-s3   { stroke-dasharray: 18.4906; stroke-dashoffset: 18.4906; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#恥-bg4  { animation-delay: 1.20s; }
#恥-s4   { stroke-dasharray: 18.3697; stroke-dashoffset: 18.3697; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#恥-bg5  { animation-delay: 1.57s; }
#恥-s5   { stroke-dasharray: 30.9520; stroke-dashoffset: 30.9520; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#恥-bg6  { animation-delay: 1.94s; }
#恥-s6   { stroke-dasharray: 69.4352; stroke-dashoffset: 69.4352; animation: drawStroke 0.38s ease-out 2.07s forwards; }
#恥-bg7  { animation-delay: 2.47s; }
#恥-s7   { stroke-dasharray: 23.3995; stroke-dashoffset: 23.3995; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#恥-bg8  { animation-delay: 2.84s; }
#恥-s8   { stroke-dasharray: 69.7694; stroke-dashoffset: 69.7694; animation: drawStroke 0.38s ease-out 2.97s forwards; }
#恥-bg9  { animation-delay: 3.37s; }
#恥-s9   { stroke-dasharray: 11.7734; stroke-dashoffset: 11.7734; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#恥-bg10  { animation-delay: 3.74s; }
#恥-s10   { stroke-dasharray: 13.9329; stroke-dashoffset: 13.9329; animation: drawStroke 0.22s ease-out 3.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #恥-s[i]) -->
<path id="恥-s1"  class="stroke" stroke="#bf0909" d="M9.69,24.26C11.89,25.16,14.52,24.540000000000003,16.77,24.270000000000003C24.63,23.32,33.28,22.1,44,20.9C46.44,20.63,48.6,20.31,51,20.9"/>
<path id="恥-s2"  class="stroke" stroke="#bf7609" d="M19.68,27.47C20.61,28.4,20.96,29.66,20.96,30.97C20.96,32.269999999999996,20.880000000000003,67.82,20.880000000000003,72.50999999999999"/>
<path id="恥-s3"  class="stroke" stroke="#9abf09" d="M22.05,39.74C26.25,39.13,36.120000000000005,37.63,40.379999999999995,37.33"/>
<path id="恥-s4"  class="stroke" stroke="#2dbf09" d="M21.99,54.96C29.5,53.71,31,53.19,40.16,52.31"/>
<path id="恥-s5"  class="stroke" stroke="#09bf52" d="M11,76.57C11.88,77.63,13.379999999999999,77.63,15.120000000000001,76.82C18.46,75.27,32.13,68.38,38.88,65.1"/>
<path id="恥-s6"  class="stroke" stroke="#09bfbf" d="M40,24.8C41,25.97,41.1,27.43,41.1,28.73C41.1,29.6,41.04,69.3,41.02,86.37C41.010000000000005,90.75,41.010000000000005,93.64,41.010000000000005,93.99000000000001"/>
<path id="恥-s7"  class="stroke" stroke="#0952bf" d="M50.86,53.25C51,58.37,49.53,71.03,48.46,76.5"/>
<path id="恥-s8"  class="stroke" stroke="#2d09bf" d="M56.81,46.25C62.75,69.12,73,81.5,88.61,82.7C99.53999999999999,83.54,99,80.25,91.67999999999999,74.33"/>
<path id="恥-s9"  class="stroke" stroke="#9a09bf" d="M68.72,45.5C71.12,50.38,74.87,55.16,75.8,50.4"/>
<path id="恥-s10"  class="stroke" stroke="#bf0976" d="M87.25,43.75C90.18,46.05,92.75,49.37,94.75,55.25"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="恥-bg1"  class="badge-group"><circle cx="9.69" cy="24.26" r="3.5" fill="#bf0909"/><text class="num-single" x="9.69" y="24.26" dx="0" dy="-0.5">1</text></g>
<g id="恥-bg2"  class="badge-group"><circle cx="19.68" cy="27.47" r="3.5" fill="#bf7609"/><text class="num-single" x="19.68" y="27.47" dx="0" dy="-0.5">2</text></g>
<g id="恥-bg3"  class="badge-group"><circle cx="22.05" cy="39.74" r="3.5" fill="#9abf09"/><text class="num-single" x="22.05" y="39.74" dx="0" dy="-0.5">3</text></g>
<g id="恥-bg4"  class="badge-group"><circle cx="21.99" cy="54.96" r="3.5" fill="#2dbf09"/><text class="num-single" x="21.99" y="54.96" dx="0" dy="-0.5">4</text></g>
<g id="恥-bg5"  class="badge-group"><circle cx="11" cy="76.57" r="3.5" fill="#09bf52"/><text class="num-single" x="11" y="76.57" dx="0" dy="-0.5">5</text></g>
<g id="恥-bg6"  class="badge-group"><circle cx="40" cy="24.8" r="3.5" fill="#09bfbf"/><text class="num-single" x="40" y="24.8" dx="0" dy="-0.5">6</text></g>
<g id="恥-bg7"  class="badge-group"><circle cx="50.86" cy="53.25" r="3.5" fill="#0952bf"/><text class="num-single" x="50.86" y="53.25" dx="0" dy="-0.5">7</text></g>
<g id="恥-bg8"  class="badge-group"><circle cx="56.81" cy="46.25" r="3.5" fill="#2d09bf"/><text class="num-single" x="56.81" y="46.25" dx="0" dy="-0.5">8</text></g>
<g id="恥-bg9"  class="badge-group"><circle cx="68.72" cy="45.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="68.72" y="45.5" dx="0" dy="-0.5">9</text></g>
<g id="恥-bg10" class="badge-group"><circle cx="87.25" cy="43.75" r="3.5" fill="#bf0976"/><text class="num-double" x="87.25" y="43.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>