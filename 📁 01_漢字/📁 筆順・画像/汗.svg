<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (汗)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #汗-bg[i]: Thời gian quả bóng số nảy lên
   - #汗-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#汗-bg1  { animation-delay: 0.05s; }
#汗-s1   { stroke-dasharray: 17.2629; stroke-dashoffset: 17.2629; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#汗-bg2  { animation-delay: 0.42s; }
#汗-s2   { stroke-dasharray: 15.9921; stroke-dashoffset: 15.9921; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#汗-bg3  { animation-delay: 0.79s; }
#汗-s3   { stroke-dasharray: 25.9097; stroke-dashoffset: 25.9097; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#汗-bg4  { animation-delay: 1.16s; }
#汗-s4   { stroke-dasharray: 43.4831; stroke-dashoffset: 43.4831; animation: drawStroke 0.24s ease-out 1.29s forwards; }
#汗-bg5  { animation-delay: 1.55s; }
#汗-s5   { stroke-dasharray: 59.7843; stroke-dashoffset: 59.7843; animation: drawStroke 0.33s ease-out 1.68s forwards; }
#汗-bg6  { animation-delay: 2.03s; }
#汗-s6   { stroke-dasharray: 73.4555; stroke-dashoffset: 73.4555; animation: drawStroke 0.40s ease-out 2.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #汗-s[i]) -->
<path id="汗-s1"  class="stroke" stroke="#bf0909" d="M22,14C27.03,15.65,33.5,19.5,36.25,23.34"/>
<path id="汗-s2"  class="stroke" stroke="#bfbf09" d="M14.88,38.12C19.42,39.73,26.62,44.739999999999995,27.76,47.239999999999995"/>
<path id="汗-s3"  class="stroke" stroke="#09bf09" d="M16.91,88.2C18.09,88.69,19.29,88.42,20,87.21000000000001C22.75,82.51,27.5,73.26,30,67.26"/>
<path id="汗-s4"  class="stroke" stroke="#09bfbf" d="M45.17,20.87C47.75,21.630000000000003,50.650000000000006,21.150000000000002,52.75,20.880000000000003C59.79,19.970000000000002,72.85,18.340000000000003,81.26,17.470000000000002C83.63000000000001,17.230000000000004,86.75,17.250000000000004,88.37,17.580000000000002"/>
<path id="汗-s5"  class="stroke" stroke="#0909bf" d="M38.38,46.53C41.040000000000006,47.47,44.650000000000006,47.1,47.38,46.82C59.22,45.58,77.38,43.57,90.12,42.96C92.74000000000001,42.83,95.29,42.730000000000004,97.88000000000001,43.28"/>
<path id="汗-s6"  class="stroke" stroke="#bf09bf" d="M65.56,22.88C66.59,23.91,67.35000000000001,25.5,67.35000000000001,27.46C67.35000000000001,30.93,67.29,71.1,67.27000000000001,88.37C67.27000000000001,92.25,67.26,94.98,67.26,95.87"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="汗-bg1"  class="badge-group"><circle cx="22" cy="14" r="3.5" fill="#bf0909"/><text class="num-single" x="22" y="14" dx="0" dy="-0.5">1</text></g>
<g id="汗-bg2"  class="badge-group"><circle cx="14.88" cy="38.12" r="3.5" fill="#bfbf09"/><text class="num-single" x="14.88" y="38.12" dx="0" dy="-0.5">2</text></g>
<g id="汗-bg3"  class="badge-group"><circle cx="16.91" cy="88.2" r="3.5" fill="#09bf09"/><text class="num-single" x="16.91" y="88.2" dx="0" dy="-0.5">3</text></g>
<g id="汗-bg4"  class="badge-group"><circle cx="45.17" cy="20.87" r="3.5" fill="#09bfbf"/><text class="num-single" x="45.17" y="20.87" dx="0" dy="-0.5">4</text></g>
<g id="汗-bg5"  class="badge-group"><circle cx="38.38" cy="46.53" r="3.5" fill="#0909bf"/><text class="num-single" x="38.38" y="46.53" dx="0" dy="-0.5">5</text></g>
<g id="汗-bg6"  class="badge-group"><circle cx="65.56" cy="22.88" r="3.5" fill="#bf09bf"/><text class="num-single" x="65.56" y="22.88" dx="0" dy="-0.5">6</text></g>
</svg>