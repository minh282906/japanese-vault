<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (任)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #任-bg[i]: Thời gian quả bóng số nảy lên
   - #任-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#任-bg1  { animation-delay: 0.05s; }
#任-s1   { stroke-dasharray: 50.1729; stroke-dashoffset: 50.1729; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#任-bg2  { animation-delay: 0.48s; }
#任-s2   { stroke-dasharray: 54.3314; stroke-dashoffset: 54.3314; animation: drawStroke 0.30s ease-out 0.61s forwards; }
#任-bg3  { animation-delay: 0.93s; }
#任-s3   { stroke-dasharray: 37.8272; stroke-dashoffset: 37.8272; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#任-bg4  { animation-delay: 1.30s; }
#任-s4   { stroke-dasharray: 58.8892; stroke-dashoffset: 58.8892; animation: drawStroke 0.32s ease-out 1.43s forwards; }
#任-bg5  { animation-delay: 1.77s; }
#任-s5   { stroke-dasharray: 54.5467; stroke-dashoffset: 54.5467; animation: drawStroke 0.30s ease-out 1.90s forwards; }
#任-bg6  { animation-delay: 2.22s; }
#任-s6   { stroke-dasharray: 47.6963; stroke-dashoffset: 47.6963; animation: drawStroke 0.26s ease-out 2.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #任-s[i]) -->
<path id="任-s1"  class="stroke" stroke="#bf0909" d="M34,16.25C34.24,18.38,33.89,20.41,33.17,22.25C28.740000000000002,33.75,22.86,46.36,11.740000000000002,60.54"/>
<path id="任-s2"  class="stroke" stroke="#bfbf09" d="M27.03,40.25C27.76,40.98,28.3,42.1,28.3,43.49C28.3,54.94,28.400000000000002,78.71000000000001,28.28,89.5C28.26,91.45,28.25,93.07,28.25,94.25"/>
<path id="任-s3"  class="stroke" stroke="#09bf09" d="M79.18,16.5C79,17.38,78.01,18.53,77.38000000000001,19.03C70.93,24.220000000000002,62.09000000000001,28.57,45.84000000000001,32.81"/>
<path id="任-s4"  class="stroke" stroke="#09bfbf" d="M39.2,55.35C41.75,56,44.93000000000001,56.04,47.260000000000005,55.77C59.50000000000001,54.370000000000005,78.18,52.290000000000006,90.51,51.85C92.95,51.76,95.43,51.63,97.81,52.27"/>
<path id="任-s5"  class="stroke" stroke="#0909bf" d="M67.29,29.86C68.15,30.72,68.68,32.12,68.68,33.32C68.68,34.25,68.5,75.5,68.5,84.05"/>
<path id="任-s6"  class="stroke" stroke="#bf09bf" d="M46.33,86.03C48.629999999999995,86.5,50.87,86.33,52.89,86.22C63.24,85.64,76.84,84.03,87.61,83.8C89.69,83.75999999999999,91.84,83.63,93.89,84.1"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="任-bg1"  class="badge-group"><circle cx="34" cy="16.25" r="3.5" fill="#bf0909"/><text class="num-single" x="34" y="16.25" dx="0" dy="-0.5">1</text></g>
<g id="任-bg2"  class="badge-group"><circle cx="27.03" cy="40.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="27.03" y="40.25" dx="0" dy="-0.5">2</text></g>
<g id="任-bg3"  class="badge-group"><circle cx="79.18" cy="16.5" r="3.5" fill="#09bf09"/><text class="num-single" x="79.18" y="16.5" dx="0" dy="-0.5">3</text></g>
<g id="任-bg4"  class="badge-group"><circle cx="39.2" cy="55.35" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.2" y="55.35" dx="0" dy="-0.5">4</text></g>
<g id="任-bg5"  class="badge-group"><circle cx="67.29" cy="29.86" r="3.5" fill="#0909bf"/><text class="num-single" x="67.29" y="29.86" dx="0" dy="-0.5">5</text></g>
<g id="任-bg6"  class="badge-group"><circle cx="46.33" cy="86.03" r="3.5" fill="#bf09bf"/><text class="num-single" x="46.33" y="86.03" dx="0" dy="-0.5">6</text></g>
</svg>