<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (適)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #適-bg[i]: Thời gian quả bóng số nảy lên
   - #適-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#適-bg1  { animation-delay: 0.05s; }
#適-s1   { stroke-dasharray: 10.9376; stroke-dashoffset: 10.9376; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#適-bg2  { animation-delay: 0.42s; }
#適-s2   { stroke-dasharray: 46.3247; stroke-dashoffset: 46.3247; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#適-bg3  { animation-delay: 0.82s; }
#適-s3   { stroke-dasharray: 11.5084; stroke-dashoffset: 11.5084; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#適-bg4  { animation-delay: 1.19s; }
#適-s4   { stroke-dasharray: 14.0320; stroke-dashoffset: 14.0320; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#適-bg5  { animation-delay: 1.56s; }
#適-s5   { stroke-dasharray: 40.3700; stroke-dashoffset: 40.3700; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#適-bg6  { animation-delay: 1.93s; }
#適-s6   { stroke-dasharray: 96.6234; stroke-dashoffset: 96.6234; animation: drawStroke 0.53s ease-out 2.06s forwards; }
#適-bg7  { animation-delay: 2.61s; }
#適-s7   { stroke-dasharray: 27.5999; stroke-dashoffset: 27.5999; animation: drawStroke 0.22s ease-out 2.74s forwards; }
#適-bg8  { animation-delay: 2.98s; }
#適-s8   { stroke-dasharray: 18.4078; stroke-dashoffset: 18.4078; animation: drawStroke 0.22s ease-out 3.11s forwards; }
#適-bg9  { animation-delay: 3.35s; }
#適-s9   { stroke-dasharray: 14.7870; stroke-dashoffset: 14.7870; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#適-bg10  { animation-delay: 3.72s; }
#適-s10   { stroke-dasharray: 30.5464; stroke-dashoffset: 30.5464; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#適-bg11  { animation-delay: 4.09s; }
#適-s11   { stroke-dasharray: 15.6223; stroke-dashoffset: 15.6223; animation: drawStroke 0.22s ease-out 4.22s forwards; }
#適-bg12  { animation-delay: 4.46s; }
#適-s12   { stroke-dasharray: 17.5965; stroke-dashoffset: 17.5965; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#適-bg13  { animation-delay: 4.83s; }
#適-s13   { stroke-dasharray: 67.5544; stroke-dashoffset: 67.5544; animation: drawStroke 0.37s ease-out 4.96s forwards; }
#適-bg14  { animation-delay: 5.35s; }
#適-s14   { stroke-dasharray: 78.3005; stroke-dashoffset: 78.3005; animation: drawStroke 0.43s ease-out 5.48s forwards; }
]]>
</style>

