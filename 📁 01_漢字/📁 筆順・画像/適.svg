<path id="適-s10"  class="stroke" stroke="#0923bf" d="M57.23,62.17C62.56999999999999,61.32,68.64999999999999,60.4,73.39,59.730000000000004C75.54,59.43000000000001,76.72,60.160000000000004,76.17,62.410000000000004C75.56,64.92,74.28,68.47,73.66,71.31"/>
