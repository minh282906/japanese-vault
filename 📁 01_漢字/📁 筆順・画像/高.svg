<g id="高-bg7"  class="badge-group"><circle cx="24.06" cy="67.5" r="3.5" fill="#0952bf"/><text class="num-single" x="24.06" y="67.5" dx="0" dy="-0.5">7</text></g>
<g id="高-bg8"  class="badge-group"><circle cx="41.5" cy="68.18" r="3.5" fill="#2d09bf"/><text class="num-single" x="41.5" y="68.18" dx="0" dy="-0.5">8</text></g>
<g id="高-bg9"  class="badge-group"><circle cx="44.02" cy="76.58" r="3.5" fill="#9a09bf"/><text class="num-single" x="44.02" y="76.58" dx="0" dy="-0.5">9</text></g>
<g id="高-bg10" class="badge-group"><circle cx="46.44" cy="87.05" r="3.5" fill="#bf0976"/><text class="num-double" x="46.44" y="87.05" dx="-0.4" dy="-0.475">10</text></g>
</svg>