<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (高)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #高-bg[i]: Thời gian quả bóng số nảy lên
   - #高-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#高-bg1  { animation-delay: 0.05s; }
#高-s1   { stroke-dasharray: 10.0619; stroke-dashoffset: 10.0619; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#高-bg2  { animation-delay: 0.42s; }
#高-s2   { stroke-dasharray: 63.9085; stroke-dashoffset: 63.9085; animation: drawStroke 0.35s ease-out 0.55s forwards; }
#高-bg3  { animation-delay: 0.92s; }
#高-s3   { stroke-dasharray: 18.5736; stroke-dashoffset: 18.5736; animation: drawStroke 0.22s ease-out 1.05s forwards; }
#高-bg4  { animation-delay: 1.29s; }
#高-s4   { stroke-dasharray: 46.4766; stroke-dashoffset: 46.4766; animation: drawStroke 0.26s ease-out 1.42s forwards; }
#高-bg5  { animation-delay: 1.70s; }
#高-s5   { stroke-dasharray: 29.7268; stroke-dashoffset: 29.7268; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#高-bg6  { animation-delay: 2.07s; }
#高-s6   { stroke-dasharray: 36.5315; stroke-dashoffset: 36.5315; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#高-bg7  { animation-delay: 2.44s; }
#高-s7   { stroke-dasharray: 110.5260; stroke-dashoffset: 110.5260; animation: drawStroke 0.55s ease-out 2.57s forwards; }
#高-bg8  { animation-delay: 3.14s; }
#高-s8   { stroke-dasharray: 17.7378; stroke-dashoffset: 17.7378; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#高-bg9  { animation-delay: 3.51s; }
#高-s9   { stroke-dasharray: 37.9714; stroke-dashoffset: 37.9714; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#高-bg10  { animation-delay: 3.88s; }
#高-s10   { stroke-dasharray: 20.0916; stroke-dashoffset: 20.0916; animation: drawStroke 0.22s ease-out 4.01s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #高-s[i]) -->
<path id="高-s1"  class="stroke" stroke="#bf0909" d="M52.47,11.75C53.55,12.83,53.949999999999996,14,53.949999999999996,15.969999999999999C53.949999999999996,17.5,53.83,20.25,53.83,21.419999999999998"/>
<path id="高-s2"  class="stroke" stroke="#bf7609" d="M22.9,25.7C25.58,26,27.86,25.96,30.369999999999997,25.66C45.129999999999995,23.88,66.19999999999999,21.5,79.66999999999999,20.490000000000002C82.55999999999999,20.270000000000003,84.65999999999998,20.37,86.47999999999999,20.82"/>
<path id="高-s3"  class="stroke" stroke="#9abf09" d="M36.25,34.75C37.25,35.38,37.75,36.25,38.03,37.64C38.75,41.230000000000004,39.39,45.01,40.08,49.49C40.28,50.79,40.25,51.31,40.519999999999996,52.5"/>
<path id="高-s4"  class="stroke" stroke="#2dbf09" d="M39.05,36.33C49,34.62,63.03999999999999,32.68,68.66,32.23C71.61999999999999,31.999999999999996,72.49,33.25,71.8,35.54C70.92,38.47,69.63,42.55,68.48,45.739999999999995"/>
<path id="高-s5"  class="stroke" stroke="#09bf52" d="M41.28,49.94C47.85,49.519999999999996,57.64,48.07,67,47.23C68.3,47.11,69.59,47.01,70.85,46.919999999999995"/>
<path id="高-s6"  class="stroke" stroke="#09bfbf" d="M21,60.25C22.31,61.56,22.9,63.01,23.21,65.25C24,70.87,25.42,83.44,26.37,92.24C26.52,93.63,26.650000000000002,94.91,26.75,96"/>
<path id="高-s7"  class="stroke" stroke="#0952bf" d="M24.06,64C40.14,62.49,82.69,57.45,84.25,57.25C88,56.75,90.25,58.75,89.5,63.5C88.01,72.95,86.88,83.12,84.25,91.75C82.2,98.5,78.87,94.25,76.45,91.75"/>
<path id="高-s8"  class="stroke" stroke="#2d09bf" d="M41.5,71.68C42.16,72.34,42.66,73.31,42.81,74.15C43.7,76.97,44.39,81.39,45.2,85.96000000000001C45.410000000000004,87.12,45.6,87.74000000000001,45.760000000000005,88.75000000000001"/>
<path id="高-s9"  class="stroke" stroke="#9a09bf" d="M44.02,73.08C50.81,71.72,61.120000000000005,70.22,64.94,69.73C66.75,69.5,68.25,70.75,68.07,72.23C67.72,75.15,66.11,80.54,64.94999999999999,83.98"/>
<path id="高-s10"  class="stroke" stroke="#bf0976" d="M46.44,87.05C51.05,86.64999999999999,57.449999999999996,85.74,63.76,85.11C64.64,85.02,65.53,84.94,66.41,84.85"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="高-bg1"  class="badge-group"><circle cx="52.47" cy="11.75" r="3.5" fill="#bf0909"/><text class="num-single" x="52.47" y="11.75" dx="0" dy="-0.5">1</text></g>
<g id="高-bg2"  class="badge-group"><circle cx="22.9" cy="25.7" r="3.5" fill="#bf7609"/><text class="num-single" x="22.9" y="25.7" dx="0" dy="-0.5">2</text></g>
<g id="高-bg3"  class="badge-group"><circle cx="36.25" cy="31.25" r="3.5" fill="#9abf09"/><text class="num-single" x="36.25" y="31.25" dx="0" dy="-0.5">3</text></g>
<g id="高-bg4"  class="badge-group"><circle cx="39.05" cy="39.83" r="3.5" fill="#2dbf09"/><text class="num-single" x="39.05" y="39.83" dx="0" dy="-0.5">4</text></g>
<g id="高-bg5"  class="badge-group"><circle cx="41.28" cy="49.94" r="3.5" fill="#09bf52"/><text class="num-single" x="41.28" y="49.94" dx="0" dy="-0.5">5</text></g>
