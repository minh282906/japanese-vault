<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (緑)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #緑-bg[i]: Thời gian quả bóng số nảy lên
   - #緑-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#緑-bg1  { animation-delay: 0.05s; }
#緑-s1   { stroke-dasharray: 36.7293; stroke-dashoffset: 36.7293; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#緑-bg2  { animation-delay: 0.42s; }
#緑-s2   { stroke-dasharray: 63.0660; stroke-dashoffset: 63.0660; animation: drawStroke 0.35s ease-out 0.55s forwards; }
#緑-bg3  { animation-delay: 0.92s; }
#緑-s3   { stroke-dasharray: 13.4226; stroke-dashoffset: 13.4226; animation: drawStroke 0.22s ease-out 1.05s forwards; }
#緑-bg4  { animation-delay: 1.29s; }
#緑-s4   { stroke-dasharray: 36.1338; stroke-dashoffset: 36.1338; animation: drawStroke 0.22s ease-out 1.42s forwards; }
#緑-bg5  { animation-delay: 1.66s; }
#緑-s5   { stroke-dasharray: 19.2430; stroke-dashoffset: 19.2430; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#緑-bg6  { animation-delay: 2.03s; }
#緑-s6   { stroke-dasharray: 14.0884; stroke-dashoffset: 14.0884; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#緑-bg7  { animation-delay: 2.40s; }
#緑-s7   { stroke-dasharray: 57.7720; stroke-dashoffset: 57.7720; animation: drawStroke 0.32s ease-out 2.53s forwards; }
#緑-bg8  { animation-delay: 2.87s; }
#緑-s8   { stroke-dasharray: 30.4748; stroke-dashoffset: 30.4748; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#緑-bg9  { animation-delay: 3.24s; }
#緑-s9   { stroke-dasharray: 55.2293; stroke-dashoffset: 55.2293; animation: drawStroke 0.30s ease-out 3.37s forwards; }
#緑-bg10  { animation-delay: 3.69s; }
#緑-s10   { stroke-dasharray: 56.2235; stroke-dashoffset: 56.2235; animation: drawStroke 0.31s ease-out 3.82s forwards; }
#緑-bg11  { animation-delay: 4.15s; }
#緑-s11   { stroke-dasharray: 12.5578; stroke-dashoffset: 12.5578; animation: drawStroke 0.22s ease-out 4.28s forwards; }
#緑-bg12  { animation-delay: 4.52s; }
#緑-s12   { stroke-dasharray: 20.7720; stroke-dashoffset: 20.7720; animation: drawStroke 0.22s ease-out 4.65s forwards; }
#緑-bg13  { animation-delay: 4.89s; }
#緑-s13   { stroke-dasharray: 16.4292; stroke-dashoffset: 16.4292; animation: drawStroke 0.22s ease-out 5.02s forwards; }
#緑-bg14  { animation-delay: 5.26s; }
#緑-s14   { stroke-dasharray: 29.6878; stroke-dashoffset: 29.6878; animation: drawStroke 0.22s ease-out 5.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

