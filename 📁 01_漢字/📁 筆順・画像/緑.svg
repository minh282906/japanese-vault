<path id="緑-s10"  class="stroke" stroke="#0923bf" d="M68.77,44.08C69.97,45.28,70.53,46.5,70.53,48.349999999999994C70.53,62.91,70.52,82.00999999999999,70.52,86.97C70.52,97.75,65.31,89.22,63.809999999999995,87.97"/>
<path id="緑-s11"  class="stroke" stroke="#3d09bf" d="M49.5,54.75C52.5,56.34,57.25,61.28,58,63.75"/>
