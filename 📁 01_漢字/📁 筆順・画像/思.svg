<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (思)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #思-bg[i]: Thời gian quả bóng số nảy lên
   - #思-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#思-bg1  { animation-delay: 0.05s; }
#思-s1   { stroke-dasharray: 35.9841; stroke-dashoffset: 35.9841; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#思-bg2  { animation-delay: 0.42s; }
#思-s2   { stroke-dasharray: 86.8600; stroke-dashoffset: 86.8600; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#思-bg3  { animation-delay: 1.05s; }
#思-s3   { stroke-dasharray: 28.5604; stroke-dashoffset: 28.5604; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#思-bg4  { animation-delay: 1.42s; }
#思-s4   { stroke-dasharray: 47.5249; stroke-dashoffset: 47.5249; animation: drawStroke 0.26s ease-out 1.55s forwards; }
#思-bg5  { animation-delay: 1.83s; }
#思-s5   { stroke-dasharray: 44.2395; stroke-dashoffset: 44.2395; animation: drawStroke 0.24s ease-out 1.96s forwards; }
#思-bg6  { animation-delay: 2.22s; }
#思-s6   { stroke-dasharray: 19.1369; stroke-dashoffset: 19.1369; animation: drawStroke 0.22s ease-out 2.35s forwards; }
#思-bg7  { animation-delay: 2.59s; }
#思-s7   { stroke-dasharray: 74.1772; stroke-dashoffset: 74.1772; animation: drawStroke 0.41s ease-out 2.72s forwards; }
#思-bg8  { animation-delay: 3.15s; }
#思-s8   { stroke-dasharray: 12.0262; stroke-dashoffset: 12.0262; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#思-bg9  { animation-delay: 3.52s; }
#思-s9   { stroke-dasharray: 15.7307; stroke-dashoffset: 15.7307; animation: drawStroke 0.22s ease-out 3.65s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #思-s[i]) -->
<path id="思-s1"  class="stroke" stroke="#bf0909" d="M26.25,19.11C27.51,20.37,28.28,22.06,28.54,23.75C29.75,31.880000000000003,30.939999999999998,41.739999999999995,31.799999999999997,50.22C31.949999999999996,51.67,32.089999999999996,53.03,32.22,54.25"/>
<path id="思-s2"  class="stroke" stroke="#bf8209" d="M28.75,21C46.879999999999995,18.75,64.75,17,77.43,16.48C81.24000000000001,16.32,82.18,19.310000000000002,81.97000000000001,20.71C81.32000000000001,25.1,79.72000000000001,38.09,78.07000000000001,47.019999999999996C77.79,48.519999999999996,77.50000000000001,49.919999999999995,77.21000000000001,51.169999999999995"/>
<path id="思-s3"  class="stroke" stroke="#82bf09" d="M53.32,19.5C54.160000000000004,20.34,54.62,21.92,54.61,23.1C54.54,29.6,54.67,45.82,54.67,47.75"/>
<path id="思-s4"  class="stroke" stroke="#09bf09" d="M31.5,35.75C41.75,34.63,68.25,32,78.85,31.78"/>
<path id="思-s5"  class="stroke" stroke="#09bf82" d="M33.25,51.25C44.06,49.86,67.5,48,77.33,47.59"/>
<path id="思-s6"  class="stroke" stroke="#0982bf" d="M23.11,69.79C22.62,76,20.83,83.92,19,88.42"/>
<path id="思-s7"  class="stroke" stroke="#0909bf" d="M34.35,64.42C39.5,80.25,55.71,94.83,81.61,92.54C90.5,91.75,90,89.75,84.81,84.44000000000001"/>
<path id="思-s8"  class="stroke" stroke="#8209bf" d="M55.47,61.5C57.62,66.38,61.339999999999996,71.37,62.48,65.97"/>
<path id="思-s9"  class="stroke" stroke="#bf0982" d="M83,60.75C86.62,63.25,90.75,67.37,93.25,72.47"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="思-bg1"  class="badge-group"><circle cx="26.25" cy="15.61" r="3.5" fill="#bf0909"/><text class="num-single" x="26.25" y="15.61" dx="0" dy="-0.5">1</text></g>
<g id="思-bg2"  class="badge-group"><circle cx="28.75" cy="24.5" r="3.5" fill="#bf8209"/><text class="num-single" x="28.75" y="24.5" dx="0" dy="-0.5">2</text></g>
<g id="思-bg3"  class="badge-group"><circle cx="53.32" cy="19.5" r="3.5" fill="#82bf09"/><text class="num-single" x="53.32" y="19.5" dx="0" dy="-0.5">3</text></g>
<g id="思-bg4"  class="badge-group"><circle cx="31.5" cy="35.75" r="3.5" fill="#09bf09"/><text class="num-single" x="31.5" y="35.75" dx="0" dy="-0.5">4</text></g>
<g id="思-bg5"  class="badge-group"><circle cx="33.25" cy="51.25" r="3.5" fill="#09bf82"/><text class="num-single" x="33.25" y="51.25" dx="0" dy="-0.5">5</text></g>
<g id="思-bg6"  class="badge-group"><circle cx="23.11" cy="69.79" r="3.5" fill="#0982bf"/><text class="num-single" x="23.11" y="69.79" dx="0" dy="-0.5">6</text></g>
<g id="思-bg7"  class="badge-group"><circle cx="34.35" cy="64.42" r="3.5" fill="#0909bf"/><text class="num-single" x="34.35" y="64.42" dx="0" dy="-0.5">7</text></g>
<g id="思-bg8"  class="badge-group"><circle cx="55.47" cy="61.5" r="3.5" fill="#8209bf"/><text class="num-single" x="55.47" y="61.5" dx="0" dy="-0.5">8</text></g>
<g id="思-bg9"  class="badge-group"><circle cx="83" cy="60.75" r="3.5" fill="#bf0982"/><text class="num-single" x="83" y="60.75" dx="0" dy="-0.5">9</text></g>
</svg>