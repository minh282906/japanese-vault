<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (境)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #境-bg[i]: Thời gian quả bóng số nảy lên
   - #境-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#境-bg1  { animation-delay: 0.05s; }
#境-s1   { stroke-dasharray: 26.5002; stroke-dashoffset: 26.5002; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#境-bg2  { animation-delay: 0.42s; }
#境-s2   { stroke-dasharray: 50.8741; stroke-dashoffset: 50.8741; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#境-bg3  { animation-delay: 0.85s; }
#境-s3   { stroke-dasharray: 32.1283; stroke-dashoffset: 32.1283; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#境-bg4  { animation-delay: 1.22s; }
#境-s4   { stroke-dasharray: 11.6806; stroke-dashoffset: 11.6806; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#境-bg5  { animation-delay: 1.59s; }
#境-s5   { stroke-dasharray: 39.4901; stroke-dashoffset: 39.4901; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#境-bg6  { animation-delay: 1.96s; }
#境-s6   { stroke-dasharray: 10.6704; stroke-dashoffset: 10.6704; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#境-bg7  { animation-delay: 2.33s; }
#境-s7   { stroke-dasharray: 13.9830; stroke-dashoffset: 13.9830; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#境-bg8  { animation-delay: 2.70s; }
#境-s8   { stroke-dasharray: 54.2577; stroke-dashoffset: 54.2577; animation: drawStroke 0.30s ease-out 2.83s forwards; }
#境-bg9  { animation-delay: 3.15s; }
#境-s9   { stroke-dasharray: 20.7959; stroke-dashoffset: 20.7959; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#境-bg10  { animation-delay: 3.52s; }
#境-s10   { stroke-dasharray: 53.8171; stroke-dashoffset: 53.8171; animation: drawStroke 0.30s ease-out 3.65s forwards; }
#境-bg11  { animation-delay: 3.97s; }
#境-s11   { stroke-dasharray: 30.1715; stroke-dashoffset: 30.1715; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#境-bg12  { animation-delay: 4.34s; }
#境-s12   { stroke-dasharray: 26.6416; stroke-dashoffset: 26.6416; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#境-bg13  { animation-delay: 4.71s; }
#境-s13   { stroke-dasharray: 31.7069; stroke-dashoffset: 31.7069; animation: drawStroke 0.22s ease-out 4.84s forwards; }
#境-bg14  { animation-delay: 5.08s; }
#境-s14   { stroke-dasharray: 54.3043; stroke-dashoffset: 54.3043; animation: drawStroke 0.30s ease-out 5.21s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

