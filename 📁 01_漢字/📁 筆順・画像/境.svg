<path id="境-s9"  class="stroke" stroke="#0971bf" d="M47.63,50.38C48.43,51.18,48.870000000000005,52,49.07,53.260000000000005C49.39,55.300000000000004,50.42,62.03,51.08,66.48C51.42,68.78,51.67,70.47,51.67,70.58"/>
<path id="境-s10"  class="stroke" stroke="#0923bf" d="M49.67,51.41C53.54,50.69,72.71000000000001,48.41,78.87,47.76C82.06,47.43,83.67,48.199999999999996,83.26,51.62C82.72,56.14,81.95,59.51,80.94000000000001,63.64C80.58000000000001,65.1,80.20000000000002,66.64,79.78000000000002,68.37"/>
<path id="境-s11"  class="stroke" stroke="#3d09bf" d="M51.12,59.7C57.629999999999995,58.88,74.75,57,81.12,56.5"/>
<path id="境-s12"  class="stroke" stroke="#8b09bf" d="M52.57,68.71C59.75,68.11999999999999,69.88,66.86999999999999,79.08,66.07"/>
