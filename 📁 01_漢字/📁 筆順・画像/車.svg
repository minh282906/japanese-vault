<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (車)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #車-bg[i]: Thời gian quả bóng số nảy lên
   - #車-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#車-bg1  { animation-delay: 0.05s; }
#車-s1   { stroke-dasharray: 55.9720; stroke-dashoffset: 55.9720; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#車-bg2  { animation-delay: 0.51s; }
#車-s2   { stroke-dasharray: 27.7575; stroke-dashoffset: 27.7575; animation: drawStroke 0.22s ease-out 0.64s forwards; }
#車-bg3  { animation-delay: 0.88s; }
#車-s3   { stroke-dasharray: 77.3627; stroke-dashoffset: 77.3627; animation: drawStroke 0.43s ease-out 1.01s forwards; }
#車-bg4  { animation-delay: 1.46s; }
#車-s4   { stroke-dasharray: 47.1996; stroke-dashoffset: 47.1996; animation: drawStroke 0.26s ease-out 1.59s forwards; }
#車-bg5  { animation-delay: 1.87s; }
#車-s5   { stroke-dasharray: 42.9491; stroke-dashoffset: 42.9491; animation: drawStroke 0.24s ease-out 2.00s forwards; }
#車-bg6  { animation-delay: 2.26s; }
#車-s6   { stroke-dasharray: 77.6320; stroke-dashoffset: 77.6320; animation: drawStroke 0.43s ease-out 2.39s forwards; }
#車-bg7  { animation-delay: 2.84s; }
#車-s7   { stroke-dasharray: 85.9298; stroke-dashoffset: 85.9298; animation: drawStroke 0.47s ease-out 2.97s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #車-s[i]) -->
<path id="車-s1"  class="stroke" stroke="#bf0909" d="M26,26C28.85,26.69,32.1,26.14,34.980000000000004,25.9C46.07000000000001,24.97,60.78,23.259999999999998,73.87,22.39C76.55000000000001,22.21,79.09,22.23,81.75,22.62"/>
<path id="車-s2"  class="stroke" stroke="#bfa509" d="M27.5,37.92C28.31,38.42,29.33,40.31,29.48,40.97C30.330000000000002,44.699999999999996,31.310000000000002,52.28,32.43,59.51C32.75,61.599999999999994,32.839999999999996,62.71,33.18,64.75"/>
<path id="車-s3"  class="stroke" stroke="#3dbf09" d="M30.36,39.49C44.879999999999995,37.88,66.5,35.38,77.99000000000001,34.99C81.45,34.870000000000005,82.16000000000001,36.56,82.02000000000001,38.07C81.60000000000001,42.39,80.01,51.88,78.52000000000001,58.260000000000005C78.31000000000002,59.150000000000006,78.01,60.13,77.76,61.260000000000005"/>
<path id="車-s4"  class="stroke" stroke="#09bf71" d="M32.5,51.25C46.25,49.75,66.75,47.5,79.5,47"/>
<path id="車-s5"  class="stroke" stroke="#0971bf" d="M34.25,63.25C46,61.62,65,59.75,77,59.25"/>
<path id="車-s6"  class="stroke" stroke="#3d09bf" d="M16,77.86C19.62,78.75,23.38,78.63,26.630000000000003,78.25C45.14,76.11,66.48,73.7,83.75,72.8C86.8,72.64,90.25,72.75,93.25,73.42999999999999"/>
<path id="車-s7"  class="stroke" stroke="#bf09a5" d="M52.5,11.51C53.86,12.87,54.56,14.29,54.64,17.53C54.67,18.6,54.57,66.32,54.45,88.23C54.43,92.5,54.400000000000006,95.59,54.38,96.88000000000001"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="車-bg1"  class="badge-group"><circle cx="26" cy="26" r="3.5" fill="#bf0909"/><text class="num-single" x="26" y="26" dx="0" dy="-0.5">1</text></g>
<g id="車-bg2"  class="badge-group"><circle cx="27.5" cy="34.42" r="3.5" fill="#bfa509"/><text class="num-single" x="27.5" y="34.42" dx="0" dy="-0.5">2</text></g>
<g id="車-bg3"  class="badge-group"><circle cx="30.36" cy="42.99" r="3.5" fill="#3dbf09"/><text class="num-single" x="30.36" y="42.99" dx="0" dy="-0.5">3</text></g>
<g id="車-bg4"  class="badge-group"><circle cx="32.5" cy="51.25" r="3.5" fill="#09bf71"/><text class="num-single" x="32.5" y="51.25" dx="0" dy="-0.5">4</text></g>
<g id="車-bg5"  class="badge-group"><circle cx="34.25" cy="63.25" r="3.5" fill="#0971bf"/><text class="num-single" x="34.25" y="63.25" dx="0" dy="-0.5">5</text></g>
<g id="車-bg6"  class="badge-group"><circle cx="16" cy="77.86" r="3.5" fill="#3d09bf"/><text class="num-single" x="16" y="77.86" dx="0" dy="-0.5">6</text></g>
<g id="車-bg7"  class="badge-group"><circle cx="52.5" cy="11.51" r="3.5" fill="#bf09a5"/><text class="num-single" x="52.5" y="11.51" dx="0" dy="-0.5">7</text></g>
</svg>