<path id="情-s5"  class="stroke" stroke="#09bf2a" d="M66.46,11.88C67.47999999999999,12.9,68.02999999999999,14.620000000000001,68.02999999999999,15.81C68.02999999999999,21.740000000000002,67.84999999999998,35.64,67.91999999999999,42.97"/>
<path id="情-s6"  class="stroke" stroke="#09bf8d" d="M49.39,33.57C51.58,34.21,54.04,33.69,56.25,33.46C63.16,32.730000000000004,73.59,31.55,79.38,31.01C81.31,30.830000000000002,83.22999999999999,30.67,85.17,30.78"/>
<path id="情-s7"  class="stroke" stroke="#098dbf" d="M41.88,45.39C44.84,45.99,47.800000000000004,45.9,50.75,45.53C63.12,44,77.12,42.620000000000005,88.63,41.730000000000004C91.50999999999999,41.510000000000005,93.61999999999999,41.370000000000005,96,41.910000000000004"/>
<path id="情-s8"  class="stroke" stroke="#092abf" d="M53.6,55.03C54.47,55.9,55.09,57.38,55.09,58.68C55.09,62.38,54.96,80.05,55,90.38C55.01,92.82,55.01,94.21,55.01,95.5"/>
<path id="情-s9"  class="stroke" stroke="#4b09bf" d="M55.58,55.83C60.379999999999995,55.129999999999995,77.75,53.14,79.59,52.97C82.01,52.75,83.21000000000001,54.25,83.21000000000001,55.83C83.21000000000001,59.25,83.44000000000001,80.07,83.34,91.18C83.25,101,78.65,93.60000000000001,77.83,92.91000000000001"/>
<path id="情-s10"  class="stroke" stroke="#ae09bf" d="M56.08,66.61C64.38,65.62,73.25,65.25,82.27,64.64"/>
<path id="情-s11"  class="stroke" stroke="#bf096c" d="M56.19,77.99C63.12,77.5,74.5,76.75,82.09,76.32"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="情-bg1"  class="badge-group"><circle cx="18.2" cy="37.75" r="3.5" fill="#bf0909"/><text class="num-single" x="18.2" y="37.75" dx="0" dy="-0.5">1</text></g>
<g id="情-bg2"  class="badge-group"><circle cx="30.52" cy="29.33" r="3.5" fill="#bf6c09"/><text class="num-single" x="30.52" y="29.33" dx="0" dy="-0.5">2</text></g>
