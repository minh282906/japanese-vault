<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (情)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #情-bg[i]: Thời gian quả bóng số nảy lên
   - #情-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#情-bg1  { animation-delay: 0.05s; }
#情-s1   { stroke-dasharray: 18.3817; stroke-dashoffset: 18.3817; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#情-bg2  { animation-delay: 0.42s; }
#情-s2   { stroke-dasharray: 13.7711; stroke-dashoffset: 13.7711; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#情-bg3  { animation-delay: 0.79s; }
#情-s3   { stroke-dasharray: 80.3816; stroke-dashoffset: 80.3816; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#情-bg4  { animation-delay: 1.38s; }
#情-s4   { stroke-dasharray: 41.4760; stroke-dashoffset: 41.4760; animation: drawStroke 0.23s ease-out 1.51s forwards; }
#情-bg5  { animation-delay: 1.76s; }
#情-s5   { stroke-dasharray: 31.4867; stroke-dashoffset: 31.4867; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#情-bg6  { animation-delay: 2.13s; }
#情-s6   { stroke-dasharray: 35.9700; stroke-dashoffset: 35.9700; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#情-bg7  { animation-delay: 2.50s; }
#情-s7   { stroke-dasharray: 54.3877; stroke-dashoffset: 54.3877; animation: drawStroke 0.30s ease-out 2.63s forwards; }
#情-bg8  { animation-delay: 2.95s; }
#情-s8   { stroke-dasharray: 40.8539; stroke-dashoffset: 40.8539; animation: drawStroke 0.22s ease-out 3.08s forwards; }
#情-bg9  { animation-delay: 3.32s; }
#情-s9   { stroke-dasharray: 75.6995; stroke-dashoffset: 75.6995; animation: drawStroke 0.42s ease-out 3.45s forwards; }
#情-bg10  { animation-delay: 3.89s; }
#情-s10   { stroke-dasharray: 26.2675; stroke-dashoffset: 26.2675; animation: drawStroke 0.22s ease-out 4.02s forwards; }
#情-bg11  { animation-delay: 4.26s; }
#情-s11   { stroke-dasharray: 25.9539; stroke-dashoffset: 25.9539; animation: drawStroke 0.22s ease-out 4.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #情-s[i]) -->
<path id="情-s1"  class="stroke" stroke="#bf0909" d="M18.2,37.75C18.2,44.09,14.11,53.44,13.04,55.25"/>
