<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (速)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #速-bg[i]: Thời gian quả bóng số nảy lên
   - #速-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#速-bg1  { animation-delay: 0.05s; }
#速-s1   { stroke-dasharray: 45.8477; stroke-dashoffset: 45.8477; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#速-bg2  { animation-delay: 0.45s; }
#速-s2   { stroke-dasharray: 17.5519; stroke-dashoffset: 17.5519; animation: drawStroke 0.22s ease-out 0.58s forwards; }
#速-bg3  { animation-delay: 0.82s; }
#速-s3   { stroke-dasharray: 51.0225; stroke-dashoffset: 51.0225; animation: drawStroke 0.28s ease-out 0.95s forwards; }
#速-bg4  { animation-delay: 1.25s; }
#速-s4   { stroke-dasharray: 32.7017; stroke-dashoffset: 32.7017; animation: drawStroke 0.22s ease-out 1.38s forwards; }
#速-bg5  { animation-delay: 1.62s; }
#速-s5   { stroke-dasharray: 73.9641; stroke-dashoffset: 73.9641; animation: drawStroke 0.41s ease-out 1.75s forwards; }
#速-bg6  { animation-delay: 2.18s; }
#速-s6   { stroke-dasharray: 36.8451; stroke-dashoffset: 36.8451; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#速-bg7  { animation-delay: 2.55s; }
#速-s7   { stroke-dasharray: 27.1632; stroke-dashoffset: 27.1632; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#速-bg8  { animation-delay: 2.92s; }
#速-s8   { stroke-dasharray: 15.2532; stroke-dashoffset: 15.2532; animation: drawStroke 0.22s ease-out 3.05s forwards; }
#速-bg9  { animation-delay: 3.29s; }
#速-s9   { stroke-dasharray: 60.8841; stroke-dashoffset: 60.8841; animation: drawStroke 0.33s ease-out 3.42s forwards; }
#速-bg10  { animation-delay: 3.77s; }
#速-s10   { stroke-dasharray: 75.5452; stroke-dashoffset: 75.5452; animation: drawStroke 0.42s ease-out 3.90s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #速-s[i]) -->
<path id="速-s1"  class="stroke" stroke="#bf0909" d="M43.9,24.93C45.51,25.25,48.46,25.45,50.06,25.25C61,23.87,75.12,21.62,83.82,20.990000000000002C86.49,20.8,88.11,20.89,89.44,21.05"/>
<path id="速-s2"  class="stroke" stroke="#bf7609" d="M46.92,37.15C47.57,37.68,47.96,38.36,48.08,39.18C48.989999999999995,42.34,50.17,47.01,50.949999999999996,51.480000000000004C51.099999999999994,52.32000000000001,51.23,53.160000000000004,51.339999999999996,53.970000000000006"/>
<path id="速-s3"  class="stroke" stroke="#9abf09" d="M48.75,38.38C58.81,37.010000000000005,78.8,33.89,82.72999999999999,33.57C85.17999999999999,33.37,86.72999999999999,35.62,86.07999999999998,37.46C84.34999999999998,42.38,84.17999999999998,43.8,82.79999999999998,47.56"/>
<path id="速-s4"  class="stroke" stroke="#2dbf09" d="M52.25,51.87C60.79,50.809999999999995,72.23,49.4,81.27,48.55C82.5,48.43,83.66,48.339999999999996,84.75,48.269999999999996"/>
<path id="速-s5"  class="stroke" stroke="#09bf52" d="M65.02,10.25C66.00999999999999,11.24,66.64999999999999,12.61,66.64999999999999,13.47C66.64999999999999,16.48,66.71,57.949999999999996,66.74,76C66.74,79.85,66.75,82.63,66.75,83.75"/>
<path id="速-s6"  class="stroke" stroke="#09bfbf" d="M64.7,51.13C64.7,52,64.36,52.88,63.7,53.93C58.34,62.42,48.07,72.85,39.67,77.32"/>
<path id="速-s7"  class="stroke" stroke="#0952bf" d="M70.12,58.25C76.12,61.25,85.24000000000001,67.75,90.91,75.4"/>
<path id="速-s8"  class="stroke" stroke="#2d09bf" d="M20.5,18.88C24.29,20.73,30.3,26.5,31.25,29.39"/>
<path id="速-s9"  class="stroke" stroke="#9a09bf" d="M13,50.75C15.25,51.75,16.75,51.25,17.75,51S26.77,47.8,28.25,47.25C30.63,46.37,31.85,47.17,30.5,50C24.38,62.88,23.88,59.5,31,68.5C32.04,69.81,31.75,71.5,30.25,72.75S21.5,80.5,20,81"/>
<path id="速-s10"  class="stroke" stroke="#bf0976" d="M15.5,82.25C18.5,81.75,24.42,81.01,29,81.5C36,82.25,59.07,89.21,63.5,90.5C75.5,94,80,95,89.25,95.5"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="速-bg1"  class="badge-group"><circle cx="43.9" cy="24.93" r="3.5" fill="#bf0909"/><text class="num-single" x="43.9" y="24.93" dx="0" dy="-0.5">1</text></g>
<g id="速-bg2"  class="badge-group"><circle cx="46.92" cy="33.65" r="3.5" fill="#bf7609"/><text class="num-single" x="46.92" y="33.65" dx="0" dy="-0.5">2</text></g>
<g id="速-bg3"  class="badge-group"><circle cx="48.75" cy="41.88" r="3.5" fill="#9abf09"/><text class="num-single" x="48.75" y="41.88" dx="0" dy="-0.5">3</text></g>
<g id="速-bg4"  class="badge-group"><circle cx="52.25" cy="51.87" r="3.5" fill="#2dbf09"/><text class="num-single" x="52.25" y="51.87" dx="0" dy="-0.5">4</text></g>
<g id="速-bg5"  class="badge-group"><circle cx="65.02" cy="10.25" r="3.5" fill="#09bf52"/><text class="num-single" x="65.02" y="10.25" dx="0" dy="-0.5">5</text></g>
<g id="速-bg6"  class="badge-group"><circle cx="64.7" cy="51.13" r="3.5" fill="#09bfbf"/><text class="num-single" x="64.7" y="51.13" dx="0" dy="-0.5">6</text></g>
<g id="速-bg7"  class="badge-group"><circle cx="70.12" cy="58.25" r="3.5" fill="#0952bf"/><text class="num-single" x="70.12" y="58.25" dx="0" dy="-0.5">7</text></g>
<g id="速-bg8"  class="badge-group"><circle cx="20.5" cy="18.88" r="3.5" fill="#2d09bf"/><text class="num-single" x="20.5" y="18.88" dx="0" dy="-0.5">8</text></g>
<g id="速-bg9"  class="badge-group"><circle cx="13" cy="50.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="13" y="50.75" dx="0" dy="-0.5">9</text></g>
<g id="速-bg10" class="badge-group"><circle cx="15.5" cy="82.25" r="3.5" fill="#bf0976"/><text class="num-double" x="15.5" y="82.25" dx="-0.4" dy="-0.475">10</text></g>
</svg>