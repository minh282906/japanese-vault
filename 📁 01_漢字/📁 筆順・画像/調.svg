<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (調)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #調-bg[i]: Thời gian quả bóng số nảy lên
   - #調-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#調-bg1  { animation-delay: 0.05s; }
#調-s1   { stroke-dasharray: 10.7919; stroke-dashoffset: 10.7919; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#調-bg2  { animation-delay: 0.42s; }
#調-s2   { stroke-dasharray: 30.4507; stroke-dashoffset: 30.4507; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#調-bg3  { animation-delay: 0.79s; }
#調-s3   { stroke-dasharray: 20.1411; stroke-dashoffset: 20.1411; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#調-bg4  { animation-delay: 1.16s; }
#調-s4   { stroke-dasharray: 20.2488; stroke-dashoffset: 20.2488; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#調-bg5  { animation-delay: 1.53s; }
#調-s5   { stroke-dasharray: 20.1469; stroke-dashoffset: 20.1469; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#調-bg6  { animation-delay: 1.90s; }
#調-s6   { stroke-dasharray: 36.4128; stroke-dashoffset: 36.4128; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#調-bg7  { animation-delay: 2.27s; }
#調-s7   { stroke-dasharray: 16.0815; stroke-dashoffset: 16.0815; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#調-bg8  { animation-delay: 2.64s; }
#調-s8   { stroke-dasharray: 74.9808; stroke-dashoffset: 74.9808; animation: drawStroke 0.41s ease-out 2.77s forwards; }
#調-bg9  { animation-delay: 3.20s; }
#調-s9   { stroke-dasharray: 127.1110; stroke-dashoffset: 127.1110; animation: drawStroke 0.55s ease-out 3.33s forwards; }
#調-bg10  { animation-delay: 3.90s; }
#調-s10   { stroke-dasharray: 24.4399; stroke-dashoffset: 24.4399; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#調-bg11  { animation-delay: 4.27s; }
#調-s11   { stroke-dasharray: 25.1437; stroke-dashoffset: 25.1437; animation: drawStroke 0.22s ease-out 4.40s forwards; }
#調-bg12  { animation-delay: 4.64s; }
#調-s12   { stroke-dasharray: 30.1478; stroke-dashoffset: 30.1478; animation: drawStroke 0.22s ease-out 4.77s forwards; }
#調-bg13  { animation-delay: 5.01s; }
#調-s13   { stroke-dasharray: 18.3609; stroke-dashoffset: 18.3609; animation: drawStroke 0.22s ease-out 5.14s forwards; }
#調-bg14  { animation-delay: 5.38s; }
#調-s14   { stroke-dasharray: 34.4446; stroke-dashoffset: 34.4446; animation: drawStroke 0.22s ease-out 5.51s forwards; }
#調-bg15  { animation-delay: 5.75s; }
#調-s15   { stroke-dasharray: 16.3331; stroke-dashoffset: 16.3331; animation: drawStroke 0.22s ease-out 5.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
