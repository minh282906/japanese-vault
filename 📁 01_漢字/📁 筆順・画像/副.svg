<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (副)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #副-bg[i]: Thời gian quả bóng số nảy lên
   - #副-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#副-bg1  { animation-delay: 0.05s; }
#副-s1   { stroke-dasharray: 37.1121; stroke-dashoffset: 37.1121; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#副-bg2  { animation-delay: 0.42s; }
#副-s2   { stroke-dasharray: 16.8430; stroke-dashoffset: 16.8430; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#副-bg3  { animation-delay: 0.79s; }
#副-s3   { stroke-dasharray: 44.4511; stroke-dashoffset: 44.4511; animation: drawStroke 0.24s ease-out 0.92s forwards; }
#副-bg4  { animation-delay: 1.18s; }
#副-s4   { stroke-dasharray: 27.9520; stroke-dashoffset: 27.9520; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#副-bg5  { animation-delay: 1.55s; }
#副-s5   { stroke-dasharray: 31.8859; stroke-dashoffset: 31.8859; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#副-bg6  { animation-delay: 1.92s; }
#副-s6   { stroke-dasharray: 66.2485; stroke-dashoffset: 66.2485; animation: drawStroke 0.36s ease-out 2.05s forwards; }
#副-bg7  { animation-delay: 2.43s; }
#副-s7   { stroke-dasharray: 25.1271; stroke-dashoffset: 25.1271; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#副-bg8  { animation-delay: 2.80s; }
#副-s8   { stroke-dasharray: 33.2395; stroke-dashoffset: 33.2395; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#副-bg9  { animation-delay: 3.17s; }
#副-s9   { stroke-dasharray: 29.8154; stroke-dashoffset: 29.8154; animation: drawStroke 0.22s ease-out 3.30s forwards; }
#副-bg10  { animation-delay: 3.54s; }
#副-s10   { stroke-dasharray: 39.4048; stroke-dashoffset: 39.4048; animation: drawStroke 0.22s ease-out 3.67s forwards; }
#副-bg11  { animation-delay: 3.91s; }
#副-s11   { stroke-dasharray: 87.3487; stroke-dashoffset: 87.3487; animation: drawStroke 0.48s ease-out 4.04s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #副-s[i]) -->
<path id="副-s1"  class="stroke" stroke="#bf0909" d="M19.25,19.82C20.64,20.17,23.21,20.11,24.6,19.92C32.5,18.87,42,17.37,51.25,16.720000000000002C53.56,16.560000000000002,54.97,16.640000000000004,56.13,16.820000000000004"/>
<path id="副-s2"  class="stroke" stroke="#bf6c09" d="M20.75,31.01C21.56,31.82,22.18,32.89,22.33,33.84C23.209999999999997,36.52,24,40.010000000000005,24.65,43.870000000000005C24.83,44.910000000000004,24.99,45.99,25.15,47.080000000000005"/>
