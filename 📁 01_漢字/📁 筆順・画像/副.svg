<path id="副-s4"  class="stroke" stroke="#4bbf09" d="M26.01,45.43C30.450000000000003,44.99,42.480000000000004,43.74,50.13,43.04C51.54,42.91,52.790000000000006,42.8,53.830000000000005,42.72"/>
<path id="副-s5"  class="stroke" stroke="#09bf2a" d="M18.75,57.38C19.37,58,19.93,59.03,20.02,59.730000000000004C20.77,65.99000000000001,21.77,75.67,22.59,84.88C22.71,86.19,22.82,87.49,22.93,88.75999999999999"/>
<path id="副-s6"  class="stroke" stroke="#09bf8d" d="M20.78,58.98C32.25,57.5,44.730000000000004,56.019999999999996,52.28,55.36C56.3,55.01,57.95,55.78,57.620000000000005,60.01C57.17,65.67,56.13,74.6,55.040000000000006,82.39C54.89000000000001,83.48,54.730000000000004,84.55,54.57000000000001,85.58"/>
<path id="副-s7"  class="stroke" stroke="#098dbf" d="M37.76,59.08C38.53,59.85,38.809999999999995,61.29,38.809999999999995,62.76C38.809999999999995,69.75,38.88999999999999,79.25,38.88999999999999,83.97"/>
<path id="副-s8"  class="stroke" stroke="#092abf" d="M22.48,71.93C30.38,71,51,68.88,55.57,68.84"/>
<path id="副-s9"  class="stroke" stroke="#4b09bf" d="M23.92,86.34C32.870000000000005,85.63000000000001,44.870000000000005,84.38000000000001,53.64,83.98"/>
<path id="副-s10"  class="stroke" stroke="#ae09bf" d="M70.27,23.83C71.25,24.75,72.03,26,72.03,28.099999999999998C72.03,38.81,72.02,49.81999999999999,72.01,56.87C72.01,59.41,72.01,61.43,72.01,62.739999999999995"/>
<path id="副-s11"  class="stroke" stroke="#bf096c" d="M88.77,14.08C90.1,15.41,90.53,17,90.53,18.85C90.53,33.410000000000004,90.52,82.50999999999999,90.52,87.47C90.52,95.59,85.61,90.89,81.81,87.72"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="副-bg1"  class="badge-group"><circle cx="19.25" cy="19.82" r="3.5" fill="#bf0909"/><text class="num-single" x="19.25" y="19.82" dx="0" dy="-0.5">1</text></g>
<g id="副-bg2"  class="badge-group"><circle cx="20.75" cy="27.51" r="3.5" fill="#bf6c09"/><text class="num-single" x="20.75" y="27.51" dx="0" dy="-0.5">2</text></g>
