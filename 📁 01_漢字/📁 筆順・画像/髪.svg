<path id="髪-s11"  class="stroke" stroke="#3d09bf" d="M21.74,66.24C24.27,67.14,27.27,66.91,29.869999999999997,66.55999999999999C44.51,64.60999999999999,63.23,61.66999999999999,81,61.18999999999999C83.74,61.11999999999999,86.44,61.04999999999999,89.14,61.62999999999999"/>
<path id="髪-s12"  class="stroke" stroke="#8b09bf" d="M51.28,58.55C51.36,59.37,51.32,60.489999999999995,50.86,61.61C47.5,69.75,37.5,86,21,93.5"/>
