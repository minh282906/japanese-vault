<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (髪)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #髪-bg[i]: Thời gian quả bóng số nảy lên
   - #髪-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#髪-bg1  { animation-delay: 0.05s; }
#髪-s1   { stroke-dasharray: 27.2349; stroke-dashoffset: 27.2349; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#髪-bg2  { animation-delay: 0.42s; }
#髪-s2   { stroke-dasharray: 23.6647; stroke-dashoffset: 23.6647; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#髪-bg3  { animation-delay: 0.79s; }
#髪-s3   { stroke-dasharray: 20.0255; stroke-dashoffset: 20.0255; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#髪-bg4  { animation-delay: 1.16s; }
#髪-s4   { stroke-dasharray: 20.2313; stroke-dashoffset: 20.2313; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#髪-bg5  { animation-delay: 1.53s; }
#髪-s5   { stroke-dasharray: 42.3034; stroke-dashoffset: 42.3034; animation: drawStroke 0.23s ease-out 1.66s forwards; }
#髪-bg6  { animation-delay: 1.91s; }
#髪-s6   { stroke-dasharray: 41.4655; stroke-dashoffset: 41.4655; animation: drawStroke 0.23s ease-out 2.04s forwards; }
#髪-bg7  { animation-delay: 2.29s; }
#髪-s7   { stroke-dasharray: 10.0681; stroke-dashoffset: 10.0681; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#髪-bg8  { animation-delay: 2.66s; }
#髪-s8   { stroke-dasharray: 23.6772; stroke-dashoffset: 23.6772; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#髪-bg9  { animation-delay: 3.03s; }
#髪-s9   { stroke-dasharray: 29.7945; stroke-dashoffset: 29.7945; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#髪-bg10  { animation-delay: 3.40s; }
#髪-s10   { stroke-dasharray: 31.4595; stroke-dashoffset: 31.4595; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#髪-bg11  { animation-delay: 3.77s; }
#髪-s11   { stroke-dasharray: 67.8237; stroke-dashoffset: 67.8237; animation: drawStroke 0.37s ease-out 3.90s forwards; }
#髪-bg12  { animation-delay: 4.29s; }
#髪-s12   { stroke-dasharray: 47.7449; stroke-dashoffset: 47.7449; animation: drawStroke 0.26s ease-out 4.42s forwards; }
#髪-bg13  { animation-delay: 4.70s; }
#髪-s13   { stroke-dasharray: 70.8760; stroke-dashoffset: 70.8760; animation: drawStroke 0.39s ease-out 4.83s forwards; }
#髪-bg14  { animation-delay: 5.24s; }
#髪-s14   { stroke-dasharray: 47.5776; stroke-dashoffset: 47.5776; animation: drawStroke 0.26s ease-out 5.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

