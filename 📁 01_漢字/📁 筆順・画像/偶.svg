<path id="偶-s4"  class="stroke" stroke="#4bbf09" d="M45.02,20.12C61.08,17.44,74.73,16.020000000000003,83.56,15.47C86.34,15.3,87.84,16.44,87.61,19.42C87.3,23.450000000000003,85.99,30.76,84.61,38.540000000000006C84.33,40.11000000000001,84.05,41.690000000000005,83.78,43.28000000000001"/>
<path id="偶-s5"  class="stroke" stroke="#09bf2a" d="M48.45,32.2C62.5,30.380000000000003,80.12,28.380000000000003,85.85,28.140000000000004"/>
<path id="偶-s6"  class="stroke" stroke="#09bf8d" d="M50.83,44.24C61.21,43.050000000000004,71.75,41.5,83.12,40.870000000000005"/>
<path id="偶-s7"  class="stroke" stroke="#098dbf" d="M38.38,55.34C39.580000000000005,56.540000000000006,40.09,57.92,40.29,59.150000000000006C41.4,65.86,42.55,79.39,43.41,88.49000000000001C43.68,91.4,43.93,93.86000000000001,44.129999999999995,95.50000000000001"/>
<path id="偶-s8"  class="stroke" stroke="#092abf" d="M40.99,58.23C48.38,57.269999999999996,86,53.37,90.41,52.919999999999995C93.59,52.599999999999994,95.58,54.67999999999999,95.47,56.8C95.2,61.93,92.11,83.91,89.8,90.47C87.5,96.99,86.63,95.47,83.88,90.41"/>
<path id="偶-s9"  class="stroke" stroke="#4b09bf" d="M64.27,19.48C65.08,20.29,65.67,21.23,65.67,22.78C65.66,29.580000000000002,65.63,72.66,65.63,74.75"/>
<path id="偶-s10"  class="stroke" stroke="#ae09bf" d="M51.79,78.2C53,79.38000000000001,54.36,79.08,55.65,78.65C59.28,77.44000000000001,70.63,73.5,79.28,70.7"/>
<path id="偶-s11"  class="stroke" stroke="#bf096c" d="M75.5,64C78.67,66.49,83.68,74.24,84.47,78.12"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="偶-bg1"  class="badge-group"><circle cx="29.52" cy="15" r="3.5" fill="#bf0909"/><text class="num-single" x="29.52" y="15" dx="0" dy="-0.5">1</text></g>
