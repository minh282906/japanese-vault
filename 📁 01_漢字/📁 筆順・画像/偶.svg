<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (偶)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #偶-bg[i]: Thời gian quả bóng số nảy lên
   - #偶-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#偶-bg1  { animation-delay: 0.05s; }
#偶-s1   { stroke-dasharray: 45.2419; stroke-dashoffset: 45.2419; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#偶-bg2  { animation-delay: 0.45s; }
#偶-s2   { stroke-dasharray: 59.3542; stroke-dashoffset: 59.3542; animation: drawStroke 0.33s ease-out 0.58s forwards; }
#偶-bg3  { animation-delay: 0.93s; }
#偶-s3   { stroke-dasharray: 28.9951; stroke-dashoffset: 28.9951; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#偶-bg4  { animation-delay: 1.30s; }
#偶-s4   { stroke-dasharray: 69.7452; stroke-dashoffset: 69.7452; animation: drawStroke 0.38s ease-out 1.43s forwards; }
#偶-bg5  { animation-delay: 1.83s; }
#偶-s5   { stroke-dasharray: 37.6255; stroke-dashoffset: 37.6255; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#偶-bg6  { animation-delay: 2.20s; }
#偶-s6   { stroke-dasharray: 32.4717; stroke-dashoffset: 32.4717; animation: drawStroke 0.22s ease-out 2.33s forwards; }
#偶-bg7  { animation-delay: 2.57s; }
#偶-s7   { stroke-dasharray: 40.8914; stroke-dashoffset: 40.8914; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#偶-bg8  { animation-delay: 2.94s; }
#偶-s8   { stroke-dasharray: 102.0420; stroke-dashoffset: 102.0420; animation: drawStroke 0.55s ease-out 3.07s forwards; }
#偶-bg9  { animation-delay: 3.64s; }
#偶-s9   { stroke-dasharray: 55.6631; stroke-dashoffset: 55.6631; animation: drawStroke 0.31s ease-out 3.77s forwards; }
#偶-bg10  { animation-delay: 4.10s; }
#偶-s10   { stroke-dasharray: 29.0634; stroke-dashoffset: 29.0634; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#偶-bg11  { animation-delay: 4.47s; }
#偶-s11   { stroke-dasharray: 16.9253; stroke-dashoffset: 16.9253; animation: drawStroke 0.22s ease-out 4.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #偶-s[i]) -->
<path id="偶-s1"  class="stroke" stroke="#bf0909" d="M29.52,15C29.72,16.98,29.46,18.56,28.83,20.25C24.75,31.04,19.34,42.16,10,55.29"/>
<path id="偶-s2"  class="stroke" stroke="#bf6c09" d="M23.45,37.25C24.41,38.21,24.849999999999998,39.6,24.849999999999998,41.11C24.849999999999998,55.41,24.919999999999998,76.11,24.939999999999998,88.75C24.95,91.71,24.95,94.26,24.95,96.25"/>
