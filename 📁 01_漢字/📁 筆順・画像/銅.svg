<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (銅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #銅-bg[i]: Thời gian quả bóng số nảy lên
   - #銅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#銅-bg1  { animation-delay: 0.05s; }
#銅-s1   { stroke-dasharray: 36.8482; stroke-dashoffset: 36.8482; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#銅-bg2  { animation-delay: 0.42s; }
#銅-s2   { stroke-dasharray: 16.0330; stroke-dashoffset: 16.0330; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#銅-bg3  { animation-delay: 0.79s; }
#銅-s3   { stroke-dasharray: 19.9199; stroke-dashoffset: 19.9199; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#銅-bg4  { animation-delay: 1.16s; }
#銅-s4   { stroke-dasharray: 31.1762; stroke-dashoffset: 31.1762; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#銅-bg5  { animation-delay: 1.53s; }
#銅-s5   { stroke-dasharray: 37.6663; stroke-dashoffset: 37.6663; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#銅-bg6  { animation-delay: 1.90s; }
#銅-s6   { stroke-dasharray: 11.6172; stroke-dashoffset: 11.6172; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#銅-bg7  { animation-delay: 2.27s; }
#銅-s7   { stroke-dasharray: 12.1893; stroke-dashoffset: 12.1893; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#銅-bg8  { animation-delay: 2.64s; }
#銅-s8   { stroke-dasharray: 32.4561; stroke-dashoffset: 32.4561; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#銅-bg9  { animation-delay: 3.01s; }
#銅-s9   { stroke-dasharray: 70.9652; stroke-dashoffset: 70.9652; animation: drawStroke 0.39s ease-out 3.14s forwards; }
#銅-bg10  { animation-delay: 3.55s; }
#銅-s10   { stroke-dasharray: 121.7370; stroke-dashoffset: 121.7370; animation: drawStroke 0.55s ease-out 3.68s forwards; }
#銅-bg11  { animation-delay: 4.25s; }
#銅-s11   { stroke-dasharray: 25.5112; stroke-dashoffset: 25.5112; animation: drawStroke 0.22s ease-out 4.38s forwards; }
#銅-bg12  { animation-delay: 4.62s; }
#銅-s12   { stroke-dasharray: 18.3774; stroke-dashoffset: 18.3774; animation: drawStroke 0.22s ease-out 4.75s forwards; }
#銅-bg13  { animation-delay: 4.99s; }
#銅-s13   { stroke-dasharray: 33.6126; stroke-dashoffset: 33.6126; animation: drawStroke 0.22s ease-out 5.12s forwards; }
#銅-bg14  { animation-delay: 5.36s; }
#銅-s14   { stroke-dasharray: 16.3207; stroke-dashoffset: 16.3207; animation: drawStroke 0.22s ease-out 5.49s forwards; }
]]>
</style>

