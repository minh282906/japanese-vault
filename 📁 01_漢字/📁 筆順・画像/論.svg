<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (論)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #論-bg[i]: Thời gian quả bóng số nảy lên
   - #論-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#論-bg1  { animation-delay: 0.05s; }
#論-s1   { stroke-dasharray: 11.2491; stroke-dashoffset: 11.2491; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#論-bg2  { animation-delay: 0.42s; }
#論-s2   { stroke-dasharray: 30.7101; stroke-dashoffset: 30.7101; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#論-bg3  { animation-delay: 0.79s; }
#論-s3   { stroke-dasharray: 20.3696; stroke-dashoffset: 20.3696; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#論-bg4  { animation-delay: 1.16s; }
#論-s4   { stroke-dasharray: 19.9584; stroke-dashoffset: 19.9584; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#論-bg5  { animation-delay: 1.53s; }
#論-s5   { stroke-dasharray: 20.2592; stroke-dashoffset: 20.2592; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#論-bg6  { animation-delay: 1.90s; }
#論-s6   { stroke-dasharray: 36.0282; stroke-dashoffset: 36.0282; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#論-bg7  { animation-delay: 2.27s; }
#論-s7   { stroke-dasharray: 16.0128; stroke-dashoffset: 16.0128; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#論-bg8  { animation-delay: 2.64s; }
#論-s8   { stroke-dasharray: 47.1187; stroke-dashoffset: 47.1187; animation: drawStroke 0.26s ease-out 2.77s forwards; }
#論-bg9  { animation-delay: 3.05s; }
#論-s9   { stroke-dasharray: 41.0335; stroke-dashoffset: 41.0335; animation: drawStroke 0.23s ease-out 3.18s forwards; }
#論-bg10  { animation-delay: 3.43s; }
#論-s10   { stroke-dasharray: 26.9661; stroke-dashoffset: 26.9661; animation: drawStroke 0.22s ease-out 3.56s forwards; }
#論-bg11  { animation-delay: 3.80s; }
#論-s11   { stroke-dasharray: 37.9744; stroke-dashoffset: 37.9744; animation: drawStroke 0.22s ease-out 3.93s forwards; }
#論-bg12  { animation-delay: 4.17s; }
#論-s12   { stroke-dasharray: 84.6429; stroke-dashoffset: 84.6429; animation: drawStroke 0.47s ease-out 4.30s forwards; }
#論-bg13  { animation-delay: 4.79s; }
#論-s13   { stroke-dasharray: 40.1817; stroke-dashoffset: 40.1817; animation: drawStroke 0.22s ease-out 4.92s forwards; }
#論-bg14  { animation-delay: 5.16s; }
#論-s14   { stroke-dasharray: 33.2664; stroke-dashoffset: 33.2664; animation: drawStroke 0.22s ease-out 5.29s forwards; }
#論-bg15  { animation-delay: 5.53s; }
#論-s15   { stroke-dasharray: 32.4199; stroke-dashoffset: 32.4199; animation: drawStroke 0.22s ease-out 5.66s forwards; }
]]>
</style>

