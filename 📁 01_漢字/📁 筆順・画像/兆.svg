<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (兆)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #兆-bg[i]: Thời gian quả bóng số nảy lên
   - #兆-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#兆-bg1  { animation-delay: 0.05s; }
#兆-s1   { stroke-dasharray: 83.0531; stroke-dashoffset: 83.0531; animation: drawStroke 0.46s ease-out 0.18s forwards; }
#兆-bg2  { animation-delay: 0.66s; }
#兆-s2   { stroke-dasharray: 17.9252; stroke-dashoffset: 17.9252; animation: drawStroke 0.22s ease-out 0.79s forwards; }
#兆-bg3  { animation-delay: 1.03s; }
#兆-s3   { stroke-dasharray: 28.7863; stroke-dashoffset: 28.7863; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#兆-bg4  { animation-delay: 1.40s; }
#兆-s4   { stroke-dasharray: 122.9230; stroke-dashoffset: 122.9230; animation: drawStroke 0.55s ease-out 1.53s forwards; }
#兆-bg5  { animation-delay: 2.10s; }
#兆-s5   { stroke-dasharray: 23.3625; stroke-dashoffset: 23.3625; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#兆-bg6  { animation-delay: 2.47s; }
#兆-s6   { stroke-dasharray: 23.2841; stroke-dashoffset: 23.2841; animation: drawStroke 0.22s ease-out 2.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #兆-s[i]) -->
<path id="兆-s1"  class="stroke" stroke="#bf0909" d="M39.5,17.25C40.62,18.37,41.1,20.25,41.12,22.06C41.62,63.25,40.739999999999995,82,25.239999999999995,95.75"/>
<path id="兆-s2"  class="stroke" stroke="#bfbf09" d="M19.25,34C24.5,36.75,30.369999999999997,41.38,32.75,45.5"/>
<path id="兆-s3"  class="stroke" stroke="#09bf09" d="M15.38,72.64C16.87,73.36,17.87,72.88,19,72.06C20.56,70.92,31.84,61.49,38,56"/>
<path id="兆-s4"  class="stroke" stroke="#09bfbf" d="M58.49,11.37C59.690000000000005,12.569999999999999,59.870000000000005,14.209999999999999,59.870000000000005,16.049999999999997C59.870000000000005,25.999999999999996,59.84,72.94,59.84,78.5C59.84,94.12,62.88,95.28,80.01,95.28C94.13000000000001,95.28,96.4,93.5,96.4,84.66"/>
<path id="兆-s5"  class="stroke" stroke="#0909bf" d="M84.76,23.64C84.80000000000001,24.02,84.7,24.92,84.42,25.43C82.37,29.24,77.37,34.49,68.81,39.96"/>
<path id="兆-s6"  class="stroke" stroke="#bf09bf" d="M70.38,54.12C76.24,56.97,84.62,64.88,87,70"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="兆-bg1"  class="badge-group"><circle cx="39.5" cy="17.25" r="3.5" fill="#bf0909"/><text class="num-single" x="39.5" y="17.25" dx="0" dy="-0.5">1</text></g>
<g id="兆-bg2"  class="badge-group"><circle cx="19.25" cy="34" r="3.5" fill="#bfbf09"/><text class="num-single" x="19.25" y="34" dx="0" dy="-0.5">2</text></g>
<g id="兆-bg3"  class="badge-group"><circle cx="15.38" cy="72.64" r="3.5" fill="#09bf09"/><text class="num-single" x="15.38" y="72.64" dx="0" dy="-0.5">3</text></g>
<g id="兆-bg4"  class="badge-group"><circle cx="58.49" cy="11.37" r="3.5" fill="#09bfbf"/><text class="num-single" x="58.49" y="11.37" dx="0" dy="-0.5">4</text></g>
<g id="兆-bg5"  class="badge-group"><circle cx="84.76" cy="23.64" r="3.5" fill="#0909bf"/><text class="num-single" x="84.76" y="23.64" dx="0" dy="-0.5">5</text></g>
<g id="兆-bg6"  class="badge-group"><circle cx="70.38" cy="54.12" r="3.5" fill="#bf09bf"/><text class="num-single" x="70.38" y="54.12" dx="0" dy="-0.5">6</text></g>
</svg>