<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (圧)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #圧-bg[i]: Thời gian quả bóng số nảy lên
   - #圧-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#圧-bg1  { animation-delay: 0.05s; }
#圧-s1   { stroke-dasharray: 63.8409; stroke-dashoffset: 63.8409; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#圧-bg2  { animation-delay: 0.55s; }
#圧-s2   { stroke-dasharray: 71.4967; stroke-dashoffset: 71.4967; animation: drawStroke 0.39s ease-out 0.68s forwards; }
#圧-bg3  { animation-delay: 1.09s; }
#圧-s3   { stroke-dasharray: 47.6571; stroke-dashoffset: 47.6571; animation: drawStroke 0.26s ease-out 1.22s forwards; }
#圧-bg4  { animation-delay: 1.50s; }
#圧-s4   { stroke-dasharray: 55.5862; stroke-dashoffset: 55.5862; animation: drawStroke 0.31s ease-out 1.63s forwards; }
#圧-bg5  { animation-delay: 1.96s; }
#圧-s5   { stroke-dasharray: 65.7505; stroke-dashoffset: 65.7505; animation: drawStroke 0.36s ease-out 2.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #圧-s[i]) -->
<path id="圧-s1"  class="stroke" stroke="#bf0909" d="M23.63,24.73C26.5,25.38,29.24,25.27,31.979999999999997,25C45.87,23.62,66,20.88,79.25,19.95C81.96,19.759999999999998,84.46,19.75,87.12,20.32"/>
<path id="圧-s2"  class="stroke" stroke="#9abf09" d="M26.99,25.75C28,26.76,28.389999999999997,28.25,28.389999999999997,30.009999999999998C28.389999999999997,43.269999999999996,26.249999999999996,76.12,10.809999999999999,93.22"/>
<path id="圧-s3"  class="stroke" stroke="#09bf52" d="M37.9,58.27C40.12,58.75,42.44,58.75,44.53,58.53C54.86,57.45,68.93,55.96,79.25,55.480000000000004C81.3,55.39,83.34,55.230000000000004,85.36,55.71"/>
<path id="圧-s4"  class="stroke" stroke="#0952bf" d="M59.07,32.87C59.98,33.779999999999994,60.67,35.01,60.67,36.709999999999994C60.67,51.50999999999999,60.59,74.75999999999999,60.59,88.02"/>
<path id="圧-s5"  class="stroke" stroke="#9a09bf" d="M29.74,90.03C32.75,91.11,36.269999999999996,90.9,39.36,90.64C51.14,89.67,72.83,88.53,86.38,88.11C89.36999999999999,88.02,92.33,88.11,95.28,88.74"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="圧-bg1"  class="badge-group"><circle cx="23.63" cy="21.23" r="3.5" fill="#bf0909"/><text class="num-single" x="23.63" y="21.23" dx="0" dy="-0.5">1</text></g>
<g id="圧-bg2"  class="badge-group"><circle cx="26.99" cy="29.25" r="3.5" fill="#9abf09"/><text class="num-single" x="26.99" y="29.25" dx="0" dy="-0.5">2</text></g>
<g id="圧-bg3"  class="badge-group"><circle cx="37.9" cy="58.27" r="3.5" fill="#09bf52"/><text class="num-single" x="37.9" y="58.27" dx="0" dy="-0.5">3</text></g>
<g id="圧-bg4"  class="badge-group"><circle cx="59.07" cy="32.87" r="3.5" fill="#0952bf"/><text class="num-single" x="59.07" y="32.87" dx="0" dy="-0.5">4</text></g>
<g id="圧-bg5"  class="badge-group"><circle cx="29.74" cy="90.03" r="3.5" fill="#9a09bf"/><text class="num-single" x="29.74" y="90.03" dx="0" dy="-0.5">5</text></g>
</svg>