<path id="険-s6"  class="stroke" stroke="#09bf8d" d="M49.28,43.59C50.63,44.25,52.65,43.940000000000005,53.89,43.790000000000006C58.36,43.24000000000001,67.22,41.59,73.89,40.88000000000001C75.16,40.75000000000001,77.38,40.37000000000001,78.52,40.74000000000001"/>
<path id="険-s7"  class="stroke" stroke="#098dbf" d="M43.68,55.68C44.44,56.44,44.88,57.5,45.01,58.2C46.05,63.78,46.54,66.61,47.28,71.26C47.47,72.43,47.67,73.71000000000001,47.89,75.18"/>
<path id="険-s8"  class="stroke" stroke="#092abf" d="M45.66,57.06C55.65,55.78,72.17,53.910000000000004,78.88,53.28C81.88,53,83.63,54.620000000000005,83,56.95C81.93,60.900000000000006,80.43,64.64,79.03,69.03"/>
<path id="険-s9"  class="stroke" stroke="#4b09bf" d="M48.83,72.51C54.28,72.07000000000001,67.94,70.73,77.25999999999999,69.92C79.07999999999998,69.76,80.71,69.63,82.05,69.54"/>
<path id="険-s10"  class="stroke" stroke="#ae09bf" d="M61.79,45.07C62.74,46.01,63.15,47.61,63.15,49.47C63.15,74.23,58.879999999999995,87.75,38,98.75"/>
<path id="険-s11"  class="stroke" stroke="#bf096c" d="M62.5,72.53C67.12,76.63,79.71000000000001,88.69,85.47,93.41C87.14,94.78,88.9,96.39999999999999,91,97.06"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="険-bg1"  class="badge-group"><circle cx="13.25" cy="16.25" r="3.5" fill="#bf0909"/><text class="num-single" x="13.25" y="16.25" dx="0" dy="-0.5">1</text></g>
