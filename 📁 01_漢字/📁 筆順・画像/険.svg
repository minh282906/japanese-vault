<path id="険-s1"  class="stroke" stroke="#bf0909" d="M13.25,19.75C14.13,20.13,15.35,20.35,16.39,20.11C22.25,18.75,28.14,17.18,30.66,16.4C33.66,15.469999999999999,35.26,17.75,34.08,20C32.37,23.25,28.369999999999997,30.869999999999997,25.5,35.58"/>
