<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (険)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #険-bg[i]: Thời gian quả bóng số nảy lên
   - #険-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#険-bg1  { animation-delay: 0.05s; }
#険-s1   { stroke-dasharray: 42.4616; stroke-dashoffset: 42.4616; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#険-bg2  { animation-delay: 0.43s; }
#険-s2   { stroke-dasharray: 37.0499; stroke-dashoffset: 37.0499; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#険-bg3  { animation-delay: 0.80s; }
#険-s3   { stroke-dasharray: 76.1213; stroke-dashoffset: 76.1213; animation: drawStroke 0.42s ease-out 0.93s forwards; }
#険-bg4  { animation-delay: 1.37s; }
#険-s4   { stroke-dasharray: 40.9028; stroke-dashoffset: 40.9028; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#険-bg5  { animation-delay: 1.74s; }
#険-s5   { stroke-dasharray: 40.9309; stroke-dashoffset: 40.9309; animation: drawStroke 0.23s ease-out 1.87s forwards; }
#険-bg6  { animation-delay: 2.12s; }
#険-s6   { stroke-dasharray: 29.5486; stroke-dashoffset: 29.5486; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#険-bg7  { animation-delay: 2.49s; }
#険-s7   { stroke-dasharray: 20.1115; stroke-dashoffset: 20.1115; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#険-bg8  { animation-delay: 2.86s; }
#険-s8   { stroke-dasharray: 52.8413; stroke-dashoffset: 52.8413; animation: drawStroke 0.29s ease-out 2.99s forwards; }
#険-bg9  { animation-delay: 3.30s; }
#険-s9   { stroke-dasharray: 33.3529; stroke-dashoffset: 33.3529; animation: drawStroke 0.22s ease-out 3.43s forwards; }
#険-bg10  { animation-delay: 3.67s; }
#険-s10   { stroke-dasharray: 63.8800; stroke-dashoffset: 63.8800; animation: drawStroke 0.35s ease-out 3.80s forwards; }
#険-bg11  { animation-delay: 4.17s; }
#険-s11   { stroke-dasharray: 37.7150; stroke-dashoffset: 37.7150; animation: drawStroke 0.22s ease-out 4.30s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

