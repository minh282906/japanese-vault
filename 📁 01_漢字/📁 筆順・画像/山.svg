<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (山)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #山-bg[i]: Thời gian quả bóng số nảy lên
   - #山-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#山-bg1  { animation-delay: 0.05s; }
#山-s1   { stroke-dasharray: 65.5847; stroke-dashoffset: 65.5847; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#山-bg2  { animation-delay: 0.56s; }
#山-s2   { stroke-dasharray: 98.4527; stroke-dashoffset: 98.4527; animation: drawStroke 0.54s ease-out 0.69s forwards; }
#山-bg3  { animation-delay: 1.25s; }
#山-s3   { stroke-dasharray: 38.5374; stroke-dashoffset: 38.5374; animation: drawStroke 0.22s ease-out 1.38s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #山-s[i]) -->
<path id="山-s1"  class="stroke" stroke="#bf0909" d="M52.49,15.5C53.870000000000005,16.88,54.75,19,54.75,21.25C54.75,22,54.53,79.55,54.5,80.5"/>
<path id="山-s2"  class="stroke" stroke="#09bf09" d="M21.49,54.5C22.369999999999997,55.38,22.88,56.75,22.75,58.25C22.17,65.24,21.75,74.25,20.25,81.25C19.55,84.51,20.36,85.25,22.25,85C39.25,82.75,69.37,79.88,87.75,79"/>
<path id="山-s3"  class="stroke" stroke="#0909bf" d="M89.24,49C90.17999999999999,49.94,90.88,51.38,90.75,53.25C90.5,56.93,88.92,73.55,88.2,82.02C87.98,84.66,87.81,86.53,87.75,87"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="山-bg1"  class="badge-group"><circle cx="52.49" cy="15.5" r="3.5" fill="#bf0909"/><text class="num-single" x="52.49" y="15.5" dx="0" dy="-0.5">1</text></g>
<g id="山-bg2"  class="badge-group"><circle cx="21.49" cy="54.5" r="3.5" fill="#09bf09"/><text class="num-single" x="21.49" y="54.5" dx="0" dy="-0.5">2</text></g>
<g id="山-bg3"  class="badge-group"><circle cx="89.24" cy="49" r="3.5" fill="#0909bf"/><text class="num-single" x="89.24" y="49" dx="0" dy="-0.5">3</text></g>
</svg>