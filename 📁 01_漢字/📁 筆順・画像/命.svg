<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (命)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #命-bg[i]: Thời gian quả bóng số nảy lên
   - #命-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#命-bg1  { animation-delay: 0.05s; }
#命-s1   { stroke-dasharray: 59.4798; stroke-dashoffset: 59.4798; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#命-bg2  { animation-delay: 0.53s; }
#命-s2   { stroke-dasharray: 51.4147; stroke-dashoffset: 51.4147; animation: drawStroke 0.28s ease-out 0.66s forwards; }
#命-bg3  { animation-delay: 0.96s; }
#命-s3   { stroke-dasharray: 29.7344; stroke-dashoffset: 29.7344; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#命-bg4  { animation-delay: 1.33s; }
#命-s4   { stroke-dasharray: 24.0355; stroke-dashoffset: 24.0355; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#命-bg5  { animation-delay: 1.70s; }
#命-s5   { stroke-dasharray: 40.9335; stroke-dashoffset: 40.9335; animation: drawStroke 0.23s ease-out 1.83s forwards; }
#命-bg6  { animation-delay: 2.08s; }
#命-s6   { stroke-dasharray: 19.0715; stroke-dashoffset: 19.0715; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#命-bg7  { animation-delay: 2.45s; }
#命-s7   { stroke-dasharray: 63.3223; stroke-dashoffset: 63.3223; animation: drawStroke 0.35s ease-out 2.58s forwards; }
#命-bg8  { animation-delay: 2.95s; }
#命-s8   { stroke-dasharray: 44.6870; stroke-dashoffset: 44.6870; animation: drawStroke 0.25s ease-out 3.08s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #命-s[i]) -->
<path id="命-s1"  class="stroke" stroke="#bf0909" d="M51.75,10.25C51.86,11.25,51.69,12.92,51.04,14.27C46.57,23.5,33.980000000000004,40.25,12.25,52.75"/>
<path id="命-s2"  class="stroke" stroke="#bf9109" d="M53.5,15C60.62,22,76.39,35.46,84.1,41.65C86.91999999999999,43.91,89.75,45.87,93.25,47.37"/>
<path id="命-s3"  class="stroke" stroke="#64bf09" d="M38.25,40.64C40.01,41.36,42.09,41,43.9,40.78C49.3,40.120000000000005,56.98,39.02,62.379999999999995,38.54C64.25999999999999,38.37,65.92,38.31,67.75,38.75"/>
<path id="命-s4"  class="stroke" stroke="#09bf36" d="M21.2,54.29C22.21,55.3,22.79,56.55,22.869999999999997,57.72C23.769999999999996,61.6,24.639999999999997,67.84,25.269999999999996,73.61C25.429999999999996,75.04,25.569999999999997,76.4,25.689999999999998,77.65"/>
<path id="命-s5"  class="stroke" stroke="#09bfbf" d="M23.92,56.51C34.75,54.75,39.34,54.33,44.2,53.86C45.980000000000004,53.69,46.99,55.019999999999996,46.690000000000005,56.14C45.46000000000001,60.77,45.02,65.87,43.21000000000001,72.27"/>
<path id="命-s6"  class="stroke" stroke="#0936bf" d="M26.02,75.17C30.79,74.73,35.33,74,41.269999999999996,73.28C42.44,73.14,43.66,73,44.949999999999996,72.86"/>
<path id="命-s7"  class="stroke" stroke="#6409bf" d="M54,54C54.61,54.15,57,55,58.21,54.87C61.5,54.5,76.2,50.849999999999994,77.72,50.699999999999996C79.24,50.55,82,50.41,81.67,53.589999999999996C81.24,57.76,78.99,70.50999999999999,75.67,77.42999999999999C73.78,81.36999999999999,72.49,80.88,69.44,77.88999999999999"/>
<path id="命-s8"  class="stroke" stroke="#bf0991" d="M57.38,55.38C58.25,56.25,59.18,57.38,59.18,58.88C59.18,66.24000000000001,59.14,83.41,59.08,93.01C59.059999999999995,96.31,59.03,98.72,59,99.52000000000001"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="命-bg1"  class="badge-group"><circle cx="51.75" cy="6.75" r="3.5" fill="#bf0909"/><text class="num-single" x="51.75" y="6.75" dx="0" dy="-0.5">1</text></g>
<g id="命-bg2"  class="badge-group"><circle cx="53.5" cy="18.5" r="3.5" fill="#bf9109"/><text class="num-single" x="53.5" y="18.5" dx="0" dy="-0.5">2</text></g>
<g id="命-bg3"  class="badge-group"><circle cx="38.25" cy="40.64" r="3.5" fill="#64bf09"/><text class="num-single" x="38.25" y="40.64" dx="0" dy="-0.5">3</text></g>
<g id="命-bg4"  class="badge-group"><circle cx="21.2" cy="50.79" r="3.5" fill="#09bf36"/><text class="num-single" x="21.2" y="50.79" dx="0" dy="-0.5">4</text></g>
<g id="命-bg5"  class="badge-group"><circle cx="23.92" cy="60.01" r="3.5" fill="#09bfbf"/><text class="num-single" x="23.92" y="60.01" dx="0" dy="-0.5">5</text></g>
<g id="命-bg6"  class="badge-group"><circle cx="26.02" cy="75.17" r="3.5" fill="#0936bf"/><text class="num-single" x="26.02" y="75.17" dx="0" dy="-0.5">6</text></g>
<g id="命-bg7"  class="badge-group"><circle cx="54" cy="50.5" r="3.5" fill="#6409bf"/><text class="num-single" x="54" y="50.5" dx="0" dy="-0.5">7</text></g>
<g id="命-bg8"  class="badge-group"><circle cx="57.38" cy="58.88" r="3.5" fill="#bf0991"/><text class="num-single" x="57.38" y="58.88" dx="0" dy="-0.5">8</text></g>
</svg>