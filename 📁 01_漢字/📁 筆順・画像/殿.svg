<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (殿)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #殿-bg[i]: Thời gian quả bóng số nảy lên
   - #殿-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#殿-bg1  { animation-delay: 0.05s; }
#殿-s1   { stroke-dasharray: 46.5709; stroke-dashoffset: 46.5709; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#殿-bg2  { animation-delay: 0.46s; }
#殿-s2   { stroke-dasharray: 26.0452; stroke-dashoffset: 26.0452; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#殿-bg3  { animation-delay: 0.83s; }
#殿-s3   { stroke-dasharray: 70.2755; stroke-dashoffset: 70.2755; animation: drawStroke 0.39s ease-out 0.96s forwards; }
#殿-bg4  { animation-delay: 1.37s; }
#殿-s4   { stroke-dasharray: 28.5618; stroke-dashoffset: 28.5618; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#殿-bg5  { animation-delay: 1.74s; }
#殿-s5   { stroke-dasharray: 23.3095; stroke-dashoffset: 23.3095; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#殿-bg6  { animation-delay: 2.11s; }
#殿-s6   { stroke-dasharray: 25.1610; stroke-dashoffset: 25.1610; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#殿-bg7  { animation-delay: 2.48s; }
#殿-s7   { stroke-dasharray: 33.8593; stroke-dashoffset: 33.8593; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#殿-bg8  { animation-delay: 2.85s; }
#殿-s8   { stroke-dasharray: 20.7998; stroke-dashoffset: 20.7998; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#殿-bg9  { animation-delay: 3.22s; }
#殿-s9   { stroke-dasharray: 13.4895; stroke-dashoffset: 13.4895; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#殿-bg10  { animation-delay: 3.59s; }
#殿-s10   { stroke-dasharray: 31.1067; stroke-dashoffset: 31.1067; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#殿-bg11  { animation-delay: 3.96s; }
#殿-s11   { stroke-dasharray: 58.8571; stroke-dashoffset: 58.8571; animation: drawStroke 0.32s ease-out 4.09s forwards; }
#殿-bg12  { animation-delay: 4.43s; }
#殿-s12   { stroke-dasharray: 80.9692; stroke-dashoffset: 80.9692; animation: drawStroke 0.45s ease-out 4.56s forwards; }
#殿-bg13  { animation-delay: 5.03s; }
#殿-s13   { stroke-dasharray: 50.1243; stroke-dashoffset: 50.1243; animation: drawStroke 0.28s ease-out 5.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

