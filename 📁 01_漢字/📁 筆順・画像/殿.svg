<path id="殿-s11"  class="stroke" stroke="#7909bf" d="M65.24,17.01C69.75,16.62,76.5,15.500000000000002,78.86999999999999,14.64C81.00999999999999,13.870000000000001,81.99999999999999,14.82,81.78999999999999,16.82C81.36999999999999,20.75,80.66999999999999,26.4,80.66999999999999,30.33C80.66999999999999,38.08,81.71,39.199999999999996,88.58999999999999,39.199999999999996C94.49999999999999,39.199999999999996,95.50999999999999,37.99999999999999,95.50999999999999,31.909999999999997"/>
