<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (録)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #録-bg[i]: Thời gian quả bóng số nảy lên
   - #録-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#録-bg1  { animation-delay: 0.05s; }
#録-s1   { stroke-dasharray: 37.5477; stroke-dashoffset: 37.5477; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#録-bg2  { animation-delay: 0.42s; }
#録-s2   { stroke-dasharray: 16.8182; stroke-dashoffset: 16.8182; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#録-bg3  { animation-delay: 0.79s; }
#録-s3   { stroke-dasharray: 19.6309; stroke-dashoffset: 19.6309; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#録-bg4  { animation-delay: 1.16s; }
#録-s4   { stroke-dasharray: 30.4239; stroke-dashoffset: 30.4239; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#録-bg5  { animation-delay: 1.53s; }
#録-s5   { stroke-dasharray: 40.6932; stroke-dashoffset: 40.6932; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#録-bg6  { animation-delay: 1.90s; }
#録-s6   { stroke-dasharray: 12.8661; stroke-dashoffset: 12.8661; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#録-bg7  { animation-delay: 2.27s; }
#録-s7   { stroke-dasharray: 12.4253; stroke-dashoffset: 12.4253; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#録-bg8  { animation-delay: 2.64s; }
#録-s8   { stroke-dasharray: 31.3609; stroke-dashoffset: 31.3609; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#録-bg9  { animation-delay: 3.01s; }
#録-s9   { stroke-dasharray: 58.0134; stroke-dashoffset: 58.0134; animation: drawStroke 0.32s ease-out 3.14s forwards; }
#録-bg10  { animation-delay: 3.48s; }
#録-s10   { stroke-dasharray: 27.9922; stroke-dashoffset: 27.9922; animation: drawStroke 0.22s ease-out 3.61s forwards; }
#録-bg11  { animation-delay: 3.85s; }
#録-s11   { stroke-dasharray: 49.6438; stroke-dashoffset: 49.6438; animation: drawStroke 0.27s ease-out 3.98s forwards; }
#録-bg12  { animation-delay: 4.27s; }
#録-s12   { stroke-dasharray: 57.7029; stroke-dashoffset: 57.7029; animation: drawStroke 0.32s ease-out 4.40s forwards; }
#録-bg13  { animation-delay: 4.74s; }
#録-s13   { stroke-dasharray: 12.2370; stroke-dashoffset: 12.2370; animation: drawStroke 0.22s ease-out 4.87s forwards; }
#録-bg14  { animation-delay: 5.11s; }
#録-s14   { stroke-dasharray: 21.0650; stroke-dashoffset: 21.0650; animation: drawStroke 0.22s ease-out 5.24s forwards; }
#録-bg15  { animation-delay: 5.48s; }
#録-s15   { stroke-dasharray: 15.8695; stroke-dashoffset: 15.8695; animation: drawStroke 0.22s ease-out 5.61s forwards; }
#録-bg16  { animation-delay: 5.85s; }
#録-s16   { stroke-dasharray: 28.4545; stroke-dashoffset: 28.4545; animation: drawStroke 0.22s ease-out 5.98s forwards; }
]]>
</style>

