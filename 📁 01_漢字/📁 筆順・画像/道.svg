<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (道)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #道-bg[i]: Thời gian quả bóng số nảy lên
   - #道-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#道-bg1  { animation-delay: 0.05s; }
#道-s1   { stroke-dasharray: 12.6394; stroke-dashoffset: 12.6394; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#道-bg2  { animation-delay: 0.42s; }
#道-s2   { stroke-dasharray: 14.6950; stroke-dashoffset: 14.6950; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#道-bg3  { animation-delay: 0.79s; }
#道-s3   { stroke-dasharray: 49.8465; stroke-dashoffset: 49.8465; animation: drawStroke 0.27s ease-out 0.92s forwards; }
#道-bg4  { animation-delay: 1.21s; }
#道-s4   { stroke-dasharray: 10.5626; stroke-dashoffset: 10.5626; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#道-bg5  { animation-delay: 1.58s; }
#道-s5   { stroke-dasharray: 38.6841; stroke-dashoffset: 38.6841; animation: drawStroke 0.22s ease-out 1.71s forwards; }
#道-bg6  { animation-delay: 1.95s; }
#道-s6   { stroke-dasharray: 65.5514; stroke-dashoffset: 65.5514; animation: drawStroke 0.36s ease-out 2.08s forwards; }
#道-bg7  { animation-delay: 2.46s; }
#道-s7   { stroke-dasharray: 26.7451; stroke-dashoffset: 26.7451; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#道-bg8  { animation-delay: 2.83s; }
#道-s8   { stroke-dasharray: 26.1936; stroke-dashoffset: 26.1936; animation: drawStroke 0.22s ease-out 2.96s forwards; }
#道-bg9  { animation-delay: 3.20s; }
#道-s9   { stroke-dasharray: 25.3351; stroke-dashoffset: 25.3351; animation: drawStroke 0.22s ease-out 3.33s forwards; }
#道-bg10  { animation-delay: 3.57s; }
#道-s10   { stroke-dasharray: 13.0345; stroke-dashoffset: 13.0345; animation: drawStroke 0.22s ease-out 3.70s forwards; }
#道-bg11  { animation-delay: 3.94s; }
#道-s11   { stroke-dasharray: 62.0951; stroke-dashoffset: 62.0951; animation: drawStroke 0.34s ease-out 4.07s forwards; }
#道-bg12  { animation-delay: 4.43s; }
#道-s12   { stroke-dasharray: 80.4097; stroke-dashoffset: 80.4097; animation: drawStroke 0.44s ease-out 4.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #道-s[i]) -->
<path id="道-s1"  class="stroke" stroke="#bf0909" d="M49.38,14.88C51.99,16.66,56.11,22.18,56.760000000000005,24.94"/>
<path id="道-s2"  class="stroke" stroke="#bf6409" d="M77.25,12.5C77.31,13.34,77.22,14.16,76.88,14.92C75.5,18,73.5,21.62,70.25,25.119999999999997"/>
