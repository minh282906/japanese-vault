<path id="道-s6"  class="stroke" stroke="#09bf64" d="M53.01,45.09C59.25,44.38,75.67,42.34,77.61,42.21C79.57,42.07,80.96,42.76,80.96,45.02C80.96,46.1,80.39,68.42,80.16,77.26C80.11,79.26,80.07,80.54,80.03999999999999,80.69000000000001"/>
<path id="道-s7"  class="stroke" stroke="#09bfbf" d="M52.9,55.9C59,55.5,73.75,53.75,79.53999999999999,53.56"/>
<path id="道-s8"  class="stroke" stroke="#0964bf" d="M53.11,67.65C59.96,67.18,72.58,65.9,79.24,65.9"/>
<path id="道-s9"  class="stroke" stroke="#0909bf" d="M53.36,79.25C58.5,79.25,72.02,78.18,78.67,78.18"/>
<path id="道-s10"  class="stroke" stroke="#6409bf" d="M19.75,20C23.13,21.75,27.75,26.12,29.25,28.75"/>
<path id="道-s11"  class="stroke" stroke="#bf09bf" d="M13,51.53C15.25,52.39,16.75,51.96,17.75,51.75S26.75,48.28,28.25,47.85C31.21,47,32.47,48.06,30.69,50.88C24.130000000000003,61.260000000000005,23.880000000000003,59.38,30.580000000000002,65.28C32.97,67.38,32.730000000000004,68.8,30.01,70.76C25.5,74,21.75,76.25,17.5,79.04"/>
<path id="道-s12"  class="stroke" stroke="#bf0964" d="M12.5,81.71C15.61,81.24,21.72,80.83999999999999,26.47,81C33.62,81.25,57.599999999999994,89.25,62.18,90.46000000000001C74.61,93.76,81.62,95.5,91,96.05"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="道-bg1"  class="badge-group"><circle cx="49.38" cy="14.88" r="3.5" fill="#bf0909"/><text class="num-single" x="49.38" y="14.88" dx="0" dy="-0.5">1</text></g>
<g id="道-bg2"  class="badge-group"><circle cx="77.25" cy="12.5" r="3.5" fill="#bf6409"/><text class="num-single" x="77.25" y="12.5" dx="0" dy="-0.5">2</text></g>
