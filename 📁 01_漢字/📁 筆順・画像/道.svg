<path id="道-s4"  class="stroke" stroke="#64bf09" d="M64.26,33.62C64.51,33.72,64.03,35.37,63.870000000000005,35.66C62.84,37.589999999999996,61.790000000000006,40.209999999999994,59.370000000000005,42.75"/>
