<g id="道-bg9"  class="badge-group"><circle cx="53.36" cy="79.25" r="3.5" fill="#0909bf"/><text class="num-single" x="53.36" y="79.25" dx="0" dy="-0.5">9</text></g>
<g id="道-bg10" class="badge-group"><circle cx="19.75" cy="20" r="3.5" fill="#6409bf"/><text class="num-double" x="19.75" y="20" dx="-0.4" dy="-0.475">10</text></g>
