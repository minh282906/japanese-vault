<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (隅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #隅-bg[i]: Thời gian quả bóng số nảy lên
   - #隅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#隅-bg1  { animation-delay: 0.05s; }
#隅-s1   { stroke-dasharray: 42.5723; stroke-dashoffset: 42.5723; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#隅-bg2  { animation-delay: 0.43s; }
#隅-s2   { stroke-dasharray: 38.0890; stroke-dashoffset: 38.0890; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#隅-bg3  { animation-delay: 0.80s; }
#隅-s3   { stroke-dasharray: 77.3249; stroke-dashoffset: 77.3249; animation: drawStroke 0.43s ease-out 0.93s forwards; }
#隅-bg4  { animation-delay: 1.38s; }
#隅-s4   { stroke-dasharray: 28.3333; stroke-dashoffset: 28.3333; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#隅-bg5  { animation-delay: 1.75s; }
#隅-s5   { stroke-dasharray: 68.5707; stroke-dashoffset: 68.5707; animation: drawStroke 0.38s ease-out 1.88s forwards; }
#隅-bg6  { animation-delay: 2.28s; }
#隅-s6   { stroke-dasharray: 36.4353; stroke-dashoffset: 36.4353; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#隅-bg7  { animation-delay: 2.65s; }
#隅-s7   { stroke-dasharray: 31.9723; stroke-dashoffset: 31.9723; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#隅-bg8  { animation-delay: 3.02s; }
#隅-s8   { stroke-dasharray: 39.3140; stroke-dashoffset: 39.3140; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#隅-bg9  { animation-delay: 3.39s; }
#隅-s9   { stroke-dasharray: 98.6624; stroke-dashoffset: 98.6624; animation: drawStroke 0.54s ease-out 3.52s forwards; }
#隅-bg10  { animation-delay: 4.08s; }
#隅-s10   { stroke-dasharray: 54.0644; stroke-dashoffset: 54.0644; animation: drawStroke 0.30s ease-out 4.21s forwards; }
#隅-bg11  { animation-delay: 4.53s; }
#隅-s11   { stroke-dasharray: 28.6710; stroke-dashoffset: 28.6710; animation: drawStroke 0.22s ease-out 4.66s forwards; }
#隅-bg12  { animation-delay: 4.90s; }
#隅-s12   { stroke-dasharray: 17.2127; stroke-dashoffset: 17.2127; animation: drawStroke 0.22s ease-out 5.03s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

