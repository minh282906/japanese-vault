<path id="隅-s9"  class="stroke" stroke="#0909bf" d="M43.51,57.61C50.37,56.73,88.13,53,90.83,52.76C93.78,52.489999999999995,95.63,54.5,95.53,57.309999999999995C95.36,62,93.5,80.5,91.27,88.59C89.16,96.26,87.14,93.67,84.59,89.04"/>
<path id="隅-s10"  class="stroke" stroke="#6409bf" d="M65.45,19.71C66.37,20.630000000000003,66.60000000000001,21.7,66.60000000000001,23.240000000000002C66.59,30,66.54,71.4,66.54,73.48"/>
<path id="隅-s11"  class="stroke" stroke="#bf09bf" d="M52.99,77.82C54.18,79.02,55.75,78.69,56.81,78.25999999999999C59.79,77.05999999999999,73.76,72.27,79.99000000000001,70.10999999999999"/>
<path id="隅-s12"  class="stroke" stroke="#bf0964" d="M75.88,63.5C79.19,66,84.44,73.78999999999999,85.27,77.68"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
