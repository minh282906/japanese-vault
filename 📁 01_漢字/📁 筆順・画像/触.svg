<path id="触-s5"  class="stroke" stroke="#25bf09" d="M34.86,39.37C35.56,40.07,35.8,41.12,35.8,42.64C35.8,53.26,35.75,61.379999999999995,35.75,67.01"/>
<path id="触-s6"  class="stroke" stroke="#09bf41" d="M23.74,53.35C33.56,52,37.879999999999995,51.620000000000005,48.25,50.5"/>
