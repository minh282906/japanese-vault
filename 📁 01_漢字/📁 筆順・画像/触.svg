<path id="触-s8"  class="stroke" stroke="#0995bf" d="M57.83,41C58.73,41.9,59.12,42.87,59.25,43.89C59.78,48.01,60.78,52.89,61.59,59.99C61.78,61.68,61.980000000000004,63.46,62.2,65.32000000000001"/>
<path id="触-s9"  class="stroke" stroke="#0941bf" d="M59.93,42.63C68.02,41.690000000000005,82.72,39.78,90.00999999999999,39.13C93.69,38.800000000000004,95.24999999999999,41,94.75999999999999,43.550000000000004C93.96,47.720000000000006,93.16,50.150000000000006,91.63,57.89"/>
<path id="触-s10"  class="stroke" stroke="#2509bf" d="M63.02,62.01C70.25,61.25,79.55000000000001,60.419999999999995,88.74000000000001,59.48C90.58000000000001,59.29,92.35000000000001,59.12,94.00000000000001,58.959999999999994"/>
<path id="触-s11"  class="stroke" stroke="#7909bf" d="M75.62,14.5C76.56,15.44,77.09,16.88,77.09,18.259999999999998C77.09,19.139999999999997,77.12,81,77.12,86.75"/>
<path id="触-s12"  class="stroke" stroke="#bf09b1" d="M56.93,92.54C57.73,93.36,58.75,93.64,60.26,93.18C70.75,90,86.88,85.25,93.38,83.12"/>
<path id="触-s13"  class="stroke" stroke="#bf095d" d="M89.49,75.22C92.86999999999999,79,96.86999999999999,86.13,98.75999999999999,92.03999999999999"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
