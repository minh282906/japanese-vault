<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (触)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #触-bg[i]: Thời gian quả bóng số nảy lên
   - #触-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#触-bg1  { animation-delay: 0.05s; }
#触-s1   { stroke-dasharray: 28.0705; stroke-dashoffset: 28.0705; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#触-bg2  { animation-delay: 0.42s; }
#触-s2   { stroke-dasharray: 38.3639; stroke-dashoffset: 38.3639; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#触-bg3  { animation-delay: 0.79s; }
#触-s3   { stroke-dasharray: 55.6058; stroke-dashoffset: 55.6058; animation: drawStroke 0.31s ease-out 0.92s forwards; }
#触-bg4  { animation-delay: 1.25s; }
#触-s4   { stroke-dasharray: 93.7864; stroke-dashoffset: 93.7864; animation: drawStroke 0.52s ease-out 1.38s forwards; }
#触-bg5  { animation-delay: 1.92s; }
#触-s5   { stroke-dasharray: 27.8632; stroke-dashoffset: 27.8632; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#触-bg6  { animation-delay: 2.29s; }
#触-s6   { stroke-dasharray: 24.6765; stroke-dashoffset: 24.6765; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#触-bg7  { animation-delay: 2.66s; }
#触-s7   { stroke-dasharray: 26.1865; stroke-dashoffset: 26.1865; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#触-bg8  { animation-delay: 3.03s; }
#触-s8   { stroke-dasharray: 24.9188; stroke-dashoffset: 24.9188; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#触-bg9  { animation-delay: 3.40s; }
#触-s9   { stroke-dasharray: 52.7250; stroke-dashoffset: 52.7250; animation: drawStroke 0.29s ease-out 3.53s forwards; }
#触-bg10  { animation-delay: 3.84s; }
#触-s10   { stroke-dasharray: 31.1298; stroke-dashoffset: 31.1298; animation: drawStroke 0.22s ease-out 3.97s forwards; }
#触-bg11  { animation-delay: 4.21s; }
#触-s11   { stroke-dasharray: 72.6272; stroke-dashoffset: 72.6272; animation: drawStroke 0.40s ease-out 4.34s forwards; }
#触-bg12  { animation-delay: 4.76s; }
#触-s12   { stroke-dasharray: 38.2091; stroke-dashoffset: 38.2091; animation: drawStroke 0.22s ease-out 4.89s forwards; }
#触-bg13  { animation-delay: 5.13s; }
#触-s13   { stroke-dasharray: 19.3180; stroke-dashoffset: 19.3180; animation: drawStroke 0.22s ease-out 5.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

