<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鼻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鼻-bg[i]: Thời gian quả bóng số nảy lên
   - #鼻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鼻-bg1  { animation-delay: 0.05s; }
#鼻-s1   { stroke-dasharray: 9.5940; stroke-dashoffset: 9.5940; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鼻-bg2  { animation-delay: 0.42s; }
#鼻-s2   { stroke-dasharray: 26.6873; stroke-dashoffset: 26.6873; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鼻-bg3  { animation-delay: 0.79s; }
#鼻-s3   { stroke-dasharray: 54.1180; stroke-dashoffset: 54.1180; animation: drawStroke 0.30s ease-out 0.92s forwards; }
#鼻-bg4  { animation-delay: 1.24s; }
#鼻-s4   { stroke-dasharray: 26.6664; stroke-dashoffset: 26.6664; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#鼻-bg5  { animation-delay: 1.61s; }
#鼻-s5   { stroke-dasharray: 26.1567; stroke-dashoffset: 26.1567; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#鼻-bg6  { animation-delay: 1.98s; }
#鼻-s6   { stroke-dasharray: 24.8603; stroke-dashoffset: 24.8603; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#鼻-bg7  { animation-delay: 2.35s; }
#鼻-s7   { stroke-dasharray: 19.4060; stroke-dashoffset: 19.4060; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#鼻-bg8  { animation-delay: 2.72s; }
#鼻-s8   { stroke-dasharray: 62.7982; stroke-dashoffset: 62.7982; animation: drawStroke 0.35s ease-out 2.85s forwards; }
#鼻-bg9  { animation-delay: 3.22s; }
#鼻-s9   { stroke-dasharray: 14.9496; stroke-dashoffset: 14.9496; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#鼻-bg10  { animation-delay: 3.59s; }
#鼻-s10   { stroke-dasharray: 40.6559; stroke-dashoffset: 40.6559; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#鼻-bg11  { animation-delay: 3.96s; }
#鼻-s11   { stroke-dasharray: 37.2432; stroke-dashoffset: 37.2432; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#鼻-bg12  { animation-delay: 4.33s; }
#鼻-s12   { stroke-dasharray: 78.6083; stroke-dashoffset: 78.6083; animation: drawStroke 0.43s ease-out 4.46s forwards; }
#鼻-bg13  { animation-delay: 4.91s; }
#鼻-s13   { stroke-dasharray: 34.5980; stroke-dashoffset: 34.5980; animation: drawStroke 0.22s ease-out 5.04s forwards; }
#鼻-bg14  { animation-delay: 5.28s; }
#鼻-s14   { stroke-dasharray: 30.1864; stroke-dashoffset: 30.1864; animation: drawStroke 0.22s ease-out 5.41s forwards; }
]]>
</style>

