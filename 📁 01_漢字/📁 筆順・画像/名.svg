<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (名)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #名-bg[i]: Thời gian quả bóng số nảy lên
   - #名-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#名-bg1  { animation-delay: 0.05s; }
#名-s1   { stroke-dasharray: 42.5948; stroke-dashoffset: 42.5948; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#名-bg2  { animation-delay: 0.43s; }
#名-s2   { stroke-dasharray: 113.7940; stroke-dashoffset: 113.7940; animation: drawStroke 0.55s ease-out 0.56s forwards; }
#名-bg3  { animation-delay: 1.13s; }
#名-s3   { stroke-dasharray: 13.8003; stroke-dashoffset: 13.8003; animation: drawStroke 0.22s ease-out 1.26s forwards; }
#名-bg4  { animation-delay: 1.50s; }
#名-s4   { stroke-dasharray: 29.2256; stroke-dashoffset: 29.2256; animation: drawStroke 0.22s ease-out 1.63s forwards; }
#名-bg5  { animation-delay: 1.87s; }
#名-s5   { stroke-dasharray: 66.0974; stroke-dashoffset: 66.0974; animation: drawStroke 0.36s ease-out 2.00s forwards; }
#名-bg6  { animation-delay: 2.38s; }
#名-s6   { stroke-dasharray: 35.6838; stroke-dashoffset: 35.6838; animation: drawStroke 0.22s ease-out 2.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #名-s[i]) -->
<path id="名-s1"  class="stroke" stroke="#bf0909" d="M54.2,12.64C54.5,14.25,54.13,15.63,53.510000000000005,16.880000000000003C50.02,24.01,40.230000000000004,36.17,27.550000000000004,44.42"/>
<path id="名-s2"  class="stroke" stroke="#bfbf09" d="M53.25,24.16C54.13,24.63,55.2,24.66,56.53,24.53C60.9,24.1,68.52,22.060000000000002,74.34,20.43C78.52000000000001,19.259999999999998,79.8,21.45,78.75,23.939999999999998C72.25,39.38,43.88,69.62,16,77.5"/>
<path id="名-s3"  class="stroke" stroke="#09bf09" d="M43.62,40.88C47.239999999999995,42.88,51.62,46.88,53.3,50.46"/>
<path id="名-s4"  class="stroke" stroke="#09bfbf" d="M42,67.81C42.91,68.72,43.62,70,43.83,71.14C44.33,73.96,45.98,85.52,46.879999999999995,92C47.17999999999999,94.12,47.4,95.7,47.47,96.25"/>
<path id="名-s5"  class="stroke" stroke="#0909bf" d="M44.53,69.52C55.35,68.14,76.92,65.11999999999999,82.53999999999999,64.99C85.3,64.92999999999999,86.61999999999999,66.61999999999999,85.78999999999999,69.63C84.66,73.69,82.27,83.66999999999999,81.14999999999999,89.99"/>
<path id="名-s6"  class="stroke" stroke="#bf09bf" d="M47.99,93.99C55.25,93.38,67.64,92.38,77.53,91.61999999999999C79.72,91.44999999999999,81.77,91.33999999999999,83.57000000000001,91.30999999999999"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="名-bg1"  class="badge-group"><circle cx="54.2" cy="12.64" r="3.5" fill="#bf0909"/><text class="num-single" x="54.2" y="12.64" dx="0" dy="-0.5">1</text></g>
<g id="名-bg2"  class="badge-group"><circle cx="53.25" cy="24.16" r="3.5" fill="#bfbf09"/><text class="num-single" x="53.25" y="24.16" dx="0" dy="-0.5">2</text></g>
<g id="名-bg3"  class="badge-group"><circle cx="43.62" cy="40.88" r="3.5" fill="#09bf09"/><text class="num-single" x="43.62" y="40.88" dx="0" dy="-0.5">3</text></g>
<g id="名-bg4"  class="badge-group"><circle cx="42" cy="64.31" r="3.5" fill="#09bfbf"/><text class="num-single" x="42" y="64.31" dx="0" dy="-0.5">4</text></g>
<g id="名-bg5"  class="badge-group"><circle cx="44.53" cy="73.02" r="3.5" fill="#0909bf"/><text class="num-single" x="44.53" y="73.02" dx="0" dy="-0.5">5</text></g>
<g id="名-bg6"  class="badge-group"><circle cx="47.99" cy="93.99" r="3.5" fill="#bf09bf"/><text class="num-single" x="47.99" y="93.99" dx="0" dy="-0.5">6</text></g>
</svg>