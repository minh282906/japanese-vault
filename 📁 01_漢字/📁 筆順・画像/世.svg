<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (世)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #世-bg[i]: Thời gian quả bóng số nảy lên
   - #世-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#世-bg1  { animation-delay: 0.05s; }
#世-s1   { stroke-dasharray: 88.5225; stroke-dashoffset: 88.5225; animation: drawStroke 0.49s ease-out 0.18s forwards; }
#世-bg2  { animation-delay: 0.69s; }
#世-s2   { stroke-dasharray: 53.8742; stroke-dashoffset: 53.8742; animation: drawStroke 0.30s ease-out 0.82s forwards; }
#世-bg3  { animation-delay: 1.14s; }
#世-s3   { stroke-dasharray: 49.7133; stroke-dashoffset: 49.7133; animation: drawStroke 0.27s ease-out 1.27s forwards; }
#世-bg4  { animation-delay: 1.56s; }
#世-s4   { stroke-dasharray: 23.0498; stroke-dashoffset: 23.0498; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#世-bg5  { animation-delay: 1.93s; }
#世-s5   { stroke-dasharray: 127.5330; stroke-dashoffset: 127.5330; animation: drawStroke 0.55s ease-out 2.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #世-s[i]) -->
<path id="世-s1"  class="stroke" stroke="#bf0909" d="M11.25,47.7C14,48.38,18.47,48.46,21.02,48.24C41.379999999999995,46.5,69.38,43.870000000000005,90.58999999999999,43.260000000000005C94.82999999999998,43.14000000000001,97.38,43.52,99.50999999999999,43.790000000000006"/>
<path id="世-s2"  class="stroke" stroke="#9abf09" d="M53.37,17.5C54.309999999999995,18.44,54.769999999999996,19.98,54.83,21C54.97,23.54,55.519999999999996,52.980000000000004,55.629999999999995,65.88C55.65,68.24,55.65,70.03999999999999,55.60999999999999,71"/>
<path id="世-s3"  class="stroke" stroke="#09bf52" d="M77.37,15.5C78.19,16.31,78.87,17.73,78.83,18.75C78.64999999999999,23.78,76.44,63.44,76.36,64.75"/>
<path id="世-s4"  class="stroke" stroke="#0952bf" d="M56.25,67C60.32,66.8,69.42,66.05,75.38,65.69C76.92999999999999,65.6,78.27,65.53,79.25,65.5"/>
<path id="世-s5"  class="stroke" stroke="#9a09bf" d="M29.87,23.75C30.810000000000002,24.69,31.330000000000002,26.23,31.330000000000002,27.25C31.380000000000003,46.129999999999995,30.380000000000003,68.37,29.5,83.75C29.29,87.5,29.88,90.41,33.25,90C54,87.5,67.25,86.12,84.25,86.75C87.51,86.87,90.25,87.5,91.5,87.75"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="世-bg1"  class="badge-group"><circle cx="11.25" cy="47.7" r="3.5" fill="#bf0909"/><text class="num-single" x="11.25" y="47.7" dx="0" dy="-0.5">1</text></g>
<g id="世-bg2"  class="badge-group"><circle cx="53.37" cy="17.5" r="3.5" fill="#9abf09"/><text class="num-single" x="53.37" y="17.5" dx="0" dy="-0.5">2</text></g>
<g id="世-bg3"  class="badge-group"><circle cx="77.37" cy="15.5" r="3.5" fill="#09bf52"/><text class="num-single" x="77.37" y="15.5" dx="0" dy="-0.5">3</text></g>
<g id="世-bg4"  class="badge-group"><circle cx="56.25" cy="67" r="3.5" fill="#0952bf"/><text class="num-single" x="56.25" y="67" dx="0" dy="-0.5">4</text></g>
<g id="世-bg5"  class="badge-group"><circle cx="29.87" cy="23.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="29.87" y="23.75" dx="0" dy="-0.5">5</text></g>
</svg>