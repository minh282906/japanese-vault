<path id="腰-s9"  class="stroke" stroke="#0941bf" d="M75.59,18.73C76.38000000000001,19.62,76.73,20.62,76.61,22.18C76.12,28.75,75.62,38.379999999999995,75.46,43.36"/>
<path id="腰-s10"  class="stroke" stroke="#2509bf" d="M52.75,47.78C62.53,46.19,79.85,43.85,87.88,43.120000000000005"/>
<path id="腰-s11"  class="stroke" stroke="#7909bf" d="M65.38,51.78C65.72999999999999,52.96,65.64999999999999,54.22,65.21,55.65C63.49999999999999,61.129999999999995,61.07999999999999,67.47,56.699999999999996,75.71C55.74999999999999,77.5,56.489999999999995,78.24,57.209999999999994,78.25999999999999C61.989999999999995,78.38999999999999,72.88,81.88,80.32,86.41999999999999C84.39999999999999,88.90999999999998,87.75,91.97999999999999,89.50999999999999,95.07999999999998"/>
<path id="腰-s12"  class="stroke" stroke="#bf09b1" d="M80.58,60.04C80.75,61.25,80.77,62.67,80.39,63.879999999999995C77.25,74,69.62,88.5,49.37,96"/>
<path id="腰-s13"  class="stroke" stroke="#bf095d" d="M43.9,65.28C46.42,66.31,49.51,65.8,52.129999999999995,65.51C61.81999999999999,64.44000000000001,79.71,62.120000000000005,91.75,61.620000000000005C94.11,61.52,97.04,61.150000000000006,99.23,62.31"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="腰-bg1"  class="badge-group"><circle cx="17.5" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="17.5" y="17.5" dx="0" dy="-0.5">1</text></g>
