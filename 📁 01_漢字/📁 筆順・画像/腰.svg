<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (腰)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #腰-bg[i]: Thời gian quả bóng số nảy lên
   - #腰-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#腰-bg1  { animation-delay: 0.05s; }
#腰-s1   { stroke-dasharray: 70.4336; stroke-dashoffset: 70.4336; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#腰-bg2  { animation-delay: 0.59s; }
#腰-s2   { stroke-dasharray: 96.3459; stroke-dashoffset: 96.3459; animation: drawStroke 0.53s ease-out 0.72s forwards; }
#腰-bg3  { animation-delay: 1.27s; }
#腰-s3   { stroke-dasharray: 16.9370; stroke-dashoffset: 16.9370; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#腰-bg4  { animation-delay: 1.64s; }
#腰-s4   { stroke-dasharray: 17.6476; stroke-dashoffset: 17.6476; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#腰-bg5  { animation-delay: 2.01s; }
#腰-s5   { stroke-dasharray: 40.9729; stroke-dashoffset: 40.9729; animation: drawStroke 0.23s ease-out 2.14s forwards; }
#腰-bg6  { animation-delay: 2.39s; }
#腰-s6   { stroke-dasharray: 17.8965; stroke-dashoffset: 17.8965; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#腰-bg7  { animation-delay: 2.76s; }
#腰-s7   { stroke-dasharray: 59.0998; stroke-dashoffset: 59.0998; animation: drawStroke 0.33s ease-out 2.89s forwards; }
#腰-bg8  { animation-delay: 3.24s; }
#腰-s8   { stroke-dasharray: 24.2330; stroke-dashoffset: 24.2330; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#腰-bg9  { animation-delay: 3.61s; }
#腰-s9   { stroke-dasharray: 24.9230; stroke-dashoffset: 24.9230; animation: drawStroke 0.22s ease-out 3.74s forwards; }
#腰-bg10  { animation-delay: 3.98s; }
#腰-s10   { stroke-dasharray: 35.4423; stroke-dashoffset: 35.4423; animation: drawStroke 0.22s ease-out 4.11s forwards; }
#腰-bg11  { animation-delay: 4.35s; }
#腰-s11   { stroke-dasharray: 66.3704; stroke-dashoffset: 66.3704; animation: drawStroke 0.37s ease-out 4.48s forwards; }
#腰-bg12  { animation-delay: 4.87s; }
#腰-s12   { stroke-dasharray: 50.2397; stroke-dashoffset: 50.2397; animation: drawStroke 0.28s ease-out 5.00s forwards; }
#腰-bg13  { animation-delay: 5.30s; }
#腰-s13   { stroke-dasharray: 55.7485; stroke-dashoffset: 55.7485; animation: drawStroke 0.31s ease-out 5.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

