<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (容)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #容-bg[i]: Thời gian quả bóng số nảy lên
   - #容-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#容-bg1  { animation-delay: 0.05s; }
#容-s1   { stroke-dasharray: 12.0011; stroke-dashoffset: 12.0011; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#容-bg2  { animation-delay: 0.42s; }
#容-s2   { stroke-dasharray: 15.9651; stroke-dashoffset: 15.9651; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#容-bg3  { animation-delay: 0.79s; }
#容-s3   { stroke-dasharray: 81.5042; stroke-dashoffset: 81.5042; animation: drawStroke 0.45s ease-out 0.92s forwards; }
#容-bg4  { animation-delay: 1.39s; }
#容-s4   { stroke-dasharray: 23.4523; stroke-dashoffset: 23.4523; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#容-bg5  { animation-delay: 1.76s; }
#容-s5   { stroke-dasharray: 20.0248; stroke-dashoffset: 20.0248; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#容-bg6  { animation-delay: 2.13s; }
#容-s6   { stroke-dasharray: 48.7833; stroke-dashoffset: 48.7833; animation: drawStroke 0.27s ease-out 2.26s forwards; }
#容-bg7  { animation-delay: 2.55s; }
#容-s7   { stroke-dasharray: 47.7085; stroke-dashoffset: 47.7085; animation: drawStroke 0.26s ease-out 2.68s forwards; }
#容-bg8  { animation-delay: 2.96s; }
#容-s8   { stroke-dasharray: 24.2593; stroke-dashoffset: 24.2593; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#容-bg9  { animation-delay: 3.33s; }
#容-s9   { stroke-dasharray: 55.3589; stroke-dashoffset: 55.3589; animation: drawStroke 0.30s ease-out 3.46s forwards; }
#容-bg10  { animation-delay: 3.78s; }
#容-s10   { stroke-dasharray: 30.7779; stroke-dashoffset: 30.7779; animation: drawStroke 0.22s ease-out 3.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #容-s[i]) -->
<path id="容-s1"  class="stroke" stroke="#bf0909" d="M53.53,10.66C54.370000000000005,11.5,54.83,13.1,54.83,14.29C54.83,16.25,54.73,18.5,54.73,22.35"/>
<path id="容-s2"  class="stroke" stroke="#bf7609" d="M20.75,24.38C20.75,27.77,17.14,37.08,15.5,39.34"/>
<path id="容-s3"  class="stroke" stroke="#9abf09" d="M21.51,26.36C35,25.38,66.38,22.25,86.67,21.39C98.28,20.900000000000002,89.13,28.29,86.24,30.32"/>
<path id="容-s4"  class="stroke" stroke="#2dbf09" d="M39.84,34.23C39.970000000000006,35.33,39.52,36.279999999999994,38.86000000000001,37.209999999999994C36.27000000000001,40.88999999999999,31.03000000000001,44.949999999999996,23.17000000000001,49.809999999999995"/>
<path id="容-s5"  class="stroke" stroke="#09bf52" d="M65.88,34.38C71.89,37.580000000000005,79.22,43.690000000000005,81.28,46.96"/>
<path id="容-s6"  class="stroke" stroke="#09bfbf" d="M52.32,43.05C52.410000000000004,43.82,52.29,45.18,51.63,46.15C45.620000000000005,55.12,34.620000000000005,65.12,17.510000000000005,75.86"/>
<path id="容-s7"  class="stroke" stroke="#0952bf" d="M52.23,47.34C62.919999999999995,55,74.44,63.59,83.67999999999999,69.61C86.55,71.48,88.75,73.01,91.6,74.2"/>
<path id="容-s8"  class="stroke" stroke="#2d09bf" d="M34.27,74.32C34.980000000000004,75.02999999999999,35.39,75.96,35.59,77.02999999999999C37,84.38,37.56,88.22,38.51,95C38.66,96.03,38.8,97.03,38.93,97.96"/>
<path id="容-s9"  class="stroke" stroke="#9a09bf" d="M36.56,76.45C47.870000000000005,75.09,59.870000000000005,73.75,68.64,73.11C72.15,72.86,73.71000000000001,74.7,72.6,78.28C71.03999999999999,83.32000000000001,70.03999999999999,86.4,68.53,92.58"/>
<path id="容-s10"  class="stroke" stroke="#bf0976" d="M39.86,95.72C48.31,95.25,56.8,94.8,66.24,94.12C67.5,94.03,69.28,93.94,70.58,93.84"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="容-bg1"  class="badge-group"><circle cx="53.53" cy="10.66" r="3.5" fill="#bf0909"/><text class="num-single" x="53.53" y="10.66" dx="0" dy="-0.5">1</text></g>
<g id="容-bg2"  class="badge-group"><circle cx="20.75" cy="20.88" r="3.5" fill="#bf7609"/><text class="num-single" x="20.75" y="20.88" dx="0" dy="-0.5">2</text></g>
<g id="容-bg3"  class="badge-group"><circle cx="21.51" cy="29.86" r="3.5" fill="#9abf09"/><text class="num-single" x="21.51" y="29.86" dx="0" dy="-0.5">3</text></g>
<g id="容-bg4"  class="badge-group"><circle cx="39.84" cy="34.23" r="3.5" fill="#2dbf09"/><text class="num-single" x="39.84" y="34.23" dx="0" dy="-0.5">4</text></g>
<g id="容-bg5"  class="badge-group"><circle cx="65.88" cy="34.38" r="3.5" fill="#09bf52"/><text class="num-single" x="65.88" y="34.38" dx="0" dy="-0.5">5</text></g>
<g id="容-bg6"  class="badge-group"><circle cx="52.32" cy="39.55" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.32" y="39.55" dx="0" dy="-0.5">6</text></g>
<g id="容-bg7"  class="badge-group"><circle cx="52.23" cy="50.84" r="3.5" fill="#0952bf"/><text class="num-single" x="52.23" y="50.84" dx="0" dy="-0.5">7</text></g>
<g id="容-bg8"  class="badge-group"><circle cx="34.27" cy="70.82" r="3.5" fill="#2d09bf"/><text class="num-single" x="34.27" y="70.82" dx="0" dy="-0.5">8</text></g>
<g id="容-bg9"  class="badge-group"><circle cx="36.56" cy="79.95" r="3.5" fill="#9a09bf"/><text class="num-single" x="36.56" y="79.95" dx="0" dy="-0.5">9</text></g>
<g id="容-bg10" class="badge-group"><circle cx="39.86" cy="95.72" r="3.5" fill="#bf0976"/><text class="num-double" x="39.86" y="95.72" dx="-0.4" dy="-0.475">10</text></g>
</svg>