<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (富)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #富-bg[i]: Thời gian quả bóng số nảy lên
   - #富-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#富-bg1  { animation-delay: 0.05s; }
#富-s1   { stroke-dasharray: 11.7936; stroke-dashoffset: 11.7936; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#富-bg2  { animation-delay: 0.42s; }
#富-s2   { stroke-dasharray: 17.5114; stroke-dashoffset: 17.5114; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#富-bg3  { animation-delay: 0.79s; }
#富-s3   { stroke-dasharray: 80.0896; stroke-dashoffset: 80.0896; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#富-bg4  { animation-delay: 1.38s; }
#富-s4   { stroke-dasharray: 36.7323; stroke-dashoffset: 36.7323; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#富-bg5  { animation-delay: 1.75s; }
#富-s5   { stroke-dasharray: 15.1557; stroke-dashoffset: 15.1557; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#富-bg6  { animation-delay: 2.12s; }
#富-s6   { stroke-dasharray: 43.0343; stroke-dashoffset: 43.0343; animation: drawStroke 0.24s ease-out 2.25s forwards; }
#富-bg7  { animation-delay: 2.51s; }
#富-s7   { stroke-dasharray: 28.6631; stroke-dashoffset: 28.6631; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#富-bg8  { animation-delay: 2.88s; }
#富-s8   { stroke-dasharray: 30.6251; stroke-dashoffset: 30.6251; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#富-bg9  { animation-delay: 3.25s; }
#富-s9   { stroke-dasharray: 77.8537; stroke-dashoffset: 77.8537; animation: drawStroke 0.43s ease-out 3.38s forwards; }
#富-bg10  { animation-delay: 3.83s; }
#富-s10   { stroke-dasharray: 24.3190; stroke-dashoffset: 24.3190; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#富-bg11  { animation-delay: 4.20s; }
#富-s11   { stroke-dasharray: 43.7493; stroke-dashoffset: 43.7493; animation: drawStroke 0.24s ease-out 4.33s forwards; }
#富-bg12  { animation-delay: 4.59s; }
#富-s12   { stroke-dasharray: 39.9910; stroke-dashoffset: 39.9910; animation: drawStroke 0.22s ease-out 4.72s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

