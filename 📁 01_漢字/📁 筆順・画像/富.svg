<path id="富-s6"  class="stroke" stroke="#09bf64" d="M39.04,46.98C46.86,46.089999999999996,60.980000000000004,44.56999999999999,67.5,43.97C70.43,43.699999999999996,71.88,45,71.27,47.43C70.67,49.83,70.05,51.33,68.3,54.93"/>
<path id="富-s7"  class="stroke" stroke="#09bfbf" d="M41.69,58.35C46.209999999999994,58.03,58.06,56.77,65.99,56.120000000000005C67.61999999999999,55.99,69.07,55.88,70.24,55.82000000000001"/>
<path id="富-s8"  class="stroke" stroke="#0964bf" d="M29.13,68.06C29.97,68.9,30.5,69.75,30.75,71.10000000000001C31.89,77.48,32.86,85.79,33.71,93.73C33.87,95.21000000000001,34.02,96.65,34.15,98"/>
<path id="富-s9"  class="stroke" stroke="#0909bf" d="M32.06,70.07C45.75,69.11999999999999,65.62,67.21,75.05000000000001,66.72C78.52000000000001,66.53999999999999,80.25000000000001,68,80.09000000000002,70.83C79.86000000000001,75.07,78.13000000000002,83.75,76.32000000000002,92.81C76.01000000000002,94.35000000000001,75.62000000000002,95.87,75.15000000000002,97.48"/>
<path id="富-s10"  class="stroke" stroke="#6409bf" d="M53.3,70.43C54,71.13000000000001,54.5,72.5,54.5,73.75C54.5,80.5,54.48,90.13,54.48,94.46000000000001"/>
<path id="富-s11"  class="stroke" stroke="#bf09bf" d="M33.57,82.42C45.5,81.62,68.63,80.25,77.25999999999999,80.22"/>
<path id="富-s12"  class="stroke" stroke="#bf0964" d="M34.56,95.95C44.63,95.38000000000001,61.95,94.58,74.52000000000001,94.45"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="富-bg1"  class="badge-group"><circle cx="52.77" cy="11.69" r="3.5" fill="#bf0909"/><text class="num-single" x="52.77" y="11.69" dx="0" dy="-0.5">1</text></g>
