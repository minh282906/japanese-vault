<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (杯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #杯-bg[i]: Thời gian quả bóng số nảy lên
   - #杯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#杯-bg1  { animation-delay: 0.05s; }
#杯-s1   { stroke-dasharray: 33.6372; stroke-dashoffset: 33.6372; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#杯-bg2  { animation-delay: 0.42s; }
#杯-s2   { stroke-dasharray: 82.6263; stroke-dashoffset: 82.6263; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#杯-bg3  { animation-delay: 1.02s; }
#杯-s3   { stroke-dasharray: 39.0417; stroke-dashoffset: 39.0417; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#杯-bg4  { animation-delay: 1.39s; }
#杯-s4   { stroke-dasharray: 15.8221; stroke-dashoffset: 15.8221; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#杯-bg5  { animation-delay: 1.76s; }
#杯-s5   { stroke-dasharray: 50.7638; stroke-dashoffset: 50.7638; animation: drawStroke 0.28s ease-out 1.89s forwards; }
#杯-bg6  { animation-delay: 2.19s; }
#杯-s6   { stroke-dasharray: 50.0711; stroke-dashoffset: 50.0711; animation: drawStroke 0.28s ease-out 2.32s forwards; }
#杯-bg7  { animation-delay: 2.62s; }
#杯-s7   { stroke-dasharray: 56.4193; stroke-dashoffset: 56.4193; animation: drawStroke 0.31s ease-out 2.75s forwards; }
#杯-bg8  { animation-delay: 3.08s; }
#杯-s8   { stroke-dasharray: 29.1277; stroke-dashoffset: 29.1277; animation: drawStroke 0.22s ease-out 3.21s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #杯-s[i]) -->
<path id="杯-s1"  class="stroke" stroke="#bf0909" d="M12.28,36.22C14.379999999999999,36.75,16.58,36.49,18.009999999999998,36.33C24.11,35.66,34.89,33.629999999999995,41.019999999999996,32.46C42.279999999999994,32.22,44.129999999999995,31.880000000000003,45.519999999999996,32.12"/>
<path id="杯-s2"  class="stroke" stroke="#bf9109" d="M29.61,13C30.8,14.19,31.15,15.879999999999999,31.15,17.92C31.15,18.720000000000002,31.139999999999997,66.2,31.13,87C31.13,90.78,31.13,93.67,31.13,95.25"/>
<path id="杯-s3"  class="stroke" stroke="#64bf09" d="M30.69,36.53C30.69,38,30.07,40.17,29.53,41.39C24.36,53.120000000000005,20.48,58.93,11.86,70.34"/>
<path id="杯-s4"  class="stroke" stroke="#09bf36" d="M33.97,42.65C37.199999999999996,44.24,41.12,48.25,44.75,54"/>
<path id="杯-s5"  class="stroke" stroke="#09bfbf" d="M47.97,24.71C50.5,25.37,53.46,25.07,55.5,24.810000000000002C65.21000000000001,23.590000000000003,79.65,21.76,90.25,20.790000000000003C92.99,20.540000000000003,95.73,20.240000000000002,98.4,21.01"/>
<path id="杯-s6"  class="stroke" stroke="#0936bf" d="M74.81,26.41C74.89,27.31,75.15,28.79,74.64,30.03C71.75,37,60.12,53.12,44.37,64.67"/>
<path id="杯-s7"  class="stroke" stroke="#6409bf" d="M68,39.25C69.19,40.44,69.64,42,69.64,43.87C69.64,46.709999999999994,69.69,72.64,69.72,86.5C69.73,91.15,69.73,94.5,69.73,95.25"/>
<path id="杯-s8"  class="stroke" stroke="#bf0991" d="M80.14,49.25C86.58,53.17,96.76,65.36,98.38,71.45"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="杯-bg1"  class="badge-group"><circle cx="12.28" cy="36.22" r="3.5" fill="#bf0909"/><text class="num-single" x="12.28" y="36.22" dx="0" dy="-0.5">1</text></g>
<g id="杯-bg2"  class="badge-group"><circle cx="29.61" cy="13" r="3.5" fill="#bf9109"/><text class="num-single" x="29.61" y="13" dx="0" dy="-0.5">2</text></g>
<g id="杯-bg3"  class="badge-group"><circle cx="30.69" cy="33.03" r="3.5" fill="#64bf09"/><text class="num-single" x="30.69" y="33.03" dx="0" dy="-0.5">3</text></g>
<g id="杯-bg4"  class="badge-group"><circle cx="33.97" cy="46.15" r="3.5" fill="#09bf36"/><text class="num-single" x="33.97" y="46.15" dx="0" dy="-0.5">4</text></g>
<g id="杯-bg5"  class="badge-group"><circle cx="47.97" cy="24.71" r="3.5" fill="#09bfbf"/><text class="num-single" x="47.97" y="24.71" dx="0" dy="-0.5">5</text></g>
<g id="杯-bg6"  class="badge-group"><circle cx="74.81" cy="26.41" r="3.5" fill="#0936bf"/><text class="num-single" x="74.81" y="26.41" dx="0" dy="-0.5">6</text></g>
<g id="杯-bg7"  class="badge-group"><circle cx="68" cy="39.25" r="3.5" fill="#6409bf"/><text class="num-single" x="68" y="39.25" dx="0" dy="-0.5">7</text></g>
<g id="杯-bg8"  class="badge-group"><circle cx="80.14" cy="49.25" r="3.5" fill="#bf0991"/><text class="num-single" x="80.14" y="49.25" dx="0" dy="-0.5">8</text></g>
</svg>