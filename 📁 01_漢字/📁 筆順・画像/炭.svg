<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (炭)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #炭-bg[i]: Thời gian quả bóng số nảy lên
   - #炭-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#炭-bg1  { animation-delay: 0.05s; }
#炭-s1   { stroke-dasharray: 18.3968; stroke-dashoffset: 18.3968; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#炭-bg2  { animation-delay: 0.42s; }
#炭-s2   { stroke-dasharray: 64.7746; stroke-dashoffset: 64.7746; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#炭-bg3  { animation-delay: 0.93s; }
#炭-s3   { stroke-dasharray: 16.1977; stroke-dashoffset: 16.1977; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#炭-bg4  { animation-delay: 1.30s; }
#炭-s4   { stroke-dasharray: 60.0757; stroke-dashoffset: 60.0757; animation: drawStroke 0.33s ease-out 1.43s forwards; }
#炭-bg5  { animation-delay: 1.78s; }
#炭-s5   { stroke-dasharray: 47.2467; stroke-dashoffset: 47.2467; animation: drawStroke 0.26s ease-out 1.91s forwards; }
#炭-bg6  { animation-delay: 2.19s; }
#炭-s6   { stroke-dasharray: 12.1165; stroke-dashoffset: 12.1165; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#炭-bg7  { animation-delay: 2.56s; }
#炭-s7   { stroke-dasharray: 19.5988; stroke-dashoffset: 19.5988; animation: drawStroke 0.22s ease-out 2.69s forwards; }
#炭-bg8  { animation-delay: 2.93s; }
#炭-s8   { stroke-dasharray: 55.2062; stroke-dashoffset: 55.2062; animation: drawStroke 0.30s ease-out 3.06s forwards; }
#炭-bg9  { animation-delay: 3.38s; }
#炭-s9   { stroke-dasharray: 41.8958; stroke-dashoffset: 41.8958; animation: drawStroke 0.23s ease-out 3.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #炭-s[i]) -->
<path id="炭-s1"  class="stroke" stroke="#bf0909" d="M52.51,13.38C53.5,14.370000000000001,54.37,16,54.37,17.28C54.37,19.25,54.18,26.5,54.18,31.26"/>
<path id="炭-s2"  class="stroke" stroke="#bf8209" d="M29.68,21C30.24,21.33,30.63,22.5,30.55,23.66C30.38,26.25,30.13,29.13,29.71,32.92C29.54,34.440000000000005,30.8,35.56,32.07,35.2C40.5,32.75,75.4,30.03,80.42,29.900000000000002"/>
<path id="炭-s3"  class="stroke" stroke="#82bf09" d="M81.02,16.62C81.95,17.55,82.25,18.62,82.14,19.77C81.86,22.73,81.52,25.92,81.3,29C81.22,30.17,81.14999999999999,31.33,81.11,32.46"/>
<path id="炭-s4"  class="stroke" stroke="#09bf09" d="M25.72,47.15C28.14,47.76,30.66,47.44,33.12,47.26C45.809999999999995,46.379999999999995,62.949999999999996,43.849999999999994,76.37,43.37C79.43,43.26,82.52000000000001,43.169999999999995,85.56,43.629999999999995"/>
<path id="炭-s5"  class="stroke" stroke="#09bf82" d="M27.43,48.16C28.259999999999998,48.989999999999995,28.66,50.19,28.61,51.739999999999995C28.12,66.88,26.25,80.63,16.049999999999997,92.25999999999999"/>
<path id="炭-s6"  class="stroke" stroke="#0982bf" d="M37.54,62.62C39.94,64.71,43.42,70.63,44.07,72.72999999999999"/>
<path id="炭-s7"  class="stroke" stroke="#0909bf" d="M80.4,56.21C80.73,57.38,80.5,58.71,79.74000000000001,59.65C77.13000000000001,62.879999999999995,71.81,68.58,68.51,70.95"/>
<path id="炭-s8"  class="stroke" stroke="#8209bf" d="M56.94,51.76C57.839999999999996,52.66,57.97,53.989999999999995,57.93,55.51C57.25,81.5,44.12,91.25,32.5,96.25"/>
<path id="炭-s9"  class="stroke" stroke="#bf0982" d="M57.51,67.62C65.75999999999999,78.74000000000001,73.44,86.78,80.39,91.59C82.64,93.14,84.87,94.5,88,95.58"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="炭-bg1"  class="badge-group"><circle cx="52.51" cy="13.38" r="3.5" fill="#bf0909"/><text class="num-single" x="52.51" y="13.38" dx="0" dy="-0.5">1</text></g>
<g id="炭-bg2"  class="badge-group"><circle cx="29.68" cy="21" r="3.5" fill="#bf8209"/><text class="num-single" x="29.68" y="21" dx="0" dy="-0.5">2</text></g>
<g id="炭-bg3"  class="badge-group"><circle cx="81.02" cy="16.62" r="3.5" fill="#82bf09"/><text class="num-single" x="81.02" y="16.62" dx="0" dy="-0.5">3</text></g>
<g id="炭-bg4"  class="badge-group"><circle cx="25.72" cy="43.65" r="3.5" fill="#09bf09"/><text class="num-single" x="25.72" y="43.65" dx="0" dy="-0.5">4</text></g>
<g id="炭-bg5"  class="badge-group"><circle cx="27.43" cy="51.66" r="3.5" fill="#09bf82"/><text class="num-single" x="27.43" y="51.66" dx="0" dy="-0.5">5</text></g>
<g id="炭-bg6"  class="badge-group"><circle cx="37.54" cy="62.62" r="3.5" fill="#0982bf"/><text class="num-single" x="37.54" y="62.62" dx="0" dy="-0.5">6</text></g>
<g id="炭-bg7"  class="badge-group"><circle cx="80.4" cy="56.21" r="3.5" fill="#0909bf"/><text class="num-single" x="80.4" y="56.21" dx="0" dy="-0.5">7</text></g>
<g id="炭-bg8"  class="badge-group"><circle cx="56.94" cy="51.76" r="3.5" fill="#8209bf"/><text class="num-single" x="56.94" y="51.76" dx="0" dy="-0.5">8</text></g>
<g id="炭-bg9"  class="badge-group"><circle cx="57.51" cy="67.62" r="3.5" fill="#bf0982"/><text class="num-single" x="57.51" y="67.62" dx="0" dy="-0.5">9</text></g>
</svg>