<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (伸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #伸-bg[i]: Thời gian quả bóng số nảy lên
   - #伸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#伸-bg1  { animation-delay: 0.05s; }
#伸-s1   { stroke-dasharray: 47.9807; stroke-dashoffset: 47.9807; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#伸-bg2  { animation-delay: 0.46s; }
#伸-s2   { stroke-dasharray: 57.9024; stroke-dashoffset: 57.9024; animation: drawStroke 0.32s ease-out 0.59s forwards; }
#伸-bg3  { animation-delay: 0.93s; }
#伸-s3   { stroke-dasharray: 38.8364; stroke-dashoffset: 38.8364; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#伸-bg4  { animation-delay: 1.30s; }
#伸-s4   { stroke-dasharray: 83.4907; stroke-dashoffset: 83.4907; animation: drawStroke 0.46s ease-out 1.43s forwards; }
#伸-bg5  { animation-delay: 1.91s; }
#伸-s5   { stroke-dasharray: 42.9441; stroke-dashoffset: 42.9441; animation: drawStroke 0.24s ease-out 2.04s forwards; }
#伸-bg6  { animation-delay: 2.30s; }
#伸-s6   { stroke-dasharray: 38.9260; stroke-dashoffset: 38.9260; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#伸-bg7  { animation-delay: 2.67s; }
#伸-s7   { stroke-dasharray: 85.2214; stroke-dashoffset: 85.2214; animation: drawStroke 0.47s ease-out 2.80s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #伸-s[i]) -->
<path id="伸-s1"  class="stroke" stroke="#bf0909" d="M34.24,15.89C34.370000000000005,17.03,34.480000000000004,18.45,34.120000000000005,19.85C31.860000000000007,28.68,22.850000000000005,45.75,12.310000000000006,57.72"/>
<path id="伸-s2"  class="stroke" stroke="#bfa509" d="M28.24,39.25C29.31,40.32,29.33,41.7,29.33,43.1C29.33,55.83,29.27,76.81,29.259999999999998,91C29.259999999999998,93.14,29.259999999999998,95.12,29.259999999999998,96.88"/>
<path id="伸-s3"  class="stroke" stroke="#3dbf09" d="M42.27,33.43C43.36000000000001,34.52,43.75,35.36,43.93,37.019999999999996C45,47.379999999999995,45.56,55.17999999999999,46.42,65.24C46.620000000000005,67.53,46.79,69.69999999999999,46.940000000000005,71.66999999999999"/>
<path id="伸-s4"  class="stroke" stroke="#09bf71" d="M44.62,35.13C59.129999999999995,32.75,77.81,30.6,86.75999999999999,29.990000000000002C90.24,29.750000000000004,91.74999999999999,31.590000000000003,91.36999999999999,34.800000000000004C90.67999999999999,40.53,89.53999999999999,52.34,88.13,61.32000000000001C87.77,63.60000000000001,87.42999999999999,65.73,87.11999999999999,67.58000000000001"/>
<path id="伸-s5"  class="stroke" stroke="#0971bf" d="M46.39,50.68C56.5,49.25,74.75,47.13,89.11,46.42"/>
<path id="伸-s6"  class="stroke" stroke="#3d09bf" d="M47.56,67.25C60.370000000000005,65.87,70.75,64.62,86.33000000000001,63.85"/>
<path id="伸-s7"  class="stroke" stroke="#bf09a5" d="M65.52,13.25C66.64,14.370000000000001,66.86999999999999,15.629999999999999,66.86999999999999,17.83C66.86999999999999,26.849999999999998,66.78999999999999,70.72999999999999,66.75999999999999,89.63C66.74999999999999,94.14,66.74999999999999,97.24,66.74999999999999,98.13"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="伸-bg1"  class="badge-group"><circle cx="34.24" cy="15.89" r="3.5" fill="#bf0909"/><text class="num-single" x="34.24" y="15.89" dx="0" dy="-0.5">1</text></g>
<g id="伸-bg2"  class="badge-group"><circle cx="28.24" cy="39.25" r="3.5" fill="#bfa509"/><text class="num-single" x="28.24" y="39.25" dx="0" dy="-0.5">2</text></g>
<g id="伸-bg3"  class="badge-group"><circle cx="42.27" cy="29.93" r="3.5" fill="#3dbf09"/><text class="num-single" x="42.27" y="29.93" dx="0" dy="-0.5">3</text></g>
<g id="伸-bg4"  class="badge-group"><circle cx="44.62" cy="38.63" r="3.5" fill="#09bf71"/><text class="num-single" x="44.62" y="38.63" dx="0" dy="-0.5">4</text></g>
<g id="伸-bg5"  class="badge-group"><circle cx="46.39" cy="50.68" r="3.5" fill="#0971bf"/><text class="num-single" x="46.39" y="50.68" dx="0" dy="-0.5">5</text></g>
<g id="伸-bg6"  class="badge-group"><circle cx="47.56" cy="67.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="47.56" y="67.25" dx="0" dy="-0.5">6</text></g>
<g id="伸-bg7"  class="badge-group"><circle cx="65.52" cy="13.25" r="3.5" fill="#bf09a5"/><text class="num-single" x="65.52" y="13.25" dx="0" dy="-0.5">7</text></g>
</svg>