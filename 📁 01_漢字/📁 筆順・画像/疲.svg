<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (疲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #疲-bg[i]: Thời gian quả bóng số nảy lên
   - #疲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#疲-bg1  { animation-delay: 0.05s; }
#疲-s1   { stroke-dasharray: 13.4374; stroke-dashoffset: 13.4374; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#疲-bg2  { animation-delay: 0.42s; }
#疲-s2   { stroke-dasharray: 64.7891; stroke-dashoffset: 64.7891; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#疲-bg3  { animation-delay: 0.93s; }
#疲-s3   { stroke-dasharray: 66.9174; stroke-dashoffset: 66.9174; animation: drawStroke 0.37s ease-out 1.06s forwards; }
#疲-bg4  { animation-delay: 1.45s; }
#疲-s4   { stroke-dasharray: 13.7769; stroke-dashoffset: 13.7769; animation: drawStroke 0.22s ease-out 1.58s forwards; }
#疲-bg5  { animation-delay: 1.82s; }
#疲-s5   { stroke-dasharray: 18.5452; stroke-dashoffset: 18.5452; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#疲-bg6  { animation-delay: 2.19s; }
#疲-s6   { stroke-dasharray: 51.7592; stroke-dashoffset: 51.7592; animation: drawStroke 0.28s ease-out 2.32s forwards; }
#疲-bg7  { animation-delay: 2.62s; }
#疲-s7   { stroke-dasharray: 47.4288; stroke-dashoffset: 47.4288; animation: drawStroke 0.26s ease-out 2.75s forwards; }
#疲-bg8  { animation-delay: 3.03s; }
#疲-s8   { stroke-dasharray: 27.2867; stroke-dashoffset: 27.2867; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#疲-bg9  { animation-delay: 3.40s; }
#疲-s9   { stroke-dasharray: 81.7955; stroke-dashoffset: 81.7955; animation: drawStroke 0.45s ease-out 3.53s forwards; }
#疲-bg10  { animation-delay: 4.00s; }
#疲-s10   { stroke-dasharray: 47.4819; stroke-dashoffset: 47.4819; animation: drawStroke 0.26s ease-out 4.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #疲-s[i]) -->
<path id="疲-s1"  class="stroke" stroke="#bf0909" d="M57.06,14.63C58.150000000000006,15.72,58.32,17,58.32,18.28C58.32,19.07,58.4,22.93,58.25,27.740000000000002"/>
<path id="疲-s2"  class="stroke" stroke="#bf7609" d="M27.13,29.98C30,31,33.43,30.6,36.379999999999995,30.3C51.49999999999999,28.76,69.56,27.150000000000002,82.62,26.26C85.7,26.05,88.59,25.92,91.62,26.57"/>
<path id="疲-s3"  class="stroke" stroke="#9abf09" d="M29.75,31.38C30.75,32.379999999999995,30.99,33.5,30.99,34.75C30.99,65.44,28.75,80.25,13.809999999999999,93.22"/>
<path id="疲-s4"  class="stroke" stroke="#2dbf09" d="M13.5,37.75C16.32,39.69,20.79,45.730000000000004,21.5,48.75"/>
<path id="疲-s5"  class="stroke" stroke="#09bf52" d="M10.42,67.32C11.62,67.86999999999999,12.49,67.8,13.83,67.00999999999999C19.75,63.49999999999999,22.130000000000003,62.11999999999999,26.75,59.49999999999999"/>
<path id="疲-s6"  class="stroke" stroke="#09bfbf" d="M44.8,45C45.65,45.85,45.739999999999995,47.12,45.64,49C44.62,69.12,42,83,30.62,92.59"/>
<path id="疲-s7"  class="stroke" stroke="#0952bf" d="M46.74,47.3C60.25,44.62,72,43.12,80.37,42.669999999999995C88.66,42.21999999999999,83.75,47.24999999999999,80.25,50.78999999999999"/>
<path id="疲-s8"  class="stroke" stroke="#2d09bf" d="M62.93,34C63.839999999999996,34.91,64.08,36,64.08,37.32C64.08,38.13,64.02,52.89,64.02,60.99"/>
<path id="疲-s9"  class="stroke" stroke="#9a09bf" d="M50.44,64.11C51.72,64.39,52.96,64.44,55.519999999999996,64.01C58.08,63.580000000000005,74.31,59.92,76.07,59.50000000000001C78.19,58.99000000000001,79.64999999999999,60.61000000000001,78.47,62.620000000000005C70.24,76.63000000000001,56.87,88.88000000000001,41.519999999999996,95.6"/>
<path id="疲-s10"  class="stroke" stroke="#bf0976" d="M52.08,69.99C55.76,71.02,70.16,84.06,82.67,91.38C85.52,93.05,88.57000000000001,94.8,91.78,95.67999999999999"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="疲-bg1"  class="badge-group"><circle cx="57.06" cy="14.63" r="3.5" fill="#bf0909"/><text class="num-single" x="57.06" y="14.63" dx="0" dy="-0.5">1</text></g>
<g id="疲-bg2"  class="badge-group"><circle cx="27.13" cy="26.48" r="3.5" fill="#bf7609"/><text class="num-single" x="27.13" y="26.48" dx="0" dy="-0.5">2</text></g>
<g id="疲-bg3"  class="badge-group"><circle cx="29.75" cy="34.88" r="3.5" fill="#9abf09"/><text class="num-single" x="29.75" y="34.88" dx="0" dy="-0.5">3</text></g>
<g id="疲-bg4"  class="badge-group"><circle cx="13.5" cy="37.75" r="3.5" fill="#2dbf09"/><text class="num-single" x="13.5" y="37.75" dx="0" dy="-0.5">4</text></g>
<g id="疲-bg5"  class="badge-group"><circle cx="10.42" cy="67.32" r="3.5" fill="#09bf52"/><text class="num-single" x="10.42" y="67.32" dx="0" dy="-0.5">5</text></g>
<g id="疲-bg6"  class="badge-group"><circle cx="44.8" cy="41.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.8" y="41.5" dx="0" dy="-0.5">6</text></g>
<g id="疲-bg7"  class="badge-group"><circle cx="46.74" cy="50.8" r="3.5" fill="#0952bf"/><text class="num-single" x="46.74" y="50.8" dx="0" dy="-0.5">7</text></g>
<g id="疲-bg8"  class="badge-group"><circle cx="62.93" cy="34" r="3.5" fill="#2d09bf"/><text class="num-single" x="62.93" y="34" dx="0" dy="-0.5">8</text></g>
<g id="疲-bg9"  class="badge-group"><circle cx="50.44" cy="60.61" r="3.5" fill="#9a09bf"/><text class="num-single" x="50.44" y="60.61" dx="0" dy="-0.5">9</text></g>
<g id="疲-bg10" class="badge-group"><circle cx="52.08" cy="73.49" r="3.5" fill="#bf0976"/><text class="num-double" x="52.08" y="73.49" dx="-0.4" dy="-0.475">10</text></g>
</svg>