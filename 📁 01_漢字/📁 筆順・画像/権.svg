<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (権)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #権-bg[i]: Thời gian quả bóng số nảy lên
   - #権-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#権-bg1  { animation-delay: 0.05s; }
#権-s1   { stroke-dasharray: 29.0094; stroke-dashoffset: 29.0094; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#権-bg2  { animation-delay: 0.42s; }
#権-s2   { stroke-dasharray: 84.1146; stroke-dashoffset: 84.1146; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#権-bg3  { animation-delay: 1.03s; }
#権-s3   { stroke-dasharray: 39.3387; stroke-dashoffset: 39.3387; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#権-bg4  { animation-delay: 1.40s; }
#権-s4   { stroke-dasharray: 15.0293; stroke-dashoffset: 15.0293; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#権-bg5  { animation-delay: 1.77s; }
#権-s5   { stroke-dasharray: 26.1714; stroke-dashoffset: 26.1714; animation: drawStroke 0.22s ease-out 1.90s forwards; }
#権-bg6  { animation-delay: 2.14s; }
#権-s6   { stroke-dasharray: 34.5052; stroke-dashoffset: 34.5052; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#権-bg7  { animation-delay: 2.51s; }
#権-s7   { stroke-dasharray: 55.6180; stroke-dashoffset: 55.6180; animation: drawStroke 0.31s ease-out 2.64s forwards; }
#権-bg8  { animation-delay: 2.97s; }
#権-s8   { stroke-dasharray: 50.0564; stroke-dashoffset: 50.0564; animation: drawStroke 0.28s ease-out 3.10s forwards; }
#権-bg9  { animation-delay: 3.40s; }
#権-s9   { stroke-dasharray: 45.3398; stroke-dashoffset: 45.3398; animation: drawStroke 0.25s ease-out 3.53s forwards; }
#権-bg10  { animation-delay: 3.80s; }
#権-s10   { stroke-dasharray: 11.3314; stroke-dashoffset: 11.3314; animation: drawStroke 0.22s ease-out 3.93s forwards; }
#権-bg11  { animation-delay: 4.17s; }
#権-s11   { stroke-dasharray: 34.6536; stroke-dashoffset: 34.6536; animation: drawStroke 0.22s ease-out 4.30s forwards; }
#権-bg12  { animation-delay: 4.54s; }
#権-s12   { stroke-dasharray: 37.1092; stroke-dashoffset: 37.1092; animation: drawStroke 0.22s ease-out 4.67s forwards; }
#権-bg13  { animation-delay: 4.91s; }
#権-s13   { stroke-dasharray: 36.4614; stroke-dashoffset: 36.4614; animation: drawStroke 0.22s ease-out 5.04s forwards; }
#権-bg14  { animation-delay: 5.28s; }
#権-s14   { stroke-dasharray: 38.3215; stroke-dashoffset: 38.3215; animation: drawStroke 0.22s ease-out 5.41s forwards; }
#権-bg15  { animation-delay: 5.65s; }
#権-s15   { stroke-dasharray: 40.8922; stroke-dashoffset: 40.8922; animation: drawStroke 0.22s ease-out 5.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

