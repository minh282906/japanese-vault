<path id="権-s9"  class="stroke" stroke="#099abf" d="M55.15,53.13C55.82,53.800000000000004,56.03,54.63,56.03,56C56.03,62.41,56.01,80.25,56.01,90.75C56.01,94.06,56,96.8,56,98.25"/>
<path id="権-s10"  class="stroke" stroke="#0952bf" d="M77.7,41.18C77.75,41.69,77.68,42.36,77.52,42.8C76.45,45.589999999999996,75.08999999999999,47.739999999999995,72.63,51.129999999999995"/>
