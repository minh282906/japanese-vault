<path id="野-s7"  class="stroke" stroke="#098dbf" d="M12.25,82.31C13.629999999999999,83.5,15.64,83.92,18.34,83C23.87,81.13,39.59,75.94,48.5,73"/>
<path id="野-s8"  class="stroke" stroke="#092abf" d="M57.51,16.84C59.62,17.5,61.739999999999995,17.35,63.76,17.03C71.12,15.870000000000001,83.36,13.72,85.7,13.250000000000002C88.3,12.730000000000002,89.44,14.96,87.89,16.67C85.23,19.610000000000003,75.1,30.96,73.46000000000001,33.06"/>
<path id="野-s9"  class="stroke" stroke="#4b09bf" d="M63.88,28.5C66.74000000000001,29.71,74.16,34.35,75.5,37.5"/>
<path id="野-s10"  class="stroke" stroke="#ae09bf" d="M54.42,43.13C56.13,43.75,57.74,43.720000000000006,60,43.25C64.83,42.26,84.38,38.63,88.75,37.75C99.69,35.56,92.25,43,88,48.25"/>
<path id="野-s11"  class="stroke" stroke="#bf096c" d="M73.51,48C74.63000000000001,49.12,75.08,50.38,75.08,52.41C75.08,54.449999999999996,74.77,87.50999999999999,74.77,91.25C74.77,102,67.69,92.43,65.27,90.73"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="野-bg1"  class="badge-group"><circle cx="12.5" cy="15.04" r="3.5" fill="#bf0909"/><text class="num-single" x="12.5" y="15.04" dx="0" dy="-0.5">1</text></g>
<g id="野-bg2"  class="badge-group"><circle cx="15.03" cy="23.67" r="3.5" fill="#bf6c09"/><text class="num-single" x="15.03" y="23.67" dx="0" dy="-0.5">2</text></g>
