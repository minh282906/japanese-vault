<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (野)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #野-bg[i]: Thời gian quả bóng số nảy lên
   - #野-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#野-bg1  { animation-delay: 0.05s; }
#野-s1   { stroke-dasharray: 32.5984; stroke-dashoffset: 32.5984; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#野-bg2  { animation-delay: 0.42s; }
#野-s2   { stroke-dasharray: 66.1658; stroke-dashoffset: 66.1658; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#野-bg3  { animation-delay: 0.93s; }
#野-s3   { stroke-dasharray: 31.7819; stroke-dashoffset: 31.7819; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#野-bg4  { animation-delay: 1.30s; }
#野-s4   { stroke-dasharray: 27.9864; stroke-dashoffset: 27.9864; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#野-bg5  { animation-delay: 1.67s; }
#野-s5   { stroke-dasharray: 58.3878; stroke-dashoffset: 58.3878; animation: drawStroke 0.32s ease-out 1.80s forwards; }
#野-bg6  { animation-delay: 2.14s; }
#野-s6   { stroke-dasharray: 33.9495; stroke-dashoffset: 33.9495; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#野-bg7  { animation-delay: 2.51s; }
#野-s7   { stroke-dasharray: 38.2064; stroke-dashoffset: 38.2064; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#野-bg8  { animation-delay: 2.88s; }
#野-s8   { stroke-dasharray: 56.1684; stroke-dashoffset: 56.1684; animation: drawStroke 0.31s ease-out 3.01s forwards; }
#野-bg9  { animation-delay: 3.34s; }
#野-s9   { stroke-dasharray: 14.8965; stroke-dashoffset: 14.8965; animation: drawStroke 0.22s ease-out 3.47s forwards; }
#野-bg10  { animation-delay: 3.71s; }
#野-s10   { stroke-dasharray: 52.9693; stroke-dashoffset: 52.9693; animation: drawStroke 0.29s ease-out 3.84s forwards; }
#野-bg11  { animation-delay: 4.15s; }
#野-s11   { stroke-dasharray: 59.0402; stroke-dashoffset: 59.0402; animation: drawStroke 0.32s ease-out 4.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #野-s[i]) -->
<path id="野-s1"  class="stroke" stroke="#bf0909" d="M12.5,18.54C13.75,19.5,13.95,20.75,14.120000000000001,21.72C15.100000000000001,27.38,16.78,38.5,17.52,47.480000000000004C17.599999999999998,48.480000000000004,17.669999999999998,49.46,17.73,50.410000000000004"/>
