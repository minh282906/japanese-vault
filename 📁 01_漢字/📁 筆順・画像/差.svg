<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (差)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #差-bg[i]: Thời gian quả bóng số nảy lên
   - #差-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#差-bg1  { animation-delay: 0.05s; }
#差-s1   { stroke-dasharray: 14.7847; stroke-dashoffset: 14.7847; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#差-bg2  { animation-delay: 0.42s; }
#差-s2   { stroke-dasharray: 18.3443; stroke-dashoffset: 18.3443; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#差-bg3  { animation-delay: 0.79s; }
#差-s3   { stroke-dasharray: 46.8460; stroke-dashoffset: 46.8460; animation: drawStroke 0.26s ease-out 0.92s forwards; }
#差-bg4  { animation-delay: 1.20s; }
#差-s4   { stroke-dasharray: 21.9735; stroke-dashoffset: 21.9735; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#差-bg5  { animation-delay: 1.57s; }
#差-s5   { stroke-dasharray: 41.4528; stroke-dashoffset: 41.4528; animation: drawStroke 0.23s ease-out 1.70s forwards; }
#差-bg6  { animation-delay: 1.95s; }
#差-s6   { stroke-dasharray: 71.2287; stroke-dashoffset: 71.2287; animation: drawStroke 0.39s ease-out 2.08s forwards; }
#差-bg7  { animation-delay: 2.49s; }
#差-s7   { stroke-dasharray: 44.1970; stroke-dashoffset: 44.1970; animation: drawStroke 0.24s ease-out 2.62s forwards; }
#差-bg8  { animation-delay: 2.88s; }
#差-s8   { stroke-dasharray: 34.3744; stroke-dashoffset: 34.3744; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#差-bg9  { animation-delay: 3.25s; }
#差-s9   { stroke-dasharray: 20.6176; stroke-dashoffset: 20.6176; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#差-bg10  { animation-delay: 3.62s; }
#差-s10   { stroke-dasharray: 57.9898; stroke-dashoffset: 57.9898; animation: drawStroke 0.32s ease-out 3.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #差-s[i]) -->
<path id="差-s1"  class="stroke" stroke="#bf0909" d="M36.2,14.58C39.53,16.54,44.800000000000004,22.65,45.63,25.7"/>
<path id="差-s2"  class="stroke" stroke="#bf7609" d="M69.81,11.77C69.84,12.2,69.87,12.879999999999999,69.75,13.51C69.12,16.62,65.96,22.869999999999997,61.44,27.7"/>
<path id="差-s3"  class="stroke" stroke="#9abf09" d="M30.88,33.18C33.25,33.5,35.89,33.41,37.87,33.22C46.129999999999995,32.46,61.37,30.5,71.13,29.91C73.22,29.78,75.44,29.89,77.5,30.41"/>
<path id="差-s4"  class="stroke" stroke="#2dbf09" d="M53.82,33.18C54.76,34.12,55.26,35.41,55.26,36.33C55.26,40.01,55.29,48.76,55.29,54.76"/>
<path id="差-s5"  class="stroke" stroke="#09bf52" d="M32.84,45.22C35,45.75,37.43000000000001,45.56,39.38,45.28C48.13,44.01,60.38,42.6,68.13,41.75C70.08,41.53,72.08,41.45,74,41.94"/>
<path id="差-s6"  class="stroke" stroke="#09bfbf" d="M19.48,57.37C23.13,58.12,26.04,58.12,29.02,57.79C41.76,56.37,67.51,54.5,81.38,53.86C84.42999999999999,53.72,87.46,53.75,90.46,54.41"/>
<path id="差-s7"  class="stroke" stroke="#0952bf" d="M40.46,60.02C40.63,61,40.57,62.24,40.04,63.31C36.53,70.44,29,83,13.62,93.88"/>
<path id="差-s8"  class="stroke" stroke="#2d09bf" d="M44.28,71.59C46.5,72.13000000000001,48.59,71.94,50.49,71.68C55.74,70.98,67.09,69.49000000000001,73.24000000000001,68.96000000000001C74.99000000000001,68.81,76.7,68.67,78.41000000000001,69.2"/>
<path id="差-s9"  class="stroke" stroke="#9a09bf" d="M59.53,73.04C60.43,73.94000000000001,60.86,75.25,60.86,76.66000000000001C60.86,82.77000000000001,60.9,86.62,60.9,93.32000000000001"/>
<path id="差-s10"  class="stroke" stroke="#bf0976" d="M33,95.32C35.88,96.36999999999999,38.45,96.42999999999999,41.81,96.05C54.27,94.64999999999999,70.13,93.64,81.94,93.19C84.82,93.08,87.89999999999999,93.13,90.63,94.24"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="差-bg1"  class="badge-group"><circle cx="36.2" cy="14.58" r="3.5" fill="#bf0909"/><text class="num-single" x="36.2" y="14.58" dx="0" dy="-0.5">1</text></g>
<g id="差-bg2"  class="badge-group"><circle cx="69.81" cy="11.77" r="3.5" fill="#bf7609"/><text class="num-single" x="69.81" y="11.77" dx="0" dy="-0.5">2</text></g>
<g id="差-bg3"  class="badge-group"><circle cx="30.88" cy="33.18" r="3.5" fill="#9abf09"/><text class="num-single" x="30.88" y="33.18" dx="0" dy="-0.5">3</text></g>
<g id="差-bg4"  class="badge-group"><circle cx="53.82" cy="33.18" r="3.5" fill="#2dbf09"/><text class="num-single" x="53.82" y="33.18" dx="0" dy="-0.5">4</text></g>
<g id="差-bg5"  class="badge-group"><circle cx="32.84" cy="45.22" r="3.5" fill="#09bf52"/><text class="num-single" x="32.84" y="45.22" dx="0" dy="-0.5">5</text></g>
<g id="差-bg6"  class="badge-group"><circle cx="19.48" cy="57.37" r="3.5" fill="#09bfbf"/><text class="num-single" x="19.48" y="57.37" dx="0" dy="-0.5">6</text></g>
<g id="差-bg7"  class="badge-group"><circle cx="40.46" cy="60.02" r="3.5" fill="#0952bf"/><text class="num-single" x="40.46" y="60.02" dx="0" dy="-0.5">7</text></g>
<g id="差-bg8"  class="badge-group"><circle cx="44.28" cy="71.59" r="3.5" fill="#2d09bf"/><text class="num-single" x="44.28" y="71.59" dx="0" dy="-0.5">8</text></g>
<g id="差-bg9"  class="badge-group"><circle cx="59.53" cy="73.04" r="3.5" fill="#9a09bf"/><text class="num-single" x="59.53" y="73.04" dx="0" dy="-0.5">9</text></g>
<g id="差-bg10" class="badge-group"><circle cx="33" cy="95.32" r="3.5" fill="#bf0976"/><text class="num-double" x="33" y="95.32" dx="-0.4" dy="-0.475">10</text></g>
</svg>