<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (期)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #期-bg[i]: Thời gian quả bóng số nảy lên
   - #期-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#期-bg1  { animation-delay: 0.05s; }
#期-s1   { stroke-dasharray: 41.2776; stroke-dashoffset: 41.2776; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#期-bg2  { animation-delay: 0.43s; }
#期-s2   { stroke-dasharray: 52.6390; stroke-dashoffset: 52.6390; animation: drawStroke 0.29s ease-out 0.56s forwards; }
#期-bg3  { animation-delay: 0.87s; }
#期-s3   { stroke-dasharray: 55.5587; stroke-dashoffset: 55.5587; animation: drawStroke 0.31s ease-out 1.00s forwards; }
#期-bg4  { animation-delay: 1.33s; }
#期-s4   { stroke-dasharray: 15.9781; stroke-dashoffset: 15.9781; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#期-bg5  { animation-delay: 1.70s; }
#期-s5   { stroke-dasharray: 15.8913; stroke-dashoffset: 15.8913; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#期-bg6  { animation-delay: 2.07s; }
#期-s6   { stroke-dasharray: 48.6526; stroke-dashoffset: 48.6526; animation: drawStroke 0.27s ease-out 2.20s forwards; }
#期-bg7  { animation-delay: 2.49s; }
#期-s7   { stroke-dasharray: 21.5124; stroke-dashoffset: 21.5124; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#期-bg8  { animation-delay: 2.86s; }
#期-s8   { stroke-dasharray: 15.9513; stroke-dashoffset: 15.9513; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#期-bg9  { animation-delay: 3.23s; }
#期-s9   { stroke-dasharray: 72.5174; stroke-dashoffset: 72.5174; animation: drawStroke 0.40s ease-out 3.36s forwards; }
#期-bg10  { animation-delay: 3.78s; }
#期-s10   { stroke-dasharray: 104.3270; stroke-dashoffset: 104.3270; animation: drawStroke 0.55s ease-out 3.91s forwards; }
#期-bg11  { animation-delay: 4.48s; }
#期-s11   { stroke-dasharray: 21.9028; stroke-dashoffset: 21.9028; animation: drawStroke 0.22s ease-out 4.61s forwards; }
#期-bg12  { animation-delay: 4.85s; }
#期-s12   { stroke-dasharray: 22.5331; stroke-dashoffset: 22.5331; animation: drawStroke 0.22s ease-out 4.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

