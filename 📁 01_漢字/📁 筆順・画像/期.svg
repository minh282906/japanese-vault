<path id="期-s10"  class="stroke" stroke="#6409bf" d="M69.72,23.46C71.57,23.23,87.3,20.66,88.7,20.490000000000002C91.75,20.12,93.04,21.62,93.04,24.46C93.04,25.85,92.83000000000001,71.02000000000001,92.83000000000001,90.06C92.83000000000001,97.99000000000001,87.63000000000001,92.74000000000001,84.83000000000001,90.18"/>
<path id="期-s11"  class="stroke" stroke="#bf09bf" d="M69.97,42.31C76.75,41.370000000000005,84.5,40.25,91.7,39.580000000000005"/>
<path id="期-s12"  class="stroke" stroke="#bf0964" d="M69.18,60.64C74.5,60.13,85.37,59.13,91.64000000000001,58.85"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="期-bg1"  class="badge-group"><circle cx="15.96" cy="32.56" r="3.5" fill="#bf0909"/><text class="num-single" x="15.96" y="32.56" dx="0" dy="-0.5">1</text></g>
