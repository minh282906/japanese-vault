<path id="期-s7"  class="stroke" stroke="#09bfbf" d="M29.02,78.48C29.16,79.65,28.91,80.68,28.27,81.55C25.91,85.14,21.53,90.17999999999999,15.709999999999999,94.72"/>
<path id="期-s8"  class="stroke" stroke="#0964bf" d="M43.54,77.29C47.05,79.44000000000001,52.61,86.14,53.489999999999995,89.48"/>
