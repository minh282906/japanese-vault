<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (濯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #濯-bg[i]: Thời gian quả bóng số nảy lên
   - #濯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#濯-bg1  { animation-delay: 0.05s; }
#濯-s1   { stroke-dasharray: 13.2298; stroke-dashoffset: 13.2298; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#濯-bg2  { animation-delay: 0.42s; }
#濯-s2   { stroke-dasharray: 12.7128; stroke-dashoffset: 12.7128; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#濯-bg3  { animation-delay: 0.79s; }
#濯-s3   { stroke-dasharray: 22.4486; stroke-dashoffset: 22.4486; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#濯-bg4  { animation-delay: 1.16s; }
#濯-s4   { stroke-dasharray: 47.7923; stroke-dashoffset: 47.7923; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#濯-bg5  { animation-delay: 1.57s; }
#濯-s5   { stroke-dasharray: 22.2172; stroke-dashoffset: 22.2172; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#濯-bg6  { animation-delay: 1.94s; }
#濯-s6   { stroke-dasharray: 21.5327; stroke-dashoffset: 21.5327; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#濯-bg7  { animation-delay: 2.31s; }
#濯-s7   { stroke-dasharray: 47.2569; stroke-dashoffset: 47.2569; animation: drawStroke 0.26s ease-out 2.44s forwards; }
#濯-bg8  { animation-delay: 2.72s; }
#濯-s8   { stroke-dasharray: 20.4846; stroke-dashoffset: 20.4846; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#濯-bg9  { animation-delay: 3.09s; }
#濯-s9   { stroke-dasharray: 21.3342; stroke-dashoffset: 21.3342; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#濯-bg10  { animation-delay: 3.46s; }
#濯-s10   { stroke-dasharray: 31.1045; stroke-dashoffset: 31.1045; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#濯-bg11  { animation-delay: 3.83s; }
#濯-s11   { stroke-dasharray: 43.8732; stroke-dashoffset: 43.8732; animation: drawStroke 0.24s ease-out 3.96s forwards; }
#濯-bg12  { animation-delay: 4.22s; }
#濯-s12   { stroke-dasharray: 11.8289; stroke-dashoffset: 11.8289; animation: drawStroke 0.22s ease-out 4.35s forwards; }
#濯-bg13  { animation-delay: 4.59s; }
#濯-s13   { stroke-dasharray: 44.9108; stroke-dashoffset: 44.9108; animation: drawStroke 0.25s ease-out 4.72s forwards; }
#濯-bg14  { animation-delay: 4.99s; }
#濯-s14   { stroke-dasharray: 33.9235; stroke-dashoffset: 33.9235; animation: drawStroke 0.22s ease-out 5.12s forwards; }
#濯-bg15  { animation-delay: 5.36s; }
#濯-s15   { stroke-dasharray: 40.3530; stroke-dashoffset: 40.3530; animation: drawStroke 0.22s ease-out 5.49s forwards; }
#濯-bg16  { animation-delay: 5.73s; }
#濯-s16   { stroke-dasharray: 41.5275; stroke-dashoffset: 41.5275; animation: drawStroke 0.23s ease-out 5.86s forwards; }
#濯-bg17  { animation-delay: 6.11s; }
#濯-s17   { stroke-dasharray: 49.7930; stroke-dashoffset: 49.7930; animation: drawStroke 0.27s ease-out 6.24s forwards; }
]]>
</style>

