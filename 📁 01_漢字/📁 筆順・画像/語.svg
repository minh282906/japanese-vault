<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (語)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #語-bg[i]: Thời gian quả bóng số nảy lên
   - #語-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#語-bg1  { animation-delay: 0.05s; }
#語-s1   { stroke-dasharray: 11.4778; stroke-dashoffset: 11.4778; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#語-bg2  { animation-delay: 0.42s; }
#語-s2   { stroke-dasharray: 35.7289; stroke-dashoffset: 35.7289; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#語-bg3  { animation-delay: 0.79s; }
#語-s3   { stroke-dasharray: 21.6795; stroke-dashoffset: 21.6795; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#語-bg4  { animation-delay: 1.16s; }
#語-s4   { stroke-dasharray: 21.0296; stroke-dashoffset: 21.0296; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#語-bg5  { animation-delay: 1.53s; }
#語-s5   { stroke-dasharray: 21.6052; stroke-dashoffset: 21.6052; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#語-bg6  { animation-delay: 1.90s; }
#語-s6   { stroke-dasharray: 38.4463; stroke-dashoffset: 38.4463; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#語-bg7  { animation-delay: 2.27s; }
#語-s7   { stroke-dasharray: 19.7775; stroke-dashoffset: 19.7775; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#語-bg8  { animation-delay: 2.64s; }
#語-s8   { stroke-dasharray: 33.1633; stroke-dashoffset: 33.1633; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#語-bg9  { animation-delay: 3.01s; }
#語-s9   { stroke-dasharray: 36.3665; stroke-dashoffset: 36.3665; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#語-bg10  { animation-delay: 3.38s; }
#語-s10   { stroke-dasharray: 52.8717; stroke-dashoffset: 52.8717; animation: drawStroke 0.29s ease-out 3.51s forwards; }
#語-bg11  { animation-delay: 3.82s; }
#語-s11   { stroke-dasharray: 50.8601; stroke-dashoffset: 50.8601; animation: drawStroke 0.28s ease-out 3.95s forwards; }
#語-bg12  { animation-delay: 4.25s; }
#語-s12   { stroke-dasharray: 26.8957; stroke-dashoffset: 26.8957; animation: drawStroke 0.22s ease-out 4.38s forwards; }
#語-bg13  { animation-delay: 4.62s; }
#語-s13   { stroke-dasharray: 52.2204; stroke-dashoffset: 52.2204; animation: drawStroke 0.29s ease-out 4.75s forwards; }
#語-bg14  { animation-delay: 5.06s; }
#語-s14   { stroke-dasharray: 27.5818; stroke-dashoffset: 27.5818; animation: drawStroke 0.22s ease-out 5.19s forwards; }
]]>
</style>

