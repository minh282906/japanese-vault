<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (苦)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #苦-bg[i]: Thời gian quả bóng số nảy lên
   - #苦-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#苦-bg1  { animation-delay: 0.05s; }
#苦-s1   { stroke-dasharray: 72.9857; stroke-dashoffset: 72.9857; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#苦-bg2  { animation-delay: 0.60s; }
#苦-s2   { stroke-dasharray: 24.2685; stroke-dashoffset: 24.2685; animation: drawStroke 0.22s ease-out 0.73s forwards; }
#苦-bg3  { animation-delay: 0.97s; }
#苦-s3   { stroke-dasharray: 24.0781; stroke-dashoffset: 24.0781; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#苦-bg4  { animation-delay: 1.34s; }
#苦-s4   { stroke-dasharray: 79.1515; stroke-dashoffset: 79.1515; animation: drawStroke 0.44s ease-out 1.47s forwards; }
#苦-bg5  { animation-delay: 1.93s; }
#苦-s5   { stroke-dasharray: 33.1552; stroke-dashoffset: 33.1552; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#苦-bg6  { animation-delay: 2.30s; }
#苦-s6   { stroke-dasharray: 26.1391; stroke-dashoffset: 26.1391; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#苦-bg7  { animation-delay: 2.67s; }
#苦-s7   { stroke-dasharray: 63.1851; stroke-dashoffset: 63.1851; animation: drawStroke 0.35s ease-out 2.80s forwards; }
#苦-bg8  { animation-delay: 3.17s; }
#苦-s8   { stroke-dasharray: 34.2592; stroke-dashoffset: 34.2592; animation: drawStroke 0.22s ease-out 3.30s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #苦-s[i]) -->
<path id="苦-s1"  class="stroke" stroke="#bf0909" d="M19.5,29.65C22.81,30.33,26.11,30.45,29.43,30.08C46.57,28.169999999999998,63.03,27.009999999999998,82.14,26.06C85.52,25.919999999999998,88.89,26.11,92.24,26.639999999999997"/>
<path id="苦-s2"  class="stroke" stroke="#bf9109" d="M37.25,15.25C38.31,16.31,38.63,17.5,38.75,18.75C39.53,26.53,40.09,31.42,41,39"/>
<path id="苦-s3"  class="stroke" stroke="#64bf09" d="M71.5,13.75C71.92,14.93,72.1,16.27,71.75,17.75C70.25,24,69.25,28.75,67.25,37.25"/>
<path id="苦-s4"  class="stroke" stroke="#09bf36" d="M15.62,56.19C19.08,56.79,22.54,56.91,25.979999999999997,56.46C42.98,54.24,63.16,52.68,82.61,51.68C86.58,51.48,90.53999999999999,51.52,94.5,51.91"/>
<path id="苦-s5"  class="stroke" stroke="#09bfbf" d="M52.83,36.75C53.85,37.77,54.39,39.37,54.39,40.46C54.39,48.88,54.410000000000004,61.88,54.410000000000004,69.5"/>
<path id="苦-s6"  class="stroke" stroke="#0936bf" d="M33.02,71.09C33.84,71.91,34.440000000000005,72.96000000000001,34.61000000000001,74.11C35.45000000000001,79.85,36.510000000000005,85.57,37.540000000000006,92.73C37.720000000000006,94,37.900000000000006,95.26,38.080000000000005,96.51"/>
<path id="苦-s7"  class="stroke" stroke="#6409bf" d="M35.1,72.45C45.18,71.52,66.46000000000001,69.14,73.33,68.99000000000001C76.17,68.93,77.55,71.33000000000001,77.21,72.73C75.86999999999999,78.13000000000001,74.11999999999999,84.01,72.16,90.69"/>
<path id="苦-s8"  class="stroke" stroke="#bf0991" d="M39.51,93.83C48.199999999999996,93.28999999999999,59.16,92.3,69.13,91.64C70.75,91.53,72.28,91.44,73.67999999999999,91.37"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="苦-bg1"  class="badge-group"><circle cx="19.5" cy="29.65" r="3.5" fill="#bf0909"/><text class="num-single" x="19.5" y="29.65" dx="0" dy="-0.5">1</text></g>
<g id="苦-bg2"  class="badge-group"><circle cx="37.25" cy="15.25" r="3.5" fill="#bf9109"/><text class="num-single" x="37.25" y="15.25" dx="0" dy="-0.5">2</text></g>
<g id="苦-bg3"  class="badge-group"><circle cx="71.5" cy="13.75" r="3.5" fill="#64bf09"/><text class="num-single" x="71.5" y="13.75" dx="0" dy="-0.5">3</text></g>
<g id="苦-bg4"  class="badge-group"><circle cx="15.62" cy="56.19" r="3.5" fill="#09bf36"/><text class="num-single" x="15.62" y="56.19" dx="0" dy="-0.5">4</text></g>
<g id="苦-bg5"  class="badge-group"><circle cx="52.83" cy="36.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.83" y="36.75" dx="0" dy="-0.5">5</text></g>
<g id="苦-bg6"  class="badge-group"><circle cx="33.02" cy="67.59" r="3.5" fill="#0936bf"/><text class="num-single" x="33.02" y="67.59" dx="0" dy="-0.5">6</text></g>
<g id="苦-bg7"  class="badge-group"><circle cx="35.1" cy="75.95" r="3.5" fill="#6409bf"/><text class="num-single" x="35.1" y="75.95" dx="0" dy="-0.5">7</text></g>
<g id="苦-bg8"  class="badge-group"><circle cx="39.51" cy="93.83" r="3.5" fill="#bf0991"/><text class="num-single" x="39.51" y="93.83" dx="0" dy="-0.5">8</text></g>
</svg>