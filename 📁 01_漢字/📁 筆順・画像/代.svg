<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (代)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #代-bg[i]: Thời gian quả bóng số nảy lên
   - #代-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#代-bg1  { animation-delay: 0.05s; }
#代-s1   { stroke-dasharray: 44.2108; stroke-dashoffset: 44.2108; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#代-bg2  { animation-delay: 0.44s; }
#代-s2   { stroke-dasharray: 50.4494; stroke-dashoffset: 50.4494; animation: drawStroke 0.28s ease-out 0.57s forwards; }
#代-bg3  { animation-delay: 0.87s; }
#代-s3   { stroke-dasharray: 49.8985; stroke-dashoffset: 49.8985; animation: drawStroke 0.27s ease-out 1.00s forwards; }
#代-bg4  { animation-delay: 1.29s; }
#代-s4   { stroke-dasharray: 105.5980; stroke-dashoffset: 105.5980; animation: drawStroke 0.55s ease-out 1.42s forwards; }
#代-bg5  { animation-delay: 1.99s; }
#代-s5   { stroke-dasharray: 12.9699; stroke-dashoffset: 12.9699; animation: drawStroke 0.22s ease-out 2.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #代-s[i]) -->
<path id="代-s1"  class="stroke" stroke="#bf0909" d="M29.76,22.5C29.970000000000002,24.44,29.700000000000003,26.98,29.020000000000003,28.65C24.660000000000004,39.25,20.480000000000004,48.72,10.500000000000004,61.629999999999995"/>
<path id="代-s2"  class="stroke" stroke="#9abf09" d="M24.38,45C25.63,46.25,26.14,48.12,26.14,49.480000000000004C26.14,59.900000000000006,26.12,78.15,26.12,88.75C26.12,91.39,26.12,93.55,26.12,95"/>
<path id="代-s3"  class="stroke" stroke="#09bf52" d="M39.49,44.11C42.13,44.75,44.79,44.51,47.410000000000004,43.92C54.650000000000006,42.300000000000004,69.94,37.71,80.89,35.480000000000004C83.15,35.02,85.87,34.620000000000005,88.2,35.17"/>
<path id="代-s4"  class="stroke" stroke="#0952bf" d="M53.19,13.5C55.129999999999995,15.2,56.019999999999996,16.66,56.339999999999996,20.32C58.75,48.12,70,79.88,91.96,92.8C99.24,97.09,98.25,93.78,97.28,86.25999999999999"/>
<path id="代-s5"  class="stroke" stroke="#9a09bf" d="M71.75,15.38C75.19,16.85,80.69,20.200000000000003,82.3,22.71"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="代-bg1"  class="badge-group"><circle cx="29.76" cy="22.5" r="3.5" fill="#bf0909"/><text class="num-single" x="29.76" y="22.5" dx="0" dy="-0.5">1</text></g>
<g id="代-bg2"  class="badge-group"><circle cx="24.38" cy="45" r="3.5" fill="#9abf09"/><text class="num-single" x="24.38" y="45" dx="0" dy="-0.5">2</text></g>
<g id="代-bg3"  class="badge-group"><circle cx="39.49" cy="44.11" r="3.5" fill="#09bf52"/><text class="num-single" x="39.49" y="44.11" dx="0" dy="-0.5">3</text></g>
<g id="代-bg4"  class="badge-group"><circle cx="53.19" cy="13.5" r="3.5" fill="#0952bf"/><text class="num-single" x="53.19" y="13.5" dx="0" dy="-0.5">4</text></g>
<g id="代-bg5"  class="badge-group"><circle cx="71.75" cy="15.38" r="3.5" fill="#9a09bf"/><text class="num-single" x="71.75" y="15.38" dx="0" dy="-0.5">5</text></g>
</svg>