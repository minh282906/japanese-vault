<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (識)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #識-bg[i]: Thời gian quả bóng số nảy lên
   - #識-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#識-bg1  { animation-delay: 0.05s; }
#識-s1   { stroke-dasharray: 11.1947; stroke-dashoffset: 11.1947; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#識-bg2  { animation-delay: 0.42s; }
#識-s2   { stroke-dasharray: 26.5115; stroke-dashoffset: 26.5115; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#識-bg3  { animation-delay: 0.79s; }
#識-s3   { stroke-dasharray: 19.0509; stroke-dashoffset: 19.0509; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#識-bg4  { animation-delay: 1.16s; }
#識-s4   { stroke-dasharray: 18.9089; stroke-dashoffset: 18.9089; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#識-bg5  { animation-delay: 1.53s; }
#識-s5   { stroke-dasharray: 19.8739; stroke-dashoffset: 19.8739; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#識-bg6  { animation-delay: 1.90s; }
#識-s6   { stroke-dasharray: 30.9348; stroke-dashoffset: 30.9348; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#識-bg7  { animation-delay: 2.27s; }
#識-s7   { stroke-dasharray: 14.1568; stroke-dashoffset: 14.1568; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#識-bg8  { animation-delay: 2.64s; }
#識-s8   { stroke-dasharray: 12.1121; stroke-dashoffset: 12.1121; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#識-bg9  { animation-delay: 3.01s; }
#識-s9   { stroke-dasharray: 23.6652; stroke-dashoffset: 23.6652; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#識-bg10  { animation-delay: 3.38s; }
#識-s10   { stroke-dasharray: 9.6165; stroke-dashoffset: 9.6165; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#識-bg11  { animation-delay: 3.75s; }
#識-s11   { stroke-dasharray: 13.5610; stroke-dashoffset: 13.5610; animation: drawStroke 0.22s ease-out 3.88s forwards; }
#識-bg12  { animation-delay: 4.12s; }
#識-s12   { stroke-dasharray: 54.5593; stroke-dashoffset: 54.5593; animation: drawStroke 0.30s ease-out 4.25s forwards; }
#識-bg13  { animation-delay: 4.57s; }
#識-s13   { stroke-dasharray: 29.7735; stroke-dashoffset: 29.7735; animation: drawStroke 0.22s ease-out 4.70s forwards; }
#識-bg14  { animation-delay: 4.94s; }
#識-s14   { stroke-dasharray: 43.9433; stroke-dashoffset: 43.9433; animation: drawStroke 0.24s ease-out 5.07s forwards; }
#識-bg15  { animation-delay: 5.33s; }
#識-s15   { stroke-dasharray: 15.8536; stroke-dashoffset: 15.8536; animation: drawStroke 0.22s ease-out 5.46s forwards; }
#識-bg16  { animation-delay: 5.70s; }
#識-s16   { stroke-dasharray: 15.9229; stroke-dashoffset: 15.9229; animation: drawStroke 0.22s ease-out 5.83s forwards; }
#識-bg17  { animation-delay: 6.07s; }
#識-s17   { stroke-dasharray: 100.8070; stroke-dashoffset: 100.8070; animation: drawStroke 0.55s ease-out 6.20s forwards; }
#識-bg18  { animation-delay: 6.77s; }
#識-s18   { stroke-dasharray: 47.0479; stroke-dashoffset: 47.0479; animation: drawStroke 0.26s ease-out 6.90s forwards; }
#識-bg19  { animation-delay: 7.18s; }
#識-s19   { stroke-dasharray: 11.7597; stroke-dashoffset: 11.7597; animation: drawStroke 0.22s ease-out 7.31s forwards; }
]]>
</style>

