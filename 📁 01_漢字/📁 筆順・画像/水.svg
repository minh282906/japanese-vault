<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (水)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #水-bg[i]: Thời gian quả bóng số nảy lên
   - #水-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#水-bg1  { animation-delay: 0.05s; }
#水-s1   { stroke-dasharray: 87.4296; stroke-dashoffset: 87.4296; animation: drawStroke 0.48s ease-out 0.18s forwards; }
#水-bg2  { animation-delay: 0.68s; }
#水-s2   { stroke-dasharray: 68.3136; stroke-dashoffset: 68.3136; animation: drawStroke 0.38s ease-out 0.81s forwards; }
#水-bg3  { animation-delay: 1.21s; }
#水-s3   { stroke-dasharray: 29.8886; stroke-dashoffset: 29.8886; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#水-bg4  { animation-delay: 1.58s; }
#水-s4   { stroke-dasharray: 47.6051; stroke-dashoffset: 47.6051; animation: drawStroke 0.26s ease-out 1.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #水-s[i]) -->
<path id="水-s1"  class="stroke" stroke="#bf0909" d="M52.77,15.08C53.85,16.16,54.440000000000005,17.57,54.53,20.6C54.93,35.150000000000006,54.27,82.75999999999999,54.27,87.72C54.27,97.5,46.75,87.75,45.25,86.5"/>
<path id="水-s2"  class="stroke" stroke="#64bf09" d="M17.5,45.75C19.25,46.37,21.23,46.18,22.75,45.75C25.88,44.88,36.09,41,38.59,40S43.06,41.24,42.34,43.5C39,54,28.25,69,19,74.75"/>
<path id="水-s3"  class="stroke" stroke="#09bfbf" d="M81.22,27.5C81,28.75,80.5,29.75,79.7,30.47C74.06,35.57,67.25,40.25,57.25,44.25"/>
<path id="水-s4"  class="stroke" stroke="#6409bf" d="M57,46C65.82,56.730000000000004,76.23,67.46000000000001,85.42,73.42C87.58,74.82000000000001,89.94,76.42,92.5,77"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="水-bg1"  class="badge-group"><circle cx="52.77" cy="15.08" r="3.5" fill="#bf0909"/><text class="num-single" x="52.77" y="15.08" dx="0" dy="-0.5">1</text></g>
<g id="水-bg2"  class="badge-group"><circle cx="17.5" cy="45.75" r="3.5" fill="#64bf09"/><text class="num-single" x="17.5" y="45.75" dx="0" dy="-0.5">2</text></g>
<g id="水-bg3"  class="badge-group"><circle cx="81.22" cy="27.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="81.22" y="27.5" dx="0" dy="-0.5">3</text></g>
<g id="水-bg4"  class="badge-group"><circle cx="57" cy="46" r="3.5" fill="#6409bf"/><text class="num-single" x="57" y="46" dx="0" dy="-0.5">4</text></g>
</svg>