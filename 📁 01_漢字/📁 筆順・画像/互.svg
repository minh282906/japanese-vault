<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (互)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #互-bg[i]: Thời gian quả bóng số nảy lên
   - #互-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#互-bg1  { animation-delay: 0.05s; }
#互-s1   { stroke-dasharray: 59.8216; stroke-dashoffset: 59.8216; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#互-bg2  { animation-delay: 0.53s; }
#互-s2   { stroke-dasharray: 81.8048; stroke-dashoffset: 81.8048; animation: drawStroke 0.45s ease-out 0.66s forwards; }
#互-bg3  { animation-delay: 1.13s; }
#互-s3   { stroke-dasharray: 80.6701; stroke-dashoffset: 80.6701; animation: drawStroke 0.44s ease-out 1.26s forwards; }
#互-bg4  { animation-delay: 1.72s; }
#互-s4   { stroke-dasharray: 77.7137; stroke-dashoffset: 77.7137; animation: drawStroke 0.43s ease-out 1.85s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #互-s[i]) -->
<path id="互-s1"  class="stroke" stroke="#bf0909" d="M23.5,21.34C26.11,22.29,29.32,21.9,32,21.65C43.480000000000004,20.57,64.06,17.959999999999997,75.25,17.38C77.83,17.25,80.45,17.11,83,17.669999999999998"/>
<path id="互-s2"  class="stroke" stroke="#64bf09" d="M43.5,23.5C44.25,25,44.27,26.39,43.75,28.75C41.25,40,35.5,55.75,32.37,64.35C31.499999999999996,66.75,31.779999999999998,68.25999999999999,35,67.75C46,66,51.75,64.75,67.75,63.25"/>
<path id="互-s3"  class="stroke" stroke="#09bfbf" d="M43.5,42.5C45.12,43.12,46.77,43.51,49.46,43.03C57.5,41.620000000000005,62.620000000000005,40.620000000000005,68.97,39.120000000000005C73.24,38.11000000000001,74.25,39.910000000000004,73.16,43.88C70.72999999999999,52.74,66.71,72.05000000000001,63.25,88.75"/>
<path id="互-s4"  class="stroke" stroke="#6409bf" d="M15.75,91.71C19.5,92.61999999999999,22.69,92.53999999999999,25.869999999999997,92.32C39.209999999999994,91.38,64.75,89.86999999999999,81.84,89.24C85.58,89.1,89.56,89.35,93.25,90.14"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="互-bg1"  class="badge-group"><circle cx="23.5" cy="21.34" r="3.5" fill="#bf0909"/><text class="num-single" x="23.5" y="21.34" dx="0" dy="-0.5">1</text></g>
<g id="互-bg2"  class="badge-group"><circle cx="43.5" cy="23.5" r="3.5" fill="#64bf09"/><text class="num-single" x="43.5" y="23.5" dx="0" dy="-0.5">2</text></g>
<g id="互-bg3"  class="badge-group"><circle cx="43.5" cy="42.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="43.5" y="42.5" dx="0" dy="-0.5">3</text></g>
<g id="互-bg4"  class="badge-group"><circle cx="15.75" cy="91.71" r="3.5" fill="#6409bf"/><text class="num-single" x="15.75" y="91.71" dx="0" dy="-0.5">4</text></g>
</svg>