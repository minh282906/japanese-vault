<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (村)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #村-bg[i]: Thời gian quả bóng số nảy lên
   - #村-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#村-bg1  { animation-delay: 0.05s; }
#村-s1   { stroke-dasharray: 36.4067; stroke-dashoffset: 36.4067; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#村-bg2  { animation-delay: 0.42s; }
#村-s2   { stroke-dasharray: 81.3717; stroke-dashoffset: 81.3717; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#村-bg3  { animation-delay: 1.02s; }
#村-s3   { stroke-dasharray: 39.3845; stroke-dashoffset: 39.3845; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#村-bg4  { animation-delay: 1.39s; }
#村-s4   { stroke-dasharray: 14.3284; stroke-dashoffset: 14.3284; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#村-bg5  { animation-delay: 1.76s; }
#村-s5   { stroke-dasharray: 46.2661; stroke-dashoffset: 46.2661; animation: drawStroke 0.25s ease-out 1.89s forwards; }
#村-bg6  { animation-delay: 2.16s; }
#村-s6   { stroke-dasharray: 92.2844; stroke-dashoffset: 92.2844; animation: drawStroke 0.51s ease-out 2.29s forwards; }
#村-bg7  { animation-delay: 2.82s; }
#村-s7   { stroke-dasharray: 14.2474; stroke-dashoffset: 14.2474; animation: drawStroke 0.22s ease-out 2.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #村-s[i]) -->
<path id="村-s1"  class="stroke" stroke="#bf0909" d="M12.78,39.23C14.75,39.629999999999995,16.02,39.58,17.46,39.459999999999994C24.380000000000003,38.879999999999995,36.39,37.60999999999999,46.31,36.73C47.75,36.599999999999994,48.11,36.55,49.02,36.73"/>
<path id="村-s2"  class="stroke" stroke="#bfa509" d="M34.11,13.5C35.24,14.629999999999999,36.4,16.5,36.4,18.84C36.4,19.669999999999998,36.32,67.81,36.18,86.75C36.15,90.29,36.13,93.3,36.1,94.25"/>
<path id="村-s3"  class="stroke" stroke="#3dbf09" d="M35.44,39.32C35.44,40.25,35.18,40.9,34.839999999999996,41.67C30.38,51.75,23,63.5,15.11,72.76"/>
<path id="村-s4"  class="stroke" stroke="#09bf71" d="M40.72,48.97C43.25,50.5,47.5,56.25,49.379999999999995,60.23"/>
<path id="村-s5"  class="stroke" stroke="#0971bf" d="M52.62,41.52C54.91,42,56.78,42.120000000000005,58.629999999999995,41.92C71.97999999999999,40.480000000000004,82.42999999999999,38.620000000000005,92.78,38.21C94.61,38.14,97.04,37.99,98.62,38.35"/>
<path id="村-s6"  class="stroke" stroke="#3d09bf" d="M79.89,13.25C81.38,14.74,82.15,16.37,82.15,18.77C82.15,33.33,82.47,84.67999999999999,82.39,89.64C82.25,98.38,77.21000000000001,94.42,72.68,89.89"/>
<path id="村-s7"  class="stroke" stroke="#bf09a5" d="M59.58,56.78C62.32,58.85,66.65,65.3,67.33,68.53"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="村-bg1"  class="badge-group"><circle cx="12.78" cy="39.23" r="3.5" fill="#bf0909"/><text class="num-single" x="12.78" y="39.23" dx="0" dy="-0.5">1</text></g>
<g id="村-bg2"  class="badge-group"><circle cx="34.11" cy="13.5" r="3.5" fill="#bfa509"/><text class="num-single" x="34.11" y="13.5" dx="0" dy="-0.5">2</text></g>
<g id="村-bg3"  class="badge-group"><circle cx="35.44" cy="39.32" r="3.5" fill="#3dbf09"/><text class="num-single" x="35.44" y="39.32" dx="0" dy="-0.5">3</text></g>
<g id="村-bg4"  class="badge-group"><circle cx="40.72" cy="48.97" r="3.5" fill="#09bf71"/><text class="num-single" x="40.72" y="48.97" dx="0" dy="-0.5">4</text></g>
<g id="村-bg5"  class="badge-group"><circle cx="52.62" cy="41.52" r="3.5" fill="#0971bf"/><text class="num-single" x="52.62" y="41.52" dx="0" dy="-0.5">5</text></g>
<g id="村-bg6"  class="badge-group"><circle cx="79.89" cy="13.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="79.89" y="13.25" dx="0" dy="-0.5">6</text></g>
<g id="村-bg7"  class="badge-group"><circle cx="59.58" cy="56.78" r="3.5" fill="#bf09a5"/><text class="num-single" x="59.58" y="56.78" dx="0" dy="-0.5">7</text></g>
</svg>