<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (柔)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #柔-bg[i]: Thời gian quả bóng số nảy lên
   - #柔-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#柔-bg1  { animation-delay: 0.05s; }
#柔-s1   { stroke-dasharray: 61.4615; stroke-dashoffset: 61.4615; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#柔-bg2  { animation-delay: 0.54s; }
#柔-s2   { stroke-dasharray: 11.6456; stroke-dashoffset: 11.6456; animation: drawStroke 0.22s ease-out 0.67s forwards; }
#柔-bg3  { animation-delay: 0.91s; }
#柔-s3   { stroke-dasharray: 70.1622; stroke-dashoffset: 70.1622; animation: drawStroke 0.39s ease-out 1.04s forwards; }
#柔-bg4  { animation-delay: 1.45s; }
#柔-s4   { stroke-dasharray: 28.1358; stroke-dashoffset: 28.1358; animation: drawStroke 0.22s ease-out 1.58s forwards; }
#柔-bg5  { animation-delay: 1.82s; }
#柔-s5   { stroke-dasharray: 40.5744; stroke-dashoffset: 40.5744; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#柔-bg6  { animation-delay: 2.19s; }
#柔-s6   { stroke-dasharray: 72.8032; stroke-dashoffset: 72.8032; animation: drawStroke 0.40s ease-out 2.32s forwards; }
#柔-bg7  { animation-delay: 2.74s; }
#柔-s7   { stroke-dasharray: 41.5572; stroke-dashoffset: 41.5572; animation: drawStroke 0.23s ease-out 2.87s forwards; }
#柔-bg8  { animation-delay: 3.12s; }
#柔-s8   { stroke-dasharray: 45.9310; stroke-dashoffset: 45.9310; animation: drawStroke 0.25s ease-out 3.25s forwards; }
#柔-bg9  { animation-delay: 3.52s; }
#柔-s9   { stroke-dasharray: 42.6825; stroke-dashoffset: 42.6825; animation: drawStroke 0.23s ease-out 3.65s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #柔-s[i]) -->
<path id="柔-s1"  class="stroke" stroke="#bf0909" d="M31.02,15.29C33.22,15.889999999999999,35.87,15.809999999999999,38.13,15.489999999999998C45.56,14.439999999999998,65.04,11.159999999999998,67.61,10.849999999999998C70.62,10.479999999999999,71.63,12.509999999999998,69.35,14.349999999999998C66.46,16.689999999999998,56.75999999999999,23.97,54.85999999999999,25.439999999999998"/>
<path id="柔-s2"  class="stroke" stroke="#bf8209" d="M44.5,22C47.15,22.73,53.39,25.55,54.64,27.47"/>
<path id="柔-s3"  class="stroke" stroke="#82bf09" d="M22.32,34.79C25.34,35.35,28.55,35.42,31.53,34.62C44.510000000000005,31.119999999999997,62.88,27.369999999999997,77.43,27.189999999999998C84.53,27.099999999999998,80.38000000000001,31.999999999999996,75.55000000000001,36.51"/>
<path id="柔-s4"  class="stroke" stroke="#09bf09" d="M55.51,31.29C56.419999999999995,32.199999999999996,56.48,33.25,56.48,34.879999999999995C56.48,41.11,56.459999999999994,45.61,56.459999999999994,49.949999999999996C56.459999999999994,56.199999999999996,52.61999999999999,51.839999999999996,51.019999999999996,49.879999999999995"/>
<path id="柔-s5"  class="stroke" stroke="#09bf82" d="M52.99,30.75C53.07,31.39,52.6,32.47,52.07,33.31C47.25,40.88,41.62,49,23.64,57.26"/>
<path id="柔-s6"  class="stroke" stroke="#0982bf" d="M18.75,68.86C21.8,69.75,24.88,69.51,27.990000000000002,69.19C41.88,67.75,63.75,65.37,81.87,64.64C85.21000000000001,64.51,87.98,64.56,91.25,65.15"/>
<path id="柔-s7"  class="stroke" stroke="#0909bf" d="M53.75,58.25C54.69,59.19,55,60.62,55,62C55,70.67,55.11,85.62,55.11,95C55.11,96.86,55.04,98.41,55,99.5"/>
<path id="柔-s8"  class="stroke" stroke="#8209bf" d="M52.75,67.75C52.75,69,51.93,70.54,51.08,71.73C44.41,81.07000000000001,30.389999999999997,91.73,17.75,95.5"/>
<path id="柔-s9"  class="stroke" stroke="#bf0982" d="M56,68C59.79,70.5,74.27,81.28,82.8,86.99C85.23,88.61999999999999,88.5,90.61999999999999,91.5,91.5"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="柔-bg1"  class="badge-group"><circle cx="31.02" cy="15.29" r="3.5" fill="#bf0909"/><text class="num-single" x="31.02" y="15.29" dx="0" dy="-0.5">1</text></g>
<g id="柔-bg2"  class="badge-group"><circle cx="44.5" cy="22" r="3.5" fill="#bf8209"/><text class="num-single" x="44.5" y="22" dx="0" dy="-0.5">2</text></g>
<g id="柔-bg3"  class="badge-group"><circle cx="22.32" cy="34.79" r="3.5" fill="#82bf09"/><text class="num-single" x="22.32" y="34.79" dx="0" dy="-0.5">3</text></g>
<g id="柔-bg4"  class="badge-group"><circle cx="55.51" cy="27.79" r="3.5" fill="#09bf09"/><text class="num-single" x="55.51" y="27.79" dx="0" dy="-0.5">4</text></g>
<g id="柔-bg5"  class="badge-group"><circle cx="52.99" cy="34.25" r="3.5" fill="#09bf82"/><text class="num-single" x="52.99" y="34.25" dx="0" dy="-0.5">5</text></g>
<g id="柔-bg6"  class="badge-group"><circle cx="18.75" cy="68.86" r="3.5" fill="#0982bf"/><text class="num-single" x="18.75" y="68.86" dx="0" dy="-0.5">6</text></g>
<g id="柔-bg7"  class="badge-group"><circle cx="53.75" cy="58.25" r="3.5" fill="#0909bf"/><text class="num-single" x="53.75" y="58.25" dx="0" dy="-0.5">7</text></g>
<g id="柔-bg8"  class="badge-group"><circle cx="52.75" cy="64.25" r="3.5" fill="#8209bf"/><text class="num-single" x="52.75" y="64.25" dx="0" dy="-0.5">8</text></g>
<g id="柔-bg9"  class="badge-group"><circle cx="56" cy="71.5" r="3.5" fill="#bf0982"/><text class="num-single" x="56" y="71.5" dx="0" dy="-0.5">9</text></g>
</svg>