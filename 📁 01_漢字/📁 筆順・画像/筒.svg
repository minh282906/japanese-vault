<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (筒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #筒-bg[i]: Thời gian quả bóng số nảy lên
   - #筒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#筒-bg1  { animation-delay: 0.05s; }
#筒-s1   { stroke-dasharray: 26.7529; stroke-dashoffset: 26.7529; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#筒-bg2  { animation-delay: 0.42s; }
#筒-s2   { stroke-dasharray: 23.9056; stroke-dashoffset: 23.9056; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#筒-bg3  { animation-delay: 0.79s; }
#筒-s3   { stroke-dasharray: 11.8425; stroke-dashoffset: 11.8425; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#筒-bg4  { animation-delay: 1.16s; }
#筒-s4   { stroke-dasharray: 22.1866; stroke-dashoffset: 22.1866; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#筒-bg5  { animation-delay: 1.53s; }
#筒-s5   { stroke-dasharray: 29.6362; stroke-dashoffset: 29.6362; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#筒-bg6  { animation-delay: 1.90s; }
#筒-s6   { stroke-dasharray: 11.4843; stroke-dashoffset: 11.4843; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#筒-bg7  { animation-delay: 2.27s; }
#筒-s7   { stroke-dasharray: 52.6763; stroke-dashoffset: 52.6763; animation: drawStroke 0.29s ease-out 2.40s forwards; }
#筒-bg8  { animation-delay: 2.71s; }
#筒-s8   { stroke-dasharray: 122.6200; stroke-dashoffset: 122.6200; animation: drawStroke 0.55s ease-out 2.84s forwards; }
#筒-bg9  { animation-delay: 3.41s; }
#筒-s9   { stroke-dasharray: 32.0165; stroke-dashoffset: 32.0165; animation: drawStroke 0.22s ease-out 3.54s forwards; }
#筒-bg10  { animation-delay: 3.78s; }
#筒-s10   { stroke-dasharray: 18.1562; stroke-dashoffset: 18.1562; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#筒-bg11  { animation-delay: 4.15s; }
#筒-s11   { stroke-dasharray: 42.2119; stroke-dashoffset: 42.2119; animation: drawStroke 0.23s ease-out 4.28s forwards; }
#筒-bg12  { animation-delay: 4.53s; }
#筒-s12   { stroke-dasharray: 25.9197; stroke-dashoffset: 25.9197; animation: drawStroke 0.22s ease-out 4.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #筒-s[i]) -->
<path id="筒-s1"  class="stroke" stroke="#bf0909" d="M29.25,13C29.5,13.88,29.24,14.76,28.93,15.52C26.88,20.5,22.63,28.119999999999997,16.25,36"/>
