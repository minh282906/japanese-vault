<g id="筒-bg9"  class="badge-group"><circle cx="36.99" cy="56.54" r="3.5" fill="#0909bf"/><text class="num-single" x="36.99" y="56.54" dx="0" dy="-0.5">9</text></g>
<g id="筒-bg10" class="badge-group"><circle cx="37.14" cy="65.51" r="3.5" fill="#6409bf"/><text class="num-double" x="37.14" y="65.51" dx="-0.4" dy="-0.475">10</text></g>
