<path id="筒-s6"  class="stroke" stroke="#09bf64" d="M73.28,25C73.36,25.59,73.27,26.14,72.98,26.66C72.05,29.08,70.96,31.47,68,35"/>
<path id="筒-s7"  class="stroke" stroke="#09bfbf" d="M23.67,44.32C24.35,45.54,24.8,46.53,24.57,48.72C24.39,50.43,24.59,76.28,24.57,89.5C24.57,93.27,24.56,96,24.56,96.81"/>
<path id="筒-s8"  class="stroke" stroke="#0964bf" d="M25.39,45.75C34.75,45,67.62,42.13,81.5,41.14C85.24,40.87,86.47,42.9,86.47,45.58C86.47,48.019999999999996,86.45,85.33,86.45,90.93C86.45,101.75,81.82000000000001,95.26,79.83,92.89"/>
<path id="筒-s9"  class="stroke" stroke="#0909bf" d="M36.99,56.54C38.660000000000004,57.22,40.660000000000004,57.14,42.38,57.04C50.88,56.54,58.58,55.43,65.39,54.64C66.88,54.47,68.04,54.56,68.79,54.75"/>
<path id="筒-s10"  class="stroke" stroke="#6409bf" d="M37.14,69.01C37.75,69.62,38.42,70.91000000000001,38.62,71.92C39.51,75.87,39.739999999999995,77.89,40.3,81.78C40.55,83.49,40.809999999999995,85.14,41.11,86.56"/>
<path id="筒-s11"  class="stroke" stroke="#bf09bf" d="M39.37,70.33C49.75,69,60.46,67.94,66.1,67.52C68.77,67.32,69.30999999999999,68.58999999999999,68.64,70.78999999999999C67.68,73.92999999999999,66.88,76.61999999999999,65.89,80.36999999999999"/>
<path id="筒-s12"  class="stroke" stroke="#bf0964" d="M42.11,83.87C47.55,83.48,55.36,82.77000000000001,63.01,82.22C64.67,82.1,66.33,81.97,67.95,81.84"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="筒-bg1"  class="badge-group"><circle cx="29.25" cy="13" r="3.5" fill="#bf0909"/><text class="num-single" x="29.25" y="13" dx="0" dy="-0.5">1</text></g>
