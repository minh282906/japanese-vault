<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (術)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #術-bg[i]: Thời gian quả bóng số nảy lên
   - #術-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#術-bg1  { animation-delay: 0.05s; }
#術-s1   { stroke-dasharray: 23.2557; stroke-dashoffset: 23.2557; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#術-bg2  { animation-delay: 0.42s; }
#術-s2   { stroke-dasharray: 34.5784; stroke-dashoffset: 34.5784; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#術-bg3  { animation-delay: 0.79s; }
#術-s3   { stroke-dasharray: 45.7359; stroke-dashoffset: 45.7359; animation: drawStroke 0.25s ease-out 0.92s forwards; }
#術-bg4  { animation-delay: 1.19s; }
#術-s4   { stroke-dasharray: 27.7451; stroke-dashoffset: 27.7451; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#術-bg5  { animation-delay: 1.56s; }
#術-s5   { stroke-dasharray: 77.6619; stroke-dashoffset: 77.6619; animation: drawStroke 0.43s ease-out 1.69s forwards; }
#術-bg6  { animation-delay: 2.14s; }
#術-s6   { stroke-dasharray: 34.2871; stroke-dashoffset: 34.2871; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#術-bg7  { animation-delay: 2.51s; }
#術-s7   { stroke-dasharray: 26.0396; stroke-dashoffset: 26.0396; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#術-bg8  { animation-delay: 2.88s; }
#術-s8   { stroke-dasharray: 11.7842; stroke-dashoffset: 11.7842; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#術-bg9  { animation-delay: 3.25s; }
#術-s9   { stroke-dasharray: 19.2623; stroke-dashoffset: 19.2623; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#術-bg10  { animation-delay: 3.62s; }
#術-s10   { stroke-dasharray: 31.9318; stroke-dashoffset: 31.9318; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#術-bg11  { animation-delay: 3.99s; }
#術-s11   { stroke-dasharray: 60.8025; stroke-dashoffset: 60.8025; animation: drawStroke 0.33s ease-out 4.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #術-s[i]) -->
<path id="術-s1"  class="stroke" stroke="#bf0909" d="M26.88,14.5C26.88,15.38,26.57,16.54,26.119999999999997,17.2C23.779999999999998,20.64,18.999999999999996,25.5,11.629999999999997,31.5"/>
