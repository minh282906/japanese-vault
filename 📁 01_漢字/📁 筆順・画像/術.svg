<path id="術-s4"  class="stroke" stroke="#4bbf09" d="M36.4,36.5C38.25,36.88,39.339999999999996,37.03,40.879999999999995,36.89C45.449999999999996,36.47,53.629999999999995,35.13,59.75999999999999,33.8C60.97999999999999,33.54,62.49999999999999,33.5,63.81999999999999,33.79"/>
<path id="術-s5"  class="stroke" stroke="#09bf2a" d="M48.77,14.5C49.57,15.3,50.28,16.62,50.28,17.88C50.28,22.869999999999997,50.42,63.620000000000005,50.42,83.25C50.42,87.24,50.29,90.79,50.25,91.75"/>
<path id="術-s6"  class="stroke" stroke="#09bf8d" d="M40.37,46.75C40.5,47.5,40.669999999999995,49.01,40.58,49.9C39.5,60,37.38,69.62,32.5,79.79"/>
<path id="術-s7"  class="stroke" stroke="#098dbf" d="M58.52,49.08C60.39,53.599999999999994,63.6,67.43,64.06,74.46"/>
<path id="術-s8"  class="stroke" stroke="#092abf" d="M58.02,15.33C60.330000000000005,17.03,63.980000000000004,22.32,64.56,24.96"/>
<path id="術-s9"  class="stroke" stroke="#4b09bf" d="M73.07,23.3C74.75,23.5,76.25999999999999,23.23,77.66,22.990000000000002C80.86,22.450000000000003,85.02,21.290000000000003,87.74,20.82C89.14999999999999,20.580000000000002,90.64,20.52,92.05,20.77"/>
<path id="術-s10"  class="stroke" stroke="#ae09bf" d="M67.63,40.92C69,41.13,71.14999999999999,41.17,72.64999999999999,40.910000000000004C79.49,39.730000000000004,88.02,37.63,94.36999999999999,36.88C95.96999999999998,36.690000000000005,97.57,36.49,99.11999999999999,37.04"/>
<path id="術-s11"  class="stroke" stroke="#bf096c" d="M84.33,41.08C85.12,41.87,85.69,43.75,85.69,45.099999999999994C85.69,59.66,85.77,84.50999999999999,85.77,89.47C85.77,97.5,79.1,89.72,78.07,88.47"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="術-bg1"  class="badge-group"><circle cx="26.88" cy="14.5" r="3.5" fill="#bf0909"/><text class="num-single" x="26.88" y="14.5" dx="0" dy="-0.5">1</text></g>
<g id="術-bg2"  class="badge-group"><circle cx="28.03" cy="32" r="3.5" fill="#bf6c09"/><text class="num-single" x="28.03" y="32" dx="0" dy="-0.5">2</text></g>
