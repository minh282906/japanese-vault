<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (乳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #乳-bg[i]: Thời gian quả bóng số nảy lên
   - #乳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#乳-bg1  { animation-delay: 0.05s; }
#乳-s1   { stroke-dasharray: 30.4558; stroke-dashoffset: 30.4558; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#乳-bg2  { animation-delay: 0.42s; }
#乳-s2   { stroke-dasharray: 13.9327; stroke-dashoffset: 13.9327; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#乳-bg3  { animation-delay: 0.79s; }
#乳-s3   { stroke-dasharray: 14.3032; stroke-dashoffset: 14.3032; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#乳-bg4  { animation-delay: 1.16s; }
#乳-s4   { stroke-dasharray: 18.5109; stroke-dashoffset: 18.5109; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#乳-bg5  { animation-delay: 1.53s; }
#乳-s5   { stroke-dasharray: 49.7865; stroke-dashoffset: 49.7865; animation: drawStroke 0.27s ease-out 1.66s forwards; }
#乳-bg6  { animation-delay: 1.95s; }
#乳-s6   { stroke-dasharray: 46.9937; stroke-dashoffset: 46.9937; animation: drawStroke 0.26s ease-out 2.08s forwards; }
#乳-bg7  { animation-delay: 2.36s; }
#乳-s7   { stroke-dasharray: 41.2983; stroke-dashoffset: 41.2983; animation: drawStroke 0.23s ease-out 2.49s forwards; }
#乳-bg8  { animation-delay: 2.74s; }
#乳-s8   { stroke-dasharray: 110.7380; stroke-dashoffset: 110.7380; animation: drawStroke 0.55s ease-out 2.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #乳-s[i]) -->
<path id="乳-s1"  class="stroke" stroke="#bf0909" d="M42.27,13.04C42.120000000000005,14.25,41.52,14.84,40.67,15.43C36.25,18.5,28.5,22.13,15.600000000000001,26.48"/>
<path id="乳-s2"  class="stroke" stroke="#bf9109" d="M14.52,32.99C17.009999999999998,35.08,20.95,41.58,21.57,44.83"/>
<path id="乳-s3"  class="stroke" stroke="#64bf09" d="M27.5,29.62C30.29,31.69,34.7,38.120000000000005,35.39,41.34"/>
<path id="乳-s4"  class="stroke" stroke="#09bf36" d="M50.03,24.09C50.1,25.09,50.03,26.08,49.660000000000004,27.009999999999998C48.25000000000001,30.619999999999997,46.160000000000004,35.17,42.18000000000001,40.58"/>
<path id="乳-s5"  class="stroke" stroke="#09bfbf" d="M15.79,52.34C17.38,52.870000000000005,19.88,53,21.799999999999997,52.59C27.47,51.39,42.47,47.5,43.87,47.5C45.51,47.5,46.54,48.71,44.9,50.12C43.26,51.529999999999994,36.75,57.37,31.81,60.83"/>
<path id="乳-s6"  class="stroke" stroke="#0936bf" d="M31.85,61C40.25,69.62,41.27,80.43,40.33,87.25C39.18,95.55,33.86,98.94,28.519999999999996,91.89"/>
<path id="乳-s7"  class="stroke" stroke="#6409bf" d="M13,82.15C14.34,82.86,15.74,82.71000000000001,17.73,81.71000000000001C26.5,77.32,34.62,73,50,65"/>
<path id="乳-s8"  class="stroke" stroke="#bf0991" d="M62.24,17.87C63.190000000000005,18.82,63.49,20.46,63.49,22.3C63.49,30.880000000000003,63.260000000000005,74.5,63.260000000000005,80.5C63.260000000000005,90.5,65.01,93.03,80.53,93.03C94.51,93.03,96.15,90.75,96.15,82.91"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="乳-bg1"  class="badge-group"><circle cx="42.27" cy="13.04" r="3.5" fill="#bf0909"/><text class="num-single" x="42.27" y="13.04" dx="0" dy="-0.5">1</text></g>
<g id="乳-bg2"  class="badge-group"><circle cx="14.52" cy="32.99" r="3.5" fill="#bf9109"/><text class="num-single" x="14.52" y="32.99" dx="0" dy="-0.5">2</text></g>
<g id="乳-bg3"  class="badge-group"><circle cx="27.5" cy="29.62" r="3.5" fill="#64bf09"/><text class="num-single" x="27.5" y="29.62" dx="0" dy="-0.5">3</text></g>
<g id="乳-bg4"  class="badge-group"><circle cx="50.03" cy="24.09" r="3.5" fill="#09bf36"/><text class="num-single" x="50.03" y="24.09" dx="0" dy="-0.5">4</text></g>
<g id="乳-bg5"  class="badge-group"><circle cx="15.79" cy="52.34" r="3.5" fill="#09bfbf"/><text class="num-single" x="15.79" y="52.34" dx="0" dy="-0.5">5</text></g>
<g id="乳-bg6"  class="badge-group"><circle cx="31.85" cy="61" r="3.5" fill="#0936bf"/><text class="num-single" x="31.85" y="61" dx="0" dy="-0.5">6</text></g>
<g id="乳-bg7"  class="badge-group"><circle cx="13" cy="82.15" r="3.5" fill="#6409bf"/><text class="num-single" x="13" y="82.15" dx="0" dy="-0.5">7</text></g>
<g id="乳-bg8"  class="badge-group"><circle cx="62.24" cy="17.87" r="3.5" fill="#bf0991"/><text class="num-single" x="62.24" y="17.87" dx="0" dy="-0.5">8</text></g>
</svg>