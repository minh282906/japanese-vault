<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (選)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #選-bg[i]: Thời gian quả bóng số nảy lên
   - #選-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#選-bg1  { animation-delay: 0.05s; }
#選-s1   { stroke-dasharray: 27.3424; stroke-dashoffset: 27.3424; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#選-bg2  { animation-delay: 0.42s; }
#選-s2   { stroke-dasharray: 17.1109; stroke-dashoffset: 17.1109; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#選-bg3  { animation-delay: 0.79s; }
#選-s3   { stroke-dasharray: 30.7791; stroke-dashoffset: 30.7791; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#選-bg4  { animation-delay: 1.16s; }
#選-s4   { stroke-dasharray: 27.1370; stroke-dashoffset: 27.1370; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#選-bg5  { animation-delay: 1.53s; }
#選-s5   { stroke-dasharray: 17.1696; stroke-dashoffset: 17.1696; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#選-bg6  { animation-delay: 1.90s; }
#選-s6   { stroke-dasharray: 31.9085; stroke-dashoffset: 31.9085; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#選-bg7  { animation-delay: 2.27s; }
#選-s7   { stroke-dasharray: 42.5718; stroke-dashoffset: 42.5718; animation: drawStroke 0.23s ease-out 2.40s forwards; }
#選-bg8  { animation-delay: 2.65s; }
#選-s8   { stroke-dasharray: 20.1312; stroke-dashoffset: 20.1312; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#選-bg9  { animation-delay: 3.02s; }
#選-s9   { stroke-dasharray: 21.2456; stroke-dashoffset: 21.2456; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#選-bg10  { animation-delay: 3.39s; }
#選-s10   { stroke-dasharray: 53.6567; stroke-dashoffset: 53.6567; animation: drawStroke 0.30s ease-out 3.52s forwards; }
#選-bg11  { animation-delay: 3.84s; }
#選-s11   { stroke-dasharray: 16.7299; stroke-dashoffset: 16.7299; animation: drawStroke 0.22s ease-out 3.97s forwards; }
#選-bg12  { animation-delay: 4.21s; }
#選-s12   { stroke-dasharray: 17.0602; stroke-dashoffset: 17.0602; animation: drawStroke 0.22s ease-out 4.34s forwards; }
#選-bg13  { animation-delay: 4.58s; }
#選-s13   { stroke-dasharray: 15.5609; stroke-dashoffset: 15.5609; animation: drawStroke 0.22s ease-out 4.71s forwards; }
#選-bg14  { animation-delay: 4.95s; }
#選-s14   { stroke-dasharray: 63.2532; stroke-dashoffset: 63.2532; animation: drawStroke 0.35s ease-out 5.08s forwards; }
#選-bg15  { animation-delay: 5.45s; }
#選-s15   { stroke-dasharray: 79.9375; stroke-dashoffset: 79.9375; animation: drawStroke 0.44s ease-out 5.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
