<path id="晩-s8"  class="stroke" stroke="#0964bf" d="M48.65,41.96C57.21,40.18,75.12,37.26,81.9,36.26C84.31,35.9,86.67,36.86,86.13000000000001,39.879999999999995C85.22000000000001,44.97,84.63000000000001,47.26,82.73,53.74999999999999C82.46000000000001,54.68999999999999,82.04,55.67999999999999,81.63000000000001,56.779999999999994"/>
<path id="晩-s9"  class="stroke" stroke="#0909bf" d="M63.88,41C64.75,41.87,65.28,43,65.28,44.25C65.28,49,65.28,53.25,65.28,55.25"/>
<path id="晩-s10"  class="stroke" stroke="#6409bf" d="M51.38,58.25C55.18,57.75,76.93,55,81.12,54.75"/>
<path id="晩-s11"  class="stroke" stroke="#bf09bf" d="M56.64,61.75C56.72,62.54,56.96,63.85,56.480000000000004,64.93C53.25,72.25,45.5,84.5,28.67,94.17"/>
<path id="晩-s12"  class="stroke" stroke="#bf0964" d="M69.19,59.37C70.16,60.339999999999996,70.45,61.66,70.45,63.28C70.45,70.12,70.31,77.5,70.31,82.85C70.31,91.88,71.38,93.28999999999999,83.53,93.28999999999999C96.13,93.28999999999999,96.89,91.00999999999999,96.89,84.97999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="晩-bg1"  class="badge-group"><circle cx="14.27" cy="21.24" r="3.5" fill="#bf0909"/><text class="num-single" x="14.27" y="21.24" dx="0" dy="-0.5">1</text></g>
