<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (晩)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #晩-bg[i]: Thời gian quả bóng số nảy lên
   - #晩-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#晩-bg1  { animation-delay: 0.05s; }
#晩-s1   { stroke-dasharray: 48.7585; stroke-dashoffset: 48.7585; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#晩-bg2  { animation-delay: 0.47s; }
#晩-s2   { stroke-dasharray: 67.0276; stroke-dashoffset: 67.0276; animation: drawStroke 0.37s ease-out 0.60s forwards; }
#晩-bg3  { animation-delay: 0.99s; }
#晩-s3   { stroke-dasharray: 17.6711; stroke-dashoffset: 17.6711; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#晩-bg4  { animation-delay: 1.36s; }
#晩-s4   { stroke-dasharray: 17.2354; stroke-dashoffset: 17.2354; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#晩-bg5  { animation-delay: 1.73s; }
#晩-s5   { stroke-dasharray: 25.2982; stroke-dashoffset: 25.2982; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#晩-bg6  { animation-delay: 2.10s; }
#晩-s6   { stroke-dasharray: 43.5050; stroke-dashoffset: 43.5050; animation: drawStroke 0.24s ease-out 2.23s forwards; }
#晩-bg7  { animation-delay: 2.49s; }
#晩-s7   { stroke-dasharray: 20.7166; stroke-dashoffset: 20.7166; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#晩-bg8  { animation-delay: 2.86s; }
#晩-s8   { stroke-dasharray: 58.0327; stroke-dashoffset: 58.0327; animation: drawStroke 0.32s ease-out 2.99s forwards; }
#晩-bg9  { animation-delay: 3.33s; }
#晩-s9   { stroke-dasharray: 14.6331; stroke-dashoffset: 14.6331; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#晩-bg10  { animation-delay: 3.70s; }
#晩-s10   { stroke-dasharray: 29.9471; stroke-dashoffset: 29.9471; animation: drawStroke 0.22s ease-out 3.83s forwards; }
#晩-bg11  { animation-delay: 4.07s; }
#晩-s11   { stroke-dasharray: 44.2444; stroke-dashoffset: 44.2444; animation: drawStroke 0.24s ease-out 4.20s forwards; }
#晩-bg12  { animation-delay: 4.46s; }
#晩-s12   { stroke-dasharray: 63.1153; stroke-dashoffset: 63.1153; animation: drawStroke 0.35s ease-out 4.59s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

