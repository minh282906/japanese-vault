<path id="晩-s6"  class="stroke" stroke="#09bf64" d="M56.6,21.75C58.65,21.75,72.39,19.16,74.54,18.92C76.39,18.720000000000002,77.34,21.110000000000003,76.57000000000001,22.130000000000003C73.32000000000001,26.400000000000002,68.52000000000001,31.260000000000005,63.38000000000001,38.1"/>
