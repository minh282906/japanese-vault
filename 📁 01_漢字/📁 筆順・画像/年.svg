<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (年)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #年-bg[i]: Thời gian quả bóng số nảy lên
   - #年-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#年-bg1  { animation-delay: 0.05s; }
#年-s1   { stroke-dasharray: 29.9815; stroke-dashoffset: 29.9815; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#年-bg2  { animation-delay: 0.42s; }
#年-s2   { stroke-dasharray: 44.6573; stroke-dashoffset: 44.6573; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#年-bg3  { animation-delay: 0.82s; }
#年-s3   { stroke-dasharray: 51.0251; stroke-dashoffset: 51.0251; animation: drawStroke 0.28s ease-out 0.95s forwards; }
#年-bg4  { animation-delay: 1.25s; }
#年-s4   { stroke-dasharray: 21.9954; stroke-dashoffset: 21.9954; animation: drawStroke 0.22s ease-out 1.38s forwards; }
#年-bg5  { animation-delay: 1.62s; }
#年-s5   { stroke-dasharray: 81.4333; stroke-dashoffset: 81.4333; animation: drawStroke 0.45s ease-out 1.75s forwards; }
#年-bg6  { animation-delay: 2.22s; }
#年-s6   { stroke-dasharray: 73.3373; stroke-dashoffset: 73.3373; animation: drawStroke 0.40s ease-out 2.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #年-s[i]) -->
<path id="年-s1"  class="stroke" stroke="#bf0909" d="M40.01,11.89C40.25,13.5,40,14.75,39.169999999999995,16.35C36.63999999999999,21.19,32.25999999999999,27.75,23.309999999999995,35.97"/>
<path id="年-s2"  class="stroke" stroke="#bfbf09" d="M39.13,23.62C41.38,24,43.53,23.8,44.92,23.650000000000002C56.620000000000005,22.380000000000003,66.25,20.750000000000004,78.14,19.580000000000002C80.44,19.35,82.34,19.580000000000002,83.49,19.840000000000003"/>
<path id="年-s3"  class="stroke" stroke="#09bf09" d="M30.13,43.59C31.49,43.92,34,44.050000000000004,35.339999999999996,43.92C46.25,42.870000000000005,63.87,40.5,76.12,39.660000000000004C78.38000000000001,39.510000000000005,79.75,39.82,80.88000000000001,39.980000000000004"/>
<path id="年-s4"  class="stroke" stroke="#09bfbf" d="M33.75,44.5C34.75,45.75,34.75,46.47,34.76,48C34.8,52.33,35,65.29,35,66.25"/>
<path id="年-s5"  class="stroke" stroke="#0909bf" d="M13.88,67.74C15.850000000000001,68.21,19.490000000000002,68.39999999999999,21.450000000000003,68.21C41.660000000000004,66.17999999999999,57.800000000000004,63.589999999999996,88.10000000000001,62.89999999999999C91.39000000000001,62.81999999999999,93.36000000000001,63.11999999999999,95.01,63.35999999999999"/>
<path id="年-s6"  class="stroke" stroke="#bf09bf" d="M56.56,25.46C57.68,26.580000000000002,58.35,29,58.35,30.400000000000002C58.35,31.290000000000003,58.300000000000004,74.66,58.22,92C58.21,95.12,58.19,97.39,58.17,98.38"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="年-bg1"  class="badge-group"><circle cx="40.01" cy="11.89" r="3.5" fill="#bf0909"/><text class="num-single" x="40.01" y="11.89" dx="0" dy="-0.5">1</text></g>
<g id="年-bg2"  class="badge-group"><circle cx="39.13" cy="23.62" r="3.5" fill="#bfbf09"/><text class="num-single" x="39.13" y="23.62" dx="0" dy="-0.5">2</text></g>
<g id="年-bg3"  class="badge-group"><circle cx="30.13" cy="40.09" r="3.5" fill="#09bf09"/><text class="num-single" x="30.13" y="40.09" dx="0" dy="-0.5">3</text></g>
<g id="年-bg4"  class="badge-group"><circle cx="33.75" cy="48.0" r="3.5" fill="#09bfbf"/><text class="num-single" x="33.75" y="48.0" dx="0" dy="-0.5">4</text></g>
<g id="年-bg5"  class="badge-group"><circle cx="13.88" cy="67.74" r="3.5" fill="#0909bf"/><text class="num-single" x="13.88" y="67.74" dx="0" dy="-0.5">5</text></g>
<g id="年-bg6"  class="badge-group"><circle cx="56.56" cy="25.46" r="3.5" fill="#bf09bf"/><text class="num-single" x="56.56" y="25.46" dx="0" dy="-0.5">6</text></g>
</svg>