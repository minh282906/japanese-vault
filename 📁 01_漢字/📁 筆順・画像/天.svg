<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (天)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #天-bg[i]: Thời gian quả bóng số nảy lên
   - #天-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#天-bg1  { animation-delay: 0.05s; }
#天-s1   { stroke-dasharray: 63.7218; stroke-dashoffset: 63.7218; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#天-bg2  { animation-delay: 0.55s; }
#天-s2   { stroke-dasharray: 58.2123; stroke-dashoffset: 58.2123; animation: drawStroke 0.32s ease-out 0.68s forwards; }
#天-bg3  { animation-delay: 1.02s; }
#天-s3   { stroke-dasharray: 78.4912; stroke-dashoffset: 78.4912; animation: drawStroke 0.43s ease-out 1.15s forwards; }
#天-bg4  { animation-delay: 1.60s; }
#天-s4   { stroke-dasharray: 60.0734; stroke-dashoffset: 60.0734; animation: drawStroke 0.33s ease-out 1.73s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #天-s[i]) -->
<path id="天-s1"  class="stroke" stroke="#bf0909" d="M21.63,24.83C23.439999999999998,25.29,26.77,25.229999999999997,28.57,25.04C43.120000000000005,23.509999999999998,63.75,20.88,78.67,19.79C81.68,19.57,83.5,20.009999999999998,85.01,20.24"/>
<path id="天-s2"  class="stroke" stroke="#64bf09" d="M25.31,51.64C27.4,51.95,28.779999999999998,52.04,31.25,51.75C41.87,50.5,67.13,47.37,77.21000000000001,46.82C78.95,46.72,80.83000000000001,46.85,83.2,47.27"/>
<path id="天-s3"  class="stroke" stroke="#09bfbf" d="M50.32,26C51,27,51.62,29.43,51.61,31.37C51.37,61.88,36.75,82.25,17.75,91.62"/>
<path id="天-s4"  class="stroke" stroke="#6409bf" d="M50.1,51.39C58.71,60,75.07,78.48,86.59,87.05C88.92,88.78,91,90.13,94.5,91.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="天-bg1"  class="badge-group"><circle cx="21.63" cy="24.83" r="3.5" fill="#bf0909"/><text class="num-single" x="21.63" y="24.83" dx="0" dy="-0.5">1</text></g>
<g id="天-bg2"  class="badge-group"><circle cx="25.31" cy="51.64" r="3.5" fill="#64bf09"/><text class="num-single" x="25.31" y="51.64" dx="0" dy="-0.5">2</text></g>
<g id="天-bg3"  class="badge-group"><circle cx="50.32" cy="26" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.32" y="26" dx="0" dy="-0.5">3</text></g>
<g id="天-bg4"  class="badge-group"><circle cx="50.1" cy="51.39" r="3.5" fill="#6409bf"/><text class="num-single" x="50.1" y="51.39" dx="0" dy="-0.5">4</text></g>
</svg>