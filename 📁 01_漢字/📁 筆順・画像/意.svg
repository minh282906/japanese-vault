<path id="意-s7"  class="stroke" stroke="#09bf95" d="M32.28,49.99C42.160000000000004,49.22,65.5,47.13,70.19,46.81C73.12,46.61,74.57,47.46,74,50.5C73.38,53.82,72.39,60.78,71.19,66.8C70.94,68.03,70.71,69.19,70.5,70.25"/>
<path id="意-s8"  class="stroke" stroke="#0995bf" d="M33.75,60C40.25,59.5,66.47,57.4,71.5,57.25"/>
<path id="意-s9"  class="stroke" stroke="#0941bf" d="M34.86,70C42.25,69.37,61.04,68.07,69.55,67.82"/>
<path id="意-s10"  class="stroke" stroke="#2509bf" d="M20.28,84.31C19.37,88.5,17.25,92.87,13.150000000000002,97.25"/>
<path id="意-s11"  class="stroke" stroke="#7909bf" d="M33.14,81.65C42.5,94.5,54.66,100.43,75.75,98.91000000000001C83.25,98.37,83.25,96.25000000000001,77.63,92.22000000000001"/>
<path id="意-s12"  class="stroke" stroke="#bf09b1" d="M50.58,78.25C52.23,80.7,56.75,85.75,58.75,81"/>
<path id="意-s13"  class="stroke" stroke="#bf095d" d="M82.75,77.25C85.63,78.87,89.63,82.75,92.5,87.48"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="意-bg1"  class="badge-group"><circle cx="51.22" cy="10" r="3.5" fill="#bf0909"/><text class="num-single" x="51.22" y="10" dx="0" dy="-0.5">1</text></g>
