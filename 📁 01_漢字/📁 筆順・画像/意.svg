<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (意)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #意-bg[i]: Thời gian quả bóng số nảy lên
   - #意-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#意-bg1  { animation-delay: 0.05s; }
#意-s1   { stroke-dasharray: 9.9092; stroke-dashoffset: 9.9092; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#意-bg2  { animation-delay: 0.42s; }
#意-s2   { stroke-dasharray: 53.4737; stroke-dashoffset: 53.4737; animation: drawStroke 0.29s ease-out 0.55s forwards; }
#意-bg3  { animation-delay: 0.86s; }
#意-s3   { stroke-dasharray: 12.1907; stroke-dashoffset: 12.1907; animation: drawStroke 0.22s ease-out 0.99s forwards; }
#意-bg4  { animation-delay: 1.23s; }
#意-s4   { stroke-dasharray: 14.4569; stroke-dashoffset: 14.4569; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#意-bg5  { animation-delay: 1.60s; }
#意-s5   { stroke-dasharray: 82.9834; stroke-dashoffset: 82.9834; animation: drawStroke 0.46s ease-out 1.73s forwards; }
#意-bg6  { animation-delay: 2.21s; }
#意-s6   { stroke-dasharray: 24.6674; stroke-dashoffset: 24.6674; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#意-bg7  { animation-delay: 2.58s; }
#意-s7   { stroke-dasharray: 64.7260; stroke-dashoffset: 64.7260; animation: drawStroke 0.36s ease-out 2.71s forwards; }
#意-bg8  { animation-delay: 3.09s; }
#意-s8   { stroke-dasharray: 37.8511; stroke-dashoffset: 37.8511; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#意-bg9  { animation-delay: 3.46s; }
#意-s9   { stroke-dasharray: 34.7610; stroke-dashoffset: 34.7610; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#意-bg10  { animation-delay: 3.83s; }
#意-s10   { stroke-dasharray: 14.9589; stroke-dashoffset: 14.9589; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#意-bg11  { animation-delay: 4.20s; }
#意-s11   { stroke-dasharray: 61.2510; stroke-dashoffset: 61.2510; animation: drawStroke 0.34s ease-out 4.33s forwards; }
#意-bg12  { animation-delay: 4.69s; }
#意-s12   { stroke-dasharray: 10.9778; stroke-dashoffset: 10.9778; animation: drawStroke 0.22s ease-out 4.82s forwards; }
#意-bg13  { animation-delay: 5.06s; }
#意-s13   { stroke-dasharray: 14.2617; stroke-dashoffset: 14.2617; animation: drawStroke 0.22s ease-out 5.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

