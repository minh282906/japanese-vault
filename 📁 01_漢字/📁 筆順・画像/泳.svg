<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (泳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #泳-bg[i]: Thời gian quả bóng số nảy lên
   - #泳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#泳-bg1  { animation-delay: 0.05s; }
#泳-s1   { stroke-dasharray: 12.6527; stroke-dashoffset: 12.6527; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#泳-bg2  { animation-delay: 0.42s; }
#泳-s2   { stroke-dasharray: 13.3593; stroke-dashoffset: 13.3593; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#泳-bg3  { animation-delay: 0.79s; }
#泳-s3   { stroke-dasharray: 22.6261; stroke-dashoffset: 22.6261; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#泳-bg4  { animation-delay: 1.16s; }
#泳-s4   { stroke-dasharray: 13.9739; stroke-dashoffset: 13.9739; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#泳-bg5  { animation-delay: 1.53s; }
#泳-s5   { stroke-dasharray: 88.7330; stroke-dashoffset: 88.7330; animation: drawStroke 0.49s ease-out 1.66s forwards; }
#泳-bg6  { animation-delay: 2.17s; }
#泳-s6   { stroke-dasharray: 55.3526; stroke-dashoffset: 55.3526; animation: drawStroke 0.30s ease-out 2.30s forwards; }
#泳-bg7  { animation-delay: 2.62s; }
#泳-s7   { stroke-dasharray: 23.0394; stroke-dashoffset: 23.0394; animation: drawStroke 0.22s ease-out 2.75s forwards; }
#泳-bg8  { animation-delay: 2.99s; }
#泳-s8   { stroke-dasharray: 40.0577; stroke-dashoffset: 40.0577; animation: drawStroke 0.22s ease-out 3.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #泳-s[i]) -->
<path id="泳-s1"  class="stroke" stroke="#bf0909" d="M19.88,21.75C23.63,22.91,29.56,26.53,30.5,28.34"/>
<path id="泳-s2"  class="stroke" stroke="#bf9109" d="M15.75,44.5C19.81,45.65,26.23,49.22,27.25,51"/>
<path id="泳-s3"  class="stroke" stroke="#64bf09" d="M16,91.21C18,91.63,19.31,91.07,20.25,89.46C23,84.75999999999999,25.25,79.50999999999999,27.75,73.50999999999999"/>
<path id="泳-s4"  class="stroke" stroke="#09bf36" d="M54.25,13.5C59.08,15.97,62.94,19.36,64.39,22.75"/>
<path id="泳-s5"  class="stroke" stroke="#09bfbf" d="M44.69,35.25C45.879999999999995,35.66,47.47,35.87,49.32,35.56C52.75,35,57.21,33.42,61.47,32.92C63.22,32.71,65.25,34,65.25,37.25C65.25,53,64.77,84.97,64.76,89.52000000000001C64.75,97.50000000000001,58.75000000000001,91.50000000000001,56.290000000000006,89.44000000000001"/>
<path id="泳-s6"  class="stroke" stroke="#0936bf" d="M34.25,57.21C35.52,57.44,36.95,57.42,38.28,57.160000000000004C42.88,56.25000000000001,47.42,55.06,49.53,54.160000000000004C51.65,53.25000000000001,53.47,54.89,52.71,56.88C48.61,67.60000000000001,41.79,78.32000000000001,33.519999999999996,84.63"/>
<path id="泳-s7"  class="stroke" stroke="#6409bf" d="M84.73,39.85C84.75,40.88,84.4,41.980000000000004,83.77000000000001,42.71C80.13000000000001,46.910000000000004,73.26,52.03,67.61000000000001,54.14"/>
<path id="泳-s8"  class="stroke" stroke="#bf0991" d="M66.75,54.62C72.43,62.37,81.53999999999999,72.53999999999999,88.52,78.24C90.63,79.96,92.11,81.5,95.13,82.36999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="泳-bg1"  class="badge-group"><circle cx="19.88" cy="21.75" r="3.5" fill="#bf0909"/><text class="num-single" x="19.88" y="21.75" dx="0" dy="-0.5">1</text></g>
<g id="泳-bg2"  class="badge-group"><circle cx="15.75" cy="44.5" r="3.5" fill="#bf9109"/><text class="num-single" x="15.75" y="44.5" dx="0" dy="-0.5">2</text></g>
<g id="泳-bg3"  class="badge-group"><circle cx="16" cy="91.21" r="3.5" fill="#64bf09"/><text class="num-single" x="16" y="91.21" dx="0" dy="-0.5">3</text></g>
<g id="泳-bg4"  class="badge-group"><circle cx="54.25" cy="13.5" r="3.5" fill="#09bf36"/><text class="num-single" x="54.25" y="13.5" dx="0" dy="-0.5">4</text></g>
<g id="泳-bg5"  class="badge-group"><circle cx="44.69" cy="35.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.69" y="35.25" dx="0" dy="-0.5">5</text></g>
<g id="泳-bg6"  class="badge-group"><circle cx="34.25" cy="57.21" r="3.5" fill="#0936bf"/><text class="num-single" x="34.25" y="57.21" dx="0" dy="-0.5">6</text></g>
<g id="泳-bg7"  class="badge-group"><circle cx="84.73" cy="39.85" r="3.5" fill="#6409bf"/><text class="num-single" x="84.73" y="39.85" dx="0" dy="-0.5">7</text></g>
<g id="泳-bg8"  class="badge-group"><circle cx="66.75" cy="54.62" r="3.5" fill="#bf0991"/><text class="num-single" x="66.75" y="54.62" dx="0" dy="-0.5">8</text></g>
</svg>