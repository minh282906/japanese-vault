<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (能)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #能-bg[i]: Thời gian quả bóng số nảy lên
   - #能-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#能-bg1  { animation-delay: 0.05s; }
#能-s1   { stroke-dasharray: 58.2602; stroke-dashoffset: 58.2602; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#能-bg2  { animation-delay: 0.52s; }
#能-s2   { stroke-dasharray: 17.0292; stroke-dashoffset: 17.0292; animation: drawStroke 0.22s ease-out 0.65s forwards; }
#能-bg3  { animation-delay: 0.89s; }
#能-s3   { stroke-dasharray: 49.3944; stroke-dashoffset: 49.3944; animation: drawStroke 0.27s ease-out 1.02s forwards; }
#能-bg4  { animation-delay: 1.31s; }
#能-s4   { stroke-dasharray: 77.6819; stroke-dashoffset: 77.6819; animation: drawStroke 0.43s ease-out 1.44s forwards; }
#能-bg5  { animation-delay: 1.89s; }
#能-s5   { stroke-dasharray: 22.2169; stroke-dashoffset: 22.2169; animation: drawStroke 0.22s ease-out 2.02s forwards; }
#能-bg6  { animation-delay: 2.26s; }
#能-s6   { stroke-dasharray: 21.9228; stroke-dashoffset: 21.9228; animation: drawStroke 0.22s ease-out 2.39s forwards; }
#能-bg7  { animation-delay: 2.63s; }
#能-s7   { stroke-dasharray: 27.5475; stroke-dashoffset: 27.5475; animation: drawStroke 0.22s ease-out 2.76s forwards; }
#能-bg8  { animation-delay: 3.00s; }
#能-s8   { stroke-dasharray: 66.5481; stroke-dashoffset: 66.5481; animation: drawStroke 0.37s ease-out 3.13s forwards; }
#能-bg9  { animation-delay: 3.52s; }
#能-s9   { stroke-dasharray: 27.7591; stroke-dashoffset: 27.7591; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#能-bg10  { animation-delay: 3.89s; }
#能-s10   { stroke-dasharray: 69.5137; stroke-dashoffset: 69.5137; animation: drawStroke 0.38s ease-out 4.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #能-s[i]) -->
<path id="能-s1"  class="stroke" stroke="#bf0909" d="M32.94,13.25C33.37,14.13,33.089999999999996,15.18,32.79,15.75C29.12,22.62,24.38,29,19.31,35.48C17.9,37.279999999999994,18.029999999999998,38.4,20.279999999999998,37.919999999999995C26.879999999999995,36.49999999999999,38.26,34.129999999999995,47.06,32.31999999999999"/>
