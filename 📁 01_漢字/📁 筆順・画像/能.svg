<path id="能-s4"  class="stroke" stroke="#2dbf09" d="M24.21,48.79C26.1,48.63,42.9,46,44.28,45.73C46.120000000000005,45.37,47.42,46.87,47.42,49.04C47.42,50.019999999999996,47.45,76.5,47.45,90.02C47.45,98.39,42.43000000000001,93.17,40.86,91.72"/>
<path id="能-s5"  class="stroke" stroke="#09bf52" d="M24.21,61.18C30.650000000000002,60.22,40.67,59.52,46.32,59.04"/>
<path id="能-s6"  class="stroke" stroke="#09bfbf" d="M24.18,73.64C29.21,73.16,40.2,71.96,46.01,71.64"/>
<path id="能-s7"  class="stroke" stroke="#0952bf" d="M85.72,19.7C85.72,20.75,84.75,21.75,83.65,22.54C79.93,25.23,72.68,28.77,62.02000000000001,32.58"/>
<path id="能-s8"  class="stroke" stroke="#2d09bf" d="M58.84,14C59.730000000000004,14.89,60.230000000000004,16.12,60.230000000000004,17.259999999999998C60.230000000000004,17.959999999999997,60.17,36.91,60.190000000000005,39.01C60.25000000000001,46.12,61.75000000000001,48.07,75.96000000000001,48.07C89.25,48.07,90.47000000000001,45.88,90.47000000000001,39.75"/>
<path id="能-s9"  class="stroke" stroke="#9a09bf" d="M87.97,62.7C87.88,63.88,86.88,65.25,85.73,65.92C81.19,68.58,74.37,71.88,64.02000000000001,75.33"/>
<path id="能-s10"  class="stroke" stroke="#bf0976" d="M60.59,56.5C61.230000000000004,57.14,61.980000000000004,58.5,61.980000000000004,59.76C61.980000000000004,62.879999999999995,61.940000000000005,82.41,61.940000000000005,84.50999999999999C61.940000000000005,92.63,64,94.57,77.96000000000001,94.57C91,94.57,92.47000000000001,92,92.47000000000001,87.25"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="能-bg1"  class="badge-group"><circle cx="32.94" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="32.94" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="能-bg2"  class="badge-group"><circle cx="41.97" cy="24.63" r="3.5" fill="#bf7609"/><text class="num-single" x="41.97" y="24.63" dx="0" dy="-0.5">2</text></g>
