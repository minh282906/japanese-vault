<path id="進-s4"  class="stroke" stroke="#4bbf09" d="M49.76,33.27C56.489999999999995,32.49,74.12,30.1,83.14,29.190000000000005C85.45,28.960000000000004,87.2,28.840000000000003,88.05,28.890000000000004"/>
<path id="進-s5"  class="stroke" stroke="#09bf2a" d="M69.12,33.66C69.92,34.459999999999994,70.35000000000001,35.75,70.35000000000001,37.239999999999995C70.35000000000001,43.99999999999999,70.15,60.75,70.15,70.35"/>
<path id="進-s6"  class="stroke" stroke="#09bf8d" d="M49.77,46.1C56.13,45.45,72.63,43.25,80.37,42.54C82.41000000000001,42.35,83.87,42.13,85.35000000000001,42.48"/>
<path id="進-s7"  class="stroke" stroke="#098dbf" d="M50.55,58.57C57.47,58.01,74.00999999999999,56.04,81.97999999999999,55.47C83.57999999999998,55.36,85.39999999999999,55.29,86.22999999999999,55.37"/>
<path id="進-s8"  class="stroke" stroke="#092abf" d="M50.42,73.11C57.24,72.32,76.99000000000001,70.63,86.62,70.06C88.94,69.92,90.67,69.88,91.5,69.97"/>
<path id="進-s9"  class="stroke" stroke="#4b09bf" d="M20.38,18.75C24.22,20.63,30.299999999999997,26.46,31.259999999999998,29.380000000000003"/>
<path id="進-s10"  class="stroke" stroke="#ae09bf" d="M13.25,50.5C15.5,51.5,17,51,18,50.75S25.77,48.06,27.25,47.5C31.25,46,32.39,47.06,29.75,52C23.88,63,24,59.88,30.5,68C32.16,70.08,32,71,29.5,73.5C28.12,74.88,21.5,81,20,81.5"/>
<path id="進-s11"  class="stroke" stroke="#bf096c" d="M15.25,83.5C18.25,83,24.17,82.19,28.75,82.75C38,83.87,58.82,90.46,63.25,91.75C75.25,95.25,81.25,95.75,90.25,94.75"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="進-bg1"  class="badge-group"><circle cx="54.54" cy="14.25" r="3.5" fill="#bf0909"/><text class="num-single" x="54.54" y="14.25" dx="0" dy="-0.5">1</text></g>
<g id="進-bg2"  class="badge-group"><circle cx="48.14" cy="28.18" r="3.5" fill="#bf6c09"/><text class="num-single" x="48.14" y="28.18" dx="0" dy="-0.5">2</text></g>
