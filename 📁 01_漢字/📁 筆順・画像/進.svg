<g id="進-bg9"  class="badge-group"><circle cx="20.38" cy="18.75" r="3.5" fill="#4b09bf"/><text class="num-single" x="20.38" y="18.75" dx="0" dy="-0.5">9</text></g>
<g id="進-bg10" class="badge-group"><circle cx="13.25" cy="50.5" r="3.5" fill="#ae09bf"/><text class="num-double" x="13.25" y="50.5" dx="-0.4" dy="-0.475">10</text></g>
