<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (進)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #進-bg[i]: Thời gian quả bóng số nảy lên
   - #進-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#進-bg1  { animation-delay: 0.05s; }
#進-s1   { stroke-dasharray: 33.8447; stroke-dashoffset: 33.8447; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#進-bg2  { animation-delay: 0.42s; }
#進-s2   { stroke-dasharray: 48.1700; stroke-dashoffset: 48.1700; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#進-bg3  { animation-delay: 0.83s; }
#進-s3   { stroke-dasharray: 15.1698; stroke-dashoffset: 15.1698; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#進-bg4  { animation-delay: 1.20s; }
#進-s4   { stroke-dasharray: 38.5515; stroke-dashoffset: 38.5515; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#進-bg5  { animation-delay: 1.57s; }
#進-s5   { stroke-dasharray: 36.9921; stroke-dashoffset: 36.9921; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#進-bg6  { animation-delay: 1.94s; }
#進-s6   { stroke-dasharray: 35.8115; stroke-dashoffset: 35.8115; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#進-bg7  { animation-delay: 2.31s; }
#進-s7   { stroke-dasharray: 35.8377; stroke-dashoffset: 35.8377; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#進-bg8  { animation-delay: 2.68s; }
#進-s8   { stroke-dasharray: 41.2153; stroke-dashoffset: 41.2153; animation: drawStroke 0.23s ease-out 2.81s forwards; }
#進-bg9  { animation-delay: 3.06s; }
#進-s9   { stroke-dasharray: 15.4320; stroke-dashoffset: 15.4320; animation: drawStroke 0.22s ease-out 3.19s forwards; }
#進-bg10  { animation-delay: 3.43s; }
#進-s10   { stroke-dasharray: 61.3326; stroke-dashoffset: 61.3326; animation: drawStroke 0.34s ease-out 3.56s forwards; }
#進-bg11  { animation-delay: 3.92s; }
#進-s11   { stroke-dasharray: 76.6376; stroke-dashoffset: 76.6376; animation: drawStroke 0.42s ease-out 4.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #進-s[i]) -->
<path id="進-s1"  class="stroke" stroke="#bf0909" d="M54.54,14.25C54.699999999999996,15.73,54.5,17.67,53.98,18.94C50.669999999999995,27.020000000000003,46.48,33.870000000000005,38.91,43.7"/>
<path id="進-s2"  class="stroke" stroke="#bf6c09" d="M48.14,31.68C48.92,32.46,49.35,33.37,49.35,34.37C49.35,44.879999999999995,49.39,64.07,49.370000000000005,74.63C49.370000000000005,76.75999999999999,49.36000000000001,78.44999999999999,49.36000000000001,79.50999999999999"/>
