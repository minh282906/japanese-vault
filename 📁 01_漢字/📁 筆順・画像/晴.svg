<path id="晴-s8"  class="stroke" stroke="#0964bf" d="M44.63,46.64C46.86,47.2,49.160000000000004,47.02,51.410000000000004,46.77C62.1,45.580000000000005,82.76,43.32,91.87,42.61C94.03,42.44,96.82000000000001,42.54,98.75,43.12"/>
<path id="晴-s9"  class="stroke" stroke="#0909bf" d="M54.65,54.97C55.65,55.97,56.089999999999996,57,56.089999999999996,58.26C56.089999999999996,62.26,56.029999999999994,78.88,56.029999999999994,94.02C56.029999999999994,95.75,56.029999999999994,97.38,56.029999999999994,98.74"/>
<path id="晴-s10"  class="stroke" stroke="#6409bf" d="M56.79,56.11C63.85,55.23,81.92,52.87,83.3,52.74C86.48,52.440000000000005,87.27,53.75,87.27,56.07C87.27,59.01,86.67,81.84,86.67,93.9C86.67,102.51,83.24,97.26,80.92,94.74000000000001"/>
<path id="晴-s11"  class="stroke" stroke="#bf09bf" d="M57.28,67.03C62.370000000000005,66.5,78.25,65.13,85.88,64.6"/>
<path id="晴-s12"  class="stroke" stroke="#bf0964" d="M57.88,79.02C64,78.61999999999999,77.25,77.25,85.49000000000001,76.94"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
