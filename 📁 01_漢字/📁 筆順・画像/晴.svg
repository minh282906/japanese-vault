<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (晴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #晴-bg[i]: Thời gian quả bóng số nảy lên
   - #晴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#晴-bg1  { animation-delay: 0.05s; }
#晴-s1   { stroke-dasharray: 43.1347; stroke-dashoffset: 43.1347; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#晴-bg2  { animation-delay: 0.44s; }
#晴-s2   { stroke-dasharray: 63.3625; stroke-dashoffset: 63.3625; animation: drawStroke 0.35s ease-out 0.57s forwards; }
#晴-bg3  { animation-delay: 0.94s; }
#晴-s3   { stroke-dasharray: 19.6595; stroke-dashoffset: 19.6595; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#晴-bg4  { animation-delay: 1.31s; }
#晴-s4   { stroke-dasharray: 19.7568; stroke-dashoffset: 19.7568; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#晴-bg5  { animation-delay: 1.68s; }
#晴-s5   { stroke-dasharray: 38.8694; stroke-dashoffset: 38.8694; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#晴-bg6  { animation-delay: 2.05s; }
#晴-s6   { stroke-dasharray: 34.8668; stroke-dashoffset: 34.8668; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#晴-bg7  { animation-delay: 2.42s; }
#晴-s7   { stroke-dasharray: 36.6661; stroke-dashoffset: 36.6661; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#晴-bg8  { animation-delay: 2.79s; }
#晴-s8   { stroke-dasharray: 54.4261; stroke-dashoffset: 54.4261; animation: drawStroke 0.30s ease-out 2.92s forwards; }
#晴-bg9  { animation-delay: 3.24s; }
#晴-s9   { stroke-dasharray: 44.1763; stroke-dashoffset: 44.1763; animation: drawStroke 0.24s ease-out 3.37s forwards; }
#晴-bg10  { animation-delay: 3.63s; }
#晴-s10   { stroke-dasharray: 81.9869; stroke-dashoffset: 81.9869; animation: drawStroke 0.45s ease-out 3.76s forwards; }
#晴-bg11  { animation-delay: 4.23s; }
#晴-s11   { stroke-dasharray: 28.7037; stroke-dashoffset: 28.7037; animation: drawStroke 0.22s ease-out 4.36s forwards; }
#晴-bg12  { animation-delay: 4.60s; }
#晴-s12   { stroke-dasharray: 27.6902; stroke-dashoffset: 27.6902; animation: drawStroke 0.22s ease-out 4.73s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

