<path id="断-s4"  class="stroke" stroke="#4bbf09" d="M36.52,14C37.45,14.93,38.09,16.62,38.09,17.71C38.09,18.490000000000002,38.14,54.99,37.980000000000004,70.25999999999999C37.95,73.19,37.92,75.32999999999998,37.88,76.24"/>
<path id="断-s5"  class="stroke" stroke="#09bf2a" d="M36.98,44.9C36.98,45.75,36.69,47.129999999999995,36.309999999999995,48.12C32.379999999999995,58.379999999999995,27.629999999999995,67.88,20.639999999999993,75.6"/>
<path id="断-s6"  class="stroke" stroke="#09bf8d" d="M40.5,51.25C44.03,54.18,49.5,60.75,51.56,65.81"/>
<path id="断-s7"  class="stroke" stroke="#098dbf" d="M12.52,26.5C13.45,27.43,13.84,29,13.84,30.21C13.84,31.87,13.64,73.87,13.64,82.5C13.64,85.12,14.270000000000001,87.17,16.76,86.75C24.880000000000003,85.37,35.64,83.37,48.010000000000005,82.25C49.50000000000001,82.11,50.760000000000005,82.25,52.010000000000005,82.25"/>
<path id="断-s8"  class="stroke" stroke="#092abf" d="M79.42,12C79.47,12.47,79.34,13.61,79.07000000000001,14.15C76,20.5,70.25,26.5,62.96,32.83"/>
<path id="断-s9"  class="stroke" stroke="#4b09bf" d="M60.47,32.47C61.56,33.56,62.14,35.129999999999995,62.17,36.66C62.75,66.63,59.88,80.75,52.81,92.58"/>
<path id="断-s10"  class="stroke" stroke="#ae09bf" d="M64.21,44.01C65.61,43.879999999999995,67.33,43.699999999999996,69.24,43.47C77.52,42.51,88.22999999999999,40.98,93.86,40.339999999999996C95.38,40.169999999999995,97.5,39.589999999999996,98.99,40.11"/>
<path id="断-s11"  class="stroke" stroke="#bf096c" d="M81.03,45.54C81.87,46.38,82.35,48,82.35,49.62C82.35,50.66,82.28,88.63,82.28,94C82.28,97.13,82.23,99.6,82.2,101"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="断-bg1"  class="badge-group"><circle cx="24.11" cy="25.58" r="3.5" fill="#bf0909"/><text class="num-single" x="24.11" y="25.58" dx="0" dy="-0.5">1</text></g>
<g id="断-bg2"  class="badge-group"><circle cx="52.07" cy="21.21" r="3.5" fill="#bf6c09"/><text class="num-single" x="52.07" y="21.21" dx="0" dy="-0.5">2</text></g>
