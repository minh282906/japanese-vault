<g id="断-bg9"  class="badge-group"><circle cx="60.47" cy="32.47" r="3.5" fill="#4b09bf"/><text class="num-single" x="60.47" y="32.47" dx="0" dy="-0.5">9</text></g>
<g id="断-bg10" class="badge-group"><circle cx="64.21" cy="44.01" r="3.5" fill="#ae09bf"/><text class="num-double" x="64.21" y="44.01" dx="-0.4" dy="-0.475">10</text></g>
