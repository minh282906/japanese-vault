<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (断)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #断-bg[i]: Thời gian quả bóng số nảy lên
   - #断-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#断-bg1  { animation-delay: 0.05s; }
#断-s1   { stroke-dasharray: 12.9395; stroke-dashoffset: 12.9395; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#断-bg2  { animation-delay: 0.42s; }
#断-s2   { stroke-dasharray: 15.9190; stroke-dashoffset: 15.9190; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#断-bg3  { animation-delay: 0.79s; }
#断-s3   { stroke-dasharray: 31.2755; stroke-dashoffset: 31.2755; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#断-bg4  { animation-delay: 1.16s; }
#断-s4   { stroke-dasharray: 62.6429; stroke-dashoffset: 62.6429; animation: drawStroke 0.34s ease-out 1.29s forwards; }
#断-bg5  { animation-delay: 1.65s; }
#断-s5   { stroke-dasharray: 35.1214; stroke-dashoffset: 35.1214; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#断-bg6  { animation-delay: 2.02s; }
#断-s6   { stroke-dasharray: 18.4200; stroke-dashoffset: 18.4200; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#断-bg7  { animation-delay: 2.39s; }
#断-s7   { stroke-dasharray: 98.1439; stroke-dashoffset: 98.1439; animation: drawStroke 0.54s ease-out 2.52s forwards; }
#断-bg8  { animation-delay: 3.08s; }
#断-s8   { stroke-dasharray: 27.0269; stroke-dashoffset: 27.0269; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#断-bg9  { animation-delay: 3.45s; }
#断-s9   { stroke-dasharray: 62.0888; stroke-dashoffset: 62.0888; animation: drawStroke 0.34s ease-out 3.58s forwards; }
#断-bg10  { animation-delay: 3.94s; }
#断-s10   { stroke-dasharray: 35.0596; stroke-dashoffset: 35.0596; animation: drawStroke 0.22s ease-out 4.07s forwards; }
#断-bg11  { animation-delay: 4.31s; }
#断-s11   { stroke-dasharray: 55.7670; stroke-dashoffset: 55.7670; animation: drawStroke 0.31s ease-out 4.44s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #断-s[i]) -->
<path id="断-s1"  class="stroke" stroke="#bf0909" d="M24.11,25.58C26.07,27.74,29.03,33.849999999999994,29.52,37.21"/>
<path id="断-s2"  class="stroke" stroke="#bf6c09" d="M52.07,21.21C52.14,22.07,52.05,22.91,51.75,23.71C50.5,27.01,48.5,30.89,45.07,35.24"/>
