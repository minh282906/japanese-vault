<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (畳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #畳-bg[i]: Thời gian quả bóng số nảy lên
   - #畳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#畳-bg1  { animation-delay: 0.05s; }
#畳-s1   { stroke-dasharray: 25.8403; stroke-dashoffset: 25.8403; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#畳-bg2  { animation-delay: 0.42s; }
#畳-s2   { stroke-dasharray: 71.7364; stroke-dashoffset: 71.7364; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#畳-bg3  { animation-delay: 0.96s; }
#畳-s3   { stroke-dasharray: 19.0944; stroke-dashoffset: 19.0944; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#畳-bg4  { animation-delay: 1.33s; }
#畳-s4   { stroke-dasharray: 43.0477; stroke-dashoffset: 43.0477; animation: drawStroke 0.24s ease-out 1.46s forwards; }
#畳-bg5  { animation-delay: 1.72s; }
#畳-s5   { stroke-dasharray: 40.2169; stroke-dashoffset: 40.2169; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#畳-bg6  { animation-delay: 2.09s; }
#畳-s6   { stroke-dasharray: 17.6677; stroke-dashoffset: 17.6677; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#畳-bg7  { animation-delay: 2.46s; }
#畳-s7   { stroke-dasharray: 80.3048; stroke-dashoffset: 80.3048; animation: drawStroke 0.44s ease-out 2.59s forwards; }
#畳-bg8  { animation-delay: 3.05s; }
#畳-s8   { stroke-dasharray: 36.8609; stroke-dashoffset: 36.8609; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#畳-bg9  { animation-delay: 3.42s; }
#畳-s9   { stroke-dasharray: 70.6130; stroke-dashoffset: 70.6130; animation: drawStroke 0.39s ease-out 3.55s forwards; }
#畳-bg10  { animation-delay: 3.96s; }
#畳-s10   { stroke-dasharray: 35.5178; stroke-dashoffset: 35.5178; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#畳-bg11  { animation-delay: 4.33s; }
#畳-s11   { stroke-dasharray: 35.2252; stroke-dashoffset: 35.2252; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#畳-bg12  { animation-delay: 4.70s; }
#畳-s12   { stroke-dasharray: 77.8482; stroke-dashoffset: 77.8482; animation: drawStroke 0.43s ease-out 4.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #畳-s[i]) -->
<path id="畳-s1"  class="stroke" stroke="#bf0909" d="M29.65,15.99C30.459999999999997,16.8,30.669999999999998,17.490000000000002,30.82,19C31.43,25.29,31.6,30.42,31.9,37.239999999999995C31.959999999999997,38.64999999999999,32.019999999999996,40.06999999999999,32.07,41.489999999999995"/>
