<path id="畳-s6"  class="stroke" stroke="#09bf64" d="M18.75,46C18.62,50.06,15.58,60.68,14.5,63.1"/>
<path id="畳-s7"  class="stroke" stroke="#09bfbf" d="M19.9,50.02C35,48.25,67.36,44.57,84.41999999999999,44.370000000000005C94.74999999999999,44.25000000000001,88.58999999999999,49.580000000000005,84.24999999999999,52.980000000000004"/>
<path id="畳-s8"  class="stroke" stroke="#0964bf" d="M33.25,57.05C34.16,57.959999999999994,34.51,58.87,34.51,60.16C34.51,61.05,35.47,91.64,35.39,93.55"/>
<path id="畳-s9"  class="stroke" stroke="#0909bf" d="M35.75,58.95C44.5,58,63.370000000000005,55.75,68.21000000000001,55.2C71.52000000000001,54.82,72.39000000000001,55.870000000000005,72.39000000000001,58.690000000000005C72.39000000000001,61.50000000000001,72.37000000000002,81.25,72.37000000000002,90"/>
<path id="畳-s10"  class="stroke" stroke="#6409bf" d="M35.84,70.49C44.36,69.64,63.77,68.16,71.26,67.89999999999999"/>
<path id="畳-s11"  class="stroke" stroke="#bf09bf" d="M36.09,82.28C44,81.5,62,80.12,71.22,79.73"/>
<path id="畳-s12"  class="stroke" stroke="#bf0964" d="M16.29,95.14C19.09,95.96,22.28,95.89,25.13,95.65C41.629999999999995,94.25,61.78999999999999,92.91000000000001,84.01,92.48C87.34,92.42,90.67,92.31,93.89,93.35000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="畳-bg1"  class="badge-group"><circle cx="29.65" cy="12.49" r="3.5" fill="#bf0909"/><text class="num-single" x="29.65" y="12.49" dx="0" dy="-0.5">1</text></g>
