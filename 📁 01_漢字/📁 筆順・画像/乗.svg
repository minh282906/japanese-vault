<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (乗)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #乗-bg[i]: Thời gian quả bóng số nảy lên
   - #乗-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#乗-bg1  { animation-delay: 0.05s; }
#乗-s1   { stroke-dasharray: 38.1343; stroke-dashoffset: 38.1343; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#乗-bg2  { animation-delay: 0.42s; }
#乗-s2   { stroke-dasharray: 60.0304; stroke-dashoffset: 60.0304; animation: drawStroke 0.33s ease-out 0.55s forwards; }
#乗-bg3  { animation-delay: 0.90s; }
#乗-s3   { stroke-dasharray: 77.6021; stroke-dashoffset: 77.6021; animation: drawStroke 0.43s ease-out 1.03s forwards; }
#乗-bg4  { animation-delay: 1.48s; }
#乗-s4   { stroke-dasharray: 25.3342; stroke-dashoffset: 25.3342; animation: drawStroke 0.22s ease-out 1.61s forwards; }
#乗-bg5  { animation-delay: 1.85s; }
#乗-s5   { stroke-dasharray: 26.9066; stroke-dashoffset: 26.9066; animation: drawStroke 0.22s ease-out 1.98s forwards; }
#乗-bg6  { animation-delay: 2.22s; }
#乗-s6   { stroke-dasharray: 65.2177; stroke-dashoffset: 65.2177; animation: drawStroke 0.36s ease-out 2.35s forwards; }
#乗-bg7  { animation-delay: 2.73s; }
#乗-s7   { stroke-dasharray: 78.1073; stroke-dashoffset: 78.1073; animation: drawStroke 0.43s ease-out 2.86s forwards; }
#乗-bg8  { animation-delay: 3.31s; }
#乗-s8   { stroke-dasharray: 45.3208; stroke-dashoffset: 45.3208; animation: drawStroke 0.25s ease-out 3.44s forwards; }
#乗-bg9  { animation-delay: 3.71s; }
#乗-s9   { stroke-dasharray: 45.2157; stroke-dashoffset: 45.2157; animation: drawStroke 0.25s ease-out 3.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #乗-s[i]) -->
<path id="乗-s1"  class="stroke" stroke="#bf0909" d="M68.21,10.39C67.88,11.370000000000001,67.38,12,66.33999999999999,12.5C62.01999999999999,14.59,48.37999999999999,19.37,32.55999999999999,22.22"/>
<path id="乗-s2"  class="stroke" stroke="#bf8209" d="M24,32.7C26.009999999999998,33.24,29.71,33.21,31.71,32.99C46.56,31.37,62.7,29.37,76.71000000000001,28.76C80.06,28.610000000000003,82.07000000000001,29.020000000000003,83.75000000000001,29.290000000000003"/>
<path id="乗-s3"  class="stroke" stroke="#82bf09" d="M14.5,47.95C16.97,48.49,21.5,48.410000000000004,23.96,48.24C40,47.120000000000005,63.12,44.620000000000005,83.23,43.760000000000005C87.34,43.580000000000005,89.81,44.02,91.87,44.290000000000006"/>
<path id="乗-s4"  class="stroke" stroke="#09bf09" d="M34.81,36.63C36.09,37.910000000000004,36.63,38.760000000000005,36.82,40.13C37.75,46.75,38.35,56.95,38.75,61.25"/>
<path id="乗-s5"  class="stroke" stroke="#09bf82" d="M72.81,32.63C73.71000000000001,33.53,73.92,35.230000000000004,73.82000000000001,36.13C73.25,41.38,72,51.75,70.25,59"/>
<path id="乗-s6"  class="stroke" stroke="#0982bf" d="M24,62.05C26.09,62.629999999999995,29.92,62.519999999999996,32,62.36C42.56,61.57,64.6,59.16,81.69,58.64C85.17,58.53,87.25999999999999,58.92,89,59.2"/>
<path id="乗-s7"  class="stroke" stroke="#0909bf" d="M52.56,20.13C53.400000000000006,20.97,54.07,22.75,54.07,24.38C54.07,28.99,54.07,73.3,54.07,91.36999999999999C54.07,94.35,54.07,96.61999999999999,54.07,97.88"/>
<path id="乗-s8"  class="stroke" stroke="#8209bf" d="M50.75,61.25C50.75,61.87,50.05,63.1,49.34,64.06C42.35,73.56,28.38,85.46,17,90.5"/>
<path id="乗-s9"  class="stroke" stroke="#bf0982" d="M56.5,61.5C60.7,64.95,75.92,79.45,84.02,84.96000000000001C86.66,86.76,89.21,88.50000000000001,91.86999999999999,89.37"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="乗-bg1"  class="badge-group"><circle cx="68.21" cy="10.39" r="3.5" fill="#bf0909"/><text class="num-single" x="68.21" y="10.39" dx="0" dy="-0.5">1</text></g>
<g id="乗-bg2"  class="badge-group"><circle cx="24" cy="32.7" r="3.5" fill="#bf8209"/><text class="num-single" x="24" y="32.7" dx="0" dy="-0.5">2</text></g>
<g id="乗-bg3"  class="badge-group"><circle cx="14.5" cy="47.95" r="3.5" fill="#82bf09"/><text class="num-single" x="14.5" y="47.95" dx="0" dy="-0.5">3</text></g>
<g id="乗-bg4"  class="badge-group"><circle cx="34.81" cy="36.63" r="3.5" fill="#09bf09"/><text class="num-single" x="34.81" y="36.63" dx="0" dy="-0.5">4</text></g>
<g id="乗-bg5"  class="badge-group"><circle cx="72.81" cy="32.63" r="3.5" fill="#09bf82"/><text class="num-single" x="72.81" y="32.63" dx="0" dy="-0.5">5</text></g>
<g id="乗-bg6"  class="badge-group"><circle cx="24" cy="62.05" r="3.5" fill="#0982bf"/><text class="num-single" x="24" y="62.05" dx="0" dy="-0.5">6</text></g>
<g id="乗-bg7"  class="badge-group"><circle cx="52.56" cy="20.13" r="3.5" fill="#0909bf"/><text class="num-single" x="52.56" y="20.13" dx="0" dy="-0.5">7</text></g>
<g id="乗-bg8"  class="badge-group"><circle cx="50.75" cy="57.75" r="3.5" fill="#8209bf"/><text class="num-single" x="50.75" y="57.75" dx="0" dy="-0.5">8</text></g>
<g id="乗-bg9"  class="badge-group"><circle cx="56.5" cy="65.0" r="3.5" fill="#bf0982"/><text class="num-single" x="56.5" y="65.0" dx="0" dy="-0.5">9</text></g>
</svg>