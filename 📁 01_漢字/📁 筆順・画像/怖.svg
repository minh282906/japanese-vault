<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (怖)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #怖-bg[i]: Thời gian quả bóng số nảy lên
   - #怖-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#怖-bg1  { animation-delay: 0.05s; }
#怖-s1   { stroke-dasharray: 18.7050; stroke-dashoffset: 18.7050; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#怖-bg2  { animation-delay: 0.42s; }
#怖-s2   { stroke-dasharray: 13.3984; stroke-dashoffset: 13.3984; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#怖-bg3  { animation-delay: 0.79s; }
#怖-s3   { stroke-dasharray: 84.1286; stroke-dashoffset: 84.1286; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#怖-bg4  { animation-delay: 1.40s; }
#怖-s4   { stroke-dasharray: 60.5668; stroke-dashoffset: 60.5668; animation: drawStroke 0.33s ease-out 1.53s forwards; }
#怖-bg5  { animation-delay: 1.88s; }
#怖-s5   { stroke-dasharray: 60.6974; stroke-dashoffset: 60.6974; animation: drawStroke 0.33s ease-out 2.01s forwards; }
#怖-bg6  { animation-delay: 2.36s; }
#怖-s6   { stroke-dasharray: 33.5107; stroke-dashoffset: 33.5107; animation: drawStroke 0.22s ease-out 2.49s forwards; }
#怖-bg7  { animation-delay: 2.73s; }
#怖-s7   { stroke-dasharray: 71.4278; stroke-dashoffset: 71.4278; animation: drawStroke 0.39s ease-out 2.86s forwards; }
#怖-bg8  { animation-delay: 3.27s; }
#怖-s8   { stroke-dasharray: 61.1212; stroke-dashoffset: 61.1212; animation: drawStroke 0.34s ease-out 3.40s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #怖-s[i]) -->
<path id="怖-s1"  class="stroke" stroke="#bf0909" d="M16,38.25C16,44.86,13.03,54.61,12.25,56.5"/>
<path id="怖-s2"  class="stroke" stroke="#bf9109" d="M31.77,34.58C34.17,36.589999999999996,37.96,42.839999999999996,38.56,45.96"/>
<path id="怖-s3"  class="stroke" stroke="#64bf09" d="M24.37,13.75C25.43,14.81,25.830000000000002,16.25,25.830000000000002,17.5C25.830000000000002,18.17,25.87,66.94,25.87,88C25.87,93.63,25.87,97.28,25.86,97.5"/>
<path id="怖-s4"  class="stroke" stroke="#09bf36" d="M65.46,11.93C65.86999999999999,13.25,65.80999999999999,14.61,65.30999999999999,16.45C61.499999999999986,30.25,54.249999999999986,50.879999999999995,39.859999999999985,65.66"/>
<path id="怖-s5"  class="stroke" stroke="#09bfbf" d="M37.5,30.95C40.88,31.63,43.69,31.52,46.269999999999996,31.18C56.809999999999995,29.8,75.50999999999999,27.04,88.75,25.72C91.7,25.43,94.88,25.22,97.74,26.04"/>
<path id="怖-s6"  class="stroke" stroke="#0936bf" d="M53.73,53.14C54.669999999999995,54.08,54.86,55.38,54.86,56.6C54.86,57.120000000000005,54.75,71.69,54.75,80.75C54.75,83.61,54.77,85.36,54.75,86.37"/>
<path id="怖-s7"  class="stroke" stroke="#6409bf" d="M55.73,55.03C61,54.25,78.75,51.5,83.72999999999999,50.7C86.80999999999999,50.2,88.11999999999999,52.38,88.11999999999999,54.78C88.11999999999999,64.38,88.61999999999999,72.38,86.8,82.25C85.75,87.93,82.31,82.3,81.42,81.17"/>
<path id="怖-s8"  class="stroke" stroke="#bf0991" d="M69.49,38.13C70.42999999999999,39.07,70.58,40.5,70.58,41.84C70.58,42.38,70.57,74.74000000000001,70.57,90.86000000000001C70.57,95.09000000000002,70.52,98.11000000000001,70.49,98.99000000000001"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="怖-bg1"  class="badge-group"><circle cx="16" cy="38.25" r="3.5" fill="#bf0909"/><text class="num-single" x="16" y="38.25" dx="0" dy="-0.5">1</text></g>
<g id="怖-bg2"  class="badge-group"><circle cx="31.77" cy="31.08" r="3.5" fill="#bf9109"/><text class="num-single" x="31.77" y="31.08" dx="0" dy="-0.5">2</text></g>
<g id="怖-bg3"  class="badge-group"><circle cx="24.37" cy="13.75" r="3.5" fill="#64bf09"/><text class="num-single" x="24.37" y="13.75" dx="0" dy="-0.5">3</text></g>
<g id="怖-bg4"  class="badge-group"><circle cx="65.46" cy="11.93" r="3.5" fill="#09bf36"/><text class="num-single" x="65.46" y="11.93" dx="0" dy="-0.5">4</text></g>
<g id="怖-bg5"  class="badge-group"><circle cx="37.5" cy="34.45" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.5" y="34.45" dx="0" dy="-0.5">5</text></g>
<g id="怖-bg6"  class="badge-group"><circle cx="53.73" cy="49.64" r="3.5" fill="#0936bf"/><text class="num-single" x="53.73" y="49.64" dx="0" dy="-0.5">6</text></g>
<g id="怖-bg7"  class="badge-group"><circle cx="55.73" cy="58.53" r="3.5" fill="#6409bf"/><text class="num-single" x="55.73" y="58.53" dx="0" dy="-0.5">7</text></g>
<g id="怖-bg8"  class="badge-group"><circle cx="69.49" cy="38.13" r="3.5" fill="#bf0991"/><text class="num-single" x="69.49" y="38.13" dx="0" dy="-0.5">8</text></g>
</svg>