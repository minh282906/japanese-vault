<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (判)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #判-bg[i]: Thời gian quả bóng số nảy lên
   - #判-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#判-bg1  { animation-delay: 0.05s; }
#判-s1   { stroke-dasharray: 15.0182; stroke-dashoffset: 15.0182; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#判-bg2  { animation-delay: 0.42s; }
#判-s2   { stroke-dasharray: 19.2275; stroke-dashoffset: 19.2275; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#判-bg3  { animation-delay: 0.79s; }
#判-s3   { stroke-dasharray: 37.1241; stroke-dashoffset: 37.1241; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#判-bg4  { animation-delay: 1.16s; }
#判-s4   { stroke-dasharray: 47.0642; stroke-dashoffset: 47.0642; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#判-bg5  { animation-delay: 1.57s; }
#判-s5   { stroke-dasharray: 85.4363; stroke-dashoffset: 85.4363; animation: drawStroke 0.47s ease-out 1.70s forwards; }
#判-bg6  { animation-delay: 2.19s; }
#判-s6   { stroke-dasharray: 43.1109; stroke-dashoffset: 43.1109; animation: drawStroke 0.24s ease-out 2.32s forwards; }
#判-bg7  { animation-delay: 2.58s; }
#判-s7   { stroke-dasharray: 94.0374; stroke-dashoffset: 94.0374; animation: drawStroke 0.52s ease-out 2.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #判-s[i]) -->
<path id="判-s1"  class="stroke" stroke="#bf0909" d="M18.79,24.46C21.33,26.75,25.349999999999998,33.9,25.98,37.47"/>
<path id="判-s2"  class="stroke" stroke="#bfa509" d="M56.78,18.75C56.89,20,56.68,21.009999999999998,56.11,22.12C54.31,25.560000000000002,51.51,30.51,47.16,35"/>
<path id="判-s3"  class="stroke" stroke="#3dbf09" d="M18.58,48.83C20.22,49.559999999999995,22.669999999999998,49.129999999999995,24.36,48.82C31.439999999999998,47.53,42.9,45.27,49.989999999999995,44.5C51.63999999999999,44.32,53.62,44.38,55.22,44.81"/>
<path id="判-s4"  class="stroke" stroke="#09bf71" d="M13.75,67.59C15.74,68.37,18.52,68.19,20.6,67.86C29.270000000000003,66.47,45.650000000000006,63.41,53.52,62.41C55.71,62.129999999999995,58.11,62.029999999999994,60.25,62.529999999999994"/>
<path id="判-s5"  class="stroke" stroke="#0971bf" d="M36.62,14C37.62,15,38.33,16.88,38.33,18C38.33,23.25,38.37,72.43,38.37,91.5C38.37,96.02,38.37,98.85,38.36,99"/>
<path id="判-s6"  class="stroke" stroke="#3d09bf" d="M69.02,25.83C70,26.75,70.78,28.5,70.78,30.849999999999998C70.78,43.25,70.82000000000001,54.5,70.82000000000001,62.5C70.82000000000001,65.16,70.76,67.25,70.76,68.5"/>
<path id="判-s7"  class="stroke" stroke="#bf09a5" d="M90.27,11.58C91.25,12.5,92.03,14.25,92.03,16.1C92.03,36.25,92.02,81.75,92.02,89.47C92.02,102,84.81,90.97,83.31,89.72"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="判-bg1"  class="badge-group"><circle cx="18.79" cy="24.46" r="3.5" fill="#bf0909"/><text class="num-single" x="18.79" y="24.46" dx="0" dy="-0.5">1</text></g>
<g id="判-bg2"  class="badge-group"><circle cx="56.78" cy="18.75" r="3.5" fill="#bfa509"/><text class="num-single" x="56.78" y="18.75" dx="0" dy="-0.5">2</text></g>
<g id="判-bg3"  class="badge-group"><circle cx="18.58" cy="48.83" r="3.5" fill="#3dbf09"/><text class="num-single" x="18.58" y="48.83" dx="0" dy="-0.5">3</text></g>
<g id="判-bg4"  class="badge-group"><circle cx="13.75" cy="67.59" r="3.5" fill="#09bf71"/><text class="num-single" x="13.75" y="67.59" dx="0" dy="-0.5">4</text></g>
<g id="判-bg5"  class="badge-group"><circle cx="36.62" cy="14" r="3.5" fill="#0971bf"/><text class="num-single" x="36.62" y="14" dx="0" dy="-0.5">5</text></g>
<g id="判-bg6"  class="badge-group"><circle cx="69.02" cy="25.83" r="3.5" fill="#3d09bf"/><text class="num-single" x="69.02" y="25.83" dx="0" dy="-0.5">6</text></g>
<g id="判-bg7"  class="badge-group"><circle cx="90.27" cy="11.58" r="3.5" fill="#bf09a5"/><text class="num-single" x="90.27" y="11.58" dx="0" dy="-0.5">7</text></g>
</svg>