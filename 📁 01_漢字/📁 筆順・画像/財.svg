<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (財)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #財-bg[i]: Thời gian quả bóng số nảy lên
   - #財-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#財-bg1  { animation-delay: 0.05s; }
#財-s1   { stroke-dasharray: 50.4436; stroke-dashoffset: 50.4436; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#財-bg2  { animation-delay: 0.48s; }
#財-s2   { stroke-dasharray: 74.5936; stroke-dashoffset: 74.5936; animation: drawStroke 0.41s ease-out 0.61s forwards; }
#財-bg3  { animation-delay: 1.04s; }
#財-s3   { stroke-dasharray: 22.7082; stroke-dashoffset: 22.7082; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#財-bg4  { animation-delay: 1.41s; }
#財-s4   { stroke-dasharray: 22.9873; stroke-dashoffset: 22.9873; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#財-bg5  { animation-delay: 1.78s; }
#財-s5   { stroke-dasharray: 22.7728; stroke-dashoffset: 22.7728; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#財-bg6  { animation-delay: 2.15s; }
#財-s6   { stroke-dasharray: 19.0373; stroke-dashoffset: 19.0373; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#財-bg7  { animation-delay: 2.52s; }
#財-s7   { stroke-dasharray: 15.3960; stroke-dashoffset: 15.3960; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#財-bg8  { animation-delay: 2.89s; }
#財-s8   { stroke-dasharray: 43.5114; stroke-dashoffset: 43.5114; animation: drawStroke 0.24s ease-out 3.02s forwards; }
#財-bg9  { animation-delay: 3.28s; }
#財-s9   { stroke-dasharray: 90.6315; stroke-dashoffset: 90.6315; animation: drawStroke 0.50s ease-out 3.41s forwards; }
#財-bg10  { animation-delay: 3.93s; }
#財-s10   { stroke-dasharray: 43.8265; stroke-dashoffset: 43.8265; animation: drawStroke 0.24s ease-out 4.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #財-s[i]) -->
<path id="財-s1"  class="stroke" stroke="#bf0909" d="M19.2,21.18C20.009999999999998,21.99,20.189999999999998,23.22,20.189999999999998,24.78C20.189999999999998,33,20.119999999999997,55.67,20.13,67.25C20.13,69.2,20.14,70.65,20.169999999999998,71.39"/>
<path id="財-s2"  class="stroke" stroke="#bf7609" d="M20.86,21.67C23.15,21.48,40.08,18.98,42.16,18.75C43.9,18.56,45.12,19.83,45.12,21.28C45.12,27.130000000000003,45.019999999999996,48.5,45.019999999999996,64.25C45.019999999999996,66.47,45.059999999999995,68.13,45.059999999999995,69.96"/>
<path id="財-s3"  class="stroke" stroke="#9abf09" d="M21.32,36.87C30.25,35.629999999999995,39.120000000000005,34.629999999999995,43.870000000000005,34.209999999999994"/>
<path id="財-s4"  class="stroke" stroke="#2dbf09" d="M21.01,51.95C29.75,51,34.25,50.25,43.85,49.36"/>
<path id="財-s5"  class="stroke" stroke="#09bf52" d="M21.35,68.98C28.5,68,35.75,66.75,43.94,66.14"/>
<path id="財-s6"  class="stroke" stroke="#09bfbf" d="M27.2,75.98C27.49,77.07000000000001,27.29,77.86,26.7,78.65C24.93,81.04,19.22,87.67,15.67,90.49000000000001"/>
<path id="財-s7"  class="stroke" stroke="#0952bf" d="M40.85,74.7C45.010000000000005,77.84,49.69,83.53,50.82,86.28"/>
<path id="財-s8"  class="stroke" stroke="#2d09bf" d="M54.25,37C56.68,37.4,58.8,37.58,61.26,37.31C68.42999999999999,36.53,78.78999999999999,35.09,90.39,33.96C92.78,33.730000000000004,95.13,33.52,97.51,34"/>
<path id="財-s9"  class="stroke" stroke="#9a09bf" d="M80.77,13.58C81.85,14.66,82.53,16.75,82.53,18.6C82.53,33.160000000000004,82.52,85.50999999999999,82.52,90.47C82.52,99.25,75.31,90.97,73.81,89.72"/>
<path id="財-s10"  class="stroke" stroke="#bf0976" d="M81.54,43.75C81.63000000000001,44.46,81.77000000000001,45.6,81.37,46.6C78.87,52.870000000000005,67.87,64.62,51.74000000000001,74.12"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="財-bg1"  class="badge-group"><circle cx="19.2" cy="17.68" r="3.5" fill="#bf0909"/><text class="num-single" x="19.2" y="17.68" dx="0" dy="-0.5">1</text></g>
<g id="財-bg2"  class="badge-group"><circle cx="20.86" cy="25.17" r="3.5" fill="#bf7609"/><text class="num-single" x="20.86" y="25.17" dx="0" dy="-0.5">2</text></g>
<g id="財-bg3"  class="badge-group"><circle cx="21.32" cy="36.87" r="3.5" fill="#9abf09"/><text class="num-single" x="21.32" y="36.87" dx="0" dy="-0.5">3</text></g>
<g id="財-bg4"  class="badge-group"><circle cx="21.01" cy="51.95" r="3.5" fill="#2dbf09"/><text class="num-single" x="21.01" y="51.95" dx="0" dy="-0.5">4</text></g>
<g id="財-bg5"  class="badge-group"><circle cx="21.35" cy="68.98" r="3.5" fill="#09bf52"/><text class="num-single" x="21.35" y="68.98" dx="0" dy="-0.5">5</text></g>
<g id="財-bg6"  class="badge-group"><circle cx="27.2" cy="75.98" r="3.5" fill="#09bfbf"/><text class="num-single" x="27.2" y="75.98" dx="0" dy="-0.5">6</text></g>
<g id="財-bg7"  class="badge-group"><circle cx="40.85" cy="74.7" r="3.5" fill="#0952bf"/><text class="num-single" x="40.85" y="74.7" dx="0" dy="-0.5">7</text></g>
<g id="財-bg8"  class="badge-group"><circle cx="54.25" cy="37" r="3.5" fill="#2d09bf"/><text class="num-single" x="54.25" y="37" dx="0" dy="-0.5">8</text></g>
<g id="財-bg9"  class="badge-group"><circle cx="80.77" cy="13.58" r="3.5" fill="#9a09bf"/><text class="num-single" x="80.77" y="13.58" dx="0" dy="-0.5">9</text></g>
<g id="財-bg10" class="badge-group"><circle cx="81.54" cy="43.75" r="3.5" fill="#bf0976"/><text class="num-double" x="81.54" y="43.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>