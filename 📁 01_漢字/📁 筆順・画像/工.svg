<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (工)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #工-bg[i]: Thời gian quả bóng số nảy lên
   - #工-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#工-bg1  { animation-delay: 0.05s; }
#工-s1   { stroke-dasharray: 55.8435; stroke-dashoffset: 55.8435; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#工-bg2  { animation-delay: 0.51s; }
#工-s2   { stroke-dasharray: 47.1895; stroke-dashoffset: 47.1895; animation: drawStroke 0.26s ease-out 0.64s forwards; }
#工-bg3  { animation-delay: 0.92s; }
#工-s3   { stroke-dasharray: 80.1951; stroke-dashoffset: 80.1951; animation: drawStroke 0.44s ease-out 1.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #工-s[i]) -->
<path id="工-s1"  class="stroke" stroke="#bf0909" d="M28.25,31.97C30.53,32.5,33.18,32.769999999999996,35.59,32.5C48,31.12,63.400000000000006,28.5,77.18,27.96C79.58000000000001,27.87,81.76,28.060000000000002,83.74000000000001,28.5"/>
<path id="工-s2"  class="stroke" stroke="#09bf09" d="M52.87,32.75C54.12,34,54.64,35.78,54.64,38.05C54.64,45.25,54.57,70.88,54.57,79.5"/>
<path id="工-s3"  class="stroke" stroke="#0909bf" d="M15.5,83.05C17.759999999999998,83.38,21.1,83.8,24.34,83.56C41.370000000000005,82.26,67.5,79.26,84.99,78.53C88.83,78.37,93.44999999999999,79.06,95.36999999999999,79.56"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="工-bg1"  class="badge-group"><circle cx="28.25" cy="31.97" r="3.5" fill="#bf0909"/><text class="num-single" x="28.25" y="31.97" dx="0" dy="-0.5">1</text></g>
<g id="工-bg2"  class="badge-group"><circle cx="52.87" cy="32.75" r="3.5" fill="#09bf09"/><text class="num-single" x="52.87" y="32.75" dx="0" dy="-0.5">2</text></g>
<g id="工-bg3"  class="badge-group"><circle cx="15.5" cy="83.05" r="3.5" fill="#0909bf"/><text class="num-single" x="15.5" y="83.05" dx="0" dy="-0.5">3</text></g>
</svg>