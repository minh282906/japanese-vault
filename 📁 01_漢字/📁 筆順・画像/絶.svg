<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (絶)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #絶-bg[i]: Thời gian quả bóng số nảy lên
   - #絶-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#絶-bg1  { animation-delay: 0.05s; }
#絶-s1   { stroke-dasharray: 40.2591; stroke-dashoffset: 40.2591; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#絶-bg2  { animation-delay: 0.42s; }
#絶-s2   { stroke-dasharray: 66.3257; stroke-dashoffset: 66.3257; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#絶-bg3  { animation-delay: 0.93s; }
#絶-s3   { stroke-dasharray: 13.9108; stroke-dashoffset: 13.9108; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#絶-bg4  { animation-delay: 1.30s; }
#絶-s4   { stroke-dasharray: 38.2838; stroke-dashoffset: 38.2838; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#絶-bg5  { animation-delay: 1.67s; }
#絶-s5   { stroke-dasharray: 18.2679; stroke-dashoffset: 18.2679; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#絶-bg6  { animation-delay: 2.04s; }
#絶-s6   { stroke-dasharray: 16.3118; stroke-dashoffset: 16.3118; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#絶-bg7  { animation-delay: 2.41s; }
#絶-s7   { stroke-dasharray: 33.6314; stroke-dashoffset: 33.6314; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#絶-bg8  { animation-delay: 2.78s; }
#絶-s8   { stroke-dasharray: 44.2399; stroke-dashoffset: 44.2399; animation: drawStroke 0.24s ease-out 2.91s forwards; }
#絶-bg9  { animation-delay: 3.17s; }
#絶-s9   { stroke-dasharray: 57.9677; stroke-dashoffset: 57.9677; animation: drawStroke 0.32s ease-out 3.30s forwards; }
#絶-bg10  { animation-delay: 3.64s; }
#絶-s10   { stroke-dasharray: 16.8255; stroke-dashoffset: 16.8255; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#絶-bg11  { animation-delay: 4.01s; }
#絶-s11   { stroke-dasharray: 30.4776; stroke-dashoffset: 30.4776; animation: drawStroke 0.22s ease-out 4.14s forwards; }
#絶-bg12  { animation-delay: 4.38s; }
#絶-s12   { stroke-dasharray: 91.0566; stroke-dashoffset: 91.0566; animation: drawStroke 0.50s ease-out 4.51s forwards; }
]]>
</style>

