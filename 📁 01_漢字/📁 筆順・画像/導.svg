<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (導)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #導-bg[i]: Thời gian quả bóng số nảy lên
   - #導-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#導-bg1  { animation-delay: 0.05s; }
#導-s1   { stroke-dasharray: 9.4280; stroke-dashoffset: 9.4280; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#導-bg2  { animation-delay: 0.42s; }
#導-s2   { stroke-dasharray: 9.8068; stroke-dashoffset: 9.8068; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#導-bg3  { animation-delay: 0.79s; }
#導-s3   { stroke-dasharray: 47.4672; stroke-dashoffset: 47.4672; animation: drawStroke 0.26s ease-out 0.92s forwards; }
#導-bg4  { animation-delay: 1.20s; }
#導-s4   { stroke-dasharray: 8.1924; stroke-dashoffset: 8.1924; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#導-bg5  { animation-delay: 1.57s; }
#導-s5   { stroke-dasharray: 23.7503; stroke-dashoffset: 23.7503; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#導-bg6  { animation-delay: 1.94s; }
#導-s6   { stroke-dasharray: 48.1026; stroke-dashoffset: 48.1026; animation: drawStroke 0.26s ease-out 2.07s forwards; }
#導-bg7  { animation-delay: 2.35s; }
#導-s7   { stroke-dasharray: 23.4813; stroke-dashoffset: 23.4813; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#導-bg8  { animation-delay: 2.72s; }
#導-s8   { stroke-dasharray: 24.0043; stroke-dashoffset: 24.0043; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#導-bg9  { animation-delay: 3.09s; }
#導-s9   { stroke-dasharray: 23.7141; stroke-dashoffset: 23.7141; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#導-bg10  { animation-delay: 3.46s; }
#導-s10   { stroke-dasharray: 11.9652; stroke-dashoffset: 11.9652; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#導-bg11  { animation-delay: 3.83s; }
#導-s11   { stroke-dasharray: 54.0342; stroke-dashoffset: 54.0342; animation: drawStroke 0.30s ease-out 3.96s forwards; }
#導-bg12  { animation-delay: 4.28s; }
#導-s12   { stroke-dasharray: 71.6222; stroke-dashoffset: 71.6222; animation: drawStroke 0.39s ease-out 4.41s forwards; }
#導-bg13  { animation-delay: 4.82s; }
#導-s13   { stroke-dasharray: 76.4681; stroke-dashoffset: 76.4681; animation: drawStroke 0.42s ease-out 4.95s forwards; }
#導-bg14  { animation-delay: 5.39s; }
#導-s14   { stroke-dasharray: 36.1995; stroke-dashoffset: 36.1995; animation: drawStroke 0.22s ease-out 5.52s forwards; }
#導-bg15  { animation-delay: 5.76s; }
#導-s15   { stroke-dasharray: 10.8029; stroke-dashoffset: 10.8029; animation: drawStroke 0.22s ease-out 5.89s forwards; }
]]>
</style>

