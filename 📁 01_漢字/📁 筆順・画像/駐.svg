<path id="駐-s10"  class="stroke" stroke="#0952bf" d="M35.5,66.25C37.25,68.13,38.8,70.34,39.25,73"/>
<path id="駐-s11"  class="stroke" stroke="#0909bf" d="M65.52,13.33C69.49,15.52,75.32,21.689999999999998,76.31,25.1"/>
<path id="駐-s12"  class="stroke" stroke="#5209bf" d="M54.41,39.12C56.87,39.629999999999995,59.69,39.099999999999994,61.25,38.9C68.54,37.94,80.21000000000001,36.22,87.25,35.65C89.1,35.5,91.1,35.19,92.91,35.79"/>
<path id="駐-s13"  class="stroke" stroke="#9a09bf" d="M72.75,40.02C73.75,41.150000000000006,74,42.25,74,43.71C74,50.04,74,80.5,74,87.81"/>
