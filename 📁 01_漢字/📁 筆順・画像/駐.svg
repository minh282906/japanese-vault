<path id="駐-s7"  class="stroke" stroke="#09bf52" d="M11.66,74.5C12.06,80.91,10.84,86.53999999999999,10.41,87.82"/>
<path id="駐-s8"  class="stroke" stroke="#09bf9a" d="M19.75,73C20.71,75.1,21.53,77.75,21.75,81.5"/>
