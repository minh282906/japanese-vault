<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (駐)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #駐-bg[i]: Thời gian quả bóng số nảy lên
   - #駐-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#駐-bg1  { animation-delay: 0.05s; }
#駐-s1   { stroke-dasharray: 43.5074; stroke-dashoffset: 43.5074; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#駐-bg2  { animation-delay: 0.44s; }
#駐-s2   { stroke-dasharray: 28.7226; stroke-dashoffset: 28.7226; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#駐-bg3  { animation-delay: 0.81s; }
#駐-s3   { stroke-dasharray: 38.3814; stroke-dashoffset: 38.3814; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#駐-bg4  { animation-delay: 1.18s; }
#駐-s4   { stroke-dasharray: 26.6137; stroke-dashoffset: 26.6137; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#駐-bg5  { animation-delay: 1.55s; }
#駐-s5   { stroke-dasharray: 26.3735; stroke-dashoffset: 26.3735; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#駐-bg6  { animation-delay: 1.92s; }
#駐-s6   { stroke-dasharray: 73.4808; stroke-dashoffset: 73.4808; animation: drawStroke 0.40s ease-out 2.05s forwards; }
#駐-bg7  { animation-delay: 2.47s; }
#駐-s7   { stroke-dasharray: 13.4356; stroke-dashoffset: 13.4356; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#駐-bg8  { animation-delay: 2.84s; }
#駐-s8   { stroke-dasharray: 8.7842; stroke-dashoffset: 8.7842; animation: drawStroke 0.22s ease-out 2.97s forwards; }
#駐-bg9  { animation-delay: 3.21s; }
#駐-s9   { stroke-dasharray: 8.3370; stroke-dashoffset: 8.3370; animation: drawStroke 0.22s ease-out 3.34s forwards; }
#駐-bg10  { animation-delay: 3.58s; }
#駐-s10   { stroke-dasharray: 7.8348; stroke-dashoffset: 7.8348; animation: drawStroke 0.22s ease-out 3.71s forwards; }
#駐-bg11  { animation-delay: 3.95s; }
#駐-s11   { stroke-dasharray: 16.2139; stroke-dashoffset: 16.2139; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#駐-bg12  { animation-delay: 4.32s; }
#駐-s12   { stroke-dasharray: 38.7882; stroke-dashoffset: 38.7882; animation: drawStroke 0.22s ease-out 4.45s forwards; }
#駐-bg13  { animation-delay: 4.69s; }
#駐-s13   { stroke-dasharray: 48.0982; stroke-dashoffset: 48.0982; animation: drawStroke 0.26s ease-out 4.82s forwards; }
#駐-bg14  { animation-delay: 5.10s; }
#駐-s14   { stroke-dasharray: 33.5561; stroke-dashoffset: 33.5561; animation: drawStroke 0.22s ease-out 5.23s forwards; }
#駐-bg15  { animation-delay: 5.47s; }
#駐-s15   { stroke-dasharray: 48.1512; stroke-dashoffset: 48.1512; animation: drawStroke 0.26s ease-out 5.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
