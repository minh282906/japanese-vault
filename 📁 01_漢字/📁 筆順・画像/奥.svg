<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (奥)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #奥-bg[i]: Thời gian quả bóng số nảy lên
   - #奥-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#奥-bg1  { animation-delay: 0.05s; }
#奥-s1   { stroke-dasharray: 15.3164; stroke-dashoffset: 15.3164; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#奥-bg2  { animation-delay: 0.42s; }
#奥-s2   { stroke-dasharray: 42.4272; stroke-dashoffset: 42.4272; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#奥-bg3  { animation-delay: 0.80s; }
#奥-s3   { stroke-dasharray: 87.5874; stroke-dashoffset: 87.5874; animation: drawStroke 0.48s ease-out 0.93s forwards; }
#奥-bg4  { animation-delay: 1.43s; }
#奥-s4   { stroke-dasharray: 9.3552; stroke-dashoffset: 9.3552; animation: drawStroke 0.22s ease-out 1.56s forwards; }
#奥-bg5  { animation-delay: 1.80s; }
#奥-s5   { stroke-dasharray: 11.6534; stroke-dashoffset: 11.6534; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#奥-bg6  { animation-delay: 2.17s; }
#奥-s6   { stroke-dasharray: 31.6043; stroke-dashoffset: 31.6043; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#奥-bg7  { animation-delay: 2.54s; }
#奥-s7   { stroke-dasharray: 29.1679; stroke-dashoffset: 29.1679; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#奥-bg8  { animation-delay: 2.91s; }
#奥-s8   { stroke-dasharray: 21.6570; stroke-dashoffset: 21.6570; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#奥-bg9  { animation-delay: 3.28s; }
#奥-s9   { stroke-dasharray: 14.4063; stroke-dashoffset: 14.4063; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#奥-bg10  { animation-delay: 3.65s; }
#奥-s10   { stroke-dasharray: 79.0565; stroke-dashoffset: 79.0565; animation: drawStroke 0.43s ease-out 3.78s forwards; }
#奥-bg11  { animation-delay: 4.23s; }
#奥-s11   { stroke-dasharray: 52.3687; stroke-dashoffset: 52.3687; animation: drawStroke 0.29s ease-out 4.36s forwards; }
#奥-bg12  { animation-delay: 4.67s; }
#奥-s12   { stroke-dasharray: 42.4213; stroke-dashoffset: 42.4213; animation: drawStroke 0.23s ease-out 4.80s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #奥-s[i]) -->
<path id="奥-s1"  class="stroke" stroke="#bf0909" d="M51.12,9.75C51.239999999999995,10.52,51.099999999999994,11.24,50.71,11.9C48.93,16.060000000000002,46.75,19,43.25,22.54"/>
<path id="奥-s2"  class="stroke" stroke="#bf6409" d="M30.94,24.6C31.8,25.46,32.04,27.020000000000003,31.87,28.560000000000002C31.740000000000002,29.770000000000003,31.75,51.31,31.75,61.5C31.75,63.12,31.79,65.12,31.79,66.79"/>
