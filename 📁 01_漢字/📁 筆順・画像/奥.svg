<path id="奥-s5"  class="stroke" stroke="#09bf09" d="M67.3,28.48C67.36,29.07,67.25,29.63,66.97,30.16C66.08,32.18,63.62,35,60.5,37.58"/>
<path id="奥-s6"  class="stroke" stroke="#09bf64" d="M38.5,42.85C39.75,43,41.52,43.21,43.17,43.1C48.38,42.75,60.63,41.5,66.16,41.15C67.81,41.04,68.97,40.99,70,41.15"/>
<path id="奥-s7"  class="stroke" stroke="#09bfbf" d="M53.74,29.5C54.56,30.32,54.79,31.12,54.79,32.19C54.79,33.22,54.769999999999996,46.589999999999996,54.76,54C54.76,56.04,54.76,57.62,54.76,58.38"/>
<path id="奥-s8"  class="stroke" stroke="#0964bf" d="M53.25,43.09C53.25,44.25,52.52,45.52,51.56,46.800000000000004C48.25,51.220000000000006,43.32,55.14,38.25,58"/>
<path id="奥-s9"  class="stroke" stroke="#0909bf" d="M57.62,46.88C61.16,48.18,66.47,51.800000000000004,69,55.43000000000001"/>
<path id="奥-s10"  class="stroke" stroke="#6409bf" d="M14.88,72.36C17.73,73.04,20.64,72.87,23.520000000000003,72.66C40.08,71.42999999999999,70.78,69.28,85.51,68.89C88.27000000000001,68.82000000000001,91.01,68.88,93.76,69.25"/>
<path id="奥-s11"  class="stroke" stroke="#bf09bf" d="M51.22,61.5C51.87,62.62,51.85,63.9,51.49,65.39C47.88,80.62,36.5,92,18.75,98"/>
<path id="奥-s12"  class="stroke" stroke="#bf0964" d="M52.75,71C59.64,76.36,71.37,86.72,79.91,92.14C82.25,93.63,85,95.5,86.75,96.25"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="奥-bg1"  class="badge-group"><circle cx="51.12" cy="9.75" r="3.5" fill="#bf0909"/><text class="num-single" x="51.12" y="9.75" dx="0" dy="-0.5">1</text></g>
