<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (登)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #登-bg[i]: Thời gian quả bóng số nảy lên
   - #登-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#登-bg1  { animation-delay: 0.05s; }
#登-s1   { stroke-dasharray: 77.7816; stroke-dashoffset: 77.7816; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#登-bg2  { animation-delay: 0.63s; }
#登-s2   { stroke-dasharray: 13.5308; stroke-dashoffset: 13.5308; animation: drawStroke 0.22s ease-out 0.76s forwards; }
#登-bg3  { animation-delay: 1.00s; }
#登-s3   { stroke-dasharray: 10.0273; stroke-dashoffset: 10.0273; animation: drawStroke 0.22s ease-out 1.13s forwards; }
#登-bg4  { animation-delay: 1.37s; }
#登-s4   { stroke-dasharray: 50.3735; stroke-dashoffset: 50.3735; animation: drawStroke 0.28s ease-out 1.50s forwards; }
#登-bg5  { animation-delay: 1.80s; }
#登-s5   { stroke-dasharray: 13.0077; stroke-dashoffset: 13.0077; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#登-bg6  { animation-delay: 2.17s; }
#登-s6   { stroke-dasharray: 31.1555; stroke-dashoffset: 31.1555; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#登-bg7  { animation-delay: 2.54s; }
#登-s7   { stroke-dasharray: 18.8519; stroke-dashoffset: 18.8519; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#登-bg8  { animation-delay: 2.91s; }
#登-s8   { stroke-dasharray: 48.0706; stroke-dashoffset: 48.0706; animation: drawStroke 0.26s ease-out 3.04s forwards; }
#登-bg9  { animation-delay: 3.32s; }
#登-s9   { stroke-dasharray: 29.9388; stroke-dashoffset: 29.9388; animation: drawStroke 0.22s ease-out 3.45s forwards; }
#登-bg10  { animation-delay: 3.69s; }
#登-s10   { stroke-dasharray: 12.0457; stroke-dashoffset: 12.0457; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#登-bg11  { animation-delay: 4.06s; }
#登-s11   { stroke-dasharray: 15.6954; stroke-dashoffset: 15.6954; animation: drawStroke 0.22s ease-out 4.19s forwards; }
#登-bg12  { animation-delay: 4.43s; }
#登-s12   { stroke-dasharray: 69.0147; stroke-dashoffset: 69.0147; animation: drawStroke 0.38s ease-out 4.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

