<path id="登-s6"  class="stroke" stroke="#09bf64" d="M37.25,44.94C39.27,45.129999999999995,40.77,45.11,41.88,45.01C49.370000000000005,44.37,57.370000000000005,42.75,64.32000000000001,42.41C66.17,42.31999999999999,67.29,42.559999999999995,68.22000000000001,42.72"/>
<path id="登-s7"  class="stroke" stroke="#09bfbf" d="M34.49,54.93C35.22,55.66,35.6,56.38,35.72,56.99C36.39,60.400000000000006,37.57,65.25,38.54,70.35C38.71,71.25,38.87,72.16,39.03,73.07"/>
<path id="登-s8"  class="stroke" stroke="#0964bf" d="M36.16,56.24C46.37,55.13,62.089999999999996,53.14,67.28,53.04C69.43,53,70.87,54.9,70.39,56.81C69.52,60.24,68.75,63.010000000000005,67.29,67.48"/>
<path id="登-s9"  class="stroke" stroke="#0909bf" d="M39.93,70.89C46.55,70.35,58.83,69.01,66.25,68.46C67.6,68.36,68.79,68.28999999999999,69.75,68.25"/>
<path id="登-s10"  class="stroke" stroke="#6409bf" d="M37,78.25C39.29,80.21,42.86,85.21,43.43,88.26"/>
<path id="登-s11"  class="stroke" stroke="#bf09bf" d="M67.5,74.47C67.75,75.25,67.72,76.2,67.47,76.91C66.62,79.67,63.9,83.72999999999999,59.989999999999995,87.67999999999999"/>
<path id="登-s12"  class="stroke" stroke="#bf0964" d="M20.58,91.44C23.58,92.27,29.08,92.21,32.07,92.02C47.19,91.03999999999999,62.53,89.78,78.93,89.53999999999999C83.92,89.47,86.92,89.94,89.42,90.35999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="登-bg1"  class="badge-group"><circle cx="27.25" cy="20.36" r="3.5" fill="#bf0909"/><text class="num-single" x="27.25" y="20.36" dx="0" dy="-0.5">1</text></g>
