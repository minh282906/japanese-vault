<path id="登-s1"  class="stroke" stroke="#bf0909" d="M27.25,20.36C28.75,20.97,30.1,20.99,32.5,20.56C37.75,19.619999999999997,41.5,18.25,46.99,17.169999999999998C50.95,16.4,51.78,17.689999999999998,50.5,20.979999999999997C47.5,28.69,31.25,48.75,15,55"/>
