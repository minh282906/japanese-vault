<path id="喫-s9"  class="stroke" stroke="#0909bf" d="M76.51,29.07C76.58,30.16,76.48,30.97,76.12,32C74.29,37.41,71.41000000000001,42.91,65.74000000000001,49.629999999999995"/>
<path id="喫-s10"  class="stroke" stroke="#6409bf" d="M35.9,69.9C38.93,70.88000000000001,42.3,70.10000000000001,45.37,69.74000000000001C55.69,68.53000000000002,68.33,66.72000000000001,79.61,66.26C82.87,66.13000000000001,85.74,66.24000000000001,88.99,66.75"/>
<path id="喫-s11"  class="stroke" stroke="#bf09bf" d="M59.94,55.15C60.36,55.71,60.57,56.86,60.559999999999995,58.08C60.38,77.38,50.62,88.88,33.66,96"/>
