<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (喫)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #喫-bg[i]: Thời gian quả bóng số nảy lên
   - #喫-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#喫-bg1  { animation-delay: 0.05s; }
#喫-s1   { stroke-dasharray: 22.8248; stroke-dashoffset: 22.8248; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#喫-bg2  { animation-delay: 0.42s; }
#喫-s2   { stroke-dasharray: 34.9735; stroke-dashoffset: 34.9735; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#喫-bg3  { animation-delay: 0.79s; }
#喫-s3   { stroke-dasharray: 13.9207; stroke-dashoffset: 13.9207; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#喫-bg4  { animation-delay: 1.16s; }
#喫-s4   { stroke-dasharray: 23.0220; stroke-dashoffset: 23.0220; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#喫-bg5  { animation-delay: 1.53s; }
#喫-s5   { stroke-dasharray: 34.6005; stroke-dashoffset: 34.6005; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#喫-bg6  { animation-delay: 1.90s; }
#喫-s6   { stroke-dasharray: 21.1852; stroke-dashoffset: 21.1852; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#喫-bg7  { animation-delay: 2.27s; }
#喫-s7   { stroke-dasharray: 26.7015; stroke-dashoffset: 26.7015; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#喫-bg8  { animation-delay: 2.64s; }
#喫-s8   { stroke-dasharray: 58.4673; stroke-dashoffset: 58.4673; animation: drawStroke 0.32s ease-out 2.77s forwards; }
#喫-bg9  { animation-delay: 3.11s; }
#喫-s9   { stroke-dasharray: 23.5650; stroke-dashoffset: 23.5650; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#喫-bg10  { animation-delay: 3.48s; }
#喫-s10   { stroke-dasharray: 53.3901; stroke-dashoffset: 53.3901; animation: drawStroke 0.29s ease-out 3.61s forwards; }
#喫-bg11  { animation-delay: 3.92s; }
#喫-s11   { stroke-dasharray: 52.7843; stroke-dashoffset: 52.7843; animation: drawStroke 0.29s ease-out 4.05s forwards; }
#喫-bg12  { animation-delay: 4.36s; }
#喫-s12   { stroke-dasharray: 38.4983; stroke-dashoffset: 38.4983; animation: drawStroke 0.22s ease-out 4.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

