<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (革)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #革-bg[i]: Thời gian quả bóng số nảy lên
   - #革-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#革-bg1  { animation-delay: 0.05s; }
#革-s1   { stroke-dasharray: 65.9513; stroke-dashoffset: 65.9513; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#革-bg2  { animation-delay: 0.56s; }
#革-s2   { stroke-dasharray: 26.1391; stroke-dashoffset: 26.1391; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#革-bg3  { animation-delay: 0.93s; }
#革-s3   { stroke-dasharray: 21.7168; stroke-dashoffset: 21.7168; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#革-bg4  { animation-delay: 1.30s; }
#革-s4   { stroke-dasharray: 23.7857; stroke-dashoffset: 23.7857; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#革-bg5  { animation-delay: 1.67s; }
#革-s5   { stroke-dasharray: 21.8284; stroke-dashoffset: 21.8284; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#革-bg6  { animation-delay: 2.04s; }
#革-s6   { stroke-dasharray: 68.8297; stroke-dashoffset: 68.8297; animation: drawStroke 0.38s ease-out 2.17s forwards; }
#革-bg7  { animation-delay: 2.57s; }
#革-s7   { stroke-dasharray: 47.6178; stroke-dashoffset: 47.6178; animation: drawStroke 0.26s ease-out 2.70s forwards; }
#革-bg8  { animation-delay: 2.98s; }
#革-s8   { stroke-dasharray: 78.5330; stroke-dashoffset: 78.5330; animation: drawStroke 0.43s ease-out 3.11s forwards; }
#革-bg9  { animation-delay: 3.56s; }
#革-s9   { stroke-dasharray: 61.9623; stroke-dashoffset: 61.9623; animation: drawStroke 0.34s ease-out 3.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #革-s[i]) -->
<path id="革-s1"  class="stroke" stroke="#bf0909" d="M22.31,23.86C24.56,24.66,28,24.52,30.38,24.24C43.26,22.74,66.13,20.74,80.51,19.82C83,19.66,85.49000000000001,19.830000000000002,87.95,20.36"/>
<path id="革-s2"  class="stroke" stroke="#bf8209" d="M38.08,12.38C39.1,13.4,39.629999999999995,14.56,39.769999999999996,15.32C40.24999999999999,18,41.489999999999995,24.79,42.599999999999994,32.74C42.849999999999994,34.5,43.06999999999999,36.21,43.24999999999999,37.75"/>
<path id="革-s3"  class="stroke" stroke="#82bf09" d="M69.23,10.75C69.75,11.870000000000001,69.92,13.26,69.67,14.44C68.5,20,67.88,24.16,65.96000000000001,31.990000000000002"/>
<path id="革-s4"  class="stroke" stroke="#09bf09" d="M44.08,34.94C47.75,34.629999999999995,57.79,33.87,63.76,33.41C65.59,33.269999999999996,66.75,33.25,67.8,33.37"/>
<path id="革-s5"  class="stroke" stroke="#09bf82" d="M26.5,46.85C27.39,47.74,27.88,48.93,27.99,49.550000000000004C29,55.120000000000005,29.369999999999997,57.870000000000005,30.599999999999998,64.23C30.9,65.79,31.04,66.21000000000001,31.29,67.96000000000001"/>
<path id="革-s6"  class="stroke" stroke="#0982bf" d="M28.64,48.71C43.5,47,72.06,44.18,78.44,43.52C80.77,43.28,82.49,45.220000000000006,82.09,46.620000000000005C81.25,49.50000000000001,80.13000000000001,53.25000000000001,78.17,59.27"/>
<path id="革-s7"  class="stroke" stroke="#0909bf" d="M32.04,63.88C38.58,63.230000000000004,62.629999999999995,61.330000000000005,74.99000000000001,60.36C76.77000000000001,60.22,78.30000000000001,60.1,79.50000000000001,60.01"/>
<path id="革-s8"  class="stroke" stroke="#8209bf" d="M16.75,78.2C20.13,79.13000000000001,23.08,78.93,26.14,78.63000000000001C38.64,77.4,69.24,74.67,86,74.1C89.03,74,92.02,73.89999999999999,95,74.53999999999999"/>
<path id="革-s9"  class="stroke" stroke="#bf0982" d="M53.87,37.25C54.68,38.06,54.83,39.73,54.83,40.75C54.83,45,54.72,76.37,54.72,92.5C54.72,95.64,54.65,97.96,54.61,99"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="革-bg1"  class="badge-group"><circle cx="22.31" cy="23.86" r="3.5" fill="#bf0909"/><text class="num-single" x="22.31" y="23.86" dx="0" dy="-0.5">1</text></g>
<g id="革-bg2"  class="badge-group"><circle cx="38.08" cy="12.38" r="3.5" fill="#bf8209"/><text class="num-single" x="38.08" y="12.38" dx="0" dy="-0.5">2</text></g>
<g id="革-bg3"  class="badge-group"><circle cx="69.23" cy="10.75" r="3.5" fill="#82bf09"/><text class="num-single" x="69.23" y="10.75" dx="0" dy="-0.5">3</text></g>
<g id="革-bg4"  class="badge-group"><circle cx="44.08" cy="34.94" r="3.5" fill="#09bf09"/><text class="num-single" x="44.08" y="34.94" dx="0" dy="-0.5">4</text></g>
<g id="革-bg5"  class="badge-group"><circle cx="26.5" cy="43.35" r="3.5" fill="#09bf82"/><text class="num-single" x="26.5" y="43.35" dx="0" dy="-0.5">5</text></g>
<g id="革-bg6"  class="badge-group"><circle cx="28.64" cy="52.21" r="3.5" fill="#0982bf"/><text class="num-single" x="28.64" y="52.21" dx="0" dy="-0.5">6</text></g>
<g id="革-bg7"  class="badge-group"><circle cx="32.04" cy="63.88" r="3.5" fill="#0909bf"/><text class="num-single" x="32.04" y="63.88" dx="0" dy="-0.5">7</text></g>
<g id="革-bg8"  class="badge-group"><circle cx="16.75" cy="78.2" r="3.5" fill="#8209bf"/><text class="num-single" x="16.75" y="78.2" dx="0" dy="-0.5">8</text></g>
<g id="革-bg9"  class="badge-group"><circle cx="53.87" cy="37.25" r="3.5" fill="#bf0982"/><text class="num-single" x="53.87" y="37.25" dx="0" dy="-0.5">9</text></g>
</svg>