<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (戸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #戸-bg[i]: Thời gian quả bóng số nảy lên
   - #戸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#戸-bg1  { animation-delay: 0.05s; }
#戸-s1   { stroke-dasharray: 53.1489; stroke-dashoffset: 53.1489; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#戸-bg2  { animation-delay: 0.49s; }
#戸-s2   { stroke-dasharray: 68.0821; stroke-dashoffset: 68.0821; animation: drawStroke 0.37s ease-out 0.62s forwards; }
#戸-bg3  { animation-delay: 1.01s; }
#戸-s3   { stroke-dasharray: 41.0661; stroke-dashoffset: 41.0661; animation: drawStroke 0.23s ease-out 1.14s forwards; }
#戸-bg4  { animation-delay: 1.39s; }
#戸-s4   { stroke-dasharray: 63.0226; stroke-dashoffset: 63.0226; animation: drawStroke 0.35s ease-out 1.52s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #戸-s[i]) -->
<path id="戸-s1"  class="stroke" stroke="#bf0909" d="M28.5,19.26C30.09,19.560000000000002,33.85,19.66,35.44,19.560000000000002C49.41,18.630000000000003,61.25,17.000000000000004,74.8,16.410000000000004C77.45,16.290000000000003,80.17,16.550000000000004,81.49,16.700000000000003"/>
<path id="戸-s2"  class="stroke" stroke="#64bf09" d="M30.85,36.13C32,36.5,33.73,36.87,36,36.65C46.62,35.62,67.64,33.42,75,32.75C76.99,32.57,79,34,78.25,36.75C77.2,40.6,75.59,48.3,74.31,53.769999999999996"/>
<path id="戸-s3"  class="stroke" stroke="#09bfbf" d="M35.5,57.25C42,56.87,58.519999999999996,55.61,71,55.13C73.15,55.050000000000004,75.03,55,76.5,55"/>
<path id="戸-s4"  class="stroke" stroke="#6409bf" d="M33.44,37.18C34.5,38.5,34.57,39.67,34.589999999999996,41.63C34.75,66.25,24.75,89,15.25,94.75"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="戸-bg1"  class="badge-group"><circle cx="28.5" cy="19.26" r="3.5" fill="#bf0909"/><text class="num-single" x="28.5" y="19.26" dx="0" dy="-0.5">1</text></g>
<g id="戸-bg2"  class="badge-group"><circle cx="30.85" cy="32.63" r="3.5" fill="#64bf09"/><text class="num-single" x="30.85" y="32.63" dx="0" dy="-0.5">2</text></g>
<g id="戸-bg3"  class="badge-group"><circle cx="35.5" cy="57.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.5" y="57.25" dx="0" dy="-0.5">3</text></g>
<g id="戸-bg4"  class="badge-group"><circle cx="33.44" cy="40.68" r="3.5" fill="#6409bf"/><text class="num-single" x="33.44" y="40.68" dx="0" dy="-0.5">4</text></g>
</svg>