<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (和)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #和-bg[i]: Thời gian quả bóng số nảy lên
   - #和-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#和-bg1  { animation-delay: 0.05s; }
#和-s1   { stroke-dasharray: 31.9816; stroke-dashoffset: 31.9816; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#和-bg2  { animation-delay: 0.42s; }
#和-s2   { stroke-dasharray: 42.4677; stroke-dashoffset: 42.4677; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#和-bg3  { animation-delay: 0.80s; }
#和-s3   { stroke-dasharray: 68.2595; stroke-dashoffset: 68.2595; animation: drawStroke 0.38s ease-out 0.93s forwards; }
#和-bg4  { animation-delay: 1.33s; }
#和-s4   { stroke-dasharray: 44.3357; stroke-dashoffset: 44.3357; animation: drawStroke 0.24s ease-out 1.46s forwards; }
#和-bg5  { animation-delay: 1.72s; }
#和-s5   { stroke-dasharray: 16.1065; stroke-dashoffset: 16.1065; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#和-bg6  { animation-delay: 2.09s; }
#和-s6   { stroke-dasharray: 31.7758; stroke-dashoffset: 31.7758; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#和-bg7  { animation-delay: 2.46s; }
#和-s7   { stroke-dasharray: 57.9981; stroke-dashoffset: 57.9981; animation: drawStroke 0.32s ease-out 2.59s forwards; }
#和-bg8  { animation-delay: 2.93s; }
#和-s8   { stroke-dasharray: 25.2487; stroke-dashoffset: 25.2487; animation: drawStroke 0.22s ease-out 3.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #和-s[i]) -->
<path id="和-s1"  class="stroke" stroke="#bf0909" d="M48.62,15.5C48.65,16.22,48.33,17.14,47.58,17.84C44.25,20.96,34.12,25.83,20.759999999999998,29.25"/>
<path id="和-s2"  class="stroke" stroke="#bf9109" d="M12.94,45.38C15.25,46,18.06,45.980000000000004,20.5,45.650000000000006C29.119999999999997,44.50000000000001,39.75,42.50000000000001,49.120000000000005,41.38000000000001C50.77,41.18000000000001,53.36000000000001,41.26000000000001,55.00000000000001,41.71000000000001"/>
<path id="和-s3"  class="stroke" stroke="#64bf09" d="M37.39,27.2C38.35,28.16,38.9,29.13,38.9,30C38.9,32.94,38.9,73.09,38.83,88.99000000000001C38.81,92,38.8,94.14,38.78,95"/>
<path id="和-s4"  class="stroke" stroke="#09bf36" d="M38.03,44.02C38.03,45.25,37.77,46.68000000000001,37.49,47.410000000000004C32.81,59.330000000000005,22.96,74.12,14.000000000000004,80.31"/>
<path id="和-s5"  class="stroke" stroke="#09bfbf" d="M41.14,53.81C45.52,55.56,51.01,60.93,52.94,64.44"/>
<path id="和-s6"  class="stroke" stroke="#0936bf" d="M60,47.19C60.97,48.16,61.52,49.33,61.76,50.62C63.019999999999996,57.309999999999995,63.93,66.14,64.88,74.1C65.05,75.50999999999999,65.21,76.89999999999999,65.36999999999999,78.24"/>
<path id="和-s7"  class="stroke" stroke="#6409bf" d="M62.44,48.81C74.31,47.120000000000005,83.77,45.870000000000005,89.5,45.14C92.31,44.78,93.96,45.97,93.39,48.910000000000004C92.19,55.14,90.38,64.19,88.68,72.41"/>
<path id="和-s8"  class="stroke" stroke="#bf0991" d="M65.6,75.56C75.22,74.44,81.69999999999999,73.73,87.63999999999999,73.19C88.66999999999999,73.1,89.67999999999999,73.00999999999999,90.70999999999998,72.92999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="和-bg1"  class="badge-group"><circle cx="48.62" cy="15.5" r="3.5" fill="#bf0909"/><text class="num-single" x="48.62" y="15.5" dx="0" dy="-0.5">1</text></g>
<g id="和-bg2"  class="badge-group"><circle cx="12.94" cy="45.38" r="3.5" fill="#bf9109"/><text class="num-single" x="12.94" y="45.38" dx="0" dy="-0.5">2</text></g>
<g id="和-bg3"  class="badge-group"><circle cx="37.39" cy="27.2" r="3.5" fill="#64bf09"/><text class="num-single" x="37.39" y="27.2" dx="0" dy="-0.5">3</text></g>
<g id="和-bg4"  class="badge-group"><circle cx="38.03" cy="44.02" r="3.5" fill="#09bf36"/><text class="num-single" x="38.03" y="44.02" dx="0" dy="-0.5">4</text></g>
<g id="和-bg5"  class="badge-group"><circle cx="41.14" cy="53.81" r="3.5" fill="#09bfbf"/><text class="num-single" x="41.14" y="53.81" dx="0" dy="-0.5">5</text></g>
<g id="和-bg6"  class="badge-group"><circle cx="60" cy="43.69" r="3.5" fill="#0936bf"/><text class="num-single" x="60" y="43.69" dx="0" dy="-0.5">6</text></g>
<g id="和-bg7"  class="badge-group"><circle cx="62.44" cy="52.31" r="3.5" fill="#6409bf"/><text class="num-single" x="62.44" y="52.31" dx="0" dy="-0.5">7</text></g>
<g id="和-bg8"  class="badge-group"><circle cx="65.6" cy="75.56" r="3.5" fill="#bf0991"/><text class="num-single" x="65.6" y="75.56" dx="0" dy="-0.5">8</text></g>
</svg>