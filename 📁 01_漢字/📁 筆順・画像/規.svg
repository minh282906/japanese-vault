<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (規)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #規-bg[i]: Thời gian quả bóng số nảy lên
   - #規-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#規-bg1  { animation-delay: 0.05s; }
#規-s1   { stroke-dasharray: 28.7586; stroke-dashoffset: 28.7586; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#規-bg2  { animation-delay: 0.42s; }
#規-s2   { stroke-dasharray: 33.8340; stroke-dashoffset: 33.8340; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#規-bg3  { animation-delay: 0.79s; }
#規-s3   { stroke-dasharray: 76.4450; stroke-dashoffset: 76.4450; animation: drawStroke 0.42s ease-out 0.92s forwards; }
#規-bg4  { animation-delay: 1.36s; }
#規-s4   { stroke-dasharray: 18.2712; stroke-dashoffset: 18.2712; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#規-bg5  { animation-delay: 1.73s; }
#規-s5   { stroke-dasharray: 46.3482; stroke-dashoffset: 46.3482; animation: drawStroke 0.25s ease-out 1.86s forwards; }
#規-bg6  { animation-delay: 2.13s; }
#規-s6   { stroke-dasharray: 73.5723; stroke-dashoffset: 73.5723; animation: drawStroke 0.40s ease-out 2.26s forwards; }
#規-bg7  { animation-delay: 2.68s; }
#規-s7   { stroke-dasharray: 27.9099; stroke-dashoffset: 27.9099; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#規-bg8  { animation-delay: 3.05s; }
#規-s8   { stroke-dasharray: 27.8377; stroke-dashoffset: 27.8377; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#規-bg9  { animation-delay: 3.42s; }
#規-s9   { stroke-dasharray: 28.1093; stroke-dashoffset: 28.1093; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#規-bg10  { animation-delay: 3.79s; }
#規-s10   { stroke-dasharray: 34.4699; stroke-dashoffset: 34.4699; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#規-bg11  { animation-delay: 4.16s; }
#規-s11   { stroke-dasharray: 59.9687; stroke-dashoffset: 59.9687; animation: drawStroke 0.33s ease-out 4.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #規-s[i]) -->
<path id="規-s1"  class="stroke" stroke="#bf0909" d="M15.56,33.93C17.2,34.27,19.47,34.14,21.12,33.95C26.560000000000002,33.290000000000006,32.77,32.470000000000006,39.75,31.130000000000003C41.19,30.85,42.58,30.62,44.05,30.800000000000004"/>
