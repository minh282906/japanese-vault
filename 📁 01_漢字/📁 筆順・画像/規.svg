<path id="規-s6"  class="stroke" stroke="#09bf8d" d="M57.05,18.98C60.459999999999994,18.56,75.09,16.61,80.87,15.950000000000001C84.2,15.57,86.43,15.920000000000002,86.36,19.630000000000003C86.25,25.800000000000004,86.19,45.78,86.17,55.63C86.16,58.84,86.16,60.980000000000004,86.16,61.21"/>
<path id="規-s7"  class="stroke" stroke="#098dbf" d="M57.25,32.31C64.87,31.250000000000004,79.75,29.87,85.02,29.560000000000002"/>
<path id="規-s8"  class="stroke" stroke="#092abf" d="M57.23,45.75C64.25,45.12,76.88,43.62,84.94999999999999,43.22"/>
<path id="規-s9"  class="stroke" stroke="#4b09bf" d="M57.19,60.11C64.13,59.38,77.13,57.88,85.16,57.33"/>
<path id="規-s10"  class="stroke" stroke="#ae09bf" d="M63.08,65.53C63.19,66.76,63.059999999999995,67.88,62.66,69.05C60.699999999999996,74.75999999999999,53.48,85.75,43.22,92.5"/>
<path id="規-s11"  class="stroke" stroke="#bf096c" d="M71.27,62.04C72.36999999999999,63.14,72.64,64.51,72.67,66.27C72.77,70.97999999999999,72.7,77.75999999999999,72.7,83.25C72.7,93.63,73.88000000000001,94.88,86.26,94.88C96,94.88,96.53,93.75,96.53,86.41999999999999"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="規-bg1"  class="badge-group"><circle cx="15.56" cy="33.93" r="3.5" fill="#bf0909"/><text class="num-single" x="15.56" y="33.93" dx="0" dy="-0.5">1</text></g>
