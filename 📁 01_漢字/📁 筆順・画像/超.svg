<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (超)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #超-bg[i]: Thời gian quả bóng số nảy lên
   - #超-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#超-bg1  { animation-delay: 0.05s; }
#超-s1   { stroke-dasharray: 28.1067; stroke-dashoffset: 28.1067; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#超-bg2  { animation-delay: 0.42s; }
#超-s2   { stroke-dasharray: 29.7285; stroke-dashoffset: 29.7285; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#超-bg3  { animation-delay: 0.79s; }
#超-s3   { stroke-dasharray: 37.0868; stroke-dashoffset: 37.0868; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#超-bg4  { animation-delay: 1.16s; }
#超-s4   { stroke-dasharray: 28.9698; stroke-dashoffset: 28.9698; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#超-bg5  { animation-delay: 1.53s; }
#超-s5   { stroke-dasharray: 15.2423; stroke-dashoffset: 15.2423; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#超-bg6  { animation-delay: 1.90s; }
#超-s6   { stroke-dasharray: 32.3339; stroke-dashoffset: 32.3339; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#超-bg7  { animation-delay: 2.27s; }
#超-s7   { stroke-dasharray: 74.6368; stroke-dashoffset: 74.6368; animation: drawStroke 0.41s ease-out 2.40s forwards; }
#超-bg8  { animation-delay: 2.83s; }
#超-s8   { stroke-dasharray: 68.4750; stroke-dashoffset: 68.4750; animation: drawStroke 0.38s ease-out 2.96s forwards; }
#超-bg9  { animation-delay: 3.36s; }
#超-s9   { stroke-dasharray: 27.0410; stroke-dashoffset: 27.0410; animation: drawStroke 0.22s ease-out 3.49s forwards; }
#超-bg10  { animation-delay: 3.73s; }
#超-s10   { stroke-dasharray: 22.1740; stroke-dashoffset: 22.1740; animation: drawStroke 0.22s ease-out 3.86s forwards; }
#超-bg11  { animation-delay: 4.10s; }
#超-s11   { stroke-dasharray: 47.2769; stroke-dashoffset: 47.2769; animation: drawStroke 0.26s ease-out 4.23s forwards; }
#超-bg12  { animation-delay: 4.51s; }
#超-s12   { stroke-dasharray: 25.3358; stroke-dashoffset: 25.3358; animation: drawStroke 0.22s ease-out 4.64s forwards; }
]]>
</style>

