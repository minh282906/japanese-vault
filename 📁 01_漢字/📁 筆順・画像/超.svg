<path id="超-s9"  class="stroke" stroke="#0909bf" d="M71.99,23.88C72.03,24.4,72.16,25.22,71.91,25.95C69.35,33.41,65.5,39.879999999999995,58.31999999999999,46.55"/>
<path id="超-s10"  class="stroke" stroke="#6409bf" d="M58.83,56.57C59.82,57.56,60.37,58.54,60.44,59.480000000000004C61.21,62.620000000000005,62.04,67.78,62.82,72.73C63.13,74.72,63.4,76.55,63.57,77.99000000000001"/>
