<path id="塩-s7"  class="stroke" stroke="#09bf95" d="M53.32,40.23C60.88,39.019999999999996,74.91,37.449999999999996,80.25,36.879999999999995C82.65,36.62,84.06,37.81999999999999,83.37,40.269999999999996C82.44,43.599999999999994,81.24000000000001,45.62,79.45,50.809999999999995"/>
<path id="塩-s8"  class="stroke" stroke="#0995bf" d="M54.98,53.65C59.059999999999995,53.24,69.83,52.42,77,51.87C78.52,51.75,79.88,51.65,80.98,51.559999999999995"/>
<path id="塩-s9"  class="stroke" stroke="#0941bf" d="M44.67,66.09C45.85,67.27000000000001,46.5,68.38000000000001,46.78,69.78C48.04,75.95,48.74,81.5,49.7,89.1"/>
<path id="塩-s10"  class="stroke" stroke="#2509bf" d="M47.13,67.8C56.08,66.61,79.09,64.17,85.51,63.339999999999996C89.12,62.87,90.28,64.45,89.55000000000001,68.02C88.70000000000002,72.16,86.97000000000001,81.94999999999999,85.89000000000001,86.55"/>
<path id="塩-s11"  class="stroke" stroke="#7909bf" d="M59.36,68.87C60.06,69.57000000000001,60.57,70.45,60.66,71.2C61.5,78.13,61.75,81.01,62.16,87.84"/>
<path id="塩-s12"  class="stroke" stroke="#bf09b1" d="M74.23,66.97C74.87,67.75,74.81,68.96,74.73,69.76C73.85000000000001,78.38000000000001,73.3,81.86,72.58,87.04"/>
