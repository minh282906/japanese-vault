<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (塩)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #塩-bg[i]: Thời gian quả bóng số nảy lên
   - #塩-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#塩-bg1  { animation-delay: 0.05s; }
#塩-s1   { stroke-dasharray: 27.0347; stroke-dashoffset: 27.0347; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#塩-bg2  { animation-delay: 0.42s; }
#塩-s2   { stroke-dasharray: 48.1339; stroke-dashoffset: 48.1339; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#塩-bg3  { animation-delay: 0.83s; }
#塩-s3   { stroke-dasharray: 29.2181; stroke-dashoffset: 29.2181; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#塩-bg4  { animation-delay: 1.20s; }
#塩-s4   { stroke-dasharray: 24.2711; stroke-dashoffset: 24.2711; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#塩-bg5  { animation-delay: 1.57s; }
#塩-s5   { stroke-dasharray: 33.7161; stroke-dashoffset: 33.7161; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#塩-bg6  { animation-delay: 1.94s; }
#塩-s6   { stroke-dasharray: 17.3271; stroke-dashoffset: 17.3271; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#塩-bg7  { animation-delay: 2.31s; }
#塩-s7   { stroke-dasharray: 44.1624; stroke-dashoffset: 44.1624; animation: drawStroke 0.24s ease-out 2.44s forwards; }
#塩-bg8  { animation-delay: 2.70s; }
#塩-s8   { stroke-dasharray: 26.0841; stroke-dashoffset: 26.0841; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#塩-bg9  { animation-delay: 3.07s; }
#塩-s9   { stroke-dasharray: 23.8635; stroke-dashoffset: 23.8635; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#塩-bg10  { animation-delay: 3.44s; }
#塩-s10   { stroke-dasharray: 65.4268; stroke-dashoffset: 65.4268; animation: drawStroke 0.36s ease-out 3.57s forwards; }
#塩-bg11  { animation-delay: 3.95s; }
#塩-s11   { stroke-dasharray: 19.4242; stroke-dashoffset: 19.4242; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#塩-bg12  { animation-delay: 4.32s; }
#塩-s12   { stroke-dasharray: 20.3227; stroke-dashoffset: 20.3227; animation: drawStroke 0.22s ease-out 4.45s forwards; }
#塩-bg13  { animation-delay: 4.69s; }
#塩-s13   { stroke-dasharray: 63.2381; stroke-dashoffset: 63.2381; animation: drawStroke 0.35s ease-out 4.82s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

