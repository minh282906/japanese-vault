<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (両)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #両-bg[i]: Thời gian quả bóng số nảy lên
   - #両-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#両-bg1  { animation-delay: 0.05s; }
#両-s1   { stroke-dasharray: 62.0623; stroke-dashoffset: 62.0623; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#両-bg2  { animation-delay: 0.54s; }
#両-s2   { stroke-dasharray: 52.8255; stroke-dashoffset: 52.8255; animation: drawStroke 0.29s ease-out 0.67s forwards; }
#両-bg3  { animation-delay: 0.98s; }
#両-s3   { stroke-dasharray: 131.9790; stroke-dashoffset: 131.9790; animation: drawStroke 0.55s ease-out 1.11s forwards; }
#両-bg4  { animation-delay: 1.68s; }
#両-s4   { stroke-dasharray: 50.1763; stroke-dashoffset: 50.1763; animation: drawStroke 0.28s ease-out 1.81s forwards; }
#両-bg5  { animation-delay: 2.11s; }
#両-s5   { stroke-dasharray: 49.6421; stroke-dashoffset: 49.6421; animation: drawStroke 0.27s ease-out 2.24s forwards; }
#両-bg6  { animation-delay: 2.53s; }
#両-s6   { stroke-dasharray: 22.2947; stroke-dashoffset: 22.2947; animation: drawStroke 0.22s ease-out 2.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #両-s[i]) -->
<path id="両-s1"  class="stroke" stroke="#bf0909" d="M23.25,22.95C26.37,23.63,29.8,23.47,32.88,23.169999999999998C42.92,22.18,63.18000000000001,19.509999999999998,76,18.7C79.06,18.509999999999998,81.99,18.4,85,19.04"/>
<path id="両-s2"  class="stroke" stroke="#bfbf09" d="M19.75,41.9C20.86,43.01,21.43,44.589999999999996,21.5,46.14C21.98,56.66,22.6,77.78,22.87,88.25C22.95,91.45,23,93.65,23,94.25"/>
<path id="両-s3"  class="stroke" stroke="#09bf09" d="M21.75,45.35C32.25,44.25,82.86,39.28,84.75,39.2C89.75,38.99,92.63,41.24,92.25,44.72C91.87,48.24,89.25,80.25,85.5,89.5C83.18,95.23,80.5,94,77,88.5"/>
<path id="両-s4"  class="stroke" stroke="#09bfbf" d="M53.04,23.75C54.019999999999996,24.73,54.699999999999996,26.6,54.699999999999996,27.5C54.699999999999996,30.38,54.62,67.9,54.51,73.5"/>
<path id="両-s5"  class="stroke" stroke="#0909bf" d="M39.06,58.5C39.67,58.95,40.370000000000005,60.85,40.28,61.75C39.88,65.75,39.69,68.87,39.21,73.5C38.87,76.75,39.6,77.27,42.42,76.75C49.870000000000005,75.37,56.870000000000005,74.25,70.33,72.5"/>
<path id="両-s6"  class="stroke" stroke="#bf09bf" d="M71.53,54.25C72.64,55.36,73.17,56.87,73,58.5C72.35,64.62,72.04,67.02,71.48,71.02C71.29,72.41,71.06,74,70.78,76"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="両-bg1"  class="badge-group"><circle cx="23.25" cy="22.95" r="3.5" fill="#bf0909"/><text class="num-single" x="23.25" y="22.95" dx="0" dy="-0.5">1</text></g>
<g id="両-bg2"  class="badge-group"><circle cx="19.75" cy="38.4" r="3.5" fill="#bfbf09"/><text class="num-single" x="19.75" y="38.4" dx="0" dy="-0.5">2</text></g>
<g id="両-bg3"  class="badge-group"><circle cx="21.75" cy="48.85" r="3.5" fill="#09bf09"/><text class="num-single" x="21.75" y="48.85" dx="0" dy="-0.5">3</text></g>
<g id="両-bg4"  class="badge-group"><circle cx="53.04" cy="23.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.04" y="23.75" dx="0" dy="-0.5">4</text></g>
<g id="両-bg5"  class="badge-group"><circle cx="39.06" cy="58.5" r="3.5" fill="#0909bf"/><text class="num-single" x="39.06" y="58.5" dx="0" dy="-0.5">5</text></g>
<g id="両-bg6"  class="badge-group"><circle cx="71.53" cy="54.25" r="3.5" fill="#bf09bf"/><text class="num-single" x="71.53" y="54.25" dx="0" dy="-0.5">6</text></g>
</svg>