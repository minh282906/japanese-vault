<path id="符-s7"  class="stroke" stroke="#098dbf" d="M37.96,40.5C38.14,41.97,37.910000000000004,43.39,37.32,44.64C33.56,52.65,27.17,63.24,18.56,72.98"/>
<path id="符-s8"  class="stroke" stroke="#092abf" d="M32.05,59.69C33.12,60.76,33.269999999999996,62.14,33.269999999999996,63.5C33.269999999999996,70.1,33.309999999999995,83.03,33.33,92.5C33.33,94.89,33.339999999999996,97.04,33.339999999999996,98.75"/>
<path id="符-s9"  class="stroke" stroke="#4b09bf" d="M45.88,54.67C48.650000000000006,55.42,51.36,55.06,54.13,54.620000000000005C62.620000000000005,53.28,73.32000000000001,51.63,85.37,50.50000000000001C87.99000000000001,50.25000000000001,91.01,50.24000000000001,93.38000000000001,50.81000000000001"/>
<path id="符-s10"  class="stroke" stroke="#ae09bf" d="M77.25,36.58C78.46,37.79,78.9,39.25,78.9,41.379999999999995C78.9,54.709999999999994,78.92,86.81,78.92,91.35C78.92,99.85,72.96000000000001,92.97999999999999,70.95,91.58"/>
<path id="符-s11"  class="stroke" stroke="#bf096c" d="M52.79,67.11C55.76,69.05,60.47,75.1,61.21,78.12"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="符-bg1"  class="badge-group"><circle cx="31" cy="14.75" r="3.5" fill="#bf0909"/><text class="num-single" x="31" y="14.75" dx="0" dy="-0.5">1</text></g>
<g id="符-bg2"  class="badge-group"><circle cx="30.23" cy="25.29" r="3.5" fill="#bf6c09"/><text class="num-single" x="30.23" y="25.29" dx="0" dy="-0.5">2</text></g>
