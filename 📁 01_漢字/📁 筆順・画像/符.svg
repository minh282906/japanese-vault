<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (符)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #符-bg[i]: Thời gian quả bóng số nảy lên
   - #符-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#符-bg1  { animation-delay: 0.05s; }
#符-s1   { stroke-dasharray: 26.1347; stroke-dashoffset: 26.1347; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#符-bg2  { animation-delay: 0.42s; }
#符-s2   { stroke-dasharray: 22.4106; stroke-dashoffset: 22.4106; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#符-bg3  { animation-delay: 0.79s; }
#符-s3   { stroke-dasharray: 9.4076; stroke-dashoffset: 9.4076; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#符-bg4  { animation-delay: 1.16s; }
#符-s4   { stroke-dasharray: 21.5551; stroke-dashoffset: 21.5551; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#符-bg5  { animation-delay: 1.53s; }
#符-s5   { stroke-dasharray: 25.9083; stroke-dashoffset: 25.9083; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#符-bg6  { animation-delay: 1.90s; }
#符-s6   { stroke-dasharray: 11.3968; stroke-dashoffset: 11.3968; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#符-bg7  { animation-delay: 2.27s; }
#符-s7   { stroke-dasharray: 38.3403; stroke-dashoffset: 38.3403; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#符-bg8  { animation-delay: 2.64s; }
#符-s8   { stroke-dasharray: 39.3667; stroke-dashoffset: 39.3667; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#符-bg9  { animation-delay: 3.01s; }
#符-s9   { stroke-dasharray: 47.8827; stroke-dashoffset: 47.8827; animation: drawStroke 0.26s ease-out 3.14s forwards; }
#符-bg10  { animation-delay: 3.42s; }
#符-s10   { stroke-dasharray: 67.6100; stroke-dashoffset: 67.6100; animation: drawStroke 0.37s ease-out 3.55s forwards; }
#符-bg11  { animation-delay: 3.94s; }
#符-s11   { stroke-dasharray: 14.0459; stroke-dashoffset: 14.0459; animation: drawStroke 0.22s ease-out 4.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #符-s[i]) -->
<path id="符-s1"  class="stroke" stroke="#bf0909" d="M31,14.75C31.07,15.73,31.05,16.52,30.69,17.45C28.71,22.54,25.080000000000002,29.18,17.75,36.75"/>
