<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (耳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #耳-bg[i]: Thời gian quả bóng số nảy lên
   - #耳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#耳-bg1  { animation-delay: 0.05s; }
#耳-s1   { stroke-dasharray: 67.6161; stroke-dashoffset: 67.6161; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#耳-bg2  { animation-delay: 0.57s; }
#耳-s2   { stroke-dasharray: 46.6612; stroke-dashoffset: 46.6612; animation: drawStroke 0.26s ease-out 0.70s forwards; }
#耳-bg3  { animation-delay: 0.98s; }
#耳-s3   { stroke-dasharray: 32.4171; stroke-dashoffset: 32.4171; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#耳-bg4  { animation-delay: 1.35s; }
#耳-s4   { stroke-dasharray: 32.3933; stroke-dashoffset: 32.3933; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#耳-bg5  { animation-delay: 1.72s; }
#耳-s5   { stroke-dasharray: 64.0212; stroke-dashoffset: 64.0212; animation: drawStroke 0.35s ease-out 1.85s forwards; }
#耳-bg6  { animation-delay: 2.22s; }
#耳-s6   { stroke-dasharray: 77.7158; stroke-dashoffset: 77.7158; animation: drawStroke 0.43s ease-out 2.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #耳-s[i]) -->
<path id="耳-s1"  class="stroke" stroke="#bf0909" d="M20.25,20C23.28,20.85,26.42,20.58,29.490000000000002,20.21C44.11,18.45,60.94,16.26,77.61,15.150000000000002C80.94,14.930000000000001,84.2,14.950000000000003,87.5,15.500000000000002"/>
<path id="耳-s2"  class="stroke" stroke="#bfbf09" d="M36.68,22.5C37.78,23.6,38.32,25.21,38.32,27.23C38.32,28.830000000000002,37.99,67.25,37.99,68.75"/>
<path id="耳-s3"  class="stroke" stroke="#09bf09" d="M39.5,35.5C46.25,34.62,63.5,32.75,71.75,32.25"/>
<path id="耳-s4"  class="stroke" stroke="#09bfbf" d="M39.25,51.25C46.25,50.75,63.870000000000005,48.5,71.5,48.25"/>
<path id="耳-s5"  class="stroke" stroke="#0909bf" d="M17.25,71C18,72.12,19.259999999999998,72.81,21,72.5C28,71.25,69,63.75,79.75,61.75"/>
<path id="耳-s6"  class="stroke" stroke="#bf09bf" d="M71,18.5C72,19.5,72.75,21,72.75,22.75C72.75,23.8,72.93,67.47999999999999,72.98,87.5C72.99000000000001,91.24,73,94.14,73,95.75"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="耳-bg1"  class="badge-group"><circle cx="20.25" cy="20" r="3.5" fill="#bf0909"/><text class="num-single" x="20.25" y="20" dx="0" dy="-0.5">1</text></g>
<g id="耳-bg2"  class="badge-group"><circle cx="36.68" cy="22.5" r="3.5" fill="#bfbf09"/><text class="num-single" x="36.68" y="22.5" dx="0" dy="-0.5">2</text></g>
<g id="耳-bg3"  class="badge-group"><circle cx="39.5" cy="35.5" r="3.5" fill="#09bf09"/><text class="num-single" x="39.5" y="35.5" dx="0" dy="-0.5">3</text></g>
<g id="耳-bg4"  class="badge-group"><circle cx="39.25" cy="51.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.25" y="51.25" dx="0" dy="-0.5">4</text></g>
<g id="耳-bg5"  class="badge-group"><circle cx="17.25" cy="71" r="3.5" fill="#0909bf"/><text class="num-single" x="17.25" y="71" dx="0" dy="-0.5">5</text></g>
<g id="耳-bg6"  class="badge-group"><circle cx="71" cy="18.5" r="3.5" fill="#bf09bf"/><text class="num-single" x="71" y="18.5" dx="0" dy="-0.5">6</text></g>
</svg>