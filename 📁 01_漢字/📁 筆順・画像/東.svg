<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (東)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #東-bg[i]: Thời gian quả bóng số nảy lên
   - #東-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#東-bg1  { animation-delay: 0.05s; }
#東-s1   { stroke-dasharray: 46.7620; stroke-dashoffset: 46.7620; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#東-bg2  { animation-delay: 0.46s; }
#東-s2   { stroke-dasharray: 29.9887; stroke-dashoffset: 29.9887; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#東-bg3  { animation-delay: 0.83s; }
#東-s3   { stroke-dasharray: 80.8368; stroke-dashoffset: 80.8368; animation: drawStroke 0.44s ease-out 0.96s forwards; }
#東-bg4  { animation-delay: 1.42s; }
#東-s4   { stroke-dasharray: 45.7862; stroke-dashoffset: 45.7862; animation: drawStroke 0.25s ease-out 1.55s forwards; }
#東-bg5  { animation-delay: 1.82s; }
#東-s5   { stroke-dasharray: 38.4396; stroke-dashoffset: 38.4396; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#東-bg6  { animation-delay: 2.19s; }
#東-s6   { stroke-dasharray: 87.8570; stroke-dashoffset: 87.8570; animation: drawStroke 0.48s ease-out 2.32s forwards; }
#東-bg7  { animation-delay: 2.82s; }
#東-s7   { stroke-dasharray: 45.3212; stroke-dashoffset: 45.3212; animation: drawStroke 0.25s ease-out 2.95s forwards; }
#東-bg8  { animation-delay: 3.22s; }
#東-s8   { stroke-dasharray: 47.4296; stroke-dashoffset: 47.4296; animation: drawStroke 0.26s ease-out 3.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #東-s[i]) -->
<path id="東-s1"  class="stroke" stroke="#bf0909" d="M30.63,25.23C32.99,25.85,35.49,25.7,37.879999999999995,25.45C46.12,24.59,60.58,22.75,70.28,21.88C72.66,21.669999999999998,74.79,21.74,77.13,22.099999999999998"/>
<path id="東-s2"  class="stroke" stroke="#bf9109" d="M26.77,37.86C27.8,38.89,28.55,39.91,28.84,41.3C29.7,45.44,32.45,57.31999999999999,33.81,63.209999999999994C34.24,65.08,34.53,66.35,34.57,66.57"/>
<path id="東-s3"  class="stroke" stroke="#64bf09" d="M29.55,39.31C44.25,37.190000000000005,64,34.940000000000005,77.73,33.81C80.62,33.57,81.75,35.82,81.22,38.010000000000005C79.89,43.49000000000001,78.38,50.220000000000006,75.95,57.88000000000001C75.43,59.53000000000001,74.87,61.18000000000001,74.25,62.82000000000001"/>
<path id="東-s4"  class="stroke" stroke="#09bf36" d="M32.25,51.07C40.37,50.19,70,46.95,77.82,46.67"/>
<path id="東-s5"  class="stroke" stroke="#09bfbf" d="M35.76,63.99C44.75,62.940000000000005,64.13,61.31,74.06,60.760000000000005"/>
<path id="東-s6"  class="stroke" stroke="#0936bf" d="M51.25,12.32C52.75,13.82,53.5,15.82,53.5,17.57C53.5,22.07,53.56,72.78,53.36,93.32C53.32,97.02,53.29,98.61,53.25,99.57"/>
<path id="東-s7"  class="stroke" stroke="#6409bf" d="M51.62,63.94C51.379999999999995,65.85,50.809999999999995,66.7,50.349999999999994,67.39C43.75999999999999,77.22,30.159999999999993,88.51,18.749999999999993,93.81"/>
<path id="東-s8"  class="stroke" stroke="#bf0991" d="M55,64.44C62.5,71.64,76.77,81.92999999999999,84.78,86.6C87.59,88.24,90.88,90.11,94.12,90.69"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="東-bg1"  class="badge-group"><circle cx="30.63" cy="25.23" r="3.5" fill="#bf0909"/><text class="num-single" x="30.63" y="25.23" dx="0" dy="-0.5">1</text></g>
<g id="東-bg2"  class="badge-group"><circle cx="26.77" cy="34.36" r="3.5" fill="#bf9109"/><text class="num-single" x="26.77" y="34.36" dx="0" dy="-0.5">2</text></g>
<g id="東-bg3"  class="badge-group"><circle cx="29.55" cy="42.81" r="3.5" fill="#64bf09"/><text class="num-single" x="29.55" y="42.81" dx="0" dy="-0.5">3</text></g>
<g id="東-bg4"  class="badge-group"><circle cx="32.25" cy="51.07" r="3.5" fill="#09bf36"/><text class="num-single" x="32.25" y="51.07" dx="0" dy="-0.5">4</text></g>
<g id="東-bg5"  class="badge-group"><circle cx="35.76" cy="63.99" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.76" y="63.99" dx="0" dy="-0.5">5</text></g>
<g id="東-bg6"  class="badge-group"><circle cx="51.25" cy="12.32" r="3.5" fill="#0936bf"/><text class="num-single" x="51.25" y="12.32" dx="0" dy="-0.5">6</text></g>
<g id="東-bg7"  class="badge-group"><circle cx="51.62" cy="60.44" r="3.5" fill="#6409bf"/><text class="num-single" x="51.62" y="60.44" dx="0" dy="-0.5">7</text></g>
<g id="東-bg8"  class="badge-group"><circle cx="55" cy="67.94" r="3.5" fill="#bf0991"/><text class="num-single" x="55" y="67.94" dx="0" dy="-0.5">8</text></g>
</svg>