<g id="配-bg9"  class="badge-group"><circle cx="57.42" cy="42.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="57.42" y="42.5" dx="0" dy="-0.5">9</text></g>
<g id="配-bg10" class="badge-group"><circle cx="58.49" cy="50.12" r="3.5" fill="#bf0976"/><text class="num-double" x="58.49" y="50.12" dx="-0.4" dy="-0.475">10</text></g>
</svg>