<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (軟)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #軟-bg[i]: Thời gian quả bóng số nảy lên
   - #軟-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#軟-bg1  { animation-delay: 0.05s; }
#軟-s1   { stroke-dasharray: 33.6157; stroke-dashoffset: 33.6157; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#軟-bg2  { animation-delay: 0.42s; }
#軟-s2   { stroke-dasharray: 27.3541; stroke-dashoffset: 27.3541; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#軟-bg3  { animation-delay: 0.79s; }
#軟-s3   { stroke-dasharray: 58.8152; stroke-dashoffset: 58.8152; animation: drawStroke 0.32s ease-out 0.92s forwards; }
#軟-bg4  { animation-delay: 1.26s; }
#軟-s4   { stroke-dasharray: 29.7070; stroke-dashoffset: 29.7070; animation: drawStroke 0.22s ease-out 1.39s forwards; }
#軟-bg5  { animation-delay: 1.63s; }
#軟-s5   { stroke-dasharray: 25.3053; stroke-dashoffset: 25.3053; animation: drawStroke 0.22s ease-out 1.76s forwards; }
#軟-bg6  { animation-delay: 2.00s; }
#軟-s6   { stroke-dasharray: 42.6088; stroke-dashoffset: 42.6088; animation: drawStroke 0.23s ease-out 2.13s forwards; }
#軟-bg7  { animation-delay: 2.38s; }
#軟-s7   { stroke-dasharray: 84.9340; stroke-dashoffset: 84.9340; animation: drawStroke 0.47s ease-out 2.51s forwards; }
#軟-bg8  { animation-delay: 3.00s; }
#軟-s8   { stroke-dasharray: 37.9181; stroke-dashoffset: 37.9181; animation: drawStroke 0.22s ease-out 3.13s forwards; }
#軟-bg9  { animation-delay: 3.37s; }
#軟-s9   { stroke-dasharray: 40.1806; stroke-dashoffset: 40.1806; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#軟-bg10  { animation-delay: 3.74s; }
#軟-s10   { stroke-dasharray: 53.5471; stroke-dashoffset: 53.5471; animation: drawStroke 0.29s ease-out 3.87s forwards; }
#軟-bg11  { animation-delay: 4.18s; }
#軟-s11   { stroke-dasharray: 40.9938; stroke-dashoffset: 40.9938; animation: drawStroke 0.23s ease-out 4.31s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #軟-s[i]) -->
<path id="軟-s1"  class="stroke" stroke="#bf0909" d="M14.83,28.96C16.7,29.01,18.5,29.42,20.39,29.14C26.26,28.29,35.51,27.04,43.260000000000005,26.14C44.96000000000001,25.94,46.53000000000001,25.63,48.18000000000001,26.23"/>
