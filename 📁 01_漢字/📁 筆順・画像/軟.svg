<path id="軟-s7"  class="stroke" stroke="#098dbf" d="M30.8,12.13C31.89,13.22,32.03,14.5,32.03,16.03C32.03,17,32.120000000000005,69.52000000000001,32.04,89.62C32.019999999999996,93.16000000000001,32.01,95.69,32,96.75"/>
<path id="軟-s8"  class="stroke" stroke="#092abf" d="M66.93,16.75C67.25,17.75,67.26,18.38,67.10000000000001,19.56C66.12,26.54,61.25000000000001,40.5,53.75000000000001,51.75"/>
<path id="軟-s9"  class="stroke" stroke="#4b09bf" d="M64.1,38.99C64.99,39.35,66.66999999999999,39.17,68.02,38.85C69.66,38.46,84.02,35.5,87.52,34.81C93.5,33.62,91.75,38.25,85,46"/>
<path id="軟-s10"  class="stroke" stroke="#ae09bf" d="M67.96,48C68.78999999999999,48.83,68.75,50.38,68.58999999999999,52.019999999999996C67.63,62.25,62.249999999999986,84.5,48.249999999999986,95.75"/>
<path id="軟-s11"  class="stroke" stroke="#bf096c" d="M68,62.5C71.62,67.67,80.73,80.74,88.05,88.16C90.07,90.21,91.88,91.88,94.5,93.5"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="軟-bg1"  class="badge-group"><circle cx="14.83" cy="28.96" r="3.5" fill="#bf0909"/><text class="num-single" x="14.83" y="28.96" dx="0" dy="-0.5">1</text></g>
<g id="軟-bg2"  class="badge-group"><circle cx="13.31" cy="36.54" r="3.5" fill="#bf6c09"/><text class="num-single" x="13.31" y="36.54" dx="0" dy="-0.5">2</text></g>
