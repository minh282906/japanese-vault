<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (連)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #連-bg[i]: Thời gian quả bóng số nảy lên
   - #連-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#連-bg1  { animation-delay: 0.05s; }
#連-s1   { stroke-dasharray: 41.8917; stroke-dashoffset: 41.8917; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#連-bg2  { animation-delay: 0.43s; }
#連-s2   { stroke-dasharray: 28.2736; stroke-dashoffset: 28.2736; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#連-bg3  { animation-delay: 0.80s; }
#連-s3   { stroke-dasharray: 68.2196; stroke-dashoffset: 68.2196; animation: drawStroke 0.38s ease-out 0.93s forwards; }
#連-bg4  { animation-delay: 1.33s; }
#連-s4   { stroke-dasharray: 36.3740; stroke-dashoffset: 36.3740; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#連-bg5  { animation-delay: 1.70s; }
#連-s5   { stroke-dasharray: 31.5433; stroke-dashoffset: 31.5433; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#連-bg6  { animation-delay: 2.07s; }
#連-s6   { stroke-dasharray: 52.9678; stroke-dashoffset: 52.9678; animation: drawStroke 0.29s ease-out 2.20s forwards; }
#連-bg7  { animation-delay: 2.51s; }
#連-s7   { stroke-dasharray: 77.0421; stroke-dashoffset: 77.0421; animation: drawStroke 0.42s ease-out 2.64s forwards; }
#連-bg8  { animation-delay: 3.08s; }
#連-s8   { stroke-dasharray: 15.2564; stroke-dashoffset: 15.2564; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#連-bg9  { animation-delay: 3.45s; }
#連-s9   { stroke-dasharray: 62.1578; stroke-dashoffset: 62.1578; animation: drawStroke 0.34s ease-out 3.58s forwards; }
#連-bg10  { animation-delay: 3.94s; }
#連-s10   { stroke-dasharray: 77.9460; stroke-dashoffset: 77.9460; animation: drawStroke 0.43s ease-out 4.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #連-s[i]) -->
<path id="連-s1"  class="stroke" stroke="#bf0909" d="M44.79,24.29C46.75,24.88,48.53,24.599999999999998,50.26,24.45C58.68,23.68,73.5,21.88,81.25999999999999,21.49C83.05,21.4,84.69999999999999,21.2,86.46999999999998,21.65"/>
<path id="連-s2"  class="stroke" stroke="#bf7609" d="M44.3,34.99C45.089999999999996,35.78,45.699999999999996,36.510000000000005,45.9,37.440000000000005C46.83,41.63,48.66,50.46000000000001,49.96,58.24000000000001C50.19,59.64000000000001,50.410000000000004,61.00000000000001,50.6,62.30000000000001"/>
<path id="連-s3"  class="stroke" stroke="#9abf09" d="M46.56,35.94C57.33,34.72,75.46000000000001,32.44,83.38,32.01C87.06,31.81,88.6,32.54,88.08999999999999,36.379999999999995C87.50999999999999,40.78999999999999,86.16999999999999,48.63999999999999,84.52,55.44C84.21,56.699999999999996,83.89999999999999,57.93,83.57,59.089999999999996"/>
<path id="連-s4"  class="stroke" stroke="#2dbf09" d="M49.4,47.67C59.25,46.75,72.88,44.870000000000005,85.6,44.160000000000004"/>
<path id="連-s5"  class="stroke" stroke="#09bf52" d="M51.4,59.64C60.089999999999996,58.7,71.5,57.5,82.82,56.9"/>
<path id="連-s6"  class="stroke" stroke="#09bfbf" d="M41.75,71.47C44.07,72.09,46.55,71.92,48.89,71.67999999999999C60.07,70.55999999999999,74.97,68.94,87.5,68.36C89.91,68.25,92.25,68.24,94.5,68.7"/>
<path id="連-s7"  class="stroke" stroke="#0952bf" d="M64.41,10.38C65.7,11.670000000000002,66.44,13.5,66.44,15.170000000000002C66.44,16.110000000000003,66.38,61.07,66.28999999999999,79.62C66.27,83.17,66.24999999999999,85.76,66.22999999999999,86.88000000000001"/>
<path id="連-s8"  class="stroke" stroke="#2d09bf" d="M20.38,19C24.22,20.83,30.299999999999997,26.53,31.259999999999998,29.380000000000003"/>
<path id="連-s9"  class="stroke" stroke="#9a09bf" d="M13,50.75C15.25,51.37,17.16,50.97,19.3,50.27C22.1,49.35,27.59,47.45,28.75,47C31,46.12,32.15,47.45,31,49.75C23.62,64.5,23.38,58.5,31.25,68.75C32.27,70.08,31.93,71.42,30.5,72.75C28.62,74.5,23.12,79,20.25,81.5"/>
<path id="連-s10"  class="stroke" stroke="#bf0976" d="M15.5,83.5C18.5,83,24.5,81.75,29,82.75S59.32,90.46,63.75,91.75C75.75,95.25,82.87,96.25,91.75,95.75"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="連-bg1"  class="badge-group"><circle cx="44.79" cy="24.29" r="3.5" fill="#bf0909"/><text class="num-single" x="44.79" y="24.29" dx="0" dy="-0.5">1</text></g>
<g id="連-bg2"  class="badge-group"><circle cx="44.3" cy="31.49" r="3.5" fill="#bf7609"/><text class="num-single" x="44.3" y="31.49" dx="0" dy="-0.5">2</text></g>
