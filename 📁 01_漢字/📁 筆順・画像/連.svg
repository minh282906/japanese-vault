<g id="連-bg9"  class="badge-group"><circle cx="13" cy="50.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="13" y="50.75" dx="0" dy="-0.5">9</text></g>
<g id="連-bg10" class="badge-group"><circle cx="15.5" cy="83.5" r="3.5" fill="#bf0976"/><text class="num-double" x="15.5" y="83.5" dx="-0.4" dy="-0.475">10</text></g>
</svg>