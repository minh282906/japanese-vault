<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (糸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #糸-bg[i]: Thời gian quả bóng số nảy lên
   - #糸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#糸-bg1  { animation-delay: 0.05s; }
#糸-s1   { stroke-dasharray: 53.1545; stroke-dashoffset: 53.1545; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#糸-bg2  { animation-delay: 0.49s; }
#糸-s2   { stroke-dasharray: 103.8330; stroke-dashoffset: 103.8330; animation: drawStroke 0.55s ease-out 0.62s forwards; }
#糸-bg3  { animation-delay: 1.19s; }
#糸-s3   { stroke-dasharray: 19.1595; stroke-dashoffset: 19.1595; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#糸-bg4  { animation-delay: 1.56s; }
#糸-s4   { stroke-dasharray: 37.1581; stroke-dashoffset: 37.1581; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#糸-bg5  { animation-delay: 1.93s; }
#糸-s5   { stroke-dasharray: 25.4949; stroke-dashoffset: 25.4949; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#糸-bg6  { animation-delay: 2.30s; }
#糸-s6   { stroke-dasharray: 22.1669; stroke-dashoffset: 22.1669; animation: drawStroke 0.22s ease-out 2.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #糸-s[i]) -->
<path id="糸-s1"  class="stroke" stroke="#bf0909" d="M51.25,11.5C51.75,13,51.53,14.4,50.5,16C46,23,38.12,31.75,32.25,35.75C30.27,37.1,31.51,39.22,32.5,39.5C37.75,41,43.25,43.5,47.75,46.25"/>
<path id="糸-s2"  class="stroke" stroke="#bfbf09" d="M70.5,21C71.12,22.38,70.88,23.75,69.5,25.25C58.49,37.26,47.25,49,33.5,62.25C31.84,63.85,32.49,64.71,34.5,64.25C43.88,62.13,66.25,57.25,77,55.25"/>
<path id="糸-s3"  class="stroke" stroke="#09bf09" d="M72.25,47.25C75.96,50.03,81.82,58.68,82.75,63"/>
<path id="糸-s4"  class="stroke" stroke="#09bfbf" d="M53,63C53.75,63.75,54.42,64.85,54.51,66.49C54.8,72.22,54.54,85.72999999999999,54.37,93.74C54.309999999999995,96.77,54.26,99.00999999999999,54.26,99.75"/>
<path id="糸-s5"  class="stroke" stroke="#0909bf" d="M32.98,74.66C33.37,76.13,33.25,77.25,32.209999999999994,78.78C29.359999999999992,82.97,21.419999999999995,89.8,16.749999999999993,93.09"/>
<path id="糸-s6"  class="stroke" stroke="#bf09bf" d="M76.16,73.5C80.53999999999999,77.25,88.03999999999999,87.25,89.6,91"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="糸-bg1"  class="badge-group"><circle cx="51.25" cy="11.5" r="3.5" fill="#bf0909"/><text class="num-single" x="51.25" y="11.5" dx="0" dy="-0.5">1</text></g>
<g id="糸-bg2"  class="badge-group"><circle cx="70.5" cy="21" r="3.5" fill="#bfbf09"/><text class="num-single" x="70.5" y="21" dx="0" dy="-0.5">2</text></g>
<g id="糸-bg3"  class="badge-group"><circle cx="72.25" cy="47.25" r="3.5" fill="#09bf09"/><text class="num-single" x="72.25" y="47.25" dx="0" dy="-0.5">3</text></g>
<g id="糸-bg4"  class="badge-group"><circle cx="53" cy="63" r="3.5" fill="#09bfbf"/><text class="num-single" x="53" y="63" dx="0" dy="-0.5">4</text></g>
<g id="糸-bg5"  class="badge-group"><circle cx="32.98" cy="74.66" r="3.5" fill="#0909bf"/><text class="num-single" x="32.98" y="74.66" dx="0" dy="-0.5">5</text></g>
<g id="糸-bg6"  class="badge-group"><circle cx="76.16" cy="73.5" r="3.5" fill="#bf09bf"/><text class="num-single" x="76.16" y="73.5" dx="0" dy="-0.5">6</text></g>
</svg>