<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (辞)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #辞-bg[i]: Thời gian quả bóng số nảy lên
   - #辞-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#辞-bg1  { animation-delay: 0.05s; }
#辞-s1   { stroke-dasharray: 28.2877; stroke-dashoffset: 28.2877; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#辞-bg2  { animation-delay: 0.42s; }
#辞-s2   { stroke-dasharray: 36.1856; stroke-dashoffset: 36.1856; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#辞-bg3  { animation-delay: 0.79s; }
#辞-s3   { stroke-dasharray: 35.5598; stroke-dashoffset: 35.5598; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#辞-bg4  { animation-delay: 1.16s; }
#辞-s4   { stroke-dasharray: 23.6028; stroke-dashoffset: 23.6028; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#辞-bg5  { animation-delay: 1.53s; }
#辞-s5   { stroke-dasharray: 43.2392; stroke-dashoffset: 43.2392; animation: drawStroke 0.24s ease-out 1.66s forwards; }
#辞-bg6  { animation-delay: 1.92s; }
#辞-s6   { stroke-dasharray: 20.8777; stroke-dashoffset: 20.8777; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#辞-bg7  { animation-delay: 2.29s; }
#辞-s7   { stroke-dasharray: 12.9295; stroke-dashoffset: 12.9295; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#辞-bg8  { animation-delay: 2.66s; }
#辞-s8   { stroke-dasharray: 38.4967; stroke-dashoffset: 38.4967; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#辞-bg9  { animation-delay: 3.03s; }
#辞-s9   { stroke-dasharray: 12.3014; stroke-dashoffset: 12.3014; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#辞-bg10  { animation-delay: 3.40s; }
#辞-s10   { stroke-dasharray: 17.8631; stroke-dashoffset: 17.8631; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#辞-bg11  { animation-delay: 3.77s; }
#辞-s11   { stroke-dasharray: 48.4587; stroke-dashoffset: 48.4587; animation: drawStroke 0.27s ease-out 3.90s forwards; }
#辞-bg12  { animation-delay: 4.19s; }
#辞-s12   { stroke-dasharray: 40.5656; stroke-dashoffset: 40.5656; animation: drawStroke 0.22s ease-out 4.32s forwards; }
#辞-bg13  { animation-delay: 4.56s; }
#辞-s13   { stroke-dasharray: 45.6625; stroke-dashoffset: 45.6625; animation: drawStroke 0.25s ease-out 4.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

