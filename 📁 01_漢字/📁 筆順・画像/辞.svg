<path id="辞-s9"  class="stroke" stroke="#0941bf" d="M57.66,34.5C61.3,38.51,62.949999999999996,42.61,63.279999999999994,45.25"/>
<path id="辞-s10"  class="stroke" stroke="#2509bf" d="M83.49,29.62C83.77,30.32,83.77,31.14,83.55,31.98C82.81,34.82,78.78999999999999,44.04,77.63,46.25"/>
<path id="辞-s11"  class="stroke" stroke="#7909bf" d="M48.25,51.3C50.87,51.87,52.62,51.589999999999996,54.76,51.37C65.39,50.269999999999996,79.05,48.769999999999996,89.87,48.099999999999994C92.12,47.959999999999994,94.28,47.839999999999996,96.49000000000001,48.32999999999999"/>
<path id="辞-s12"  class="stroke" stroke="#bf09b1" d="M52.89,67.85C54.1,68.16999999999999,56.34,68.3,57.55,68.16999999999999C67.25999999999999,67.11999999999999,79.75999999999999,65.61999999999999,88.99,64.99999999999999C91.00999999999999,64.86999999999999,92.22999999999999,65.14999999999999,93.24,65.31999999999998"/>
<path id="辞-s13"  class="stroke" stroke="#bf095d" d="M70.02,51.63C71.07,52.68,71.61,54.120000000000005,71.61,55.84C71.61,60.690000000000005,71.51,80.5,71.47,91.12C71.46,93.7,71.45,95.73,71.45,96.88000000000001"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
