<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (王)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #王-bg[i]: Thời gian quả bóng số nảy lên
   - #王-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#王-bg1  { animation-delay: 0.05s; }
#王-s1   { stroke-dasharray: 51.0879; stroke-dashoffset: 51.0879; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#王-bg2  { animation-delay: 0.48s; }
#王-s2   { stroke-dasharray: 65.9760; stroke-dashoffset: 65.9760; animation: drawStroke 0.36s ease-out 0.61s forwards; }
#王-bg3  { animation-delay: 0.99s; }
#王-s3   { stroke-dasharray: 51.6131; stroke-dashoffset: 51.6131; animation: drawStroke 0.28s ease-out 1.12s forwards; }
#王-bg4  { animation-delay: 1.42s; }
#王-s4   { stroke-dasharray: 82.2979; stroke-dashoffset: 82.2979; animation: drawStroke 0.45s ease-out 1.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #王-s[i]) -->
<path id="王-s1"  class="stroke" stroke="#bf0909" d="M29.5,21.22C32.2,21.84,35.05,21.299999999999997,37.74,20.939999999999998C48.33,19.519999999999996,60.370000000000005,18.13,71,17.15C74.01,16.88,77.3,16.599999999999998,80.25,17.5"/>
<path id="王-s2"  class="stroke" stroke="#64bf09" d="M52.4,22C54.32,24.4,54.32,25.83,54.32,27.75C54.32,39.88,54.3,85.45,54.3,87.5"/>
<path id="王-s3"  class="stroke" stroke="#09bfbf" d="M29.25,55C31.87,55.49,34.49,55.3,37.12,55.08C47.44,54.21,59.69,52.43,71.87,51.43C74.82000000000001,51.19,77.68,51.16,80.63000000000001,51.5"/>
<path id="王-s4"  class="stroke" stroke="#6409bf" d="M13.75,90.99C17.87,91.69,21.89,91.14,26,90.69999999999999C43.42,88.83999999999999,65.2,86.89999999999999,85.5,86.08999999999999C88.97,85.94999999999999,92.36,85.83999999999999,95.75,86.74"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="王-bg1"  class="badge-group"><circle cx="29.5" cy="21.22" r="3.5" fill="#bf0909"/><text class="num-single" x="29.5" y="21.22" dx="0" dy="-0.5">1</text></g>
<g id="王-bg2"  class="badge-group"><circle cx="52.4" cy="22" r="3.5" fill="#64bf09"/><text class="num-single" x="52.4" y="22" dx="0" dy="-0.5">2</text></g>
<g id="王-bg3"  class="badge-group"><circle cx="29.25" cy="55" r="3.5" fill="#09bfbf"/><text class="num-single" x="29.25" y="55" dx="0" dy="-0.5">3</text></g>
<g id="王-bg4"  class="badge-group"><circle cx="13.75" cy="90.99" r="3.5" fill="#6409bf"/><text class="num-single" x="13.75" y="90.99" dx="0" dy="-0.5">4</text></g>
</svg>