<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (宅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #宅-bg[i]: Thời gian quả bóng số nảy lên
   - #宅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#宅-bg1  { animation-delay: 0.05s; }
#宅-s1   { stroke-dasharray: 12.4425; stroke-dashoffset: 12.4425; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#宅-bg2  { animation-delay: 0.42s; }
#宅-s2   { stroke-dasharray: 19.1319; stroke-dashoffset: 19.1319; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#宅-bg3  { animation-delay: 0.79s; }
#宅-s3   { stroke-dasharray: 76.8352; stroke-dashoffset: 76.8352; animation: drawStroke 0.42s ease-out 0.92s forwards; }
#宅-bg4  { animation-delay: 1.36s; }
#宅-s4   { stroke-dasharray: 39.2862; stroke-dashoffset: 39.2862; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#宅-bg5  { animation-delay: 1.73s; }
#宅-s5   { stroke-dasharray: 67.3009; stroke-dashoffset: 67.3009; animation: drawStroke 0.37s ease-out 1.86s forwards; }
#宅-bg6  { animation-delay: 2.25s; }
#宅-s6   { stroke-dasharray: 92.9973; stroke-dashoffset: 92.9973; animation: drawStroke 0.51s ease-out 2.38s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #宅-s[i]) -->
<path id="宅-s1"  class="stroke" stroke="#bf0909" d="M51.56,12.5C52.47,13.41,53.35,15,53.35,16.82C53.35,18.63,53.26,21.25,53.26,24.47"/>
<path id="宅-s2"  class="stroke" stroke="#bfbf09" d="M23.27,25.85C23.27,29.96,19.36,41.260000000000005,17.58,44"/>
<path id="宅-s3"  class="stroke" stroke="#09bf09" d="M23.54,28.95C43.5,26.63,65.25,23.75,83.61,23.13C95.99,22.709999999999997,86.36,30.189999999999998,83.71,32.05"/>
<path id="宅-s4"  class="stroke" stroke="#09bfbf" d="M67.52,34.25C67.52,35.13,66.91,36.2,66.35,36.57C57.86999999999999,42.13,46.74999999999999,46.5,32.74999999999999,50.8"/>
<path id="宅-s5"  class="stroke" stroke="#0909bf" d="M18.75,68.5C22.71,69.35,26.41,68.88,30.32,68.11C43.41,65.51,58.25,62.5,74.12,60.6C77.81,60.160000000000004,81.57000000000001,59.690000000000005,85.25,60.5"/>
<path id="宅-s6"  class="stroke" stroke="#bf09bf" d="M49.5,48.45C50.46,49.410000000000004,50.65,51.1,50.65,52.46C50.65,57.370000000000005,50.5,75.24000000000001,50.5,81.95C50.5,93.5,52,96,72.25,96C91,96,92.25,93.75,92.25,83.89"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="宅-bg1"  class="badge-group"><circle cx="51.56" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="51.56" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="宅-bg2"  class="badge-group"><circle cx="23.27" cy="22.35" r="3.5" fill="#bfbf09"/><text class="num-single" x="23.27" y="22.35" dx="0" dy="-0.5">2</text></g>
<g id="宅-bg3"  class="badge-group"><circle cx="23.54" cy="32.45" r="3.5" fill="#09bf09"/><text class="num-single" x="23.54" y="32.45" dx="0" dy="-0.5">3</text></g>
<g id="宅-bg4"  class="badge-group"><circle cx="67.52" cy="34.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="67.52" y="34.25" dx="0" dy="-0.5">4</text></g>
<g id="宅-bg5"  class="badge-group"><circle cx="18.75" cy="68.5" r="3.5" fill="#0909bf"/><text class="num-single" x="18.75" y="68.5" dx="0" dy="-0.5">5</text></g>
<g id="宅-bg6"  class="badge-group"><circle cx="49.5" cy="48.45" r="3.5" fill="#bf09bf"/><text class="num-single" x="49.5" y="48.45" dx="0" dy="-0.5">6</text></g>
</svg>