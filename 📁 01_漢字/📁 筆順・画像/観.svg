<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (観)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #観-bg[i]: Thời gian quả bóng số nảy lên
   - #観-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#観-bg1  { animation-delay: 0.05s; }
#観-s1   { stroke-dasharray: 30.4502; stroke-dashoffset: 30.4502; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#観-bg2  { animation-delay: 0.42s; }
#観-s2   { stroke-dasharray: 23.7693; stroke-dashoffset: 23.7693; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#観-bg3  { animation-delay: 0.79s; }
#観-s3   { stroke-dasharray: 41.9742; stroke-dashoffset: 41.9742; animation: drawStroke 0.23s ease-out 0.92s forwards; }
#観-bg4  { animation-delay: 1.17s; }
#観-s4   { stroke-dasharray: 46.2681; stroke-dashoffset: 46.2681; animation: drawStroke 0.25s ease-out 1.30s forwards; }
#観-bg5  { animation-delay: 1.57s; }
#観-s5   { stroke-dasharray: 41.1526; stroke-dashoffset: 41.1526; animation: drawStroke 0.23s ease-out 1.70s forwards; }
#観-bg6  { animation-delay: 1.95s; }
#観-s6   { stroke-dasharray: 9.6104; stroke-dashoffset: 9.6104; animation: drawStroke 0.22s ease-out 2.08s forwards; }
#観-bg7  { animation-delay: 2.32s; }
#観-s7   { stroke-dasharray: 26.3676; stroke-dashoffset: 26.3676; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#観-bg8  { animation-delay: 2.69s; }
#観-s8   { stroke-dasharray: 32.6724; stroke-dashoffset: 32.6724; animation: drawStroke 0.22s ease-out 2.82s forwards; }
#観-bg9  { animation-delay: 3.06s; }
#観-s9   { stroke-dasharray: 25.0211; stroke-dashoffset: 25.0211; animation: drawStroke 0.22s ease-out 3.19s forwards; }
#観-bg10  { animation-delay: 3.43s; }
#観-s10   { stroke-dasharray: 25.5795; stroke-dashoffset: 25.5795; animation: drawStroke 0.22s ease-out 3.56s forwards; }
#観-bg11  { animation-delay: 3.80s; }
#観-s11   { stroke-dasharray: 25.6436; stroke-dashoffset: 25.6436; animation: drawStroke 0.22s ease-out 3.93s forwards; }
#観-bg12  { animation-delay: 4.17s; }
#観-s12   { stroke-dasharray: 45.8479; stroke-dashoffset: 45.8479; animation: drawStroke 0.25s ease-out 4.30s forwards; }
#観-bg13  { animation-delay: 4.57s; }
#観-s13   { stroke-dasharray: 68.9515; stroke-dashoffset: 68.9515; animation: drawStroke 0.38s ease-out 4.70s forwards; }
#観-bg14  { animation-delay: 5.10s; }
#観-s14   { stroke-dasharray: 23.7377; stroke-dashoffset: 23.7377; animation: drawStroke 0.22s ease-out 5.23s forwards; }
#観-bg15  { animation-delay: 5.47s; }
#観-s15   { stroke-dasharray: 24.0112; stroke-dashoffset: 24.0112; animation: drawStroke 0.22s ease-out 5.60s forwards; }
#観-bg16  { animation-delay: 5.84s; }
#観-s16   { stroke-dasharray: 23.4522; stroke-dashoffset: 23.4522; animation: drawStroke 0.22s ease-out 5.97s forwards; }
#観-bg17  { animation-delay: 6.21s; }
#観-s17   { stroke-dasharray: 37.6996; stroke-dashoffset: 37.6996; animation: drawStroke 0.22s ease-out 6.34s forwards; }
#観-bg18  { animation-delay: 6.58s; }
#観-s18   { stroke-dasharray: 53.8203; stroke-dashoffset: 53.8203; animation: drawStroke 0.30s ease-out 6.71s forwards; }
]]>
</style>

