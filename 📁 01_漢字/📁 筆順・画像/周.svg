<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (周)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #周-bg[i]: Thời gian quả bóng số nảy lên
   - #周-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#周-bg1  { animation-delay: 0.05s; }
#周-s1   { stroke-dasharray: 82.0620; stroke-dashoffset: 82.0620; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#周-bg2  { animation-delay: 0.65s; }
#周-s2   { stroke-dasharray: 147.4170; stroke-dashoffset: 147.4170; animation: drawStroke 0.55s ease-out 0.78s forwards; }
#周-bg3  { animation-delay: 1.35s; }
#周-s3   { stroke-dasharray: 35.1179; stroke-dashoffset: 35.1179; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#周-bg4  { animation-delay: 1.72s; }
#周-s4   { stroke-dasharray: 26.4156; stroke-dashoffset: 26.4156; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#周-bg5  { animation-delay: 2.09s; }
#周-s5   { stroke-dasharray: 40.7602; stroke-dashoffset: 40.7602; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#周-bg6  { animation-delay: 2.46s; }
#周-s6   { stroke-dasharray: 21.8454; stroke-dashoffset: 21.8454; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#周-bg7  { animation-delay: 2.83s; }
#周-s7   { stroke-dasharray: 41.1106; stroke-dashoffset: 41.1106; animation: drawStroke 0.23s ease-out 2.96s forwards; }
#周-bg8  { animation-delay: 3.21s; }
#周-s8   { stroke-dasharray: 21.5007; stroke-dashoffset: 21.5007; animation: drawStroke 0.22s ease-out 3.34s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #周-s[i]) -->
<path id="周-s1"  class="stroke" stroke="#bf0909" d="M25.25,16C26.37,17.12,26.71,18.740000000000002,26.75,21C27.25,53,27.25,80,13.25,94.75"/>
<path id="周-s2"  class="stroke" stroke="#bf9109" d="M27.25,17.75C35.64,16.87,68.55,13.98,77.36,13.18C83.1,12.66,84.98,12.99,85,19.12C85.03,28.75,85,82.9,85,88.25C85,100.5,78.75,92.25,76.17,89.67"/>
<path id="周-s3"  class="stroke" stroke="#64bf09" d="M37.72,33.48C39.14,33.93,41.739999999999995,33.86,43.16,33.75C47.76,33.4,61.989999999999995,31.22,67.67,31C70.03,30.91,71.45,31.08,72.63,31.28"/>
<path id="周-s4"  class="stroke" stroke="#09bf36" d="M53.72,21.42C54.53,22.23,54.97,23.62,54.97,24.910000000000004C54.97,29.250000000000004,55.04,41.75,55.04,47.53"/>
<path id="周-s5"  class="stroke" stroke="#09bfbf" d="M35.32,49.5C37.38,49.88,39.95,49.75,42.02,49.57C50.050000000000004,48.88,57.84,47.77,68.88,47.09C71.19999999999999,46.95,73.61999999999999,46.870000000000005,75.92999999999999,47.220000000000006"/>
<path id="周-s6"  class="stroke" stroke="#0936bf" d="M39.88,62.12C40.690000000000005,62.86,41.31,64.28999999999999,41.5,65.38C42.34,70.36,43,74.74,43.84,79.97999999999999C44.010000000000005,81.04999999999998,44.190000000000005,82.14999999999999,44.38,83.29999999999998"/>
<path id="周-s7"  class="stroke" stroke="#6409bf" d="M42.35,64.25C48.31,63.33,57.900000000000006,61.98,63.24,61.43C66.52,61.089999999999996,68.12,62.63,67.63,65.29C66.91,69.19000000000001,65.99,73.36000000000001,64.72999999999999,77.88000000000001"/>
<path id="周-s8"  class="stroke" stroke="#bf0991" d="M45.15,80.68C48.61,80.22000000000001,56.86,79.54,63,79.16000000000001C64.35,79.08000000000001,65.57,79.02000000000001,66.58,79.00000000000001"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="周-bg1"  class="badge-group"><circle cx="25.25" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="25.25" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="周-bg2"  class="badge-group"><circle cx="27.25" cy="21.25" r="3.5" fill="#bf9109"/><text class="num-single" x="27.25" y="21.25" dx="0" dy="-0.5">2</text></g>
<g id="周-bg3"  class="badge-group"><circle cx="37.72" cy="33.48" r="3.5" fill="#64bf09"/><text class="num-single" x="37.72" y="33.48" dx="0" dy="-0.5">3</text></g>
<g id="周-bg4"  class="badge-group"><circle cx="53.72" cy="21.42" r="3.5" fill="#09bf36"/><text class="num-single" x="53.72" y="21.42" dx="0" dy="-0.5">4</text></g>
<g id="周-bg5"  class="badge-group"><circle cx="35.32" cy="49.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.32" y="49.5" dx="0" dy="-0.5">5</text></g>
<g id="周-bg6"  class="badge-group"><circle cx="39.88" cy="58.62" r="3.5" fill="#0936bf"/><text class="num-single" x="39.88" y="58.62" dx="0" dy="-0.5">6</text></g>
<g id="周-bg7"  class="badge-group"><circle cx="42.35" cy="67.75" r="3.5" fill="#6409bf"/><text class="num-single" x="42.35" y="67.75" dx="0" dy="-0.5">7</text></g>
<g id="周-bg8"  class="badge-group"><circle cx="45.15" cy="80.68" r="3.5" fill="#bf0991"/><text class="num-single" x="45.15" y="80.68" dx="0" dy="-0.5">8</text></g>
</svg>