<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (誤)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #誤-bg[i]: Thời gian quả bóng số nảy lên
   - #誤-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#誤-bg1  { animation-delay: 0.05s; }
#誤-s1   { stroke-dasharray: 13.9767; stroke-dashoffset: 13.9767; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#誤-bg2  { animation-delay: 0.42s; }
#誤-s2   { stroke-dasharray: 31.7359; stroke-dashoffset: 31.7359; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#誤-bg3  { animation-delay: 0.79s; }
#誤-s3   { stroke-dasharray: 22.3327; stroke-dashoffset: 22.3327; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#誤-bg4  { animation-delay: 1.16s; }
#誤-s4   { stroke-dasharray: 21.4763; stroke-dashoffset: 21.4763; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#誤-bg5  { animation-delay: 1.53s; }
#誤-s5   { stroke-dasharray: 23.3078; stroke-dashoffset: 23.3078; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#誤-bg6  { animation-delay: 1.90s; }
#誤-s6   { stroke-dasharray: 40.0469; stroke-dashoffset: 40.0469; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#誤-bg7  { animation-delay: 2.27s; }
#誤-s7   { stroke-dasharray: 18.1407; stroke-dashoffset: 18.1407; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#誤-bg8  { animation-delay: 2.64s; }
#誤-s8   { stroke-dasharray: 22.6262; stroke-dashoffset: 22.6262; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#誤-bg9  { animation-delay: 3.01s; }
#誤-s9   { stroke-dasharray: 46.5667; stroke-dashoffset: 46.5667; animation: drawStroke 0.26s ease-out 3.14s forwards; }
#誤-bg10  { animation-delay: 3.42s; }
#誤-s10   { stroke-dasharray: 25.6262; stroke-dashoffset: 25.6262; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#誤-bg11  { animation-delay: 3.79s; }
#誤-s11   { stroke-dasharray: 70.5516; stroke-dashoffset: 70.5516; animation: drawStroke 0.39s ease-out 3.92s forwards; }
#誤-bg12  { animation-delay: 4.33s; }
#誤-s12   { stroke-dasharray: 55.9472; stroke-dashoffset: 55.9472; animation: drawStroke 0.31s ease-out 4.46s forwards; }
#誤-bg13  { animation-delay: 4.79s; }
#誤-s13   { stroke-dasharray: 25.8121; stroke-dashoffset: 25.8121; animation: drawStroke 0.22s ease-out 4.92s forwards; }
#誤-bg14  { animation-delay: 5.16s; }
#誤-s14   { stroke-dasharray: 25.1368; stroke-dashoffset: 25.1368; animation: drawStroke 0.22s ease-out 5.29s forwards; }
]]>
</style>

