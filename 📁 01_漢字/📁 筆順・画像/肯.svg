<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (肯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #肯-bg[i]: Thời gian quả bóng số nảy lên
   - #肯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#肯-bg1  { animation-delay: 0.05s; }
#肯-s1   { stroke-dasharray: 25.2445; stroke-dashoffset: 25.2445; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#肯-bg2  { animation-delay: 0.42s; }
#肯-s2   { stroke-dasharray: 17.5391; stroke-dashoffset: 17.5391; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#肯-bg3  { animation-delay: 0.79s; }
#肯-s3   { stroke-dasharray: 17.7716; stroke-dashoffset: 17.7716; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#肯-bg4  { animation-delay: 1.16s; }
#肯-s4   { stroke-dasharray: 72.9060; stroke-dashoffset: 72.9060; animation: drawStroke 0.40s ease-out 1.29s forwards; }
#肯-bg5  { animation-delay: 1.71s; }
#肯-s5   { stroke-dasharray: 49.2636; stroke-dashoffset: 49.2636; animation: drawStroke 0.27s ease-out 1.84s forwards; }
#肯-bg6  { animation-delay: 2.13s; }
#肯-s6   { stroke-dasharray: 89.9319; stroke-dashoffset: 89.9319; animation: drawStroke 0.49s ease-out 2.26s forwards; }
#肯-bg7  { animation-delay: 2.77s; }
#肯-s7   { stroke-dasharray: 30.3069; stroke-dashoffset: 30.3069; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#肯-bg8  { animation-delay: 3.14s; }
#肯-s8   { stroke-dasharray: 30.0133; stroke-dashoffset: 30.0133; animation: drawStroke 0.22s ease-out 3.27s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #肯-s[i]) -->
<path id="肯-s1"  class="stroke" stroke="#bf0909" d="M54.12,9.48C55.07,10.43,55.44,11.63,55.44,13C55.44,13.95,55.489999999999995,28.119999999999997,55.489999999999995,34.379999999999995"/>
<path id="肯-s2"  class="stroke" stroke="#bf9109" d="M57.96,21.27C61,21,67.75,19.75,72.33,19.48C73.95,19.38,74.35,19.25,75.37,19.48"/>
<path id="肯-s3"  class="stroke" stroke="#64bf09" d="M30.91,19.93C31.93,20.95,32.23,22.38,32.23,23.7C32.23,26.369999999999997,32.129999999999995,31.08,32.129999999999995,37.37"/>
<path id="肯-s4"  class="stroke" stroke="#09bf36" d="M18,38.94C22.25,39.62,25.67,39.21,29.240000000000002,38.68C45,36.37,64.12,34.37,79.89,33.269999999999996C83.54,33.019999999999996,86.9,33.209999999999994,90.5,33.92999999999999"/>
<path id="肯-s5"  class="stroke" stroke="#09bfbf" d="M38.56,47.73C39.260000000000005,48.62,39.45,49.75,39.45,51.15C39.45,53.75,39.480000000000004,77.45,39.470000000000006,90C39.470000000000006,93.75,39.46000000000001,96.35,39.43000000000001,96.81"/>
<path id="肯-s6"  class="stroke" stroke="#0936bf" d="M40.39,48.97C42.88,48.769999999999996,65.75,45.55,67.61,45.43C70.38,45.25,71.76,46.75,71.76,50.37C71.76,55.76,71.75,77.53999999999999,71.75,92.12C71.75,102.48,66.41,95.7,64.33,93.91000000000001"/>
<path id="肯-s7"  class="stroke" stroke="#6409bf" d="M40.64,61.87C50.38,60.75,62.5,59.5,70.81,59.03"/>
<path id="肯-s8"  class="stroke" stroke="#bf0991" d="M40.51,75.87C48.12,75,62.7,73.48,70.39,73.08"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="肯-bg1"  class="badge-group"><circle cx="54.12" cy="9.48" r="3.5" fill="#bf0909"/><text class="num-single" x="54.12" y="9.48" dx="0" dy="-0.5">1</text></g>
<g id="肯-bg2"  class="badge-group"><circle cx="57.96" cy="21.27" r="3.5" fill="#bf9109"/><text class="num-single" x="57.96" y="21.27" dx="0" dy="-0.5">2</text></g>
<g id="肯-bg3"  class="badge-group"><circle cx="30.91" cy="19.93" r="3.5" fill="#64bf09"/><text class="num-single" x="30.91" y="19.93" dx="0" dy="-0.5">3</text></g>
<g id="肯-bg4"  class="badge-group"><circle cx="18" cy="38.94" r="3.5" fill="#09bf36"/><text class="num-single" x="18" y="38.94" dx="0" dy="-0.5">4</text></g>
<g id="肯-bg5"  class="badge-group"><circle cx="38.56" cy="44.23" r="3.5" fill="#09bfbf"/><text class="num-single" x="38.56" y="44.23" dx="0" dy="-0.5">5</text></g>
<g id="肯-bg6"  class="badge-group"><circle cx="40.39" cy="52.47" r="3.5" fill="#0936bf"/><text class="num-single" x="40.39" y="52.47" dx="0" dy="-0.5">6</text></g>
<g id="肯-bg7"  class="badge-group"><circle cx="40.64" cy="61.87" r="3.5" fill="#6409bf"/><text class="num-single" x="40.64" y="61.87" dx="0" dy="-0.5">7</text></g>
<g id="肯-bg8"  class="badge-group"><circle cx="40.51" cy="75.87" r="3.5" fill="#bf0991"/><text class="num-single" x="40.51" y="75.87" dx="0" dy="-0.5">8</text></g>
</svg>