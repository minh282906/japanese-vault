<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (毎)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #毎-bg[i]: Thời gian quả bóng số nảy lên
   - #毎-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#毎-bg1  { animation-delay: 0.05s; }
#毎-s1   { stroke-dasharray: 32.1025; stroke-dashoffset: 32.1025; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#毎-bg2  { animation-delay: 0.42s; }
#毎-s2   { stroke-dasharray: 38.6208; stroke-dashoffset: 38.6208; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#毎-bg3  { animation-delay: 0.79s; }
#毎-s3   { stroke-dasharray: 103.7320; stroke-dashoffset: 103.7320; animation: drawStroke 0.55s ease-out 0.92s forwards; }
#毎-bg4  { animation-delay: 1.49s; }
#毎-s4   { stroke-dasharray: 106.2890; stroke-dashoffset: 106.2890; animation: drawStroke 0.55s ease-out 1.62s forwards; }
#毎-bg5  { animation-delay: 2.19s; }
#毎-s5   { stroke-dasharray: 40.4929; stroke-dashoffset: 40.4929; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#毎-bg6  { animation-delay: 2.56s; }
#毎-s6   { stroke-dasharray: 87.5458; stroke-dashoffset: 87.5458; animation: drawStroke 0.48s ease-out 2.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #毎-s[i]) -->
<path id="毎-s1"  class="stroke" stroke="#bf0909" d="M44.13,10.62C44.24,12.01,44.09,13.1,43.59,14.399999999999999C41.36000000000001,20.209999999999997,34.220000000000006,31.13,26.750000000000004,36.739999999999995"/>
<path id="毎-s2"  class="stroke" stroke="#bfbf09" d="M43.77,23.04C45.5,23.119999999999997,47.45,23.07,48.5,23C55.38,22.54,68.37,19.98,76.16,18.58C78.27,18.2,79.89999999999999,18.189999999999998,82,18.439999999999998"/>
<path id="毎-s3"  class="stroke" stroke="#09bf09" d="M41.55,34.87C42.65,35.779999999999994,43.51,38.839999999999996,42.91,41.169999999999995C40.25,51.5,33.25,67,29.45,72.74C27.47,75.72999999999999,28.93,77.32,31.02,77.36C43,77.62,56.120000000000005,79.24,68.97,83.08C74.89,84.85,80.25,87.67999999999999,84.74,91"/>
<path id="毎-s4"  class="stroke" stroke="#09bfbf" d="M44.26,37.32C53.43,36.25,66.37,34.75,72.84,34C76.74000000000001,33.55,79.2,36.01,78.94,39.12C77.5,56.629999999999995,74.13,81.63,67.62,95.19C64.63000000000001,101.41,61.120000000000005,94.03999999999999,60.10000000000001,92.92"/>
<path id="毎-s5"  class="stroke" stroke="#0909bf" d="M58.71,39.5C59.22,40.5,59.46,42.24,59.24,43.5C57.71,52,52.13,70.5,49.32,78.5"/>
<path id="毎-s6"  class="stroke" stroke="#bf09bf" d="M10.88,58.99C13.34,59.550000000000004,17.86,59.480000000000004,20.33,59.300000000000004C41.379999999999995,57.760000000000005,65.13,55.88,89.63,55.42C93.74,55.34,96.19999999999999,55.68,98.25,55.96"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="毎-bg1"  class="badge-group"><circle cx="44.13" cy="10.62" r="3.5" fill="#bf0909"/><text class="num-single" x="44.13" y="10.62" dx="0" dy="-0.5">1</text></g>
<g id="毎-bg2"  class="badge-group"><circle cx="43.77" cy="23.04" r="3.5" fill="#bfbf09"/><text class="num-single" x="43.77" y="23.04" dx="0" dy="-0.5">2</text></g>
<g id="毎-bg3"  class="badge-group"><circle cx="41.55" cy="31.37" r="3.5" fill="#09bf09"/><text class="num-single" x="41.55" y="31.37" dx="0" dy="-0.5">3</text></g>
<g id="毎-bg4"  class="badge-group"><circle cx="44.26" cy="40.82" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.26" y="40.82" dx="0" dy="-0.5">4</text></g>
<g id="毎-bg5"  class="badge-group"><circle cx="58.71" cy="39.5" r="3.5" fill="#0909bf"/><text class="num-single" x="58.71" y="39.5" dx="0" dy="-0.5">5</text></g>
<g id="毎-bg6"  class="badge-group"><circle cx="10.88" cy="58.99" r="3.5" fill="#bf09bf"/><text class="num-single" x="10.88" y="58.99" dx="0" dy="-0.5">6</text></g>
</svg>