<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (泉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #泉-bg[i]: Thời gian quả bóng số nảy lên
   - #泉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#泉-bg1  { animation-delay: 0.05s; }
#泉-s1   { stroke-dasharray: 13.8554; stroke-dashoffset: 13.8554; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#泉-bg2  { animation-delay: 0.42s; }
#泉-s2   { stroke-dasharray: 29.1116; stroke-dashoffset: 29.1116; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#泉-bg3  { animation-delay: 0.79s; }
#泉-s3   { stroke-dasharray: 68.7321; stroke-dashoffset: 68.7321; animation: drawStroke 0.38s ease-out 0.92s forwards; }
#泉-bg4  { animation-delay: 1.32s; }
#泉-s4   { stroke-dasharray: 38.4129; stroke-dashoffset: 38.4129; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#泉-bg5  { animation-delay: 1.69s; }
#泉-s5   { stroke-dasharray: 33.8859; stroke-dashoffset: 33.8859; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#泉-bg6  { animation-delay: 2.06s; }
#泉-s6   { stroke-dasharray: 50.6242; stroke-dashoffset: 50.6242; animation: drawStroke 0.28s ease-out 2.19s forwards; }
#泉-bg7  { animation-delay: 2.49s; }
#泉-s7   { stroke-dasharray: 58.8816; stroke-dashoffset: 58.8816; animation: drawStroke 0.32s ease-out 2.62s forwards; }
#泉-bg8  { animation-delay: 2.96s; }
#泉-s8   { stroke-dasharray: 23.7245; stroke-dashoffset: 23.7245; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#泉-bg9  { animation-delay: 3.33s; }
#泉-s9   { stroke-dasharray: 43.1473; stroke-dashoffset: 43.1473; animation: drawStroke 0.24s ease-out 3.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #泉-s[i]) -->
<path id="泉-s1"  class="stroke" stroke="#bf0909" d="M50.72,12.49C50.75,13.25,50.74,13.96,50.56,14.32C49.25,17,47.88,19.5,43.88,24.25"/>
<path id="泉-s2"  class="stroke" stroke="#bf8209" d="M32.2,25.73C32.980000000000004,26.51,33.35,27.9,33.49,28.740000000000002C34.120000000000005,32.620000000000005,35.04,41.34,36.09,49.22C36.400000000000006,51.519999999999996,36.620000000000005,53.37,36.68000000000001,54.33"/>
<path id="泉-s3"  class="stroke" stroke="#82bf09" d="M33.88,27.42C41.870000000000005,26.25,64.37,23.25,72.51,22.82C75.28,22.67,76.75,24.5,76.25,27C76.01,28.21,74.85,35.74,72.95,45.989999999999995C72.72,47.209999999999994,72.24000000000001,48.46999999999999,72,49.74999999999999"/>
<path id="泉-s4"  class="stroke" stroke="#09bf09" d="M35.75,38.5C51.25,37,61.25,35.75,74,35"/>
<path id="泉-s5"  class="stroke" stroke="#09bf82" d="M37.51,51.1C48.5,50,61.83,48.45,71.25,48"/>
<path id="泉-s6"  class="stroke" stroke="#0982bf" d="M52.68,52.67C53.5,53.49,54.1,54.75,54.1,56.550000000000004C54.1,70.75,54.11,84.63,54.11,91.65C54.11,98.27000000000001,48.32,92.77000000000001,46.24,91.21000000000001"/>
<path id="泉-s7"  class="stroke" stroke="#0909bf" d="M21.69,68.21C23.05,68.41999999999999,24.6,68.66999999999999,26,68.38C29.63,67.61999999999999,33.25,66.25,37.41,64.97999999999999C39.72,64.27,41.51,66.11999999999999,40.809999999999995,67.99999999999999C37.629999999999995,76.49999999999999,27.499999999999993,88.37999999999998,16.249999999999996,94.74999999999999"/>
<path id="泉-s8"  class="stroke" stroke="#8209bf" d="M79,55C79,55.88,78.75,56.62,78.03,57.32C73.14,62.01,68,64.88,60.5,69"/>
<path id="泉-s9"  class="stroke" stroke="#bf0982" d="M55.85,66.92C65.38,75,73,81.62,82.92,88.29C85.69,90.15,87.75,91.62,90.37,92.62"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="泉-bg1"  class="badge-group"><circle cx="50.72" cy="12.49" r="3.5" fill="#bf0909"/><text class="num-single" x="50.72" y="12.49" dx="0" dy="-0.5">1</text></g>
<g id="泉-bg2"  class="badge-group"><circle cx="32.2" cy="22.23" r="3.5" fill="#bf8209"/><text class="num-single" x="32.2" y="22.23" dx="0" dy="-0.5">2</text></g>
<g id="泉-bg3"  class="badge-group"><circle cx="33.88" cy="30.92" r="3.5" fill="#82bf09"/><text class="num-single" x="33.88" y="30.92" dx="0" dy="-0.5">3</text></g>
<g id="泉-bg4"  class="badge-group"><circle cx="35.75" cy="38.5" r="3.5" fill="#09bf09"/><text class="num-single" x="35.75" y="38.5" dx="0" dy="-0.5">4</text></g>
<g id="泉-bg5"  class="badge-group"><circle cx="37.51" cy="51.1" r="3.5" fill="#09bf82"/><text class="num-single" x="37.51" y="51.1" dx="0" dy="-0.5">5</text></g>
<g id="泉-bg6"  class="badge-group"><circle cx="52.68" cy="52.67" r="3.5" fill="#0982bf"/><text class="num-single" x="52.68" y="52.67" dx="0" dy="-0.5">6</text></g>
<g id="泉-bg7"  class="badge-group"><circle cx="21.69" cy="68.21" r="3.5" fill="#0909bf"/><text class="num-single" x="21.69" y="68.21" dx="0" dy="-0.5">7</text></g>
<g id="泉-bg8"  class="badge-group"><circle cx="79" cy="55" r="3.5" fill="#8209bf"/><text class="num-single" x="79" y="55" dx="0" dy="-0.5">8</text></g>
<g id="泉-bg9"  class="badge-group"><circle cx="55.85" cy="66.92" r="3.5" fill="#bf0982"/><text class="num-single" x="55.85" y="66.92" dx="0" dy="-0.5">9</text></g>
</svg>