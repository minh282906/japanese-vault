<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (会)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #会-bg[i]: Thời gian quả bóng số nảy lên
   - #会-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#会-bg1  { animation-delay: 0.05s; }
#会-s1   { stroke-dasharray: 62.4899; stroke-dashoffset: 62.4899; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#会-bg2  { animation-delay: 0.54s; }
#会-s2   { stroke-dasharray: 56.1316; stroke-dashoffset: 56.1316; animation: drawStroke 0.31s ease-out 0.67s forwards; }
#会-bg3  { animation-delay: 1.00s; }
#会-s3   { stroke-dasharray: 29.4939; stroke-dashoffset: 29.4939; animation: drawStroke 0.22s ease-out 1.13s forwards; }
#会-bg4  { animation-delay: 1.37s; }
#会-s4   { stroke-dasharray: 59.9950; stroke-dashoffset: 59.9950; animation: drawStroke 0.33s ease-out 1.50s forwards; }
#会-bg5  { animation-delay: 1.85s; }
#会-s5   { stroke-dasharray: 76.3137; stroke-dashoffset: 76.3137; animation: drawStroke 0.42s ease-out 1.98s forwards; }
#会-bg6  { animation-delay: 2.42s; }
#会-s6   { stroke-dasharray: 23.1515; stroke-dashoffset: 23.1515; animation: drawStroke 0.22s ease-out 2.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #会-s[i]) -->
<path id="会-s1"  class="stroke" stroke="#bf0909" d="M52.25,14C52.5,16.28,51.73,17.59,50.45,19.62C44.690000000000005,28.76,32.550000000000004,46.620000000000005,11.25,59.5"/>
<path id="会-s2"  class="stroke" stroke="#bfbf09" d="M54.5,19.25C61.230000000000004,26.55,78.59,44.06,87.45,51.16C90.18,53.339999999999996,93.06,54.959999999999994,96.5,55.75"/>
<path id="会-s3"  class="stroke" stroke="#09bf09" d="M37.36,50.16C39,50.5,41.4,50.519999999999996,42.34,50.41C49.13,49.62,56.63,48.5,62,48.01C63.56,47.87,65.25,47.62,66.66,48.01"/>
<path id="会-s4"  class="stroke" stroke="#09bfbf" d="M23,65.98C25.12,66.5,27.25,66.62,30.009999999999998,66.28C43.78,64.57000000000001,61,62.620000000000005,76.36,62.54C79.4,62.519999999999996,81.23,62.68,82.76,62.83"/>
<path id="会-s5"  class="stroke" stroke="#0909bf" d="M47.16,66.38C47.779999999999994,68.03,47.129999999999995,69.31,46.239999999999995,70.66C41.06999999999999,78.46,38.22,82.03999999999999,31.249999999999993,89.5C29.139999999999993,91.75,29.749999999999993,93.68,33.24999999999999,93.25C40.599999999999994,92.34,61.44,87.42,73.41,85.3"/>
<path id="会-s6"  class="stroke" stroke="#bf09bf" d="M66.62,77.39C71.14,80.62,77.62,90.12,79.68,96.21000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="会-bg1"  class="badge-group"><circle cx="52.25" cy="10.5" r="3.5" fill="#bf0909"/><text class="num-single" x="52.25" y="10.5" dx="0" dy="-0.5">1</text></g>
<g id="会-bg2"  class="badge-group"><circle cx="54.5" cy="22.75" r="3.5" fill="#bfbf09"/><text class="num-single" x="54.5" y="22.75" dx="0" dy="-0.5">2</text></g>
<g id="会-bg3"  class="badge-group"><circle cx="37.36" cy="50.16" r="3.5" fill="#09bf09"/><text class="num-single" x="37.36" y="50.16" dx="0" dy="-0.5">3</text></g>
<g id="会-bg4"  class="badge-group"><circle cx="23" cy="65.98" r="3.5" fill="#09bfbf"/><text class="num-single" x="23" y="65.98" dx="0" dy="-0.5">4</text></g>
<g id="会-bg5"  class="badge-group"><circle cx="47.16" cy="66.38" r="3.5" fill="#0909bf"/><text class="num-single" x="47.16" y="66.38" dx="0" dy="-0.5">5</text></g>
<g id="会-bg6"  class="badge-group"><circle cx="66.62" cy="77.39" r="3.5" fill="#bf09bf"/><text class="num-single" x="66.62" y="77.39" dx="0" dy="-0.5">6</text></g>
</svg>