<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (声)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #声-bg[i]: Thời gian quả bóng số nảy lên
   - #声-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#声-bg1  { animation-delay: 0.05s; }
#声-s1   { stroke-dasharray: 62.2759; stroke-dashoffset: 62.2759; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#声-bg2  { animation-delay: 0.54s; }
#声-s2   { stroke-dasharray: 27.0735; stroke-dashoffset: 27.0735; animation: drawStroke 0.22s ease-out 0.67s forwards; }
#声-bg3  { animation-delay: 0.91s; }
#声-s3   { stroke-dasharray: 52.5839; stroke-dashoffset: 52.5839; animation: drawStroke 0.29s ease-out 1.04s forwards; }
#声-bg4  { animation-delay: 1.35s; }
#声-s4   { stroke-dasharray: 64.6366; stroke-dashoffset: 64.6366; animation: drawStroke 0.36s ease-out 1.48s forwards; }
#声-bg5  { animation-delay: 1.86s; }
#声-s5   { stroke-dasharray: 14.0599; stroke-dashoffset: 14.0599; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#声-bg6  { animation-delay: 2.23s; }
#声-s6   { stroke-dasharray: 41.7717; stroke-dashoffset: 41.7717; animation: drawStroke 0.23s ease-out 2.36s forwards; }
#声-bg7  { animation-delay: 2.61s; }
#声-s7   { stroke-dasharray: 49.6216; stroke-dashoffset: 49.6216; animation: drawStroke 0.27s ease-out 2.74s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #声-s[i]) -->
<path id="声-s1"  class="stroke" stroke="#bf0909" d="M23,24.5C24.42,24.81,28.02,24.9,30.82,24.64C45.81,23.25,59.45,20.75,77.84,19.73C81.24000000000001,19.54,83.28,19.71,84.98,19.89"/>
<path id="声-s2"  class="stroke" stroke="#bfa509" d="M52.75,10C53.81,11.06,54.5,13.25,54.5,14.5C54.5,15.33,54.32,35.44,54.27,36.65"/>
<path id="声-s3"  class="stroke" stroke="#3dbf09" d="M30.33,39.41C32.01,39.73,35.089999999999996,39.629999999999995,36.769999999999996,39.47C48.01,38.39,64.25999999999999,36.14,76.74,34.87C79.53,34.58,81.22,34.82,82.61999999999999,34.949999999999996"/>
<path id="声-s4"  class="stroke" stroke="#09bf71" d="M32,50.25C33.75,51,35.05,50.87,36.74,50.66C49.120000000000005,49.12,65.63,46.86,74,46.25C79.12,45.87,80.38,47.37,79.63,51.01C79.13,53.48,77.58,58.42,76.47,61.33C75.98,62.61,75.6,63.059999999999995,75.5,63.239999999999995"/>
<path id="声-s5"  class="stroke" stroke="#0971bf" d="M54.75,49.25C55.75,50,55.76,51.14,55.77,52C55.84,55.65,56,61.58,56,63"/>
<path id="声-s6"  class="stroke" stroke="#3d09bf" d="M33.5,66.75C43.62,65.62,68.75,62.5,75,62"/>
<path id="声-s7"  class="stroke" stroke="#bf09a5" d="M33,50.75C33.81,51.56,34.13,52.76,34,54C32.12,71.62,27.62,86.88,18.75,96.75"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="声-bg1"  class="badge-group"><circle cx="23" cy="24.5" r="3.5" fill="#bf0909"/><text class="num-single" x="23" y="24.5" dx="0" dy="-0.5">1</text></g>
<g id="声-bg2"  class="badge-group"><circle cx="52.75" cy="10" r="3.5" fill="#bfa509"/><text class="num-single" x="52.75" y="10" dx="0" dy="-0.5">2</text></g>
<g id="声-bg3"  class="badge-group"><circle cx="30.33" cy="39.41" r="3.5" fill="#3dbf09"/><text class="num-single" x="30.33" y="39.41" dx="0" dy="-0.5">3</text></g>
<g id="声-bg4"  class="badge-group"><circle cx="32" cy="46.75" r="3.5" fill="#09bf71"/><text class="num-single" x="32" y="46.75" dx="0" dy="-0.5">4</text></g>
<g id="声-bg5"  class="badge-group"><circle cx="54.75" cy="49.25" r="3.5" fill="#0971bf"/><text class="num-single" x="54.75" y="49.25" dx="0" dy="-0.5">5</text></g>
<g id="声-bg6"  class="badge-group"><circle cx="33.5" cy="66.75" r="3.5" fill="#3d09bf"/><text class="num-single" x="33.5" y="66.75" dx="0" dy="-0.5">6</text></g>
<g id="声-bg7"  class="badge-group"><circle cx="33" cy="54.25" r="3.5" fill="#bf09a5"/><text class="num-single" x="33" y="54.25" dx="0" dy="-0.5">7</text></g>
</svg>