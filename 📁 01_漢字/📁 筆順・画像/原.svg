<g id="原-bg8"  class="badge-group"><circle cx="60.27" cy="59.98" r="3.5" fill="#2d09bf"/><text class="num-single" x="60.27" y="59.98" dx="0" dy="-0.5">8</text></g>
<g id="原-bg9"  class="badge-group"><circle cx="42.39" cy="70.85" r="3.5" fill="#9a09bf"/><text class="num-single" x="42.39" y="70.85" dx="0" dy="-0.5">9</text></g>
<g id="原-bg10" class="badge-group"><circle cx="79.75" cy="72" r="3.5" fill="#bf0976"/><text class="num-double" x="79.75" y="72" dx="-0.4" dy="-0.475">10</text></g>
</svg>