<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (酒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #酒-bg[i]: Thời gian quả bóng số nảy lên
   - #酒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#酒-bg1  { animation-delay: 0.05s; }
#酒-s1   { stroke-dasharray: 13.1944; stroke-dashoffset: 13.1944; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#酒-bg2  { animation-delay: 0.42s; }
#酒-s2   { stroke-dasharray: 13.3989; stroke-dashoffset: 13.3989; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#酒-bg3  { animation-delay: 0.79s; }
#酒-s3   { stroke-dasharray: 21.8469; stroke-dashoffset: 21.8469; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#酒-bg4  { animation-delay: 1.16s; }
#酒-s4   { stroke-dasharray: 55.7987; stroke-dashoffset: 55.7987; animation: drawStroke 0.31s ease-out 1.29s forwards; }
#酒-bg5  { animation-delay: 1.62s; }
#酒-s5   { stroke-dasharray: 52.3633; stroke-dashoffset: 52.3633; animation: drawStroke 0.29s ease-out 1.75s forwards; }
#酒-bg6  { animation-delay: 2.06s; }
#酒-s6   { stroke-dasharray: 101.8330; stroke-dashoffset: 101.8330; animation: drawStroke 0.55s ease-out 2.19s forwards; }
#酒-bg7  { animation-delay: 2.76s; }
#酒-s7   { stroke-dasharray: 42.0926; stroke-dashoffset: 42.0926; animation: drawStroke 0.23s ease-out 2.89s forwards; }
#酒-bg8  { animation-delay: 3.14s; }
#酒-s8   { stroke-dasharray: 48.8841; stroke-dashoffset: 48.8841; animation: drawStroke 0.27s ease-out 3.27s forwards; }
#酒-bg9  { animation-delay: 3.56s; }
#酒-s9   { stroke-dasharray: 45.4406; stroke-dashoffset: 45.4406; animation: drawStroke 0.25s ease-out 3.69s forwards; }
#酒-bg10  { animation-delay: 3.96s; }
#酒-s10   { stroke-dasharray: 45.3507; stroke-dashoffset: 45.3507; animation: drawStroke 0.25s ease-out 4.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #酒-s[i]) -->
<path id="酒-s1"  class="stroke" stroke="#bf0909" d="M20.21,16.92C23.93,18.180000000000003,29.82,22.6,30.75,24.57"/>
<path id="酒-s2"  class="stroke" stroke="#bf7609" d="M15.71,39.29C19.86,40.68,24.25,43.75,26.47,46.94"/>
<path id="酒-s3"  class="stroke" stroke="#9abf09" d="M14.25,84.1C16.37,84.63,17.72,84.02,18.78,82.63C21.87,78.6,24.970000000000002,73.66999999999999,27.78,68.53"/>
<path id="酒-s4"  class="stroke" stroke="#2dbf09" d="M38.53,21.81C40.28,22.119999999999997,43.09,22.259999999999998,44.83,22.07C55.75,20.87,74,18.12,86.52,17.62C89.42,17.5,92.6,17.73,94.05,17.880000000000003"/>
<path id="酒-s5"  class="stroke" stroke="#09bf52" d="M42.95,39.12C43.6,39.8,44.1,41.22,44.11,42.15C44.11,43.08,44.13,86.87,44.13,87.33C44.13,87.78999999999999,44.07,90.25,44.07,91.21"/>
<path id="酒-s6"  class="stroke" stroke="#09bfbf" d="M45.17,40.77C48.83,40.580000000000005,84.78999999999999,35.980000000000004,88.13,35.78C90.91,35.61,92.89,36.79,92.89999999999999,39.42C92.91,40.89,92.74,74.73,92.74,84.92C92.74,86.88,92.74,88.88,92.53,91.12"/>
<path id="酒-s7"  class="stroke" stroke="#0952bf" d="M56.58,23.06C57.33,23.81,57.71,24.669999999999998,57.78,26.189999999999998C58.5,42.75,56.75,55.129999999999995,48.21,62.239999999999995"/>
<path id="酒-s8"  class="stroke" stroke="#2d09bf" d="M71.59,21.21C72.63000000000001,22.25,73.05,23.650000000000002,73.05,25.39C73.05,31.04,73.17,41.36,73.17,47.49C73.17,54,74,55.150000000000006,80.62,55.150000000000006C85.79,55.150000000000006,88,54.120000000000005,89.45,53.17000000000001"/>
<path id="酒-s9"  class="stroke" stroke="#9a09bf" d="M45.96,72.79C55.5,72.25,81.75,69.75,91.27000000000001,69.37"/>
<path id="酒-s10"  class="stroke" stroke="#bf0976" d="M46.05,87.82C56.129999999999995,87.11,78.75999999999999,85.80999999999999,91.32,85.11999999999999"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="酒-bg1"  class="badge-group"><circle cx="20.21" cy="16.92" r="3.5" fill="#bf0909"/><text class="num-single" x="20.21" y="16.92" dx="0" dy="-0.5">1</text></g>
<g id="酒-bg2"  class="badge-group"><circle cx="15.71" cy="39.29" r="3.5" fill="#bf7609"/><text class="num-single" x="15.71" y="39.29" dx="0" dy="-0.5">2</text></g>
<g id="酒-bg3"  class="badge-group"><circle cx="14.25" cy="84.1" r="3.5" fill="#9abf09"/><text class="num-single" x="14.25" y="84.1" dx="0" dy="-0.5">3</text></g>
<g id="酒-bg4"  class="badge-group"><circle cx="38.53" cy="21.81" r="3.5" fill="#2dbf09"/><text class="num-single" x="38.53" y="21.81" dx="0" dy="-0.5">4</text></g>
<g id="酒-bg5"  class="badge-group"><circle cx="42.95" cy="35.62" r="3.5" fill="#09bf52"/><text class="num-single" x="42.95" y="35.62" dx="0" dy="-0.5">5</text></g>
<g id="酒-bg6"  class="badge-group"><circle cx="45.17" cy="44.27" r="3.5" fill="#09bfbf"/><text class="num-single" x="45.17" y="44.27" dx="0" dy="-0.5">6</text></g>
<g id="酒-bg7"  class="badge-group"><circle cx="56.58" cy="23.06" r="3.5" fill="#0952bf"/><text class="num-single" x="56.58" y="23.06" dx="0" dy="-0.5">7</text></g>
<g id="酒-bg8"  class="badge-group"><circle cx="71.59" cy="21.21" r="3.5" fill="#2d09bf"/><text class="num-single" x="71.59" y="21.21" dx="0" dy="-0.5">8</text></g>
<g id="酒-bg9"  class="badge-group"><circle cx="45.96" cy="72.79" r="3.5" fill="#9a09bf"/><text class="num-single" x="45.96" y="72.79" dx="0" dy="-0.5">9</text></g>
<g id="酒-bg10" class="badge-group"><circle cx="46.05" cy="87.82" r="3.5" fill="#bf0976"/><text class="num-double" x="46.05" y="87.82" dx="-0.4" dy="-0.475">10</text></g>
</svg>