<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (綿)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #綿-bg[i]: Thời gian quả bóng số nảy lên
   - #綿-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#綿-bg1  { animation-delay: 0.05s; }
#綿-s1   { stroke-dasharray: 38.6841; stroke-dashoffset: 38.6841; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#綿-bg2  { animation-delay: 0.42s; }
#綿-s2   { stroke-dasharray: 70.2575; stroke-dashoffset: 70.2575; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#綿-bg3  { animation-delay: 0.96s; }
#綿-s3   { stroke-dasharray: 14.3272; stroke-dashoffset: 14.3272; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#綿-bg4  { animation-delay: 1.33s; }
#綿-s4   { stroke-dasharray: 37.6199; stroke-dashoffset: 37.6199; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#綿-bg5  { animation-delay: 1.70s; }
#綿-s5   { stroke-dasharray: 22.2116; stroke-dashoffset: 22.2116; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#綿-bg6  { animation-delay: 2.07s; }
#綿-s6   { stroke-dasharray: 15.2888; stroke-dashoffset: 15.2888; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#綿-bg7  { animation-delay: 2.44s; }
#綿-s7   { stroke-dasharray: 13.7889; stroke-dashoffset: 13.7889; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#綿-bg8  { animation-delay: 2.81s; }
#綿-s8   { stroke-dasharray: 28.0771; stroke-dashoffset: 28.0771; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#綿-bg9  { animation-delay: 3.18s; }
#綿-s9   { stroke-dasharray: 60.1180; stroke-dashoffset: 60.1180; animation: drawStroke 0.33s ease-out 3.31s forwards; }
#綿-bg10  { animation-delay: 3.66s; }
#綿-s10   { stroke-dasharray: 30.5995; stroke-dashoffset: 30.5995; animation: drawStroke 0.22s ease-out 3.79s forwards; }
#綿-bg11  { animation-delay: 4.03s; }
#綿-s11   { stroke-dasharray: 26.5509; stroke-dashoffset: 26.5509; animation: drawStroke 0.22s ease-out 4.16s forwards; }
#綿-bg12  { animation-delay: 4.40s; }
#綿-s12   { stroke-dasharray: 27.5590; stroke-dashoffset: 27.5590; animation: drawStroke 0.22s ease-out 4.53s forwards; }
#綿-bg13  { animation-delay: 4.77s; }
#綿-s13   { stroke-dasharray: 73.1769; stroke-dashoffset: 73.1769; animation: drawStroke 0.40s ease-out 4.90s forwards; }
#綿-bg14  { animation-delay: 5.32s; }
#綿-s14   { stroke-dasharray: 49.7181; stroke-dashoffset: 49.7181; animation: drawStroke 0.27s ease-out 5.45s forwards; }
]]>
</style>

