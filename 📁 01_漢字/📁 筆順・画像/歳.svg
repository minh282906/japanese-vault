<path id="歳-s5"  class="stroke" stroke="#25bf09" d="M23.01,49.94C23.91,50.839999999999996,23.970000000000002,52.21,23.930000000000003,53.9C23.570000000000004,69.66,19.190000000000005,93.61,9.810000000000004,100.94"/>
<path id="歳-s6"  class="stroke" stroke="#09bf41" d="M20.75,48.98C23.94,49.9,27.54,49.55,30.759999999999998,49.04C42.75,47.12,56.83,45.41,68.97999999999999,44.18C72.4,43.83,75.6,43.61,79,44.2"/>
