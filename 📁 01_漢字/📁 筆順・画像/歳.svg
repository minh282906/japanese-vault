<path id="歳-s8"  class="stroke" stroke="#0995bf" d="M45.37,63.37C46,64,46.529999999999994,64.88,46.529999999999994,66.37C46.529999999999994,76.92,46.589999999999996,85.63000000000001,46.589999999999996,89.23C46.589999999999996,97.39,41.37,90.32000000000001,40.279999999999994,89.41000000000001"/>
<path id="歳-s9"  class="stroke" stroke="#0941bf" d="M35.6,72.11C35.63,72.54,35.77,73.25,35.550000000000004,73.84C33.88,78.13000000000001,30.750000000000004,83.63,25.780000000000005,89.89"/>
<path id="歳-s10"  class="stroke" stroke="#2509bf" d="M53.75,69.38C56.03,71.71,59.65,78.94,60.22,82.56"/>
<path id="歳-s11"  class="stroke" stroke="#7909bf" d="M60,35.5C61.45,36.87,62.02,38.5,62.36,41.44C64.88,63.25,72.5,83,87.8,95.25C96.16,101.94,94.75,98.25,94.19,89.76"/>
<path id="歳-s12"  class="stroke" stroke="#bf09b1" d="M83.23,55.12C83.31,56.089999999999996,83.39,57.62,83.08,59.01C81.2,67.22,71.05,86.16,56.31,97.18"/>
<path id="歳-s13"  class="stroke" stroke="#bf095d" d="M81.75,37.15C84.85,39.089999999999996,89.8,43.51,91.25,46.83"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="歳-bg1"  class="badge-group"><circle cx="53.37" cy="9" r="3.5" fill="#bf0909"/><text class="num-single" x="53.37" y="9" dx="0" dy="-0.5">1</text></g>
