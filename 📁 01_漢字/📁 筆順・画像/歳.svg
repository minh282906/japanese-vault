<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (歳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #歳-bg[i]: Thời gian quả bóng số nảy lên
   - #歳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#歳-bg1  { animation-delay: 0.05s; }
#歳-s1   { stroke-dasharray: 21.7923; stroke-dashoffset: 21.7923; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#歳-bg2  { animation-delay: 0.42s; }
#歳-s2   { stroke-dasharray: 19.3399; stroke-dashoffset: 19.3399; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#歳-bg3  { animation-delay: 0.79s; }
#歳-s3   { stroke-dasharray: 15.7890; stroke-dashoffset: 15.7890; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#歳-bg4  { animation-delay: 1.16s; }
#歳-s4   { stroke-dasharray: 64.1155; stroke-dashoffset: 64.1155; animation: drawStroke 0.35s ease-out 1.29s forwards; }
#歳-bg5  { animation-delay: 1.66s; }
#歳-s5   { stroke-dasharray: 54.4073; stroke-dashoffset: 54.4073; animation: drawStroke 0.30s ease-out 1.79s forwards; }
#歳-bg6  { animation-delay: 2.11s; }
#歳-s6   { stroke-dasharray: 58.6771; stroke-dashoffset: 58.6771; animation: drawStroke 0.32s ease-out 2.24s forwards; }
#歳-bg7  { animation-delay: 2.58s; }
#歳-s7   { stroke-dasharray: 27.2539; stroke-dashoffset: 27.2539; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#歳-bg8  { animation-delay: 2.95s; }
#歳-s8   { stroke-dasharray: 36.8930; stroke-dashoffset: 36.8930; animation: drawStroke 0.22s ease-out 3.08s forwards; }
#歳-bg9  { animation-delay: 3.32s; }
#歳-s9   { stroke-dasharray: 20.6026; stroke-dashoffset: 20.6026; animation: drawStroke 0.22s ease-out 3.45s forwards; }
#歳-bg10  { animation-delay: 3.69s; }
#歳-s10   { stroke-dasharray: 14.8137; stroke-dashoffset: 14.8137; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#歳-bg11  { animation-delay: 4.06s; }
#歳-s11   { stroke-dasharray: 83.8758; stroke-dashoffset: 83.8758; animation: drawStroke 0.46s ease-out 4.19s forwards; }
#歳-bg12  { animation-delay: 4.67s; }
#歳-s12   { stroke-dasharray: 51.2379; stroke-dashoffset: 51.2379; animation: drawStroke 0.28s ease-out 4.80s forwards; }
#歳-bg13  { animation-delay: 5.10s; }
#歳-s13   { stroke-dasharray: 13.7066; stroke-dashoffset: 13.7066; animation: drawStroke 0.22s ease-out 5.23s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #歳-s[i]) -->
<path id="歳-s1"  class="stroke" stroke="#bf0909" d="M53.37,9C54.25,9.88,54.58,11.25,54.58,12.75C54.58,13.77,54.61,23.25,54.61,30.5"/>
