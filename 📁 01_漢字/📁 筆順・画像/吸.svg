<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (吸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #吸-bg[i]: Thời gian quả bóng số nảy lên
   - #吸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#吸-bg1  { animation-delay: 0.05s; }
#吸-s1   { stroke-dasharray: 24.8585; stroke-dashoffset: 24.8585; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#吸-bg2  { animation-delay: 0.42s; }
#吸-s2   { stroke-dasharray: 44.1915; stroke-dashoffset: 44.1915; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#吸-bg3  { animation-delay: 0.81s; }
#吸-s3   { stroke-dasharray: 20.1057; stroke-dashoffset: 20.1057; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#吸-bg4  { animation-delay: 1.18s; }
#吸-s4   { stroke-dasharray: 66.5942; stroke-dashoffset: 66.5942; animation: drawStroke 0.37s ease-out 1.31s forwards; }
#吸-bg5  { animation-delay: 1.70s; }
#吸-s5   { stroke-dasharray: 144.1210; stroke-dashoffset: 144.1210; animation: drawStroke 0.55s ease-out 1.83s forwards; }
#吸-bg6  { animation-delay: 2.40s; }
#吸-s6   { stroke-dasharray: 56.3857; stroke-dashoffset: 56.3857; animation: drawStroke 0.31s ease-out 2.53s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #吸-s[i]) -->
<path id="吸-s1"  class="stroke" stroke="#bf0909" d="M12.25,34.42C12.85,35.02,13.370000000000001,36.25,13.48,37.32C13.97,42.05,14.66,46.85,15.33,54.21C15.47,55.72,15.6,57.27,15.72,58.86"/>
<path id="吸-s2"  class="stroke" stroke="#bfbf09" d="M14.24,36.17C22.71,34.29,29.3,33.09,34.62,32.13C37.39,31.630000000000003,38.739999999999995,32.99,38.29,35.38C37.44,39.870000000000005,35.73,46.760000000000005,34.35,52.230000000000004"/>
<path id="吸-s3"  class="stroke" stroke="#09bf09" d="M16.67,55.61C21.18,55.16,26.35,54.1,32.5,53.269999999999996C33.85,53.089999999999996,35.21,52.919999999999995,36.57,52.76"/>
<path id="吸-s4"  class="stroke" stroke="#09bfbf" d="M52.32,30.71C53,32,53.02,33.68,52.74,35.47C50.75,48.25,41.75,74.25,21.130000000000003,86.42"/>
<path id="吸-s5"  class="stroke" stroke="#0909bf" d="M41.65,26.58C43.629999999999995,27.13,45.93,27.299999999999997,48.54,26.84C54.629999999999995,25.77,69.65,21.03,73.74,19.759999999999998S79.00999999999999,21.069999999999997,77.36,24.049999999999997C61.5,52.75,60.38,47.62,77,44.65C79.65,44.18,80.97,45.97,80.07,48.199999999999996C72.25,67.5,61.74999999999999,80.75,41.99999999999999,90.77"/>
<path id="吸-s6"  class="stroke" stroke="#bf09bf" d="M49.4,53.36C55.92,59.29,71.83,75.39,81.78999999999999,83.08C85.02999999999999,85.59,88.61999999999999,87.83,92.25,89.73"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="吸-bg1"  class="badge-group"><circle cx="12.25" cy="30.92" r="3.5" fill="#bf0909"/><text class="num-single" x="12.25" y="30.92" dx="0" dy="-0.5">1</text></g>
<g id="吸-bg2"  class="badge-group"><circle cx="14.24" cy="39.67" r="3.5" fill="#bfbf09"/><text class="num-single" x="14.24" y="39.67" dx="0" dy="-0.5">2</text></g>
<g id="吸-bg3"  class="badge-group"><circle cx="16.67" cy="55.61" r="3.5" fill="#09bf09"/><text class="num-single" x="16.67" y="55.61" dx="0" dy="-0.5">3</text></g>
<g id="吸-bg4"  class="badge-group"><circle cx="52.32" cy="30.71" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.32" y="30.71" dx="0" dy="-0.5">4</text></g>
<g id="吸-bg5"  class="badge-group"><circle cx="41.65" cy="26.58" r="3.5" fill="#0909bf"/><text class="num-single" x="41.65" y="26.58" dx="0" dy="-0.5">5</text></g>
<g id="吸-bg6"  class="badge-group"><circle cx="49.4" cy="53.36" r="3.5" fill="#bf09bf"/><text class="num-single" x="49.4" y="53.36" dx="0" dy="-0.5">6</text></g>
</svg>