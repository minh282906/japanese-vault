<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (確)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #確-bg[i]: Thời gian quả bóng số nảy lên
   - #確-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#確-bg1  { animation-delay: 0.05s; }
#確-s1   { stroke-dasharray: 28.4604; stroke-dashoffset: 28.4604; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#確-bg2  { animation-delay: 0.42s; }
#確-s2   { stroke-dasharray: 42.3741; stroke-dashoffset: 42.3741; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#確-bg3  { animation-delay: 0.80s; }
#確-s3   { stroke-dasharray: 25.5243; stroke-dashoffset: 25.5243; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#確-bg4  { animation-delay: 1.17s; }
#確-s4   { stroke-dasharray: 37.1273; stroke-dashoffset: 37.1273; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#確-bg5  { animation-delay: 1.54s; }
#確-s5   { stroke-dasharray: 14.7142; stroke-dashoffset: 14.7142; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#確-bg6  { animation-delay: 1.91s; }
#確-s6   { stroke-dasharray: 15.9260; stroke-dashoffset: 15.9260; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#確-bg7  { animation-delay: 2.28s; }
#確-s7   { stroke-dasharray: 53.4153; stroke-dashoffset: 53.4153; animation: drawStroke 0.29s ease-out 2.41s forwards; }
#確-bg8  { animation-delay: 2.72s; }
#確-s8   { stroke-dasharray: 57.9982; stroke-dashoffset: 57.9982; animation: drawStroke 0.32s ease-out 2.85s forwards; }
#確-bg9  { animation-delay: 3.19s; }
#確-s9   { stroke-dasharray: 44.6961; stroke-dashoffset: 44.6961; animation: drawStroke 0.25s ease-out 3.32s forwards; }
#確-bg10  { animation-delay: 3.59s; }
#確-s10   { stroke-dasharray: 13.5530; stroke-dashoffset: 13.5530; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#確-bg11  { animation-delay: 3.96s; }
#確-s11   { stroke-dasharray: 34.7458; stroke-dashoffset: 34.7458; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#確-bg12  { animation-delay: 4.33s; }
#確-s12   { stroke-dasharray: 36.6870; stroke-dashoffset: 36.6870; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#確-bg13  { animation-delay: 4.70s; }
#確-s13   { stroke-dasharray: 31.2701; stroke-dashoffset: 31.2701; animation: drawStroke 0.22s ease-out 4.83s forwards; }
#確-bg14  { animation-delay: 5.07s; }
#確-s14   { stroke-dasharray: 32.0233; stroke-dashoffset: 32.0233; animation: drawStroke 0.22s ease-out 5.20s forwards; }
#確-bg15  { animation-delay: 5.44s; }
#確-s15   { stroke-dasharray: 38.0881; stroke-dashoffset: 38.0881; animation: drawStroke 0.22s ease-out 5.57s forwards; }
]]>
</style>

