<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (諸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #諸-bg[i]: Thời gian quả bóng số nảy lên
   - #諸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#諸-bg1  { animation-delay: 0.05s; }
#諸-s1   { stroke-dasharray: 12.3904; stroke-dashoffset: 12.3904; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#諸-bg2  { animation-delay: 0.42s; }
#諸-s2   { stroke-dasharray: 30.6309; stroke-dashoffset: 30.6309; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#諸-bg3  { animation-delay: 0.79s; }
#諸-s3   { stroke-dasharray: 20.4788; stroke-dashoffset: 20.4788; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#諸-bg4  { animation-delay: 1.16s; }
#諸-s4   { stroke-dasharray: 21.6676; stroke-dashoffset: 21.6676; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#諸-bg5  { animation-delay: 1.53s; }
#諸-s5   { stroke-dasharray: 22.1383; stroke-dashoffset: 22.1383; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#諸-bg6  { animation-delay: 1.90s; }
#諸-s6   { stroke-dasharray: 36.8103; stroke-dashoffset: 36.8103; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#諸-bg7  { animation-delay: 2.27s; }
#諸-s7   { stroke-dasharray: 16.7117; stroke-dashoffset: 16.7117; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#諸-bg8  { animation-delay: 2.64s; }
#諸-s8   { stroke-dasharray: 30.2760; stroke-dashoffset: 30.2760; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#諸-bg9  { animation-delay: 3.01s; }
#諸-s9   { stroke-dasharray: 30.7897; stroke-dashoffset: 30.7897; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#諸-bg10  { animation-delay: 3.38s; }
#諸-s10   { stroke-dasharray: 52.0784; stroke-dashoffset: 52.0784; animation: drawStroke 0.29s ease-out 3.51s forwards; }
#諸-bg11  { animation-delay: 3.82s; }
#諸-s11   { stroke-dasharray: 72.5557; stroke-dashoffset: 72.5557; animation: drawStroke 0.40s ease-out 3.95s forwards; }
#諸-bg12  { animation-delay: 4.37s; }
#諸-s12   { stroke-dasharray: 33.4460; stroke-dashoffset: 33.4460; animation: drawStroke 0.22s ease-out 4.50s forwards; }
#諸-bg13  { animation-delay: 4.74s; }
#諸-s13   { stroke-dasharray: 58.4053; stroke-dashoffset: 58.4053; animation: drawStroke 0.32s ease-out 4.87s forwards; }
#諸-bg14  { animation-delay: 5.21s; }
#諸-s14   { stroke-dasharray: 23.0878; stroke-dashoffset: 23.0878; animation: drawStroke 0.22s ease-out 5.34s forwards; }
#諸-bg15  { animation-delay: 5.58s; }
#諸-s15   { stroke-dasharray: 22.6790; stroke-dashoffset: 22.6790; animation: drawStroke 0.22s ease-out 5.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
