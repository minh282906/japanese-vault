<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (陽)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #陽-bg[i]: Thời gian quả bóng số nảy lên
   - #陽-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#陽-bg1  { animation-delay: 0.05s; }
#陽-s1   { stroke-dasharray: 41.9127; stroke-dashoffset: 41.9127; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#陽-bg2  { animation-delay: 0.43s; }
#陽-s2   { stroke-dasharray: 38.1147; stroke-dashoffset: 38.1147; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#陽-bg3  { animation-delay: 0.80s; }
#陽-s3   { stroke-dasharray: 77.0737; stroke-dashoffset: 77.0737; animation: drawStroke 0.42s ease-out 0.93s forwards; }
#陽-bg4  { animation-delay: 1.37s; }
#陽-s4   { stroke-dasharray: 24.7571; stroke-dashoffset: 24.7571; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#陽-bg5  { animation-delay: 1.74s; }
#陽-s5   { stroke-dasharray: 54.2136; stroke-dashoffset: 54.2136; animation: drawStroke 0.30s ease-out 1.87s forwards; }
#陽-bg6  { animation-delay: 2.19s; }
#陽-s6   { stroke-dasharray: 26.0534; stroke-dashoffset: 26.0534; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#陽-bg7  { animation-delay: 2.56s; }
#陽-s7   { stroke-dasharray: 22.2130; stroke-dashoffset: 22.2130; animation: drawStroke 0.22s ease-out 2.69s forwards; }
#陽-bg8  { animation-delay: 2.93s; }
#陽-s8   { stroke-dasharray: 52.8188; stroke-dashoffset: 52.8188; animation: drawStroke 0.29s ease-out 3.06s forwards; }
#陽-bg9  { animation-delay: 3.37s; }
#陽-s9   { stroke-dasharray: 27.5662; stroke-dashoffset: 27.5662; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#陽-bg10  { animation-delay: 3.74s; }
#陽-s10   { stroke-dasharray: 82.6005; stroke-dashoffset: 82.6005; animation: drawStroke 0.45s ease-out 3.87s forwards; }
#陽-bg11  { animation-delay: 4.34s; }
#陽-s11   { stroke-dasharray: 29.8495; stroke-dashoffset: 29.8495; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#陽-bg12  { animation-delay: 4.71s; }
#陽-s12   { stroke-dasharray: 45.4165; stroke-dashoffset: 45.4165; animation: drawStroke 0.25s ease-out 4.84s forwards; }
]]>
</style>

