<path id="陽-s10"  class="stroke" stroke="#6409bf" d="M57.3,59.95C58.29,60.52,60.07,60.61,61.059999999999995,60.550000000000004C63.87,60.370000000000005,85.19999999999999,57.980000000000004,88.78,57.870000000000005C92.36,57.760000000000005,93.01,60.440000000000005,92.06,63.690000000000005C90.65,68.51,88.04,80.89,80.7,92.05000000000001C77.57000000000001,96.80000000000001,75.34,97.50000000000001,71.37,93.23000000000002"/>
