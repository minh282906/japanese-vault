<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (題)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #題-bg[i]: Thời gian quả bóng số nảy lên
   - #題-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#題-bg1  { animation-delay: 0.05s; }
#題-s1   { stroke-dasharray: 27.7546; stroke-dashoffset: 27.7546; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#題-bg2  { animation-delay: 0.42s; }
#題-s2   { stroke-dasharray: 49.1040; stroke-dashoffset: 49.1040; animation: drawStroke 0.27s ease-out 0.55s forwards; }
#題-bg3  { animation-delay: 0.84s; }
#題-s3   { stroke-dasharray: 20.6739; stroke-dashoffset: 20.6739; animation: drawStroke 0.22s ease-out 0.97s forwards; }
#題-bg4  { animation-delay: 1.21s; }
#題-s4   { stroke-dasharray: 17.9038; stroke-dashoffset: 17.9038; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#題-bg5  { animation-delay: 1.58s; }
#題-s5   { stroke-dasharray: 39.4687; stroke-dashoffset: 39.4687; animation: drawStroke 0.22s ease-out 1.71s forwards; }
#題-bg6  { animation-delay: 1.95s; }
#題-s6   { stroke-dasharray: 27.4098; stroke-dashoffset: 27.4098; animation: drawStroke 0.22s ease-out 2.08s forwards; }
#題-bg7  { animation-delay: 2.32s; }
#題-s7   { stroke-dasharray: 15.2250; stroke-dashoffset: 15.2250; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#題-bg8  { animation-delay: 2.69s; }
#題-s8   { stroke-dasharray: 30.7196; stroke-dashoffset: 30.7196; animation: drawStroke 0.22s ease-out 2.82s forwards; }
#題-bg9  { animation-delay: 3.06s; }
#題-s9   { stroke-dasharray: 71.2194; stroke-dashoffset: 71.2194; animation: drawStroke 0.39s ease-out 3.19s forwards; }
#題-bg10  { animation-delay: 3.60s; }
#題-s10   { stroke-dasharray: 38.0502; stroke-dashoffset: 38.0502; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#題-bg11  { animation-delay: 3.97s; }
#題-s11   { stroke-dasharray: 11.4040; stroke-dashoffset: 11.4040; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#題-bg12  { animation-delay: 4.34s; }
#題-s12   { stroke-dasharray: 39.9669; stroke-dashoffset: 39.9669; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#題-bg13  { animation-delay: 4.71s; }
#題-s13   { stroke-dasharray: 66.8750; stroke-dashoffset: 66.8750; animation: drawStroke 0.37s ease-out 4.84s forwards; }
#題-bg14  { animation-delay: 5.23s; }
#題-s14   { stroke-dasharray: 25.8572; stroke-dashoffset: 25.8572; animation: drawStroke 0.22s ease-out 5.36s forwards; }
#題-bg15  { animation-delay: 5.60s; }
#題-s15   { stroke-dasharray: 25.3981; stroke-dashoffset: 25.3981; animation: drawStroke 0.22s ease-out 5.73s forwards; }
#題-bg16  { animation-delay: 5.97s; }
#題-s16   { stroke-dasharray: 25.3905; stroke-dashoffset: 25.3905; animation: drawStroke 0.22s ease-out 6.10s forwards; }
#題-bg17  { animation-delay: 6.34s; }
#題-s17   { stroke-dasharray: 17.7503; stroke-dashoffset: 17.7503; animation: drawStroke 0.22s ease-out 6.47s forwards; }
#題-bg18  { animation-delay: 6.71s; }
#題-s18   { stroke-dasharray: 17.1819; stroke-dashoffset: 17.1819; animation: drawStroke 0.22s ease-out 6.84s forwards; }
]]>
</style>

