<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (全)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #全-bg[i]: Thời gian quả bóng số nảy lên
   - #全-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#全-bg1  { animation-delay: 0.05s; }
#全-s1   { stroke-dasharray: 61.3691; stroke-dashoffset: 61.3691; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#全-bg2  { animation-delay: 0.54s; }
#全-s2   { stroke-dasharray: 56.2560; stroke-dashoffset: 56.2560; animation: drawStroke 0.31s ease-out 0.67s forwards; }
#全-bg3  { animation-delay: 1.00s; }
#全-s3   { stroke-dasharray: 38.9975; stroke-dashoffset: 38.9975; animation: drawStroke 0.22s ease-out 1.13s forwards; }
#全-bg4  { animation-delay: 1.37s; }
#全-s4   { stroke-dasharray: 35.2208; stroke-dashoffset: 35.2208; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#全-bg5  { animation-delay: 1.74s; }
#全-s5   { stroke-dasharray: 37.0045; stroke-dashoffset: 37.0045; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#全-bg6  { animation-delay: 2.11s; }
#全-s6   { stroke-dasharray: 66.6477; stroke-dashoffset: 66.6477; animation: drawStroke 0.37s ease-out 2.24s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #全-s[i]) -->
<path id="全-s1"  class="stroke" stroke="#bf0909" d="M51,12C51.1,13.1,50.89,14.9,50.29,16.42C46.54,25.91,34.42,46.29,13.88,59"/>
<path id="全-s2"  class="stroke" stroke="#bfbf09" d="M51.25,17.13C57.26,22.84,75.62,40.65,84.28,48.34C87.36,51.07,89.13,52.120000000000005,93.5,53.84"/>
<path id="全-s3"  class="stroke" stroke="#09bf09" d="M32.17,53.79C34.120000000000005,54.38,36.82,54.26,38.620000000000005,54.05C44.660000000000004,53.339999999999996,56.14,51.91,64.63000000000001,51.36C66.74000000000001,51.23,69.13000000000001,51.24,70.95000000000002,51.69"/>
<path id="全-s4"  class="stroke" stroke="#09bfbf" d="M50.91,54.99C51.83,55.910000000000004,52.309999999999995,57.29,52.309999999999995,58.190000000000005C52.309999999999995,64.49000000000001,52.28999999999999,82.25,52.28999999999999,89.84"/>
<path id="全-s5"  class="stroke" stroke="#0909bf" d="M33.45,71.93C35.290000000000006,72.5,37.38,72.24000000000001,39.260000000000005,72.05000000000001C47.470000000000006,71.25000000000001,55.63000000000001,70.65,64.01,69.91000000000001C66.08,69.73,68.24000000000001,69.45000000000002,70.28,70.03000000000002"/>
<path id="全-s6"  class="stroke" stroke="#bf09bf" d="M20.48,92.76C22.39,93.25,25.37,93.55000000000001,28.78,93.26C42.370000000000005,92.12,62.25,90.37,79.17,89.81C82.03,89.72,85.47,90.04,86.9,90.49000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="全-bg1"  class="badge-group"><circle cx="51" cy="8.5" r="3.5" fill="#bf0909"/><text class="num-single" x="51" y="8.5" dx="0" dy="-0.5">1</text></g>
<g id="全-bg2"  class="badge-group"><circle cx="51.25" cy="20.63" r="3.5" fill="#bfbf09"/><text class="num-single" x="51.25" y="20.63" dx="0" dy="-0.5">2</text></g>
<g id="全-bg3"  class="badge-group"><circle cx="32.17" cy="53.79" r="3.5" fill="#09bf09"/><text class="num-single" x="32.17" y="53.79" dx="0" dy="-0.5">3</text></g>
<g id="全-bg4"  class="badge-group"><circle cx="50.91" cy="54.99" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.91" y="54.99" dx="0" dy="-0.5">4</text></g>
<g id="全-bg5"  class="badge-group"><circle cx="33.45" cy="71.93" r="3.5" fill="#0909bf"/><text class="num-single" x="33.45" y="71.93" dx="0" dy="-0.5">5</text></g>
<g id="全-bg6"  class="badge-group"><circle cx="20.48" cy="92.76" r="3.5" fill="#bf09bf"/><text class="num-single" x="20.48" y="92.76" dx="0" dy="-0.5">6</text></g>
</svg>