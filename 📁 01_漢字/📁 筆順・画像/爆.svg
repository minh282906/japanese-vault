<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (爆)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #爆-bg[i]: Thời gian quả bóng số nảy lên
   - #爆-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#爆-bg1  { animation-delay: 0.05s; }
#爆-s1   { stroke-dasharray: 16.5678; stroke-dashoffset: 16.5678; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#爆-bg2  { animation-delay: 0.42s; }
#爆-s2   { stroke-dasharray: 16.8094; stroke-dashoffset: 16.8094; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#爆-bg3  { animation-delay: 0.79s; }
#爆-s3   { stroke-dasharray: 75.3835; stroke-dashoffset: 75.3835; animation: drawStroke 0.41s ease-out 0.92s forwards; }
#爆-bg4  { animation-delay: 1.35s; }
#爆-s4   { stroke-dasharray: 13.2219; stroke-dashoffset: 13.2219; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#爆-bg5  { animation-delay: 1.72s; }
#爆-s5   { stroke-dasharray: 21.4319; stroke-dashoffset: 21.4319; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#爆-bg6  { animation-delay: 2.09s; }
#爆-s6   { stroke-dasharray: 57.1474; stroke-dashoffset: 57.1474; animation: drawStroke 0.31s ease-out 2.22s forwards; }
#爆-bg7  { animation-delay: 2.55s; }
#爆-s7   { stroke-dasharray: 32.3286; stroke-dashoffset: 32.3286; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#爆-bg8  { animation-delay: 2.92s; }
#爆-s8   { stroke-dasharray: 27.9201; stroke-dashoffset: 27.9201; animation: drawStroke 0.22s ease-out 3.05s forwards; }
#爆-bg9  { animation-delay: 3.29s; }
#爆-s9   { stroke-dasharray: 40.8028; stroke-dashoffset: 40.8028; animation: drawStroke 0.22s ease-out 3.42s forwards; }
#爆-bg10  { animation-delay: 3.66s; }
#爆-s10   { stroke-dasharray: 18.0796; stroke-dashoffset: 18.0796; animation: drawStroke 0.22s ease-out 3.79s forwards; }
#爆-bg11  { animation-delay: 4.03s; }
#爆-s11   { stroke-dasharray: 18.0320; stroke-dashoffset: 18.0320; animation: drawStroke 0.22s ease-out 4.16s forwards; }
#爆-bg12  { animation-delay: 4.40s; }
#爆-s12   { stroke-dasharray: 54.9870; stroke-dashoffset: 54.9870; animation: drawStroke 0.30s ease-out 4.53s forwards; }
#爆-bg13  { animation-delay: 4.85s; }
#爆-s13   { stroke-dasharray: 31.7494; stroke-dashoffset: 31.7494; animation: drawStroke 0.22s ease-out 4.98s forwards; }
#爆-bg14  { animation-delay: 5.22s; }
#爆-s14   { stroke-dasharray: 32.0210; stroke-dashoffset: 32.0210; animation: drawStroke 0.22s ease-out 5.35s forwards; }
#爆-bg15  { animation-delay: 5.59s; }
#爆-s15   { stroke-dasharray: 38.6679; stroke-dashoffset: 38.6679; animation: drawStroke 0.22s ease-out 5.72s forwards; }
#爆-bg16  { animation-delay: 5.96s; }
#爆-s16   { stroke-dasharray: 6.6955; stroke-dashoffset: 6.6955; animation: drawStroke 0.22s ease-out 6.09s forwards; }
#爆-bg17  { animation-delay: 6.33s; }
#爆-s17   { stroke-dasharray: 15.1925; stroke-dashoffset: 15.1925; animation: drawStroke 0.22s ease-out 6.46s forwards; }
#爆-bg18  { animation-delay: 6.70s; }
#爆-s18   { stroke-dasharray: 9.8262; stroke-dashoffset: 9.8262; animation: drawStroke 0.22s ease-out 6.83s forwards; }
#爆-bg19  { animation-delay: 7.07s; }
#爆-s19   { stroke-dasharray: 19.4693; stroke-dashoffset: 19.4693; animation: drawStroke 0.22s ease-out 7.20s forwards; }
]]>
</style>

