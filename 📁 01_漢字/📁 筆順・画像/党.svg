<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (党)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #党-bg[i]: Thời gian quả bóng số nảy lên
   - #党-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#党-bg1  { animation-delay: 0.05s; }
#党-s1   { stroke-dasharray: 21.1622; stroke-dashoffset: 21.1622; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#党-bg2  { animation-delay: 0.42s; }
#党-s2   { stroke-dasharray: 14.7996; stroke-dashoffset: 14.7996; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#党-bg3  { animation-delay: 0.79s; }
#党-s3   { stroke-dasharray: 17.9310; stroke-dashoffset: 17.9310; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#党-bg4  { animation-delay: 1.16s; }
#党-s4   { stroke-dasharray: 18.7389; stroke-dashoffset: 18.7389; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#党-bg5  { animation-delay: 1.53s; }
#党-s5   { stroke-dasharray: 83.7146; stroke-dashoffset: 83.7146; animation: drawStroke 0.46s ease-out 1.66s forwards; }
#党-bg6  { animation-delay: 2.14s; }
#党-s6   { stroke-dasharray: 20.3160; stroke-dashoffset: 20.3160; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#党-bg7  { animation-delay: 2.51s; }
#党-s7   { stroke-dasharray: 50.4813; stroke-dashoffset: 50.4813; animation: drawStroke 0.28s ease-out 2.64s forwards; }
#党-bg8  { animation-delay: 2.94s; }
#党-s8   { stroke-dasharray: 31.7315; stroke-dashoffset: 31.7315; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#党-bg9  { animation-delay: 3.31s; }
#党-s9   { stroke-dasharray: 40.5466; stroke-dashoffset: 40.5466; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#党-bg10  { animation-delay: 3.68s; }
#党-s10   { stroke-dasharray: 68.1475; stroke-dashoffset: 68.1475; animation: drawStroke 0.37s ease-out 3.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #党-s[i]) -->
<path id="党-s1"  class="stroke" stroke="#bf0909" d="M52.46,13.37C53.5,14.25,53.97,15.719999999999999,53.97,17.36C53.97,24.75,53.96,31.43,53.96,34.120000000000005"/>
<path id="党-s2"  class="stroke" stroke="#bf7609" d="M29.02,19.71C32.3,21.7,37.49,27.880000000000003,38.31,30.97"/>
<path id="党-s3"  class="stroke" stroke="#9abf09" d="M77.01,16.25C77.08,17.09,76.99000000000001,17.91,76.64,18.67C75,22.25,73.02,25.87,68.81,31.970000000000002"/>
<path id="党-s4"  class="stroke" stroke="#2dbf09" d="M19.75,36.12C19.61,40.769999999999996,17.19,51.66,16,54.42999999999999"/>
<path id="党-s5"  class="stroke" stroke="#09bf52" d="M20.74,39.18C33.5,37.38,66,33.88,87.28999999999999,32.81C100.22999999999999,32.160000000000004,88.19,40.75,86.63999999999999,42.010000000000005"/>
<path id="党-s6"  class="stroke" stroke="#09bfbf" d="M34.64,46.98C35.33,47.669999999999995,36,48.5,36.19,49.489999999999995C36.8,52.73,37.769999999999996,57.269999999999996,38.629999999999995,61.72C38.949999999999996,63.4,39.239999999999995,65.03,39.449999999999996,66.5"/>
<path id="党-s7"  class="stroke" stroke="#0952bf" d="M36.52,48.13C41.36,47.38,58.660000000000004,45.49,66.74000000000001,44.63C70.25000000000001,44.25,72.25000000000001,46,71.74000000000001,48.690000000000005C70.92000000000002,52.99,70.38000000000001,54.88,69.32000000000001,60.790000000000006"/>
<path id="党-s8"  class="stroke" stroke="#2d09bf" d="M39.58,63.69C49.379999999999995,62.71,56.95,62.12,65.52,61.58C67.36999999999999,61.46,69.5,61.37,71.22,61.449999999999996"/>
<path id="党-s9"  class="stroke" stroke="#9a09bf" d="M44.99,66.75C45.06,67.41,45.27,68.43,45.1,69.42C43.870000000000005,76.38,36.620000000000005,88.75,19.42,95.17"/>
<path id="党-s10"  class="stroke" stroke="#bf0976" d="M58.24,64.12C59.120000000000005,65,59.52,66.14,59.52,67.58C59.52,75,59.53,80.69,59.53,85.03999999999999C59.53,94.63,60.88,95.28999999999999,76.02,95.28999999999999C92.00999999999999,95.28999999999999,92.89,94.24999999999999,92.89,85.91"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="党-bg1"  class="badge-group"><circle cx="52.46" cy="13.37" r="3.5" fill="#bf0909"/><text class="num-single" x="52.46" y="13.37" dx="0" dy="-0.5">1</text></g>
<g id="党-bg2"  class="badge-group"><circle cx="29.02" cy="19.71" r="3.5" fill="#bf7609"/><text class="num-single" x="29.02" y="19.71" dx="0" dy="-0.5">2</text></g>
<g id="党-bg3"  class="badge-group"><circle cx="77.01" cy="16.25" r="3.5" fill="#9abf09"/><text class="num-single" x="77.01" y="16.25" dx="0" dy="-0.5">3</text></g>
<g id="党-bg4"  class="badge-group"><circle cx="19.75" cy="32.62" r="3.5" fill="#2dbf09"/><text class="num-single" x="19.75" y="32.62" dx="0" dy="-0.5">4</text></g>
<g id="党-bg5"  class="badge-group"><circle cx="20.74" cy="42.68" r="3.5" fill="#09bf52"/><text class="num-single" x="20.74" y="42.68" dx="0" dy="-0.5">5</text></g>
<g id="党-bg6"  class="badge-group"><circle cx="34.64" cy="43.48" r="3.5" fill="#09bfbf"/><text class="num-single" x="34.64" y="43.48" dx="0" dy="-0.5">6</text></g>
<g id="党-bg7"  class="badge-group"><circle cx="36.52" cy="51.63" r="3.5" fill="#0952bf"/><text class="num-single" x="36.52" y="51.63" dx="0" dy="-0.5">7</text></g>
<g id="党-bg8"  class="badge-group"><circle cx="39.58" cy="60.19" r="3.5" fill="#2d09bf"/><text class="num-single" x="39.58" y="60.19" dx="0" dy="-0.5">8</text></g>
<g id="党-bg9"  class="badge-group"><circle cx="44.99" cy="70.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="44.99" y="70.25" dx="0" dy="-0.5">9</text></g>
<g id="党-bg10" class="badge-group"><circle cx="58.24" cy="64.12" r="3.5" fill="#bf0976"/><text class="num-double" x="58.24" y="64.12" dx="-0.4" dy="-0.475">10</text></g>
</svg>