<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (午)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #午-bg[i]: Thời gian quả bóng số nảy lên
   - #午-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#午-bg1  { animation-delay: 0.05s; }
#午-s1   { stroke-dasharray: 36.6225; stroke-dashoffset: 36.6225; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#午-bg2  { animation-delay: 0.42s; }
#午-s2   { stroke-dasharray: 45.2440; stroke-dashoffset: 45.2440; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#午-bg3  { animation-delay: 0.82s; }
#午-s3   { stroke-dasharray: 82.0118; stroke-dashoffset: 82.0118; animation: drawStroke 0.45s ease-out 0.95s forwards; }
#午-bg4  { animation-delay: 1.42s; }
#午-s4   { stroke-dasharray: 71.7396; stroke-dashoffset: 71.7396; animation: drawStroke 0.39s ease-out 1.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #午-s[i]) -->
<path id="午-s1"  class="stroke" stroke="#bf0909" d="M37.5,9.14C37.56,9.84,37.72,10.99,37.39,11.97C35.25,18.25,27,29.62,17.5,39"/>
<path id="午-s2"  class="stroke" stroke="#64bf09" d="M32.13,27.28C34.88,27.37,36.43,27.21,37.95,27.07C50.870000000000005,25.87,58.730000000000004,24.25,71.05000000000001,22.39C73.54,22.01,75.74000000000001,22.150000000000002,77.00000000000001,22.42"/>
<path id="午-s3"  class="stroke" stroke="#09bfbf" d="M13.88,54.53C16.880000000000003,55.25,21.11,55.24,23.62,54.99C43.260000000000005,53,66.26,50,86.62,48.83C90.84,48.589999999999996,93.39,49.05,95.51,49.28"/>
<path id="午-s4"  class="stroke" stroke="#6409bf" d="M53.06,28.13C54.09,29.16,54.85,30.5,54.85,32.46C54.85,33.34,54.83,76.63,54.72,93.5C54.699999999999996,96.38,54.69,98.46,54.67,99.38"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="午-bg1"  class="badge-group"><circle cx="37.5" cy="9.14" r="3.5" fill="#bf0909"/><text class="num-single" x="37.5" y="9.14" dx="0" dy="-0.5">1</text></g>
<g id="午-bg2"  class="badge-group"><circle cx="32.13" cy="27.28" r="3.5" fill="#64bf09"/><text class="num-single" x="32.13" y="27.28" dx="0" dy="-0.5">2</text></g>
<g id="午-bg3"  class="badge-group"><circle cx="13.88" cy="54.53" r="3.5" fill="#09bfbf"/><text class="num-single" x="13.88" y="54.53" dx="0" dy="-0.5">3</text></g>
<g id="午-bg4"  class="badge-group"><circle cx="53.06" cy="28.13" r="3.5" fill="#6409bf"/><text class="num-single" x="53.06" y="28.13" dx="0" dy="-0.5">4</text></g>
</svg>