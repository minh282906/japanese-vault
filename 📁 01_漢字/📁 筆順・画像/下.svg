<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (下)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #下-bg[i]: Thời gian quả bóng số nảy lên
   - #下-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#下-bg1  { animation-delay: 0.05s; }
#下-s1   { stroke-dasharray: 82.3735; stroke-dashoffset: 82.3735; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#下-bg2  { animation-delay: 0.65s; }
#下-s2   { stroke-dasharray: 71.0935; stroke-dashoffset: 71.0935; animation: drawStroke 0.39s ease-out 0.78s forwards; }
#下-bg3  { animation-delay: 1.19s; }
#下-s3   { stroke-dasharray: 20.8552; stroke-dashoffset: 20.8552; animation: drawStroke 0.22s ease-out 1.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #下-s[i]) -->
<path id="下-s1"  class="stroke" stroke="#bf0909" d="M13.25,22.5C14.19,22.73,18.43,23.46,20.990000000000002,23.25C38.86,21.75,67.53,18.5,87.37,18.5C90.29,18.5,93.79,19.25,95.25,19.75"/>
<path id="下-s2"  class="stroke" stroke="#09bf09" d="M52.97,23.25C53.9,24.32,54.53,26,54.53,28.55C54.53,37.2,54.33,67.97,54.26,85.75C54.239999999999995,89.61,54.239999999999995,91.64,54.239999999999995,94"/>
<path id="下-s3"  class="stroke" stroke="#0909bf" d="M67.83,37.17C72.75,39.5,79.88,47.62,82,52.12"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="下-bg1"  class="badge-group"><circle cx="13.25" cy="22.5" r="3.5" fill="#bf0909"/><text class="num-single" x="13.25" y="22.5" dx="0" dy="-0.5">1</text></g>
<g id="下-bg2"  class="badge-group"><circle cx="52.97" cy="23.25" r="3.5" fill="#09bf09"/><text class="num-single" x="52.97" y="23.25" dx="0" dy="-0.5">2</text></g>
<g id="下-bg3"  class="badge-group"><circle cx="67.83" cy="37.17" r="3.5" fill="#0909bf"/><text class="num-single" x="67.83" y="37.17" dx="0" dy="-0.5">3</text></g>
</svg>