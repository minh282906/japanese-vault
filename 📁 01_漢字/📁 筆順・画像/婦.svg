<path id="婦-s9"  class="stroke" stroke="#4b09bf" d="M53.41,61.11C54.089999999999996,61.79,54.68,63,54.68,63.87C54.68,64.28999999999999,54.67,75.47,54.589999999999996,82C54.56999999999999,83.74,54.55,85.11,54.529999999999994,85.81"/>
<path id="婦-s10"  class="stroke" stroke="#ae09bf" d="M55.59,62.77C61.25,62,82.36,59.1,84.51,58.99C87.03,58.86,87.98,61.31,87.99000000000001,62.52C88,68.5,87.9,73.87,87.9,79.83C87.9,90.12,82.25,82,81.15,80.95"/>
<path id="婦-s11"  class="stroke" stroke="#bf096c" d="M69.05,50.35C69.66,50.96,70.3,52,70.3,53.36C70.3,53.79,70.28999999999999,80.78999999999999,70.23,93C70.21000000000001,95.98,70.2,98.1,70.18,98.74"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="婦-bg1"  class="badge-group"><circle cx="24.28" cy="20.62" r="3.5" fill="#bf0909"/><text class="num-single" x="24.28" y="20.62" dx="0" dy="-0.5">1</text></g>
