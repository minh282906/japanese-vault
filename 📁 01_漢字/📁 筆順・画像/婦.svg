<path id="婦-s6"  class="stroke" stroke="#09bf8d" d="M51.75,38.62C53.58,39.19,55.8,38.73,57.64,38.529999999999994C64.64,37.769999999999996,72.34,36.55,81.03,36.00999999999999C82.36,35.92999999999999,83.85,35.98999999999999,85.01,35.86999999999999"/>
