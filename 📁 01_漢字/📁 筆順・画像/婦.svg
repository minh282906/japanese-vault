<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (婦)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #婦-bg[i]: Thời gian quả bóng số nảy lên
   - #婦-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#婦-bg1  { animation-delay: 0.05s; }
#婦-s1   { stroke-dasharray: 72.9843; stroke-dashoffset: 72.9843; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#婦-bg2  { animation-delay: 0.60s; }
#婦-s2   { stroke-dasharray: 57.8424; stroke-dashoffset: 57.8424; animation: drawStroke 0.32s ease-out 0.73s forwards; }
#婦-bg3  { animation-delay: 1.07s; }
#婦-s3   { stroke-dasharray: 34.7457; stroke-dashoffset: 34.7457; animation: drawStroke 0.22s ease-out 1.20s forwards; }
#婦-bg4  { animation-delay: 1.44s; }
#婦-s4   { stroke-dasharray: 57.5588; stroke-dashoffset: 57.5588; animation: drawStroke 0.32s ease-out 1.57s forwards; }
#婦-bg5  { animation-delay: 1.91s; }
#婦-s5   { stroke-dasharray: 34.3161; stroke-dashoffset: 34.3161; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#婦-bg6  { animation-delay: 2.28s; }
#婦-s6   { stroke-dasharray: 33.4487; stroke-dashoffset: 33.4487; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#婦-bg7  { animation-delay: 2.65s; }
#婦-s7   { stroke-dasharray: 16.0910; stroke-dashoffset: 16.0910; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#婦-bg8  { animation-delay: 3.02s; }
#婦-s8   { stroke-dasharray: 59.4995; stroke-dashoffset: 59.4995; animation: drawStroke 0.33s ease-out 3.15s forwards; }
#婦-bg9  { animation-delay: 3.50s; }
#婦-s9   { stroke-dasharray: 25.0424; stroke-dashoffset: 25.0424; animation: drawStroke 0.22s ease-out 3.63s forwards; }
#婦-bg10  { animation-delay: 3.87s; }
#婦-s10   { stroke-dasharray: 64.4305; stroke-dashoffset: 64.4305; animation: drawStroke 0.35s ease-out 4.00s forwards; }
#婦-bg11  { animation-delay: 4.37s; }
#婦-s11   { stroke-dasharray: 48.7243; stroke-dashoffset: 48.7243; animation: drawStroke 0.27s ease-out 4.50s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

