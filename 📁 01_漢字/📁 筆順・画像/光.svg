<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (光)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #光-bg[i]: Thời gian quả bóng số nảy lên
   - #光-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#光-bg1  { animation-delay: 0.05s; }
#光-s1   { stroke-dasharray: 32.3720; stroke-dashoffset: 32.3720; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#光-bg2  { animation-delay: 0.42s; }
#光-s2   { stroke-dasharray: 19.0237; stroke-dashoffset: 19.0237; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#光-bg3  { animation-delay: 0.79s; }
#光-s3   { stroke-dasharray: 23.6368; stroke-dashoffset: 23.6368; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#光-bg4  { animation-delay: 1.16s; }
#光-s4   { stroke-dasharray: 75.2374; stroke-dashoffset: 75.2374; animation: drawStroke 0.41s ease-out 1.29s forwards; }
#光-bg5  { animation-delay: 1.72s; }
#光-s5   { stroke-dasharray: 46.4629; stroke-dashoffset: 46.4629; animation: drawStroke 0.26s ease-out 1.85s forwards; }
#光-bg6  { animation-delay: 2.13s; }
#光-s6   { stroke-dasharray: 75.4207; stroke-dashoffset: 75.4207; animation: drawStroke 0.41s ease-out 2.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #光-s[i]) -->
<path id="光-s1"  class="stroke" stroke="#bf0909" d="M51.72,15.37C52.86,16.509999999999998,53.65,18.43,53.65,20.64C53.65,26.76,53.699999999999996,41.24,53.62,47.260000000000005"/>
<path id="光-s2"  class="stroke" stroke="#bfbf09" d="M26.5,26.25C30.509999999999998,28.88,36.86,37.09,37.87,41.19"/>
<path id="光-s3"  class="stroke" stroke="#09bf09" d="M77.5,20.5C77.56,21.36,77.51,22.2,77.29,23.04C76.21000000000001,27.29,71.91000000000001,35.5,66.12,40.629999999999995"/>
<path id="光-s4"  class="stroke" stroke="#09bfbf" d="M16.13,51.48C18.32,52.019999999999996,21.13,52.129999999999995,24.509999999999998,51.769999999999996C40.31,50.099999999999994,66.12,46.879999999999995,83.35,46.03999999999999C86.99,45.85999999999999,89.17999999999999,46.29999999999999,91,46.56999999999999"/>
<path id="光-s5"  class="stroke" stroke="#0909bf" d="M45.5,53.5C45.75,54.75,45.73,55.85,45.37,57.12C42.38,67.62,37.75,81.25,22,91.75"/>
<path id="光-s6"  class="stroke" stroke="#bf09bf" d="M58.74,51.37C59.42,52.559999999999995,59.95,53.959999999999994,59.99,55.8C60.1,60.62,59.97,69.61,59.97,77C59.97,90,61.25,91.53,77.75,91.53C92.25,91.53,93.64,89.5,93.64,82.91"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="光-bg1"  class="badge-group"><circle cx="51.72" cy="15.37" r="3.5" fill="#bf0909"/><text class="num-single" x="51.72" y="15.37" dx="0" dy="-0.5">1</text></g>
<g id="光-bg2"  class="badge-group"><circle cx="26.5" cy="26.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="26.5" y="26.25" dx="0" dy="-0.5">2</text></g>
<g id="光-bg3"  class="badge-group"><circle cx="77.5" cy="20.5" r="3.5" fill="#09bf09"/><text class="num-single" x="77.5" y="20.5" dx="0" dy="-0.5">3</text></g>
<g id="光-bg4"  class="badge-group"><circle cx="16.13" cy="51.48" r="3.5" fill="#09bfbf"/><text class="num-single" x="16.13" y="51.48" dx="0" dy="-0.5">4</text></g>
<g id="光-bg5"  class="badge-group"><circle cx="45.5" cy="53.5" r="3.5" fill="#0909bf"/><text class="num-single" x="45.5" y="53.5" dx="0" dy="-0.5">5</text></g>
<g id="光-bg6"  class="badge-group"><circle cx="58.74" cy="51.37" r="3.5" fill="#bf09bf"/><text class="num-single" x="58.74" y="51.37" dx="0" dy="-0.5">6</text></g>
</svg>