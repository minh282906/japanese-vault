<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (額)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #額-bg[i]: Thời gian quả bóng số nảy lên
   - #額-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#額-bg1  { animation-delay: 0.05s; }
#額-s1   { stroke-dasharray: 10.8878; stroke-dashoffset: 10.8878; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#額-bg2  { animation-delay: 0.42s; }
#額-s2   { stroke-dasharray: 13.1893; stroke-dashoffset: 13.1893; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#額-bg3  { animation-delay: 0.79s; }
#額-s3   { stroke-dasharray: 40.8160; stroke-dashoffset: 40.8160; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#額-bg4  { animation-delay: 1.16s; }
#額-s4   { stroke-dasharray: 26.9028; stroke-dashoffset: 26.9028; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#額-bg5  { animation-delay: 1.53s; }
#額-s5   { stroke-dasharray: 63.0048; stroke-dashoffset: 63.0048; animation: drawStroke 0.35s ease-out 1.66s forwards; }
#額-bg6  { animation-delay: 2.03s; }
#額-s6   { stroke-dasharray: 28.7981; stroke-dashoffset: 28.7981; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#額-bg7  { animation-delay: 2.40s; }
#額-s7   { stroke-dasharray: 19.0327; stroke-dashoffset: 19.0327; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#額-bg8  { animation-delay: 2.77s; }
#額-s8   { stroke-dasharray: 36.4583; stroke-dashoffset: 36.4583; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#額-bg9  { animation-delay: 3.14s; }
#額-s9   { stroke-dasharray: 18.6392; stroke-dashoffset: 18.6392; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#額-bg10  { animation-delay: 3.51s; }
#額-s10   { stroke-dasharray: 40.2403; stroke-dashoffset: 40.2403; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#額-bg11  { animation-delay: 3.88s; }
#額-s11   { stroke-dasharray: 12.7306; stroke-dashoffset: 12.7306; animation: drawStroke 0.22s ease-out 4.01s forwards; }
#額-bg12  { animation-delay: 4.25s; }
#額-s12   { stroke-dasharray: 46.7828; stroke-dashoffset: 46.7828; animation: drawStroke 0.26s ease-out 4.38s forwards; }
#額-bg13  { animation-delay: 4.66s; }
#額-s13   { stroke-dasharray: 75.4150; stroke-dashoffset: 75.4150; animation: drawStroke 0.41s ease-out 4.79s forwards; }
#額-bg14  { animation-delay: 5.22s; }
#額-s14   { stroke-dasharray: 28.1211; stroke-dashoffset: 28.1211; animation: drawStroke 0.22s ease-out 5.35s forwards; }
#額-bg15  { animation-delay: 5.59s; }
#額-s15   { stroke-dasharray: 27.8844; stroke-dashoffset: 27.8844; animation: drawStroke 0.22s ease-out 5.72s forwards; }
#額-bg16  { animation-delay: 5.96s; }
#額-s16   { stroke-dasharray: 28.1293; stroke-dashoffset: 28.1293; animation: drawStroke 0.22s ease-out 6.09s forwards; }
#額-bg17  { animation-delay: 6.33s; }
#額-s17   { stroke-dasharray: 22.7003; stroke-dashoffset: 22.7003; animation: drawStroke 0.22s ease-out 6.46s forwards; }
#額-bg18  { animation-delay: 6.70s; }
#額-s18   { stroke-dasharray: 19.3059; stroke-dashoffset: 19.3059; animation: drawStroke 0.22s ease-out 6.83s forwards; }
]]>
</style>

