<path id="勉-s4"  class="stroke" stroke="#2dbf09" d="M22.68,39.46C30.77,37.64,47.519999999999996,35.61,51.730000000000004,35.39C54.50000000000001,35.25,55.17,37.65,54.95,38.97C54.25,43.22,53.38,46.41,52.18,50.47C51.839999999999996,51.62,51.48,52.83,51.08,54.17"/>
<path id="勉-s5"  class="stroke" stroke="#09bf52" d="M36.75,38.56C37.54,39.35,37.89,40.49,37.89,41.650000000000006C37.89,42.81,37.81,50.900000000000006,37.81,52.760000000000005"/>
<path id="勉-s6"  class="stroke" stroke="#09bfbf" d="M24.38,55.04C27.65,54.58,47.04,52.519999999999996,50.64,52.29"/>
<path id="勉-s7"  class="stroke" stroke="#0952bf" d="M30.68,58.17C30.72,58.940000000000005,30.77,60.160000000000004,30.59,61.27C29.51,67.81,22.75,82.75,12.25,90"/>
<path id="勉-s8"  class="stroke" stroke="#2d09bf" d="M39.91,56.12C40.83,57.04,41.589999999999996,58.87,41.589999999999996,60.66C41.589999999999996,69.06,41.349999999999994,77.49,41.349999999999994,83.19999999999999C41.349999999999994,93.99999999999999,44.12,95.77999999999999,65.88999999999999,95.77999999999999C91.49999999999999,95.77999999999999,92.38999999999999,92.49999999999999,92.38999999999999,86.41999999999999"/>
<path id="勉-s9"  class="stroke" stroke="#9a09bf" d="M62.3,45.98C64.61999999999999,46.629999999999995,66.34,46.44,68,46.129999999999995C74.41,44.94,84.11,42.55,88.75,41.78999999999999C92.02,41.24999999999999,93.17,42.33999999999999,93.19,45.54999999999999C93.24,53.49999999999999,84.35,74.41999999999999,80.52,78.42999999999999C77.52,81.57,76.92999999999999,79.83,74.11999999999999,77.38"/>
<path id="勉-s10"  class="stroke" stroke="#bf0976" d="M77.26,22.75C78,24.13,78.04,25.72,77.78,27.75C75.88,43.15,69.29,66.41,54.35,81.2"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="勉-bg1"  class="badge-group"><circle cx="32.13" cy="12.15" r="3.5" fill="#bf0909"/><text class="num-single" x="32.13" y="12.15" dx="0" dy="-0.5">1</text></g>
<g id="勉-bg2"  class="badge-group"><circle cx="30.25" cy="20.52" r="3.5" fill="#bf7609"/><text class="num-single" x="30.25" y="20.52" dx="0" dy="-0.5">2</text></g>
<g id="勉-bg3"  class="badge-group"><circle cx="20.37" cy="34.72" r="3.5" fill="#9abf09"/><text class="num-single" x="20.37" y="34.72" dx="0" dy="-0.5">3</text></g>
<g id="勉-bg4"  class="badge-group"><circle cx="22.68" cy="42.96" r="3.5" fill="#2dbf09"/><text class="num-single" x="22.68" y="42.96" dx="0" dy="-0.5">4</text></g>
