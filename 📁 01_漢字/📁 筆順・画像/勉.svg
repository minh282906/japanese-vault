<g id="勉-bg6"  class="badge-group"><circle cx="24.38" cy="55.04" r="3.5" fill="#09bfbf"/><text class="num-single" x="24.38" y="55.04" dx="0" dy="-0.5">6</text></g>
<g id="勉-bg7"  class="badge-group"><circle cx="30.68" cy="58.17" r="3.5" fill="#0952bf"/><text class="num-single" x="30.68" y="58.17" dx="0" dy="-0.5">7</text></g>
<g id="勉-bg8"  class="badge-group"><circle cx="39.91" cy="56.12" r="3.5" fill="#2d09bf"/><text class="num-single" x="39.91" y="56.12" dx="0" dy="-0.5">8</text></g>
<g id="勉-bg9"  class="badge-group"><circle cx="62.3" cy="45.98" r="3.5" fill="#9a09bf"/><text class="num-single" x="62.3" y="45.98" dx="0" dy="-0.5">9</text></g>
<g id="勉-bg10" class="badge-group"><circle cx="77.26" cy="22.75" r="3.5" fill="#bf0976"/><text class="num-double" x="77.26" y="22.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>