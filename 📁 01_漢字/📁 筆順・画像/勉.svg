<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (勉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #勉-bg[i]: Thời gian quả bóng số nảy lên
   - #勉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#勉-bg1  { animation-delay: 0.05s; }
#勉-s1   { stroke-dasharray: 28.8863; stroke-dashoffset: 28.8863; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#勉-bg2  { animation-delay: 0.42s; }
#勉-s2   { stroke-dasharray: 40.9957; stroke-dashoffset: 40.9957; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#勉-bg3  { animation-delay: 0.80s; }
#勉-s3   { stroke-dasharray: 20.6361; stroke-dashoffset: 20.6361; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#勉-bg4  { animation-delay: 1.17s; }
#勉-s4   { stroke-dasharray: 50.6409; stroke-dashoffset: 50.6409; animation: drawStroke 0.28s ease-out 1.30s forwards; }
#勉-bg5  { animation-delay: 1.60s; }
#勉-s5   { stroke-dasharray: 14.4898; stroke-dashoffset: 14.4898; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#勉-bg6  { animation-delay: 1.97s; }
#勉-s6   { stroke-dasharray: 26.4050; stroke-dashoffset: 26.4050; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#勉-bg7  { animation-delay: 2.34s; }
#勉-s7   { stroke-dasharray: 37.8889; stroke-dashoffset: 37.8889; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#勉-bg8  { animation-delay: 2.71s; }
#勉-s8   { stroke-dasharray: 91.5686; stroke-dashoffset: 91.5686; animation: drawStroke 0.50s ease-out 2.84s forwards; }
#勉-bg9  { animation-delay: 3.36s; }
#勉-s9   { stroke-dasharray: 77.6203; stroke-dashoffset: 77.6203; animation: drawStroke 0.43s ease-out 3.49s forwards; }
#勉-bg10  { animation-delay: 3.94s; }
#勉-s10   { stroke-dasharray: 64.4811; stroke-dashoffset: 64.4811; animation: drawStroke 0.35s ease-out 4.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #勉-s[i]) -->
<path id="勉-s1"  class="stroke" stroke="#bf0909" d="M32.13,12.15C32.17,12.65,32.300000000000004,13.47,32.04,14.16C30.13,19.25,23.63,28.25,15.129999999999999,34.67"/>
<path id="勉-s2"  class="stroke" stroke="#bf7609" d="M30.25,20.52C31.37,21,32.37,20.83,33.52,20.65C38.300000000000004,19.91,46.080000000000005,18.07,47.660000000000004,17.88C49.43000000000001,17.669999999999998,50.35,19.65,49.61000000000001,20.689999999999998C46.50000000000001,25.099999999999998,43.10000000000001,28.83,38.18000000000001,35.89"/>
