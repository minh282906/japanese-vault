<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (側)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #側-bg[i]: Thời gian quả bóng số nảy lên
   - #側-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#側-bg1  { animation-delay: 0.05s; }
#側-s1   { stroke-dasharray: 44.4251; stroke-dashoffset: 44.4251; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#側-bg2  { animation-delay: 0.44s; }
#側-s2   { stroke-dasharray: 55.0495; stroke-dashoffset: 55.0495; animation: drawStroke 0.30s ease-out 0.57s forwards; }
#側-bg3  { animation-delay: 0.89s; }
#側-s3   { stroke-dasharray: 48.7152; stroke-dashoffset: 48.7152; animation: drawStroke 0.27s ease-out 1.02s forwards; }
#側-bg4  { animation-delay: 1.31s; }
#側-s4   { stroke-dasharray: 69.6692; stroke-dashoffset: 69.6692; animation: drawStroke 0.38s ease-out 1.44s forwards; }
#側-bg5  { animation-delay: 1.84s; }
#側-s5   { stroke-dasharray: 19.9028; stroke-dashoffset: 19.9028; animation: drawStroke 0.22s ease-out 1.97s forwards; }
#側-bg6  { animation-delay: 2.21s; }
#側-s6   { stroke-dasharray: 19.1974; stroke-dashoffset: 19.1974; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#側-bg7  { animation-delay: 2.58s; }
#側-s7   { stroke-dasharray: 19.2081; stroke-dashoffset: 19.2081; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#側-bg8  { animation-delay: 2.95s; }
#側-s8   { stroke-dasharray: 19.5777; stroke-dashoffset: 19.5777; animation: drawStroke 0.22s ease-out 3.08s forwards; }
#側-bg9  { animation-delay: 3.32s; }
#側-s9   { stroke-dasharray: 16.5602; stroke-dashoffset: 16.5602; animation: drawStroke 0.22s ease-out 3.45s forwards; }
#側-bg10  { animation-delay: 3.69s; }
#側-s10   { stroke-dasharray: 39.9064; stroke-dashoffset: 39.9064; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#側-bg11  { animation-delay: 4.06s; }
#側-s11   { stroke-dasharray: 87.8191; stroke-dashoffset: 87.8191; animation: drawStroke 0.48s ease-out 4.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #側-s[i]) -->
<path id="側-s1"  class="stroke" stroke="#bf0909" d="M28,18.12C28.49,19.78,28.43,21.05,27.79,22.94C23.7,34.94,20.5,44.010000000000005,11.119999999999997,58.620000000000005"/>
