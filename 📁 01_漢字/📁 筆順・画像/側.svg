<path id="側-s4"  class="stroke" stroke="#4bbf09" d="M41.74,21.38C43.410000000000004,21.22,54.370000000000005,19.71,58.89,19.009999999999998C61.660000000000004,18.58,63.28,19.099999999999998,63.19,22.259999999999998C63.04,27.5,62.739999999999995,50.48,62.599999999999994,61.75C62.559999999999995,65.34,62.529999999999994,67.74,62.529999999999994,68"/>
<path id="側-s5"  class="stroke" stroke="#09bf2a" d="M42.21,35.6C46.32,35.02,56.75,33.71,61.97,33.230000000000004"/>
<path id="側-s6"  class="stroke" stroke="#09bf8d" d="M42.37,49.99C48.41,49.230000000000004,55.349999999999994,48.580000000000005,61.48,48.190000000000005"/>
<path id="側-s7"  class="stroke" stroke="#098dbf" d="M42.38,65.79C47.75,65.12,55.42,64.31,61.5,63.99000000000001"/>
<path id="側-s8"  class="stroke" stroke="#092abf" d="M46.04,74.66C46.339999999999996,75.89,46.019999999999996,76.77,45.46,77.7C42.97,81.86,38.57,87.05,35,90.25"/>
<path id="側-s9"  class="stroke" stroke="#4b09bf" d="M57.38,74.25C61.35,77.84,66.05,84.36,67.13,87.5"/>
<path id="側-s10"  class="stroke" stroke="#ae09bf" d="M76.52,23.08C77.5,24,78.28,25.369999999999997,78.28,27.349999999999998C78.28,38.099999999999994,78.27,49.42999999999999,78.26,56.62C78.26,59.169999999999995,78.26,61.199999999999996,78.26,62.5"/>
<path id="側-s11"  class="stroke" stroke="#bf096c" d="M92.27,14.33C93.25,15.25,94.03,16.62,94.03,18.6C94.03,33.160000000000004,94.02,83.50999999999999,94.02,88.47C94.02,95.25,90,93,85.31,88.72"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="側-bg1"  class="badge-group"><circle cx="28" cy="18.12" r="3.5" fill="#bf0909"/><text class="num-single" x="28" y="18.12" dx="0" dy="-0.5">1</text></g>
<g id="側-bg2"  class="badge-group"><circle cx="23.53" cy="40.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="23.53" y="40.5" dx="0" dy="-0.5">2</text></g>
