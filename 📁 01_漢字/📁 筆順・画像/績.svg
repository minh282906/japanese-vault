<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (績)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #績-bg[i]: Thời gian quả bóng số nảy lên
   - #績-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#績-bg1  { animation-delay: 0.05s; }
#績-s1   { stroke-dasharray: 41.3084; stroke-dashoffset: 41.3084; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#績-bg2  { animation-delay: 0.43s; }
#績-s2   { stroke-dasharray: 67.0058; stroke-dashoffset: 67.0058; animation: drawStroke 0.37s ease-out 0.56s forwards; }
#績-bg3  { animation-delay: 0.95s; }
#績-s3   { stroke-dasharray: 13.6146; stroke-dashoffset: 13.6146; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#績-bg4  { animation-delay: 1.32s; }
#績-s4   { stroke-dasharray: 38.0609; stroke-dashoffset: 38.0609; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#績-bg5  { animation-delay: 1.69s; }
#績-s5   { stroke-dasharray: 18.8641; stroke-dashoffset: 18.8641; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#績-bg6  { animation-delay: 2.06s; }
#績-s6   { stroke-dasharray: 15.9912; stroke-dashoffset: 15.9912; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#績-bg7  { animation-delay: 2.43s; }
#績-s7   { stroke-dasharray: 35.3785; stroke-dashoffset: 35.3785; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#績-bg8  { animation-delay: 2.80s; }
#績-s8   { stroke-dasharray: 30.2930; stroke-dashoffset: 30.2930; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#績-bg9  { animation-delay: 3.17s; }
#績-s9   { stroke-dasharray: 36.9103; stroke-dashoffset: 36.9103; animation: drawStroke 0.22s ease-out 3.30s forwards; }
#績-bg10  { animation-delay: 3.54s; }
#績-s10   { stroke-dasharray: 52.3491; stroke-dashoffset: 52.3491; animation: drawStroke 0.29s ease-out 3.67s forwards; }
#績-bg11  { animation-delay: 3.98s; }
#績-s11   { stroke-dasharray: 31.3491; stroke-dashoffset: 31.3491; animation: drawStroke 0.22s ease-out 4.11s forwards; }
#績-bg12  { animation-delay: 4.35s; }
#績-s12   { stroke-dasharray: 58.9548; stroke-dashoffset: 58.9548; animation: drawStroke 0.32s ease-out 4.48s forwards; }
#績-bg13  { animation-delay: 4.82s; }
#績-s13   { stroke-dasharray: 27.2488; stroke-dashoffset: 27.2488; animation: drawStroke 0.22s ease-out 4.95s forwards; }
#績-bg14  { animation-delay: 5.19s; }
#績-s14   { stroke-dasharray: 27.3541; stroke-dashoffset: 27.3541; animation: drawStroke 0.22s ease-out 5.32s forwards; }
#績-bg15  { animation-delay: 5.56s; }
#績-s15   { stroke-dasharray: 27.4504; stroke-dashoffset: 27.4504; animation: drawStroke 0.22s ease-out 5.69s forwards; }
#績-bg16  { animation-delay: 5.93s; }
#績-s16   { stroke-dasharray: 22.0538; stroke-dashoffset: 22.0538; animation: drawStroke 0.22s ease-out 6.06s forwards; }
#績-bg17  { animation-delay: 6.30s; }
#績-s17   { stroke-dasharray: 20.6381; stroke-dashoffset: 20.6381; animation: drawStroke 0.22s ease-out 6.43s forwards; }
]]>
</style>

