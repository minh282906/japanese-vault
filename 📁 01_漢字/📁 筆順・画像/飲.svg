<path id="飲-s4"  class="stroke" stroke="#64bf09" d="M20.01,46.32C21.62,47.12,22.87,46.75,24.87,46.35C30.740000000000002,45.18,40.05,43.44,40.95,43.31C43.25,42.99,43.93,44.480000000000004,43.720000000000006,45.940000000000005C43.010000000000005,50.84,41.650000000000006,59.7,40.940000000000005,64.48C40.67,66.34,40.49,67.58,40.49,67.74000000000001"/>
