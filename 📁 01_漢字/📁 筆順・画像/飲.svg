<path id="飲-s6"  class="stroke" stroke="#09bf64" d="M22.37,68.85C27.880000000000003,67.86999999999999,34,67.11999999999999,39.58,66.38"/>
<path id="飲-s7"  class="stroke" stroke="#09bfbf" d="M20.37,47.01C21.060000000000002,47.699999999999996,21.400000000000002,48.809999999999995,21.400000000000002,49.75C21.400000000000002,55.5,21.110000000000003,86.43,21.070000000000004,88.72C21,92.75,21.5,93.75,26,90.5C28.1,88.98,33,85.5,38.5,82.25"/>
<path id="飲-s8"  class="stroke" stroke="#0964bf" d="M37.25,74.25C38.84,76.28,41.34,81.71,42.25,86"/>
<path id="飲-s9"  class="stroke" stroke="#0909bf" d="M61.5,14.25C61.75,15.370000000000001,61.92,16.39,61.68,17.56C60,25.75,55.82,40.12,49,49.5"/>
<path id="飲-s10"  class="stroke" stroke="#6409bf" d="M58.22,37.74C60.12,38.13,61.36,37.92,62.73,37.6C64.39999999999999,37.21,83.94,32.35,85.49,32C92.24,30.5,88.99,36.5,82.49,43.25"/>
<path id="飲-s11"  class="stroke" stroke="#bf09bf" d="M64.85,47.5C65.63,49,65.71,50.38,65.47,52.019999999999996C63,68.62,57.25,84.5,42.25,95.75"/>
<path id="飲-s12"  class="stroke" stroke="#bf0964" d="M65.42,60.5C68.98,67.27,80.68,82.06,88.04,89.96000000000001C89.93,91.99000000000001,92.02000000000001,94.62,94.75,95.50000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="飲-bg1"  class="badge-group"><circle cx="31.53" cy="11.0" r="3.5" fill="#bf0909"/><text class="num-single" x="31.53" y="11.0" dx="0" dy="-0.5">1</text></g>
