<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (飲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #飲-bg[i]: Thời gian quả bóng số nảy lên
   - #飲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#飲-bg1  { animation-delay: 0.05s; }
#飲-s1   { stroke-dasharray: 38.3049; stroke-dashoffset: 38.3049; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#飲-bg2  { animation-delay: 0.42s; }
#飲-s2   { stroke-dasharray: 18.6918; stroke-dashoffset: 18.6918; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#飲-bg3  { animation-delay: 0.79s; }
#飲-s3   { stroke-dasharray: 11.8350; stroke-dashoffset: 11.8350; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#飲-bg4  { animation-delay: 1.16s; }
#飲-s4   { stroke-dasharray: 47.9941; stroke-dashoffset: 47.9941; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#飲-bg5  { animation-delay: 1.57s; }
#飲-s5   { stroke-dasharray: 18.7998; stroke-dashoffset: 18.7998; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#飲-bg6  { animation-delay: 1.94s; }
#飲-s6   { stroke-dasharray: 17.3879; stroke-dashoffset: 17.3879; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#飲-bg7  { animation-delay: 2.31s; }
#飲-s7   { stroke-dasharray: 65.5040; stroke-dashoffset: 65.5040; animation: drawStroke 0.36s ease-out 2.44s forwards; }
#飲-bg8  { animation-delay: 2.82s; }
#飲-s8   { stroke-dasharray: 12.8440; stroke-dashoffset: 12.8440; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#飲-bg9  { animation-delay: 3.19s; }
#飲-s9   { stroke-dasharray: 37.9329; stroke-dashoffset: 37.9329; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#飲-bg10  { animation-delay: 3.56s; }
#飲-s10   { stroke-dasharray: 44.8246; stroke-dashoffset: 44.8246; animation: drawStroke 0.25s ease-out 3.69s forwards; }
#飲-bg11  { animation-delay: 3.96s; }
#飲-s11   { stroke-dasharray: 55.5432; stroke-dashoffset: 55.5432; animation: drawStroke 0.31s ease-out 4.09s forwards; }
#飲-bg12  { animation-delay: 4.42s; }
#飲-s12   { stroke-dasharray: 46.0093; stroke-dashoffset: 46.0093; animation: drawStroke 0.25s ease-out 4.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #飲-s[i]) -->
<path id="飲-s1"  class="stroke" stroke="#bf0909" d="M31.53,14.5C31.59,15.23,31.77,16.44,31.41,17.42C28.45,25.520000000000003,19.62,38.39,10.370000000000001,45.370000000000005"/>
