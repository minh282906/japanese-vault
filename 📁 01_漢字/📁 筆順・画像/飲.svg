<g id="飲-bg9"  class="badge-group"><circle cx="61.5" cy="14.25" r="3.5" fill="#0909bf"/><text class="num-single" x="61.5" y="14.25" dx="0" dy="-0.5">9</text></g>
<g id="飲-bg10" class="badge-group"><circle cx="58.22" cy="37.74" r="3.5" fill="#6409bf"/><text class="num-double" x="58.22" y="37.74" dx="-0.4" dy="-0.475">10</text></g>
