<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (気)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #気-bg[i]: Thời gian quả bóng số nảy lên
   - #気-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#気-bg1  { animation-delay: 0.05s; }
#気-s1   { stroke-dasharray: 24.5596; stroke-dashoffset: 24.5596; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#気-bg2  { animation-delay: 0.42s; }
#気-s2   { stroke-dasharray: 37.5949; stroke-dashoffset: 37.5949; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#気-bg3  { animation-delay: 0.79s; }
#気-s3   { stroke-dasharray: 39.3976; stroke-dashoffset: 39.3976; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#気-bg4  { animation-delay: 1.16s; }
#気-s4   { stroke-dasharray: 133.6680; stroke-dashoffset: 133.6680; animation: drawStroke 0.55s ease-out 1.29s forwards; }
#気-bg5  { animation-delay: 1.86s; }
#気-s5   { stroke-dasharray: 53.0262; stroke-dashoffset: 53.0262; animation: drawStroke 0.29s ease-out 1.99s forwards; }
#気-bg6  { animation-delay: 2.30s; }
#気-s6   { stroke-dasharray: 42.6003; stroke-dashoffset: 42.6003; animation: drawStroke 0.23s ease-out 2.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #気-s[i]) -->
<path id="気-s1"  class="stroke" stroke="#bf0909" d="M37.75,9.25C38,10.870000000000001,37.5,12,36.75,13.5C35.63,15.74,28,25.25,24,29"/>
<path id="気-s2"  class="stroke" stroke="#bfbf09" d="M36.5,21.25C37.83,21.22,39.79,21.2,41.3,20.93C50.5,19.25,59.47,17.47,68.28,15.66C69.91,15.33,71.99,15.02,73.49,14.75"/>
<path id="気-s3"  class="stroke" stroke="#09bf09" d="M31.25,32.75C32.75,33.13,34.55,33.01,36.21,32.83C43.88,32,55.75,30.25,65.35,28.439999999999998C67.28999999999999,28.069999999999997,68.99,28.029999999999998,70.25999999999999,27.99"/>
<path id="気-s4"  class="stroke" stroke="#09bfbf" d="M18.5,47C20.38,47.75,22.5,47.88,24.75,47.5C39.83,44.99,59.75,41.88,73,39.5C77.73,38.65,78.6,39.97,77.5,45.75C73.5,66.75,78.21,86.07,89,95.75C96.25,102.25,95.5,96.5,95,90.5"/>
<path id="気-s5"  class="stroke" stroke="#0909bf" d="M57,51.75C57.12,53.37,56.83,54.78,56,56.5C49.5,70,40.25,82.75,25.75,93.25"/>
<path id="気-s6"  class="stroke" stroke="#bf09bf" d="M30,63.75C41.5,68,54.5,78,62.25,90.5"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="気-bg1"  class="badge-group"><circle cx="37.75" cy="9.25" r="3.5" fill="#bf0909"/><text class="num-single" x="37.75" y="9.25" dx="0" dy="-0.5">1</text></g>
<g id="気-bg2"  class="badge-group"><circle cx="36.5" cy="21.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="36.5" y="21.25" dx="0" dy="-0.5">2</text></g>
<g id="気-bg3"  class="badge-group"><circle cx="31.25" cy="32.75" r="3.5" fill="#09bf09"/><text class="num-single" x="31.25" y="32.75" dx="0" dy="-0.5">3</text></g>
<g id="気-bg4"  class="badge-group"><circle cx="18.5" cy="47" r="3.5" fill="#09bfbf"/><text class="num-single" x="18.5" y="47" dx="0" dy="-0.5">4</text></g>
<g id="気-bg5"  class="badge-group"><circle cx="57" cy="51.75" r="3.5" fill="#0909bf"/><text class="num-single" x="57" y="51.75" dx="0" dy="-0.5">5</text></g>
<g id="気-bg6"  class="badge-group"><circle cx="30" cy="63.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="30" y="63.75" dx="0" dy="-0.5">6</text></g>
</svg>