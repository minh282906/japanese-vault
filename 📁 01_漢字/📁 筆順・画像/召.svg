<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (召)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #召-bg[i]: Thời gian quả bóng số nảy lên
   - #召-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#召-bg1  { animation-delay: 0.05s; }
#召-s1   { stroke-dasharray: 102.4230; stroke-dashoffset: 102.4230; animation: drawStroke 0.55s ease-out 0.18s forwards; }
#召-bg2  { animation-delay: 0.75s; }
#召-s2   { stroke-dasharray: 47.8402; stroke-dashoffset: 47.8402; animation: drawStroke 0.26s ease-out 0.88s forwards; }
#召-bg3  { animation-delay: 1.16s; }
#召-s3   { stroke-dasharray: 32.0818; stroke-dashoffset: 32.0818; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#召-bg4  { animation-delay: 1.53s; }
#召-s4   { stroke-dasharray: 73.4509; stroke-dashoffset: 73.4509; animation: drawStroke 0.40s ease-out 1.66s forwards; }
#召-bg5  { animation-delay: 2.08s; }
#召-s5   { stroke-dasharray: 41.8242; stroke-dashoffset: 41.8242; animation: drawStroke 0.23s ease-out 2.21s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #召-s[i]) -->
<path id="召-s1"  class="stroke" stroke="#bf0909" d="M29.54,19.67C32.19,21.01,35.71,20.380000000000003,38.489999999999995,20.110000000000003C51.13999999999999,18.910000000000004,70.44999999999999,16.610000000000003,76.74,16.210000000000004C81.22,15.930000000000005,82.74,18.240000000000006,81.99,22.240000000000006C80.78999999999999,28.620000000000005,75.74,41.74000000000001,68.3,50.480000000000004C62.28,57.56,58.839999999999996,49.74,57.849999999999994,48.760000000000005"/>
<path id="召-s2"  class="stroke" stroke="#9abf09" d="M52.21,21.89C52.29,22.7,52.47,24.01,52.04,25.15C47.62,37,39.88,47.88,23.17,57.85"/>
<path id="召-s3"  class="stroke" stroke="#09bf52" d="M27.89,64.17C28.86,64.92,29.41,66.16,29.54,67.37C30.72,72.10000000000001,31.71,81.95,32.519999999999996,89.5C32.76,91.77,32.99999999999999,93.84,33.239999999999995,95.5"/>
<path id="召-s4"  class="stroke" stroke="#0952bf" d="M30.87,66.47C43.25,65.13,64.05,63.61,72.96000000000001,63.03C75.91000000000001,62.84,80.00000000000001,63.75,78.49000000000001,68.3C76.82000000000001,73.35,74.7,82.1,72.89000000000001,89.24"/>
<path id="召-s5"  class="stroke" stroke="#9a09bf" d="M33.96,91.89C41.45,91.63,57.510000000000005,91.04,69.95,90.64C71.98,90.58,73.94,90.52,75.76,90.47"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="召-bg1"  class="badge-group"><circle cx="29.54" cy="19.67" r="3.5" fill="#bf0909"/><text class="num-single" x="29.54" y="19.67" dx="0" dy="-0.5">1</text></g>
<g id="召-bg2"  class="badge-group"><circle cx="52.21" cy="21.89" r="3.5" fill="#9abf09"/><text class="num-single" x="52.21" y="21.89" dx="0" dy="-0.5">2</text></g>
<g id="召-bg3"  class="badge-group"><circle cx="27.89" cy="60.67" r="3.5" fill="#09bf52"/><text class="num-single" x="27.89" y="60.67" dx="0" dy="-0.5">3</text></g>
<g id="召-bg4"  class="badge-group"><circle cx="30.87" cy="69.97" r="3.5" fill="#0952bf"/><text class="num-single" x="30.87" y="69.97" dx="0" dy="-0.5">4</text></g>
<g id="召-bg5"  class="badge-group"><circle cx="33.96" cy="91.89" r="3.5" fill="#9a09bf"/><text class="num-single" x="33.96" y="91.89" dx="0" dy="-0.5">5</text></g>
</svg>