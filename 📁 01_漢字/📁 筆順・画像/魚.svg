<g id="魚-bg9"  class="badge-group"><circle cx="42.52" cy="79.08" r="3.5" fill="#4b09bf"/><text class="num-single" x="42.52" y="79.08" dx="0" dy="-0.5">9</text></g>
<g id="魚-bg10" class="badge-group"><circle cx="62.37" cy="77.83" r="3.5" fill="#ae09bf"/><text class="num-double" x="62.37" y="77.83" dx="-0.4" dy="-0.475">10</text></g>
<g id="魚-bg11" class="badge-group"><circle cx="84.27" cy="78.58" r="3.5" fill="#bf096c"/><text class="num-double" x="84.27" y="78.58" dx="-0.4" dy="-0.475">11</text></g>
</svg>