<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (交)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #交-bg[i]: Thời gian quả bóng số nảy lên
   - #交-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#交-bg1  { animation-delay: 0.05s; }
#交-s1   { stroke-dasharray: 16.6389; stroke-dashoffset: 16.6389; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#交-bg2  { animation-delay: 0.42s; }
#交-s2   { stroke-dasharray: 65.9587; stroke-dashoffset: 65.9587; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#交-bg3  { animation-delay: 0.93s; }
#交-s3   { stroke-dasharray: 27.0419; stroke-dashoffset: 27.0419; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#交-bg4  { animation-delay: 1.30s; }
#交-s4   { stroke-dasharray: 23.4796; stroke-dashoffset: 23.4796; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#交-bg5  { animation-delay: 1.67s; }
#交-s5   { stroke-dasharray: 68.4056; stroke-dashoffset: 68.4056; animation: drawStroke 0.38s ease-out 1.80s forwards; }
#交-bg6  { animation-delay: 2.20s; }
#交-s6   { stroke-dasharray: 69.5685; stroke-dashoffset: 69.5685; animation: drawStroke 0.38s ease-out 2.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #交-s[i]) -->
<path id="交-s1"  class="stroke" stroke="#bf0909" d="M51.62,11.75C52.68,12.81,53.349999999999994,14.129999999999999,53.349999999999994,15.76C53.349999999999994,20.08,53.239999999999995,24.5,53.239999999999995,27.91"/>
<path id="交-s2"  class="stroke" stroke="#bfbf09" d="M21.5,30.76C23.990000000000002,31.37,26.79,31.57,29.98,31.26C45.25,29.75,62.620000000000005,27.75,79.23,26.910000000000004C82.63000000000001,26.740000000000002,84.62,26.950000000000003,87.15,27.540000000000003"/>
<path id="交-s3"  class="stroke" stroke="#09bf09" d="M38.65,39.33C39,40.5,38.879999999999995,41.8,38.07,43.14C34.86,48.41,28,55.38,22,59.5"/>
<path id="交-s4"  class="stroke" stroke="#09bfbf" d="M67.51,37.73C75.35000000000001,42.04,81.83000000000001,47.01,85.75,52.25"/>
<path id="交-s5"  class="stroke" stroke="#0909bf" d="M67.43,51C67.87,52.5,67.60000000000001,53.92,66.74000000000001,55.74C58.82,72.27,40.22,88.14,19,95.25"/>
<path id="交-s6"  class="stroke" stroke="#bf09bf" d="M35,59C39.45,59.12,64.53,80.55,81.53,91.58C85.34,94.05,88.25,95.75,93,96.65"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="交-bg1"  class="badge-group"><circle cx="51.62" cy="11.75" r="3.5" fill="#bf0909"/><text class="num-single" x="51.62" y="11.75" dx="0" dy="-0.5">1</text></g>
<g id="交-bg2"  class="badge-group"><circle cx="21.5" cy="30.76" r="3.5" fill="#bfbf09"/><text class="num-single" x="21.5" y="30.76" dx="0" dy="-0.5">2</text></g>
<g id="交-bg3"  class="badge-group"><circle cx="38.65" cy="39.33" r="3.5" fill="#09bf09"/><text class="num-single" x="38.65" y="39.33" dx="0" dy="-0.5">3</text></g>
<g id="交-bg4"  class="badge-group"><circle cx="67.51" cy="37.73" r="3.5" fill="#09bfbf"/><text class="num-single" x="67.51" y="37.73" dx="0" dy="-0.5">4</text></g>
<g id="交-bg5"  class="badge-group"><circle cx="67.43" cy="51" r="3.5" fill="#0909bf"/><text class="num-single" x="67.43" y="51" dx="0" dy="-0.5">5</text></g>
<g id="交-bg6"  class="badge-group"><circle cx="35" cy="59" r="3.5" fill="#bf09bf"/><text class="num-single" x="35" y="59" dx="0" dy="-0.5">6</text></g>
</svg>