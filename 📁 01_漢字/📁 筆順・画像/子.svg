<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (子)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #子-bg[i]: Thời gian quả bóng số nảy lên
   - #子-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#子-bg1  { animation-delay: 0.05s; }
#子-s1   { stroke-dasharray: 66.0594; stroke-dashoffset: 66.0594; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#子-bg2  { animation-delay: 0.56s; }
#子-s2   { stroke-dasharray: 69.3556; stroke-dashoffset: 69.3556; animation: drawStroke 0.38s ease-out 0.69s forwards; }
#子-bg3  { animation-delay: 1.09s; }
#子-s3   { stroke-dasharray: 84.6752; stroke-dashoffset: 84.6752; animation: drawStroke 0.47s ease-out 1.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #子-s[i]) -->
<path id="子-s1"  class="stroke" stroke="#bf0909" d="M33.28,19.04C35.120000000000005,19.75,36.980000000000004,19.9,38.68,19.669999999999998C43.63,18.999999999999996,66.63,15.089999999999998,68.53999999999999,14.749999999999998C71.99999999999999,14.129999999999999,72.6,16.11,70.64999999999999,18.33C68.69999999999999,20.549999999999997,59.239999999999995,31.5,54.29999999999999,35.519999999999996"/>
<path id="子-s2"  class="stroke" stroke="#09bf09" d="M52.48,37.74C58.9,40.71,64.22999999999999,68.47,57.72,90.31C54.92,99.69,49.629999999999995,93.27,47.25,91.3"/>
<path id="子-s3"  class="stroke" stroke="#0909bf" d="M12.25,51.48C16,52.62,21.04,52.51,24.73,51.97C41.5,49.5,67.59,46.129999999999995,83.26,45.22C87.52000000000001,44.97,92.37,44.879999999999995,96.37,45.79"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="子-bg1"  class="badge-group"><circle cx="33.28" cy="19.04" r="3.5" fill="#bf0909"/><text class="num-single" x="33.28" y="19.04" dx="0" dy="-0.5">1</text></g>
<g id="子-bg2"  class="badge-group"><circle cx="52.48" cy="37.74" r="3.5" fill="#09bf09"/><text class="num-single" x="52.48" y="37.74" dx="0" dy="-0.5">2</text></g>
<g id="子-bg3"  class="badge-group"><circle cx="12.25" cy="51.48" r="3.5" fill="#0909bf"/><text class="num-single" x="12.25" y="51.48" dx="0" dy="-0.5">3</text></g>
</svg>