<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (園)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #園-bg[i]: Thời gian quả bóng số nảy lên
   - #園-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#園-bg1  { animation-delay: 0.05s; }
#園-s1   { stroke-dasharray: 77.3579; stroke-dashoffset: 77.3579; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#園-bg2  { animation-delay: 0.63s; }
#園-s2   { stroke-dasharray: 143.3840; stroke-dashoffset: 143.3840; animation: drawStroke 0.55s ease-out 0.76s forwards; }
#園-bg3  { animation-delay: 1.33s; }
#園-s3   { stroke-dasharray: 33.2532; stroke-dashoffset: 33.2532; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#園-bg4  { animation-delay: 1.70s; }
#園-s4   { stroke-dasharray: 17.0424; stroke-dashoffset: 17.0424; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#園-bg5  { animation-delay: 2.07s; }
#園-s5   { stroke-dasharray: 51.3374; stroke-dashoffset: 51.3374; animation: drawStroke 0.28s ease-out 2.20s forwards; }
#園-bg6  { animation-delay: 2.50s; }
#園-s6   { stroke-dasharray: 15.3171; stroke-dashoffset: 15.3171; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#園-bg7  { animation-delay: 2.87s; }
#園-s7   { stroke-dasharray: 38.7465; stroke-dashoffset: 38.7465; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#園-bg8  { animation-delay: 3.24s; }
#園-s8   { stroke-dasharray: 25.9385; stroke-dashoffset: 25.9385; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#園-bg9  { animation-delay: 3.61s; }
#園-s9   { stroke-dasharray: 27.7949; stroke-dashoffset: 27.7949; animation: drawStroke 0.22s ease-out 3.74s forwards; }
#園-bg10  { animation-delay: 3.98s; }
#園-s10   { stroke-dasharray: 18.8535; stroke-dashoffset: 18.8535; animation: drawStroke 0.22s ease-out 4.11s forwards; }
#園-bg11  { animation-delay: 4.35s; }
#園-s11   { stroke-dasharray: 12.6486; stroke-dashoffset: 12.6486; animation: drawStroke 0.22s ease-out 4.48s forwards; }
#園-bg12  { animation-delay: 4.72s; }
#園-s12   { stroke-dasharray: 24.6103; stroke-dashoffset: 24.6103; animation: drawStroke 0.22s ease-out 4.85s forwards; }
#園-bg13  { animation-delay: 5.09s; }
#園-s13   { stroke-dasharray: 66.8052; stroke-dashoffset: 66.8052; animation: drawStroke 0.37s ease-out 5.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

