<path id="園-s8"  class="stroke" stroke="#0995bf" d="M42.65,60.58C47.66,59.89,57.75,58.879999999999995,64.77,58.339999999999996C66.06,58.239999999999995,67.31,58.13999999999999,68.46,58.029999999999994"/>
<path id="園-s9"  class="stroke" stroke="#0941bf" d="M49.13,62.5C49.34,64.06,48.57,65.52,47.550000000000004,66.64C42.88,71.75,37.63,75.75,29.060000000000006,80.5"/>
<path id="園-s10"  class="stroke" stroke="#2509bf" d="M51.09,66.7C52.07,67.68,52.52,68.37,52.52,69.78C52.52,73.24,52.510000000000005,77.9,52.510000000000005,81.87C52.510000000000005,83.03,52.510000000000005,84.12,52.510000000000005,85.12"/>
<path id="園-s11"  class="stroke" stroke="#7909bf" d="M71.59,63.21C71.5,64.12,71,65,69.97,66.04C68.67999999999999,67.34,66,69.25,62.089999999999996,70.93"/>
