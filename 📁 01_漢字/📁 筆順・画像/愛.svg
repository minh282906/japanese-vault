<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (愛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #愛-bg[i]: Thời gian quả bóng số nảy lên
   - #愛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#愛-bg1  { animation-delay: 0.05s; }
#愛-s1   { stroke-dasharray: 27.7918; stroke-dashoffset: 27.7918; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#愛-bg2  { animation-delay: 0.42s; }
#愛-s2   { stroke-dasharray: 11.6675; stroke-dashoffset: 11.6675; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#愛-bg3  { animation-delay: 0.79s; }
#愛-s3   { stroke-dasharray: 10.6779; stroke-dashoffset: 10.6779; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#愛-bg4  { animation-delay: 1.16s; }
#愛-s4   { stroke-dasharray: 19.3533; stroke-dashoffset: 19.3533; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#愛-bg5  { animation-delay: 1.53s; }
#愛-s5   { stroke-dasharray: 14.3730; stroke-dashoffset: 14.3730; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#愛-bg6  { animation-delay: 1.90s; }
#愛-s6   { stroke-dasharray: 87.4968; stroke-dashoffset: 87.4968; animation: drawStroke 0.48s ease-out 2.03s forwards; }
#愛-bg7  { animation-delay: 2.53s; }
#愛-s7   { stroke-dasharray: 11.2030; stroke-dashoffset: 11.2030; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#愛-bg8  { animation-delay: 2.90s; }
#愛-s8   { stroke-dasharray: 47.6434; stroke-dashoffset: 47.6434; animation: drawStroke 0.26s ease-out 3.03s forwards; }
#愛-bg9  { animation-delay: 3.31s; }
#愛-s9   { stroke-dasharray: 7.8681; stroke-dashoffset: 7.8681; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#愛-bg10  { animation-delay: 3.68s; }
#愛-s10   { stroke-dasharray: 11.1312; stroke-dashoffset: 11.1312; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#愛-bg11  { animation-delay: 4.05s; }
#愛-s11   { stroke-dasharray: 28.8479; stroke-dashoffset: 28.8479; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#愛-bg12  { animation-delay: 4.42s; }
#愛-s12   { stroke-dasharray: 89.3420; stroke-dashoffset: 89.3420; animation: drawStroke 0.49s ease-out 4.55s forwards; }
#愛-bg13  { animation-delay: 5.06s; }
#愛-s13   { stroke-dasharray: 53.2134; stroke-dashoffset: 53.2134; animation: drawStroke 0.29s ease-out 5.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

