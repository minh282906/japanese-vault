<path id="愛-s12"  class="stroke" stroke="#bf09b1" d="M42.58,67.93C42.98,67.96000000000001,44.68,67.97000000000001,45.82,67.85000000000001C51.62,67.25000000000001,58.25,65.75000000000001,64.75,64.25000000000001C68.36,63.420000000000016,70,65.25000000000001,68,68.50000000000001C63.06,76.52000000000001,42.42,95.66000000000001,19.5,99.72000000000001"/>
<path id="愛-s13"  class="stroke" stroke="#bf095d" d="M39.1,73.3C47.5,74.61999999999999,65.01,87.39999999999999,75.5,93.12C78.94,95,82.46,96.47,86.38,97"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="愛-bg1"  class="badge-group"><circle cx="59.38" cy="8.75" r="3.5" fill="#bf0909"/><text class="num-single" x="59.38" y="8.75" dx="0" dy="-0.5">1</text></g>
