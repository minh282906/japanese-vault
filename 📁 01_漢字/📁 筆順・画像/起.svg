<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (起)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #起-bg[i]: Thời gian quả bóng số nảy lên
   - #起-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#起-bg1  { animation-delay: 0.05s; }
#起-s1   { stroke-dasharray: 31.8335; stroke-dashoffset: 31.8335; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#起-bg2  { animation-delay: 0.42s; }
#起-s2   { stroke-dasharray: 30.4741; stroke-dashoffset: 30.4741; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#起-bg3  { animation-delay: 0.79s; }
#起-s3   { stroke-dasharray: 39.2913; stroke-dashoffset: 39.2913; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#起-bg4  { animation-delay: 1.16s; }
#起-s4   { stroke-dasharray: 28.8878; stroke-dashoffset: 28.8878; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#起-bg5  { animation-delay: 1.53s; }
#起-s5   { stroke-dasharray: 14.9974; stroke-dashoffset: 14.9974; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#起-bg6  { animation-delay: 1.90s; }
#起-s6   { stroke-dasharray: 34.0820; stroke-dashoffset: 34.0820; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#起-bg7  { animation-delay: 2.27s; }
#起-s7   { stroke-dasharray: 69.1256; stroke-dashoffset: 69.1256; animation: drawStroke 0.38s ease-out 2.40s forwards; }
#起-bg8  { animation-delay: 2.80s; }
#起-s8   { stroke-dasharray: 46.5240; stroke-dashoffset: 46.5240; animation: drawStroke 0.26s ease-out 2.93s forwards; }
#起-bg9  { animation-delay: 3.21s; }
#起-s9   { stroke-dasharray: 25.9600; stroke-dashoffset: 25.9600; animation: drawStroke 0.22s ease-out 3.34s forwards; }
#起-bg10  { animation-delay: 3.58s; }
#起-s10   { stroke-dasharray: 61.6287; stroke-dashoffset: 61.6287; animation: drawStroke 0.34s ease-out 3.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #起-s[i]) -->
<path id="起-s1"  class="stroke" stroke="#bf0909" d="M18.2,31.55C19.82,31.900000000000002,21.439999999999998,31.970000000000002,23.06,31.78C30.779999999999998,31.080000000000002,39.06,29.82,44.62,29.05C46.33,28.75,48.059999999999995,28.7,49.809999999999995,28.92"/>
<path id="起-s2"  class="stroke" stroke="#bf7609" d="M34.09,14.62C34.92,15.45,35.42,16.65,35.42,18.509999999999998C35.42,28.759999999999998,35.4,41.709999999999994,35.4,44.76"/>
<path id="起-s3"  class="stroke" stroke="#9abf09" d="M13.35,47.95C14.709999999999999,48.5,17.2,48.690000000000005,18.58,48.5C25.95,47.5,37.84,45.38,45.75,44.5C48,44.25,49.79,44.27,52.25,44.67"/>
<path id="起-s4"  class="stroke" stroke="#2dbf09" d="M34.55,49.25C35.519999999999996,50.22,36.019999999999996,51.5,36.019999999999996,53C36.019999999999996,56.68,35.959999999999994,72.67,35.959999999999994,77.75"/>
<path id="起-s5"  class="stroke" stroke="#09bf52" d="M37.16,63.5C41.669999999999995,63,46.739999999999995,61.91,48.769999999999996,61.66C50.12,61.5,51.4,61.589999999999996,51.989999999999995,61.779999999999994"/>
<path id="起-s6"  class="stroke" stroke="#09bfbf" d="M24.9,63C25.099999999999998,64.3,25,65.56,24.599999999999998,66.77C22.749999999999996,73.38,18.18,85.1,10.499999999999998,93.25"/>
<path id="起-s7"  class="stroke" stroke="#0952bf" d="M23.6,75.25C35.11,77.33,63.84,88.53999999999999,79.49000000000001,91.63C82.83000000000001,92.28999999999999,86.97000000000001,92.78,90.25000000000001,93"/>
<path id="起-s8"  class="stroke" stroke="#2d09bf" d="M59.56,25.67C61.75,26.130000000000003,63.27,26.05,64.86,25.87C69.17,25.39,77.97,23.650000000000002,84.38,22.71C87.13,22.310000000000002,88.58999999999999,24.14,88.21,26.07C87.61999999999999,29.12,86.11999999999999,32.99,84.55999999999999,40.96"/>
<path id="起-s9"  class="stroke" stroke="#9a09bf" d="M60.25,44.62C61.75,44.87,63.06,44.96,64.49,44.83C69.5,44.37,77.08,42.949999999999996,81.89999999999999,42.339999999999996C83.71999999999998,42.11,84.86999999999999,42.239999999999995,85.99,42.47"/>
<path id="起-s10"  class="stroke" stroke="#bf0976" d="M61.49,45.21C62.39,46.11,63.050000000000004,47.24,63.04,49.21C63.019999999999996,54.39,62.68,57.99,62.68,61.25C62.68,72.5,63.38,73.28999999999999,78.93,73.28999999999999C92.13000000000001,73.28999999999999,92.5,71.74999999999999,92.5,64.00999999999999"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="起-bg1"  class="badge-group"><circle cx="18.2" cy="31.55" r="3.5" fill="#bf0909"/><text class="num-single" x="18.2" y="31.55" dx="0" dy="-0.5">1</text></g>
<g id="起-bg2"  class="badge-group"><circle cx="34.09" cy="14.62" r="3.5" fill="#bf7609"/><text class="num-single" x="34.09" y="14.62" dx="0" dy="-0.5">2</text></g>
<g id="起-bg3"  class="badge-group"><circle cx="13.35" cy="47.95" r="3.5" fill="#9abf09"/><text class="num-single" x="13.35" y="47.95" dx="0" dy="-0.5">3</text></g>
<g id="起-bg4"  class="badge-group"><circle cx="34.55" cy="49.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="34.55" y="49.25" dx="0" dy="-0.5">4</text></g>
<g id="起-bg5"  class="badge-group"><circle cx="37.16" cy="63.5" r="3.5" fill="#09bf52"/><text class="num-single" x="37.16" y="63.5" dx="0" dy="-0.5">5</text></g>
<g id="起-bg6"  class="badge-group"><circle cx="24.9" cy="63" r="3.5" fill="#09bfbf"/><text class="num-single" x="24.9" y="63" dx="0" dy="-0.5">6</text></g>
<g id="起-bg7"  class="badge-group"><circle cx="23.6" cy="75.25" r="3.5" fill="#0952bf"/><text class="num-single" x="23.6" y="75.25" dx="0" dy="-0.5">7</text></g>
<g id="起-bg8"  class="badge-group"><circle cx="59.56" cy="25.67" r="3.5" fill="#2d09bf"/><text class="num-single" x="59.56" y="25.67" dx="0" dy="-0.5">8</text></g>
<g id="起-bg9"  class="badge-group"><circle cx="60.25" cy="41.12" r="3.5" fill="#9a09bf"/><text class="num-single" x="60.25" y="41.12" dx="0" dy="-0.5">9</text></g>
<g id="起-bg10" class="badge-group"><circle cx="61.49" cy="48.71" r="3.5" fill="#bf0976"/><text class="num-double" x="61.49" y="48.71" dx="-0.4" dy="-0.475">10</text></g>
</svg>