<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (疑)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #疑-bg[i]: Thời gian quả bóng số nảy lên
   - #疑-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#疑-bg1  { animation-delay: 0.05s; }
#疑-s1   { stroke-dasharray: 19.1290; stroke-dashoffset: 19.1290; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#疑-bg2  { animation-delay: 0.42s; }
#疑-s2   { stroke-dasharray: 46.1505; stroke-dashoffset: 46.1505; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#疑-bg3  { animation-delay: 0.82s; }
#疑-s3   { stroke-dasharray: 20.5541; stroke-dashoffset: 20.5541; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#疑-bg4  { animation-delay: 1.19s; }
#疑-s4   { stroke-dasharray: 16.7986; stroke-dashoffset: 16.7986; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#疑-bg5  { animation-delay: 1.56s; }
#疑-s5   { stroke-dasharray: 34.5895; stroke-dashoffset: 34.5895; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#疑-bg6  { animation-delay: 1.93s; }
#疑-s6   { stroke-dasharray: 42.9016; stroke-dashoffset: 42.9016; animation: drawStroke 0.24s ease-out 2.06s forwards; }
#疑-bg7  { animation-delay: 2.32s; }
#疑-s7   { stroke-dasharray: 13.7758; stroke-dashoffset: 13.7758; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#疑-bg8  { animation-delay: 2.69s; }
#疑-s8   { stroke-dasharray: 53.5962; stroke-dashoffset: 53.5962; animation: drawStroke 0.29s ease-out 2.82s forwards; }
#疑-bg9  { animation-delay: 3.13s; }
#疑-s9   { stroke-dasharray: 12.0056; stroke-dashoffset: 12.0056; animation: drawStroke 0.22s ease-out 3.26s forwards; }
#疑-bg10  { animation-delay: 3.50s; }
#疑-s10   { stroke-dasharray: 45.2857; stroke-dashoffset: 45.2857; animation: drawStroke 0.25s ease-out 3.63s forwards; }
#疑-bg11  { animation-delay: 3.90s; }
#疑-s11   { stroke-dasharray: 33.0140; stroke-dashoffset: 33.0140; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#疑-bg12  { animation-delay: 4.27s; }
#疑-s12   { stroke-dasharray: 16.7287; stroke-dashoffset: 16.7287; animation: drawStroke 0.22s ease-out 4.40s forwards; }
#疑-bg13  { animation-delay: 4.64s; }
#疑-s13   { stroke-dasharray: 35.4552; stroke-dashoffset: 35.4552; animation: drawStroke 0.22s ease-out 4.77s forwards; }
#疑-bg14  { animation-delay: 5.01s; }
#疑-s14   { stroke-dasharray: 45.5915; stroke-dashoffset: 45.5915; animation: drawStroke 0.25s ease-out 5.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

