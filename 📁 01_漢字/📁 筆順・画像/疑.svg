<path id="疑-s11"  class="stroke" stroke="#3d09bf" d="M67.68,45.91C68.45,46.68,68.97000000000001,47.75,68.97000000000001,48.809999999999995C68.97000000000001,52.49999999999999,68.91000000000001,73.5,68.91000000000001,78.57"/>
