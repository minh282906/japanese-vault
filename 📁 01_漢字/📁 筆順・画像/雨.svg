<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (雨)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #雨-bg[i]: Thời gian quả bóng số nảy lên
   - #雨-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#雨-bg1  { animation-delay: 0.05s; }
#雨-s1   { stroke-dasharray: 55.0730; stroke-dashoffset: 55.0730; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#雨-bg2  { animation-delay: 0.50s; }
#雨-s2   { stroke-dasharray: 48.0235; stroke-dashoffset: 48.0235; animation: drawStroke 0.26s ease-out 0.63s forwards; }
#雨-bg3  { animation-delay: 0.91s; }
#雨-s3   { stroke-dasharray: 134.4260; stroke-dashoffset: 134.4260; animation: drawStroke 0.55s ease-out 1.04s forwards; }
#雨-bg4  { animation-delay: 1.61s; }
#雨-s4   { stroke-dasharray: 64.2002; stroke-dashoffset: 64.2002; animation: drawStroke 0.35s ease-out 1.74s forwards; }
#雨-bg5  { animation-delay: 2.11s; }
#雨-s5   { stroke-dasharray: 12.8325; stroke-dashoffset: 12.8325; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#雨-bg6  { animation-delay: 2.48s; }
#雨-s6   { stroke-dasharray: 14.3018; stroke-dashoffset: 14.3018; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#雨-bg7  { animation-delay: 2.85s; }
#雨-s7   { stroke-dasharray: 14.7876; stroke-dashoffset: 14.7876; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#雨-bg8  { animation-delay: 3.22s; }
#雨-s8   { stroke-dasharray: 13.5262; stroke-dashoffset: 13.5262; animation: drawStroke 0.22s ease-out 3.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #雨-s[i]) -->
<path id="雨-s1"  class="stroke" stroke="#bf0909" d="M25.75,22.37C27.62,22.77,30.22,22.990000000000002,32.07,22.77C43.75,21.38,60.35,19,73.32,18.13C75.80999999999999,17.959999999999997,77.69,18.009999999999998,80.5,18.41"/>
<path id="雨-s2"  class="stroke" stroke="#bf9109" d="M15.5,41.25C16.75,42.75,17.16,44.51,17.39,46.44C18.63,57.129999999999995,19.580000000000002,73.05,20.05,82.75C20.18,85.45,20.25,87.75,20.25,88.75"/>
<path id="雨-s3"  class="stroke" stroke="#64bf09" d="M18.25,44.25C19.67,44.16,81.00999999999999,38.92,87.75,38.25C90.25,38,92.36,39.25,92.25,42C91.75,54.75,90.48,70.11,86.25,86.75C84.37,94.13,80.87,88.63,77.75,85.5"/>
<path id="雨-s4"  class="stroke" stroke="#09bf36" d="M52.25,23.5C53.31,24.56,54,26.25,54,28C54,28.82,53.75,65.8,53.57,81C53.53,84.43,53.5,86.74,53.5,87.25"/>
<path id="雨-s5"  class="stroke" stroke="#09bfbf" d="M31,53.5C35.21,54.74,39.95,57.44,42.25,59.5"/>
<path id="雨-s6"  class="stroke" stroke="#0936bf" d="M30.5,68.75C34.3,70.01,40.18,74.64,42.25,76.75"/>
<path id="雨-s7"  class="stroke" stroke="#6409bf" d="M66.88,48.88C71.86,50.870000000000005,77.50999999999999,54.85,79.5,56.5"/>
<path id="雨-s8"  class="stroke" stroke="#bf0991" d="M67.25,66.5C70,67.5,76.25,72,78.25,74.25"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="雨-bg1"  class="badge-group"><circle cx="25.75" cy="22.37" r="3.5" fill="#bf0909"/><text class="num-single" x="25.75" y="22.37" dx="0" dy="-0.5">1</text></g>
<g id="雨-bg2"  class="badge-group"><circle cx="15.5" cy="37.75" r="3.5" fill="#bf9109"/><text class="num-single" x="15.5" y="37.75" dx="0" dy="-0.5">2</text></g>
<g id="雨-bg3"  class="badge-group"><circle cx="18.25" cy="47.75" r="3.5" fill="#64bf09"/><text class="num-single" x="18.25" y="47.75" dx="0" dy="-0.5">3</text></g>
<g id="雨-bg4"  class="badge-group"><circle cx="52.25" cy="23.5" r="3.5" fill="#09bf36"/><text class="num-single" x="52.25" y="23.5" dx="0" dy="-0.5">4</text></g>
<g id="雨-bg5"  class="badge-group"><circle cx="31" cy="53.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="31" y="53.5" dx="0" dy="-0.5">5</text></g>
<g id="雨-bg6"  class="badge-group"><circle cx="30.5" cy="68.75" r="3.5" fill="#0936bf"/><text class="num-single" x="30.5" y="68.75" dx="0" dy="-0.5">6</text></g>
<g id="雨-bg7"  class="badge-group"><circle cx="66.88" cy="48.88" r="3.5" fill="#6409bf"/><text class="num-single" x="66.88" y="48.88" dx="0" dy="-0.5">7</text></g>
<g id="雨-bg8"  class="badge-group"><circle cx="67.25" cy="66.5" r="3.5" fill="#bf0991"/><text class="num-single" x="67.25" y="66.5" dx="0" dy="-0.5">8</text></g>
</svg>