<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (婚)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #婚-bg[i]: Thời gian quả bóng số nảy lên
   - #婚-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#婚-bg1  { animation-delay: 0.05s; }
#婚-s1   { stroke-dasharray: 81.0984; stroke-dashoffset: 81.0984; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#婚-bg2  { animation-delay: 0.65s; }
#婚-s2   { stroke-dasharray: 62.1379; stroke-dashoffset: 62.1379; animation: drawStroke 0.34s ease-out 0.78s forwards; }
#婚-bg3  { animation-delay: 1.14s; }
#婚-s3   { stroke-dasharray: 35.4496; stroke-dashoffset: 35.4496; animation: drawStroke 0.22s ease-out 1.27s forwards; }
#婚-bg4  { animation-delay: 1.51s; }
#婚-s4   { stroke-dasharray: 27.5581; stroke-dashoffset: 27.5581; animation: drawStroke 0.22s ease-out 1.64s forwards; }
#婚-bg5  { animation-delay: 1.88s; }
#婚-s5   { stroke-dasharray: 51.4059; stroke-dashoffset: 51.4059; animation: drawStroke 0.28s ease-out 2.01s forwards; }
#婚-bg6  { animation-delay: 2.31s; }
#婚-s6   { stroke-dasharray: 39.9335; stroke-dashoffset: 39.9335; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#婚-bg7  { animation-delay: 2.68s; }
#婚-s7   { stroke-dasharray: 57.2384; stroke-dashoffset: 57.2384; animation: drawStroke 0.31s ease-out 2.81s forwards; }
#婚-bg8  { animation-delay: 3.14s; }
#婚-s8   { stroke-dasharray: 33.9530; stroke-dashoffset: 33.9530; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#婚-bg9  { animation-delay: 3.51s; }
#婚-s9   { stroke-dasharray: 58.9051; stroke-dashoffset: 58.9051; animation: drawStroke 0.32s ease-out 3.64s forwards; }
#婚-bg10  { animation-delay: 3.98s; }
#婚-s10   { stroke-dasharray: 25.3643; stroke-dashoffset: 25.3643; animation: drawStroke 0.22s ease-out 4.11s forwards; }
#婚-bg11  { animation-delay: 4.35s; }
#婚-s11   { stroke-dasharray: 25.0136; stroke-dashoffset: 25.0136; animation: drawStroke 0.22s ease-out 4.48s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #婚-s[i]) -->
<path id="婚-s1"  class="stroke" stroke="#bf0909" d="M26.98,18.37C27.37,19.41,27.56,20.86,27.37,22.36C26.39,29.75,21.810000000000002,55.76,17.490000000000002,64.4C16.6,66.17,17.880000000000003,66.9,18.380000000000003,67.03C25.76,69,31.230000000000004,72.6,36.480000000000004,77.79C38.510000000000005,79.80000000000001,40.27,82.5,41.77,85.28"/>
