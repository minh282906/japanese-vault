<path id="婚-s4"  class="stroke" stroke="#4bbf09" d="M78.1,12C78,13,77.64999999999999,14.05,76.89,14.52C73.78,17.29,66.13,21.25,54.620000000000005,24.81"/>
<path id="婚-s5"  class="stroke" stroke="#09bf2a" d="M50.75,23.87C51.75,24.87,52.13,26.37,52.13,27.82C52.13,29.27,52.2,50.25,52.2,54.54C52.2,56.79,53.63,57.19,55.93,55.58C58.23,53.97,67.23,48.489999999999995,68.64,47.519999999999996"/>
<path id="婚-s6"  class="stroke" stroke="#09bf8d" d="M54.43,35.19C55.87,35.12,57.35,34.76,58.96,34.489999999999995C68.49,32.89999999999999,79.6,30.909999999999997,87.28,29.549999999999994C89.36,29.179999999999993,91.88,28.629999999999992,93.82000000000001,28.999999999999993"/>
<path id="婚-s7"  class="stroke" stroke="#098dbf" d="M70.04,22.15C71.25,23,71.5,24.38,71.91000000000001,25.72C76.6,41.05,83,51.75,93.4,58.63C99.58000000000001,62.72,98.52000000000001,56.35,98,51.38"/>
<path id="婚-s8"  class="stroke" stroke="#092abf" d="M56.23,63.3C56.959999999999994,64.03,57.25,65.16,57.25,66.14C57.25,69.49,57.25,83.45,57.25,91.5C57.25,94.23,57.25,96.27,57.25,97"/>
<path id="婚-s9"  class="stroke" stroke="#4b09bf" d="M58.14,64.91C60.04,64.8,75.48,62.589999999999996,80.62,61.94C83.34,61.599999999999994,84.81,62.349999999999994,84.81,65.36C84.81,70.33,84.66,83.18,84.57000000000001,90.25999999999999C84.54,93.00999999999999,84.51,94.88,84.51,95.08999999999999"/>
<path id="婚-s10"  class="stroke" stroke="#ae09bf" d="M58.4,78.27C62.87,77.75,77.37,76.38,83.65,75.86999999999999"/>
<path id="婚-s11"  class="stroke" stroke="#bf096c" d="M58.43,93.97C64.4,93.44,75.93,92.52,83.37,92.06"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="婚-bg1"  class="badge-group"><circle cx="26.98" cy="18.37" r="3.5" fill="#bf0909"/><text class="num-single" x="26.98" y="18.37" dx="0" dy="-0.5">1</text></g>
