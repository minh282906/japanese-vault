<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (号)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #号-bg[i]: Thời gian quả bóng số nảy lên
   - #号-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#号-bg1  { animation-delay: 0.05s; }
#号-s1   { stroke-dasharray: 24.5607; stroke-dashoffset: 24.5607; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#号-bg2  { animation-delay: 0.42s; }
#号-s2   { stroke-dasharray: 56.6744; stroke-dashoffset: 56.6744; animation: drawStroke 0.31s ease-out 0.55s forwards; }
#号-bg3  { animation-delay: 0.88s; }
#号-s3   { stroke-dasharray: 33.3028; stroke-dashoffset: 33.3028; animation: drawStroke 0.22s ease-out 1.01s forwards; }
#号-bg4  { animation-delay: 1.25s; }
#号-s4   { stroke-dasharray: 83.4199; stroke-dashoffset: 83.4199; animation: drawStroke 0.46s ease-out 1.38s forwards; }
#号-bg5  { animation-delay: 1.86s; }
#号-s5   { stroke-dasharray: 104.4110; stroke-dashoffset: 104.4110; animation: drawStroke 0.55s ease-out 1.99s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #号-s[i]) -->
<path id="号-s1"  class="stroke" stroke="#bf0909" d="M30.75,14.66C31.75,15.25,32.63,16.25,32.79,17.08C33.83,22.15,35.04,28.169999999999998,36.32,34.39C36.57,35.59,36.8,36.78,37.03,37.97"/>
<path id="号-s2"  class="stroke" stroke="#9abf09" d="M34.14,16.95C44.53,15.37,64.13,12.799999999999999,69.49000000000001,12.27C71.45,12.08,72.88000000000001,13.75,72.35000000000001,15.87C71.17,20.6,69.75000000000001,25.25,67.88000000000001,30.759999999999998"/>
<path id="号-s3"  class="stroke" stroke="#09bf52" d="M37.7,34.98C43.09,34.47,57.56,32.8,66.77000000000001,31.949999999999996C68.31000000000002,31.809999999999995,69.69000000000001,31.689999999999994,70.83000000000001,31.599999999999994"/>
<path id="号-s4"  class="stroke" stroke="#0952bf" d="M12.5,47.45C15,47.99,19.1,48.010000000000005,21.58,47.74C40.58,45.7,63.28,43.18,84.62,42.34C88.33,42.2,91.94,42.31,95.62,42.790000000000006"/>
<path id="号-s5"  class="stroke" stroke="#9a09bf" d="M46.25,47.25C47,48.63,46.75,50.33,45.75,52C44.25,54.5,41.37,58.62,39.75,61C38.61,62.66,40,65.25,42,65S65.96000000000001,59.61,68.25,59C72,58,73.96,59.78,73.25,63.5C71.25,74,64.45,86.39,60.75,91.5C55.5,98.75,49.5,93.25,46.75,91"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="号-bg1"  class="badge-group"><circle cx="30.75" cy="11.16" r="3.5" fill="#bf0909"/><text class="num-single" x="30.75" y="11.16" dx="0" dy="-0.5">1</text></g>
<g id="号-bg2"  class="badge-group"><circle cx="34.14" cy="20.45" r="3.5" fill="#9abf09"/><text class="num-single" x="34.14" y="20.45" dx="0" dy="-0.5">2</text></g>
<g id="号-bg3"  class="badge-group"><circle cx="37.7" cy="34.98" r="3.5" fill="#09bf52"/><text class="num-single" x="37.7" y="34.98" dx="0" dy="-0.5">3</text></g>
<g id="号-bg4"  class="badge-group"><circle cx="12.5" cy="47.45" r="3.5" fill="#0952bf"/><text class="num-single" x="12.5" y="47.45" dx="0" dy="-0.5">4</text></g>
<g id="号-bg5"  class="badge-group"><circle cx="46.25" cy="47.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="46.25" y="47.25" dx="0" dy="-0.5">5</text></g>
</svg>