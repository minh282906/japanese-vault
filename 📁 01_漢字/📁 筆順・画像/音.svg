<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (音)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #音-bg[i]: Thời gian quả bóng số nảy lên
   - #音-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#音-bg1  { animation-delay: 0.05s; }
#音-s1   { stroke-dasharray: 13.2536; stroke-dashoffset: 13.2536; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#音-bg2  { animation-delay: 0.42s; }
#音-s2   { stroke-dasharray: 51.2598; stroke-dashoffset: 51.2598; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#音-bg3  { animation-delay: 0.85s; }
#音-s3   { stroke-dasharray: 11.6213; stroke-dashoffset: 11.6213; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#音-bg4  { animation-delay: 1.22s; }
#音-s4   { stroke-dasharray: 17.0290; stroke-dashoffset: 17.0290; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#音-bg5  { animation-delay: 1.59s; }
#音-s5   { stroke-dasharray: 84.9744; stroke-dashoffset: 84.9744; animation: drawStroke 0.47s ease-out 1.72s forwards; }
#音-bg6  { animation-delay: 2.21s; }
#音-s6   { stroke-dasharray: 35.9824; stroke-dashoffset: 35.9824; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#音-bg7  { animation-delay: 2.58s; }
#音-s7   { stroke-dasharray: 72.6801; stroke-dashoffset: 72.6801; animation: drawStroke 0.40s ease-out 2.71s forwards; }
#音-bg8  { animation-delay: 3.13s; }
#音-s8   { stroke-dasharray: 34.8578; stroke-dashoffset: 34.8578; animation: drawStroke 0.22s ease-out 3.26s forwards; }
#音-bg9  { animation-delay: 3.50s; }
#音-s9   { stroke-dasharray: 34.0416; stroke-dashoffset: 34.0416; animation: drawStroke 0.22s ease-out 3.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #音-s[i]) -->
<path id="音-s1"  class="stroke" stroke="#bf0909" d="M52.97,12.5C53.74,13.27,54.589999999999996,14.620000000000001,54.589999999999996,16.14C54.589999999999996,20,54.49999999999999,20.75,54.49999999999999,25.310000000000002"/>
<path id="音-s2"  class="stroke" stroke="#bf8209" d="M29.12,28C30.62,28.5,31.87,28.62,33.730000000000004,28.42C45.120000000000005,27.130000000000003,58.78,24.94,72.62,23.630000000000003C75.25,23.380000000000003,78.25,23.380000000000003,80,23.750000000000004"/>
<path id="音-s3"  class="stroke" stroke="#82bf09" d="M37.12,35.38C41.269999999999996,39.11,42.129999999999995,42.690000000000005,42.72,45.31"/>
<path id="音-s4"  class="stroke" stroke="#09bf09" d="M67.79,27.5C68.25,28.4,68.36,29.52,68.02000000000001,30.64C66.69000000000001,34.980000000000004,64.56000000000002,41.21,63.38000000000001,43.63"/>
<path id="音-s5"  class="stroke" stroke="#09bf82" d="M12.75,50.5C16.4,51.16,19.86,50.89,23.509999999999998,50.49C43.67,48.28,63.96,45.96,86.88,45.08C90.28,44.949999999999996,94.05,44.6,97.38,45.55"/>
<path id="音-s6"  class="stroke" stroke="#0982bf" d="M34.55,59.11C35.129999999999995,59.85,35.629999999999995,61.35,35.629999999999995,62.36C35.629999999999995,63.38,35.74999999999999,90.82,35.74999999999999,91.33C35.74999999999999,91.84,35.74999999999999,93.37,35.74999999999999,94.87"/>
<path id="音-s7"  class="stroke" stroke="#0909bf" d="M36.1,60.79C45.620000000000005,59.63,62.120000000000005,57.75,68.18,57.11C71.13000000000001,56.8,72.44000000000001,57.38,72.44000000000001,60.33C72.44000000000001,61.309999999999995,72.33000000000001,78.31,72.27000000000001,88.00999999999999C72.25000000000001,91.05,72.24000000000001,93.36999999999999,72.24000000000001,94.25999999999999"/>
<path id="音-s8"  class="stroke" stroke="#8209bf" d="M36.69,74.75C42.129999999999995,74.25,66.41,72.11,71.43,71.9"/>
<path id="音-s9"  class="stroke" stroke="#bf0982" d="M37.11,90.41C43.69,90.14,62.54,88.16,71.05,87.81"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="音-bg1"  class="badge-group"><circle cx="52.97" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="52.97" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="音-bg2"  class="badge-group"><circle cx="29.12" cy="28" r="3.5" fill="#bf8209"/><text class="num-single" x="29.12" y="28" dx="0" dy="-0.5">2</text></g>
<g id="音-bg3"  class="badge-group"><circle cx="37.12" cy="35.38" r="3.5" fill="#82bf09"/><text class="num-single" x="37.12" y="35.38" dx="0" dy="-0.5">3</text></g>
<g id="音-bg4"  class="badge-group"><circle cx="67.79" cy="27.5" r="3.5" fill="#09bf09"/><text class="num-single" x="67.79" y="27.5" dx="0" dy="-0.5">4</text></g>
<g id="音-bg5"  class="badge-group"><circle cx="12.75" cy="50.5" r="3.5" fill="#09bf82"/><text class="num-single" x="12.75" y="50.5" dx="0" dy="-0.5">5</text></g>
<g id="音-bg6"  class="badge-group"><circle cx="34.55" cy="55.61" r="3.5" fill="#0982bf"/><text class="num-single" x="34.55" y="55.61" dx="0" dy="-0.5">6</text></g>
<g id="音-bg7"  class="badge-group"><circle cx="36.1" cy="64.29" r="3.5" fill="#0909bf"/><text class="num-single" x="36.1" y="64.29" dx="0" dy="-0.5">7</text></g>
<g id="音-bg8"  class="badge-group"><circle cx="36.69" cy="74.75" r="3.5" fill="#8209bf"/><text class="num-single" x="36.69" y="74.75" dx="0" dy="-0.5">8</text></g>
<g id="音-bg9"  class="badge-group"><circle cx="37.11" cy="90.41" r="3.5" fill="#bf0982"/><text class="num-single" x="37.11" y="90.41" dx="0" dy="-0.5">9</text></g>
</svg>