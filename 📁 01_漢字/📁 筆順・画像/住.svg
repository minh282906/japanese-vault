<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (住)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #住-bg[i]: Thời gian quả bóng số nảy lên
   - #住-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#住-bg1  { animation-delay: 0.05s; }
#住-s1   { stroke-dasharray: 44.8851; stroke-dashoffset: 44.8851; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#住-bg2  { animation-delay: 0.45s; }
#住-s2   { stroke-dasharray: 55.0662; stroke-dashoffset: 55.0662; animation: drawStroke 0.30s ease-out 0.58s forwards; }
#住-bg3  { animation-delay: 0.90s; }
#住-s3   { stroke-dasharray: 17.3426; stroke-dashoffset: 17.3426; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#住-bg4  { animation-delay: 1.27s; }
#住-s4   { stroke-dasharray: 47.0204; stroke-dashoffset: 47.0204; animation: drawStroke 0.26s ease-out 1.40s forwards; }
#住-bg5  { animation-delay: 1.68s; }
#住-s5   { stroke-dasharray: 45.4929; stroke-dashoffset: 45.4929; animation: drawStroke 0.25s ease-out 1.81s forwards; }
#住-bg6  { animation-delay: 2.08s; }
#住-s6   { stroke-dasharray: 42.8129; stroke-dashoffset: 42.8129; animation: drawStroke 0.24s ease-out 2.21s forwards; }
#住-bg7  { animation-delay: 2.47s; }
#住-s7   { stroke-dasharray: 62.9396; stroke-dashoffset: 62.9396; animation: drawStroke 0.35s ease-out 2.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #住-s[i]) -->
<path id="住-s1"  class="stroke" stroke="#bf0909" d="M30.88,19.88C31.08,21.89,30.82,24.53,30.16,26.259999999999998C25.96,37.26,21.62,46.58,12,59.97"/>
<path id="住-s2"  class="stroke" stroke="#bfa509" d="M26.03,41C26.75,41.75,27.28,42.94,27.28,44.23C27.28,55.849999999999994,27.09,77.75,27.02,89.63C27,92.21,27,94.33,27,95.75"/>
<path id="住-s3"  class="stroke" stroke="#3dbf09" d="M55.25,15.88C60.89,19.09,64.75,22.5,67.81,27.54"/>
<path id="住-s4"  class="stroke" stroke="#09bf71" d="M43,41.32C44.75,41.63,46.75,41.54,48.87,41.35C59.87,40.38,72.56,39.25,85.16999999999999,38.79C86.88999999999999,38.73,88.44999999999999,38.88,89.86999999999999,39.25"/>
<path id="住-s5"  class="stroke" stroke="#0971bf" d="M64.25,42.59C65.25,43.660000000000004,65.75,45,65.75,46.550000000000004C65.75,52.53,66.25,81.72,66,87.7"/>
<path id="住-s6"  class="stroke" stroke="#3d09bf" d="M45.25,63.69C46.28,64.22,49.67,64.03,50.72,63.919999999999995C63.3,62.599999999999994,67.74,62.19,81.86,61.309999999999995C83.14,61.23,85.96,61.089999999999996,87.88,61.559999999999995"/>
<path id="住-s7"  class="stroke" stroke="#bf09a5" d="M35.5,90.36C37.86,90.88,40.74,90.87,43.44,90.61C56.459999999999994,89.38,78.99,88,90.61,87.96C93.44,87.94999999999999,96.84,88.41,98.25,88.83999999999999"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="住-bg1"  class="badge-group"><circle cx="30.88" cy="19.88" r="3.5" fill="#bf0909"/><text class="num-single" x="30.88" y="19.88" dx="0" dy="-0.5">1</text></g>
<g id="住-bg2"  class="badge-group"><circle cx="26.03" cy="41" r="3.5" fill="#bfa509"/><text class="num-single" x="26.03" y="41" dx="0" dy="-0.5">2</text></g>
<g id="住-bg3"  class="badge-group"><circle cx="55.25" cy="15.88" r="3.5" fill="#3dbf09"/><text class="num-single" x="55.25" y="15.88" dx="0" dy="-0.5">3</text></g>
<g id="住-bg4"  class="badge-group"><circle cx="43" cy="41.32" r="3.5" fill="#09bf71"/><text class="num-single" x="43" y="41.32" dx="0" dy="-0.5">4</text></g>
<g id="住-bg5"  class="badge-group"><circle cx="64.25" cy="42.59" r="3.5" fill="#0971bf"/><text class="num-single" x="64.25" y="42.59" dx="0" dy="-0.5">5</text></g>
<g id="住-bg6"  class="badge-group"><circle cx="45.25" cy="63.69" r="3.5" fill="#3d09bf"/><text class="num-single" x="45.25" y="63.69" dx="0" dy="-0.5">6</text></g>
<g id="住-bg7"  class="badge-group"><circle cx="35.5" cy="90.36" r="3.5" fill="#bf09a5"/><text class="num-single" x="35.5" y="90.36" dx="0" dy="-0.5">7</text></g>
</svg>