<path id="湾-s6"  class="stroke" stroke="#09bf64" d="M59.75,26.75C60.13,27.33,60.24,28.29,60.12,29.009999999999998C59.21,34.64,57.25,42,49.13,46.57"/>
<path id="湾-s7"  class="stroke" stroke="#09bfbf" d="M72.39,23.55C73.11,24.27,73.24,25.5,73.24,26.740000000000002C73.24,30.44,73.11999999999999,38.480000000000004,73.11999999999999,41.38C73.11999999999999,47.46,68.86999999999999,41.510000000000005,68.13999999999999,40.78"/>
<path id="湾-s8"  class="stroke" stroke="#0964bf" d="M47.5,32C47.53,32.34,47.59,32.87,47.45,33.36C46.53,36.44,43.13,40.629999999999995,38.150000000000006,45.11"/>
<path id="湾-s9"  class="stroke" stroke="#0909bf" d="M80.55,30.7C84.86,32.7,91.67999999999999,38.94,92.75999999999999,42.06"/>
<path id="湾-s10"  class="stroke" stroke="#6409bf" d="M48.92,50.96C51.5,52.25,53.800000000000004,52.07,56.02,51.75C65.26,50.38,75.51,49.38,79.86,48.92C83.05,48.59,83.51,50.13,82.69,52.58C82.34,53.629999999999995,81.50999999999999,56.25,80.99,57.98"/>
<path id="湾-s11"  class="stroke" stroke="#bf09bf" d="M48.25,61C50,61.62,52.02,61.63,53.75,61.45C60.79,60.68,73.5,59.5,78.17,59C79.97,58.81,81.3,59,82.75,59"/>
<path id="湾-s12"  class="stroke" stroke="#bf0964" d="M49.28,61.84C49.870000000000005,62.870000000000005,49.65,63.93000000000001,48.97,65.25C48.26,66.62,47.73,67.69,47.14,69.18C46.32,71.26,46.33,72.83000000000001,48.88,72.5C57.64,71.36,76.17,69.62,82.98,68.68C87,68.13000000000001,88.22,69.77000000000001,86.98,73.33000000000001C84.67,79.99000000000001,80.64,88.28000000000002,76.98,92.93C73.4,97.48,71.13000000000001,94.58000000000001,68.39,91.06"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="湾-bg1"  class="badge-group"><circle cx="21.38" cy="14.75" r="3.5" fill="#bf0909"/><text class="num-single" x="21.38" y="14.75" dx="0" dy="-0.5">1</text></g>
