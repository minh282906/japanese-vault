<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (湾)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #湾-bg[i]: Thời gian quả bóng số nảy lên
   - #湾-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#湾-bg1  { animation-delay: 0.05s; }
#湾-s1   { stroke-dasharray: 15.2061; stroke-dashoffset: 15.2061; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#湾-bg2  { animation-delay: 0.42s; }
#湾-s2   { stroke-dasharray: 15.2391; stroke-dashoffset: 15.2391; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#湾-bg3  { animation-delay: 0.79s; }
#湾-s3   { stroke-dasharray: 23.4357; stroke-dashoffset: 23.4357; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#湾-bg4  { animation-delay: 1.16s; }
#湾-s4   { stroke-dasharray: 8.9988; stroke-dashoffset: 8.9988; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#湾-bg5  { animation-delay: 1.53s; }
#湾-s5   { stroke-dasharray: 49.8157; stroke-dashoffset: 49.8157; animation: drawStroke 0.27s ease-out 1.66s forwards; }
#湾-bg6  { animation-delay: 1.95s; }
#湾-s6   { stroke-dasharray: 23.8679; stroke-dashoffset: 23.8679; animation: drawStroke 0.22s ease-out 2.08s forwards; }
#湾-bg7  { animation-delay: 2.32s; }
#湾-s7   { stroke-dasharray: 26.4268; stroke-dashoffset: 26.4268; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#湾-bg8  { animation-delay: 2.69s; }
#湾-s8   { stroke-dasharray: 16.5025; stroke-dashoffset: 16.5025; animation: drawStroke 0.22s ease-out 2.82s forwards; }
#湾-bg9  { animation-delay: 3.06s; }
#湾-s9   { stroke-dasharray: 16.9203; stroke-dashoffset: 16.9203; animation: drawStroke 0.22s ease-out 3.19s forwards; }
#湾-bg10  { animation-delay: 3.43s; }
#湾-s10   { stroke-dasharray: 43.0838; stroke-dashoffset: 43.0838; animation: drawStroke 0.24s ease-out 3.56s forwards; }
#湾-bg11  { animation-delay: 3.82s; }
#湾-s11   { stroke-dasharray: 34.6898; stroke-dashoffset: 34.6898; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#湾-bg12  { animation-delay: 4.19s; }
#湾-s12   { stroke-dasharray: 88.8366; stroke-dashoffset: 88.8366; animation: drawStroke 0.49s ease-out 4.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

