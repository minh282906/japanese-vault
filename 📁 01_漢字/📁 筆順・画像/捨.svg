<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (捨)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #捨-bg[i]: Thời gian quả bóng số nảy lên
   - #捨-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#捨-bg1  { animation-delay: 0.05s; }
#捨-s1   { stroke-dasharray: 29.1565; stroke-dashoffset: 29.1565; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#捨-bg2  { animation-delay: 0.42s; }
#捨-s2   { stroke-dasharray: 87.9153; stroke-dashoffset: 87.9153; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#捨-bg3  { animation-delay: 1.05s; }
#捨-s3   { stroke-dasharray: 29.1237; stroke-dashoffset: 29.1237; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#捨-bg4  { animation-delay: 1.42s; }
#捨-s4   { stroke-dasharray: 39.2662; stroke-dashoffset: 39.2662; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#捨-bg5  { animation-delay: 1.79s; }
#捨-s5   { stroke-dasharray: 43.2603; stroke-dashoffset: 43.2603; animation: drawStroke 0.24s ease-out 1.92s forwards; }
#捨-bg6  { animation-delay: 2.18s; }
#捨-s6   { stroke-dasharray: 32.1569; stroke-dashoffset: 32.1569; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#捨-bg7  { animation-delay: 2.55s; }
#捨-s7   { stroke-dasharray: 26.3702; stroke-dashoffset: 26.3702; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#捨-bg8  { animation-delay: 2.92s; }
#捨-s8   { stroke-dasharray: 51.0147; stroke-dashoffset: 51.0147; animation: drawStroke 0.28s ease-out 3.05s forwards; }
#捨-bg9  { animation-delay: 3.35s; }
#捨-s9   { stroke-dasharray: 22.7076; stroke-dashoffset: 22.7076; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#捨-bg10  { animation-delay: 3.72s; }
#捨-s10   { stroke-dasharray: 51.3847; stroke-dashoffset: 51.3847; animation: drawStroke 0.28s ease-out 3.85s forwards; }
#捨-bg11  { animation-delay: 4.15s; }
#捨-s11   { stroke-dasharray: 28.4101; stroke-dashoffset: 28.4101; animation: drawStroke 0.22s ease-out 4.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

