<path id="捨-s7"  class="stroke" stroke="#098dbf" d="M62.94,33.76C63.839999999999996,34.66,64.50999999999999,35.879999999999995,64.50999999999999,37.18C64.50999999999999,40.38,64.57,53.25,64.57,59.69"/>
<path id="捨-s8"  class="stroke" stroke="#092abf" d="M40.84,62.6C42.620000000000005,63.120000000000005,45.32000000000001,62.870000000000005,47.120000000000005,62.71C57.050000000000004,61.800000000000004,71.43,60.08,84.76,59.19C86.96000000000001,59.04,89.46000000000001,58.989999999999995,91.64,59.33"/>
<path id="捨-s9"  class="stroke" stroke="#4b09bf" d="M48.32,73.41C49.14,74.2,49.6,75.42,49.71,76.57C50.660000000000004,80.32,51.67,86.58,52.43,91.94999999999999C52.6,93.15999999999998,52.76,94.35,52.9,95.47999999999999"/>
<path id="捨-s10"  class="stroke" stroke="#ae09bf" d="M50.01,74.98C58.959999999999994,73.79,72.41,72.19,78.75999999999999,71.44C82.05,71.05,84.00999999999999,71.91,83.25999999999999,75.61C82.38,79.93,81.66999999999999,83.34,79.69999999999999,89.78999999999999"/>
<path id="捨-s11"  class="stroke" stroke="#bf096c" d="M53.52,93.13C58.13,92.61,68.88,91.62,78,91C79.45,90.9,80.74,90.75,81.82,90.65"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="捨-bg1"  class="badge-group"><circle cx="11" cy="38.42" r="3.5" fill="#bf0909"/><text class="num-single" x="11" y="38.42" dx="0" dy="-0.5">1</text></g>
