<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (買)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #買-bg[i]: Thời gian quả bóng số nảy lên
   - #買-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#買-bg1  { animation-delay: 0.05s; }
#買-s1   { stroke-dasharray: 18.4291; stroke-dashoffset: 18.4291; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#買-bg2  { animation-delay: 0.42s; }
#買-s2   { stroke-dasharray: 84.8114; stroke-dashoffset: 84.8114; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#買-bg3  { animation-delay: 1.04s; }
#買-s3   { stroke-dasharray: 11.8225; stroke-dashoffset: 11.8225; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#買-bg4  { animation-delay: 1.41s; }
#買-s4   { stroke-dasharray: 12.4139; stroke-dashoffset: 12.4139; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#買-bg5  { animation-delay: 1.78s; }
#買-s5   { stroke-dasharray: 59.2849; stroke-dashoffset: 59.2849; animation: drawStroke 0.33s ease-out 1.91s forwards; }
#買-bg6  { animation-delay: 2.26s; }
#買-s6   { stroke-dasharray: 41.4871; stroke-dashoffset: 41.4871; animation: drawStroke 0.23s ease-out 2.39s forwards; }
#買-bg7  { animation-delay: 2.64s; }
#買-s7   { stroke-dasharray: 78.8170; stroke-dashoffset: 78.8170; animation: drawStroke 0.43s ease-out 2.77s forwards; }
#買-bg8  { animation-delay: 3.22s; }
#買-s8   { stroke-dasharray: 37.3320; stroke-dashoffset: 37.3320; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#買-bg9  { animation-delay: 3.59s; }
#買-s9   { stroke-dasharray: 37.1865; stroke-dashoffset: 37.1865; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#買-bg10  { animation-delay: 3.96s; }
#買-s10   { stroke-dasharray: 36.9272; stroke-dashoffset: 36.9272; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#買-bg11  { animation-delay: 4.33s; }
#買-s11   { stroke-dasharray: 28.4735; stroke-dashoffset: 28.4735; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#買-bg12  { animation-delay: 4.70s; }
#買-s12   { stroke-dasharray: 19.3928; stroke-dashoffset: 19.3928; animation: drawStroke 0.22s ease-out 4.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #買-s[i]) -->
<path id="買-s1"  class="stroke" stroke="#bf0909" d="M20.5,14.64C20.99,15.13,21.94,16.23,22.16,17.07C23.25,21.240000000000002,23.67,23.95,24.56,28.98C24.759999999999998,30.13,24.95,31.240000000000002,25.11,32.24"/>
<path id="買-s2"  class="stroke" stroke="#bf6409" d="M23.25,16.2C38.45,14.82,81.4,12.479999999999999,87.26,11.98C90,11.75,91.38000000000001,13.370000000000001,90.58,15.93C89.5,19.37,88.76,21.49,86.96,26.33C86.58,27.349999999999998,86.08999999999999,28.319999999999997,85.64,29.27"/>
