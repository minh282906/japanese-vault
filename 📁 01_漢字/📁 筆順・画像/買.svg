<path id="買-s6"  class="stroke" stroke="#09bf64" d="M34.7,38.87C35.790000000000006,39.96,36.27,41.69,36.27,42.879999999999995C36.27,44.08,36.34,75.56,36.34,76.16S36.27,78.63,36.27,79.96"/>
<path id="買-s7"  class="stroke" stroke="#09bfbf" d="M37.02,40.77C45.17,40.14,69.07,37.74,71.86000000000001,37.74C74.75000000000001,37.74,76.05000000000001,39,76.05000000000001,41.440000000000005C76.05000000000001,43.88,75.97000000000001,61.34,75.99000000000001,74.52000000000001C75.99000000000001,75.87,76.03000000000002,77.38000000000001,76.03000000000002,78.86000000000001"/>
<path id="買-s8"  class="stroke" stroke="#0964bf" d="M37.53,52.38C43.5,52.120000000000005,68.97,49.95,74.78,49.95"/>
<path id="買-s9"  class="stroke" stroke="#0909bf" d="M37.5,64.75C46.25,64,65,62.5,74.59,62.1"/>
<path id="買-s10"  class="stroke" stroke="#6409bf" d="M37.76,76.86C46,76.38,65.25,75.13,74.63,74.82"/>
<path id="買-s11"  class="stroke" stroke="#bf09bf" d="M43.77,83C44,84.5,43.39,85.82,42.27,86.83C38.75,90,30.5,95.5,21.5,99"/>
<path id="買-s12"  class="stroke" stroke="#bf0964" d="M69.84,83.97C75,87.91,80.38,94.38,82.5,98.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="買-bg1"  class="badge-group"><circle cx="20.5" cy="11.14" r="3.5" fill="#bf0909"/><text class="num-single" x="20.5" y="11.14" dx="0" dy="-0.5">1</text></g>
<g id="買-bg2"  class="badge-group"><circle cx="23.25" cy="19.7" r="3.5" fill="#bf6409"/><text class="num-single" x="23.25" y="19.7" dx="0" dy="-0.5">2</text></g>
