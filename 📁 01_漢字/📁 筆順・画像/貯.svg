<path id="貯-s7"  class="stroke" stroke="#09bfbf" d="M35.5,75.38C39.13,79.22,43.42,86.19,44.41,89.55"/>
<path id="貯-s8"  class="stroke" stroke="#0964bf" d="M68.94,11.88C70.03,12.97,70.58,14.280000000000001,70.57,15.68C70.52,20.11,70.52,24.369999999999997,70.52,28.4"/>
<path id="貯-s9"  class="stroke" stroke="#0909bf" d="M51.12,29.5C51.12,32.78,49.22,42.84,48.559999999999995,45.06"/>
<path id="貯-s10"  class="stroke" stroke="#6409bf" d="M52.08,32.65C63,30,83.5,27,89.3,26.55C99.47999999999999,25.77,91.5,33.370000000000005,89.41,35.79"/>
<path id="貯-s11"  class="stroke" stroke="#bf09bf" d="M52.19,52.59C53.599999999999994,53.03,56.209999999999994,52.99,57.61,52.78C68.12,51.12,80,49,89.51,48.26C91.86,48.08,93.28,48.22,94.46000000000001,48.44"/>
<path id="貯-s12"  class="stroke" stroke="#bf0964" d="M73.72,53.36C74.67999999999999,54.32,75.06,55.62,75.06,57.28C75.06,70.49000000000001,75.09,87.25,75.09,91.46000000000001C75.09,100.87,68.75,93.37,66.62,91.4"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="貯-bg1"  class="badge-group"><circle cx="17.59" cy="18.51" r="3.5" fill="#bf0909"/><text class="num-single" x="17.59" y="18.51" dx="0" dy="-0.5">1</text></g>
