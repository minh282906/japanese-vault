<path id="貯-s1"  class="stroke" stroke="#bf0909" d="M17.59,22.01C18.35,22.770000000000003,18.73,24.150000000000002,18.73,25.6C18.73,26.770000000000003,18.740000000000002,55.38,18.740000000000002,66.5C18.740000000000002,69.08,18.740000000000002,70.72,18.740000000000002,70.86"/>
