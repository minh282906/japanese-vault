<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (貯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #貯-bg[i]: Thời gian quả bóng số nảy lên
   - #貯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#貯-bg1  { animation-delay: 0.05s; }
#貯-s1   { stroke-dasharray: 49.1162; stroke-dashoffset: 49.1162; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#貯-bg2  { animation-delay: 0.47s; }
#貯-s2   { stroke-dasharray: 70.2930; stroke-dashoffset: 70.2930; animation: drawStroke 0.39s ease-out 0.60s forwards; }
#貯-bg3  { animation-delay: 1.01s; }
#貯-s3   { stroke-dasharray: 20.6111; stroke-dashoffset: 20.6111; animation: drawStroke 0.22s ease-out 1.14s forwards; }
#貯-bg4  { animation-delay: 1.38s; }
#貯-s4   { stroke-dasharray: 20.6445; stroke-dashoffset: 20.6445; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#貯-bg5  { animation-delay: 1.75s; }
#貯-s5   { stroke-dasharray: 19.8897; stroke-dashoffset: 19.8897; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#貯-bg6  { animation-delay: 2.12s; }
#貯-s6   { stroke-dasharray: 22.1354; stroke-dashoffset: 22.1354; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#貯-bg7  { animation-delay: 2.49s; }
#貯-s7   { stroke-dasharray: 16.8372; stroke-dashoffset: 16.8372; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#貯-bg8  { animation-delay: 2.86s; }
#貯-s8   { stroke-dasharray: 16.9695; stroke-dashoffset: 16.9695; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#貯-bg9  { animation-delay: 3.23s; }
#貯-s9   { stroke-dasharray: 15.7905; stroke-dashoffset: 15.7905; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#貯-bg10  { animation-delay: 3.60s; }
#貯-s10   { stroke-dasharray: 52.7677; stroke-dashoffset: 52.7677; animation: drawStroke 0.29s ease-out 3.73s forwards; }
#貯-bg11  { animation-delay: 4.04s; }
#貯-s11   { stroke-dasharray: 42.6515; stroke-dashoffset: 42.6515; animation: drawStroke 0.23s ease-out 4.17s forwards; }
#貯-bg12  { animation-delay: 4.42s; }
#貯-s12   { stroke-dasharray: 52.1243; stroke-dashoffset: 52.1243; animation: drawStroke 0.29s ease-out 4.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

