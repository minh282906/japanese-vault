<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (回)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #回-bg[i]: Thời gian quả bóng số nảy lên
   - #回-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#回-bg1  { animation-delay: 0.05s; }
#回-s1   { stroke-dasharray: 61.9655; stroke-dashoffset: 61.9655; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#回-bg2  { animation-delay: 0.54s; }
#回-s2   { stroke-dasharray: 133.6940; stroke-dashoffset: 133.6940; animation: drawStroke 0.55s ease-out 0.67s forwards; }
#回-bg3  { animation-delay: 1.24s; }
#回-s3   { stroke-dasharray: 22.8172; stroke-dashoffset: 22.8172; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#回-bg4  { animation-delay: 1.61s; }
#回-s4   { stroke-dasharray: 47.5764; stroke-dashoffset: 47.5764; animation: drawStroke 0.26s ease-out 1.74s forwards; }
#回-bg5  { animation-delay: 2.02s; }
#回-s5   { stroke-dasharray: 22.9044; stroke-dashoffset: 22.9044; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#回-bg6  { animation-delay: 2.39s; }
#回-s6   { stroke-dasharray: 60.9183; stroke-dashoffset: 60.9183; animation: drawStroke 0.34s ease-out 2.52s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #回-s[i]) -->
<path id="回-s1"  class="stroke" stroke="#bf0909" d="M17.5,26.25C18.56,27.31,19.4,29.34,19.61,31.23C20.88,42.870000000000005,22.03,60.769999999999996,23.77,82.5C23.94,84.62,24.11,85.28,24.3,87.5"/>
<path id="回-s2"  class="stroke" stroke="#bfbf09" d="M20.54,28.66C40.769999999999996,26.07,78.25999999999999,21.75,89.25,21.75C92,21.75,93.07,24.259999999999998,92.75,27.25C91.4,40.1,89.64,61.31,87.11,79.22999999999999C86.83,81.17999999999999,86.55,82.10999999999999,86.25,83.99999999999999"/>
<path id="回-s3"  class="stroke" stroke="#09bf09" d="M37.75,45.14C38.55,45.78,39.04,46.59,39.22,47.59C40.42,51.2,41.57,58.050000000000004,42.76,63.71000000000001C43.04,65.03,43.29,65.81,43.5,67.01"/>
<path id="回-s4"  class="stroke" stroke="#09bfbf" d="M40.03,46.4C48,44.87,62.21,42.92,66.44,42.489999999999995C68.24,42.3,69.33,43.599999999999994,69.07,44.699999999999996C68.19,48.44,65.94,56.06999999999999,64.72999999999999,61"/>
<path id="回-s5"  class="stroke" stroke="#0909bf" d="M44.25,64.5C49.480000000000004,63.66,56.3,62.9,63.05,62.07C64.36,61.910000000000004,65.67,61.75,66.97,61.61"/>
<path id="回-s6"  class="stroke" stroke="#bf09bf" d="M25.25,84.76C40.79,83.31,66.38,81.62,86,80.25"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="回-bg1"  class="badge-group"><circle cx="17.5" cy="22.75" r="3.5" fill="#bf0909"/><text class="num-single" x="17.5" y="22.75" dx="0" dy="-0.5">1</text></g>
<g id="回-bg2"  class="badge-group"><circle cx="20.54" cy="32.16" r="3.5" fill="#bfbf09"/><text class="num-single" x="20.54" y="32.16" dx="0" dy="-0.5">2</text></g>
<g id="回-bg3"  class="badge-group"><circle cx="37.75" cy="41.64" r="3.5" fill="#09bf09"/><text class="num-single" x="37.75" y="41.64" dx="0" dy="-0.5">3</text></g>
<g id="回-bg4"  class="badge-group"><circle cx="40.03" cy="49.9" r="3.5" fill="#09bfbf"/><text class="num-single" x="40.03" y="49.9" dx="0" dy="-0.5">4</text></g>
<g id="回-bg5"  class="badge-group"><circle cx="44.25" cy="64.5" r="3.5" fill="#0909bf"/><text class="num-single" x="44.25" y="64.5" dx="0" dy="-0.5">5</text></g>
<g id="回-bg6"  class="badge-group"><circle cx="25.25" cy="84.76" r="3.5" fill="#bf09bf"/><text class="num-single" x="25.25" y="84.76" dx="0" dy="-0.5">6</text></g>
</svg>