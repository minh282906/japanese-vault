<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (同)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #同-bg[i]: Thời gian quả bóng số nảy lên
   - #同-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#同-bg1  { animation-delay: 0.05s; }
#同-s1   { stroke-dasharray: 79.1523; stroke-dashoffset: 79.1523; animation: drawStroke 0.44s ease-out 0.18s forwards; }
#同-bg2  { animation-delay: 0.64s; }
#同-s2   { stroke-dasharray: 154.1310; stroke-dashoffset: 154.1310; animation: drawStroke 0.55s ease-out 0.77s forwards; }
#同-bg3  { animation-delay: 1.34s; }
#同-s3   { stroke-dasharray: 35.6963; stroke-dashoffset: 35.6963; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#同-bg4  { animation-delay: 1.71s; }
#同-s4   { stroke-dasharray: 24.0792; stroke-dashoffset: 24.0792; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#同-bg5  { animation-delay: 2.08s; }
#同-s5   { stroke-dasharray: 48.2271; stroke-dashoffset: 48.2271; animation: drawStroke 0.27s ease-out 2.21s forwards; }
#同-bg6  { animation-delay: 2.50s; }
#同-s6   { stroke-dasharray: 24.1196; stroke-dashoffset: 24.1196; animation: drawStroke 0.22s ease-out 2.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #同-s[i]) -->
<path id="同-s1"  class="stroke" stroke="#bf0909" d="M21.67,16.73C22.75,18,23.360000000000003,19.75,23.360000000000003,22.05C23.360000000000003,26.200000000000003,23.17,71.92,23.110000000000003,89.25C23.1,92.62,23.090000000000003,94.88,23.090000000000003,95.5"/>
<path id="同-s2"  class="stroke" stroke="#bfbf09" d="M24.04,19.17C39.67,17.720000000000002,81.72999999999999,14.340000000000002,83.28,14.170000000000002C87.16,13.750000000000002,88.47,15.750000000000002,88.47,18.540000000000003C88.47,21.080000000000002,88.21,83.80000000000001,88.21,89.64C88.21,102.24,83.13,94.49,80.25,91.69"/>
<path id="同-s3"  class="stroke" stroke="#09bf09" d="M37.38,33.92C38.730000000000004,34.300000000000004,41.2,34.46,42.540000000000006,34.300000000000004C49.50000000000001,33.50000000000001,61.50000000000001,32.25000000000001,68.16000000000001,31.670000000000005C70.39000000000001,31.470000000000006,71.75000000000001,31.850000000000005,72.87,32.040000000000006"/>
<path id="同-s4"  class="stroke" stroke="#09bfbf" d="M38.83,48.39C39.65,48.94,40.36,49.95,40.589999999999996,50.88C41.739999999999995,55.5,42.72,61.34,43.599999999999994,67.2C43.87,69,44.12,69.98,44.35999999999999,71.5"/>
<path id="同-s5"  class="stroke" stroke="#0909bf" d="M41.44,49.72C50.75,48.5,62.29,47.26,67.69,46.66C69.89,46.419999999999995,71.22,48.099999999999994,70.89999999999999,49.529999999999994C69.80999999999999,54.449999999999996,68.57,59.47999999999999,67.07,65.85999999999999"/>
<path id="同-s6"  class="stroke" stroke="#bf09bf" d="M45.09,69.33C50.61,68.85,57.690000000000005,67.82,65.24000000000001,67.07C66.43,66.94999999999999,67.75000000000001,67,69.08000000000001,66.97"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="同-bg1"  class="badge-group"><circle cx="21.67" cy="13.23" r="3.5" fill="#bf0909"/><text class="num-single" x="21.67" y="13.23" dx="0" dy="-0.5">1</text></g>
<g id="同-bg2"  class="badge-group"><circle cx="24.04" cy="22.67" r="3.5" fill="#bfbf09"/><text class="num-single" x="24.04" y="22.67" dx="0" dy="-0.5">2</text></g>
<g id="同-bg3"  class="badge-group"><circle cx="37.38" cy="33.92" r="3.5" fill="#09bf09"/><text class="num-single" x="37.38" y="33.92" dx="0" dy="-0.5">3</text></g>
<g id="同-bg4"  class="badge-group"><circle cx="38.83" cy="44.89" r="3.5" fill="#09bfbf"/><text class="num-single" x="38.83" y="44.89" dx="0" dy="-0.5">4</text></g>
<g id="同-bg5"  class="badge-group"><circle cx="41.44" cy="53.22" r="3.5" fill="#0909bf"/><text class="num-single" x="41.44" y="53.22" dx="0" dy="-0.5">5</text></g>
<g id="同-bg6"  class="badge-group"><circle cx="45.09" cy="69.33" r="3.5" fill="#bf09bf"/><text class="num-single" x="45.09" y="69.33" dx="0" dy="-0.5">6</text></g>
</svg>