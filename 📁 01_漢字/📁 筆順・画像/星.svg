<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (星)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #星-bg[i]: Thời gian quả bóng số nảy lên
   - #星-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#星-bg1  { animation-delay: 0.05s; }
#星-s1   { stroke-dasharray: 29.7047; stroke-dashoffset: 29.7047; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#星-bg2  { animation-delay: 0.42s; }
#星-s2   { stroke-dasharray: 76.9027; stroke-dashoffset: 76.9027; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#星-bg3  { animation-delay: 0.99s; }
#星-s3   { stroke-dasharray: 43.9331; stroke-dashoffset: 43.9331; animation: drawStroke 0.24s ease-out 1.12s forwards; }
#星-bg4  { animation-delay: 1.38s; }
#星-s4   { stroke-dasharray: 39.5226; stroke-dashoffset: 39.5226; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#星-bg5  { animation-delay: 1.75s; }
#星-s5   { stroke-dasharray: 27.4384; stroke-dashoffset: 27.4384; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#星-bg6  { animation-delay: 2.12s; }
#星-s6   { stroke-dasharray: 45.2538; stroke-dashoffset: 45.2538; animation: drawStroke 0.25s ease-out 2.25s forwards; }
#星-bg7  { animation-delay: 2.52s; }
#星-s7   { stroke-dasharray: 43.4703; stroke-dashoffset: 43.4703; animation: drawStroke 0.24s ease-out 2.65s forwards; }
#星-bg8  { animation-delay: 2.91s; }
#星-s8   { stroke-dasharray: 41.2196; stroke-dashoffset: 41.2196; animation: drawStroke 0.23s ease-out 3.04s forwards; }
#星-bg9  { animation-delay: 3.29s; }
#星-s9   { stroke-dasharray: 69.9058; stroke-dashoffset: 69.9058; animation: drawStroke 0.38s ease-out 3.42s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #星-s[i]) -->
<path id="星-s1"  class="stroke" stroke="#bf0909" d="M28.28,16.58C29.35,17.65,29.94,18.909999999999997,30.080000000000002,19.779999999999998C30.19,20.479999999999997,32.52,36.209999999999994,33.480000000000004,42.739999999999995C33.720000000000006,44.35999999999999,33.870000000000005,45.38999999999999,33.88,45.48"/>
<path id="星-s2"  class="stroke" stroke="#bf8209" d="M30.54,18.01C41.75,16.5,69.25999999999999,13.790000000000003,73.62,13.370000000000001C77.5,13.000000000000002,79.80000000000001,14.75,79.24000000000001,18.75C78.39,24.96,76.99,31.89,75.5,39C75.25,40.19,75,41.36,74.75,42.5"/>
<path id="星-s3"  class="stroke" stroke="#82bf09" d="M33.03,30.73C43.620000000000005,29.25,69.61,26.72,76.75,26.5"/>
<path id="星-s4"  class="stroke" stroke="#09bf09" d="M34.9,43.18C43.42,42.33,62.37,40.38,74.25,39.5"/>
<path id="星-s5"  class="stroke" stroke="#09bf82" d="M37.01,51.88C37.37,52.88,37.08,54.34,36.66,55.39C34.5,60.75,29.75,68.25,23,74.74"/>
<path id="星-s6"  class="stroke" stroke="#0982bf" d="M37.75,61.09C39.42,61.46,42.49,61.38,44.16,61.21C58.459999999999994,59.75,68.03999999999999,58.57,77.1,57.5C79.25,57.25,80.75,57.12,82.75,57.48"/>
<path id="星-s7"  class="stroke" stroke="#0909bf" d="M54.56,47C55.72,48.16,56.32,49.63,56.32,51.42C56.32,54.25,56.29,78.94,56.15,90"/>
<path id="星-s8"  class="stroke" stroke="#8209bf" d="M36.01,75.45C37.48,75.79,40.17,75.96000000000001,41.629999999999995,75.79C51.91,74.63000000000001,63.75,73.25,71.75999999999999,72.58000000000001C74.19,72.38000000000001,75.74999999999999,72.49000000000001,76.99999999999999,72.81000000000002"/>
<path id="星-s9"  class="stroke" stroke="#bf0982" d="M22.88,93.06C25.029999999999998,93.31,28.479999999999997,93.44,30.63,93.31C48.25,92.25,69.34,90.5,82.73,90.11C86.3,90.01,89.32000000000001,90.32,92.62,90.92999999999999"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="星-bg1"  class="badge-group"><circle cx="28.28" cy="13.08" r="3.5" fill="#bf0909"/><text class="num-single" x="28.28" y="13.08" dx="0" dy="-0.5">1</text></g>
<g id="星-bg2"  class="badge-group"><circle cx="30.54" cy="21.51" r="3.5" fill="#bf8209"/><text class="num-single" x="30.54" y="21.51" dx="0" dy="-0.5">2</text></g>
<g id="星-bg3"  class="badge-group"><circle cx="33.03" cy="30.73" r="3.5" fill="#82bf09"/><text class="num-single" x="33.03" y="30.73" dx="0" dy="-0.5">3</text></g>
<g id="星-bg4"  class="badge-group"><circle cx="34.9" cy="43.18" r="3.5" fill="#09bf09"/><text class="num-single" x="34.9" y="43.18" dx="0" dy="-0.5">4</text></g>
<g id="星-bg5"  class="badge-group"><circle cx="37.01" cy="51.88" r="3.5" fill="#09bf82"/><text class="num-single" x="37.01" y="51.88" dx="0" dy="-0.5">5</text></g>
<g id="星-bg6"  class="badge-group"><circle cx="37.75" cy="61.09" r="3.5" fill="#0982bf"/><text class="num-single" x="37.75" y="61.09" dx="0" dy="-0.5">6</text></g>
<g id="星-bg7"  class="badge-group"><circle cx="54.56" cy="47" r="3.5" fill="#0909bf"/><text class="num-single" x="54.56" y="47" dx="0" dy="-0.5">7</text></g>
<g id="星-bg8"  class="badge-group"><circle cx="36.01" cy="75.45" r="3.5" fill="#8209bf"/><text class="num-single" x="36.01" y="75.45" dx="0" dy="-0.5">8</text></g>
