<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (費)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #費-bg[i]: Thời gian quả bóng số nảy lên
   - #費-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#費-bg1  { animation-delay: 0.05s; }
#費-s1   { stroke-dasharray: 65.1114; stroke-dashoffset: 65.1114; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#費-bg2  { animation-delay: 0.56s; }
#費-s2   { stroke-dasharray: 57.0216; stroke-dashoffset: 57.0216; animation: drawStroke 0.31s ease-out 0.69s forwards; }
#費-bg3  { animation-delay: 1.02s; }
#費-s3   { stroke-dasharray: 107.0360; stroke-dashoffset: 107.0360; animation: drawStroke 0.55s ease-out 1.15s forwards; }
#費-bg4  { animation-delay: 1.72s; }
#費-s4   { stroke-dasharray: 37.1190; stroke-dashoffset: 37.1190; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#費-bg5  { animation-delay: 2.09s; }
#費-s5   { stroke-dasharray: 36.9297; stroke-dashoffset: 36.9297; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#費-bg6  { animation-delay: 2.46s; }
#費-s6   { stroke-dasharray: 35.3964; stroke-dashoffset: 35.3964; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#費-bg7  { animation-delay: 2.83s; }
#費-s7   { stroke-dasharray: 69.1849; stroke-dashoffset: 69.1849; animation: drawStroke 0.38s ease-out 2.96s forwards; }
#費-bg8  { animation-delay: 3.36s; }
#費-s8   { stroke-dasharray: 34.5630; stroke-dashoffset: 34.5630; animation: drawStroke 0.22s ease-out 3.49s forwards; }
#費-bg9  { animation-delay: 3.73s; }
#費-s9   { stroke-dasharray: 34.1040; stroke-dashoffset: 34.1040; animation: drawStroke 0.22s ease-out 3.86s forwards; }
#費-bg10  { animation-delay: 4.10s; }
#費-s10   { stroke-dasharray: 34.0797; stroke-dashoffset: 34.0797; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#費-bg11  { animation-delay: 4.47s; }
#費-s11   { stroke-dasharray: 22.5436; stroke-dashoffset: 22.5436; animation: drawStroke 0.22s ease-out 4.60s forwards; }
#費-bg12  { animation-delay: 4.84s; }
#費-s12   { stroke-dasharray: 18.3406; stroke-dashoffset: 18.3406; animation: drawStroke 0.22s ease-out 4.97s forwards; }
]]>
</style>

