<path id="費-s8"  class="stroke" stroke="#0964bf" d="M37.83,64.77C46.12,63.99999999999999,65.25,62.37,72.28999999999999,62.13999999999999"/>
<path id="費-s9"  class="stroke" stroke="#0909bf" d="M38.11,74.91C47.25,74.36999999999999,63.5,73.11999999999999,72.15,72.84"/>
<path id="費-s10"  class="stroke" stroke="#6409bf" d="M37.98,85.53C46.75,85,62.5,84,72.01,83.71"/>
