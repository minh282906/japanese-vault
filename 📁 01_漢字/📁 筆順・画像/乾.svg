<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (乾)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #乾-bg[i]: Thời gian quả bóng số nảy lên
   - #乾-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#乾-bg1  { animation-delay: 0.05s; }
#乾-s1   { stroke-dasharray: 32.7384; stroke-dashoffset: 32.7384; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#乾-bg2  { animation-delay: 0.42s; }
#乾-s2   { stroke-dasharray: 25.5005; stroke-dashoffset: 25.5005; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#乾-bg3  { animation-delay: 0.79s; }
#乾-s3   { stroke-dasharray: 24.0024; stroke-dashoffset: 24.0024; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#乾-bg4  { animation-delay: 1.16s; }
#乾-s4   { stroke-dasharray: 53.4649; stroke-dashoffset: 53.4649; animation: drawStroke 0.29s ease-out 1.29s forwards; }
#乾-bg5  { animation-delay: 1.60s; }
#乾-s5   { stroke-dasharray: 26.0444; stroke-dashoffset: 26.0444; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#乾-bg6  { animation-delay: 1.97s; }
#乾-s6   { stroke-dasharray: 23.1325; stroke-dashoffset: 23.1325; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#乾-bg7  { animation-delay: 2.34s; }
#乾-s7   { stroke-dasharray: 38.0267; stroke-dashoffset: 38.0267; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#乾-bg8  { animation-delay: 2.71s; }
#乾-s8   { stroke-dasharray: 34.9469; stroke-dashoffset: 34.9469; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#乾-bg9  { animation-delay: 3.08s; }
#乾-s9   { stroke-dasharray: 34.9638; stroke-dashoffset: 34.9638; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#乾-bg10  { animation-delay: 3.45s; }
#乾-s10   { stroke-dasharray: 25.1724; stroke-dashoffset: 25.1724; animation: drawStroke 0.22s ease-out 3.58s forwards; }
#乾-bg11  { animation-delay: 3.82s; }
#乾-s11   { stroke-dasharray: 105.3220; stroke-dashoffset: 105.3220; animation: drawStroke 0.55s ease-out 3.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #乾-s[i]) -->
<path id="乾-s1"  class="stroke" stroke="#bf0909" d="M13.77,28.16C15.75,28.38,17.02,28.3,18.52,28.11C25.45,27.23,35.79,25.439999999999998,41.620000000000005,24.82C43.160000000000004,24.66,44.71000000000001,24.53,46.24,24.86"/>
