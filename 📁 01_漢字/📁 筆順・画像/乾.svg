<path id="乾-s4"  class="stroke" stroke="#4bbf09" d="M16.08,42.31C22.31,41.04,35.769999999999996,38.52,41.98,37.86C46.51,37.37,46.94,39.22,46.279999999999994,43.26C45.739999999999995,46.55,44.82999999999999,52.29,44.05,56.76C43.76,58.4,43.459999999999994,59.94,43.14,61.239999999999995"/>
<path id="乾-s5"  class="stroke" stroke="#09bf2a" d="M18.53,52.12C26,51,37.75,48.88,44.31,48.47"/>
<path id="乾-s6"  class="stroke" stroke="#09bf8d" d="M19.91,61.93C28.25,60.75,35.75,59.25,42.83,58.87"/>
<path id="乾-s7"  class="stroke" stroke="#098dbf" d="M10.92,77.63C12.879999999999999,78.32,15.129999999999999,77.92,17.13,77.64999999999999C24.61,76.64999999999999,35.65,74.33,42.75,73.86999999999999C44.61,73.74999999999999,46.75,73.47999999999999,48.58,73.85999999999999"/>
<path id="乾-s8"  class="stroke" stroke="#092abf" d="M30.49,63.35C31.259999999999998,64.12,31.669999999999998,65.25,31.669999999999998,66.7C31.669999999999998,67.29,31.669999999999998,82.78,31.619999999999997,92C31.609999999999996,94.73,31.589999999999996,96.92,31.58,98"/>
<path id="乾-s9"  class="stroke" stroke="#4b09bf" d="M66.75,14.5C67,15.5,66.71,16.91,66.42,17.73C63.25,27,59.25,35.38,51.5,45.5"/>
<path id="乾-s10"  class="stroke" stroke="#ae09bf" d="M63,34.07C64.12,34.12,65.33,34.01,66.3,33.93C71.17999999999999,33.55,75.85,31.8,82.42,30.47C84.32000000000001,30.09,85.84,30.029999999999998,87.75,30.34"/>
<path id="乾-s11"  class="stroke" stroke="#bf096c" d="M53.75,55.59C55.87,56.120000000000005,57.74,56.03,59.28,55.63C63.89,54.43,71.4,52.46,72.82,52C74.75,51.38,75.72,52.85,74.38999999999999,54.45C66.25,64.25,61,73,59.67,81.88C58.35,90.74,60.75,94.78,79,94.78C93.5,94.78,96.09,93.75,96.09,87.18"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="乾-bg1"  class="badge-group"><circle cx="13.77" cy="28.16" r="3.5" fill="#bf0909"/><text class="num-single" x="13.77" y="28.16" dx="0" dy="-0.5">1</text></g>
