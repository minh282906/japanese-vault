<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (共)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #共-bg[i]: Thời gian quả bóng số nảy lên
   - #共-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#共-bg1  { animation-delay: 0.05s; }
#共-s1   { stroke-dasharray: 62.7151; stroke-dashoffset: 62.7151; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#共-bg2  { animation-delay: 0.54s; }
#共-s2   { stroke-dasharray: 42.0367; stroke-dashoffset: 42.0367; animation: drawStroke 0.23s ease-out 0.67s forwards; }
#共-bg3  { animation-delay: 0.92s; }
#共-s3   { stroke-dasharray: 45.6910; stroke-dashoffset: 45.6910; animation: drawStroke 0.25s ease-out 1.05s forwards; }
#共-bg4  { animation-delay: 1.32s; }
#共-s4   { stroke-dasharray: 83.1222; stroke-dashoffset: 83.1222; animation: drawStroke 0.46s ease-out 1.45s forwards; }
#共-bg5  { animation-delay: 1.93s; }
#共-s5   { stroke-dasharray: 30.6235; stroke-dashoffset: 30.6235; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#共-bg6  { animation-delay: 2.30s; }
#共-s6   { stroke-dasharray: 31.6200; stroke-dashoffset: 31.6200; animation: drawStroke 0.22s ease-out 2.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #共-s[i]) -->
<path id="共-s1"  class="stroke" stroke="#bf0909" d="M24.5,39.15C27,39.75,29.41,39.64,31.71,39.28C41.07,37.84,67.36,34.06,79.25,33.19C81.74,33.01,84.28,32.83,86.74,33.37"/>
<path id="共-s2"  class="stroke" stroke="#bfbf09" d="M39.12,18.5C40,19.38,40.76,20.73,40.83,21.75C41.379999999999995,30.25,42.25,51.75,42.75,60"/>
<path id="共-s3"  class="stroke" stroke="#09bf09" d="M66.62,12.75C67.5,13.63,68.12,14.98,68.08,16C67.5,29.75,66.75,42.75,66.25,58"/>
<path id="共-s4"  class="stroke" stroke="#09bfbf" d="M13.5,63.23C15.76,63.97,19.91,64.22,22.15,63.97C37.87,62.25,69.37,57.81,88.22,57.14C91.98,57.01,94.24,57.49,96.12,57.87"/>
<path id="共-s5"  class="stroke" stroke="#0909bf" d="M42,72.14C42.05,72.71,42.11,73.6,41.9,74.42C40.629999999999995,79.22,32.25,87.75,23.31,95.47"/>
<path id="共-s6"  class="stroke" stroke="#bf09bf" d="M68.5,72.62C75.49,76.87,86.56,90.10000000000001,88.31,96.71000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="共-bg1"  class="badge-group"><circle cx="24.5" cy="39.15" r="3.5" fill="#bf0909"/><text class="num-single" x="24.5" y="39.15" dx="0" dy="-0.5">1</text></g>
<g id="共-bg2"  class="badge-group"><circle cx="39.12" cy="18.5" r="3.5" fill="#bfbf09"/><text class="num-single" x="39.12" y="18.5" dx="0" dy="-0.5">2</text></g>
<g id="共-bg3"  class="badge-group"><circle cx="66.62" cy="12.75" r="3.5" fill="#09bf09"/><text class="num-single" x="66.62" y="12.75" dx="0" dy="-0.5">3</text></g>
<g id="共-bg4"  class="badge-group"><circle cx="13.5" cy="63.23" r="3.5" fill="#09bfbf"/><text class="num-single" x="13.5" y="63.23" dx="0" dy="-0.5">4</text></g>
<g id="共-bg5"  class="badge-group"><circle cx="42" cy="72.14" r="3.5" fill="#0909bf"/><text class="num-single" x="42" y="72.14" dx="0" dy="-0.5">5</text></g>
<g id="共-bg6"  class="badge-group"><circle cx="68.5" cy="72.62" r="3.5" fill="#bf09bf"/><text class="num-single" x="68.5" y="72.62" dx="0" dy="-0.5">6</text></g>
</svg>