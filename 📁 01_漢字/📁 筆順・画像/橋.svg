<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (橋)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #橋-bg[i]: Thời gian quả bóng số nảy lên
   - #橋-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#橋-bg1  { animation-delay: 0.05s; }
#橋-s1   { stroke-dasharray: 30.0514; stroke-dashoffset: 30.0514; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#橋-bg2  { animation-delay: 0.42s; }
#橋-s2   { stroke-dasharray: 81.9233; stroke-dashoffset: 81.9233; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#橋-bg3  { animation-delay: 1.02s; }
#橋-s3   { stroke-dasharray: 40.2108; stroke-dashoffset: 40.2108; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#橋-bg4  { animation-delay: 1.39s; }
#橋-s4   { stroke-dasharray: 12.1999; stroke-dashoffset: 12.1999; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#橋-bg5  { animation-delay: 1.76s; }
#橋-s5   { stroke-dasharray: 31.1329; stroke-dashoffset: 31.1329; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#橋-bg6  { animation-delay: 2.13s; }
#橋-s6   { stroke-dasharray: 45.5306; stroke-dashoffset: 45.5306; animation: drawStroke 0.25s ease-out 2.26s forwards; }
#橋-bg7  { animation-delay: 2.53s; }
#橋-s7   { stroke-dasharray: 35.6384; stroke-dashoffset: 35.6384; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#橋-bg8  { animation-delay: 2.90s; }
#橋-s8   { stroke-dasharray: 29.4933; stroke-dashoffset: 29.4933; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#橋-bg9  { animation-delay: 3.27s; }
#橋-s9   { stroke-dasharray: 14.1077; stroke-dashoffset: 14.1077; animation: drawStroke 0.22s ease-out 3.40s forwards; }
#橋-bg10  { animation-delay: 3.64s; }
#橋-s10   { stroke-dasharray: 32.5098; stroke-dashoffset: 32.5098; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#橋-bg11  { animation-delay: 4.01s; }
#橋-s11   { stroke-dasharray: 18.7632; stroke-dashoffset: 18.7632; animation: drawStroke 0.22s ease-out 4.14s forwards; }
#橋-bg12  { animation-delay: 4.38s; }
#橋-s12   { stroke-dasharray: 31.3950; stroke-dashoffset: 31.3950; animation: drawStroke 0.22s ease-out 4.51s forwards; }
#橋-bg13  { animation-delay: 4.75s; }
#橋-s13   { stroke-dasharray: 88.5620; stroke-dashoffset: 88.5620; animation: drawStroke 0.49s ease-out 4.88s forwards; }
#橋-bg14  { animation-delay: 5.39s; }
#橋-s14   { stroke-dasharray: 13.5929; stroke-dashoffset: 13.5929; animation: drawStroke 0.22s ease-out 5.52s forwards; }
#橋-bg15  { animation-delay: 5.76s; }
#橋-s15   { stroke-dasharray: 29.2420; stroke-dashoffset: 29.2420; animation: drawStroke 0.22s ease-out 5.89s forwards; }
#橋-bg16  { animation-delay: 6.13s; }
#橋-s16   { stroke-dasharray: 16.2148; stroke-dashoffset: 16.2148; animation: drawStroke 0.22s ease-out 6.26s forwards; }
]]>
</style>

