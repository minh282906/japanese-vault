<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (主)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #主-bg[i]: Thời gian quả bóng số nảy lên
   - #主-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#主-bg1  { animation-delay: 0.05s; }
#主-s1   { stroke-dasharray: 16.7969; stroke-dashoffset: 16.7969; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#主-bg2  { animation-delay: 0.42s; }
#主-s2   { stroke-dasharray: 56.1601; stroke-dashoffset: 56.1601; animation: drawStroke 0.31s ease-out 0.55s forwards; }
#主-bg3  { animation-delay: 0.88s; }
#主-s3   { stroke-dasharray: 49.4043; stroke-dashoffset: 49.4043; animation: drawStroke 0.27s ease-out 1.01s forwards; }
#主-bg4  { animation-delay: 1.30s; }
#主-s4   { stroke-dasharray: 51.9372; stroke-dashoffset: 51.9372; animation: drawStroke 0.29s ease-out 1.43s forwards; }
#主-bg5  { animation-delay: 1.74s; }
#主-s5   { stroke-dasharray: 77.8592; stroke-dashoffset: 77.8592; animation: drawStroke 0.43s ease-out 1.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #主-s[i]) -->
<path id="主-s1"  class="stroke" stroke="#bf0909" d="M42.5,14.38C47.39,16.21,54.59,21.37,55.81,24.22"/>
<path id="主-s2"  class="stroke" stroke="#9abf09" d="M25,39.36C27.59,40.21,30.96,39.86,33.63,39.53C46.52,37.94,59.620000000000005,35.52,73.26,34.78C75.79,34.64,78.27000000000001,34.67,80.76,35.21"/>
<path id="主-s3"  class="stroke" stroke="#09bf52" d="M52.75,39.83C54.02,41.1,54.5,42.66,54.5,43.58C54.5,49.989999999999995,54.75,81.88,54.75,88.75"/>
<path id="主-s4"  class="stroke" stroke="#0952bf" d="M27.75,64.82C29.75,65.25,32.59,65.25,34.63,64.97999999999999C45.75,63.49999999999999,59.980000000000004,61.639999999999986,71.25,60.71999999999999C73.93,60.49999999999999,77.13,60.37999999999999,79.38,60.85999999999999"/>
<path id="主-s5"  class="stroke" stroke="#9a09bf" d="M15.5,92.76C18.19,93.38000000000001,21.56,93.46000000000001,23.72,93.26C40.75,91.75,66.00999999999999,87.87,84.68,87.96000000000001C88.16000000000001,87.98,91.26,88.2,93.01,88.65"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="主-bg1"  class="badge-group"><circle cx="42.5" cy="14.38" r="3.5" fill="#bf0909"/><text class="num-single" x="42.5" y="14.38" dx="0" dy="-0.5">1</text></g>
<g id="主-bg2"  class="badge-group"><circle cx="25" cy="39.36" r="3.5" fill="#9abf09"/><text class="num-single" x="25" y="39.36" dx="0" dy="-0.5">2</text></g>
<g id="主-bg3"  class="badge-group"><circle cx="52.75" cy="39.83" r="3.5" fill="#09bf52"/><text class="num-single" x="52.75" y="39.83" dx="0" dy="-0.5">3</text></g>
<g id="主-bg4"  class="badge-group"><circle cx="27.75" cy="64.82" r="3.5" fill="#0952bf"/><text class="num-single" x="27.75" y="64.82" dx="0" dy="-0.5">4</text></g>
<g id="主-bg5"  class="badge-group"><circle cx="15.5" cy="92.76" r="3.5" fill="#9a09bf"/><text class="num-single" x="15.5" y="92.76" dx="0" dy="-0.5">5</text></g>
</svg>