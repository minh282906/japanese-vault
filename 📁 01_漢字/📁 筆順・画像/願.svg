<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (願)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #願-bg[i]: Thời gian quả bóng số nảy lên
   - #願-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#願-bg1  { animation-delay: 0.05s; }
#願-s1   { stroke-dasharray: 35.9552; stroke-dashoffset: 35.9552; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#願-bg2  { animation-delay: 0.42s; }
#願-s2   { stroke-dasharray: 61.1825; stroke-dashoffset: 61.1825; animation: drawStroke 0.34s ease-out 0.55s forwards; }
#願-bg3  { animation-delay: 0.91s; }
#願-s3   { stroke-dasharray: 13.0711; stroke-dashoffset: 13.0711; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#願-bg4  { animation-delay: 1.28s; }
#願-s4   { stroke-dasharray: 24.2481; stroke-dashoffset: 24.2481; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#願-bg5  { animation-delay: 1.65s; }
#願-s5   { stroke-dasharray: 47.0299; stroke-dashoffset: 47.0299; animation: drawStroke 0.26s ease-out 1.78s forwards; }
#願-bg6  { animation-delay: 2.06s; }
#願-s6   { stroke-dasharray: 20.9767; stroke-dashoffset: 20.9767; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#願-bg7  { animation-delay: 2.43s; }
#願-s7   { stroke-dasharray: 18.5742; stroke-dashoffset: 18.5742; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#願-bg8  { animation-delay: 2.80s; }
#願-s8   { stroke-dasharray: 41.2198; stroke-dashoffset: 41.2198; animation: drawStroke 0.23s ease-out 2.93s forwards; }
#願-bg9  { animation-delay: 3.18s; }
#願-s9   { stroke-dasharray: 22.3886; stroke-dashoffset: 22.3886; animation: drawStroke 0.22s ease-out 3.31s forwards; }
#願-bg10  { animation-delay: 3.55s; }
#願-s10   { stroke-dasharray: 15.2499; stroke-dashoffset: 15.2499; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#願-bg11  { animation-delay: 3.92s; }
#願-s11   { stroke-dasharray: 37.1703; stroke-dashoffset: 37.1703; animation: drawStroke 0.22s ease-out 4.05s forwards; }
#願-bg12  { animation-delay: 4.29s; }
#願-s12   { stroke-dasharray: 12.9556; stroke-dashoffset: 12.9556; animation: drawStroke 0.22s ease-out 4.42s forwards; }
#願-bg13  { animation-delay: 4.66s; }
#願-s13   { stroke-dasharray: 42.9753; stroke-dashoffset: 42.9753; animation: drawStroke 0.24s ease-out 4.79s forwards; }
#願-bg14  { animation-delay: 5.05s; }
#願-s14   { stroke-dasharray: 70.3682; stroke-dashoffset: 70.3682; animation: drawStroke 0.39s ease-out 5.18s forwards; }
#願-bg15  { animation-delay: 5.59s; }
#願-s15   { stroke-dasharray: 26.2578; stroke-dashoffset: 26.2578; animation: drawStroke 0.22s ease-out 5.72s forwards; }
#願-bg16  { animation-delay: 5.96s; }
#願-s16   { stroke-dasharray: 26.5524; stroke-dashoffset: 26.5524; animation: drawStroke 0.22s ease-out 6.09s forwards; }
#願-bg17  { animation-delay: 6.33s; }
#願-s17   { stroke-dasharray: 26.2980; stroke-dashoffset: 26.2980; animation: drawStroke 0.22s ease-out 6.46s forwards; }
#願-bg18  { animation-delay: 6.70s; }
#願-s18   { stroke-dasharray: 20.4045; stroke-dashoffset: 20.4045; animation: drawStroke 0.22s ease-out 6.83s forwards; }
#願-bg19  { animation-delay: 7.07s; }
#願-s19   { stroke-dasharray: 18.1661; stroke-dashoffset: 18.1661; animation: drawStroke 0.22s ease-out 7.20s forwards; }
]]>
</style>

