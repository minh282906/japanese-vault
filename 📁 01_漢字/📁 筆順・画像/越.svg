<path id="越-s9"  class="stroke" stroke="#0909bf" d="M51.59,35.57C53.5,36,55.31,35.89,57,35.76C67,35,75.38,33.5,83.51,31.58C84.85000000000001,31.259999999999998,87.12,31.04,88.47,31.45"/>
<path id="越-s10"  class="stroke" stroke="#6409bf" d="M63.41,11.21C64.7,12.72,65.11999999999999,14.15,65.42999999999999,17.39C68,43.81,75.46,66.29,88.66,78.73C94.25,84,95.25,83.38000000000001,94.41,74.44"/>
<path id="越-s11"  class="stroke" stroke="#bf09bf" d="M87.28,41.17C87.34,42.050000000000004,87.41,43.45,87.16,44.72C85.67,52.2,77.09,69.43,65.36,79.47"/>
