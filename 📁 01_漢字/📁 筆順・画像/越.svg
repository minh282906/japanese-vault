<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (越)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #越-bg[i]: Thời gian quả bóng số nảy lên
   - #越-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#越-bg1  { animation-delay: 0.05s; }
#越-s1   { stroke-dasharray: 26.5849; stroke-dashoffset: 26.5849; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#越-bg2  { animation-delay: 0.42s; }
#越-s2   { stroke-dasharray: 29.3637; stroke-dashoffset: 29.3637; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#越-bg3  { animation-delay: 0.79s; }
#越-s3   { stroke-dasharray: 33.6588; stroke-dashoffset: 33.6588; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#越-bg4  { animation-delay: 1.16s; }
#越-s4   { stroke-dasharray: 31.3582; stroke-dashoffset: 31.3582; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#越-bg5  { animation-delay: 1.53s; }
#越-s5   { stroke-dasharray: 12.2813; stroke-dashoffset: 12.2813; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#越-bg6  { animation-delay: 1.90s; }
#越-s6   { stroke-dasharray: 40.0366; stroke-dashoffset: 40.0366; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#越-bg7  { animation-delay: 2.27s; }
#越-s7   { stroke-dasharray: 73.6762; stroke-dashoffset: 73.6762; animation: drawStroke 0.41s ease-out 2.40s forwards; }
#越-bg8  { animation-delay: 2.83s; }
#越-s8   { stroke-dasharray: 56.4396; stroke-dashoffset: 56.4396; animation: drawStroke 0.31s ease-out 2.96s forwards; }
#越-bg9  { animation-delay: 3.29s; }
#越-s9   { stroke-dasharray: 37.3079; stroke-dashoffset: 37.3079; animation: drawStroke 0.22s ease-out 3.42s forwards; }
#越-bg10  { animation-delay: 3.66s; }
#越-s10   { stroke-dasharray: 87.6481; stroke-dashoffset: 87.6481; animation: drawStroke 0.48s ease-out 3.79s forwards; }
#越-bg11  { animation-delay: 4.29s; }
#越-s11   { stroke-dasharray: 45.1272; stroke-dashoffset: 45.1272; animation: drawStroke 0.25s ease-out 4.42s forwards; }
#越-bg12  { animation-delay: 4.69s; }
#越-s12   { stroke-dasharray: 12.9414; stroke-dashoffset: 12.9414; animation: drawStroke 0.22s ease-out 4.82s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

