<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (早)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #早-bg[i]: Thời gian quả bóng số nảy lên
   - #早-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#早-bg1  { animation-delay: 0.05s; }
#早-s1   { stroke-dasharray: 34.3744; stroke-dashoffset: 34.3744; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#早-bg2  { animation-delay: 0.42s; }
#早-s2   { stroke-dasharray: 80.8220; stroke-dashoffset: 80.8220; animation: drawStroke 0.44s ease-out 0.55s forwards; }
#早-bg3  { animation-delay: 1.01s; }
#早-s3   { stroke-dasharray: 42.3575; stroke-dashoffset: 42.3575; animation: drawStroke 0.23s ease-out 1.14s forwards; }
#早-bg4  { animation-delay: 1.39s; }
#早-s4   { stroke-dasharray: 37.0795; stroke-dashoffset: 37.0795; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#早-bg5  { animation-delay: 1.76s; }
#早-s5   { stroke-dasharray: 82.3074; stroke-dashoffset: 82.3074; animation: drawStroke 0.45s ease-out 1.89s forwards; }
#早-bg6  { animation-delay: 2.36s; }
#早-s6   { stroke-dasharray: 50.6065; stroke-dashoffset: 50.6065; animation: drawStroke 0.28s ease-out 2.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #早-s[i]) -->
<path id="早-s1"  class="stroke" stroke="#bf0909" d="M28,16C29.25,17.25,29.82,18.05,30.25,20C31.25,24.5,33,36.75,34.38,44.980000000000004C34.7,46.89,34.870000000000005,47.50000000000001,35.34,49.25"/>
<path id="早-s2"  class="stroke" stroke="#bfbf09" d="M30.51,17.25C31.450000000000003,17.2,73.29,12.74,76.78,13.25C78.5,13.5,80.15,15.47,79.49,18C78.47999999999999,21.87,76.63,31.89,74.75999999999999,40.06C74.33999999999999,41.92,73.86999999999999,43.13,73.24999999999999,45.5"/>
<path id="早-s3"  class="stroke" stroke="#09bf09" d="M33.61,31.75C42.75,30.75,68.13,28.63,75.82,28.25"/>
<path id="早-s4"  class="stroke" stroke="#09bfbf" d="M36.01,46.5C47.88,45.5,67,44,73,44"/>
<path id="早-s5"  class="stroke" stroke="#0909bf" d="M14.13,66.16C16.07,66.64,19.65,66.77,21.59,66.64C38.41,65.51,73.63,62.76,89.45,62.8C92.69,62.809999999999995,94.64,63.029999999999994,96.26,63.269999999999996"/>
<path id="早-s6"  class="stroke" stroke="#bf09bf" d="M53.23,47.75C54.36,48.88,54.699999999999996,50.63,54.699999999999996,52.24C54.699999999999996,53.15,54.69,78.86,54.60999999999999,91.75C54.58999999999999,94.56,54.56999999999999,96.77,54.559999999999995,98"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="早-bg1"  class="badge-group"><circle cx="28" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="28" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="早-bg2"  class="badge-group"><circle cx="30.51" cy="20.75" r="3.5" fill="#bfbf09"/><text class="num-single" x="30.51" y="20.75" dx="0" dy="-0.5">2</text></g>
<g id="早-bg3"  class="badge-group"><circle cx="33.61" cy="31.75" r="3.5" fill="#09bf09"/><text class="num-single" x="33.61" y="31.75" dx="0" dy="-0.5">3</text></g>
<g id="早-bg4"  class="badge-group"><circle cx="36.01" cy="46.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="36.01" y="46.5" dx="0" dy="-0.5">4</text></g>
<g id="早-bg5"  class="badge-group"><circle cx="14.13" cy="66.16" r="3.5" fill="#0909bf"/><text class="num-single" x="14.13" y="66.16" dx="0" dy="-0.5">5</text></g>
<g id="早-bg6"  class="badge-group"><circle cx="53.23" cy="47.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="53.23" y="47.75" dx="0" dy="-0.5">6</text></g>
</svg>