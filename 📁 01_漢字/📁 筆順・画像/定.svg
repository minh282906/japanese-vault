<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (定)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #定-bg[i]: Thời gian quả bóng số nảy lên
   - #定-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#定-bg1  { animation-delay: 0.05s; }
#定-s1   { stroke-dasharray: 14.0475; stroke-dashoffset: 14.0475; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#定-bg2  { animation-delay: 0.42s; }
#定-s2   { stroke-dasharray: 16.0203; stroke-dashoffset: 16.0203; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#定-bg3  { animation-delay: 0.79s; }
#定-s3   { stroke-dasharray: 80.3489; stroke-dashoffset: 80.3489; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#定-bg4  { animation-delay: 1.38s; }
#定-s4   { stroke-dasharray: 44.3947; stroke-dashoffset: 44.3947; animation: drawStroke 0.24s ease-out 1.51s forwards; }
#定-bg5  { animation-delay: 1.77s; }
#定-s5   { stroke-dasharray: 40.0428; stroke-dashoffset: 40.0428; animation: drawStroke 0.22s ease-out 1.90s forwards; }
#定-bg6  { animation-delay: 2.14s; }
#定-s6   { stroke-dasharray: 23.7943; stroke-dashoffset: 23.7943; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#定-bg7  { animation-delay: 2.51s; }
#定-s7   { stroke-dasharray: 41.3438; stroke-dashoffset: 41.3438; animation: drawStroke 0.23s ease-out 2.64s forwards; }
#定-bg8  { animation-delay: 2.89s; }
#定-s8   { stroke-dasharray: 62.8237; stroke-dashoffset: 62.8237; animation: drawStroke 0.35s ease-out 3.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #定-s[i]) -->
<path id="定-s1"  class="stroke" stroke="#bf0909" d="M52.57,10.17C53.83,11.43,54.33,13.129999999999999,54.33,14.73C54.33,18.34,54.239999999999995,20.48,54.23,23.759999999999998"/>
<path id="定-s2"  class="stroke" stroke="#bf9109" d="M21.25,26C21.25,29.53,18.84,39.230000000000004,17.75,41.58"/>
<path id="定-s3"  class="stroke" stroke="#64bf09" d="M22.44,29.18C40.75,26.5,69.97,22.35,85.49,21.85C96.5,21.5,89.75,29,85.30999999999999,31.43"/>
<path id="定-s4"  class="stroke" stroke="#09bf36" d="M33.6,42.82C36.32,43.26,38.96,43.160000000000004,41.72,42.82C48.26,42,65.77,40.07,70.09,39.75C73.5,39.5,75.25,39.5,77.75,40.13"/>
<path id="定-s5"  class="stroke" stroke="#09bfbf" d="M52.9,42.77C53.82,43.690000000000005,54.07,45.230000000000004,54.07,46.14C54.07,49.13,54.35,76.63,54.35,82.53"/>
<path id="定-s6"  class="stroke" stroke="#0936bf" d="M54.61,62.86C60.75,62.12,67,61.37,74.03999999999999,60.47C75.72999999999999,60.25,77.16999999999999,60.25,78.24,60.47"/>
<path id="定-s7"  class="stroke" stroke="#6409bf" d="M36.36,57.64C36.42,58.5,36.48,59.86,36.25,61.1C34.85,68.39,27.36,82.96000000000001,16.38,92.75"/>
<path id="定-s8"  class="stroke" stroke="#bf0991" d="M31.96,73.89C39.08,76.85,68.45,89.97,79.58,94.47C83.02,95.86,86.42999999999999,96.85,90.13,97.25"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="定-bg1"  class="badge-group"><circle cx="52.57" cy="10.17" r="3.5" fill="#bf0909"/><text class="num-single" x="52.57" y="10.17" dx="0" dy="-0.5">1</text></g>
<g id="定-bg2"  class="badge-group"><circle cx="21.25" cy="22.5" r="3.5" fill="#bf9109"/><text class="num-single" x="21.25" y="22.5" dx="0" dy="-0.5">2</text></g>
<g id="定-bg3"  class="badge-group"><circle cx="22.44" cy="32.68" r="3.5" fill="#64bf09"/><text class="num-single" x="22.44" y="32.68" dx="0" dy="-0.5">3</text></g>
<g id="定-bg4"  class="badge-group"><circle cx="33.6" cy="42.82" r="3.5" fill="#09bf36"/><text class="num-single" x="33.6" y="42.82" dx="0" dy="-0.5">4</text></g>
<g id="定-bg5"  class="badge-group"><circle cx="52.9" cy="42.77" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.9" y="42.77" dx="0" dy="-0.5">5</text></g>
<g id="定-bg6"  class="badge-group"><circle cx="54.61" cy="62.86" r="3.5" fill="#0936bf"/><text class="num-single" x="54.61" y="62.86" dx="0" dy="-0.5">6</text></g>
<g id="定-bg7"  class="badge-group"><circle cx="36.36" cy="57.64" r="3.5" fill="#6409bf"/><text class="num-single" x="36.36" y="57.64" dx="0" dy="-0.5">7</text></g>
<g id="定-bg8"  class="badge-group"><circle cx="31.96" cy="73.89" r="3.5" fill="#bf0991"/><text class="num-single" x="31.96" y="73.89" dx="0" dy="-0.5">8</text></g>
</svg>