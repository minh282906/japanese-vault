<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (針)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #針-bg[i]: Thời gian quả bóng số nảy lên
   - #針-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#針-bg1  { animation-delay: 0.05s; }
#針-s1   { stroke-dasharray: 40.8046; stroke-dashoffset: 40.8046; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#針-bg2  { animation-delay: 0.42s; }
#針-s2   { stroke-dasharray: 18.4178; stroke-dashoffset: 18.4178; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#針-bg3  { animation-delay: 0.79s; }
#針-s3   { stroke-dasharray: 18.5489; stroke-dashoffset: 18.5489; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#針-bg4  { animation-delay: 1.16s; }
#針-s4   { stroke-dasharray: 36.3194; stroke-dashoffset: 36.3194; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#針-bg5  { animation-delay: 1.53s; }
#針-s5   { stroke-dasharray: 38.0271; stroke-dashoffset: 38.0271; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#針-bg6  { animation-delay: 1.90s; }
#針-s6   { stroke-dasharray: 12.3643; stroke-dashoffset: 12.3643; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#針-bg7  { animation-delay: 2.27s; }
#針-s7   { stroke-dasharray: 16.0259; stroke-dashoffset: 16.0259; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#針-bg8  { animation-delay: 2.64s; }
#針-s8   { stroke-dasharray: 41.3584; stroke-dashoffset: 41.3584; animation: drawStroke 0.23s ease-out 2.77s forwards; }
#針-bg9  { animation-delay: 3.02s; }
#針-s9   { stroke-dasharray: 42.5478; stroke-dashoffset: 42.5478; animation: drawStroke 0.23s ease-out 3.15s forwards; }
#針-bg10  { animation-delay: 3.40s; }
#針-s10   { stroke-dasharray: 85.6239; stroke-dashoffset: 85.6239; animation: drawStroke 0.47s ease-out 3.53s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #針-s[i]) -->
<path id="針-s1"  class="stroke" stroke="#bf0909" d="M34.75,14.24C34.75,15.58,34.68,16.79,34.26,18.08C32.11,24.639999999999997,22.18,41.14,13.969999999999999,48.629999999999995"/>
<path id="針-s2"  class="stroke" stroke="#bf7609" d="M36.64,20.46C42.5,22.75,47.25,26.25,51.75,30.75"/>
<path id="針-s3"  class="stroke" stroke="#9abf09" d="M26,42.5C27.5,42.5,28.19,42.65,28.67,42.56C33.5,41.63,38.75,40.5,42.11,39.81C42.83,39.660000000000004,43.01,39.760000000000005,44.26,39.760000000000005"/>
<path id="針-s4"  class="stroke" stroke="#2dbf09" d="M15.59,56.81C17.75,57.25,20.13,57.1,21.75,56.85C28.48,55.78,40.3,53.07,47.79,51.33C48.9,51.07,49.879999999999995,51.129999999999995,51.28,51.23"/>
<path id="針-s5"  class="stroke" stroke="#09bf52" d="M34.45,43.94C35.38,44.87,35.940000000000005,46.12,35.940000000000005,47.33C35.940000000000005,51.68,36.00000000000001,74.75,36.00000000000001,81.56"/>
<path id="針-s6"  class="stroke" stroke="#09bfbf" d="M18,67.5C22.6,71.04,24.85,74.88,25.79,76.95"/>
<path id="針-s7"  class="stroke" stroke="#0952bf" d="M50.09,60.05C50.25,60.75,50.13,61.75,49.78,62.419999999999995C48.620000000000005,64.63,46.75,67.75,41.67,73.28"/>
<path id="針-s8"  class="stroke" stroke="#2d09bf" d="M14.5,90.25C15.5,91,16.92,90.93,18,90.5C19.25,90,39.25,80.75,52.25,74.75"/>
<path id="針-s9"  class="stroke" stroke="#9a09bf" d="M56.44,46.72C58.349999999999994,47.55,61.349999999999994,47.3,63.36,47.06C72.56,45.96,85.83,43.6,93.88,42.24C95.47999999999999,41.97,96.91,42.04,98.50999999999999,42.230000000000004"/>
<path id="針-s10"  class="stroke" stroke="#bf0976" d="M75.12,12.75C76.06,13.69,76.58,15.129999999999999,76.58,16.5C76.58,17.22,76.6,72.18,76.61,91.62C76.61,94.9,76.61,97.17,76.61,98"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="針-bg1"  class="badge-group"><circle cx="34.75" cy="10.74" r="3.5" fill="#bf0909"/><text class="num-single" x="34.75" y="10.74" dx="0" dy="-0.5">1</text></g>
<g id="針-bg2"  class="badge-group"><circle cx="36.64" cy="23.96" r="3.5" fill="#bf7609"/><text class="num-single" x="36.64" y="23.96" dx="0" dy="-0.5">2</text></g>
<g id="針-bg3"  class="badge-group"><circle cx="26" cy="42.5" r="3.5" fill="#9abf09"/><text class="num-single" x="26" y="42.5" dx="0" dy="-0.5">3</text></g>
<g id="針-bg4"  class="badge-group"><circle cx="15.59" cy="56.81" r="3.5" fill="#2dbf09"/><text class="num-single" x="15.59" y="56.81" dx="0" dy="-0.5">4</text></g>
<g id="針-bg5"  class="badge-group"><circle cx="34.45" cy="43.94" r="3.5" fill="#09bf52"/><text class="num-single" x="34.45" y="43.94" dx="0" dy="-0.5">5</text></g>
<g id="針-bg6"  class="badge-group"><circle cx="18" cy="67.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="18" y="67.5" dx="0" dy="-0.5">6</text></g>
<g id="針-bg7"  class="badge-group"><circle cx="50.09" cy="60.05" r="3.5" fill="#0952bf"/><text class="num-single" x="50.09" y="60.05" dx="0" dy="-0.5">7</text></g>
<g id="針-bg8"  class="badge-group"><circle cx="14.5" cy="90.25" r="3.5" fill="#2d09bf"/><text class="num-single" x="14.5" y="90.25" dx="0" dy="-0.5">8</text></g>
<g id="針-bg9"  class="badge-group"><circle cx="56.44" cy="46.72" r="3.5" fill="#9a09bf"/><text class="num-single" x="56.44" y="46.72" dx="0" dy="-0.5">9</text></g>
<g id="針-bg10" class="badge-group"><circle cx="75.12" cy="12.75" r="3.5" fill="#bf0976"/><text class="num-double" x="75.12" y="12.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>