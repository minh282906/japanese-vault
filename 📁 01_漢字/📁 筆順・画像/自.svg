<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (自)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #自-bg[i]: Thời gian quả bóng số nảy lên
   - #自-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#自-bg1  { animation-delay: 0.05s; }
#自-s1   { stroke-dasharray: 19.4486; stroke-dashoffset: 19.4486; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#自-bg2  { animation-delay: 0.42s; }
#自-s2   { stroke-dasharray: 64.7999; stroke-dashoffset: 64.7999; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#自-bg3  { animation-delay: 0.93s; }
#自-s3   { stroke-dasharray: 114.9720; stroke-dashoffset: 114.9720; animation: drawStroke 0.55s ease-out 1.06s forwards; }
#自-bg4  { animation-delay: 1.63s; }
#自-s4   { stroke-dasharray: 47.9443; stroke-dashoffset: 47.9443; animation: drawStroke 0.26s ease-out 1.76s forwards; }
#自-bg5  { animation-delay: 2.04s; }
#自-s5   { stroke-dasharray: 47.7889; stroke-dashoffset: 47.7889; animation: drawStroke 0.26s ease-out 2.17s forwards; }
#自-bg6  { animation-delay: 2.45s; }
#自-s6   { stroke-dasharray: 47.5633; stroke-dashoffset: 47.5633; animation: drawStroke 0.26s ease-out 2.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #自-s[i]) -->
<path id="自-s1"  class="stroke" stroke="#bf0909" d="M50.44,12.42C50.75,13.84,50.78,14.55,50.199999999999996,16.32C48.74999999999999,20.75,46.74999999999999,23.87,42.63999999999999,29.75"/>
<path id="自-s2"  class="stroke" stroke="#bfbf09" d="M27.5,31.73C28.3,33.160000000000004,28.98,34.72,28.98,36.62C28.98,38.519999999999996,28.69,90.44,28.69,91.4C28.69,92.35000000000001,28.73,94.25,28.73,96.25"/>
<path id="自-s3"  class="stroke" stroke="#09bf09" d="M29.77,33.17C41.379999999999995,31.880000000000003,67.75,29.130000000000003,73.12,28.5C77.97,27.93,79.5,29.5,79.5,33.09C79.5,35.13,78.81,66.7,78.68,88.25C78.67,90.65,78.66000000000001,92.93,78.66000000000001,95.03"/>
<path id="自-s4"  class="stroke" stroke="#09bfbf" d="M30.23,51.23C41.370000000000005,50.129999999999995,67.5,47.75,78.02,47.459999999999994"/>
<path id="自-s5"  class="stroke" stroke="#0909bf" d="M30.11,70.17C44.5,68.75,62,67.25,77.74,66.31"/>
<path id="自-s6"  class="stroke" stroke="#bf09bf" d="M29.79,91.57C42.379999999999995,90.88,64.63,89.25,77.25,88.44"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="自-bg1"  class="badge-group"><circle cx="50.44" cy="12.42" r="3.5" fill="#bf0909"/><text class="num-single" x="50.44" y="12.42" dx="0" dy="-0.5">1</text></g>
<g id="自-bg2"  class="badge-group"><circle cx="27.5" cy="28.23" r="3.5" fill="#bfbf09"/><text class="num-single" x="27.5" y="28.23" dx="0" dy="-0.5">2</text></g>
<g id="自-bg3"  class="badge-group"><circle cx="29.77" cy="36.67" r="3.5" fill="#09bf09"/><text class="num-single" x="29.77" y="36.67" dx="0" dy="-0.5">3</text></g>
<g id="自-bg4"  class="badge-group"><circle cx="30.23" cy="51.23" r="3.5" fill="#09bfbf"/><text class="num-single" x="30.23" y="51.23" dx="0" dy="-0.5">4</text></g>
<g id="自-bg5"  class="badge-group"><circle cx="30.11" cy="70.17" r="3.5" fill="#0909bf"/><text class="num-single" x="30.11" y="70.17" dx="0" dy="-0.5">5</text></g>
<g id="自-bg6"  class="badge-group"><circle cx="29.79" cy="91.57" r="3.5" fill="#bf09bf"/><text class="num-single" x="29.79" y="91.57" dx="0" dy="-0.5">6</text></g>
</svg>