<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (練)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #練-bg[i]: Thời gian quả bóng số nảy lên
   - #練-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#練-bg1  { animation-delay: 0.05s; }
#練-s1   { stroke-dasharray: 38.5803; stroke-dashoffset: 38.5803; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#練-bg2  { animation-delay: 0.42s; }
#練-s2   { stroke-dasharray: 65.6276; stroke-dashoffset: 65.6276; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#練-bg3  { animation-delay: 0.93s; }
#練-s3   { stroke-dasharray: 14.3471; stroke-dashoffset: 14.3471; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#練-bg4  { animation-delay: 1.30s; }
#練-s4   { stroke-dasharray: 36.6592; stroke-dashoffset: 36.6592; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#練-bg5  { animation-delay: 1.67s; }
#練-s5   { stroke-dasharray: 19.1718; stroke-dashoffset: 19.1718; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#練-bg6  { animation-delay: 2.04s; }
#練-s6   { stroke-dasharray: 13.0869; stroke-dashoffset: 13.0869; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#練-bg7  { animation-delay: 2.41s; }
#練-s7   { stroke-dasharray: 41.7355; stroke-dashoffset: 41.7355; animation: drawStroke 0.23s ease-out 2.54s forwards; }
#練-bg8  { animation-delay: 2.79s; }
#練-s8   { stroke-dasharray: 26.3124; stroke-dashoffset: 26.3124; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#練-bg9  { animation-delay: 3.16s; }
#練-s9   { stroke-dasharray: 65.0460; stroke-dashoffset: 65.0460; animation: drawStroke 0.36s ease-out 3.29s forwards; }
#練-bg10  { animation-delay: 3.67s; }
#練-s10   { stroke-dasharray: 36.5344; stroke-dashoffset: 36.5344; animation: drawStroke 0.22s ease-out 3.80s forwards; }
#練-bg11  { animation-delay: 4.04s; }
#練-s11   { stroke-dasharray: 32.4434; stroke-dashoffset: 32.4434; animation: drawStroke 0.22s ease-out 4.17s forwards; }
#練-bg12  { animation-delay: 4.41s; }
#練-s12   { stroke-dasharray: 87.0343; stroke-dashoffset: 87.0343; animation: drawStroke 0.48s ease-out 4.54s forwards; }
#練-bg13  { animation-delay: 5.04s; }
#練-s13   { stroke-dasharray: 40.2652; stroke-dashoffset: 40.2652; animation: drawStroke 0.22s ease-out 5.17s forwards; }
#練-bg14  { animation-delay: 5.41s; }
#練-s14   { stroke-dasharray: 40.5189; stroke-dashoffset: 40.5189; animation: drawStroke 0.22s ease-out 5.54s forwards; }
]]>
</style>

