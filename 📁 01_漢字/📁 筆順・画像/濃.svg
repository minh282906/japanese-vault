<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (濃)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #濃-bg[i]: Thời gian quả bóng số nảy lên
   - #濃-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#濃-bg1  { animation-delay: 0.05s; }
#濃-s1   { stroke-dasharray: 13.7779; stroke-dashoffset: 13.7779; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#濃-bg2  { animation-delay: 0.42s; }
#濃-s2   { stroke-dasharray: 12.8690; stroke-dashoffset: 12.8690; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#濃-bg3  { animation-delay: 0.79s; }
#濃-s3   { stroke-dasharray: 28.4938; stroke-dashoffset: 28.4938; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#濃-bg4  { animation-delay: 1.16s; }
#濃-s4   { stroke-dasharray: 21.1445; stroke-dashoffset: 21.1445; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#濃-bg5  { animation-delay: 1.53s; }
#濃-s5   { stroke-dasharray: 61.4419; stroke-dashoffset: 61.4419; animation: drawStroke 0.34s ease-out 1.66s forwards; }
#濃-bg6  { animation-delay: 2.02s; }
#濃-s6   { stroke-dasharray: 27.4357; stroke-dashoffset: 27.4357; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#濃-bg7  { animation-delay: 2.39s; }
#濃-s7   { stroke-dasharray: 27.0910; stroke-dashoffset: 27.0910; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#濃-bg8  { animation-delay: 2.76s; }
#濃-s8   { stroke-dasharray: 36.6174; stroke-dashoffset: 36.6174; animation: drawStroke 0.22s ease-out 2.89s forwards; }
#濃-bg9  { animation-delay: 3.13s; }
#濃-s9   { stroke-dasharray: 31.5923; stroke-dashoffset: 31.5923; animation: drawStroke 0.22s ease-out 3.26s forwards; }
#濃-bg10  { animation-delay: 3.50s; }
#濃-s10   { stroke-dasharray: 42.7908; stroke-dashoffset: 42.7908; animation: drawStroke 0.24s ease-out 3.63s forwards; }
#濃-bg11  { animation-delay: 3.89s; }
#濃-s11   { stroke-dasharray: 47.1231; stroke-dashoffset: 47.1231; animation: drawStroke 0.26s ease-out 4.02s forwards; }
#濃-bg12  { animation-delay: 4.30s; }
#濃-s12   { stroke-dasharray: 25.4734; stroke-dashoffset: 25.4734; animation: drawStroke 0.22s ease-out 4.43s forwards; }
#濃-bg13  { animation-delay: 4.67s; }
#濃-s13   { stroke-dasharray: 42.1845; stroke-dashoffset: 42.1845; animation: drawStroke 0.23s ease-out 4.80s forwards; }
#濃-bg14  { animation-delay: 5.05s; }
#濃-s14   { stroke-dasharray: 40.7521; stroke-dashoffset: 40.7521; animation: drawStroke 0.22s ease-out 5.18s forwards; }
#濃-bg15  { animation-delay: 5.42s; }
#濃-s15   { stroke-dasharray: 9.8321; stroke-dashoffset: 9.8321; animation: drawStroke 0.22s ease-out 5.55s forwards; }
#濃-bg16  { animation-delay: 5.79s; }
#濃-s16   { stroke-dasharray: 36.4342; stroke-dashoffset: 36.4342; animation: drawStroke 0.22s ease-out 5.92s forwards; }
]]>
</style>

