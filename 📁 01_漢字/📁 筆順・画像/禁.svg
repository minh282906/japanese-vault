<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (禁)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #禁-bg[i]: Thời gian quả bóng số nảy lên
   - #禁-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#禁-bg1  { animation-delay: 0.05s; }
#禁-s1   { stroke-dasharray: 29.6859; stroke-dashoffset: 29.6859; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#禁-bg2  { animation-delay: 0.42s; }
#禁-s2   { stroke-dasharray: 36.5533; stroke-dashoffset: 36.5533; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#禁-bg3  { animation-delay: 0.79s; }
#禁-s3   { stroke-dasharray: 28.5160; stroke-dashoffset: 28.5160; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#禁-bg4  { animation-delay: 1.16s; }
#禁-s4   { stroke-dasharray: 11.4489; stroke-dashoffset: 11.4489; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#禁-bg5  { animation-delay: 1.53s; }
#禁-s5   { stroke-dasharray: 33.3092; stroke-dashoffset: 33.3092; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#禁-bg6  { animation-delay: 1.90s; }
#禁-s6   { stroke-dasharray: 38.1852; stroke-dashoffset: 38.1852; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#禁-bg7  { animation-delay: 2.27s; }
#禁-s7   { stroke-dasharray: 30.8648; stroke-dashoffset: 30.8648; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#禁-bg8  { animation-delay: 2.64s; }
#禁-s8   { stroke-dasharray: 30.2204; stroke-dashoffset: 30.2204; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#禁-bg9  { animation-delay: 3.01s; }
#禁-s9   { stroke-dasharray: 29.8553; stroke-dashoffset: 29.8553; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#禁-bg10  { animation-delay: 3.38s; }
#禁-s10   { stroke-dasharray: 70.6392; stroke-dashoffset: 70.6392; animation: drawStroke 0.39s ease-out 3.51s forwards; }
#禁-bg11  { animation-delay: 3.92s; }
#禁-s11   { stroke-dasharray: 36.9897; stroke-dashoffset: 36.9897; animation: drawStroke 0.22s ease-out 4.05s forwards; }
#禁-bg12  { animation-delay: 4.29s; }
#禁-s12   { stroke-dasharray: 23.2339; stroke-dashoffset: 23.2339; animation: drawStroke 0.22s ease-out 4.42s forwards; }
#禁-bg13  { animation-delay: 4.66s; }
#禁-s13   { stroke-dasharray: 20.2131; stroke-dashoffset: 20.2131; animation: drawStroke 0.22s ease-out 4.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

