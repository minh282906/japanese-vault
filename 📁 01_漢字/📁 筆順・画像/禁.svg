<path id="禁-s9"  class="stroke" stroke="#0941bf" d="M37.78,55.56C39.620000000000005,56,41.65,55.82,43.5,55.620000000000005C48.85,55.040000000000006,57.17,54.040000000000006,62.379999999999995,53.75000000000001C64.1,53.650000000000006,65.8,53.61000000000001,67.49,53.980000000000004"/>
<path id="禁-s10"  class="stroke" stroke="#2509bf" d="M19.28,68.91C22.5,69.61999999999999,26.66,69.42999999999999,29.990000000000002,69.1C42.49,67.86999999999999,64.66,66.07,79.88,65.44C83.17,65.31,86.46,65.1,89.71,65.72"/>
<path id="禁-s11"  class="stroke" stroke="#7909bf" d="M53.52,69.69C54.540000000000006,70.71,55.03,72.12,55.03,73.89C55.03,81,55.02,88.1,55.02,92.53999999999999C55.02,101.99,51.25,96.92999999999999,47.06,93.75999999999999"/>
<path id="禁-s12"  class="stroke" stroke="#bf09b1" d="M33.27,77.85C33.400000000000006,78.91,33.27,79.94,32.7,80.83999999999999C30,85.12,25,89.75,18.5,94.99"/>
