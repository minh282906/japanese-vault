<path id="鉱-s7"  class="stroke" stroke="#09bf95" d="M44.25,58.84C44.48,59.510000000000005,44.49,60.52,44.25,61.03C43.12,63.49,42.44,65.1,39.84,69.33"/>
<path id="鉱-s8"  class="stroke" stroke="#0995bf" d="M16,86.63C17.1,87.25999999999999,18.61,87.31,19.67,86.85C20.89,86.32,30.67,80.8,43.38,74.49"/>
<path id="鉱-s9"  class="stroke" stroke="#0941bf" d="M72.48,17.32C73.33,18.17,73.99000000000001,19.38,73.99000000000001,20.67C73.99000000000001,21.330000000000002,74.04,29.79,73.95,33.88"/>
<path id="鉱-s10"  class="stroke" stroke="#2509bf" d="M55.43,36.96C57.37,37.5,59.92,37.33,61.88,37.04C70.93,35.66,81.57000000000001,33.21,89.13,32.519999999999996C91.24,32.33,93.63,32.379999999999995,95.63,32.79"/>
<path id="鉱-s11"  class="stroke" stroke="#7909bf" d="M56.47,37.57C57.33,38.43,57.76,39.92,57.64,41.7C56.5,58.75,53.75,76.25,44.75,90.01"/>
<path id="鉱-s12"  class="stroke" stroke="#bf09b1" d="M77.58,48.63C77.98,49.56,77.78999999999999,52.34,77.34,53.45C72.75,64.87,69.13,73.12,62.440000000000005,85.16C61.010000000000005,87.74,61.61000000000001,89.16,63.730000000000004,88.52C70.5,86.49,80.48,83.11999999999999,90.75,79.99"/>
