<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鉱)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鉱-bg[i]: Thời gian quả bóng số nảy lên
   - #鉱-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鉱-bg1  { animation-delay: 0.05s; }
#鉱-s1   { stroke-dasharray: 38.2399; stroke-dashoffset: 38.2399; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鉱-bg2  { animation-delay: 0.42s; }
#鉱-s2   { stroke-dasharray: 17.4828; stroke-dashoffset: 17.4828; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鉱-bg3  { animation-delay: 0.79s; }
#鉱-s3   { stroke-dasharray: 19.9045; stroke-dashoffset: 19.9045; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#鉱-bg4  { animation-delay: 1.16s; }
#鉱-s4   { stroke-dasharray: 31.0560; stroke-dashoffset: 31.0560; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#鉱-bg5  { animation-delay: 1.53s; }
#鉱-s5   { stroke-dasharray: 35.6494; stroke-dashoffset: 35.6494; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#鉱-bg6  { animation-delay: 1.90s; }
#鉱-s6   { stroke-dasharray: 11.0011; stroke-dashoffset: 11.0011; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#鉱-bg7  { animation-delay: 2.27s; }
#鉱-s7   { stroke-dasharray: 11.6382; stroke-dashoffset: 11.6382; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#鉱-bg8  { animation-delay: 2.64s; }
#鉱-s8   { stroke-dasharray: 30.5388; stroke-dashoffset: 30.5388; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#鉱-bg9  { animation-delay: 3.01s; }
#鉱-s9   { stroke-dasharray: 16.9787; stroke-dashoffset: 16.9787; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#鉱-bg10  { animation-delay: 3.38s; }
#鉱-s10   { stroke-dasharray: 40.6496; stroke-dashoffset: 40.6496; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#鉱-bg11  { animation-delay: 3.75s; }
#鉱-s11   { stroke-dasharray: 54.9729; stroke-dashoffset: 54.9729; animation: drawStroke 0.30s ease-out 3.88s forwards; }
#鉱-bg12  { animation-delay: 4.20s; }
#鉱-s12   { stroke-dasharray: 73.5863; stroke-dashoffset: 73.5863; animation: drawStroke 0.40s ease-out 4.33s forwards; }
#鉱-bg13  { animation-delay: 4.75s; }
#鉱-s13   { stroke-dasharray: 24.2654; stroke-dashoffset: 24.2654; animation: drawStroke 0.22s ease-out 4.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #鉱-s[i]) -->
<path id="鉱-s1"  class="stroke" stroke="#bf0909" d="M32.35,16.75C32.35,17.55,32.4,18.19,32.190000000000005,19.16C31.1,24.17,22.62,39.62,12,48.25"/>
