<path id="置-s9"  class="stroke" stroke="#0941bf" d="M40.8,54.38C44.169999999999995,54.160000000000004,67.61,51.260000000000005,70.71,51.02C73.14,50.830000000000005,74.85,52.13,74.85,54.7C74.85,55.7,74.55,68.32000000000001,74.47,78.63C74.46,80.35,74.45,82.00999999999999,74.45,83.53999999999999"/>
<path id="置-s10"  class="stroke" stroke="#2509bf" d="M40.93,64.05C49,63.25,68.18,60.989999999999995,73.42,60.839999999999996"/>
<path id="置-s11"  class="stroke" stroke="#7909bf" d="M41.2,73.79C50.5,72.75,64.25,71.13000000000001,73.55000000000001,70.69000000000001"/>
<path id="置-s12"  class="stroke" stroke="#bf09b1" d="M41.1,83.9C47.050000000000004,83.37,69.06,80.87,73.35,80.75"/>
<path id="置-s13"  class="stroke" stroke="#bf095d" d="M21.78,64.8C22.77,65.72,23.27,67.33,23.27,69.22999999999999S22.07,91.53999999999999,21.82,93.29999999999998C21.5,95.49999999999999,22.5,96.36999999999998,25.04,96.04999999999998C45.32,93.43999999999998,68.13,92.37999999999998,86.33,92.24999999999999C89.05,92.22999999999999,91.52,92.66999999999999,93.5,93.17999999999999"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="置-bg1"  class="badge-group"><circle cx="24" cy="12.96" r="3.5" fill="#bf0909"/><text class="num-single" x="24" y="12.96" dx="0" dy="-0.5">1</text></g>
