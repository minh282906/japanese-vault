<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (置)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #置-bg[i]: Thời gian quả bóng số nảy lên
   - #置-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#置-bg1  { animation-delay: 0.05s; }
#置-s1   { stroke-dasharray: 19.3224; stroke-dashoffset: 19.3224; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#置-bg2  { animation-delay: 0.42s; }
#置-s2   { stroke-dasharray: 79.2233; stroke-dashoffset: 79.2233; animation: drawStroke 0.44s ease-out 0.55s forwards; }
#置-bg3  { animation-delay: 1.01s; }
#置-s3   { stroke-dasharray: 12.7347; stroke-dashoffset: 12.7347; animation: drawStroke 0.22s ease-out 1.14s forwards; }
#置-bg4  { animation-delay: 1.38s; }
#置-s4   { stroke-dasharray: 13.3910; stroke-dashoffset: 13.3910; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#置-bg5  { animation-delay: 1.75s; }
#置-s5   { stroke-dasharray: 54.2314; stroke-dashoffset: 54.2314; animation: drawStroke 0.30s ease-out 1.88s forwards; }
#置-bg6  { animation-delay: 2.20s; }
#置-s6   { stroke-dasharray: 56.2442; stroke-dashoffset: 56.2442; animation: drawStroke 0.31s ease-out 2.33s forwards; }
#置-bg7  { animation-delay: 2.66s; }
#置-s7   { stroke-dasharray: 17.9422; stroke-dashoffset: 17.9422; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#置-bg8  { animation-delay: 3.03s; }
#置-s8   { stroke-dasharray: 34.0090; stroke-dashoffset: 34.0090; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#置-bg9  { animation-delay: 3.40s; }
#置-s9   { stroke-dasharray: 65.3132; stroke-dashoffset: 65.3132; animation: drawStroke 0.36s ease-out 3.53s forwards; }
#置-bg10  { animation-delay: 3.91s; }
#置-s10   { stroke-dasharray: 32.6515; stroke-dashoffset: 32.6515; animation: drawStroke 0.22s ease-out 4.04s forwards; }
#置-bg11  { animation-delay: 4.28s; }
#置-s11   { stroke-dasharray: 32.5032; stroke-dashoffset: 32.5032; animation: drawStroke 0.22s ease-out 4.41s forwards; }
#置-bg12  { animation-delay: 4.65s; }
#置-s12   { stroke-dasharray: 32.4057; stroke-dashoffset: 32.4057; animation: drawStroke 0.22s ease-out 4.78s forwards; }
#置-bg13  { animation-delay: 5.02s; }
#置-s13   { stroke-dasharray: 102.8890; stroke-dashoffset: 102.8890; animation: drawStroke 0.55s ease-out 5.15s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

