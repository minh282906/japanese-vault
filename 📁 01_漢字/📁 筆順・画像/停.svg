<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (停)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #停-bg[i]: Thời gian quả bóng số nảy lên
   - #停-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#停-bg1  { animation-delay: 0.05s; }
#停-s1   { stroke-dasharray: 46.8797; stroke-dashoffset: 46.8797; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#停-bg2  { animation-delay: 0.46s; }
#停-s2   { stroke-dasharray: 52.2449; stroke-dashoffset: 52.2449; animation: drawStroke 0.29s ease-out 0.59s forwards; }
#停-bg3  { animation-delay: 0.90s; }
#停-s3   { stroke-dasharray: 10.2963; stroke-dashoffset: 10.2963; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#停-bg4  { animation-delay: 1.27s; }
#停-s4   { stroke-dasharray: 46.7934; stroke-dashoffset: 46.7934; animation: drawStroke 0.26s ease-out 1.40s forwards; }
#停-bg5  { animation-delay: 1.68s; }
#停-s5   { stroke-dasharray: 13.2920; stroke-dashoffset: 13.2920; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#停-bg6  { animation-delay: 2.05s; }
#停-s6   { stroke-dasharray: 35.8225; stroke-dashoffset: 35.8225; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#停-bg7  { animation-delay: 2.42s; }
#停-s7   { stroke-dasharray: 22.9059; stroke-dashoffset: 22.9059; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#停-bg8  { animation-delay: 2.79s; }
#停-s8   { stroke-dasharray: 15.1698; stroke-dashoffset: 15.1698; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#停-bg9  { animation-delay: 3.16s; }
#停-s9   { stroke-dasharray: 60.6718; stroke-dashoffset: 60.6718; animation: drawStroke 0.33s ease-out 3.29s forwards; }
#停-bg10  { animation-delay: 3.64s; }
#停-s10   { stroke-dasharray: 36.8925; stroke-dashoffset: 36.8925; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#停-bg11  { animation-delay: 4.01s; }
#停-s11   { stroke-dasharray: 41.0449; stroke-dashoffset: 41.0449; animation: drawStroke 0.23s ease-out 4.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

