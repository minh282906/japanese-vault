<path id="停-s6"  class="stroke" stroke="#09bf8d" d="M54.61,33.43C60.46,32.48,71.25,30.97,76.75,30.21C79.55,29.830000000000002,81.32,30.23,80.37,33.44C79.66000000000001,35.839999999999996,79.05000000000001,37.83,78.24000000000001,40.059999999999995"/>
<path id="停-s7"  class="stroke" stroke="#098dbf" d="M57.14,43.97C61.49,43.269999999999996,70.36,42.21,76.27,41.55C77.67,41.39,78.89999999999999,41.26,79.86999999999999,41.15"/>
<path id="停-s8"  class="stroke" stroke="#092abf" d="M43.12,52.25C43.04,55.91,41.16,64.98,40.5,67.17"/>
<path id="停-s9"  class="stroke" stroke="#4b09bf" d="M44.73,53.99C57.379999999999995,52.38,75.25,50.38,91.22999999999999,48.980000000000004C100.26999999999998,48.190000000000005,94.88,53.63,90.94999999999999,56.580000000000005"/>
<path id="停-s10"  class="stroke" stroke="#ae09bf" d="M49.18,63.74C50.48,64.10000000000001,52.86,64.24000000000001,54.15,64.10000000000001C65.44,62.88000000000001,71.17,61.63000000000001,81.27,60.84000000000001C83.42,60.67000000000001,84.72999999999999,61.01000000000001,85.81,61.19000000000001"/>
<path id="停-s11"  class="stroke" stroke="#bf096c" d="M66.52,64.23C67.39999999999999,65.10000000000001,67.91,66.55,67.91,67.77000000000001C67.91,77.38000000000001,67.78,89.17000000000002,67.78,92.35000000000001C67.78,100.88000000000001,62.3,93.71000000000001,60.22,91.62"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="停-bg1"  class="badge-group"><circle cx="32.75" cy="19" r="3.5" fill="#bf0909"/><text class="num-single" x="32.75" y="19" dx="0" dy="-0.5">1</text></g>
