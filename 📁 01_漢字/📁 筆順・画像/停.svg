<path id="停-s1"  class="stroke" stroke="#bf0909" d="M32.75,19C32.99,21,32.93,22.37,32.17,24.08C27.31,35,21.5,47.25,10.25,59.29"/>
<path id="停-s2"  class="stroke" stroke="#bf6c09" d="M25.13,42C26,43,26.369999999999997,44.96,26.369999999999997,46.230000000000004C26.369999999999997,56.61000000000001,26.359999999999996,75.55000000000001,26.359999999999996,86.87C26.359999999999996,89.89,26.359999999999996,92.36,26.359999999999996,93.99000000000001"/>
