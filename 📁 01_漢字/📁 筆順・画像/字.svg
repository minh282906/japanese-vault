<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (字)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #字-bg[i]: Thời gian quả bóng số nảy lên
   - #字-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#字-bg1  { animation-delay: 0.05s; }
#字-s1   { stroke-dasharray: 13.2118; stroke-dashoffset: 13.2118; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#字-bg2  { animation-delay: 0.42s; }
#字-s2   { stroke-dasharray: 17.5271; stroke-dashoffset: 17.5271; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#字-bg3  { animation-delay: 0.79s; }
#字-s3   { stroke-dasharray: 78.9601; stroke-dashoffset: 78.9601; animation: drawStroke 0.43s ease-out 0.92s forwards; }
#字-bg4  { animation-delay: 1.37s; }
#字-s4   { stroke-dasharray: 59.9582; stroke-dashoffset: 59.9582; animation: drawStroke 0.33s ease-out 1.50s forwards; }
#字-bg5  { animation-delay: 1.85s; }
#字-s5   { stroke-dasharray: 58.3483; stroke-dashoffset: 58.3483; animation: drawStroke 0.32s ease-out 1.98s forwards; }
#字-bg6  { animation-delay: 2.32s; }
#字-s6   { stroke-dasharray: 83.0007; stroke-dashoffset: 83.0007; animation: drawStroke 0.46s ease-out 2.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #字-s[i]) -->
<path id="字-s1"  class="stroke" stroke="#bf0909" d="M52.73,9.5C53.739999999999995,10.51,54.48,11.75,54.48,13.26C54.48,16.79,54.38999999999999,18.990000000000002,54.379999999999995,22.21"/>
<path id="字-s2"  class="stroke" stroke="#bfbf09" d="M21.88,24C21.88,27.37,17.82,38.25,16.259999999999998,40.5"/>
<path id="字-s3"  class="stroke" stroke="#09bf09" d="M24.07,26.66C40.75,24.75,66.25,21.38,87.07,20.88C98.02,20.619999999999997,91.75,26.25,87.58999999999999,29.28"/>
<path id="字-s4"  class="stroke" stroke="#09bfbf" d="M34.91,36.19C37,37.25,39.26,37.69,41.779999999999994,37.449999999999996C46.50999999999999,36.99999999999999,61.769999999999996,34.589999999999996,67.96,33.209999999999994C71.13,32.49999999999999,72.88,33.879999999999995,70.05999999999999,36.91C67.90999999999998,39.22,60.719999999999985,46.37,55.80999999999999,49.64"/>
<path id="字-s5"  class="stroke" stroke="#0909bf" d="M52.71,51.03C58.13,56.25,62,77.87,56.38,94.21000000000001C53.81,101.68,47.88,96.99000000000001,45.800000000000004,95.02000000000001"/>
<path id="字-s6"  class="stroke" stroke="#bf09bf" d="M14.38,63.51C18.26,64.75,23.03,64.35,26.76,63.98C41.94,62.48,69.76,59.059999999999995,86.51,58.56999999999999C89.96000000000001,58.46999999999999,93.64,58.339999999999996,96.88000000000001,59.71999999999999"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="字-bg1"  class="badge-group"><circle cx="52.73" cy="9.5" r="3.5" fill="#bf0909"/><text class="num-single" x="52.73" y="9.5" dx="0" dy="-0.5">1</text></g>
<g id="字-bg2"  class="badge-group"><circle cx="21.88" cy="20.5" r="3.5" fill="#bfbf09"/><text class="num-single" x="21.88" y="20.5" dx="0" dy="-0.5">2</text></g>
<g id="字-bg3"  class="badge-group"><circle cx="24.07" cy="30.16" r="3.5" fill="#09bf09"/><text class="num-single" x="24.07" y="30.16" dx="0" dy="-0.5">3</text></g>
<g id="字-bg4"  class="badge-group"><circle cx="34.91" cy="36.19" r="3.5" fill="#09bfbf"/><text class="num-single" x="34.91" y="36.19" dx="0" dy="-0.5">4</text></g>
<g id="字-bg5"  class="badge-group"><circle cx="52.71" cy="51.03" r="3.5" fill="#0909bf"/><text class="num-single" x="52.71" y="51.03" dx="0" dy="-0.5">5</text></g>
<g id="字-bg6"  class="badge-group"><circle cx="14.38" cy="63.51" r="3.5" fill="#bf09bf"/><text class="num-single" x="14.38" y="63.51" dx="0" dy="-0.5">6</text></g>
</svg>