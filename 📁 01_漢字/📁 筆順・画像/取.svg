<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (取)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #取-bg[i]: Thời gian quả bóng số nảy lên
   - #取-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#取-bg1  { animation-delay: 0.05s; }
#取-s1   { stroke-dasharray: 42.9828; stroke-dashoffset: 42.9828; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#取-bg2  { animation-delay: 0.44s; }
#取-s2   { stroke-dasharray: 51.5710; stroke-dashoffset: 51.5710; animation: drawStroke 0.28s ease-out 0.57s forwards; }
#取-bg3  { animation-delay: 0.87s; }
#取-s3   { stroke-dasharray: 19.2976; stroke-dashoffset: 19.2976; animation: drawStroke 0.22s ease-out 1.00s forwards; }
#取-bg4  { animation-delay: 1.24s; }
#取-s4   { stroke-dasharray: 19.8401; stroke-dashoffset: 19.8401; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#取-bg5  { animation-delay: 1.61s; }
#取-s5   { stroke-dasharray: 38.5517; stroke-dashoffset: 38.5517; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#取-bg6  { animation-delay: 1.98s; }
#取-s6   { stroke-dasharray: 76.4420; stroke-dashoffset: 76.4420; animation: drawStroke 0.42s ease-out 2.11s forwards; }
#取-bg7  { animation-delay: 2.55s; }
#取-s7   { stroke-dasharray: 97.3693; stroke-dashoffset: 97.3693; animation: drawStroke 0.54s ease-out 2.68s forwards; }
#取-bg8  { animation-delay: 3.24s; }
#取-s8   { stroke-dasharray: 59.4898; stroke-dashoffset: 59.4898; animation: drawStroke 0.33s ease-out 3.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #取-s[i]) -->
<path id="取-s1"  class="stroke" stroke="#bf0909" d="M10.19,19.97C11.459999999999999,20.4,13.79,20.58,15.059999999999999,20.4C23.08,19.25,38.93,17.5,48.42999999999999,16.759999999999998C50.53999999999999,16.589999999999996,51.81999999999999,16.959999999999997,52.879999999999995,17.18"/>
<path id="取-s2"  class="stroke" stroke="#bf9109" d="M19.93,23.07C20.81,23.95,21.21,25.4,21.21,26.79S21.05,69.34,21.05,74.33"/>
<path id="取-s3"  class="stroke" stroke="#64bf09" d="M22.55,37.73C31.75,36,33.5,35.75,41.629999999999995,34.9"/>
<path id="取-s4"  class="stroke" stroke="#09bf36" d="M22.24,54.2C29.75,53,32.75,52.5,41.91,51.650000000000006"/>
<path id="取-s5"  class="stroke" stroke="#09bfbf" d="M10.7,77.55C12,78.25,13.25,78.13,14.69,77.66C21.759999999999998,75.36,41.35,68.84,47.379999999999995,66.84"/>
<path id="取-s6"  class="stroke" stroke="#0936bf" d="M41.25,20.5C42.31,21.56,42.85,22.71,42.85,24.1C42.85,25.3,42.97,69.87,43,89.37C43,92.47,43.01,94.94,43.01,96.49000000000001"/>
<path id="取-s7"  class="stroke" stroke="#6409bf" d="M55.48,35.58C56.79,35.94,58.18,36.08,60.83,35.69C65.63,35,79.52,31.06,81.35,30.61C83.86999999999999,30,85.61999999999999,31.75,84.80999999999999,34.62C77.95,58.81,67.62,76,49.5,86"/>
<path id="取-s8"  class="stroke" stroke="#bf0991" d="M52.19,45.05C56.47,45.72,73.11,68.25,87.47,80.91C89.67,82.85,91.87,84.75,94.87,86"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="取-bg1"  class="badge-group"><circle cx="10.19" cy="19.97" r="3.5" fill="#bf0909"/><text class="num-single" x="10.19" y="19.97" dx="0" dy="-0.5">1</text></g>
<g id="取-bg2"  class="badge-group"><circle cx="19.93" cy="23.07" r="3.5" fill="#bf9109"/><text class="num-single" x="19.93" y="23.07" dx="0" dy="-0.5">2</text></g>
<g id="取-bg3"  class="badge-group"><circle cx="22.55" cy="37.73" r="3.5" fill="#64bf09"/><text class="num-single" x="22.55" y="37.73" dx="0" dy="-0.5">3</text></g>
<g id="取-bg4"  class="badge-group"><circle cx="22.24" cy="54.2" r="3.5" fill="#09bf36"/><text class="num-single" x="22.24" y="54.2" dx="0" dy="-0.5">4</text></g>
<g id="取-bg5"  class="badge-group"><circle cx="10.7" cy="77.55" r="3.5" fill="#09bfbf"/><text class="num-single" x="10.7" y="77.55" dx="0" dy="-0.5">5</text></g>
<g id="取-bg6"  class="badge-group"><circle cx="41.25" cy="20.5" r="3.5" fill="#0936bf"/><text class="num-single" x="41.25" y="20.5" dx="0" dy="-0.5">6</text></g>
<g id="取-bg7"  class="badge-group"><circle cx="55.48" cy="35.58" r="3.5" fill="#6409bf"/><text class="num-single" x="55.48" y="35.58" dx="0" dy="-0.5">7</text></g>
<g id="取-bg8"  class="badge-group"><circle cx="52.19" cy="45.05" r="3.5" fill="#bf0991"/><text class="num-single" x="52.19" y="45.05" dx="0" dy="-0.5">8</text></g>
</svg>