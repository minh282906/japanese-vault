<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (渡)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #渡-bg[i]: Thời gian quả bóng số nảy lên
   - #渡-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#渡-bg1  { animation-delay: 0.05s; }
#渡-s1   { stroke-dasharray: 14.2458; stroke-dashoffset: 14.2458; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#渡-bg2  { animation-delay: 0.42s; }
#渡-s2   { stroke-dasharray: 14.3644; stroke-dashoffset: 14.3644; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#渡-bg3  { animation-delay: 0.79s; }
#渡-s3   { stroke-dasharray: 23.9512; stroke-dashoffset: 23.9512; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#渡-bg4  { animation-delay: 1.16s; }
#渡-s4   { stroke-dasharray: 12.1134; stroke-dashoffset: 12.1134; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#渡-bg5  { animation-delay: 1.53s; }
#渡-s5   { stroke-dasharray: 52.6998; stroke-dashoffset: 52.6998; animation: drawStroke 0.29s ease-out 1.66s forwards; }
#渡-bg6  { animation-delay: 1.97s; }
#渡-s6   { stroke-dasharray: 70.2928; stroke-dashoffset: 70.2928; animation: drawStroke 0.39s ease-out 2.10s forwards; }
#渡-bg7  { animation-delay: 2.51s; }
#渡-s7   { stroke-dasharray: 45.3239; stroke-dashoffset: 45.3239; animation: drawStroke 0.25s ease-out 2.64s forwards; }
#渡-bg8  { animation-delay: 2.91s; }
#渡-s8   { stroke-dasharray: 22.5766; stroke-dashoffset: 22.5766; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#渡-bg9  { animation-delay: 3.28s; }
#渡-s9   { stroke-dasharray: 20.9685; stroke-dashoffset: 20.9685; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#渡-bg10  { animation-delay: 3.65s; }
#渡-s10   { stroke-dasharray: 16.9535; stroke-dashoffset: 16.9535; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#渡-bg11  { animation-delay: 4.02s; }
#渡-s11   { stroke-dasharray: 87.4758; stroke-dashoffset: 87.4758; animation: drawStroke 0.48s ease-out 4.15s forwards; }
#渡-bg12  { animation-delay: 4.65s; }
#渡-s12   { stroke-dasharray: 48.5967; stroke-dashoffset: 48.5967; animation: drawStroke 0.27s ease-out 4.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #渡-s[i]) -->
<path id="渡-s1"  class="stroke" stroke="#bf0909" d="M18.88,16.5C22.799999999999997,18.02,29.009999999999998,22.73,30,25.09"/>
