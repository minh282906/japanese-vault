<path id="渡-s6"  class="stroke" stroke="#09bf64" d="M42.22,28.25C43.3,29.33,43.49,30.73,43.4,32.95C42.65,50.06,40.5,78,25.71,94.53"/>
<path id="渡-s7"  class="stroke" stroke="#09bfbf" d="M45.96,41.11C48.370000000000005,41.75,50.65,41.31,52.88,41.089999999999996C61.290000000000006,40.26,80.96000000000001,37.989999999999995,86.85,37.779999999999994C88.83999999999999,37.709999999999994,90.03999999999999,37.98,91.03999999999999,38.199999999999996"/>
<path id="渡-s8"  class="stroke" stroke="#0964bf" d="M56.39,32.82C57.160000000000004,33.59,57.660000000000004,34.62,57.660000000000004,35.63C57.660000000000004,36.25,58.220000000000006,43.300000000000004,58.68000000000001,49.75C58.82000000000001,51.7,58.970000000000006,53.53,59.11000000000001,54.99"/>
<path id="渡-s9"  class="stroke" stroke="#0909bf" d="M76.03,29.26C76.89,30.12,77.15,31.51,77.05,32.32C76.63,35.76,76.13,42.38,75.05,49.85"/>
<path id="渡-s10"  class="stroke" stroke="#6409bf" d="M60.12,52.63C64.83,51.830000000000005,68.37,51.45,72.78,51.080000000000005C74.16,50.970000000000006,75.55,50.85000000000001,76.96000000000001,50.730000000000004"/>
<path id="渡-s11"  class="stroke" stroke="#bf09bf" d="M51.32,63.48C52.75,63.73,52.92,64.1,55.77,63.73C58.620000000000005,63.36,77,60.199999999999996,78.96000000000001,59.83C80.92,59.46,82.39000000000001,61.22,81.63000000000001,62.55C72.45000000000002,78.66,56.750000000000014,90.25,40.09000000000001,96.5"/>
<path id="渡-s12"  class="stroke" stroke="#bf0964" d="M52.53,69.38C58.05,69.49,72.38,82.88,85.57,91.47999999999999C87.78999999999999,92.92999999999999,90.38,94.50999999999999,93.16,95.54999999999998"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="渡-bg1"  class="badge-group"><circle cx="18.88" cy="16.5" r="3.5" fill="#bf0909"/><text class="num-single" x="18.88" y="16.5" dx="0" dy="-0.5">1</text></g>
