<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (度)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #度-bg[i]: Thời gian quả bóng số nảy lên
   - #度-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#度-bg1  { animation-delay: 0.05s; }
#度-s1   { stroke-dasharray: 12.3003; stroke-dashoffset: 12.3003; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#度-bg2  { animation-delay: 0.42s; }
#度-s2   { stroke-dasharray: 67.7537; stroke-dashoffset: 67.7537; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#度-bg3  { animation-delay: 0.94s; }
#度-s3   { stroke-dasharray: 72.1877; stroke-dashoffset: 72.1877; animation: drawStroke 0.40s ease-out 1.07s forwards; }
#度-bg4  { animation-delay: 1.49s; }
#度-s4   { stroke-dasharray: 57.5063; stroke-dashoffset: 57.5063; animation: drawStroke 0.32s ease-out 1.62s forwards; }
#度-bg5  { animation-delay: 1.96s; }
#度-s5   { stroke-dasharray: 24.8865; stroke-dashoffset: 24.8865; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#度-bg6  { animation-delay: 2.33s; }
#度-s6   { stroke-dasharray: 21.7113; stroke-dashoffset: 21.7113; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#度-bg7  { animation-delay: 2.70s; }
#度-s7   { stroke-dasharray: 20.3269; stroke-dashoffset: 20.3269; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#度-bg8  { animation-delay: 3.07s; }
#度-s8   { stroke-dasharray: 90.2521; stroke-dashoffset: 90.2521; animation: drawStroke 0.50s ease-out 3.20s forwards; }
#度-bg9  { animation-delay: 3.72s; }
#度-s9   { stroke-dasharray: 56.4433; stroke-dashoffset: 56.4433; animation: drawStroke 0.31s ease-out 3.85s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #度-s[i]) -->
<path id="度-s1"  class="stroke" stroke="#bf0909" d="M54.81,11.63C55.78,12.600000000000001,56.32,13.620000000000001,56.32,14.780000000000001C56.32,16.490000000000002,56.25,20.240000000000002,56.25,23.490000000000002"/>
<path id="度-s2"  class="stroke" stroke="#bf8209" d="M21.63,26.73C24.38,27.13,27.439999999999998,26.94,29.49,26.77C44.879999999999995,25.5,67.38,23.13,81.96,22.04C85.36,21.79,87.42999999999999,22.05,89.13,22.32"/>
<path id="度-s3"  class="stroke" stroke="#82bf09" d="M26.24,27.75C27.119999999999997,28.63,27.43,29.75,27.4,31.38C26.869999999999997,61.12,21.869999999999997,81.5,10.799999999999997,96.47"/>
<path id="度-s4"  class="stroke" stroke="#09bf09" d="M33,41.46C35.62,42,38.58,41.68,41.25,41.45C50.84,40.61,74.22,37.96,83.25,37.36C85.63,37.2,87.91,37.26,90.25,37.69"/>
<path id="度-s5"  class="stroke" stroke="#09bf82" d="M46.35,31.39C47.38,32.25,47.940000000000005,33.68,48,34.52C48.21,37.470000000000006,48.7,45.620000000000005,49.07,52.370000000000005C49.14,53.56,49.2,54.7,49.26,55.75000000000001"/>
<path id="度-s6"  class="stroke" stroke="#0982bf" d="M69.71,29.25C70.47999999999999,30.02,71.02,31.3,70.86,32.13C70.13,36,69.25,42.75,68.23,50.45"/>
<path id="度-s7"  class="stroke" stroke="#0909bf" d="M50.26,53.33C56.69,52.66,60.18,52.29,66.88,51.68C67.99,51.58,69.17999999999999,51.47,70.49,51.35"/>
<path id="度-s8"  class="stroke" stroke="#8209bf" d="M42.11,64.16C44,64.63,45.31,64.57,48.33,64.17C51.35,63.77,65.62,60.27,67.66,59.7C70.63,58.870000000000005,72.13,60.75,70.74,62.85C59.9,79.33,44.38,92.88,26.68,98.75"/>
<path id="度-s9"  class="stroke" stroke="#bf0982" d="M40.91,69.78C47.47,69.98,65.17999999999999,86.18,80.3,94.13C83.19,95.64999999999999,86.25,97.19999999999999,89.5,97.74"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="度-bg1"  class="badge-group"><circle cx="54.81" cy="11.63" r="3.5" fill="#bf0909"/><text class="num-single" x="54.81" y="11.63" dx="0" dy="-0.5">1</text></g>
<g id="度-bg2"  class="badge-group"><circle cx="21.63" cy="23.23" r="3.5" fill="#bf8209"/><text class="num-single" x="21.63" y="23.23" dx="0" dy="-0.5">2</text></g>
<g id="度-bg3"  class="badge-group"><circle cx="26.24" cy="31.25" r="3.5" fill="#82bf09"/><text class="num-single" x="26.24" y="31.25" dx="0" dy="-0.5">3</text></g>
<g id="度-bg4"  class="badge-group"><circle cx="33" cy="41.46" r="3.5" fill="#09bf09"/><text class="num-single" x="33" y="41.46" dx="0" dy="-0.5">4</text></g>
<g id="度-bg5"  class="badge-group"><circle cx="46.35" cy="31.39" r="3.5" fill="#09bf82"/><text class="num-single" x="46.35" y="31.39" dx="0" dy="-0.5">5</text></g>
<g id="度-bg6"  class="badge-group"><circle cx="69.71" cy="29.25" r="3.5" fill="#0982bf"/><text class="num-single" x="69.71" y="29.25" dx="0" dy="-0.5">6</text></g>
<g id="度-bg7"  class="badge-group"><circle cx="50.26" cy="53.33" r="3.5" fill="#0909bf"/><text class="num-single" x="50.26" y="53.33" dx="0" dy="-0.5">7</text></g>
<g id="度-bg8"  class="badge-group"><circle cx="42.11" cy="60.66" r="3.5" fill="#8209bf"/><text class="num-single" x="42.11" y="60.66" dx="0" dy="-0.5">8</text></g>
<g id="度-bg9"  class="badge-group"><circle cx="40.91" cy="73.28" r="3.5" fill="#bf0982"/><text class="num-single" x="40.91" y="73.28" dx="0" dy="-0.5">9</text></g>
</svg>