<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (場)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #場-bg[i]: Thời gian quả bóng số nảy lên
   - #場-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#場-bg1  { animation-delay: 0.05s; }
#場-s1   { stroke-dasharray: 26.2724; stroke-dashoffset: 26.2724; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#場-bg2  { animation-delay: 0.42s; }
#場-s2   { stroke-dasharray: 43.0348; stroke-dashoffset: 43.0348; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#場-bg3  { animation-delay: 0.81s; }
#場-s3   { stroke-dasharray: 30.2849; stroke-dashoffset: 30.2849; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#場-bg4  { animation-delay: 1.18s; }
#場-s4   { stroke-dasharray: 26.4960; stroke-dashoffset: 26.4960; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#場-bg5  { animation-delay: 1.55s; }
#場-s5   { stroke-dasharray: 52.1475; stroke-dashoffset: 52.1475; animation: drawStroke 0.29s ease-out 1.68s forwards; }
#場-bg6  { animation-delay: 1.99s; }
#場-s6   { stroke-dasharray: 25.5037; stroke-dashoffset: 25.5037; animation: drawStroke 0.22s ease-out 2.12s forwards; }
#場-bg7  { animation-delay: 2.36s; }
#場-s7   { stroke-dasharray: 22.6634; stroke-dashoffset: 22.6634; animation: drawStroke 0.22s ease-out 2.49s forwards; }
#場-bg8  { animation-delay: 2.73s; }
#場-s8   { stroke-dasharray: 52.5562; stroke-dashoffset: 52.5562; animation: drawStroke 0.29s ease-out 2.86s forwards; }
#場-bg9  { animation-delay: 3.17s; }
#場-s9   { stroke-dasharray: 25.0065; stroke-dashoffset: 25.0065; animation: drawStroke 0.22s ease-out 3.30s forwards; }
#場-bg10  { animation-delay: 3.54s; }
#場-s10   { stroke-dasharray: 85.0864; stroke-dashoffset: 85.0864; animation: drawStroke 0.47s ease-out 3.67s forwards; }
#場-bg11  { animation-delay: 4.16s; }
#場-s11   { stroke-dasharray: 28.9351; stroke-dashoffset: 28.9351; animation: drawStroke 0.22s ease-out 4.29s forwards; }
#場-bg12  { animation-delay: 4.53s; }
#場-s12   { stroke-dasharray: 44.0012; stroke-dashoffset: 44.0012; animation: drawStroke 0.24s ease-out 4.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

