<path id="場-s9"  class="stroke" stroke="#0909bf" d="M55,50.38C55.11,51.53,54.77,52.63,54.14,53.64C51.09,58.58,45.84,64.07,38.75,68.5"/>
<path id="場-s10"  class="stroke" stroke="#6409bf" d="M54.87,58.05C57,58.379999999999995,58.55,58.129999999999995,60.29,58.01C67.25,57.51,83.62,54.76,87.88,54.269999999999996C91.14999999999999,53.9,92.86,55.31999999999999,92.33,58.559999999999995C91,66.75,86.15,83.96,78.92,92.78C76.75,95.43,75.52,92.34,73.58,90.41"/>
<path id="場-s11"  class="stroke" stroke="#bf09bf" d="M61.75,61.12C61.87,62.12,61.67,62.79,61.24,63.68C58.5,69.34,51.96,77.26,42.75,81.74"/>
<path id="場-s12"  class="stroke" stroke="#bf0964" d="M75.88,59.39C75.97999999999999,60.31,75.83999999999999,61.75,75.42999999999999,63.06C73.04,70.8,63.03,85.12,50,93.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="場-bg1"  class="badge-group"><circle cx="14.75" cy="41.17" r="3.5" fill="#bf0909"/><text class="num-single" x="14.75" y="41.17" dx="0" dy="-0.5">1</text></g>
