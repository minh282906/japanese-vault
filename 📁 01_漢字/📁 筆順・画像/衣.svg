<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (衣)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #衣-bg[i]: Thời gian quả bóng số nảy lên
   - #衣-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#衣-bg1  { animation-delay: 0.05s; }
#衣-s1   { stroke-dasharray: 16.3602; stroke-dashoffset: 16.3602; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#衣-bg2  { animation-delay: 0.42s; }
#衣-s2   { stroke-dasharray: 76.8730; stroke-dashoffset: 76.8730; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#衣-bg3  { animation-delay: 0.99s; }
#衣-s3   { stroke-dasharray: 49.6186; stroke-dashoffset: 49.6186; animation: drawStroke 0.27s ease-out 1.12s forwards; }
#衣-bg4  { animation-delay: 1.41s; }
#衣-s4   { stroke-dasharray: 62.5643; stroke-dashoffset: 62.5643; animation: drawStroke 0.34s ease-out 1.54s forwards; }
#衣-bg5  { animation-delay: 1.90s; }
#衣-s5   { stroke-dasharray: 26.8785; stroke-dashoffset: 26.8785; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#衣-bg6  { animation-delay: 2.27s; }
#衣-s6   { stroke-dasharray: 58.0779; stroke-dashoffset: 58.0779; animation: drawStroke 0.32s ease-out 2.40s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #衣-s[i]) -->
<path id="衣-s1"  class="stroke" stroke="#bf0909" d="M52.11,13.25C53.49,14.629999999999999,54.089999999999996,16.13,54.089999999999996,17.91C54.089999999999996,20.25,53.94,26.5,53.94,29.060000000000002"/>
<path id="衣-s2"  class="stroke" stroke="#bfbf09" d="M13.25,33.11C16.5,33.75,19.06,33.71,22.130000000000003,33.43C37.870000000000005,32.01,63.870000000000005,28.88,80.25,27.58C83.15,27.349999999999998,86.63,27.25,89.75,27.909999999999997"/>
<path id="衣-s3"  class="stroke" stroke="#09bf09" d="M46.72,33.89C46.72,35,46.58,36.14,46.04,37.28C42.56,44.65,30,59,13.81,69.72"/>
<path id="衣-s4"  class="stroke" stroke="#09bfbf" d="M37.5,53.75C38.38,54.63,38.75,55.87,38.75,57.25C38.75,69.07,38.93,88.44,38.93,90.44C38.93,93.25,39.94,93.46,42.24,91.49C46.620000000000005,87.75,55.88,80.1,57.71,78.72999999999999"/>
<path id="衣-s5"  class="stroke" stroke="#0909bf" d="M77,38.89C77.25,40,76.96,40.85,76.25,41.75C72.75,46.13,68.25,50,58.06,56.97"/>
<path id="衣-s6"  class="stroke" stroke="#bf09bf" d="M46.25,50.75C49.98,51.38,71.74,71.81,82.84,79.41C86.13000000000001,81.66,89.14,83.47999999999999,93,84.75"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="衣-bg1"  class="badge-group"><circle cx="52.11" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.11" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="衣-bg2"  class="badge-group"><circle cx="13.25" cy="33.11" r="3.5" fill="#bfbf09"/><text class="num-single" x="13.25" y="33.11" dx="0" dy="-0.5">2</text></g>
<g id="衣-bg3"  class="badge-group"><circle cx="46.72" cy="33.89" r="3.5" fill="#09bf09"/><text class="num-single" x="46.72" y="33.89" dx="0" dy="-0.5">3</text></g>
<g id="衣-bg4"  class="badge-group"><circle cx="37.5" cy="53.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.5" y="53.75" dx="0" dy="-0.5">4</text></g>
<g id="衣-bg5"  class="badge-group"><circle cx="77" cy="38.89" r="3.5" fill="#0909bf"/><text class="num-single" x="77" y="38.89" dx="0" dy="-0.5">5</text></g>
<g id="衣-bg6"  class="badge-group"><circle cx="46.25" cy="50.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="46.25" y="50.75" dx="0" dy="-0.5">6</text></g>
</svg>