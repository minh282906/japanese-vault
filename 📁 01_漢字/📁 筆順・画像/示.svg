<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (示)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #示-bg[i]: Thời gian quả bóng số nảy lên
   - #示-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#示-bg1  { animation-delay: 0.05s; }
#示-s1   { stroke-dasharray: 46.6348; stroke-dashoffset: 46.6348; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#示-bg2  { animation-delay: 0.46s; }
#示-s2   { stroke-dasharray: 72.7610; stroke-dashoffset: 72.7610; animation: drawStroke 0.40s ease-out 0.59s forwards; }
#示-bg3  { animation-delay: 1.01s; }
#示-s3   { stroke-dasharray: 59.4473; stroke-dashoffset: 59.4473; animation: drawStroke 0.33s ease-out 1.14s forwards; }
#示-bg4  { animation-delay: 1.49s; }
#示-s4   { stroke-dasharray: 29.9626; stroke-dashoffset: 29.9626; animation: drawStroke 0.22s ease-out 1.62s forwards; }
#示-bg5  { animation-delay: 1.86s; }
#示-s5   { stroke-dasharray: 22.5191; stroke-dashoffset: 22.5191; animation: drawStroke 0.22s ease-out 1.99s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #示-s[i]) -->
<path id="示-s1"  class="stroke" stroke="#bf0909" d="M29.53,20.89C31.87,21.38,34.2,21.16,36.27,20.98C43.92,20.28,60.78,18.71,68.87,18.25C71.19,18.12,73.71000000000001,17.96,75.99000000000001,18.52"/>
<path id="示-s2"  class="stroke" stroke="#9abf09" d="M17.53,44.97C20.48,46.019999999999996,23.990000000000002,45.65,27.020000000000003,45.36C39.47,44.19,65.75,41.63,81.25,40.84C84.11,40.690000000000005,87.14,40.790000000000006,89.97,41.400000000000006"/>
<path id="示-s3"  class="stroke" stroke="#09bf52" d="M53.52,46.83C54.720000000000006,48.03,55.53,49.62,55.53,51.849999999999994C55.53,66.41,55.52,85.50999999999999,55.52,90.47C55.52,101,51,94.25,46.81,90.72"/>
<path id="示-s4"  class="stroke" stroke="#0952bf" d="M32.26,62.39C32.3,62.99,32.5,63.97,32.169999999999995,64.79C30,70.25,23.62,78.75,15.5,86.5"/>
<path id="示-s5"  class="stroke" stroke="#9a09bf" d="M82.25,63.5C86.41,66.88,93.21000000000001,77,94.25,82.25"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="示-bg1"  class="badge-group"><circle cx="29.53" cy="20.89" r="3.5" fill="#bf0909"/><text class="num-single" x="29.53" y="20.89" dx="0" dy="-0.5">1</text></g>
<g id="示-bg2"  class="badge-group"><circle cx="17.53" cy="44.97" r="3.5" fill="#9abf09"/><text class="num-single" x="17.53" y="44.97" dx="0" dy="-0.5">2</text></g>
<g id="示-bg3"  class="badge-group"><circle cx="53.52" cy="46.83" r="3.5" fill="#09bf52"/><text class="num-single" x="53.52" y="46.83" dx="0" dy="-0.5">3</text></g>
<g id="示-bg4"  class="badge-group"><circle cx="32.26" cy="62.39" r="3.5" fill="#0952bf"/><text class="num-single" x="32.26" y="62.39" dx="0" dy="-0.5">4</text></g>
<g id="示-bg5"  class="badge-group"><circle cx="82.25" cy="63.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="82.25" y="63.5" dx="0" dy="-0.5">5</text></g>
</svg>