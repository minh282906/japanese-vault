<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (勢)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #勢-bg[i]: Thời gian quả bóng số nảy lên
   - #勢-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#勢-bg1  { animation-delay: 0.05s; }
#勢-s1   { stroke-dasharray: 29.2655; stroke-dashoffset: 29.2655; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#勢-bg2  { animation-delay: 0.42s; }
#勢-s2   { stroke-dasharray: 18.2184; stroke-dashoffset: 18.2184; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#勢-bg3  { animation-delay: 0.79s; }
#勢-s3   { stroke-dasharray: 40.7902; stroke-dashoffset: 40.7902; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#勢-bg4  { animation-delay: 1.16s; }
#勢-s4   { stroke-dasharray: 17.9736; stroke-dashoffset: 17.9736; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#勢-bg5  { animation-delay: 1.53s; }
#勢-s5   { stroke-dasharray: 17.7537; stroke-dashoffset: 17.7537; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#勢-bg6  { animation-delay: 1.90s; }
#勢-s6   { stroke-dasharray: 23.1838; stroke-dashoffset: 23.1838; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#勢-bg7  { animation-delay: 2.27s; }
#勢-s7   { stroke-dasharray: 18.2632; stroke-dashoffset: 18.2632; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#勢-bg8  { animation-delay: 2.64s; }
#勢-s8   { stroke-dasharray: 33.3300; stroke-dashoffset: 33.3300; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#勢-bg9  { animation-delay: 3.01s; }
#勢-s9   { stroke-dasharray: 46.8449; stroke-dashoffset: 46.8449; animation: drawStroke 0.26s ease-out 3.14s forwards; }
#勢-bg10  { animation-delay: 3.42s; }
#勢-s10   { stroke-dasharray: 76.8543; stroke-dashoffset: 76.8543; animation: drawStroke 0.42s ease-out 3.55s forwards; }
#勢-bg11  { animation-delay: 3.99s; }
#勢-s11   { stroke-dasharray: 14.4722; stroke-dashoffset: 14.4722; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#勢-bg12  { animation-delay: 4.36s; }
#勢-s12   { stroke-dasharray: 86.7394; stroke-dashoffset: 86.7394; animation: drawStroke 0.48s ease-out 4.49s forwards; }
#勢-bg13  { animation-delay: 4.99s; }
#勢-s13   { stroke-dasharray: 54.3919; stroke-dashoffset: 54.3919; animation: drawStroke 0.30s ease-out 5.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

