<path id="勢-s9"  class="stroke" stroke="#0941bf" d="M68.99,10.62C69.5,11.5,69.6,13.16,69.44999999999999,14.26C66.33999999999999,37.05,62.32999999999999,44.92,53.86999999999999,53.5"/>
<path id="勢-s10"  class="stroke" stroke="#2509bf" d="M57.2,24.92C58.38,25.25,59.970000000000006,25.07,61.160000000000004,24.92C62.35,24.770000000000003,70.62,22.880000000000003,76.54,21.44C79.38000000000001,20.75,80.5,21.5,80.06,24.5C79.68,27.08,78.32000000000001,36.769999999999996,77.56,44.69C76.75,53,79.14,55.1,86.71,55.1C93.63,55.1,95.74,54.26,95.92999999999999,48.18"/>
<path id="勢-s11"  class="stroke" stroke="#7909bf" d="M58.75,35.69C62.48,37.379999999999995,68.38,42.65,69.31,45.28"/>
