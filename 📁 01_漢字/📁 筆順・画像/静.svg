<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (静)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #静-bg[i]: Thời gian quả bóng số nảy lên
   - #静-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#静-bg1  { animation-delay: 0.05s; }
#静-s1   { stroke-dasharray: 31.8197; stroke-dashoffset: 31.8197; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#静-bg2  { animation-delay: 0.42s; }
#静-s2   { stroke-dasharray: 30.8399; stroke-dashoffset: 30.8399; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#静-bg3  { animation-delay: 0.79s; }
#静-s3   { stroke-dasharray: 28.3798; stroke-dashoffset: 28.3798; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#静-bg4  { animation-delay: 1.16s; }
#静-s4   { stroke-dasharray: 40.6225; stroke-dashoffset: 40.6225; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#静-bg5  { animation-delay: 1.53s; }
#静-s5   { stroke-dasharray: 41.3002; stroke-dashoffset: 41.3002; animation: drawStroke 0.23s ease-out 1.66s forwards; }
#静-bg6  { animation-delay: 1.91s; }
#静-s6   { stroke-dasharray: 69.3410; stroke-dashoffset: 69.3410; animation: drawStroke 0.38s ease-out 2.04s forwards; }
#静-bg7  { animation-delay: 2.44s; }
#静-s7   { stroke-dasharray: 19.6992; stroke-dashoffset: 19.6992; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#静-bg8  { animation-delay: 2.81s; }
#静-s8   { stroke-dasharray: 19.4814; stroke-dashoffset: 19.4814; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#静-bg9  { animation-delay: 3.18s; }
#静-s9   { stroke-dasharray: 24.9550; stroke-dashoffset: 24.9550; animation: drawStroke 0.22s ease-out 3.31s forwards; }
#静-bg10  { animation-delay: 3.55s; }
#静-s10   { stroke-dasharray: 39.2713; stroke-dashoffset: 39.2713; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#静-bg11  { animation-delay: 3.92s; }
#静-s11   { stroke-dasharray: 59.2519; stroke-dashoffset: 59.2519; animation: drawStroke 0.33s ease-out 4.05s forwards; }
#静-bg12  { animation-delay: 4.40s; }
#静-s12   { stroke-dasharray: 47.1409; stroke-dashoffset: 47.1409; animation: drawStroke 0.26s ease-out 4.53s forwards; }
#静-bg13  { animation-delay: 4.81s; }
#静-s13   { stroke-dasharray: 34.3495; stroke-dashoffset: 34.3495; animation: drawStroke 0.22s ease-out 4.94s forwards; }
#静-bg14  { animation-delay: 5.18s; }
#静-s14   { stroke-dasharray: 59.5127; stroke-dashoffset: 59.5127; animation: drawStroke 0.33s ease-out 5.31s forwards; }
]]>
</style>

