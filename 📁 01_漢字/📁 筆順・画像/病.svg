<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (病)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #病-bg[i]: Thời gian quả bóng số nảy lên
   - #病-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#病-bg1  { animation-delay: 0.05s; }
#病-s1   { stroke-dasharray: 14.0784; stroke-dashoffset: 14.0784; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#病-bg2  { animation-delay: 0.42s; }
#病-s2   { stroke-dasharray: 64.0122; stroke-dashoffset: 64.0122; animation: drawStroke 0.35s ease-out 0.55s forwards; }
#病-bg3  { animation-delay: 0.92s; }
#病-s3   { stroke-dasharray: 70.6083; stroke-dashoffset: 70.6083; animation: drawStroke 0.39s ease-out 1.05s forwards; }
#病-bg4  { animation-delay: 1.46s; }
#病-s4   { stroke-dasharray: 12.2370; stroke-dashoffset: 12.2370; animation: drawStroke 0.22s ease-out 1.59s forwards; }
#病-bg5  { animation-delay: 1.83s; }
#病-s5   { stroke-dasharray: 20.6729; stroke-dashoffset: 20.6729; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#病-bg6  { animation-delay: 2.20s; }
#病-s6   { stroke-dasharray: 46.4268; stroke-dashoffset: 46.4268; animation: drawStroke 0.26s ease-out 2.33s forwards; }
#病-bg7  { animation-delay: 2.61s; }
#病-s7   { stroke-dasharray: 38.3516; stroke-dashoffset: 38.3516; animation: drawStroke 0.22s ease-out 2.74s forwards; }
#病-bg8  { animation-delay: 2.98s; }
#病-s8   { stroke-dasharray: 93.3519; stroke-dashoffset: 93.3519; animation: drawStroke 0.51s ease-out 3.11s forwards; }
#病-bg9  { animation-delay: 3.64s; }
#病-s9   { stroke-dasharray: 46.0076; stroke-dashoffset: 46.0076; animation: drawStroke 0.25s ease-out 3.77s forwards; }
#病-bg10  { animation-delay: 4.04s; }
#病-s10   { stroke-dasharray: 19.3766; stroke-dashoffset: 19.3766; animation: drawStroke 0.22s ease-out 4.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #病-s[i]) -->
<path id="病-s1"  class="stroke" stroke="#bf0909" d="M57.56,11.13C58.84,12.41,59.32,14.120000000000001,59.32,15.280000000000001C59.32,16.07,59.4,19.93,59.25,24.740000000000002"/>
<path id="病-s2"  class="stroke" stroke="#bf7609" d="M29.13,27.23C32.96,27.87,36.93,27.68,40.769999999999996,27.26C54.379999999999995,25.76,69.88,24.01,82.13,23.41C85.71,23.24,89.36,23.06,92.88,23.82"/>
<path id="病-s3"  class="stroke" stroke="#9abf09" d="M30.99,28C32.059999999999995,29.07,32.47,30.59,32.4,32.88C31.619999999999997,60.870000000000005,31.74,77.62,16.299999999999997,94.47"/>
<path id="病-s4"  class="stroke" stroke="#2dbf09" d="M15,38C17.740000000000002,39.63,22.07,44.71,22.75,47.25"/>
<path id="病-s5"  class="stroke" stroke="#09bf52" d="M10.27,68.03C11.59,68.68,12.95,68.85,13.969999999999999,68.3C18.57,65.82,23.369999999999997,62.51,27.88,58.879999999999995"/>
<path id="病-s6"  class="stroke" stroke="#09bfbf" d="M43,42.4C45.38,42.75,48.46,42.68,50.76,42.43C57.86,41.67,73.1,40,82.12,39.6C84.49000000000001,39.49,86.91000000000001,39.36,89.25,39.870000000000005"/>
<path id="病-s7"  class="stroke" stroke="#0952bf" d="M41.11,60.47C42.07,61.43,42.56,63,42.56,64.36C42.56,68.36,42.660000000000004,84.23,42.71,92.87C42.730000000000004,95.87,42.74,98,42.74,98.46000000000001"/>
<path id="病-s8"  class="stroke" stroke="#2d09bf" d="M43.57,62.44C50.26,61.97,84.47999999999999,58.28,85.75999999999999,58.199999999999996C88.74999999999999,57.99999999999999,90.63,59.74999999999999,90.63,63.089999999999996C90.63,67.75,90.56,89.75999999999999,90.56,92.47999999999999C90.56,100.99999999999999,84.87,95.38,81.87,92.52999999999999"/>
<path id="病-s9"  class="stroke" stroke="#9a09bf" d="M63.19,44C64.1,44.91,64.47,46.24,64.46,47.64C64.38,61.75,60.379999999999995,77.75,49.199999999999996,85.12"/>
<path id="病-s10"  class="stroke" stroke="#bf0976" d="M65.62,69.12C70.35000000000001,71.52000000000001,77.84,79,79.02000000000001,82.73"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="病-bg1"  class="badge-group"><circle cx="57.56" cy="11.13" r="3.5" fill="#bf0909"/><text class="num-single" x="57.56" y="11.13" dx="0" dy="-0.5">1</text></g>
<g id="病-bg2"  class="badge-group"><circle cx="29.13" cy="23.73" r="3.5" fill="#bf7609"/><text class="num-single" x="29.13" y="23.73" dx="0" dy="-0.5">2</text></g>
<g id="病-bg3"  class="badge-group"><circle cx="30.99" cy="31.5" r="3.5" fill="#9abf09"/><text class="num-single" x="30.99" y="31.5" dx="0" dy="-0.5">3</text></g>
<g id="病-bg4"  class="badge-group"><circle cx="15" cy="38" r="3.5" fill="#2dbf09"/><text class="num-single" x="15" y="38" dx="0" dy="-0.5">4</text></g>
<g id="病-bg5"  class="badge-group"><circle cx="10.27" cy="68.03" r="3.5" fill="#09bf52"/><text class="num-single" x="10.27" y="68.03" dx="0" dy="-0.5">5</text></g>
<g id="病-bg6"  class="badge-group"><circle cx="43" cy="42.4" r="3.5" fill="#09bfbf"/><text class="num-single" x="43" y="42.4" dx="0" dy="-0.5">6</text></g>
<g id="病-bg7"  class="badge-group"><circle cx="41.11" cy="56.97" r="3.5" fill="#0952bf"/><text class="num-single" x="41.11" y="56.97" dx="0" dy="-0.5">7</text></g>
<g id="病-bg8"  class="badge-group"><circle cx="43.57" cy="65.94" r="3.5" fill="#2d09bf"/><text class="num-single" x="43.57" y="65.94" dx="0" dy="-0.5">8</text></g>
<g id="病-bg9"  class="badge-group"><circle cx="63.19" cy="44" r="3.5" fill="#9a09bf"/><text class="num-single" x="63.19" y="44" dx="0" dy="-0.5">9</text></g>
<g id="病-bg10" class="badge-group"><circle cx="65.62" cy="69.12" r="3.5" fill="#bf0976"/><text class="num-double" x="65.62" y="69.12" dx="-0.4" dy="-0.475">10</text></g>
</svg>