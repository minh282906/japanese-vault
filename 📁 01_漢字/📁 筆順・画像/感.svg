<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (感)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #感-bg[i]: Thời gian quả bóng số nảy lên
   - #感-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#感-bg1  { animation-delay: 0.05s; }
#感-s1   { stroke-dasharray: 50.0277; stroke-dashoffset: 50.0277; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#感-bg2  { animation-delay: 0.48s; }
#感-s2   { stroke-dasharray: 54.8691; stroke-dashoffset: 54.8691; animation: drawStroke 0.30s ease-out 0.61s forwards; }
#感-bg3  { animation-delay: 0.93s; }
#感-s3   { stroke-dasharray: 22.0280; stroke-dashoffset: 22.0280; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#感-bg4  { animation-delay: 1.30s; }
#感-s4   { stroke-dasharray: 15.1283; stroke-dashoffset: 15.1283; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#感-bg5  { animation-delay: 1.67s; }
#感-s5   { stroke-dasharray: 33.5765; stroke-dashoffset: 33.5765; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#感-bg6  { animation-delay: 2.04s; }
#感-s6   { stroke-dasharray: 18.0053; stroke-dashoffset: 18.0053; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#感-bg7  { animation-delay: 2.41s; }
#感-s7   { stroke-dasharray: 83.4089; stroke-dashoffset: 83.4089; animation: drawStroke 0.46s ease-out 2.54s forwards; }
#感-bg8  { animation-delay: 3.02s; }
#感-s8   { stroke-dasharray: 37.5936; stroke-dashoffset: 37.5936; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#感-bg9  { animation-delay: 3.39s; }
#感-s9   { stroke-dasharray: 12.9478; stroke-dashoffset: 12.9478; animation: drawStroke 0.22s ease-out 3.52s forwards; }
#感-bg10  { animation-delay: 3.76s; }
#感-s10   { stroke-dasharray: 17.9309; stroke-dashoffset: 17.9309; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#感-bg11  { animation-delay: 4.13s; }
#感-s11   { stroke-dasharray: 63.1819; stroke-dashoffset: 63.1819; animation: drawStroke 0.35s ease-out 4.26s forwards; }
#感-bg12  { animation-delay: 4.63s; }
#感-s12   { stroke-dasharray: 8.9285; stroke-dashoffset: 8.9285; animation: drawStroke 0.22s ease-out 4.76s forwards; }
#感-bg13  { animation-delay: 5.00s; }
#感-s13   { stroke-dasharray: 12.6398; stroke-dashoffset: 12.6398; animation: drawStroke 0.22s ease-out 5.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #感-s[i]) -->
<path id="感-s1"  class="stroke" stroke="#bf0909" d="M24,28.32C24.5,29.32,24.67,30.58,24.75,32.07C25.5,46.82,23.25,68.07,12.5,74.82"/>
