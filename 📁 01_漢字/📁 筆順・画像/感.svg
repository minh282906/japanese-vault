<path id="感-s4"  class="stroke" stroke="#79bf09" d="M30.39,53.41C31.13,53.879999999999995,31.57,54.55,31.72,55.41C32.57,57.919999999999995,33.24,61.769999999999996,33.879999999999995,65.52C34.01,66.28999999999999,34.13999999999999,67.05,34.269999999999996,67.78999999999999"/>
<path id="感-s5"  class="stroke" stroke="#25bf09" d="M32.62,54.26C40.33,53.019999999999996,46.58,51.73,51.23,51.32C53.129999999999995,51.15,54.68,51.92,53.989999999999995,54.18C53.03999999999999,57.31,52.46999999999999,59.55,51.419999999999995,63.57"/>
<path id="感-s6"  class="stroke" stroke="#09bf41" d="M34.54,65.82C39.49,65.58,43.54,64.72999999999999,50.26,64.72C50.98,64.72,51.72,64.72,52.5,64.73"/>
<path id="感-s7"  class="stroke" stroke="#09bf95" d="M52.78,10.57C54,11.32,55.300000000000004,12.39,55.75,15.07C59.25,36.07,68.09,59.05,87.78999999999999,67.42C94.3,70.18,92.99999999999999,67.7,91.50999999999999,59.370000000000005"/>
<path id="感-s8"  class="stroke" stroke="#0995bf" d="M78.74,36.83C78.78999999999999,37.57,78.83999999999999,38.75,78.64,39.82C77.43,46.13,70.88,59.69,61.480000000000004,69.46000000000001"/>
<path id="感-s9"  class="stroke" stroke="#0941bf" d="M72.17,9.93C75.52,11.459999999999999,80.88,14.969999999999999,82.44,17.6"/>
<path id="感-s10"  class="stroke" stroke="#2509bf" d="M22.31,83.96C21.619999999999997,88.44,18.34,96.41,15.159999999999998,100.24"/>
<path id="感-s11"  class="stroke" stroke="#7909bf" d="M36.01,81.44C44.75,95.32,54,100.84,78.43,100.44C86.13000000000001,100.31,86.13000000000001,98.19,80.33000000000001,92.89"/>
<path id="感-s12"  class="stroke" stroke="#bf09b1" d="M55.06,77.57C56.25,80.69,59.25,85.07,60.36,81.08"/>
<path id="感-s13"  class="stroke" stroke="#bf095d" d="M86.5,77.75C90,80.32,92.25,82.82,95,87"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="感-bg1"  class="badge-group"><circle cx="24" cy="24.82" r="3.5" fill="#bf0909"/><text class="num-single" x="24" y="24.82" dx="0" dy="-0.5">1</text></g>
