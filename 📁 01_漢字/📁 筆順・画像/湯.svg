<g id="湯-bg8"  class="badge-group"><circle cx="38" cy="50.76" r="3.5" fill="#0964bf"/><text class="num-single" x="38" y="50.76" dx="0" dy="-0.5">8</text></g>
<g id="湯-bg9"  class="badge-group"><circle cx="54" cy="53.25" r="3.5" fill="#0909bf"/><text class="num-single" x="54" y="53.25" dx="0" dy="-0.5">9</text></g>
