<path id="湯-s6"  class="stroke" stroke="#09bf64" d="M52.2,26.76C59.75,25.880000000000003,75.12,24.130000000000003,80.24000000000001,23.740000000000002"/>
<path id="湯-s7"  class="stroke" stroke="#09bfbf" d="M54.19,38.96C58.699999999999996,38.34,72.42,36.77,78.03999999999999,36.230000000000004"/>
<path id="湯-s8"  class="stroke" stroke="#0964bf" d="M38,50.76C41,51.12,44.6,51.01,47.59,50.68C60.34,49.24,75.5,47.88,87.95,46.68C91.05,46.38,94.15,46.339999999999996,97.23,46.87"/>
<path id="湯-s9"  class="stroke" stroke="#0909bf" d="M54,53.25C54.09,53.89,53.77,54.84,53.42,55.51C50.910000000000004,60.309999999999995,44.44,66.97,36.93000000000001,72.43"/>
<path id="湯-s10"  class="stroke" stroke="#6409bf" d="M51.69,62.7C53.379999999999995,63.25,55.29,63.03,56.82,62.870000000000005C64.12,62.12,77.38,60.38,87,59C92.15,58.26,93.83,59.75,93.07,64.9C91.75,73.75,89.38,85.62,81.91999999999999,96.07000000000001C79.65999999999998,99.24000000000001,77.12999999999998,97.38000000000001,74.53999999999999,93.92"/>
<path id="湯-s11"  class="stroke" stroke="#bf09bf" d="M59.45,65.85C59.5,66.75,59.2,67.89,58.88,68.44999999999999C55.620000000000005,74.11999999999999,49.370000000000005,80.24999999999999,39.870000000000005,85.49999999999999"/>
<path id="湯-s12"  class="stroke" stroke="#bf0964" d="M75.25,64.12C75.34,65.53,75.11,66.49000000000001,74.55,67.80000000000001C71,76.12,60.62,90,45.38,97.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="湯-bg1"  class="badge-group"><circle cx="21.76" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="21.76" y="17.5" dx="0" dy="-0.5">1</text></g>
