<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (湯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #湯-bg[i]: Thời gian quả bóng số nảy lên
   - #湯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#湯-bg1  { animation-delay: 0.05s; }
#湯-s1   { stroke-dasharray: 13.4780; stroke-dashoffset: 13.4780; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#湯-bg2  { animation-delay: 0.42s; }
#湯-s2   { stroke-dasharray: 13.9497; stroke-dashoffset: 13.9497; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#湯-bg3  { animation-delay: 0.79s; }
#湯-s3   { stroke-dasharray: 24.0736; stroke-dashoffset: 24.0736; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#湯-bg4  { animation-delay: 1.16s; }
#湯-s4   { stroke-dasharray: 28.9965; stroke-dashoffset: 28.9965; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#湯-bg5  { animation-delay: 1.53s; }
#湯-s5   { stroke-dasharray: 57.9297; stroke-dashoffset: 57.9297; animation: drawStroke 0.32s ease-out 1.66s forwards; }
#湯-bg6  { animation-delay: 2.00s; }
#湯-s6   { stroke-dasharray: 28.2031; stroke-dashoffset: 28.2031; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#湯-bg7  { animation-delay: 2.37s; }
#湯-s7   { stroke-dasharray: 24.0065; stroke-dashoffset: 24.0065; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#湯-bg8  { animation-delay: 2.74s; }
#湯-s8   { stroke-dasharray: 59.4778; stroke-dashoffset: 59.4778; animation: drawStroke 0.33s ease-out 2.87s forwards; }
#湯-bg9  { animation-delay: 3.22s; }
#湯-s9   { stroke-dasharray: 26.1565; stroke-dashoffset: 26.1565; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#湯-bg10  { animation-delay: 3.59s; }
#湯-s10   { stroke-dasharray: 89.3908; stroke-dashoffset: 89.3908; animation: drawStroke 0.49s ease-out 3.72s forwards; }
#湯-bg11  { animation-delay: 4.23s; }
#湯-s11   { stroke-dasharray: 28.5270; stroke-dashoffset: 28.5270; animation: drawStroke 0.22s ease-out 4.36s forwards; }
#湯-bg12  { animation-delay: 4.60s; }
#湯-s12   { stroke-dasharray: 46.1771; stroke-dashoffset: 46.1771; animation: drawStroke 0.25s ease-out 4.73s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #湯-s[i]) -->
<path id="湯-s1"  class="stroke" stroke="#bf0909" d="M21.76,17.5C25.55,18.88,31.55,23.19,32.5,25.34"/>
<path id="湯-s2"  class="stroke" stroke="#bf6409" d="M15.62,43.75C19.64,45.12,26,49.37,27,51.5"/>
