<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (農)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #農-bg[i]: Thời gian quả bóng số nảy lên
   - #農-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#農-bg1  { animation-delay: 0.05s; }
#農-s1   { stroke-dasharray: 23.4881; stroke-dashoffset: 23.4881; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#農-bg2  { animation-delay: 0.42s; }
#農-s2   { stroke-dasharray: 71.1086; stroke-dashoffset: 71.1086; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#農-bg3  { animation-delay: 0.96s; }
#農-s3   { stroke-dasharray: 27.5467; stroke-dashoffset: 27.5467; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#農-bg4  { animation-delay: 1.33s; }
#農-s4   { stroke-dasharray: 27.7200; stroke-dashoffset: 27.7200; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#農-bg5  { animation-delay: 1.70s; }
#農-s5   { stroke-dasharray: 44.7112; stroke-dashoffset: 44.7112; animation: drawStroke 0.25s ease-out 1.83s forwards; }
#農-bg6  { animation-delay: 2.10s; }
#農-s6   { stroke-dasharray: 39.4752; stroke-dashoffset: 39.4752; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#農-bg7  { animation-delay: 2.47s; }
#農-s7   { stroke-dasharray: 57.6770; stroke-dashoffset: 57.6770; animation: drawStroke 0.32s ease-out 2.60s forwards; }
#農-bg8  { animation-delay: 2.94s; }
#農-s8   { stroke-dasharray: 51.3697; stroke-dashoffset: 51.3697; animation: drawStroke 0.28s ease-out 3.07s forwards; }
#農-bg9  { animation-delay: 3.37s; }
#農-s9   { stroke-dasharray: 33.9245; stroke-dashoffset: 33.9245; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#農-bg10  { animation-delay: 3.74s; }
#農-s10   { stroke-dasharray: 48.0385; stroke-dashoffset: 48.0385; animation: drawStroke 0.26s ease-out 3.87s forwards; }
#農-bg11  { animation-delay: 4.15s; }
#農-s11   { stroke-dasharray: 43.4744; stroke-dashoffset: 43.4744; animation: drawStroke 0.24s ease-out 4.28s forwards; }
#農-bg12  { animation-delay: 4.54s; }
#農-s12   { stroke-dasharray: 11.5134; stroke-dashoffset: 11.5134; animation: drawStroke 0.22s ease-out 4.67s forwards; }
#農-bg13  { animation-delay: 4.91s; }
#農-s13   { stroke-dasharray: 42.3821; stroke-dashoffset: 42.3821; animation: drawStroke 0.23s ease-out 5.04s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

