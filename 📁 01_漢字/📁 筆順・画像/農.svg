<path id="農-s10"  class="stroke" stroke="#2509bf" d="M35.71,70.15C37.22,70.44000000000001,40,70.58000000000001,41.51,70.44000000000001C50.629999999999995,69.62000000000002,66.31,67.87000000000002,76.96000000000001,67.07000000000001C79.46000000000001,66.88000000000001,82.30000000000001,66.96000000000001,83.56,67.11000000000001"/>
<path id="農-s11"  class="stroke" stroke="#7909bf" d="M42.58,73.53C43.53,74.48,43.85,76,43.85,77.36C43.85,86.4,43.76,89,43.76,94.63C43.76,98.13,43.879999999999995,98.75,46.76,97.00999999999999C48.66,95.85,57.01,90.38999999999999,60.25,88.41999999999999"/>
<path id="農-s12"  class="stroke" stroke="#bf09b1" d="M75.34,71.18C75.4,71.77000000000001,75.3,72.33000000000001,75.04,72.86000000000001C74.18,74.97000000000001,71.87,77.62000000000002,69,80.49000000000001"/>
