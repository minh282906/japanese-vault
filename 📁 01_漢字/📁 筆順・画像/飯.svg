<path id="飯-s10"  class="stroke" stroke="#6409bf" d="M53.99,26C55,26.75,55.410000000000004,28.12,55.39,29.64C55,55.62,55.5,78.38,41.25,95.5"/>
<path id="飯-s11"  class="stroke" stroke="#bf09bf" d="M58.83,45.98C60.17,46.349999999999994,61.33,46.4,64.00999999999999,45.849999999999994C68.74999999999999,44.879999999999995,78.36999999999999,42.129999999999995,82.27,40.699999999999996C85.05,39.67999999999999,86.53,41.44,85.53,44.51C77.67,68.47,69.12,84.38,50,94.76"/>
<path id="飯-s12"  class="stroke" stroke="#bf0964" d="M61.12,55.19C64.36,56.099999999999994,79.55,79.45,90.83,89.4C92.59,90.95,93.87,91.98,95.5,92.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="飯-bg1"  class="badge-group"><circle cx="30.79" cy="11.5" r="3.5" fill="#bf0909"/><text class="num-single" x="30.79" y="11.5" dx="0" dy="-0.5">1</text></g>
