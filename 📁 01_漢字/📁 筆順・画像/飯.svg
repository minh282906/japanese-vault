<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (飯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #飯-bg[i]: Thời gian quả bóng số nảy lên
   - #飯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#飯-bg1  { animation-delay: 0.05s; }
#飯-s1   { stroke-dasharray: 36.8277; stroke-dashoffset: 36.8277; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#飯-bg2  { animation-delay: 0.42s; }
#飯-s2   { stroke-dasharray: 18.3186; stroke-dashoffset: 18.3186; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#飯-bg3  { animation-delay: 0.79s; }
#飯-s3   { stroke-dasharray: 10.8475; stroke-dashoffset: 10.8475; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#飯-bg4  { animation-delay: 1.16s; }
#飯-s4   { stroke-dasharray: 47.2740; stroke-dashoffset: 47.2740; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#飯-bg5  { animation-delay: 1.57s; }
#飯-s5   { stroke-dasharray: 19.0464; stroke-dashoffset: 19.0464; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#飯-bg6  { animation-delay: 1.94s; }
#飯-s6   { stroke-dasharray: 17.5092; stroke-dashoffset: 17.5092; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#飯-bg7  { animation-delay: 2.31s; }
#飯-s7   { stroke-dasharray: 67.6447; stroke-dashoffset: 67.6447; animation: drawStroke 0.37s ease-out 2.44s forwards; }
#飯-bg8  { animation-delay: 2.83s; }
#飯-s8   { stroke-dasharray: 13.5869; stroke-dashoffset: 13.5869; animation: drawStroke 0.22s ease-out 2.96s forwards; }
#飯-bg9  { animation-delay: 3.20s; }
#飯-s9   { stroke-dasharray: 36.6487; stroke-dashoffset: 36.6487; animation: drawStroke 0.22s ease-out 3.33s forwards; }
#飯-bg10  { animation-delay: 3.57s; }
#飯-s10   { stroke-dasharray: 72.8420; stroke-dashoffset: 72.8420; animation: drawStroke 0.40s ease-out 3.70s forwards; }
#飯-bg11  { animation-delay: 4.12s; }
#飯-s11   { stroke-dasharray: 94.3549; stroke-dashoffset: 94.3549; animation: drawStroke 0.52s ease-out 4.25s forwards; }
#飯-bg12  { animation-delay: 4.79s; }
#飯-s12   { stroke-dasharray: 51.0712; stroke-dashoffset: 51.0712; animation: drawStroke 0.28s ease-out 4.92s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #飯-s[i]) -->
<path id="飯-s1"  class="stroke" stroke="#bf0909" d="M30.79,15C30.849999999999998,15.73,31.02,16.95,30.669999999999998,17.93C27.79,26.07,19.229999999999997,37.480000000000004,10.249999999999996,44.5"/>
