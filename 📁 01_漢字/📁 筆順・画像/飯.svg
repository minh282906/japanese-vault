<path id="飯-s7"  class="stroke" stroke="#09bfbf" d="M19.12,45.26C20.12,46.26,20.650000000000002,47.51,20.650000000000002,48.75C20.650000000000002,49.68,20.570000000000004,85.43,20.570000000000004,87.72C20.570000000000004,92,21.380000000000003,91.88,24.010000000000005,89.88C26.06,88.3,34.5,82,38.75,79.5"/>
<path id="飯-s8"  class="stroke" stroke="#0964bf" d="M35.62,73.25C37.36,75.28,41.25,80.71,42.239999999999995,85"/>
