<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (与)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #与-bg[i]: Thời gian quả bóng số nảy lên
   - #与-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#与-bg1  { animation-delay: 0.05s; }
#与-s1   { stroke-dasharray: 32.0030; stroke-dashoffset: 32.0030; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#与-bg2  { animation-delay: 0.42s; }
#与-s2   { stroke-dasharray: 136.7950; stroke-dashoffset: 136.7950; animation: drawStroke 0.55s ease-out 0.55s forwards; }
#与-bg3  { animation-delay: 1.12s; }
#与-s3   { stroke-dasharray: 86.8268; stroke-dashoffset: 86.8268; animation: drawStroke 0.48s ease-out 1.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #与-s[i]) -->
<path id="与-s1"  class="stroke" stroke="#bf0909" d="M44.5,28.5C45.71,28.39,47.56,28.16,49.730000000000004,27.86C57.39,26.82,69.05,25,71,25C73.5,25,75,24.5,76.25,24.75"/>
<path id="与-s2"  class="stroke" stroke="#09bf09" d="M45.75,10.5C46.69,11.44,47.16,12.97,46.75,15.32C45.75,21,42.72,34.56,40.75,41.72C39.5,46.26,40,46.76,43.75,45.89C45.73,45.43,63.760000000000005,42.37,68.75,41.83C71.75,41.51,73.64,43.769999999999996,73.25,46.93C71.5,61.129999999999995,67.5,81.00999999999999,61.25,91.22C56.65,98.74,52.93,95.16,47.25,90.53999999999999"/>
<path id="与-s3"  class="stroke" stroke="#0909bf" d="M11.25,64.95C16.25,66,20.060000000000002,65.61,24.009999999999998,65.2C46.75,62.870000000000005,67.12,60.620000000000005,86.13,60.31C90.08,60.24,93.89999999999999,60.21,97.75,61.04"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="与-bg1"  class="badge-group"><circle cx="44.5" cy="28.5" r="3.5" fill="#bf0909"/><text class="num-single" x="44.5" y="28.5" dx="0" dy="-0.5">1</text></g>
<g id="与-bg2"  class="badge-group"><circle cx="45.75" cy="10.5" r="3.5" fill="#09bf09"/><text class="num-single" x="45.75" y="10.5" dx="0" dy="-0.5">2</text></g>
<g id="与-bg3"  class="badge-group"><circle cx="11.25" cy="64.95" r="3.5" fill="#0909bf"/><text class="num-single" x="11.25" y="64.95" dx="0" dy="-0.5">3</text></g>
</svg>