<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (協)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #協-bg[i]: Thời gian quả bóng số nảy lên
   - #協-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#協-bg1  { animation-delay: 0.05s; }
#協-s1   { stroke-dasharray: 30.5859; stroke-dashoffset: 30.5859; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#協-bg2  { animation-delay: 0.42s; }
#協-s2   { stroke-dasharray: 78.3707; stroke-dashoffset: 78.3707; animation: drawStroke 0.43s ease-out 0.55s forwards; }
#協-bg3  { animation-delay: 1.00s; }
#協-s3   { stroke-dasharray: 71.5376; stroke-dashoffset: 71.5376; animation: drawStroke 0.39s ease-out 1.13s forwards; }
#協-bg4  { animation-delay: 1.54s; }
#協-s4   { stroke-dasharray: 46.2527; stroke-dashoffset: 46.2527; animation: drawStroke 0.25s ease-out 1.67s forwards; }
#協-bg5  { animation-delay: 1.94s; }
#協-s5   { stroke-dasharray: 58.3210; stroke-dashoffset: 58.3210; animation: drawStroke 0.32s ease-out 2.07s forwards; }
#協-bg6  { animation-delay: 2.41s; }
#協-s6   { stroke-dasharray: 42.5435; stroke-dashoffset: 42.5435; animation: drawStroke 0.23s ease-out 2.54s forwards; }
#協-bg7  { animation-delay: 2.79s; }
#協-s7   { stroke-dasharray: 63.3110; stroke-dashoffset: 63.3110; animation: drawStroke 0.35s ease-out 2.92s forwards; }
#協-bg8  { animation-delay: 3.29s; }
#協-s8   { stroke-dasharray: 45.4915; stroke-dashoffset: 45.4915; animation: drawStroke 0.25s ease-out 3.42s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #協-s[i]) -->
<path id="協-s1"  class="stroke" stroke="#bf0909" d="M10.75,43.28C12.44,43.74,14.41,43.54,16.15,43.39C22.25,42.86,30.369999999999997,41,36.959999999999994,39.93C38.489999999999995,39.68,40.209999999999994,39.72,40.99999999999999,39.839999999999996"/>
<path id="協-s2"  class="stroke" stroke="#bf9109" d="M25.62,17.5C26.5,18.38,27.080000000000002,19.98,27.080000000000002,21C27.080000000000002,29.41,27.1,68.7,27.110000000000003,88C27.110000000000003,91.08,27.110000000000003,93.64,27.110000000000003,95.5"/>
<path id="協-s3"  class="stroke" stroke="#64bf09" d="M47.42,28.61C49.370000000000005,29.45,51.22,29.64,53.260000000000005,29.43C62.00000000000001,28.509999999999998,79.29,25.09,82.48,24.74C84.8,24.479999999999997,85.44,25.9,85.32000000000001,27.709999999999997C84.98,32.47,79.36000000000001,46.199999999999996,75.75,49.42C73.05,51.83,72.37,50.72,69.56,49.03"/>
<path id="協-s4"  class="stroke" stroke="#09bf36" d="M66.37,12C66.84,13.09,67.01,14.25,66.77000000000001,15.64C64.98,25.91,59.47000000000001,42.31,47.750000000000014,52.88"/>
<path id="協-s5"  class="stroke" stroke="#09bfbf" d="M35.82,70.33C36.68,70.74,39.58,70.99,40.51,70.82C46.65,69.67999999999999,57.269999999999996,67.69999999999999,59.79,67.38999999999999C61.67,67.15999999999998,62.19,68.42999999999999,62.089999999999996,70.03999999999999C61.809999999999995,74.3,56.199999999999996,89.21,53.269999999999996,92.08999999999999C51.059999999999995,94.25999999999999,50.47,93.21,48.26,91.74"/>
<path id="協-s6"  class="stroke" stroke="#0936bf" d="M49.5,58.43C49.88,59.63,49.88,60.74,49.64,62.01C47.88,71.47,44.75,86.88,32.129999999999995,95.57"/>
<path id="協-s7"  class="stroke" stroke="#6409bf" d="M68.84,66.61C69.67,67.07,72.05,67.1,73,66.88C78.91,65.53,89.1,62.839999999999996,91.56,62.48C93.37,62.22,94.44,63.4,94.27,65.19C93.38,74.24,88.75,87.49,85.05,92.9C83.21,95.58000000000001,82.49,94.25,80.24,92.51"/>
<path id="協-s8"  class="stroke" stroke="#bf0991" d="M80.53,55.43C81.13,56.38,81.12,57.58,80.92,58.92C79.5,68.38,74.88,85.75,61.5,94.75"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="協-bg1"  class="badge-group"><circle cx="10.75" cy="43.28" r="3.5" fill="#bf0909"/><text class="num-single" x="10.75" y="43.28" dx="0" dy="-0.5">1</text></g>
<g id="協-bg2"  class="badge-group"><circle cx="25.62" cy="17.5" r="3.5" fill="#bf9109"/><text class="num-single" x="25.62" y="17.5" dx="0" dy="-0.5">2</text></g>
<g id="協-bg3"  class="badge-group"><circle cx="47.42" cy="28.61" r="3.5" fill="#64bf09"/><text class="num-single" x="47.42" y="28.61" dx="0" dy="-0.5">3</text></g>
<g id="協-bg4"  class="badge-group"><circle cx="66.37" cy="12" r="3.5" fill="#09bf36"/><text class="num-single" x="66.37" y="12" dx="0" dy="-0.5">4</text></g>
<g id="協-bg5"  class="badge-group"><circle cx="35.82" cy="70.33" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.82" y="70.33" dx="0" dy="-0.5">5</text></g>
<g id="協-bg6"  class="badge-group"><circle cx="49.5" cy="58.43" r="3.5" fill="#0936bf"/><text class="num-single" x="49.5" y="58.43" dx="0" dy="-0.5">6</text></g>
<g id="協-bg7"  class="badge-group"><circle cx="68.84" cy="66.61" r="3.5" fill="#6409bf"/><text class="num-single" x="68.84" y="66.61" dx="0" dy="-0.5">7</text></g>
<g id="協-bg8"  class="badge-group"><circle cx="80.53" cy="55.43" r="3.5" fill="#bf0991"/><text class="num-single" x="80.53" y="55.43" dx="0" dy="-0.5">8</text></g>
</svg>