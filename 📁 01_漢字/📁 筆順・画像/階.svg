<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (階)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #階-bg[i]: Thời gian quả bóng số nảy lên
   - #階-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#階-bg1  { animation-delay: 0.05s; }
#階-s1   { stroke-dasharray: 45.2913; stroke-dashoffset: 45.2913; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#階-bg2  { animation-delay: 0.45s; }
#階-s2   { stroke-dasharray: 39.0763; stroke-dashoffset: 39.0763; animation: drawStroke 0.22s ease-out 0.58s forwards; }
#階-bg3  { animation-delay: 0.82s; }
#階-s3   { stroke-dasharray: 78.4773; stroke-dashoffset: 78.4773; animation: drawStroke 0.43s ease-out 0.95s forwards; }
#階-bg4  { animation-delay: 1.40s; }
#階-s4   { stroke-dasharray: 14.0458; stroke-dashoffset: 14.0458; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#階-bg5  { animation-delay: 1.77s; }
#階-s5   { stroke-dasharray: 52.8910; stroke-dashoffset: 52.8910; animation: drawStroke 0.29s ease-out 1.90s forwards; }
#階-bg6  { animation-delay: 2.21s; }
#階-s6   { stroke-dasharray: 22.4949; stroke-dashoffset: 22.4949; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#階-bg7  { animation-delay: 2.58s; }
#階-s7   { stroke-dasharray: 60.4171; stroke-dashoffset: 60.4171; animation: drawStroke 0.33s ease-out 2.71s forwards; }
#階-bg8  { animation-delay: 3.06s; }
#階-s8   { stroke-dasharray: 15.3072; stroke-dashoffset: 15.3072; animation: drawStroke 0.22s ease-out 3.19s forwards; }
#階-bg9  { animation-delay: 3.43s; }
#階-s9   { stroke-dasharray: 34.5319; stroke-dashoffset: 34.5319; animation: drawStroke 0.22s ease-out 3.56s forwards; }
#階-bg10  { animation-delay: 3.80s; }
#階-s10   { stroke-dasharray: 65.6514; stroke-dashoffset: 65.6514; animation: drawStroke 0.36s ease-out 3.93s forwards; }
#階-bg11  { animation-delay: 4.31s; }
#階-s11   { stroke-dasharray: 29.0343; stroke-dashoffset: 29.0343; animation: drawStroke 0.22s ease-out 4.44s forwards; }
#階-bg12  { animation-delay: 4.68s; }
#階-s12   { stroke-dasharray: 28.5159; stroke-dashoffset: 28.5159; animation: drawStroke 0.22s ease-out 4.81s forwards; }
]]>
</style>

