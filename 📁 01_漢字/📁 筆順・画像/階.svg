<path id="階-s9"  class="stroke" stroke="#0909bf" d="M51.84,62.22C52.5,62.879999999999995,52.81,63.75,52.81,64.88C52.81,65.88,52.64,85.42999999999999,52.79,93.75C52.81,94.89,52.83,95.83,52.86,96.5"/>
<path id="階-s10"  class="stroke" stroke="#6409bf" d="M53.78,64.09C61.07,63.07,79.06,60.64,81.1,60.5C83.16,60.36,84.86999999999999,61.5,84.83,64.04C84.75,69.92,84.37,81.63000000000001,83.87,93.27000000000001C83.81,94.76,83.74000000000001,93.63000000000001,83.56,96.19000000000001"/>
<path id="階-s11"  class="stroke" stroke="#bf09bf" d="M54.36,77.82C59.629999999999995,77.5,78.38,76,83.33,75.91"/>
<path id="階-s12"  class="stroke" stroke="#bf0964" d="M54.15,94.19C60.25,94,75.59,92.81,82.63,92.81"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
