<path id="業-s9"  class="stroke" stroke="#0941bf" d="M31.12,58.89C33.38,59.33,35.64,59.47,37.89,59.17C50,57.54,57.44,56.730000000000004,68.25,55.510000000000005C70.4,55.220000000000006,72.57,55.220000000000006,74.75,55.510000000000005"/>
<path id="業-s10"  class="stroke" stroke="#2509bf" d="M20.25,70.48C23.36,71.01,26.46,71.10000000000001,29.54,70.77000000000001C45.36,69.18,66.44,66.50000000000001,79.8,65.84C83.53999999999999,65.66,86.25999999999999,65.73,88.13,66.03"/>
<path id="業-s11"  class="stroke" stroke="#7909bf" d="M52.18,47.26C53.21,48.29,53.55,49.66,53.55,50.66C53.55,53.18,53.379999999999995,79.92,53.339999999999996,92.75C53.33,94.99,53.33,96.81,53.33,98"/>
<path id="業-s12"  class="stroke" stroke="#bf09b1" d="M48.05,69.46C47.8,70.55,47.33,71.52,46.64,72.36999999999999C40.370000000000005,80.91999999999999,28.810000000000002,91.30999999999999,16.7,96.13999999999999"/>
<path id="業-s13"  class="stroke" stroke="#bf095d" d="M55.48,69.07C60.129999999999995,72.86999999999999,75.56,84.78,82.99,90.02C85.33999999999999,91.67,88.13,93.11999999999999,90.97,94.1"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="業-bg1"  class="badge-group"><circle cx="45.37" cy="12.75" r="3.5" fill="#bf0909"/><text class="num-single" x="45.37" y="12.75" dx="0" dy="-0.5">1</text></g>
