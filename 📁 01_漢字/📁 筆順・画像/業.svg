<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (業)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #業-bg[i]: Thời gian quả bóng số nảy lên
   - #業-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#業-bg1  { animation-delay: 0.05s; }
#業-s1   { stroke-dasharray: 17.6664; stroke-dashoffset: 17.6664; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#業-bg2  { animation-delay: 0.42s; }
#業-s2   { stroke-dasharray: 18.3569; stroke-dashoffset: 18.3569; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#業-bg3  { animation-delay: 0.79s; }
#業-s3   { stroke-dasharray: 12.4529; stroke-dashoffset: 12.4529; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#業-bg4  { animation-delay: 1.16s; }
#業-s4   { stroke-dasharray: 12.5239; stroke-dashoffset: 12.5239; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#業-bg5  { animation-delay: 1.53s; }
#業-s5   { stroke-dasharray: 84.5283; stroke-dashoffset: 84.5283; animation: drawStroke 0.46s ease-out 1.66s forwards; }
#業-bg6  { animation-delay: 2.14s; }
#業-s6   { stroke-dasharray: 9.6199; stroke-dashoffset: 9.6199; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#業-bg7  { animation-delay: 2.51s; }
#業-s7   { stroke-dasharray: 11.0517; stroke-dashoffset: 11.0517; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#業-bg8  { animation-delay: 2.88s; }
#業-s8   { stroke-dasharray: 46.4971; stroke-dashoffset: 46.4971; animation: drawStroke 0.26s ease-out 3.01s forwards; }
#業-bg9  { animation-delay: 3.29s; }
#業-s9   { stroke-dasharray: 43.9060; stroke-dashoffset: 43.9060; animation: drawStroke 0.24s ease-out 3.42s forwards; }
#業-bg10  { animation-delay: 3.68s; }
#業-s10   { stroke-dasharray: 68.1763; stroke-dashoffset: 68.1763; animation: drawStroke 0.37s ease-out 3.81s forwards; }
#業-bg11  { animation-delay: 4.20s; }
#業-s11   { stroke-dasharray: 51.0992; stroke-dashoffset: 51.0992; animation: drawStroke 0.28s ease-out 4.33s forwards; }
#業-bg12  { animation-delay: 4.63s; }
#業-s12   { stroke-dasharray: 41.9288; stroke-dashoffset: 41.9288; animation: drawStroke 0.23s ease-out 4.76s forwards; }
#業-bg13  { animation-delay: 5.01s; }
#業-s13   { stroke-dasharray: 43.5735; stroke-dashoffset: 43.5735; animation: drawStroke 0.24s ease-out 5.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

