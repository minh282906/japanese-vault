<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (落)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #落-bg[i]: Thời gian quả bóng số nảy lên
   - #落-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#落-bg1  { animation-delay: 0.05s; }
#落-s1   { stroke-dasharray: 74.2464; stroke-dashoffset: 74.2464; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#落-bg2  { animation-delay: 0.61s; }
#落-s2   { stroke-dasharray: 21.5634; stroke-dashoffset: 21.5634; animation: drawStroke 0.22s ease-out 0.74s forwards; }
#落-bg3  { animation-delay: 0.98s; }
#落-s3   { stroke-dasharray: 22.8013; stroke-dashoffset: 22.8013; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#落-bg4  { animation-delay: 1.35s; }
#落-s4   { stroke-dasharray: 11.4670; stroke-dashoffset: 11.4670; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#落-bg5  { animation-delay: 1.72s; }
#落-s5   { stroke-dasharray: 12.0370; stroke-dashoffset: 12.0370; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#落-bg6  { animation-delay: 2.09s; }
#落-s6   { stroke-dasharray: 23.4443; stroke-dashoffset: 23.4443; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#落-bg7  { animation-delay: 2.46s; }
#落-s7   { stroke-dasharray: 25.6443; stroke-dashoffset: 25.6443; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#落-bg8  { animation-delay: 2.83s; }
#落-s8   { stroke-dasharray: 73.6243; stroke-dashoffset: 73.6243; animation: drawStroke 0.40s ease-out 2.96s forwards; }
#落-bg9  { animation-delay: 3.38s; }
#落-s9   { stroke-dasharray: 48.6562; stroke-dashoffset: 48.6562; animation: drawStroke 0.27s ease-out 3.51s forwards; }
#落-bg10  { animation-delay: 3.80s; }
#落-s10   { stroke-dasharray: 19.4238; stroke-dashoffset: 19.4238; animation: drawStroke 0.22s ease-out 3.93s forwards; }
#落-bg11  { animation-delay: 4.17s; }
#落-s11   { stroke-dasharray: 43.5683; stroke-dashoffset: 43.5683; animation: drawStroke 0.24s ease-out 4.30s forwards; }
#落-bg12  { animation-delay: 4.56s; }
#落-s12   { stroke-dasharray: 25.1535; stroke-dashoffset: 25.1535; animation: drawStroke 0.22s ease-out 4.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #落-s[i]) -->
<path id="落-s1"  class="stroke" stroke="#bf0909" d="M16.5,25.52C19,26.25,22.73,26.2,25.880000000000003,25.87C41.5,24.25,65.62,22.5,81,22.12C84.08,22.040000000000003,87.48,22.040000000000003,90.5,22.78"/>
