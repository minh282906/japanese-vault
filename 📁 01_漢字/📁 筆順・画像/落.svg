<path id="落-s5"  class="stroke" stroke="#09bf09" d="M16.88,55.93C20.27,57.16,25.63,61,26.479999999999997,62.92"/>
<path id="落-s6"  class="stroke" stroke="#09bf64" d="M15.25,92.87C16.58,93.08,17.85,92.73,18.66,91.71000000000001C22.34,87.00000000000001,26.03,81.25,29.380000000000003,75.25"/>
<path id="落-s7"  class="stroke" stroke="#09bfbf" d="M55.68,36.75C55.72,37.23,55.76,37.98,55.6,38.67C54.6,42.71,48.91,51.57,41.12,57"/>
<path id="落-s8"  class="stroke" stroke="#0964bf" d="M56.32,43.21C56.65,43.24,58.08,43.33,59,43.13C63,42.25,67.75,40.88,72.13,39.790000000000006C74.42,39.220000000000006,75.67,41.34,74.50999999999999,43.45C69.42,52.67,56,70.88,37.22,77.67"/>
<path id="落-s9"  class="stroke" stroke="#0909bf" d="M49.97,49.17C54.81,52.92,75.58,66.47,84.05,71.27000000000001C86.42,72.61000000000001,88.78999999999999,73.69000000000001,91.5,74.13000000000001"/>
<path id="落-s10"  class="stroke" stroke="#6409bf" d="M46.5,78.88C47.12,79.32,47.5,79.89999999999999,47.64,80.61999999999999C48.32,84.19999999999999,49.06,89.38999999999999,49.730000000000004,94.13C49.910000000000004,95.36999999999999,50.080000000000005,96.57,50.25000000000001,97.71"/>
<path id="落-s11"  class="stroke" stroke="#bf09bf" d="M48.59,80.33C55.63,79.35,68.94,77.99,74.37,77.44C76.61,77.21,78.13000000000001,78.88,77.5,81.03999999999999C76.49,84.55999999999999,75.46,87.80999999999999,74.26,92.44999999999999"/>
<path id="落-s12"  class="stroke" stroke="#bf0964" d="M51.16,95.16C56.36,94.91,65,93.99,73.25999999999999,93.53999999999999C74.27999999999999,93.47999999999999,75.27,93.44,76.24999999999999,93.39999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="落-bg1"  class="badge-group"><circle cx="16.5" cy="25.52" r="3.5" fill="#bf0909"/><text class="num-single" x="16.5" y="25.52" dx="0" dy="-0.5">1</text></g>
<g id="落-bg2"  class="badge-group"><circle cx="34" cy="14.88" r="3.5" fill="#bf6409"/><text class="num-single" x="34" y="14.88" dx="0" dy="-0.5">2</text></g>
