<g id="落-bg8"  class="badge-group"><circle cx="56.32" cy="43.21" r="3.5" fill="#0964bf"/><text class="num-single" x="56.32" y="43.21" dx="0" dy="-0.5">8</text></g>
<g id="落-bg9"  class="badge-group"><circle cx="49.97" cy="52.67" r="3.5" fill="#0909bf"/><text class="num-single" x="49.97" y="52.67" dx="0" dy="-0.5">9</text></g>
