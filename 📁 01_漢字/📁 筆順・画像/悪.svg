<g id="悪-bg9"  class="badge-group"><circle cx="35" cy="70.5" r="3.5" fill="#4b09bf"/><text class="num-single" x="35" y="70.5" dx="0" dy="-0.5">9</text></g>
<g id="悪-bg10" class="badge-group"><circle cx="55.49" cy="69.75" r="3.5" fill="#ae09bf"/><text class="num-double" x="55.49" y="69.75" dx="-0.4" dy="-0.475">10</text></g>
<g id="悪-bg11" class="badge-group"><circle cx="82.5" cy="68.5" r="3.5" fill="#bf096c"/><text class="num-double" x="82.5" y="68.5" dx="-0.4" dy="-0.475">11</text></g>
</svg>