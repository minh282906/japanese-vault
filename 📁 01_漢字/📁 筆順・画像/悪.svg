<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (悪)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #悪-bg[i]: Thời gian quả bóng số nảy lên
   - #悪-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#悪-bg1  { animation-delay: 0.05s; }
#悪-s1   { stroke-dasharray: 53.4709; stroke-dashoffset: 53.4709; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#悪-bg2  { animation-delay: 0.49s; }
#悪-s2   { stroke-dasharray: 17.8978; stroke-dashoffset: 17.8978; animation: drawStroke 0.22s ease-out 0.62s forwards; }
#悪-bg3  { animation-delay: 0.86s; }
#悪-s3   { stroke-dasharray: 65.4383; stroke-dashoffset: 65.4383; animation: drawStroke 0.36s ease-out 0.99s forwards; }
#悪-bg4  { animation-delay: 1.37s; }
#悪-s4   { stroke-dasharray: 44.1581; stroke-dashoffset: 44.1581; animation: drawStroke 0.24s ease-out 1.50s forwards; }
#悪-bg5  { animation-delay: 1.76s; }
#悪-s5   { stroke-dasharray: 40.2561; stroke-dashoffset: 40.2561; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#悪-bg6  { animation-delay: 2.13s; }
#悪-s6   { stroke-dasharray: 40.9788; stroke-dashoffset: 40.9788; animation: drawStroke 0.23s ease-out 2.26s forwards; }
#悪-bg7  { animation-delay: 2.51s; }
#悪-s7   { stroke-dasharray: 65.0623; stroke-dashoffset: 65.0623; animation: drawStroke 0.36s ease-out 2.64s forwards; }
#悪-bg8  { animation-delay: 3.02s; }
#悪-s8   { stroke-dasharray: 16.4872; stroke-dashoffset: 16.4872; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#悪-bg9  { animation-delay: 3.39s; }
#悪-s9   { stroke-dasharray: 74.2217; stroke-dashoffset: 74.2217; animation: drawStroke 0.41s ease-out 3.52s forwards; }
#悪-bg10  { animation-delay: 3.95s; }
#悪-s10   { stroke-dasharray: 11.7296; stroke-dashoffset: 11.7296; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#悪-bg11  { animation-delay: 4.32s; }
#悪-s11   { stroke-dasharray: 17.1691; stroke-dashoffset: 17.1691; animation: drawStroke 0.22s ease-out 4.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #悪-s[i]) -->
<path id="悪-s1"  class="stroke" stroke="#bf0909" d="M27.02,20.14C28.689999999999998,20.36,31.74,20.5,33.4,20.310000000000002C45.38,19,61.62,17,74.43,16.12C77.19000000000001,15.930000000000001,78.87,16.19,80.25,16.3"/>
<path id="悪-s2"  class="stroke" stroke="#bf6c09" d="M27.44,34.62C28.5,35.129999999999995,29.3,36.059999999999995,29.5,36.82C30.62,41,31.01,44.26,31.8,48.46C32,49.53,32.19,50.51,32.35,51.34"/>
<path id="悪-s3"  class="stroke" stroke="#aebf09" d="M30.5,35.72C43.58,33.96,72.78,30.669999999999998,76.71000000000001,30.669999999999998C79.38000000000001,30.669999999999998,80.88000000000001,32.12,80.25000000000001,35.25C79.64000000000001,38.28,79.19000000000001,40.07,78.30000000000001,44.26C78.13000000000001,45.07,77.94000000000001,45.98,77.73000000000002,46.989999999999995"/>
<path id="悪-s4"  class="stroke" stroke="#4bbf09" d="M33.37,49.41C44.37,48.129999999999995,62.12,46.25,77.33,45.279999999999994"/>
<path id="悪-s5"  class="stroke" stroke="#09bf2a" d="M43.52,21.44C44.35,22.27,45,23.5,45.03,24.51C45.18,30.020000000000003,46.43,56.879999999999995,46.25,61.25"/>
<path id="悪-s6"  class="stroke" stroke="#09bf8d" d="M62,19.31C62.84,20.15,63.03,21.369999999999997,63,22.25C62.75,28.25,61.29,55.93,61.13,59.99"/>
<path id="悪-s7"  class="stroke" stroke="#098dbf" d="M23,64.05C25.08,64.38,27.38,64.41,31,64.06C47,62.5,66.62,60,80.25,59.7C83.72,59.620000000000005,85.75,59.75,87.8,60.2"/>
<path id="悪-s8"  class="stroke" stroke="#092abf" d="M24,77C24.29,79.19,21.09,88.85,18.75,92.5"/>
<path id="悪-s9"  class="stroke" stroke="#4b09bf" d="M35,70.5C43.75,84.95,54.5,96.25,82.3,94.85C91.88,94.36999999999999,90.75,91.25,81.75,86"/>
<path id="悪-s10"  class="stroke" stroke="#ae09bf" d="M55.49,69.75C57.31,72.92,62.07,79.49,63.21,75.02"/>
<path id="悪-s11"  class="stroke" stroke="#bf096c" d="M82.5,68.5C86.5,70.7,91.38,75,94.5,80.5"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="悪-bg1"  class="badge-group"><circle cx="27.02" cy="20.14" r="3.5" fill="#bf0909"/><text class="num-single" x="27.02" y="20.14" dx="0" dy="-0.5">1</text></g>
<g id="悪-bg2"  class="badge-group"><circle cx="27.44" cy="31.12" r="3.5" fill="#bf6c09"/><text class="num-single" x="27.44" y="31.12" dx="0" dy="-0.5">2</text></g>
<g id="悪-bg3"  class="badge-group"><circle cx="30.5" cy="39.22" r="3.5" fill="#aebf09"/><text class="num-single" x="30.5" y="39.22" dx="0" dy="-0.5">3</text></g>
