<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (療)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #療-bg[i]: Thời gian quả bóng số nảy lên
   - #療-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#療-bg1  { animation-delay: 0.05s; }
#療-s1   { stroke-dasharray: 10.1848; stroke-dashoffset: 10.1848; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#療-bg2  { animation-delay: 0.42s; }
#療-s2   { stroke-dasharray: 60.8707; stroke-dashoffset: 60.8707; animation: drawStroke 0.33s ease-out 0.55s forwards; }
#療-bg3  { animation-delay: 0.90s; }
#療-s3   { stroke-dasharray: 67.1910; stroke-dashoffset: 67.1910; animation: drawStroke 0.37s ease-out 1.03s forwards; }
#療-bg4  { animation-delay: 1.42s; }
#療-s4   { stroke-dasharray: 11.8431; stroke-dashoffset: 11.8431; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#療-bg5  { animation-delay: 1.79s; }
#療-s5   { stroke-dasharray: 17.9540; stroke-dashoffset: 17.9540; animation: drawStroke 0.22s ease-out 1.92s forwards; }
#療-bg6  { animation-delay: 2.16s; }
#療-s6   { stroke-dasharray: 42.3018; stroke-dashoffset: 42.3018; animation: drawStroke 0.23s ease-out 2.29s forwards; }
#療-bg7  { animation-delay: 2.54s; }
#療-s7   { stroke-dasharray: 45.4338; stroke-dashoffset: 45.4338; animation: drawStroke 0.25s ease-out 2.67s forwards; }
#療-bg8  { animation-delay: 2.94s; }
#療-s8   { stroke-dasharray: 34.2081; stroke-dashoffset: 34.2081; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#療-bg9  { animation-delay: 3.31s; }
#療-s9   { stroke-dasharray: 9.3066; stroke-dashoffset: 9.3066; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#療-bg10  { animation-delay: 3.68s; }
#療-s10   { stroke-dasharray: 8.7397; stroke-dashoffset: 8.7397; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#療-bg11  { animation-delay: 4.05s; }
#療-s11   { stroke-dasharray: 21.3258; stroke-dashoffset: 21.3258; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#療-bg12  { animation-delay: 4.42s; }
#療-s12   { stroke-dasharray: 49.6904; stroke-dashoffset: 49.6904; animation: drawStroke 0.27s ease-out 4.55s forwards; }
#療-bg13  { animation-delay: 4.84s; }
#療-s13   { stroke-dasharray: 24.2705; stroke-dashoffset: 24.2705; animation: drawStroke 0.22s ease-out 4.97s forwards; }
#療-bg14  { animation-delay: 5.21s; }
#療-s14   { stroke-dasharray: 20.7598; stroke-dashoffset: 20.7598; animation: drawStroke 0.22s ease-out 5.34s forwards; }
#療-bg15  { animation-delay: 5.58s; }
#療-s15   { stroke-dasharray: 30.1429; stroke-dashoffset: 30.1429; animation: drawStroke 0.22s ease-out 5.71s forwards; }
#療-bg16  { animation-delay: 5.95s; }
#療-s16   { stroke-dasharray: 19.6566; stroke-dashoffset: 19.6566; animation: drawStroke 0.22s ease-out 6.08s forwards; }
#療-bg17  { animation-delay: 6.32s; }
#療-s17   { stroke-dasharray: 17.5627; stroke-dashoffset: 17.5627; animation: drawStroke 0.22s ease-out 6.45s forwards; }
]]>
</style>

