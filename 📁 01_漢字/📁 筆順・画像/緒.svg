<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (緒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #緒-bg[i]: Thời gian quả bóng số nảy lên
   - #緒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#緒-bg1  { animation-delay: 0.05s; }
#緒-s1   { stroke-dasharray: 36.9506; stroke-dashoffset: 36.9506; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#緒-bg2  { animation-delay: 0.42s; }
#緒-s2   { stroke-dasharray: 67.9275; stroke-dashoffset: 67.9275; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#緒-bg3  { animation-delay: 0.94s; }
#緒-s3   { stroke-dasharray: 13.6640; stroke-dashoffset: 13.6640; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#緒-bg4  { animation-delay: 1.31s; }
#緒-s4   { stroke-dasharray: 36.6693; stroke-dashoffset: 36.6693; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#緒-bg5  { animation-delay: 1.68s; }
#緒-s5   { stroke-dasharray: 21.9430; stroke-dashoffset: 21.9430; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#緒-bg6  { animation-delay: 2.05s; }
#緒-s6   { stroke-dasharray: 15.5191; stroke-dashoffset: 15.5191; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#緒-bg7  { animation-delay: 2.42s; }
#緒-s7   { stroke-dasharray: 27.2566; stroke-dashoffset: 27.2566; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#緒-bg8  { animation-delay: 2.79s; }
#緒-s8   { stroke-dasharray: 30.3260; stroke-dashoffset: 30.3260; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#緒-bg9  { animation-delay: 3.16s; }
#緒-s9   { stroke-dasharray: 54.9497; stroke-dashoffset: 54.9497; animation: drawStroke 0.30s ease-out 3.29s forwards; }
#緒-bg10  { animation-delay: 3.61s; }
#緒-s10   { stroke-dasharray: 67.6415; stroke-dashoffset: 67.6415; animation: drawStroke 0.37s ease-out 3.74s forwards; }
#緒-bg11  { animation-delay: 4.13s; }
#緒-s11   { stroke-dasharray: 34.1366; stroke-dashoffset: 34.1366; animation: drawStroke 0.22s ease-out 4.26s forwards; }
#緒-bg12  { animation-delay: 4.50s; }
#緒-s12   { stroke-dasharray: 56.1249; stroke-dashoffset: 56.1249; animation: drawStroke 0.31s ease-out 4.63s forwards; }
#緒-bg13  { animation-delay: 4.96s; }
#緒-s13   { stroke-dasharray: 20.7373; stroke-dashoffset: 20.7373; animation: drawStroke 0.22s ease-out 5.09s forwards; }
#緒-bg14  { animation-delay: 5.33s; }
#緒-s14   { stroke-dasharray: 20.5764; stroke-dashoffset: 20.5764; animation: drawStroke 0.22s ease-out 5.46s forwards; }
]]>
</style>

