<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (涼)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #涼-bg[i]: Thời gian quả bóng số nảy lên
   - #涼-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#涼-bg1  { animation-delay: 0.05s; }
#涼-s1   { stroke-dasharray: 14.1139; stroke-dashoffset: 14.1139; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#涼-bg2  { animation-delay: 0.42s; }
#涼-s2   { stroke-dasharray: 13.8367; stroke-dashoffset: 13.8367; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#涼-bg3  { animation-delay: 0.79s; }
#涼-s3   { stroke-dasharray: 23.3807; stroke-dashoffset: 23.3807; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#涼-bg4  { animation-delay: 1.16s; }
#涼-s4   { stroke-dasharray: 12.1910; stroke-dashoffset: 12.1910; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#涼-bg5  { animation-delay: 1.53s; }
#涼-s5   { stroke-dasharray: 58.0765; stroke-dashoffset: 58.0765; animation: drawStroke 0.32s ease-out 1.66s forwards; }
#涼-bg6  { animation-delay: 2.00s; }
#涼-s6   { stroke-dasharray: 20.3033; stroke-dashoffset: 20.3033; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#涼-bg7  { animation-delay: 2.37s; }
#涼-s7   { stroke-dasharray: 51.8463; stroke-dashoffset: 51.8463; animation: drawStroke 0.29s ease-out 2.50s forwards; }
#涼-bg8  { animation-delay: 2.81s; }
#涼-s8   { stroke-dasharray: 32.4110; stroke-dashoffset: 32.4110; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#涼-bg9  { animation-delay: 3.18s; }
#涼-s9   { stroke-dasharray: 46.4149; stroke-dashoffset: 46.4149; animation: drawStroke 0.26s ease-out 3.31s forwards; }
#涼-bg10  { animation-delay: 3.59s; }
#涼-s10   { stroke-dasharray: 24.2066; stroke-dashoffset: 24.2066; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#涼-bg11  { animation-delay: 3.96s; }
#涼-s11   { stroke-dasharray: 24.5890; stroke-dashoffset: 24.5890; animation: drawStroke 0.22s ease-out 4.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #涼-s[i]) -->
<path id="涼-s1"  class="stroke" stroke="#bf0909" d="M19.38,17C23.13,18.65,27.869999999999997,23.25,29.75,26.34"/>
<path id="涼-s2"  class="stroke" stroke="#bf6c09" d="M13.75,39C17.46,40.5,23.07,45.67,24,48"/>
