<path id="涼-s5"  class="stroke" stroke="#09bf2a" d="M38.25,27C41.87,27.75,45.21,27.36,48.88,26.91C60.38,25.5,76.30000000000001,24.1,86.88,23.35C89.8,23.14,93.22,22.520000000000003,96.00999999999999,23.650000000000002"/>
<path id="涼-s6"  class="stroke" stroke="#09bf8d" d="M47.11,40.32C47.89,41.1,48.38,41.87,48.65,43.47C49.17,46.58,49.9,50.92,50.57,55.519999999999996C50.79,56.99999999999999,51.02,58.49999999999999,51.28,59.989999999999995"/>
<path id="涼-s7"  class="stroke" stroke="#098dbf" d="M48.97,41.36C58.879999999999995,40.25,75.75,38.11,81.52,37.5C83.91,37.25,85.38,38.77,84.66,41.75C83.75999999999999,45.5,83.25999999999999,47.87,81.81,54"/>
<path id="涼-s8"  class="stroke" stroke="#092abf" d="M51.92,57.53C60.24,56.85,70.57,55.82,80.01,55.230000000000004C81.44000000000001,55.14,82.85000000000001,55.06,84.23,55.00000000000001"/>
<path id="涼-s9"  class="stroke" stroke="#4b09bf" d="M66.17,59.08C67.23,60.14,67.55,61.62,67.55,63.86C67.55,69,67.57,87.59,67.57,92.00999999999999C67.57,101.47999999999999,61.099999999999994,92.52999999999999,59.74999999999999,91.21999999999998"/>
<path id="涼-s10"  class="stroke" stroke="#ae09bf" d="M48.7,70C48.81,71.02,48.68,72,48.300000000000004,72.93C45.75000000000001,77.5,42.39,82.30000000000001,34.89,89.25"/>
<path id="涼-s11"  class="stroke" stroke="#bf096c" d="M82.76,68.5C88.23,72.15,95.78,82.32,97.15,88"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="涼-bg1"  class="badge-group"><circle cx="19.38" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="19.38" y="17" dx="0" dy="-0.5">1</text></g>
<g id="涼-bg2"  class="badge-group"><circle cx="13.75" cy="39" r="3.5" fill="#bf6c09"/><text class="num-single" x="13.75" y="39" dx="0" dy="-0.5">2</text></g>
