<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (角)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #角-bg[i]: Thời gian quả bóng số nảy lên
   - #角-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#角-bg1  { animation-delay: 0.05s; }
#角-s1   { stroke-dasharray: 31.7679; stroke-dashoffset: 31.7679; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#角-bg2  { animation-delay: 0.42s; }
#角-s2   { stroke-dasharray: 47.5932; stroke-dashoffset: 47.5932; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#角-bg3  { animation-delay: 0.83s; }
#角-s3   { stroke-dasharray: 64.2606; stroke-dashoffset: 64.2606; animation: drawStroke 0.35s ease-out 0.96s forwards; }
#角-bg4  { animation-delay: 1.33s; }
#角-s4   { stroke-dasharray: 118.0720; stroke-dashoffset: 118.0720; animation: drawStroke 0.55s ease-out 1.46s forwards; }
#角-bg5  { animation-delay: 2.03s; }
#角-s5   { stroke-dasharray: 30.6545; stroke-dashoffset: 30.6545; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#角-bg6  { animation-delay: 2.40s; }
#角-s6   { stroke-dasharray: 47.1058; stroke-dashoffset: 47.1058; animation: drawStroke 0.26s ease-out 2.53s forwards; }
#角-bg7  { animation-delay: 2.81s; }
#角-s7   { stroke-dasharray: 46.9470; stroke-dashoffset: 46.9470; animation: drawStroke 0.26s ease-out 2.94s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #角-s[i]) -->
<path id="角-s1"  class="stroke" stroke="#bf0909" d="M46.75,12C46.92,13.49,46.45,14.79,45.72,16.05C42.92,20.92,35.019999999999996,28.87,25.25,34"/>
<path id="角-s2"  class="stroke" stroke="#bfa509" d="M49,16C54,16.25,63.12,15,68,13.75C71.06,12.96,71.88,15.16,70.5,17C66,23,61.25,28.75,56.5,34.5"/>
<path id="角-s3"  class="stroke" stroke="#3dbf09" d="M30.38,36.5C31.18,37.31,31.48,38.7,31.48,40.93C31.48,70.25,31.75,84.5,20.75,98.25"/>
<path id="角-s4"  class="stroke" stroke="#09bf71" d="M31.75,38.7C47.37,37.25,69,35.620000000000005,74.22,35.24C79.23,34.870000000000005,79.97,37.870000000000005,79.97,41.45C79.97,42.790000000000006,79.78,73.75,79.78,90.63C79.78,103.25,73.99,96,71.24000000000001,92.75"/>
<path id="角-s5"  class="stroke" stroke="#0971bf" d="M53.29,38.87C53.37,39.11,54.39,40.11,54.39,41.64C54.39,49.13,54.42,65.51,54.42,69.26"/>
<path id="角-s6"  class="stroke" stroke="#3d09bf" d="M32.25,54.6C40.37,54,68,51.75,79.25,51.5"/>
<path id="角-s7"  class="stroke" stroke="#bf09a5" d="M31.74,71.5C41.75,70.75,67.25,69,78.59,68.5"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="角-bg1"  class="badge-group"><circle cx="46.75" cy="8.5" r="3.5" fill="#bf0909"/><text class="num-single" x="46.75" y="8.5" dx="0" dy="-0.5">1</text></g>
<g id="角-bg2"  class="badge-group"><circle cx="49" cy="19.5" r="3.5" fill="#bfa509"/><text class="num-single" x="49" y="19.5" dx="0" dy="-0.5">2</text></g>
<g id="角-bg3"  class="badge-group"><circle cx="30.38" cy="33.0" r="3.5" fill="#3dbf09"/><text class="num-single" x="30.38" y="33.0" dx="0" dy="-0.5">3</text></g>
<g id="角-bg4"  class="badge-group"><circle cx="31.75" cy="42.2" r="3.5" fill="#09bf71"/><text class="num-single" x="31.75" y="42.2" dx="0" dy="-0.5">4</text></g>
<g id="角-bg5"  class="badge-group"><circle cx="53.29" cy="38.87" r="3.5" fill="#0971bf"/><text class="num-single" x="53.29" y="38.87" dx="0" dy="-0.5">5</text></g>
<g id="角-bg6"  class="badge-group"><circle cx="32.25" cy="54.6" r="3.5" fill="#3d09bf"/><text class="num-single" x="32.25" y="54.6" dx="0" dy="-0.5">6</text></g>
<g id="角-bg7"  class="badge-group"><circle cx="31.74" cy="71.5" r="3.5" fill="#bf09a5"/><text class="num-single" x="31.74" y="71.5" dx="0" dy="-0.5">7</text></g>
</svg>