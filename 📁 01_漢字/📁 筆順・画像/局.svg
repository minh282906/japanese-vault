<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (局)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #局-bg[i]: Thời gian quả bóng số nảy lên
   - #局-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#局-bg1  { animation-delay: 0.05s; }
#局-s1   { stroke-dasharray: 67.5807; stroke-dashoffset: 67.5807; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#局-bg2  { animation-delay: 0.57s; }
#局-s2   { stroke-dasharray: 46.3902; stroke-dashoffset: 46.3902; animation: drawStroke 0.26s ease-out 0.70s forwards; }
#局-bg3  { animation-delay: 0.98s; }
#局-s3   { stroke-dasharray: 72.3493; stroke-dashoffset: 72.3493; animation: drawStroke 0.40s ease-out 1.11s forwards; }
#局-bg4  { animation-delay: 1.53s; }
#局-s4   { stroke-dasharray: 124.6500; stroke-dashoffset: 124.6500; animation: drawStroke 0.55s ease-out 1.66s forwards; }
#局-bg5  { animation-delay: 2.23s; }
#局-s5   { stroke-dasharray: 18.1975; stroke-dashoffset: 18.1975; animation: drawStroke 0.22s ease-out 2.36s forwards; }
#局-bg6  { animation-delay: 2.60s; }
#局-s6   { stroke-dasharray: 43.3912; stroke-dashoffset: 43.3912; animation: drawStroke 0.24s ease-out 2.73s forwards; }
#局-bg7  { animation-delay: 2.99s; }
#局-s7   { stroke-dasharray: 25.2000; stroke-dashoffset: 25.2000; animation: drawStroke 0.22s ease-out 3.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #局-s[i]) -->
<path id="局-s1"  class="stroke" stroke="#bf0909" d="M30.06,17.38C31.74,17.91,34.01,17.99,35.8,17.83C46.25,16.88,73.85,13.579999999999998,77.74,13.319999999999999C80.49,13.129999999999999,82.11999999999999,14.509999999999998,81.24,17.009999999999998C79.46,22.089999999999996,78.49,24.759999999999998,76.96,29.54"/>
<path id="局-s2"  class="stroke" stroke="#bfa509" d="M33.28,35.03C37.42,34.64,63.41,31.880000000000003,75,30.8C76.94,30.62,78.48,30.490000000000002,79.44,30.42"/>
<path id="局-s3"  class="stroke" stroke="#3dbf09" d="M32.44,18.71C33.23,20.02,33.55,21.400000000000002,33.39,22.85C32.480000000000004,51.94,26.61,74.28999999999999,15.5,87.25999999999999"/>
<path id="局-s4"  class="stroke" stroke="#09bf71" d="M33.73,48.65C36.29,49.15,38.83,48.72,41.37,48.37C53.67,46.699999999999996,70.09,44.5,84.99,42.739999999999995C92.00999999999999,41.91,92.83,45.49999999999999,92.49,48.989999999999995C91.28999999999999,61.3,87.24,79.61,82.49,91.74C78.52,101.86999999999999,73.44999999999999,94.55999999999999,70.49,90.99"/>
<path id="局-s5"  class="stroke" stroke="#0971bf" d="M38,63.47C38.64,64,39.01,64.67999999999999,39.13,65.5C39.970000000000006,68.38,40.830000000000005,73.56,41.480000000000004,77.99C41.64,79.07,41.790000000000006,80.11,41.92,81.05999999999999"/>
<path id="局-s6"  class="stroke" stroke="#3d09bf" d="M39.96,64.5C47.65,63.24,61.68,61.42,65.64,60.92C68,60.620000000000005,69,62.120000000000005,68.51,64.14C67.59,67.9,67.13000000000001,69.62,65.33,75.85"/>
<path id="局-s7"  class="stroke" stroke="#bf09a5" d="M42.23,79.32C46.08,78.91999999999999,56.62,77.63999999999999,63.51,76.94C64.96,76.78999999999999,66.25,76.67,67.28,76.58"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="局-bg1"  class="badge-group"><circle cx="30.06" cy="13.88" r="3.5" fill="#bf0909"/><text class="num-single" x="30.06" y="13.88" dx="0" dy="-0.5">1</text></g>
<g id="局-bg2"  class="badge-group"><circle cx="33.28" cy="35.03" r="3.5" fill="#bfa509"/><text class="num-single" x="33.28" y="35.03" dx="0" dy="-0.5">2</text></g>
<g id="局-bg3"  class="badge-group"><circle cx="32.44" cy="22.21" r="3.5" fill="#3dbf09"/><text class="num-single" x="32.44" y="22.21" dx="0" dy="-0.5">3</text></g>
<g id="局-bg4"  class="badge-group"><circle cx="33.73" cy="48.65" r="3.5" fill="#09bf71"/><text class="num-single" x="33.73" y="48.65" dx="0" dy="-0.5">4</text></g>
<g id="局-bg5"  class="badge-group"><circle cx="38" cy="59.97" r="3.5" fill="#0971bf"/><text class="num-single" x="38" y="59.97" dx="0" dy="-0.5">5</text></g>
<g id="局-bg6"  class="badge-group"><circle cx="39.96" cy="68.0" r="3.5" fill="#3d09bf"/><text class="num-single" x="39.96" y="68.0" dx="0" dy="-0.5">6</text></g>
<g id="局-bg7"  class="badge-group"><circle cx="42.23" cy="79.32" r="3.5" fill="#bf09a5"/><text class="num-single" x="42.23" y="79.32" dx="0" dy="-0.5">7</text></g>
</svg>