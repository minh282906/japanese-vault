<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (賢)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #賢-bg[i]: Thời gian quả bóng số nảy lên
   - #賢-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#賢-bg1  { animation-delay: 0.05s; }
#賢-s1   { stroke-dasharray: 36.2114; stroke-dashoffset: 36.2114; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#賢-bg2  { animation-delay: 0.42s; }
#賢-s2   { stroke-dasharray: 25.8601; stroke-dashoffset: 25.8601; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#賢-bg3  { animation-delay: 0.79s; }
#賢-s3   { stroke-dasharray: 8.8589; stroke-dashoffset: 8.8589; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#賢-bg4  { animation-delay: 1.16s; }
#賢-s4   { stroke-dasharray: 33.5104; stroke-dashoffset: 33.5104; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#賢-bg5  { animation-delay: 1.53s; }
#賢-s5   { stroke-dasharray: 23.2449; stroke-dashoffset: 23.2449; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#賢-bg6  { animation-delay: 1.90s; }
#賢-s6   { stroke-dasharray: 8.5504; stroke-dashoffset: 8.5504; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#賢-bg7  { animation-delay: 2.27s; }
#賢-s7   { stroke-dasharray: 23.8370; stroke-dashoffset: 23.8370; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#賢-bg8  { animation-delay: 2.64s; }
#賢-s8   { stroke-dasharray: 63.6740; stroke-dashoffset: 63.6740; animation: drawStroke 0.35s ease-out 2.77s forwards; }
#賢-bg9  { animation-delay: 3.14s; }
#賢-s9   { stroke-dasharray: 39.1825; stroke-dashoffset: 39.1825; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#賢-bg10  { animation-delay: 3.51s; }
#賢-s10   { stroke-dasharray: 33.5075; stroke-dashoffset: 33.5075; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#賢-bg11  { animation-delay: 3.88s; }
#賢-s11   { stroke-dasharray: 63.3378; stroke-dashoffset: 63.3378; animation: drawStroke 0.35s ease-out 4.01s forwards; }
#賢-bg12  { animation-delay: 4.38s; }
#賢-s12   { stroke-dasharray: 30.7275; stroke-dashoffset: 30.7275; animation: drawStroke 0.22s ease-out 4.51s forwards; }
#賢-bg13  { animation-delay: 4.75s; }
#賢-s13   { stroke-dasharray: 30.8395; stroke-dashoffset: 30.8395; animation: drawStroke 0.22s ease-out 4.88s forwards; }
#賢-bg14  { animation-delay: 5.12s; }
#賢-s14   { stroke-dasharray: 30.8197; stroke-dashoffset: 30.8197; animation: drawStroke 0.22s ease-out 5.25s forwards; }
#賢-bg15  { animation-delay: 5.49s; }
#賢-s15   { stroke-dasharray: 19.2635; stroke-dashoffset: 19.2635; animation: drawStroke 0.22s ease-out 5.62s forwards; }
#賢-bg16  { animation-delay: 5.86s; }
#賢-s16   { stroke-dasharray: 17.5373; stroke-dashoffset: 17.5373; animation: drawStroke 0.22s ease-out 5.99s forwards; }
]]>
</style>

