<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (低)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #低-bg[i]: Thời gian quả bóng số nảy lên
   - #低-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#低-bg1  { animation-delay: 0.05s; }
#低-s1   { stroke-dasharray: 43.7067; stroke-dashoffset: 43.7067; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#低-bg2  { animation-delay: 0.44s; }
#低-s2   { stroke-dasharray: 54.8860; stroke-dashoffset: 54.8860; animation: drawStroke 0.30s ease-out 0.57s forwards; }
#低-bg3  { animation-delay: 0.89s; }
#低-s3   { stroke-dasharray: 29.8662; stroke-dashoffset: 29.8662; animation: drawStroke 0.22s ease-out 1.02s forwards; }
#低-bg4  { animation-delay: 1.26s; }
#低-s4   { stroke-dasharray: 69.1606; stroke-dashoffset: 69.1606; animation: drawStroke 0.38s ease-out 1.39s forwards; }
#低-bg5  { animation-delay: 1.79s; }
#低-s5   { stroke-dasharray: 42.1752; stroke-dashoffset: 42.1752; animation: drawStroke 0.23s ease-out 1.92s forwards; }
#低-bg6  { animation-delay: 2.17s; }
#低-s6   { stroke-dasharray: 80.9664; stroke-dashoffset: 80.9664; animation: drawStroke 0.45s ease-out 2.30s forwards; }
#低-bg7  { animation-delay: 2.77s; }
#低-s7   { stroke-dasharray: 37.9514; stroke-dashoffset: 37.9514; animation: drawStroke 0.22s ease-out 2.90s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #低-s[i]) -->
<path id="低-s1"  class="stroke" stroke="#bf0909" d="M31.76,18.25C32,19.63,32,20.87,31.450000000000003,22.23C27.15,32.75,20.41,42.48,9.5,55.04"/>
<path id="低-s2"  class="stroke" stroke="#bfa509" d="M24.03,40.25C25.080000000000002,41.3,25.53,42.69,25.53,44.37C25.53,55.42,25.51,75.52,25.5,87.25C25.5,90.53,25.5,93.16,25.5,94.75"/>
<path id="低-s3"  class="stroke" stroke="#3dbf09" d="M71.24,13.11C71.30999999999999,13.52,71.39,14.16,71.1,14.75C69.41,18.2,61.5,25,48.35,30.8"/>
<path id="低-s4"  class="stroke" stroke="#09bf71" d="M46.16,29.7C47.29,30.83,47.73,32.25,47.73,33.74C47.73,35.71,47.559999999999995,72.43,47.559999999999995,75.5C47.559999999999995,78.57,48.339999999999996,79.04,50.709999999999994,77C53.74999999999999,74.38,61.379999999999995,68.38,64.38999999999999,66.52"/>
<path id="低-s5"  class="stroke" stroke="#0971bf" d="M49.03,50.82C49.67,51.03,50.86,50.65,51.5,50.53C60.5,48.75,76.5,45,84.53,42.65C86.37,42.11,88.26,41.87,90.16,42.24"/>
<path id="低-s6"  class="stroke" stroke="#3d09bf" d="M63.15,26.32C64.37,27.25,65.05,28.63,65.24,30.25C67.88,52.5,75.62,73.88,93.15,87.1C99.19000000000001,91.64999999999999,97.51,84.03,97.51,81.39999999999999"/>
<path id="低-s7"  class="stroke" stroke="#bf09a5" d="M45.25,94.14C47,94.5,49.14,94.56,50.99,94.29C58.870000000000005,93.13000000000001,71.11,91.97000000000001,77.25,91.42C79.16,91.25,81.37,91.25,83,91.51"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="低-bg1"  class="badge-group"><circle cx="31.76" cy="18.25" r="3.5" fill="#bf0909"/><text class="num-single" x="31.76" y="18.25" dx="0" dy="-0.5">1</text></g>
<g id="低-bg2"  class="badge-group"><circle cx="24.03" cy="40.25" r="3.5" fill="#bfa509"/><text class="num-single" x="24.03" y="40.25" dx="0" dy="-0.5">2</text></g>
<g id="低-bg3"  class="badge-group"><circle cx="71.24" cy="13.11" r="3.5" fill="#3dbf09"/><text class="num-single" x="71.24" y="13.11" dx="0" dy="-0.5">3</text></g>
<g id="低-bg4"  class="badge-group"><circle cx="46.16" cy="29.7" r="3.5" fill="#09bf71"/><text class="num-single" x="46.16" y="29.7" dx="0" dy="-0.5">4</text></g>
<g id="低-bg5"  class="badge-group"><circle cx="49.03" cy="50.82" r="3.5" fill="#0971bf"/><text class="num-single" x="49.03" y="50.82" dx="0" dy="-0.5">5</text></g>
<g id="低-bg6"  class="badge-group"><circle cx="63.15" cy="26.32" r="3.5" fill="#3d09bf"/><text class="num-single" x="63.15" y="26.32" dx="0" dy="-0.5">6</text></g>
<g id="低-bg7"  class="badge-group"><circle cx="45.25" cy="94.14" r="3.5" fill="#bf09a5"/><text class="num-single" x="45.25" y="94.14" dx="0" dy="-0.5">7</text></g>
</svg>