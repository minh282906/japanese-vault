<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (毛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #毛-bg[i]: Thời gian quả bóng số nảy lên
   - #毛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#毛-bg1  { animation-delay: 0.05s; }
#毛-s1   { stroke-dasharray: 43.5051; stroke-dashoffset: 43.5051; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#毛-bg2  { animation-delay: 0.44s; }
#毛-s2   { stroke-dasharray: 56.8481; stroke-dashoffset: 56.8481; animation: drawStroke 0.31s ease-out 0.57s forwards; }
#毛-bg3  { animation-delay: 0.90s; }
#毛-s3   { stroke-dasharray: 72.9936; stroke-dashoffset: 72.9936; animation: drawStroke 0.40s ease-out 1.03s forwards; }
#毛-bg4  { animation-delay: 1.45s; }
#毛-s4   { stroke-dasharray: 117.9540; stroke-dashoffset: 117.9540; animation: drawStroke 0.55s ease-out 1.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #毛-s[i]) -->
<path id="毛-s1"  class="stroke" stroke="#bf0909" d="M61.75,13.25C61.5,14.75,60.69,16.009999999999998,59.71,16.75C54.38,20.75,42.5,26.369999999999997,23.25,31"/>
<path id="毛-s2"  class="stroke" stroke="#64bf09" d="M20.5,47.79C23.25,48.63,26.19,48.23,28.869999999999997,47.87C40.709999999999994,46.26,55.25,42.879999999999995,69.02,40.94C71.47999999999999,40.589999999999996,74.17,40.129999999999995,76.61999999999999,40.83"/>
<path id="毛-s3"  class="stroke" stroke="#09bfbf" d="M13,69.12C16.09,69.89,19.77,69.89,22.89,69.35000000000001C43,65.88000000000001,57.38,62.75000000000001,76.73,60.150000000000006C79.49000000000001,59.78000000000001,83.73,60.06,85.12,60.260000000000005"/>
<path id="毛-s4"  class="stroke" stroke="#6409bf" d="M44.24,28.87C45.370000000000005,30,45.59,31.42,45.6,33.49C45.67,43.65,45,75.98,45,80.75C45,91.75,47.5,94.53,69.74,94.53C90.5,94.53,93.5,92.75,93.5,81.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="毛-bg1"  class="badge-group"><circle cx="61.75" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="61.75" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="毛-bg2"  class="badge-group"><circle cx="20.5" cy="47.79" r="3.5" fill="#64bf09"/><text class="num-single" x="20.5" y="47.79" dx="0" dy="-0.5">2</text></g>
<g id="毛-bg3"  class="badge-group"><circle cx="13" cy="69.12" r="3.5" fill="#09bfbf"/><text class="num-single" x="13" y="69.12" dx="0" dy="-0.5">3</text></g>
<g id="毛-bg4"  class="badge-group"><circle cx="44.24" cy="28.87" r="3.5" fill="#6409bf"/><text class="num-single" x="44.24" y="28.87" dx="0" dy="-0.5">4</text></g>
</svg>