<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (向)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #向-bg[i]: Thời gian quả bóng số nảy lên
   - #向-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#向-bg1  { animation-delay: 0.05s; }
#向-s1   { stroke-dasharray: 29.4952; stroke-dashoffset: 29.4952; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#向-bg2  { animation-delay: 0.42s; }
#向-s2   { stroke-dasharray: 45.7724; stroke-dashoffset: 45.7724; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#向-bg3  { animation-delay: 0.82s; }
#向-s3   { stroke-dasharray: 130.6010; stroke-dashoffset: 130.6010; animation: drawStroke 0.55s ease-out 0.95s forwards; }
#向-bg4  { animation-delay: 1.52s; }
#向-s4   { stroke-dasharray: 20.5246; stroke-dashoffset: 20.5246; animation: drawStroke 0.22s ease-out 1.65s forwards; }
#向-bg5  { animation-delay: 1.89s; }
#向-s5   { stroke-dasharray: 43.7867; stroke-dashoffset: 43.7867; animation: drawStroke 0.24s ease-out 2.02s forwards; }
#向-bg6  { animation-delay: 2.28s; }
#向-s6   { stroke-dasharray: 25.1791; stroke-dashoffset: 25.1791; animation: drawStroke 0.22s ease-out 2.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #向-s[i]) -->
<path id="向-s1"  class="stroke" stroke="#bf0909" d="M49.51,18.39C49.75,19.37,49.55,20.47,49.18,21.240000000000002C45.62,28.5,43,32.75,34.06,42.97"/>
<path id="向-s2"  class="stroke" stroke="#bfbf09" d="M18.75,42.5C19.75,43.5,20.41,44.78,20.53,46.14C20.94,51.05,21.71,70.28,22.11,82.87C22.169999999999998,84.65,22.21,86.29,22.25,87.74000000000001"/>
<path id="向-s3"  class="stroke" stroke="#09bf09" d="M21.35,45.1C37.38,43.25,82.48,37.93,84.32,37.67C87.25,37.25,91.05999999999999,39.22,90.97999999999999,43C90.75999999999999,52.76,87.30999999999999,76.44,84.49,85.28C81.12,95.75,78.62,90.12,76,86"/>
<path id="向-s4"  class="stroke" stroke="#09bfbf" d="M38.75,55.53C39.55,56.33,40.04,57.43,40.1,57.93C40.77,63.48,41.230000000000004,66.76,42.07,72.51C42.2,73.44000000000001,42.35,74.43,42.5,75.5"/>
<path id="向-s5"  class="stroke" stroke="#0909bf" d="M41.03,57.28C51.370000000000005,55.75,58.260000000000005,54.84,65.78,53.74C68.25,53.38,69.13,54.88,68.75,56.5C67.75,60.85,66.5,64,65.42,69.88"/>
<path id="向-s6"  class="stroke" stroke="#bf09bf" d="M43.52,73.26C49.13,72.76,56.5,71.88000000000001,65.12,71.02000000000001C66.28,70.9,67.44,70.93,68.58,70.91000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="向-bg1"  class="badge-group"><circle cx="49.51" cy="18.39" r="3.5" fill="#bf0909"/><text class="num-single" x="49.51" y="18.39" dx="0" dy="-0.5">1</text></g>
<g id="向-bg2"  class="badge-group"><circle cx="18.75" cy="39.0" r="3.5" fill="#bfbf09"/><text class="num-single" x="18.75" y="39.0" dx="0" dy="-0.5">2</text></g>
<g id="向-bg3"  class="badge-group"><circle cx="21.35" cy="48.6" r="3.5" fill="#09bf09"/><text class="num-single" x="21.35" y="48.6" dx="0" dy="-0.5">3</text></g>
<g id="向-bg4"  class="badge-group"><circle cx="38.75" cy="52.03" r="3.5" fill="#09bfbf"/><text class="num-single" x="38.75" y="52.03" dx="0" dy="-0.5">4</text></g>
<g id="向-bg5"  class="badge-group"><circle cx="41.03" cy="60.78" r="3.5" fill="#0909bf"/><text class="num-single" x="41.03" y="60.78" dx="0" dy="-0.5">5</text></g>
<g id="向-bg6"  class="badge-group"><circle cx="43.52" cy="73.26" r="3.5" fill="#bf09bf"/><text class="num-single" x="43.52" y="73.26" dx="0" dy="-0.5">6</text></g>
</svg>