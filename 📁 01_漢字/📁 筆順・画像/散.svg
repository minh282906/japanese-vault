<path id="散-s7"  class="stroke" stroke="#09bfbf" d="M24.28,65.57C30.1,64.72,38.36,63.68999999999999,43.47,63.269999999999996"/>
<path id="散-s8"  class="stroke" stroke="#0964bf" d="M24.21,77.03C28.75,76.6,38.44,75.33,43.69,75.04"/>
