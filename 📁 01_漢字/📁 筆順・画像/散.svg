<path id="散-s10"  class="stroke" stroke="#6409bf" d="M66.82,39.02C68.38,39.13,69.41999999999999,39,70.07,38.92C73.19,38.54,84.13,36.38,89,35.25C90.12,34.99,92.25,34.87,93.31,35.15"/>
<path id="散-s11"  class="stroke" stroke="#bf09bf" d="M79.54,41.43C80.02000000000001,42.74,80.28,44.42,79.78,46.82C75.24,68.55,64.97,85.63,49.97,94.75"/>
<path id="散-s12"  class="stroke" stroke="#bf0964" d="M57.98,51.64C60.87,52.75,77.27,78.13,87.06,88.3C89.35000000000001,90.67,91.5,92.37,94.62,93.62"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="散-bg1"  class="badge-group"><circle cx="18.25" cy="30.21" r="3.5" fill="#bf0909"/><text class="num-single" x="18.25" y="30.21" dx="0" dy="-0.5">1</text></g>
