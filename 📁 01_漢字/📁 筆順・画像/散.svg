<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (散)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #散-bg[i]: Thời gian quả bóng số nảy lên
   - #散-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#散-bg1  { animation-delay: 0.05s; }
#散-s1   { stroke-dasharray: 34.2680; stroke-dashoffset: 34.2680; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#散-bg2  { animation-delay: 0.42s; }
#散-s2   { stroke-dasharray: 24.9877; stroke-dashoffset: 24.9877; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#散-bg3  { animation-delay: 0.79s; }
#散-s3   { stroke-dasharray: 28.2631; stroke-dashoffset: 28.2631; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#散-bg4  { animation-delay: 1.16s; }
#散-s4   { stroke-dasharray: 41.9947; stroke-dashoffset: 41.9947; animation: drawStroke 0.23s ease-out 1.29s forwards; }
#散-bg5  { animation-delay: 1.54s; }
#散-s5   { stroke-dasharray: 41.9096; stroke-dashoffset: 41.9096; animation: drawStroke 0.23s ease-out 1.67s forwards; }
#散-bg6  { animation-delay: 1.92s; }
#散-s6   { stroke-dasharray: 67.8716; stroke-dashoffset: 67.8716; animation: drawStroke 0.37s ease-out 2.05s forwards; }
#散-bg7  { animation-delay: 2.44s; }
#散-s7   { stroke-dasharray: 19.3298; stroke-dashoffset: 19.3298; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#散-bg8  { animation-delay: 2.81s; }
#散-s8   { stroke-dasharray: 19.5832; stroke-dashoffset: 19.5832; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#散-bg9  { animation-delay: 3.18s; }
#散-s9   { stroke-dasharray: 42.2923; stroke-dashoffset: 42.2923; animation: drawStroke 0.23s ease-out 3.31s forwards; }
#散-bg10  { animation-delay: 3.56s; }
#散-s10   { stroke-dasharray: 26.8834; stroke-dashoffset: 26.8834; animation: drawStroke 0.22s ease-out 3.69s forwards; }
#散-bg11  { animation-delay: 3.93s; }
#散-s11   { stroke-dasharray: 63.5161; stroke-dashoffset: 63.5161; animation: drawStroke 0.35s ease-out 4.06s forwards; }
#散-bg12  { animation-delay: 4.43s; }
#散-s12   { stroke-dasharray: 56.1885; stroke-dashoffset: 56.1885; animation: drawStroke 0.31s ease-out 4.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #散-s[i]) -->
<path id="散-s1"  class="stroke" stroke="#bf0909" d="M18.25,30.21C20.14,30.62,21.89,30.560000000000002,23.79,30.3C30.25,29.42,43.01,27.47,47.72,27.09C49.87,26.919999999999998,51.17,27.22,52.25,27.36"/>
