<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (栄)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #栄-bg[i]: Thời gian quả bóng số nảy lên
   - #栄-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#栄-bg1  { animation-delay: 0.05s; }
#栄-s1   { stroke-dasharray: 14.9146; stroke-dashoffset: 14.9146; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#栄-bg2  { animation-delay: 0.42s; }
#栄-s2   { stroke-dasharray: 15.1695; stroke-dashoffset: 15.1695; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#栄-bg3  { animation-delay: 0.79s; }
#栄-s3   { stroke-dasharray: 15.5796; stroke-dashoffset: 15.5796; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#栄-bg4  { animation-delay: 1.16s; }
#栄-s4   { stroke-dasharray: 16.6550; stroke-dashoffset: 16.6550; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#栄-bg5  { animation-delay: 1.53s; }
#栄-s5   { stroke-dasharray: 77.1565; stroke-dashoffset: 77.1565; animation: drawStroke 0.42s ease-out 1.66s forwards; }
#栄-bg6  { animation-delay: 2.10s; }
#栄-s6   { stroke-dasharray: 57.3317; stroke-dashoffset: 57.3317; animation: drawStroke 0.32s ease-out 2.23s forwards; }
#栄-bg7  { animation-delay: 2.57s; }
#栄-s7   { stroke-dasharray: 52.4430; stroke-dashoffset: 52.4430; animation: drawStroke 0.29s ease-out 2.70s forwards; }
#栄-bg8  { animation-delay: 3.01s; }
#栄-s8   { stroke-dasharray: 46.0708; stroke-dashoffset: 46.0708; animation: drawStroke 0.25s ease-out 3.14s forwards; }
#栄-bg9  { animation-delay: 3.41s; }
#栄-s9   { stroke-dasharray: 48.0071; stroke-dashoffset: 48.0071; animation: drawStroke 0.26s ease-out 3.54s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #栄-s[i]) -->
<path id="栄-s1"  class="stroke" stroke="#bf0909" d="M25.75,18C29.36,21.85,33.230000000000004,28.58,33.75,30.5"/>
<path id="栄-s2"  class="stroke" stroke="#bf8209" d="M48.25,13C50.13,16.5,52.5,22.119999999999997,53.25,27.25"/>
<path id="栄-s3"  class="stroke" stroke="#82bf09" d="M79,14C79.21,15.15,78.75,16.18,78.17,16.93C76.59,18.98,72.19,24.59,70.37,26.619999999999997"/>
<path id="栄-s4"  class="stroke" stroke="#09bf09" d="M21.62,38.25C21.51,42.05,18.92,52.15,18,54.47"/>
<path id="栄-s5"  class="stroke" stroke="#09bf82" d="M22.49,41.63C37.25,39.63,66.26,36.290000000000006,83.78999999999999,35.550000000000004C93.86999999999999,35.13,87.11999999999999,41.910000000000004,83.63999999999999,44.85000000000001"/>
<path id="栄-s6"  class="stroke" stroke="#0982bf" d="M24.5,60.25C27.04,61.1,30.04,60.71,32.64,60.45C42.35,59.480000000000004,59.91,56.790000000000006,73.5,56.13C75.93,56.010000000000005,78.76,56.120000000000005,81.51,56.5"/>
<path id="栄-s7"  class="stroke" stroke="#0909bf" d="M52.25,44C53.25,45,54,46.75,54,48.5C54,51.64,54,77.38,54,90.25C54,92.73,54,94.73,54,96"/>
<path id="栄-s8"  class="stroke" stroke="#8209bf" d="M51,59.5C51,60.12,50.58,61.03,50.04,61.82C43.29,71.9,29.12,84.84,17.62,90.25"/>
<path id="栄-s9"  class="stroke" stroke="#bf0982" d="M54.75,58.75C59.89,63.89,72.92,75.97,83,83.1C85.84,85.11,88.87,87,92.37,88.13"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="栄-bg1"  class="badge-group"><circle cx="25.75" cy="18" r="3.5" fill="#bf0909"/><text class="num-single" x="25.75" y="18" dx="0" dy="-0.5">1</text></g>
<g id="栄-bg2"  class="badge-group"><circle cx="48.25" cy="13" r="3.5" fill="#bf8209"/><text class="num-single" x="48.25" y="13" dx="0" dy="-0.5">2</text></g>
<g id="栄-bg3"  class="badge-group"><circle cx="79" cy="14" r="3.5" fill="#82bf09"/><text class="num-single" x="79" y="14" dx="0" dy="-0.5">3</text></g>
<g id="栄-bg4"  class="badge-group"><circle cx="21.62" cy="34.75" r="3.5" fill="#09bf09"/><text class="num-single" x="21.62" y="34.75" dx="0" dy="-0.5">4</text></g>
<g id="栄-bg5"  class="badge-group"><circle cx="22.49" cy="45.13" r="3.5" fill="#09bf82"/><text class="num-single" x="22.49" y="45.13" dx="0" dy="-0.5">5</text></g>
<g id="栄-bg6"  class="badge-group"><circle cx="24.5" cy="60.25" r="3.5" fill="#0982bf"/><text class="num-single" x="24.5" y="60.25" dx="0" dy="-0.5">6</text></g>
<g id="栄-bg7"  class="badge-group"><circle cx="52.25" cy="44" r="3.5" fill="#0909bf"/><text class="num-single" x="52.25" y="44" dx="0" dy="-0.5">7</text></g>
<g id="栄-bg8"  class="badge-group"><circle cx="51" cy="56.0" r="3.5" fill="#8209bf"/><text class="num-single" x="51" y="56.0" dx="0" dy="-0.5">8</text></g>
<g id="栄-bg9"  class="badge-group"><circle cx="54.75" cy="62.25" r="3.5" fill="#bf0982"/><text class="num-single" x="54.75" y="62.25" dx="0" dy="-0.5">9</text></g>
</svg>