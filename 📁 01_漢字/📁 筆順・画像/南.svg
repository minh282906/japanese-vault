<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (南)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #南-bg[i]: Thời gian quả bóng số nảy lên
   - #南-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#南-bg1  { animation-delay: 0.05s; }
#南-s1   { stroke-dasharray: 54.8275; stroke-dashoffset: 54.8275; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#南-bg2  { animation-delay: 0.50s; }
#南-s2   { stroke-dasharray: 32.8766; stroke-dashoffset: 32.8766; animation: drawStroke 0.22s ease-out 0.63s forwards; }
#南-bg3  { animation-delay: 0.87s; }
#南-s3   { stroke-dasharray: 49.5418; stroke-dashoffset: 49.5418; animation: drawStroke 0.27s ease-out 1.00s forwards; }
#南-bg4  { animation-delay: 1.29s; }
#南-s4   { stroke-dasharray: 130.3490; stroke-dashoffset: 130.3490; animation: drawStroke 0.55s ease-out 1.42s forwards; }
#南-bg5  { animation-delay: 1.99s; }
#南-s5   { stroke-dasharray: 12.4180; stroke-dashoffset: 12.4180; animation: drawStroke 0.22s ease-out 2.12s forwards; }
#南-bg6  { animation-delay: 2.36s; }
#南-s6   { stroke-dasharray: 13.7144; stroke-dashoffset: 13.7144; animation: drawStroke 0.22s ease-out 2.49s forwards; }
#南-bg7  { animation-delay: 2.73s; }
#南-s7   { stroke-dasharray: 40.4679; stroke-dashoffset: 40.4679; animation: drawStroke 0.22s ease-out 2.86s forwards; }
#南-bg8  { animation-delay: 3.10s; }
#南-s8   { stroke-dasharray: 43.9530; stroke-dashoffset: 43.9530; animation: drawStroke 0.24s ease-out 3.23s forwards; }
#南-bg9  { animation-delay: 3.49s; }
#南-s9   { stroke-dasharray: 33.4761; stroke-dashoffset: 33.4761; animation: drawStroke 0.22s ease-out 3.62s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #南-s[i]) -->
<path id="南-s1"  class="stroke" stroke="#bf0909" d="M27.38,28.25C29.2,28.63,31.58,28.7,34.6,28.45C46.120000000000005,27.5,62.97,25.25,75.18,24.75C78.21000000000001,24.63,80.10000000000001,24.52,82,24.75"/>
<path id="南-s2"  class="stroke" stroke="#bf8209" d="M52.35,10.75C53.300000000000004,11.7,53.9,13.61,53.9,14.71C53.9,22.01,53.9,34.18,53.9,43.25"/>
<path id="南-s3"  class="stroke" stroke="#82bf09" d="M20.25,45.75C21.5,47,22.14,48.49,22.25,50.75C22.44,54.81,23.08,77.78,23.37,88.74000000000001C23.45,91.97000000000001,23.5,94.22000000000001,23.5,94.75000000000001"/>
<path id="南-s4"  class="stroke" stroke="#09bf09" d="M22.78,47.6C39.09,45.84,82.1,41.25,83.75,41.25C88.75,41.25,90,42.87,90,48C90,53.25,89.75,85.3,89.75,91.05C89.75,98.75,86.25,97.5,80.25,92"/>
<path id="南-s5"  class="stroke" stroke="#09bf82" d="M38.5,49.38C41.08,51.120000000000005,45.16,56.52,45.81,59.22"/>
<path id="南-s6"  class="stroke" stroke="#0982bf" d="M66.25,45.5C66.3,46.39,66.18,47.25,65.88,48.09C65.08,50.82,63.129999999999995,55.010000000000005,60.62,57.75"/>
<path id="南-s7"  class="stroke" stroke="#0909bf" d="M34.78,61.67C36.59,62.06,39.33,62.22,41.14,62.06C50.25,61.260000000000005,59.769999999999996,60.52,68.77,59.67C71.75999999999999,59.39,73.6,59.35,75.1,59.550000000000004"/>
<path id="南-s8"  class="stroke" stroke="#8209bf" d="M33.13,74.19C34.940000000000005,74.67999999999999,37.68,75.02,39.510000000000005,74.92999999999999C50.24000000000001,74.36999999999999,62.17,72.99,70.55000000000001,72.27C73.55000000000001,72.00999999999999,75.37,72.25,76.88000000000001,72.5"/>
<path id="南-s9"  class="stroke" stroke="#bf0982" d="M53.5,62.5C54.25,63.25,54.5,64.64,54.49,66C54.45,72.22,54.34,84.46000000000001,54.28,91.26C54.26,93.45,54.25,95.07000000000001,54.25,95.75"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="南-bg1"  class="badge-group"><circle cx="27.38" cy="28.25" r="3.5" fill="#bf0909"/><text class="num-single" x="27.38" y="28.25" dx="0" dy="-0.5">1</text></g>
<g id="南-bg2"  class="badge-group"><circle cx="52.35" cy="10.75" r="3.5" fill="#bf8209"/><text class="num-single" x="52.35" y="10.75" dx="0" dy="-0.5">2</text></g>
<g id="南-bg3"  class="badge-group"><circle cx="20.25" cy="42.25" r="3.5" fill="#82bf09"/><text class="num-single" x="20.25" y="42.25" dx="0" dy="-0.5">3</text></g>
<g id="南-bg4"  class="badge-group"><circle cx="22.78" cy="51.1" r="3.5" fill="#09bf09"/><text class="num-single" x="22.78" y="51.1" dx="0" dy="-0.5">4</text></g>
<g id="南-bg5"  class="badge-group"><circle cx="38.5" cy="49.38" r="3.5" fill="#09bf82"/><text class="num-single" x="38.5" y="49.38" dx="0" dy="-0.5">5</text></g>
<g id="南-bg6"  class="badge-group"><circle cx="66.25" cy="45.5" r="3.5" fill="#0982bf"/><text class="num-single" x="66.25" y="45.5" dx="0" dy="-0.5">6</text></g>
<g id="南-bg7"  class="badge-group"><circle cx="34.78" cy="61.67" r="3.5" fill="#0909bf"/><text class="num-single" x="34.78" y="61.67" dx="0" dy="-0.5">7</text></g>
<g id="南-bg8"  class="badge-group"><circle cx="33.13" cy="74.19" r="3.5" fill="#8209bf"/><text class="num-single" x="33.13" y="74.19" dx="0" dy="-0.5">8</text></g>
<g id="南-bg9"  class="badge-group"><circle cx="53.5" cy="62.5" r="3.5" fill="#bf0982"/><text class="num-single" x="53.5" y="62.5" dx="0" dy="-0.5">9</text></g>
</svg>