<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (呼)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #呼-bg[i]: Thời gian quả bóng số nảy lên
   - #呼-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#呼-bg1  { animation-delay: 0.05s; }
#呼-s1   { stroke-dasharray: 25.5733; stroke-dashoffset: 25.5733; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#呼-bg2  { animation-delay: 0.42s; }
#呼-s2   { stroke-dasharray: 43.6347; stroke-dashoffset: 43.6347; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#呼-bg3  { animation-delay: 0.81s; }
#呼-s3   { stroke-dasharray: 20.0730; stroke-dashoffset: 20.0730; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#呼-bg4  { animation-delay: 1.18s; }
#呼-s4   { stroke-dasharray: 35.5108; stroke-dashoffset: 35.5108; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#呼-bg5  { animation-delay: 1.55s; }
#呼-s5   { stroke-dasharray: 14.9118; stroke-dashoffset: 14.9118; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#呼-bg6  { animation-delay: 1.92s; }
#呼-s6   { stroke-dasharray: 21.7027; stroke-dashoffset: 21.7027; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#呼-bg7  { animation-delay: 2.29s; }
#呼-s7   { stroke-dasharray: 63.6152; stroke-dashoffset: 63.6152; animation: drawStroke 0.35s ease-out 2.42s forwards; }
#呼-bg8  { animation-delay: 2.79s; }
#呼-s8   { stroke-dasharray: 84.0985; stroke-dashoffset: 84.0985; animation: drawStroke 0.46s ease-out 2.92s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #呼-s[i]) -->
<path id="呼-s1"  class="stroke" stroke="#bf0909" d="M12.25,35.08C13.01,35.82,13.45,36.71,13.58,37.76C14.57,41.71,15.64,48.94,16.46,55.22C16.68,56.91,16.880000000000003,58.53,17.060000000000002,60"/>
<path id="呼-s2"  class="stroke" stroke="#bf9109" d="M14.4,36.71C23.12,35,30.9,33.77,35.62,33.15C37.75,32.87,39.37,34.5,38.87,36.65C37.79,41.29,36.849999999999994,46.31,35.489999999999995,52.709999999999994"/>
<path id="呼-s3"  class="stroke" stroke="#64bf09" d="M17.24,56.02C21.659999999999997,55.49,27.479999999999997,54.650000000000006,33.51,53.82C34.72,53.65,35.879999999999995,53.5,37.15,53.58"/>
<path id="呼-s4"  class="stroke" stroke="#09bf36" d="M74.92,11.75C74.92,12.870000000000001,74.34,14,73.18,14.7C67,18.5,57.12,22.62,43.62,26.54"/>
<path id="呼-s5"  class="stroke" stroke="#09bfbf" d="M47.75,35C50.08,37.33,53.769999999999996,44.59,54.35,48.22"/>
<path id="呼-s6"  class="stroke" stroke="#0936bf" d="M88.68,25.39C88.77000000000001,26.38,88.7,27.36,88.35000000000001,28.28C86.62,32.870000000000005,83.37,38.620000000000005,78.43,44.09"/>
<path id="呼-s7"  class="stroke" stroke="#6409bf" d="M35.75,61.12C38.87,61.75,43.39,61.199999999999996,46.38,60.66C57.08,58.739999999999995,77.32000000000001,55.279999999999994,89.76,54.169999999999995C92.80000000000001,53.89999999999999,95.76,53.629999999999995,98.76,54.37"/>
<path id="呼-s8"  class="stroke" stroke="#bf0991" d="M63.66,22.96C72,33.88,72.62,66.5,67.68,90.34C65.5,100.84,58.63000000000001,91.43,57.25000000000001,90.16"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="呼-bg1"  class="badge-group"><circle cx="12.25" cy="31.58" r="3.5" fill="#bf0909"/><text class="num-single" x="12.25" y="31.58" dx="0" dy="-0.5">1</text></g>
<g id="呼-bg2"  class="badge-group"><circle cx="14.4" cy="40.21" r="3.5" fill="#bf9109"/><text class="num-single" x="14.4" y="40.21" dx="0" dy="-0.5">2</text></g>
<g id="呼-bg3"  class="badge-group"><circle cx="17.24" cy="56.02" r="3.5" fill="#64bf09"/><text class="num-single" x="17.24" y="56.02" dx="0" dy="-0.5">3</text></g>
<g id="呼-bg4"  class="badge-group"><circle cx="74.92" cy="11.75" r="3.5" fill="#09bf36"/><text class="num-single" x="74.92" y="11.75" dx="0" dy="-0.5">4</text></g>
<g id="呼-bg5"  class="badge-group"><circle cx="47.75" cy="35" r="3.5" fill="#09bfbf"/><text class="num-single" x="47.75" y="35" dx="0" dy="-0.5">5</text></g>
<g id="呼-bg6"  class="badge-group"><circle cx="88.68" cy="25.39" r="3.5" fill="#0936bf"/><text class="num-single" x="88.68" y="25.39" dx="0" dy="-0.5">6</text></g>
<g id="呼-bg7"  class="badge-group"><circle cx="35.75" cy="61.12" r="3.5" fill="#6409bf"/><text class="num-single" x="35.75" y="61.12" dx="0" dy="-0.5">7</text></g>
<g id="呼-bg8"  class="badge-group"><circle cx="63.66" cy="22.96" r="3.5" fill="#bf0991"/><text class="num-single" x="63.66" y="22.96" dx="0" dy="-0.5">8</text></g>
</svg>