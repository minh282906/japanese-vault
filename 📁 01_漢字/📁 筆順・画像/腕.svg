<g id="腕-bg11" class="badge-group"><circle cx="71.24" cy="42.46" r="3.5" fill="#bf09bf"/><text class="num-double" x="71.24" y="42.46" dx="-0.4" dy="-0.475">11</text></g>
<g id="腕-bg12" class="badge-group"><circle cx="71.89" cy="50.25" r="3.5" fill="#bf0964"/><text class="num-double" x="71.89" y="50.25" dx="-0.4" dy="-0.475">12</text></g>
</svg>