<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (腕)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #腕-bg[i]: Thời gian quả bóng số nảy lên
   - #腕-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#腕-bg1  { animation-delay: 0.05s; }
#腕-s1   { stroke-dasharray: 73.3546; stroke-dashoffset: 73.3546; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#腕-bg2  { animation-delay: 0.60s; }
#腕-s2   { stroke-dasharray: 96.7468; stroke-dashoffset: 96.7468; animation: drawStroke 0.53s ease-out 0.73s forwards; }
#腕-bg3  { animation-delay: 1.28s; }
#腕-s3   { stroke-dasharray: 15.0750; stroke-dashoffset: 15.0750; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#腕-bg4  { animation-delay: 1.65s; }
#腕-s4   { stroke-dasharray: 15.5801; stroke-dashoffset: 15.5801; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#腕-bg5  { animation-delay: 2.02s; }
#腕-s5   { stroke-dasharray: 13.2670; stroke-dashoffset: 13.2670; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#腕-bg6  { animation-delay: 2.39s; }
#腕-s6   { stroke-dasharray: 16.8456; stroke-dashoffset: 16.8456; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#腕-bg7  { animation-delay: 2.76s; }
#腕-s7   { stroke-dasharray: 56.2428; stroke-dashoffset: 56.2428; animation: drawStroke 0.31s ease-out 2.89s forwards; }
#腕-bg8  { animation-delay: 3.22s; }
#腕-s8   { stroke-dasharray: 32.8523; stroke-dashoffset: 32.8523; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#腕-bg9  { animation-delay: 3.59s; }
#腕-s9   { stroke-dasharray: 64.7464; stroke-dashoffset: 64.7464; animation: drawStroke 0.36s ease-out 3.72s forwards; }
#腕-bg10  { animation-delay: 4.10s; }
#腕-s10   { stroke-dasharray: 11.1010; stroke-dashoffset: 11.1010; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#腕-bg11  { animation-delay: 4.47s; }
#腕-s11   { stroke-dasharray: 57.7950; stroke-dashoffset: 57.7950; animation: drawStroke 0.32s ease-out 4.60s forwards; }
#腕-bg12  { animation-delay: 4.94s; }
#腕-s12   { stroke-dasharray: 75.9041; stroke-dashoffset: 75.9041; animation: drawStroke 0.42s ease-out 5.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #腕-s[i]) -->
<path id="腕-s1"  class="stroke" stroke="#bf0909" d="M17,20C17.88,20.88,17.96,21.97,18,23C19.5,60.75,16.62,79.62,10.25,92"/>
<path id="腕-s2"  class="stroke" stroke="#bf6409" d="M19,22.25C23.07,21.46,28.61,20.45,31.259999999999998,19.91C33.48,19.45,35.5,20.45,35.5,23C35.5,29.75,35.5,66.75,35.5,87C35.5,97.75,30.75,92.25,28,89.25"/>
