<g id="腕-bg7"  class="badge-group"><circle cx="48.94" cy="32.85" r="3.5" fill="#09bfbf"/><text class="num-single" x="48.94" y="32.85" dx="0" dy="-0.5">7</text></g>
<g id="腕-bg8"  class="badge-group"><circle cx="54.42" cy="39.17" r="3.5" fill="#0964bf"/><text class="num-single" x="54.42" y="39.17" dx="0" dy="-0.5">8</text></g>
<g id="腕-bg9"  class="badge-group"><circle cx="54.06" cy="50.7" r="3.5" fill="#0909bf"/><text class="num-single" x="54.06" y="50.7" dx="0" dy="-0.5">9</text></g>
