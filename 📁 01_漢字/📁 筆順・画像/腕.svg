<path id="腕-s6"  class="stroke" stroke="#09bf64" d="M48.08,27.49C48.08,31.169999999999998,45.21,41.28,43.91,43.739999999999995"/>
<path id="腕-s7"  class="stroke" stroke="#09bfbf" d="M48.94,29.35C57.12,28.25,81.87,25.75,90.94,25.53C100.75,25.290000000000003,91.28999999999999,31.87,89.3,33.52"/>
<path id="腕-s8"  class="stroke" stroke="#0964bf" d="M54.42,39.17C54.57,39.7,54.550000000000004,41.09,54.2,42.09C51.5,49.88,46.45,58.150000000000006,39.39,67.94"/>
<path id="腕-s9"  class="stroke" stroke="#0909bf" d="M54.06,50.7C54.63,50.88,55.47,50.89,56.120000000000005,50.830000000000005C58.13,50.63,60.38,50.13,63.290000000000006,49.27C65.4,48.64,66.69000000000001,50.040000000000006,65.9,52.21C61.88,63.25,52,82.5,38.75,93.75"/>
<path id="腕-s10"  class="stroke" stroke="#6409bf" d="M47.62,61.25C49.93,62.8,53.589999999999996,67.63,54.16,70.03999999999999"/>
<path id="腕-s11"  class="stroke" stroke="#bf09bf" d="M71.24,45.96C72.88,46.5,74.77,46.17,75.83999999999999,46.03C79.74999999999999,45.5,86.44999999999999,43.95,87.88,43.65C90.36999999999999,43.129999999999995,91.6,44.519999999999996,91.50999999999999,47.08C91.36999999999999,51.43,89.77999999999999,64.64,87.46,71.72C85.24,78.5,83.24,74.25,82.00999999999999,71.33"/>
<path id="腕-s12"  class="stroke" stroke="#bf0964" d="M71.89,46.75C72.82000000000001,47.68,73.17,48.75,73.17,50.08C73.17,62.379999999999995,73.16,70.38,73.16,79.28C73.16,92.25,73.74,93.75,85.44,93.75C96.12,93.75,97.14,91.75,97.14,82.85"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="腕-bg1"  class="badge-group"><circle cx="17" cy="16.5" r="3.5" fill="#bf0909"/><text class="num-single" x="17" y="16.5" dx="0" dy="-0.5">1</text></g>
<g id="腕-bg2"  class="badge-group"><circle cx="19" cy="25.75" r="3.5" fill="#bf6409"/><text class="num-single" x="19" y="25.75" dx="0" dy="-0.5">2</text></g>
