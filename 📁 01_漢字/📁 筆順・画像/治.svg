<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (治)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #治-bg[i]: Thời gian quả bóng số nảy lên
   - #治-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#治-bg1  { animation-delay: 0.05s; }
#治-s1   { stroke-dasharray: 14.5175; stroke-dashoffset: 14.5175; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#治-bg2  { animation-delay: 0.42s; }
#治-s2   { stroke-dasharray: 15.1464; stroke-dashoffset: 15.1464; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#治-bg3  { animation-delay: 0.79s; }
#治-s3   { stroke-dasharray: 23.2102; stroke-dashoffset: 23.2102; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#治-bg4  { animation-delay: 1.16s; }
#治-s4   { stroke-dasharray: 85.0352; stroke-dashoffset: 85.0352; animation: drawStroke 0.47s ease-out 1.29s forwards; }
#治-bg5  { animation-delay: 1.78s; }
#治-s5   { stroke-dasharray: 22.3655; stroke-dashoffset: 22.3655; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#治-bg6  { animation-delay: 2.15s; }
#治-s6   { stroke-dasharray: 29.6077; stroke-dashoffset: 29.6077; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#治-bg7  { animation-delay: 2.52s; }
#治-s7   { stroke-dasharray: 61.4858; stroke-dashoffset: 61.4858; animation: drawStroke 0.34s ease-out 2.65s forwards; }
#治-bg8  { animation-delay: 3.01s; }
#治-s8   { stroke-dasharray: 30.7764; stroke-dashoffset: 30.7764; animation: drawStroke 0.22s ease-out 3.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #治-s[i]) -->
<path id="治-s1"  class="stroke" stroke="#bf0909" d="M26.75,18.75C30.990000000000002,20.13,37.69,24.44,38.75,26.59"/>
<path id="治-s2"  class="stroke" stroke="#bf9109" d="M18.25,43.75C22.93,44.98,30.33,48.83,31.5,50.75"/>
<path id="治-s3"  class="stroke" stroke="#64bf09" d="M19.38,90.75C20.4,90.9,21.63,90.51,22.25,89.46C25.259999999999998,84.36,28.27,78.13,31,71.63"/>
<path id="治-s4"  class="stroke" stroke="#09bf36" d="M65.09,18C65.75,19.5,65.3,21.46,64.28,23.13C57.49,34.25,52.68,41.269999999999996,46.2,50.230000000000004C43.64,53.760000000000005,43.790000000000006,54.28,47.31,53.49C56.25,51.5,74.18,46.68,86.41,43.64"/>
<path id="治-s5"  class="stroke" stroke="#09bfbf" d="M79.75,34.62C84.14,37.839999999999996,91.1,47.86,92.2,52.87"/>
<path id="治-s6"  class="stroke" stroke="#0936bf" d="M48.29,65.51C49.01,66.23,49.61,67.51,49.75,68.61C50.5,74.41,51.61,83.05,52.67,90.75C52.85,92.04,53.02,93.29,53.190000000000005,94.51"/>
<path id="治-s7"  class="stroke" stroke="#6409bf" d="M50.33,67.38C62.5,65.47999999999999,73.27,64.14,82.25999999999999,63.239999999999995C85.63999999999999,62.91,87.82,64.52,86.99,68.03C85.38,74.76,84.69,80.22,83.11,88.66"/>
<path id="治-s8"  class="stroke" stroke="#bf0991" d="M54.86,92.17C63.46,91.54,70.27,90.69,81.62,89.99C82.87,89.91,84.17,89.83999999999999,85.54,89.75999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="治-bg1"  class="badge-group"><circle cx="26.75" cy="18.75" r="3.5" fill="#bf0909"/><text class="num-single" x="26.75" y="18.75" dx="0" dy="-0.5">1</text></g>
<g id="治-bg2"  class="badge-group"><circle cx="18.25" cy="43.75" r="3.5" fill="#bf9109"/><text class="num-single" x="18.25" y="43.75" dx="0" dy="-0.5">2</text></g>
<g id="治-bg3"  class="badge-group"><circle cx="19.38" cy="90.75" r="3.5" fill="#64bf09"/><text class="num-single" x="19.38" y="90.75" dx="0" dy="-0.5">3</text></g>
<g id="治-bg4"  class="badge-group"><circle cx="65.09" cy="18" r="3.5" fill="#09bf36"/><text class="num-single" x="65.09" y="18" dx="0" dy="-0.5">4</text></g>
<g id="治-bg5"  class="badge-group"><circle cx="79.75" cy="34.62" r="3.5" fill="#09bfbf"/><text class="num-single" x="79.75" y="34.62" dx="0" dy="-0.5">5</text></g>
<g id="治-bg6"  class="badge-group"><circle cx="48.29" cy="62.01" r="3.5" fill="#0936bf"/><text class="num-single" x="48.29" y="62.01" dx="0" dy="-0.5">6</text></g>
<g id="治-bg7"  class="badge-group"><circle cx="50.33" cy="70.88" r="3.5" fill="#6409bf"/><text class="num-single" x="50.33" y="70.88" dx="0" dy="-0.5">7</text></g>
<g id="治-bg8"  class="badge-group"><circle cx="54.86" cy="92.17" r="3.5" fill="#bf0991"/><text class="num-single" x="54.86" y="92.17" dx="0" dy="-0.5">8</text></g>
</svg>