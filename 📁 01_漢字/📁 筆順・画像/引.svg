<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (引)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #引-bg[i]: Thời gian quả bóng số nảy lên
   - #引-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#引-bg1  { animation-delay: 0.05s; }
#引-s1   { stroke-dasharray: 47.7503; stroke-dashoffset: 47.7503; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#引-bg2  { animation-delay: 0.46s; }
#引-s2   { stroke-dasharray: 24.7414; stroke-dashoffset: 24.7414; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#引-bg3  { animation-delay: 0.83s; }
#引-s3   { stroke-dasharray: 107.5410; stroke-dashoffset: 107.5410; animation: drawStroke 0.55s ease-out 0.96s forwards; }
#引-bg4  { animation-delay: 1.53s; }
#引-s4   { stroke-dasharray: 86.9526; stroke-dashoffset: 86.9526; animation: drawStroke 0.48s ease-out 1.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #引-s[i]) -->
<path id="引-s1"  class="stroke" stroke="#bf0909" d="M20.5,17.25C22,18.13,24.23,18.15,25.5,18C30.62,17.38,41.12,15.5,46.5,14.25C49.04,13.66,51.03,15.1,50.25,18C49.37,21.25,47.37,28.25,46.25,32"/>
<path id="引-s2"  class="stroke" stroke="#64bf09" d="M24,35C25,35.5,26.45,35.51,27.62,35.44C32.5,35.129999999999995,40.24,33.75,43.24,33.25C44.980000000000004,32.96,46.86,32.75,48.49,33"/>
<path id="引-s3"  class="stroke" stroke="#09bfbf" d="M24.75,35.5C25.63,36.75,25.37,37.75,24.5,39.5C23.85,40.8,19.43,49.56,19,50.5C17.75,53.25,19,54,22,53.5C24.03,53.16,41.5,50.25,45.5,49.5C49.05,48.83,51.730000000000004,50.95,51.019999999999996,54.5C49.05,64.28,41.62,83.92,38,90.5C35.25,95.5,30.5,93.75,27,89.5"/>
<path id="引-s4"  class="stroke" stroke="#6409bf" d="M82,11.75C83.31,13.06,83.75,14.75,83.75,16.5C83.75,17.39,83.84,74.88,83.84,92C83.84,95.17,83.78,97.38,83.75,98.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="引-bg1"  class="badge-group"><circle cx="20.5" cy="17.25" r="3.5" fill="#bf0909"/><text class="num-single" x="20.5" y="17.25" dx="0" dy="-0.5">1</text></g>
<g id="引-bg2"  class="badge-group"><circle cx="24" cy="31.5" r="3.5" fill="#64bf09"/><text class="num-single" x="24" y="31.5" dx="0" dy="-0.5">2</text></g>
<g id="引-bg3"  class="badge-group"><circle cx="24.75" cy="39.0" r="3.5" fill="#09bfbf"/><text class="num-single" x="24.75" y="39.0" dx="0" dy="-0.5">3</text></g>
<g id="引-bg4"  class="badge-group"><circle cx="82" cy="11.75" r="3.5" fill="#6409bf"/><text class="num-single" x="82" y="11.75" dx="0" dy="-0.5">4</text></g>
</svg>