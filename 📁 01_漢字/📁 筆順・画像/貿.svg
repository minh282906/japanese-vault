<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (貿)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #貿-bg[i]: Thời gian quả bóng số nảy lên
   - #貿-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#貿-bg1  { animation-delay: 0.05s; }
#貿-s1   { stroke-dasharray: 20.6119; stroke-dashoffset: 20.6119; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#貿-bg2  { animation-delay: 0.42s; }
#貿-s2   { stroke-dasharray: 45.0742; stroke-dashoffset: 45.0742; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#貿-bg3  { animation-delay: 0.82s; }
#貿-s3   { stroke-dasharray: 15.0621; stroke-dashoffset: 15.0621; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#貿-bg4  { animation-delay: 1.19s; }
#貿-s4   { stroke-dasharray: 59.2708; stroke-dashoffset: 59.2708; animation: drawStroke 0.33s ease-out 1.32s forwards; }
#貿-bg5  { animation-delay: 1.67s; }
#貿-s5   { stroke-dasharray: 24.2572; stroke-dashoffset: 24.2572; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#貿-bg6  { animation-delay: 2.04s; }
#貿-s6   { stroke-dasharray: 35.5206; stroke-dashoffset: 35.5206; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#貿-bg7  { animation-delay: 2.41s; }
#貿-s7   { stroke-dasharray: 72.1109; stroke-dashoffset: 72.1109; animation: drawStroke 0.40s ease-out 2.54s forwards; }
#貿-bg8  { animation-delay: 2.96s; }
#貿-s8   { stroke-dasharray: 36.5255; stroke-dashoffset: 36.5255; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#貿-bg9  { animation-delay: 3.33s; }
#貿-s9   { stroke-dasharray: 36.5501; stroke-dashoffset: 36.5501; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#貿-bg10  { animation-delay: 3.70s; }
#貿-s10   { stroke-dasharray: 36.5652; stroke-dashoffset: 36.5652; animation: drawStroke 0.22s ease-out 3.83s forwards; }
#貿-bg11  { animation-delay: 4.07s; }
#貿-s11   { stroke-dasharray: 26.2530; stroke-dashoffset: 26.2530; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#貿-bg12  { animation-delay: 4.44s; }
#貿-s12   { stroke-dasharray: 20.8669; stroke-dashoffset: 20.8669; animation: drawStroke 0.22s ease-out 4.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #貿-s[i]) -->
<path id="貿-s1"  class="stroke" stroke="#bf0909" d="M42.57,11.19C42.57,12.129999999999999,42.11,13.07,41.35,13.6C37.5,16.25,34.28,18.58,25.900000000000002,22.39"/>
