<path id="貿-s7"  class="stroke" stroke="#09bfbf" d="M37.36,50.46C44.25,49.88,68.3,47.65,71.6,47.49C74.35,47.36,75.25,48.75,75.28,50.7C75.36,55.980000000000004,75.29,69.34,75.26,77.75C75.25,79.81,75.25,81.55,75.25,82.79"/>
<path id="貿-s8"  class="stroke" stroke="#0964bf" d="M37.55,60.81C44.75,60.25,68.21,58.68,74.00999999999999,58.68"/>
<path id="貿-s9"  class="stroke" stroke="#0909bf" d="M37.6,70.98C47.5,70.5,63.88,69.25,74.09,68.9"/>
<path id="貿-s10"  class="stroke" stroke="#6409bf" d="M37.53,82.13C48.120000000000005,81.25,64,80.36999999999999,74.02000000000001,79.8"/>
<path id="貿-s11"  class="stroke" stroke="#bf09bf" d="M44.67,85.66C44.67,86.63,44.24,87.63,43.17,88.59C39.38,92,32.12,96.75,23.75,100.5"/>
<path id="貿-s12"  class="stroke" stroke="#bf0964" d="M67.25,86.38C73.77,89.94999999999999,81.47,96.41999999999999,83.25,99.53999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="貿-bg1"  class="badge-group"><circle cx="42.57" cy="11.19" r="3.5" fill="#bf0909"/><text class="num-single" x="42.57" y="11.19" dx="0" dy="-0.5">1</text></g>
