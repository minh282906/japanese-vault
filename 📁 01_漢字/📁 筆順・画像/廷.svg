<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (廷)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #廷-bg[i]: Thời gian quả bóng số nảy lên
   - #廷-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#廷-bg1  { animation-delay: 0.05s; }
#廷-s1   { stroke-dasharray: 34.0535; stroke-dashoffset: 34.0535; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#廷-bg2  { animation-delay: 0.42s; }
#廷-s2   { stroke-dasharray: 48.4734; stroke-dashoffset: 48.4734; animation: drawStroke 0.27s ease-out 0.55s forwards; }
#廷-bg3  { animation-delay: 0.84s; }
#廷-s3   { stroke-dasharray: 41.8960; stroke-dashoffset: 41.8960; animation: drawStroke 0.23s ease-out 0.97s forwards; }
#廷-bg4  { animation-delay: 1.22s; }
#廷-s4   { stroke-dasharray: 41.0457; stroke-dashoffset: 41.0457; animation: drawStroke 0.23s ease-out 1.35s forwards; }
#廷-bg5  { animation-delay: 1.60s; }
#廷-s5   { stroke-dasharray: 50.8155; stroke-dashoffset: 50.8155; animation: drawStroke 0.28s ease-out 1.73s forwards; }
#廷-bg6  { animation-delay: 2.03s; }
#廷-s6   { stroke-dasharray: 71.1189; stroke-dashoffset: 71.1189; animation: drawStroke 0.39s ease-out 2.16s forwards; }
#廷-bg7  { animation-delay: 2.57s; }
#廷-s7   { stroke-dasharray: 82.4945; stroke-dashoffset: 82.4945; animation: drawStroke 0.45s ease-out 2.70s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #廷-s[i]) -->
<path id="廷-s1"  class="stroke" stroke="#bf0909" d="M81.73,13.64C81.68,14.58,81.31,15.360000000000001,80.61,15.98C77.37,19.36,66.6,25.15,52.31,28.97"/>
<path id="廷-s2"  class="stroke" stroke="#bfa509" d="M47.88,47.23C51.13,47.879999999999995,53.71,47.29,56.38,47.019999999999996C65.44,46.13999999999999,79.98,44.29,88.87,44.059999999999995C91.31,43.99999999999999,93.74000000000001,44.05,96.13000000000001,44.56999999999999"/>
<path id="廷-s3"  class="stroke" stroke="#3dbf09" d="M70.25,27C71.19,27.94,71.75,29.25,71.75,30.75C71.75,31.78,71.75,60.370000000000005,71.75,68.5"/>
<path id="廷-s4"  class="stroke" stroke="#09bf71" d="M51.5,70.5C52.71,70.87,54.93,70.93,56.14,70.87C63.5,70.5,78,68.5,88.14,68.29C90.16,68.25,91.37,68.47000000000001,92.38,68.65"/>
<path id="廷-s5"  class="stroke" stroke="#0971bf" d="M15,27.02C16.25,27.71,18.5,27.669999999999998,20.25,27.21S29.75,24.64,33.25,23.73S37.75,23.75,35.75,27.07C33.91,30.1,26.5,43.09,23,48.6"/>
<path id="廷-s6"  class="stroke" stroke="#3d09bf" d="M22.75,48.77C26.75,47,30,46.25,34,44.72C37.04,43.55,39.51,44.29,38.75,48.37C36.25,61.75,29.25,81.5,14,91.56"/>
<path id="廷-s7"  class="stroke" stroke="#bf09a5" d="M14.75,61.75C21.13,61.75,48.25,82,70.4,89.95C76.76,92.23,82,93.75,89.75,94.5"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="廷-bg1"  class="badge-group"><circle cx="81.73" cy="13.64" r="3.5" fill="#bf0909"/><text class="num-single" x="81.73" y="13.64" dx="0" dy="-0.5">1</text></g>
<g id="廷-bg2"  class="badge-group"><circle cx="47.88" cy="47.23" r="3.5" fill="#bfa509"/><text class="num-single" x="47.88" y="47.23" dx="0" dy="-0.5">2</text></g>
<g id="廷-bg3"  class="badge-group"><circle cx="70.25" cy="27" r="3.5" fill="#3dbf09"/><text class="num-single" x="70.25" y="27" dx="0" dy="-0.5">3</text></g>
<g id="廷-bg4"  class="badge-group"><circle cx="51.5" cy="70.5" r="3.5" fill="#09bf71"/><text class="num-single" x="51.5" y="70.5" dx="0" dy="-0.5">4</text></g>
<g id="廷-bg5"  class="badge-group"><circle cx="15" cy="27.02" r="3.5" fill="#0971bf"/><text class="num-single" x="15" y="27.02" dx="0" dy="-0.5">5</text></g>
<g id="廷-bg6"  class="badge-group"><circle cx="22.75" cy="48.77" r="3.5" fill="#3d09bf"/><text class="num-single" x="22.75" y="48.77" dx="0" dy="-0.5">6</text></g>
<g id="廷-bg7"  class="badge-group"><circle cx="14.75" cy="61.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="14.75" y="61.75" dx="0" dy="-0.5">7</text></g>
</svg>