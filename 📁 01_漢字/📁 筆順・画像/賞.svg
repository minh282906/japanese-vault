<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (賞)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #賞-bg[i]: Thời gian quả bóng số nảy lên
   - #賞-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#賞-bg1  { animation-delay: 0.05s; }
#賞-s1   { stroke-dasharray: 19.1338; stroke-dashoffset: 19.1338; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#賞-bg2  { animation-delay: 0.42s; }
#賞-s2   { stroke-dasharray: 14.0233; stroke-dashoffset: 14.0233; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#賞-bg3  { animation-delay: 0.79s; }
#賞-s3   { stroke-dasharray: 16.9096; stroke-dashoffset: 16.9096; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#賞-bg4  { animation-delay: 1.16s; }
#賞-s4   { stroke-dasharray: 16.3562; stroke-dashoffset: 16.3562; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#賞-bg5  { animation-delay: 1.53s; }
#賞-s5   { stroke-dasharray: 79.5784; stroke-dashoffset: 79.5784; animation: drawStroke 0.44s ease-out 1.66s forwards; }
#賞-bg6  { animation-delay: 2.12s; }
#賞-s6   { stroke-dasharray: 12.2847; stroke-dashoffset: 12.2847; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#賞-bg7  { animation-delay: 2.49s; }
#賞-s7   { stroke-dasharray: 39.9837; stroke-dashoffset: 39.9837; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#賞-bg8  { animation-delay: 2.86s; }
#賞-s8   { stroke-dasharray: 29.9762; stroke-dashoffset: 29.9762; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#賞-bg9  { animation-delay: 3.23s; }
#賞-s9   { stroke-dasharray: 28.5773; stroke-dashoffset: 28.5773; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#賞-bg10  { animation-delay: 3.60s; }
#賞-s10   { stroke-dasharray: 60.7138; stroke-dashoffset: 60.7138; animation: drawStroke 0.33s ease-out 3.73s forwards; }
#賞-bg11  { animation-delay: 4.08s; }
#賞-s11   { stroke-dasharray: 31.6896; stroke-dashoffset: 31.6896; animation: drawStroke 0.22s ease-out 4.21s forwards; }
#賞-bg12  { animation-delay: 4.45s; }
#賞-s12   { stroke-dasharray: 31.2968; stroke-dashoffset: 31.2968; animation: drawStroke 0.22s ease-out 4.58s forwards; }
#賞-bg13  { animation-delay: 4.82s; }
#賞-s13   { stroke-dasharray: 31.5659; stroke-dashoffset: 31.5659; animation: drawStroke 0.22s ease-out 4.95s forwards; }
#賞-bg14  { animation-delay: 5.19s; }
#賞-s14   { stroke-dasharray: 24.4862; stroke-dashoffset: 24.4862; animation: drawStroke 0.22s ease-out 5.32s forwards; }
#賞-bg15  { animation-delay: 5.56s; }
#賞-s15   { stroke-dasharray: 21.7523; stroke-dashoffset: 21.7523; animation: drawStroke 0.22s ease-out 5.69s forwards; }
]]>
</style>

