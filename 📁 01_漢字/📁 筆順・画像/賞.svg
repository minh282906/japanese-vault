<path id="賞-s10"  class="stroke" stroke="#0952bf" d="M39,56.98C47.75,56.129999999999995,65.38,54.3,68.18,54.3C71.38000000000001,54.3,72.30000000000001,55.379999999999995,72.30000000000001,58.879999999999995C72.30000000000001,64.19999999999999,72.27000000000001,72.41999999999999,72.26,78.5C72.26,80.2,72.25,81.74,72.25,83"/>
