<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (戻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #戻-bg[i]: Thời gian quả bóng số nảy lên
   - #戻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#戻-bg1  { animation-delay: 0.05s; }
#戻-s1   { stroke-dasharray: 62.1532; stroke-dashoffset: 62.1532; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#戻-bg2  { animation-delay: 0.54s; }
#戻-s2   { stroke-dasharray: 64.5419; stroke-dashoffset: 64.5419; animation: drawStroke 0.35s ease-out 0.67s forwards; }
#戻-bg3  { animation-delay: 1.04s; }
#戻-s3   { stroke-dasharray: 47.2737; stroke-dashoffset: 47.2737; animation: drawStroke 0.26s ease-out 1.17s forwards; }
#戻-bg4  { animation-delay: 1.45s; }
#戻-s4   { stroke-dasharray: 67.7790; stroke-dashoffset: 67.7790; animation: drawStroke 0.37s ease-out 1.58s forwards; }
#戻-bg5  { animation-delay: 1.97s; }
#戻-s5   { stroke-dasharray: 52.0342; stroke-dashoffset: 52.0342; animation: drawStroke 0.29s ease-out 2.10s forwards; }
#戻-bg6  { animation-delay: 2.41s; }
#戻-s6   { stroke-dasharray: 64.7867; stroke-dashoffset: 64.7867; animation: drawStroke 0.36s ease-out 2.54s forwards; }
#戻-bg7  { animation-delay: 2.92s; }
#戻-s7   { stroke-dasharray: 45.6533; stroke-dashoffset: 45.6533; animation: drawStroke 0.25s ease-out 3.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #戻-s[i]) -->
<path id="戻-s1"  class="stroke" stroke="#bf0909" d="M22.98,16.05C25.97,16.990000000000002,29.32,16.89,32.38,16.67C45.13,15.750000000000002,60.88,14.370000000000001,76.39,13.190000000000001C79.29,12.97,82,12.81,84.89,13.360000000000001"/>
<path id="戻-s2"  class="stroke" stroke="#bfa509" d="M27.65,30.78C30.189999999999998,31.61,33.36,31.68,36,31.35C47.33,29.94,62.879999999999995,27.630000000000003,74.58,26.990000000000002C76.84,26.87,78.92999999999999,28.360000000000003,78.26,31.51C77.38000000000001,35.620000000000005,76.88000000000001,37.620000000000005,75.92,41.59"/>
<path id="戻-s3"  class="stroke" stroke="#3dbf09" d="M32.62,46.84C33.89,46.84,57.87,44.38,73.5,42.730000000000004C75.9,42.480000000000004,78.02,42.53,79.68,42.53"/>
<path id="戻-s4"  class="stroke" stroke="#09bf71" d="M30.41,32.25C31.39,33.23,31.65,34.53,31.59,36.65C30.87,61.87,23.87,83.37,10.75,94.37"/>
<path id="戻-s5"  class="stroke" stroke="#0971bf" d="M34.14,66.22C37,66.88,39.480000000000004,66.73,41.9,66.48C53.81,65.23,67.13,63.35,78.00999999999999,62.63C80.64999999999999,62.46,83.28999999999999,62.300000000000004,85.89999999999999,62.78"/>
<path id="戻-s6"  class="stroke" stroke="#3d09bf" d="M57.11,51.25C57.65,51.9,57.93,52.9,57.92,54.31C57.660000000000004,78.66,44.150000000000006,91.76,22.75,99.24000000000001"/>
<path id="戻-s7"  class="stroke" stroke="#bf09a5" d="M58.51,65.38C65.13,73.63,73.75,83.63,83.37,91.31C86.01,93.42,88.54,94.9,91.5,96.5"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="戻-bg1"  class="badge-group"><circle cx="22.98" cy="16.05" r="3.5" fill="#bf0909"/><text class="num-single" x="22.98" y="16.05" dx="0" dy="-0.5">1</text></g>
<g id="戻-bg2"  class="badge-group"><circle cx="27.65" cy="27.28" r="3.5" fill="#bfa509"/><text class="num-single" x="27.65" y="27.28" dx="0" dy="-0.5">2</text></g>
<g id="戻-bg3"  class="badge-group"><circle cx="32.62" cy="46.84" r="3.5" fill="#3dbf09"/><text class="num-single" x="32.62" y="46.84" dx="0" dy="-0.5">3</text></g>
<g id="戻-bg4"  class="badge-group"><circle cx="30.41" cy="35.75" r="3.5" fill="#09bf71"/><text class="num-single" x="30.41" y="35.75" dx="0" dy="-0.5">4</text></g>
<g id="戻-bg5"  class="badge-group"><circle cx="34.14" cy="66.22" r="3.5" fill="#0971bf"/><text class="num-single" x="34.14" y="66.22" dx="0" dy="-0.5">5</text></g>
<g id="戻-bg6"  class="badge-group"><circle cx="57.11" cy="51.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="57.11" y="51.25" dx="0" dy="-0.5">6</text></g>
<g id="戻-bg7"  class="badge-group"><circle cx="58.51" cy="65.38" r="3.5" fill="#bf09a5"/><text class="num-single" x="58.51" y="65.38" dx="0" dy="-0.5">7</text></g>
</svg>