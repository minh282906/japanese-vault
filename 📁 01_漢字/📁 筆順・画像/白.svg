<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (白)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #白-bg[i]: Thời gian quả bóng số nảy lên
   - #白-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#白-bg1  { animation-delay: 0.05s; }
#白-s1   { stroke-dasharray: 33.4352; stroke-dashoffset: 33.4352; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#白-bg2  { animation-delay: 0.42s; }
#白-s2   { stroke-dasharray: 58.1989; stroke-dashoffset: 58.1989; animation: drawStroke 0.32s ease-out 0.55s forwards; }
#白-bg3  { animation-delay: 0.89s; }
#白-s3   { stroke-dasharray: 114.3730; stroke-dashoffset: 114.3730; animation: drawStroke 0.55s ease-out 1.02s forwards; }
#白-bg4  { animation-delay: 1.59s; }
#白-s4   { stroke-dasharray: 53.6008; stroke-dashoffset: 53.6008; animation: drawStroke 0.29s ease-out 1.72s forwards; }
#白-bg5  { animation-delay: 2.03s; }
#白-s5   { stroke-dasharray: 50.5945; stroke-dashoffset: 50.5945; animation: drawStroke 0.28s ease-out 2.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #白-s[i]) -->
<path id="白-s1"  class="stroke" stroke="#bf0909" d="M55,13C55.38,14.5,55,16.25,54.43,17.29C51.32,22.93,46,31.12,36.81,40.22"/>
<path id="白-s2"  class="stroke" stroke="#9abf09" d="M25.5,40.47C26.64,41.61,27.13,43.28,27.13,45.1C27.13,46.65,28.08,77.57,28.45,92.24000000000001C28.509999999999998,94.82000000000001,28.58,96.9,28.63,98.24000000000001"/>
<path id="白-s3"  class="stroke" stroke="#09bf52" d="M28.27,43.98C42.25,42.25,67.35,39.51,77.94,38.5C83.13,38,85.31,39.26,85,43.88C84.38,53,82.91,74.18,81.71,90.76C81.53999999999999,93.18,81.38,95.41000000000001,81.25,97.33000000000001"/>
<path id="白-s4"  class="stroke" stroke="#0952bf" d="M29.13,67.44C42.25,66,72.38,63.62,82.57,63.4"/>
<path id="白-s5"  class="stroke" stroke="#9a09bf" d="M29.69,94.49C43,93.75,66.62,92,80.19,91.41"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="白-bg1"  class="badge-group"><circle cx="55" cy="13" r="3.5" fill="#bf0909"/><text class="num-single" x="55" y="13" dx="0" dy="-0.5">1</text></g>
<g id="白-bg2"  class="badge-group"><circle cx="25.5" cy="36.97" r="3.5" fill="#9abf09"/><text class="num-single" x="25.5" y="36.97" dx="0" dy="-0.5">2</text></g>
<g id="白-bg3"  class="badge-group"><circle cx="28.27" cy="47.48" r="3.5" fill="#09bf52"/><text class="num-single" x="28.27" y="47.48" dx="0" dy="-0.5">3</text></g>
<g id="白-bg4"  class="badge-group"><circle cx="29.13" cy="67.44" r="3.5" fill="#0952bf"/><text class="num-single" x="29.13" y="67.44" dx="0" dy="-0.5">4</text></g>
<g id="白-bg5"  class="badge-group"><circle cx="29.69" cy="94.49" r="3.5" fill="#9a09bf"/><text class="num-single" x="29.69" y="94.49" dx="0" dy="-0.5">5</text></g>
</svg>