<path id="募-s5"  class="stroke" stroke="#09bf09" d="M32.89,34.92C39.75,34.120000000000005,63.66,31.490000000000002,70.89,30.89C73.64,30.66,76.71000000000001,31.87,75.95,35.01C75.22,38.03,73.67,42.69,72.44,46.459999999999994C71.89999999999999,48.099999999999994,71.50999999999999,48.86999999999999,70.84,50.16"/>
<path id="募-s6"  class="stroke" stroke="#09bf64" d="M35.14,43.28C44.75,41.88,63.5,39.88,73.35,39.54"/>
<path id="募-s7"  class="stroke" stroke="#09bfbf" d="M36.94,51.22C48.87,49.879999999999995,60.709999999999994,48.74,70.62,48.449999999999996"/>
<path id="募-s8"  class="stroke" stroke="#0964bf" d="M14.12,64.69C17.63,65.57,21.31,65.45,24.869999999999997,65C44.62,62.5,67.5,60.5,84,60.02C87.47,59.92,91.12,59.800000000000004,94.5,60.900000000000006"/>
<path id="募-s9"  class="stroke" stroke="#0909bf" d="M43.96,56.18C44.13,56.87,43.94,57.91,43.51,58.66C37.5,69.25,27.62,78.38,13.5,84.75"/>
<path id="募-s10"  class="stroke" stroke="#6409bf" d="M60.25,56.35C63,57,76.19,69.14,84.87,75.79C87.18,77.56,89.61,79.17,92.25,80.41000000000001"/>
<path id="募-s11"  class="stroke" stroke="#bf09bf" d="M36.78,77.78C38.54,78.53,41.02,78.36,42.86,78.06C49.32,77,60.58,74.85000000000001,65.61,74.04C68.94,73.5,70.77,74.15,70.18,77.92C69.51,82.16,67.28,88.41,64.28,93.23C61.47,97.75,59.5,97.13000000000001,56.74,94.79"/>
<path id="募-s12"  class="stroke" stroke="#bf0964" d="M53.68,67.93C53.75,68.63000000000001,53.9,69.77000000000001,53.55,70.76C51.129999999999995,77.63000000000001,44.5,89.25,30.08,98.12"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="募-bg1"  class="badge-group"><circle cx="20.5" cy="21.06" r="3.5" fill="#bf0909"/><text class="num-single" x="20.5" y="21.06" dx="0" dy="-0.5">1</text></g>
