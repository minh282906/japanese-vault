<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (募)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #募-bg[i]: Thời gian quả bóng số nảy lên
   - #募-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#募-bg1  { animation-delay: 0.05s; }
#募-s1   { stroke-dasharray: 65.5775; stroke-dashoffset: 65.5775; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#募-bg2  { animation-delay: 0.56s; }
#募-s2   { stroke-dasharray: 16.1085; stroke-dashoffset: 16.1085; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#募-bg3  { animation-delay: 0.93s; }
#募-s3   { stroke-dasharray: 15.9294; stroke-dashoffset: 15.9294; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#募-bg4  { animation-delay: 1.30s; }
#募-s4   { stroke-dasharray: 20.7173; stroke-dashoffset: 20.7173; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#募-bg5  { animation-delay: 1.67s; }
#募-s5   { stroke-dasharray: 62.0289; stroke-dashoffset: 62.0289; animation: drawStroke 0.34s ease-out 1.80s forwards; }
#募-bg6  { animation-delay: 2.16s; }
#募-s6   { stroke-dasharray: 38.4054; stroke-dashoffset: 38.4054; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#募-bg7  { animation-delay: 2.53s; }
#募-s7   { stroke-dasharray: 33.8028; stroke-dashoffset: 33.8028; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#募-bg8  { animation-delay: 2.90s; }
#募-s8   { stroke-dasharray: 80.7688; stroke-dashoffset: 80.7688; animation: drawStroke 0.44s ease-out 3.03s forwards; }
#募-bg9  { animation-delay: 3.49s; }
#募-s9   { stroke-dasharray: 43.0159; stroke-dashoffset: 43.0159; animation: drawStroke 0.24s ease-out 3.62s forwards; }
#募-bg10  { animation-delay: 3.88s; }
#募-s10   { stroke-dasharray: 40.1450; stroke-dashoffset: 40.1450; animation: drawStroke 0.22s ease-out 4.01s forwards; }
#募-bg11  { animation-delay: 4.25s; }
#募-s11   { stroke-dasharray: 62.9582; stroke-dashoffset: 62.9582; animation: drawStroke 0.35s ease-out 4.38s forwards; }
#募-bg12  { animation-delay: 4.75s; }
#募-s12   { stroke-dasharray: 39.5747; stroke-dashoffset: 39.5747; animation: drawStroke 0.22s ease-out 4.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #募-s[i]) -->
<path id="募-s1"  class="stroke" stroke="#bf0909" d="M20.5,21.06C22.990000000000002,21.919999999999998,25.72,21.759999999999998,28.25,21.4C38.88,19.88,66.09,17.599999999999998,77.25999999999999,17.18C80.21999999999998,17.07,82.86999999999999,17.169999999999998,85.75999999999999,17.77"/>
