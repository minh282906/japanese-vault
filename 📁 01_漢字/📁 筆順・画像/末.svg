<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (末)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #末-bg[i]: Thời gian quả bóng số nảy lên
   - #末-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#末-bg1  { animation-delay: 0.05s; }
#末-s1   { stroke-dasharray: 74.0784; stroke-dashoffset: 74.0784; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#末-bg2  { animation-delay: 0.61s; }
#末-s2   { stroke-dasharray: 55.0711; stroke-dashoffset: 55.0711; animation: drawStroke 0.30s ease-out 0.74s forwards; }
#末-bg3  { animation-delay: 1.06s; }
#末-s3   { stroke-dasharray: 89.3867; stroke-dashoffset: 89.3867; animation: drawStroke 0.49s ease-out 1.19s forwards; }
#末-bg4  { animation-delay: 1.70s; }
#末-s4   { stroke-dasharray: 56.1600; stroke-dashoffset: 56.1600; animation: drawStroke 0.31s ease-out 1.83s forwards; }
#末-bg5  { animation-delay: 2.16s; }
#末-s5   { stroke-dasharray: 50.0751; stroke-dashoffset: 50.0751; animation: drawStroke 0.28s ease-out 2.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #末-s[i]) -->
<path id="末-s1"  class="stroke" stroke="#bf0909" d="M17.75,31.2C21.13,32,24.21,32.05,27.27,31.71C41.25,30.130000000000003,69.01,27.46,82.5,26.71C85.55,26.54,88.5,26.41,91.5,27.05"/>
<path id="末-s2"  class="stroke" stroke="#9abf09" d="M27.12,51.75C29.19,52.37,31.25,52.41,34.19,52C46.75,50.25,61,48.62,74.91999999999999,47.75C77.87999999999998,47.56,80.01999999999998,47.75,81.87999999999998,48"/>
<path id="末-s3"  class="stroke" stroke="#09bf52" d="M52.5,10.75C53.75,12,54.75,13.75,54.75,15.5C54.75,16.37,54.75,69.45,54.75,91.12C54.75,95.24000000000001,54.75,98.22,54.75,99.5"/>
<path id="末-s4"  class="stroke" stroke="#0952bf" d="M53.25,50.5C53.25,52.25,52.53,53.34,51.82,54.42C43.77,66.75,27.21,82.41,13.75,89"/>
<path id="末-s5"  class="stroke" stroke="#9a09bf" d="M55.62,51.88C59.97,57.25,76.52,73.13,84.49,80.39C86.96,82.64,89.16999999999999,84.4,92.25,85.76"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="末-bg1"  class="badge-group"><circle cx="17.75" cy="31.2" r="3.5" fill="#bf0909"/><text class="num-single" x="17.75" y="31.2" dx="0" dy="-0.5">1</text></g>
<g id="末-bg2"  class="badge-group"><circle cx="27.12" cy="51.75" r="3.5" fill="#9abf09"/><text class="num-single" x="27.12" y="51.75" dx="0" dy="-0.5">2</text></g>
<g id="末-bg3"  class="badge-group"><circle cx="52.5" cy="10.75" r="3.5" fill="#09bf52"/><text class="num-single" x="52.5" y="10.75" dx="0" dy="-0.5">3</text></g>
<g id="末-bg4"  class="badge-group"><circle cx="53.25" cy="47.0" r="3.5" fill="#0952bf"/><text class="num-single" x="53.25" y="47.0" dx="0" dy="-0.5">4</text></g>
<g id="末-bg5"  class="badge-group"><circle cx="55.62" cy="55.38" r="3.5" fill="#9a09bf"/><text class="num-single" x="55.62" y="55.38" dx="0" dy="-0.5">5</text></g>
</svg>