<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (小)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #小-bg[i]: Thời gian quả bóng số nảy lên
   - #小-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#小-bg1  { animation-delay: 0.05s; }
#小-s1   { stroke-dasharray: 81.0384; stroke-dashoffset: 81.0384; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#小-bg2  { animation-delay: 0.65s; }
#小-s2   { stroke-dasharray: 30.1054; stroke-dashoffset: 30.1054; animation: drawStroke 0.22s ease-out 0.78s forwards; }
#小-bg3  { animation-delay: 1.02s; }
#小-s3   { stroke-dasharray: 29.9107; stroke-dashoffset: 29.9107; animation: drawStroke 0.22s ease-out 1.15s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #小-s[i]) -->
<path id="小-s1"  class="stroke" stroke="#bf0909" d="M54.71,18.37C56.11,19.77,56.97,21.5,56.97,24.14C56.97,38.7,56.71,79.05,56.71,84.00999999999999C56.71,95.25999999999999,49.5,85.50999999999999,48,84.25999999999999"/>
<path id="小-s2"  class="stroke" stroke="#09bf09" d="M31.95,47.68C32.12,48.5,32.05,49.4,31.61,50.58C29.5,56.38,24.38,66.25,16.75,73"/>
<path id="小-s3"  class="stroke" stroke="#0909bf" d="M80.96,47.12C86.62,52,95.25,64.62,97,72"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="小-bg1"  class="badge-group"><circle cx="54.71" cy="18.37" r="3.5" fill="#bf0909"/><text class="num-single" x="54.71" y="18.37" dx="0" dy="-0.5">1</text></g>
<g id="小-bg2"  class="badge-group"><circle cx="31.95" cy="47.68" r="3.5" fill="#09bf09"/><text class="num-single" x="31.95" y="47.68" dx="0" dy="-0.5">2</text></g>
<g id="小-bg3"  class="badge-group"><circle cx="80.96" cy="47.12" r="3.5" fill="#0909bf"/><text class="num-single" x="80.96" y="47.12" dx="0" dy="-0.5">3</text></g>
</svg>