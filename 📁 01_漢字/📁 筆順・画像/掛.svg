<path id="掛-s4"  class="stroke" stroke="#4bbf09" d="M43.96,34.22C44.97,34.72,46.620000000000005,34.5,47.63,34.379999999999995C54.870000000000005,33.49999999999999,59.620000000000005,32.74999999999999,64.01,32.16C65.29,31.989999999999995,66.55000000000001,31.919999999999998,67.79,32.29"/>
<path id="掛-s5"  class="stroke" stroke="#09bf2a" d="M54.98,17.25C55.8,18.07,56.089999999999996,19.02,56.089999999999996,20.58C56.089999999999996,30.599999999999998,55.989999999999995,33.989999999999995,55.989999999999995,47.25"/>
<path id="掛-s6"  class="stroke" stroke="#09bf8d" d="M41.61,49.48C42.47,49.9,44.05,49.989999999999995,44.9,49.9C51,49.25,58.95,47.69,68.47,47.14C69.9,47.06,70.76,47.34,71.48,47.55"/>
<path id="掛-s7"  class="stroke" stroke="#098dbf" d="M42.91,68.19C44.11,68.84,46,68.72,47.25,68.48C53.83,67.21000000000001,61,66.26,65.76,65.71000000000001C66.94000000000001,65.57000000000001,68.4,65.34,69.53,65.71000000000001"/>
<path id="掛-s8"  class="stroke" stroke="#092abf" d="M55.59,55C56.36000000000001,55.77,56.84,56.94,56.84,58.17C56.84,67.63,56.75,68.74000000000001,56.75,81.25"/>
<path id="掛-s9"  class="stroke" stroke="#4b09bf" d="M42.04,86.57C43.12,87.36999999999999,44.71,87.22,45.48,86.91C56.17999999999999,82.59,60.76,80.69,70.86,76.71"/>
<path id="掛-s10"  class="stroke" stroke="#ae09bf" d="M77.68,15.05C78.69000000000001,16.060000000000002,79.41000000000001,17.5,79.41000000000001,19.39C79.41000000000001,19.98,79.45000000000002,72.25999999999999,79.46000000000001,91.24C79.46000000000001,94.85,79.46000000000001,97.25,79.46000000000001,97.86999999999999"/>
<path id="掛-s11"  class="stroke" stroke="#bf096c" d="M82.75,47.25C87.87,50.37,94.37,56.13,96.75,61.75"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="掛-bg1"  class="badge-group"><circle cx="14.5" cy="39.67" r="3.5" fill="#bf0909"/><text class="num-single" x="14.5" y="39.67" dx="0" dy="-0.5">1</text></g>
