<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (掛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #掛-bg[i]: Thời gian quả bóng số nảy lên
   - #掛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#掛-bg1  { animation-delay: 0.05s; }
#掛-s1   { stroke-dasharray: 24.4074; stroke-dashoffset: 24.4074; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#掛-bg2  { animation-delay: 0.42s; }
#掛-s2   { stroke-dasharray: 84.8697; stroke-dashoffset: 84.8697; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#掛-bg3  { animation-delay: 1.04s; }
#掛-s3   { stroke-dasharray: 30.1691; stroke-dashoffset: 30.1691; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#掛-bg4  { animation-delay: 1.41s; }
#掛-s4   { stroke-dasharray: 24.0621; stroke-dashoffset: 24.0621; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#掛-bg5  { animation-delay: 1.78s; }
#掛-s5   { stroke-dasharray: 30.2863; stroke-dashoffset: 30.2863; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#掛-bg6  { animation-delay: 2.15s; }
#掛-s6   { stroke-dasharray: 30.1433; stroke-dashoffset: 30.1433; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#掛-bg7  { animation-delay: 2.52s; }
#掛-s7   { stroke-dasharray: 26.9446; stroke-dashoffset: 26.9446; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#掛-bg8  { animation-delay: 2.89s; }
#掛-s8   { stroke-dasharray: 26.5742; stroke-dashoffset: 26.5742; animation: drawStroke 0.22s ease-out 3.02s forwards; }
#掛-bg9  { animation-delay: 3.26s; }
#掛-s9   { stroke-dasharray: 30.9432; stroke-dashoffset: 30.9432; animation: drawStroke 0.22s ease-out 3.39s forwards; }
#掛-bg10  { animation-delay: 3.63s; }
#掛-s10   { stroke-dasharray: 83.2787; stroke-dashoffset: 83.2787; animation: drawStroke 0.46s ease-out 3.76s forwards; }
#掛-bg11  { animation-delay: 4.24s; }
#掛-s11   { stroke-dasharray: 20.4296; stroke-dashoffset: 20.4296; animation: drawStroke 0.22s ease-out 4.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #掛-s[i]) -->
<path id="掛-s1"  class="stroke" stroke="#bf0909" d="M14.5,39.67C16.61,39.92,18.23,39.9,20.39,39.58C24.59,38.94,29.42,38.11,35.77,37.16C36.7,37.019999999999996,37.660000000000004,36.88999999999999,38.67,36.76"/>
