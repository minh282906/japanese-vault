<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (皆)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #皆-bg[i]: Thời gian quả bóng số nảy lên
   - #皆-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#皆-bg1  { animation-delay: 0.05s; }
#皆-s1   { stroke-dasharray: 22.2742; stroke-dashoffset: 22.2742; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#皆-bg2  { animation-delay: 0.42s; }
#皆-s2   { stroke-dasharray: 57.8848; stroke-dashoffset: 57.8848; animation: drawStroke 0.32s ease-out 0.55s forwards; }
#皆-bg3  { animation-delay: 0.89s; }
#皆-s3   { stroke-dasharray: 26.1752; stroke-dashoffset: 26.1752; animation: drawStroke 0.22s ease-out 1.02s forwards; }
#皆-bg4  { animation-delay: 1.26s; }
#皆-s4   { stroke-dasharray: 71.3910; stroke-dashoffset: 71.3910; animation: drawStroke 0.39s ease-out 1.39s forwards; }
#皆-bg5  { animation-delay: 1.80s; }
#皆-s5   { stroke-dasharray: 14.7798; stroke-dashoffset: 14.7798; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#皆-bg6  { animation-delay: 2.17s; }
#皆-s6   { stroke-dasharray: 33.8760; stroke-dashoffset: 33.8760; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#皆-bg7  { animation-delay: 2.54s; }
#皆-s7   { stroke-dasharray: 73.5510; stroke-dashoffset: 73.5510; animation: drawStroke 0.40s ease-out 2.67s forwards; }
#皆-bg8  { animation-delay: 3.09s; }
#皆-s8   { stroke-dasharray: 36.8415; stroke-dashoffset: 36.8415; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#皆-bg9  { animation-delay: 3.46s; }
#皆-s9   { stroke-dasharray: 33.1747; stroke-dashoffset: 33.1747; animation: drawStroke 0.22s ease-out 3.59s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #皆-s[i]) -->
<path id="皆-s1"  class="stroke" stroke="#bf0909" d="M27.5,31C33.12,30.25,36.75,29.5,45.5,28C46.98,27.75,48.5,27.75,49.5,28"/>
<path id="皆-s2"  class="stroke" stroke="#bf8209" d="M25,14.89C25.87,15.76,26.26,17,26.26,18.69C26.26,25.5,26.25,46.120000000000005,26.25,50.5C26.25,53.64,27,54.12,30,52.18C36.31,48.09,38.83,46.33,43.25,43.75"/>
<path id="皆-s3"  class="stroke" stroke="#82bf09" d="M87.07,18.9C87.25,20.25,86.83,21.09,85.78999999999999,21.9C80.5,26,75.5,29.25,66.03,32.93"/>
<path id="皆-s4"  class="stroke" stroke="#09bf09" d="M61.25,12.25C62.31,13.31,62.84,14.629999999999999,62.84,16.39C62.84,23.5,62.85,38.21,62.85,40.620000000000005C62.85,49.00000000000001,64,50.330000000000005,77.78,50.330000000000005C92.25,50.330000000000005,93.54,48.75000000000001,93.54,42.010000000000005"/>
<path id="皆-s5"  class="stroke" stroke="#09bf82" d="M52.72,49.5C53,50.38,52.879999999999995,51.38,52.129999999999995,52.59C49.7,56.54,48.88,58,45.5,62"/>
<path id="皆-s6"  class="stroke" stroke="#0982bf" d="M34.51,63.47C35.519999999999996,64.48,35.73,65.73,35.79,67.37C35.96,71.87,36.53,85.21000000000001,36.93,92.73C37.03,94.55,37.1,96.05,37.15,97"/>
<path id="皆-s7"  class="stroke" stroke="#0909bf" d="M36.11,64.73C41.629999999999995,64.25,69.21000000000001,61.92,72.37,61.75000000000001C75,61.61,76.5,63,76.5,65.54C76.5,67.04,74.5,81.01,72.85,91.23C72.57,92.95,72.32,94.55,72.13,95.94"/>
<path id="皆-s8"  class="stroke" stroke="#8209bf" d="M37.22,78.82C44.629999999999995,78.36999999999999,68.7,76.91,74.00999999999999,76.91"/>
<path id="皆-s9"  class="stroke" stroke="#bf0982" d="M38.16,95.19C46.75,94.75,60.62,93.63,71.28,93.31"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="皆-bg1"  class="badge-group"><circle cx="27.5" cy="31" r="3.5" fill="#bf0909"/><text class="num-single" x="27.5" y="31" dx="0" dy="-0.5">1</text></g>
<g id="皆-bg2"  class="badge-group"><circle cx="25" cy="14.89" r="3.5" fill="#bf8209"/><text class="num-single" x="25" y="14.89" dx="0" dy="-0.5">2</text></g>
<g id="皆-bg3"  class="badge-group"><circle cx="87.07" cy="18.9" r="3.5" fill="#82bf09"/><text class="num-single" x="87.07" y="18.9" dx="0" dy="-0.5">3</text></g>
<g id="皆-bg4"  class="badge-group"><circle cx="61.25" cy="12.25" r="3.5" fill="#09bf09"/><text class="num-single" x="61.25" y="12.25" dx="0" dy="-0.5">4</text></g>
<g id="皆-bg5"  class="badge-group"><circle cx="52.72" cy="49.5" r="3.5" fill="#09bf82"/><text class="num-single" x="52.72" y="49.5" dx="0" dy="-0.5">5</text></g>
<g id="皆-bg6"  class="badge-group"><circle cx="34.51" cy="59.97" r="3.5" fill="#0982bf"/><text class="num-single" x="34.51" y="59.97" dx="0" dy="-0.5">6</text></g>
<g id="皆-bg7"  class="badge-group"><circle cx="36.11" cy="68.23" r="3.5" fill="#0909bf"/><text class="num-single" x="36.11" y="68.23" dx="0" dy="-0.5">7</text></g>
<g id="皆-bg8"  class="badge-group"><circle cx="37.22" cy="78.82" r="3.5" fill="#8209bf"/><text class="num-single" x="37.22" y="78.82" dx="0" dy="-0.5">8</text></g>
<g id="皆-bg9"  class="badge-group"><circle cx="38.16" cy="95.19" r="3.5" fill="#bf0982"/><text class="num-single" x="38.16" y="95.19" dx="0" dy="-0.5">9</text></g>
</svg>