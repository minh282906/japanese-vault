<path id="照-s8"  class="stroke" stroke="#0995bf" d="M56.59,51.25C63.940000000000005,50.33,76.75,48.18,82.67,47.81C84.63,47.690000000000005,86.54,49.24,86.35000000000001,51.080000000000005C86.00000000000001,54.50000000000001,83.83000000000001,59.7,82.63000000000001,64.22"/>
<path id="照-s9"  class="stroke" stroke="#0941bf" d="M58.89,66.79C62.76,66.42,73.04,65.62,81.38,65.25C82.47,65.2,83.52,65.16,84.5,65.13"/>
<path id="照-s10"  class="stroke" stroke="#2509bf" d="M21.12,76.88C21.12,82.81,13.290000000000001,91.56,11.24,93.25999999999999"/>
