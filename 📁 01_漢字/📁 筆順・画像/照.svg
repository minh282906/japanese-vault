<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (照)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #照-bg[i]: Thời gian quả bóng số nảy lên
   - #照-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#照-bg1  { animation-delay: 0.05s; }
#照-s1   { stroke-dasharray: 45.3889; stroke-dashoffset: 45.3889; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#照-bg2  { animation-delay: 0.45s; }
#照-s2   { stroke-dasharray: 63.2955; stroke-dashoffset: 63.2955; animation: drawStroke 0.35s ease-out 0.58s forwards; }
#照-bg3  { animation-delay: 0.95s; }
#照-s3   { stroke-dasharray: 19.0775; stroke-dashoffset: 19.0775; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#照-bg4  { animation-delay: 1.32s; }
#照-s4   { stroke-dasharray: 18.8153; stroke-dashoffset: 18.8153; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#照-bg5  { animation-delay: 1.69s; }
#照-s5   { stroke-dasharray: 68.0513; stroke-dashoffset: 68.0513; animation: drawStroke 0.37s ease-out 1.82s forwards; }
#照-bg6  { animation-delay: 2.21s; }
#照-s6   { stroke-dasharray: 30.4456; stroke-dashoffset: 30.4456; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#照-bg7  { animation-delay: 2.58s; }
#照-s7   { stroke-dasharray: 20.8428; stroke-dashoffset: 20.8428; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#照-bg8  { animation-delay: 2.95s; }
#照-s8   { stroke-dasharray: 45.5379; stroke-dashoffset: 45.5379; animation: drawStroke 0.25s ease-out 3.08s forwards; }
#照-bg9  { animation-delay: 3.35s; }
#照-s9   { stroke-dasharray: 25.6667; stroke-dashoffset: 25.6667; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#照-bg10  { animation-delay: 3.72s; }
#照-s10   { stroke-dasharray: 19.5228; stroke-dashoffset: 19.5228; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#照-bg11  { animation-delay: 4.09s; }
#照-s11   { stroke-dasharray: 16.2328; stroke-dashoffset: 16.2328; animation: drawStroke 0.22s ease-out 4.22s forwards; }
#照-bg12  { animation-delay: 4.46s; }
#照-s12   { stroke-dasharray: 17.1019; stroke-dashoffset: 17.1019; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#照-bg13  { animation-delay: 4.83s; }
#照-s13   { stroke-dasharray: 19.2933; stroke-dashoffset: 19.2933; animation: drawStroke 0.22s ease-out 4.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

