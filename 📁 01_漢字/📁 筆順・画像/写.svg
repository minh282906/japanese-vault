<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (写)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #写-bg[i]: Thời gian quả bóng số nảy lên
   - #写-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#写-bg1  { animation-delay: 0.05s; }
#写-s1   { stroke-dasharray: 20.0617; stroke-dashoffset: 20.0617; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#写-bg2  { animation-delay: 0.42s; }
#写-s2   { stroke-dasharray: 81.2042; stroke-dashoffset: 81.2042; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#写-bg3  { animation-delay: 1.02s; }
#写-s3   { stroke-dasharray: 30.0305; stroke-dashoffset: 30.0305; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#写-bg4  { animation-delay: 1.39s; }
#写-s4   { stroke-dasharray: 122.8650; stroke-dashoffset: 122.8650; animation: drawStroke 0.55s ease-out 1.52s forwards; }
#写-bg5  { animation-delay: 2.09s; }
#写-s5   { stroke-dasharray: 80.9587; stroke-dashoffset: 80.9587; animation: drawStroke 0.45s ease-out 2.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #写-s[i]) -->
<path id="写-s1"  class="stroke" stroke="#bf0909" d="M19,16.62C18.88,21.28,16.02,33.47,15,36.24"/>
<path id="写-s2"  class="stroke" stroke="#9abf09" d="M20.47,19.44C32.87,18.62,65.71000000000001,14.98,84.98,14.75C95.38000000000001,14.62,88.5,20.87,84.27000000000001,24.619999999999997"/>
<path id="写-s3"  class="stroke" stroke="#09bf52" d="M40,37C48,36,56.75,34.75,64.5,33.5C66.97,33.1,68.5,33.25,69.75,33.5"/>
<path id="写-s4"  class="stroke" stroke="#0952bf" d="M39.75,25.25C40.75,26.75,40.91,28.72,40.5,31.07C39.5,36.75,37.88,42,36.25,48.47C35.16,52.8,35.73,53.41,40.5,52.39C48.12,50.76,57,49.13,66,48.33C69,48.059999999999995,70.91,50.269999999999996,70.5,53.43C68.5,68.76,64.25,84.00999999999999,59.25,90.97C54.19,98.02,50.9,94.89,45.25,90.28999999999999"/>
<path id="写-s5"  class="stroke" stroke="#9a09bf" d="M13.25,68.45C18.13,69.5,22.119999999999997,69.28,26.25,68.76C42.5,66.75,65,63.32000000000001,81.74000000000001,63.06C86.12,62.99,90.02000000000001,63.24,93.75000000000001,64.04"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="写-bg1"  class="badge-group"><circle cx="19" cy="13.12" r="3.5" fill="#bf0909"/><text class="num-single" x="19" y="13.12" dx="0" dy="-0.5">1</text></g>
<g id="写-bg2"  class="badge-group"><circle cx="20.47" cy="22.94" r="3.5" fill="#9abf09"/><text class="num-single" x="20.47" y="22.94" dx="0" dy="-0.5">2</text></g>
<g id="写-bg3"  class="badge-group"><circle cx="40" cy="37" r="3.5" fill="#09bf52"/><text class="num-single" x="40" y="37" dx="0" dy="-0.5">3</text></g>
<g id="写-bg4"  class="badge-group"><circle cx="39.75" cy="25.25" r="3.5" fill="#0952bf"/><text class="num-single" x="39.75" y="25.25" dx="0" dy="-0.5">4</text></g>
<g id="写-bg5"  class="badge-group"><circle cx="13.25" cy="68.45" r="3.5" fill="#9a09bf"/><text class="num-single" x="13.25" y="68.45" dx="0" dy="-0.5">5</text></g>
</svg>