<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (土)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #土-bg[i]: Thời gian quả bóng số nảy lên
   - #土-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#土-bg1  { animation-delay: 0.05s; }
#土-s1   { stroke-dasharray: 55.0434; stroke-dashoffset: 55.0434; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#土-bg2  { animation-delay: 0.50s; }
#土-s2   { stroke-dasharray: 68.5328; stroke-dashoffset: 68.5328; animation: drawStroke 0.38s ease-out 0.63s forwards; }
#土-bg3  { animation-delay: 1.03s; }
#土-s3   { stroke-dasharray: 82.6060; stroke-dashoffset: 82.6060; animation: drawStroke 0.45s ease-out 1.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #土-s[i]) -->
<path id="土-s1"  class="stroke" stroke="#bf0909" d="M26.63,50.89C28.259999999999998,51.29,31.27,51.49,32.89,51.29C43.5,50,62.12,48,75.66,46.92C78.36999999999999,46.7,80.02,47.11,81.38,47.31"/>
<path id="土-s2"  class="stroke" stroke="#09bf09" d="M52.17,17.37C53.34,18.54,54.190000000000005,20.5,54.190000000000005,22.01C54.190000000000005,32.260000000000005,54.330000000000005,83.07000000000001,54.330000000000005,85.37"/>
<path id="土-s3"  class="stroke" stroke="#0909bf" d="M15.38,87.73C17.5,88.27000000000001,21.39,88.46000000000001,23.5,88.27000000000001C46,86.25,69,84.62,90.34,83.79C93.87,83.65,95.99000000000001,84.05000000000001,97.75,84.32000000000001"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="土-bg1"  class="badge-group"><circle cx="26.63" cy="50.89" r="3.5" fill="#bf0909"/><text class="num-single" x="26.63" y="50.89" dx="0" dy="-0.5">1</text></g>
<g id="土-bg2"  class="badge-group"><circle cx="52.17" cy="17.37" r="3.5" fill="#09bf09"/><text class="num-single" x="52.17" y="17.37" dx="0" dy="-0.5">2</text></g>
<g id="土-bg3"  class="badge-group"><circle cx="15.38" cy="87.73" r="3.5" fill="#0909bf"/><text class="num-single" x="15.38" y="87.73" dx="0" dy="-0.5">3</text></g>
</svg>