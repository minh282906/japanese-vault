<g id="孫-bg9"  class="badge-group"><circle cx="56.15" cy="74.34" r="3.5" fill="#9a09bf"/><text class="num-single" x="56.15" y="74.34" dx="0" dy="-0.5">9</text></g>
<g id="孫-bg10" class="badge-group"><circle cx="82.75" cy="73.25" r="3.5" fill="#bf0976"/><text class="num-double" x="82.75" y="73.25" dx="-0.4" dy="-0.475">10</text></g>
</svg>