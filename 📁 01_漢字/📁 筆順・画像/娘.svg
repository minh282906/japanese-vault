<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (娘)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #娘-bg[i]: Thời gian quả bóng số nảy lên
   - #娘-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#娘-bg1  { animation-delay: 0.05s; }
#娘-s1   { stroke-dasharray: 73.2863; stroke-dashoffset: 73.2863; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#娘-bg2  { animation-delay: 0.60s; }
#娘-s2   { stroke-dasharray: 62.1669; stroke-dashoffset: 62.1669; animation: drawStroke 0.34s ease-out 0.73s forwards; }
#娘-bg3  { animation-delay: 1.09s; }
#娘-s3   { stroke-dasharray: 35.3090; stroke-dashoffset: 35.3090; animation: drawStroke 0.22s ease-out 1.22s forwards; }
#娘-bg4  { animation-delay: 1.46s; }
#娘-s4   { stroke-dasharray: 14.0378; stroke-dashoffset: 14.0378; animation: drawStroke 0.22s ease-out 1.59s forwards; }
#娘-bg5  { animation-delay: 1.83s; }
#娘-s5   { stroke-dasharray: 58.2251; stroke-dashoffset: 58.2251; animation: drawStroke 0.32s ease-out 1.96s forwards; }
#娘-bg6  { animation-delay: 2.30s; }
#娘-s6   { stroke-dasharray: 26.2053; stroke-dashoffset: 26.2053; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#娘-bg7  { animation-delay: 2.67s; }
#娘-s7   { stroke-dasharray: 24.2543; stroke-dashoffset: 24.2543; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#娘-bg8  { animation-delay: 3.04s; }
#娘-s8   { stroke-dasharray: 79.5118; stroke-dashoffset: 79.5118; animation: drawStroke 0.44s ease-out 3.17s forwards; }
#娘-bg9  { animation-delay: 3.63s; }
#娘-s9   { stroke-dasharray: 17.4875; stroke-dashoffset: 17.4875; animation: drawStroke 0.22s ease-out 3.76s forwards; }
#娘-bg10  { animation-delay: 4.00s; }
#娘-s10   { stroke-dasharray: 48.0177; stroke-dashoffset: 48.0177; animation: drawStroke 0.26s ease-out 4.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #娘-s[i]) -->
<path id="娘-s1"  class="stroke" stroke="#bf0909" d="M28.06,19.62C28.459999999999997,20.62,28.68,22,28.47,23.44C27.459999999999997,30.520000000000003,23.75,51.38,18.99,62.21000000000001C18.209999999999997,63.98000000000001,19.389999999999997,64.61000000000001,19.9,64.73C26.2,66.26,31.22,69.07000000000001,35.64,72.64C37.78,74.37,39.730000000000004,76.4,41.49,78.79"/>
<path id="娘-s2"  class="stroke" stroke="#bf7609" d="M41.5,37.39C41.88,38.87,41.71,41.74,41.33,43.57C38.75,56.12,31.12,79.25,13.5,90.5"/>
<path id="娘-s3"  class="stroke" stroke="#9abf09" d="M11.75,47.61C12.37,48.87,13.129999999999999,49.5,14.97,49.11C17.080000000000002,48.66,33,44.75,45.5,41.879999999999995"/>
<path id="娘-s4"  class="stroke" stroke="#2dbf09" d="M66.5,11.75C67.56,12.81,67.85,14.19,67.85,15.39C67.85,19,67.83,22.5,67.83,25.44"/>
<path id="娘-s5"  class="stroke" stroke="#09bf52" d="M52.76,27.73C54.62,28.5,55.69,28.54,58.239999999999995,28.19C64.35,27.34,74.72999999999999,26.1,79.5,25.5C82.89,25.07,84.7,25.58,84.42,29.25C84.04,33.980000000000004,83.14,42.44,82.2,47.989999999999995C81.84,50.089999999999996,81.52,51.73,81.28,52.53999999999999"/>
<path id="娘-s6"  class="stroke" stroke="#09bfbf" d="M56.38,40.5C63,39.75,75.63,38.38,82.45,37.85"/>
<path id="娘-s7"  class="stroke" stroke="#0952bf" d="M56.09,53.17C64,52.300000000000004,71.63,51.550000000000004,80.22,50.72"/>
<path id="娘-s8"  class="stroke" stroke="#2d09bf" d="M53.76,28.23C54.76,29.23,54.86,30.34,54.86,31.43C54.86,36.5,54.87,81.5,54.87,86.2C54.87,90.7,56,91.26,58.559999999999995,88.82000000000001C61.629999999999995,85.91000000000001,64.61,82.94000000000001,68.44,79.13000000000001"/>
<path id="娘-s9"  class="stroke" stroke="#9a09bf" d="M91.72,53.55C91.72,54.75,91.41,55.419999999999995,90.5,56.64C88.75,59.01,83.75,64.13,80.58,66.61"/>
<path id="娘-s10"  class="stroke" stroke="#bf0976" d="M63.13,54.23C68.03,58.06999999999999,79.5,74.37,87.74000000000001,82.88C89.95,85.16,92.50000000000001,87.61999999999999,95.57000000000001,89.39"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="娘-bg1"  class="badge-group"><circle cx="28.06" cy="19.62" r="3.5" fill="#bf0909"/><text class="num-single" x="28.06" y="19.62" dx="0" dy="-0.5">1</text></g>
<g id="娘-bg2"  class="badge-group"><circle cx="41.5" cy="37.39" r="3.5" fill="#bf7609"/><text class="num-single" x="41.5" y="37.39" dx="0" dy="-0.5">2</text></g>
<g id="娘-bg3"  class="badge-group"><circle cx="11.75" cy="47.61" r="3.5" fill="#9abf09"/><text class="num-single" x="11.75" y="47.61" dx="0" dy="-0.5">3</text></g>
<g id="娘-bg4"  class="badge-group"><circle cx="66.5" cy="11.75" r="3.5" fill="#2dbf09"/><text class="num-single" x="66.5" y="11.75" dx="0" dy="-0.5">4</text></g>
