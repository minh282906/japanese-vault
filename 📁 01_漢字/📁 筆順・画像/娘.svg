<g id="娘-bg7"  class="badge-group"><circle cx="56.09" cy="53.17" r="3.5" fill="#0952bf"/><text class="num-single" x="56.09" y="53.17" dx="0" dy="-0.5">7</text></g>
<g id="娘-bg8"  class="badge-group"><circle cx="53.76" cy="31.73" r="3.5" fill="#2d09bf"/><text class="num-single" x="53.76" y="31.73" dx="0" dy="-0.5">8</text></g>
<g id="娘-bg9"  class="badge-group"><circle cx="91.72" cy="53.55" r="3.5" fill="#9a09bf"/><text class="num-single" x="91.72" y="53.55" dx="0" dy="-0.5">9</text></g>
<g id="娘-bg10" class="badge-group"><circle cx="63.13" cy="54.23" r="3.5" fill="#bf0976"/><text class="num-double" x="63.13" y="54.23" dx="-0.4" dy="-0.475">10</text></g>
</svg>