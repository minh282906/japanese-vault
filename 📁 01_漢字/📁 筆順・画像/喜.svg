<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (喜)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #喜-bg[i]: Thời gian quả bóng số nảy lên
   - #喜-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#喜-bg1  { animation-delay: 0.05s; }
#喜-s1   { stroke-dasharray: 50.4635; stroke-dashoffset: 50.4635; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#喜-bg2  { animation-delay: 0.48s; }
#喜-s2   { stroke-dasharray: 22.0076; stroke-dashoffset: 22.0076; animation: drawStroke 0.22s ease-out 0.61s forwards; }
#喜-bg3  { animation-delay: 0.85s; }
#喜-s3   { stroke-dasharray: 36.9152; stroke-dashoffset: 36.9152; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#喜-bg4  { animation-delay: 1.22s; }
#喜-s4   { stroke-dasharray: 16.2990; stroke-dashoffset: 16.2990; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#喜-bg5  { animation-delay: 1.59s; }
#喜-s5   { stroke-dasharray: 46.9621; stroke-dashoffset: 46.9621; animation: drawStroke 0.26s ease-out 1.72s forwards; }
#喜-bg6  { animation-delay: 2.00s; }
#喜-s6   { stroke-dasharray: 30.8004; stroke-dashoffset: 30.8004; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#喜-bg7  { animation-delay: 2.37s; }
#喜-s7   { stroke-dasharray: 12.1041; stroke-dashoffset: 12.1041; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#喜-bg8  { animation-delay: 2.74s; }
#喜-s8   { stroke-dasharray: 12.4982; stroke-dashoffset: 12.4982; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#喜-bg9  { animation-delay: 3.11s; }
#喜-s9   { stroke-dasharray: 83.0349; stroke-dashoffset: 83.0349; animation: drawStroke 0.46s ease-out 3.24s forwards; }
#喜-bg10  { animation-delay: 3.72s; }
#喜-s10   { stroke-dasharray: 20.6195; stroke-dashoffset: 20.6195; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#喜-bg11  { animation-delay: 4.09s; }
#喜-s11   { stroke-dasharray: 52.9456; stroke-dashoffset: 52.9456; animation: drawStroke 0.29s ease-out 4.22s forwards; }
#喜-bg12  { animation-delay: 4.53s; }
#喜-s12   { stroke-dasharray: 32.7498; stroke-dashoffset: 32.7498; animation: drawStroke 0.22s ease-out 4.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

