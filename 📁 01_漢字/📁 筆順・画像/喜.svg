<path id="喜-s9"  class="stroke" stroke="#0909bf" d="M13.25,72.2C17.25,72.75,20.44,72.66,23.64,72.38000000000001C37.79,71.10000000000001,70.1,68.12,86.86,67.18C89.81,67.02000000000001,93.1,66.92,96.01,67.54"/>
<path id="喜-s10"  class="stroke" stroke="#6409bf" d="M34.28,80.43C35.11,81.26,35.51,82.51,35.72,83.60000000000001C36.6,88.18,37.36,93.02000000000001,38.1,97.88000000000001C38.230000000000004,98.74000000000001,38.36,99.60000000000001,38.49,100.46000000000001"/>
<path id="喜-s11"  class="stroke" stroke="#bf09bf" d="M36.64,81.84C46.84,80.65,61.95,78.65,68.97,77.96000000000001C72.23,77.64000000000001,74.3,78.83000000000001,73.2,82.4C72.13000000000001,85.88000000000001,71.31,89.14,69.14,94.24000000000001"/>
