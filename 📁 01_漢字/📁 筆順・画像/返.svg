<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (返)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #返-bg[i]: Thời gian quả bóng số nảy lên
   - #返-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#返-bg1  { animation-delay: 0.05s; }
#返-s1   { stroke-dasharray: 36.8446; stroke-dashoffset: 36.8446; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#返-bg2  { animation-delay: 0.42s; }
#返-s2   { stroke-dasharray: 53.9552; stroke-dashoffset: 53.9552; animation: drawStroke 0.30s ease-out 0.55s forwards; }
#返-bg3  { animation-delay: 0.87s; }
#返-s3   { stroke-dasharray: 82.0955; stroke-dashoffset: 82.0955; animation: drawStroke 0.45s ease-out 1.00s forwards; }
#返-bg4  { animation-delay: 1.47s; }
#返-s4   { stroke-dasharray: 47.7240; stroke-dashoffset: 47.7240; animation: drawStroke 0.26s ease-out 1.60s forwards; }
#返-bg5  { animation-delay: 1.88s; }
#返-s5   { stroke-dasharray: 13.1402; stroke-dashoffset: 13.1402; animation: drawStroke 0.22s ease-out 2.01s forwards; }
#返-bg6  { animation-delay: 2.25s; }
#返-s6   { stroke-dasharray: 64.7962; stroke-dashoffset: 64.7962; animation: drawStroke 0.36s ease-out 2.38s forwards; }
#返-bg7  { animation-delay: 2.76s; }
#返-s7   { stroke-dasharray: 78.7575; stroke-dashoffset: 78.7575; animation: drawStroke 0.43s ease-out 2.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #返-s[i]) -->
<path id="返-s1"  class="stroke" stroke="#bf0909" d="M47.29,21.2C49.629999999999995,21.88,52.39,21.599999999999998,54.65,21.33C61.85,20.45,70.09,18.139999999999997,77.38,17.639999999999997C79.5,17.49,81.66,17.449999999999996,83.74,17.959999999999997"/>
<path id="返-s2"  class="stroke" stroke="#bfa509" d="M49.86,21.63C50.8,22.57,51.12,23.99,51.04,25.729999999999997C50.12,45.5,47.12,59.75,37.84,72.72999999999999"/>
<path id="返-s3"  class="stroke" stroke="#3dbf09" d="M54.16,38.25C55.4,38.54,56.55,38.73,59.029999999999994,38.29C61.50999999999999,37.85,74.17999999999999,34.32,75.88,33.89C77.58,33.45,79.53999999999999,34.980000000000004,78.94999999999999,36.59C72.5,54.38,62.88,69.62,44.91,77.51"/>
<path id="返-s4"  class="stroke" stroke="#09bf71" d="M54.14,47.38C57.35,48.03,71.35,63.42,83.06,72.06C85.54,73.89,88.31,76.05,91.38,76.76"/>
<path id="返-s5"  class="stroke" stroke="#0971bf" d="M18.71,22.5C22.34,23.89,28.090000000000003,28.22,29,30.38"/>
<path id="返-s6"  class="stroke" stroke="#3d09bf" d="M14.75,51.5C17,52.5,18.5,52,19.5,51.75S27.25,48.5,28.75,48C32.45,46.77,33.15,48.75,30.36,51.96C20.869999999999997,62.870000000000005,22.369999999999997,60.5,29.25,66.5C31.18,68.19,30.02,70.77,28.5,72C24.62,75.12,18.25,80.62,15.75,82.5"/>
<path id="返-s7"  class="stroke" stroke="#bf09a5" d="M12.25,84.25C16.63,83.25,22.75,82.75,27.25,83.75S57.239999999999995,89.79,61.75,90.75C72.87,93.13,82.13,94,89.91,94.55"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="返-bg1"  class="badge-group"><circle cx="47.29" cy="17.7" r="3.5" fill="#bf0909"/><text class="num-single" x="47.29" y="17.7" dx="0" dy="-0.5">1</text></g>
<g id="返-bg2"  class="badge-group"><circle cx="49.86" cy="25.13" r="3.5" fill="#bfa509"/><text class="num-single" x="49.86" y="25.13" dx="0" dy="-0.5">2</text></g>
<g id="返-bg3"  class="badge-group"><circle cx="54.16" cy="38.25" r="3.5" fill="#3dbf09"/><text class="num-single" x="54.16" y="38.25" dx="0" dy="-0.5">3</text></g>
<g id="返-bg4"  class="badge-group"><circle cx="54.14" cy="47.38" r="3.5" fill="#09bf71"/><text class="num-single" x="54.14" y="47.38" dx="0" dy="-0.5">4</text></g>
<g id="返-bg5"  class="badge-group"><circle cx="18.71" cy="22.5" r="3.5" fill="#0971bf"/><text class="num-single" x="18.71" y="22.5" dx="0" dy="-0.5">5</text></g>
<g id="返-bg6"  class="badge-group"><circle cx="14.75" cy="51.5" r="3.5" fill="#3d09bf"/><text class="num-single" x="14.75" y="51.5" dx="0" dy="-0.5">6</text></g>
<g id="返-bg7"  class="badge-group"><circle cx="12.25" cy="84.25" r="3.5" fill="#bf09a5"/><text class="num-single" x="12.25" y="84.25" dx="0" dy="-0.5">7</text></g>
</svg>