<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (億)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #億-bg[i]: Thời gian quả bóng số nảy lên
   - #億-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#億-bg1  { animation-delay: 0.05s; }
#億-s1   { stroke-dasharray: 52.4516; stroke-dashoffset: 52.4516; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#億-bg2  { animation-delay: 0.49s; }
#億-s2   { stroke-dasharray: 54.8111; stroke-dashoffset: 54.8111; animation: drawStroke 0.30s ease-out 0.62s forwards; }
#億-bg3  { animation-delay: 0.94s; }
#億-s3   { stroke-dasharray: 10.9865; stroke-dashoffset: 10.9865; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#億-bg4  { animation-delay: 1.31s; }
#億-s4   { stroke-dasharray: 42.1988; stroke-dashoffset: 42.1988; animation: drawStroke 0.23s ease-out 1.44s forwards; }
#億-bg5  { animation-delay: 1.69s; }
#億-s5   { stroke-dasharray: 10.5279; stroke-dashoffset: 10.5279; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#億-bg6  { animation-delay: 2.06s; }
#億-s6   { stroke-dasharray: 12.8960; stroke-dashoffset: 12.8960; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#億-bg7  { animation-delay: 2.43s; }
#億-s7   { stroke-dasharray: 57.4206; stroke-dashoffset: 57.4206; animation: drawStroke 0.32s ease-out 2.56s forwards; }
#億-bg8  { animation-delay: 2.90s; }
#億-s8   { stroke-dasharray: 23.5606; stroke-dashoffset: 23.5606; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#億-bg9  { animation-delay: 3.27s; }
#億-s9   { stroke-dasharray: 56.9120; stroke-dashoffset: 56.9120; animation: drawStroke 0.31s ease-out 3.40s forwards; }
#億-bg10  { animation-delay: 3.73s; }
#億-s10   { stroke-dasharray: 30.1204; stroke-dashoffset: 30.1204; animation: drawStroke 0.22s ease-out 3.86s forwards; }
#億-bg11  { animation-delay: 4.10s; }
#億-s11   { stroke-dasharray: 26.6538; stroke-dashoffset: 26.6538; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#億-bg12  { animation-delay: 4.47s; }
#億-s12   { stroke-dasharray: 13.6807; stroke-dashoffset: 13.6807; animation: drawStroke 0.22s ease-out 4.60s forwards; }
#億-bg13  { animation-delay: 4.84s; }
#億-s13   { stroke-dasharray: 51.3783; stroke-dashoffset: 51.3783; animation: drawStroke 0.28s ease-out 4.97s forwards; }
#億-bg14  { animation-delay: 5.27s; }
#億-s14   { stroke-dasharray: 9.1249; stroke-dashoffset: 9.1249; animation: drawStroke 0.22s ease-out 5.40s forwards; }
#億-bg15  { animation-delay: 5.64s; }
#億-s15   { stroke-dasharray: 11.4384; stroke-dashoffset: 11.4384; animation: drawStroke 0.22s ease-out 5.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
