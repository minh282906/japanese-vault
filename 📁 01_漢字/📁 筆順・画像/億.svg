<path id="億-s9"  class="stroke" stroke="#099abf" d="M46.24,53.8C51.78,52.739999999999995,67.37,50.37,75.62,49.44C79.41000000000001,49.01,81.04,49.5,80.33,53.64C79.73,57.14,78.39999999999999,63.47,77.42,68.73C77.18,70,76.97,71.21000000000001,76.79,72.3"/>
