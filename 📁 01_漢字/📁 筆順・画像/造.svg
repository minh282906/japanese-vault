<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (造)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #造-bg[i]: Thời gian quả bóng số nảy lên
   - #造-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#造-bg1  { animation-delay: 0.05s; }
#造-s1   { stroke-dasharray: 22.8444; stroke-dashoffset: 22.8444; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#造-bg2  { animation-delay: 0.42s; }
#造-s2   { stroke-dasharray: 33.3244; stroke-dashoffset: 33.3244; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#造-bg3  { animation-delay: 0.79s; }
#造-s3   { stroke-dasharray: 34.5880; stroke-dashoffset: 34.5880; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#造-bg4  { animation-delay: 1.16s; }
#造-s4   { stroke-dasharray: 55.9273; stroke-dashoffset: 55.9273; animation: drawStroke 0.31s ease-out 1.29s forwards; }
#造-bg5  { animation-delay: 1.62s; }
#造-s5   { stroke-dasharray: 22.6278; stroke-dashoffset: 22.6278; animation: drawStroke 0.22s ease-out 1.75s forwards; }
#造-bg6  { animation-delay: 1.99s; }
#造-s6   { stroke-dasharray: 50.0025; stroke-dashoffset: 50.0025; animation: drawStroke 0.28s ease-out 2.12s forwards; }
#造-bg7  { animation-delay: 2.42s; }
#造-s7   { stroke-dasharray: 28.1872; stroke-dashoffset: 28.1872; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#造-bg8  { animation-delay: 2.79s; }
#造-s8   { stroke-dasharray: 14.4726; stroke-dashoffset: 14.4726; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#造-bg9  { animation-delay: 3.16s; }
#造-s9   { stroke-dasharray: 62.5775; stroke-dashoffset: 62.5775; animation: drawStroke 0.34s ease-out 3.29s forwards; }
#造-bg10  { animation-delay: 3.65s; }
#造-s10   { stroke-dasharray: 76.0477; stroke-dashoffset: 76.0477; animation: drawStroke 0.42s ease-out 3.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #造-s[i]) -->
<path id="造-s1"  class="stroke" stroke="#bf0909" d="M50.95,21.59C51.010000000000005,22.86,50.96,23.92,50.550000000000004,25.14C48.75000000000001,30.5,46.540000000000006,35.94,42.230000000000004,42.43"/>
<path id="造-s2"  class="stroke" stroke="#bf7609" d="M51.55,32.24C53,32.38,54.489999999999995,32.24,55.62,32.11C62.669999999999995,31.29,72.06,28.89,79.00999999999999,27.71C80.88,27.39,82.74999999999999,27.130000000000003,84.41,27.5"/>
<path id="造-s3"  class="stroke" stroke="#9abf09" d="M64.79,12.74C65.59,13.540000000000001,66.34,15.25,66.34,16.53C66.34,22.75,66.16,42,66.16,46.94"/>
<path id="造-s4"  class="stroke" stroke="#2dbf09" d="M39.38,50.25C41.510000000000005,51.01,44.56,50.89,46.760000000000005,50.56C58.88,48.75,76.49000000000001,46.46,87.26,45.46C89.85000000000001,45.22,92.32000000000001,45.01,94.88000000000001,45.550000000000004"/>
<path id="造-s5"  class="stroke" stroke="#09bf52" d="M49.21,59.72C50,60.51,50.71,61.839999999999996,50.82,62.29C51.75,66.12,52.74,72.11,53.49,77.96C53.65,79.22999999999999,53.81,80.46,53.96,81.6"/>
<path id="造-s6"  class="stroke" stroke="#09bfbf" d="M50.94,60.67C59.83,59.15,71.75,57.57,79.63,56.54C83.05,56.089999999999996,84.5,57.87,83.97999999999999,60.61C83.21,64.66,82.35999999999999,68.55,81.16999999999999,74.01"/>
<path id="造-s7"  class="stroke" stroke="#0952bf" d="M54.65,78.56C61.37,77.75,72.35,76.43,79.05,75.55C80.42,75.36999999999999,81.63,75.21,82.61999999999999,75.07"/>
<path id="造-s8"  class="stroke" stroke="#2d09bf" d="M21.21,19.25C24.84,20.99,30.590000000000003,26.42,31.5,29.130000000000003"/>
<path id="造-s9"  class="stroke" stroke="#9a09bf" d="M13,50.75C15.25,51.75,16.759999999999998,51.28,17.75,51C21.25,50,26,48.12,28.75,47C30.88,46.13,32.13,47.5,31,49.75C23.75,64.26,23.25,59.25,31.25,68.75C32.33,70.03,32,71.5,30.5,72.75S21.5,81,20,81.5"/>
<path id="造-s10"  class="stroke" stroke="#bf0976" d="M15.5,83.75C18.5,83.25,24.41,82.59,29,83C37.38,83.75,59.32,89.96,63.75,91.25C75.75,94.75,83.25,95.75,90,96"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="造-bg1"  class="badge-group"><circle cx="50.95" cy="21.59" r="3.5" fill="#bf0909"/><text class="num-single" x="50.95" y="21.59" dx="0" dy="-0.5">1</text></g>
<g id="造-bg2"  class="badge-group"><circle cx="51.55" cy="32.24" r="3.5" fill="#bf7609"/><text class="num-single" x="51.55" y="32.24" dx="0" dy="-0.5">2</text></g>
<g id="造-bg3"  class="badge-group"><circle cx="64.79" cy="12.74" r="3.5" fill="#9abf09"/><text class="num-single" x="64.79" y="12.74" dx="0" dy="-0.5">3</text></g>
<g id="造-bg4"  class="badge-group"><circle cx="39.38" cy="50.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="39.38" y="50.25" dx="0" dy="-0.5">4</text></g>
<g id="造-bg5"  class="badge-group"><circle cx="49.21" cy="56.22" r="3.5" fill="#09bf52"/><text class="num-single" x="49.21" y="56.22" dx="0" dy="-0.5">5</text></g>
<g id="造-bg6"  class="badge-group"><circle cx="50.94" cy="64.17" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.94" y="64.17" dx="0" dy="-0.5">6</text></g>
<g id="造-bg7"  class="badge-group"><circle cx="54.65" cy="78.56" r="3.5" fill="#0952bf"/><text class="num-single" x="54.65" y="78.56" dx="0" dy="-0.5">7</text></g>
<g id="造-bg8"  class="badge-group"><circle cx="21.21" cy="19.25" r="3.5" fill="#2d09bf"/><text class="num-single" x="21.21" y="19.25" dx="0" dy="-0.5">8</text></g>
<g id="造-bg9"  class="badge-group"><circle cx="13" cy="50.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="13" y="50.75" dx="0" dy="-0.5">9</text></g>
<g id="造-bg10" class="badge-group"><circle cx="15.5" cy="83.75" r="3.5" fill="#bf0976"/><text class="num-double" x="15.5" y="83.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>