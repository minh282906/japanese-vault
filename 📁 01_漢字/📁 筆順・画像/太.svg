<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (太)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #太-bg[i]: Thời gian quả bóng số nảy lên
   - #太-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#太-bg1  { animation-delay: 0.05s; }
#太-s1   { stroke-dasharray: 65.9911; stroke-dashoffset: 65.9911; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#太-bg2  { animation-delay: 0.56s; }
#太-s2   { stroke-dasharray: 85.2614; stroke-dashoffset: 85.2614; animation: drawStroke 0.47s ease-out 0.69s forwards; }
#太-bg3  { animation-delay: 1.18s; }
#太-s3   { stroke-dasharray: 62.7827; stroke-dashoffset: 62.7827; animation: drawStroke 0.35s ease-out 1.31s forwards; }
#太-bg4  { animation-delay: 1.68s; }
#太-s4   { stroke-dasharray: 16.5282; stroke-dashoffset: 16.5282; animation: drawStroke 0.22s ease-out 1.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #太-s[i]) -->
<path id="太-s1"  class="stroke" stroke="#bf0909" d="M19.38,47.86C22.029999999999998,48.78,25.27,48.97,28.009999999999998,48.56C41.629999999999995,46.5,61.879999999999995,43.25,76.68,42.33C79.30000000000001,42.17,82.30000000000001,42.5,84.76,43.25"/>
<path id="太-s2"  class="stroke" stroke="#64bf09" d="M49,18C50,19,50.49,20.41,50.49,22.57C50.49,56.75,37.75,80.5,18,92"/>
<path id="太-s3"  class="stroke" stroke="#09bfbf" d="M50.75,47.75C58.79,57.13,75.47,78.14,85.28,87.47C87.68,89.75,90.25,92.13,93.5,93.25"/>
<path id="太-s4"  class="stroke" stroke="#6409bf" d="M44.5,81.5C48.29,83.66,54.3,90.39,55.25,93.75"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="太-bg1"  class="badge-group"><circle cx="19.38" cy="47.86" r="3.5" fill="#bf0909"/><text class="num-single" x="19.38" y="47.86" dx="0" dy="-0.5">1</text></g>
<g id="太-bg2"  class="badge-group"><circle cx="49" cy="18" r="3.5" fill="#64bf09"/><text class="num-single" x="49" y="18" dx="0" dy="-0.5">2</text></g>
<g id="太-bg3"  class="badge-group"><circle cx="50.75" cy="47.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.75" y="47.75" dx="0" dy="-0.5">3</text></g>
<g id="太-bg4"  class="badge-group"><circle cx="44.5" cy="81.5" r="3.5" fill="#6409bf"/><text class="num-single" x="44.5" y="81.5" dx="0" dy="-0.5">4</text></g>
</svg>