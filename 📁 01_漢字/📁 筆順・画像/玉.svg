<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (玉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #玉-bg[i]: Thời gian quả bóng số nảy lên
   - #玉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#玉-bg1  { animation-delay: 0.05s; }
#玉-s1   { stroke-dasharray: 51.4915; stroke-dashoffset: 51.4915; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#玉-bg2  { animation-delay: 0.48s; }
#玉-s2   { stroke-dasharray: 62.9033; stroke-dashoffset: 62.9033; animation: drawStroke 0.35s ease-out 0.61s forwards; }
#玉-bg3  { animation-delay: 0.98s; }
#玉-s3   { stroke-dasharray: 50.4303; stroke-dashoffset: 50.4303; animation: drawStroke 0.28s ease-out 1.11s forwards; }
#玉-bg4  { animation-delay: 1.41s; }
#玉-s4   { stroke-dasharray: 80.8650; stroke-dashoffset: 80.8650; animation: drawStroke 0.44s ease-out 1.54s forwards; }
#玉-bg5  { animation-delay: 2.00s; }
#玉-s5   { stroke-dasharray: 16.7655; stroke-dashoffset: 16.7655; animation: drawStroke 0.22s ease-out 2.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #玉-s[i]) -->
<path id="玉-s1"  class="stroke" stroke="#bf0909" d="M28.5,23.09C31.45,24.07,34.41,23.62,37.4,23.169999999999998C48.17,21.54,58.61,19.839999999999996,71.50999999999999,18.47C74.28999999999999,18.169999999999998,76.78999999999999,17.849999999999998,79.49999999999999,18.74"/>
<path id="玉-s2"  class="stroke" stroke="#9abf09" d="M52,24.6C53,25.810000000000002,54,27,54,29.01C54,34.39,54.25,79.25,54.25,86.95"/>
<path id="玉-s3"  class="stroke" stroke="#09bf52" d="M28.25,56.12C31.12,57.019999999999996,34.11,56.64,37.03,56.279999999999994C46.83,55.099999999999994,60.93,52.67999999999999,70.13,51.709999999999994C72.75,51.42999999999999,75.64999999999999,51.00999999999999,78.24,51.71999999999999"/>
<path id="玉-s4"  class="stroke" stroke="#0952bf" d="M16,90.01C19.95,91.18,23.96,90.73,27.990000000000002,90.38000000000001C49.040000000000006,88.54,65.96000000000001,86.28000000000002,84.62,85.95000000000002C88.52000000000001,85.88000000000002,92.72,85.73000000000002,96.5,86.91000000000001"/>
<path id="玉-s5"  class="stroke" stroke="#9a09bf" d="M72,64C77.43,66.74,82.09,72.57,83.25,76"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="玉-bg1"  class="badge-group"><circle cx="28.5" cy="23.09" r="3.5" fill="#bf0909"/><text class="num-single" x="28.5" y="23.09" dx="0" dy="-0.5">1</text></g>
<g id="玉-bg2"  class="badge-group"><circle cx="52" cy="24.6" r="3.5" fill="#9abf09"/><text class="num-single" x="52" y="24.6" dx="0" dy="-0.5">2</text></g>
<g id="玉-bg3"  class="badge-group"><circle cx="28.25" cy="56.12" r="3.5" fill="#09bf52"/><text class="num-single" x="28.25" y="56.12" dx="0" dy="-0.5">3</text></g>
<g id="玉-bg4"  class="badge-group"><circle cx="16" cy="90.01" r="3.5" fill="#0952bf"/><text class="num-single" x="16" y="90.01" dx="0" dy="-0.5">4</text></g>
<g id="玉-bg5"  class="badge-group"><circle cx="72" cy="64" r="3.5" fill="#9a09bf"/><text class="num-single" x="72" y="64" dx="0" dy="-0.5">5</text></g>
</svg>