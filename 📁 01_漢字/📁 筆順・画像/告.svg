<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (告)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #告-bg[i]: Thời gian quả bóng số nảy lên
   - #告-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#告-bg1  { animation-delay: 0.05s; }
#告-s1   { stroke-dasharray: 28.9633; stroke-dashoffset: 28.9633; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#告-bg2  { animation-delay: 0.42s; }
#告-s2   { stroke-dasharray: 42.9763; stroke-dashoffset: 42.9763; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#告-bg3  { animation-delay: 0.81s; }
#告-s3   { stroke-dasharray: 44.7585; stroke-dashoffset: 44.7585; animation: drawStroke 0.25s ease-out 0.94s forwards; }
#告-bg4  { animation-delay: 1.21s; }
#告-s4   { stroke-dasharray: 80.8990; stroke-dashoffset: 80.8990; animation: drawStroke 0.44s ease-out 1.34s forwards; }
#告-bg5  { animation-delay: 1.80s; }
#告-s5   { stroke-dasharray: 29.1362; stroke-dashoffset: 29.1362; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#告-bg6  { animation-delay: 2.17s; }
#告-s6   { stroke-dasharray: 71.4761; stroke-dashoffset: 71.4761; animation: drawStroke 0.39s ease-out 2.30s forwards; }
#告-bg7  { animation-delay: 2.71s; }
#告-s7   { stroke-dasharray: 40.0314; stroke-dashoffset: 40.0314; animation: drawStroke 0.22s ease-out 2.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #告-s[i]) -->
<path id="告-s1"  class="stroke" stroke="#bf0909" d="M34.89,20.39C34.93,20.98,35.07,21.93,34.81,22.740000000000002C33.12,28,28.5,37.25,21,45.25"/>
<path id="告-s2"  class="stroke" stroke="#bfa509" d="M33.13,34.17C34.75,34.38,36.040000000000006,34.36,36.980000000000004,34.300000000000004C46.38,33.75000000000001,58.75,32.25000000000001,69.38,30.930000000000003C71.53999999999999,30.660000000000004,73.75,30.520000000000003,75.88,31.040000000000003"/>
<path id="告-s3"  class="stroke" stroke="#3dbf09" d="M52.81,10.13C54.03,11.350000000000001,54.32,12.870000000000001,54.32,14.38C54.32,19.5,54.32,48,54.32,54.5"/>
<path id="告-s4"  class="stroke" stroke="#09bf71" d="M12.88,58.73C14.8,59.269999999999996,18.330000000000002,59.48,20.240000000000002,59.269999999999996C40.13,57.129999999999995,67.63,54.379999999999995,86.67000000000002,53.03999999999999C89.86000000000001,52.81999999999999,91.79000000000002,53.29999999999999,93.39000000000001,53.56999999999999"/>
<path id="告-s5"  class="stroke" stroke="#0971bf" d="M29.75,71.6C30.87,72.64,31.37,73.69,31.61,75.22C32.94,83.84,33.85,90.24,34.56,95.99C34.730000000000004,97.33999999999999,34.88,98.66,35.03,99.96"/>
<path id="告-s6"  class="stroke" stroke="#3d09bf" d="M32.64,74.21C45.85,72.05,64.03,69.52,73.62,68.69C77.26,68.37,79.73,69.69,78.78,73.64C77.44,79.29,75.66,86.16,72.91,94.02"/>
<path id="告-s7"  class="stroke" stroke="#bf09a5" d="M36.04,97.38C45.96,96.85,60.83,95.78,71,95.24C72.84,95.14,74.53,95.05999999999999,76,95"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="告-bg1"  class="badge-group"><circle cx="34.89" cy="20.39" r="3.5" fill="#bf0909"/><text class="num-single" x="34.89" y="20.39" dx="0" dy="-0.5">1</text></g>
<g id="告-bg2"  class="badge-group"><circle cx="33.13" cy="34.17" r="3.5" fill="#bfa509"/><text class="num-single" x="33.13" y="34.17" dx="0" dy="-0.5">2</text></g>
<g id="告-bg3"  class="badge-group"><circle cx="52.81" cy="10.13" r="3.5" fill="#3dbf09"/><text class="num-single" x="52.81" y="10.13" dx="0" dy="-0.5">3</text></g>
<g id="告-bg4"  class="badge-group"><circle cx="12.88" cy="58.73" r="3.5" fill="#09bf71"/><text class="num-single" x="12.88" y="58.73" dx="0" dy="-0.5">4</text></g>
<g id="告-bg5"  class="badge-group"><circle cx="29.75" cy="68.1" r="3.5" fill="#0971bf"/><text class="num-single" x="29.75" y="68.1" dx="0" dy="-0.5">5</text></g>
<g id="告-bg6"  class="badge-group"><circle cx="32.64" cy="77.71" r="3.5" fill="#3d09bf"/><text class="num-single" x="32.64" y="77.71" dx="0" dy="-0.5">6</text></g>
<g id="告-bg7"  class="badge-group"><circle cx="36.04" cy="97.38" r="3.5" fill="#bf09a5"/><text class="num-single" x="36.04" y="97.38" dx="0" dy="-0.5">7</text></g>
</svg>