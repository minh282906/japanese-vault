<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (足)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #足-bg[i]: Thời gian quả bóng số nảy lên
   - #足-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#足-bg1  { animation-delay: 0.05s; }
#足-s1   { stroke-dasharray: 25.2023; stroke-dashoffset: 25.2023; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#足-bg2  { animation-delay: 0.42s; }
#足-s2   { stroke-dasharray: 64.5977; stroke-dashoffset: 64.5977; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#足-bg3  { animation-delay: 0.93s; }
#足-s3   { stroke-dasharray: 36.6253; stroke-dashoffset: 36.6253; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#足-bg4  { animation-delay: 1.30s; }
#足-s4   { stroke-dasharray: 37.8841; stroke-dashoffset: 37.8841; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#足-bg5  { animation-delay: 1.67s; }
#足-s5   { stroke-dasharray: 22.2246; stroke-dashoffset: 22.2246; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#足-bg6  { animation-delay: 2.04s; }
#足-s6   { stroke-dasharray: 40.3735; stroke-dashoffset: 40.3735; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#足-bg7  { animation-delay: 2.41s; }
#足-s7   { stroke-dasharray: 63.4310; stroke-dashoffset: 63.4310; animation: drawStroke 0.35s ease-out 2.54s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #足-s[i]) -->
<path id="足-s1"  class="stroke" stroke="#bf0909" d="M29.75,18.99C30.57,19.81,31.18,20.669999999999998,31.41,21.32C32.56,24.71,34.85,34.8,36.02,40C36.36000000000001,41.51,36.61000000000001,42.61,36.7,43"/>
<path id="足-s2"  class="stroke" stroke="#bfa509" d="M31.56,19.63C43.65,17.759999999999998,65.66,14.62,71.83,14.489999999999998C74.72,14.429999999999998,75.81,16.9,75.53,18.369999999999997C74.8,22.209999999999997,71.59,33.599999999999994,71.02,35.64"/>
<path id="足-s3"  class="stroke" stroke="#3dbf09" d="M37.25,40.74C44.32,40.31,58,38.260000000000005,68.78,37.010000000000005C70.49,36.81,72.12,36.870000000000005,73.64,36.690000000000005"/>
<path id="足-s4"  class="stroke" stroke="#09bf71" d="M52.75,41C53.56,41.81,54.15,42.75,54.15,44.62C54.15,49.73,54.519999999999996,77.11,54.5,78.5"/>
<path id="足-s5"  class="stroke" stroke="#0971bf" d="M55.75,59.25C56.94,59.25,66.25,57.75,73.54,56.53C75.08,56.27,76.53,56.25,77.75,56.25"/>
<path id="足-s6"  class="stroke" stroke="#3d09bf" d="M36.49,55C36.620000000000005,56.5,36.63,58.05,36.29,59.35C34.25,67.13,26.13,83.5,18.5,90.25"/>
<path id="足-s7"  class="stroke" stroke="#bf09a5" d="M33.25,70.75C41.75,72.12,67,87.38,82,92.5C84.94,93.5,88.85,94.18,91.75,94.5"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="足-bg1"  class="badge-group"><circle cx="29.75" cy="15.49" r="3.5" fill="#bf0909"/><text class="num-single" x="29.75" y="15.49" dx="0" dy="-0.5">1</text></g>
<g id="足-bg2"  class="badge-group"><circle cx="31.56" cy="23.13" r="3.5" fill="#bfa509"/><text class="num-single" x="31.56" y="23.13" dx="0" dy="-0.5">2</text></g>
<g id="足-bg3"  class="badge-group"><circle cx="37.25" cy="40.74" r="3.5" fill="#3dbf09"/><text class="num-single" x="37.25" y="40.74" dx="0" dy="-0.5">3</text></g>
<g id="足-bg4"  class="badge-group"><circle cx="52.75" cy="41" r="3.5" fill="#09bf71"/><text class="num-single" x="52.75" y="41" dx="0" dy="-0.5">4</text></g>
<g id="足-bg5"  class="badge-group"><circle cx="55.75" cy="59.25" r="3.5" fill="#0971bf"/><text class="num-single" x="55.75" y="59.25" dx="0" dy="-0.5">5</text></g>
<g id="足-bg6"  class="badge-group"><circle cx="36.49" cy="55" r="3.5" fill="#3d09bf"/><text class="num-single" x="36.49" y="55" dx="0" dy="-0.5">6</text></g>
<g id="足-bg7"  class="badge-group"><circle cx="33.25" cy="70.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="33.25" y="70.75" dx="0" dy="-0.5">7</text></g>
</svg>