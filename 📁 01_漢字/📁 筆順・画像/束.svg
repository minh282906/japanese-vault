<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (束)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #束-bg[i]: Thời gian quả bóng số nảy lên
   - #束-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#束-bg1  { animation-delay: 0.05s; }
#束-s1   { stroke-dasharray: 58.3040; stroke-dashoffset: 58.3040; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#束-bg2  { animation-delay: 0.52s; }
#束-s2   { stroke-dasharray: 22.9225; stroke-dashoffset: 22.9225; animation: drawStroke 0.22s ease-out 0.65s forwards; }
#束-bg3  { animation-delay: 0.89s; }
#束-s3   { stroke-dasharray: 67.1889; stroke-dashoffset: 67.1889; animation: drawStroke 0.37s ease-out 1.02s forwards; }
#束-bg4  { animation-delay: 1.41s; }
#束-s4   { stroke-dasharray: 45.8873; stroke-dashoffset: 45.8873; animation: drawStroke 0.25s ease-out 1.54s forwards; }
#束-bg5  { animation-delay: 1.81s; }
#束-s5   { stroke-dasharray: 88.1359; stroke-dashoffset: 88.1359; animation: drawStroke 0.48s ease-out 1.94s forwards; }
#束-bg6  { animation-delay: 2.44s; }
#束-s6   { stroke-dasharray: 48.0248; stroke-dashoffset: 48.0248; animation: drawStroke 0.26s ease-out 2.57s forwards; }
#束-bg7  { animation-delay: 2.85s; }
#束-s7   { stroke-dasharray: 46.6610; stroke-dashoffset: 46.6610; animation: drawStroke 0.26s ease-out 2.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #束-s[i]) -->
<path id="束-s1"  class="stroke" stroke="#bf0909" d="M24.25,26.39C26.87,26.75,29.85,26.66,32.26,26.37C43.019999999999996,25.09,62.5,22.75,74.12,21.69C77.25,21.41,80.12,21.37,82.25,21.75"/>
<path id="束-s2"  class="stroke" stroke="#bfa509" d="M27.25,41.57C28.15,42.47,28.81,43.63,29.04,44.83C29.98,49.73,30.74,54.9,31.419999999999998,59.739999999999995C31.61,61.10999999999999,31.799999999999997,62.449999999999996,31.979999999999997,63.74999999999999"/>
<path id="束-s3"  class="stroke" stroke="#3dbf09" d="M29.74,43.64C42.5,41.75,69.5,39,76.33,38.49C79.26,38.27,81.1,40.940000000000005,80.33,43.13C78.25,49,77.75,51,76.11,55.49"/>
<path id="束-s4"  class="stroke" stroke="#09bf71" d="M32.92,60.93C43.620000000000005,59.91,61.650000000000006,57.74,73.38,56.7C75.3,56.53,77.05,56.39,78.57,56.290000000000006"/>
<path id="束-s5"  class="stroke" stroke="#0971bf" d="M52,11.25C53.12,12.370000000000001,53.5,13.870000000000001,53.5,15.25C53.5,16.13,53.5,70.88,53.5,91.75C53.5,95.27,53.5,97.83,53.5,99"/>
<path id="束-s6"  class="stroke" stroke="#3d09bf" d="M50.38,60C50.38,61,50.28,61.92,49.54,63.1C42.5,74.38,28.88,86.88,16.5,92.5"/>
<path id="束-s7"  class="stroke" stroke="#bf09a5" d="M56,60.5C60.35,63.71,76.69,77.25,84.89,83.51C87.62,85.59,90.25,87.25,93.38,88.13000000000001"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="束-bg1"  class="badge-group"><circle cx="24.25" cy="26.39" r="3.5" fill="#bf0909"/><text class="num-single" x="24.25" y="26.39" dx="0" dy="-0.5">1</text></g>
<g id="束-bg2"  class="badge-group"><circle cx="27.25" cy="38.07" r="3.5" fill="#bfa509"/><text class="num-single" x="27.25" y="38.07" dx="0" dy="-0.5">2</text></g>
<g id="束-bg3"  class="badge-group"><circle cx="29.74" cy="47.14" r="3.5" fill="#3dbf09"/><text class="num-single" x="29.74" y="47.14" dx="0" dy="-0.5">3</text></g>
<g id="束-bg4"  class="badge-group"><circle cx="32.92" cy="60.93" r="3.5" fill="#09bf71"/><text class="num-single" x="32.92" y="60.93" dx="0" dy="-0.5">4</text></g>
<g id="束-bg5"  class="badge-group"><circle cx="52" cy="11.25" r="3.5" fill="#0971bf"/><text class="num-single" x="52" y="11.25" dx="0" dy="-0.5">5</text></g>
<g id="束-bg6"  class="badge-group"><circle cx="50.38" cy="56.5" r="3.5" fill="#3d09bf"/><text class="num-single" x="50.38" y="56.5" dx="0" dy="-0.5">6</text></g>
<g id="束-bg7"  class="badge-group"><circle cx="56" cy="64.0" r="3.5" fill="#bf09a5"/><text class="num-single" x="56" y="64.0" dx="0" dy="-0.5">7</text></g>
</svg>