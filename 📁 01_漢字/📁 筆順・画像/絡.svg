<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (絡)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #絡-bg[i]: Thời gian quả bóng số nảy lên
   - #絡-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#絡-bg1  { animation-delay: 0.05s; }
#絡-s1   { stroke-dasharray: 39.0891; stroke-dashoffset: 39.0891; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#絡-bg2  { animation-delay: 0.42s; }
#絡-s2   { stroke-dasharray: 70.2222; stroke-dashoffset: 70.2222; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#絡-bg3  { animation-delay: 0.96s; }
#絡-s3   { stroke-dasharray: 13.0236; stroke-dashoffset: 13.0236; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#絡-bg4  { animation-delay: 1.33s; }
#絡-s4   { stroke-dasharray: 36.5674; stroke-dashoffset: 36.5674; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#絡-bg5  { animation-delay: 1.70s; }
#絡-s5   { stroke-dasharray: 21.9270; stroke-dashoffset: 21.9270; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#絡-bg6  { animation-delay: 2.07s; }
#絡-s6   { stroke-dasharray: 16.0712; stroke-dashoffset: 16.0712; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#絡-bg7  { animation-delay: 2.44s; }
#絡-s7   { stroke-dasharray: 33.6271; stroke-dashoffset: 33.6271; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#絡-bg8  { animation-delay: 2.81s; }
#絡-s8   { stroke-dasharray: 85.4531; stroke-dashoffset: 85.4531; animation: drawStroke 0.47s ease-out 2.94s forwards; }
#絡-bg9  { animation-delay: 3.43s; }
#絡-s9   { stroke-dasharray: 48.6229; stroke-dashoffset: 48.6229; animation: drawStroke 0.27s ease-out 3.56s forwards; }
#絡-bg10  { animation-delay: 3.85s; }
#絡-s10   { stroke-dasharray: 26.6893; stroke-dashoffset: 26.6893; animation: drawStroke 0.22s ease-out 3.98s forwards; }
#絡-bg11  { animation-delay: 4.22s; }
#絡-s11   { stroke-dasharray: 51.5451; stroke-dashoffset: 51.5451; animation: drawStroke 0.28s ease-out 4.35s forwards; }
#絡-bg12  { animation-delay: 4.65s; }
#絡-s12   { stroke-dasharray: 24.9285; stroke-dashoffset: 24.9285; animation: drawStroke 0.22s ease-out 4.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

