<path id="絡-s9"  class="stroke" stroke="#0909bf" d="M56.9,29.83C61.129999999999995,34.18,76.47,48.489999999999995,85.41,55.5C88.1,57.61,90.99,59.46,94.06,60.95"/>
<path id="絡-s10"  class="stroke" stroke="#6409bf" d="M54.58,68.76C55.33,69.56,55.75,70.51,55.83,71.61C56.62,77.13,57.379999999999995,83.17,58.019999999999996,89.53C58.209999999999994,91.47,58.4,93.32000000000001,58.58,94.96000000000001"/>
<path id="絡-s11"  class="stroke" stroke="#bf09bf" d="M56.83,70.97C65.50999999999999,69.72,76.19,68.51,81.77,67.9C85.33999999999999,67.51,87.08,68.08000000000001,86.03,72.02000000000001C84.5,77.75,83.25,83,81.57,90"/>
<path id="絡-s12"  class="stroke" stroke="#bf0964" d="M59.51,92.13C65,91.75,72.41,91.19,79.53999999999999,90.63C81.33999999999999,90.49,82.88,90.63,84.38,90.63"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="絡-bg1"  class="badge-group"><circle cx="29.13" cy="13.92" r="3.5" fill="#bf0909"/><text class="num-single" x="29.13" y="13.92" dx="0" dy="-0.5">1</text></g>
