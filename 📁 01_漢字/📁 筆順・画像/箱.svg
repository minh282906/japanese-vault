<path id="箱-s11"  class="stroke" stroke="#0909bf" d="M58.19,47C59.22,48.03,59.849999999999994,49.77,59.849999999999994,51.18C59.849999999999994,52.35,59.849999999999994,80.9,59.849999999999994,92.25C59.849999999999994,94.55,59.849999999999994,96.15,59.849999999999994,96.66"/>
<path id="箱-s12"  class="stroke" stroke="#5209bf" d="M60.39,49.07C62.84,48.76,80.03,45.83,84.74000000000001,45.07C87.86000000000001,44.56,89.19000000000001,45.69,89.17000000000002,48.88C89.14000000000001,54.870000000000005,88.89000000000001,76.78,88.89000000000001,91.39C88.89000000000001,92.75,88.98000000000002,94,88.98000000000002,95.24"/>
