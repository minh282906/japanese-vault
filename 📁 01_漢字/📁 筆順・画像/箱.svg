<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (箱)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #箱-bg[i]: Thời gian quả bóng số nảy lên
   - #箱-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#箱-bg1  { animation-delay: 0.05s; }
#箱-s1   { stroke-dasharray: 26.5265; stroke-dashoffset: 26.5265; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#箱-bg2  { animation-delay: 0.42s; }
#箱-s2   { stroke-dasharray: 23.2614; stroke-dashoffset: 23.2614; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#箱-bg3  { animation-delay: 0.79s; }
#箱-s3   { stroke-dasharray: 10.2413; stroke-dashoffset: 10.2413; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#箱-bg4  { animation-delay: 1.16s; }
#箱-s4   { stroke-dasharray: 22.2306; stroke-dashoffset: 22.2306; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#箱-bg5  { animation-delay: 1.53s; }
#箱-s5   { stroke-dasharray: 29.9665; stroke-dashoffset: 29.9665; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#箱-bg6  { animation-delay: 1.90s; }
#箱-s6   { stroke-dasharray: 13.7715; stroke-dashoffset: 13.7715; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#箱-bg7  { animation-delay: 2.27s; }
#箱-s7   { stroke-dasharray: 33.2844; stroke-dashoffset: 33.2844; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#箱-bg8  { animation-delay: 2.64s; }
#箱-s8   { stroke-dasharray: 54.8277; stroke-dashoffset: 54.8277; animation: drawStroke 0.30s ease-out 2.77s forwards; }
#箱-bg9  { animation-delay: 3.09s; }
#箱-s9   { stroke-dasharray: 38.3091; stroke-dashoffset: 38.3091; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#箱-bg10  { animation-delay: 3.46s; }
#箱-s10   { stroke-dasharray: 12.6081; stroke-dashoffset: 12.6081; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#箱-bg11  { animation-delay: 3.83s; }
#箱-s11   { stroke-dasharray: 50.0808; stroke-dashoffset: 50.0808; animation: drawStroke 0.28s ease-out 3.96s forwards; }
#箱-bg12  { animation-delay: 4.26s; }
#箱-s12   { stroke-dasharray: 78.1408; stroke-dashoffset: 78.1408; animation: drawStroke 0.43s ease-out 4.39s forwards; }
#箱-bg13  { animation-delay: 4.84s; }
#箱-s13   { stroke-dasharray: 27.2326; stroke-dashoffset: 27.2326; animation: drawStroke 0.22s ease-out 4.97s forwards; }
#箱-bg14  { animation-delay: 5.21s; }
#箱-s14   { stroke-dasharray: 27.4812; stroke-dashoffset: 27.4812; animation: drawStroke 0.22s ease-out 5.34s forwards; }
#箱-bg15  { animation-delay: 5.58s; }
#箱-s15   { stroke-dasharray: 26.4626; stroke-dashoffset: 26.4626; animation: drawStroke 0.22s ease-out 5.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
