<path id="箱-s8"  class="stroke" stroke="#09bf9a" d="M34.97,42.5C35.92,43.45,36.28,44.88,36.28,46.11C36.28,48.5,36.14,78.25,36.1,91.38C36.09,94.1,36.08,96.1,36.08,97"/>
<path id="箱-s9"  class="stroke" stroke="#099abf" d="M35.5,55C35.5,56.12,35.25,56.85,34.97,57.53C30.87,67.56,22.57,79.6,14.54,86.47"/>
