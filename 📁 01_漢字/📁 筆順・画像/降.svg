<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (降)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #降-bg[i]: Thời gian quả bóng số nảy lên
   - #降-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#降-bg1  { animation-delay: 0.05s; }
#降-s1   { stroke-dasharray: 45.9274; stroke-dashoffset: 45.9274; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#降-bg2  { animation-delay: 0.45s; }
#降-s2   { stroke-dasharray: 38.6864; stroke-dashoffset: 38.6864; animation: drawStroke 0.22s ease-out 0.58s forwards; }
#降-bg3  { animation-delay: 0.82s; }
#降-s3   { stroke-dasharray: 72.7688; stroke-dashoffset: 72.7688; animation: drawStroke 0.40s ease-out 0.95s forwards; }
#降-bg4  { animation-delay: 1.37s; }
#降-s4   { stroke-dasharray: 27.8930; stroke-dashoffset: 27.8930; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#降-bg5  { animation-delay: 1.74s; }
#降-s5   { stroke-dasharray: 72.1301; stroke-dashoffset: 72.1301; animation: drawStroke 0.40s ease-out 1.87s forwards; }
#降-bg6  { animation-delay: 2.29s; }
#降-s6   { stroke-dasharray: 47.7716; stroke-dashoffset: 47.7716; animation: drawStroke 0.26s ease-out 2.42s forwards; }
#降-bg7  { animation-delay: 2.70s; }
#降-s7   { stroke-dasharray: 36.1860; stroke-dashoffset: 36.1860; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#降-bg8  { animation-delay: 3.07s; }
#降-s8   { stroke-dasharray: 16.6704; stroke-dashoffset: 16.6704; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#降-bg9  { animation-delay: 3.44s; }
#降-s9   { stroke-dasharray: 53.5231; stroke-dashoffset: 53.5231; animation: drawStroke 0.29s ease-out 3.57s forwards; }
#降-bg10  { animation-delay: 3.88s; }
#降-s10   { stroke-dasharray: 51.8001; stroke-dashoffset: 51.8001; animation: drawStroke 0.28s ease-out 4.01s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #降-s[i]) -->
<path id="降-s1"  class="stroke" stroke="#bf0909" d="M12.5,21C14.120000000000001,21.5,15.879999999999999,21.62,17.58,21.35C22.599999999999998,20.55,27.75,19.12,31.08,18.18C34.1,17.33,35.489999999999995,19.49,34.18,21.95C32.87,24.41,27.29,36.379999999999995,24.990000000000002,39.9"/>
