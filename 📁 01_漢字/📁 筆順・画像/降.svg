<path id="降-s4"  class="stroke" stroke="#2dbf09" d="M55.69,13.25C55.739999999999995,13.76,55.79,14.57,55.599999999999994,15.3C54.489999999999995,19.630000000000003,48.13999999999999,29.130000000000003,39.449999999999996,34.95"/>
<path id="降-s5"  class="stroke" stroke="#09bf52" d="M58.43,16.24C59.37,16.38,60.33,16.319999999999997,61.06,16.15C63.870000000000005,15.499999999999998,69.76,14.299999999999999,73.28,13.419999999999998C75.69,12.809999999999999,77.22,14.039999999999997,76.26,16.259999999999998C72.12,25.879999999999995,57.620000000000005,45.379999999999995,40.74,51.989999999999995"/>
<path id="降-s6"  class="stroke" stroke="#09bfbf" d="M53.03,25.59C56.44,26.2,77.13,40.85,86.00999999999999,46.480000000000004C88.47999999999999,48.040000000000006,91.00999999999999,49.35,93.74999999999999,50.38"/>
<path id="降-s7"  class="stroke" stroke="#0952bf" d="M46.75,57C48.75,57.38,50.71,57.26,52.4,57.13C58.879999999999995,56.620000000000005,70.53,55,77.00999999999999,54.510000000000005C78.89999999999999,54.370000000000005,80.88999999999999,54.2,82.74999999999999,54.650000000000006"/>
<path id="降-s8"  class="stroke" stroke="#2d09bf" d="M50.41,57.87C51.15,58.61,51.5,59.75,51.43,60.8C51.08,66.25,51.12,70.00999999999999,50.78,74.25999999999999"/>
<path id="降-s9"  class="stroke" stroke="#9a09bf" d="M39.25,75.64C42.37,76.13,44.51,75.99,46.9,75.69C58.25,74.25,76.52,72.19,85.47999999999999,71.69C87.86999999999999,71.56,90.10999999999999,71.48,92.49999999999999,72.00999999999999"/>
<path id="降-s10"  class="stroke" stroke="#bf0976" d="M66.62,45.75C67.56,46.69,67.89,48.25,67.89,49.92C67.89,52.67,67.76,79,67.76,91.75C67.76,94.33,67.7,96.28,67.66000000000001,97.25"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="降-bg1"  class="badge-group"><circle cx="12.5" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="12.5" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="降-bg2"  class="badge-group"><circle cx="24.99" cy="39.91" r="3.5" fill="#bf7609"/><text class="num-single" x="24.99" y="39.91" dx="0" dy="-0.5">2</text></g>
