<g id="降-bg9"  class="badge-group"><circle cx="39.25" cy="75.64" r="3.5" fill="#9a09bf"/><text class="num-single" x="39.25" y="75.64" dx="0" dy="-0.5">9</text></g>
<g id="降-bg10" class="badge-group"><circle cx="66.62" cy="45.75" r="3.5" fill="#bf0976"/><text class="num-double" x="66.62" y="45.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>