<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (沈)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #沈-bg[i]: Thời gian quả bóng số nảy lên
   - #沈-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#沈-bg1  { animation-delay: 0.05s; }
#沈-s1   { stroke-dasharray: 12.0683; stroke-dashoffset: 12.0683; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#沈-bg2  { animation-delay: 0.42s; }
#沈-s2   { stroke-dasharray: 12.4056; stroke-dashoffset: 12.4056; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#沈-bg3  { animation-delay: 0.79s; }
#沈-s3   { stroke-dasharray: 24.7782; stroke-dashoffset: 24.7782; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#沈-bg4  { animation-delay: 1.16s; }
#沈-s4   { stroke-dasharray: 18.4404; stroke-dashoffset: 18.4404; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#沈-bg5  { animation-delay: 1.53s; }
#沈-s5   { stroke-dasharray: 60.0461; stroke-dashoffset: 60.0461; animation: drawStroke 0.33s ease-out 1.66s forwards; }
#沈-bg6  { animation-delay: 2.01s; }
#沈-s6   { stroke-dasharray: 93.4984; stroke-dashoffset: 93.4984; animation: drawStroke 0.51s ease-out 2.14s forwards; }
#沈-bg7  { animation-delay: 2.67s; }
#沈-s7   { stroke-dasharray: 71.2588; stroke-dashoffset: 71.2588; animation: drawStroke 0.39s ease-out 2.80s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #沈-s[i]) -->
<path id="沈-s1"  class="stroke" stroke="#bf0909" d="M23.13,20.25C26.439999999999998,21.55,31.669999999999998,25.58,32.5,27.59"/>
<path id="沈-s2"  class="stroke" stroke="#bfa509" d="M14.75,40.75C18.009999999999998,42.16,23.18,46.55,24,48.75"/>
<path id="沈-s3"  class="stroke" stroke="#3dbf09" d="M13.25,89.21C14.870000000000001,89.75,15.82,89.08,16.75,87.46C19.87,82.00999999999999,21.87,78.38,26.5,69.50999999999999"/>
<path id="沈-s4"  class="stroke" stroke="#09bf71" d="M41.79,33.51C41.79,37.64,40.04,49,39.25,51.75"/>
<path id="沈-s5"  class="stroke" stroke="#0971bf" d="M42.74,36.49C55.25,33.75,71.75,30.880000000000003,83.69,29.840000000000003C95.71,28.790000000000003,87.49,37.25,83.24,40.620000000000005"/>
<path id="沈-s6"  class="stroke" stroke="#3d09bf" d="M61.72,11C62.86,12.14,63.23,13.370000000000001,63.29,15.26C64,38.62,62.25,76.5,30.67,92.42"/>
<path id="沈-s7"  class="stroke" stroke="#bf09a5" d="M65.24,52.62C65.97999999999999,53.809999999999995,66.36,55.209999999999994,66.36,57.05C66.36,64.88,66.33,74.69,66.33,80.25C66.33,90.13,68.5,92.03,82,92.03C93.87,92.03,94.89,89.75,94.89,81.91"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="沈-bg1"  class="badge-group"><circle cx="23.13" cy="20.25" r="3.5" fill="#bf0909"/><text class="num-single" x="23.13" y="20.25" dx="0" dy="-0.5">1</text></g>
<g id="沈-bg2"  class="badge-group"><circle cx="14.75" cy="40.75" r="3.5" fill="#bfa509"/><text class="num-single" x="14.75" y="40.75" dx="0" dy="-0.5">2</text></g>
<g id="沈-bg3"  class="badge-group"><circle cx="13.25" cy="89.21" r="3.5" fill="#3dbf09"/><text class="num-single" x="13.25" y="89.21" dx="0" dy="-0.5">3</text></g>
<g id="沈-bg4"  class="badge-group"><circle cx="41.79" cy="30.01" r="3.5" fill="#09bf71"/><text class="num-single" x="41.79" y="30.01" dx="0" dy="-0.5">4</text></g>
<g id="沈-bg5"  class="badge-group"><circle cx="42.74" cy="39.99" r="3.5" fill="#0971bf"/><text class="num-single" x="42.74" y="39.99" dx="0" dy="-0.5">5</text></g>
<g id="沈-bg6"  class="badge-group"><circle cx="61.72" cy="11" r="3.5" fill="#3d09bf"/><text class="num-single" x="61.72" y="11" dx="0" dy="-0.5">6</text></g>
<g id="沈-bg7"  class="badge-group"><circle cx="65.24" cy="52.62" r="3.5" fill="#bf09a5"/><text class="num-single" x="65.24" y="52.62" dx="0" dy="-0.5">7</text></g>
</svg>