<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (復)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #復-bg[i]: Thời gian quả bóng số nảy lên
   - #復-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#復-bg1  { animation-delay: 0.05s; }
#復-s1   { stroke-dasharray: 28.3013; stroke-dashoffset: 28.3013; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#復-bg2  { animation-delay: 0.42s; }
#復-s2   { stroke-dasharray: 40.8854; stroke-dashoffset: 40.8854; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#復-bg3  { animation-delay: 0.79s; }
#復-s3   { stroke-dasharray: 47.0423; stroke-dashoffset: 47.0423; animation: drawStroke 0.26s ease-out 0.92s forwards; }
#復-bg4  { animation-delay: 1.20s; }
#復-s4   { stroke-dasharray: 23.6369; stroke-dashoffset: 23.6369; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#復-bg5  { animation-delay: 1.57s; }
#復-s5   { stroke-dasharray: 32.7988; stroke-dashoffset: 32.7988; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#復-bg6  { animation-delay: 1.94s; }
#復-s6   { stroke-dasharray: 22.5913; stroke-dashoffset: 22.5913; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#復-bg7  { animation-delay: 2.31s; }
#復-s7   { stroke-dasharray: 51.2152; stroke-dashoffset: 51.2152; animation: drawStroke 0.28s ease-out 2.44s forwards; }
#復-bg8  { animation-delay: 2.74s; }
#復-s8   { stroke-dasharray: 25.7008; stroke-dashoffset: 25.7008; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#復-bg9  { animation-delay: 3.11s; }
#復-s9   { stroke-dasharray: 23.2103; stroke-dashoffset: 23.2103; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#復-bg10  { animation-delay: 3.48s; }
#復-s10   { stroke-dasharray: 25.4892; stroke-dashoffset: 25.4892; animation: drawStroke 0.22s ease-out 3.61s forwards; }
#復-bg11  { animation-delay: 3.85s; }
#復-s11   { stroke-dasharray: 68.6516; stroke-dashoffset: 68.6516; animation: drawStroke 0.38s ease-out 3.98s forwards; }
#復-bg12  { animation-delay: 4.38s; }
#復-s12   { stroke-dasharray: 44.3334; stroke-dashoffset: 44.3334; animation: drawStroke 0.24s ease-out 4.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

