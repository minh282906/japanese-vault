<path id="復-s8"  class="stroke" stroke="#0964bf" d="M56.83,44.56C65.5,43.25,74,41.870000000000005,82.3,41.160000000000004"/>
<path id="復-s9"  class="stroke" stroke="#0909bf" d="M57.94,54.01C65,53.37,73.5,52.12,81.03999999999999,51.79"/>
<path id="復-s10"  class="stroke" stroke="#6409bf" d="M59.58,61.25C59.71,62.36,59.269999999999996,63.4,58.78,64.39C56.38,68.63,51.38,75,43.89,80.67"/>
<path id="復-s11"  class="stroke" stroke="#bf09bf" d="M61.72,65.48C62.75,65.63000000000001,63.83,65.58,64.53999999999999,65.4C68.00999999999999,64.51,73.35999999999999,62.92000000000001,76.77,62.120000000000005C79.11,61.57000000000001,80.38,63.260000000000005,79.42999999999999,65.5C75.97,73.62,60.25,91,45,97"/>
<path id="復-s12"  class="stroke" stroke="#bf0964" d="M55.65,73.81C61.12,76.87,76.63,88.03,85.19,92.87C87.74,94.32000000000001,90.69,95.83,93.5,96.71000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
