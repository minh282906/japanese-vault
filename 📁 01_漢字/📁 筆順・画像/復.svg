<path id="復-s6"  class="stroke" stroke="#09bf64" d="M53.52,33.65C54.25,34.379999999999995,54.68,35.37,54.800000000000004,36.4C55.25000000000001,40.25,56.150000000000006,46.86,56.870000000000005,52.48C57.1,54.3,57.27,55.56999999999999,57.300000000000004,55.739999999999995"/>
