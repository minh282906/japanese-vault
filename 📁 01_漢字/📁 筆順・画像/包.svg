<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (包)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #包-bg[i]: Thời gian quả bóng số nảy lên
   - #包-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#包-bg1  { animation-delay: 0.05s; }
#包-s1   { stroke-dasharray: 41.2055; stroke-dashoffset: 41.2055; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#包-bg2  { animation-delay: 0.43s; }
#包-s2   { stroke-dasharray: 99.2118; stroke-dashoffset: 99.2118; animation: drawStroke 0.55s ease-out 0.56s forwards; }
#包-bg3  { animation-delay: 1.13s; }
#包-s3   { stroke-dasharray: 48.1268; stroke-dashoffset: 48.1268; animation: drawStroke 0.26s ease-out 1.26s forwards; }
#包-bg4  { animation-delay: 1.54s; }
#包-s4   { stroke-dasharray: 28.9108; stroke-dashoffset: 28.9108; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#包-bg5  { animation-delay: 1.91s; }
#包-s5   { stroke-dasharray: 96.8717; stroke-dashoffset: 96.8717; animation: drawStroke 0.53s ease-out 2.04s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #包-s[i]) -->
<path id="包-s1"  class="stroke" stroke="#bf0909" d="M39,11C39.06,11.81,39.08,12.91,38.62,14.01C35.65,21.22,27.59,34.27,16.5,44.8"/>
<path id="包-s2"  class="stroke" stroke="#9abf09" d="M35.66,26.05C37,26.5,38.239999999999995,26.68,40.04,26.51C45.379999999999995,26.01,72.81,22.840000000000003,77.18,22.44C79.25,22.25,81.62,23.69,81.5,26.25C81.25,31.5,77.5,54.75,71.88,66.42C69.77,70.8,67.46,68.13,64.86999999999999,65.28"/>
<path id="包-s3"  class="stroke" stroke="#09bf52" d="M27.54,43.7C29.25,44.5,30.9,44.75,33.56,44.400000000000006C38.22,43.790000000000006,48.67,42.53000000000001,52.5,42.11000000000001C55.98,41.730000000000004,57.58,43.09,56.67,46.64000000000001C56.120000000000005,48.790000000000006,54.7,54.70000000000001,53.410000000000004,61.30000000000001"/>
<path id="包-s4"  class="stroke" stroke="#0952bf" d="M26.88,62.62C28.38,63.37,29.74,63.699999999999996,31.88,63.68C37.56,63.63,44.69,62.92,50.629999999999995,62.31C52.419999999999995,62.13,54.099999999999994,62.13,55.559999999999995,62.050000000000004"/>
<path id="包-s5"  class="stroke" stroke="#9a09bf" d="M28.74,63.53C29.54,64.33,29.88,65,29.88,66.35C29.88,72.64,29.619999999999997,77.91,29.619999999999997,83.22999999999999C29.619999999999997,94.74,31.009999999999998,95.92999999999999,60.29,95.92999999999999C87.50999999999999,95.92999999999999,89.50999999999999,92.74,89.50999999999999,81.75999999999999"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="包-bg1"  class="badge-group"><circle cx="39" cy="11" r="3.5" fill="#bf0909"/><text class="num-single" x="39" y="11" dx="0" dy="-0.5">1</text></g>
<g id="包-bg2"  class="badge-group"><circle cx="35.66" cy="26.05" r="3.5" fill="#9abf09"/><text class="num-single" x="35.66" y="26.05" dx="0" dy="-0.5">2</text></g>
<g id="包-bg3"  class="badge-group"><circle cx="27.54" cy="43.7" r="3.5" fill="#09bf52"/><text class="num-single" x="27.54" y="43.7" dx="0" dy="-0.5">3</text></g>
<g id="包-bg4"  class="badge-group"><circle cx="26.88" cy="59.12" r="3.5" fill="#0952bf"/><text class="num-single" x="26.88" y="59.12" dx="0" dy="-0.5">4</text></g>
<g id="包-bg5"  class="badge-group"><circle cx="28.74" cy="67.03" r="3.5" fill="#9a09bf"/><text class="num-single" x="28.74" y="67.03" dx="0" dy="-0.5">5</text></g>
</svg>