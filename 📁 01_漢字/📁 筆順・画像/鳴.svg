<path id="鳴-s6"  class="stroke" stroke="#09bf23" d="M51.81,23.72C58.540000000000006,22.849999999999998,74.54,20.54,75.83,20.619999999999997C78.34,20.779999999999998,79.56,22.769999999999996,79.34,24.629999999999995C79.22,25.619999999999994,78.5,32.239999999999995,77.43,40.489999999999995C77.26,41.809999999999995,77.08000000000001,43.169999999999995,76.89,44.55"/>
<path id="鳴-s7"  class="stroke" stroke="#09bf71" d="M51.22,34C55.25,33.63,75.09,31.25,77.5,31.4"/>
