<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鳴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鳴-bg[i]: Thời gian quả bóng số nảy lên
   - #鳴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鳴-bg1  { animation-delay: 0.05s; }
#鳴-s1   { stroke-dasharray: 23.4929; stroke-dashoffset: 23.4929; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鳴-bg2  { animation-delay: 0.42s; }
#鳴-s2   { stroke-dasharray: 40.5377; stroke-dashoffset: 40.5377; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鳴-bg3  { animation-delay: 0.79s; }
#鳴-s3   { stroke-dasharray: 18.9599; stroke-dashoffset: 18.9599; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#鳴-bg4  { animation-delay: 1.16s; }
#鳴-s4   { stroke-dasharray: 14.6572; stroke-dashoffset: 14.6572; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#鳴-bg5  { animation-delay: 1.53s; }
#鳴-s5   { stroke-dasharray: 50.9395; stroke-dashoffset: 50.9395; animation: drawStroke 0.28s ease-out 1.66s forwards; }
#鳴-bg6  { animation-delay: 1.96s; }
#鳴-s6   { stroke-dasharray: 50.2989; stroke-dashoffset: 50.2989; animation: drawStroke 0.28s ease-out 2.09s forwards; }
#鳴-bg7  { animation-delay: 2.39s; }
#鳴-s7   { stroke-dasharray: 26.4140; stroke-dashoffset: 26.4140; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#鳴-bg8  { animation-delay: 2.76s; }
#鳴-s8   { stroke-dasharray: 24.8662; stroke-dashoffset: 24.8662; animation: drawStroke 0.22s ease-out 2.89s forwards; }
#鳴-bg9  { animation-delay: 3.13s; }
#鳴-s9   { stroke-dasharray: 41.3800; stroke-dashoffset: 41.3800; animation: drawStroke 0.23s ease-out 3.26s forwards; }
#鳴-bg10  { animation-delay: 3.51s; }
#鳴-s10   { stroke-dasharray: 87.0913; stroke-dashoffset: 87.0913; animation: drawStroke 0.48s ease-out 3.64s forwards; }
#鳴-bg11  { animation-delay: 4.14s; }
#鳴-s11   { stroke-dasharray: 14.4348; stroke-dashoffset: 14.4348; animation: drawStroke 0.22s ease-out 4.27s forwards; }
#鳴-bg12  { animation-delay: 4.51s; }
#鳴-s12   { stroke-dasharray: 12.9602; stroke-dashoffset: 12.9602; animation: drawStroke 0.22s ease-out 4.64s forwards; }
#鳴-bg13  { animation-delay: 4.88s; }
#鳴-s13   { stroke-dasharray: 11.1909; stroke-dashoffset: 11.1909; animation: drawStroke 0.22s ease-out 5.01s forwards; }
#鳴-bg14  { animation-delay: 5.25s; }
#鳴-s14   { stroke-dasharray: 11.5443; stroke-dashoffset: 11.5443; animation: drawStroke 0.22s ease-out 5.38s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

