<path id="鳴-s10"  class="stroke" stroke="#0923bf" d="M49.3,71.59C61.25,69.5,84.69999999999999,66.67,90.34,66.18C94.01,65.86000000000001,96.34,68.17,95.24000000000001,71.73C92.62,80.24000000000001,89.62,88.49000000000001,86.23,94.43C83.92,98.52,80.5,98,76.5,93.5"/>
<path id="鳴-s11"  class="stroke" stroke="#3d09bf" d="M32.9,81.88C32.379999999999995,87.25,30.83,92.66,28.52,95.44999999999999"/>
