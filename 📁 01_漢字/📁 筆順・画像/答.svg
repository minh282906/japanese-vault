<path id="答-s10"  class="stroke" stroke="#6409bf" d="M34.57,74.92C35.17,75.49,35.9,76.84,36.06,77.59C37.74,85.63,38.14,90.57000000000001,38.85,96.24000000000001C39,97.41000000000001,39.15,98.13000000000001,39.34,99.45"/>
<path id="答-s11"  class="stroke" stroke="#bf09bf" d="M37.02,76.14C48.370000000000005,74.57000000000001,64.44,73.29,71.43,72.5C74.36000000000001,72.17,76.12,74.7,75.69000000000001,76.63C74.27000000000001,83.19,73.30000000000001,86.03,71.12,92.91999999999999"/>
<path id="答-s12"  class="stroke" stroke="#bf0964" d="M40.37,96.12C48.75,95.63000000000001,58.26,94.95,69.02,94.37C70.33999999999999,94.30000000000001,71.67,94.23,73,94.16000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
