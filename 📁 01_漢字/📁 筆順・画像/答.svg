<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (答)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #答-bg[i]: Thời gian quả bóng số nảy lên
   - #答-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#答-bg1  { animation-delay: 0.05s; }
#答-s1   { stroke-dasharray: 25.4355; stroke-dashoffset: 25.4355; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#答-bg2  { animation-delay: 0.42s; }
#答-s2   { stroke-dasharray: 19.7359; stroke-dashoffset: 19.7359; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#答-bg3  { animation-delay: 0.79s; }
#答-s3   { stroke-dasharray: 12.0693; stroke-dashoffset: 12.0693; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#答-bg4  { animation-delay: 1.16s; }
#答-s4   { stroke-dasharray: 18.1870; stroke-dashoffset: 18.1870; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#答-bg5  { animation-delay: 1.53s; }
#答-s5   { stroke-dasharray: 26.5655; stroke-dashoffset: 26.5655; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#答-bg6  { animation-delay: 1.90s; }
#答-s6   { stroke-dasharray: 12.7705; stroke-dashoffset: 12.7705; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#答-bg7  { animation-delay: 2.27s; }
#答-s7   { stroke-dasharray: 52.2034; stroke-dashoffset: 52.2034; animation: drawStroke 0.29s ease-out 2.40s forwards; }
#答-bg8  { animation-delay: 2.71s; }
#答-s8   { stroke-dasharray: 52.5904; stroke-dashoffset: 52.5904; animation: drawStroke 0.29s ease-out 2.84s forwards; }
#答-bg9  { animation-delay: 3.15s; }
#答-s9   { stroke-dasharray: 28.9592; stroke-dashoffset: 28.9592; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#答-bg10  { animation-delay: 3.52s; }
#答-s10   { stroke-dasharray: 25.2009; stroke-dashoffset: 25.2009; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#答-bg11  { animation-delay: 3.89s; }
#答-s11   { stroke-dasharray: 58.4311; stroke-dashoffset: 58.4311; animation: drawStroke 0.32s ease-out 4.02s forwards; }
#答-bg12  { animation-delay: 4.36s; }
#答-s12   { stroke-dasharray: 32.6890; stroke-dashoffset: 32.6890; animation: drawStroke 0.22s ease-out 4.49s forwards; }
]]>
</style>

