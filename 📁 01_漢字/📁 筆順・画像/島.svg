<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (島)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #島-bg[i]: Thời gian quả bóng số nảy lên
   - #島-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#島-bg1  { animation-delay: 0.05s; }
#島-s1   { stroke-dasharray: 16.6741; stroke-dashoffset: 16.6741; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#島-bg2  { animation-delay: 0.42s; }
#島-s2   { stroke-dasharray: 46.9666; stroke-dashoffset: 46.9666; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#島-bg3  { animation-delay: 0.83s; }
#島-s3   { stroke-dasharray: 60.8498; stroke-dashoffset: 60.8498; animation: drawStroke 0.33s ease-out 0.96s forwards; }
#島-bg4  { animation-delay: 1.31s; }
#島-s4   { stroke-dasharray: 33.3592; stroke-dashoffset: 33.3592; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#島-bg5  { animation-delay: 1.68s; }
#島-s5   { stroke-dasharray: 30.4344; stroke-dashoffset: 30.4344; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#島-bg6  { animation-delay: 2.05s; }
#島-s6   { stroke-dasharray: 49.6693; stroke-dashoffset: 49.6693; animation: drawStroke 0.27s ease-out 2.18s forwards; }
#島-bg7  { animation-delay: 2.47s; }
#島-s7   { stroke-dasharray: 98.7280; stroke-dashoffset: 98.7280; animation: drawStroke 0.54s ease-out 2.60s forwards; }
#島-bg8  { animation-delay: 3.16s; }
#島-s8   { stroke-dasharray: 14.5389; stroke-dashoffset: 14.5389; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#島-bg9  { animation-delay: 3.53s; }
#島-s9   { stroke-dasharray: 55.6632; stroke-dashoffset: 55.6632; animation: drawStroke 0.31s ease-out 3.66s forwards; }
#島-bg10  { animation-delay: 3.99s; }
#島-s10   { stroke-dasharray: 17.0961; stroke-dashoffset: 17.0961; animation: drawStroke 0.22s ease-out 4.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #島-s[i]) -->
<path id="島-s1"  class="stroke" stroke="#bf0909" d="M52.96,9.68C53.06,10.37,52.95,11.01,52.64,11.62C51.4,14.479999999999999,48.22,17.63,42.99,22.57"/>
<path id="島-s2"  class="stroke" stroke="#bf7609" d="M34.63,23.65C35.43,24.45,35.95,25.75,35.95,27.459999999999997C35.95,34.03,35.78,52.56,35.74,64.75999999999999C35.730000000000004,66.8,35.730000000000004,68.67999999999999,35.730000000000004,70.28999999999999"/>
<path id="島-s3"  class="stroke" stroke="#9abf09" d="M36.77,26.05C44.25,24.5,60.63,21.62,68.44,20.8C71.32,20.5,73.12,22.43,72.53999999999999,25.29C71.97999999999999,28.049999999999997,70.33,35.75,68.78999999999999,42.36C68.52,43.51,68.24999999999999,44.63,67.74999999999999,46.19"/>
<path id="島-s4"  class="stroke" stroke="#2dbf09" d="M36.86,36.33C48,34.629999999999995,61.629999999999995,32.879999999999995,69.97999999999999,32.43"/>
<path id="島-s5"  class="stroke" stroke="#09bf52" d="M36.99,47.73C46.13,46.37,59.88,44.75,67.22,44.26"/>
<path id="島-s6"  class="stroke" stroke="#09bfbf" d="M37.03,58.56C48.25,57.25,72.12,54.5,79.25,53.480000000000004C81.49,53.160000000000004,84.5,53.120000000000005,86.38,53.13"/>
<path id="島-s7"  class="stroke" stroke="#0952bf" d="M36.73,69.99C52.5,67.75,72.13999999999999,65.58999999999999,85.75,64.3C91.5,63.75,92.87,65.25,91.75,70.08C89.52,79.64,85.5,88.19,81.75,94.22999999999999C78,100.24999999999999,75.5,97.63,72.25,94.47999999999999"/>
<path id="島-s8"  class="stroke" stroke="#2d09bf" d="M45.9,71.5C46.76,72.36,47.3,73.38,47.3,74.55C47.3,77.25,47.14,81.25,47.14,85.64"/>
<path id="島-s9"  class="stroke" stroke="#9a09bf" d="M26.57,77.43C27.38,78.24000000000001,27.71,79.74000000000001,27.57,80.32000000000001C26.75,83.63000000000001,26.13,86.25,25.52,88.62C25.18,89.93,26.05,90.91000000000001,27.259999999999998,90.59C35.64,88.38000000000001,57.76,84.75,67.46000000000001,84.65"/>
<path id="島-s10"  class="stroke" stroke="#bf0976" d="M69.68,71.56C70.43,72.31,70.53,73.52,70.43,74.11C69.75,77.96,69.19000000000001,80.18,68.19000000000001,85.26C68.02000000000001,86.15,67.83000000000001,87.11,67.62000000000002,88.18"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="島-bg1"  class="badge-group"><circle cx="52.96" cy="9.68" r="3.5" fill="#bf0909"/><text class="num-single" x="52.96" y="9.68" dx="0" dy="-0.5">1</text></g>
<g id="島-bg2"  class="badge-group"><circle cx="34.63" cy="20.15" r="3.5" fill="#bf7609"/><text class="num-single" x="34.63" y="20.15" dx="0" dy="-0.5">2</text></g>
<g id="島-bg3"  class="badge-group"><circle cx="36.77" cy="26.05" r="3.5" fill="#9abf09"/><text class="num-single" x="36.77" y="26.05" dx="0" dy="-0.5">3</text></g>
<g id="島-bg4"  class="badge-group"><circle cx="36.86" cy="39.83" r="3.5" fill="#2dbf09"/><text class="num-single" x="36.86" y="39.83" dx="0" dy="-0.5">4</text></g>
<g id="島-bg5"  class="badge-group"><circle cx="36.99" cy="47.73" r="3.5" fill="#09bf52"/><text class="num-single" x="36.99" y="47.73" dx="0" dy="-0.5">5</text></g>
<g id="島-bg6"  class="badge-group"><circle cx="37.03" cy="58.56" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.03" y="58.56" dx="0" dy="-0.5">6</text></g>
<g id="島-bg7"  class="badge-group"><circle cx="36.73" cy="69.99" r="3.5" fill="#0952bf"/><text class="num-single" x="36.73" y="69.99" dx="0" dy="-0.5">7</text></g>
<g id="島-bg8"  class="badge-group"><circle cx="45.9" cy="71.5" r="3.5" fill="#2d09bf"/><text class="num-single" x="45.9" y="71.5" dx="0" dy="-0.5">8</text></g>
<g id="島-bg9"  class="badge-group"><circle cx="26.57" cy="77.43" r="3.5" fill="#9a09bf"/><text class="num-single" x="26.57" y="77.43" dx="0" dy="-0.5">9</text></g>
<g id="島-bg10" class="badge-group"><circle cx="69.68" cy="71.56" r="3.5" fill="#bf0976"/><text class="num-double" x="69.68" y="71.56" dx="-0.4" dy="-0.475">10</text></g>
</svg>