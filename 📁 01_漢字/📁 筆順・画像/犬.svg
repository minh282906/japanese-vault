<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (犬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #犬-bg[i]: Thời gian quả bóng số nảy lên
   - #犬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#犬-bg1  { animation-delay: 0.05s; }
#犬-s1   { stroke-dasharray: 67.3241; stroke-dashoffset: 67.3241; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#犬-bg2  { animation-delay: 0.57s; }
#犬-s2   { stroke-dasharray: 90.6674; stroke-dashoffset: 90.6674; animation: drawStroke 0.50s ease-out 0.70s forwards; }
#犬-bg3  { animation-delay: 1.22s; }
#犬-s3   { stroke-dasharray: 64.5510; stroke-dashoffset: 64.5510; animation: drawStroke 0.36s ease-out 1.35s forwards; }
#犬-bg4  { animation-delay: 1.73s; }
#犬-s4   { stroke-dasharray: 15.3843; stroke-dashoffset: 15.3843; animation: drawStroke 0.22s ease-out 1.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #犬-s[i]) -->
<path id="犬-s1"  class="stroke" stroke="#bf0909" d="M18.38,46.36C20.75,47,23.759999999999998,47.089999999999996,26.119999999999997,46.83C40.51,45.25,62.629999999999995,42.37,77.37,41.08C79.88000000000001,40.86,83.37,40.75,85.26,41.5"/>
<path id="犬-s2"  class="stroke" stroke="#64bf09" d="M50.25,15.75C51.25,16.83,51.86,17.91,51.99,20.07C53.75,48.25,46.5,79.75,17,92.25"/>
<path id="犬-s3"  class="stroke" stroke="#09bfbf" d="M51.5,45C59.79,56.97,75.28,76.58,86.66,86.85C89.03,88.99,91.25,91,94.75,92.25"/>
<path id="犬-s4"  class="stroke" stroke="#6409bf" d="M67.33,20.25C74.23,24.14,76.11,27.1,78.25,30.75"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="犬-bg1"  class="badge-group"><circle cx="18.38" cy="46.36" r="3.5" fill="#bf0909"/><text class="num-single" x="18.38" y="46.36" dx="0" dy="-0.5">1</text></g>
<g id="犬-bg2"  class="badge-group"><circle cx="50.25" cy="15.75" r="3.5" fill="#64bf09"/><text class="num-single" x="50.25" y="15.75" dx="0" dy="-0.5">2</text></g>
<g id="犬-bg3"  class="badge-group"><circle cx="51.5" cy="45" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.5" y="45" dx="0" dy="-0.5">3</text></g>
<g id="犬-bg4"  class="badge-group"><circle cx="67.33" cy="20.25" r="3.5" fill="#6409bf"/><text class="num-single" x="67.33" y="20.25" dx="0" dy="-0.5">4</text></g>
</svg>