<g id="眠-bg9"  class="badge-group"><circle cx="52.88" cy="53.32" r="3.5" fill="#9a09bf"/><text class="num-single" x="52.88" y="53.32" dx="0" dy="-0.5">9</text></g>
<g id="眠-bg10" class="badge-group"><circle cx="68.23" cy="37.56" r="3.5" fill="#bf0976"/><text class="num-double" x="68.23" y="37.56" dx="-0.4" dy="-0.475">10</text></g>
</svg>