<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (眠)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #眠-bg[i]: Thời gian quả bóng số nảy lên
   - #眠-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#眠-bg1  { animation-delay: 0.05s; }
#眠-s1   { stroke-dasharray: 62.3890; stroke-dashoffset: 62.3890; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#眠-bg2  { animation-delay: 0.54s; }
#眠-s2   { stroke-dasharray: 79.2954; stroke-dashoffset: 79.2954; animation: drawStroke 0.44s ease-out 0.67s forwards; }
#眠-bg3  { animation-delay: 1.13s; }
#眠-s3   { stroke-dasharray: 17.8385; stroke-dashoffset: 17.8385; animation: drawStroke 0.22s ease-out 1.26s forwards; }
#眠-bg4  { animation-delay: 1.50s; }
#眠-s4   { stroke-dasharray: 17.8669; stroke-dashoffset: 17.8669; animation: drawStroke 0.22s ease-out 1.63s forwards; }
#眠-bg5  { animation-delay: 1.87s; }
#眠-s5   { stroke-dasharray: 18.2921; stroke-dashoffset: 18.2921; animation: drawStroke 0.22s ease-out 2.00s forwards; }
#眠-bg6  { animation-delay: 2.24s; }
#眠-s6   { stroke-dasharray: 52.2355; stroke-dashoffset: 52.2355; animation: drawStroke 0.29s ease-out 2.37s forwards; }
#眠-bg7  { animation-delay: 2.68s; }
#眠-s7   { stroke-dasharray: 33.9470; stroke-dashoffset: 33.9470; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#眠-bg8  { animation-delay: 3.05s; }
#眠-s8   { stroke-dasharray: 87.8381; stroke-dashoffset: 87.8381; animation: drawStroke 0.48s ease-out 3.18s forwards; }
#眠-bg9  { animation-delay: 3.68s; }
#眠-s9   { stroke-dasharray: 39.8289; stroke-dashoffset: 39.8289; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#眠-bg10  { animation-delay: 4.05s; }
#眠-s10   { stroke-dasharray: 71.3403; stroke-dashoffset: 71.3403; animation: drawStroke 0.39s ease-out 4.18s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #眠-s[i]) -->
<path id="眠-s1"  class="stroke" stroke="#bf0909" d="M14.12,25.37C15,26.25,15.18,27.64,15.18,29.130000000000003C15.18,30.330000000000002,15.29,66.32,15.23,81.25C15.22,84.98,15.21,87.36,15.21,87.51"/>
<path id="眠-s2"  class="stroke" stroke="#bf7609" d="M15.72,26.95C17.38,26.9,28.259999999999998,24.849999999999998,32.11,24.27C34.88,23.86,35.62,25.33,35.62,27.87C35.62,33.870000000000005,35.629999999999995,60.370000000000005,35.629999999999995,77.49C35.629999999999995,80.25999999999999,35.60999999999999,82.36999999999999,35.62,84.49"/>
<path id="眠-s3"  class="stroke" stroke="#9abf09" d="M16.44,45.23C22.37,44.5,28.880000000000003,43.5,34.14,43.019999999999996"/>
<path id="眠-s4"  class="stroke" stroke="#2dbf09" d="M16.59,63C23.37,62,26.369999999999997,61.62,34.32,60.81"/>
<path id="眠-s5"  class="stroke" stroke="#09bf52" d="M16.33,84.17C21.06,83.5,27.63,82.5,34.51,82.23"/>
<path id="眠-s6"  class="stroke" stroke="#09bfbf" d="M47.06,21.02C48.75,21.5,50.400000000000006,21.38,51.77,21.18C60.410000000000004,19.91,74.24000000000001,18.13,80.24000000000001,17.32C82.46000000000001,17.02,85.55000000000001,17.240000000000002,84.79,20.57C83.7,25.3,82.85000000000001,28.75,81.82000000000001,31.98"/>
<path id="眠-s7"  class="stroke" stroke="#0952bf" d="M50.45,37.06C56.370000000000005,36.120000000000005,73.33,34.14,80.15,33.34C81.22,33.220000000000006,83.61,33.010000000000005,84.15,33.18000000000001"/>
<path id="眠-s8"  class="stroke" stroke="#2d09bf" d="M48.25,21.85C49.2,22.8,49.38,24.080000000000002,49.38,26.16C49.38,28.240000000000002,49.46,82.82,49.46,86.05C49.46,89.63,50.36,89.61999999999999,52.65,87.03C55.46,83.87,60.5,78.01,64.42999999999999,74.55"/>
<path id="眠-s9"  class="stroke" stroke="#9a09bf" d="M52.88,53.32C54.870000000000005,53.75,56.36,53.56,58.730000000000004,53.12C68.63000000000001,51.25,77.13,49.629999999999995,86.89,48.57C88.74,48.37,90.75,48.26,92.27,48.52"/>
<path id="眠-s10"  class="stroke" stroke="#bf0976" d="M68.23,37.56C69.08,38.410000000000004,69.78,40.120000000000005,69.9,41.440000000000005C71.75,63.38000000000001,79.75,80.75,93.56,91.02000000000001C99.11,95.14000000000001,97.42,88.11000000000001,97.42,85.61000000000001"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="眠-bg1"  class="badge-group"><circle cx="14.12" cy="21.87" r="3.5" fill="#bf0909"/><text class="num-single" x="14.12" y="21.87" dx="0" dy="-0.5">1</text></g>
<g id="眠-bg2"  class="badge-group"><circle cx="15.72" cy="30.45" r="3.5" fill="#bf7609"/><text class="num-single" x="15.72" y="30.45" dx="0" dy="-0.5">2</text></g>
