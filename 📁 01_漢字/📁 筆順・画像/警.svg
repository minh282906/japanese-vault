<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (警)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #警-bg[i]: Thời gian quả bóng số nảy lên
   - #警-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#警-bg1  { animation-delay: 0.05s; }
#警-s1   { stroke-dasharray: 43.9402; stroke-dashoffset: 43.9402; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#警-bg2  { animation-delay: 0.44s; }
#警-s2   { stroke-dasharray: 14.6721; stroke-dashoffset: 14.6721; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#警-bg3  { animation-delay: 0.81s; }
#警-s3   { stroke-dasharray: 14.8555; stroke-dashoffset: 14.8555; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#警-bg4  { animation-delay: 1.18s; }
#警-s4   { stroke-dasharray: 21.2217; stroke-dashoffset: 21.2217; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#警-bg5  { animation-delay: 1.55s; }
#警-s5   { stroke-dasharray: 61.7295; stroke-dashoffset: 61.7295; animation: drawStroke 0.34s ease-out 1.68s forwards; }
#警-bg6  { animation-delay: 2.04s; }
#警-s6   { stroke-dasharray: 12.6433; stroke-dashoffset: 12.6433; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#警-bg7  { animation-delay: 2.41s; }
#警-s7   { stroke-dasharray: 22.6545; stroke-dashoffset: 22.6545; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#警-bg8  { animation-delay: 2.78s; }
#警-s8   { stroke-dasharray: 12.9472; stroke-dashoffset: 12.9472; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#警-bg9  { animation-delay: 3.15s; }
#警-s9   { stroke-dasharray: 21.8705; stroke-dashoffset: 21.8705; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#警-bg10  { animation-delay: 3.52s; }
#警-s10   { stroke-dasharray: 24.7007; stroke-dashoffset: 24.7007; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#警-bg11  { animation-delay: 3.89s; }
#警-s11   { stroke-dasharray: 30.9456; stroke-dashoffset: 30.9456; animation: drawStroke 0.22s ease-out 4.02s forwards; }
#警-bg12  { animation-delay: 4.26s; }
#警-s12   { stroke-dasharray: 38.3717; stroke-dashoffset: 38.3717; animation: drawStroke 0.22s ease-out 4.39s forwards; }
#警-bg13  { animation-delay: 4.63s; }
#警-s13   { stroke-dasharray: 9.3671; stroke-dashoffset: 9.3671; animation: drawStroke 0.22s ease-out 4.76s forwards; }
#警-bg14  { animation-delay: 5.00s; }
#警-s14   { stroke-dasharray: 75.8395; stroke-dashoffset: 75.8395; animation: drawStroke 0.42s ease-out 5.13s forwards; }
#警-bg15  { animation-delay: 5.57s; }
#警-s15   { stroke-dasharray: 35.8424; stroke-dashoffset: 35.8424; animation: drawStroke 0.22s ease-out 5.70s forwards; }
#警-bg16  { animation-delay: 5.94s; }
#警-s16   { stroke-dasharray: 34.0647; stroke-dashoffset: 34.0647; animation: drawStroke 0.22s ease-out 6.07s forwards; }
#警-bg17  { animation-delay: 6.31s; }
#警-s17   { stroke-dasharray: 15.5179; stroke-dashoffset: 15.5179; animation: drawStroke 0.22s ease-out 6.44s forwards; }
#警-bg18  { animation-delay: 6.68s; }
#警-s18   { stroke-dasharray: 47.4389; stroke-dashoffset: 47.4389; animation: drawStroke 0.26s ease-out 6.81s forwards; }
#警-bg19  { animation-delay: 7.09s; }
#警-s19   { stroke-dasharray: 32.5596; stroke-dashoffset: 32.5596; animation: drawStroke 0.22s ease-out 7.22s forwards; }
]]>
</style>

