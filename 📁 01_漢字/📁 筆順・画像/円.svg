<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (円)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #円-bg[i]: Thời gian quả bóng số nảy lên
   - #円-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#円-bg1  { animation-delay: 0.05s; }
#円-s1   { stroke-dasharray: 74.2586; stroke-dashoffset: 74.2586; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#円-bg2  { animation-delay: 0.61s; }
#円-s2   { stroke-dasharray: 148.2830; stroke-dashoffset: 148.2830; animation: drawStroke 0.55s ease-out 0.74s forwards; }
#円-bg3  { animation-delay: 1.31s; }
#円-s3   { stroke-dasharray: 35.1578; stroke-dashoffset: 35.1578; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#円-bg4  { animation-delay: 1.68s; }
#円-s4   { stroke-dasharray: 60.7340; stroke-dashoffset: 60.7340; animation: drawStroke 0.33s ease-out 1.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #円-s[i]) -->
<path id="円-s1"  class="stroke" stroke="#bf0909" d="M21.75,19.8C22.66,20.71,23.22,23.03,23.25,25.25C23.45,39.15,23.28,72.94,23.28,87.75C23.28,89.75,23.25,92.74,23.25,93.75"/>
<path id="円-s2"  class="stroke" stroke="#64bf09" d="M24.06,21.56C39.129999999999995,19.88,73.52,15.979999999999999,81.98,15.25C84.88000000000001,15,86.76,17.13,86.76,19.52C86.76,33,86.76,72.73,86.76,87C86.76,96.75,82.51,93.5,78.26,88.5"/>
<path id="円-s3"  class="stroke" stroke="#09bfbf" d="M52.25,20.75C53.13,21.63,53.75,22.75,53.75,24.46C53.75,31.22,53.75,52,53.75,55.5"/>
<path id="円-s4"  class="stroke" stroke="#6409bf" d="M24.75,59.75C39.37,58,67.75,55.5,85.25,54.5"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="円-bg1"  class="badge-group"><circle cx="21.75" cy="16.3" r="3.5" fill="#bf0909"/><text class="num-single" x="21.75" y="16.3" dx="0" dy="-0.5">1</text></g>
<g id="円-bg2"  class="badge-group"><circle cx="24.06" cy="25.06" r="3.5" fill="#64bf09"/><text class="num-single" x="24.06" y="25.06" dx="0" dy="-0.5">2</text></g>
<g id="円-bg3"  class="badge-group"><circle cx="52.25" cy="20.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.25" y="20.75" dx="0" dy="-0.5">3</text></g>
<g id="円-bg4"  class="badge-group"><circle cx="24.75" cy="59.75" r="3.5" fill="#6409bf"/><text class="num-single" x="24.75" y="59.75" dx="0" dy="-0.5">4</text></g>
</svg>