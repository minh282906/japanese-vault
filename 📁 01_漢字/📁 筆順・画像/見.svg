<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢN CHUẨN XÁC: NÉT THANH THOÁT, VỊ TRÍ SỐ CÂN TÂM QUANG HỌC
   ============================================================ */

@keyframes drawStroke {
    0% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* 1. LƯỚI NỀN CHỮ THẬP */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 2. NÉT CHỮ KANJI */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 3. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 4. SỐ 1 CHỮ SỐ (1-7): MẢNH THANH THOÁT, VỊ TRÍ CÂN TÂM */
.num-single {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 7.6px !important;
    font-weight: 375 !important;
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* --- TIMELINE CHUYỂN ĐỘNG (ĐỘC QUYỀN CHỮ 見) --- */
#見-bg1 { animation-delay: 0.05s; }
#見-s1  { stroke-dasharray: 48.6; stroke-dashoffset: 48.6; animation: drawStroke 0.3s ease-out 0.18s forwards; }

#見-bg2 { animation-delay: 0.52s; }
#見-s2  { stroke-dasharray: 81.6; stroke-dashoffset: 81.6; animation: drawStroke 0.4s ease-out 0.65s forwards; }

#見-bg3 { animation-delay: 1.1s; }
#見-s3  { stroke-dasharray: 34.1; stroke-dashoffset: 34.1; animation: drawStroke 0.22s ease-out 1.22s forwards; }

#見-bg4 { animation-delay: 1.48s; }
#見-s4  { stroke-dasharray: 33.9; stroke-dashoffset: 33.9; animation: drawStroke 0.22s ease-out 1.6s forwards; }

#見-bg5 { animation-delay: 1.86s; }
#見-s5  { stroke-dasharray: 33.8; stroke-dashoffset: 33.8; animation: drawStroke 0.22s ease-out 1.98s forwards; }

#見-bg6 { animation-delay: 2.25s; }
#見-s6  { stroke-dasharray: 44.6; stroke-dashoffset: 44.6; animation: drawStroke 0.28s ease-out 2.38s forwards; }

#見-bg7 { animation-delay: 2.7s; }
#見-s7  { stroke-dasharray: 75.8; stroke-dashoffset: 75.8; animation: drawStroke 0.42s ease-out 2.82s forwards; }
]]></style>

<!-- LƯỚI NỀN CHỮ THẬP -->
<path class="grid-cross" d="M55,0 L55,110" />
<path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 NÉT VẼ CHỮ 見 (MÀU SPECTRUM KANJIVG CHUẨN) -->
<path id="見-s1" class="stroke" stroke="#bf0909" d="M32.5,15.46c0.96,0.96,1.18,2.1,1.18,3.52c0,1.12,0.07,27.43-0.02,39.27c-0.02,3.12-0.02,5.21,0.02,5.5"/>
<path id="見-s2" class="stroke" stroke="#bfa509" d="M34.65,17.15c9.23-1.27,22.23-2.65,31.1-3.65c2.99-0.34,4.26,1.01,4.26,3.55c0,2.5-0.1,28.08-0.14,38.96c-0.01,2.91-0.02,4.75-0.02,4.79"/>
<path id="見-s3" class="stroke" stroke="#3dbf09" d="M34.84,31.1c7.28-0.6,25.03-2.98,33.9-3.38"/>
<path id="見-s4" class="stroke" stroke="#09bf71" d="M34.86,44.63C43.38,44,59,42.12,68.6,41.51"/>
<path id="見-s5" class="stroke" stroke="#0971bf" d="M34.71,59.66C44.5,59,58.38,57.5,68.45,57.03"/>
<path id="見-s6" class="stroke" stroke="#3d09bf" d="M41.99,66.75c0.26,1.5,0.01,2.99-0.41,4.04c-2.7,6.83-13.83,20.83-28.41,27.87"/>
<path id="見-s7" class="stroke" stroke="#bf09a5" d="M54.49,61.37c1.07,1.07,1.33,2.59,1.38,4.43c0.2,8.19,0.04,6.2,0.04,18.2c0,10.12,1.23,11.53,18.54,11.53c18.81,0,19.81-1.53,19.81-10.12"/>

<!-- 7 QUẢ BÓNG CHỨA SỐ -->
<g id="見-bg1" class="badge-group"><circle cx="32.5" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" dy="-0.6" x="32.5" y="13.5">1</text></g>
<g id="見-bg2" class="badge-group"><circle cx="41.0" cy="13.5" r="3.5" fill="#bfa509"/><text class="num-single" dy="-0.6" x="41.0" y="13.5">2</text></g>
<g id="見-bg3" class="badge-group"><circle cx="39.0" cy="31.1" r="3.5" fill="#3dbf09"/><text class="num-single" dy="-0.6" x="39.0" y="31.1">3</text></g>
<g id="見-bg4" class="badge-group"><circle cx="39.0" cy="44.6" r="3.5" fill="#09bf71"/><text class="num-single" dy="-0.6" x="39.0" y="44.6">4</text></g>
<g id="見-bg5" class="badge-group"><circle cx="39.0" cy="59.7" r="3.5" fill="#0971bf"/><text class="num-single" dy="-0.6" x="39.0" y="59.7">5</text></g>
<g id="見-bg6" class="badge-group"><circle cx="42.0" cy="67.0" r="3.5" fill="#3d09bf"/><text class="num-single" dy="-0.6" x="42.0" y="67.0">6</text></g>
<g id="見-bg7" class="badge-group"><circle cx="54.5" cy="61.5" r="3.5" fill="#bf09a5"/><text class="num-single" dy="-0.6" x="54.5" y="61.5">7</text></g>
</svg>