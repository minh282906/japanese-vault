<path id="現-s6"  class="stroke" stroke="#09bf8d" d="M51.38,18.4C55.870000000000005,17.75,76.04,15.459999999999999,78.65,15.249999999999998C80.82000000000001,15.069999999999999,82.35000000000001,16.509999999999998,82.35000000000001,18.549999999999997C82.35000000000001,20.06,82.27000000000001,41.16,82.26,56.629999999999995C82.26,58.38999999999999,82.26,59.589999999999996,82.26,61.17999999999999"/>
<path id="現-s7"  class="stroke" stroke="#098dbf" d="M52.08,32.6C60.5,31.5,72.25,30.12,80.91,29.98"/>
<path id="現-s8"  class="stroke" stroke="#092abf" d="M52.07,46.38C61,45.63,74.63,44.25,81.08,44.010000000000005"/>
<path id="現-s9"  class="stroke" stroke="#4b09bf" d="M52.05,59.91C59,59.5,73.75,58.129999999999995,80.81,57.79"/>
<path id="現-s10"  class="stroke" stroke="#ae09bf" d="M57.63,65.52C57.690000000000005,66.22999999999999,57.760000000000005,67.36,57.510000000000005,68.38C56.050000000000004,74.41,48.63,87.86999999999999,36.25,95.75"/>
<path id="現-s11"  class="stroke" stroke="#bf096c" d="M68.73,61.47C69.51,62.25,69.93,63.5,69.93,64.95C69.93,69.62,69.79,77.82000000000001,69.79,83.30000000000001C69.79,93.50000000000001,71.37,94.63000000000001,83.72,94.63000000000001C95.74,94.63000000000001,96.24,92.38000000000001,96.24,85.4"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="現-bg1"  class="badge-group"><circle cx="11.5" cy="23.5" r="3.5" fill="#bf0909"/><text class="num-single" x="11.5" y="23.5" dx="0" dy="-0.5">1</text></g>
