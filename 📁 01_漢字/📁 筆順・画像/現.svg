<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (現)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #現-bg[i]: Thời gian quả bóng số nảy lên
   - #現-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#現-bg1  { animation-delay: 0.05s; }
#現-s1   { stroke-dasharray: 31.1962; stroke-dashoffset: 31.1962; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#現-bg2  { animation-delay: 0.42s; }
#現-s2   { stroke-dasharray: 44.9089; stroke-dashoffset: 44.9089; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#現-bg3  { animation-delay: 0.82s; }
#現-s3   { stroke-dasharray: 27.8339; stroke-dashoffset: 27.8339; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#現-bg4  { animation-delay: 1.19s; }
#現-s4   { stroke-dasharray: 29.3060; stroke-dashoffset: 29.3060; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#現-bg5  { animation-delay: 1.56s; }
#現-s5   { stroke-dasharray: 46.5504; stroke-dashoffset: 46.5504; animation: drawStroke 0.26s ease-out 1.69s forwards; }
#現-bg6  { animation-delay: 1.97s; }
#現-s6   { stroke-dasharray: 75.7207; stroke-dashoffset: 75.7207; animation: drawStroke 0.42s ease-out 2.10s forwards; }
#現-bg7  { animation-delay: 2.54s; }
#現-s7   { stroke-dasharray: 28.9625; stroke-dashoffset: 28.9625; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#現-bg8  { animation-delay: 2.91s; }
#現-s8   { stroke-dasharray: 29.1087; stroke-dashoffset: 29.1087; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#現-bg9  { animation-delay: 3.28s; }
#現-s9   { stroke-dasharray: 28.8388; stroke-dashoffset: 28.8388; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#現-bg10  { animation-delay: 3.65s; }
#現-s10   { stroke-dasharray: 38.1992; stroke-dashoffset: 38.1992; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#現-bg11  { animation-delay: 4.02s; }
#現-s11   { stroke-dasharray: 62.9533; stroke-dashoffset: 62.9533; animation: drawStroke 0.35s ease-out 4.15s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

