<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (姓)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #姓-bg[i]: Thời gian quả bóng số nảy lên
   - #姓-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#姓-bg1  { animation-delay: 0.05s; }
#姓-s1   { stroke-dasharray: 77.6802; stroke-dashoffset: 77.6802; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#姓-bg2  { animation-delay: 0.63s; }
#姓-s2   { stroke-dasharray: 61.1412; stroke-dashoffset: 61.1412; animation: drawStroke 0.34s ease-out 0.76s forwards; }
#姓-bg3  { animation-delay: 1.12s; }
#姓-s3   { stroke-dasharray: 34.0436; stroke-dashoffset: 34.0436; animation: drawStroke 0.22s ease-out 1.25s forwards; }
#姓-bg4  { animation-delay: 1.49s; }
#姓-s4   { stroke-dasharray: 24.9726; stroke-dashoffset: 24.9726; animation: drawStroke 0.22s ease-out 1.62s forwards; }
#姓-bg5  { animation-delay: 1.86s; }
#姓-s5   { stroke-dasharray: 32.6271; stroke-dashoffset: 32.6271; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#姓-bg6  { animation-delay: 2.23s; }
#姓-s6   { stroke-dasharray: 73.7780; stroke-dashoffset: 73.7780; animation: drawStroke 0.41s ease-out 2.36s forwards; }
#姓-bg7  { animation-delay: 2.79s; }
#姓-s7   { stroke-dasharray: 36.0020; stroke-dashoffset: 36.0020; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#姓-bg8  { animation-delay: 3.16s; }
#姓-s8   { stroke-dasharray: 51.5635; stroke-dashoffset: 51.5635; animation: drawStroke 0.28s ease-out 3.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #姓-s[i]) -->
<path id="姓-s1"  class="stroke" stroke="#bf0909" d="M29.31,19.62C29.709999999999997,20.62,29.93,22,29.72,23.44C28.709999999999997,30.520000000000003,23.189999999999998,56.43000000000001,18.74,64.71000000000001C17.83,66.41000000000001,19.15,67.07000000000001,19.65,67.23C26.58,69.44,32.51,72.46000000000001,37.17,76.82000000000001C39.02,78.55000000000001,40.46,80.71000000000001,42,82.78"/>
<path id="姓-s2"  class="stroke" stroke="#bf9109" d="M40.25,38.39C40.75,40,41.13,41.980000000000004,40.84,43.82C38.52,58.66,31.830000000000005,80.45,15.240000000000002,91.5"/>
<path id="姓-s3"  class="stroke" stroke="#64bf09" d="M11.75,49.22C12.5,50.16,13.5,50.839999999999996,15.5,50.61C17.65,50.37,35.59,46.01,44.5,43.629999999999995"/>
<path id="姓-s4"  class="stroke" stroke="#09bf36" d="M58.02,29.49C58.07,30.65,58.080000000000005,31.779999999999998,57.77,32.91C56.13,38.879999999999995,53.14,46.779999999999994,48.92,52.41"/>
<path id="姓-s5"  class="stroke" stroke="#09bfbf" d="M58.18,42.37C59.75,42.5,61.06,42.43,62.36,42.29C67.73,41.73,79.36,40.36,85.52,39.69C87.35,39.489999999999995,88.83999999999999,39.339999999999996,90.64,39.54"/>
<path id="姓-s6"  class="stroke" stroke="#0936bf" d="M69.65,16.13C70.76,17.24,71.34,18.869999999999997,71.34,21.22C71.34,22.25,71.35000000000001,80.12,71.35000000000001,89.49"/>
<path id="姓-s7"  class="stroke" stroke="#6409bf" d="M54.43,64.55C56.5,65,58.28,65.00999999999999,59.89,64.82C67.76,63.879999999999995,78.89,63.129999999999995,85.15,62.599999999999994C86.78,62.459999999999994,88.65,62.66,90.29,62.8"/>
<path id="姓-s8"  class="stroke" stroke="#bf0991" d="M45.93,90.76C48.51,91.55000000000001,51.11,91.46000000000001,53.75,91.33C63.15,90.86,80.75,89.62,90.02000000000001,89.59C92.57000000000001,89.58,94.82000000000001,89.71000000000001,97.20000000000002,90.87"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="姓-bg1"  class="badge-group"><circle cx="29.31" cy="19.62" r="3.5" fill="#bf0909"/><text class="num-single" x="29.31" y="19.62" dx="0" dy="-0.5">1</text></g>
<g id="姓-bg2"  class="badge-group"><circle cx="40.25" cy="38.39" r="3.5" fill="#bf9109"/><text class="num-single" x="40.25" y="38.39" dx="0" dy="-0.5">2</text></g>
<g id="姓-bg3"  class="badge-group"><circle cx="11.75" cy="49.22" r="3.5" fill="#64bf09"/><text class="num-single" x="11.75" y="49.22" dx="0" dy="-0.5">3</text></g>
<g id="姓-bg4"  class="badge-group"><circle cx="58.02" cy="29.49" r="3.5" fill="#09bf36"/><text class="num-single" x="58.02" y="29.49" dx="0" dy="-0.5">4</text></g>
<g id="姓-bg5"  class="badge-group"><circle cx="58.18" cy="42.37" r="3.5" fill="#09bfbf"/><text class="num-single" x="58.18" y="42.37" dx="0" dy="-0.5">5</text></g>
<g id="姓-bg6"  class="badge-group"><circle cx="69.65" cy="16.13" r="3.5" fill="#0936bf"/><text class="num-single" x="69.65" y="16.13" dx="0" dy="-0.5">6</text></g>
<g id="姓-bg7"  class="badge-group"><circle cx="54.43" cy="64.55" r="3.5" fill="#6409bf"/><text class="num-single" x="54.43" y="64.55" dx="0" dy="-0.5">7</text></g>
<g id="姓-bg8"  class="badge-group"><circle cx="45.93" cy="90.76" r="3.5" fill="#bf0991"/><text class="num-single" x="45.93" y="90.76" dx="0" dy="-0.5">8</text></g>
</svg>