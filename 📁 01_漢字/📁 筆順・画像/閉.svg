<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (閉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #閉-bg[i]: Thời gian quả bóng số nảy lên
   - #閉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#閉-bg1  { animation-delay: 0.05s; }
#閉-s1   { stroke-dasharray: 77.7498; stroke-dashoffset: 77.7498; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#閉-bg2  { animation-delay: 0.63s; }
#閉-s2   { stroke-dasharray: 49.1422; stroke-dashoffset: 49.1422; animation: drawStroke 0.27s ease-out 0.76s forwards; }
#閉-bg3  { animation-delay: 1.05s; }
#閉-s3   { stroke-dasharray: 20.7876; stroke-dashoffset: 20.7876; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#閉-bg4  { animation-delay: 1.42s; }
#閉-s4   { stroke-dasharray: 20.0374; stroke-dashoffset: 20.0374; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#閉-bg5  { animation-delay: 1.79s; }
#閉-s5   { stroke-dasharray: 28.2774; stroke-dashoffset: 28.2774; animation: drawStroke 0.22s ease-out 1.92s forwards; }
#閉-bg6  { animation-delay: 2.16s; }
#閉-s6   { stroke-dasharray: 117.5720; stroke-dashoffset: 117.5720; animation: drawStroke 0.55s ease-out 2.29s forwards; }
#閉-bg7  { animation-delay: 2.86s; }
#閉-s7   { stroke-dasharray: 23.3532; stroke-dashoffset: 23.3532; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#閉-bg8  { animation-delay: 3.23s; }
#閉-s8   { stroke-dasharray: 23.1961; stroke-dashoffset: 23.1961; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#閉-bg9  { animation-delay: 3.60s; }
#閉-s9   { stroke-dasharray: 42.8862; stroke-dashoffset: 42.8862; animation: drawStroke 0.24s ease-out 3.73s forwards; }
#閉-bg10  { animation-delay: 3.99s; }
#閉-s10   { stroke-dasharray: 54.0681; stroke-dashoffset: 54.0681; animation: drawStroke 0.30s ease-out 4.12s forwards; }
#閉-bg11  { animation-delay: 4.44s; }
#閉-s11   { stroke-dasharray: 40.8329; stroke-dashoffset: 40.8329; animation: drawStroke 0.22s ease-out 4.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

