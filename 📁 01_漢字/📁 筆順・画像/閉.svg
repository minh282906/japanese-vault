<path id="閉-s6"  class="stroke" stroke="#09bf8d" d="M65.8,16.11C69.22,15.469999999999999,81.06,13.44,85.64,12.889999999999999C88.66,12.53,90,13.19,90,16.24C90,36.66,90.02,77.92,90.02,92.5C90.02,104.49,83.66,94.4,82.27,93.12"/>
<path id="閉-s7"  class="stroke" stroke="#098dbf" d="M65.74,27.72C71.75,26.75,85.08,24.729999999999997,88.88999999999999,24.729999999999997"/>
<path id="閉-s8"  class="stroke" stroke="#092abf" d="M65.8,39.51C73.5,38.5,80.75,37.5,88.85,36.949999999999996"/>
<path id="閉-s9"  class="stroke" stroke="#4b09bf" d="M32.92,57.33C35,57.629999999999995,36.86,57.6,38.88,57.339999999999996C46.35,56.379999999999995,61.160000000000004,54.69,69.61,53.839999999999996C71.64,53.629999999999995,73.55,53.629999999999995,75.56,54.04"/>
<path id="閉-s10"  class="stroke" stroke="#ae09bf" d="M57.43,44.33C58.36,45.26,58.73,46.87,58.73,48.37C58.73,59.25,58.62,84.47,58.62,89C58.62,94.63,54.37,90.38,52.73,88.67"/>
<path id="閉-s11"  class="stroke" stroke="#bf096c" d="M57.43,55.89C57.5,56.62,57.07,57.88,56.53,58.84C52.620000000000005,65.87,45.120000000000005,75.25,31.05,86.33"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="閉-bg1"  class="badge-group"><circle cx="17.14" cy="15.29" r="3.5" fill="#bf0909"/><text class="num-single" x="17.14" y="15.29" dx="0" dy="-0.5">1</text></g>
<g id="閉-bg2"  class="badge-group"><circle cx="18.91" cy="23.62" r="3.5" fill="#bf6c09"/><text class="num-single" x="18.91" y="23.62" dx="0" dy="-0.5">2</text></g>
