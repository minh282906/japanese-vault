<path id="閉-s1"  class="stroke" stroke="#bf0909" d="M17.14,18.79C18.240000000000002,19.89,18.32,21.38,18.32,22.939999999999998C18.32,23.639999999999997,18.26,66.38,18.25,89.25C18.25,91.88,18.25,94.24,18.25,96.25"/>
