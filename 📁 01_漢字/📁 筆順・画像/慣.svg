<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (慣)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #慣-bg[i]: Thời gian quả bóng số nảy lên
   - #慣-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#慣-bg1  { animation-delay: 0.05s; }
#慣-s1   { stroke-dasharray: 16.7879; stroke-dashoffset: 16.7879; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#慣-bg2  { animation-delay: 0.42s; }
#慣-s2   { stroke-dasharray: 13.1087; stroke-dashoffset: 13.1087; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#慣-bg3  { animation-delay: 0.79s; }
#慣-s3   { stroke-dasharray: 83.1057; stroke-dashoffset: 83.1057; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#慣-bg4  { animation-delay: 1.40s; }
#慣-s4   { stroke-dasharray: 57.5878; stroke-dashoffset: 57.5878; animation: drawStroke 0.32s ease-out 1.53s forwards; }
#慣-bg5  { animation-delay: 1.87s; }
#慣-s5   { stroke-dasharray: 56.0159; stroke-dashoffset: 56.0159; animation: drawStroke 0.31s ease-out 2.00s forwards; }
#慣-bg6  { animation-delay: 2.33s; }
#慣-s6   { stroke-dasharray: 20.4870; stroke-dashoffset: 20.4870; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#慣-bg7  { animation-delay: 2.70s; }
#慣-s7   { stroke-dasharray: 60.9905; stroke-dashoffset: 60.9905; animation: drawStroke 0.34s ease-out 2.83s forwards; }
#慣-bg8  { animation-delay: 3.19s; }
#慣-s8   { stroke-dasharray: 36.9254; stroke-dashoffset: 36.9254; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#慣-bg9  { animation-delay: 3.56s; }
#慣-s9   { stroke-dasharray: 66.0047; stroke-dashoffset: 66.0047; animation: drawStroke 0.36s ease-out 3.69s forwards; }
#慣-bg10  { animation-delay: 4.07s; }
#慣-s10   { stroke-dasharray: 29.1490; stroke-dashoffset: 29.1490; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#慣-bg11  { animation-delay: 4.44s; }
#慣-s11   { stroke-dasharray: 29.2835; stroke-dashoffset: 29.2835; animation: drawStroke 0.22s ease-out 4.57s forwards; }
#慣-bg12  { animation-delay: 4.81s; }
#慣-s12   { stroke-dasharray: 29.0369; stroke-dashoffset: 29.0369; animation: drawStroke 0.22s ease-out 4.94s forwards; }
#慣-bg13  { animation-delay: 5.18s; }
#慣-s13   { stroke-dasharray: 21.7319; stroke-dashoffset: 21.7319; animation: drawStroke 0.22s ease-out 5.31s forwards; }
#慣-bg14  { animation-delay: 5.55s; }
#慣-s14   { stroke-dasharray: 19.7653; stroke-dashoffset: 19.7653; animation: drawStroke 0.22s ease-out 5.68s forwards; }
]]>
</style>

