<path id="寄-s4"  class="stroke" stroke="#4bbf09" d="M33.34,35.83C34.910000000000004,36.14,36.68000000000001,35.839999999999996,38.24,35.68C46.02,34.86,56.97,33.03,64.89,32.23C66.97,32.019999999999996,69.03,31.929999999999996,71.12,31.929999999999996"/>
