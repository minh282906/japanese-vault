<path id="寄-s6"  class="stroke" stroke="#09bf8d" d="M52.88,37.75C58.92,39.96,65.91,43.53,69.6,46.83"/>
<path id="寄-s7"  class="stroke" stroke="#098dbf" d="M14.38,56.35C18.34,57.45,22.950000000000003,56.88,26.950000000000003,56.35C43.96000000000001,54.120000000000005,64.73,51.74,83.36,50.44C87.56,50.15,91.59,50.07,95.75,50.769999999999996"/>
<path id="寄-s8"  class="stroke" stroke="#092abf" d="M28.01,66.88C28.82,67.69,29.41,68.44999999999999,29.6,69.6C30.44,74.57,31.21,78.33,31.880000000000003,81.96C32.120000000000005,83.27999999999999,32.36,84.58,32.580000000000005,85.91"/>
<path id="寄-s9"  class="stroke" stroke="#4b09bf" d="M30.29,68.33C38.08,66.99,46.4,65.55,51.51,64.88C54.76,64.44999999999999,56.239999999999995,65.5,55.559999999999995,68.27C54.709999999999994,71.69,53.58,74.86999999999999,52.279999999999994,79.28999999999999"/>
<path id="寄-s10"  class="stroke" stroke="#ae09bf" d="M33.52,83.06C38.82,82.2,44.52,81.37,50.620000000000005,80.69C51.99,80.53999999999999,53.370000000000005,80.39,54.78,80.25999999999999"/>
<path id="寄-s11"  class="stroke" stroke="#bf096c" d="M70.96,54.63C72.22999999999999,55.900000000000006,72.72,57.5,72.72,59.580000000000005C72.72,72.65,72.71,89.72,72.71,94.17000000000002C72.71,102.50000000000001,65.25,95.52000000000001,63.74999999999999,94.39000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="寄-bg1"  class="badge-group"><circle cx="52.38" cy="10.69" r="3.5" fill="#bf0909"/><text class="num-single" x="52.38" y="10.69" dx="0" dy="-0.5">1</text></g>
