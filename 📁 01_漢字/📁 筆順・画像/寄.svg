<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (寄)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #寄-bg[i]: Thời gian quả bóng số nảy lên
   - #寄-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#寄-bg1  { animation-delay: 0.05s; }
#寄-s1   { stroke-dasharray: 10.8989; stroke-dashoffset: 10.8989; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#寄-bg2  { animation-delay: 0.42s; }
#寄-s2   { stroke-dasharray: 13.8509; stroke-dashoffset: 13.8509; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#寄-bg3  { animation-delay: 0.79s; }
#寄-s3   { stroke-dasharray: 66.0567; stroke-dashoffset: 66.0567; animation: drawStroke 0.36s ease-out 0.92s forwards; }
#寄-bg4  { animation-delay: 1.30s; }
#寄-s4   { stroke-dasharray: 38.0359; stroke-dashoffset: 38.0359; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#寄-bg5  { animation-delay: 1.67s; }
#寄-s5   { stroke-dasharray: 32.7756; stroke-dashoffset: 32.7756; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#寄-bg6  { animation-delay: 2.04s; }
#寄-s6   { stroke-dasharray: 19.1180; stroke-dashoffset: 19.1180; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#寄-bg7  { animation-delay: 2.41s; }
#寄-s7   { stroke-dasharray: 81.8077; stroke-dashoffset: 81.8077; animation: drawStroke 0.45s ease-out 2.54s forwards; }
#寄-bg8  { animation-delay: 3.01s; }
#寄-s8   { stroke-dasharray: 19.7896; stroke-dashoffset: 19.7896; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#寄-bg9  { animation-delay: 3.38s; }
#寄-s9   { stroke-dasharray: 39.7413; stroke-dashoffset: 39.7413; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#寄-bg10  { animation-delay: 3.75s; }
#寄-s10   { stroke-dasharray: 21.4475; stroke-dashoffset: 21.4475; animation: drawStroke 0.22s ease-out 3.88s forwards; }
#寄-bg11  { animation-delay: 4.12s; }
#寄-s11   { stroke-dasharray: 52.9979; stroke-dashoffset: 52.9979; animation: drawStroke 0.29s ease-out 4.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #寄-s[i]) -->
<path id="寄-s1"  class="stroke" stroke="#bf0909" d="M52.38,10.69C53.470000000000006,11.78,53.84,13.379999999999999,53.84,14.59C53.84,17.67,53.790000000000006,18.41,53.800000000000004,21.22"/>
