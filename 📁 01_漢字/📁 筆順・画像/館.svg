<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (館)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #館-bg[i]: Thời gian quả bóng số nảy lên
   - #館-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#館-bg1  { animation-delay: 0.05s; }
#館-s1   { stroke-dasharray: 38.9404; stroke-dashoffset: 38.9404; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#館-bg2  { animation-delay: 0.42s; }
#館-s2   { stroke-dasharray: 16.9177; stroke-dashoffset: 16.9177; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#館-bg3  { animation-delay: 0.79s; }
#館-s3   { stroke-dasharray: 10.2402; stroke-dashoffset: 10.2402; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#館-bg4  { animation-delay: 1.16s; }
#館-s4   { stroke-dasharray: 51.8382; stroke-dashoffset: 51.8382; animation: drawStroke 0.29s ease-out 1.29s forwards; }
#館-bg5  { animation-delay: 1.60s; }
#館-s5   { stroke-dasharray: 18.9563; stroke-dashoffset: 18.9563; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#館-bg6  { animation-delay: 1.97s; }
#館-s6   { stroke-dasharray: 17.6605; stroke-dashoffset: 17.6605; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#館-bg7  { animation-delay: 2.34s; }
#館-s7   { stroke-dasharray: 74.6162; stroke-dashoffset: 74.6162; animation: drawStroke 0.41s ease-out 2.47s forwards; }
#館-bg8  { animation-delay: 2.90s; }
#館-s8   { stroke-dasharray: 19.7980; stroke-dashoffset: 19.7980; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#館-bg9  { animation-delay: 3.27s; }
#館-s9   { stroke-dasharray: 15.2305; stroke-dashoffset: 15.2305; animation: drawStroke 0.22s ease-out 3.40s forwards; }
#館-bg10  { animation-delay: 3.64s; }
#館-s10   { stroke-dasharray: 15.5494; stroke-dashoffset: 15.5494; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#館-bg11  { animation-delay: 4.01s; }
#館-s11   { stroke-dasharray: 46.0733; stroke-dashoffset: 46.0733; animation: drawStroke 0.25s ease-out 4.14s forwards; }
#館-bg12  { animation-delay: 4.41s; }
#館-s12   { stroke-dasharray: 54.9277; stroke-dashoffset: 54.9277; animation: drawStroke 0.30s ease-out 4.54s forwards; }
#館-bg13  { animation-delay: 4.86s; }
#館-s13   { stroke-dasharray: 39.5349; stroke-dashoffset: 39.5349; animation: drawStroke 0.22s ease-out 4.99s forwards; }
#館-bg14  { animation-delay: 5.23s; }
#館-s14   { stroke-dasharray: 22.4789; stroke-dashoffset: 22.4789; animation: drawStroke 0.22s ease-out 5.36s forwards; }
#館-bg15  { animation-delay: 5.60s; }
#館-s15   { stroke-dasharray: 44.0143; stroke-dashoffset: 44.0143; animation: drawStroke 0.24s ease-out 5.73s forwards; }
#館-bg16  { animation-delay: 5.99s; }
#館-s16   { stroke-dasharray: 26.3905; stroke-dashoffset: 26.3905; animation: drawStroke 0.22s ease-out 6.12s forwards; }
]]>
</style>

