<path id="新-s9"  class="stroke" stroke="#0941bf" d="M39.25,68.5C43.96,71.48,47.15,74.47,48.74,76.93"/>
<path id="新-s10"  class="stroke" stroke="#2509bf" d="M82.74,17.44C82.61999999999999,18.37,82.28,19.740000000000002,81.47,20.650000000000002C76.25,26.5,70.5,30.62,61.69,35.7"/>
<path id="新-s11"  class="stroke" stroke="#7909bf" d="M59.2,35.14C60.03,35.97,60.730000000000004,37.42,60.730000000000004,39.1C60.730000000000004,68.25,58.370000000000005,77.62,51.75,87.5"/>
<path id="新-s12"  class="stroke" stroke="#bf09b1" d="M62.89,47.36C64.87,47.25,66.25,47.05,67.43,46.88C75.25,45.75,86.25,44.5,93.72,43.580000000000005C94.9,43.43000000000001,96.97,43.410000000000004,97.71,43.580000000000005"/>
<path id="新-s13"  class="stroke" stroke="#bf095d" d="M80.32,48.54C81.27,49.49,81.91,50.75,81.91,52.339999999999996C81.91,53.269999999999996,82.14999999999999,80.06,82.07,92.5C82.05,94.83,82.02999999999999,96.67,82.00999999999999,97.75"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
