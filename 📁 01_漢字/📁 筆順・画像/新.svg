<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (新)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #新-bg[i]: Thời gian quả bóng số nảy lên
   - #新-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#新-bg1  { animation-delay: 0.05s; }
#新-s1   { stroke-dasharray: 13.7622; stroke-dashoffset: 13.7622; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#新-bg2  { animation-delay: 0.42s; }
#新-s2   { stroke-dasharray: 33.8051; stroke-dashoffset: 33.8051; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#新-bg3  { animation-delay: 0.79s; }
#新-s3   { stroke-dasharray: 12.3256; stroke-dashoffset: 12.3256; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#新-bg4  { animation-delay: 1.16s; }
#新-s4   { stroke-dasharray: 17.7908; stroke-dashoffset: 17.7908; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#新-bg5  { animation-delay: 1.53s; }
#新-s5   { stroke-dasharray: 40.5496; stroke-dashoffset: 40.5496; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#新-bg6  { animation-delay: 1.90s; }
#新-s6   { stroke-dasharray: 35.6555; stroke-dashoffset: 35.6555; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#新-bg7  { animation-delay: 2.27s; }
#新-s7   { stroke-dasharray: 44.3764; stroke-dashoffset: 44.3764; animation: drawStroke 0.24s ease-out 2.40s forwards; }
#新-bg8  { animation-delay: 2.66s; }
#新-s8   { stroke-dasharray: 32.5454; stroke-dashoffset: 32.5454; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#新-bg9  { animation-delay: 3.03s; }
#新-s9   { stroke-dasharray: 12.7813; stroke-dashoffset: 12.7813; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#新-bg10  { animation-delay: 3.40s; }
#新-s10   { stroke-dasharray: 28.4713; stroke-dashoffset: 28.4713; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#新-bg11  { animation-delay: 3.77s; }
#新-s11   { stroke-dasharray: 54.3714; stroke-dashoffset: 54.3714; animation: drawStroke 0.30s ease-out 3.90s forwards; }
#新-bg12  { animation-delay: 4.22s; }
#新-s12   { stroke-dasharray: 35.0653; stroke-dashoffset: 35.0653; animation: drawStroke 0.22s ease-out 4.35s forwards; }
#新-bg13  { animation-delay: 4.59s; }
#新-s13   { stroke-dasharray: 49.6431; stroke-dashoffset: 49.6431; animation: drawStroke 0.27s ease-out 4.72s forwards; }
]]>
</style>

