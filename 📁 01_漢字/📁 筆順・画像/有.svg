<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (有)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #有-bg[i]: Thời gian quả bóng số nảy lên
   - #有-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#有-bg1  { animation-delay: 0.05s; }
#有-s1   { stroke-dasharray: 61.6440; stroke-dashoffset: 61.6440; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#有-bg2  { animation-delay: 0.54s; }
#有-s2   { stroke-dasharray: 83.5721; stroke-dashoffset: 83.5721; animation: drawStroke 0.46s ease-out 0.67s forwards; }
#有-bg3  { animation-delay: 1.15s; }
#有-s3   { stroke-dasharray: 55.7015; stroke-dashoffset: 55.7015; animation: drawStroke 0.31s ease-out 1.28s forwards; }
#有-bg4  { animation-delay: 1.61s; }
#有-s4   { stroke-dasharray: 92.7378; stroke-dashoffset: 92.7378; animation: drawStroke 0.51s ease-out 1.74s forwards; }
#有-bg5  { animation-delay: 2.27s; }
#有-s5   { stroke-dasharray: 28.9496; stroke-dashoffset: 28.9496; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#有-bg6  { animation-delay: 2.64s; }
#有-s6   { stroke-dasharray: 28.4614; stroke-dashoffset: 28.4614; animation: drawStroke 0.22s ease-out 2.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #有-s[i]) -->
<path id="有-s1"  class="stroke" stroke="#bf0909" d="M51.66,13.68C52.5,14.879999999999999,52.38999999999999,16.689999999999998,51.97,18.36C48.86,30.7,39.12,49.26,18.89,63.12"/>
<path id="有-s2"  class="stroke" stroke="#bfbf09" d="M14.25,30.2C17.98,31.53,22.58,30.529999999999998,26.4,30.18C40.9,28.88,71.99000000000001,26.08,87.88,25.58C91.1,25.479999999999997,94.33999999999999,25.36,97.5,26.04"/>
<path id="有-s3"  class="stroke" stroke="#09bf09" d="M42.48,44.64C43.23,45.39,43.919999999999995,46.75,43.919999999999995,48.21C43.919999999999995,50.870000000000005,43.88999999999999,79.25,43.87,93.12C43.87,96.38000000000001,43.87,98.83,43.87,99.97"/>
<path id="有-s4"  class="stroke" stroke="#09bfbf" d="M44.86,47.17C48.5,46.63,68.84,43.260000000000005,70.6,42.99C72.99,42.63,74.82,44,74.82,46.67C74.82,52.75,74.72999999999999,77.28,74.72999999999999,92.95C74.72999999999999,104,68.61999999999999,96.38000000000001,66.97999999999999,94.69"/>
<path id="有-s5"  class="stroke" stroke="#0909bf" d="M44.86,60.56C53.5,59.620000000000005,66.53999999999999,58.410000000000004,73.68,57.830000000000005"/>
<path id="有-s6"  class="stroke" stroke="#bf09bf" d="M45.21,74.09C51.56,73.51,66.2,71.77000000000001,73.53999999999999,71.38000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="有-bg1"  class="badge-group"><circle cx="51.66" cy="13.68" r="3.5" fill="#bf0909"/><text class="num-single" x="51.66" y="13.68" dx="0" dy="-0.5">1</text></g>
<g id="有-bg2"  class="badge-group"><circle cx="14.25" cy="30.2" r="3.5" fill="#bfbf09"/><text class="num-single" x="14.25" y="30.2" dx="0" dy="-0.5">2</text></g>
<g id="有-bg3"  class="badge-group"><circle cx="42.48" cy="41.14" r="3.5" fill="#09bf09"/><text class="num-single" x="42.48" y="41.14" dx="0" dy="-0.5">3</text></g>
<g id="有-bg4"  class="badge-group"><circle cx="44.86" cy="50.67" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.86" y="50.67" dx="0" dy="-0.5">4</text></g>
<g id="有-bg5"  class="badge-group"><circle cx="44.86" cy="60.56" r="3.5" fill="#0909bf"/><text class="num-single" x="44.86" y="60.56" dx="0" dy="-0.5">5</text></g>
<g id="有-bg6"  class="badge-group"><circle cx="45.21" cy="74.09" r="3.5" fill="#bf09bf"/><text class="num-single" x="45.21" y="74.09" dx="0" dy="-0.5">6</text></g>
</svg>