<path id="雇-s9"  class="stroke" stroke="#0909bf" d="M63.79,58.8C64.5,59.51,64.74,60.379999999999995,64.74,61.79C64.74,67.13,64.63,82.98,64.63,91.88"/>
<path id="雇-s10"  class="stroke" stroke="#6409bf" d="M44.99,69.92C51.260000000000005,69.39,69.56,68.03,77.52000000000001,67.38C79.17000000000002,67.24,80.38000000000001,67.14,80.94000000000001,67.08"/>
<path id="雇-s11"  class="stroke" stroke="#bf09bf" d="M44.07,81.68C50.55,81.24000000000001,68.26,79.78,76.53,79.09C78.45,78.93,79.86,78.81,80.5,78.76"/>
<path id="雇-s12"  class="stroke" stroke="#bf0964" d="M44.97,94.43C51.3,93.82000000000001,72.82,92.21000000000001,83.65,91.46000000000001C85.55000000000001,91.33000000000001,87.47,91.25000000000001,89.37,91.02000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="雇-bg1"  class="badge-group"><circle cx="26.63" cy="17.47" r="3.5" fill="#bf0909"/><text class="num-single" x="26.63" y="17.47" dx="0" dy="-0.5">1</text></g>
