<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (雇)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #雇-bg[i]: Thời gian quả bóng số nảy lên
   - #雇-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#雇-bg1  { animation-delay: 0.05s; }
#雇-s1   { stroke-dasharray: 57.4887; stroke-dashoffset: 57.4887; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#雇-bg2  { animation-delay: 0.52s; }
#雇-s2   { stroke-dasharray: 63.7654; stroke-dashoffset: 63.7654; animation: drawStroke 0.35s ease-out 0.65s forwards; }
#雇-bg3  { animation-delay: 1.02s; }
#雇-s3   { stroke-dasharray: 46.0899; stroke-dashoffset: 46.0899; animation: drawStroke 0.25s ease-out 1.15s forwards; }
#雇-bg4  { animation-delay: 1.42s; }
#雇-s4   { stroke-dasharray: 67.3535; stroke-dashoffset: 67.3535; animation: drawStroke 0.37s ease-out 1.55s forwards; }
#雇-bg5  { animation-delay: 1.94s; }
#雇-s5   { stroke-dasharray: 30.7191; stroke-dashoffset: 30.7191; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#雇-bg6  { animation-delay: 2.31s; }
#雇-s6   { stroke-dasharray: 38.4373; stroke-dashoffset: 38.4373; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#雇-bg7  { animation-delay: 2.68s; }
#雇-s7   { stroke-dasharray: 11.0793; stroke-dashoffset: 11.0793; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#雇-bg8  { animation-delay: 3.05s; }
#雇-s8   { stroke-dasharray: 43.7152; stroke-dashoffset: 43.7152; animation: drawStroke 0.24s ease-out 3.18s forwards; }
#雇-bg9  { animation-delay: 3.44s; }
#雇-s9   { stroke-dasharray: 33.3198; stroke-dashoffset: 33.3198; animation: drawStroke 0.22s ease-out 3.57s forwards; }
#雇-bg10  { animation-delay: 3.81s; }
#雇-s10   { stroke-dasharray: 36.0622; stroke-dashoffset: 36.0622; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#雇-bg11  { animation-delay: 4.18s; }
#雇-s11   { stroke-dasharray: 36.5470; stroke-dashoffset: 36.5470; animation: drawStroke 0.22s ease-out 4.31s forwards; }
#雇-bg12  { animation-delay: 4.55s; }
#雇-s12   { stroke-dasharray: 44.5320; stroke-dashoffset: 44.5320; animation: drawStroke 0.24s ease-out 4.68s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #雇-s[i]) -->
<path id="雇-s1"  class="stroke" stroke="#bf0909" d="M26.63,17.47C29.29,18.31,32.91,17.9,35.629999999999995,17.57C47.75,16.12,59,15.25,75,14.1C77.94,13.889999999999999,80.96,13.68,83.87,14.23"/>
