<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (踊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #踊-bg[i]: Thời gian quả bóng số nảy lên
   - #踊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#踊-bg1  { animation-delay: 0.05s; }
#踊-s1   { stroke-dasharray: 20.5286; stroke-dashoffset: 20.5286; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#踊-bg2  { animation-delay: 0.42s; }
#踊-s2   { stroke-dasharray: 39.2864; stroke-dashoffset: 39.2864; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#踊-bg3  { animation-delay: 0.79s; }
#踊-s3   { stroke-dasharray: 19.6666; stroke-dashoffset: 19.6666; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#踊-bg4  { animation-delay: 1.16s; }
#踊-s4   { stroke-dasharray: 39.8122; stroke-dashoffset: 39.8122; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#踊-bg5  { animation-delay: 1.53s; }
#踊-s5   { stroke-dasharray: 12.2756; stroke-dashoffset: 12.2756; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#踊-bg6  { animation-delay: 1.90s; }
#踊-s6   { stroke-dasharray: 30.0472; stroke-dashoffset: 30.0472; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#踊-bg7  { animation-delay: 2.27s; }
#踊-s7   { stroke-dasharray: 31.4482; stroke-dashoffset: 31.4482; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#踊-bg8  { animation-delay: 2.64s; }
#踊-s8   { stroke-dasharray: 58.9093; stroke-dashoffset: 58.9093; animation: drawStroke 0.32s ease-out 2.77s forwards; }
#踊-bg9  { animation-delay: 3.11s; }
#踊-s9   { stroke-dasharray: 13.3985; stroke-dashoffset: 13.3985; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#踊-bg10  { animation-delay: 3.48s; }
#踊-s10   { stroke-dasharray: 53.2854; stroke-dashoffset: 53.2854; animation: drawStroke 0.29s ease-out 3.61s forwards; }
#踊-bg11  { animation-delay: 3.92s; }
#踊-s11   { stroke-dasharray: 101.9480; stroke-dashoffset: 101.9480; animation: drawStroke 0.55s ease-out 4.05s forwards; }
#踊-bg12  { animation-delay: 4.62s; }
#踊-s12   { stroke-dasharray: 39.1669; stroke-dashoffset: 39.1669; animation: drawStroke 0.22s ease-out 4.75s forwards; }
#踊-bg13  { animation-delay: 4.99s; }
#踊-s13   { stroke-dasharray: 39.4143; stroke-dashoffset: 39.4143; animation: drawStroke 0.22s ease-out 5.12s forwards; }
#踊-bg14  { animation-delay: 5.36s; }
#踊-s14   { stroke-dasharray: 46.1709; stroke-dashoffset: 46.1709; animation: drawStroke 0.25s ease-out 5.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
