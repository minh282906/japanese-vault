<path id="踊-s11"  class="stroke" stroke="#3d09bf" d="M52.26,42.61C59.55,41.83,82.94,38.75,88.12,38.2C91.08,37.89,92.32000000000001,39.1,92.32000000000001,42.09C92.32000000000001,45.260000000000005,92.26,75.02000000000001,92.26,88.83000000000001C92.26,98.82000000000001,86.43,90.30000000000001,85.24000000000001,89.71000000000001"/>
