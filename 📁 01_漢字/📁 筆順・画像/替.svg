<path id="替-s6"  class="stroke" stroke="#09bf64" d="M56.26,38.01C58.129999999999995,38.25,60.239999999999995,38.22,61.879999999999995,38.089999999999996C67.6,37.65,80.21,36.01,86.49,35.66C88.38,35.55,90.13,35.339999999999996,91.97999999999999,35.8"/>
<path id="替-s7"  class="stroke" stroke="#09bfbf" d="M71.59,10.5C72.42,11.33,72.58,12.68,72.51,14.120000000000001C71.25,39.75,67,49.62,55.17,59.25"/>
<path id="替-s8"  class="stroke" stroke="#0964bf" d="M71.02,38.95C75.72999999999999,44.36,83.36999999999999,52.38,89.49,57.28C91.25999999999999,58.69,93.50999999999999,60.38,96.21,61.620000000000005"/>
<path id="替-s9"  class="stroke" stroke="#0909bf" d="M31.52,65.69C32.42,66.59,32.88,67.87,33.089999999999996,69.39999999999999C33.779999999999994,74.30999999999999,35.379999999999995,86.04999999999998,36.349999999999994,93.74C36.63999999999999,95.99,36.87,97.89999999999999,37.00999999999999,99.17999999999999"/>
<path id="替-s10"  class="stroke" stroke="#6409bf" d="M33.3,66.57C38.29,66.07,65.13,63.42999999999999,73.61,62.67999999999999C77.69,62.31999999999999,79.5,63.57999999999999,78.91,67.72C78.21,72.53999999999999,77.28999999999999,82.00999999999999,76.02,91.28999999999999C75.75999999999999,93.19999999999999,75.5,95.10999999999999,75.22999999999999,96.97999999999999"/>
<path id="替-s11"  class="stroke" stroke="#bf09bf" d="M35.85,81.73C44.75,80.38000000000001,67.25,78.13000000000001,76.44,77.92"/>
<path id="替-s12"  class="stroke" stroke="#bf0964" d="M38.28,97.19C48.5,96.25,63.99,94.94,74.43,94.52"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="替-bg1"  class="badge-group"><circle cx="21.75" cy="26.33" r="3.5" fill="#bf0909"/><text class="num-single" x="21.75" y="26.33" dx="0" dy="-0.5">1</text></g>
