<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (替)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #替-bg[i]: Thời gian quả bóng số nảy lên
   - #替-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#替-bg1  { animation-delay: 0.05s; }
#替-s1   { stroke-dasharray: 27.1797; stroke-dashoffset: 27.1797; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#替-bg2  { animation-delay: 0.42s; }
#替-s2   { stroke-dasharray: 32.1325; stroke-dashoffset: 32.1325; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#替-bg3  { animation-delay: 0.79s; }
#替-s3   { stroke-dasharray: 61.8044; stroke-dashoffset: 61.8044; animation: drawStroke 0.34s ease-out 0.92s forwards; }
#替-bg4  { animation-delay: 1.28s; }
#替-s4   { stroke-dasharray: 16.5827; stroke-dashoffset: 16.5827; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#替-bg5  { animation-delay: 1.65s; }
#替-s5   { stroke-dasharray: 27.8768; stroke-dashoffset: 27.8768; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#替-bg6  { animation-delay: 2.02s; }
#替-s6   { stroke-dasharray: 35.8778; stroke-dashoffset: 35.8778; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#替-bg7  { animation-delay: 2.39s; }
#替-s7   { stroke-dasharray: 54.0031; stroke-dashoffset: 54.0031; animation: drawStroke 0.30s ease-out 2.52s forwards; }
#替-bg8  { animation-delay: 2.84s; }
#替-s8   { stroke-dasharray: 34.0706; stroke-dashoffset: 34.0706; animation: drawStroke 0.22s ease-out 2.97s forwards; }
#替-bg9  { animation-delay: 3.21s; }
#替-s9   { stroke-dasharray: 34.1386; stroke-dashoffset: 34.1386; animation: drawStroke 0.22s ease-out 3.34s forwards; }
#替-bg10  { animation-delay: 3.58s; }
#替-s10   { stroke-dasharray: 79.0695; stroke-dashoffset: 79.0695; animation: drawStroke 0.43s ease-out 3.71s forwards; }
#替-bg11  { animation-delay: 4.16s; }
#替-s11   { stroke-dasharray: 40.7831; stroke-dashoffset: 40.7831; animation: drawStroke 0.22s ease-out 4.29s forwards; }
#替-bg12  { animation-delay: 4.53s; }
#替-s12   { stroke-dasharray: 36.2518; stroke-dashoffset: 36.2518; animation: drawStroke 0.22s ease-out 4.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #替-s[i]) -->
<path id="替-s1"  class="stroke" stroke="#bf0909" d="M21.75,26.33C23.13,26.889999999999997,25.06,26.58,26.5,26.459999999999997C31.44,26.069999999999997,38.71,24.859999999999996,44.120000000000005,24.339999999999996C45.68000000000001,24.189999999999998,47.190000000000005,24.019999999999996,48.730000000000004,24.399999999999995"/>
