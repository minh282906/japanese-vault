<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (北)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #北-bg[i]: Thời gian quả bóng số nảy lên
   - #北-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#北-bg1  { animation-delay: 0.05s; }
#北-s1   { stroke-dasharray: 24.1906; stroke-dashoffset: 24.1906; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#北-bg2  { animation-delay: 0.42s; }
#北-s2   { stroke-dasharray: 56.0166; stroke-dashoffset: 56.0166; animation: drawStroke 0.31s ease-out 0.55s forwards; }
#北-bg3  { animation-delay: 0.88s; }
#北-s3   { stroke-dasharray: 33.9585; stroke-dashoffset: 33.9585; animation: drawStroke 0.22s ease-out 1.01s forwards; }
#北-bg4  { animation-delay: 1.25s; }
#北-s4   { stroke-dasharray: 31.1390; stroke-dashoffset: 31.1390; animation: drawStroke 0.22s ease-out 1.38s forwards; }
#北-bg5  { animation-delay: 1.62s; }
#北-s5   { stroke-dasharray: 107.5710; stroke-dashoffset: 107.5710; animation: drawStroke 0.55s ease-out 1.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #北-s[i]) -->
<path id="北-s1"  class="stroke" stroke="#bf0909" d="M13.25,48.75C15.86,49.25,16.77,49.26,19.37,49C23.130000000000003,48.62,33.5,45.62,37,45.25"/>
<path id="北-s2"  class="stroke" stroke="#9abf09" d="M37.25,21.5C38.44,22.69,39.25,24.75,39.25,26.25C39.25,27.25,39.5,74.25,39.5,77"/>
<path id="北-s3"  class="stroke" stroke="#09bf52" d="M12.75,88.75C14.629999999999999,89.87,17.04,89.62,19.25,88.5C32.5,81.75,36.5,80,43.5,76.25"/>
<path id="北-s4"  class="stroke" stroke="#0952bf" d="M90.25,33C90,34.75,89.12,36.26,88.06,37.07C82.12,41.62,73.75,46.5,65,49.75"/>
<path id="北-s5"  class="stroke" stroke="#9a09bf" d="M60.37,19.5C61.75,21,62.279999999999994,22.75,62.279999999999994,24.8C62.279999999999994,25.92,61.99999999999999,58.510000000000005,61.99999999999999,72.5C61.99999999999999,86.5,63.99999999999999,88.25,79.25,88.25C94.75,88.25,95.75,86.75,95.75,75.76"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="北-bg1"  class="badge-group"><circle cx="13.25" cy="48.75" r="3.5" fill="#bf0909"/><text class="num-single" x="13.25" y="48.75" dx="0" dy="-0.5">1</text></g>
<g id="北-bg2"  class="badge-group"><circle cx="37.25" cy="21.5" r="3.5" fill="#9abf09"/><text class="num-single" x="37.25" y="21.5" dx="0" dy="-0.5">2</text></g>
<g id="北-bg3"  class="badge-group"><circle cx="12.75" cy="88.75" r="3.5" fill="#09bf52"/><text class="num-single" x="12.75" y="88.75" dx="0" dy="-0.5">3</text></g>
<g id="北-bg4"  class="badge-group"><circle cx="90.25" cy="33" r="3.5" fill="#0952bf"/><text class="num-single" x="90.25" y="33" dx="0" dy="-0.5">4</text></g>
<g id="北-bg5"  class="badge-group"><circle cx="60.37" cy="19.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="60.37" y="19.5" dx="0" dy="-0.5">5</text></g>
</svg>