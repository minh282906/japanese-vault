<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (収)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #収-bg[i]: Thời gian quả bóng số nảy lên
   - #収-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#収-bg1  { animation-delay: 0.05s; }
#収-s1   { stroke-dasharray: 82.9106; stroke-dashoffset: 82.9106; animation: drawStroke 0.46s ease-out 0.18s forwards; }
#収-bg2  { animation-delay: 0.66s; }
#収-s2   { stroke-dasharray: 57.2194; stroke-dashoffset: 57.2194; animation: drawStroke 0.31s ease-out 0.79s forwards; }
#収-bg3  { animation-delay: 1.12s; }
#収-s3   { stroke-dasharray: 100.7440; stroke-dashoffset: 100.7440; animation: drawStroke 0.55s ease-out 1.25s forwards; }
#収-bg4  { animation-delay: 1.82s; }
#収-s4   { stroke-dasharray: 61.9651; stroke-dashoffset: 61.9651; animation: drawStroke 0.34s ease-out 1.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #収-s[i]) -->
<path id="収-s1"  class="stroke" stroke="#bf0909" d="M32.87,15.75C33.96,16.25,34.61,18,34.83,19C35.05,20,34.83,91.75,34.61,98"/>
<path id="収-s2"  class="stroke" stroke="#64bf09" d="M15.5,32.5C17,34.25,16.89,35,16.89,37.5C16.89,49.32,16.44,65.19,16.44,67.19S18.09,70.33,20.18,68.83S31.68,61.489999999999995,34.46,59.989999999999995"/>
<path id="収-s3"  class="stroke" stroke="#09bfbf" d="M53.05,30.11C54.37,30.53,56.01,30.79,58.69,30.28C62.879999999999995,29.490000000000002,75.58,25.490000000000002,77.44,24.98C80.13,24.25,81.89,25.84,80.92,29.41C74.25,54,67.25,71.38,46.26,86.25"/>
<path id="収-s4"  class="stroke" stroke="#6409bf" d="M49.98,41.91C54.61,42.779999999999994,70.69999999999999,65.14999999999999,83.12,79.62C85.37,82.24000000000001,88.12,84.74000000000001,91.74000000000001,87.26"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="収-bg1"  class="badge-group"><circle cx="32.87" cy="15.75" r="3.5" fill="#bf0909"/><text class="num-single" x="32.87" y="15.75" dx="0" dy="-0.5">1</text></g>
<g id="収-bg2"  class="badge-group"><circle cx="15.5" cy="32.5" r="3.5" fill="#64bf09"/><text class="num-single" x="15.5" y="32.5" dx="0" dy="-0.5">2</text></g>
<g id="収-bg3"  class="badge-group"><circle cx="53.05" cy="30.11" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.05" y="30.11" dx="0" dy="-0.5">3</text></g>
<g id="収-bg4"  class="badge-group"><circle cx="49.98" cy="41.91" r="3.5" fill="#6409bf"/><text class="num-single" x="49.98" y="41.91" dx="0" dy="-0.5">4</text></g>
</svg>