<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (行)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #行-bg[i]: Thời gian quả bóng số nảy lên
   - #行-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#行-bg1  { animation-delay: 0.05s; }
#行-s1   { stroke-dasharray: 26.1231; stroke-dashoffset: 26.1231; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#行-bg2  { animation-delay: 0.42s; }
#行-s2   { stroke-dasharray: 40.9530; stroke-dashoffset: 40.9530; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#行-bg3  { animation-delay: 0.80s; }
#行-s3   { stroke-dasharray: 43.8109; stroke-dashoffset: 43.8109; animation: drawStroke 0.24s ease-out 0.93s forwards; }
#行-bg4  { animation-delay: 1.19s; }
#行-s4   { stroke-dasharray: 34.9788; stroke-dashoffset: 34.9788; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#行-bg5  { animation-delay: 1.56s; }
#行-s5   { stroke-dasharray: 53.2883; stroke-dashoffset: 53.2883; animation: drawStroke 0.29s ease-out 1.69s forwards; }
#行-bg6  { animation-delay: 2.00s; }
#行-s6   { stroke-dasharray: 62.4169; stroke-dashoffset: 62.4169; animation: drawStroke 0.34s ease-out 2.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #行-s[i]) -->
<path id="行-s1"  class="stroke" stroke="#bf0909" d="M32.49,12C32.370000000000005,13,32.04,13.9,31.39,14.620000000000001C28.29,18.06,22.2,22.6,12.5,28"/>
<path id="行-s2"  class="stroke" stroke="#bfbf09" d="M36.5,31.75C36.57,32.48,36.58,34.03,36.11,34.93C32.12,42.5,23.83,52.5,11,62.75"/>
<path id="行-s3"  class="stroke" stroke="#09bf09" d="M25.57,51.75C26.47,52.65,26.8,54,26.8,55.01C26.8,55.73,26.84,79.47999999999999,26.73,90.5C26.71,92.69,26.69,94.37,26.66,95.25"/>
<path id="行-s4"  class="stroke" stroke="#09bfbf" d="M50.5,18.45C51.94,18.8,54.31,18.97,55.730000000000004,18.8C62.870000000000005,18,71.74000000000001,16.37,80.22,15.74C82.6,15.56,84.05,15.68,85.24,15.85"/>
<path id="行-s5"  class="stroke" stroke="#0909bf" d="M43.13,41.42C44.63,41.800000000000004,47.400000000000006,42,48.89,41.800000000000004C61.75,40.13,77.75,37.75000000000001,90.74000000000001,36.42C93.23,36.160000000000004,94.75000000000001,36.6,96.00000000000001,36.79"/>
<path id="行-s6"  class="stroke" stroke="#bf09bf" d="M71.52,41.33C72.78,42.589999999999996,73.28,44.12,73.28,46.599999999999994C73.28,61.16,73.02,85.25999999999999,73.02,90.22C73.02,98.25,65.81,89.72,64.31,88.47"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="行-bg1"  class="badge-group"><circle cx="32.49" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="32.49" y="12" dx="0" dy="-0.5">1</text></g>
<g id="行-bg2"  class="badge-group"><circle cx="36.5" cy="31.75" r="3.5" fill="#bfbf09"/><text class="num-single" x="36.5" y="31.75" dx="0" dy="-0.5">2</text></g>
<g id="行-bg3"  class="badge-group"><circle cx="25.57" cy="51.75" r="3.5" fill="#09bf09"/><text class="num-single" x="25.57" y="51.75" dx="0" dy="-0.5">3</text></g>
<g id="行-bg4"  class="badge-group"><circle cx="50.5" cy="18.45" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.5" y="18.45" dx="0" dy="-0.5">4</text></g>
<g id="行-bg5"  class="badge-group"><circle cx="43.13" cy="41.42" r="3.5" fill="#0909bf"/><text class="num-single" x="43.13" y="41.42" dx="0" dy="-0.5">5</text></g>
<g id="行-bg6"  class="badge-group"><circle cx="71.52" cy="41.33" r="3.5" fill="#bf09bf"/><text class="num-single" x="71.52" y="41.33" dx="0" dy="-0.5">6</text></g>
</svg>