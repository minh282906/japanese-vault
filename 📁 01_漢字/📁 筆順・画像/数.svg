<path id="数-s10"  class="stroke" stroke="#2509bf" d="M65.75,16.25C66.12,17.37,66.23,18.63,65.92,19.88C63.5,29.75,60.050000000000004,40.58,52.75,51.62"/>
<path id="数-s11"  class="stroke" stroke="#7909bf" d="M63.92,37.46C64.75,37.5,66.4,37.47,67.27,37.36C74.25,36.5,80.75,34.75,88.39999999999999,33.769999999999996C89.94999999999999,33.56999999999999,90.91999999999999,33.74999999999999,91.32,33.849999999999994"/>
<path id="数-s12"  class="stroke" stroke="#bf09b1" d="M79.23,40.01C79.73,41.35,79.75,42.809999999999995,79.23,45.269999999999996C74.51,67.58,65.28,86.9,48.76,94"/>
<path id="数-s13"  class="stroke" stroke="#bf095d" d="M56.5,54.75C59.16,54.75,75.41,77.24,85.49,87.5C87.69999999999999,89.75,89.96,92.15,93.25,92.5"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="数-bg1"  class="badge-group"><circle cx="17.25" cy="21.5" r="3.5" fill="#bf0909"/><text class="num-single" x="17.25" y="21.5" dx="0" dy="-0.5">1</text></g>
