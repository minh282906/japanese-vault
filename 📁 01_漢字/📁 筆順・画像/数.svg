<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (数)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #数-bg[i]: Thời gian quả bóng số nảy lên
   - #数-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#数-bg1  { animation-delay: 0.05s; }
#数-s1   { stroke-dasharray: 10.8514; stroke-dashoffset: 10.8514; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#数-bg2  { animation-delay: 0.42s; }
#数-s2   { stroke-dasharray: 13.1210; stroke-dashoffset: 13.1210; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#数-bg3  { animation-delay: 0.79s; }
#数-s3   { stroke-dasharray: 36.9693; stroke-dashoffset: 36.9693; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#数-bg4  { animation-delay: 1.16s; }
#数-s4   { stroke-dasharray: 40.7054; stroke-dashoffset: 40.7054; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#数-bg5  { animation-delay: 1.53s; }
#数-s5   { stroke-dasharray: 26.2233; stroke-dashoffset: 26.2233; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#数-bg6  { animation-delay: 1.90s; }
#数-s6   { stroke-dasharray: 14.1177; stroke-dashoffset: 14.1177; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#数-bg7  { animation-delay: 2.27s; }
#数-s7   { stroke-dasharray: 51.2509; stroke-dashoffset: 51.2509; animation: drawStroke 0.28s ease-out 2.40s forwards; }
#数-bg8  { animation-delay: 2.70s; }
#数-s8   { stroke-dasharray: 46.0982; stroke-dashoffset: 46.0982; animation: drawStroke 0.25s ease-out 2.83s forwards; }
#数-bg9  { animation-delay: 3.10s; }
#数-s9   { stroke-dasharray: 36.4273; stroke-dashoffset: 36.4273; animation: drawStroke 0.22s ease-out 3.23s forwards; }
#数-bg10  { animation-delay: 3.47s; }
#数-s10   { stroke-dasharray: 38.2283; stroke-dashoffset: 38.2283; animation: drawStroke 0.22s ease-out 3.60s forwards; }
#数-bg11  { animation-delay: 3.84s; }
#数-s11   { stroke-dasharray: 27.7282; stroke-dashoffset: 27.7282; animation: drawStroke 0.22s ease-out 3.97s forwards; }
#数-bg12  { animation-delay: 4.21s; }
#数-s12   { stroke-dasharray: 65.0004; stroke-dashoffset: 65.0004; animation: drawStroke 0.36s ease-out 4.34s forwards; }
#数-bg13  { animation-delay: 4.72s; }
#数-s13   { stroke-dasharray: 53.3057; stroke-dashoffset: 53.3057; animation: drawStroke 0.29s ease-out 4.85s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #数-s[i]) -->
<path id="数-s1"  class="stroke" stroke="#bf0909" d="M17.25,21.5C19.61,23.08,23.16,27.54,23.75,30"/>
