<path id="数-s5"  class="stroke" stroke="#25bf09" d="M32.5,35C32.5,36,31.91,36.94,31.57,37.65C28.28,44.54,22.37,50.69,16.25,55"/>
<path id="数-s6"  class="stroke" stroke="#09bf41" d="M36.5,41C40,42.25,45.25,45.75,47.75,49.25"/>
<path id="数-s7"  class="stroke" stroke="#09bf95" d="M30.25,58.25C30.63,59,30.82,60.24,30.63,61.33C29.66,66.69,26.15,73.33,21.88,79.6C21,80.89,22.25,81.46,22.759999999999998,81.50999999999999C28.279999999999998,81.97999999999999,36.349999999999994,84.21999999999998,41.4,87.27999999999999C43.12,88.32,44.55,89.48999999999998,45.51,90.75999999999999"/>
<path id="数-s8"  class="stroke" stroke="#0995bf" d="M44,63.25C44.75,64.5,44.64,66.27,44.33,67.39C41.809999999999995,76.44,34.53,89.77,16.5,96.5"/>
