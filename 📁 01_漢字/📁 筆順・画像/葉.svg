<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (葉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #葉-bg[i]: Thời gian quả bóng số nảy lên
   - #葉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#葉-bg1  { animation-delay: 0.05s; }
#葉-s1   { stroke-dasharray: 67.2233; stroke-dashoffset: 67.2233; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#葉-bg2  { animation-delay: 0.57s; }
#葉-s2   { stroke-dasharray: 18.2681; stroke-dashoffset: 18.2681; animation: drawStroke 0.22s ease-out 0.70s forwards; }
#葉-bg3  { animation-delay: 0.94s; }
#葉-s3   { stroke-dasharray: 18.0773; stroke-dashoffset: 18.0773; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#葉-bg4  { animation-delay: 1.31s; }
#葉-s4   { stroke-dasharray: 82.6527; stroke-dashoffset: 82.6527; animation: drawStroke 0.45s ease-out 1.44s forwards; }
#葉-bg5  { animation-delay: 1.91s; }
#葉-s5   { stroke-dasharray: 21.2133; stroke-dashoffset: 21.2133; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#葉-bg6  { animation-delay: 2.28s; }
#葉-s6   { stroke-dasharray: 18.6419; stroke-dashoffset: 18.6419; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#葉-bg7  { animation-delay: 2.65s; }
#葉-s7   { stroke-dasharray: 19.0835; stroke-dashoffset: 19.0835; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#葉-bg8  { animation-delay: 3.02s; }
#葉-s8   { stroke-dasharray: 72.3795; stroke-dashoffset: 72.3795; animation: drawStroke 0.40s ease-out 3.15s forwards; }
#葉-bg9  { animation-delay: 3.57s; }
#葉-s9   { stroke-dasharray: 62.7152; stroke-dashoffset: 62.7152; animation: drawStroke 0.34s ease-out 3.70s forwards; }
#葉-bg10  { animation-delay: 4.06s; }
#葉-s10   { stroke-dasharray: 38.8072; stroke-dashoffset: 38.8072; animation: drawStroke 0.22s ease-out 4.19s forwards; }
#葉-bg11  { animation-delay: 4.43s; }
#葉-s11   { stroke-dasharray: 43.7871; stroke-dashoffset: 43.7871; animation: drawStroke 0.24s ease-out 4.56s forwards; }
#葉-bg12  { animation-delay: 4.82s; }
#葉-s12   { stroke-dasharray: 40.6041; stroke-dashoffset: 40.6041; animation: drawStroke 0.22s ease-out 4.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

