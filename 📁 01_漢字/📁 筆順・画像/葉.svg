<path id="葉-s8"  class="stroke" stroke="#0964bf" d="M34.33,33.07C35.19,33.93,35.809999999999995,35.04,35.839999999999996,35.83C36.12,42.37,36.12,49.87,36.12,55.69C36.12,58.599999999999994,36.87,59.669999999999995,39.269999999999996,59.519999999999996C51.17999999999999,58.8,64.83,57.88999999999999,75.12,57.459999999999994C77.66000000000001,57.349999999999994,80.10000000000001,57.339999999999996,82.60000000000001,57.839999999999996"/>
<path id="葉-s9"  class="stroke" stroke="#0909bf" d="M23.75,73C27,73.75,29.78,73.59,33,73.27C44.43,72.11999999999999,64.42,70.77,78.25,69.97999999999999C81.15,69.80999999999999,83.44,69.93999999999998,86.25,70.50999999999999"/>
<path id="葉-s10"  class="stroke" stroke="#6409bf" d="M53.25,61.5C54.19,62.44,54.5,63.97,54.5,65C54.5,67.31,54.5,84.48,54.37,94.38C54.339999999999996,96.8,54.3,98.78,54.25,100"/>
<path id="葉-s11"  class="stroke" stroke="#bf09bf" d="M51.5,72.5C51.5,73.75,50.62,74.75,49.79,75.66C42.64,83.64,29.189999999999998,93.49,16.75,97.75"/>
<path id="葉-s12"  class="stroke" stroke="#bf0964" d="M55.38,72C59.59,74.92,74.42,86.22,81.6,91.23C84,92.91000000000001,85.88,94.13000000000001,88.75999999999999,94.88000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="葉-bg1"  class="badge-group"><circle cx="22" cy="22.52" r="3.5" fill="#bf0909"/><text class="num-single" x="22" y="22.52" dx="0" dy="-0.5">1</text></g>
