<path id="葉-s1"  class="stroke" stroke="#bf0909" d="M22,22.52C24.62,23,27.490000000000002,22.94,30.119999999999997,22.71C42.64,21.62,66.13,19.150000000000002,79.88,18.630000000000003C82.92,18.520000000000003,85.88,18.51,89,19.03"/>
