<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (御)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #御-bg[i]: Thời gian quả bóng số nảy lên
   - #御-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#御-bg1  { animation-delay: 0.05s; }
#御-s1   { stroke-dasharray: 22.5231; stroke-dashoffset: 22.5231; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#御-bg2  { animation-delay: 0.42s; }
#御-s2   { stroke-dasharray: 29.6190; stroke-dashoffset: 29.6190; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#御-bg3  { animation-delay: 0.79s; }
#御-s3   { stroke-dasharray: 44.9617; stroke-dashoffset: 44.9617; animation: drawStroke 0.25s ease-out 0.92s forwards; }
#御-bg4  { animation-delay: 1.19s; }
#御-s4   { stroke-dasharray: 27.3778; stroke-dashoffset: 27.3778; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#御-bg5  { animation-delay: 1.56s; }
#御-s5   { stroke-dasharray: 19.4686; stroke-dashoffset: 19.4686; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#御-bg6  { animation-delay: 1.93s; }
#御-s6   { stroke-dasharray: 32.7106; stroke-dashoffset: 32.7106; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#御-bg7  { animation-delay: 2.30s; }
#御-s7   { stroke-dasharray: 42.6260; stroke-dashoffset: 42.6260; animation: drawStroke 0.23s ease-out 2.43s forwards; }
#御-bg8  { animation-delay: 2.68s; }
#御-s8   { stroke-dasharray: 14.1831; stroke-dashoffset: 14.1831; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#御-bg9  { animation-delay: 3.05s; }
#御-s9   { stroke-dasharray: 21.3843; stroke-dashoffset: 21.3843; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#御-bg10  { animation-delay: 3.42s; }
#御-s10   { stroke-dasharray: 33.0550; stroke-dashoffset: 33.0550; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#御-bg11  { animation-delay: 3.79s; }
#御-s11   { stroke-dasharray: 76.0553; stroke-dashoffset: 76.0553; animation: drawStroke 0.42s ease-out 3.92s forwards; }
#御-bg12  { animation-delay: 4.36s; }
#御-s12   { stroke-dasharray: 68.0475; stroke-dashoffset: 68.0475; animation: drawStroke 0.37s ease-out 4.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

