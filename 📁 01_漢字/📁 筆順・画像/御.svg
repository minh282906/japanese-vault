<path id="御-s8"  class="stroke" stroke="#0964bf" d="M51.92,52.84C56.120000000000005,52.25,58.620000000000005,51.5,62.45,50.99C63.900000000000006,50.800000000000004,65.01,50.760000000000005,65.92,50.99"/>
<path id="御-s9"  class="stroke" stroke="#0909bf" d="M36.34,54.76C37.35,55.769999999999996,37.96,56.489999999999995,37.970000000000006,57.809999999999995C38.00000000000001,61.49999999999999,38.330000000000005,69.38,38.370000000000005,75.61999999999999"/>
<path id="御-s10"  class="stroke" stroke="#6409bf" d="M34.46,76.79C35,77.5,35.75,78,37.06,77.45C43.25,74.87,57.63,68.24000000000001,64.59,65.25"/>
<path id="御-s11"  class="stroke" stroke="#bf09bf" d="M71.22,26.9C72.88,27.63,74.89,27.58,76.34,27.38C77.79,27.18,90.98,24.369999999999997,92.79,24.169999999999998S97.5,23.759999999999998,97.5,28.06C97.5,34.76,95.5,53.26,92.64,63.11C90.08,71.92,85.76,64.13,85.21000000000001,63.72"/>
<path id="御-s12"  class="stroke" stroke="#bf0964" d="M72.47,28.05C73.34,28.92,73.76,29.89,73.77,31.5C73.85,41.45,73.8,70.18,73.78,87.25C73.78,90.74,73.77,93.67,73.77,95.75"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="御-bg1"  class="badge-group"><circle cx="24.86" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="24.86" y="17.5" dx="0" dy="-0.5">1</text></g>
