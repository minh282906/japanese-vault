<path id="御-s6"  class="stroke" stroke="#09bf64" d="M33.25,42.68C35.09,43.53,38.4,43.06,40.26,42.69C45.949999999999996,41.57,55.37,39.379999999999995,61.51,37.86C62.64,37.58,64.11,37.36,65.28,37.69"/>
