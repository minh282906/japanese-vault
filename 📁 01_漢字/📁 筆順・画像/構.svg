<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (構)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #構-bg[i]: Thời gian quả bóng số nảy lên
   - #構-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#構-bg1  { animation-delay: 0.05s; }
#構-s1   { stroke-dasharray: 29.8545; stroke-dashoffset: 29.8545; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#構-bg2  { animation-delay: 0.42s; }
#構-s2   { stroke-dasharray: 78.9510; stroke-dashoffset: 78.9510; animation: drawStroke 0.43s ease-out 0.55s forwards; }
#構-bg3  { animation-delay: 1.00s; }
#構-s3   { stroke-dasharray: 40.1923; stroke-dashoffset: 40.1923; animation: drawStroke 0.22s ease-out 1.13s forwards; }
#構-bg4  { animation-delay: 1.37s; }
#構-s4   { stroke-dasharray: 13.9507; stroke-dashoffset: 13.9507; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#構-bg5  { animation-delay: 1.74s; }
#構-s5   { stroke-dasharray: 43.1887; stroke-dashoffset: 43.1887; animation: drawStroke 0.24s ease-out 1.87s forwards; }
#構-bg6  { animation-delay: 2.13s; }
#構-s6   { stroke-dasharray: 30.8403; stroke-dashoffset: 30.8403; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#構-bg7  { animation-delay: 2.50s; }
#構-s7   { stroke-dasharray: 32.3673; stroke-dashoffset: 32.3673; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#構-bg8  { animation-delay: 2.87s; }
#構-s8   { stroke-dasharray: 41.0866; stroke-dashoffset: 41.0866; animation: drawStroke 0.23s ease-out 3.00s forwards; }
#構-bg9  { animation-delay: 3.25s; }
#構-s9   { stroke-dasharray: 55.2077; stroke-dashoffset: 55.2077; animation: drawStroke 0.30s ease-out 3.38s forwards; }
#構-bg10  { animation-delay: 3.70s; }
#構-s10   { stroke-dasharray: 43.7637; stroke-dashoffset: 43.7637; animation: drawStroke 0.24s ease-out 3.83s forwards; }
#構-bg11  { animation-delay: 4.09s; }
#構-s11   { stroke-dasharray: 85.4212; stroke-dashoffset: 85.4212; animation: drawStroke 0.47s ease-out 4.22s forwards; }
#構-bg12  { animation-delay: 4.71s; }
#構-s12   { stroke-dasharray: 30.3350; stroke-dashoffset: 30.3350; animation: drawStroke 0.22s ease-out 4.84s forwards; }
#構-bg13  { animation-delay: 5.08s; }
#構-s13   { stroke-dasharray: 33.7085; stroke-dashoffset: 33.7085; animation: drawStroke 0.22s ease-out 5.21s forwards; }
#構-bg14  { animation-delay: 5.45s; }
#構-s14   { stroke-dasharray: 60.2716; stroke-dashoffset: 60.2716; animation: drawStroke 0.33s ease-out 5.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

