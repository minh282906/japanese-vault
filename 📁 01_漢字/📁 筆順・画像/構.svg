<path id="構-s9"  class="stroke" stroke="#0971bf" d="M42,44.04C43.82,44.449999999999996,47.16,44.62,48.97,44.449999999999996C60.5,43.37,78.66,41.56999999999999,90.64,40.94C93.66,40.78,95.49,41.14,97,41.339999999999996"/>
<path id="構-s10"  class="stroke" stroke="#0923bf" d="M49.88,52.69C50.78,53.589999999999996,51.150000000000006,55.129999999999995,51.150000000000006,56.47C51.150000000000006,57.519999999999996,51.230000000000004,79.56,51.260000000000005,90.38C51.27,93.47999999999999,51.28000000000001,95.64999999999999,51.28000000000001,96.14999999999999"/>
<path id="構-s11"  class="stroke" stroke="#3d09bf" d="M52.15,55.18C57.089999999999996,54.58,81.12,51.38,83.64,51.24C85.76,51.13,87.02,52.5,87.02,54.49C87.02,58.89,86.88,88.88,86.88,93.1C86.88,98.61,82.38,93.75,80.28,91.99"/>
