<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (聞)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #聞-bg[i]: Thời gian quả bóng số nảy lên
   - #聞-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#聞-bg1  { animation-delay: 0.05s; }
#聞-s1   { stroke-dasharray: 76.1729; stroke-dashoffset: 76.1729; animation: drawStroke 0.42s ease-out 0.18s forwards; }
#聞-bg2  { animation-delay: 0.62s; }
#聞-s2   { stroke-dasharray: 48.6268; stroke-dashoffset: 48.6268; animation: drawStroke 0.27s ease-out 0.75s forwards; }
#聞-bg3  { animation-delay: 1.04s; }
#聞-s3   { stroke-dasharray: 22.6055; stroke-dashoffset: 22.6055; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#聞-bg4  { animation-delay: 1.41s; }
#聞-s4   { stroke-dasharray: 22.7881; stroke-dashoffset: 22.7881; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#聞-bg5  { animation-delay: 1.78s; }
#聞-s5   { stroke-dasharray: 25.2421; stroke-dashoffset: 25.2421; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#聞-bg6  { animation-delay: 2.15s; }
#聞-s6   { stroke-dasharray: 115.0900; stroke-dashoffset: 115.0900; animation: drawStroke 0.55s ease-out 2.28s forwards; }
#聞-bg7  { animation-delay: 2.85s; }
#聞-s7   { stroke-dasharray: 23.1624; stroke-dashoffset: 23.1624; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#聞-bg8  { animation-delay: 3.22s; }
#聞-s8   { stroke-dasharray: 22.2961; stroke-dashoffset: 22.2961; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#聞-bg9  { animation-delay: 3.59s; }
#聞-s9   { stroke-dasharray: 42.6690; stroke-dashoffset: 42.6690; animation: drawStroke 0.23s ease-out 3.72s forwards; }
#聞-bg10  { animation-delay: 3.97s; }
#聞-s10   { stroke-dasharray: 31.1663; stroke-dashoffset: 31.1663; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#聞-bg11  { animation-delay: 4.34s; }
#聞-s11   { stroke-dasharray: 19.9250; stroke-dashoffset: 19.9250; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#聞-bg12  { animation-delay: 4.71s; }
#聞-s12   { stroke-dasharray: 20.3361; stroke-dashoffset: 20.3361; animation: drawStroke 0.22s ease-out 4.84s forwards; }
#聞-bg13  { animation-delay: 5.08s; }
#聞-s13   { stroke-dasharray: 39.5292; stroke-dashoffset: 39.5292; animation: drawStroke 0.22s ease-out 5.21s forwards; }
#聞-bg14  { animation-delay: 5.45s; }
#聞-s14   { stroke-dasharray: 46.5960; stroke-dashoffset: 46.5960; animation: drawStroke 0.26s ease-out 5.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

