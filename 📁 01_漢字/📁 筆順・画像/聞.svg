<path id="聞-s10"  class="stroke" stroke="#0923bf" d="M42.71,53C43.6,53.89,44.01,55.26,44.01,56.51S44,79.31,44,83.84"/>
<path id="聞-s11"  class="stroke" stroke="#3d09bf" d="M45.13,61.43C49.620000000000005,61,58.870000000000005,59.38,64.91,59.07"/>
