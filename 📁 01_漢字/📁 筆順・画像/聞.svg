<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢN CHUẨN XÁC: SỐ 2 CHỮ SỐ VƯƠN CAO (ẢNH 2) VÀ SỐ 1 CÂN GIỮA (ẢNH 3)
   ============================================================ */

@keyframes drawStroke {
    0% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* 1. LƯỚI NỀN CHỮ THẬP */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 2. NÉT CHỮ KANJI */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 3. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 4. SỐ 1 CHỮ SỐ (1-9): MẢNH THANH THOÁT, VỊ TRÍ ĐÃ ĐƯỢC NÂNG LÊN CHUẨN ĐẸP */
.num-single {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 7.6px !important;
    font-weight: 375 !important;
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. SỐ 2 CHỮ SỐ (10-14): ĐƯỢC KÉO DÀI RA (6.7px), DÁNG THON CAO NHƯ ẢNH 2 */
.num-double {
    font-family: "Arial Narrow", "Roboto Condensed", "DIN Alternate", sans-serif;
    font-size: 6.7px !important;
    font-weight: 400 !important;
    font-style: normal !important;
    letter-spacing: -0.2px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* --- TIMELINE CHUYỂN ĐỘNG (ĐỘC QUYỀN CHỮ 聞 - KHÔNG BỊ CHỮ KHÁC ĐÈ) --- */
#聞-bg1 { animation-delay: 0.05s; }
#聞-s1  { stroke-dasharray: 80.0; stroke-dashoffset: 80.0; animation: drawStroke 0.38s ease-out 0.18s forwards; }

#聞-bg2 { animation-delay: 0.6s; }
#聞-s2  { stroke-dasharray: 48.6; stroke-dashoffset: 48.6; animation: drawStroke 0.28s ease-out 0.72s forwards; }

#聞-bg3 { animation-delay: 1.05s; }
#聞-s3  { stroke-dasharray: 22.6; stroke-dashoffset: 22.6; animation: drawStroke 0.18s ease-out 1.18s forwards; }

#聞-bg4 { animation-delay: 1.4s; }
#聞-s4  { stroke-dasharray: 22.8; stroke-dashoffset: 22.8; animation: drawStroke 0.18s ease-out 1.52s forwards; }

#聞-bg5 { animation-delay: 1.75s; }
#聞-s5  { stroke-dasharray: 25.2; stroke-dashoffset: 25.2; animation: drawStroke 0.18s ease-out 1.88s forwards; }

#聞-bg6 { animation-delay: 2.1s; }
#聞-s6  { stroke-dasharray: 126.0; stroke-dashoffset: 126.0; animation: drawStroke 0.5s ease-out 2.25s forwards; }

#聞-bg7 { animation-delay: 2.8s; }
#聞-s7  { stroke-dasharray: 23.2; stroke-dashoffset: 23.2; animation: drawStroke 0.18s ease-out 2.92s forwards; }

#聞-bg8 { animation-delay: 3.15s; }
#聞-s8  { stroke-dasharray: 22.3; stroke-dashoffset: 22.3; animation: drawStroke 0.18s ease-out 3.28s forwards; }

#聞-bg9 { animation-delay: 3.5s; }
#聞-s9  { stroke-dasharray: 42.7; stroke-dashoffset: 42.7; animation: drawStroke 0.25s ease-out 3.65s forwards; }

#聞-bg10 { animation-delay: 3.95s; }
#聞-s10  { stroke-dasharray: 31.2; stroke-dashoffset: 31.2; animation: drawStroke 0.22s ease-out 4.1s forwards; }

#聞-bg11 { animation-delay: 4.35s; }
#聞-s11  { stroke-dasharray: 19.9; stroke-dashoffset: 19.9; animation: drawStroke 0.16s ease-out 4.5s forwards; }

#聞-bg12 { animation-delay: 4.7s; }
#聞-s12  { stroke-dasharray: 20.3; stroke-dashoffset: 20.3; animation: drawStroke 0.16s ease-out 4.85s forwards; }

#聞-bg13 { animation-delay: 5.05s; }
#聞-s13  { stroke-dasharray: 39.5; stroke-dashoffset: 39.5; animation: drawStroke 0.25s ease-out 5.2s forwards; }

#聞-bg14 { animation-delay: 5.5s; }
#聞-s14  { stroke-dasharray: 46.6; stroke-dashoffset: 46.6; animation: drawStroke 0.28s ease-out 5.65s forwards; }
]]></style>

<!-- LƯỚI NỀN CHỮ THẬP -->
<path class="grid-cross" d="M55,0 L55,110" />
<path class="grid-cross" d="M0,55 L110,55" />

