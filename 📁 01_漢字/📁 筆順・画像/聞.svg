<path id="聞-s12" class="stroke" stroke="#8b09bf" d="M44.81,71.67c5.72-0.67,12.31-1.92,20.12-2.95"/>
<path id="聞-s13" class="stroke" stroke="#bf09a5" d="M32.51,85.14c0.99,0.86,2.2,1.23,3.25,0.92c4.87-1.43,28.2-7.83,34.76-9.39"/>
<path id="聞-s14" class="stroke" stroke="#bf0957" d="M64.84,49.66c0.62,0.63,1.05,1.71,1.05,2.99c0,0.66,0.12,27.55,0.15,39.1c0.01,1.88,0.01,3.36,0.01,4.25"/>

