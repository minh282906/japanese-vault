<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (右)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #右-bg[i]: Thời gian quả bóng số nảy lên
   - #右-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#右-bg1  { animation-delay: 0.05s; }
#右-s1   { stroke-dasharray: 61.3161; stroke-dashoffset: 61.3161; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#右-bg2  { animation-delay: 0.54s; }
#右-s2   { stroke-dasharray: 85.0263; stroke-dashoffset: 85.0263; animation: drawStroke 0.47s ease-out 0.67s forwards; }
#右-bg3  { animation-delay: 1.16s; }
#右-s3   { stroke-dasharray: 29.9048; stroke-dashoffset: 29.9048; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#右-bg4  { animation-delay: 1.53s; }
#右-s4   { stroke-dasharray: 65.4600; stroke-dashoffset: 65.4600; animation: drawStroke 0.36s ease-out 1.66s forwards; }
#右-bg5  { animation-delay: 2.04s; }
#右-s5   { stroke-dasharray: 34.0971; stroke-dashoffset: 34.0971; animation: drawStroke 0.22s ease-out 2.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #右-s[i]) -->
<path id="右-s1"  class="stroke" stroke="#bf0909" d="M53.5,21.5C54.12,22.62,54.19,23.73,53.75,25.5C49.62,42,39.5,61,25.25,74.25"/>
<path id="右-s2"  class="stroke" stroke="#9abf09" d="M13,42.15C14.9,42.71,18.9,42.67,20.79,42.49C44.2,40.25,70.55,36.75,88.46000000000001,36.190000000000005C91.7,36.09,94.91000000000001,36.50000000000001,97.63000000000001,37.00000000000001"/>
<path id="右-s3"  class="stroke" stroke="#09bf52" d="M41.75,66.5C42.5,67.25,43.1,68.43,43.29,69.45C44.23,74.45,45.67,86.11,46.36,92.21000000000001C46.6,94.36000000000001,46.75,95.01,46.75,95.75000000000001"/>
<path id="右-s4"  class="stroke" stroke="#0952bf" d="M43.25,68C48.5,67.5,73,64.75,80.25,64.25C82,64.13,83.49,65.77,83.25,67C82.25,72.12,79.87,85,78.75,90.25"/>
<path id="右-s5"  class="stroke" stroke="#9a09bf" d="M47,93.25C52.79,93.05,66.51,91.67,75.25,91.02C77.46,90.85,79.43,90.75,81,90.75"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="右-bg1"  class="badge-group"><circle cx="53.5" cy="21.5" r="3.5" fill="#bf0909"/><text class="num-single" x="53.5" y="21.5" dx="0" dy="-0.5">1</text></g>
<g id="右-bg2"  class="badge-group"><circle cx="13" cy="42.15" r="3.5" fill="#9abf09"/><text class="num-single" x="13" y="42.15" dx="0" dy="-0.5">2</text></g>
<g id="右-bg3"  class="badge-group"><circle cx="41.75" cy="63.0" r="3.5" fill="#09bf52"/><text class="num-single" x="41.75" y="63.0" dx="0" dy="-0.5">3</text></g>
<g id="右-bg4"  class="badge-group"><circle cx="43.25" cy="71.5" r="3.5" fill="#0952bf"/><text class="num-single" x="43.25" y="71.5" dx="0" dy="-0.5">4</text></g>
<g id="右-bg5"  class="badge-group"><circle cx="47" cy="93.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="47" y="93.25" dx="0" dy="-0.5">5</text></g>
</svg>