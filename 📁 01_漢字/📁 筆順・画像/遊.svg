<path id="遊-s8"  class="stroke" stroke="#0964bf" d="M76.74,47.45C83.36999999999999,55.5,84.86999999999999,66.75,80.08,77.61C77.97,82.38,74.62,77.27,73.9,76.72"/>
<path id="遊-s9"  class="stroke" stroke="#0909bf" d="M62.21,56.54C64.31,57.37,67.08,56.92,69.26,56.68C75.16000000000001,56.03,85.69,54.31,92.25,54.06C94.14,53.99,96.34,53.870000000000005,98.18,54.47"/>
<path id="遊-s10"  class="stroke" stroke="#6409bf" d="M15.38,18.62C18.78,20.34,24.16,25.700000000000003,25,28.380000000000003"/>
