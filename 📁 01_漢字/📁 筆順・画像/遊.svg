<path id="遊-s1"  class="stroke" stroke="#bf0909" d="M46.52,12.03C47.5,13.01,48.190000000000005,14.25,48.190000000000005,15.85C48.190000000000005,19.4,48.120000000000005,23.25,48.120000000000005,26.29"/>
