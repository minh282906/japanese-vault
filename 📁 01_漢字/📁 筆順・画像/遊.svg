<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (遊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #遊-bg[i]: Thời gian quả bóng số nảy lên
   - #遊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#遊-bg1  { animation-delay: 0.05s; }
#遊-s1   { stroke-dasharray: 14.7256; stroke-dashoffset: 14.7256; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#遊-bg2  { animation-delay: 0.42s; }
#遊-s2   { stroke-dasharray: 26.5891; stroke-dashoffset: 26.5891; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#遊-bg3  { animation-delay: 0.79s; }
#遊-s3   { stroke-dasharray: 52.1926; stroke-dashoffset: 52.1926; animation: drawStroke 0.29s ease-out 0.92s forwards; }
#遊-bg4  { animation-delay: 1.23s; }
#遊-s4   { stroke-dasharray: 42.3210; stroke-dashoffset: 42.3210; animation: drawStroke 0.23s ease-out 1.36s forwards; }
#遊-bg5  { animation-delay: 1.61s; }
#遊-s5   { stroke-dasharray: 25.6480; stroke-dashoffset: 25.6480; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#遊-bg6  { animation-delay: 1.98s; }
#遊-s6   { stroke-dasharray: 21.0205; stroke-dashoffset: 21.0205; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#遊-bg7  { animation-delay: 2.35s; }
#遊-s7   { stroke-dasharray: 38.0419; stroke-dashoffset: 38.0419; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#遊-bg8  { animation-delay: 2.72s; }
#遊-s8   { stroke-dasharray: 40.2066; stroke-dashoffset: 40.2066; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#遊-bg9  { animation-delay: 3.09s; }
#遊-s9   { stroke-dasharray: 36.2437; stroke-dashoffset: 36.2437; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#遊-bg10  { animation-delay: 3.46s; }
#遊-s10   { stroke-dasharray: 13.9049; stroke-dashoffset: 13.9049; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#遊-bg11  { animation-delay: 3.83s; }
#遊-s11   { stroke-dasharray: 62.4408; stroke-dashoffset: 62.4408; animation: drawStroke 0.34s ease-out 3.96s forwards; }
#遊-bg12  { animation-delay: 4.32s; }
#遊-s12   { stroke-dasharray: 80.8258; stroke-dashoffset: 80.8258; animation: drawStroke 0.44s ease-out 4.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

