<g id="翌-bg9"  class="badge-group"><circle cx="38.5" cy="74.5" r="3.5" fill="#4b09bf"/><text class="num-single" x="38.5" y="74.5" dx="0" dy="-0.5">9</text></g>
<g id="翌-bg10" class="badge-group"><circle cx="68.75" cy="67" r="3.5" fill="#ae09bf"/><text class="num-double" x="68.75" y="67" dx="-0.4" dy="-0.475">10</text></g>
<g id="翌-bg11" class="badge-group"><circle cx="16.75" cy="94.3" r="3.5" fill="#bf096c"/><text class="num-double" x="16.75" y="94.3" dx="-0.4" dy="-0.475">11</text></g>
