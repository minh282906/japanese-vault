<path id="患-s3"  class="stroke" stroke="#aebf09" d="M35.3,35.91C44.5,34.879999999999995,58.5,33.629999999999995,72.34,32.209999999999994C74.14,32.029999999999994,75.86,31.969999999999995,77.44,31.889999999999993"/>
<path id="患-s4"  class="stroke" stroke="#4bbf09" d="M31.26,47.34C31.76,47.64,32.77,49.510000000000005,32.92,50.24C33.29,52.02,34.22,56.120000000000005,34.97,60.59C35.22,62.050000000000004,35.47,63.550000000000004,35.73,65.02000000000001"/>
<path id="患-s5"  class="stroke" stroke="#09bf2a" d="M32.86,48.39C45.66,47.22,63.480000000000004,45.54,73.27,44.5C76.35,44.17,78.91,44.92,77.75999999999999,48.66C76.63,52.37,75.88,54.62,74.82999999999998,58.75"/>
<path id="患-s6"  class="stroke" stroke="#09bf8d" d="M36.43,62.41C47.81,61.66,62.379999999999995,60.05,72.65,59.33C74.31,59.21,75.85000000000001,59.12,77.23,59.059999999999995"/>
<path id="患-s7"  class="stroke" stroke="#098dbf" d="M53.27,10.75C54.2,11.68,54.74,12.870000000000001,54.74,14.27C54.74,14.889999999999999,54.67,43.870000000000005,54.67,59.28C54.67,62.480000000000004,54.63,65.62,54.63,67.87"/>
<path id="患-s8"  class="stroke" stroke="#092abf" d="M23.01,78.81C23.330000000000002,81.51,19.810000000000002,93.42,17.25,97.92"/>
<path id="患-s9"  class="stroke" stroke="#4b09bf" d="M37.2,76.98C45.230000000000004,92.62,58.510000000000005,100.05000000000001,82,98.75C91,98.25,91,95.13,83.75,90.75"/>
<path id="患-s10"  class="stroke" stroke="#ae09bf" d="M54.5,76.75C56.09,79.23,60.5,85.5,61.019999999999996,79.03"/>
<path id="患-s11"  class="stroke" stroke="#bf096c" d="M81.25,71.12C85.74,73.29,89.92,77.99000000000001,92.75,81.95"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="患-bg1"  class="badge-group"><circle cx="30.12" cy="18.21" r="3.5" fill="#bf0909"/><text class="num-single" x="30.12" y="18.21" dx="0" dy="-0.5">1</text></g>
<g id="患-bg2"  class="badge-group"><circle cx="32.42" cy="26.9" r="3.5" fill="#bf6c09"/><text class="num-single" x="32.42" y="26.9" dx="0" dy="-0.5">2</text></g>
