<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (患)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #患-bg[i]: Thời gian quả bóng số nảy lên
   - #患-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#患-bg1  { animation-delay: 0.05s; }
#患-s1   { stroke-dasharray: 17.7625; stroke-dashoffset: 17.7625; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#患-bg2  { animation-delay: 0.42s; }
#患-s2   { stroke-dasharray: 58.3173; stroke-dashoffset: 58.3173; animation: drawStroke 0.32s ease-out 0.55s forwards; }
#患-bg3  { animation-delay: 0.89s; }
#患-s3   { stroke-dasharray: 42.3352; stroke-dashoffset: 42.3352; animation: drawStroke 0.23s ease-out 1.02s forwards; }
#患-bg4  { animation-delay: 1.27s; }
#患-s4   { stroke-dasharray: 18.4271; stroke-dashoffset: 18.4271; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#患-bg5  { animation-delay: 1.64s; }
#患-s5   { stroke-dasharray: 58.9956; stroke-dashoffset: 58.9956; animation: drawStroke 0.32s ease-out 1.77s forwards; }
#患-bg6  { animation-delay: 2.11s; }
#患-s6   { stroke-dasharray: 40.9397; stroke-dashoffset: 40.9397; animation: drawStroke 0.23s ease-out 2.24s forwards; }
#患-bg7  { animation-delay: 2.49s; }
#患-s7   { stroke-dasharray: 57.5189; stroke-dashoffset: 57.5189; animation: drawStroke 0.32s ease-out 2.62s forwards; }
#患-bg8  { animation-delay: 2.96s; }
#患-s8   { stroke-dasharray: 20.0816; stroke-dashoffset: 20.0816; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#患-bg9  { animation-delay: 3.33s; }
#患-s9   { stroke-dasharray: 68.9266; stroke-dashoffset: 68.9266; animation: drawStroke 0.38s ease-out 3.46s forwards; }
#患-bg10  { animation-delay: 3.86s; }
#患-s10   { stroke-dasharray: 10.8488; stroke-dashoffset: 10.8488; animation: drawStroke 0.22s ease-out 3.99s forwards; }
#患-bg11  { animation-delay: 4.23s; }
#患-s11   { stroke-dasharray: 15.9471; stroke-dashoffset: 15.9471; animation: drawStroke 0.22s ease-out 4.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #患-s[i]) -->
<path id="患-s1"  class="stroke" stroke="#bf0909" d="M30.12,21.71C31.130000000000003,22.14,31.580000000000002,23.580000000000002,31.830000000000002,24.51C32.480000000000004,26.93,33.050000000000004,29.900000000000002,33.870000000000005,34.150000000000006C34.120000000000005,35.46000000000001,34.400000000000006,36.93000000000001,34.71000000000001,38.59"/>
