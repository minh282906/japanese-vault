<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (刻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #刻-bg[i]: Thời gian quả bóng số nảy lên
   - #刻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#刻-bg1  { animation-delay: 0.05s; }
#刻-s1   { stroke-dasharray: 13.9572; stroke-dashoffset: 13.9572; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#刻-bg2  { animation-delay: 0.42s; }
#刻-s2   { stroke-dasharray: 47.3326; stroke-dashoffset: 47.3326; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#刻-bg3  { animation-delay: 0.83s; }
#刻-s3   { stroke-dasharray: 36.2758; stroke-dashoffset: 36.2758; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#刻-bg4  { animation-delay: 1.20s; }
#刻-s4   { stroke-dasharray: 50.0751; stroke-dashoffset: 50.0751; animation: drawStroke 0.28s ease-out 1.33s forwards; }
#刻-bg5  { animation-delay: 1.63s; }
#刻-s5   { stroke-dasharray: 55.3879; stroke-dashoffset: 55.3879; animation: drawStroke 0.30s ease-out 1.76s forwards; }
#刻-bg6  { animation-delay: 2.08s; }
#刻-s6   { stroke-dasharray: 21.2028; stroke-dashoffset: 21.2028; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#刻-bg7  { animation-delay: 2.45s; }
#刻-s7   { stroke-dasharray: 39.6086; stroke-dashoffset: 39.6086; animation: drawStroke 0.22s ease-out 2.58s forwards; }
#刻-bg8  { animation-delay: 2.82s; }
#刻-s8   { stroke-dasharray: 89.2531; stroke-dashoffset: 89.2531; animation: drawStroke 0.49s ease-out 2.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #刻-s[i]) -->
<path id="刻-s1"  class="stroke" stroke="#bf0909" d="M37.5,11.99C38.44,12.93,38.84,14.67,38.84,15.870000000000001C38.84,20.28,38.760000000000005,22.36,38.760000000000005,25.630000000000003"/>
<path id="刻-s2"  class="stroke" stroke="#bf9109" d="M15.5,29.35C17.740000000000002,29.580000000000002,19.91,29.55,22.16,29.200000000000003C30.22,27.930000000000003,44.35,25.940000000000005,54.5,24.870000000000005C57.15,24.590000000000003,59.84,24.230000000000004,62.49,24.700000000000003"/>
<path id="刻-s3"  class="stroke" stroke="#64bf09" d="M35.39,30.09C35.74,31.36,35.36,32.4,34.6,33.71C32,38.13,29.380000000000003,41.63,24.980000000000004,46.81C24.350000000000005,47.550000000000004,24.780000000000005,49.5,25.480000000000004,49.74C29.180000000000003,51.010000000000005,33.38,52.510000000000005,37.39,54.71"/>
<path id="刻-s4"  class="stroke" stroke="#09bf36" d="M49.32,34.21C49.4,35.13,49.38,36.9,48.910000000000004,37.9C42.75,51,34.5,62.5,19.55,73"/>
<path id="刻-s5"  class="stroke" stroke="#09bfbf" d="M51.21,55.57C51.31,56.5,51.08,58.02,50.51,59.05C43.12,72.5,30.99,86.07,14.25,95.04"/>
<path id="刻-s6"  class="stroke" stroke="#0936bf" d="M44.52,74.86C50.5,78.5,56.25,85.38,58.53,90.43"/>
<path id="刻-s7"  class="stroke" stroke="#6409bf" d="M71.77,27.08C72.85,28.159999999999997,73.53,29.869999999999997,73.53,32.099999999999994C73.53,42.61999999999999,73.68,53.47,73.58,60.24999999999999C73.53999999999999,62.81999999999999,73.51,64.88,73.51,66.25"/>
<path id="刻-s8"  class="stroke" stroke="#bf0991" d="M90.77,14.83C91.75,15.75,92.53,17.5,92.53,19.85C92.53,34.410000000000004,92.52,83.37,92.52,88.47C92.52,100,85.06,89.97,83.56,88.72"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="刻-bg1"  class="badge-group"><circle cx="37.5" cy="11.99" r="3.5" fill="#bf0909"/><text class="num-single" x="37.5" y="11.99" dx="0" dy="-0.5">1</text></g>
<g id="刻-bg2"  class="badge-group"><circle cx="15.5" cy="29.35" r="3.5" fill="#bf9109"/><text class="num-single" x="15.5" y="29.35" dx="0" dy="-0.5">2</text></g>
<g id="刻-bg3"  class="badge-group"><circle cx="35.39" cy="30.09" r="3.5" fill="#64bf09"/><text class="num-single" x="35.39" y="30.09" dx="0" dy="-0.5">3</text></g>
<g id="刻-bg4"  class="badge-group"><circle cx="49.32" cy="34.21" r="3.5" fill="#09bf36"/><text class="num-single" x="49.32" y="34.21" dx="0" dy="-0.5">4</text></g>
<g id="刻-bg5"  class="badge-group"><circle cx="51.21" cy="55.57" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.21" y="55.57" dx="0" dy="-0.5">5</text></g>
<g id="刻-bg6"  class="badge-group"><circle cx="44.52" cy="74.86" r="3.5" fill="#0936bf"/><text class="num-single" x="44.52" y="74.86" dx="0" dy="-0.5">6</text></g>
<g id="刻-bg7"  class="badge-group"><circle cx="71.77" cy="27.08" r="3.5" fill="#6409bf"/><text class="num-single" x="71.77" y="27.08" dx="0" dy="-0.5">7</text></g>
<g id="刻-bg8"  class="badge-group"><circle cx="90.77" cy="14.83" r="3.5" fill="#bf0991"/><text class="num-single" x="90.77" y="14.83" dx="0" dy="-0.5">8</text></g>
</svg>