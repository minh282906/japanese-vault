<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (次)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #次-bg[i]: Thời gian quả bóng số nảy lên
   - #次-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#次-bg1  { animation-delay: 0.05s; }
#次-s1   { stroke-dasharray: 14.8164; stroke-dashoffset: 14.8164; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#次-bg2  { animation-delay: 0.42s; }
#次-s2   { stroke-dasharray: 27.5691; stroke-dashoffset: 27.5691; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#次-bg3  { animation-delay: 0.79s; }
#次-s3   { stroke-dasharray: 37.8775; stroke-dashoffset: 37.8775; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#次-bg4  { animation-delay: 1.16s; }
#次-s4   { stroke-dasharray: 50.5073; stroke-dashoffset: 50.5073; animation: drawStroke 0.28s ease-out 1.29s forwards; }
#次-bg5  { animation-delay: 1.59s; }
#次-s5   { stroke-dasharray: 52.7414; stroke-dashoffset: 52.7414; animation: drawStroke 0.29s ease-out 1.72s forwards; }
#次-bg6  { animation-delay: 2.03s; }
#次-s6   { stroke-dasharray: 49.2224; stroke-dashoffset: 49.2224; animation: drawStroke 0.27s ease-out 2.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #次-s[i]) -->
<path id="次-s1"  class="stroke" stroke="#bf0909" d="M17,26.38C21.41,27.95,26.880000000000003,31.63,28.75,35"/>
<path id="次-s2"  class="stroke" stroke="#bfbf09" d="M12.12,85.87C13.27,86.09,14.399999999999999,85.62,15.129999999999999,84.67C16.279999999999998,83.19,23.229999999999997,71.52,27.619999999999997,64"/>
<path id="次-s3"  class="stroke" stroke="#09bf09" d="M53.95,16C54.38,16.86,54.550000000000004,17.9,54.300000000000004,18.81C52,26.88,44.88,40,36.25,48.41"/>
<path id="次-s4"  class="stroke" stroke="#09bfbf" d="M47.36,39.52C48.51,39.81,49.92,39.92,51.67,39.77C54.88,39.5,73.99,34.7,79,33.5C85.25,32,85,36,75.5,44.9"/>
<path id="次-s5"  class="stroke" stroke="#0909bf" d="M56.77,49.2C57.5,50.5,57.57,51.910000000000004,57.35,53.46C55.5,66.87,47.620000000000005,83.87,31.75,92.49000000000001"/>
<path id="次-s6"  class="stroke" stroke="#bf09bf" d="M57.42,56.97C62.75,63.129999999999995,74.75,76.5,84.67,85.85C86.96000000000001,88.00999999999999,89,89.63,92.5,91.13"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="次-bg1"  class="badge-group"><circle cx="17" cy="26.38" r="3.5" fill="#bf0909"/><text class="num-single" x="17" y="26.38" dx="0" dy="-0.5">1</text></g>
<g id="次-bg2"  class="badge-group"><circle cx="12.12" cy="85.87" r="3.5" fill="#bfbf09"/><text class="num-single" x="12.12" y="85.87" dx="0" dy="-0.5">2</text></g>
<g id="次-bg3"  class="badge-group"><circle cx="53.95" cy="16" r="3.5" fill="#09bf09"/><text class="num-single" x="53.95" y="16" dx="0" dy="-0.5">3</text></g>
<g id="次-bg4"  class="badge-group"><circle cx="47.36" cy="39.52" r="3.5" fill="#09bfbf"/><text class="num-single" x="47.36" y="39.52" dx="0" dy="-0.5">4</text></g>
<g id="次-bg5"  class="badge-group"><circle cx="56.77" cy="49.2" r="3.5" fill="#0909bf"/><text class="num-single" x="56.77" y="49.2" dx="0" dy="-0.5">5</text></g>
<g id="次-bg6"  class="badge-group"><circle cx="57.42" cy="56.97" r="3.5" fill="#bf09bf"/><text class="num-single" x="57.42" y="56.97" dx="0" dy="-0.5">6</text></g>
</svg>