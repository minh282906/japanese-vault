<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (膚)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #膚-bg[i]: Thời gian quả bóng số nảy lên
   - #膚-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#膚-bg1  { animation-delay: 0.05s; }
#膚-s1   { stroke-dasharray: 15.0819; stroke-dashoffset: 15.0819; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#膚-bg2  { animation-delay: 0.42s; }
#膚-s2   { stroke-dasharray: 24.0595; stroke-dashoffset: 24.0595; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#膚-bg3  { animation-delay: 0.79s; }
#膚-s3   { stroke-dasharray: 63.8904; stroke-dashoffset: 63.8904; animation: drawStroke 0.35s ease-out 0.92s forwards; }
#膚-bg4  { animation-delay: 1.29s; }
#膚-s4   { stroke-dasharray: 70.0922; stroke-dashoffset: 70.0922; animation: drawStroke 0.39s ease-out 1.42s forwards; }
#膚-bg5  { animation-delay: 1.83s; }
#膚-s5   { stroke-dasharray: 37.8963; stroke-dashoffset: 37.8963; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#膚-bg6  { animation-delay: 2.20s; }
#膚-s6   { stroke-dasharray: 33.1430; stroke-dashoffset: 33.1430; animation: drawStroke 0.22s ease-out 2.33s forwards; }
#膚-bg7  { animation-delay: 2.57s; }
#膚-s7   { stroke-dasharray: 17.2219; stroke-dashoffset: 17.2219; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#膚-bg8  { animation-delay: 2.94s; }
#膚-s8   { stroke-dasharray: 56.4852; stroke-dashoffset: 56.4852; animation: drawStroke 0.31s ease-out 3.07s forwards; }
#膚-bg9  { animation-delay: 3.40s; }
#膚-s9   { stroke-dasharray: 12.5958; stroke-dashoffset: 12.5958; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#膚-bg10  { animation-delay: 3.77s; }
#膚-s10   { stroke-dasharray: 36.8394; stroke-dashoffset: 36.8394; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#膚-bg11  { animation-delay: 4.14s; }
#膚-s11   { stroke-dasharray: 33.8840; stroke-dashoffset: 33.8840; animation: drawStroke 0.22s ease-out 4.27s forwards; }
#膚-bg12  { animation-delay: 4.51s; }
#膚-s12   { stroke-dasharray: 28.9138; stroke-dashoffset: 28.9138; animation: drawStroke 0.22s ease-out 4.64s forwards; }
#膚-bg13  { animation-delay: 4.88s; }
#膚-s13   { stroke-dasharray: 69.4276; stroke-dashoffset: 69.4276; animation: drawStroke 0.38s ease-out 5.01s forwards; }
#膚-bg14  { animation-delay: 5.41s; }
#膚-s14   { stroke-dasharray: 33.6332; stroke-dashoffset: 33.6332; animation: drawStroke 0.22s ease-out 5.54s forwards; }
#膚-bg15  { animation-delay: 5.78s; }
#膚-s15   { stroke-dasharray: 33.6848; stroke-dashoffset: 33.6848; animation: drawStroke 0.22s ease-out 5.91s forwards; }
]]>
</style>

