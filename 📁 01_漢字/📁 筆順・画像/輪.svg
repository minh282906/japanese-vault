<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (輪)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #輪-bg[i]: Thời gian quả bóng số nảy lên
   - #輪-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#輪-bg1  { animation-delay: 0.05s; }
#輪-s1   { stroke-dasharray: 29.4535; stroke-dashoffset: 29.4535; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#輪-bg2  { animation-delay: 0.42s; }
#輪-s2   { stroke-dasharray: 24.4539; stroke-dashoffset: 24.4539; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#輪-bg3  { animation-delay: 0.79s; }
#輪-s3   { stroke-dasharray: 51.5444; stroke-dashoffset: 51.5444; animation: drawStroke 0.28s ease-out 0.92s forwards; }
#輪-bg4  { animation-delay: 1.22s; }
#輪-s4   { stroke-dasharray: 26.0282; stroke-dashoffset: 26.0282; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#輪-bg5  { animation-delay: 1.59s; }
#輪-s5   { stroke-dasharray: 22.8178; stroke-dashoffset: 22.8178; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#輪-bg6  { animation-delay: 1.96s; }
#輪-s6   { stroke-dasharray: 36.1659; stroke-dashoffset: 36.1659; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#輪-bg7  { animation-delay: 2.33s; }
#輪-s7   { stroke-dasharray: 80.5290; stroke-dashoffset: 80.5290; animation: drawStroke 0.44s ease-out 2.46s forwards; }
#輪-bg8  { animation-delay: 2.92s; }
#輪-s8   { stroke-dasharray: 34.8916; stroke-dashoffset: 34.8916; animation: drawStroke 0.22s ease-out 3.05s forwards; }
#輪-bg9  { animation-delay: 3.29s; }
#輪-s9   { stroke-dasharray: 36.2172; stroke-dashoffset: 36.2172; animation: drawStroke 0.22s ease-out 3.42s forwards; }
#輪-bg10  { animation-delay: 3.66s; }
#輪-s10   { stroke-dasharray: 22.7594; stroke-dashoffset: 22.7594; animation: drawStroke 0.22s ease-out 3.79s forwards; }
#輪-bg11  { animation-delay: 4.03s; }
#輪-s11   { stroke-dasharray: 33.3251; stroke-dashoffset: 33.3251; animation: drawStroke 0.22s ease-out 4.16s forwards; }
#輪-bg12  { animation-delay: 4.40s; }
#輪-s12   { stroke-dasharray: 83.4458; stroke-dashoffset: 83.4458; animation: drawStroke 0.46s ease-out 4.53s forwards; }
#輪-bg13  { animation-delay: 5.01s; }
#輪-s13   { stroke-dasharray: 37.0834; stroke-dashoffset: 37.0834; animation: drawStroke 0.22s ease-out 5.14s forwards; }
#輪-bg14  { animation-delay: 5.38s; }
#輪-s14   { stroke-dasharray: 26.6596; stroke-dashoffset: 26.6596; animation: drawStroke 0.22s ease-out 5.51s forwards; }
#輪-bg15  { animation-delay: 5.75s; }
#輪-s15   { stroke-dasharray: 28.4161; stroke-dashoffset: 28.4161; animation: drawStroke 0.22s ease-out 5.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
