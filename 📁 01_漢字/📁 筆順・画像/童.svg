<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (童)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #童-bg[i]: Thời gian quả bóng số nảy lên
   - #童-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#童-bg1  { animation-delay: 0.05s; }
#童-s1   { stroke-dasharray: 11.4440; stroke-dashoffset: 11.4440; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#童-bg2  { animation-delay: 0.42s; }
#童-s2   { stroke-dasharray: 47.6542; stroke-dashoffset: 47.6542; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#童-bg3  { animation-delay: 0.83s; }
#童-s3   { stroke-dasharray: 11.3197; stroke-dashoffset: 11.3197; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#童-bg4  { animation-delay: 1.20s; }
#童-s4   { stroke-dasharray: 14.2461; stroke-dashoffset: 14.2461; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#童-bg5  { animation-delay: 1.57s; }
#童-s5   { stroke-dasharray: 77.9398; stroke-dashoffset: 77.9398; animation: drawStroke 0.43s ease-out 1.70s forwards; }
#童-bg6  { animation-delay: 2.15s; }
#童-s6   { stroke-dasharray: 24.6724; stroke-dashoffset: 24.6724; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#童-bg7  { animation-delay: 2.52s; }
#童-s7   { stroke-dasharray: 66.1551; stroke-dashoffset: 66.1551; animation: drawStroke 0.36s ease-out 2.65s forwards; }
#童-bg8  { animation-delay: 3.03s; }
#童-s8   { stroke-dasharray: 39.5683; stroke-dashoffset: 39.5683; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#童-bg9  { animation-delay: 3.40s; }
#童-s9   { stroke-dasharray: 34.8620; stroke-dashoffset: 34.8620; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#童-bg10  { animation-delay: 3.77s; }
#童-s10   { stroke-dasharray: 44.9565; stroke-dashoffset: 44.9565; animation: drawStroke 0.25s ease-out 3.90s forwards; }
#童-bg11  { animation-delay: 4.17s; }
#童-s11   { stroke-dasharray: 44.0434; stroke-dashoffset: 44.0434; animation: drawStroke 0.24s ease-out 4.30s forwards; }
#童-bg12  { animation-delay: 4.56s; }
#童-s12   { stroke-dasharray: 74.8802; stroke-dashoffset: 74.8802; animation: drawStroke 0.41s ease-out 4.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #童-s[i]) -->
<path id="童-s1"  class="stroke" stroke="#bf0909" d="M52.75,10.25C53.75,11,54.25,12.25,54.25,14S54.25,16.5,54.25,21.25"/>
<path id="童-s2"  class="stroke" stroke="#bf6409" d="M30.62,23.7C32.44,24.029999999999998,34.59,24.2,36.4,24.029999999999998C46.12,23.119999999999997,62,21.499999999999996,71.74000000000001,21.259999999999998C74.78000000000002,21.189999999999998,76.60000000000001,21.419999999999998,78.12,21.58"/>
