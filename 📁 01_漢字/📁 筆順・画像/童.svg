<path id="童-s6"  class="stroke" stroke="#09bf64" d="M31.41,49.35C32.16,50.1,32.8,50.95,32.92,51.43C34.17,56.44,35.46,63.25,36.63,69.88C36.82,70.96,37.010000000000005,72.03,37.190000000000005,73.08999999999999"/>
<path id="童-s7"  class="stroke" stroke="#09bfbf" d="M34.18,50.85C47.62,49.5,63.870000000000005,47.620000000000005,73.7,46.980000000000004C76.84,46.77,78.81,48.900000000000006,78.27000000000001,51.27C77.45000000000002,54.900000000000006,75.64000000000001,62.11,74.07000000000001,66.82000000000001C73.71000000000001,67.91000000000001,73.36000000000001,68.86000000000001,73.04,69.61000000000001"/>
<path id="童-s8"  class="stroke" stroke="#0964bf" d="M36.06,60.65C41.870000000000005,60.129999999999995,70.25,58,75.53,57.89"/>
<path id="童-s9"  class="stroke" stroke="#0909bf" d="M37.53,70.31C45.75,69.9,60.94,68.46000000000001,72.30000000000001,67.79"/>
<path id="童-s10"  class="stroke" stroke="#6409bf" d="M53,50.82C54,51.63,54.61,52.84,54.65,54.88C54.85,66.12,54.71,92.52000000000001,54.71,95.30000000000001"/>
<path id="童-s11"  class="stroke" stroke="#bf09bf" d="M33.5,82.06C34.89,82.43,37.45,82.54,38.84,82.43C50.49,81.5,61.370000000000005,80.37,72.53,80.17C74.85,80.13,76.25,80.35000000000001,77.41,80.53"/>
<path id="童-s12"  class="stroke" stroke="#bf0964" d="M17.32,96C19.61,96.64,23.82,96.74,26.11,96.64C49.96,95.57000000000001,55.480000000000004,95.28,84.05,94.54C87.86999999999999,94.44000000000001,90.16,94.84,92.07,95.17"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="童-bg1"  class="badge-group"><circle cx="52.75" cy="10.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.75" y="10.25" dx="0" dy="-0.5">1</text></g>
