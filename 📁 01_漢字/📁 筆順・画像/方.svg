<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (方)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #方-bg[i]: Thời gian quả bóng số nảy lên
   - #方-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#方-bg1  { animation-delay: 0.05s; }
#方-s1   { stroke-dasharray: 16.5201; stroke-dashoffset: 16.5201; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#方-bg2  { animation-delay: 0.42s; }
#方-s2   { stroke-dasharray: 79.9448; stroke-dashoffset: 79.9448; animation: drawStroke 0.44s ease-out 0.55s forwards; }
#方-bg3  { animation-delay: 1.01s; }
#方-s3   { stroke-dasharray: 83.8943; stroke-dashoffset: 83.8943; animation: drawStroke 0.46s ease-out 1.14s forwards; }
#方-bg4  { animation-delay: 1.62s; }
#方-s4   { stroke-dasharray: 63.1922; stroke-dashoffset: 63.1922; animation: drawStroke 0.35s ease-out 1.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #方-s[i]) -->
<path id="方-s1"  class="stroke" stroke="#bf0909" d="M52.86,12C53.93,13.07,54.589999999999996,14.5,54.589999999999996,16.41C54.589999999999996,21.25,54.44,24.25,54.44,28.060000000000002"/>
<path id="方-s2"  class="stroke" stroke="#64bf09" d="M15.5,31.61C18,32.25,21.88,32.5,25.52,32.16C43.97,30.41,67.12,28,85.87,27.2C89.75,27.04,92.23,27.25,95.12,27.9"/>
<path id="方-s3"  class="stroke" stroke="#09bfbf" d="M53.48,47.2C60.12,48.370000000000005,66.87,48.120000000000005,71.99,47.61C75.39999999999999,47.269999999999996,77.16999999999999,49.36,76.66,51.97C74.63,62.37,66.13,85.5,60.12,93.07C55.33,99.11,53,94.24,50.03,91"/>
<path id="方-s4"  class="stroke" stroke="#6409bf" d="M54.51,32.75C55,34.25,54.9,35.94,54.32,37.63C50.3,49.29,38.68,72.85,20.62,83.88"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="方-bg1"  class="badge-group"><circle cx="52.86" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="52.86" y="12" dx="0" dy="-0.5">1</text></g>
<g id="方-bg2"  class="badge-group"><circle cx="15.5" cy="31.61" r="3.5" fill="#64bf09"/><text class="num-single" x="15.5" y="31.61" dx="0" dy="-0.5">2</text></g>
<g id="方-bg3"  class="badge-group"><circle cx="53.48" cy="47.2" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.48" y="47.2" dx="0" dy="-0.5">3</text></g>
<g id="方-bg4"  class="badge-group"><circle cx="54.51" cy="32.75" r="3.5" fill="#6409bf"/><text class="num-single" x="54.51" y="32.75" dx="0" dy="-0.5">4</text></g>
</svg>