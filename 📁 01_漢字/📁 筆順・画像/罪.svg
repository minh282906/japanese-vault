<path id="罪-s1"  class="stroke" stroke="#bf0909" d="M21.25,16.34C22.08,17.169999999999998,22.82,18.43,23.06,19.61C24,24.25,24.59,27.24,25.32,31.490000000000002C25.64,33.330000000000005,25.92,35.06,26.13,36.5"/>
