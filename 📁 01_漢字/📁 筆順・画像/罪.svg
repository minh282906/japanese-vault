<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (罪)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #罪-bg[i]: Thời gian quả bóng số nảy lên
   - #罪-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#罪-bg1  { animation-delay: 0.05s; }
#罪-s1   { stroke-dasharray: 20.9547; stroke-dashoffset: 20.9547; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#罪-bg2  { animation-delay: 0.42s; }
#罪-s2   { stroke-dasharray: 84.4488; stroke-dashoffset: 84.4488; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#罪-bg3  { animation-delay: 1.03s; }
#罪-s3   { stroke-dasharray: 13.6255; stroke-dashoffset: 13.6255; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#罪-bg4  { animation-delay: 1.40s; }
#罪-s4   { stroke-dasharray: 13.9341; stroke-dashoffset: 13.9341; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#罪-bg5  { animation-delay: 1.77s; }
#罪-s5   { stroke-dasharray: 56.9412; stroke-dashoffset: 56.9412; animation: drawStroke 0.31s ease-out 1.90s forwards; }
#罪-bg6  { animation-delay: 2.23s; }
#罪-s6   { stroke-dasharray: 61.7977; stroke-dashoffset: 61.7977; animation: drawStroke 0.34s ease-out 2.36s forwards; }
#罪-bg7  { animation-delay: 2.72s; }
#罪-s7   { stroke-dasharray: 22.6963; stroke-dashoffset: 22.6963; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#罪-bg8  { animation-delay: 3.09s; }
#罪-s8   { stroke-dasharray: 23.5321; stroke-dashoffset: 23.5321; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#罪-bg9  { animation-delay: 3.46s; }
#罪-s9   { stroke-dasharray: 29.0280; stroke-dashoffset: 29.0280; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#罪-bg10  { animation-delay: 3.83s; }
#罪-s10   { stroke-dasharray: 63.2768; stroke-dashoffset: 63.2768; animation: drawStroke 0.35s ease-out 3.96s forwards; }
#罪-bg11  { animation-delay: 4.33s; }
#罪-s11   { stroke-dasharray: 23.9745; stroke-dashoffset: 23.9745; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#罪-bg12  { animation-delay: 4.70s; }
#罪-s12   { stroke-dasharray: 24.3724; stroke-dashoffset: 24.3724; animation: drawStroke 0.22s ease-out 4.83s forwards; }
#罪-bg13  { animation-delay: 5.07s; }
#罪-s13   { stroke-dasharray: 28.7201; stroke-dashoffset: 28.7201; animation: drawStroke 0.22s ease-out 5.20s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

