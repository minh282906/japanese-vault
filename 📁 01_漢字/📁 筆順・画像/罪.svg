<path id="罪-s9"  class="stroke" stroke="#0941bf" d="M14.25,81.47C15.02,82.24,16.73,82.3,18.82,81.62C23.38,80.13000000000001,31.130000000000003,78.13000000000001,42.010000000000005,74.51"/>
<path id="罪-s10"  class="stroke" stroke="#2509bf" d="M62.6,37C63.36,37.76,63.75,39,63.75,40.12C63.75,47.62,63.78,80.49,63.66,93.25999999999999C63.629999999999995,96.71999999999998,63.599999999999994,99.16999999999999,63.559999999999995,99.99"/>
<path id="罪-s11"  class="stroke" stroke="#7909bf" d="M64.95,48.91C68.25,48.669999999999995,79.95,47.05,85,46.4C86.35,46.23,87.37,46.25,88.76,46.33"/>
<path id="罪-s12"  class="stroke" stroke="#bf09b1" d="M65.02,64.01C68.2,63.78000000000001,79.46,62.330000000000005,84.88,61.68000000000001C86.36999999999999,61.50000000000001,87.75,61.540000000000006,89.25,61.540000000000006"/>
<path id="罪-s13"  class="stroke" stroke="#bf095d" d="M64.91,78.75C67.92,78.53,80.87,77.19,87.75,76.53C89.64,76.35,91.49,76,93.5,76.29"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="罪-bg1"  class="badge-group"><circle cx="21.25" cy="12.84" r="3.5" fill="#bf0909"/><text class="num-single" x="21.25" y="12.84" dx="0" dy="-0.5">1</text></g>
