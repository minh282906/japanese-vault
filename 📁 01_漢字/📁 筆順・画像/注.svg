<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (注)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #注-bg[i]: Thời gian quả bóng số nảy lên
   - #注-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#注-bg1  { animation-delay: 0.05s; }
#注-s1   { stroke-dasharray: 13.9464; stroke-dashoffset: 13.9464; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#注-bg2  { animation-delay: 0.42s; }
#注-s2   { stroke-dasharray: 13.8635; stroke-dashoffset: 13.8635; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#注-bg3  { animation-delay: 0.79s; }
#注-s3   { stroke-dasharray: 27.5018; stroke-dashoffset: 27.5018; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#注-bg4  { animation-delay: 1.16s; }
#注-s4   { stroke-dasharray: 17.5101; stroke-dashoffset: 17.5101; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#注-bg5  { animation-delay: 1.53s; }
#注-s5   { stroke-dasharray: 47.1677; stroke-dashoffset: 47.1677; animation: drawStroke 0.26s ease-out 1.66s forwards; }
#注-bg6  { animation-delay: 1.94s; }
#注-s6   { stroke-dasharray: 44.2381; stroke-dashoffset: 44.2381; animation: drawStroke 0.24s ease-out 2.07s forwards; }
#注-bg7  { animation-delay: 2.33s; }
#注-s7   { stroke-dasharray: 39.7318; stroke-dashoffset: 39.7318; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#注-bg8  { animation-delay: 2.70s; }
#注-s8   { stroke-dasharray: 66.2354; stroke-dashoffset: 66.2354; animation: drawStroke 0.36s ease-out 2.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #注-s[i]) -->
<path id="注-s1"  class="stroke" stroke="#bf0909" d="M21.26,16C25.05,17.52,31.05,22.23,32,24.59"/>
<path id="注-s2"  class="stroke" stroke="#bf9109" d="M12.25,40C15.96,41.54,21.82,46.35,22.75,48.75"/>
<path id="注-s3"  class="stroke" stroke="#64bf09" d="M14.5,91.37C15.92,91.57000000000001,17.43,90.85000000000001,18.09,89.69C20.9,84.77,25.2,74.77,27.75,68.49"/>
<path id="注-s4"  class="stroke" stroke="#09bf36" d="M56.38,13.75C61.32,15.77,68.58,21.43,69.81,24.57"/>
<path id="注-s5"  class="stroke" stroke="#09bfbf" d="M42,39.52C44.5,39.88,47.2,39.690000000000005,49.37,39.52C59,38.760000000000005,72.62,37.370000000000005,82.5,36.88C84.68,36.77,86.88,36.57,89,37.220000000000006"/>
<path id="注-s6"  class="stroke" stroke="#0936bf" d="M64.75,41.79C65.79,42.83,66.25,44.25,66.25,45.73C66.25,51.68,66.25,77.25,66.25,85.63999999999999"/>
<path id="注-s7"  class="stroke" stroke="#6409bf" d="M46.75,62.4C49.13,62.75,51.31,62.68,53.13,62.46C61.25,61.49,70.12,59.99,80.75,59.27C81.92,59.190000000000005,84.5,59.07,86.25,59.5"/>
<path id="注-s8"  class="stroke" stroke="#bf0991" d="M32.75,88.52C35.75,89.11999999999999,39.019999999999996,89.17,42.13,88.88C56.75,87.5,73.19,86.14,89.26,85.5C92.42,85.38,96.13000000000001,85.5,98.75,86.28"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="注-bg1"  class="badge-group"><circle cx="21.26" cy="16" r="3.5" fill="#bf0909"/><text class="num-single" x="21.26" y="16" dx="0" dy="-0.5">1</text></g>
<g id="注-bg2"  class="badge-group"><circle cx="12.25" cy="40" r="3.5" fill="#bf9109"/><text class="num-single" x="12.25" y="40" dx="0" dy="-0.5">2</text></g>
<g id="注-bg3"  class="badge-group"><circle cx="14.5" cy="91.37" r="3.5" fill="#64bf09"/><text class="num-single" x="14.5" y="91.37" dx="0" dy="-0.5">3</text></g>
<g id="注-bg4"  class="badge-group"><circle cx="56.38" cy="13.75" r="3.5" fill="#09bf36"/><text class="num-single" x="56.38" y="13.75" dx="0" dy="-0.5">4</text></g>
<g id="注-bg5"  class="badge-group"><circle cx="42" cy="39.52" r="3.5" fill="#09bfbf"/><text class="num-single" x="42" y="39.52" dx="0" dy="-0.5">5</text></g>
<g id="注-bg6"  class="badge-group"><circle cx="64.75" cy="41.79" r="3.5" fill="#0936bf"/><text class="num-single" x="64.75" y="41.79" dx="0" dy="-0.5">6</text></g>
<g id="注-bg7"  class="badge-group"><circle cx="46.75" cy="62.4" r="3.5" fill="#6409bf"/><text class="num-single" x="46.75" y="62.4" dx="0" dy="-0.5">7</text></g>
<g id="注-bg8"  class="badge-group"><circle cx="32.75" cy="88.52" r="3.5" fill="#bf0991"/><text class="num-single" x="32.75" y="88.52" dx="0" dy="-0.5">8</text></g>
</svg>