<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (棒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #棒-bg[i]: Thời gian quả bóng số nảy lên
   - #棒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#棒-bg1  { animation-delay: 0.05s; }
#棒-s1   { stroke-dasharray: 29.1466; stroke-dashoffset: 29.1466; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#棒-bg2  { animation-delay: 0.42s; }
#棒-s2   { stroke-dasharray: 83.0219; stroke-dashoffset: 83.0219; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#棒-bg3  { animation-delay: 1.03s; }
#棒-s3   { stroke-dasharray: 37.8615; stroke-dashoffset: 37.8615; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#棒-bg4  { animation-delay: 1.40s; }
#棒-s4   { stroke-dasharray: 11.1293; stroke-dashoffset: 11.1293; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#棒-bg5  { animation-delay: 1.77s; }
#棒-s5   { stroke-dasharray: 40.9269; stroke-dashoffset: 40.9269; animation: drawStroke 0.23s ease-out 1.90s forwards; }
#棒-bg6  { animation-delay: 2.15s; }
#棒-s6   { stroke-dasharray: 38.3073; stroke-dashoffset: 38.3073; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#棒-bg7  { animation-delay: 2.52s; }
#棒-s7   { stroke-dasharray: 53.8160; stroke-dashoffset: 53.8160; animation: drawStroke 0.30s ease-out 2.65s forwards; }
#棒-bg8  { animation-delay: 2.97s; }
#棒-s8   { stroke-dasharray: 64.9862; stroke-dashoffset: 64.9862; animation: drawStroke 0.36s ease-out 3.10s forwards; }
#棒-bg9  { animation-delay: 3.48s; }
#棒-s9   { stroke-dasharray: 35.4768; stroke-dashoffset: 35.4768; animation: drawStroke 0.22s ease-out 3.61s forwards; }
#棒-bg10  { animation-delay: 3.85s; }
#棒-s10   { stroke-dasharray: 27.3996; stroke-dashoffset: 27.3996; animation: drawStroke 0.22s ease-out 3.98s forwards; }
#棒-bg11  { animation-delay: 4.22s; }
#棒-s11   { stroke-dasharray: 44.7435; stroke-dashoffset: 44.7435; animation: drawStroke 0.25s ease-out 4.35s forwards; }
#棒-bg12  { animation-delay: 4.62s; }
#棒-s12   { stroke-dasharray: 47.5576; stroke-dashoffset: 47.5576; animation: drawStroke 0.26s ease-out 4.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

