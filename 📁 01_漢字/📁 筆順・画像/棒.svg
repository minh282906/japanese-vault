<path id="棒-s6"  class="stroke" stroke="#09bf64" d="M47.61,35.97C49.88,36.379999999999995,51.71,36.08,53.519999999999996,35.9C62.5,35,72.53999999999999,33.35,79.87,32.739999999999995C81.81,32.58,83.76,32.44,85.67,32.92999999999999"/>
<path id="棒-s7"  class="stroke" stroke="#09bfbf" d="M42.81,47.68C45.03,48.52,47.71,48.27,50,47.97C63.12,46.25,79.63,44.08,89.38,43.67C91.67999999999999,43.57,94.00999999999999,43.57,96.27,44.08"/>
<path id="棒-s8"  class="stroke" stroke="#0964bf" d="M66.08,12.5C66.75,13.75,66.92999999999999,15.11,66.59,17.03C64,31.62,59,55,39.58,69.23"/>
<path id="棒-s9"  class="stroke" stroke="#0909bf" d="M69.6,39.63C71.12,40.38,86.25,55,90.75,59C92.09,60.19,94.25,61.5,96.42,62.71"/>
<path id="棒-s10"  class="stroke" stroke="#6409bf" d="M54.53,63.93C56.050000000000004,64.55,57.660000000000004,64.46,59.25,64.39C64.6,64.15,73.22,62.89,77.99,62.53C79.27,62.43,80.36,62.25,81.75999999999999,62.47"/>
<path id="棒-s11"  class="stroke" stroke="#bf09bf" d="M46.97,77.59C49.379999999999995,78,51.839999999999996,77.89,53.91,77.69C61.75,76.95,77.84,75.36,85.39,75.25999999999999C87.41,75.22999999999999,89.59,75.24,91.56,75.71"/>
<path id="棒-s12"  class="stroke" stroke="#bf0964" d="M66.61,52.29C67.6,53.28,68.04,54.75,68.04,56.839999999999996C68.04,68.14999999999999,68.05000000000001,86,68.05000000000001,95C68.05000000000001,97.04,68.01,98.61,68.01,99.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="棒-bg1"  class="badge-group"><circle cx="12.28" cy="39.47" r="3.5" fill="#bf0909"/><text class="num-single" x="12.28" y="39.47" dx="0" dy="-0.5">1</text></g>
