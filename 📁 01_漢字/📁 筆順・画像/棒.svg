<path id="棒-s1"  class="stroke" stroke="#bf0909" d="M12.28,39.47C14.25,40,16.68,39.91,18,39.73C22.65,39.08,30.95,37.279999999999994,36.42,36.23C37.690000000000005,35.989999999999995,39.63,35.629999999999995,41.02,35.87"/>
