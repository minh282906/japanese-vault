<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (火)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #火-bg[i]: Thời gian quả bóng số nảy lên
   - #火-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#火-bg1  { animation-delay: 0.05s; }
#火-s1   { stroke-dasharray: 20.2863; stroke-dashoffset: 20.2863; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#火-bg2  { animation-delay: 0.42s; }
#火-s2   { stroke-dasharray: 25.9450; stroke-dashoffset: 25.9450; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#火-bg3  { animation-delay: 0.79s; }
#火-s3   { stroke-dasharray: 89.6360; stroke-dashoffset: 89.6360; animation: drawStroke 0.49s ease-out 0.92s forwards; }
#火-bg4  { animation-delay: 1.43s; }
#火-s4   { stroke-dasharray: 59.1817; stroke-dashoffset: 59.1817; animation: drawStroke 0.33s ease-out 1.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #火-s[i]) -->
<path id="火-s1"  class="stroke" stroke="#bf0909" d="M24.25,34C27.52,37.33,32.75,47,33.75,51.75"/>
<path id="火-s2"  class="stroke" stroke="#64bf09" d="M83,27.25C83.5,28.63,83.22,29.990000000000002,82.5,31.5C80.12,36.5,75,43.62,69.75,48.75"/>
<path id="火-s3"  class="stroke" stroke="#09bfbf" d="M52.5,14.25C53.5,15.5,54,17.37,54,19.25C54,69,39.62,80,21,91.5"/>
<path id="火-s4"  class="stroke" stroke="#6409bf" d="M52.75,50C65.24,64.06,77.76,78.42,86.37,86.13C89.07000000000001,88.55,91.27000000000001,90.14999999999999,94.75,91"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="火-bg1"  class="badge-group"><circle cx="24.25" cy="34" r="3.5" fill="#bf0909"/><text class="num-single" x="24.25" y="34" dx="0" dy="-0.5">1</text></g>
<g id="火-bg2"  class="badge-group"><circle cx="83" cy="27.25" r="3.5" fill="#64bf09"/><text class="num-single" x="83" y="27.25" dx="0" dy="-0.5">2</text></g>
<g id="火-bg3"  class="badge-group"><circle cx="52.5" cy="14.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.5" y="14.25" dx="0" dy="-0.5">3</text></g>
<g id="火-bg4"  class="badge-group"><circle cx="52.75" cy="50" r="3.5" fill="#6409bf"/><text class="num-single" x="52.75" y="50" dx="0" dy="-0.5">4</text></g>
</svg>