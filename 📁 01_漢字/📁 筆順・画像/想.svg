<path id="想-s6"  class="stroke" stroke="#09bf41" d="M60.03,17.59C62.35,17.44,77.14,15.73,82.13,15.21C85.19999999999999,14.9,86.85,15.5,86.83,18.740000000000002C86.8,24.910000000000004,86.61,43.61,86.58,56.99C86.58,58.410000000000004,86.57,59.78,86.57,61.06"/>
<path id="想-s7"  class="stroke" stroke="#09bf95" d="M60.24,31.24C65.38,31.009999999999998,81.32,29.369999999999997,85.5,29.369999999999997"/>
<path id="想-s8"  class="stroke" stroke="#0995bf" d="M60.2,44.47C67.11,43.91,78.56,42.97,85.26,42.97"/>
<path id="想-s9"  class="stroke" stroke="#0941bf" d="M60.27,58.98C67.25,58.62,78.62,57.87,85.19,57.48"/>
<path id="想-s10"  class="stroke" stroke="#2509bf" d="M23.95,77.62C24.25,79.72,20.919999999999998,89,18.5,92.51"/>
<path id="想-s11"  class="stroke" stroke="#7909bf" d="M36.22,73.86C44.75,90.12,58,98,81.78,96.35C90.24000000000001,95.75999999999999,90.38,93.86999999999999,84.86,89.72999999999999"/>
<path id="想-s12"  class="stroke" stroke="#bf09b1" d="M54.48,71C56.879999999999995,75.88,61,81,62.459999999999994,75.2"/>
<path id="想-s13"  class="stroke" stroke="#bf095d" d="M83.25,70.5C87.87,73.38,91.75,77,94.25,81.06"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="想-bg1"  class="badge-group"><circle cx="16.56" cy="28.58" r="3.5" fill="#bf0909"/><text class="num-single" x="16.56" y="28.58" dx="0" dy="-0.5">1</text></g>
