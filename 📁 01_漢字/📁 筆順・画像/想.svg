<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (想)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #想-bg[i]: Thời gian quả bóng số nảy lên
   - #想-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#想-bg1  { animation-delay: 0.05s; }
#想-s1   { stroke-dasharray: 33.8740; stroke-dashoffset: 33.8740; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#想-bg2  { animation-delay: 0.42s; }
#想-s2   { stroke-dasharray: 52.0678; stroke-dashoffset: 52.0678; animation: drawStroke 0.29s ease-out 0.55s forwards; }
#想-bg3  { animation-delay: 0.86s; }
#想-s3   { stroke-dasharray: 35.7942; stroke-dashoffset: 35.7942; animation: drawStroke 0.22s ease-out 0.99s forwards; }
#想-bg4  { animation-delay: 1.23s; }
#想-s4   { stroke-dasharray: 14.3549; stroke-dashoffset: 14.3549; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#想-bg5  { animation-delay: 1.60s; }
#想-s5   { stroke-dasharray: 45.8373; stroke-dashoffset: 45.8373; animation: drawStroke 0.25s ease-out 1.73s forwards; }
#想-bg6  { animation-delay: 2.00s; }
#想-s6   { stroke-dasharray: 71.6147; stroke-dashoffset: 71.6147; animation: drawStroke 0.39s ease-out 2.13s forwards; }
#想-bg7  { animation-delay: 2.54s; }
#想-s7   { stroke-dasharray: 25.3320; stroke-dashoffset: 25.3320; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#想-bg8  { animation-delay: 2.91s; }
#想-s8   { stroke-dasharray: 25.1103; stroke-dashoffset: 25.1103; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#想-bg9  { animation-delay: 3.28s; }
#想-s9   { stroke-dasharray: 24.9652; stroke-dashoffset: 24.9652; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#想-bg10  { animation-delay: 3.65s; }
#想-s10   { stroke-dasharray: 15.9886; stroke-dashoffset: 15.9886; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#想-bg11  { animation-delay: 4.02s; }
#想-s11   { stroke-dasharray: 67.9196; stroke-dashoffset: 67.9196; animation: drawStroke 0.37s ease-out 4.15s forwards; }
#想-bg12  { animation-delay: 4.54s; }
#想-s12   { stroke-dasharray: 12.8459; stroke-dashoffset: 12.8459; animation: drawStroke 0.22s ease-out 4.67s forwards; }
#想-bg13  { animation-delay: 4.91s; }
#想-s13   { stroke-dasharray: 15.3815; stroke-dashoffset: 15.3815; animation: drawStroke 0.22s ease-out 5.04s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

