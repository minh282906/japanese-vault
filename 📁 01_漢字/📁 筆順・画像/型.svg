<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (型)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #型-bg[i]: Thời gian quả bóng số nảy lên
   - #型-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#型-bg1  { animation-delay: 0.05s; }
#型-s1   { stroke-dasharray: 35.0711; stroke-dashoffset: 35.0711; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#型-bg2  { animation-delay: 0.42s; }
#型-s2   { stroke-dasharray: 45.6029; stroke-dashoffset: 45.6029; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#型-bg3  { animation-delay: 0.82s; }
#型-s3   { stroke-dasharray: 43.5314; stroke-dashoffset: 43.5314; animation: drawStroke 0.24s ease-out 0.95s forwards; }
#型-bg4  { animation-delay: 1.21s; }
#型-s4   { stroke-dasharray: 35.9571; stroke-dashoffset: 35.9571; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#型-bg5  { animation-delay: 1.58s; }
#型-s5   { stroke-dasharray: 29.7008; stroke-dashoffset: 29.7008; animation: drawStroke 0.22s ease-out 1.71s forwards; }
#型-bg6  { animation-delay: 1.95s; }
#型-s6   { stroke-dasharray: 54.0541; stroke-dashoffset: 54.0541; animation: drawStroke 0.30s ease-out 2.08s forwards; }
#型-bg7  { animation-delay: 2.40s; }
#型-s7   { stroke-dasharray: 43.6734; stroke-dashoffset: 43.6734; animation: drawStroke 0.24s ease-out 2.53s forwards; }
#型-bg8  { animation-delay: 2.79s; }
#型-s8   { stroke-dasharray: 35.2914; stroke-dashoffset: 35.2914; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#型-bg9  { animation-delay: 3.16s; }
#型-s9   { stroke-dasharray: 76.7610; stroke-dashoffset: 76.7610; animation: drawStroke 0.42s ease-out 3.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #型-s[i]) -->
<path id="型-s1"  class="stroke" stroke="#bf0909" d="M17.54,22.38C18.65,22.759999999999998,20.689999999999998,22.82,21.81,22.759999999999998C30.049999999999997,22.33,40,20.869999999999997,48.480000000000004,19.779999999999998C50.32000000000001,19.54,51.45,19.709999999999997,52.38,19.9"/>
<path id="型-s2"  class="stroke" stroke="#bf8209" d="M12.61,39.56C14.51,40.080000000000005,16.6,40,18.52,39.79C26.04,38.949999999999996,43.19,36.28,51.64,35.32C53.75,35.08,55.74,34.89,57.85,35.24"/>
<path id="型-s3"  class="stroke" stroke="#82bf09" d="M28.06,25.73C28.68,26.77,29,28.02,29.049999999999997,29.12C30,49.5,26.5,59.38,17.58,65.46"/>
<path id="型-s4"  class="stroke" stroke="#09bf09" d="M41.84,23.81C42.580000000000005,24.549999999999997,43.14,26,43.14,27.299999999999997C43.14,29.959999999999997,43.06,45.489999999999995,43.02,54.37C43.010000000000005,56.57,43.010000000000005,58.37,43.010000000000005,59.449999999999996"/>
<path id="型-s5"  class="stroke" stroke="#09bf82" d="M66.4,20.05C67.31,20.86,68.02000000000001,22.25,68.02000000000001,24.490000000000002C68.02000000000001,29.26,68.01,38.85,68.00000000000001,45.120000000000005C68.00000000000001,46.75000000000001,68.00000000000001,48.190000000000005,68.00000000000001,49.32000000000001"/>
<path id="型-s6"  class="stroke" stroke="#0982bf" d="M86.56,13.58C87.49000000000001,14.51,88.18,15.870000000000001,88.18,17.45C88.18,26.5,88.2,52.019999999999996,88.2,55.099999999999994C88.2,63.86999999999999,84.12,57.44,81.76,54.74999999999999"/>
<path id="型-s7"  class="stroke" stroke="#0909bf" d="M33.13,70.42C35.5,70.88,37.81,70.71000000000001,40,70.48C50.41,69.42,61.21,68.42,70.25,67.84C72.43,67.7,74.49,67.53,76.63,68.04"/>
<path id="型-s8"  class="stroke" stroke="#8209bf" d="M52.67,53.62C53.65,54.599999999999994,54.690000000000005,56.39,54.690000000000005,58.26C54.690000000000005,69.25999999999999,54.580000000000005,84.00999999999999,54.580000000000005,88.37"/>
<path id="型-s9"  class="stroke" stroke="#bf0982" d="M17.38,90.48C20.71,91.67,24.47,91.61,27.88,91.31C42.1,90.04,67.69,88.48,84.13,88.12C87.39999999999999,88.05000000000001,90.66,88.13000000000001,93.88,88.82000000000001"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="型-bg1"  class="badge-group"><circle cx="17.54" cy="22.38" r="3.5" fill="#bf0909"/><text class="num-single" x="17.54" y="22.38" dx="0" dy="-0.5">1</text></g>
<g id="型-bg2"  class="badge-group"><circle cx="12.61" cy="39.56" r="3.5" fill="#bf8209"/><text class="num-single" x="12.61" y="39.56" dx="0" dy="-0.5">2</text></g>
<g id="型-bg3"  class="badge-group"><circle cx="28.06" cy="25.73" r="3.5" fill="#82bf09"/><text class="num-single" x="28.06" y="25.73" dx="0" dy="-0.5">3</text></g>
<g id="型-bg4"  class="badge-group"><circle cx="41.84" cy="23.81" r="3.5" fill="#09bf09"/><text class="num-single" x="41.84" y="23.81" dx="0" dy="-0.5">4</text></g>
