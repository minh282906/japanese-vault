<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (短)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #短-bg[i]: Thời gian quả bóng số nảy lên
   - #短-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#短-bg1  { animation-delay: 0.05s; }
#短-s1   { stroke-dasharray: 32.2309; stroke-dashoffset: 32.2309; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#短-bg2  { animation-delay: 0.42s; }
#短-s2   { stroke-dasharray: 20.8714; stroke-dashoffset: 20.8714; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#短-bg3  { animation-delay: 0.79s; }
#短-s3   { stroke-dasharray: 37.2994; stroke-dashoffset: 37.2994; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#短-bg4  { animation-delay: 1.16s; }
#短-s4   { stroke-dasharray: 61.6792; stroke-dashoffset: 61.6792; animation: drawStroke 0.34s ease-out 1.29s forwards; }
#短-bg5  { animation-delay: 1.65s; }
#短-s5   { stroke-dasharray: 16.6248; stroke-dashoffset: 16.6248; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#短-bg6  { animation-delay: 2.02s; }
#短-s6   { stroke-dasharray: 37.7771; stroke-dashoffset: 37.7771; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#短-bg7  { animation-delay: 2.39s; }
#短-s7   { stroke-dasharray: 23.1869; stroke-dashoffset: 23.1869; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#短-bg8  { animation-delay: 2.76s; }
#短-s8   { stroke-dasharray: 50.1095; stroke-dashoffset: 50.1095; animation: drawStroke 0.28s ease-out 2.89s forwards; }
#短-bg9  { animation-delay: 3.19s; }
#短-s9   { stroke-dasharray: 27.6784; stroke-dashoffset: 27.6784; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#短-bg10  { animation-delay: 3.56s; }
#短-s10   { stroke-dasharray: 15.3888; stroke-dashoffset: 15.3888; animation: drawStroke 0.22s ease-out 3.69s forwards; }
#短-bg11  { animation-delay: 3.93s; }
#短-s11   { stroke-dasharray: 22.6487; stroke-dashoffset: 22.6487; animation: drawStroke 0.22s ease-out 4.06s forwards; }
#短-bg12  { animation-delay: 4.30s; }
#短-s12   { stroke-dasharray: 54.4769; stroke-dashoffset: 54.4769; animation: drawStroke 0.30s ease-out 4.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #短-s[i]) -->
<path id="短-s1"  class="stroke" stroke="#bf0909" d="M25.84,17C26.13,17.75,26.16,18.95,26.02,19.9C25.23,25.479999999999997,19.25,39.25,13.77,46.3"/>
