<path id="短-s3"  class="stroke" stroke="#bfbf09" d="M10.32,55.34C12.75,55.75,14.96,55.580000000000005,16.76,55.330000000000005C23.3,54.45,33.36,52.92,40.64,52.14000000000001C43.08,51.88000000000001,45.13,51.870000000000005,47.33,52.470000000000006"/>
