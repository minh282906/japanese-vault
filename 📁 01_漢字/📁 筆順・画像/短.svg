<path id="短-s5"  class="stroke" stroke="#09bf09" d="M32.25,67.25C35.99,69.74,40.75,74.5,43.25,79.5"/>
<path id="短-s6"  class="stroke" stroke="#09bf64" d="M52.24,25.14C54.25,25.5,56.07,25.52,57.760000000000005,25.37C66.38000000000001,24.62,75.83000000000001,22.92,84.25,22.310000000000002C86.14,22.17,87.93,22.070000000000004,89.79,22.500000000000004"/>
<path id="短-s7"  class="stroke" stroke="#09bfbf" d="M52.79,39.53C53.87,40.25,54.68,41.49,54.96,42.67C55.95,46.85,56.83,52.35,57.79,58.35C57.97,59.46,58.14,60.56,58.3,61.660000000000004"/>
<path id="短-s8"  class="stroke" stroke="#0964bf" d="M55.37,40.88C62.04,40.220000000000006,77.56,37.99,83.75999999999999,37.56C87.16999999999999,37.330000000000005,88.57,38.440000000000005,87.69999999999999,41.88C87.03999999999999,44.480000000000004,86.42999999999999,46.040000000000006,84.44999999999999,55.540000000000006"/>
<path id="短-s9"  class="stroke" stroke="#0909bf" d="M58.95,59.1C65.34,58.480000000000004,75.08,57.5,82.63,56.93C84.00999999999999,56.83,85.32,56.74,86.52,56.67"/>
<path id="短-s10"  class="stroke" stroke="#6409bf" d="M56.38,67.75C58.580000000000005,70.21,62.07,77.85,62.63,81.68"/>
<path id="短-s11"  class="stroke" stroke="#bf09bf" d="M82.95,64.34C83.13000000000001,65.12,83.07000000000001,66.2,82.9,66.93C81.75,71.88,78.88,79,74.88,85.2"/>
<path id="短-s12"  class="stroke" stroke="#bf0964" d="M45.73,88.76C47.79,89.45,51.56999999999999,89.58,53.629999999999995,89.45C70.16999999999999,88.37,79.84,87.25,92.8,87.14C96.24,87.11,98.3,87.47,100.02,87.81"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="短-bg1"  class="badge-group"><circle cx="25.84" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="25.84" y="17" dx="0" dy="-0.5">1</text></g>
