<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (読)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #読-bg[i]: Thời gian quả bóng số nảy lên
   - #読-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#読-bg1  { animation-delay: 0.05s; }
#読-s1   { stroke-dasharray: 11.3721; stroke-dashoffset: 11.3721; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#読-bg2  { animation-delay: 0.42s; }
#読-s2   { stroke-dasharray: 30.1730; stroke-dashoffset: 30.1730; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#読-bg3  { animation-delay: 0.79s; }
#読-s3   { stroke-dasharray: 20.4072; stroke-dashoffset: 20.4072; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#読-bg4  { animation-delay: 1.16s; }
#読-s4   { stroke-dasharray: 20.4929; stroke-dashoffset: 20.4929; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#読-bg5  { animation-delay: 1.53s; }
#読-s5   { stroke-dasharray: 20.9263; stroke-dashoffset: 20.9263; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#読-bg6  { animation-delay: 1.90s; }
#読-s6   { stroke-dasharray: 34.9290; stroke-dashoffset: 34.9290; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#読-bg7  { animation-delay: 2.27s; }
#読-s7   { stroke-dasharray: 15.8604; stroke-dashoffset: 15.8604; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#読-bg8  { animation-delay: 2.64s; }
#読-s8   { stroke-dasharray: 43.7009; stroke-dashoffset: 43.7009; animation: drawStroke 0.24s ease-out 2.77s forwards; }
#読-bg9  { animation-delay: 3.03s; }
#読-s9   { stroke-dasharray: 24.1814; stroke-dashoffset: 24.1814; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#読-bg10  { animation-delay: 3.40s; }
#読-s10   { stroke-dasharray: 30.8676; stroke-dashoffset: 30.8676; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#読-bg11  { animation-delay: 3.77s; }
#読-s11   { stroke-dasharray: 14.6181; stroke-dashoffset: 14.6181; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#読-bg12  { animation-delay: 4.14s; }
#読-s12   { stroke-dasharray: 54.9389; stroke-dashoffset: 54.9389; animation: drawStroke 0.30s ease-out 4.27s forwards; }
#読-bg13  { animation-delay: 4.59s; }
#読-s13   { stroke-dasharray: 39.6770; stroke-dashoffset: 39.6770; animation: drawStroke 0.22s ease-out 4.72s forwards; }
#読-bg14  { animation-delay: 4.96s; }
#読-s14   { stroke-dasharray: 65.0248; stroke-dashoffset: 65.0248; animation: drawStroke 0.36s ease-out 5.09s forwards; }
]]>
</style>

