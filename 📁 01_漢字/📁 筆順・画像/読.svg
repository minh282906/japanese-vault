<path id="読-s8"  class="stroke" stroke="#09bfbf" d="M46.37,26.71C48.68,27.3,51.04,27.130000000000003,53.37,26.86C63.339999999999996,25.72,75.19,24.63,83.14,23.8C85.5,23.55,87.52,23.59,89.85,23.94"/>
<path id="読-s9"  class="stroke" stroke="#0971bf" d="M65.76,13.25C66.82000000000001,14.31,67.35000000000001,15.33,67.35000000000001,16.5C67.35000000000001,25,67.28000000000002,33.53,67.16000000000001,36.96"/>
