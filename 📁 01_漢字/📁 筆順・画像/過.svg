<path id="過-s6"  class="stroke" stroke="#09bf64" d="M44.15,46.8C49.739999999999995,46.089999999999996,76.15,43.75,85.25,42.849999999999994C89.91,42.38999999999999,92.27,43.599999999999994,91.96,48.629999999999995C91.52999999999999,55.669999999999995,89.52999999999999,71.02,87.03,77.86999999999999C84.14,85.77999999999999,81.8,80.60999999999999,79.7,77.88"/>
<path id="過-s7"  class="stroke" stroke="#09bfbf" d="M56,55.77C56.8,56.57,56.99,57.290000000000006,57.15,58.24C57.699999999999996,61.57,58.05,63.96,58.66,67.24000000000001C58.849999999999994,68.27000000000001,59.06999999999999,69.38000000000001,59.33,70.64000000000001"/>
<path id="過-s8"  class="stroke" stroke="#0964bf" d="M57.99,56.82C65.13,55.88,70.17,55.24,73.63,54.8C76.17,54.48,77.13,55.18,76.56,57.769999999999996C75.88,60.849999999999994,75.14,62.9,74.34,65.89"/>
<path id="過-s9"  class="stroke" stroke="#0909bf" d="M60.22,68.44C63.48,68.05,68,67.59,72.53999999999999,67.03999999999999C73.64999999999999,66.89999999999999,74.75999999999999,66.75999999999999,75.85999999999999,66.61999999999999"/>
<path id="過-s10"  class="stroke" stroke="#6409bf" d="M20.38,19.12C24.22,20.89,30.299999999999997,26.380000000000003,31.259999999999998,29.130000000000003"/>
<path id="過-s11"  class="stroke" stroke="#bf09bf" d="M12.75,50.75C15,51.75,16.5,51.25,17.5,51S27.25,47.25,28.75,46.75S31.91,47.32,31,49.25C24.25,63.5,23.62,59,30.75,68.25C32.23,70.17,32,71.5,30.5,72.75S21.5,81,20,81.5"/>
<path id="過-s12"  class="stroke" stroke="#bf0964" d="M15.25,83.25C18.25,82.75,24.189999999999998,82.08,28.75,82.75C34.75,83.63,58.82,89.96,63.25,91.25C75.25,94.75,80.63,95.63,90,95.75"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="過-bg1"  class="badge-group"><circle cx="48.8" cy="12.44" r="3.5" fill="#bf0909"/><text class="num-single" x="48.8" y="12.44" dx="0" dy="-0.5">1</text></g>
