<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (過)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #過-bg[i]: Thời gian quả bóng số nảy lên
   - #過-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#過-bg1  { animation-delay: 0.05s; }
#過-s1   { stroke-dasharray: 29.2079; stroke-dashoffset: 29.2079; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#過-bg2  { animation-delay: 0.42s; }
#過-s2   { stroke-dasharray: 59.8406; stroke-dashoffset: 59.8406; animation: drawStroke 0.33s ease-out 0.55s forwards; }
#過-bg3  { animation-delay: 0.90s; }
#過-s3   { stroke-dasharray: 16.4658; stroke-dashoffset: 16.4658; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#過-bg4  { animation-delay: 1.27s; }
#過-s4   { stroke-dasharray: 14.7172; stroke-dashoffset: 14.7172; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#過-bg5  { animation-delay: 1.64s; }
#過-s5   { stroke-dasharray: 35.5128; stroke-dashoffset: 35.5128; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#過-bg6  { animation-delay: 2.01s; }
#過-s6   { stroke-dasharray: 93.4038; stroke-dashoffset: 93.4038; animation: drawStroke 0.51s ease-out 2.14s forwards; }
#過-bg7  { animation-delay: 2.67s; }
#過-s7   { stroke-dasharray: 15.3711; stroke-dashoffset: 15.3711; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#過-bg8  { animation-delay: 3.04s; }
#過-s8   { stroke-dasharray: 29.6365; stroke-dashoffset: 29.6365; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#過-bg9  { animation-delay: 3.41s; }
#過-s9   { stroke-dasharray: 15.7458; stroke-dashoffset: 15.7458; animation: drawStroke 0.22s ease-out 3.54s forwards; }
#過-bg10  { animation-delay: 3.78s; }
#過-s10   { stroke-dasharray: 14.9990; stroke-dashoffset: 14.9990; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#過-bg11  { animation-delay: 4.15s; }
#過-s11   { stroke-dasharray: 62.1652; stroke-dashoffset: 62.1652; animation: drawStroke 0.34s ease-out 4.28s forwards; }
#過-bg12  { animation-delay: 4.64s; }
#過-s12   { stroke-dasharray: 76.3321; stroke-dashoffset: 76.3321; animation: drawStroke 0.42s ease-out 4.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

