<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (偉)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #偉-bg[i]: Thời gian quả bóng số nảy lên
   - #偉-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#偉-bg1  { animation-delay: 0.05s; }
#偉-s1   { stroke-dasharray: 48.4259; stroke-dashoffset: 48.4259; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#偉-bg2  { animation-delay: 0.47s; }
#偉-s2   { stroke-dasharray: 59.0814; stroke-dashoffset: 59.0814; animation: drawStroke 0.32s ease-out 0.60s forwards; }
#偉-bg3  { animation-delay: 0.94s; }
#偉-s3   { stroke-dasharray: 22.3430; stroke-dashoffset: 22.3430; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#偉-bg4  { animation-delay: 1.31s; }
#偉-s4   { stroke-dasharray: 42.9740; stroke-dashoffset: 42.9740; animation: drawStroke 0.24s ease-out 1.44s forwards; }
#偉-bg5  { animation-delay: 1.70s; }
#偉-s5   { stroke-dasharray: 56.3883; stroke-dashoffset: 56.3883; animation: drawStroke 0.31s ease-out 1.83s forwards; }
#偉-bg6  { animation-delay: 2.16s; }
#偉-s6   { stroke-dasharray: 15.6690; stroke-dashoffset: 15.6690; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#偉-bg7  { animation-delay: 2.53s; }
#偉-s7   { stroke-dasharray: 46.2074; stroke-dashoffset: 46.2074; animation: drawStroke 0.25s ease-out 2.66s forwards; }
#偉-bg8  { animation-delay: 2.93s; }
#偉-s8   { stroke-dasharray: 31.3426; stroke-dashoffset: 31.3426; animation: drawStroke 0.22s ease-out 3.06s forwards; }
#偉-bg9  { animation-delay: 3.30s; }
#偉-s9   { stroke-dasharray: 44.2689; stroke-dashoffset: 44.2689; animation: drawStroke 0.24s ease-out 3.43s forwards; }
#偉-bg10  { animation-delay: 3.69s; }
#偉-s10   { stroke-dasharray: 12.1862; stroke-dashoffset: 12.1862; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#偉-bg11  { animation-delay: 4.06s; }
#偉-s11   { stroke-dasharray: 57.5724; stroke-dashoffset: 57.5724; animation: drawStroke 0.32s ease-out 4.19s forwards; }
#偉-bg12  { animation-delay: 4.53s; }
#偉-s12   { stroke-dasharray: 40.4495; stroke-dashoffset: 40.4495; animation: drawStroke 0.22s ease-out 4.66s forwards; }
]]>
</style>

