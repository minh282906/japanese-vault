<path id="偉-s9"  class="stroke" stroke="#0909bf" d="M45.67,67.64C47.88,68.13,49.81,67.87,52.050000000000004,67.6C59.260000000000005,66.72999999999999,73.38,64.80999999999999,82.76,63.63999999999999C84.93,63.36999999999999,87.44,63.129999999999995,89.62,63.559999999999995"/>
<path id="偉-s10"  class="stroke" stroke="#6409bf" d="M51.59,68.61C52.120000000000005,69.14,52.330000000000005,70.2,52.32,71.01C52.27,74.44000000000001,52.25,77.63000000000001,52.25,80.63000000000001"/>
<path id="偉-s11"  class="stroke" stroke="#bf09bf" d="M39.87,82.36C42.239999999999995,83.07,45.37,82.61,47.75,82.27C59.01,80.64,75.25,78.25,89.99000000000001,77.28999999999999C92.37,77.13,94.69000000000001,76.86999999999999,97.06,77.27"/>
