<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鳥)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鳥-bg[i]: Thời gian quả bóng số nảy lên
   - #鳥-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鳥-bg1  { animation-delay: 0.05s; }
#鳥-s1   { stroke-dasharray: 16.5678; stroke-dashoffset: 16.5678; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鳥-bg2  { animation-delay: 0.42s; }
#鳥-s2   { stroke-dasharray: 45.3046; stroke-dashoffset: 45.3046; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#鳥-bg3  { animation-delay: 0.82s; }
#鳥-s3   { stroke-dasharray: 55.0817; stroke-dashoffset: 55.0817; animation: drawStroke 0.30s ease-out 0.95s forwards; }
#鳥-bg4  { animation-delay: 1.27s; }
#鳥-s4   { stroke-dasharray: 31.1866; stroke-dashoffset: 31.1866; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#鳥-bg5  { animation-delay: 1.64s; }
#鳥-s5   { stroke-dasharray: 29.5351; stroke-dashoffset: 29.5351; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#鳥-bg6  { animation-delay: 2.01s; }
#鳥-s6   { stroke-dasharray: 47.7313; stroke-dashoffset: 47.7313; animation: drawStroke 0.26s ease-out 2.14s forwards; }
#鳥-bg7  { animation-delay: 2.42s; }
#鳥-s7   { stroke-dasharray: 99.3938; stroke-dashoffset: 99.3938; animation: drawStroke 0.55s ease-out 2.55s forwards; }
#鳥-bg8  { animation-delay: 3.12s; }
#鳥-s8   { stroke-dasharray: 17.1636; stroke-dashoffset: 17.1636; animation: drawStroke 0.22s ease-out 3.25s forwards; }
#鳥-bg9  { animation-delay: 3.49s; }
#鳥-s9   { stroke-dasharray: 12.5173; stroke-dashoffset: 12.5173; animation: drawStroke 0.22s ease-out 3.62s forwards; }
#鳥-bg10  { animation-delay: 3.86s; }
#鳥-s10   { stroke-dasharray: 11.2226; stroke-dashoffset: 11.2226; animation: drawStroke 0.22s ease-out 3.99s forwards; }
#鳥-bg11  { animation-delay: 4.23s; }
#鳥-s11   { stroke-dasharray: 12.3452; stroke-dashoffset: 12.3452; animation: drawStroke 0.22s ease-out 4.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #鳥-s[i]) -->
<path id="鳥-s1"  class="stroke" stroke="#bf0909" d="M49.72,10.68C49.75,10.95,49.79,11.379999999999999,49.66,11.76C48.9,14.04,44.51,19.06,38.51,22.13"/>
<path id="鳥-s2"  class="stroke" stroke="#bf6c09" d="M32.88,23.32C33.84,24.12,34.45,25.87,34.45,27.01C34.45,33.870000000000005,34.470000000000006,51.02,34.330000000000005,62.25C34.300000000000004,64.52,34.27,66.55,34.220000000000006,68.2"/>
<path id="鳥-s3"  class="stroke" stroke="#aebf09" d="M35.8,25.86C45,24.13,59.5,21.5,65.44,20.99C68.5,20.729999999999997,69.75999999999999,23.25,69.48,24.979999999999997C69.33,25.9,67.99000000000001,32.559999999999995,66.28,39.76C66.02,40.85,65.76,41.94,65.5,43"/>
<path id="鳥-s4"  class="stroke" stroke="#4bbf09" d="M35.86,35.44C39.5,34.75,62.129999999999995,31.249999999999996,66.73,31.06"/>
<path id="鳥-s5"  class="stroke" stroke="#09bf2a" d="M35.49,45.53C42.5,44.5,56.75,42,64.72,41.33"/>
<path id="鳥-s6"  class="stroke" stroke="#09bf8d" d="M35.78,56.05C47,54.75,72.93,51.209999999999994,77.75,50.5C79.43,50.25,82.28,50.22,83.13,50.4"/>
<path id="鳥-s7"  class="stroke" stroke="#098dbf" d="M34.75,68.27C50.5,65.63,76.75,62.629999999999995,84.5,62C89.01,61.64,91.31,64.33,90.5,67.75C88.25,77.25,84.68,86.71000000000001,81,92.75C77.5,98.5,74.75,96,71,93"/>
<path id="鳥-s8"  class="stroke" stroke="#092abf" d="M20.81,80.25C21.25,86.25,20.5,93.5,19.209999999999997,97.25"/>
<path id="鳥-s9"  class="stroke" stroke="#4b09bf" d="M34.38,78.38C37.35,80.33999999999999,40.17,85.75,40.92,88.81"/>
<path id="鳥-s10"  class="stroke" stroke="#ae09bf" d="M48.88,75.12C51.22,76.69,54.92,81.56,55.5,84"/>
<path id="鳥-s11"  class="stroke" stroke="#bf096c" d="M62.88,72C65.57000000000001,73.68,69.83,78.89,70.5,81.5"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="鳥-bg1"  class="badge-group"><circle cx="49.72" cy="10.68" r="3.5" fill="#bf0909"/><text class="num-single" x="49.72" y="10.68" dx="0" dy="-0.5">1</text></g>
<g id="鳥-bg2"  class="badge-group"><circle cx="32.88" cy="19.82" r="3.5" fill="#bf6c09"/><text class="num-single" x="32.88" y="19.82" dx="0" dy="-0.5">2</text></g>
<g id="鳥-bg3"  class="badge-group"><circle cx="35.8" cy="25.86" r="3.5" fill="#aebf09"/><text class="num-single" x="35.8" y="25.86" dx="0" dy="-0.5">3</text></g>
<g id="鳥-bg4"  class="badge-group"><circle cx="35.86" cy="35.44" r="3.5" fill="#4bbf09"/><text class="num-single" x="35.86" y="35.44" dx="0" dy="-0.5">4</text></g>
