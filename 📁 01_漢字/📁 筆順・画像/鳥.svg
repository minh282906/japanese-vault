<g id="鳥-bg7"  class="badge-group"><circle cx="34.75" cy="68.27" r="3.5" fill="#098dbf"/><text class="num-single" x="34.75" y="68.27" dx="0" dy="-0.5">7</text></g>
<g id="鳥-bg8"  class="badge-group"><circle cx="20.81" cy="80.25" r="3.5" fill="#092abf"/><text class="num-single" x="20.81" y="80.25" dx="0" dy="-0.5">8</text></g>
<g id="鳥-bg9"  class="badge-group"><circle cx="34.38" cy="78.38" r="3.5" fill="#4b09bf"/><text class="num-single" x="34.38" y="78.38" dx="0" dy="-0.5">9</text></g>
<g id="鳥-bg10" class="badge-group"><circle cx="48.88" cy="75.12" r="3.5" fill="#ae09bf"/><text class="num-double" x="48.88" y="75.12" dx="-0.4" dy="-0.475">10</text></g>
<g id="鳥-bg11" class="badge-group"><circle cx="62.88" cy="72" r="3.5" fill="#bf096c"/><text class="num-double" x="62.88" y="72" dx="-0.4" dy="-0.475">11</text></g>
</svg>