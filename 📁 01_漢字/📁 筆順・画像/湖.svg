<path id="湖-s4"  class="stroke" stroke="#64bf09" d="M32.25,41C33.5,41.62,35.37,41.67,37.75,41.5C44.87,41,56.870000000000005,39,61.75,38.5C62.74,38.4,64.37,38.25,65.5,38.5"/>
<path id="湖-s5"  class="stroke" stroke="#09bf09" d="M48.73,15.63C49.919999999999995,16.82,50.43,18.37,50.43,20.060000000000002C50.43,34.49,50.68,53.78,50.55,58.940000000000005"/>
<path id="湖-s6"  class="stroke" stroke="#09bf64" d="M36.65,60.04C37.49,60.88,37.92,62,38.03,63.1C38.42,66.97,39.52,73.21000000000001,40.19,78.74000000000001C40.32,79.85000000000001,40.449999999999996,80.92000000000002,40.559999999999995,81.95"/>
<path id="湖-s7"  class="stroke" stroke="#09bfbf" d="M38.7,61.05C43.870000000000005,60.43,53.86,58.739999999999995,58.75,58.32C61.68,58.06,63.12,59.04,62.68,62.01C62.11,65.92999999999999,60.95,70.92,60.17,75.61"/>
<path id="湖-s8"  class="stroke" stroke="#0964bf" d="M40.37,78.17C44.36,77.93,52.459999999999994,76.76,58.379999999999995,76.16C59.56999999999999,76.03999999999999,60.67999999999999,75.94,61.65,75.88"/>
<path id="湖-s9"  class="stroke" stroke="#0909bf" d="M71.74,20C72.36999999999999,20.63,72.92999999999999,21.63,72.96,22.58C74.5,67.38,71.25,80.13,60.74999999999999,89.5"/>
<path id="湖-s10"  class="stroke" stroke="#6409bf" d="M73.72,21.22C74.98,21.06,84.25999999999999,19.349999999999998,87.74,18.7C90.74,18.13,92.39,18.4,92.41999999999999,21.869999999999997C92.46999999999998,28.4,92.58999999999999,68.62,92.58999999999999,86.82999999999998C92.58999999999999,97.11999999999998,85.99999999999999,89.49999999999999,83.99999999999999,87.74999999999999"/>
<path id="湖-s11"  class="stroke" stroke="#bf09bf" d="M74.46,41.19C79.63,40.3,86.58,39.28,91.11999999999999,39.04"/>
<path id="湖-s12"  class="stroke" stroke="#bf0964" d="M73.64,59.31C77.67,59.02,86.38,58,91.16,57.81"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="湖-bg1"  class="badge-group"><circle cx="20.13" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="20.13" y="17" dx="0" dy="-0.5">1</text></g>
