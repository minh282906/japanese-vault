<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (湖)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #湖-bg[i]: Thời gian quả bóng số nảy lên
   - #湖-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#湖-bg1  { animation-delay: 0.05s; }
#湖-s1   { stroke-dasharray: 12.7258; stroke-dashoffset: 12.7258; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#湖-bg2  { animation-delay: 0.42s; }
#湖-s2   { stroke-dasharray: 13.2671; stroke-dashoffset: 13.2671; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#湖-bg3  { animation-delay: 0.79s; }
#湖-s3   { stroke-dasharray: 23.3881; stroke-dashoffset: 23.3881; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#湖-bg4  { animation-delay: 1.16s; }
#湖-s4   { stroke-dasharray: 33.5354; stroke-dashoffset: 33.5354; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#湖-bg5  { animation-delay: 1.53s; }
#湖-s5   { stroke-dasharray: 43.7551; stroke-dashoffset: 43.7551; animation: drawStroke 0.24s ease-out 1.66s forwards; }
#湖-bg6  { animation-delay: 1.92s; }
#湖-s6   { stroke-dasharray: 22.4440; stroke-dashoffset: 22.4440; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#湖-bg7  { animation-delay: 2.29s; }
#湖-s7   { stroke-dasharray: 40.7174; stroke-dashoffset: 40.7174; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#湖-bg8  { animation-delay: 2.66s; }
#湖-s8   { stroke-dasharray: 21.4055; stroke-dashoffset: 21.4055; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#湖-bg9  { animation-delay: 3.03s; }
#湖-s9   { stroke-dasharray: 73.0368; stroke-dashoffset: 73.0368; animation: drawStroke 0.40s ease-out 3.16s forwards; }
#湖-bg10  { animation-delay: 3.58s; }
#湖-s10   { stroke-dasharray: 100.3510; stroke-dashoffset: 100.3510; animation: drawStroke 0.55s ease-out 3.71s forwards; }
#湖-bg11  { animation-delay: 4.28s; }
#湖-s11   { stroke-dasharray: 16.8060; stroke-dashoffset: 16.8060; animation: drawStroke 0.22s ease-out 4.41s forwards; }
#湖-bg12  { animation-delay: 4.65s; }
#湖-s12   { stroke-dasharray: 17.5857; stroke-dashoffset: 17.5857; animation: drawStroke 0.22s ease-out 4.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #湖-s[i]) -->
<path id="湖-s1"  class="stroke" stroke="#bf0909" d="M20.13,17C23.439999999999998,18.47,28.669999999999998,23.05,29.5,25.34"/>
<path id="湖-s2"  class="stroke" stroke="#bf6409" d="M14.75,38C18.54,39.15,24.55,43.72,25.5,45.5"/>
