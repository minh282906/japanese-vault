<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (先)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #先-bg[i]: Thời gian quả bóng số nảy lên
   - #先-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#先-bg1  { animation-delay: 0.05s; }
#先-s1   { stroke-dasharray: 27.7817; stroke-dashoffset: 27.7817; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#先-bg2  { animation-delay: 0.42s; }
#先-s2   { stroke-dasharray: 37.8265; stroke-dashoffset: 37.8265; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#先-bg3  { animation-delay: 0.79s; }
#先-s3   { stroke-dasharray: 38.1546; stroke-dashoffset: 38.1546; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#先-bg4  { animation-delay: 1.16s; }
#先-s4   { stroke-dasharray: 78.6333; stroke-dashoffset: 78.6333; animation: drawStroke 0.43s ease-out 1.29s forwards; }
#先-bg5  { animation-delay: 1.74s; }
#先-s5   { stroke-dasharray: 49.3709; stroke-dashoffset: 49.3709; animation: drawStroke 0.27s ease-out 1.87s forwards; }
#先-bg6  { animation-delay: 2.16s; }
#先-s6   { stroke-dasharray: 78.8402; stroke-dashoffset: 78.8402; animation: drawStroke 0.43s ease-out 2.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #先-s[i]) -->
<path id="先-s1"  class="stroke" stroke="#bf0909" d="M37.51,21C37.58,21.62,37.66,22.61,37.37,23.490000000000002C35.25,29.88,31.62,37.38,24.5,45"/>
<path id="先-s2"  class="stroke" stroke="#bfbf09" d="M38.13,32.04C39.63,32.13,42.080000000000005,31.88,42.77,31.82C49.25,31.25,63.13,30,70.59,28.88C72.24000000000001,28.63,74.25,28.75,75.75,29.15"/>
<path id="先-s3"  class="stroke" stroke="#09bf09" d="M52.81,12.38C54.09,13.66,54.82,15.5,54.82,17.130000000000003C54.82,17.880000000000003,54.77,49.050000000000004,54.75,50"/>
<path id="先-s4"  class="stroke" stroke="#09bfbf" d="M15.88,53.26C19.3,54.239999999999995,23.03,53.76,26.5,53.48C42.49,52.18,65.49000000000001,49.93,85.5,49.08C88.44,48.949999999999996,91.34,49.05,94.25,49.55"/>
<path id="先-s5"  class="stroke" stroke="#0909bf" d="M45.18,55.68C45.5,57.13,45.33,58.16,45.03,59.53C43.24,67.65,35,86.62,20,96.38"/>
<path id="先-s6"  class="stroke" stroke="#bf09bf" d="M60.49,53.62C61.56,54.69,61.870000000000005,56.33,61.870000000000005,58.599999999999994C61.870000000000005,66.38,61.650000000000006,73.47999999999999,61.650000000000006,80.49C61.650000000000006,95.63,62.75000000000001,96.53,77.5,96.53C92.12,96.53,93.14,94.75,93.14,85.24000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="先-bg1"  class="badge-group"><circle cx="37.51" cy="21" r="3.5" fill="#bf0909"/><text class="num-single" x="37.51" y="21" dx="0" dy="-0.5">1</text></g>
<g id="先-bg2"  class="badge-group"><circle cx="38.13" cy="32.04" r="3.5" fill="#bfbf09"/><text class="num-single" x="38.13" y="32.04" dx="0" dy="-0.5">2</text></g>
<g id="先-bg3"  class="badge-group"><circle cx="52.81" cy="12.38" r="3.5" fill="#09bf09"/><text class="num-single" x="52.81" y="12.38" dx="0" dy="-0.5">3</text></g>
<g id="先-bg4"  class="badge-group"><circle cx="15.88" cy="53.26" r="3.5" fill="#09bfbf"/><text class="num-single" x="15.88" y="53.26" dx="0" dy="-0.5">4</text></g>
<g id="先-bg5"  class="badge-group"><circle cx="45.18" cy="55.68" r="3.5" fill="#0909bf"/><text class="num-single" x="45.18" y="55.68" dx="0" dy="-0.5">5</text></g>
<g id="先-bg6"  class="badge-group"><circle cx="60.49" cy="53.62" r="3.5" fill="#bf09bf"/><text class="num-single" x="60.49" y="53.62" dx="0" dy="-0.5">6</text></g>
</svg>