<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (最)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #最-bg[i]: Thời gian quả bóng số nảy lên
   - #最-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#最-bg1  { animation-delay: 0.05s; }
#最-s1   { stroke-dasharray: 28.0965; stroke-dashoffset: 28.0965; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#最-bg2  { animation-delay: 0.42s; }
#最-s2   { stroke-dasharray: 72.9881; stroke-dashoffset: 72.9881; animation: drawStroke 0.40s ease-out 0.55s forwards; }
#最-bg3  { animation-delay: 0.97s; }
#最-s3   { stroke-dasharray: 44.6274; stroke-dashoffset: 44.6274; animation: drawStroke 0.25s ease-out 1.10s forwards; }
#最-bg4  { animation-delay: 1.37s; }
#最-s4   { stroke-dasharray: 41.1322; stroke-dashoffset: 41.1322; animation: drawStroke 0.23s ease-out 1.50s forwards; }
#最-bg5  { animation-delay: 1.75s; }
#最-s5   { stroke-dasharray: 80.9650; stroke-dashoffset: 80.9650; animation: drawStroke 0.45s ease-out 1.88s forwards; }
#最-bg6  { animation-delay: 2.35s; }
#最-s6   { stroke-dasharray: 37.1327; stroke-dashoffset: 37.1327; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#最-bg7  { animation-delay: 2.72s; }
#最-s7   { stroke-dasharray: 16.2388; stroke-dashoffset: 16.2388; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#最-bg8  { animation-delay: 3.09s; }
#最-s8   { stroke-dasharray: 16.6122; stroke-dashoffset: 16.6122; animation: drawStroke 0.22s ease-out 3.22s forwards; }
#最-bg9  { animation-delay: 3.46s; }
#最-s9   { stroke-dasharray: 32.1746; stroke-dashoffset: 32.1746; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#最-bg10  { animation-delay: 3.83s; }
#最-s10   { stroke-dasharray: 49.4863; stroke-dashoffset: 49.4863; animation: drawStroke 0.27s ease-out 3.96s forwards; }
#最-bg11  { animation-delay: 4.25s; }
#最-s11   { stroke-dasharray: 69.4288; stroke-dashoffset: 69.4288; animation: drawStroke 0.38s ease-out 4.38s forwards; }
#最-bg12  { animation-delay: 4.78s; }
#最-s12   { stroke-dasharray: 49.2350; stroke-dashoffset: 49.2350; animation: drawStroke 0.27s ease-out 4.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

