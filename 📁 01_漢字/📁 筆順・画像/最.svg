<path id="最-s9"  class="stroke" stroke="#0909bf" d="M16.5,93.4C17.34,93.99000000000001,18.759999999999998,93.93,19.59,93.56C22.9,92.05,40.68,83.56,45.760000000000005,81.15"/>
<path id="最-s10"  class="stroke" stroke="#6409bf" d="M44.5,50.82C45.39,51.71,45.73,53.12,45.73,54.11C45.73,54.94,45.83,81.13,45.86,94.25C45.87,96.71,45.87,98.71,45.87,100"/>
<path id="最-s11"  class="stroke" stroke="#bf09bf" d="M57.91,60.75C58.97,61,60.099999999999994,61.14,62.209999999999994,60.75C64.32,60.37,75.88,58.06,77.33,57.66C79.75,56.989999999999995,81.26,58.75,80.31,60.97C74.12,75.5,64.88,87.25,53.4,94.71"/>
<path id="最-s12"  class="stroke" stroke="#bf0964" d="M54.25,68C60.92,68.37,75.01,86.64,88.18,94.95C90.09,96.16,91.48,96.88000000000001,93.25,97.26"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="最-bg1"  class="badge-group"><circle cx="28.53" cy="10.81" r="3.5" fill="#bf0909"/><text class="num-single" x="28.53" y="10.81" dx="0" dy="-0.5">1</text></g>
