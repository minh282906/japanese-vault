<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (終)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #終-bg[i]: Thời gian quả bóng số nảy lên
   - #終-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#終-bg1  { animation-delay: 0.05s; }
#終-s1   { stroke-dasharray: 39.2320; stroke-dashoffset: 39.2320; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#終-bg2  { animation-delay: 0.42s; }
#終-s2   { stroke-dasharray: 65.9539; stroke-dashoffset: 65.9539; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#終-bg3  { animation-delay: 0.93s; }
#終-s3   { stroke-dasharray: 13.4237; stroke-dashoffset: 13.4237; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#終-bg4  { animation-delay: 1.30s; }
#終-s4   { stroke-dasharray: 35.9965; stroke-dashoffset: 35.9965; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#終-bg5  { animation-delay: 1.67s; }
#終-s5   { stroke-dasharray: 20.9284; stroke-dashoffset: 20.9284; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#終-bg6  { animation-delay: 2.04s; }
#終-s6   { stroke-dasharray: 15.6341; stroke-dashoffset: 15.6341; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#終-bg7  { animation-delay: 2.41s; }
#終-s7   { stroke-dasharray: 32.3284; stroke-dashoffset: 32.3284; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#終-bg8  { animation-delay: 2.78s; }
#終-s8   { stroke-dasharray: 76.0037; stroke-dashoffset: 76.0037; animation: drawStroke 0.42s ease-out 2.91s forwards; }
#終-bg9  { animation-delay: 3.35s; }
#終-s9   { stroke-dasharray: 47.0878; stroke-dashoffset: 47.0878; animation: drawStroke 0.26s ease-out 3.48s forwards; }
#終-bg10  { animation-delay: 3.76s; }
#終-s10   { stroke-dasharray: 17.7977; stroke-dashoffset: 17.7977; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#終-bg11  { animation-delay: 4.13s; }
#終-s11   { stroke-dasharray: 26.0838; stroke-dashoffset: 26.0838; animation: drawStroke 0.22s ease-out 4.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #終-s[i]) -->
<path id="終-s1"  class="stroke" stroke="#bf0909" d="M28.15,14.5C28.459999999999997,15.75,28.56,16.96,27.99,18.28C25.38,24.380000000000003,19.799999999999997,33.33,16.919999999999998,36.47C15.749999999999998,37.75,15.619999999999997,39.129999999999995,16.919999999999998,39.58C20.22,40.739999999999995,22.759999999999998,42.65,25.56,44.93"/>
