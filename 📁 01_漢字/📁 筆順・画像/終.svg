<path id="終-s3"  class="stroke" stroke="#aebf09" d="M34.25,45.88C37.2,48.43,40.01,53.42,40.75,57.39"/>
<path id="終-s4"  class="stroke" stroke="#4bbf09" d="M28.33,59.32C29.13,60.12,29.61,61.33,29.61,63.18C29.61,70.94,29.509999999999998,83.27,29.47,90.5C29.459999999999997,92.42,29.45,93.98,29.45,95"/>
<path id="終-s5"  class="stroke" stroke="#09bf2a" d="M19.5,68.36C19.87,69.37,19.85,70.56,19.63,71.21C18.23,75.44999999999999,14.479999999999999,84.11999999999999,12.489999999999998,87.75"/>
<path id="終-s6"  class="stroke" stroke="#09bf8d" d="M36,66C39.14,69.4,41.019999999999996,77.31,41.75,80.39"/>
<path id="終-s7"  class="stroke" stroke="#098dbf" d="M61.55,15.92C61.61,16.54,61.76,17.56,61.44,18.43C59.25,24.38,53.12,33.129999999999995,43.23,41.67"/>
<path id="終-s8"  class="stroke" stroke="#092abf" d="M64.06,20.23C65,20.63,65.99000000000001,20.580000000000002,66.88,20.490000000000002C70.63,20.12,74.25,19.000000000000004,77.41,17.8C80.47,16.64,82,18.5,80.69,21.35C73.16,37.75,62.87,51.5,43.98,61.160000000000004"/>
<path id="終-s9"  class="stroke" stroke="#4b09bf" d="M54.08,32.9C60.5,33.5,75.63,47.62,84.50999999999999,53.67C87.55,55.74,90.38,57.370000000000005,93.38,58.25"/>
<path id="終-s10"  class="stroke" stroke="#ae09bf" d="M60.25,60.25C66,62.13,73.37,65.37,76,68.25"/>
<path id="終-s11"  class="stroke" stroke="#bf096c" d="M57.12,78.75C65.88,82.38,74.88,88.5,78.75,93"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="終-bg1"  class="badge-group"><circle cx="28.15" cy="14.5" r="3.5" fill="#bf0909"/><text class="num-single" x="28.15" y="14.5" dx="0" dy="-0.5">1</text></g>
<g id="終-bg2"  class="badge-group"><circle cx="39.03" cy="24.27" r="3.5" fill="#bf6c09"/><text class="num-single" x="39.03" y="24.27" dx="0" dy="-0.5">2</text></g>
