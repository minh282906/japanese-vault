<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (干)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #干-bg[i]: Thời gian quả bóng số nảy lên
   - #干-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#干-bg1  { animation-delay: 0.05s; }
#干-s1   { stroke-dasharray: 52.7883; stroke-dashoffset: 52.7883; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#干-bg2  { animation-delay: 0.49s; }
#干-s2   { stroke-dasharray: 76.3938; stroke-dashoffset: 76.3938; animation: drawStroke 0.42s ease-out 0.62s forwards; }
#干-bg3  { animation-delay: 1.06s; }
#干-s3   { stroke-dasharray: 74.2055; stroke-dashoffset: 74.2055; animation: drawStroke 0.41s ease-out 1.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #干-s[i]) -->
<path id="干-s1"  class="stroke" stroke="#bf0909" d="M28.63,21.62C31.25,22.25,34.1,21.98,36.379999999999995,21.77C45.74999999999999,20.88,62.519999999999996,18.87,73.00999999999999,17.96C75.71,17.73,78.47999999999999,17.62,81.13,18.34"/>
<path id="干-s2"  class="stroke" stroke="#09bf09" d="M16.88,49.03C20.25,49.75,24.009999999999998,49.56,27.5,49.14C42.67,47.28,67.24000000000001,44.370000000000005,83.63,43.230000000000004C86.72999999999999,43.010000000000005,89.81,42.970000000000006,92.88,43.53"/>
<path id="干-s3"  class="stroke" stroke="#0909bf" d="M52.81,21.63C54.03,22.849999999999998,54.6,24.619999999999997,54.6,26.46C54.6,27.310000000000002,54.58,70.16,54.480000000000004,88C54.46,91.65,54.440000000000005,94.3,54.42,95.38"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="干-bg1"  class="badge-group"><circle cx="28.63" cy="21.62" r="3.5" fill="#bf0909"/><text class="num-single" x="28.63" y="21.62" dx="0" dy="-0.5">1</text></g>
<g id="干-bg2"  class="badge-group"><circle cx="16.88" cy="49.03" r="3.5" fill="#09bf09"/><text class="num-single" x="16.88" y="49.03" dx="0" dy="-0.5">2</text></g>
<g id="干-bg3"  class="badge-group"><circle cx="52.81" cy="21.63" r="3.5" fill="#0909bf"/><text class="num-single" x="52.81" y="21.63" dx="0" dy="-0.5">3</text></g>
</svg>