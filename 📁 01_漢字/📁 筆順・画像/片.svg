<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (片)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #片-bg[i]: Thời gian quả bóng số nảy lên
   - #片-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#片-bg1  { animation-delay: 0.05s; }
#片-s1   { stroke-dasharray: 81.4538; stroke-dashoffset: 81.4538; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#片-bg2  { animation-delay: 0.65s; }
#片-s2   { stroke-dasharray: 24.0988; stroke-dashoffset: 24.0988; animation: drawStroke 0.22s ease-out 0.78s forwards; }
#片-bg3  { animation-delay: 1.02s; }
#片-s3   { stroke-dasharray: 51.0414; stroke-dashoffset: 51.0414; animation: drawStroke 0.28s ease-out 1.15s forwards; }
#片-bg4  { animation-delay: 1.45s; }
#片-s4   { stroke-dasharray: 77.6424; stroke-dashoffset: 77.6424; animation: drawStroke 0.43s ease-out 1.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #片-s[i]) -->
<path id="片-s1"  class="stroke" stroke="#bf0909" d="M32.9,17.47C33.97,18.54,34.4,20.22,34.4,21.81C34.4,72.26,26.25,82.51,14.5,93.26"/>
<path id="片-s2"  class="stroke" stroke="#64bf09" d="M62.54,12.75C63.46,13.67,63.91,14.870000000000001,63.91,16.77C63.91,20.669999999999998,63.87,32.95,63.87,36.5"/>
<path id="片-s3"  class="stroke" stroke="#09bfbf" d="M35.35,41.27C46.120000000000005,40.25,65.51,37.720000000000006,77.87,35.84C80.56,35.43000000000001,83.62,35,86,35.25"/>
<path id="片-s4"  class="stroke" stroke="#6409bf" d="M34.94,62.07C37.62,62.25,39.79,62.26,42.349999999999994,61.87C52.349999999999994,60.33,64.88,58.059999999999995,68.85,57.239999999999995C71.24,56.74999999999999,73.46,57.99999999999999,73.46,60.459999999999994C73.46,66,73.30999999999999,84,73.30999999999999,88.75C73.30999999999999,93.23,73.24,94.4,73.24,97.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="片-bg1"  class="badge-group"><circle cx="32.9" cy="17.47" r="3.5" fill="#bf0909"/><text class="num-single" x="32.9" y="17.47" dx="0" dy="-0.5">1</text></g>
<g id="片-bg2"  class="badge-group"><circle cx="62.54" cy="12.75" r="3.5" fill="#64bf09"/><text class="num-single" x="62.54" y="12.75" dx="0" dy="-0.5">2</text></g>
<g id="片-bg3"  class="badge-group"><circle cx="35.35" cy="41.27" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.35" y="41.27" dx="0" dy="-0.5">3</text></g>
<g id="片-bg4"  class="badge-group"><circle cx="34.94" cy="62.07" r="3.5" fill="#6409bf"/><text class="num-single" x="34.94" y="62.07" dx="0" dy="-0.5">4</text></g>
</svg>