<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (缶)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #缶-bg[i]: Thời gian quả bóng số nảy lên
   - #缶-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#缶-bg1  { animation-delay: 0.05s; }
#缶-s1   { stroke-dasharray: 40.2753; stroke-dashoffset: 40.2753; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#缶-bg2  { animation-delay: 0.42s; }
#缶-s2   { stroke-dasharray: 45.8532; stroke-dashoffset: 45.8532; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#缶-bg3  { animation-delay: 0.82s; }
#缶-s3   { stroke-dasharray: 79.6704; stroke-dashoffset: 79.6704; animation: drawStroke 0.44s ease-out 0.95s forwards; }
#缶-bg4  { animation-delay: 1.41s; }
#缶-s4   { stroke-dasharray: 56.5538; stroke-dashoffset: 56.5538; animation: drawStroke 0.31s ease-out 1.54s forwards; }
#缶-bg5  { animation-delay: 1.87s; }
#缶-s5   { stroke-dasharray: 77.0339; stroke-dashoffset: 77.0339; animation: drawStroke 0.42s ease-out 2.00s forwards; }
#缶-bg6  { animation-delay: 2.44s; }
#缶-s6   { stroke-dasharray: 33.2796; stroke-dashoffset: 33.2796; animation: drawStroke 0.22s ease-out 2.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #缶-s[i]) -->
<path id="缶-s1"  class="stroke" stroke="#bf0909" d="M40.99,14.64C41.050000000000004,15.41,40.830000000000005,16.71,40.370000000000005,17.75C37.50000000000001,24.25,29.270000000000003,37.69,17.500000000000004,46.5"/>
<path id="缶-s2"  class="stroke" stroke="#bfbf09" d="M36.63,30.42C38.75,30.880000000000003,40.84,30.73,42.64,30.57C51.63,29.76,65.64,27.740000000000002,75.14,26.42C77.59,26.080000000000002,79.72,25.700000000000003,82.14,26.290000000000003"/>
<path id="缶-s3"  class="stroke" stroke="#09bf09" d="M15.38,54.98C18.580000000000002,56.12,23.060000000000002,55.79,26.37,55.4C47.25,52.879999999999995,66.75,50.51,85.12,49.629999999999995C88.31,49.48,91.48,49.4,94.62,50.06999999999999"/>
<path id="缶-s4"  class="stroke" stroke="#09bfbf" d="M53.06,31.63C54.150000000000006,32.72,54.32,34.25,54.32,36.129999999999995C54.32,42.74999999999999,54.32,81.5,54.32,87.88"/>
<path id="缶-s5"  class="stroke" stroke="#0909bf" d="M27.06,66.38C27.9,67.22,28.07,68.61999999999999,28.07,70.13C28.07,75.75,28,77.5,28.07,88.13C28.09,91.28,28.18,92.03999999999999,31.37,91.61999999999999C46.49,89.61999999999999,60.870000000000005,88.24,80.07000000000001,87.38"/>
<path id="缶-s6"  class="stroke" stroke="#bf09bf" d="M82.56,60.88C83.25,62,83.5,63.370000000000005,83.32000000000001,65.38C82.96000000000001,69.44,82.22000000000001,77.13,81.47000000000001,85.27C81.20000000000002,88.22,80.90000000000002,91.14999999999999,80.57000000000001,93.88"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="缶-bg1"  class="badge-group"><circle cx="40.99" cy="14.64" r="3.5" fill="#bf0909"/><text class="num-single" x="40.99" y="14.64" dx="0" dy="-0.5">1</text></g>
<g id="缶-bg2"  class="badge-group"><circle cx="36.63" cy="30.42" r="3.5" fill="#bfbf09"/><text class="num-single" x="36.63" y="30.42" dx="0" dy="-0.5">2</text></g>
<g id="缶-bg3"  class="badge-group"><circle cx="15.38" cy="54.98" r="3.5" fill="#09bf09"/><text class="num-single" x="15.38" y="54.98" dx="0" dy="-0.5">3</text></g>
<g id="缶-bg4"  class="badge-group"><circle cx="53.06" cy="31.63" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.06" y="31.63" dx="0" dy="-0.5">4</text></g>
<g id="缶-bg5"  class="badge-group"><circle cx="27.06" cy="66.38" r="3.5" fill="#0909bf"/><text class="num-single" x="27.06" y="66.38" dx="0" dy="-0.5">5</text></g>
<g id="缶-bg6"  class="badge-group"><circle cx="82.56" cy="60.88" r="3.5" fill="#bf09bf"/><text class="num-single" x="82.56" y="60.88" dx="0" dy="-0.5">6</text></g>
</svg>