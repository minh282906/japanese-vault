<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (民)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #民-bg[i]: Thời gian quả bóng số nảy lên
   - #民-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#民-bg1  { animation-delay: 0.05s; }
#民-s1   { stroke-dasharray: 70.4681; stroke-dashoffset: 70.4681; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#民-bg2  { animation-delay: 0.59s; }
#民-s2   { stroke-dasharray: 51.6924; stroke-dashoffset: 51.6924; animation: drawStroke 0.28s ease-out 0.72s forwards; }
#民-bg3  { animation-delay: 1.02s; }
#民-s3   { stroke-dasharray: 94.2741; stroke-dashoffset: 94.2741; animation: drawStroke 0.52s ease-out 1.15s forwards; }
#民-bg4  { animation-delay: 1.69s; }
#民-s4   { stroke-dasharray: 58.5672; stroke-dashoffset: 58.5672; animation: drawStroke 0.32s ease-out 1.82s forwards; }
#民-bg5  { animation-delay: 2.16s; }
#民-s5   { stroke-dasharray: 83.2566; stroke-dashoffset: 83.2566; animation: drawStroke 0.46s ease-out 2.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #民-s[i]) -->
<path id="民-s1"  class="stroke" stroke="#bf0909" d="M21.89,17.96C23.87,18.880000000000003,26.5,19.25,29.380000000000003,18.92C42.160000000000004,17.44,62.660000000000004,14.990000000000002,70.89,14.260000000000002C75.25,13.870000000000001,77.12,15.870000000000001,76.26,18.910000000000004C74.94000000000001,23.580000000000005,73.64,27.240000000000002,72.25,30.500000000000004"/>
<path id="民-s2"  class="stroke" stroke="#9abf09" d="M25.35,36.27C34.79,35.32,59.2,32.480000000000004,70.62,31.35C72.60000000000001,31.150000000000002,75.12,30.740000000000002,76.75,31"/>
<path id="民-s3"  class="stroke" stroke="#09bf52" d="M23,18.75C23.69,19.44,24.25,20.87,24.25,22C24.25,24.25,24,84.75,24,88.25S24.25,92.75,27.5,90.25S38.75,80,40.75,78.5"/>
<path id="民-s4"  class="stroke" stroke="#0952bf" d="M27.73,55.8C29.38,55.589999999999996,31.37,55.339999999999996,33.61,55.05C47.05,53.349999999999994,67.02,50.809999999999995,80.02,48.769999999999996C81.86999999999999,48.48,84.00999999999999,48.239999999999995,85.78999999999999,48.65"/>
<path id="民-s5"  class="stroke" stroke="#9a09bf" d="M52.75,36.25C53.87,37.37,54.88,39.64,55.14,41.4C58.62,64.88,69.25,83.38,88.08,93.42C96.17,97.74000000000001,94.25,91.5,94.03,87.06"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="民-bg1"  class="badge-group"><circle cx="21.89" cy="14.46" r="3.5" fill="#bf0909"/><text class="num-single" x="21.89" y="14.46" dx="0" dy="-0.5">1</text></g>
<g id="民-bg2"  class="badge-group"><circle cx="25.35" cy="36.27" r="3.5" fill="#9abf09"/><text class="num-single" x="25.35" y="36.27" dx="0" dy="-0.5">2</text></g>
<g id="民-bg3"  class="badge-group"><circle cx="23" cy="22.25" r="3.5" fill="#09bf52"/><text class="num-single" x="23" y="22.25" dx="0" dy="-0.5">3</text></g>
<g id="民-bg4"  class="badge-group"><circle cx="27.73" cy="55.8" r="3.5" fill="#0952bf"/><text class="num-single" x="27.73" y="55.8" dx="0" dy="-0.5">4</text></g>
<g id="民-bg5"  class="badge-group"><circle cx="52.75" cy="36.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="52.75" y="36.25" dx="0" dy="-0.5">5</text></g>
</svg>