<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (顔)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #顔-bg[i]: Thời gian quả bóng số nảy lên
   - #顔-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#顔-bg1  { animation-delay: 0.05s; }
#顔-s1   { stroke-dasharray: 10.6769; stroke-dashoffset: 10.6769; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#顔-bg2  { animation-delay: 0.42s; }
#顔-s2   { stroke-dasharray: 31.7143; stroke-dashoffset: 31.7143; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#顔-bg3  { animation-delay: 0.79s; }
#顔-s3   { stroke-dasharray: 13.8977; stroke-dashoffset: 13.8977; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#顔-bg4  { animation-delay: 1.16s; }
#顔-s4   { stroke-dasharray: 16.0547; stroke-dashoffset: 16.0547; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#顔-bg5  { animation-delay: 1.53s; }
#顔-s5   { stroke-dasharray: 35.4350; stroke-dashoffset: 35.4350; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#顔-bg6  { animation-delay: 1.90s; }
#顔-s6   { stroke-dasharray: 47.6062; stroke-dashoffset: 47.6062; animation: drawStroke 0.26s ease-out 2.03s forwards; }
#顔-bg7  { animation-delay: 2.31s; }
#顔-s7   { stroke-dasharray: 21.0753; stroke-dashoffset: 21.0753; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#顔-bg8  { animation-delay: 2.68s; }
#顔-s8   { stroke-dasharray: 23.6402; stroke-dashoffset: 23.6402; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#顔-bg9  { animation-delay: 3.05s; }
#顔-s9   { stroke-dasharray: 29.4835; stroke-dashoffset: 29.4835; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#顔-bg10  { animation-delay: 3.42s; }
#顔-s10   { stroke-dasharray: 35.7120; stroke-dashoffset: 35.7120; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#顔-bg11  { animation-delay: 3.79s; }
#顔-s11   { stroke-dasharray: 12.0402; stroke-dashoffset: 12.0402; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#顔-bg12  { animation-delay: 4.16s; }
#顔-s12   { stroke-dasharray: 41.5408; stroke-dashoffset: 41.5408; animation: drawStroke 0.23s ease-out 4.29s forwards; }
#顔-bg13  { animation-delay: 4.54s; }
#顔-s13   { stroke-dasharray: 65.2502; stroke-dashoffset: 65.2502; animation: drawStroke 0.36s ease-out 4.67s forwards; }
#顔-bg14  { animation-delay: 5.05s; }
#顔-s14   { stroke-dasharray: 24.2398; stroke-dashoffset: 24.2398; animation: drawStroke 0.22s ease-out 5.18s forwards; }
#顔-bg15  { animation-delay: 5.42s; }
#顔-s15   { stroke-dasharray: 23.8715; stroke-dashoffset: 23.8715; animation: drawStroke 0.22s ease-out 5.55s forwards; }
#顔-bg16  { animation-delay: 5.79s; }
#顔-s16   { stroke-dasharray: 23.6320; stroke-dashoffset: 23.6320; animation: drawStroke 0.22s ease-out 5.92s forwards; }
#顔-bg17  { animation-delay: 6.16s; }
#顔-s17   { stroke-dasharray: 21.8391; stroke-dashoffset: 21.8391; animation: drawStroke 0.22s ease-out 6.29s forwards; }
#顔-bg18  { animation-delay: 6.53s; }
#顔-s18   { stroke-dasharray: 18.3000; stroke-dashoffset: 18.3000; animation: drawStroke 0.22s ease-out 6.66s forwards; }
]]>
</style>

