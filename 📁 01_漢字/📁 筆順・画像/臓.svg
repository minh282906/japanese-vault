<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (臓)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #臓-bg[i]: Thời gian quả bóng số nảy lên
   - #臓-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#臓-bg1  { animation-delay: 0.05s; }
#臓-s1   { stroke-dasharray: 71.6076; stroke-dashoffset: 71.6076; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#臓-bg2  { animation-delay: 0.59s; }
#臓-s2   { stroke-dasharray: 96.2135; stroke-dashoffset: 96.2135; animation: drawStroke 0.53s ease-out 0.72s forwards; }
#臓-bg3  { animation-delay: 1.27s; }
#臓-s3   { stroke-dasharray: 14.3263; stroke-dashoffset: 14.3263; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#臓-bg4  { animation-delay: 1.64s; }
#臓-s4   { stroke-dasharray: 15.0449; stroke-dashoffset: 15.0449; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#臓-bg5  { animation-delay: 2.01s; }
#臓-s5   { stroke-dasharray: 50.7917; stroke-dashoffset: 50.7917; animation: drawStroke 0.28s ease-out 2.14s forwards; }
#臓-bg6  { animation-delay: 2.44s; }
#臓-s6   { stroke-dasharray: 16.9023; stroke-dashoffset: 16.9023; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#臓-bg7  { animation-delay: 2.81s; }
#臓-s7   { stroke-dasharray: 14.4922; stroke-dashoffset: 14.4922; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#臓-bg8  { animation-delay: 3.18s; }
#臓-s8   { stroke-dasharray: 54.5124; stroke-dashoffset: 54.5124; animation: drawStroke 0.30s ease-out 3.31s forwards; }
#臓-bg9  { animation-delay: 3.63s; }
#臓-s9   { stroke-dasharray: 43.9618; stroke-dashoffset: 43.9618; animation: drawStroke 0.24s ease-out 3.76s forwards; }
#臓-bg10  { animation-delay: 4.02s; }
#臓-s10   { stroke-dasharray: 40.7853; stroke-dashoffset: 40.7853; animation: drawStroke 0.22s ease-out 4.15s forwards; }
#臓-bg11  { animation-delay: 4.39s; }
#臓-s11   { stroke-dasharray: 17.2803; stroke-dashoffset: 17.2803; animation: drawStroke 0.22s ease-out 4.52s forwards; }
#臓-bg12  { animation-delay: 4.76s; }
#臓-s12   { stroke-dasharray: 10.1293; stroke-dashoffset: 10.1293; animation: drawStroke 0.22s ease-out 4.89s forwards; }
#臓-bg13  { animation-delay: 5.13s; }
#臓-s13   { stroke-dasharray: 28.2109; stroke-dashoffset: 28.2109; animation: drawStroke 0.22s ease-out 5.26s forwards; }
#臓-bg14  { animation-delay: 5.50s; }
#臓-s14   { stroke-dasharray: 18.3697; stroke-dashoffset: 18.3697; animation: drawStroke 0.22s ease-out 5.63s forwards; }
#臓-bg15  { animation-delay: 5.87s; }
#臓-s15   { stroke-dasharray: 11.6068; stroke-dashoffset: 11.6068; animation: drawStroke 0.22s ease-out 6.00s forwards; }
#臓-bg16  { animation-delay: 6.24s; }
#臓-s16   { stroke-dasharray: 19.4968; stroke-dashoffset: 19.4968; animation: drawStroke 0.22s ease-out 6.37s forwards; }
#臓-bg17  { animation-delay: 6.61s; }
#臓-s17   { stroke-dasharray: 76.0851; stroke-dashoffset: 76.0851; animation: drawStroke 0.42s ease-out 6.74s forwards; }
#臓-bg18  { animation-delay: 7.18s; }
#臓-s18   { stroke-dasharray: 46.4351; stroke-dashoffset: 46.4351; animation: drawStroke 0.26s ease-out 7.31s forwards; }
#臓-bg19  { animation-delay: 7.59s; }
#臓-s19   { stroke-dasharray: 9.8045; stroke-dashoffset: 9.8045; animation: drawStroke 0.22s ease-out 7.72s forwards; }
]]>
</style>

