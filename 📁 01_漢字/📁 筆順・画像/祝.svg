<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (祝)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #祝-bg[i]: Thời gian quả bóng số nảy lên
   - #祝-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#祝-bg1  { animation-delay: 0.05s; }
#祝-s1   { stroke-dasharray: 14.2402; stroke-dashoffset: 14.2402; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#祝-bg2  { animation-delay: 0.42s; }
#祝-s2   { stroke-dasharray: 72.7499; stroke-dashoffset: 72.7499; animation: drawStroke 0.40s ease-out 0.55s forwards; }
#祝-bg3  { animation-delay: 0.97s; }
#祝-s3   { stroke-dasharray: 37.7103; stroke-dashoffset: 37.7103; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#祝-bg4  { animation-delay: 1.34s; }
#祝-s4   { stroke-dasharray: 15.9727; stroke-dashoffset: 15.9727; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#祝-bg5  { animation-delay: 1.71s; }
#祝-s5   { stroke-dasharray: 26.6385; stroke-dashoffset: 26.6385; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#祝-bg6  { animation-delay: 2.08s; }
#祝-s6   { stroke-dasharray: 56.0650; stroke-dashoffset: 56.0650; animation: drawStroke 0.31s ease-out 2.21s forwards; }
#祝-bg7  { animation-delay: 2.54s; }
#祝-s7   { stroke-dasharray: 27.1635; stroke-dashoffset: 27.1635; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#祝-bg8  { animation-delay: 2.91s; }
#祝-s8   { stroke-dasharray: 47.4117; stroke-dashoffset: 47.4117; animation: drawStroke 0.26s ease-out 3.04s forwards; }
#祝-bg9  { animation-delay: 3.32s; }
#祝-s9   { stroke-dasharray: 72.2481; stroke-dashoffset: 72.2481; animation: drawStroke 0.40s ease-out 3.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #祝-s[i]) -->
<path id="祝-s1"  class="stroke" stroke="#bf0909" d="M23.62,16C27.36,18.12,31.37,21.29,34.57,25"/>
<path id="祝-s2"  class="stroke" stroke="#bf8209" d="M12.08,40.5C13.88,41.13,15.870000000000001,41.22,17.59,40.95C21.12,40.38,31,37.88,35.33,37C37.89,36.48,39.629999999999995,38.38,38.33,40.75C33.25,50,21.38,64.75,11.83,74"/>
<path id="祝-s3"  class="stroke" stroke="#82bf09" d="M28.75,57.36C29.51,58.12,30.02,59.37,30.02,60.75C30.02,67.38,30.05,81.18,30.07,89.13C30.080000000000002,91.89999999999999,30.080000000000002,93.96,30.080000000000002,94.75"/>
<path id="祝-s4"  class="stroke" stroke="#09bf09" d="M32.25,54.88C36.29,57.38,40.61,61.13,44.08,65.5"/>
<path id="祝-s5"  class="stroke" stroke="#09bf82" d="M49.61,22.6C50.44,23.43,51.1,24.37,51.269999999999996,25.450000000000003C51.81999999999999,29.050000000000004,53.22,35.63,54.779999999999994,43.74C55.059999999999995,45.22,55.349999999999994,46.75,55.63999999999999,48.32"/>
<path id="祝-s6"  class="stroke" stroke="#0982bf" d="M52.18,24.24C58.91,22.88,73,20.75,81.9,19.689999999999998C84.88000000000001,19.339999999999996,87.52000000000001,20.569999999999997,86.42,24.049999999999997C84.7,29.54,83.38,34.739999999999995,81.41,41.42999999999999"/>
<path id="祝-s7"  class="stroke" stroke="#0909bf" d="M56.27,44.59C64.51,43.63,74.04,42.93000000000001,80.76,42.260000000000005C81.67,42.17,82.52000000000001,42.080000000000005,83.31,42.010000000000005"/>
<path id="祝-s8"  class="stroke" stroke="#8209bf" d="M62.48,48.01C63,49,63.059999999999995,50.53,62.87,51.93C61.489999999999995,61.87,54.75,79.49,43.11,89.74000000000001"/>
<path id="祝-s9"  class="stroke" stroke="#bf0982" d="M72.99,46.25C73.86999999999999,47.13,74.08999999999999,48.62,74.08999999999999,50.1C74.08999999999999,56.42,73.94999999999999,72.37,73.94999999999999,81.37C73.94999999999999,90.12,76.11999999999999,91.45,85.86999999999999,91.45C94.99999999999999,91.45,96.27,89.12,96.27,80.74000000000001"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="祝-bg1"  class="badge-group"><circle cx="23.62" cy="16" r="3.5" fill="#bf0909"/><text class="num-single" x="23.62" y="16" dx="0" dy="-0.5">1</text></g>
<g id="祝-bg2"  class="badge-group"><circle cx="12.08" cy="40.5" r="3.5" fill="#bf8209"/><text class="num-single" x="12.08" y="40.5" dx="0" dy="-0.5">2</text></g>
<g id="祝-bg3"  class="badge-group"><circle cx="28.75" cy="53.86" r="3.5" fill="#82bf09"/><text class="num-single" x="28.75" y="53.86" dx="0" dy="-0.5">3</text></g>
<g id="祝-bg4"  class="badge-group"><circle cx="32.25" cy="58.38" r="3.5" fill="#09bf09"/><text class="num-single" x="32.25" y="58.38" dx="0" dy="-0.5">4</text></g>
<g id="祝-bg5"  class="badge-group"><circle cx="49.61" cy="19.1" r="3.5" fill="#09bf82"/><text class="num-single" x="49.61" y="19.1" dx="0" dy="-0.5">5</text></g>
<g id="祝-bg6"  class="badge-group"><circle cx="52.18" cy="27.74" r="3.5" fill="#0982bf"/><text class="num-single" x="52.18" y="27.74" dx="0" dy="-0.5">6</text></g>
<g id="祝-bg7"  class="badge-group"><circle cx="56.27" cy="44.59" r="3.5" fill="#0909bf"/><text class="num-single" x="56.27" y="44.59" dx="0" dy="-0.5">7</text></g>
<g id="祝-bg8"  class="badge-group"><circle cx="62.48" cy="48.01" r="3.5" fill="#8209bf"/><text class="num-single" x="62.48" y="48.01" dx="0" dy="-0.5">8</text></g>
<g id="祝-bg9"  class="badge-group"><circle cx="72.99" cy="46.25" r="3.5" fill="#bf0982"/><text class="num-single" x="72.99" y="46.25" dx="0" dy="-0.5">9</text></g>
</svg>