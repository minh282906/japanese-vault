<path id="裏-s9"  class="stroke" stroke="#0941bf" d="M19.57,69.35C22.75,70,25.71,69.89999999999999,28.52,69.58999999999999C42.87,67.99999999999999,63.67,65.21,79.25,64.57C82.48,64.44,85.63,64.11999999999999,88.94,64.74"/>
<path id="裏-s10"  class="stroke" stroke="#2509bf" d="M47.73,68.14C47.5,69.37,46.58,70.83,45.809999999999995,71.68C41.92999999999999,75.95,32.709999999999994,83.02000000000001,17.309999999999995,88.22"/>
<path id="裏-s11"  class="stroke" stroke="#7909bf" d="M40.25,80.5C40.94,81.19,41.25,82.25,41.25,83.5C41.25,88.76,41.18,91.12,41.18,94.93C41.18,97.35000000000001,41.88,97.80000000000001,43.61,96.57000000000001C46.63,94.42,54.85,88.71000000000001,58.71,86.73"/>
<path id="裏-s12"  class="stroke" stroke="#bf09b1" d="M73.94,67.89C74.02,68.68,73.61,69.4,73.14,69.98C71.57000000000001,71.95,69.75,73.88000000000001,65.31,77.72"/>
