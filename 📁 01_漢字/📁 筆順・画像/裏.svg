<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (裏)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #裏-bg[i]: Thời gian quả bóng số nảy lên
   - #裏-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#裏-bg1  { animation-delay: 0.05s; }
#裏-s1   { stroke-dasharray: 9.1433; stroke-dashoffset: 9.1433; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#裏-bg2  { animation-delay: 0.42s; }
#裏-s2   { stroke-dasharray: 76.2514; stroke-dashoffset: 76.2514; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#裏-bg3  { animation-delay: 0.99s; }
#裏-s3   { stroke-dasharray: 23.7110; stroke-dashoffset: 23.7110; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#裏-bg4  { animation-delay: 1.36s; }
#裏-s4   { stroke-dasharray: 70.6886; stroke-dashoffset: 70.6886; animation: drawStroke 0.39s ease-out 1.49s forwards; }
#裏-bg5  { animation-delay: 1.90s; }
#裏-s5   { stroke-dasharray: 44.1423; stroke-dashoffset: 44.1423; animation: drawStroke 0.24s ease-out 2.03s forwards; }
#裏-bg6  { animation-delay: 2.29s; }
#裏-s6   { stroke-dasharray: 39.6844; stroke-dashoffset: 39.6844; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#裏-bg7  { animation-delay: 2.66s; }
#裏-s7   { stroke-dasharray: 35.6961; stroke-dashoffset: 35.6961; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#裏-bg8  { animation-delay: 3.03s; }
#裏-s8   { stroke-dasharray: 40.1897; stroke-dashoffset: 40.1897; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#裏-bg9  { animation-delay: 3.40s; }
#裏-s9   { stroke-dasharray: 69.6962; stroke-dashoffset: 69.6962; animation: drawStroke 0.38s ease-out 3.53s forwards; }
#裏-bg10  { animation-delay: 3.93s; }
#裏-s10   { stroke-dasharray: 37.3274; stroke-dashoffset: 37.3274; animation: drawStroke 0.22s ease-out 4.06s forwards; }
#裏-bg11  { animation-delay: 4.30s; }
#裏-s11   { stroke-dasharray: 37.0919; stroke-dashoffset: 37.0919; animation: drawStroke 0.22s ease-out 4.43s forwards; }
#裏-bg12  { animation-delay: 4.67s; }
#裏-s12   { stroke-dasharray: 13.3236; stroke-dashoffset: 13.3236; animation: drawStroke 0.22s ease-out 4.80s forwards; }
#裏-bg13  { animation-delay: 5.04s; }
#裏-s13   { stroke-dasharray: 49.3163; stroke-dashoffset: 49.3163; animation: drawStroke 0.27s ease-out 5.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

