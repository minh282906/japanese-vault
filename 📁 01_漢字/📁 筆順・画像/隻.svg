<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (隻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #隻-bg[i]: Thời gian quả bóng số nảy lên
   - #隻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#隻-bg1  { animation-delay: 0.05s; }
#隻-s1   { stroke-dasharray: 29.2827; stroke-dashoffset: 29.2827; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#隻-bg2  { animation-delay: 0.42s; }
#隻-s2   { stroke-dasharray: 33.1031; stroke-dashoffset: 33.1031; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#隻-bg3  { animation-delay: 0.79s; }
#隻-s3   { stroke-dasharray: 13.8253; stroke-dashoffset: 13.8253; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#隻-bg4  { animation-delay: 1.16s; }
#隻-s4   { stroke-dasharray: 48.7583; stroke-dashoffset: 48.7583; animation: drawStroke 0.27s ease-out 1.29s forwards; }
#隻-bg5  { animation-delay: 1.58s; }
#隻-s5   { stroke-dasharray: 27.3669; stroke-dashoffset: 27.3669; animation: drawStroke 0.22s ease-out 1.71s forwards; }
#隻-bg6  { animation-delay: 1.95s; }
#隻-s6   { stroke-dasharray: 42.3051; stroke-dashoffset: 42.3051; animation: drawStroke 0.23s ease-out 2.08s forwards; }
#隻-bg7  { animation-delay: 2.33s; }
#隻-s7   { stroke-dasharray: 43.0156; stroke-dashoffset: 43.0156; animation: drawStroke 0.24s ease-out 2.46s forwards; }
#隻-bg8  { animation-delay: 2.72s; }
#隻-s8   { stroke-dasharray: 50.5561; stroke-dashoffset: 50.5561; animation: drawStroke 0.28s ease-out 2.85s forwards; }
#隻-bg9  { animation-delay: 3.15s; }
#隻-s9   { stroke-dasharray: 99.4903; stroke-dashoffset: 99.4903; animation: drawStroke 0.55s ease-out 3.28s forwards; }
#隻-bg10  { animation-delay: 3.85s; }
#隻-s10   { stroke-dasharray: 56.6417; stroke-dashoffset: 56.6417; animation: drawStroke 0.31s ease-out 3.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #隻-s[i]) -->
<path id="隻-s1"  class="stroke" stroke="#bf0909" d="M35.31,12.5C35.5,13.66,35.260000000000005,15.17,34.660000000000004,16.17C30.840000000000003,22.490000000000002,26.740000000000002,27.6,17.990000000000002,35.3"/>
<path id="隻-s2"  class="stroke" stroke="#bf7609" d="M29.59,26.72C30.56,27.689999999999998,30.84,28.869999999999997,30.84,30.25C30.84,36.75,30.82,47.620000000000005,30.82,55C30.82,56.72,30.82,58.26,30.82,59.5"/>
<path id="隻-s3"  class="stroke" stroke="#9abf09" d="M59.36,11.5C59.42,12.15,59.339999999999996,13,59.16,13.55C58,17.09,56.279999999999994,19.57,53.62,23.880000000000003"/>
<path id="隻-s4"  class="stroke" stroke="#2dbf09" d="M31.43,28.13C38.37,27.64,60.7,24.939999999999998,72.75,23.549999999999997C76.37,23.129999999999995,79,22.839999999999996,79.89,22.759999999999998"/>
<path id="隻-s5"  class="stroke" stroke="#09bf52" d="M52.97,27.74C53.93,28.7,54.25,30,54.25,31.77C54.25,38.5,54.28,45,54.28,54.79"/>
<path id="隻-s6"  class="stroke" stroke="#09bfbf" d="M32.04,38.28C38.39,37.88,56.64,35.550000000000004,67.02,34.410000000000004C70.55,34.02,73.16,33.74,74.09,33.660000000000004"/>
<path id="隻-s7"  class="stroke" stroke="#0952bf" d="M32.01,47.53C38.62,47.2,56.39,45.24,67.05,44C70.84,43.56,73.7,43.24,74.8,43.17"/>
<path id="隻-s8"  class="stroke" stroke="#2d09bf" d="M32.11,57.02C39.35,56.5,64.92,54.39,76.75,53.5C79.67,53.28,81.75,53.12,82.51,53.05"/>
<path id="隻-s9"  class="stroke" stroke="#9a09bf" d="M31.8,67.27C34,68,36,67.75,38.02,67.5C41.06,67.13,60.03,64.29,66.41,63.34C70.06,62.800000000000004,72.58,64.60000000000001,69.71,68.18C59.25,81.25,43.62,90.88,23.5,98.13"/>
<path id="隻-s10"  class="stroke" stroke="#bf0976" d="M34.34,74.88C38.81,75.36,57.75,85.75,74.28,92.86C78.15,94.52,82.29,95.99,86.5,96.5"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="隻-bg1"  class="badge-group"><circle cx="35.31" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="35.31" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="隻-bg2"  class="badge-group"><circle cx="29.59" cy="23.22" r="3.5" fill="#bf7609"/><text class="num-single" x="29.59" y="23.22" dx="0" dy="-0.5">2</text></g>
<g id="隻-bg3"  class="badge-group"><circle cx="59.36" cy="11.5" r="3.5" fill="#9abf09"/><text class="num-single" x="59.36" y="11.5" dx="0" dy="-0.5">3</text></g>
<g id="隻-bg4"  class="badge-group"><circle cx="31.43" cy="28.13" r="3.5" fill="#2dbf09"/><text class="num-single" x="31.43" y="28.13" dx="0" dy="-0.5">4</text></g>
<g id="隻-bg5"  class="badge-group"><circle cx="52.97" cy="27.74" r="3.5" fill="#09bf52"/><text class="num-single" x="52.97" y="27.74" dx="0" dy="-0.5">5</text></g>
<g id="隻-bg6"  class="badge-group"><circle cx="32.04" cy="38.28" r="3.5" fill="#09bfbf"/><text class="num-single" x="32.04" y="38.28" dx="0" dy="-0.5">6</text></g>
<g id="隻-bg7"  class="badge-group"><circle cx="32.01" cy="47.53" r="3.5" fill="#0952bf"/><text class="num-single" x="32.01" y="47.53" dx="0" dy="-0.5">7</text></g>
<g id="隻-bg8"  class="badge-group"><circle cx="32.11" cy="57.02" r="3.5" fill="#2d09bf"/><text class="num-single" x="32.11" y="57.02" dx="0" dy="-0.5">8</text></g>
<g id="隻-bg9"  class="badge-group"><circle cx="31.8" cy="67.27" r="3.5" fill="#9a09bf"/><text class="num-single" x="31.8" y="67.27" dx="0" dy="-0.5">9</text></g>
<g id="隻-bg10" class="badge-group"><circle cx="34.34" cy="78.38" r="3.5" fill="#bf0976"/><text class="num-double" x="34.34" y="78.38" dx="-0.4" dy="-0.475">10</text></g>
</svg>