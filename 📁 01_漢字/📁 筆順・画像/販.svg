<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (販)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #販-bg[i]: Thời gian quả bóng số nảy lên
   - #販-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#販-bg1  { animation-delay: 0.05s; }
#販-s1   { stroke-dasharray: 51.0064; stroke-dashoffset: 51.0064; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#販-bg2  { animation-delay: 0.48s; }
#販-s2   { stroke-dasharray: 70.6379; stroke-dashoffset: 70.6379; animation: drawStroke 0.39s ease-out 0.61s forwards; }
#販-bg3  { animation-delay: 1.02s; }
#販-s3   { stroke-dasharray: 20.0326; stroke-dashoffset: 20.0326; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#販-bg4  { animation-delay: 1.39s; }
#販-s4   { stroke-dasharray: 20.4150; stroke-dashoffset: 20.4150; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#販-bg5  { animation-delay: 1.76s; }
#販-s5   { stroke-dasharray: 19.9522; stroke-dashoffset: 19.9522; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#販-bg6  { animation-delay: 2.13s; }
#販-s6   { stroke-dasharray: 19.4474; stroke-dashoffset: 19.4474; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#販-bg7  { animation-delay: 2.50s; }
#販-s7   { stroke-dasharray: 12.2251; stroke-dashoffset: 12.2251; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#販-bg8  { animation-delay: 2.87s; }
#販-s8   { stroke-dasharray: 36.4561; stroke-dashoffset: 36.4561; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#販-bg9  { animation-delay: 3.24s; }
#販-s9   { stroke-dasharray: 72.6682; stroke-dashoffset: 72.6682; animation: drawStroke 0.40s ease-out 3.37s forwards; }
#販-bg10  { animation-delay: 3.79s; }
#販-s10   { stroke-dasharray: 95.4375; stroke-dashoffset: 95.4375; animation: drawStroke 0.52s ease-out 3.92s forwards; }
#販-bg11  { animation-delay: 4.46s; }
#販-s11   { stroke-dasharray: 52.4261; stroke-dashoffset: 52.4261; animation: drawStroke 0.29s ease-out 4.59s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #販-s[i]) -->
<path id="販-s1"  class="stroke" stroke="#bf0909" d="M16.95,20.18C17.82,21.05,18.08,21.97,18.08,23.53C18.08,24.87,18.04,55.6,18.06,67C18.06,68.82,18.07,70.18,18.09,70.89"/>
<path id="販-s2"  class="stroke" stroke="#bf6c09" d="M18.67,21.92C20.96,21.46,31.590000000000003,19.67,35.89,18.990000000000002C38.58,18.57,40.13,19.23,40.120000000000005,22.25C40.11000000000001,28,40.050000000000004,52.519999999999996,40.03,63.63C40.02,66.42,40.02,68.37,40.02,68.95"/>
