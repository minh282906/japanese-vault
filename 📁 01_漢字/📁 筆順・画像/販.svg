<path id="販-s4"  class="stroke" stroke="#4bbf09" d="M19.3,52.45C27.05,51.5,31.07,51,39.58,50.11"/>
<path id="販-s5"  class="stroke" stroke="#09bf2a" d="M19.08,68.23C23.88,67.75,32.75,66.5,38.92,66.14"/>
<path id="販-s6"  class="stroke" stroke="#09bf8d" d="M22.45,75.23C22.74,76.32000000000001,22.54,77.36,21.95,78.15C20.18,80.54,14.219999999999999,87.17,10.67,89.99000000000001"/>
<path id="販-s7"  class="stroke" stroke="#098dbf" d="M32.88,73.5C35.81,76.15,39.28,80.96,40.080000000000005,83.28"/>
<path id="販-s8"  class="stroke" stroke="#092abf" d="M53.63,21.98C55.85,22.87,58.190000000000005,22.85,60.510000000000005,22.580000000000002C69.04,21.57,77.77000000000001,19.73,83.62,18.75C85.60000000000001,18.42,87.63000000000001,18.09,89.62,18.57"/>
<path id="販-s9"  class="stroke" stroke="#4b09bf" d="M55.92,23C57.27,23.75,57.68,25.42,57.620000000000005,27.62C57,49.5,56.88,75.88,40.5,91"/>
<path id="販-s10"  class="stroke" stroke="#ae09bf" d="M60.58,43.48C61.92,43.849999999999994,63.83,43.9,66.50999999999999,43.349999999999994C69.17999999999999,42.8,81.88999999999999,38.58,83.77,38.199999999999996C86,37.74999999999999,87.53,39.22,86.78,41.76C79.62,65.75,70,84,50.25,93.76"/>
<path id="販-s11"  class="stroke" stroke="#bf096c" d="M62,53.32C65.11,54.2,78.99,75.71000000000001,90.24,86.91C92.22,88.88,94.3,90.86,96.75999999999999,92.22999999999999"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="販-bg1"  class="badge-group"><circle cx="16.95" cy="16.68" r="3.5" fill="#bf0909"/><text class="num-single" x="16.95" y="16.68" dx="0" dy="-0.5">1</text></g>
<g id="販-bg2"  class="badge-group"><circle cx="18.67" cy="25.42" r="3.5" fill="#bf6c09"/><text class="num-single" x="18.67" y="25.42" dx="0" dy="-0.5">2</text></g>
