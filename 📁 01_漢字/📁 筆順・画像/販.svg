<g id="販-bg10" class="badge-group"><circle cx="60.58" cy="43.48" r="3.5" fill="#ae09bf"/><text class="num-double" x="60.58" y="43.48" dx="-0.4" dy="-0.475">10</text></g>
<g id="販-bg11" class="badge-group"><circle cx="62" cy="53.32" r="3.5" fill="#bf096c"/><text class="num-double" x="62" y="53.32" dx="-0.4" dy="-0.475">11</text></g>
</svg>