<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (震)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #震-bg[i]: Thời gian quả bóng số nảy lên
   - #震-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#震-bg1  { animation-delay: 0.05s; }
#震-s1   { stroke-dasharray: 37.8492; stroke-dashoffset: 37.8492; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#震-bg2  { animation-delay: 0.42s; }
#震-s2   { stroke-dasharray: 15.8065; stroke-dashoffset: 15.8065; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#震-bg3  { animation-delay: 0.79s; }
#震-s3   { stroke-dasharray: 75.7787; stroke-dashoffset: 75.7787; animation: drawStroke 0.42s ease-out 0.92s forwards; }
#震-bg4  { animation-delay: 1.36s; }
#震-s4   { stroke-dasharray: 29.2040; stroke-dashoffset: 29.2040; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#震-bg5  { animation-delay: 1.73s; }
#震-s5   { stroke-dasharray: 10.5765; stroke-dashoffset: 10.5765; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#震-bg6  { animation-delay: 2.10s; }
#震-s6   { stroke-dasharray: 9.3874; stroke-dashoffset: 9.3874; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#震-bg7  { animation-delay: 2.47s; }
#震-s7   { stroke-dasharray: 10.3072; stroke-dashoffset: 10.3072; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#震-bg8  { animation-delay: 2.84s; }
#震-s8   { stroke-dasharray: 9.6669; stroke-dashoffset: 9.6669; animation: drawStroke 0.22s ease-out 2.97s forwards; }
#震-bg9  { animation-delay: 3.21s; }
#震-s9   { stroke-dasharray: 48.5509; stroke-dashoffset: 48.5509; animation: drawStroke 0.27s ease-out 3.34s forwards; }
#震-bg10  { animation-delay: 3.63s; }
#震-s10   { stroke-dasharray: 47.0311; stroke-dashoffset: 47.0311; animation: drawStroke 0.26s ease-out 3.76s forwards; }
#震-bg11  { animation-delay: 4.04s; }
#震-s11   { stroke-dasharray: 28.7492; stroke-dashoffset: 28.7492; animation: drawStroke 0.22s ease-out 4.17s forwards; }
#震-bg12  { animation-delay: 4.41s; }
#震-s12   { stroke-dasharray: 49.6678; stroke-dashoffset: 49.6678; animation: drawStroke 0.27s ease-out 4.54s forwards; }
#震-bg13  { animation-delay: 4.83s; }
#震-s13   { stroke-dasharray: 41.0608; stroke-dashoffset: 41.0608; animation: drawStroke 0.23s ease-out 4.96s forwards; }
#震-bg14  { animation-delay: 5.21s; }
#震-s14   { stroke-dasharray: 11.0393; stroke-dashoffset: 11.0393; animation: drawStroke 0.22s ease-out 5.34s forwards; }
#震-bg15  { animation-delay: 5.58s; }
#震-s15   { stroke-dasharray: 41.1148; stroke-dashoffset: 41.1148; animation: drawStroke 0.23s ease-out 5.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
