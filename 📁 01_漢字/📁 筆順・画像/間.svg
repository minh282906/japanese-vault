<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (間)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #間-bg[i]: Thời gian quả bóng số nảy lên
   - #間-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#間-bg1  { animation-delay: 0.05s; }
#間-s1   { stroke-dasharray: 81.1438; stroke-dashoffset: 81.1438; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#間-bg2  { animation-delay: 0.65s; }
#間-s2   { stroke-dasharray: 48.3209; stroke-dashoffset: 48.3209; animation: drawStroke 0.27s ease-out 0.78s forwards; }
#間-bg3  { animation-delay: 1.07s; }
#間-s3   { stroke-dasharray: 22.0355; stroke-dashoffset: 22.0355; animation: drawStroke 0.22s ease-out 1.20s forwards; }
#間-bg4  { animation-delay: 1.44s; }
#間-s4   { stroke-dasharray: 21.4780; stroke-dashoffset: 21.4780; animation: drawStroke 0.22s ease-out 1.57s forwards; }
#間-bg5  { animation-delay: 1.81s; }
#間-s5   { stroke-dasharray: 25.8505; stroke-dashoffset: 25.8505; animation: drawStroke 0.22s ease-out 1.94s forwards; }
#間-bg6  { animation-delay: 2.18s; }
#間-s6   { stroke-dasharray: 119.1430; stroke-dashoffset: 119.1430; animation: drawStroke 0.55s ease-out 2.31s forwards; }
#間-bg7  { animation-delay: 2.88s; }
#間-s7   { stroke-dasharray: 23.4382; stroke-dashoffset: 23.4382; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#間-bg8  { animation-delay: 3.25s; }
#間-s8   { stroke-dasharray: 23.5604; stroke-dashoffset: 23.5604; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#間-bg9  { animation-delay: 3.62s; }
#間-s9   { stroke-dasharray: 35.3051; stroke-dashoffset: 35.3051; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#間-bg10  { animation-delay: 3.99s; }
#間-s10   { stroke-dasharray: 58.2559; stroke-dashoffset: 58.2559; animation: drawStroke 0.32s ease-out 4.12s forwards; }
#間-bg11  { animation-delay: 4.46s; }
#間-s11   { stroke-dasharray: 21.9779; stroke-dashoffset: 21.9779; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#間-bg12  { animation-delay: 4.83s; }
#間-s12   { stroke-dasharray: 22.3551; stroke-dashoffset: 22.3551; animation: drawStroke 0.22s ease-out 4.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

