<path id="間-s6"  class="stroke" stroke="#09bf64" d="M65.32,14.77C71.28999999999999,14.09,86.00999999999999,11.58,87.69999999999999,11.49C89.49999999999999,11.4,90.50999999999999,12.370000000000001,90.50999999999999,14.31C90.50999999999999,31.310000000000002,90.28999999999999,80.43,90.28999999999999,92.75C90.28999999999999,103.25,83.94,94.11,82.57,92.98"/>
