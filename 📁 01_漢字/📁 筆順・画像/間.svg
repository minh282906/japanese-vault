<path id="間-s10"  class="stroke" stroke="#6409bf" d="M42.26,52.09C47.82,51.61000000000001,61.97,50.11000000000001,63.56,49.99C65.24000000000001,49.86,66.32000000000001,51.45,66.19,52.230000000000004C65.98,53.470000000000006,65.78,72.89,65.71,81.25C65.69,83.54,65.67999999999999,85.05,65.67999999999999,85.22"/>
<path id="間-s11"  class="stroke" stroke="#bf09bf" d="M42.64,66.6C47.75,66.11999999999999,60,64.86999999999999,64.52,64.53"/>
<path id="間-s12"  class="stroke" stroke="#bf0964" d="M42.25,82.8C47.38,82.5,59.25,81.25,64.51,80.75"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
