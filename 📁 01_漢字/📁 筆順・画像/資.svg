<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (資)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #資-bg[i]: Thời gian quả bóng số nảy lên
   - #資-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#資-bg1  { animation-delay: 0.05s; }
#資-s1   { stroke-dasharray: 14.3492; stroke-dashoffset: 14.3492; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#資-bg2  { animation-delay: 0.42s; }
#資-s2   { stroke-dasharray: 22.4140; stroke-dashoffset: 22.4140; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#資-bg3  { animation-delay: 0.79s; }
#資-s3   { stroke-dasharray: 26.8196; stroke-dashoffset: 26.8196; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#資-bg4  { animation-delay: 1.16s; }
#資-s4   { stroke-dasharray: 40.7361; stroke-dashoffset: 40.7361; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#資-bg5  { animation-delay: 1.53s; }
#資-s5   { stroke-dasharray: 27.8940; stroke-dashoffset: 27.8940; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#資-bg6  { animation-delay: 1.90s; }
#資-s6   { stroke-dasharray: 38.7910; stroke-dashoffset: 38.7910; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#資-bg7  { animation-delay: 2.27s; }
#資-s7   { stroke-dasharray: 38.8050; stroke-dashoffset: 38.8050; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#資-bg8  { animation-delay: 2.64s; }
#資-s8   { stroke-dasharray: 74.9998; stroke-dashoffset: 74.9998; animation: drawStroke 0.41s ease-out 2.77s forwards; }
#資-bg9  { animation-delay: 3.20s; }
#資-s9   { stroke-dasharray: 36.9978; stroke-dashoffset: 36.9978; animation: drawStroke 0.22s ease-out 3.33s forwards; }
#資-bg10  { animation-delay: 3.57s; }
#資-s10   { stroke-dasharray: 37.2976; stroke-dashoffset: 37.2976; animation: drawStroke 0.22s ease-out 3.70s forwards; }
#資-bg11  { animation-delay: 3.94s; }
#資-s11   { stroke-dasharray: 37.2487; stroke-dashoffset: 37.2487; animation: drawStroke 0.22s ease-out 4.07s forwards; }
#資-bg12  { animation-delay: 4.31s; }
#資-s12   { stroke-dasharray: 24.9248; stroke-dashoffset: 24.9248; animation: drawStroke 0.22s ease-out 4.44s forwards; }
#資-bg13  { animation-delay: 4.68s; }
#資-s13   { stroke-dasharray: 24.2662; stroke-dashoffset: 24.2662; animation: drawStroke 0.22s ease-out 4.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

