<path id="資-s7"  class="stroke" stroke="#09bf95" d="M32.66,46.48C33.529999999999994,47.349999999999994,33.959999999999994,49.43,33.959999999999994,50.54C33.959999999999994,51.65,33.78999999999999,80.03999999999999,33.78999999999999,80.59C33.78999999999999,81.14,33.709999999999994,83,33.709999999999994,85"/>
<path id="資-s8"  class="stroke" stroke="#0995bf" d="M34.76,48.32C45.379999999999995,47.38,58.629999999999995,46.13,68.46000000000001,45.49C71.76,45.28,73.07000000000001,46.38,73.07000000000001,49.54C73.07000000000001,53,73.01,66.36,73.02000000000001,78.56C73.02000000000001,79.81,73.06000000000002,81.5,73.06000000000002,83.44"/>
<path id="資-s9"  class="stroke" stroke="#0941bf" d="M34.95,59.28C50.63,57.870000000000005,61.13,56.870000000000005,71.84,56.53"/>
<path id="資-s10"  class="stroke" stroke="#2509bf" d="M34.99,70.23C46.5,69.12,61.75,67.75,72.17,67.32000000000001"/>
<path id="資-s11"  class="stroke" stroke="#7909bf" d="M34.66,81.5C43.25,80.87,62.67999999999999,79.34,71.84,79.34"/>
<path id="資-s12"  class="stroke" stroke="#bf09b1" d="M41.82,85.22C41.87,86.25,41.57,87.55,40.55,88.48C37.48,91.27000000000001,30.729999999999997,95.4,22.369999999999997,99.5"/>
<path id="資-s13"  class="stroke" stroke="#bf095d" d="M64.24,85.14C71.94999999999999,89.19,81.05,96.53,83.14999999999999,100.07"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="資-bg1"  class="badge-group"><circle cx="17.75" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="17.75" y="12.5" dx="0" dy="-0.5">1</text></g>
