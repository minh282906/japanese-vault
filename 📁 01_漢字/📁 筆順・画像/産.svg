<g id="産-bg9"  class="badge-group"><circle cx="61.29" cy="50.88" r="3.5" fill="#4b09bf"/><text class="num-single" x="61.29" y="50.88" dx="0" dy="-0.5">9</text></g>
<g id="産-bg10" class="badge-group"><circle cx="41.91" cy="80.06" r="3.5" fill="#ae09bf"/><text class="num-double" x="41.91" y="80.06" dx="-0.4" dy="-0.475">10</text></g>
<g id="産-bg11" class="badge-group"><circle cx="31.3" cy="96.83" r="3.5" fill="#bf096c"/><text class="num-double" x="31.3" y="96.83" dx="-0.4" dy="-0.475">11</text></g>
</svg>