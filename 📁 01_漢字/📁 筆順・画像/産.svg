<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (産)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #産-bg[i]: Thời gian quả bóng số nảy lên
   - #産-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#産-bg1  { animation-delay: 0.05s; }
#産-s1   { stroke-dasharray: 12.1447; stroke-dashoffset: 12.1447; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#産-bg2  { animation-delay: 0.42s; }
#産-s2   { stroke-dasharray: 53.9704; stroke-dashoffset: 53.9704; animation: drawStroke 0.30s ease-out 0.55s forwards; }
#産-bg3  { animation-delay: 0.87s; }
#産-s3   { stroke-dasharray: 16.5995; stroke-dashoffset: 16.5995; animation: drawStroke 0.22s ease-out 1.00s forwards; }
#産-bg4  { animation-delay: 1.24s; }
#産-s4   { stroke-dasharray: 18.4352; stroke-dashoffset: 18.4352; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#産-bg5  { animation-delay: 1.61s; }
#産-s5   { stroke-dasharray: 68.2182; stroke-dashoffset: 68.2182; animation: drawStroke 0.38s ease-out 1.74s forwards; }
#産-bg6  { animation-delay: 2.14s; }
#産-s6   { stroke-dasharray: 55.1392; stroke-dashoffset: 55.1392; animation: drawStroke 0.30s ease-out 2.27s forwards; }
#産-bg7  { animation-delay: 2.59s; }
#産-s7   { stroke-dasharray: 25.0488; stroke-dashoffset: 25.0488; animation: drawStroke 0.22s ease-out 2.72s forwards; }
#産-bg8  { animation-delay: 2.96s; }
#産-s8   { stroke-dasharray: 39.8314; stroke-dashoffset: 39.8314; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#産-bg9  { animation-delay: 3.33s; }
#産-s9   { stroke-dasharray: 43.9944; stroke-dashoffset: 43.9944; animation: drawStroke 0.24s ease-out 3.46s forwards; }
#産-bg10  { animation-delay: 3.72s; }
#産-s10   { stroke-dasharray: 40.2076; stroke-dashoffset: 40.2076; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#産-bg11  { animation-delay: 4.09s; }
#産-s11   { stroke-dasharray: 63.2569; stroke-dashoffset: 63.2569; animation: drawStroke 0.35s ease-out 4.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #産-s[i]) -->
<path id="産-s1"  class="stroke" stroke="#bf0909" d="M53.75,9.25C54.75,10.25,55.25,11.5,55.25,13.25S55.25,18.63,55.25,21"/>
<path id="産-s2"  class="stroke" stroke="#bf6c09" d="M29.5,23.7C31.88,24.25,34.04,24,36.25,23.81C45.01,23.049999999999997,64.76,20.91,75.38,20.2C78.02,20.02,80.63,19.89,83.25,20.33"/>
