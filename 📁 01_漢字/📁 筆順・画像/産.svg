<path id="産-s4"  class="stroke" stroke="#4bbf09" d="M70.91,24.5C71.38,25.25,71.35,26.41,71.28,26.9C70.79,30.31,66.74,39.14,65.51,41.75"/>
<path id="産-s5"  class="stroke" stroke="#09bf2a" d="M23.75,46.8C27.13,47.25,29.56,47.059999999999995,32.49,46.76C47.02,45.26,66.56,43.48,82.75,42.629999999999995C85.8,42.47,88.73,42.339999999999996,91.75,42.81999999999999"/>
<path id="産-s6"  class="stroke" stroke="#09bf8d" d="M28.25,48.25C29.19,49.19,29.57,50.6,29.43,52.31C27.63,73.5,21.25,88.75,11.5,98.75"/>
<path id="産-s7"  class="stroke" stroke="#098dbf" d="M45.01,54.12C45.37,55.05,45.37,55.89,45.19,56.89C44.419999999999995,61.15,39.98,70,33.9,75.73"/>
<path id="産-s8"  class="stroke" stroke="#092abf" d="M45.16,64.9C47.25,65.25,49.16,65.13000000000001,50.76,64.97C57.43,64.33,71.93,62.69,79,61.93C80.84,61.73,82.95,61.93,84.8,62.07"/>
<path id="産-s9"  class="stroke" stroke="#4b09bf" d="M61.29,50.88C62.269999999999996,51.86,62.699999999999996,53.370000000000005,62.699999999999996,54.660000000000004C62.699999999999996,55.46,62.51,89.5,62.51,94.52000000000001"/>
<path id="産-s10"  class="stroke" stroke="#ae09bf" d="M41.91,80.06C43.769999999999996,80.57000000000001,45.959999999999994,80.21000000000001,47.839999999999996,80.06C55.019999999999996,79.5,68.00999999999999,78.10000000000001,75.47999999999999,77.46000000000001C77.52999999999999,77.28,79.74999999999999,77.25000000000001,81.93999999999998,77.65"/>
<path id="産-s11"  class="stroke" stroke="#bf096c" d="M31.3,96.83C34.730000000000004,97.53,36.980000000000004,97.64,40.38,97.3C52.38,96.11999999999999,74.2,94.81,84.51,94.16C87.67,93.96,91.21000000000001,94.22,94.33000000000001,94.91"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="産-bg1"  class="badge-group"><circle cx="53.75" cy="9.25" r="3.5" fill="#bf0909"/><text class="num-single" x="53.75" y="9.25" dx="0" dy="-0.5">1</text></g>
<g id="産-bg2"  class="badge-group"><circle cx="29.5" cy="23.7" r="3.5" fill="#bf6c09"/><text class="num-single" x="29.5" y="23.7" dx="0" dy="-0.5">2</text></g>
