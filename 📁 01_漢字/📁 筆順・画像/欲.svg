<path id="欲-s3"  class="stroke" stroke="#aebf09" d="M33.69,37.99C33.86,39.59,33.43,41.050000000000004,32.53,42.410000000000004C28.03,49.150000000000006,20.130000000000003,57.63,9.880000000000003,63.940000000000005"/>
<path id="欲-s4"  class="stroke" stroke="#4bbf09" d="M35.3,44.27C39.669999999999995,46.620000000000005,44.66,49.52,48.23,53.790000000000006"/>
<path id="欲-s5"  class="stroke" stroke="#09bf2a" d="M17.48,66.65C18.17,67.33000000000001,18.62,68.25,18.84,69.38000000000001C19.69,73.86000000000001,20.54,79.18,21.2,84.69000000000001C21.36,86.02000000000001,21.509999999999998,87.29,21.64,88.45000000000002"/>
<path id="欲-s6"  class="stroke" stroke="#09bf8d" d="M19.45,68.46C27.11,66.91999999999999,36.07,65.08,41.629999999999995,64.16999999999999C44.83,63.649999999999984,46.58,64.69999999999999,45.709999999999994,68.05999999999999C44.49999999999999,72.72999999999999,43.169999999999995,76.6,42.06999999999999,82.54999999999998"/>
<path id="欲-s7"  class="stroke" stroke="#098dbf" d="M22.47,85.56C27.979999999999997,85.15,34.04,84.46000000000001,40,83.79C41.49,83.62,43.03,83.46000000000001,44.62,83.30000000000001"/>
<path id="欲-s8"  class="stroke" stroke="#092abf" d="M65.92,20.25C65.99,21.72,65.99,22.91,65.48,24.31C62.870000000000005,31.5,59.870000000000005,39.129999999999995,54.25,48.26"/>
<path id="欲-s9"  class="stroke" stroke="#4b09bf" d="M62.17,40.54C63.7,40.97,65.59,40.58,67.08,40.16C70.69,39.15,80.82,35.87,86.18,34.16C91.71000000000001,32.4,88.5,38.87,83.47000000000001,44.3"/>
<path id="欲-s10"  class="stroke" stroke="#ae09bf" d="M66.42,49.91C67,50.879999999999995,67.29,52.41,67.05,53.81999999999999C65.25,64.5,60.75,81.88,45.23,91"/>
<path id="欲-s11"  class="stroke" stroke="#bf096c" d="M66.83,58.93C71.95,65.02,80.89,76.99,87.75999999999999,84.35C89.88,86.61999999999999,92.49999999999999,89,94.77,90.19"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="欲-bg1"  class="badge-group"><circle cx="24.85" cy="23.98" r="3.5" fill="#bf0909"/><text class="num-single" x="24.85" y="23.98" dx="0" dy="-0.5">1</text></g>
<g id="欲-bg2"  class="badge-group"><circle cx="40.41" cy="23.85" r="3.5" fill="#bf6c09"/><text class="num-single" x="40.41" y="23.85" dx="0" dy="-0.5">2</text></g>
