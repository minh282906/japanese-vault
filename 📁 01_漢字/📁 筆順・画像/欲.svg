<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (欲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #欲-bg[i]: Thời gian quả bóng số nảy lên
   - #欲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#欲-bg1  { animation-delay: 0.05s; }
#欲-s1   { stroke-dasharray: 20.2627; stroke-dashoffset: 20.2627; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#欲-bg2  { animation-delay: 0.42s; }
#欲-s2   { stroke-dasharray: 14.0065; stroke-dashoffset: 14.0065; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#欲-bg3  { animation-delay: 0.79s; }
#欲-s3   { stroke-dasharray: 36.1420; stroke-dashoffset: 36.1420; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#欲-bg4  { animation-delay: 1.16s; }
#欲-s4   { stroke-dasharray: 16.1572; stroke-dashoffset: 16.1572; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#欲-bg5  { animation-delay: 1.53s; }
#欲-s5   { stroke-dasharray: 22.3766; stroke-dashoffset: 22.3766; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#欲-bg6  { animation-delay: 1.90s; }
#欲-s6   { stroke-dasharray: 44.8719; stroke-dashoffset: 44.8719; animation: drawStroke 0.25s ease-out 2.03s forwards; }
#欲-bg7  { animation-delay: 2.30s; }
#欲-s7   { stroke-dasharray: 22.2661; stroke-dashoffset: 22.2661; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#欲-bg8  { animation-delay: 2.67s; }
#欲-s8   { stroke-dasharray: 30.6189; stroke-dashoffset: 30.6189; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#欲-bg9  { animation-delay: 3.04s; }
#欲-s9   { stroke-dasharray: 39.6143; stroke-dashoffset: 39.6143; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#欲-bg10  { animation-delay: 3.41s; }
#欲-s10   { stroke-dasharray: 48.6130; stroke-dashoffset: 48.6130; animation: drawStroke 0.27s ease-out 3.54s forwards; }
#欲-bg11  { animation-delay: 3.83s; }
#欲-s11   { stroke-dasharray: 42.0962; stroke-dashoffset: 42.0962; animation: drawStroke 0.23s ease-out 3.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #欲-s[i]) -->
<path id="欲-s1"  class="stroke" stroke="#bf0909" d="M24.85,23.98C24.92,24.82,24.6,25.63,24.220000000000002,26.36C22.300000000000004,30.1,18.120000000000005,34.75,12.320000000000002,39.4"/>
