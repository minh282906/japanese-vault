<g id="欲-bg10" class="badge-group"><circle cx="66.42" cy="49.91" r="3.5" fill="#ae09bf"/><text class="num-double" x="66.42" y="49.91" dx="-0.4" dy="-0.475">10</text></g>
<g id="欲-bg11" class="badge-group"><circle cx="66.83" cy="58.93" r="3.5" fill="#bf096c"/><text class="num-double" x="66.83" y="58.93" dx="-0.4" dy="-0.475">11</text></g>
</svg>