<g id="済-bg10" class="badge-group"><circle cx="49.18" cy="79.2" r="3.5" fill="#ae09bf"/><text class="num-double" x="49.18" y="79.2" dx="-0.4" dy="-0.475">10</text></g>
<g id="済-bg11" class="badge-group"><circle cx="80.73" cy="56.5" r="3.5" fill="#bf096c"/><text class="num-double" x="80.73" y="56.5" dx="-0.4" dy="-0.475">11</text></g>
</svg>