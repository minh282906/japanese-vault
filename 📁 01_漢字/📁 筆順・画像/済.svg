<g id="済-bg7"  class="badge-group"><circle cx="47.72" cy="33.58" r="3.5" fill="#098dbf"/><text class="num-single" x="47.72" y="33.58" dx="0" dy="-0.5">7</text></g>
<g id="済-bg8"  class="badge-group"><circle cx="47.88" cy="59.75" r="3.5" fill="#092abf"/><text class="num-single" x="47.88" y="59.75" dx="0" dy="-0.5">8</text></g>
