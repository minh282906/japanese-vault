<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (試)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #試-bg[i]: Thời gian quả bóng số nảy lên
   - #試-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#試-bg1  { animation-delay: 0.05s; }
#試-s1   { stroke-dasharray: 11.7970; stroke-dashoffset: 11.7970; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#試-bg2  { animation-delay: 0.42s; }
#試-s2   { stroke-dasharray: 30.1892; stroke-dashoffset: 30.1892; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#試-bg3  { animation-delay: 0.79s; }
#試-s3   { stroke-dasharray: 20.1377; stroke-dashoffset: 20.1377; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#試-bg4  { animation-delay: 1.16s; }
#試-s4   { stroke-dasharray: 20.2089; stroke-dashoffset: 20.2089; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#試-bg5  { animation-delay: 1.53s; }
#試-s5   { stroke-dasharray: 20.3183; stroke-dashoffset: 20.3183; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#試-bg6  { animation-delay: 1.90s; }
#試-s6   { stroke-dasharray: 35.8082; stroke-dashoffset: 35.8082; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#試-bg7  { animation-delay: 2.27s; }
#試-s7   { stroke-dasharray: 15.4162; stroke-dashoffset: 15.4162; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#試-bg8  { animation-delay: 2.64s; }
#試-s8   { stroke-dasharray: 47.2798; stroke-dashoffset: 47.2798; animation: drawStroke 0.26s ease-out 2.77s forwards; }
#試-bg9  { animation-delay: 3.05s; }
#試-s9   { stroke-dasharray: 22.1396; stroke-dashoffset: 22.1396; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#試-bg10  { animation-delay: 3.42s; }
#試-s10   { stroke-dasharray: 18.8895; stroke-dashoffset: 18.8895; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#試-bg11  { animation-delay: 3.79s; }
#試-s11   { stroke-dasharray: 27.3601; stroke-dashoffset: 27.3601; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#試-bg12  { animation-delay: 4.16s; }
#試-s12   { stroke-dasharray: 100.7270; stroke-dashoffset: 100.7270; animation: drawStroke 0.55s ease-out 4.29s forwards; }
#試-bg13  { animation-delay: 4.86s; }
#試-s13   { stroke-dasharray: 11.9313; stroke-dashoffset: 11.9313; animation: drawStroke 0.22s ease-out 4.99s forwards; }
]]>
</style>

