<path id="試-s8"  class="stroke" stroke="#0995bf" d="M45.25,37.94C47.35,38.25,50.26,38.12,51.54,37.98C60.36,37,75,34.38,87.68,33.3C89.80000000000001,33.12,91.08000000000001,33.559999999999995,92.15,33.83"/>
<path id="試-s9"  class="stroke" stroke="#0941bf" d="M46.87,55.38C47.5,55.71,49.57,55.800000000000004,50.22,55.71C55.5,54.99,61.379999999999995,53.620000000000005,65.77,53.230000000000004C66.75,53.14,67.92,53.300000000000004,68.72999999999999,53.57000000000001"/>
<path id="試-s10"  class="stroke" stroke="#2509bf" d="M57.55,57.37C58.279999999999994,58.099999999999994,58.57,59.43,58.57,60.459999999999994C58.57,63.86999999999999,58.48,71.86999999999999,58.48,76.02"/>
