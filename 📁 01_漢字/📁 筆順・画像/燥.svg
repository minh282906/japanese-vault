<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (燥)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #燥-bg[i]: Thời gian quả bóng số nảy lên
   - #燥-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#燥-bg1  { animation-delay: 0.05s; }
#燥-s1   { stroke-dasharray: 16.4060; stroke-dashoffset: 16.4060; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#燥-bg2  { animation-delay: 0.42s; }
#燥-s2   { stroke-dasharray: 17.6797; stroke-dashoffset: 17.6797; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#燥-bg3  { animation-delay: 0.79s; }
#燥-s3   { stroke-dasharray: 79.3322; stroke-dashoffset: 79.3322; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#燥-bg4  { animation-delay: 1.38s; }
#燥-s4   { stroke-dasharray: 17.6118; stroke-dashoffset: 17.6118; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#燥-bg5  { animation-delay: 1.75s; }
#燥-s5   { stroke-dasharray: 18.6141; stroke-dashoffset: 18.6141; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#燥-bg6  { animation-delay: 2.12s; }
#燥-s6   { stroke-dasharray: 39.6017; stroke-dashoffset: 39.6017; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#燥-bg7  { animation-delay: 2.49s; }
#燥-s7   { stroke-dasharray: 21.8136; stroke-dashoffset: 21.8136; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#燥-bg8  { animation-delay: 2.86s; }
#燥-s8   { stroke-dasharray: 16.3446; stroke-dashoffset: 16.3446; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#燥-bg9  { animation-delay: 3.23s; }
#燥-s9   { stroke-dasharray: 29.3252; stroke-dashoffset: 29.3252; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#燥-bg10  { animation-delay: 3.60s; }
#燥-s10   { stroke-dasharray: 13.8679; stroke-dashoffset: 13.8679; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#燥-bg11  { animation-delay: 3.97s; }
#燥-s11   { stroke-dasharray: 15.8043; stroke-dashoffset: 15.8043; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#燥-bg12  { animation-delay: 4.34s; }
#燥-s12   { stroke-dasharray: 32.6064; stroke-dashoffset: 32.6064; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#燥-bg13  { animation-delay: 4.71s; }
#燥-s13   { stroke-dasharray: 16.1412; stroke-dashoffset: 16.1412; animation: drawStroke 0.22s ease-out 4.84s forwards; }
#燥-bg14  { animation-delay: 5.08s; }
#燥-s14   { stroke-dasharray: 51.0257; stroke-dashoffset: 51.0257; animation: drawStroke 0.28s ease-out 5.21s forwards; }
#燥-bg15  { animation-delay: 5.51s; }
#燥-s15   { stroke-dasharray: 40.9359; stroke-dashoffset: 40.9359; animation: drawStroke 0.23s ease-out 5.64s forwards; }
#燥-bg16  { animation-delay: 5.89s; }
#燥-s16   { stroke-dasharray: 36.6591; stroke-dashoffset: 36.6591; animation: drawStroke 0.22s ease-out 6.02s forwards; }
#燥-bg17  { animation-delay: 6.26s; }
#燥-s17   { stroke-dasharray: 35.7530; stroke-dashoffset: 35.7530; animation: drawStroke 0.22s ease-out 6.39s forwards; }
]]>
</style>

