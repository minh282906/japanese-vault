<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (馬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #馬-bg[i]: Thời gian quả bóng số nảy lên
   - #馬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#馬-bg1  { animation-delay: 0.05s; }
#馬-s1   { stroke-dasharray: 48.4622; stroke-dashoffset: 48.4622; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#馬-bg2  { animation-delay: 0.47s; }
#馬-s2   { stroke-dasharray: 47.9884; stroke-dashoffset: 47.9884; animation: drawStroke 0.26s ease-out 0.60s forwards; }
#馬-bg3  { animation-delay: 0.88s; }
#馬-s3   { stroke-dasharray: 42.7656; stroke-dashoffset: 42.7656; animation: drawStroke 0.24s ease-out 1.01s forwards; }
#馬-bg4  { animation-delay: 1.27s; }
#馬-s4   { stroke-dasharray: 46.1586; stroke-dashoffset: 46.1586; animation: drawStroke 0.25s ease-out 1.40s forwards; }
#馬-bg5  { animation-delay: 1.67s; }
#馬-s5   { stroke-dasharray: 46.4369; stroke-dashoffset: 46.4369; animation: drawStroke 0.26s ease-out 1.80s forwards; }
#馬-bg6  { animation-delay: 2.08s; }
#馬-s6   { stroke-dasharray: 112.4190; stroke-dashoffset: 112.4190; animation: drawStroke 0.55s ease-out 2.21s forwards; }
#馬-bg7  { animation-delay: 2.78s; }
#馬-s7   { stroke-dasharray: 17.1636; stroke-dashoffset: 17.1636; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#馬-bg8  { animation-delay: 3.15s; }
#馬-s8   { stroke-dasharray: 15.2867; stroke-dashoffset: 15.2867; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#馬-bg9  { animation-delay: 3.52s; }
#馬-s9   { stroke-dasharray: 13.9496; stroke-dashoffset: 13.9496; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#馬-bg10  { animation-delay: 3.89s; }
#馬-s10   { stroke-dasharray: 14.5392; stroke-dashoffset: 14.5392; animation: drawStroke 0.22s ease-out 4.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #馬-s[i]) -->
<path id="馬-s1"  class="stroke" stroke="#bf0909" d="M28.5,17C29.25,18,29.7,19.25,29.7,20.62C29.7,26.34,29.74,47.46,29.57,60C29.54,62,29.51,63.76,29.47,65.2"/>
<path id="馬-s2"  class="stroke" stroke="#bf7609" d="M31.03,19.3C42.25,18,68.43,14.46,73.25,13.75C74.93,13.5,77.78,13.22,78.63,13.4"/>
<path id="馬-s3"  class="stroke" stroke="#9abf09" d="M53.13,17.82C53.75,19,53.95,20,53.95,21.37C53.95,28.01,53.720000000000006,50.25,53.720000000000006,60.45"/>
<path id="馬-s4"  class="stroke" stroke="#2dbf09" d="M30.78,33.8C42,32.5,66.44,29.71,71.25,29C72.93,28.75,75.78,28.47,76.63,28.65"/>
<path id="馬-s5"  class="stroke" stroke="#09bf52" d="M30.78,48.05C42,46.75,66.69,43.71,71.5,43C73.18,42.75,76.03,42.47,76.88,42.65"/>
<path id="馬-s6"  class="stroke" stroke="#09bfbf" d="M30.73,63.53C44,62,78.04,57.88,85.9,57.01C91.02000000000001,56.44,93.24000000000001,59.589999999999996,92.72,63.54C91.24,74.75,88.49,83.25,85.24,90.75C80.78999999999999,101.02,78.74,96.25,73.53999999999999,90.95"/>
<path id="馬-s7"  class="stroke" stroke="#0952bf" d="M17.31,76.25C17.75,82.25,17,89.5,15.709999999999999,93.25"/>
<path id="馬-s8"  class="stroke" stroke="#2d09bf" d="M33.75,74.25C36.3,76.9,38.730000000000004,84.18,39.37,88.3"/>
<path id="馬-s9"  class="stroke" stroke="#9a09bf" d="M51,71C53.03,73.22,56.25,80.12,56.76,83.58"/>
<path id="馬-s10"  class="stroke" stroke="#bf0976" d="M68.25,67.75C70.99,69.89,75.32,76.53,76,79.85"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="馬-bg1"  class="badge-group"><circle cx="28.5" cy="13.5" r="3.5" fill="#bf0909"/><text class="num-single" x="28.5" y="13.5" dx="0" dy="-0.5">1</text></g>
<g id="馬-bg2"  class="badge-group"><circle cx="31.03" cy="22.8" r="3.5" fill="#bf7609"/><text class="num-single" x="31.03" y="22.8" dx="0" dy="-0.5">2</text></g>
<g id="馬-bg3"  class="badge-group"><circle cx="53.13" cy="17.82" r="3.5" fill="#9abf09"/><text class="num-single" x="53.13" y="17.82" dx="0" dy="-0.5">3</text></g>
<g id="馬-bg4"  class="badge-group"><circle cx="30.78" cy="33.8" r="3.5" fill="#2dbf09"/><text class="num-single" x="30.78" y="33.8" dx="0" dy="-0.5">4</text></g>
<g id="馬-bg5"  class="badge-group"><circle cx="30.78" cy="48.05" r="3.5" fill="#09bf52"/><text class="num-single" x="30.78" y="48.05" dx="0" dy="-0.5">5</text></g>
<g id="馬-bg6"  class="badge-group"><circle cx="30.73" cy="63.53" r="3.5" fill="#09bfbf"/><text class="num-single" x="30.73" y="63.53" dx="0" dy="-0.5">6</text></g>
<g id="馬-bg7"  class="badge-group"><circle cx="17.31" cy="76.25" r="3.5" fill="#0952bf"/><text class="num-single" x="17.31" y="76.25" dx="0" dy="-0.5">7</text></g>
<g id="馬-bg8"  class="badge-group"><circle cx="33.75" cy="74.25" r="3.5" fill="#2d09bf"/><text class="num-single" x="33.75" y="74.25" dx="0" dy="-0.5">8</text></g>
<g id="馬-bg9"  class="badge-group"><circle cx="51" cy="71" r="3.5" fill="#9a09bf"/><text class="num-single" x="51" y="71" dx="0" dy="-0.5">9</text></g>
<g id="馬-bg10" class="badge-group"><circle cx="68.25" cy="67.75" r="3.5" fill="#bf0976"/><text class="num-double" x="68.25" y="67.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>