<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (例)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #例-bg[i]: Thời gian quả bóng số nảy lên
   - #例-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#例-bg1  { animation-delay: 0.05s; }
#例-s1   { stroke-dasharray: 46.5484; stroke-dashoffset: 46.5484; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#例-bg2  { animation-delay: 0.46s; }
#例-s2   { stroke-dasharray: 47.5925; stroke-dashoffset: 47.5925; animation: drawStroke 0.26s ease-out 0.59s forwards; }
#例-bg3  { animation-delay: 0.87s; }
#例-s3   { stroke-dasharray: 28.3005; stroke-dashoffset: 28.3005; animation: drawStroke 0.22s ease-out 1.00s forwards; }
#例-bg4  { animation-delay: 1.24s; }
#例-s4   { stroke-dasharray: 39.7158; stroke-dashoffset: 39.7158; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#例-bg5  { animation-delay: 1.61s; }
#例-s5   { stroke-dasharray: 74.9667; stroke-dashoffset: 74.9667; animation: drawStroke 0.41s ease-out 1.74s forwards; }
#例-bg6  { animation-delay: 2.17s; }
#例-s6   { stroke-dasharray: 12.3027; stroke-dashoffset: 12.3027; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#例-bg7  { animation-delay: 2.54s; }
#例-s7   { stroke-dasharray: 41.3461; stroke-dashoffset: 41.3461; animation: drawStroke 0.23s ease-out 2.67s forwards; }
#例-bg8  { animation-delay: 2.92s; }
#例-s8   { stroke-dasharray: 87.8391; stroke-dashoffset: 87.8391; animation: drawStroke 0.48s ease-out 3.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #例-s[i]) -->
<path id="例-s1"  class="stroke" stroke="#bf0909" d="M30.12,17.5C30.37,19.25,30.060000000000002,20.79,29.400000000000002,22.58C25.15,33.98,20.12,45,9.75,58.79"/>
<path id="例-s2"  class="stroke" stroke="#bf9109" d="M22.78,43.75C23.76,44.73,24.130000000000003,46,24.130000000000003,47.73C24.130000000000003,57.72,24.040000000000003,75.19,24.01,85.25C24,87.66,24,89.65,24,91"/>
<path id="例-s3"  class="stroke" stroke="#64bf09" d="M37.45,22.06C38.370000000000005,22.43,40.050000000000004,22.509999999999998,40.970000000000006,22.43C46.900000000000006,21.9,55.25000000000001,20.38,62.03,19.61C63.550000000000004,19.439999999999998,64.73,19.54,65.5,19.72"/>
<path id="例-s4"  class="stroke" stroke="#09bf36" d="M49.73,25.21C50.12,26.37,50.13999999999999,27.310000000000002,49.849999999999994,28.47C47.739999999999995,36.879999999999995,41.61999999999999,48.75,32.28999999999999,60.06"/>
<path id="例-s5"  class="stroke" stroke="#09bfbf" d="M47.82,40.96C48.88,41.25,49.88,41.12,51.33,40.84C54.64,40.18000000000001,55.91,40.09,58.03,39.330000000000005C61,38.260000000000005,62.870000000000005,39.59,61.86,43.10000000000001C57.75,57.38,48.38,78.75,31.77,90.5"/>
<path id="例-s6"  class="stroke" stroke="#0936bf" d="M41.25,56.25C44.67,57.78,49.09,62.29,49.94,64.67"/>
<path id="例-s7"  class="stroke" stroke="#6409bf" d="M73.27,27.12C74.52,28.37,75.03,29.880000000000003,75.03,32.14C75.03,43.13,75.03,53.84,75.03,61.510000000000005C75.03,64.04,75.03,66.24000000000001,75.03,68.01"/>
<path id="例-s8"  class="stroke" stroke="#bf0991" d="M90.02,14.08C91.41,15.47,92.03,17,92.03,19.6C92.03,36,92.02,82.00999999999999,92.02,86.97C92.02,96.25,86.5,90.75,83.31,87.22"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="例-bg1"  class="badge-group"><circle cx="30.12" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="30.12" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="例-bg2"  class="badge-group"><circle cx="22.78" cy="43.75" r="3.5" fill="#bf9109"/><text class="num-single" x="22.78" y="43.75" dx="0" dy="-0.5">2</text></g>
<g id="例-bg3"  class="badge-group"><circle cx="37.45" cy="22.06" r="3.5" fill="#64bf09"/><text class="num-single" x="37.45" y="22.06" dx="0" dy="-0.5">3</text></g>
<g id="例-bg4"  class="badge-group"><circle cx="49.73" cy="25.21" r="3.5" fill="#09bf36"/><text class="num-single" x="49.73" y="25.21" dx="0" dy="-0.5">4</text></g>
<g id="例-bg5"  class="badge-group"><circle cx="47.82" cy="40.96" r="3.5" fill="#09bfbf"/><text class="num-single" x="47.82" y="40.96" dx="0" dy="-0.5">5</text></g>
<g id="例-bg6"  class="badge-group"><circle cx="41.25" cy="56.25" r="3.5" fill="#0936bf"/><text class="num-single" x="41.25" y="56.25" dx="0" dy="-0.5">6</text></g>
<g id="例-bg7"  class="badge-group"><circle cx="73.27" cy="27.12" r="3.5" fill="#6409bf"/><text class="num-single" x="73.27" y="27.12" dx="0" dy="-0.5">7</text></g>
<g id="例-bg8"  class="badge-group"><circle cx="90.02" cy="14.08" r="3.5" fill="#bf0991"/><text class="num-single" x="90.02" y="14.08" dx="0" dy="-0.5">8</text></g>
</svg>