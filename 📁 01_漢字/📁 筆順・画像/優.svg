<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (優)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #優-bg[i]: Thời gian quả bóng số nảy lên
   - #優-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#優-bg1  { animation-delay: 0.05s; }
#優-s1   { stroke-dasharray: 47.1983; stroke-dashoffset: 47.1983; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#優-bg2  { animation-delay: 0.46s; }
#優-s2   { stroke-dasharray: 57.1348; stroke-dashoffset: 57.1348; animation: drawStroke 0.31s ease-out 0.59s forwards; }
#優-bg3  { animation-delay: 0.92s; }
#優-s3   { stroke-dasharray: 45.3691; stroke-dashoffset: 45.3691; animation: drawStroke 0.25s ease-out 1.05s forwards; }
#優-bg4  { animation-delay: 1.32s; }
#優-s4   { stroke-dasharray: 8.0585; stroke-dashoffset: 8.0585; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#優-bg5  { animation-delay: 1.69s; }
#優-s5   { stroke-dasharray: 24.7816; stroke-dashoffset: 24.7816; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#優-bg6  { animation-delay: 2.06s; }
#優-s6   { stroke-dasharray: 48.5548; stroke-dashoffset: 48.5548; animation: drawStroke 0.27s ease-out 2.19s forwards; }
#優-bg7  { animation-delay: 2.48s; }
#優-s7   { stroke-dasharray: 25.8689; stroke-dashoffset: 25.8689; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#優-bg8  { animation-delay: 2.85s; }
#優-s8   { stroke-dasharray: 26.2687; stroke-dashoffset: 26.2687; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#優-bg9  { animation-delay: 3.22s; }
#優-s9   { stroke-dasharray: 13.5707; stroke-dashoffset: 13.5707; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#優-bg10  { animation-delay: 3.59s; }
#優-s10   { stroke-dasharray: 66.7055; stroke-dashoffset: 66.7055; animation: drawStroke 0.37s ease-out 3.72s forwards; }
#優-bg11  { animation-delay: 4.11s; }
#優-s11   { stroke-dasharray: 11.1488; stroke-dashoffset: 11.1488; animation: drawStroke 0.22s ease-out 4.24s forwards; }
#優-bg12  { animation-delay: 4.48s; }
#優-s12   { stroke-dasharray: 41.2608; stroke-dashoffset: 41.2608; animation: drawStroke 0.23s ease-out 4.61s forwards; }
#優-bg13  { animation-delay: 4.86s; }
#優-s13   { stroke-dasharray: 7.3698; stroke-dashoffset: 7.3698; animation: drawStroke 0.22s ease-out 4.99s forwards; }
#優-bg14  { animation-delay: 5.23s; }
#優-s14   { stroke-dasharray: 8.4469; stroke-dashoffset: 8.4469; animation: drawStroke 0.22s ease-out 5.36s forwards; }
#優-bg15  { animation-delay: 5.60s; }
#優-s15   { stroke-dasharray: 30.5737; stroke-dashoffset: 30.5737; animation: drawStroke 0.22s ease-out 5.73s forwards; }
#優-bg16  { animation-delay: 5.97s; }
#優-s16   { stroke-dasharray: 66.9555; stroke-dashoffset: 66.9555; animation: drawStroke 0.37s ease-out 6.10s forwards; }
#優-bg17  { animation-delay: 6.49s; }
#優-s17   { stroke-dasharray: 40.4488; stroke-dashoffset: 40.4488; animation: drawStroke 0.22s ease-out 6.62s forwards; }
]]>
</style>

