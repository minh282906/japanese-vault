<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (地)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #地-bg[i]: Thời gian quả bóng số nảy lên
   - #地-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#地-bg1  { animation-delay: 0.05s; }
#地-s1   { stroke-dasharray: 29.6987; stroke-dashoffset: 29.6987; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#地-bg2  { animation-delay: 0.42s; }
#地-s2   { stroke-dasharray: 48.4103; stroke-dashoffset: 48.4103; animation: drawStroke 0.27s ease-out 0.55s forwards; }
#地-bg3  { animation-delay: 0.84s; }
#地-s3   { stroke-dasharray: 32.4596; stroke-dashoffset: 32.4596; animation: drawStroke 0.22s ease-out 0.97s forwards; }
#地-bg4  { animation-delay: 1.21s; }
#地-s4   { stroke-dasharray: 81.3617; stroke-dashoffset: 81.3617; animation: drawStroke 0.45s ease-out 1.34s forwards; }
#地-bg5  { animation-delay: 1.81s; }
#地-s5   { stroke-dasharray: 54.0488; stroke-dashoffset: 54.0488; animation: drawStroke 0.30s ease-out 1.94s forwards; }
#地-bg6  { animation-delay: 2.26s; }
#地-s6   { stroke-dasharray: 99.4861; stroke-dashoffset: 99.4861; animation: drawStroke 0.55s ease-out 2.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #地-s[i]) -->
<path id="地-s1"  class="stroke" stroke="#bf0909" d="M11.5,49.5C13.21,50.19,15.01,50.06,16.740000000000002,49.7C22.5,48.5,30.11,46.74,36.39,45C37.99,44.56,39.47,44.5,40.51,44.75"/>
<path id="地-s2"  class="stroke" stroke="#bfbf09" d="M25.37,26.25C26.46,26.75,27.11,28.5,27.330000000000002,29.5C27.51,30.32,27.150000000000002,72.9,27.110000000000003,74"/>
<path id="地-s3"  class="stroke" stroke="#09bf09" d="M11,82.02C12.25,83.25,14.36,83.33999999999999,17,81.64999999999999C18.56,80.64999999999999,32.12,72.28999999999999,38.75,67.49999999999999"/>
<path id="地-s4"  class="stroke" stroke="#09bfbf" d="M41,53.06C43.12,53.75,45.88,53.75,48.38,53.02C59.72,49.68000000000001,77.85,43.39,85.5,40.760000000000005C89.01,39.550000000000004,90.75,41.510000000000005,90.26,44.370000000000005C89.33,49.77,86.92,56.220000000000006,85,60.260000000000005C82.5,65.51,79.38,63.010000000000005,77.25,60.260000000000005"/>
<path id="地-s5"  class="stroke" stroke="#0909bf" d="M66.25,18C67.44,19.19,68.25,20.88,68.25,22.5C68.25,31,68.32,52.230000000000004,68.13,65.75C68.08999999999999,68.66,68.03999999999999,70.39,68,71.5"/>
<path id="地-s6"  class="stroke" stroke="#bf09bf" d="M49.49,37.62C50.75,38.879999999999995,51.510000000000005,40.75,51.510000000000005,42.47C51.510000000000005,51.04,51.13,63.25,51.13,70.5C51.13,87,52,89.5,73.5,89.5C93.5,89.5,94.14,87.75,94.14,76.43"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="地-bg1"  class="badge-group"><circle cx="11.5" cy="49.5" r="3.5" fill="#bf0909"/><text class="num-single" x="11.5" y="49.5" dx="0" dy="-0.5">1</text></g>
<g id="地-bg2"  class="badge-group"><circle cx="25.37" cy="26.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="25.37" y="26.25" dx="0" dy="-0.5">2</text></g>
<g id="地-bg3"  class="badge-group"><circle cx="11" cy="82.02" r="3.5" fill="#09bf09"/><text class="num-single" x="11" y="82.02" dx="0" dy="-0.5">3</text></g>
<g id="地-bg4"  class="badge-group"><circle cx="41" cy="53.06" r="3.5" fill="#09bfbf"/><text class="num-single" x="41" y="53.06" dx="0" dy="-0.5">4</text></g>
<g id="地-bg5"  class="badge-group"><circle cx="66.25" cy="18" r="3.5" fill="#0909bf"/><text class="num-single" x="66.25" y="18" dx="0" dy="-0.5">5</text></g>
<g id="地-bg6"  class="badge-group"><circle cx="49.49" cy="37.62" r="3.5" fill="#bf09bf"/><text class="num-single" x="49.49" y="37.62" dx="0" dy="-0.5">6</text></g>
</svg>