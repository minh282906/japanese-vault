<path id="豊-s1"  class="stroke" stroke="#bf0909" d="M25.4,23C26.009999999999998,23.61,26.549999999999997,24.68,26.689999999999998,25.48C27.5,30,28.83,38.13,30.03,44.7C30.43,46.910000000000004,30.59,48.93000000000001,30.720000000000002,49.75"/>
