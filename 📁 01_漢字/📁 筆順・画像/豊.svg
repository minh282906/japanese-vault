<path id="豊-s9"  class="stroke" stroke="#0941bf" d="M34.06,67.51C45,66.25,66.19,64.01,72.62,63.89000000000001C75.28,63.84000000000001,76.08,65.41000000000001,75.48,67.68C74.41000000000001,71.76,73.75,72.99000000000001,72.34,77.78"/>
<path id="豊-s10"  class="stroke" stroke="#2509bf" d="M36.73,81.27C42.68,81.27,59.72,79.41,70.5,78.78999999999999C72.35,78.67999999999999,74.01,78.60999999999999,75.42,78.6"/>
<path id="豊-s11"  class="stroke" stroke="#7909bf" d="M40,84.12C41.43,85.93,43.7,91.56,44.06,94.38000000000001"/>
<path id="豊-s12"  class="stroke" stroke="#bf09b1" d="M68,82.75C68.22,83.37,68.1,84.35,67.97,84.7C67.02,87.43,66.14,89.68,63.72,93.63"/>
<path id="豊-s13"  class="stroke" stroke="#bf095d" d="M14.88,97.36C17.1,98.03,21.18,98.14,23.41,98.03C46.56,96.9,61.22,96.23,85.85,95.76C89.55,95.69000000000001,91.78,96.08,93.63,96.42"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="豊-bg1"  class="badge-group"><circle cx="25.4" cy="19.5" r="3.5" fill="#bf0909"/><text class="num-single" x="25.4" y="19.5" dx="0" dy="-0.5">1</text></g>
