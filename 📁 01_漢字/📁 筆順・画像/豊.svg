<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (豊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #豊-bg[i]: Thời gian quả bóng số nảy lên
   - #豊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#豊-bg1  { animation-delay: 0.05s; }
#豊-s1   { stroke-dasharray: 27.4373; stroke-dashoffset: 27.4373; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#豊-bg2  { animation-delay: 0.42s; }
#豊-s2   { stroke-dasharray: 80.4034; stroke-dashoffset: 80.4034; animation: drawStroke 0.44s ease-out 0.55s forwards; }
#豊-bg3  { animation-delay: 1.01s; }
#豊-s3   { stroke-dasharray: 34.4056; stroke-dashoffset: 34.4056; animation: drawStroke 0.22s ease-out 1.14s forwards; }
#豊-bg4  { animation-delay: 1.38s; }
#豊-s4   { stroke-dasharray: 35.0384; stroke-dashoffset: 35.0384; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#豊-bg5  { animation-delay: 1.75s; }
#豊-s5   { stroke-dasharray: 49.5278; stroke-dashoffset: 49.5278; animation: drawStroke 0.27s ease-out 1.88s forwards; }
#豊-bg6  { animation-delay: 2.17s; }
#豊-s6   { stroke-dasharray: 43.8469; stroke-dashoffset: 43.8469; animation: drawStroke 0.24s ease-out 2.30s forwards; }
#豊-bg7  { animation-delay: 2.56s; }
#豊-s7   { stroke-dasharray: 72.7362; stroke-dashoffset: 72.7362; animation: drawStroke 0.40s ease-out 2.69s forwards; }
#豊-bg8  { animation-delay: 3.11s; }
#豊-s8   { stroke-dasharray: 18.0966; stroke-dashoffset: 18.0966; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#豊-bg9  { animation-delay: 3.48s; }
#豊-s9   { stroke-dasharray: 55.1392; stroke-dashoffset: 55.1392; animation: drawStroke 0.30s ease-out 3.61s forwards; }
#豊-bg10  { animation-delay: 3.93s; }
#豊-s10   { stroke-dasharray: 38.7894; stroke-dashoffset: 38.7894; animation: drawStroke 0.22s ease-out 4.06s forwards; }
#豊-bg11  { animation-delay: 4.30s; }
#豊-s11   { stroke-dasharray: 11.1082; stroke-dashoffset: 11.1082; animation: drawStroke 0.22s ease-out 4.43s forwards; }
#豊-bg12  { animation-delay: 4.67s; }
#豊-s12   { stroke-dasharray: 11.8911; stroke-dashoffset: 11.8911; animation: drawStroke 0.22s ease-out 4.80s forwards; }
#豊-bg13  { animation-delay: 5.04s; }
#豊-s13   { stroke-dasharray: 78.8945; stroke-dashoffset: 78.8945; animation: drawStroke 0.43s ease-out 5.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

