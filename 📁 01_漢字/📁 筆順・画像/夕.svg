<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (夕)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #夕-bg[i]: Thời gian quả bóng số nảy lên
   - #夕-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#夕-bg1  { animation-delay: 0.05s; }
#夕-s1   { stroke-dasharray: 45.1526; stroke-dashoffset: 45.1526; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#夕-bg2  { animation-delay: 0.45s; }
#夕-s2   { stroke-dasharray: 127.6780; stroke-dashoffset: 127.6780; animation: drawStroke 0.55s ease-out 0.58s forwards; }
#夕-bg3  { animation-delay: 1.15s; }
#夕-s3   { stroke-dasharray: 18.7640; stroke-dashoffset: 18.7640; animation: drawStroke 0.22s ease-out 1.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #夕-s[i]) -->
<path id="夕-s1"  class="stroke" stroke="#bf0909" d="M52.99,13.14C53.25,14.75,52.99,16.61,52.5,17.75C49,26,41.38,39.25,27.56,48.97"/>
<path id="夕-s2"  class="stroke" stroke="#09bf09" d="M54,23.5C55.75,24,57.47,24.1,58.78,23.83C64,22.75,69.75,21.25,76.34,19.25C80.60000000000001,17.96,82.48,19.8,80.75,23.78C70,48.5,48.62,78.38,17.75,93"/>
<path id="夕-s3"  class="stroke" stroke="#0909bf" d="M45.25,42.62C50.09,44.98,57.29,51.81999999999999,58.5,55.5"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="夕-bg1"  class="badge-group"><circle cx="52.99" cy="13.14" r="3.5" fill="#bf0909"/><text class="num-single" x="52.99" y="13.14" dx="0" dy="-0.5">1</text></g>
<g id="夕-bg2"  class="badge-group"><circle cx="54" cy="23.5" r="3.5" fill="#09bf09"/><text class="num-single" x="54" y="23.5" dx="0" dy="-0.5">2</text></g>
<g id="夕-bg3"  class="badge-group"><circle cx="45.25" cy="42.62" r="3.5" fill="#0909bf"/><text class="num-single" x="45.25" y="42.62" dx="0" dy="-0.5">3</text></g>
</svg>