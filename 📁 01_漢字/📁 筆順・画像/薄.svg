<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (薄)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #薄-bg[i]: Thời gian quả bóng số nảy lên
   - #薄-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#薄-bg1  { animation-delay: 0.05s; }
#薄-s1   { stroke-dasharray: 67.8519; stroke-dashoffset: 67.8519; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#薄-bg2  { animation-delay: 0.57s; }
#薄-s2   { stroke-dasharray: 17.9784; stroke-dashoffset: 17.9784; animation: drawStroke 0.22s ease-out 0.70s forwards; }
#薄-bg3  { animation-delay: 0.94s; }
#薄-s3   { stroke-dasharray: 13.9811; stroke-dashoffset: 13.9811; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#薄-bg4  { animation-delay: 1.31s; }
#薄-s4   { stroke-dasharray: 12.1257; stroke-dashoffset: 12.1257; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#薄-bg5  { animation-delay: 1.68s; }
#薄-s5   { stroke-dasharray: 13.2549; stroke-dashoffset: 13.2549; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#薄-bg6  { animation-delay: 2.05s; }
#薄-s6   { stroke-dasharray: 19.3486; stroke-dashoffset: 19.3486; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#薄-bg7  { animation-delay: 2.42s; }
#薄-s7   { stroke-dasharray: 36.8365; stroke-dashoffset: 36.8365; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#薄-bg8  { animation-delay: 2.79s; }
#薄-s8   { stroke-dasharray: 20.6902; stroke-dashoffset: 20.6902; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#薄-bg9  { animation-delay: 3.16s; }
#薄-s9   { stroke-dasharray: 55.6484; stroke-dashoffset: 55.6484; animation: drawStroke 0.31s ease-out 3.29s forwards; }
#薄-bg10  { animation-delay: 3.62s; }
#薄-s10   { stroke-dasharray: 33.8748; stroke-dashoffset: 33.8748; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#薄-bg11  { animation-delay: 3.99s; }
#薄-s11   { stroke-dasharray: 30.6762; stroke-dashoffset: 30.6762; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#薄-bg12  { animation-delay: 4.36s; }
#薄-s12   { stroke-dasharray: 32.2941; stroke-dashoffset: 32.2941; animation: drawStroke 0.22s ease-out 4.49s forwards; }
#薄-bg13  { animation-delay: 4.73s; }
#薄-s13   { stroke-dasharray: 12.3750; stroke-dashoffset: 12.3750; animation: drawStroke 0.22s ease-out 4.86s forwards; }
#薄-bg14  { animation-delay: 5.10s; }
#薄-s14   { stroke-dasharray: 59.4342; stroke-dashoffset: 59.4342; animation: drawStroke 0.33s ease-out 5.23s forwards; }
#薄-bg15  { animation-delay: 5.58s; }
#薄-s15   { stroke-dasharray: 39.8496; stroke-dashoffset: 39.8496; animation: drawStroke 0.22s ease-out 5.71s forwards; }
#薄-bg16  { animation-delay: 5.95s; }
#薄-s16   { stroke-dasharray: 10.0853; stroke-dashoffset: 10.0853; animation: drawStroke 0.22s ease-out 6.08s forwards; }
]]>
</style>

