<g id="宿-bg9"  class="badge-group"><circle cx="50.98" cy="64.94" r="3.5" fill="#4b09bf"/><text class="num-single" x="50.98" y="64.94" dx="0" dy="-0.5">9</text></g>
<g id="宿-bg10" class="badge-group"><circle cx="51.08" cy="76.19" r="3.5" fill="#ae09bf"/><text class="num-double" x="51.08" y="76.19" dx="-0.4" dy="-0.475">10</text></g>
<g id="宿-bg11" class="badge-group"><circle cx="50.97" cy="93.8" r="3.5" fill="#bf096c"/><text class="num-double" x="50.97" y="93.8" dx="-0.4" dy="-0.475">11</text></g>
</svg>