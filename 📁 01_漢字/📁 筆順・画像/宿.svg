<path id="宿-s5"  class="stroke" stroke="#09bf2a" d="M25.71,59.44C26.7,60.43,27.36,61.75,27.36,63.5C27.36,73.43,27.259999999999998,86.85,27.22,94.75C27.209999999999997,96.3,27.209999999999997,97.63,27.209999999999997,98.69"/>
<path id="宿-s6"  class="stroke" stroke="#09bf8d" d="M43.62,44.56C45.879999999999995,45.120000000000005,48.709999999999994,44.81,51.15,44.510000000000005C59.96,43.400000000000006,71.75,41.75000000000001,81.5,40.830000000000005C83.79,40.61000000000001,86.03,40.59,88.29,41.03000000000001"/>
<path id="宿-s7"  class="stroke" stroke="#098dbf" d="M64.17,45.27C64.53,46.07,64.55,46.86000000000001,64.25,47.650000000000006C63.71,50.02,62.38,53.120000000000005,59.53,58.13000000000001"/>
<path id="宿-s8"  class="stroke" stroke="#092abf" d="M48.26,59.41C49.18,60.33,49.879999999999995,61.849999999999994,49.9,63.13999999999999C49.99,71.66,49.839999999999996,83.74,49.79,92.88C49.78,94.32,49.78,95.67999999999999,49.78,96.94"/>
<path id="宿-s9"  class="stroke" stroke="#4b09bf" d="M50.98,61.44C53.97,61.29,73.72999999999999,58.849999999999994,78.88,58.36C82.14,58.05,84.05,59.3,83.83,62.64C83.37,69.63,82.28999999999999,81.1,81.86,90.38C81.78,91.99,81.73,93.47,81.69,94.77"/>
<path id="宿-s10"  class="stroke" stroke="#ae09bf" d="M51.08,76.19C62.75,75.12,72.88,73.87,81.81,73.53999999999999"/>
<path id="宿-s11"  class="stroke" stroke="#bf096c" d="M50.97,93.8C61.51,93.16,70.87,92.11999999999999,80.65,91.59"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="宿-bg1"  class="badge-group"><circle cx="53.25" cy="10.5" r="3.5" fill="#bf0909"/><text class="num-single" x="53.25" y="10.5" dx="0" dy="-0.5">1</text></g>
<g id="宿-bg2"  class="badge-group"><circle cx="21.75" cy="21.25" r="3.5" fill="#bf6c09"/><text class="num-single" x="21.75" y="21.25" dx="0" dy="-0.5">2</text></g>
