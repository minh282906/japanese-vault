<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (宿)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #宿-bg[i]: Thời gian quả bóng số nảy lên
   - #宿-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#宿-bg1  { animation-delay: 0.05s; }
#宿-s1   { stroke-dasharray: 13.0711; stroke-dashoffset: 13.0711; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#宿-bg2  { animation-delay: 0.42s; }
#宿-s2   { stroke-dasharray: 18.3739; stroke-dashoffset: 18.3739; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#宿-bg3  { animation-delay: 0.79s; }
#宿-s3   { stroke-dasharray: 80.5245; stroke-dashoffset: 80.5245; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#宿-bg4  { animation-delay: 1.38s; }
#宿-s4   { stroke-dasharray: 40.7991; stroke-dashoffset: 40.7991; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#宿-bg5  { animation-delay: 1.75s; }
#宿-s5   { stroke-dasharray: 39.6944; stroke-dashoffset: 39.6944; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#宿-bg6  { animation-delay: 2.12s; }
#宿-s6   { stroke-dasharray: 44.9616; stroke-dashoffset: 44.9616; animation: drawStroke 0.25s ease-out 2.25s forwards; }
#宿-bg7  { animation-delay: 2.52s; }
#宿-s7   { stroke-dasharray: 13.9785; stroke-dashoffset: 13.9785; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#宿-bg8  { animation-delay: 2.89s; }
#宿-s8   { stroke-dasharray: 37.9648; stroke-dashoffset: 37.9648; animation: drawStroke 0.22s ease-out 3.02s forwards; }
#宿-bg9  { animation-delay: 3.26s; }
#宿-s9   { stroke-dasharray: 68.0782; stroke-dashoffset: 68.0782; animation: drawStroke 0.37s ease-out 3.39s forwards; }
#宿-bg10  { animation-delay: 3.78s; }
#宿-s10   { stroke-dasharray: 30.8484; stroke-dashoffset: 30.8484; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#宿-bg11  { animation-delay: 4.15s; }
#宿-s11   { stroke-dasharray: 29.7631; stroke-dashoffset: 29.7631; animation: drawStroke 0.22s ease-out 4.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #宿-s[i]) -->
<path id="宿-s1"  class="stroke" stroke="#bf0909" d="M53.25,10.5C54.25,11.5,54.99,13.03,54.96,14.27C54.87,18.169999999999998,54.86,20.5,54.86,23.1"/>
