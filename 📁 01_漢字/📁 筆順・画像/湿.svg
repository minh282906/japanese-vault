<g id="湿-bg7"  class="badge-group"><circle cx="48.64" cy="45.48" r="3.5" fill="#09bfbf"/><text class="num-single" x="48.64" y="45.48" dx="0" dy="-0.5">7</text></g>
<g id="湿-bg8"  class="badge-group"><circle cx="58.94" cy="52.38" r="3.5" fill="#0964bf"/><text class="num-single" x="58.94" y="52.38" dx="0" dy="-0.5">8</text></g>
<g id="湿-bg9"  class="badge-group"><circle cx="72.23" cy="51.6" r="3.5" fill="#0909bf"/><text class="num-single" x="72.23" y="51.6" dx="0" dy="-0.5">9</text></g>
<g id="湿-bg10" class="badge-group"><circle cx="44.08" cy="66.45" r="3.5" fill="#6409bf"/><text class="num-double" x="44.08" y="66.45" dx="-0.4" dy="-0.475">10</text></g>
<g id="湿-bg11" class="badge-group"><circle cx="90.99" cy="62" r="3.5" fill="#bf09bf"/><text class="num-double" x="90.99" y="62" dx="-0.4" dy="-0.475">11</text></g>
<g id="湿-bg12" class="badge-group"><circle cx="37.34" cy="92.25" r="3.5" fill="#bf0964"/><text class="num-double" x="37.34" y="92.25" dx="-0.4" dy="-0.475">12</text></g>
</svg>