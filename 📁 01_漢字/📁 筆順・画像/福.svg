<path id="福-s9"  class="stroke" stroke="#0941bf" d="M50.61,60.29C51.53,61.21,51.97,62.43,52.19,63.76C53.14,69.5,53.839999999999996,79.42,54.44,88.37C54.559999999999995,90.22,54.69,92.03,54.8,93.75"/>
<path id="福-s10"  class="stroke" stroke="#2509bf" d="M52.49,62.45C64.82000000000001,60.67,80.07,58.900000000000006,88.51,58.160000000000004C92.25,57.830000000000005,95.24000000000001,58.21,94.69,62.64C94.02,68.13,92.44,78.63,90.82,87.5C90.53999999999999,89.02,90.27,90.49,89.99,91.88"/>
<path id="福-s11"  class="stroke" stroke="#7909bf" d="M71.14,62.28C71.99,63.13,72.35,64.39,72.35,66C72.35,74.12,72.53999999999999,84.12,72.53999999999999,88.88"/>
