<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (福)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #福-bg[i]: Thời gian quả bóng số nảy lên
   - #福-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#福-bg1  { animation-delay: 0.05s; }
#福-s1   { stroke-dasharray: 12.0426; stroke-dashoffset: 12.0426; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#福-bg2  { animation-delay: 0.42s; }
#福-s2   { stroke-dasharray: 71.1175; stroke-dashoffset: 71.1175; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#福-bg3  { animation-delay: 0.96s; }
#福-s3   { stroke-dasharray: 41.4593; stroke-dashoffset: 41.4593; animation: drawStroke 0.23s ease-out 1.09s forwards; }
#福-bg4  { animation-delay: 1.34s; }
#福-s4   { stroke-dasharray: 13.2893; stroke-dashoffset: 13.2893; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#福-bg5  { animation-delay: 1.71s; }
#福-s5   { stroke-dasharray: 40.6748; stroke-dashoffset: 40.6748; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#福-bg6  { animation-delay: 2.08s; }
#福-s6   { stroke-dasharray: 18.7571; stroke-dashoffset: 18.7571; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#福-bg7  { animation-delay: 2.45s; }
#福-s7   { stroke-dasharray: 46.3779; stroke-dashoffset: 46.3779; animation: drawStroke 0.26s ease-out 2.58s forwards; }
#福-bg8  { animation-delay: 2.86s; }
#福-s8   { stroke-dasharray: 28.8939; stroke-dashoffset: 28.8939; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#福-bg9  { animation-delay: 3.23s; }
#福-s9   { stroke-dasharray: 33.9891; stroke-dashoffset: 33.9891; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#福-bg10  { animation-delay: 3.60s; }
#福-s10   { stroke-dasharray: 75.2718; stroke-dashoffset: 75.2718; animation: drawStroke 0.41s ease-out 3.73s forwards; }
#福-bg11  { animation-delay: 4.16s; }
#福-s11   { stroke-dasharray: 26.8972; stroke-dashoffset: 26.8972; animation: drawStroke 0.22s ease-out 4.29s forwards; }
#福-bg12  { animation-delay: 4.53s; }
#福-s12   { stroke-dasharray: 38.1299; stroke-dashoffset: 38.1299; animation: drawStroke 0.22s ease-out 4.66s forwards; }
#福-bg13  { animation-delay: 4.90s; }
#福-s13   { stroke-dasharray: 33.8584; stroke-dashoffset: 33.8584; animation: drawStroke 0.22s ease-out 5.03s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

