<path id="集-s6"  class="stroke" stroke="#09bf64" d="M34.86,36.09C40.92,35.620000000000005,61.17,33.980000000000004,71.13,33.14C73.83,32.910000000000004,75.77,32.75,76.47999999999999,32.68"/>
<path id="集-s7"  class="stroke" stroke="#09bfbf" d="M34.93,46.67C41.63,46.25,62.76,44.46,72.25,43.7C74.26,43.540000000000006,75.71,43.42,76.32,43.370000000000005"/>
<path id="集-s8"  class="stroke" stroke="#0964bf" d="M35.07,57.56C41.66,56.980000000000004,67.6,55.150000000000006,79.15,54.260000000000005C81.89,54.050000000000004,83.82000000000001,53.89000000000001,84.49000000000001,53.82000000000001"/>
<path id="集-s9"  class="stroke" stroke="#0909bf" d="M14.25,71.5C17.5,72.12,21.82,71.96,25.14,71.66C43.62,70,67,68.25,85.36,67.56C88.23,67.45,91.67,67.52,94.5,68"/>
<path id="集-s10"  class="stroke" stroke="#6409bf" d="M53,58.25C54,59.25,54.5,60.63,54.5,61.75C54.5,62.58,54.5,83.84,54.5,95.5C54.5,98.28,54.5,99.58,54.5,101"/>
<path id="集-s11"  class="stroke" stroke="#bf09bf" d="M51.5,70.66C51.5,71.5,50.9,72.59,50.25,73.34C43.08,81.61,28.67,91.84,16.75,96.25"/>
<path id="集-s12"  class="stroke" stroke="#bf0964" d="M56.5,71.25C62.06,76.03,74.82,84.95,83.82,90.07C86.61,91.64999999999999,89.25,93.33999999999999,92.25,94.11999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="集-bg1"  class="badge-group"><circle cx="38.12" cy="10" r="3.5" fill="#bf0909"/><text class="num-single" x="38.12" y="10" dx="0" dy="-0.5">1</text></g>
