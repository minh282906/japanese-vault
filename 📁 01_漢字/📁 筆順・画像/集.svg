<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (集)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #集-bg[i]: Thời gian quả bóng số nảy lên
   - #集-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#集-bg1  { animation-delay: 0.05s; }
#集-s1   { stroke-dasharray: 31.4983; stroke-dashoffset: 31.4983; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#集-bg2  { animation-delay: 0.42s; }
#集-s2   { stroke-dasharray: 37.5240; stroke-dashoffset: 37.5240; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#集-bg3  { animation-delay: 0.79s; }
#集-s3   { stroke-dasharray: 15.3554; stroke-dashoffset: 15.3554; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#集-bg4  { animation-delay: 1.16s; }
#集-s4   { stroke-dasharray: 46.4248; stroke-dashoffset: 46.4248; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#集-bg5  { animation-delay: 1.57s; }
#集-s5   { stroke-dasharray: 30.3502; stroke-dashoffset: 30.3502; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#集-bg6  { animation-delay: 1.94s; }
#集-s6   { stroke-dasharray: 41.7595; stroke-dashoffset: 41.7595; animation: drawStroke 0.23s ease-out 2.07s forwards; }
#集-bg7  { animation-delay: 2.32s; }
#集-s7   { stroke-dasharray: 41.5215; stroke-dashoffset: 41.5215; animation: drawStroke 0.23s ease-out 2.45s forwards; }
#集-bg8  { animation-delay: 2.70s; }
#集-s8   { stroke-dasharray: 49.5616; stroke-dashoffset: 49.5616; animation: drawStroke 0.27s ease-out 2.83s forwards; }
#集-bg9  { animation-delay: 3.12s; }
#集-s9   { stroke-dasharray: 80.4535; stroke-dashoffset: 80.4535; animation: drawStroke 0.44s ease-out 3.25s forwards; }
#集-bg10  { animation-delay: 3.71s; }
#集-s10   { stroke-dasharray: 43.1510; stroke-dashoffset: 43.1510; animation: drawStroke 0.24s ease-out 3.84s forwards; }
#集-bg11  { animation-delay: 4.10s; }
#集-s11   { stroke-dasharray: 43.9328; stroke-dashoffset: 43.9328; animation: drawStroke 0.24s ease-out 4.23s forwards; }
#集-bg12  { animation-delay: 4.49s; }
#集-s12   { stroke-dasharray: 42.5922; stroke-dashoffset: 42.5922; animation: drawStroke 0.23s ease-out 4.62s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

