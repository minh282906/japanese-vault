<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (脳)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #脳-bg[i]: Thời gian quả bóng số nảy lên
   - #脳-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#脳-bg1  { animation-delay: 0.05s; }
#脳-s1   { stroke-dasharray: 70.0057; stroke-dashoffset: 70.0057; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#脳-bg2  { animation-delay: 0.59s; }
#脳-s2   { stroke-dasharray: 94.1957; stroke-dashoffset: 94.1957; animation: drawStroke 0.52s ease-out 0.72s forwards; }
#脳-bg3  { animation-delay: 1.26s; }
#脳-s3   { stroke-dasharray: 15.8738; stroke-dashoffset: 15.8738; animation: drawStroke 0.22s ease-out 1.39s forwards; }
#脳-bg4  { animation-delay: 1.63s; }
#脳-s4   { stroke-dasharray: 16.5390; stroke-dashoffset: 16.5390; animation: drawStroke 0.22s ease-out 1.76s forwards; }
#脳-bg5  { animation-delay: 2.00s; }
#脳-s5   { stroke-dasharray: 16.1498; stroke-dashoffset: 16.1498; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#脳-bg6  { animation-delay: 2.37s; }
#脳-s6   { stroke-dasharray: 18.0830; stroke-dashoffset: 18.0830; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#脳-bg7  { animation-delay: 2.74s; }
#脳-s7   { stroke-dasharray: 21.8656; stroke-dashoffset: 21.8656; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#脳-bg8  { animation-delay: 3.11s; }
#脳-s8   { stroke-dasharray: 40.1253; stroke-dashoffset: 40.1253; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#脳-bg9  { animation-delay: 3.48s; }
#脳-s9   { stroke-dasharray: 29.9538; stroke-dashoffset: 29.9538; animation: drawStroke 0.22s ease-out 3.61s forwards; }
#脳-bg10  { animation-delay: 3.85s; }
#脳-s10   { stroke-dasharray: 69.1955; stroke-dashoffset: 69.1955; animation: drawStroke 0.38s ease-out 3.98s forwards; }
#脳-bg11  { animation-delay: 4.38s; }
#脳-s11   { stroke-dasharray: 35.1453; stroke-dashoffset: 35.1453; animation: drawStroke 0.22s ease-out 4.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #脳-s[i]) -->
<path id="脳-s1"  class="stroke" stroke="#bf0909" d="M20.57,22.42C21.330000000000002,23.180000000000003,21.57,24.450000000000003,21.6,25.340000000000003C22.580000000000002,57.38,19.990000000000002,81.66,12.000000000000002,90.42"/>
<path id="脳-s2"  class="stroke" stroke="#bf6c09" d="M22.38,23.94C25.369999999999997,23.37,35.32,21.290000000000003,36.85,21.09C38.63,20.87,39.79,22.33,39.79,23.63C39.79,26.7,39.769999999999996,67.88,39.769999999999996,85.34C39.769999999999996,96.02000000000001,33.97,88.72,32.209999999999994,87.28"/>
<path id="脳-s3"  class="stroke" stroke="#aebf09" d="M22.88,40.25C27.41,39.91,34.68,38.52,38.65,38.5"/>
<path id="脳-s4"  class="stroke" stroke="#4bbf09" d="M22.33,57.12C26.049999999999997,57.04,33.76,56.15,38.81,55.75"/>
<path id="脳-s5"  class="stroke" stroke="#09bf2a" d="M47,27.36C50.76,31.79,53.88,37.629999999999995,55.08,41.25"/>
<path id="脳-s6"  class="stroke" stroke="#09bf8d" d="M63.82,20.25C66.5,23.63,70.25,30.75,71.47,36.5"/>
<path id="脳-s7"  class="stroke" stroke="#098dbf" d="M92.86,17.5C93.37,18.75,93.12,20.25,92.21,21.64C89.39999999999999,25.94,87.36999999999999,28.880000000000003,82.16,35.97"/>
<path id="脳-s8"  class="stroke" stroke="#092abf" d="M80.72,46.18C81.09,46.93,81.21,48.03,80.66,49.35C75.67,61.24,68.25,70.95,57.51,77.17"/>
<path id="脳-s9"  class="stroke" stroke="#4b09bf" d="M60.26,54.97C67.44,57.99,78.02,68.05,81.77,75.23"/>
<path id="脳-s10"  class="stroke" stroke="#ae09bf" d="M49.56,59.31C50.25,60,50.620000000000005,61.25,50.6,62.43C50.52,65.87,50.74,79.73,50.54,84.99C50.48,86.72999999999999,50.18,88.17,52.4,88.03C60.83,87.53,86.36,85.31,91.18,85.03"/>
<path id="脳-s11"  class="stroke" stroke="#bf096c" d="M93.05,54.56C93.81,55.32,94,56.620000000000005,93.84,58.43C93.5,62.1,92.34,74.73,91.59,83.49C91.38000000000001,85.94,91.2,88.00999999999999,91.08,89.38"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="脳-bg1"  class="badge-group"><circle cx="20.57" cy="18.92" r="3.5" fill="#bf0909"/><text class="num-single" x="20.57" y="18.92" dx="0" dy="-0.5">1</text></g>
<g id="脳-bg2"  class="badge-group"><circle cx="22.38" cy="27.44" r="3.5" fill="#bf6c09"/><text class="num-single" x="22.38" y="27.44" dx="0" dy="-0.5">2</text></g>
