<g id="脳-bg10" class="badge-group"><circle cx="49.56" cy="59.31" r="3.5" fill="#ae09bf"/><text class="num-double" x="49.56" y="59.31" dx="-0.4" dy="-0.475">10</text></g>
<g id="脳-bg11" class="badge-group"><circle cx="93.05" cy="54.56" r="3.5" fill="#bf096c"/><text class="num-double" x="93.05" y="54.56" dx="-0.4" dy="-0.475">11</text></g>
</svg>