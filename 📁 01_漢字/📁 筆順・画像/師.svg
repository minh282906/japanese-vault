<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (師)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #師-bg[i]: Thời gian quả bóng số nảy lên
   - #師-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#師-bg1  { animation-delay: 0.05s; }
#師-s1   { stroke-dasharray: 24.0111; stroke-dashoffset: 24.0111; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#師-bg2  { animation-delay: 0.42s; }
#師-s2   { stroke-dasharray: 57.3724; stroke-dashoffset: 57.3724; animation: drawStroke 0.32s ease-out 0.55s forwards; }
#師-bg3  { animation-delay: 0.89s; }
#師-s3   { stroke-dasharray: 40.6010; stroke-dashoffset: 40.6010; animation: drawStroke 0.22s ease-out 1.02s forwards; }
#師-bg4  { animation-delay: 1.26s; }
#師-s4   { stroke-dasharray: 23.3506; stroke-dashoffset: 23.3506; animation: drawStroke 0.22s ease-out 1.39s forwards; }
#師-bg5  { animation-delay: 1.63s; }
#師-s5   { stroke-dasharray: 40.6305; stroke-dashoffset: 40.6305; animation: drawStroke 0.22s ease-out 1.76s forwards; }
#師-bg6  { animation-delay: 2.00s; }
#師-s6   { stroke-dasharray: 23.7662; stroke-dashoffset: 23.7662; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#師-bg7  { animation-delay: 2.37s; }
#師-s7   { stroke-dasharray: 48.2435; stroke-dashoffset: 48.2435; animation: drawStroke 0.27s ease-out 2.50s forwards; }
#師-bg8  { animation-delay: 2.79s; }
#師-s8   { stroke-dasharray: 36.0054; stroke-dashoffset: 36.0054; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#師-bg9  { animation-delay: 3.16s; }
#師-s9   { stroke-dasharray: 82.4126; stroke-dashoffset: 82.4126; animation: drawStroke 0.45s ease-out 3.29s forwards; }
#師-bg10  { animation-delay: 3.76s; }
#師-s10   { stroke-dasharray: 78.6153; stroke-dashoffset: 78.6153; animation: drawStroke 0.43s ease-out 3.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #師-s[i]) -->
<path id="師-s1"  class="stroke" stroke="#bf0909" d="M33.01,12.39C33.15,13.780000000000001,32.98,15.25,32.1,16.44C29,20.62,23.75,25.5,17.64,29.8"/>
<path id="師-s2"  class="stroke" stroke="#bf7609" d="M15.04,31C16.02,31.98,16.5,33.5,16.5,34.75C16.5,35.61,16.38,67,16.38,81.77000000000001C16.38,84.47000000000001,16.279999999999998,85.63000000000001,16.279999999999998,88.00000000000001"/>
<path id="師-s3"  class="stroke" stroke="#9abf09" d="M16.89,35.09C24.22,33.93000000000001,36.06,32.400000000000006,39.84,32.010000000000005C41.220000000000006,31.870000000000005,42.050000000000004,33.45,41.86000000000001,34.300000000000004C41.040000000000006,37.78,39.75000000000001,40.75000000000001,38.35000000000001,47.81"/>
<path id="師-s4"  class="stroke" stroke="#2dbf09" d="M17.05,51.29C26.42,50.339999999999996,31.880000000000003,49.43,36.519999999999996,48.87C37.8,48.72,39.01,48.589999999999996,40.23,48.489999999999995"/>
<path id="師-s5"  class="stroke" stroke="#09bf52" d="M16.98,66.07C26.380000000000003,64.75,35.14,63.14999999999999,39.41,62.67999999999999C40.97,62.50999999999999,41.91,64.38,41.69,65.38C40.769999999999996,69.5,40.129999999999995,73,38.73,78.97999999999999"/>
<path id="師-s6"  class="stroke" stroke="#09bfbf" d="M16.92,82.71C20.910000000000004,82.28999999999999,29.480000000000004,81.14999999999999,36.010000000000005,80.44C37.690000000000005,80.25999999999999,39.230000000000004,80.1,40.53,80"/>
<path id="師-s7"  class="stroke" stroke="#0952bf" d="M49,20.39C51.75,21,54.29,20.89,56.49,20.64C64.82000000000001,19.69,80.88,17.880000000000003,90.26,17.130000000000003C92.38000000000001,16.96,95,16.87,97,17.26"/>
<path id="師-s8"  class="stroke" stroke="#2d09bf" d="M52.28,41.16C53.06,41.94,54.02,43.879999999999995,54.02,45.339999999999996C54.02,45.919999999999995,54.17,61.129999999999995,54.17,71.25999999999999C54.17,73.8,54.120000000000005,75.77999999999999,54.1,76.72999999999999"/>
<path id="師-s9"  class="stroke" stroke="#9a09bf" d="M54.48,43.95C65.5,42.620000000000005,82.37,40.120000000000005,90.88999999999999,38.870000000000005C92.86999999999999,38.580000000000005,95.03999999999999,40.370000000000005,95.03999999999999,42.7C95.03999999999999,52.25,95.49999999999999,62.5,94.49,71.93C93.99,76.58000000000001,90.38,74.25,87.53999999999999,70.72000000000001"/>
<path id="師-s10"  class="stroke" stroke="#bf0976" d="M71.36,21.63C72.3,22.57,72.87,24.369999999999997,72.87,25.7C72.87,26.38,72.75,72.63,72.75,92.75C72.75,96.48,72.71,99.05,72.69,99.88"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="師-bg1"  class="badge-group"><circle cx="33.01" cy="12.39" r="3.5" fill="#bf0909"/><text class="num-single" x="33.01" y="12.39" dx="0" dy="-0.5">1</text></g>
<g id="師-bg2"  class="badge-group"><circle cx="15.04" cy="27.5" r="3.5" fill="#bf7609"/><text class="num-single" x="15.04" y="27.5" dx="0" dy="-0.5">2</text></g>
<g id="師-bg3"  class="badge-group"><circle cx="16.89" cy="38.59" r="3.5" fill="#9abf09"/><text class="num-single" x="16.89" y="38.59" dx="0" dy="-0.5">3</text></g>
<g id="師-bg4"  class="badge-group"><circle cx="17.05" cy="51.29" r="3.5" fill="#2dbf09"/><text class="num-single" x="17.05" y="51.29" dx="0" dy="-0.5">4</text></g>
<g id="師-bg5"  class="badge-group"><circle cx="16.98" cy="66.07" r="3.5" fill="#09bf52"/><text class="num-single" x="16.98" y="66.07" dx="0" dy="-0.5">5</text></g>
<g id="師-bg6"  class="badge-group"><circle cx="16.92" cy="82.71" r="3.5" fill="#09bfbf"/><text class="num-single" x="16.92" y="82.71" dx="0" dy="-0.5">6</text></g>
<g id="師-bg7"  class="badge-group"><circle cx="49" cy="20.39" r="3.5" fill="#0952bf"/><text class="num-single" x="49" y="20.39" dx="0" dy="-0.5">7</text></g>
<g id="師-bg8"  class="badge-group"><circle cx="52.28" cy="37.66" r="3.5" fill="#2d09bf"/><text class="num-single" x="52.28" y="37.66" dx="0" dy="-0.5">8</text></g>
<g id="師-bg9"  class="badge-group"><circle cx="54.48" cy="47.45" r="3.5" fill="#9a09bf"/><text class="num-single" x="54.48" y="47.45" dx="0" dy="-0.5">9</text></g>
<g id="師-bg10" class="badge-group"><circle cx="71.36" cy="21.63" r="3.5" fill="#bf0976"/><text class="num-double" x="71.36" y="21.63" dx="-0.4" dy="-0.475">10</text></g>
</svg>