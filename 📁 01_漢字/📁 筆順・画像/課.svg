<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (課)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #課-bg[i]: Thời gian quả bóng số nảy lên
   - #課-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#課-bg1  { animation-delay: 0.05s; }
#課-s1   { stroke-dasharray: 10.7624; stroke-dashoffset: 10.7624; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#課-bg2  { animation-delay: 0.42s; }
#課-s2   { stroke-dasharray: 30.2516; stroke-dashoffset: 30.2516; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#課-bg3  { animation-delay: 0.79s; }
#課-s3   { stroke-dasharray: 19.9170; stroke-dashoffset: 19.9170; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#課-bg4  { animation-delay: 1.16s; }
#課-s4   { stroke-dasharray: 19.2356; stroke-dashoffset: 19.2356; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#課-bg5  { animation-delay: 1.53s; }
#課-s5   { stroke-dasharray: 20.2055; stroke-dashoffset: 20.2055; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#課-bg6  { animation-delay: 1.90s; }
#課-s6   { stroke-dasharray: 35.7908; stroke-dashoffset: 35.7908; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#課-bg7  { animation-delay: 2.27s; }
#課-s7   { stroke-dasharray: 15.8689; stroke-dashoffset: 15.8689; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#課-bg8  { animation-delay: 2.64s; }
#課-s8   { stroke-dasharray: 30.5229; stroke-dashoffset: 30.5229; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#課-bg9  { animation-delay: 3.01s; }
#課-s9   { stroke-dasharray: 66.6051; stroke-dashoffset: 66.6051; animation: drawStroke 0.37s ease-out 3.14s forwards; }
#課-bg10  { animation-delay: 3.53s; }
#課-s10   { stroke-dasharray: 34.6701; stroke-dashoffset: 34.6701; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#課-bg11  { animation-delay: 3.90s; }
#課-s11   { stroke-dasharray: 29.8155; stroke-dashoffset: 29.8155; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#課-bg12  { animation-delay: 4.27s; }
#課-s12   { stroke-dasharray: 50.3784; stroke-dashoffset: 50.3784; animation: drawStroke 0.28s ease-out 4.40s forwards; }
#課-bg13  { animation-delay: 4.70s; }
#課-s13   { stroke-dasharray: 76.2149; stroke-dashoffset: 76.2149; animation: drawStroke 0.42s ease-out 4.83s forwards; }
#課-bg14  { animation-delay: 5.27s; }
#課-s14   { stroke-dasharray: 41.4111; stroke-dashoffset: 41.4111; animation: drawStroke 0.23s ease-out 5.40s forwards; }
#課-bg15  { animation-delay: 5.65s; }
#課-s15   { stroke-dasharray: 41.6822; stroke-dashoffset: 41.6822; animation: drawStroke 0.23s ease-out 5.78s forwards; }
]]>
</style>

