<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (存)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #存-bg[i]: Thời gian quả bóng số nảy lên
   - #存-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#存-bg1  { animation-delay: 0.05s; }
#存-s1   { stroke-dasharray: 66.2932; stroke-dashoffset: 66.2932; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#存-bg2  { animation-delay: 0.56s; }
#存-s2   { stroke-dasharray: 72.6428; stroke-dashoffset: 72.6428; animation: drawStroke 0.40s ease-out 0.69s forwards; }
#存-bg3  { animation-delay: 1.11s; }
#存-s3   { stroke-dasharray: 42.4481; stroke-dashoffset: 42.4481; animation: drawStroke 0.23s ease-out 1.24s forwards; }
#存-bg4  { animation-delay: 1.49s; }
#存-s4   { stroke-dasharray: 47.8853; stroke-dashoffset: 47.8853; animation: drawStroke 0.26s ease-out 1.62s forwards; }
#存-bg5  { animation-delay: 1.90s; }
#存-s5   { stroke-dasharray: 50.7837; stroke-dashoffset: 50.7837; animation: drawStroke 0.28s ease-out 2.03s forwards; }
#存-bg6  { animation-delay: 2.33s; }
#存-s6   { stroke-dasharray: 51.8906; stroke-dashoffset: 51.8906; animation: drawStroke 0.29s ease-out 2.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #存-s[i]) -->
<path id="存-s1"  class="stroke" stroke="#bf0909" d="M22.75,29.55C25.12,30.41,28.42,30.23,30.869999999999997,29.94C42.25,28.630000000000003,65.75,26.5,80.24,25.78C83.03,25.64,86.00999999999999,25.61,88.75,26.21"/>
<path id="存-s2"  class="stroke" stroke="#bfbf09" d="M54.14,11C54.5,12.75,54.28,14.25,53.32,16.89C47.25,33.5,36,56.88,16.5,71.29"/>
<path id="存-s3"  class="stroke" stroke="#09bf09" d="M30.89,54.25C32.01,55.37,32.65,57.13,32.65,58.82C32.65,67.29,32.74,78.14,32.69,90C32.68,92.04,32.68,94.12,32.68,96.25"/>
<path id="存-s4"  class="stroke" stroke="#09bfbf" d="M54.15,43.63C56.019999999999996,44.25,58.58,44.6,60.54,44.29C67.13,43.25,74.12,41.7,77.87,41C79.88000000000001,40.62,80.80000000000001,42.53,79.16000000000001,43.93C76.88000000000001,45.88,69.15,52.55,64.51,56.04"/>
<path id="存-s5"  class="stroke" stroke="#0909bf" d="M64.5,56.04C70.5,61.75,77.12,79,70.72,92.91C68.03999999999999,98.72999999999999,63.25,94.11999999999999,61.79,92.31"/>
<path id="存-s6"  class="stroke" stroke="#bf09bf" d="M43.59,68.39C45.75,69.12,49.080000000000005,69.03,51.38,68.75C59.75,67.74,77.78,65.77,87,65C90.12,64.74,92.88,64.74,95.16,65.44"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="存-bg1"  class="badge-group"><circle cx="22.75" cy="29.55" r="3.5" fill="#bf0909"/><text class="num-single" x="22.75" y="29.55" dx="0" dy="-0.5">1</text></g>
<g id="存-bg2"  class="badge-group"><circle cx="54.14" cy="11" r="3.5" fill="#bfbf09"/><text class="num-single" x="54.14" y="11" dx="0" dy="-0.5">2</text></g>
<g id="存-bg3"  class="badge-group"><circle cx="30.89" cy="54.25" r="3.5" fill="#09bf09"/><text class="num-single" x="30.89" y="54.25" dx="0" dy="-0.5">3</text></g>
<g id="存-bg4"  class="badge-group"><circle cx="54.15" cy="43.63" r="3.5" fill="#09bfbf"/><text class="num-single" x="54.15" y="43.63" dx="0" dy="-0.5">4</text></g>
<g id="存-bg5"  class="badge-group"><circle cx="64.5" cy="56.04" r="3.5" fill="#0909bf"/><text class="num-single" x="64.5" y="56.04" dx="0" dy="-0.5">5</text></g>
<g id="存-bg6"  class="badge-group"><circle cx="43.59" cy="68.39" r="3.5" fill="#bf09bf"/><text class="num-single" x="43.59" y="68.39" dx="0" dy="-0.5">6</text></g>
</svg>