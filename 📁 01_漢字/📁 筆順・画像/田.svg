<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (田)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #田-bg[i]: Thời gian quả bóng số nảy lên
   - #田-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#田-bg1  { animation-delay: 0.05s; }
#田-s1   { stroke-dasharray: 59.4182; stroke-dashoffset: 59.4182; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#田-bg2  { animation-delay: 0.53s; }
#田-s2   { stroke-dasharray: 125.9230; stroke-dashoffset: 125.9230; animation: drawStroke 0.55s ease-out 0.66s forwards; }
#田-bg3  { animation-delay: 1.23s; }
#田-s3   { stroke-dasharray: 51.0477; stroke-dashoffset: 51.0477; animation: drawStroke 0.28s ease-out 1.36s forwards; }
#田-bg4  { animation-delay: 1.66s; }
#田-s4   { stroke-dasharray: 62.5988; stroke-dashoffset: 62.5988; animation: drawStroke 0.34s ease-out 1.79s forwards; }
#田-bg5  { animation-delay: 2.15s; }
#田-s5   { stroke-dasharray: 58.2492; stroke-dashoffset: 58.2492; animation: drawStroke 0.32s ease-out 2.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #田-s[i]) -->
<path id="田-s1"  class="stroke" stroke="#bf0909" d="M18.25,27.48C19.45,28.68,20.36,30.16,20.53,31.43C22,42.25,23.52,62.11,24.81,80C24.98,82.4,25.15,83.75,25.299999999999997,86"/>
<path id="田-s2"  class="stroke" stroke="#9abf09" d="M20.85,29.29C29.37,28.75,70.89,26.119999999999997,82.43,25.24C87.27000000000001,24.869999999999997,89.75,27.25,89.47000000000001,30.869999999999997C88.78000000000002,39.67,86.64000000000001,61.56,85.48000000000002,77.50999999999999C85.30000000000001,79.94999999999999,85.14000000000001,82.25999999999999,85.01000000000002,84.36999999999999"/>
<path id="田-s3"  class="stroke" stroke="#09bf52" d="M53.25,29C54.13,29.88,54.44,31.12,54.44,32.5C54.44,42.019999999999996,54.75,78.87,54.75,79.75"/>
<path id="田-s4"  class="stroke" stroke="#0952bf" d="M24,55.5C29.75,55,79.12,52.25,86.5,52"/>
<path id="田-s5"  class="stroke" stroke="#9a09bf" d="M25.98,83.07C40.75,82.25,65.37,81,84.16,80.24"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="田-bg1"  class="badge-group"><circle cx="18.25" cy="23.98" r="3.5" fill="#bf0909"/><text class="num-single" x="18.25" y="23.98" dx="0" dy="-0.5">1</text></g>
<g id="田-bg2"  class="badge-group"><circle cx="20.85" cy="32.79" r="3.5" fill="#9abf09"/><text class="num-single" x="20.85" y="32.79" dx="0" dy="-0.5">2</text></g>
<g id="田-bg3"  class="badge-group"><circle cx="53.25" cy="29" r="3.5" fill="#09bf52"/><text class="num-single" x="53.25" y="29" dx="0" dy="-0.5">3</text></g>
<g id="田-bg4"  class="badge-group"><circle cx="24" cy="55.5" r="3.5" fill="#0952bf"/><text class="num-single" x="24" y="55.5" dx="0" dy="-0.5">4</text></g>
<g id="田-bg5"  class="badge-group"><circle cx="25.98" cy="83.07" r="3.5" fill="#9a09bf"/><text class="num-single" x="25.98" y="83.07" dx="0" dy="-0.5">5</text></g>
</svg>