<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (利)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #利-bg[i]: Thời gian quả bóng số nảy lên
   - #利-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#利-bg1  { animation-delay: 0.05s; }
#利-s1   { stroke-dasharray: 36.6236; stroke-dashoffset: 36.6236; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#利-bg2  { animation-delay: 0.42s; }
#利-s2   { stroke-dasharray: 43.9112; stroke-dashoffset: 43.9112; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#利-bg3  { animation-delay: 0.81s; }
#利-s3   { stroke-dasharray: 73.0994; stroke-dashoffset: 73.0994; animation: drawStroke 0.40s ease-out 0.94s forwards; }
#利-bg4  { animation-delay: 1.36s; }
#利-s4   { stroke-dasharray: 43.7435; stroke-dashoffset: 43.7435; animation: drawStroke 0.24s ease-out 1.49s forwards; }
#利-bg5  { animation-delay: 1.75s; }
#利-s5   { stroke-dasharray: 15.1819; stroke-dashoffset: 15.1819; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#利-bg6  { animation-delay: 2.12s; }
#利-s6   { stroke-dasharray: 40.6321; stroke-dashoffset: 40.6321; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#利-bg7  { animation-delay: 2.49s; }
#利-s7   { stroke-dasharray: 96.3166; stroke-dashoffset: 96.3166; animation: drawStroke 0.53s ease-out 2.62s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #利-s[i]) -->
<path id="利-s1"  class="stroke" stroke="#bf0909" d="M47.06,12.75C46.88,14,46.21,15.17,45.510000000000005,15.879999999999999C41.75000000000001,19.689999999999998,31.010000000000005,25.53,16.050000000000004,30.46"/>
<path id="利-s2"  class="stroke" stroke="#bfa509" d="M11.87,44.95C14.12,45.620000000000005,16.23,45.6,18.03,45.32C25.26,44.18,41.269999999999996,40.72,49.75,39.79C51.25,39.63,53.75,39.38,55.22,39.56"/>
<path id="利-s3"  class="stroke" stroke="#3dbf09" d="M35.68,25.38C37.02,26.72,37.52,28.5,37.52,30.549999999999997C37.52,35.28,37.57,73.63,37.59,90.63C37.59,94.19999999999999,37.6,96.83,37.6,98.00999999999999"/>
<path id="利-s4"  class="stroke" stroke="#09bf71" d="M36.13,43.18C36.13,44.12,35.53,45.73,35.21,46.519999999999996C30.61,57.8,23.05,71.22,13.61,80.17"/>
<path id="利-s5"  class="stroke" stroke="#0971bf" d="M40.62,51.12C45.419999999999995,53.41,49.489999999999995,57.98,52.08,60.92"/>
<path id="利-s6"  class="stroke" stroke="#3d09bf" d="M66.52,27.33C67.78,28.59,68.28,30,68.28,32.349999999999994C68.28,43.42999999999999,68.27,54.879999999999995,68.26,61.99999999999999C68.26,64.36999999999999,68.26,66.25999999999999,68.26,67.5"/>
<path id="利-s7"  class="stroke" stroke="#bf09a5" d="M90.27,11.33C91.47,12.53,92.03,14.120000000000001,92.03,16.35C92.03,30.910000000000004,91.77,87,91.77,92.22C91.77,104,84.81,93.72,83.31,92.47"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="利-bg1"  class="badge-group"><circle cx="47.06" cy="12.75" r="3.5" fill="#bf0909"/><text class="num-single" x="47.06" y="12.75" dx="0" dy="-0.5">1</text></g>
<g id="利-bg2"  class="badge-group"><circle cx="11.87" cy="44.95" r="3.5" fill="#bfa509"/><text class="num-single" x="11.87" y="44.95" dx="0" dy="-0.5">2</text></g>
<g id="利-bg3"  class="badge-group"><circle cx="35.68" cy="25.38" r="3.5" fill="#3dbf09"/><text class="num-single" x="35.68" y="25.38" dx="0" dy="-0.5">3</text></g>
<g id="利-bg4"  class="badge-group"><circle cx="36.13" cy="43.18" r="3.5" fill="#09bf71"/><text class="num-single" x="36.13" y="43.18" dx="0" dy="-0.5">4</text></g>
<g id="利-bg5"  class="badge-group"><circle cx="40.62" cy="51.12" r="3.5" fill="#0971bf"/><text class="num-single" x="40.62" y="51.12" dx="0" dy="-0.5">5</text></g>
<g id="利-bg6"  class="badge-group"><circle cx="66.52" cy="27.33" r="3.5" fill="#3d09bf"/><text class="num-single" x="66.52" y="27.33" dx="0" dy="-0.5">6</text></g>
<g id="利-bg7"  class="badge-group"><circle cx="90.27" cy="11.33" r="3.5" fill="#bf09a5"/><text class="num-single" x="90.27" y="11.33" dx="0" dy="-0.5">7</text></g>
</svg>