<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (冊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #冊-bg[i]: Thời gian quả bóng số nảy lên
   - #冊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#冊-bg1  { animation-delay: 0.05s; }
#冊-s1   { stroke-dasharray: 76.7215; stroke-dashoffset: 76.7215; animation: drawStroke 0.42s ease-out 0.18s forwards; }
#冊-bg2  { animation-delay: 0.62s; }
#冊-s2   { stroke-dasharray: 135.9340; stroke-dashoffset: 135.9340; animation: drawStroke 0.55s ease-out 0.75s forwards; }
#冊-bg3  { animation-delay: 1.32s; }
#冊-s3   { stroke-dasharray: 68.7898; stroke-dashoffset: 68.7898; animation: drawStroke 0.38s ease-out 1.45s forwards; }
#冊-bg4  { animation-delay: 1.85s; }
#冊-s4   { stroke-dasharray: 70.8162; stroke-dashoffset: 70.8162; animation: drawStroke 0.39s ease-out 1.98s forwards; }
#冊-bg5  { animation-delay: 2.39s; }
#冊-s5   { stroke-dasharray: 85.7646; stroke-dashoffset: 85.7646; animation: drawStroke 0.47s ease-out 2.52s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #冊-s[i]) -->
<path id="冊-s1"  class="stroke" stroke="#bf0909" d="M27.19,18.64C28.03,19.47,28.720000000000002,21,28.720000000000002,23.17C28.720000000000002,25.43,28.680000000000003,71.78999999999999,28.67,88.87C28.67,92.23,28.67,94.46000000000001,28.67,94.99000000000001"/>
<path id="冊-s2"  class="stroke" stroke="#9abf09" d="M29.71,21.29C37.09,20.33,71.5,16.75,78.02000000000001,15.989999999999998C81.19000000000001,15.62,83.07000000000001,16.75,83.07000000000001,20.119999999999997C83.07000000000001,22.129999999999995,82.49000000000001,81.97999999999999,82.49000000000001,87.5C82.49000000000001,96.38,78.08000000000001,90.66,75.61000000000001,88.19"/>
<path id="冊-s3"  class="stroke" stroke="#09bf52" d="M45.37,22.5C46.18,23.31,46.58,24.75,46.58,26C46.58,26.69,46.629999999999995,69.47,46.62,85.25C46.62,88.65,46.62,90.8,46.61,91"/>
<path id="冊-s4"  class="stroke" stroke="#0952bf" d="M62.12,20.5C62.87,21.25,63.33,22.25,63.33,23.75C63.33,26.4,63.379999999999995,68.55,63.37,84.75C63.37,88.45,63.37,90.79,63.36,91"/>
<path id="冊-s5"  class="stroke" stroke="#9a09bf" d="M12.5,53.45C15.52,54.53,19.6,54.17,22.75,53.88C38.75,52.38,67.75,50.5,89.62,49.85C92.29,49.77,95.37,49.99,98,50.550000000000004"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="冊-bg1"  class="badge-group"><circle cx="27.19" cy="15.14" r="3.5" fill="#bf0909"/><text class="num-single" x="27.19" y="15.14" dx="0" dy="-0.5">1</text></g>
<g id="冊-bg2"  class="badge-group"><circle cx="29.71" cy="24.79" r="3.5" fill="#9abf09"/><text class="num-single" x="29.71" y="24.79" dx="0" dy="-0.5">2</text></g>
<g id="冊-bg3"  class="badge-group"><circle cx="45.37" cy="22.5" r="3.5" fill="#09bf52"/><text class="num-single" x="45.37" y="22.5" dx="0" dy="-0.5">3</text></g>
<g id="冊-bg4"  class="badge-group"><circle cx="62.12" cy="20.5" r="3.5" fill="#0952bf"/><text class="num-single" x="62.12" y="20.5" dx="0" dy="-0.5">4</text></g>
<g id="冊-bg5"  class="badge-group"><circle cx="12.5" cy="53.45" r="3.5" fill="#9a09bf"/><text class="num-single" x="12.5" y="53.45" dx="0" dy="-0.5">5</text></g>
</svg>