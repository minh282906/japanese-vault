<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (招)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #招-bg[i]: Thời gian quả bóng số nảy lên
   - #招-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#招-bg1  { animation-delay: 0.05s; }
#招-s1   { stroke-dasharray: 31.1606; stroke-dashoffset: 31.1606; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#招-bg2  { animation-delay: 0.42s; }
#招-s2   { stroke-dasharray: 89.8985; stroke-dashoffset: 89.8985; animation: drawStroke 0.49s ease-out 0.55s forwards; }
#招-bg3  { animation-delay: 1.06s; }
#招-s3   { stroke-dasharray: 35.6556; stroke-dashoffset: 35.6556; animation: drawStroke 0.22s ease-out 1.19s forwards; }
#招-bg4  { animation-delay: 1.43s; }
#招-s4   { stroke-dasharray: 85.5506; stroke-dashoffset: 85.5506; animation: drawStroke 0.47s ease-out 1.56s forwards; }
#招-bg5  { animation-delay: 2.05s; }
#招-s5   { stroke-dasharray: 40.9475; stroke-dashoffset: 40.9475; animation: drawStroke 0.23s ease-out 2.18s forwards; }
#招-bg6  { animation-delay: 2.43s; }
#招-s6   { stroke-dasharray: 29.0346; stroke-dashoffset: 29.0346; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#招-bg7  { animation-delay: 2.80s; }
#招-s7   { stroke-dasharray: 61.7941; stroke-dashoffset: 61.7941; animation: drawStroke 0.34s ease-out 2.93s forwards; }
#招-bg8  { animation-delay: 3.29s; }
#招-s8   { stroke-dasharray: 30.8089; stroke-dashoffset: 30.8089; animation: drawStroke 0.22s ease-out 3.42s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #招-s[i]) -->
<path id="招-s1"  class="stroke" stroke="#bf0909" d="M13.75,37.17C15.83,37.42,17.75,37.61,19.88,37.300000000000004C25.24,36.53,34.11,35.540000000000006,41.22,34.330000000000005C42.37,34.13,43.62,34.13,44.67,34.260000000000005"/>
<path id="招-s2"  class="stroke" stroke="#bf9109" d="M30.77,12.5C31.64,13.37,32.53,15.5,32.53,17.52C32.53,32.75,32.52,74.48,32.52,85.92C32.52,100.17,26.610000000000003,90.52,24.750000000000004,88.67"/>
<path id="招-s3"  class="stroke" stroke="#64bf09" d="M12.47,68.06C13.860000000000001,68.82000000000001,14.9,68.91,17,67.5C22,64.14,31,58,42.25,49.92"/>
<path id="招-s4"  class="stroke" stroke="#09bf36" d="M51.78,23.17C53.9,23.64,55.88,23.740000000000002,58.010000000000005,23.42C67.95,21.930000000000003,84.43,17.87,89.4,17.470000000000002C92.86,17.19,94.61,18.750000000000004,94.04,22.750000000000004C93.12,29.130000000000003,90.5,39.940000000000005,85.34,48.24C81.75,54,79,49,76.76,46.28"/>
<path id="招-s5"  class="stroke" stroke="#09bfbf" d="M68.51,24.39C68.57000000000001,25.17,68.56,26.69,68.14,27.77C63.5,39.5,58.5,48.75,47.17,58.35"/>
<path id="招-s6"  class="stroke" stroke="#0936bf" d="M51.58,66.17C52.449999999999996,67.04,53,68.25,53.239999999999995,69.29C54.12,73.04,55.44,82.21000000000001,56.3,90.19C56.47,91.74,56.62,93.2,56.769999999999996,94.49"/>
<path id="招-s7"  class="stroke" stroke="#6409bf" d="M54.38,68.22C62.910000000000004,66.77,80.11,64.61,86.99000000000001,64.03C89.27000000000001,63.84,92.43,64.75,91.26,69.3C89.97,74.35,87.75,82.1,86.36,89.24"/>
<path id="招-s8"  class="stroke" stroke="#bf0991" d="M57.69,91.62C63.4,91.30000000000001,74.8,90.57000000000001,84.25,90.09C85.72,90.02000000000001,87.13,89.95,88.45,89.89"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="招-bg1"  class="badge-group"><circle cx="13.75" cy="37.17" r="3.5" fill="#bf0909"/><text class="num-single" x="13.75" y="37.17" dx="0" dy="-0.5">1</text></g>
<g id="招-bg2"  class="badge-group"><circle cx="30.77" cy="12.5" r="3.5" fill="#bf9109"/><text class="num-single" x="30.77" y="12.5" dx="0" dy="-0.5">2</text></g>
<g id="招-bg3"  class="badge-group"><circle cx="12.47" cy="68.06" r="3.5" fill="#64bf09"/><text class="num-single" x="12.47" y="68.06" dx="0" dy="-0.5">3</text></g>
<g id="招-bg4"  class="badge-group"><circle cx="51.78" cy="23.17" r="3.5" fill="#09bf36"/><text class="num-single" x="51.78" y="23.17" dx="0" dy="-0.5">4</text></g>
<g id="招-bg5"  class="badge-group"><circle cx="68.51" cy="24.39" r="3.5" fill="#09bfbf"/><text class="num-single" x="68.51" y="24.39" dx="0" dy="-0.5">5</text></g>
<g id="招-bg6"  class="badge-group"><circle cx="51.58" cy="62.67" r="3.5" fill="#0936bf"/><text class="num-single" x="51.58" y="62.67" dx="0" dy="-0.5">6</text></g>
<g id="招-bg7"  class="badge-group"><circle cx="54.38" cy="71.72" r="3.5" fill="#6409bf"/><text class="num-single" x="54.38" y="71.72" dx="0" dy="-0.5">7</text></g>
<g id="招-bg8"  class="badge-group"><circle cx="57.69" cy="91.62" r="3.5" fill="#bf0991"/><text class="num-single" x="57.69" y="91.62" dx="0" dy="-0.5">8</text></g>
</svg>