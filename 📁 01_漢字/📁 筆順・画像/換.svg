<path id="換-s9"  class="stroke" stroke="#0909bf" d="M68.34,39.71C69,40.37,69.2,41.35,69.2,42.68C69.2,44.62,69.25,46.34,69.25,47.62C69.25,51.739999999999995,69.75,52.57,73.7,52.57C76.45,52.57,78.63,52.37,79.9,51.69"/>
<path id="換-s10"  class="stroke" stroke="#6409bf" d="M38.91,70.64C41.19,71.22,43.67999999999999,71.04,46,70.8C60.63,69.25,75.28999999999999,67.57,86.77000000000001,66.42C89.54,66.14,92.12,66.12,94.9,66.52"/>
