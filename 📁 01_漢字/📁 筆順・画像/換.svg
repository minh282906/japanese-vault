<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (換)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #換-bg[i]: Thời gian quả bóng số nảy lên
   - #換-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#換-bg1  { animation-delay: 0.05s; }
#換-s1   { stroke-dasharray: 26.7667; stroke-dashoffset: 26.7667; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#換-bg2  { animation-delay: 0.42s; }
#換-s2   { stroke-dasharray: 86.8066; stroke-dashoffset: 86.8066; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#換-bg3  { animation-delay: 1.05s; }
#換-s3   { stroke-dasharray: 28.8956; stroke-dashoffset: 28.8956; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#換-bg4  { animation-delay: 1.42s; }
#換-s4   { stroke-dasharray: 29.3592; stroke-dashoffset: 29.3592; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#換-bg5  { animation-delay: 1.79s; }
#換-s5   { stroke-dasharray: 41.9939; stroke-dashoffset: 41.9939; animation: drawStroke 0.23s ease-out 1.92s forwards; }
#換-bg6  { animation-delay: 2.17s; }
#換-s6   { stroke-dasharray: 24.9718; stroke-dashoffset: 24.9718; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#換-bg7  { animation-delay: 2.54s; }
#換-s7   { stroke-dasharray: 61.7047; stroke-dashoffset: 61.7047; animation: drawStroke 0.34s ease-out 2.67s forwards; }
#換-bg8  { animation-delay: 3.03s; }
#換-s8   { stroke-dasharray: 15.3850; stroke-dashoffset: 15.3850; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#換-bg9  { animation-delay: 3.40s; }
#換-s9   { stroke-dasharray: 22.5269; stroke-dashoffset: 22.5269; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#換-bg10  { animation-delay: 3.77s; }
#換-s10   { stroke-dasharray: 56.2858; stroke-dashoffset: 56.2858; animation: drawStroke 0.31s ease-out 3.90s forwards; }
#換-bg11  { animation-delay: 4.23s; }
#換-s11   { stroke-dasharray: 48.1928; stroke-dashoffset: 48.1928; animation: drawStroke 0.27s ease-out 4.36s forwards; }
#換-bg12  { animation-delay: 4.65s; }
#換-s12   { stroke-dasharray: 38.8874; stroke-dashoffset: 38.8874; animation: drawStroke 0.22s ease-out 4.78s forwards; }
]]>
</style>

