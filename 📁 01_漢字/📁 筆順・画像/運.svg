<path id="運-s4"  class="stroke" stroke="#64bf09" d="M46.08,37.83C47,38.75,47.28,39.839999999999996,47.37,40.41C47.98,43.98,49.199999999999996,51.17999999999999,50.239999999999995,58.47C50.41,59.629999999999995,50.559999999999995,60.769999999999996,50.699999999999996,61.85"/>
<path id="運-s5"  class="stroke" stroke="#09bf09" d="M48.51,39.06C57.36,37.96,74.6,35.410000000000004,79.46,34.96C81.75999999999999,34.75,83.25999999999999,35.75,83.08999999999999,38.39C82.83999999999999,42.22,81.16999999999999,49.480000000000004,79.85999999999999,56.22C79.63999999999999,57.339999999999996,79.40999999999998,58.43,79.14999999999999,59.48"/>
<path id="運-s6"  class="stroke" stroke="#09bf64" d="M50.25,49.24C57.63,48.25,71.75,46,80.77,45.510000000000005"/>
<path id="運-s7"  class="stroke" stroke="#09bfbf" d="M51.5,59.56C58.519999999999996,58.7,70.25,57.370000000000005,78.39,56.870000000000005"/>
<path id="運-s8"  class="stroke" stroke="#0964bf" d="M40.29,70.38C43.25,71.13,45.64,71.05,48.25,70.81C58.97,69.82000000000001,72.95,68.53,83.13,67.96000000000001C85.83,67.81,88.32,67.87,90.97,68.42"/>
<path id="運-s9"  class="stroke" stroke="#0909bf" d="M62.61,18.04C63.6,19.029999999999998,64.25,20.25,64.25,21.66C64.25,22.54,64.23,63.67,64.14,80C64.12,82.91,64.11,85.03,64.09,86"/>
<path id="運-s10"  class="stroke" stroke="#6409bf" d="M18.75,20C22.1,21.61,27.41,26.63,28.25,29.130000000000003"/>
<path id="運-s11"  class="stroke" stroke="#bf09bf" d="M13.25,50.5C15.5,51.5,17,51,18,50.75S27.25,47.5,28.75,47C32,45.92,32.34,48.06,30.19,51.1C23,61.25,23.25,61,30.72,67.27C33.6,69.69,33.519999999999996,71.11,31.25,73C29.75,74.25,22,81,20.5,81.5"/>
<path id="運-s12"  class="stroke" stroke="#bf0964" d="M16.25,83C19.25,82.5,25.25,81.25,29.75,82.25S59.07,89.96,63.5,91.25C75.5,94.75,84.75,95.75,93.75,94"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="運-bg1"  class="badge-group"><circle cx="42.88" cy="12.25" r="3.5" fill="#bf0909"/><text class="num-single" x="42.88" y="12.25" dx="0" dy="-0.5">1</text></g>
