<g id="運-bg8"  class="badge-group"><circle cx="40.29" cy="70.38" r="3.5" fill="#0964bf"/><text class="num-single" x="40.29" y="70.38" dx="0" dy="-0.5">8</text></g>
<g id="運-bg9"  class="badge-group"><circle cx="62.61" cy="18.04" r="3.5" fill="#0909bf"/><text class="num-single" x="62.61" y="18.04" dx="0" dy="-0.5">9</text></g>
