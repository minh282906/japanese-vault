<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (運)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #運-bg[i]: Thời gian quả bóng số nảy lên
   - #運-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#運-bg1  { animation-delay: 0.05s; }
#運-s1   { stroke-dasharray: 12.5126; stroke-dashoffset: 12.5126; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#運-bg2  { animation-delay: 0.42s; }
#運-s2   { stroke-dasharray: 54.2856; stroke-dashoffset: 54.2856; animation: drawStroke 0.30s ease-out 0.55s forwards; }
#運-bg3  { animation-delay: 0.87s; }
#運-s3   { stroke-dasharray: 31.9856; stroke-dashoffset: 31.9856; animation: drawStroke 0.22s ease-out 1.00s forwards; }
#運-bg4  { animation-delay: 1.24s; }
#運-s4   { stroke-dasharray: 24.6308; stroke-dashoffset: 24.6308; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#運-bg5  { animation-delay: 1.61s; }
#運-s5   { stroke-dasharray: 58.6119; stroke-dashoffset: 58.6119; animation: drawStroke 0.32s ease-out 1.74s forwards; }
#運-bg6  { animation-delay: 2.08s; }
#運-s6   { stroke-dasharray: 30.7553; stroke-dashoffset: 30.7553; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#運-bg7  { animation-delay: 2.45s; }
#運-s7   { stroke-dasharray: 27.0276; stroke-dashoffset: 27.0276; animation: drawStroke 0.22s ease-out 2.58s forwards; }
#運-bg8  { animation-delay: 2.82s; }
#運-s8   { stroke-dasharray: 50.8904; stroke-dashoffset: 50.8904; animation: drawStroke 0.28s ease-out 2.95s forwards; }
#運-bg9  { animation-delay: 3.25s; }
#運-s9   { stroke-dasharray: 68.4222; stroke-dashoffset: 68.4222; animation: drawStroke 0.38s ease-out 3.38s forwards; }
#運-bg10  { animation-delay: 3.78s; }
#運-s10   { stroke-dasharray: 13.3667; stroke-dashoffset: 13.3667; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#運-bg11  { animation-delay: 4.15s; }
#運-s11   { stroke-dasharray: 64.1830; stroke-dashoffset: 64.1830; animation: drawStroke 0.35s ease-out 4.28s forwards; }
#運-bg12  { animation-delay: 4.65s; }
#運-s12   { stroke-dasharray: 79.2123; stroke-dashoffset: 79.2123; animation: drawStroke 0.44s ease-out 4.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #運-s[i]) -->
<path id="運-s1"  class="stroke" stroke="#bf0909" d="M42.88,15.75C42.78,19.05,40.36,25.78,39.5,27.75"/>
<path id="運-s2"  class="stroke" stroke="#bf6409" d="M43.58,18.04C55.37,16.31,72.37,14.25,84.78,13.5C91.01,13.12,89,17.5,83.85,21.48"/>
