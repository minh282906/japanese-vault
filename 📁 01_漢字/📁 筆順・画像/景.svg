<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (景)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #景-bg[i]: Thời gian quả bóng số nảy lên
   - #景-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#景-bg1  { animation-delay: 0.05s; }
#景-s1   { stroke-dasharray: 23.8865; stroke-dashoffset: 23.8865; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#景-bg2  { animation-delay: 0.42s; }
#景-s2   { stroke-dasharray: 68.0259; stroke-dashoffset: 68.0259; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#景-bg3  { animation-delay: 0.94s; }
#景-s3   { stroke-dasharray: 41.1921; stroke-dashoffset: 41.1921; animation: drawStroke 0.23s ease-out 1.07s forwards; }
#景-bg4  { animation-delay: 1.32s; }
#景-s4   { stroke-dasharray: 37.3785; stroke-dashoffset: 37.3785; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#景-bg5  { animation-delay: 1.69s; }
#景-s5   { stroke-dasharray: 8.3971; stroke-dashoffset: 8.3971; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#景-bg6  { animation-delay: 2.06s; }
#景-s6   { stroke-dasharray: 80.2528; stroke-dashoffset: 80.2528; animation: drawStroke 0.44s ease-out 2.19s forwards; }
#景-bg7  { animation-delay: 2.65s; }
#景-s7   { stroke-dasharray: 17.8739; stroke-dashoffset: 17.8739; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#景-bg8  { animation-delay: 3.02s; }
#景-s8   { stroke-dasharray: 46.2487; stroke-dashoffset: 46.2487; animation: drawStroke 0.25s ease-out 3.15s forwards; }
#景-bg9  { animation-delay: 3.42s; }
#景-s9   { stroke-dasharray: 29.9125; stroke-dashoffset: 29.9125; animation: drawStroke 0.22s ease-out 3.55s forwards; }
#景-bg10  { animation-delay: 3.79s; }
#景-s10   { stroke-dasharray: 34.1802; stroke-dashoffset: 34.1802; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#景-bg11  { animation-delay: 4.16s; }
#景-s11   { stroke-dasharray: 19.4574; stroke-dashoffset: 19.4574; animation: drawStroke 0.22s ease-out 4.29s forwards; }
#景-bg12  { animation-delay: 4.53s; }
#景-s12   { stroke-dasharray: 18.0356; stroke-dashoffset: 18.0356; animation: drawStroke 0.22s ease-out 4.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

