<path id="景-s8"  class="stroke" stroke="#0964bf" d="M38.08,58.38C46.23,57.29,63.019999999999996,55.82,68.55,55.370000000000005C70.84,55.18000000000001,72.97,56.910000000000004,72.03999999999999,59.050000000000004C71.00999999999999,61.440000000000005,70.36999999999999,64,68.83999999999999,67.96000000000001"/>
<path id="景-s9"  class="stroke" stroke="#0909bf" d="M41.16,71.58C48.48,70.84,56.919999999999995,70.06,67.12,69.2C68.37,69.09,69.65,68.99000000000001,70.95,68.88000000000001"/>
<path id="景-s10"  class="stroke" stroke="#6409bf" d="M54.02,72.88C55.010000000000005,73.86999999999999,55.53,75.36999999999999,55.53,76.44999999999999C55.53,80.05999999999999,55.52,89.76999999999998,55.52,92.86999999999999C55.52,102.74999999999999,49.25,94.74999999999999,47.31,92.82"/>
<path id="景-s11"  class="stroke" stroke="#bf09bf" d="M32.13,80.12C32.17,80.49000000000001,32.220000000000006,81.06,32.050000000000004,81.59C31.150000000000006,84.39,26.410000000000004,90.2,19.760000000000005,94.37"/>
<path id="景-s12"  class="stroke" stroke="#bf0964" d="M75.12,80C79.25,82.63,84.96000000000001,89.96000000000001,86,94.05"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
