<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (了)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #了-bg[i]: Thời gian quả bóng số nảy lên
   - #了-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#了-bg1  { animation-delay: 0.05s; }
#了-s1   { stroke-dasharray: 86.6253; stroke-dashoffset: 86.6253; animation: drawStroke 0.48s ease-out 0.18s forwards; }
#了-bg2  { animation-delay: 0.68s; }
#了-s2   { stroke-dasharray: 69.4606; stroke-dashoffset: 69.4606; animation: drawStroke 0.38s ease-out 0.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 2 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #了-s[i]) -->
<path id="了-s1"  class="stroke" stroke="#bf0909" d="M23.78,21.29C27.380000000000003,22.189999999999998,30.54,22.14,34.14,21.59C44.620000000000005,19.99,72.41,16.09,74.57,15.75C78.5,15.13,79.25,17.61,76.63999999999999,19.83C74.03999999999999,22.049999999999997,61.749999999999986,32.25,54.95999999999999,37.269999999999996"/>
<path id="了-s2"  class="stroke" stroke="#09bfbf" d="M51.94,38.24C61.5,42.5,64.75,70.25,57.89,90C54.65,99.32,49.25,92.5,47.5,90.5"/>

<!-- ============================================================
     BẢNG 2 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="了-bg1"  class="badge-group"><circle cx="23.78" cy="21.29" r="3.5" fill="#bf0909"/><text class="num-single" x="23.78" y="21.29" dx="0" dy="-0.5">1</text></g>
<g id="了-bg2"  class="badge-group"><circle cx="51.94" cy="38.24" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.94" y="38.24" dx="0" dy="-0.5">2</text></g>
</svg>