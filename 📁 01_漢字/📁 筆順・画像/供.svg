<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (供)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #供-bg[i]: Thời gian quả bóng số nảy lên
   - #供-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#供-bg1  { animation-delay: 0.05s; }
#供-s1   { stroke-dasharray: 45.8252; stroke-dashoffset: 45.8252; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#供-bg2  { animation-delay: 0.45s; }
#供-s2   { stroke-dasharray: 52.2220; stroke-dashoffset: 52.2220; animation: drawStroke 0.29s ease-out 0.58s forwards; }
#供-bg3  { animation-delay: 0.89s; }
#供-s3   { stroke-dasharray: 50.0096; stroke-dashoffset: 50.0096; animation: drawStroke 0.28s ease-out 1.02s forwards; }
#供-bg4  { animation-delay: 1.32s; }
#供-s4   { stroke-dasharray: 41.5825; stroke-dashoffset: 41.5825; animation: drawStroke 0.23s ease-out 1.45s forwards; }
#供-bg5  { animation-delay: 1.70s; }
#供-s5   { stroke-dasharray: 45.0778; stroke-dashoffset: 45.0778; animation: drawStroke 0.25s ease-out 1.83s forwards; }
#供-bg6  { animation-delay: 2.10s; }
#供-s6   { stroke-dasharray: 61.6208; stroke-dashoffset: 61.6208; animation: drawStroke 0.34s ease-out 2.23s forwards; }
#供-bg7  { animation-delay: 2.59s; }
#供-s7   { stroke-dasharray: 27.9455; stroke-dashoffset: 27.9455; animation: drawStroke 0.22s ease-out 2.72s forwards; }
#供-bg8  { animation-delay: 2.96s; }
#供-s8   { stroke-dasharray: 29.3281; stroke-dashoffset: 29.3281; animation: drawStroke 0.22s ease-out 3.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #供-s[i]) -->
<path id="供-s1"  class="stroke" stroke="#bf0909" d="M33.01,18.75C33.22,20.759999999999998,32.949999999999996,22.15,32.28,23.87C28,34.86,22.07,45.67,12.25,59.04"/>
<path id="供-s2"  class="stroke" stroke="#bf9109" d="M26.03,42.25C26.62,42.86,27.040000000000003,44.22,27.040000000000003,45.48C27.040000000000003,54.959999999999994,27.1,75.89,27.03,87.5C27.01,90.31,27,92.64,27,94.25"/>
<path id="供-s3"  class="stroke" stroke="#64bf09" d="M40.78,38.43C42.68,39.12,45.28,38.93,47.260000000000005,38.65C56.11000000000001,37.37,71.96000000000001,35.08,83.9,34.17C86.13000000000001,34,88.23,33.83,90.42,34.31"/>
<path id="供-s4"  class="stroke" stroke="#09bf36" d="M52.55,20.6C53.48,21.53,54.12,23,54.209999999999994,24.51C54.599999999999994,31.560000000000002,55.339999999999996,53.69,55.82999999999999,61.72"/>
<path id="供-s5"  class="stroke" stroke="#09bfbf" d="M77.07,15.5C77.91,16.34,78.33999999999999,17.92,78.22999999999999,18.91C76.63,32.5,75.25999999999999,43.75,73.44999999999999,60.010000000000005"/>
<path id="供-s6"  class="stroke" stroke="#0936bf" d="M36.83,63.33C39.559999999999995,64.16,42.58,63.949999999999996,45.379999999999995,63.69C56.73,62.64,76.66,60.21,90.38,59.64C93.03,59.53,95.56,59.61,98.17,60.09"/>
<path id="供-s7"  class="stroke" stroke="#6409bf" d="M55.85,72.56C55.97,73.75,55.59,75.07000000000001,54.88,76.08C51.88,80.38,45.14,87.89,37.910000000000004,93.24"/>
<path id="供-s8"  class="stroke" stroke="#bf0991" d="M75.11,71.19C82.37,74.86,92.5,84.37,95.42,91.71"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="供-bg1"  class="badge-group"><circle cx="33.01" cy="18.75" r="3.5" fill="#bf0909"/><text class="num-single" x="33.01" y="18.75" dx="0" dy="-0.5">1</text></g>
<g id="供-bg2"  class="badge-group"><circle cx="26.03" cy="42.25" r="3.5" fill="#bf9109"/><text class="num-single" x="26.03" y="42.25" dx="0" dy="-0.5">2</text></g>
<g id="供-bg3"  class="badge-group"><circle cx="40.78" cy="38.43" r="3.5" fill="#64bf09"/><text class="num-single" x="40.78" y="38.43" dx="0" dy="-0.5">3</text></g>
<g id="供-bg4"  class="badge-group"><circle cx="52.55" cy="20.6" r="3.5" fill="#09bf36"/><text class="num-single" x="52.55" y="20.6" dx="0" dy="-0.5">4</text></g>
<g id="供-bg5"  class="badge-group"><circle cx="77.07" cy="15.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="77.07" y="15.5" dx="0" dy="-0.5">5</text></g>
<g id="供-bg6"  class="badge-group"><circle cx="36.83" cy="63.33" r="3.5" fill="#0936bf"/><text class="num-single" x="36.83" y="63.33" dx="0" dy="-0.5">6</text></g>
<g id="供-bg7"  class="badge-group"><circle cx="55.85" cy="72.56" r="3.5" fill="#6409bf"/><text class="num-single" x="55.85" y="72.56" dx="0" dy="-0.5">7</text></g>
<g id="供-bg8"  class="badge-group"><circle cx="75.11" cy="71.19" r="3.5" fill="#bf0991"/><text class="num-single" x="75.11" y="71.19" dx="0" dy="-0.5">8</text></g>
</svg>