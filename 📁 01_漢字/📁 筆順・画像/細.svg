<path id="細-s3"  class="stroke" stroke="#aebf09" d="M38.5,48.25C41.15,50.59,44.84,57.36,45.5,61"/>
<path id="細-s4"  class="stroke" stroke="#4bbf09" d="M30.19,60.45C30.87,61.13,31.330000000000002,62.190000000000005,31.380000000000003,63.71C31.540000000000003,68.99,31.390000000000004,81.03999999999999,31.300000000000004,88.75C31.270000000000003,91.67,31.240000000000006,93.82,31.240000000000006,94.5"/>
<path id="細-s5"  class="stroke" stroke="#09bf2a" d="M20.89,69.5C21.26,70.53,21.35,71.67,20.73,73.41C18.84,78.74,15.420000000000002,85.53,13,88.92"/>
<path id="細-s6"  class="stroke" stroke="#09bf8d" d="M39.25,69C41.45,72.05,45.21,80.19,46,83.25"/>
<path id="細-s7"  class="stroke" stroke="#098dbf" d="M52.5,36.59C53.52,37.61000000000001,54.25,39.010000000000005,54.36,40.2C55.38,52.120000000000005,55.38,67.16,55.94,81.75C56,83.39,56.07,84.98,56.14,86.5"/>
<path id="細-s8"  class="stroke" stroke="#092abf" d="M55.02,38.49C65.18,37.52,82.80000000000001,35.21,89.4,34.49C92.2,34.18,93.62,36.660000000000004,93.47,38.96C92.97,46.57,92.14,66.18,91.57,79.50999999999999C91.50999999999999,80.91,91.44999999999999,82.24,91.39999999999999,83.49"/>
<path id="細-s9"  class="stroke" stroke="#4b09bf" d="M71.27,39.4C72.19,40.32,72.72999999999999,41.75,72.72999999999999,43.75C72.72999999999999,52.34,72.91,79.50999999999999,72.91,80.22999999999999"/>
<path id="細-s10"  class="stroke" stroke="#ae09bf" d="M56.43,59.6C66,58.370000000000005,82.63,56.75,91.43,56.44"/>
<path id="細-s11"  class="stroke" stroke="#bf096c" d="M57.18,82.78C66.5,82.13,79.75,81,90.24000000000001,80.64"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="細-bg1"  class="badge-group"><circle cx="30.47" cy="16.5" r="3.5" fill="#bf0909"/><text class="num-single" x="30.47" y="16.5" dx="0" dy="-0.5">1</text></g>
<g id="細-bg2"  class="badge-group"><circle cx="40.29" cy="27.75" r="3.5" fill="#bf6c09"/><text class="num-single" x="40.29" y="27.75" dx="0" dy="-0.5">2</text></g>
