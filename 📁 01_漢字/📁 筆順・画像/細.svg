<g id="細-bg10" class="badge-group"><circle cx="56.43" cy="59.6" r="3.5" fill="#ae09bf"/><text class="num-double" x="56.43" y="59.6" dx="-0.4" dy="-0.475">10</text></g>
<g id="細-bg11" class="badge-group"><circle cx="57.18" cy="82.78" r="3.5" fill="#bf096c"/><text class="num-double" x="57.18" y="82.78" dx="-0.4" dy="-0.475">11</text></g>
