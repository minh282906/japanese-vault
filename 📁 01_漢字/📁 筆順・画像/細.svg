<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (細)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #細-bg[i]: Thời gian quả bóng số nảy lên
   - #細-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#細-bg1  { animation-delay: 0.05s; }
#細-s1   { stroke-dasharray: 36.8770; stroke-dashoffset: 36.8770; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#細-bg2  { animation-delay: 0.42s; }
#細-s2   { stroke-dasharray: 69.8267; stroke-dashoffset: 69.8267; animation: drawStroke 0.38s ease-out 0.55s forwards; }
#細-bg3  { animation-delay: 0.95s; }
#細-s3   { stroke-dasharray: 14.7099; stroke-dashoffset: 14.7099; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#細-bg4  { animation-delay: 1.32s; }
#細-s4   { stroke-dasharray: 34.3458; stroke-dashoffset: 34.3458; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#細-bg5  { animation-delay: 1.69s; }
#細-s5   { stroke-dasharray: 21.3716; stroke-dashoffset: 21.3716; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#細-bg6  { animation-delay: 2.06s; }
#細-s6   { stroke-dasharray: 15.8141; stroke-dashoffset: 15.8141; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#細-bg7  { animation-delay: 2.43s; }
#細-s7   { stroke-dasharray: 50.4746; stroke-dashoffset: 50.4746; animation: drawStroke 0.28s ease-out 2.56s forwards; }
#細-bg8  { animation-delay: 2.86s; }
#細-s8   { stroke-dasharray: 86.1527; stroke-dashoffset: 86.1527; animation: drawStroke 0.47s ease-out 2.99s forwards; }
#細-bg9  { animation-delay: 3.48s; }
#細-s9   { stroke-dasharray: 41.1898; stroke-dashoffset: 41.1898; animation: drawStroke 0.23s ease-out 3.61s forwards; }
#細-bg10  { animation-delay: 3.86s; }
#細-s10   { stroke-dasharray: 35.1509; stroke-dashoffset: 35.1509; animation: drawStroke 0.22s ease-out 3.99s forwards; }
#細-bg11  { animation-delay: 4.23s; }
#細-s11   { stroke-dasharray: 33.1312; stroke-dashoffset: 33.1312; animation: drawStroke 0.22s ease-out 4.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #細-s[i]) -->
<path id="細-s1"  class="stroke" stroke="#bf0909" d="M30.47,16.5C30.759999999999998,17.77,30.77,19.1,30.07,20.35C27.04,25.86,22.58,32.7,18.84,36.89C17.74,38.12,17.99,39.25,19.34,39.82C22.37,41.1,24.45,42.46,27.05,44.79"/>
