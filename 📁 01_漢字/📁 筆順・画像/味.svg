<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (味)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #味-bg[i]: Thời gian quả bóng số nảy lên
   - #味-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#味-bg1  { animation-delay: 0.05s; }
#味-s1   { stroke-dasharray: 27.6709; stroke-dashoffset: 27.6709; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#味-bg2  { animation-delay: 0.42s; }
#味-s2   { stroke-dasharray: 44.2748; stroke-dashoffset: 44.2748; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#味-bg3  { animation-delay: 0.81s; }
#味-s3   { stroke-dasharray: 20.1647; stroke-dashoffset: 20.1647; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#味-bg4  { animation-delay: 1.18s; }
#味-s4   { stroke-dasharray: 36.9436; stroke-dashoffset: 36.9436; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#味-bg5  { animation-delay: 1.55s; }
#味-s5   { stroke-dasharray: 51.6039; stroke-dashoffset: 51.6039; animation: drawStroke 0.28s ease-out 1.68s forwards; }
#味-bg6  { animation-delay: 1.98s; }
#味-s6   { stroke-dasharray: 88.5092; stroke-dashoffset: 88.5092; animation: drawStroke 0.49s ease-out 2.11s forwards; }
#味-bg7  { animation-delay: 2.62s; }
#味-s7   { stroke-dasharray: 47.9109; stroke-dashoffset: 47.9109; animation: drawStroke 0.26s ease-out 2.75s forwards; }
#味-bg8  { animation-delay: 3.03s; }
#味-s8   { stroke-dasharray: 43.8899; stroke-dashoffset: 43.8899; animation: drawStroke 0.24s ease-out 3.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #味-s[i]) -->
<path id="味-s1"  class="stroke" stroke="#bf0909" d="M10.46,35.58C11.25,36.37,11.71,37.85,11.89,39.25C12.46,43.61,13.22,51.24,13.96,58.239999999999995C14.13,59.8,14.290000000000001,61.33,14.450000000000001,62.779999999999994"/>
<path id="味-s2"  class="stroke" stroke="#bf9109" d="M12.64,37.37C17.18,36.65,26.41,35.169999999999995,31.39,34.64C34.47,34.32,36.13,35.78,35.4,38.91C34.339999999999996,43.459999999999994,32.839999999999996,50.349999999999994,31.83,56.589999999999996"/>
<path id="味-s3"  class="stroke" stroke="#64bf09" d="M14.17,58.88C17.29,58.88,24.509999999999998,57.93,30.130000000000003,57.46C31.67,57.33,33.080000000000005,57.24,34.260000000000005,57.21"/>
<path id="味-s4"  class="stroke" stroke="#09bf36" d="M45.31,32.77C47.11,33.400000000000006,49.650000000000006,33.53,51.510000000000005,33.36000000000001C58.84,32.720000000000006,68.21000000000001,31.090000000000007,76.13000000000001,30.290000000000006C77.95,30.110000000000007,80.17000000000002,29.960000000000008,81.97000000000001,30.340000000000007"/>
<path id="味-s5"  class="stroke" stroke="#09bfbf" d="M40.13,51.5C42.49,52.23,45.22,52.23,47.63,51.88C56.25,50.620000000000005,71,48.85,83.75,47.580000000000005C86.22,47.330000000000005,88.91,47.290000000000006,91.38,47.75000000000001"/>
<path id="味-s6"  class="stroke" stroke="#0936bf" d="M61.68,11.5C63.089999999999996,12.91,63.61,14.75,63.61,16.25C63.61,17.13,63.6,70.43,63.589999999999996,91.75C63.589999999999996,95.43,63.589999999999996,98.16,63.589999999999996,99.5"/>
<path id="味-s7"  class="stroke" stroke="#6409bf" d="M61,51.12C61,53.089999999999996,60.09,54.75,59.02,56.33C51.96,66.81,39.290000000000006,79.4,28.380000000000003,84.87"/>
<path id="味-s8"  class="stroke" stroke="#bf0991" d="M64.65,50.62C68.43,56.44,81.14,70.56,88.39,77.5C90.41,79.43,92,81,94.75,82.25"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="味-bg1"  class="badge-group"><circle cx="10.46" cy="32.08" r="3.5" fill="#bf0909"/><text class="num-single" x="10.46" y="32.08" dx="0" dy="-0.5">1</text></g>
<g id="味-bg2"  class="badge-group"><circle cx="12.64" cy="40.87" r="3.5" fill="#bf9109"/><text class="num-single" x="12.64" y="40.87" dx="0" dy="-0.5">2</text></g>
<g id="味-bg3"  class="badge-group"><circle cx="14.17" cy="58.88" r="3.5" fill="#64bf09"/><text class="num-single" x="14.17" y="58.88" dx="0" dy="-0.5">3</text></g>
<g id="味-bg4"  class="badge-group"><circle cx="45.31" cy="32.77" r="3.5" fill="#09bf36"/><text class="num-single" x="45.31" y="32.77" dx="0" dy="-0.5">4</text></g>
<g id="味-bg5"  class="badge-group"><circle cx="40.13" cy="51.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="40.13" y="51.5" dx="0" dy="-0.5">5</text></g>
<g id="味-bg6"  class="badge-group"><circle cx="61.68" cy="11.5" r="3.5" fill="#0936bf"/><text class="num-single" x="61.68" y="11.5" dx="0" dy="-0.5">6</text></g>
<g id="味-bg7"  class="badge-group"><circle cx="61" cy="47.62" r="3.5" fill="#6409bf"/><text class="num-single" x="61" y="47.62" dx="0" dy="-0.5">7</text></g>
<g id="味-bg8"  class="badge-group"><circle cx="64.65" cy="54.12" r="3.5" fill="#bf0991"/><text class="num-single" x="64.65" y="54.12" dx="0" dy="-0.5">8</text></g>
</svg>