<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (否)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #否-bg[i]: Thời gian quả bóng số nảy lên
   - #否-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#否-bg1  { animation-delay: 0.05s; }
#否-s1   { stroke-dasharray: 65.0775; stroke-dashoffset: 65.0775; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#否-bg2  { animation-delay: 0.56s; }
#否-s2   { stroke-dasharray: 53.9440; stroke-dashoffset: 53.9440; animation: drawStroke 0.30s ease-out 0.69s forwards; }
#否-bg3  { animation-delay: 1.01s; }
#否-s3   { stroke-dasharray: 30.3800; stroke-dashoffset: 30.3800; animation: drawStroke 0.22s ease-out 1.14s forwards; }
#否-bg4  { animation-delay: 1.38s; }
#否-s4   { stroke-dasharray: 32.0462; stroke-dashoffset: 32.0462; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#否-bg5  { animation-delay: 1.75s; }
#否-s5   { stroke-dasharray: 28.3019; stroke-dashoffset: 28.3019; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#否-bg6  { animation-delay: 2.12s; }
#否-s6   { stroke-dasharray: 69.9634; stroke-dashoffset: 69.9634; animation: drawStroke 0.38s ease-out 2.25s forwards; }
#否-bg7  { animation-delay: 2.65s; }
#否-s7   { stroke-dasharray: 41.7942; stroke-dashoffset: 41.7942; animation: drawStroke 0.23s ease-out 2.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #否-s[i]) -->
<path id="否-s1"  class="stroke" stroke="#bf0909" d="M23.56,17.85C27.25,18.37,30.4,18.34,33.51,18.020000000000003C44.31,16.900000000000002,65.03999999999999,15.370000000000003,78.63,14.500000000000004C81.86999999999999,14.290000000000003,85.25,14.230000000000004,88.42999999999999,14.920000000000003"/>
<path id="否-s2"  class="stroke" stroke="#bfa509" d="M53.22,19.55C53.33,20.400000000000002,53.39,21.330000000000002,52.75,22.45C48.38,30.12,35.38,44,14.27,54.98"/>
<path id="否-s3"  class="stroke" stroke="#3dbf09" d="M52.79,30.78C53.57,31.560000000000002,54.05,32.5,54.05,33.7C54.05,35.690000000000005,54.099999999999994,48.03,54.11,55.370000000000005C54.11,58.32000000000001,54.11,60.470000000000006,54.1,60.81"/>
<path id="否-s4"  class="stroke" stroke="#09bf71" d="M67.22,33.76C76.63,37.37,86.5,44.25,93.6,51.55"/>
<path id="否-s5"  class="stroke" stroke="#0971bf" d="M30,69.35C31.01,70.36,31.62,71.61999999999999,31.86,72.72C33.12,78.65,34.54,85.22,35.589999999999996,92.02C35.839999999999996,93.67,36.08,95.25999999999999,36.29,96.71"/>
<path id="否-s6"  class="stroke" stroke="#3d09bf" d="M32.14,71.21C46.13,69.63,63.870000000000005,67.75,74.61,66.96C78.77,66.64999999999999,80.62,68.46,79.67,72.63999999999999C78.60000000000001,77.34999999999998,78.11,80.28999999999999,75.91,90.01999999999998"/>
<path id="否-s7"  class="stroke" stroke="#bf09a5" d="M36.29,93.63C46.5,93,57.5,92.25,72.25,91.26C74.27,91.12,76.21,91.07000000000001,78,91"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="否-bg1"  class="badge-group"><circle cx="23.56" cy="17.85" r="3.5" fill="#bf0909"/><text class="num-single" x="23.56" y="17.85" dx="0" dy="-0.5">1</text></g>
<g id="否-bg2"  class="badge-group"><circle cx="53.22" cy="19.55" r="3.5" fill="#bfa509"/><text class="num-single" x="53.22" y="19.55" dx="0" dy="-0.5">2</text></g>
<g id="否-bg3"  class="badge-group"><circle cx="52.79" cy="30.78" r="3.5" fill="#3dbf09"/><text class="num-single" x="52.79" y="30.78" dx="0" dy="-0.5">3</text></g>
<g id="否-bg4"  class="badge-group"><circle cx="67.22" cy="33.76" r="3.5" fill="#09bf71"/><text class="num-single" x="67.22" y="33.76" dx="0" dy="-0.5">4</text></g>
<g id="否-bg5"  class="badge-group"><circle cx="30" cy="65.85" r="3.5" fill="#0971bf"/><text class="num-single" x="30" y="65.85" dx="0" dy="-0.5">5</text></g>
<g id="否-bg6"  class="badge-group"><circle cx="32.14" cy="74.71" r="3.5" fill="#3d09bf"/><text class="num-single" x="32.14" y="74.71" dx="0" dy="-0.5">6</text></g>
<g id="否-bg7"  class="badge-group"><circle cx="36.29" cy="93.63" r="3.5" fill="#bf09a5"/><text class="num-single" x="36.29" y="93.63" dx="0" dy="-0.5">7</text></g>
</svg>