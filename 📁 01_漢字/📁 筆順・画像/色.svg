<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (色)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #色-bg[i]: Thời gian quả bóng số nảy lên
   - #色-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#色-bg1  { animation-delay: 0.05s; }
#色-s1   { stroke-dasharray: 33.3941; stroke-dashoffset: 33.3941; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#色-bg2  { animation-delay: 0.42s; }
#色-s2   { stroke-dasharray: 49.1248; stroke-dashoffset: 49.1248; animation: drawStroke 0.27s ease-out 0.55s forwards; }
#色-bg3  { animation-delay: 0.84s; }
#色-s3   { stroke-dasharray: 70.2925; stroke-dashoffset: 70.2925; animation: drawStroke 0.39s ease-out 0.97s forwards; }
#色-bg4  { animation-delay: 1.38s; }
#色-s4   { stroke-dasharray: 16.0611; stroke-dashoffset: 16.0611; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#色-bg5  { animation-delay: 1.75s; }
#色-s5   { stroke-dasharray: 43.7004; stroke-dashoffset: 43.7004; animation: drawStroke 0.24s ease-out 1.88s forwards; }
#色-bg6  { animation-delay: 2.14s; }
#色-s6   { stroke-dasharray: 115.1290; stroke-dashoffset: 115.1290; animation: drawStroke 0.55s ease-out 2.27s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #色-s[i]) -->
<path id="色-s1"  class="stroke" stroke="#bf0909" d="M45.25,13.25C45.42,14.68,45.15,15.82,44.42,17.09C41.29,22.56,30.54,32.28,23.25,37.25"/>
<path id="色-s2"  class="stroke" stroke="#bfbf09" d="M45,18.63C46,19,47.33,19.07,49.03,18.88C54.63,18.25,60.88,17.25,64.44,16.99C67.00999999999999,16.799999999999997,67.75,18.13,66.25,19.75C61.69,24.69,55.75,32.25,51,39"/>
<path id="色-s3"  class="stroke" stroke="#09bf09" d="M26.86,42.28C28.5,43.63,32.09,42.95,33.54,42.74C48.47,40.56,64.87,38.35,73.22,37.53C76.01,37.26,77.14,39.26,76.91,41.34C76.50999999999999,45.02,75.89,49.38,75.25999999999999,54.88C75.13999999999999,55.970000000000006,74.88,57,74.88,58.38"/>
<path id="色-s4"  class="stroke" stroke="#09bfbf" d="M50.66,42.39C51.56999999999999,43.3,52.279999999999994,44.76,52.11,46.3C51.51,51.75,51.26,53.75,51.01,58"/>
<path id="色-s5"  class="stroke" stroke="#0909bf" d="M30.1,61.37C34.2,61.07,62.15,57.55,73.5,56.26"/>
<path id="色-s6"  class="stroke" stroke="#bf09bf" d="M28.11,43.28C28.75,44,29.08,44.7,29.08,46.230000000000004C29.08,55.260000000000005,29,74.14,29,79.51C29,94.01,32.25,95.38000000000001,58.84,95.38000000000001C88,95.38000000000001,89.02000000000001,92.76,89.02000000000001,82.26"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="色-bg1"  class="badge-group"><circle cx="45.25" cy="9.75" r="3.5" fill="#bf0909"/><text class="num-single" x="45.25" y="9.75" dx="0" dy="-0.5">1</text></g>
<g id="色-bg2"  class="badge-group"><circle cx="45" cy="22.13" r="3.5" fill="#bfbf09"/><text class="num-single" x="45" y="22.13" dx="0" dy="-0.5">2</text></g>
<g id="色-bg3"  class="badge-group"><circle cx="26.86" cy="38.78" r="3.5" fill="#09bf09"/><text class="num-single" x="26.86" y="38.78" dx="0" dy="-0.5">3</text></g>
<g id="色-bg4"  class="badge-group"><circle cx="50.66" cy="42.39" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.66" y="42.39" dx="0" dy="-0.5">4</text></g>
<g id="色-bg5"  class="badge-group"><circle cx="30.1" cy="61.37" r="3.5" fill="#0909bf"/><text class="num-single" x="30.1" y="61.37" dx="0" dy="-0.5">5</text></g>
<g id="色-bg6"  class="badge-group"><circle cx="28.11" cy="46.78" r="3.5" fill="#bf09bf"/><text class="num-single" x="28.11" y="46.78" dx="0" dy="-0.5">6</text></g>
</svg>