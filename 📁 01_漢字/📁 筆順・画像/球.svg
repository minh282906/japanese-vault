<g id="球-bg8"  class="badge-group"><circle cx="41.5" cy="82.5" r="3.5" fill="#092abf"/><text class="num-single" x="41.5" y="82.5" dx="0" dy="-0.5">8</text></g>
<g id="球-bg9"  class="badge-group"><circle cx="87.41" cy="42.11" r="3.5" fill="#4b09bf"/><text class="num-single" x="87.41" y="42.11" dx="0" dy="-0.5">9</text></g>
<g id="球-bg10" class="badge-group"><circle cx="74.07" cy="60.86" r="3.5" fill="#ae09bf"/><text class="num-double" x="74.07" y="60.86" dx="-0.4" dy="-0.475">10</text></g>
<g id="球-bg11" class="badge-group"><circle cx="80.39" cy="14.21" r="3.5" fill="#bf096c"/><text class="num-double" x="80.39" y="14.21" dx="-0.4" dy="-0.475">11</text></g>
</svg>