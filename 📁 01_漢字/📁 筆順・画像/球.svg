<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (球)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #球-bg[i]: Thời gian quả bóng số nảy lên
   - #球-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#球-bg1  { animation-delay: 0.05s; }
#球-s1   { stroke-dasharray: 28.1109; stroke-dashoffset: 28.1109; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#球-bg2  { animation-delay: 0.42s; }
#球-s2   { stroke-dasharray: 45.6749; stroke-dashoffset: 45.6749; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#球-bg3  { animation-delay: 0.82s; }
#球-s3   { stroke-dasharray: 29.0846; stroke-dashoffset: 29.0846; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#球-bg4  { animation-delay: 1.19s; }
#球-s4   { stroke-dasharray: 27.5353; stroke-dashoffset: 27.5353; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#球-bg5  { animation-delay: 1.56s; }
#球-s5   { stroke-dasharray: 46.1337; stroke-dashoffset: 46.1337; animation: drawStroke 0.25s ease-out 1.69s forwards; }
#球-bg6  { animation-delay: 1.96s; }
#球-s6   { stroke-dasharray: 87.2156; stroke-dashoffset: 87.2156; animation: drawStroke 0.48s ease-out 2.09s forwards; }
#球-bg7  { animation-delay: 2.59s; }
#球-s7   { stroke-dasharray: 13.2386; stroke-dashoffset: 13.2386; animation: drawStroke 0.22s ease-out 2.72s forwards; }
#球-bg8  { animation-delay: 2.96s; }
#球-s8   { stroke-dasharray: 25.7295; stroke-dashoffset: 25.7295; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#球-bg9  { animation-delay: 3.33s; }
#球-s9   { stroke-dasharray: 15.2329; stroke-dashoffset: 15.2329; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#球-bg10  { animation-delay: 3.70s; }
#球-s10   { stroke-dasharray: 33.7130; stroke-dashoffset: 33.7130; animation: drawStroke 0.22s ease-out 3.83s forwards; }
#球-bg11  { animation-delay: 4.07s; }
#球-s11   { stroke-dasharray: 12.1780; stroke-dashoffset: 12.1780; animation: drawStroke 0.22s ease-out 4.20s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #球-s[i]) -->
<path id="球-s1"  class="stroke" stroke="#bf0909" d="M13.25,29.25C13.98,29.62,16.79,29.65,17.53,29.59C23.46,29.12,29.020000000000003,28,36.96,26.95C38.08,26.8,40.18,26.689999999999998,41.120000000000005,26.99"/>
<path id="球-s2"  class="stroke" stroke="#bf6c09" d="M26.82,31.77C28.03,32.98,28.3,34.5,28.3,36.25C28.3,42.2,28.400000000000002,71.75,28.400000000000002,77.07"/>
