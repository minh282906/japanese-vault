<path id="球-s4"  class="stroke" stroke="#4bbf09" d="M13,84.25C14.120000000000001,84.75,15.65,84.38,16.5,84C22.62,81.25,28.5,78,37.75,73"/>
<path id="球-s5"  class="stroke" stroke="#09bf2a" d="M46.14,34.91C48.62,35.239999999999995,51.09,35.209999999999994,53.53,34.81999999999999C63.9,33.459999999999994,74.61,32.57999999999999,84.92,31.499999999999993C87.3,31.299999999999994,89.67,31.379999999999992,92.05,31.73999999999999"/>
<path id="球-s6"  class="stroke" stroke="#09bf8d" d="M66.21,13.71C67.19,14.690000000000001,67.86999999999999,16.380000000000003,67.86999999999999,18.3C67.86999999999999,33.63,67.63,83.42,67.63,87.99C67.63,95.44,62.629999999999995,90.94999999999999,59.36,88.22"/>
<path id="球-s7"  class="stroke" stroke="#098dbf" d="M48.12,46.12C51.64,47.599999999999994,57.22,52.22,58.099999999999994,54.53"/>
<path id="球-s8"  class="stroke" stroke="#092abf" d="M41.5,82.5C43.25,82.87,45.12,82.25,46.67,80.56C48.84,78.2,53.25,72.56,59.150000000000006,65.01"/>
<path id="球-s9"  class="stroke" stroke="#4b09bf" d="M87.41,42.11C87.5,42.91,87.31,43.88,86.89,44.55C84.5,48.379999999999995,82.5,50.379999999999995,78.59,54.099999999999994"/>
<path id="球-s10"  class="stroke" stroke="#ae09bf" d="M74.07,60.86C78.64999999999999,67.88,84.88999999999999,76.28999999999999,90.42999999999999,81.57C92.16,83.22,93.88,84.61999999999999,96.25999999999999,85.86999999999999"/>
<path id="球-s11"  class="stroke" stroke="#bf096c" d="M80.39,14.21C83.3,15.75,87.9,20.54,88.63,22.94"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="球-bg1"  class="badge-group"><circle cx="13.25" cy="29.25" r="3.5" fill="#bf0909"/><text class="num-single" x="13.25" y="29.25" dx="0" dy="-0.5">1</text></g>
<g id="球-bg2"  class="badge-group"><circle cx="26.82" cy="31.77" r="3.5" fill="#bf6c09"/><text class="num-single" x="26.82" y="31.77" dx="0" dy="-0.5">2</text></g>
<g id="球-bg3"  class="badge-group"><circle cx="12.5" cy="54.5" r="3.5" fill="#aebf09"/><text class="num-single" x="12.5" y="54.5" dx="0" dy="-0.5">3</text></g>
<g id="球-bg4"  class="badge-group"><circle cx="13" cy="84.25" r="3.5" fill="#4bbf09"/><text class="num-single" x="13" y="84.25" dx="0" dy="-0.5">4</text></g>
