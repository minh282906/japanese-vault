<path id="悲-s4"  class="stroke" stroke="#64bf09" d="M20,55.25C20.88,55.87,22.75,55.87,24.25,55.5C25.59,55.16,32,53.25,40,51"/>
<path id="悲-s5"  class="stroke" stroke="#09bf09" d="M62.53,11.12C63.58,12.17,64.29,13.629999999999999,64.29,15.11C64.29,19.16,64.33000000000001,44.86,64.34,56.63C64.34,58.71,64.34,60.36,64.34,61.370000000000005"/>
<path id="悲-s6"  class="stroke" stroke="#09bf64" d="M66.92,22.83C72.07000000000001,22.569999999999997,78.26,20.93,82.12,20.5C83.53,20.34,82.55000000000001,20.41,84.98,20.41"/>
<path id="悲-s7"  class="stroke" stroke="#09bfbf" d="M67.25,36.22C73.37,35.629999999999995,79.53,33.91,83.62,33.48C85.11,33.32,84.07000000000001,33.38999999999999,86.65,33.38999999999999"/>
<path id="悲-s8"  class="stroke" stroke="#0964bf" d="M67.14,50.11C74,49.5,82.23,48.55,86.55,48.12C88.11999999999999,47.96,87.03,48.04,89.75,48.04"/>
<path id="悲-s9"  class="stroke" stroke="#0909bf" d="M24.88,79.62C25.189999999999998,82.02000000000001,21.82,92.60000000000001,19.36,96.59"/>
<path id="悲-s10"  class="stroke" stroke="#6409bf" d="M40.5,74.04C48.5,90.62,56.25,98.25,83.57,95.86000000000001C90.17999999999999,95.28000000000002,90.13,92.75000000000001,85.05,87.61000000000001"/>
<path id="悲-s11"  class="stroke" stroke="#bf09bf" d="M56.97,69C58.67,72.07,62.629999999999995,77.5,63.71,72.35"/>
<path id="悲-s12"  class="stroke" stroke="#bf0964" d="M84.95,68.14C88.36,70.13,92.13,73.5,94.43,78.82"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="悲-bg1"  class="badge-group"><circle cx="42.54" cy="12.48" r="3.5" fill="#bf0909"/><text class="num-single" x="42.54" y="12.48" dx="0" dy="-0.5">1</text></g>
<g id="悲-bg2"  class="badge-group"><circle cx="21.29" cy="27.39" r="3.5" fill="#bf6409"/><text class="num-single" x="21.29" y="27.39" dx="0" dy="-0.5">2</text></g>
