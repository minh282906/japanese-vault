<g id="悲-bg10" class="badge-group"><circle cx="40.5" cy="74.04" r="3.5" fill="#6409bf"/><text class="num-double" x="40.5" y="74.04" dx="-0.4" dy="-0.475">10</text></g>
<g id="悲-bg11" class="badge-group"><circle cx="56.97" cy="69" r="3.5" fill="#bf09bf"/><text class="num-double" x="56.97" y="69" dx="-0.4" dy="-0.475">11</text></g>
