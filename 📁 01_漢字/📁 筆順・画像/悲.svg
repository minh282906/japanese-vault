<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (悲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #悲-bg[i]: Thời gian quả bóng số nảy lên
   - #悲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#悲-bg1  { animation-delay: 0.05s; }
#悲-s1   { stroke-dasharray: 62.3368; stroke-dashoffset: 62.3368; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#悲-bg2  { animation-delay: 0.54s; }
#悲-s2   { stroke-dasharray: 21.1616; stroke-dashoffset: 21.1616; animation: drawStroke 0.22s ease-out 0.67s forwards; }
#悲-bg3  { animation-delay: 0.91s; }
#悲-s3   { stroke-dasharray: 22.0558; stroke-dashoffset: 22.0558; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#悲-bg4  { animation-delay: 1.28s; }
#悲-s4   { stroke-dasharray: 20.7394; stroke-dashoffset: 20.7394; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#悲-bg5  { animation-delay: 1.65s; }
#悲-s5   { stroke-dasharray: 50.7317; stroke-dashoffset: 50.7317; animation: drawStroke 0.28s ease-out 1.78s forwards; }
#悲-bg6  { animation-delay: 2.08s; }
#悲-s6   { stroke-dasharray: 18.2532; stroke-dashoffset: 18.2532; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#悲-bg7  { animation-delay: 2.45s; }
#悲-s7   { stroke-dasharray: 19.6400; stroke-dashoffset: 19.6400; animation: drawStroke 0.22s ease-out 2.58s forwards; }
#悲-bg8  { animation-delay: 2.82s; }
#悲-s8   { stroke-dasharray: 22.7169; stroke-dashoffset: 22.7169; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#悲-bg9  { animation-delay: 3.19s; }
#悲-s9   { stroke-dasharray: 17.9708; stroke-dashoffset: 17.9708; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#悲-bg10  { animation-delay: 3.56s; }
#悲-s10   { stroke-dasharray: 65.9578; stroke-dashoffset: 65.9578; animation: drawStroke 0.36s ease-out 3.69s forwards; }
#悲-bg11  { animation-delay: 4.07s; }
#悲-s11   { stroke-dasharray: 10.6092; stroke-dashoffset: 10.6092; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#悲-bg12  { animation-delay: 4.44s; }
#悲-s12   { stroke-dasharray: 14.5256; stroke-dashoffset: 14.5256; animation: drawStroke 0.22s ease-out 4.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #悲-s[i]) -->
<path id="悲-s1"  class="stroke" stroke="#bf0909" d="M42.54,12.48C43.72,13.66,44.28,15.13,44.3,16.22C44.88,50.75,44,58.38,28,68.25"/>
<path id="悲-s2"  class="stroke" stroke="#bf6409" d="M21.29,27.39C22.75,27.63,24.21,27.560000000000002,25.56,27.39C26.91,27.22,39.75,25.5,42.29,25.17"/>
