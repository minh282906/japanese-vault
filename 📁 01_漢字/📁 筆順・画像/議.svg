<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (議)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #議-bg[i]: Thời gian quả bóng số nảy lên
   - #議-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#議-bg1  { animation-delay: 0.05s; }
#議-s1   { stroke-dasharray: 10.8059; stroke-dashoffset: 10.8059; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#議-bg2  { animation-delay: 0.42s; }
#議-s2   { stroke-dasharray: 30.9713; stroke-dashoffset: 30.9713; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#議-bg3  { animation-delay: 0.79s; }
#議-s3   { stroke-dasharray: 19.8372; stroke-dashoffset: 19.8372; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#議-bg4  { animation-delay: 1.16s; }
#議-s4   { stroke-dasharray: 18.6996; stroke-dashoffset: 18.6996; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#議-bg5  { animation-delay: 1.53s; }
#議-s5   { stroke-dasharray: 19.8893; stroke-dashoffset: 19.8893; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#議-bg6  { animation-delay: 1.90s; }
#議-s6   { stroke-dasharray: 35.1026; stroke-dashoffset: 35.1026; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#議-bg7  { animation-delay: 2.27s; }
#議-s7   { stroke-dasharray: 15.8349; stroke-dashoffset: 15.8349; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#議-bg8  { animation-delay: 2.64s; }
#議-s8   { stroke-dasharray: 11.4430; stroke-dashoffset: 11.4430; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#議-bg9  { animation-delay: 3.01s; }
#議-s9   { stroke-dasharray: 14.5800; stroke-dashoffset: 14.5800; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#議-bg10  { animation-delay: 3.38s; }
#議-s10   { stroke-dasharray: 35.1149; stroke-dashoffset: 35.1149; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#議-bg11  { animation-delay: 3.75s; }
#議-s11   { stroke-dasharray: 15.7714; stroke-dashoffset: 15.7714; animation: drawStroke 0.22s ease-out 3.88s forwards; }
#議-bg12  { animation-delay: 4.12s; }
#議-s12   { stroke-dasharray: 29.9089; stroke-dashoffset: 29.9089; animation: drawStroke 0.22s ease-out 4.25s forwards; }
#議-bg13  { animation-delay: 4.49s; }
#議-s13   { stroke-dasharray: 45.5857; stroke-dashoffset: 45.5857; animation: drawStroke 0.25s ease-out 4.62s forwards; }
#議-bg14  { animation-delay: 4.89s; }
#議-s14   { stroke-dasharray: 17.2317; stroke-dashoffset: 17.2317; animation: drawStroke 0.22s ease-out 5.02s forwards; }
#議-bg15  { animation-delay: 5.26s; }
#議-s15   { stroke-dasharray: 49.6467; stroke-dashoffset: 49.6467; animation: drawStroke 0.27s ease-out 5.39s forwards; }
#議-bg16  { animation-delay: 5.68s; }
#議-s16   { stroke-dasharray: 45.5093; stroke-dashoffset: 45.5093; animation: drawStroke 0.25s ease-out 5.81s forwards; }
#議-bg17  { animation-delay: 6.08s; }
#議-s17   { stroke-dasharray: 21.8856; stroke-dashoffset: 21.8856; animation: drawStroke 0.22s ease-out 6.21s forwards; }
#議-bg18  { animation-delay: 6.45s; }
#議-s18   { stroke-dasharray: 66.1578; stroke-dashoffset: 66.1578; animation: drawStroke 0.36s ease-out 6.58s forwards; }
#議-bg19  { animation-delay: 6.96s; }
#議-s19   { stroke-dasharray: 33.6747; stroke-dashoffset: 33.6747; animation: drawStroke 0.22s ease-out 7.09s forwards; }
#議-bg20  { animation-delay: 7.33s; }
#議-s20   { stroke-dasharray: 9.5900; stroke-dashoffset: 9.5900; animation: drawStroke 0.22s ease-out 7.46s forwards; }
]]>
</style>

