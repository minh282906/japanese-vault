<g id="通-bg9"  class="badge-group"><circle cx="10.75" cy="52" r="3.5" fill="#9a09bf"/><text class="num-single" x="10.75" y="52" dx="0" dy="-0.5">9</text></g>
<g id="通-bg10" class="badge-group"><circle cx="10.75" cy="83.91" r="3.5" fill="#bf0976"/><text class="num-double" x="10.75" y="83.91" dx="-0.4" dy="-0.475">10</text></g>
</svg>