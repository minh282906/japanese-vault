<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (美)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #美-bg[i]: Thời gian quả bóng số nảy lên
   - #美-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#美-bg1  { animation-delay: 0.05s; }
#美-s1   { stroke-dasharray: 15.1910; stroke-dashoffset: 15.1910; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#美-bg2  { animation-delay: 0.42s; }
#美-s2   { stroke-dasharray: 16.0938; stroke-dashoffset: 16.0938; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#美-bg3  { animation-delay: 0.79s; }
#美-s3   { stroke-dasharray: 49.3620; stroke-dashoffset: 49.3620; animation: drawStroke 0.27s ease-out 0.92s forwards; }
#美-bg4  { animation-delay: 1.21s; }
#美-s4   { stroke-dasharray: 23.9658; stroke-dashoffset: 23.9658; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#美-bg5  { animation-delay: 1.58s; }
#美-s5   { stroke-dasharray: 44.2631; stroke-dashoffset: 44.2631; animation: drawStroke 0.24s ease-out 1.71s forwards; }
#美-bg6  { animation-delay: 1.97s; }
#美-s6   { stroke-dasharray: 56.1234; stroke-dashoffset: 56.1234; animation: drawStroke 0.31s ease-out 2.10s forwards; }
#美-bg7  { animation-delay: 2.43s; }
#美-s7   { stroke-dasharray: 81.9926; stroke-dashoffset: 81.9926; animation: drawStroke 0.45s ease-out 2.56s forwards; }
#美-bg8  { animation-delay: 3.03s; }
#美-s8   { stroke-dasharray: 58.4591; stroke-dashoffset: 58.4591; animation: drawStroke 0.32s ease-out 3.16s forwards; }
#美-bg9  { animation-delay: 3.50s; }
#美-s9   { stroke-dasharray: 48.3319; stroke-dashoffset: 48.3319; animation: drawStroke 0.27s ease-out 3.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #美-s[i]) -->
<path id="美-s1"  class="stroke" stroke="#bf0909" d="M35.64,15.4C38.92,17.47,44.11,23.93,44.93,27.16"/>
<path id="美-s2"  class="stroke" stroke="#bf8209" d="M70,11.82C70.03,12.14,70.12,12.67,69.94,13.11C68.62,16.439999999999998,66.75,19.689999999999998,61,24.689999999999998"/>
<path id="美-s3"  class="stroke" stroke="#82bf09" d="M29.5,30.21C32.11,30.7,34.480000000000004,30.490000000000002,36.59,30.240000000000002C43.970000000000006,29.35,64.83,27.3,72.76,26.8C74.7,26.68,76.72,26.54,78.63000000000001,27.080000000000002"/>
<path id="美-s4"  class="stroke" stroke="#09bf09" d="M52.49,29.82C53.35,30.32,54.04,32.06,54.04,33.07C54.04,39.07,54,45.32,54,53.32"/>
<path id="美-s5"  class="stroke" stroke="#09bf82" d="M31.75,42.71C33.63,43.2,36.480000000000004,43,38.46,42.730000000000004C45.68,41.75000000000001,59.900000000000006,39.96,69.38,39.17C71.47,39,73.50999999999999,38.940000000000005,75.75,39.33"/>
<path id="美-s6"  class="stroke" stroke="#0982bf" d="M26,55.77C29.19,56.2,32.1,55.980000000000004,35.04,55.620000000000005C43.33,54.63,64.49,52.620000000000005,72.97,51.88C75.83,51.63,79.03,51.440000000000005,81.87,52.11"/>
<path id="美-s7"  class="stroke" stroke="#0909bf" d="M13.25,71.93C16.09,72.66000000000001,19.46,72.77000000000001,22.53,72.45C40.730000000000004,70.57000000000001,65.47,67.91,84.66,66.63C88.05,66.41,91.86,66.25999999999999,94.88,66.82"/>
<path id="美-s8"  class="stroke" stroke="#8209bf" d="M52.93,57.82C53.25,58.94,53.22,60.11,52.99,61.36C49.370000000000005,80.94,36.5,94.57,18.25,100.07"/>
<path id="美-s9"  class="stroke" stroke="#bf0982" d="M54,69.57C61.37,74.89999999999999,76.27,86.55999999999999,85.51,92.11999999999999C88.16000000000001,93.71999999999998,91.10000000000001,95.49999999999999,94.25,95.82"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="美-bg1"  class="badge-group"><circle cx="35.64" cy="15.4" r="3.5" fill="#bf0909"/><text class="num-single" x="35.64" y="15.4" dx="0" dy="-0.5">1</text></g>
<g id="美-bg2"  class="badge-group"><circle cx="70" cy="11.82" r="3.5" fill="#bf8209"/><text class="num-single" x="70" y="11.82" dx="0" dy="-0.5">2</text></g>
<g id="美-bg3"  class="badge-group"><circle cx="29.5" cy="30.21" r="3.5" fill="#82bf09"/><text class="num-single" x="29.5" y="30.21" dx="0" dy="-0.5">3</text></g>
<g id="美-bg4"  class="badge-group"><circle cx="52.49" cy="29.82" r="3.5" fill="#09bf09"/><text class="num-single" x="52.49" y="29.82" dx="0" dy="-0.5">4</text></g>
<g id="美-bg5"  class="badge-group"><circle cx="31.75" cy="42.71" r="3.5" fill="#09bf82"/><text class="num-single" x="31.75" y="42.71" dx="0" dy="-0.5">5</text></g>
<g id="美-bg6"  class="badge-group"><circle cx="26" cy="55.77" r="3.5" fill="#0982bf"/><text class="num-single" x="26" y="55.77" dx="0" dy="-0.5">6</text></g>
<g id="美-bg7"  class="badge-group"><circle cx="13.25" cy="71.93" r="3.5" fill="#0909bf"/><text class="num-single" x="13.25" y="71.93" dx="0" dy="-0.5">7</text></g>
<g id="美-bg8"  class="badge-group"><circle cx="52.93" cy="57.82" r="3.5" fill="#8209bf"/><text class="num-single" x="52.93" y="57.82" dx="0" dy="-0.5">8</text></g>
<g id="美-bg9"  class="badge-group"><circle cx="54" cy="69.57" r="3.5" fill="#bf0982"/><text class="num-single" x="54" y="69.57" dx="0" dy="-0.5">9</text></g>
</svg>