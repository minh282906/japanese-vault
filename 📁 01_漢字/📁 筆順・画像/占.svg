<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (占)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #占-bg[i]: Thời gian quả bóng số nảy lên
   - #占-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#占-bg1  { animation-delay: 0.05s; }
#占-s1   { stroke-dasharray: 46.7279; stroke-dashoffset: 46.7279; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#占-bg2  { animation-delay: 0.46s; }
#占-s2   { stroke-dasharray: 24.2147; stroke-dashoffset: 24.2147; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#占-bg3  { animation-delay: 0.83s; }
#占-s3   { stroke-dasharray: 33.2606; stroke-dashoffset: 33.2606; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#占-bg4  { animation-delay: 1.20s; }
#占-s4   { stroke-dasharray: 77.2768; stroke-dashoffset: 77.2768; animation: drawStroke 0.43s ease-out 1.33s forwards; }
#占-bg5  { animation-delay: 1.78s; }
#占-s5   { stroke-dasharray: 41.9684; stroke-dashoffset: 41.9684; animation: drawStroke 0.23s ease-out 1.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #占-s[i]) -->
<path id="占-s1"  class="stroke" stroke="#bf0909" d="M53.06,13.88C54.400000000000006,15.22,54.82,16.62,54.82,18.380000000000003C54.82,19.290000000000003,54.82,52.620000000000005,54.82,60.13"/>
<path id="占-s2"  class="stroke" stroke="#9abf09" d="M56.25,34.75C65.25,34,74.5,32,75.75,32S79.25,32,80.25,32.25"/>
<path id="占-s3"  class="stroke" stroke="#09bf52" d="M28.88,62.25C30.09,63.36,30.7,64.45,31.04,66.07C32.88,74.75,33.75,80.5,35.26,88.94999999999999C35.6,90.86999999999999,35.83,92.71999999999998,36.08,94.40999999999998"/>
<path id="占-s4"  class="stroke" stroke="#0952bf" d="M31.37,63.88C44.49,62.11,65.12,60.260000000000005,77.12,59.47C80.46000000000001,59.25,82.78,61.129999999999995,81.99000000000001,64.63C80.48,71.25,78.42000000000002,78.35,76.41000000000001,86.69999999999999"/>
<path id="占-s5"  class="stroke" stroke="#9a09bf" d="M37.13,90.81C43.75,90.11,59.900000000000006,89.08,71.51,88.15C74.35000000000001,87.92,76.91000000000001,87.71000000000001,78.97,87.54"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="占-bg1"  class="badge-group"><circle cx="53.06" cy="13.88" r="3.5" fill="#bf0909"/><text class="num-single" x="53.06" y="13.88" dx="0" dy="-0.5">1</text></g>
<g id="占-bg2"  class="badge-group"><circle cx="56.25" cy="34.75" r="3.5" fill="#9abf09"/><text class="num-single" x="56.25" y="34.75" dx="0" dy="-0.5">2</text></g>
<g id="占-bg3"  class="badge-group"><circle cx="28.88" cy="58.75" r="3.5" fill="#09bf52"/><text class="num-single" x="28.88" y="58.75" dx="0" dy="-0.5">3</text></g>
<g id="占-bg4"  class="badge-group"><circle cx="31.37" cy="67.38" r="3.5" fill="#0952bf"/><text class="num-single" x="31.37" y="67.38" dx="0" dy="-0.5">4</text></g>
<g id="占-bg5"  class="badge-group"><circle cx="37.13" cy="90.81" r="3.5" fill="#9a09bf"/><text class="num-single" x="37.13" y="90.81" dx="0" dy="-0.5">5</text></g>
</svg>