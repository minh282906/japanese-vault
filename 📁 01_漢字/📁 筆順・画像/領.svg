<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (領)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #領-bg[i]: Thời gian quả bóng số nảy lên
   - #領-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#領-bg1  { animation-delay: 0.05s; }
#領-s1   { stroke-dasharray: 36.0103; stroke-dashoffset: 36.0103; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#領-bg2  { animation-delay: 0.42s; }
#領-s2   { stroke-dasharray: 20.3437; stroke-dashoffset: 20.3437; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#領-bg3  { animation-delay: 0.79s; }
#領-s3   { stroke-dasharray: 10.9384; stroke-dashoffset: 10.9384; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#領-bg4  { animation-delay: 1.16s; }
#領-s4   { stroke-dasharray: 55.0674; stroke-dashoffset: 55.0674; animation: drawStroke 0.30s ease-out 1.29s forwards; }
#領-bg5  { animation-delay: 1.61s; }
#領-s5   { stroke-dasharray: 18.4779; stroke-dashoffset: 18.4779; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#領-bg6  { animation-delay: 1.98s; }
#領-s6   { stroke-dasharray: 46.7979; stroke-dashoffset: 46.7979; animation: drawStroke 0.26s ease-out 2.11s forwards; }
#領-bg7  { animation-delay: 2.39s; }
#領-s7   { stroke-dasharray: 14.3350; stroke-dashoffset: 14.3350; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#領-bg8  { animation-delay: 2.76s; }
#領-s8   { stroke-dasharray: 43.9582; stroke-dashoffset: 43.9582; animation: drawStroke 0.24s ease-out 2.89s forwards; }
#領-bg9  { animation-delay: 3.15s; }
#領-s9   { stroke-dasharray: 72.1368; stroke-dashoffset: 72.1368; animation: drawStroke 0.40s ease-out 3.28s forwards; }
#領-bg10  { animation-delay: 3.70s; }
#領-s10   { stroke-dasharray: 28.4151; stroke-dashoffset: 28.4151; animation: drawStroke 0.22s ease-out 3.83s forwards; }
#領-bg11  { animation-delay: 4.07s; }
#領-s11   { stroke-dasharray: 28.8660; stroke-dashoffset: 28.8660; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#領-bg12  { animation-delay: 4.44s; }
#領-s12   { stroke-dasharray: 28.6060; stroke-dashoffset: 28.6060; animation: drawStroke 0.22s ease-out 4.57s forwards; }
#領-bg13  { animation-delay: 4.81s; }
#領-s13   { stroke-dasharray: 22.0989; stroke-dashoffset: 22.0989; animation: drawStroke 0.22s ease-out 4.94s forwards; }
#領-bg14  { animation-delay: 5.18s; }
#領-s14   { stroke-dasharray: 19.5442; stroke-dashoffset: 19.5442; animation: drawStroke 0.22s ease-out 5.31s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

