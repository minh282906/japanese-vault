<path id="領-s10"  class="stroke" stroke="#0923bf" d="M58.86,48.7C66,47.75,81.23,45.86,87.09,45.49"/>
<path id="領-s11"  class="stroke" stroke="#3d09bf" d="M58.58,61.98C68.12,60.62,79.83,59.73,87.31,59.25"/>
