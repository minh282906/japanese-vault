<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (永)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #永-bg[i]: Thời gian quả bóng số nảy lên
   - #永-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#永-bg1  { animation-delay: 0.05s; }
#永-s1   { stroke-dasharray: 14.1981; stroke-dashoffset: 14.1981; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#永-bg2  { animation-delay: 0.42s; }
#永-s2   { stroke-dasharray: 92.3162; stroke-dashoffset: 92.3162; animation: drawStroke 0.51s ease-out 0.55s forwards; }
#永-bg3  { animation-delay: 1.08s; }
#永-s3   { stroke-dasharray: 64.5385; stroke-dashoffset: 64.5385; animation: drawStroke 0.35s ease-out 1.21s forwards; }
#永-bg4  { animation-delay: 1.58s; }
#永-s4   { stroke-dasharray: 27.8872; stroke-dashoffset: 27.8872; animation: drawStroke 0.22s ease-out 1.71s forwards; }
#永-bg5  { animation-delay: 1.95s; }
#永-s5   { stroke-dasharray: 45.6523; stroke-dashoffset: 45.6523; animation: drawStroke 0.25s ease-out 2.08s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #永-s[i]) -->
<path id="永-s1"  class="stroke" stroke="#bf0909" d="M45.5,13.25C50.62,15.65,54.12,19,56.25,22.25"/>
<path id="永-s2"  class="stroke" stroke="#9abf09" d="M31.75,37.25C33.63,38,35.87,38.25,37.82,37.8C41.44,36.97,47.230000000000004,35.29,50.86,34.449999999999996C53.86,33.74999999999999,56.019999999999996,35.24999999999999,56.019999999999996,38.49999999999999C56.019999999999996,52.99999999999999,55.76,83.94999999999999,55.76,88.5C55.76,100.5,48.739999999999995,91.34,47.239999999999995,90.2"/>
<path id="永-s3"  class="stroke" stroke="#09bf52" d="M14.25,58.68C16,59.13,17.71,58.98,19.25,58.66C21.75,58.129999999999995,32.09,55.12,34.59,54.169999999999995C37.09,53.21999999999999,39.24,54.94,38.34,57.019999999999996C33.5,68.25,25.75,79.75,16,86.37"/>
<path id="永-s4"  class="stroke" stroke="#0952bf" d="M81.22,36.52C81.12,37.63,80.44,38.550000000000004,79.7,39.220000000000006C74.87,43.60000000000001,65.74000000000001,48.95,58.24,51.14000000000001"/>
<path id="永-s5"  class="stroke" stroke="#9a09bf" d="M58,52.74C67.88,62.260000000000005,78.02,71.59,87.07,77.58C89.08,78.91,91.11999999999999,80.24,93.5,81.14"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="永-bg1"  class="badge-group"><circle cx="45.5" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="45.5" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="永-bg2"  class="badge-group"><circle cx="31.75" cy="37.25" r="3.5" fill="#9abf09"/><text class="num-single" x="31.75" y="37.25" dx="0" dy="-0.5">2</text></g>
<g id="永-bg3"  class="badge-group"><circle cx="14.25" cy="58.68" r="3.5" fill="#09bf52"/><text class="num-single" x="14.25" y="58.68" dx="0" dy="-0.5">3</text></g>
<g id="永-bg4"  class="badge-group"><circle cx="81.22" cy="36.52" r="3.5" fill="#0952bf"/><text class="num-single" x="81.22" y="36.52" dx="0" dy="-0.5">4</text></g>
<g id="永-bg5"  class="badge-group"><circle cx="58" cy="52.74" r="3.5" fill="#9a09bf"/><text class="num-single" x="58" y="52.74" dx="0" dy="-0.5">5</text></g>
</svg>