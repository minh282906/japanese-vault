<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (質)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #質-bg[i]: Thời gian quả bóng số nảy lên
   - #質-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#質-bg1  { animation-delay: 0.05s; }
#質-s1   { stroke-dasharray: 18.9819; stroke-dashoffset: 18.9819; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#質-bg2  { animation-delay: 0.42s; }
#質-s2   { stroke-dasharray: 31.0006; stroke-dashoffset: 31.0006; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#質-bg3  { animation-delay: 0.79s; }
#質-s3   { stroke-dasharray: 22.7367; stroke-dashoffset: 22.7367; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#質-bg4  { animation-delay: 1.16s; }
#質-s4   { stroke-dasharray: 17.7401; stroke-dashoffset: 17.7401; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#質-bg5  { animation-delay: 1.53s; }
#質-s5   { stroke-dasharray: 18.6944; stroke-dashoffset: 18.6944; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#質-bg6  { animation-delay: 1.90s; }
#質-s6   { stroke-dasharray: 25.4067; stroke-dashoffset: 25.4067; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#質-bg7  { animation-delay: 2.27s; }
#質-s7   { stroke-dasharray: 28.7402; stroke-dashoffset: 28.7402; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#質-bg8  { animation-delay: 2.64s; }
#質-s8   { stroke-dasharray: 17.7401; stroke-dashoffset: 17.7401; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#質-bg9  { animation-delay: 3.01s; }
#質-s9   { stroke-dasharray: 34.4894; stroke-dashoffset: 34.4894; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#質-bg10  { animation-delay: 3.38s; }
#質-s10   { stroke-dasharray: 69.3880; stroke-dashoffset: 69.3880; animation: drawStroke 0.38s ease-out 3.51s forwards; }
#質-bg11  { animation-delay: 3.91s; }
#質-s11   { stroke-dasharray: 35.6285; stroke-dashoffset: 35.6285; animation: drawStroke 0.22s ease-out 4.04s forwards; }
#質-bg12  { animation-delay: 4.28s; }
#質-s12   { stroke-dasharray: 34.9594; stroke-dashoffset: 34.9594; animation: drawStroke 0.22s ease-out 4.41s forwards; }
#質-bg13  { animation-delay: 4.65s; }
#質-s13   { stroke-dasharray: 34.9597; stroke-dashoffset: 34.9597; animation: drawStroke 0.22s ease-out 4.78s forwards; }
#質-bg14  { animation-delay: 5.02s; }
#質-s14   { stroke-dasharray: 23.3935; stroke-dashoffset: 23.3935; animation: drawStroke 0.22s ease-out 5.15s forwards; }
#質-bg15  { animation-delay: 5.39s; }
#質-s15   { stroke-dasharray: 22.0836; stroke-dashoffset: 22.0836; animation: drawStroke 0.22s ease-out 5.52s forwards; }
]]>
</style>

