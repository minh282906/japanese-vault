<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (述)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #述-bg[i]: Thời gian quả bóng số nảy lên
   - #述-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#述-bg1  { animation-delay: 0.05s; }
#述-s1   { stroke-dasharray: 44.5671; stroke-dashoffset: 44.5671; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#述-bg2  { animation-delay: 0.45s; }
#述-s2   { stroke-dasharray: 63.9995; stroke-dashoffset: 63.9995; animation: drawStroke 0.35s ease-out 0.58s forwards; }
#述-bg3  { animation-delay: 0.95s; }
#述-s3   { stroke-dasharray: 31.4507; stroke-dashoffset: 31.4507; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#述-bg4  { animation-delay: 1.32s; }
#述-s4   { stroke-dasharray: 26.5233; stroke-dashoffset: 26.5233; animation: drawStroke 0.22s ease-out 1.45s forwards; }
#述-bg5  { animation-delay: 1.69s; }
#述-s5   { stroke-dasharray: 13.7370; stroke-dashoffset: 13.7370; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#述-bg6  { animation-delay: 2.06s; }
#述-s6   { stroke-dasharray: 14.3745; stroke-dashoffset: 14.3745; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#述-bg7  { animation-delay: 2.43s; }
#述-s7   { stroke-dasharray: 56.2126; stroke-dashoffset: 56.2126; animation: drawStroke 0.31s ease-out 2.56s forwards; }
#述-bg8  { animation-delay: 2.89s; }
#述-s8   { stroke-dasharray: 78.1899; stroke-dashoffset: 78.1899; animation: drawStroke 0.43s ease-out 3.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #述-s[i]) -->
<path id="述-s1"  class="stroke" stroke="#bf0909" d="M41.11,35C43.25,35.5,45.62,35.46,47.9,35.09C57,33.62,70.75,32,80.14,31.14C81.62,31,83.92,30.87,85.36,31.29"/>
<path id="述-s2"  class="stroke" stroke="#bf9109" d="M61.87,13.5C62.87,14.5,63.669999999999995,16,63.669999999999995,17.38C63.669999999999995,18.16,63.76,52.25,63.76,69.12C63.76,73,63.72,74.5,63.72,77"/>
<path id="述-s3"  class="stroke" stroke="#64bf09" d="M50.58,44.5C51,45.38,50.98,46.66,50.82,47.4C48.88,56.5,44.75,65.25,38.5,72.78999999999999"/>
<path id="述-s4"  class="stroke" stroke="#09bf36" d="M75.37,46.08C79.25,51,84.5,62.75,85.95,70.22"/>
<path id="述-s5"  class="stroke" stroke="#09bfbf" d="M75.44,14.33C79.5,16.62,83.63,20.5,85.56,23.46"/>
<path id="述-s6"  class="stroke" stroke="#0936bf" d="M18.71,18C22.630000000000003,20.5,27.130000000000003,24.62,29,27.880000000000003"/>
<path id="述-s7"  class="stroke" stroke="#6409bf" d="M12.5,53.86C14.120000000000001,54.12,16.03,54.5,17.5,54.089999999999996C20,53.379999999999995,24.75,51.44,26.25,50.989999999999995S29.67,51.919999999999995,29,53.459999999999994C24,64.86999999999999,22.38,60.61999999999999,29,67.53999999999999C30.07,68.64999999999999,29.9,70.13999999999999,28.5,71.38999999999999C24.12,75.25,19,78.88,16,81.5"/>
<path id="述-s8"  class="stroke" stroke="#bf0991" d="M12.75,83C15.75,82.5,21.65,81.92,26.25,82.25C33.13,82.75,56.32,88.96,60.75,90.25C72.75,93.75,79.87,94.5,89.5,94.75"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="述-bg1"  class="badge-group"><circle cx="41.11" cy="35" r="3.5" fill="#bf0909"/><text class="num-single" x="41.11" y="35" dx="0" dy="-0.5">1</text></g>
<g id="述-bg2"  class="badge-group"><circle cx="61.87" cy="13.5" r="3.5" fill="#bf9109"/><text class="num-single" x="61.87" y="13.5" dx="0" dy="-0.5">2</text></g>
<g id="述-bg3"  class="badge-group"><circle cx="50.58" cy="44.5" r="3.5" fill="#64bf09"/><text class="num-single" x="50.58" y="44.5" dx="0" dy="-0.5">3</text></g>
<g id="述-bg4"  class="badge-group"><circle cx="75.37" cy="46.08" r="3.5" fill="#09bf36"/><text class="num-single" x="75.37" y="46.08" dx="0" dy="-0.5">4</text></g>
<g id="述-bg5"  class="badge-group"><circle cx="75.44" cy="14.33" r="3.5" fill="#09bfbf"/><text class="num-single" x="75.44" y="14.33" dx="0" dy="-0.5">5</text></g>
<g id="述-bg6"  class="badge-group"><circle cx="18.71" cy="18" r="3.5" fill="#0936bf"/><text class="num-single" x="18.71" y="18" dx="0" dy="-0.5">6</text></g>
<g id="述-bg7"  class="badge-group"><circle cx="12.5" cy="53.86" r="3.5" fill="#6409bf"/><text class="num-single" x="12.5" y="53.86" dx="0" dy="-0.5">7</text></g>
<g id="述-bg8"  class="badge-group"><circle cx="12.75" cy="83" r="3.5" fill="#bf0991"/><text class="num-single" x="12.75" y="83" dx="0" dy="-0.5">8</text></g>
</svg>