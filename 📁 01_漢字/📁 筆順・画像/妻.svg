<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (妻)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #妻-bg[i]: Thời gian quả bóng số nảy lên
   - #妻-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#妻-bg1  { animation-delay: 0.05s; }
#妻-s1   { stroke-dasharray: 47.9934; stroke-dashoffset: 47.9934; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#妻-bg2  { animation-delay: 0.46s; }
#妻-s2   { stroke-dasharray: 70.3344; stroke-dashoffset: 70.3344; animation: drawStroke 0.39s ease-out 0.59s forwards; }
#妻-bg3  { animation-delay: 1.00s; }
#妻-s3   { stroke-dasharray: 73.1684; stroke-dashoffset: 73.1684; animation: drawStroke 0.40s ease-out 1.13s forwards; }
#妻-bg4  { animation-delay: 1.55s; }
#妻-s4   { stroke-dasharray: 42.1837; stroke-dashoffset: 42.1837; animation: drawStroke 0.23s ease-out 1.68s forwards; }
#妻-bg5  { animation-delay: 1.93s; }
#妻-s5   { stroke-dasharray: 44.8734; stroke-dashoffset: 44.8734; animation: drawStroke 0.25s ease-out 2.06s forwards; }
#妻-bg6  { animation-delay: 2.33s; }
#妻-s6   { stroke-dasharray: 75.0629; stroke-dashoffset: 75.0629; animation: drawStroke 0.41s ease-out 2.46s forwards; }
#妻-bg7  { animation-delay: 2.89s; }
#妻-s7   { stroke-dasharray: 57.6307; stroke-dashoffset: 57.6307; animation: drawStroke 0.32s ease-out 3.02s forwards; }
#妻-bg8  { animation-delay: 3.36s; }
#妻-s8   { stroke-dasharray: 81.9484; stroke-dashoffset: 81.9484; animation: drawStroke 0.45s ease-out 3.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #妻-s[i]) -->
<path id="妻-s1"  class="stroke" stroke="#bf0909" d="M31.75,22.64C33.75,23.25,36.269999999999996,23.29,38.12,23.02C46.879999999999995,21.75,65.03999999999999,20.04,73.19999999999999,19.85C75.17999999999999,19.8,77.57,19.78,79.49999999999999,20.25"/>
<path id="妻-s2"  class="stroke" stroke="#bf9109" d="M30.39,34.12C32.25,34.5,33.82,34.69,35.8,34.55C47.849999999999994,33.69,64.25,31.499999999999996,74.19,30.749999999999996C76.98,30.539999999999996,78.32,33.19,77.49,35.23C75.25,40.75,74.25,46.5,72.05,54.05"/>
<path id="妻-s3"  class="stroke" stroke="#64bf09" d="M19.14,46.38C22.07,46.71,24.69,46.81,27.630000000000003,46.550000000000004C44.980000000000004,45.010000000000005,69.02000000000001,43.300000000000004,83.63,42.580000000000005C86.57,42.43000000000001,89.22999999999999,42.50000000000001,92.11,43.080000000000005"/>
<path id="妻-s4"  class="stroke" stroke="#09bf36" d="M31.68,58.25C33.98,58.53,36.16,58.37,38.45,58.12C49.03,56.93,60.46000000000001,55.72,67.62,55.29C69.66000000000001,55.17,71.66000000000001,55.11,73.7,55.32"/>
<path id="妻-s5"  class="stroke" stroke="#09bfbf" d="M53.12,10.75C53.87,11.5,54.58,13,54.58,14.25C54.58,16.63,54.61,47.5,54.61,55.25"/>
<path id="妻-s6"  class="stroke" stroke="#0936bf" d="M47.96,60.12C48.25,61.25,48.08,62.839999999999996,47.46,64.05C46,66.88,41.75,74,37.25,79.67C35.02,82.48,35.74,82.88,38.75,82.95C51.5,83.25,59.75,86,67.8,89.37C73.27,91.66000000000001,77.5,94,81.75,97.94"/>
<path id="妻-s7"  class="stroke" stroke="#6409bf" d="M67.12,64.24C67.25,65.08,67.09,67.11999999999999,66.61,68.33999999999999C62.75,78.2,52.86,91.67,25.25,99"/>
<path id="妻-s8"  class="stroke" stroke="#bf0991" d="M13.38,74.06C16.61,74.9,20.11,74.59,23.380000000000003,74.27C37.58,72.89,66.28999999999999,69.84,84.01,69.24C87.54,69.11999999999999,91.63000000000001,69.11999999999999,95.01,69.86"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="妻-bg1"  class="badge-group"><circle cx="31.75" cy="22.64" r="3.5" fill="#bf0909"/><text class="num-single" x="31.75" y="22.64" dx="0" dy="-0.5">1</text></g>
<g id="妻-bg2"  class="badge-group"><circle cx="30.39" cy="34.12" r="3.5" fill="#bf9109"/><text class="num-single" x="30.39" y="34.12" dx="0" dy="-0.5">2</text></g>
<g id="妻-bg3"  class="badge-group"><circle cx="19.14" cy="46.38" r="3.5" fill="#64bf09"/><text class="num-single" x="19.14" y="46.38" dx="0" dy="-0.5">3</text></g>
<g id="妻-bg4"  class="badge-group"><circle cx="31.68" cy="58.25" r="3.5" fill="#09bf36"/><text class="num-single" x="31.68" y="58.25" dx="0" dy="-0.5">4</text></g>
<g id="妻-bg5"  class="badge-group"><circle cx="53.12" cy="10.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="53.12" y="10.75" dx="0" dy="-0.5">5</text></g>
<g id="妻-bg6"  class="badge-group"><circle cx="47.96" cy="60.12" r="3.5" fill="#0936bf"/><text class="num-single" x="47.96" y="60.12" dx="0" dy="-0.5">6</text></g>
<g id="妻-bg7"  class="badge-group"><circle cx="67.12" cy="64.24" r="3.5" fill="#6409bf"/><text class="num-single" x="67.12" y="64.24" dx="0" dy="-0.5">7</text></g>
<g id="妻-bg8"  class="badge-group"><circle cx="13.38" cy="74.06" r="3.5" fill="#bf0991"/><text class="num-single" x="13.38" y="74.06" dx="0" dy="-0.5">8</text></g>
</svg>