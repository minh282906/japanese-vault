<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (商)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #商-bg[i]: Thời gian quả bóng số nảy lên
   - #商-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#商-bg1  { animation-delay: 0.05s; }
#商-s1   { stroke-dasharray: 12.7940; stroke-dashoffset: 12.7940; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#商-bg2  { animation-delay: 0.42s; }
#商-s2   { stroke-dasharray: 74.8528; stroke-dashoffset: 74.8528; animation: drawStroke 0.41s ease-out 0.55s forwards; }
#商-bg3  { animation-delay: 0.98s; }
#商-s3   { stroke-dasharray: 15.7245; stroke-dashoffset: 15.7245; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#商-bg4  { animation-delay: 1.35s; }
#商-s4   { stroke-dasharray: 16.9801; stroke-dashoffset: 16.9801; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#商-bg5  { animation-delay: 1.72s; }
#商-s5   { stroke-dasharray: 50.0279; stroke-dashoffset: 50.0279; animation: drawStroke 0.28s ease-out 1.85s forwards; }
#商-bg6  { animation-delay: 2.15s; }
#商-s6   { stroke-dasharray: 120.5540; stroke-dashoffset: 120.5540; animation: drawStroke 0.55s ease-out 2.28s forwards; }
#商-bg7  { animation-delay: 2.85s; }
#商-s7   { stroke-dasharray: 21.9347; stroke-dashoffset: 21.9347; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#商-bg8  { animation-delay: 3.22s; }
#商-s8   { stroke-dasharray: 29.4611; stroke-dashoffset: 29.4611; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#商-bg9  { animation-delay: 3.59s; }
#商-s9   { stroke-dasharray: 18.2473; stroke-dashoffset: 18.2473; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#商-bg10  { animation-delay: 3.96s; }
#商-s10   { stroke-dasharray: 43.6513; stroke-dashoffset: 43.6513; animation: drawStroke 0.24s ease-out 4.09s forwards; }
#商-bg11  { animation-delay: 4.35s; }
#商-s11   { stroke-dasharray: 25.2254; stroke-dashoffset: 25.2254; animation: drawStroke 0.22s ease-out 4.48s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

