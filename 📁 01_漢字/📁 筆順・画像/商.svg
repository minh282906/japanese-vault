<path id="商-s8"  class="stroke" stroke="#092abf" d="M61.1,49.37C61.61,49.879999999999995,61.83,51.16,61.83,51.9C61.83,53.629999999999995,61.8,56.129999999999995,61.8,57.699999999999996C61.8,61.12,62.379999999999995,62.08,71.16,62.08C76.06,62.08,79.28999999999999,61.41,79.97999999999999,61.03"/>
<path id="商-s9"  class="stroke" stroke="#4b09bf" d="M39.31,71.82C40,72.38,40.5,73,40.62,73.93C41.19,78.33000000000001,41.779999999999994,82.09,42.48,86.88000000000001C42.61,87.77000000000001,42.75,88.46000000000001,42.88999999999999,89.46000000000001"/>
<path id="商-s10"  class="stroke" stroke="#ae09bf" d="M41.98,73.23C49.91,72.41000000000001,60.26,70.77000000000001,65.88,70.19C69.11,69.86,70.81,70.69,69.86999999999999,74.14C68.96,77.52,67.78999999999999,82.17,66.43999999999998,85.9"/>
<path id="商-s11"  class="stroke" stroke="#bf096c" d="M43.35,87.9C48.56,87.54,56.900000000000006,86.92,65.26,86.54C66.35000000000001,86.49000000000001,67.44000000000001,86.45,68.53,86.41000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="商-bg1"  class="badge-group"><circle cx="52.86" cy="12.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.86" y="12.25" dx="0" dy="-0.5">1</text></g>
