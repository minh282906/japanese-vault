<path id="商-s1"  class="stroke" stroke="#bf0909" d="M52.86,12.25C53.87,13.26,54.589999999999996,14.71,54.589999999999996,15.91C54.589999999999996,17.5,54.44,21.75,54.44,24.560000000000002"/>
