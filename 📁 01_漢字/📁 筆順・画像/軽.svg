<path id="軽-s7"  class="stroke" stroke="#09bfbf" d="M28.56,11.63C29.959999999999997,13.030000000000001,30.32,15.120000000000001,30.32,17.54C30.32,18.61,30.240000000000002,72.88,30.12,90.25C30.1,92.44,30.09,94.04,30.07,94.88"/>
