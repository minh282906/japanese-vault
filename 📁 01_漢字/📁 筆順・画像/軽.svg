<path id="軽-s1"  class="stroke" stroke="#bf0909" d="M13.25,28.56C15.02,29.119999999999997,17.06,28.91,18.87,28.779999999999998C27.090000000000003,28.179999999999996,33.870000000000005,26.74,41.39,25.9C43.160000000000004,25.7,44.980000000000004,25.479999999999997,46.75,25.81"/>
