<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (軽)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #軽-bg[i]: Thời gian quả bóng số nảy lên
   - #軽-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#軽-bg1  { animation-delay: 0.05s; }
#軽-s1   { stroke-dasharray: 33.7500; stroke-dashoffset: 33.7500; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#軽-bg2  { animation-delay: 0.42s; }
#軽-s2   { stroke-dasharray: 25.5721; stroke-dashoffset: 25.5721; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#軽-bg3  { animation-delay: 0.79s; }
#軽-s3   { stroke-dasharray: 52.9712; stroke-dashoffset: 52.9712; animation: drawStroke 0.29s ease-out 0.92s forwards; }
#軽-bg4  { animation-delay: 1.23s; }
#軽-s4   { stroke-dasharray: 25.5521; stroke-dashoffset: 25.5521; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#軽-bg5  { animation-delay: 1.60s; }
#軽-s5   { stroke-dasharray: 22.0225; stroke-dashoffset: 22.0225; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#軽-bg6  { animation-delay: 1.97s; }
#軽-s6   { stroke-dasharray: 37.7893; stroke-dashoffset: 37.7893; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#軽-bg7  { animation-delay: 2.34s; }
#軽-s7   { stroke-dasharray: 83.6722; stroke-dashoffset: 83.6722; animation: drawStroke 0.46s ease-out 2.47s forwards; }
#軽-bg8  { animation-delay: 2.95s; }
#軽-s8   { stroke-dasharray: 81.0169; stroke-dashoffset: 81.0169; animation: drawStroke 0.45s ease-out 3.08s forwards; }
#軽-bg9  { animation-delay: 3.55s; }
#軽-s9   { stroke-dasharray: 47.7565; stroke-dashoffset: 47.7565; animation: drawStroke 0.26s ease-out 3.68s forwards; }
#軽-bg10  { animation-delay: 3.96s; }
#軽-s10   { stroke-dasharray: 33.4298; stroke-dashoffset: 33.4298; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#軽-bg11  { animation-delay: 4.33s; }
#軽-s11   { stroke-dasharray: 31.3230; stroke-dashoffset: 31.3230; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#軽-bg12  { animation-delay: 4.70s; }
#軽-s12   { stroke-dasharray: 48.3817; stroke-dashoffset: 48.3817; animation: drawStroke 0.27s ease-out 4.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

