<path id="軽-s9"  class="stroke" stroke="#0909bf" d="M56,32.12C59.38,32.779999999999994,74.3,48.36,86.49,56.67999999999999C88.78,58.24999999999999,91.25,59.989999999999995,94,60.599999999999994"/>
<path id="軽-s10"  class="stroke" stroke="#6409bf" d="M53.36,71.83C54.49,72.11,56.55,72.21,57.67,72.11C65.99000000000001,71.37,74.87,70.25,82.69,69.72C84.56,69.59,85.69,69.85,86.63,70"/>
<path id="軽-s11"  class="stroke" stroke="#bf09bf" d="M68.63,56.87C69.69999999999999,57.94,70.14999999999999,58.879999999999995,70.14999999999999,60.53C70.14999999999999,68.21000000000001,70.08999999999999,80.01,70.08999999999999,87.76"/>
<path id="軽-s12"  class="stroke" stroke="#bf0964" d="M46.22,89.75C47.85,90.33,50.839999999999996,90.47,52.46,90.33C67.21000000000001,89.05,72.49000000000001,88.39,88.71000000000001,87.97C91.42,87.9,93.05000000000001,88.25,94.41000000000001,88.53999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="軽-bg1"  class="badge-group"><circle cx="13.25" cy="28.56" r="3.5" fill="#bf0909"/><text class="num-single" x="13.25" y="28.56" dx="0" dy="-0.5">1</text></g>
