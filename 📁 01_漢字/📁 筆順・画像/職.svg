<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (職)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #職-bg[i]: Thời gian quả bóng số nảy lên
   - #職-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#職-bg1  { animation-delay: 0.05s; }
#職-s1   { stroke-dasharray: 30.2236; stroke-dashoffset: 30.2236; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#職-bg2  { animation-delay: 0.42s; }
#職-s2   { stroke-dasharray: 41.9776; stroke-dashoffset: 41.9776; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#職-bg3  { animation-delay: 0.80s; }
#職-s3   { stroke-dasharray: 13.4019; stroke-dashoffset: 13.4019; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#職-bg4  { animation-delay: 1.17s; }
#職-s4   { stroke-dasharray: 13.5439; stroke-dashoffset: 13.5439; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#職-bg5  { animation-delay: 1.54s; }
#職-s5   { stroke-dasharray: 24.8083; stroke-dashoffset: 24.8083; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#職-bg6  { animation-delay: 1.91s; }
#職-s6   { stroke-dasharray: 71.4251; stroke-dashoffset: 71.4251; animation: drawStroke 0.39s ease-out 2.04s forwards; }
#職-bg7  { animation-delay: 2.45s; }
#職-s7   { stroke-dasharray: 12.2166; stroke-dashoffset: 12.2166; animation: drawStroke 0.22s ease-out 2.58s forwards; }
#職-bg8  { animation-delay: 2.82s; }
#職-s8   { stroke-dasharray: 22.6612; stroke-dashoffset: 22.6612; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#職-bg9  { animation-delay: 3.19s; }
#職-s9   { stroke-dasharray: 12.0534; stroke-dashoffset: 12.0534; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#職-bg10  { animation-delay: 3.56s; }
#職-s10   { stroke-dasharray: 17.0807; stroke-dashoffset: 17.0807; animation: drawStroke 0.22s ease-out 3.69s forwards; }
#職-bg11  { animation-delay: 3.93s; }
#職-s11   { stroke-dasharray: 56.5128; stroke-dashoffset: 56.5128; animation: drawStroke 0.31s ease-out 4.06s forwards; }
#職-bg12  { animation-delay: 4.39s; }
#職-s12   { stroke-dasharray: 28.1498; stroke-dashoffset: 28.1498; animation: drawStroke 0.22s ease-out 4.52s forwards; }
#職-bg13  { animation-delay: 4.76s; }
#職-s13   { stroke-dasharray: 44.9720; stroke-dashoffset: 44.9720; animation: drawStroke 0.25s ease-out 4.89s forwards; }
#職-bg14  { animation-delay: 5.16s; }
#職-s14   { stroke-dasharray: 17.6546; stroke-dashoffset: 17.6546; animation: drawStroke 0.22s ease-out 5.29s forwards; }
#職-bg15  { animation-delay: 5.53s; }
#職-s15   { stroke-dasharray: 16.9947; stroke-dashoffset: 16.9947; animation: drawStroke 0.22s ease-out 5.66s forwards; }
#職-bg16  { animation-delay: 5.90s; }
#職-s16   { stroke-dasharray: 99.8303; stroke-dashoffset: 99.8303; animation: drawStroke 0.55s ease-out 6.03s forwards; }
#職-bg17  { animation-delay: 6.60s; }
#職-s17   { stroke-dasharray: 38.1313; stroke-dashoffset: 38.1313; animation: drawStroke 0.22s ease-out 6.73s forwards; }
#職-bg18  { animation-delay: 6.97s; }
#職-s18   { stroke-dasharray: 13.3699; stroke-dashoffset: 13.3699; animation: drawStroke 0.22s ease-out 7.10s forwards; }
]]>
</style>

