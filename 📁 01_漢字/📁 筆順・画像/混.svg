<path id="混-s4"  class="stroke" stroke="#4bbf09" d="M41.05,19.04C42,19.99,42.76,21.24,42.97,22.86C43.57,27.509999999999998,45.089999999999996,38.55,45.93,44.69C46.27,47.18,46.49,48.86,46.49,48.97"/>
<path id="混-s5"  class="stroke" stroke="#09bf2a" d="M43.62,21C54.67,19.22,69.55,17.32,79.37,16.81C82.83,16.63,84.30000000000001,17.57,83.85000000000001,21.259999999999998C83.45,24.529999999999998,82.12,34.14,80.65,42.33C80.4,43.699999999999996,80.15,45.03,79.9,46.29"/>
<path id="混-s6"  class="stroke" stroke="#09bf8d" d="M45.59,33.61C53.63,32.63,75.5,30.75,81.43,30.38"/>
<path id="混-s7"  class="stroke" stroke="#098dbf" d="M47.33,46.73C55.879999999999995,45.75,70.15,44.419999999999995,79.08,44"/>
<path id="混-s8"  class="stroke" stroke="#092abf" d="M46.5,69.75C50.25,69.5,57.25,66.75,58.25,66.75S59.75,66.5,61.25,66.75"/>
<path id="混-s9"  class="stroke" stroke="#4b09bf" d="M43.72,55.7C44.449999999999996,56.43,45.089999999999996,57.650000000000006,45.089999999999996,58.49C45.089999999999996,63.260000000000005,45.089999999999996,80.13,45.089999999999996,86.85C45.089999999999996,89.85,46.029999999999994,91.19,49.08,88.75999999999999C52.379999999999995,86.13,56.01,83.25999999999999,59.23,80.74"/>
<path id="混-s10"  class="stroke" stroke="#ae09bf" d="M89.68,57.29C89.87,58.25,89.37,59.62,88.55000000000001,60.379999999999995C82.70000000000002,65.78,79.75000000000001,67,72.50000000000001,70.94"/>
<path id="混-s11"  class="stroke" stroke="#bf096c" d="M68.63,55.25C69.5,56.12,70.06,57.75,70.06,59.13C70.06,63.75,69.82000000000001,76.25,69.82000000000001,83.19C69.82000000000001,90.50999999999999,71.74000000000001,92.33,82.65,92.33C92.49000000000001,92.33,94.56,91.25,94.56,84.81"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="混-bg1"  class="badge-group"><circle cx="19.88" cy="16.25" r="3.5" fill="#bf0909"/><text class="num-single" x="19.88" y="16.25" dx="0" dy="-0.5">1</text></g>
<g id="混-bg2"  class="badge-group"><circle cx="17.25" cy="40.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="17.25" y="40.5" dx="0" dy="-0.5">2</text></g>
