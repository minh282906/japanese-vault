<g id="混-bg10" class="badge-group"><circle cx="89.68" cy="57.29" r="3.5" fill="#ae09bf"/><text class="num-double" x="89.68" y="57.29" dx="-0.4" dy="-0.475">10</text></g>
<g id="混-bg11" class="badge-group"><circle cx="68.63" cy="55.25" r="3.5" fill="#bf096c"/><text class="num-double" x="68.63" y="55.25" dx="-0.4" dy="-0.475">11</text></g>
</svg>