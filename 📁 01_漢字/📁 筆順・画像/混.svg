<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (混)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #混-bg[i]: Thời gian quả bóng số nảy lên
   - #混-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#混-bg1  { animation-delay: 0.05s; }
#混-s1   { stroke-dasharray: 12.7746; stroke-dashoffset: 12.7746; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#混-bg2  { animation-delay: 0.42s; }
#混-s2   { stroke-dasharray: 12.0847; stroke-dashoffset: 12.0847; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#混-bg3  { animation-delay: 0.79s; }
#混-s3   { stroke-dasharray: 22.9165; stroke-dashoffset: 22.9165; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#混-bg4  { animation-delay: 1.16s; }
#混-s4   { stroke-dasharray: 30.7024; stroke-dashoffset: 30.7024; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#混-bg5  { animation-delay: 1.53s; }
#混-s5   { stroke-dasharray: 69.1348; stroke-dashoffset: 69.1348; animation: drawStroke 0.38s ease-out 1.66s forwards; }
#混-bg6  { animation-delay: 2.06s; }
#混-s6   { stroke-dasharray: 35.9875; stroke-dashoffset: 35.9875; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#混-bg7  { animation-delay: 2.43s; }
#混-s7   { stroke-dasharray: 31.8716; stroke-dashoffset: 31.8716; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#混-bg8  { animation-delay: 2.80s; }
#混-s8   { stroke-dasharray: 15.1607; stroke-dashoffset: 15.1607; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#混-bg9  { animation-delay: 3.17s; }
#混-s9   { stroke-dasharray: 51.2001; stroke-dashoffset: 51.2001; animation: drawStroke 0.28s ease-out 3.30s forwards; }
#混-bg10  { animation-delay: 3.60s; }
#混-s10   { stroke-dasharray: 22.6999; stroke-dashoffset: 22.6999; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#混-bg11  { animation-delay: 3.97s; }
#混-s11   { stroke-dasharray: 63.8199; stroke-dashoffset: 63.8199; animation: drawStroke 0.35s ease-out 4.10s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #混-s[i]) -->
<path id="混-s1"  class="stroke" stroke="#bf0909" d="M19.88,16.25C23.45,17.59,27.75,21,30,23.84"/>
<path id="混-s2"  class="stroke" stroke="#bf6c09" d="M17.25,40.5C21.13,42.25,24.5,44.75,27,47.5"/>
