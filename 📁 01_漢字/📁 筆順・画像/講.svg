<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (講)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #講-bg[i]: Thời gian quả bóng số nảy lên
   - #講-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#講-bg1  { animation-delay: 0.05s; }
#講-s1   { stroke-dasharray: 11.2567; stroke-dashoffset: 11.2567; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#講-bg2  { animation-delay: 0.42s; }
#講-s2   { stroke-dasharray: 31.1681; stroke-dashoffset: 31.1681; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#講-bg3  { animation-delay: 0.79s; }
#講-s3   { stroke-dasharray: 18.3531; stroke-dashoffset: 18.3531; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#講-bg4  { animation-delay: 1.16s; }
#講-s4   { stroke-dasharray: 19.2973; stroke-dashoffset: 19.2973; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#講-bg5  { animation-delay: 1.53s; }
#講-s5   { stroke-dasharray: 20.9054; stroke-dashoffset: 20.9054; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#講-bg6  { animation-delay: 1.90s; }
#講-s6   { stroke-dasharray: 35.7391; stroke-dashoffset: 35.7391; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#講-bg7  { animation-delay: 2.27s; }
#講-s7   { stroke-dasharray: 16.8181; stroke-dashoffset: 16.8181; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#講-bg8  { animation-delay: 2.64s; }
#講-s8   { stroke-dasharray: 42.4078; stroke-dashoffset: 42.4078; animation: drawStroke 0.23s ease-out 2.77s forwards; }
#講-bg9  { animation-delay: 3.02s; }
#講-s9   { stroke-dasharray: 29.6070; stroke-dashoffset: 29.6070; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#講-bg10  { animation-delay: 3.39s; }
#講-s10   { stroke-dasharray: 31.8012; stroke-dashoffset: 31.8012; animation: drawStroke 0.22s ease-out 3.52s forwards; }
#講-bg11  { animation-delay: 3.76s; }
#講-s11   { stroke-dasharray: 32.9893; stroke-dashoffset: 32.9893; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#講-bg12  { animation-delay: 4.13s; }
#講-s12   { stroke-dasharray: 53.5774; stroke-dashoffset: 53.5774; animation: drawStroke 0.29s ease-out 4.26s forwards; }
#講-bg13  { animation-delay: 4.57s; }
#講-s13   { stroke-dasharray: 44.0750; stroke-dashoffset: 44.0750; animation: drawStroke 0.24s ease-out 4.70s forwards; }
#講-bg14  { animation-delay: 4.96s; }
#講-s14   { stroke-dasharray: 85.8398; stroke-dashoffset: 85.8398; animation: drawStroke 0.47s ease-out 5.09s forwards; }
#講-bg15  { animation-delay: 5.58s; }
#講-s15   { stroke-dasharray: 27.9346; stroke-dashoffset: 27.9346; animation: drawStroke 0.22s ease-out 5.71s forwards; }
#講-bg16  { animation-delay: 5.95s; }
#講-s16   { stroke-dasharray: 29.8821; stroke-dashoffset: 29.8821; animation: drawStroke 0.22s ease-out 6.08s forwards; }
#講-bg17  { animation-delay: 6.32s; }
#講-s17   { stroke-dasharray: 52.1654; stroke-dashoffset: 52.1654; animation: drawStroke 0.29s ease-out 6.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
