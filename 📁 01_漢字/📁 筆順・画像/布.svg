<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (布)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #布-bg[i]: Thời gian quả bóng số nảy lên
   - #布-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#布-bg1  { animation-delay: 0.05s; }
#布-s1   { stroke-dasharray: 73.6897; stroke-dashoffset: 73.6897; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#布-bg2  { animation-delay: 0.61s; }
#布-s2   { stroke-dasharray: 81.0760; stroke-dashoffset: 81.0760; animation: drawStroke 0.45s ease-out 0.74s forwards; }
#布-bg3  { animation-delay: 1.21s; }
#布-s3   { stroke-dasharray: 33.3232; stroke-dashoffset: 33.3232; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#布-bg4  { animation-delay: 1.58s; }
#布-s4   { stroke-dasharray: 83.5275; stroke-dashoffset: 83.5275; animation: drawStroke 0.46s ease-out 1.71s forwards; }
#布-bg5  { animation-delay: 2.19s; }
#布-s5   { stroke-dasharray: 61.0667; stroke-dashoffset: 61.0667; animation: drawStroke 0.34s ease-out 2.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #布-s[i]) -->
<path id="布-s1"  class="stroke" stroke="#bf0909" d="M51.65,10.43C52.129999999999995,11.879999999999999,52.24,13.35,51.69,15.35C47.5,30.75,37.5,54.75,14.89,71.89999999999999"/>
<path id="布-s2"  class="stroke" stroke="#9abf09" d="M14.25,31.45C17,32,20.65,32.07,23.490000000000002,31.72C39.620000000000005,29.75,66.18,27.61,85.38,26.29C88.57,26.07,91.88,26.119999999999997,95,26.79"/>
<path id="布-s3"  class="stroke" stroke="#09bf52" d="M37.25,55.39C38.18,56.32,38.59,58,38.59,59.1C38.59,64.88,38.49,72.5,38.49,83C38.49,85.51,38.43,87.47,38.410000000000004,88.39"/>
<path id="布-s4"  class="stroke" stroke="#0952bf" d="M39.09,57.72C46.75,56.5,63.75,54.12,77.47,52.94C81.51,52.589999999999996,81.62,55.919999999999995,81.57,57.47C81.25999999999999,67.25,81.50999999999999,78.62,79.53999999999999,85.63C77.88999999999999,91.53999999999999,74.41,85.69,73.24999999999999,84.5"/>
<path id="布-s5"  class="stroke" stroke="#9a09bf" d="M57.24,39.63C58.11,40.5,58.580000000000005,42.25,58.580000000000005,43.34C58.580000000000005,49.120000000000005,58.46000000000001,75.25,58.46000000000001,93.5C58.46000000000001,97.07,58.41000000000001,99.59,58.39000000000001,100.38"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="布-bg1"  class="badge-group"><circle cx="51.65" cy="10.43" r="3.5" fill="#bf0909"/><text class="num-single" x="51.65" y="10.43" dx="0" dy="-0.5">1</text></g>
<g id="布-bg2"  class="badge-group"><circle cx="14.25" cy="31.45" r="3.5" fill="#9abf09"/><text class="num-single" x="14.25" y="31.45" dx="0" dy="-0.5">2</text></g>
<g id="布-bg3"  class="badge-group"><circle cx="37.25" cy="51.89" r="3.5" fill="#09bf52"/><text class="num-single" x="37.25" y="51.89" dx="0" dy="-0.5">3</text></g>
<g id="布-bg4"  class="badge-group"><circle cx="39.09" cy="61.22" r="3.5" fill="#0952bf"/><text class="num-single" x="39.09" y="61.22" dx="0" dy="-0.5">4</text></g>
<g id="布-bg5"  class="badge-group"><circle cx="57.24" cy="39.63" r="3.5" fill="#9a09bf"/><text class="num-single" x="57.24" y="39.63" dx="0" dy="-0.5">5</text></g>
</svg>