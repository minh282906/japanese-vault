<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (算)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #算-bg[i]: Thời gian quả bóng số nảy lên
   - #算-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#算-bg1  { animation-delay: 0.05s; }
#算-s1   { stroke-dasharray: 24.4125; stroke-dashoffset: 24.4125; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#算-bg2  { animation-delay: 0.42s; }
#算-s2   { stroke-dasharray: 20.6445; stroke-dashoffset: 20.6445; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#算-bg3  { animation-delay: 0.79s; }
#算-s3   { stroke-dasharray: 8.9729; stroke-dashoffset: 8.9729; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#算-bg4  { animation-delay: 1.16s; }
#算-s4   { stroke-dasharray: 18.0373; stroke-dashoffset: 18.0373; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#算-bg5  { animation-delay: 1.53s; }
#算-s5   { stroke-dasharray: 28.6558; stroke-dashoffset: 28.6558; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#算-bg6  { animation-delay: 1.90s; }
#算-s6   { stroke-dasharray: 10.7714; stroke-dashoffset: 10.7714; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#算-bg7  { animation-delay: 2.27s; }
#算-s7   { stroke-dasharray: 32.9604; stroke-dashoffset: 32.9604; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#算-bg8  { animation-delay: 2.64s; }
#算-s8   { stroke-dasharray: 66.5315; stroke-dashoffset: 66.5315; animation: drawStroke 0.37s ease-out 2.77s forwards; }
#算-bg9  { animation-delay: 3.16s; }
#算-s9   { stroke-dasharray: 34.2882; stroke-dashoffset: 34.2882; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#算-bg10  { animation-delay: 3.53s; }
#算-s10   { stroke-dasharray: 34.4576; stroke-dashoffset: 34.4576; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#算-bg11  { animation-delay: 3.90s; }
#算-s11   { stroke-dasharray: 34.5537; stroke-dashoffset: 34.5537; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#算-bg12  { animation-delay: 4.27s; }
#算-s12   { stroke-dasharray: 80.8745; stroke-dashoffset: 80.8745; animation: drawStroke 0.44s ease-out 4.40s forwards; }
#算-bg13  { animation-delay: 4.86s; }
#算-s13   { stroke-dasharray: 42.1309; stroke-dashoffset: 42.1309; animation: drawStroke 0.23s ease-out 4.99s forwards; }
#算-bg14  { animation-delay: 5.24s; }
#算-s14   { stroke-dasharray: 34.6746; stroke-dashoffset: 34.6746; animation: drawStroke 0.22s ease-out 5.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

