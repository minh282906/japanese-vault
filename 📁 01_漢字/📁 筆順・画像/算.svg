<path id="算-s9"  class="stroke" stroke="#0971bf" d="M36.57,44.92C44.25,44.25,65.46000000000001,42.31,70.74000000000001,42.09"/>
<path id="算-s10"  class="stroke" stroke="#0923bf" d="M36,54.25C44.72,53.5,61.9,52.17,70.37,51.82"/>
