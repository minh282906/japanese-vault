<path id="算-s12"  class="stroke" stroke="#8b09bf" d="M14.38,77.86C16.77,78.52,20.67,78.67999999999999,23.060000000000002,78.52C40.88,77.36999999999999,70.38,74.86999999999999,86.63,74.27C90.61999999999999,74.11999999999999,93.00999999999999,74.58999999999999,95.00999999999999,74.92"/>
<path id="算-s13"  class="stroke" stroke="#bf09a5" d="M42.5,68.5C43.12,69.38,43.43,70.63,43.43,71.8C43.43,83.62,39.12,94.87,22.5,100.88"/>
