<path id="寝-s7"  class="stroke" stroke="#09bf95" d="M50.33,33.82C51.94,34.58,53.91,34.39,55.62,34.23C60.589999999999996,33.75,74.87,32.029999999999994,75.83,31.849999999999998C76.96,31.65,78.24,32.44,78.1,33.87C77.67999999999999,38.33,77.16999999999999,43.709999999999994,76.75,47.8C76.53,49.94,76.33,51.73,76.19,52.839999999999996"/>
<path id="寝-s8"  class="stroke" stroke="#0995bf" d="M51.59,42.69C52.720000000000006,43.309999999999995,55.010000000000005,43.349999999999994,56.24,43.239999999999995C63.61,42.58,68.36,42.129999999999995,77.04,41.199999999999996"/>
<path id="寝-s9"  class="stroke" stroke="#0941bf" d="M51.27,52.46C52.75,53.12,54.63,53.13,56.13,52.99C63.25,52.32,66.88,51.72,75.48,50.79"/>
<path id="寝-s10"  class="stroke" stroke="#2509bf" d="M45.62,60.25C45.519999999999996,63.61,44.04,70.58,43.19,72.58"/>
<path id="寝-s11"  class="stroke" stroke="#7909bf" d="M46.4,62.63C59.5,60.620000000000005,71.75,59,83.81,58.230000000000004C94.54,57.550000000000004,85.36,64.22,84.36,65.17"/>
<path id="寝-s12"  class="stroke" stroke="#bf09b1" d="M51.73,72.19C52.86,72.38,53.01,72.67999999999999,55.269999999999996,72.38C57.26,72.11999999999999,68.91,69.77,72.75999999999999,69.07C75.21999999999998,68.61999999999999,76.80999999999999,69.8,75.42999999999999,72.28999999999999C68.69,84.43,57.22,93.35,44.82,98"/>
<path id="寝-s13"  class="stroke" stroke="#bf095d" d="M50.44,76.6C53.78,77.05999999999999,69.31,87.86999999999999,81.88,94.11999999999999C84.88,95.60999999999999,87.13,96.74999999999999,90.39999999999999,97.55"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="寝-bg1"  class="badge-group"><circle cx="50.68" cy="11.25" r="3.5" fill="#bf0909"/><text class="num-single" x="50.68" y="11.25" dx="0" dy="-0.5">1</text></g>
