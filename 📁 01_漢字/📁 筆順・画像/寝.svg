<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (寝)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #寝-bg[i]: Thời gian quả bóng số nảy lên
   - #寝-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#寝-bg1  { animation-delay: 0.05s; }
#寝-s1   { stroke-dasharray: 12.2398; stroke-dashoffset: 12.2398; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#寝-bg2  { animation-delay: 0.42s; }
#寝-s2   { stroke-dasharray: 15.4442; stroke-dashoffset: 15.4442; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#寝-bg3  { animation-delay: 0.79s; }
#寝-s3   { stroke-dasharray: 70.4019; stroke-dashoffset: 70.4019; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#寝-bg4  { animation-delay: 1.33s; }
#寝-s4   { stroke-dasharray: 64.7805; stroke-dashoffset: 64.7805; animation: drawStroke 0.36s ease-out 1.46s forwards; }
#寝-bg5  { animation-delay: 1.84s; }
#寝-s5   { stroke-dasharray: 13.5003; stroke-dashoffset: 13.5003; animation: drawStroke 0.22s ease-out 1.97s forwards; }
#寝-bg6  { animation-delay: 2.21s; }
#寝-s6   { stroke-dasharray: 18.6509; stroke-dashoffset: 18.6509; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#寝-bg7  { animation-delay: 2.58s; }
#寝-s7   { stroke-dasharray: 48.3264; stroke-dashoffset: 48.3264; animation: drawStroke 0.27s ease-out 2.71s forwards; }
#寝-bg8  { animation-delay: 3.00s; }
#寝-s8   { stroke-dasharray: 25.6330; stroke-dashoffset: 25.6330; animation: drawStroke 0.22s ease-out 3.13s forwards; }
#寝-bg9  { animation-delay: 3.37s; }
#寝-s9   { stroke-dasharray: 24.4154; stroke-dashoffset: 24.4154; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#寝-bg10  { animation-delay: 3.74s; }
#寝-s10   { stroke-dasharray: 12.6029; stroke-dashoffset: 12.6029; animation: drawStroke 0.22s ease-out 3.87s forwards; }
#寝-bg11  { animation-delay: 4.11s; }
#寝-s11   { stroke-dasharray: 50.8120; stroke-dashoffset: 50.8120; animation: drawStroke 0.28s ease-out 4.24s forwards; }
#寝-bg12  { animation-delay: 4.54s; }
#寝-s12   { stroke-dasharray: 68.0197; stroke-dashoffset: 68.0197; animation: drawStroke 0.37s ease-out 4.67s forwards; }
#寝-bg13  { animation-delay: 5.06s; }
#寝-s13   { stroke-dasharray: 45.2451; stroke-dashoffset: 45.2451; animation: drawStroke 0.25s ease-out 5.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

