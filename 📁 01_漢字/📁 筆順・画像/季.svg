<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (季)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #季-bg[i]: Thời gian quả bóng số nảy lên
   - #季-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#季-bg1  { animation-delay: 0.05s; }
#季-s1   { stroke-dasharray: 35.7710; stroke-dashoffset: 35.7710; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#季-bg2  { animation-delay: 0.42s; }
#季-s2   { stroke-dasharray: 61.6577; stroke-dashoffset: 61.6577; animation: drawStroke 0.34s ease-out 0.55s forwards; }
#季-bg3  { animation-delay: 0.91s; }
#季-s3   { stroke-dasharray: 28.7907; stroke-dashoffset: 28.7907; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#季-bg4  { animation-delay: 1.28s; }
#季-s4   { stroke-dasharray: 42.2245; stroke-dashoffset: 42.2245; animation: drawStroke 0.23s ease-out 1.41s forwards; }
#季-bg5  { animation-delay: 1.66s; }
#季-s5   { stroke-dasharray: 44.4334; stroke-dashoffset: 44.4334; animation: drawStroke 0.24s ease-out 1.79s forwards; }
#季-bg6  { animation-delay: 2.05s; }
#季-s6   { stroke-dasharray: 49.3802; stroke-dashoffset: 49.3802; animation: drawStroke 0.27s ease-out 2.18s forwards; }
#季-bg7  { animation-delay: 2.47s; }
#季-s7   { stroke-dasharray: 45.4493; stroke-dashoffset: 45.4493; animation: drawStroke 0.25s ease-out 2.60s forwards; }
#季-bg8  { animation-delay: 2.87s; }
#季-s8   { stroke-dasharray: 66.0240; stroke-dashoffset: 66.0240; animation: drawStroke 0.36s ease-out 3.00s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #季-s[i]) -->
<path id="季-s1"  class="stroke" stroke="#bf0909" d="M66.61,9.75C66.5,10.75,65.62,11.46,64.98,11.83C60.99,14.11,49.85,17.69,33.160000000000004,20.240000000000002"/>
<path id="季-s2"  class="stroke" stroke="#bf9109" d="M22.3,32.26C24.740000000000002,32.83,27.39,32.79,29.86,32.519999999999996C40.25,31.349999999999994,64.21000000000001,28.549999999999997,76.63,27.999999999999996C78.75999999999999,27.899999999999995,81.55,27.929999999999996,83.67999999999999,28.229999999999997"/>
<path id="季-s3"  class="stroke" stroke="#64bf09" d="M52.71,19.78C53.53,20.6,53.93,21.75,53.93,22.78C53.93,23.23,53.839999999999996,36.33,53.81,44C53.800000000000004,45.79,53.800000000000004,47.28,53.800000000000004,48.25"/>
<path id="季-s4"  class="stroke" stroke="#09bf36" d="M47.47,31.41C47.47,32,47.129999999999995,32.65,46.55,33.3C39.37,41.23,28.679999999999996,50.67,13.909999999999997,55.81999999999999"/>
<path id="季-s5"  class="stroke" stroke="#09bfbf" d="M55.09,30.02C62.25,35.12,79.88,47.370000000000005,87.91,50.879999999999995C89.83,51.72,91.28,52.35999999999999,93.1,52.66"/>
<path id="季-s6"  class="stroke" stroke="#0936bf" d="M36.5,53.3C37.75,53.879999999999995,39.61,54.23,41,54.169999999999995C44.88,54,62.12,51.49,65.46,51C68,50.62,68.27,52.66,66.67999999999999,53.98C65.08999999999999,55.3,58.279999999999994,60.15,54.24999999999999,62.54"/>
<path id="季-s7"  class="stroke" stroke="#6409bf" d="M51.62,63.54C56.25,67.75,62.01,81.78,56.16,94.64C54.01,99.37,50.379999999999995,97.12,46.589999999999996,92.99"/>
<path id="季-s8"  class="stroke" stroke="#bf0991" d="M20.65,74.56C23.88,75.5,27.47,75.23,30.38,74.95C40.64,73.96000000000001,64.92999999999999,71.60000000000001,76.5,71.03C79.75,70.87,83.5,71.12,86.36,71.91"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="季-bg1"  class="badge-group"><circle cx="66.61" cy="9.75" r="3.5" fill="#bf0909"/><text class="num-single" x="66.61" y="9.75" dx="0" dy="-0.5">1</text></g>
<g id="季-bg2"  class="badge-group"><circle cx="22.3" cy="32.26" r="3.5" fill="#bf9109"/><text class="num-single" x="22.3" y="32.26" dx="0" dy="-0.5">2</text></g>
<g id="季-bg3"  class="badge-group"><circle cx="52.71" cy="19.78" r="3.5" fill="#64bf09"/><text class="num-single" x="52.71" y="19.78" dx="0" dy="-0.5">3</text></g>
<g id="季-bg4"  class="badge-group"><circle cx="47.47" cy="31.41" r="3.5" fill="#09bf36"/><text class="num-single" x="47.47" y="31.41" dx="0" dy="-0.5">4</text></g>
<g id="季-bg5"  class="badge-group"><circle cx="55.09" cy="30.02" r="3.5" fill="#09bfbf"/><text class="num-single" x="55.09" y="30.02" dx="0" dy="-0.5">5</text></g>
<g id="季-bg6"  class="badge-group"><circle cx="36.5" cy="53.3" r="3.5" fill="#0936bf"/><text class="num-single" x="36.5" y="53.3" dx="0" dy="-0.5">6</text></g>
<g id="季-bg7"  class="badge-group"><circle cx="51.62" cy="63.54" r="3.5" fill="#6409bf"/><text class="num-single" x="51.62" y="63.54" dx="0" dy="-0.5">7</text></g>
<g id="季-bg8"  class="badge-group"><circle cx="20.65" cy="74.56" r="3.5" fill="#bf0991"/><text class="num-single" x="20.65" y="74.56" dx="0" dy="-0.5">8</text></g>
</svg>