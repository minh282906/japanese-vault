<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (介)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #介-bg[i]: Thời gian quả bóng số nảy lên
   - #介-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#介-bg1  { animation-delay: 0.05s; }
#介-s1   { stroke-dasharray: 65.4540; stroke-dashoffset: 65.4540; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#介-bg2  { animation-delay: 0.56s; }
#介-s2   { stroke-dasharray: 60.1561; stroke-dashoffset: 60.1561; animation: drawStroke 0.33s ease-out 0.69s forwards; }
#介-bg3  { animation-delay: 1.04s; }
#介-s3   { stroke-dasharray: 52.7826; stroke-dashoffset: 52.7826; animation: drawStroke 0.29s ease-out 1.17s forwards; }
#介-bg4  { animation-delay: 1.48s; }
#介-s4   { stroke-dasharray: 53.5601; stroke-dashoffset: 53.5601; animation: drawStroke 0.29s ease-out 1.61s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #介-s[i]) -->
<path id="介-s1"  class="stroke" stroke="#bf0909" d="M51.75,11C51.86,12.16,51.63,13.81,51.02,15.43C47.25,25.5,31.75,47.75,11,60.25"/>
<path id="介-s2"  class="stroke" stroke="#64bf09" d="M52,16.5C60.62,25.75,74.88,40,87.34,50.83C90.2,53.31,93,55.38,96.25,57"/>
<path id="介-s3"  class="stroke" stroke="#09bfbf" d="M39.02,49C40.010000000000005,49.99,40.1,51.57,40.1,53.19C40.1,68,39.5,87.25,25.810000000000002,97.47"/>
<path id="介-s4"  class="stroke" stroke="#6409bf" d="M64.62,45C65.69,46.06,65.83,47.5,65.83,49C65.83,51.03,65.85,78.62,65.86,91.88C65.86,94.92,65.86,97.21,65.86,98.25999999999999"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="介-bg1"  class="badge-group"><circle cx="51.75" cy="7.5" r="3.5" fill="#bf0909"/><text class="num-single" x="51.75" y="7.5" dx="0" dy="-0.5">1</text></g>
<g id="介-bg2"  class="badge-group"><circle cx="52" cy="20.0" r="3.5" fill="#64bf09"/><text class="num-single" x="52" y="20.0" dx="0" dy="-0.5">2</text></g>
<g id="介-bg3"  class="badge-group"><circle cx="39.02" cy="49" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.02" y="49" dx="0" dy="-0.5">3</text></g>
<g id="介-bg4"  class="badge-group"><circle cx="64.62" cy="45" r="3.5" fill="#6409bf"/><text class="num-single" x="64.62" y="45" dx="0" dy="-0.5">4</text></g>
</svg>