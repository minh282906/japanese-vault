<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (送)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #送-bg[i]: Thời gian quả bóng số nảy lên
   - #送-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#送-bg1  { animation-delay: 0.05s; }
#送-s1   { stroke-dasharray: 16.1916; stroke-dashoffset: 16.1916; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#送-bg2  { animation-delay: 0.42s; }
#送-s2   { stroke-dasharray: 20.6821; stroke-dashoffset: 20.6821; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#送-bg3  { animation-delay: 0.79s; }
#送-s3   { stroke-dasharray: 36.6798; stroke-dashoffset: 36.6798; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#送-bg4  { animation-delay: 1.16s; }
#送-s4   { stroke-dasharray: 51.8306; stroke-dashoffset: 51.8306; animation: drawStroke 0.29s ease-out 1.29s forwards; }
#送-bg5  { animation-delay: 1.60s; }
#送-s5   { stroke-dasharray: 51.3595; stroke-dashoffset: 51.3595; animation: drawStroke 0.28s ease-out 1.73s forwards; }
#送-bg6  { animation-delay: 2.03s; }
#送-s6   { stroke-dasharray: 29.5711; stroke-dashoffset: 29.5711; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#送-bg7  { animation-delay: 2.40s; }
#送-s7   { stroke-dasharray: 15.5252; stroke-dashoffset: 15.5252; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#送-bg8  { animation-delay: 2.77s; }
#送-s8   { stroke-dasharray: 62.3720; stroke-dashoffset: 62.3720; animation: drawStroke 0.34s ease-out 2.90s forwards; }
#送-bg9  { animation-delay: 3.26s; }
#送-s9   { stroke-dasharray: 75.0327; stroke-dashoffset: 75.0327; animation: drawStroke 0.41s ease-out 3.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #送-s[i]) -->
<path id="送-s1"  class="stroke" stroke="#bf0909" d="M48.77,17.71C52.050000000000004,20,57.24,27.15,58.06,30.72"/>
<path id="送-s2"  class="stroke" stroke="#bf8209" d="M78.13,14.25C78.21,15.18,78.24,16.12,77.88,16.96C76.17,20.97,72.88,27.22,68.57,32.21"/>
<path id="送-s3"  class="stroke" stroke="#82bf09" d="M48.06,36.92C49.43,37.300000000000004,51.940000000000005,37.45,53.300000000000004,37.300000000000004C60.63,36.50000000000001,71.38,34.75000000000001,79.72,34.290000000000006C81.99,34.160000000000004,83.36,34.470000000000006,84.5,34.660000000000004"/>
<path id="送-s4"  class="stroke" stroke="#09bf09" d="M41.43,55.03C43.86,55.5,46.56,55.46,48.87,55.14C59,53.75,74.62,52,85.23,51.61C87.84,51.51,90.46000000000001,51.42,93.01,52.01"/>
<path id="送-s5"  class="stroke" stroke="#09bf82" d="M65.53,38.23C65.98,38.86,66.46000000000001,40.41,66.39,41.629999999999995C65.26,60.959999999999994,58.75,73.24,43.75,80.87"/>
<path id="送-s6"  class="stroke" stroke="#0982bf" d="M66.75,60.38C74.35,64.85000000000001,83,74.61,86.75,81.76"/>
<path id="送-s7"  class="stroke" stroke="#0909bf" d="M20.25,18.5C24.13,20.48,30.28,26.06,31.25,29.130000000000003"/>
<path id="送-s8"  class="stroke" stroke="#8209bf" d="M13,50.5C14.75,51.12,17,51,18,50.75S26.79,47.6,28.25,47C31,45.88,31.91,47.14,30.5,50C23.88,63.38,23.75,58.88,30.75,68.5C32.11,70.36,32.37,71.12,30.25,73.25C28.87,74.63,22.88,79.62,20,82"/>
<path id="送-s9"  class="stroke" stroke="#bf0982" d="M15.75,83.5C18.75,83,24.75,81.75,29.25,82.75S59.269999999999996,90.15,63.75,91.25C75.5,94.13,82.25,95.5,89.25,95.25"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="送-bg1"  class="badge-group"><circle cx="48.77" cy="17.71" r="3.5" fill="#bf0909"/><text class="num-single" x="48.77" y="17.71" dx="0" dy="-0.5">1</text></g>
<g id="送-bg2"  class="badge-group"><circle cx="78.13" cy="14.25" r="3.5" fill="#bf8209"/><text class="num-single" x="78.13" y="14.25" dx="0" dy="-0.5">2</text></g>
<g id="送-bg3"  class="badge-group"><circle cx="48.06" cy="36.92" r="3.5" fill="#82bf09"/><text class="num-single" x="48.06" y="36.92" dx="0" dy="-0.5">3</text></g>
<g id="送-bg4"  class="badge-group"><circle cx="41.43" cy="55.03" r="3.5" fill="#09bf09"/><text class="num-single" x="41.43" y="55.03" dx="0" dy="-0.5">4</text></g>
<g id="送-bg5"  class="badge-group"><circle cx="65.53" cy="38.23" r="3.5" fill="#09bf82"/><text class="num-single" x="65.53" y="38.23" dx="0" dy="-0.5">5</text></g>
<g id="送-bg6"  class="badge-group"><circle cx="66.75" cy="60.38" r="3.5" fill="#0982bf"/><text class="num-single" x="66.75" y="60.38" dx="0" dy="-0.5">6</text></g>
<g id="送-bg7"  class="badge-group"><circle cx="20.25" cy="18.5" r="3.5" fill="#0909bf"/><text class="num-single" x="20.25" y="18.5" dx="0" dy="-0.5">7</text></g>
<g id="送-bg8"  class="badge-group"><circle cx="13" cy="50.5" r="3.5" fill="#8209bf"/><text class="num-single" x="13" y="50.5" dx="0" dy="-0.5">8</text></g>
<g id="送-bg9"  class="badge-group"><circle cx="15.75" cy="83.5" r="3.5" fill="#bf0982"/><text class="num-single" x="15.75" y="83.5" dx="0" dy="-0.5">9</text></g>
</svg>