<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (務)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #務-bg[i]: Thời gian quả bóng số nảy lên
   - #務-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#務-bg1  { animation-delay: 0.05s; }
#務-s1   { stroke-dasharray: 48.9698; stroke-dashoffset: 48.9698; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#務-bg2  { animation-delay: 0.47s; }
#務-s2   { stroke-dasharray: 14.6703; stroke-dashoffset: 14.6703; animation: drawStroke 0.22s ease-out 0.60s forwards; }
#務-bg3  { animation-delay: 0.84s; }
#務-s3   { stroke-dasharray: 48.0290; stroke-dashoffset: 48.0290; animation: drawStroke 0.26s ease-out 0.97s forwards; }
#務-bg4  { animation-delay: 1.25s; }
#務-s4   { stroke-dasharray: 63.0472; stroke-dashoffset: 63.0472; animation: drawStroke 0.35s ease-out 1.38s forwards; }
#務-bg5  { animation-delay: 1.75s; }
#務-s5   { stroke-dasharray: 43.5393; stroke-dashoffset: 43.5393; animation: drawStroke 0.24s ease-out 1.88s forwards; }
#務-bg6  { animation-delay: 2.14s; }
#務-s6   { stroke-dasharray: 25.3658; stroke-dashoffset: 25.3658; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#務-bg7  { animation-delay: 2.51s; }
#務-s7   { stroke-dasharray: 26.4819; stroke-dashoffset: 26.4819; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#務-bg8  { animation-delay: 2.88s; }
#務-s8   { stroke-dasharray: 44.2386; stroke-dashoffset: 44.2386; animation: drawStroke 0.24s ease-out 3.01s forwards; }
#務-bg9  { animation-delay: 3.27s; }
#務-s9   { stroke-dasharray: 40.2951; stroke-dashoffset: 40.2951; animation: drawStroke 0.22s ease-out 3.40s forwards; }
#務-bg10  { animation-delay: 3.64s; }
#務-s10   { stroke-dasharray: 74.9763; stroke-dashoffset: 74.9763; animation: drawStroke 0.41s ease-out 3.77s forwards; }
#務-bg11  { animation-delay: 4.20s; }
#務-s11   { stroke-dasharray: 50.8634; stroke-dashoffset: 50.8634; animation: drawStroke 0.28s ease-out 4.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #務-s[i]) -->
<path id="務-s1"  class="stroke" stroke="#bf0909" d="M17.14,19.11C18.62,19.37,20.580000000000002,19.29,21.66,19.18C24.62,18.87,40.11,15.51,42.33,15.02C44.55,14.54,45.51,16.77,44.23,18.39C41.5,21.88,36.5,29,33.38,32.85"/>
