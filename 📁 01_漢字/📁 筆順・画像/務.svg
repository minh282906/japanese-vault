<g id="務-bg10" class="badge-group"><circle cx="49.3" cy="70.15" r="3.5" fill="#ae09bf"/><text class="num-double" x="49.3" y="70.15" dx="-0.4" dy="-0.475">10</text></g>
<g id="務-bg11" class="badge-group"><circle cx="68.85" cy="55.98" r="3.5" fill="#bf096c"/><text class="num-double" x="68.85" y="55.98" dx="-0.4" dy="-0.475">11</text></g>
</svg>