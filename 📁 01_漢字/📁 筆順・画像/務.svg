<path id="務-s7"  class="stroke" stroke="#098dbf" d="M62,25.05C63,25.13,63.87,25.13,64.35,25.05C69.75,24.13,78.69999999999999,21.46,84.16999999999999,20.15C85.21999999999998,19.9,86.78999999999999,19.689999999999998,87.83999999999999,19.97"/>
<path id="務-s8"  class="stroke" stroke="#092abf" d="M76.96,27.26C77.13,28.12,77.02,29.17,76.42999999999999,30.590000000000003C71.75,42,62.12,53.62,48.65,59.06"/>
<path id="務-s9"  class="stroke" stroke="#4b09bf" d="M58.33,36.19C63.339999999999996,37.129999999999995,77.35,47.54,86.78,53.67999999999999C88.63,54.879999999999995,90.63,56.00999999999999,92.68,57.059999999999995"/>
<path id="務-s10"  class="stroke" stroke="#ae09bf" d="M49.3,70.15C50.8,70.79,53.25,70.7,54.849999999999994,70.47C64.38,69.12,79.56,66.51,83.08,66.12C85.62,65.84,86.5,67.41000000000001,86.19,69.37C85.25,75.25,82.25,88,76.1,94.23C72.07,98.32000000000001,70.33999999999999,94.42,69.30999999999999,93.81"/>
<path id="務-s11"  class="stroke" stroke="#bf096c" d="M68.85,55.98C69.13,56.879999999999995,69.02,58.599999999999994,68.71,60.04C66.39,70.76,59.379999999999995,89.62,43.97999999999999,98.18"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="務-bg1"  class="badge-group"><circle cx="17.14" cy="19.11" r="3.5" fill="#bf0909"/><text class="num-single" x="17.14" y="19.11" dx="0" dy="-0.5">1</text></g>
<g id="務-bg2"  class="badge-group"><circle cx="23.8" cy="27.98" r="3.5" fill="#bf6c09"/><text class="num-single" x="23.8" y="27.98" dx="0" dy="-0.5">2</text></g>
