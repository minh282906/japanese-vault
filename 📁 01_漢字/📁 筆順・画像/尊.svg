<path id="尊-s8"  class="stroke" stroke="#0964bf" d="M32.12,54.71C44.379999999999995,53.69,61.129999999999995,52.69,76.50999999999999,52.05"/>
<path id="尊-s9"  class="stroke" stroke="#0909bf" d="M32.12,63.27C43.75,62.57,64.8,61.25,76.53999999999999,61"/>
<path id="尊-s10"  class="stroke" stroke="#6409bf" d="M12.88,76.24C16.630000000000003,77.07,19.89,77.07,23,76.78999999999999C45,74.82,68.91,73.39999999999999,87,72.30999999999999C90.1,72.12999999999998,93.75,72.07,96.63,72.87999999999998"/>
<path id="尊-s11"  class="stroke" stroke="#bf09bf" d="M67.78,65.65C68.72,66.59,69.29,68.07000000000001,69.29,69.83000000000001C69.29,78.31000000000002,69.33000000000001,91.18,69.33000000000001,95.17000000000002C69.33000000000001,104.84000000000002,63.29000000000001,96.60000000000002,61.530000000000015,95.37000000000002"/>
