<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (尊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #尊-bg[i]: Thời gian quả bóng số nảy lên
   - #尊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#尊-bg1  { animation-delay: 0.05s; }
#尊-s1   { stroke-dasharray: 15.7048; stroke-dashoffset: 15.7048; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#尊-bg2  { animation-delay: 0.42s; }
#尊-s2   { stroke-dasharray: 15.2093; stroke-dashoffset: 15.2093; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#尊-bg3  { animation-delay: 0.79s; }
#尊-s3   { stroke-dasharray: 71.4164; stroke-dashoffset: 71.4164; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#尊-bg4  { animation-delay: 1.33s; }
#尊-s4   { stroke-dasharray: 29.3980; stroke-dashoffset: 29.3980; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#尊-bg5  { animation-delay: 1.70s; }
#尊-s5   { stroke-dasharray: 73.9621; stroke-dashoffset: 73.9621; animation: drawStroke 0.41s ease-out 1.83s forwards; }
#尊-bg6  { animation-delay: 2.26s; }
#尊-s6   { stroke-dasharray: 24.7445; stroke-dashoffset: 24.7445; animation: drawStroke 0.22s ease-out 2.39s forwards; }
#尊-bg7  { animation-delay: 2.63s; }
#尊-s7   { stroke-dasharray: 31.9168; stroke-dashoffset: 31.9168; animation: drawStroke 0.22s ease-out 2.76s forwards; }
#尊-bg8  { animation-delay: 3.00s; }
#尊-s8   { stroke-dasharray: 44.4724; stroke-dashoffset: 44.4724; animation: drawStroke 0.24s ease-out 3.13s forwards; }
#尊-bg9  { animation-delay: 3.39s; }
#尊-s9   { stroke-dasharray: 44.4802; stroke-dashoffset: 44.4802; animation: drawStroke 0.24s ease-out 3.52s forwards; }
#尊-bg10  { animation-delay: 3.78s; }
#尊-s10   { stroke-dasharray: 84.0252; stroke-dashoffset: 84.0252; animation: drawStroke 0.46s ease-out 3.91s forwards; }
#尊-bg11  { animation-delay: 4.39s; }
#尊-s11   { stroke-dasharray: 42.9096; stroke-dashoffset: 42.9096; animation: drawStroke 0.24s ease-out 4.52s forwards; }
#尊-bg12  { animation-delay: 4.78s; }
#尊-s12   { stroke-dasharray: 14.5274; stroke-dashoffset: 14.5274; animation: drawStroke 0.22s ease-out 4.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

