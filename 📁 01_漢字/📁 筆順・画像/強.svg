<path id="強-s4"  class="stroke" stroke="#4bbf09" d="M67.75,12.75C68.13,14.5,67.5,16.75,66.5,18C61.01,24.86,59.25,26.5,53.18,33.09C51.39,35.05,52,36.63,55,36C64.5,34,76.25,31.75,87.85,29.75"/>
<path id="強-s5"  class="stroke" stroke="#09bf2a" d="M79.88,20.5C84.33999999999999,23.1,91.39,31.2,92.5,35.25"/>
<path id="強-s6"  class="stroke" stroke="#09bf8d" d="M48.25,51.62C48.75,51.809999999999995,49.92,53.15,50.05,53.72C50.8,57.08,51.589999999999996,60.83,52.57,66.53C52.8,67.85,53.04,69.25,53.29,70.73"/>
<path id="強-s7"  class="stroke" stroke="#098dbf" d="M50.99,52.97C62.620000000000005,50.629999999999995,78.87,48.25,87.56,47.58C90.3,47.37,92.06,49.96,91.74000000000001,51.25C90.83000000000001,54.92,89.26,58.51,88.21000000000001,62.49"/>
<path id="強-s8"  class="stroke" stroke="#092abf" d="M53.62,69C60.55,67.69,75.02,65.81,85.77,64.24C87.06,64.05,88.3,63.87,89.47,63.69"/>
<path id="強-s9"  class="stroke" stroke="#4b09bf" d="M66.97,37C68.25,38,69.03999999999999,39.5,69.03999999999999,41.26C69.03999999999999,45.25,69.08999999999999,73.8,68.96,86.5"/>
<path id="強-s10"  class="stroke" stroke="#ae09bf" d="M45.98,91.04C47,92.25,48.849999999999994,92.2,49.86,92.01S87.47,83.67,90.50999999999999,82.75"/>
<path id="強-s11"  class="stroke" stroke="#bf096c" d="M87,75.5C90.53,78.68,96.12,88.56,97,93.5"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="強-bg1"  class="badge-group"><circle cx="17.5" cy="19.84" r="3.5" fill="#bf0909"/><text class="num-single" x="17.5" y="19.84" dx="0" dy="-0.5">1</text></g>
<g id="強-bg2"  class="badge-group"><circle cx="18.38" cy="33.75" r="3.5" fill="#bf6c09"/><text class="num-single" x="18.38" y="33.75" dx="0" dy="-0.5">2</text></g>
