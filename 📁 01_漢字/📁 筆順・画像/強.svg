<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (強)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #強-bg[i]: Thời gian quả bóng số nảy lên
   - #強-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#強-bg1  { animation-delay: 0.05s; }
#強-s1   { stroke-dasharray: 44.1745; stroke-dashoffset: 44.1745; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#強-bg2  { animation-delay: 0.44s; }
#強-s2   { stroke-dasharray: 23.3490; stroke-dashoffset: 23.3490; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#強-bg3  { animation-delay: 0.81s; }
#強-s3   { stroke-dasharray: 90.8060; stroke-dashoffset: 90.8060; animation: drawStroke 0.50s ease-out 0.94s forwards; }
#強-bg4  { animation-delay: 1.46s; }
#強-s4   { stroke-dasharray: 64.7803; stroke-dashoffset: 64.7803; animation: drawStroke 0.36s ease-out 1.59s forwards; }
#強-bg5  { animation-delay: 1.97s; }
#強-s5   { stroke-dasharray: 19.6862; stroke-dashoffset: 19.6862; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#強-bg6  { animation-delay: 2.34s; }
#強-s6   { stroke-dasharray: 20.1316; stroke-dashoffset: 20.1316; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#強-bg7  { animation-delay: 2.71s; }
#強-s7   { stroke-dasharray: 55.0354; stroke-dashoffset: 55.0354; animation: drawStroke 0.30s ease-out 2.84s forwards; }
#強-bg8  { animation-delay: 3.16s; }
#強-s8   { stroke-dasharray: 36.2429; stroke-dashoffset: 36.2429; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#強-bg9  { animation-delay: 3.53s; }
#強-s9   { stroke-dasharray: 50.1477; stroke-dashoffset: 50.1477; animation: drawStroke 0.28s ease-out 3.66s forwards; }
#強-bg10  { animation-delay: 3.96s; }
#強-s10   { stroke-dasharray: 45.8770; stroke-dashoffset: 45.8770; animation: drawStroke 0.25s ease-out 4.09s forwards; }
#強-bg11  { animation-delay: 4.36s; }
#強-s11   { stroke-dasharray: 20.8037; stroke-dashoffset: 20.8037; animation: drawStroke 0.22s ease-out 4.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #強-s[i]) -->
<path id="強-s1"  class="stroke" stroke="#bf0909" d="M17.5,19.84C18.5,20.5,21,20.79,22.19,20.63C28,19.869999999999997,35.88,18.119999999999997,40.46,16.84C42.88,16.169999999999998,44.75,17.62,43.7,20.23C43.09,21.76,40.31,30.16,39.330000000000005,34.01"/>
