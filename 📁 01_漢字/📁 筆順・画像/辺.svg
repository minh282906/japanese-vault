<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (辺)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #辺-bg[i]: Thời gian quả bóng số nảy lên
   - #辺-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#辺-bg1  { animation-delay: 0.05s; }
#辺-s1   { stroke-dasharray: 101.0500; stroke-dashoffset: 101.0500; animation: drawStroke 0.55s ease-out 0.18s forwards; }
#辺-bg2  { animation-delay: 0.75s; }
#辺-s2   { stroke-dasharray: 50.8039; stroke-dashoffset: 50.8039; animation: drawStroke 0.28s ease-out 0.88s forwards; }
#辺-bg3  { animation-delay: 1.18s; }
#辺-s3   { stroke-dasharray: 13.9835; stroke-dashoffset: 13.9835; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#辺-bg4  { animation-delay: 1.55s; }
#辺-s4   { stroke-dasharray: 62.6639; stroke-dashoffset: 62.6639; animation: drawStroke 0.34s ease-out 1.68s forwards; }
#辺-bg5  { animation-delay: 2.04s; }
#辺-s5   { stroke-dasharray: 76.3443; stroke-dashoffset: 76.3443; animation: drawStroke 0.42s ease-out 2.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #辺-s[i]) -->
<path id="辺-s1"  class="stroke" stroke="#bf0909" d="M47.85,25.35C49.440000000000005,25.96,51.44,25.87,52.83,25.68C64.12,24.12,75.12,22.12,84.08,20.48C88.33,19.7,90.02,22.080000000000002,89.61,26.130000000000003C88.69,35.050000000000004,85.06,57.53,80.16,67.51C77.67999999999999,72.56,74.47999999999999,70.04,70.75999999999999,66.4"/>
<path id="辺-s2"  class="stroke" stroke="#9abf09" d="M62.96,27.01C63.37,28.12,63.36,29.330000000000002,63.08,30.740000000000002C60.739999999999995,42.74,53.739999999999995,60.49,41.239999999999995,71.53"/>
<path id="辺-s3"  class="stroke" stroke="#09bf52" d="M19.21,19.5C23.02,21.02,28.130000000000003,25.12,30,28.130000000000003"/>
<path id="辺-s4"  class="stroke" stroke="#0952bf" d="M14.75,49.25C16.37,50,18.55,49.65,19.5,49.25C21.88,48.25,25.92,45.97,28.5,44.75C30.62,43.75,32.51,45.01,30.75,47.75C22.25,61,22.12,56.62,30,65C31.15,66.22,30.83,67.86,29.25,69C26.13,71.25,21.130000000000003,75,16.75,78.5"/>
<path id="辺-s5"  class="stroke" stroke="#9a09bf" d="M14.25,80C17.87,79.12,23.15,78.94,27.75,79.25C35.13,79.75,57.82,85.46,62.25,86.75C74.25,90.25,80.63,91.13,89.25,90.75"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="辺-bg1"  class="badge-group"><circle cx="47.85" cy="25.35" r="3.5" fill="#bf0909"/><text class="num-single" x="47.85" y="25.35" dx="0" dy="-0.5">1</text></g>
<g id="辺-bg2"  class="badge-group"><circle cx="62.96" cy="27.01" r="3.5" fill="#9abf09"/><text class="num-single" x="62.96" y="27.01" dx="0" dy="-0.5">2</text></g>
<g id="辺-bg3"  class="badge-group"><circle cx="19.21" cy="19.5" r="3.5" fill="#09bf52"/><text class="num-single" x="19.21" y="19.5" dx="0" dy="-0.5">3</text></g>
<g id="辺-bg4"  class="badge-group"><circle cx="14.75" cy="49.25" r="3.5" fill="#0952bf"/><text class="num-single" x="14.75" y="49.25" dx="0" dy="-0.5">4</text></g>
<g id="辺-bg5"  class="badge-group"><circle cx="14.25" cy="80" r="3.5" fill="#9a09bf"/><text class="num-single" x="14.25" y="80" dx="0" dy="-0.5">5</text></g>
</svg>