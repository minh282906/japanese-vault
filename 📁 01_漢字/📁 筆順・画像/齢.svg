<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (齢)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #齢-bg[i]: Thời gian quả bóng số nảy lên
   - #齢-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#齢-bg1  { animation-delay: 0.05s; }
#齢-s1   { stroke-dasharray: 24.4074; stroke-dashoffset: 24.4074; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#齢-bg2  { animation-delay: 0.42s; }
#齢-s2   { stroke-dasharray: 16.4727; stroke-dashoffset: 16.4727; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#齢-bg3  { animation-delay: 0.79s; }
#齢-s3   { stroke-dasharray: 17.1282; stroke-dashoffset: 17.1282; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#齢-bg4  { animation-delay: 1.16s; }
#齢-s4   { stroke-dasharray: 45.0864; stroke-dashoffset: 45.0864; animation: drawStroke 0.25s ease-out 1.29s forwards; }
#齢-bg5  { animation-delay: 1.56s; }
#齢-s5   { stroke-dasharray: 9.0896; stroke-dashoffset: 9.0896; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#齢-bg6  { animation-delay: 1.93s; }
#齢-s6   { stroke-dasharray: 11.0709; stroke-dashoffset: 11.0709; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#齢-bg7  { animation-delay: 2.30s; }
#齢-s7   { stroke-dasharray: 23.8377; stroke-dashoffset: 23.8377; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#齢-bg8  { animation-delay: 2.67s; }
#齢-s8   { stroke-dasharray: 38.0317; stroke-dashoffset: 38.0317; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#齢-bg9  { animation-delay: 3.04s; }
#齢-s9   { stroke-dasharray: 21.0939; stroke-dashoffset: 21.0939; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#齢-bg10  { animation-delay: 3.41s; }
#齢-s10   { stroke-dasharray: 11.7375; stroke-dashoffset: 11.7375; animation: drawStroke 0.22s ease-out 3.54s forwards; }
#齢-bg11  { animation-delay: 3.78s; }
#齢-s11   { stroke-dasharray: 74.6202; stroke-dashoffset: 74.6202; animation: drawStroke 0.41s ease-out 3.91s forwards; }
#齢-bg12  { animation-delay: 4.34s; }
#齢-s12   { stroke-dasharray: 45.1738; stroke-dashoffset: 45.1738; animation: drawStroke 0.25s ease-out 4.47s forwards; }
#齢-bg13  { animation-delay: 4.74s; }
#齢-s13   { stroke-dasharray: 41.0162; stroke-dashoffset: 41.0162; animation: drawStroke 0.23s ease-out 4.87s forwards; }
#齢-bg14  { animation-delay: 5.12s; }
#齢-s14   { stroke-dasharray: 35.7585; stroke-dashoffset: 35.7585; animation: drawStroke 0.22s ease-out 5.25s forwards; }
#齢-bg15  { animation-delay: 5.49s; }
#齢-s15   { stroke-dasharray: 13.5118; stroke-dashoffset: 13.5118; animation: drawStroke 0.22s ease-out 5.62s forwards; }
#齢-bg16  { animation-delay: 5.86s; }
#齢-s16   { stroke-dasharray: 59.0961; stroke-dashoffset: 59.0961; animation: drawStroke 0.33s ease-out 5.99s forwards; }
#齢-bg17  { animation-delay: 6.34s; }
#齢-s17   { stroke-dasharray: 20.4247; stroke-dashoffset: 20.4247; animation: drawStroke 0.22s ease-out 6.47s forwards; }
]]>
</style>

