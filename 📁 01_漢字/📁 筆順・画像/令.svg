<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (令)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #令-bg[i]: Thời gian quả bóng số nảy lên
   - #令-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#令-bg1  { animation-delay: 0.05s; }
#令-s1   { stroke-dasharray: 56.7744; stroke-dashoffset: 56.7744; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#令-bg2  { animation-delay: 0.51s; }
#令-s2   { stroke-dasharray: 54.8039; stroke-dashoffset: 54.8039; animation: drawStroke 0.30s ease-out 0.64s forwards; }
#令-bg3  { animation-delay: 0.96s; }
#令-s3   { stroke-dasharray: 13.4308; stroke-dashoffset: 13.4308; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#令-bg4  { animation-delay: 1.33s; }
#令-s4   { stroke-dasharray: 83.5754; stroke-dashoffset: 83.5754; animation: drawStroke 0.46s ease-out 1.46s forwards; }
#令-bg5  { animation-delay: 1.94s; }
#令-s5   { stroke-dasharray: 23.5384; stroke-dashoffset: 23.5384; animation: drawStroke 0.22s ease-out 2.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #令-s[i]) -->
<path id="令-s1"  class="stroke" stroke="#bf0909" d="M49.62,13.25C49.73,14.19,50,15.73,49.4,17.02C45.25,25.88,34.25,42.25,12.75,54.099999999999994"/>
<path id="令-s2"  class="stroke" stroke="#9abf09" d="M50.54,16.55C56.67,20.9,75.53,36.769999999999996,84.52,43.879999999999995C87.74,46.419999999999995,90.11999999999999,47.99999999999999,94.25,49.24999999999999"/>
<path id="令-s3"  class="stroke" stroke="#09bf52" d="M47.27,45.33C50.81,46.85,56.43000000000001,51.589999999999996,57.31,53.96"/>
<path id="令-s4"  class="stroke" stroke="#0952bf" d="M29.08,65.79C30.43,66.62,33.269999999999996,67.01,34.8,66.80000000000001C37.83,66.39000000000001,70.22,61.110000000000014,73.41999999999999,60.70000000000001S77.41999999999999,62.17000000000001,75.12999999999998,64.36000000000001C69.74999999999999,69.49000000000001,53.25999999999998,84.17000000000002,51.23999999999998,85.83000000000001"/>
<path id="令-s5"  class="stroke" stroke="#9a09bf" d="M41.59,81.4C47.75,84.62,55.25,89.87,58.71000000000001,97"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="令-bg1"  class="badge-group"><circle cx="49.62" cy="9.75" r="3.5" fill="#bf0909"/><text class="num-single" x="49.62" y="9.75" dx="0" dy="-0.5">1</text></g>
<g id="令-bg2"  class="badge-group"><circle cx="50.54" cy="20.05" r="3.5" fill="#9abf09"/><text class="num-single" x="50.54" y="20.05" dx="0" dy="-0.5">2</text></g>
<g id="令-bg3"  class="badge-group"><circle cx="47.27" cy="45.33" r="3.5" fill="#09bf52"/><text class="num-single" x="47.27" y="45.33" dx="0" dy="-0.5">3</text></g>
<g id="令-bg4"  class="badge-group"><circle cx="29.08" cy="65.79" r="3.5" fill="#0952bf"/><text class="num-single" x="29.08" y="65.79" dx="0" dy="-0.5">4</text></g>
<g id="令-bg5"  class="badge-group"><circle cx="41.59" cy="81.4" r="3.5" fill="#9a09bf"/><text class="num-single" x="41.59" y="81.4" dx="0" dy="-0.5">5</text></g>
</svg>