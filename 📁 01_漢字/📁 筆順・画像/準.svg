<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (準)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #準-bg[i]: Thời gian quả bóng số nảy lên
   - #準-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#準-bg1  { animation-delay: 0.05s; }
#準-s1   { stroke-dasharray: 11.9042; stroke-dashoffset: 11.9042; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#準-bg2  { animation-delay: 0.42s; }
#準-s2   { stroke-dasharray: 11.8756; stroke-dashoffset: 11.8756; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#準-bg3  { animation-delay: 0.79s; }
#準-s3   { stroke-dasharray: 16.7382; stroke-dashoffset: 16.7382; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#準-bg4  { animation-delay: 1.16s; }
#準-s4   { stroke-dasharray: 28.4819; stroke-dashoffset: 28.4819; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#準-bg5  { animation-delay: 1.53s; }
#準-s5   { stroke-dasharray: 34.6524; stroke-dashoffset: 34.6524; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#準-bg6  { animation-delay: 1.90s; }
#準-s6   { stroke-dasharray: 12.5407; stroke-dashoffset: 12.5407; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#準-bg7  { animation-delay: 2.27s; }
#準-s7   { stroke-dasharray: 37.1305; stroke-dashoffset: 37.1305; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#準-bg8  { animation-delay: 2.64s; }
#準-s8   { stroke-dasharray: 30.4201; stroke-dashoffset: 30.4201; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#準-bg9  { animation-delay: 3.01s; }
#準-s9   { stroke-dasharray: 33.7901; stroke-dashoffset: 33.7901; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#準-bg10  { animation-delay: 3.38s; }
#準-s10   { stroke-dasharray: 36.4950; stroke-dashoffset: 36.4950; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#準-bg11  { animation-delay: 3.75s; }
#準-s11   { stroke-dasharray: 40.5420; stroke-dashoffset: 40.5420; animation: drawStroke 0.22s ease-out 3.88s forwards; }
#準-bg12  { animation-delay: 4.12s; }
#準-s12   { stroke-dasharray: 83.0787; stroke-dashoffset: 83.0787; animation: drawStroke 0.46s ease-out 4.25s forwards; }
#準-bg13  { animation-delay: 4.73s; }
#準-s13   { stroke-dasharray: 38.4629; stroke-dashoffset: 38.4629; animation: drawStroke 0.22s ease-out 4.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

