<path id="準-s6"  class="stroke" stroke="#09bf41" d="M74.9,9.5C74.95,10.07,74.88000000000001,10.82,74.71000000000001,11.31C73.57000000000001,14.43,72.12,16.83,69.50000000000001,20.630000000000003"/>
<path id="準-s7"  class="stroke" stroke="#09bf95" d="M51.83,23.31C57.56,22.59,76.37,20.759999999999998,84.83,19.84C86.78,19.63,88.17999999999999,19.46,88.75,19.37"/>
<path id="準-s8"  class="stroke" stroke="#0995bf" d="M69.26,23.3C69.59,23.59,69.85000000000001,24.98,69.85000000000001,25.47C69.85000000000001,30.49,69.69000000000001,44.62,69.69000000000001,53.61"/>
<path id="準-s9"  class="stroke" stroke="#0941bf" d="M53.04,34.33C58.18,33.85,74.98,32.309999999999995,82.75,31.549999999999997C84.71,31.359999999999996,86.13,31.209999999999997,86.68,31.15"/>
<path id="準-s10"  class="stroke" stroke="#2509bf" d="M52.26,45.52C57.83,45.1,75.57,43.17,84.24,42.46C86.14999999999999,42.300000000000004,87.67999999999999,42.21,88.6,42.2"/>
<path id="準-s11"  class="stroke" stroke="#7909bf" d="M52.46,56.79C57.980000000000004,56.199999999999996,77.43,53.24,87.5,53.37C89.87,53.4,91.74,53.519999999999996,92.79,53.769999999999996"/>
<path id="準-s12"  class="stroke" stroke="#bf09b1" d="M13.13,77.73C16.39,78.89,20.17,78.73,23.5,78.36C42.879999999999995,76.25,72.71000000000001,74.15,87.13,73.63C90.08,73.52,92.97999999999999,73.44,95.88,74.07"/>
<path id="準-s13"  class="stroke" stroke="#bf095d" d="M52.66,62.63C53.58,63.550000000000004,54.48,65.37,54.48,67.16C54.48,68.08,54.54,81.75,54.54,94.75C54.54,96.93,54.53,99.39,54.5,100.63"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
