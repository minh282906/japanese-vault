<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (簡)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #簡-bg[i]: Thời gian quả bóng số nảy lên
   - #簡-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#簡-bg1  { animation-delay: 0.05s; }
#簡-s1   { stroke-dasharray: 23.5187; stroke-dashoffset: 23.5187; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#簡-bg2  { animation-delay: 0.42s; }
#簡-s2   { stroke-dasharray: 20.9715; stroke-dashoffset: 20.9715; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#簡-bg3  { animation-delay: 0.79s; }
#簡-s3   { stroke-dasharray: 9.0371; stroke-dashoffset: 9.0371; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#簡-bg4  { animation-delay: 1.16s; }
#簡-s4   { stroke-dasharray: 20.3637; stroke-dashoffset: 20.3637; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#簡-bg5  { animation-delay: 1.53s; }
#簡-s5   { stroke-dasharray: 27.3668; stroke-dashoffset: 27.3668; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#簡-bg6  { animation-delay: 1.90s; }
#簡-s6   { stroke-dasharray: 9.6201; stroke-dashoffset: 9.6201; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#簡-bg7  { animation-delay: 2.27s; }
#簡-s7   { stroke-dasharray: 56.8348; stroke-dashoffset: 56.8348; animation: drawStroke 0.31s ease-out 2.40s forwards; }
#簡-bg8  { animation-delay: 2.73s; }
#簡-s8   { stroke-dasharray: 42.8895; stroke-dashoffset: 42.8895; animation: drawStroke 0.24s ease-out 2.86s forwards; }
#簡-bg9  { animation-delay: 3.12s; }
#簡-s9   { stroke-dasharray: 21.1809; stroke-dashoffset: 21.1809; animation: drawStroke 0.22s ease-out 3.25s forwards; }
#簡-bg10  { animation-delay: 3.49s; }
#簡-s10   { stroke-dasharray: 19.8699; stroke-dashoffset: 19.8699; animation: drawStroke 0.22s ease-out 3.62s forwards; }
#簡-bg11  { animation-delay: 3.86s; }
#簡-s11   { stroke-dasharray: 21.8571; stroke-dashoffset: 21.8571; animation: drawStroke 0.22s ease-out 3.99s forwards; }
#簡-bg12  { animation-delay: 4.23s; }
#簡-s12   { stroke-dasharray: 96.7080; stroke-dashoffset: 96.7080; animation: drawStroke 0.53s ease-out 4.36s forwards; }
#簡-bg13  { animation-delay: 4.91s; }
#簡-s13   { stroke-dasharray: 23.5544; stroke-dashoffset: 23.5544; animation: drawStroke 0.22s ease-out 5.04s forwards; }
#簡-bg14  { animation-delay: 5.28s; }
#簡-s14   { stroke-dasharray: 23.6406; stroke-dashoffset: 23.6406; animation: drawStroke 0.22s ease-out 5.41s forwards; }
#簡-bg15  { animation-delay: 5.65s; }
#簡-s15   { stroke-dasharray: 27.2379; stroke-dashoffset: 27.2379; animation: drawStroke 0.22s ease-out 5.78s forwards; }
#簡-bg16  { animation-delay: 6.02s; }
#簡-s16   { stroke-dasharray: 47.9015; stroke-dashoffset: 47.9015; animation: drawStroke 0.26s ease-out 6.15s forwards; }
#簡-bg17  { animation-delay: 6.43s; }
#簡-s17   { stroke-dasharray: 19.8595; stroke-dashoffset: 19.8595; animation: drawStroke 0.22s ease-out 6.56s forwards; }
#簡-bg18  { animation-delay: 6.80s; }
#簡-s18   { stroke-dasharray: 20.2281; stroke-dashoffset: 20.2281; animation: drawStroke 0.22s ease-out 6.93s forwards; }
]]>
</style>

