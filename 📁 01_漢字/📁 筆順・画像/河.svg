<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (河)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #河-bg[i]: Thời gian quả bóng số nảy lên
   - #河-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#河-bg1  { animation-delay: 0.05s; }
#河-s1   { stroke-dasharray: 13.9986; stroke-dashoffset: 13.9986; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#河-bg2  { animation-delay: 0.42s; }
#河-s2   { stroke-dasharray: 13.5955; stroke-dashoffset: 13.5955; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#河-bg3  { animation-delay: 0.79s; }
#河-s3   { stroke-dasharray: 22.6129; stroke-dashoffset: 22.6129; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#河-bg4  { animation-delay: 1.16s; }
#河-s4   { stroke-dasharray: 55.6654; stroke-dashoffset: 55.6654; animation: drawStroke 0.31s ease-out 1.29s forwards; }
#河-bg5  { animation-delay: 1.62s; }
#河-s5   { stroke-dasharray: 23.3721; stroke-dashoffset: 23.3721; animation: drawStroke 0.22s ease-out 1.75s forwards; }
#河-bg6  { animation-delay: 1.99s; }
#河-s6   { stroke-dasharray: 37.9170; stroke-dashoffset: 37.9170; animation: drawStroke 0.22s ease-out 2.12s forwards; }
#河-bg7  { animation-delay: 2.36s; }
#河-s7   { stroke-dasharray: 19.4363; stroke-dashoffset: 19.4363; animation: drawStroke 0.22s ease-out 2.49s forwards; }
#河-bg8  { animation-delay: 2.73s; }
#河-s8   { stroke-dasharray: 79.5556; stroke-dashoffset: 79.5556; animation: drawStroke 0.44s ease-out 2.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #河-s[i]) -->
<path id="河-s1"  class="stroke" stroke="#bf0909" d="M21.88,17.38C25.919999999999998,18.97,31.74,23.369999999999997,32.76,25.85"/>
<path id="河-s2"  class="stroke" stroke="#bf9109" d="M16.62,40C20.72,41.19,27.22,44.9,28.240000000000002,46.75"/>
<path id="河-s3"  class="stroke" stroke="#64bf09" d="M15.44,85.78C16.75,86.33,18.09,86.08,18.87,84.82000000000001C21.84,80.08000000000001,24.8,74.29,27.5,68.25"/>
<path id="河-s4"  class="stroke" stroke="#09bf36" d="M41.22,23.13C44,23.75,47.39,23.48,50,23.169999999999998C59.61,22.02,78.85,19.509999999999998,89,18.57C91.6,18.330000000000002,93.98,18.14,96.53,18.79"/>
<path id="河-s5"  class="stroke" stroke="#09bfbf" d="M43.08,43.57C43.879999999999995,44.37,44.48,45.44,44.559999999999995,46.49C45.35999999999999,49.940000000000005,46.209999999999994,56.07,46.879999999999995,61.38C47.10999999999999,63.160000000000004,47.309999999999995,64.84,47.489999999999995,66.3"/>
<path id="河-s6"  class="stroke" stroke="#0936bf" d="M45.4,45.55C52.379999999999995,44.209999999999994,59.44,42.69,63.629999999999995,42.05C66.22999999999999,41.65,67.75,43.12,67.41,45.379999999999995C66.81,49.419999999999995,66.36999999999999,52.12,65.19,58.48"/>
<path id="河-s7"  class="stroke" stroke="#6409bf" d="M48.39,61.83C52.12,61.39,58.31,60.36,63.88,59.54C65.17,59.35,66.43,59.17,67.62,59.01"/>
<path id="河-s8"  class="stroke" stroke="#bf0991" d="M82.66,22.34C83.85,23.53,84.55,25.13,84.55,27.02C84.55,40.7,84.6,82.84,84.6,87.5C84.6,96.5,76.38999999999999,88.41,75.21,87.23"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="河-bg1"  class="badge-group"><circle cx="21.88" cy="17.38" r="3.5" fill="#bf0909"/><text class="num-single" x="21.88" y="17.38" dx="0" dy="-0.5">1</text></g>
<g id="河-bg2"  class="badge-group"><circle cx="16.62" cy="40" r="3.5" fill="#bf9109"/><text class="num-single" x="16.62" y="40" dx="0" dy="-0.5">2</text></g>
<g id="河-bg3"  class="badge-group"><circle cx="15.44" cy="85.78" r="3.5" fill="#64bf09"/><text class="num-single" x="15.44" y="85.78" dx="0" dy="-0.5">3</text></g>
<g id="河-bg4"  class="badge-group"><circle cx="41.22" cy="23.13" r="3.5" fill="#09bf36"/><text class="num-single" x="41.22" y="23.13" dx="0" dy="-0.5">4</text></g>
<g id="河-bg5"  class="badge-group"><circle cx="43.08" cy="40.07" r="3.5" fill="#09bfbf"/><text class="num-single" x="43.08" y="40.07" dx="0" dy="-0.5">5</text></g>
<g id="河-bg6"  class="badge-group"><circle cx="45.4" cy="49.05" r="3.5" fill="#0936bf"/><text class="num-single" x="45.4" y="49.05" dx="0" dy="-0.5">6</text></g>
<g id="河-bg7"  class="badge-group"><circle cx="48.39" cy="61.83" r="3.5" fill="#6409bf"/><text class="num-single" x="48.39" y="61.83" dx="0" dy="-0.5">7</text></g>
<g id="河-bg8"  class="badge-group"><circle cx="82.66" cy="22.34" r="3.5" fill="#bf0991"/><text class="num-single" x="82.66" y="22.34" dx="0" dy="-0.5">8</text></g>
</svg>