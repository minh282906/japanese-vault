<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (査)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #査-bg[i]: Thời gian quả bóng số nảy lên
   - #査-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#査-bg1  { animation-delay: 0.05s; }
#査-s1   { stroke-dasharray: 59.6356; stroke-dashoffset: 59.6356; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#査-bg2  { animation-delay: 0.53s; }
#査-s2   { stroke-dasharray: 40.0737; stroke-dashoffset: 40.0737; animation: drawStroke 0.22s ease-out 0.66s forwards; }
#査-bg3  { animation-delay: 0.90s; }
#査-s3   { stroke-dasharray: 47.0716; stroke-dashoffset: 47.0716; animation: drawStroke 0.26s ease-out 1.03s forwards; }
#査-bg4  { animation-delay: 1.31s; }
#査-s4   { stroke-dasharray: 45.2455; stroke-dashoffset: 45.2455; animation: drawStroke 0.25s ease-out 1.44s forwards; }
#査-bg5  { animation-delay: 1.71s; }
#査-s5   { stroke-dasharray: 36.4601; stroke-dashoffset: 36.4601; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#査-bg6  { animation-delay: 2.08s; }
#査-s6   { stroke-dasharray: 63.7939; stroke-dashoffset: 63.7939; animation: drawStroke 0.35s ease-out 2.21s forwards; }
#査-bg7  { animation-delay: 2.58s; }
#査-s7   { stroke-dasharray: 27.8095; stroke-dashoffset: 27.8095; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#査-bg8  { animation-delay: 2.95s; }
#査-s8   { stroke-dasharray: 27.5799; stroke-dashoffset: 27.5799; animation: drawStroke 0.22s ease-out 3.08s forwards; }
#査-bg9  { animation-delay: 3.32s; }
#査-s9   { stroke-dasharray: 71.0692; stroke-dashoffset: 71.0692; animation: drawStroke 0.39s ease-out 3.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #査-s[i]) -->
<path id="査-s1"  class="stroke" stroke="#bf0909" d="M22.21,28.92C25.25,29.5,28.66,29.380000000000003,31.380000000000003,28.990000000000002C42.62,27.38,59.5,26,74.13,25.13C76.42999999999999,24.99,79.31,24.83,81.6,25.29"/>
<path id="査-s2"  class="stroke" stroke="#bf8209" d="M52.63,11.25C53.5,12.12,54.03,14.129999999999999,54.03,15C54.03,22.02,53.99,35.989999999999995,53.99,45.75C53.99,47.95,54.03,49.95,53.99,51"/>
<path id="査-s3"  class="stroke" stroke="#82bf09" d="M52.13,27.47C52.13,28.349999999999998,50.32,30.77,49.61,31.599999999999998C41.68,40.9,31.37,50.379999999999995,16.33,56.9"/>
<path id="査-s4"  class="stroke" stroke="#09bf09" d="M54.9,27.76C58.93,30.650000000000002,73.25,41.99,81.72999999999999,48.18000000000001C84.71,50.35000000000001,87.99,52.38000000000001,91.64999999999999,54.010000000000005"/>
<path id="査-s5"  class="stroke" stroke="#09bf82" d="M38.02,57.42C38.800000000000004,58.2,39.18,59.870000000000005,39.18,61.11C39.18,61.71,39.37,82.62,39.37,93.62"/>
<path id="査-s6"  class="stroke" stroke="#0982bf" d="M40.07,58.73C48.63,57.62,57.379999999999995,56.62,65.5,55.739999999999995C68.54,55.41,69.34,57.48,69.34,58.41C69.34,63.5,69.38000000000001,79.63,69.38000000000001,91.28999999999999"/>
<path id="査-s7"  class="stroke" stroke="#0909bf" d="M40.42,70.69C48.22,69.82,61.22,68.27,68.08,67.83"/>
<path id="査-s8"  class="stroke" stroke="#8209bf" d="M40.41,82.04C46.5,81.60000000000001,60.83,79.80000000000001,67.87,79.5"/>
<path id="査-s9"  class="stroke" stroke="#bf0982" d="M18.48,95.45C21.95,96.56,25.17,96.26,28.759999999999998,95.98C43.379999999999995,94.87,59.66,93.7,77.75999999999999,92.34C81.46999999999998,92.06,85.6,92.29,89.27999999999999,92.96000000000001"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="査-bg1"  class="badge-group"><circle cx="22.21" cy="28.92" r="3.5" fill="#bf0909"/><text class="num-single" x="22.21" y="28.92" dx="0" dy="-0.5">1</text></g>
<g id="査-bg2"  class="badge-group"><circle cx="52.63" cy="11.25" r="3.5" fill="#bf8209"/><text class="num-single" x="52.63" y="11.25" dx="0" dy="-0.5">2</text></g>
<g id="査-bg3"  class="badge-group"><circle cx="52.13" cy="23.97" r="3.5" fill="#82bf09"/><text class="num-single" x="52.13" y="23.97" dx="0" dy="-0.5">3</text></g>
<g id="査-bg4"  class="badge-group"><circle cx="54.9" cy="31.26" r="3.5" fill="#09bf09"/><text class="num-single" x="54.9" y="31.26" dx="0" dy="-0.5">4</text></g>
<g id="査-bg5"  class="badge-group"><circle cx="38.02" cy="53.92" r="3.5" fill="#09bf82"/><text class="num-single" x="38.02" y="53.92" dx="0" dy="-0.5">5</text></g>
<g id="査-bg6"  class="badge-group"><circle cx="40.07" cy="62.23" r="3.5" fill="#0982bf"/><text class="num-single" x="40.07" y="62.23" dx="0" dy="-0.5">6</text></g>
<g id="査-bg7"  class="badge-group"><circle cx="40.42" cy="70.69" r="3.5" fill="#0909bf"/><text class="num-single" x="40.42" y="70.69" dx="0" dy="-0.5">7</text></g>
<g id="査-bg8"  class="badge-group"><circle cx="40.41" cy="82.04" r="3.5" fill="#8209bf"/><text class="num-single" x="40.41" y="82.04" dx="0" dy="-0.5">8</text></g>
<g id="査-bg9"  class="badge-group"><circle cx="18.48" cy="95.45" r="3.5" fill="#bf0982"/><text class="num-single" x="18.48" y="95.45" dx="0" dy="-0.5">9</text></g>
</svg>