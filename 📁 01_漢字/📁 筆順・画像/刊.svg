<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (刊)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #刊-bg[i]: Thời gian quả bóng số nảy lên
   - #刊-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#刊-bg1  { animation-delay: 0.05s; }
#刊-s1   { stroke-dasharray: 34.0581; stroke-dashoffset: 34.0581; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#刊-bg2  { animation-delay: 0.42s; }
#刊-s2   { stroke-dasharray: 45.8399; stroke-dashoffset: 45.8399; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#刊-bg3  { animation-delay: 0.82s; }
#刊-s3   { stroke-dasharray: 65.5376; stroke-dashoffset: 65.5376; animation: drawStroke 0.36s ease-out 0.95s forwards; }
#刊-bg4  { animation-delay: 1.33s; }
#刊-s4   { stroke-dasharray: 34.5407; stroke-dashoffset: 34.5407; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#刊-bg5  { animation-delay: 1.70s; }
#刊-s5   { stroke-dasharray: 87.1224; stroke-dashoffset: 87.1224; animation: drawStroke 0.48s ease-out 1.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #刊-s[i]) -->
<path id="刊-s1"  class="stroke" stroke="#bf0909" d="M17.79,26.53C19.47,26.84,21.21,26.92,22.89,26.700000000000003C28.04,26.03,38.92,24.240000000000002,46,23.42C47.84,23.21,49.75,23.14,51.53,23.78"/>
<path id="刊-s2"  class="stroke" stroke="#9abf09" d="M11.79,48.72C13.739999999999998,49.49,16.46,49.3,18.5,49C29.060000000000002,47.45,40.03,45.76,50,44.64C52.51,44.36,54.74,44.07,57.21,44.67"/>
<path id="刊-s3"  class="stroke" stroke="#09bf52" d="M33.85,28.58C34.95,29.68,35.59,31.119999999999997,35.59,32.519999999999996C35.59,33.309999999999995,35.56,71.53,35.5,87.38C35.49,90.46,35.48,92.69,35.47,93.64"/>
<path id="刊-s4"  class="stroke" stroke="#0952bf" d="M66.02,33.08C67,34,67.52,35.62,67.52,37.6C67.52,47.85,67.50999999999999,55.900000000000006,67.5,61.5C67.5,63.86,67.5,65.78,67.5,67.25"/>
<path id="刊-s5"  class="stroke" stroke="#9a09bf" d="M87.27,16.83C88.25,17.75,89.03,19.119999999999997,89.03,21.099999999999998C89.03,35.66,89.02,81.50999999999999,89.02,86.47C89.02,100.75,82.25,91.25,80.31,88.97"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="刊-bg1"  class="badge-group"><circle cx="17.79" cy="26.53" r="3.5" fill="#bf0909"/><text class="num-single" x="17.79" y="26.53" dx="0" dy="-0.5">1</text></g>
<g id="刊-bg2"  class="badge-group"><circle cx="11.79" cy="48.72" r="3.5" fill="#9abf09"/><text class="num-single" x="11.79" y="48.72" dx="0" dy="-0.5">2</text></g>
<g id="刊-bg3"  class="badge-group"><circle cx="33.85" cy="28.58" r="3.5" fill="#09bf52"/><text class="num-single" x="33.85" y="28.58" dx="0" dy="-0.5">3</text></g>
<g id="刊-bg4"  class="badge-group"><circle cx="66.02" cy="33.08" r="3.5" fill="#0952bf"/><text class="num-single" x="66.02" y="33.08" dx="0" dy="-0.5">4</text></g>
<g id="刊-bg5"  class="badge-group"><circle cx="87.27" cy="16.83" r="3.5" fill="#9a09bf"/><text class="num-single" x="87.27" y="16.83" dx="0" dy="-0.5">5</text></g>
</svg>