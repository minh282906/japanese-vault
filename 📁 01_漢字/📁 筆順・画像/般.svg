<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (般)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #般-bg[i]: Thời gian quả bóng số nảy lên
   - #般-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#般-bg1  { animation-delay: 0.05s; }
#般-s1   { stroke-dasharray: 15.1464; stroke-dashoffset: 15.1464; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#般-bg2  { animation-delay: 0.42s; }
#般-s2   { stroke-dasharray: 71.6681; stroke-dashoffset: 71.6681; animation: drawStroke 0.39s ease-out 0.55s forwards; }
#般-bg3  { animation-delay: 0.96s; }
#般-s3   { stroke-dasharray: 99.9246; stroke-dashoffset: 99.9246; animation: drawStroke 0.55s ease-out 1.09s forwards; }
#般-bg4  { animation-delay: 1.66s; }
#般-s4   { stroke-dasharray: 10.6548; stroke-dashoffset: 10.6548; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#般-bg5  { animation-delay: 2.03s; }
#般-s5   { stroke-dasharray: 23.2602; stroke-dashoffset: 23.2602; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#般-bg6  { animation-delay: 2.40s; }
#般-s6   { stroke-dasharray: 41.3830; stroke-dashoffset: 41.3830; animation: drawStroke 0.23s ease-out 2.53s forwards; }
#般-bg7  { animation-delay: 2.78s; }
#般-s7   { stroke-dasharray: 32.5691; stroke-dashoffset: 32.5691; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#般-bg8  { animation-delay: 3.15s; }
#般-s8   { stroke-dasharray: 62.6205; stroke-dashoffset: 62.6205; animation: drawStroke 0.34s ease-out 3.28s forwards; }
#般-bg9  { animation-delay: 3.64s; }
#般-s9   { stroke-dasharray: 79.2705; stroke-dashoffset: 79.2705; animation: drawStroke 0.44s ease-out 3.77s forwards; }
#般-bg10  { animation-delay: 4.23s; }
#般-s10   { stroke-dasharray: 48.0947; stroke-dashoffset: 48.0947; animation: drawStroke 0.26s ease-out 4.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #般-s[i]) -->
<path id="般-s1"  class="stroke" stroke="#bf0909" d="M35.45,12C35.75,13.25,35.580000000000005,13.870000000000001,34.95,15.4C33.99,17.75,33.120000000000005,20.130000000000003,29.240000000000002,25.490000000000002"/>
<path id="般-s2"  class="stroke" stroke="#bf7609" d="M21.65,25.81C22.669999999999998,26.83,22.83,28.24,22.9,29.909999999999997C24.5,68.75,20.5,85,14,95.72"/>
<path id="般-s3"  class="stroke" stroke="#9abf09" d="M23.75,28.73C29,27.5,36.980000000000004,26.09,41.760000000000005,25.32C45.38,24.740000000000002,46.970000000000006,25.9,46.95,30.240000000000002C46.900000000000006,39.050000000000004,46.550000000000004,88.34,46.550000000000004,91.45C46.550000000000004,101.49000000000001,41.150000000000006,93.45,40.35,92.79"/>
<path id="般-s4"  class="stroke" stroke="#2dbf09" d="M31.4,36.6C33.03,38.43,36.839999999999996,43.300000000000004,37.239999999999995,45.43"/>
<path id="般-s5"  class="stroke" stroke="#09bf52" d="M33.05,57.65C34.05,59.32,34.25,60.32,34.25,61.66C34.25,66.08,34.41,71.75,34.37,76.49C34.36,78,34.349999999999994,79.41,34.349999999999994,80.66999999999999"/>
<path id="般-s6"  class="stroke" stroke="#09bfbf" d="M12.75,59.96C13.77,60.980000000000004,14.61,61.11,16,60.79C17.39,60.47,47,48.739999999999995,51.25,47.06"/>
<path id="般-s7"  class="stroke" stroke="#0952bf" d="M60.85,18.63C61.800000000000004,19.58,62.02,20.91,62.01,21.96C61.85,32.79,60.5,42.63,55.69,49.81"/>
<path id="般-s8"  class="stroke" stroke="#2d09bf" d="M62.94,20.54C67.88,19.75,73.5,18.5,76.47999999999999,17.9C78.92999999999999,17.41,79.71999999999998,18.349999999999998,79.47999999999999,20.38C79.02,24.36,78.63,30.84,78.52999999999999,34.82C78.38999999999999,41.08,80.51999999999998,43.81,86.85999999999999,43.81C94.48999999999998,43.81,95.68999999999998,41.5,95.68999999999998,34.870000000000005"/>
<path id="般-s9"  class="stroke" stroke="#9a09bf" d="M58.92,56.07C60.08,56.43,62.190000000000005,56.29,64.55,55.93C67.38,55.5,79.62,51.96,81.22,51.43C83.26,50.75,84.64,52.54,83.9,54.4C77.14,71.25,66.77000000000001,86.37,53.650000000000006,94.66"/>
<path id="般-s10"  class="stroke" stroke="#bf0976" d="M57.32,63.46C61.08,64.15,72.75,78.13,84.83,89.33C87.42,91.73,89.98,93.61,93.12,95.21"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="般-bg1"  class="badge-group"><circle cx="35.45" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="35.45" y="12" dx="0" dy="-0.5">1</text></g>
<g id="般-bg2"  class="badge-group"><circle cx="21.65" cy="22.31" r="3.5" fill="#bf7609"/><text class="num-single" x="21.65" y="22.31" dx="0" dy="-0.5">2</text></g>
<g id="般-bg3"  class="badge-group"><circle cx="23.75" cy="32.23" r="3.5" fill="#9abf09"/><text class="num-single" x="23.75" y="32.23" dx="0" dy="-0.5">3</text></g>
<g id="般-bg4"  class="badge-group"><circle cx="31.4" cy="36.6" r="3.5" fill="#2dbf09"/><text class="num-single" x="31.4" y="36.6" dx="0" dy="-0.5">4</text></g>
<g id="般-bg5"  class="badge-group"><circle cx="33.05" cy="57.65" r="3.5" fill="#09bf52"/><text class="num-single" x="33.05" y="57.65" dx="0" dy="-0.5">5</text></g>
<g id="般-bg6"  class="badge-group"><circle cx="12.75" cy="59.96" r="3.5" fill="#09bfbf"/><text class="num-single" x="12.75" y="59.96" dx="0" dy="-0.5">6</text></g>
<g id="般-bg7"  class="badge-group"><circle cx="60.85" cy="15.13" r="3.5" fill="#0952bf"/><text class="num-single" x="60.85" y="15.13" dx="0" dy="-0.5">7</text></g>
<g id="般-bg8"  class="badge-group"><circle cx="62.94" cy="24.04" r="3.5" fill="#2d09bf"/><text class="num-single" x="62.94" y="24.04" dx="0" dy="-0.5">8</text></g>
<g id="般-bg9"  class="badge-group"><circle cx="58.92" cy="56.07" r="3.5" fill="#9a09bf"/><text class="num-single" x="58.92" y="56.07" dx="0" dy="-0.5">9</text></g>
<g id="般-bg10" class="badge-group"><circle cx="57.32" cy="63.46" r="3.5" fill="#bf0976"/><text class="num-double" x="57.32" y="63.46" dx="-0.4" dy="-0.475">10</text></g>
</svg>