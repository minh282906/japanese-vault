<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (処)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #処-bg[i]: Thời gian quả bóng số nảy lên
   - #処-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#処-bg1  { animation-delay: 0.05s; }
#処-s1   { stroke-dasharray: 44.6973; stroke-dashoffset: 44.6973; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#処-bg2  { animation-delay: 0.45s; }
#処-s2   { stroke-dasharray: 89.7014; stroke-dashoffset: 89.7014; animation: drawStroke 0.49s ease-out 0.58s forwards; }
#処-bg3  { animation-delay: 1.09s; }
#処-s3   { stroke-dasharray: 84.2756; stroke-dashoffset: 84.2756; animation: drawStroke 0.46s ease-out 1.22s forwards; }
#処-bg4  { animation-delay: 1.70s; }
#処-s4   { stroke-dasharray: 39.4517; stroke-dashoffset: 39.4517; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#処-bg5  { animation-delay: 2.07s; }
#処-s5   { stroke-dasharray: 71.0963; stroke-dashoffset: 71.0963; animation: drawStroke 0.39s ease-out 2.20s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #処-s[i]) -->
<path id="処-s1"  class="stroke" stroke="#bf0909" d="M32.08,17.5C32.25,18.5,32.3,19.89,31.97,21.19C29.88,29.5,22.88,44.75,12.25,56.75"/>
<path id="処-s2"  class="stroke" stroke="#9abf09" d="M32.43,31.15C32.65,31.2,33.6,31.15,34.24,31.02C37.620000000000005,30.38,40.25,29.63,45.59,27.919999999999998C47.64,27.009999999999998,49.56,28.779999999999998,48.900000000000006,31.389999999999997C45.31,45.67999999999999,27.230000000000004,81.39,11.250000000000007,88.75"/>
<path id="処-s3"  class="stroke" stroke="#09bf52" d="M22,48.25C27.4,51.06,62.39,75.78,81.52000000000001,85.57C85.94000000000001,87.83,90.62,89.61999999999999,94.50000000000001,90.75"/>
<path id="処-s4"  class="stroke" stroke="#0952bf" d="M62.26,26C62.94,26.68,63.489999999999995,27.8,63.489999999999995,29.240000000000002C63.489999999999995,42.35,63.739999999999995,55,54.13999999999999,62.5"/>
<path id="処-s5"  class="stroke" stroke="#9a09bf" d="M64.46,27.9C67.77999999999999,26.9,72.50999999999999,25.549999999999997,75.00999999999999,24.89C77.96999999999998,24.11,79.83999999999999,25,79.83999999999999,27.880000000000003C79.83999999999999,32.38,79.63999999999999,47.050000000000004,79.63999999999999,54.760000000000005C79.63999999999999,62.14000000000001,81.00999999999999,64.2,86.97999999999999,64.2C94.02,64.2,94.99999999999999,62.760000000000005,94.99999999999999,58.02"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="処-bg1"  class="badge-group"><circle cx="32.08" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="32.08" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="処-bg2"  class="badge-group"><circle cx="32.43" cy="31.15" r="3.5" fill="#9abf09"/><text class="num-single" x="32.43" y="31.15" dx="0" dy="-0.5">2</text></g>
<g id="処-bg3"  class="badge-group"><circle cx="22" cy="48.25" r="3.5" fill="#09bf52"/><text class="num-single" x="22" y="48.25" dx="0" dy="-0.5">3</text></g>
<g id="処-bg4"  class="badge-group"><circle cx="62.26" cy="22.5" r="3.5" fill="#0952bf"/><text class="num-single" x="62.26" y="22.5" dx="0" dy="-0.5">4</text></g>
<g id="処-bg5"  class="badge-group"><circle cx="64.46" cy="31.4" r="3.5" fill="#9a09bf"/><text class="num-single" x="64.46" y="31.4" dx="0" dy="-0.5">5</text></g>
</svg>