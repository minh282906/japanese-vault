<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (番)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #番-bg[i]: Thời gian quả bóng số nảy lên
   - #番-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#番-bg1  { animation-delay: 0.05s; }
#番-s1   { stroke-dasharray: 37.6967; stroke-dashoffset: 37.6967; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#番-bg2  { animation-delay: 0.42s; }
#番-s2   { stroke-dasharray: 11.7992; stroke-dashoffset: 11.7992; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#番-bg3  { animation-delay: 0.79s; }
#番-s3   { stroke-dasharray: 18.1442; stroke-dashoffset: 18.1442; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#番-bg4  { animation-delay: 1.16s; }
#番-s4   { stroke-dasharray: 68.9907; stroke-dashoffset: 68.9907; animation: drawStroke 0.38s ease-out 1.29s forwards; }
#番-bg5  { animation-delay: 1.69s; }
#番-s5   { stroke-dasharray: 39.5347; stroke-dashoffset: 39.5347; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#番-bg6  { animation-delay: 2.06s; }
#番-s6   { stroke-dasharray: 38.6452; stroke-dashoffset: 38.6452; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#番-bg7  { animation-delay: 2.43s; }
#番-s7   { stroke-dasharray: 43.5175; stroke-dashoffset: 43.5175; animation: drawStroke 0.24s ease-out 2.56s forwards; }
#番-bg8  { animation-delay: 2.82s; }
#番-s8   { stroke-dasharray: 34.6501; stroke-dashoffset: 34.6501; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#番-bg9  { animation-delay: 3.19s; }
#番-s9   { stroke-dasharray: 81.5895; stroke-dashoffset: 81.5895; animation: drawStroke 0.45s ease-out 3.32s forwards; }
#番-bg10  { animation-delay: 3.79s; }
#番-s10   { stroke-dasharray: 27.7929; stroke-dashoffset: 27.7929; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#番-bg11  { animation-delay: 4.16s; }
#番-s11   { stroke-dasharray: 42.3430; stroke-dashoffset: 42.3430; animation: drawStroke 0.23s ease-out 4.29s forwards; }
#番-bg12  { animation-delay: 4.54s; }
#番-s12   { stroke-dasharray: 38.1171; stroke-dashoffset: 38.1171; animation: drawStroke 0.22s ease-out 4.67s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

