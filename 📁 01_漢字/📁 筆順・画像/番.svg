<path id="番-s5"  class="stroke" stroke="#09bf09" d="M52.15,20.25C53.14,21.24,53.65,22.5,53.65,23.88C53.65,28.869999999999997,53.5,44.43,53.449999999999996,54C53.44,56.16,53.42999999999999,58.019999999999996,53.42999999999999,59.38"/>
<path id="番-s6"  class="stroke" stroke="#09bf64" d="M48.62,39.38C48.62,40.620000000000005,48.169999999999995,41.46,47.55,42.24C40.66,50.82,32.7,59.03,20.5,64.75"/>
<path id="番-s7"  class="stroke" stroke="#09bfbf" d="M55.88,38.6C60.38,42,75.75,53,84.78,58.230000000000004C87.22,59.650000000000006,89.38,61.00000000000001,92.5,61.88"/>
<path id="番-s8"  class="stroke" stroke="#0964bf" d="M29.06,65.67C29.939999999999998,66.55,30.619999999999997,67.75,30.799999999999997,69.49C31.669999999999998,77.97999999999999,32.279999999999994,87.17999999999999,33.05,96.47C33.14,97.6,33.23,98.7,33.32,99.75"/>
<path id="番-s9"  class="stroke" stroke="#0909bf" d="M31.27,67.39C46.62,65.75,63.370000000000005,63.62,73.4,63.14C76.67,62.980000000000004,78.37,64.87,78.15,67.21000000000001C77.60000000000001,73.10000000000001,75.65,85.7,73.46000000000001,95.7C73.23,96.77,72.99000000000001,97.79,72.75000000000001,98.75"/>
<path id="番-s10"  class="stroke" stroke="#6409bf" d="M52.54,66.89C53.25,68,53.5,68.45,53.5,70C53.48,77.31,53.47,92.09,53.47,94.47"/>
<path id="番-s11"  class="stroke" stroke="#bf09bf" d="M33.28,81.4C38.88,80.63000000000001,69.38,78.38000000000001,75.5,78.25"/>
<path id="番-s12"  class="stroke" stroke="#bf0964" d="M34.2,96.97C44.5,96.25,60.13,95.12,72.25,94.75"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="番-bg1"  class="badge-group"><circle cx="64.75" cy="10" r="3.5" fill="#bf0909"/><text class="num-single" x="64.75" y="10" dx="0" dy="-0.5">1</text></g>
