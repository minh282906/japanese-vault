<path id="採-s6"  class="stroke" stroke="#09bf8d" d="M62.12,30.12C64.08,31.880000000000003,67.19,37.370000000000005,67.67999999999999,40.11"/>
<path id="採-s7"  class="stroke" stroke="#098dbf" d="M87.96,24.73C88.05,25.79,87.88,26.330000000000002,87.38,27.310000000000002C85.6,30.770000000000003,81.58999999999999,36.25,76.61999999999999,40.38"/>
<path id="採-s8"  class="stroke" stroke="#092abf" d="M45.38,58.98C47.75,59.25,50.160000000000004,59.239999999999995,52.620000000000005,59C59.580000000000005,58.33,74.35000000000001,56.77,85.12,56.18C86.97,56.08,89.12,55.99,91.03,56.3"/>
<path id="採-s9"  class="stroke" stroke="#4b09bf" d="M65.99,46.11C66.88,47,67.42,48.38,67.42,49.97C67.42,52.89,67.42,77.36,67.36,89.5C67.34,92.82,67.32,95.22,67.29,96"/>
<path id="採-s10"  class="stroke" stroke="#ae09bf" d="M65.96,58.45C65.96,59.5,65.36999999999999,61.32,64.61999999999999,62.620000000000005C59.35999999999999,71.74000000000001,48.62999999999999,82.63000000000001,38.959999999999994,88.34"/>
<path id="採-s11"  class="stroke" stroke="#bf096c" d="M67.38,59.81C71.22999999999999,64.27,82.85,76.43,88.52,81.48C90.44,83.19,92.50999999999999,85.05,94.8,86.24000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="採-bg1"  class="badge-group"><circle cx="13.5" cy="36.17" r="3.5" fill="#bf0909"/><text class="num-single" x="13.5" y="36.17" dx="0" dy="-0.5">1</text></g>
<g id="採-bg2"  class="badge-group"><circle cx="28.77" cy="14" r="3.5" fill="#bf6c09"/><text class="num-single" x="28.77" y="14" dx="0" dy="-0.5">2</text></g>
