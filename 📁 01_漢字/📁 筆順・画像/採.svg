<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (採)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #採-bg[i]: Thời gian quả bóng số nảy lên
   - #採-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#採-bg1  { animation-delay: 0.05s; }
#採-s1   { stroke-dasharray: 28.2030; stroke-dashoffset: 28.2030; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#採-bg2  { animation-delay: 0.42s; }
#採-s2   { stroke-dasharray: 88.8666; stroke-dashoffset: 88.8666; animation: drawStroke 0.49s ease-out 0.55s forwards; }
#採-bg3  { animation-delay: 1.06s; }
#採-s3   { stroke-dasharray: 30.3337; stroke-dashoffset: 30.3337; animation: drawStroke 0.22s ease-out 1.19s forwards; }
#採-bg4  { animation-delay: 1.43s; }
#採-s4   { stroke-dasharray: 29.7095; stroke-dashoffset: 29.7095; animation: drawStroke 0.22s ease-out 1.56s forwards; }
#採-bg5  { animation-delay: 1.80s; }
#採-s5   { stroke-dasharray: 12.4536; stroke-dashoffset: 12.4536; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#採-bg6  { animation-delay: 2.17s; }
#採-s6   { stroke-dasharray: 11.5510; stroke-dashoffset: 11.5510; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#採-bg7  { animation-delay: 2.54s; }
#採-s7   { stroke-dasharray: 19.7172; stroke-dashoffset: 19.7172; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#採-bg8  { animation-delay: 2.91s; }
#採-s8   { stroke-dasharray: 45.8007; stroke-dashoffset: 45.8007; animation: drawStroke 0.25s ease-out 3.04s forwards; }
#採-bg9  { animation-delay: 3.31s; }
#採-s9   { stroke-dasharray: 50.2526; stroke-dashoffset: 50.2526; animation: drawStroke 0.28s ease-out 3.44s forwards; }
#採-bg10  { animation-delay: 3.74s; }
#採-s10   { stroke-dasharray: 41.0800; stroke-dashoffset: 41.0800; animation: drawStroke 0.23s ease-out 3.87s forwards; }
#採-bg11  { animation-delay: 4.12s; }
#採-s11   { stroke-dasharray: 38.1864; stroke-dashoffset: 38.1864; animation: drawStroke 0.22s ease-out 4.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #採-s[i]) -->
<path id="採-s1"  class="stroke" stroke="#bf0909" d="M13.5,36.17C15.58,36.42,17.259999999999998,36.4,19.5,36.17C24.88,35.63,31.5,34.13,37.730000000000004,33.13C38.95,32.940000000000005,40.25000000000001,32.75,41.410000000000004,32.75"/>
<path id="採-s2"  class="stroke" stroke="#bf6c09" d="M28.77,14C29.89,15.120000000000001,30.53,17.12,30.53,19.52C30.53,34.75,30.52,74.63,30.52,86.42C30.52,100.67,24.2,89.95,22.75,88.42"/>
