<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (誌)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #誌-bg[i]: Thời gian quả bóng số nảy lên
   - #誌-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#誌-bg1  { animation-delay: 0.05s; }
#誌-s1   { stroke-dasharray: 13.8255; stroke-dashoffset: 13.8255; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#誌-bg2  { animation-delay: 0.42s; }
#誌-s2   { stroke-dasharray: 29.5201; stroke-dashoffset: 29.5201; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#誌-bg3  { animation-delay: 0.79s; }
#誌-s3   { stroke-dasharray: 22.5929; stroke-dashoffset: 22.5929; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#誌-bg4  { animation-delay: 1.16s; }
#誌-s4   { stroke-dasharray: 21.5747; stroke-dashoffset: 21.5747; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#誌-bg5  { animation-delay: 1.53s; }
#誌-s5   { stroke-dasharray: 21.5388; stroke-dashoffset: 21.5388; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#誌-bg6  { animation-delay: 1.90s; }
#誌-s6   { stroke-dasharray: 36.0836; stroke-dashoffset: 36.0836; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#誌-bg7  { animation-delay: 2.27s; }
#誌-s7   { stroke-dasharray: 17.2506; stroke-dashoffset: 17.2506; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#誌-bg8  { animation-delay: 2.64s; }
#誌-s8   { stroke-dasharray: 45.4544; stroke-dashoffset: 45.4544; animation: drawStroke 0.25s ease-out 2.77s forwards; }
#誌-bg9  { animation-delay: 3.04s; }
#誌-s9   { stroke-dasharray: 38.6839; stroke-dashoffset: 38.6839; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#誌-bg10  { animation-delay: 3.41s; }
#誌-s10   { stroke-dasharray: 38.2119; stroke-dashoffset: 38.2119; animation: drawStroke 0.22s ease-out 3.54s forwards; }
#誌-bg11  { animation-delay: 3.78s; }
#誌-s11   { stroke-dasharray: 19.8450; stroke-dashoffset: 19.8450; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#誌-bg12  { animation-delay: 4.15s; }
#誌-s12   { stroke-dasharray: 58.6146; stroke-dashoffset: 58.6146; animation: drawStroke 0.32s ease-out 4.28s forwards; }
#誌-bg13  { animation-delay: 4.62s; }
#誌-s13   { stroke-dasharray: 9.4122; stroke-dashoffset: 9.4122; animation: drawStroke 0.22s ease-out 4.75s forwards; }
#誌-bg14  { animation-delay: 4.99s; }
#誌-s14   { stroke-dasharray: 16.7273; stroke-dashoffset: 16.7273; animation: drawStroke 0.22s ease-out 5.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

