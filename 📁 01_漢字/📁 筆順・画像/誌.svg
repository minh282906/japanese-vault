<path id="誌-s8"  class="stroke" stroke="#09bfbf" d="M47.59,33.27C50.120000000000005,33.870000000000005,52.620000000000005,33.660000000000004,54.88,33.35C64.88,32,76,30.62,86.63,29.8C88.64999999999999,29.64,90.78999999999999,29.68,92.77,30.1"/>
<path id="誌-s9"  class="stroke" stroke="#0971bf" d="M67.12,11.25C68.12,12.25,68.48,13.64,68.48,15.06C68.48,20.34,68.54,42.25,68.54,49.59"/>
<path id="誌-s10"  class="stroke" stroke="#0923bf" d="M50.91,51.51C52.809999999999995,52.089999999999996,55.17999999999999,51.809999999999995,57.12,51.6C66.39,50.57,75.12,49.38,84.37,48.74C85.89,48.64,87.41000000000001,48.690000000000005,88.91000000000001,48.96"/>
<path id="誌-s11"  class="stroke" stroke="#3d09bf" d="M48.75,74.5C49.01,77.21,46.11,89.16,44,93.68"/>
