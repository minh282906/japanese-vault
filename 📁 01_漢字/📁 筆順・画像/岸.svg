<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (岸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #岸-bg[i]: Thời gian quả bóng số nảy lên
   - #岸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#岸-bg1  { animation-delay: 0.05s; }
#岸-s1   { stroke-dasharray: 17.5897; stroke-dashoffset: 17.5897; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#岸-bg2  { animation-delay: 0.42s; }
#岸-s2   { stroke-dasharray: 65.8097; stroke-dashoffset: 65.8097; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#岸-bg3  { animation-delay: 0.93s; }
#岸-s3   { stroke-dasharray: 18.0187; stroke-dashoffset: 18.0187; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#岸-bg4  { animation-delay: 1.30s; }
#岸-s4   { stroke-dasharray: 56.3204; stroke-dashoffset: 56.3204; animation: drawStroke 0.31s ease-out 1.43s forwards; }
#岸-bg5  { animation-delay: 1.76s; }
#岸-s5   { stroke-dasharray: 49.7986; stroke-dashoffset: 49.7986; animation: drawStroke 0.27s ease-out 1.89s forwards; }
#岸-bg6  { animation-delay: 2.18s; }
#岸-s6   { stroke-dasharray: 33.7769; stroke-dashoffset: 33.7769; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#岸-bg7  { animation-delay: 2.55s; }
#岸-s7   { stroke-dasharray: 61.0541; stroke-dashoffset: 61.0541; animation: drawStroke 0.34s ease-out 2.68s forwards; }
#岸-bg8  { animation-delay: 3.04s; }
#岸-s8   { stroke-dasharray: 41.4172; stroke-dashoffset: 41.4172; animation: drawStroke 0.23s ease-out 3.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #岸-s[i]) -->
<path id="岸-s1"  class="stroke" stroke="#bf0909" d="M53.85,10C54.74,10.89,55.28,12.120000000000001,55.28,13.27C55.28,13.969999999999999,55.2,22.9,55.09,27.2"/>
<path id="岸-s2"  class="stroke" stroke="#bf9109" d="M28.91,18.23C29.78,19.1,30.25,20.39,30.07,21.48C29.5,25,29.5,25.630000000000003,28.88,29.68C28.64,31.25,29.86,32.4,31.279999999999998,32.06C44.12,29,63.12,27,80.77,26.04"/>
<path id="岸-s3"  class="stroke" stroke="#64bf09" d="M83.16,12.92C84.17999999999999,13.94,84.22,15.5,84.07,16.19C83.33999999999999,19.6,82.42999999999999,22.830000000000002,81.52,26.660000000000004C81.25,27.810000000000002,80.97999999999999,29.010000000000005,80.71,30.290000000000003"/>
<path id="岸-s4"  class="stroke" stroke="#09bf36" d="M28.38,44.68C31.36,45.839999999999996,35.26,45.05,38.32,44.78C49.5,43.78,64.3,41.76,74.7,41.06C77.92,40.84,81.2,40.56,84.37,41.31"/>
<path id="岸-s5"  class="stroke" stroke="#09bfbf" d="M29.43,45.03C29.9,46.18,30.1,47.51,29.84,49.02C27.5,62.38,24.38,75.75,10.5,89.5"/>
<path id="岸-s6"  class="stroke" stroke="#0936bf" d="M41.21,57.97C43,58.5,45.27,58.449999999999996,47.22,58.22C53.25,57.51,62.25,56.26,69.88,55.64C71.50999999999999,55.51,73.16,55.51,74.77,55.88"/>
<path id="岸-s7"  class="stroke" stroke="#6409bf" d="M30.15,76.76C32.16,77.13000000000001,35.879999999999995,77.06,37.87,76.84C52.25,75.22,72.75,73.06,83.91999999999999,72.68C87.26999999999998,72.56,89.28999999999999,72.86000000000001,90.96999999999998,73.05000000000001"/>
<path id="岸-s8"  class="stroke" stroke="#bf0991" d="M56.98,58.84C57.76,59.620000000000005,58.339999999999996,60.75,58.339999999999996,62.06C58.339999999999996,62.72,58.33,85.21000000000001,58.24999999999999,95.38C58.22999999999999,97.46,58.21999999999999,99.06,58.209999999999994,99.89"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="岸-bg1"  class="badge-group"><circle cx="53.85" cy="10" r="3.5" fill="#bf0909"/><text class="num-single" x="53.85" y="10" dx="0" dy="-0.5">1</text></g>
<g id="岸-bg2"  class="badge-group"><circle cx="28.91" cy="18.23" r="3.5" fill="#bf9109"/><text class="num-single" x="28.91" y="18.23" dx="0" dy="-0.5">2</text></g>
<g id="岸-bg3"  class="badge-group"><circle cx="83.16" cy="12.92" r="3.5" fill="#64bf09"/><text class="num-single" x="83.16" y="12.92" dx="0" dy="-0.5">3</text></g>
<g id="岸-bg4"  class="badge-group"><circle cx="28.38" cy="41.18" r="3.5" fill="#09bf36"/><text class="num-single" x="28.38" y="41.18" dx="0" dy="-0.5">4</text></g>
<g id="岸-bg5"  class="badge-group"><circle cx="29.43" cy="48.53" r="3.5" fill="#09bfbf"/><text class="num-single" x="29.43" y="48.53" dx="0" dy="-0.5">5</text></g>
<g id="岸-bg6"  class="badge-group"><circle cx="41.21" cy="57.97" r="3.5" fill="#0936bf"/><text class="num-single" x="41.21" y="57.97" dx="0" dy="-0.5">6</text></g>
<g id="岸-bg7"  class="badge-group"><circle cx="30.15" cy="76.76" r="3.5" fill="#6409bf"/><text class="num-single" x="30.15" y="76.76" dx="0" dy="-0.5">7</text></g>
<g id="岸-bg8"  class="badge-group"><circle cx="56.98" cy="58.84" r="3.5" fill="#bf0991"/><text class="num-single" x="56.98" y="58.84" dx="0" dy="-0.5">8</text></g>
</svg>