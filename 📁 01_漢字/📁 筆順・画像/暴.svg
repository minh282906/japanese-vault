<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (暴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #暴-bg[i]: Thời gian quả bóng số nảy lên
   - #暴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#暴-bg1  { animation-delay: 0.05s; }
#暴-s1   { stroke-dasharray: 24.7310; stroke-dashoffset: 24.7310; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#暴-bg2  { animation-delay: 0.42s; }
#暴-s2   { stroke-dasharray: 65.4700; stroke-dashoffset: 65.4700; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#暴-bg3  { animation-delay: 0.93s; }
#暴-s3   { stroke-dasharray: 38.1504; stroke-dashoffset: 38.1504; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#暴-bg4  { animation-delay: 1.30s; }
#暴-s4   { stroke-dasharray: 34.0501; stroke-dashoffset: 34.0501; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#暴-bg5  { animation-delay: 1.67s; }
#暴-s5   { stroke-dasharray: 50.7120; stroke-dashoffset: 50.7120; animation: drawStroke 0.28s ease-out 1.80s forwards; }
#暴-bg6  { animation-delay: 2.10s; }
#暴-s6   { stroke-dasharray: 18.2663; stroke-dashoffset: 18.2663; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#暴-bg7  { animation-delay: 2.47s; }
#暴-s7   { stroke-dasharray: 19.0527; stroke-dashoffset: 19.0527; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#暴-bg8  { animation-delay: 2.84s; }
#暴-s8   { stroke-dasharray: 72.5734; stroke-dashoffset: 72.5734; animation: drawStroke 0.40s ease-out 2.97s forwards; }
#暴-bg9  { animation-delay: 3.39s; }
#暴-s9   { stroke-dasharray: 35.5151; stroke-dashoffset: 35.5151; animation: drawStroke 0.22s ease-out 3.52s forwards; }
#暴-bg10  { animation-delay: 3.76s; }
#暴-s10   { stroke-dasharray: 33.3972; stroke-dashoffset: 33.3972; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#暴-bg11  { animation-delay: 4.13s; }
#暴-s11   { stroke-dasharray: 40.4667; stroke-dashoffset: 40.4667; animation: drawStroke 0.22s ease-out 4.26s forwards; }
#暴-bg12  { animation-delay: 4.50s; }
#暴-s12   { stroke-dasharray: 8.3896; stroke-dashoffset: 8.3896; animation: drawStroke 0.22s ease-out 4.63s forwards; }
#暴-bg13  { animation-delay: 4.87s; }
#暴-s13   { stroke-dasharray: 17.0081; stroke-dashoffset: 17.0081; animation: drawStroke 0.22s ease-out 5.00s forwards; }
#暴-bg14  { animation-delay: 5.24s; }
#暴-s14   { stroke-dasharray: 11.1845; stroke-dashoffset: 11.1845; animation: drawStroke 0.22s ease-out 5.37s forwards; }
#暴-bg15  { animation-delay: 5.61s; }
#暴-s15   { stroke-dasharray: 21.0596; stroke-dashoffset: 21.0596; animation: drawStroke 0.22s ease-out 5.74s forwards; }
]]>
</style>

