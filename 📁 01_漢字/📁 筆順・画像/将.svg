<path id="将-s8"  class="stroke" stroke="#2d09bf" d="M43.86,59.21C46.63,60,49.94,59.71,52.42,59.36C63.11,57.83,79.35,55.18,90.89,54.1C93.65,53.84,96.88,53.76,99.4,54.22"/>
<path id="将-s9"  class="stroke" stroke="#9a09bf" d="M80.57,43.83C81.86999999999999,45.129999999999995,82.35,46.989999999999995,82.35,48.68S82.41999999999999,88.21000000000001,82.41999999999999,91.46000000000001C82.41999999999999,99.35000000000001,77.05999999999999,92.63000000000001,75.49999999999999,91.62"/>
<path id="将-s10"  class="stroke" stroke="#bf0976" d="M60.29,69.01C62.79,70.66000000000001,66.74,75.79,67.36,78.35000000000001"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="将-bg1"  class="badge-group"><circle cx="35.12" cy="15.75" r="3.5" fill="#bf0909"/><text class="num-single" x="35.12" y="15.75" dx="0" dy="-0.5">1</text></g>
<g id="将-bg2"  class="badge-group"><circle cx="17.5" cy="33" r="3.5" fill="#bf7609"/><text class="num-single" x="17.5" y="33" dx="0" dy="-0.5">2</text></g>
