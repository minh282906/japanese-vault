<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (将)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #将-bg[i]: Thời gian quả bóng số nảy lên
   - #将-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#将-bg1  { animation-delay: 0.05s; }
#将-s1   { stroke-dasharray: 81.3543; stroke-dashoffset: 81.3543; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#将-bg2  { animation-delay: 0.65s; }
#将-s2   { stroke-dasharray: 14.4942; stroke-dashoffset: 14.4942; animation: drawStroke 0.22s ease-out 0.78s forwards; }
#将-bg3  { animation-delay: 1.02s; }
#将-s3   { stroke-dasharray: 22.0000; stroke-dashoffset: 22.0000; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#将-bg4  { animation-delay: 1.39s; }
#将-s4   { stroke-dasharray: 33.5645; stroke-dashoffset: 33.5645; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#将-bg5  { animation-delay: 1.76s; }
#将-s5   { stroke-dasharray: 15.1937; stroke-dashoffset: 15.1937; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#将-bg6  { animation-delay: 2.13s; }
#将-s6   { stroke-dasharray: 13.2338; stroke-dashoffset: 13.2338; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#将-bg7  { animation-delay: 2.50s; }
#将-s7   { stroke-dasharray: 17.0625; stroke-dashoffset: 17.0625; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#将-bg8  { animation-delay: 2.87s; }
#将-s8   { stroke-dasharray: 55.9889; stroke-dashoffset: 55.9889; animation: drawStroke 0.31s ease-out 3.00s forwards; }
#将-bg9  { animation-delay: 3.33s; }
#将-s9   { stroke-dasharray: 59.1272; stroke-dashoffset: 59.1272; animation: drawStroke 0.33s ease-out 3.46s forwards; }
#将-bg10  { animation-delay: 3.81s; }
#将-s10   { stroke-dasharray: 11.8701; stroke-dashoffset: 11.8701; animation: drawStroke 0.22s ease-out 3.94s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #将-s[i]) -->
