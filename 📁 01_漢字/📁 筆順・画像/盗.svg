<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (盗)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #盗-bg[i]: Thời gian quả bóng số nảy lên
   - #盗-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#盗-bg1  { animation-delay: 0.05s; }
#盗-s1   { stroke-dasharray: 15.9722; stroke-dashoffset: 15.9722; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#盗-bg2  { animation-delay: 0.42s; }
#盗-s2   { stroke-dasharray: 21.9786; stroke-dashoffset: 21.9786; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#盗-bg3  { animation-delay: 0.79s; }
#盗-s3   { stroke-dasharray: 26.5302; stroke-dashoffset: 26.5302; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#盗-bg4  { animation-delay: 1.16s; }
#盗-s4   { stroke-dasharray: 37.4474; stroke-dashoffset: 37.4474; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#盗-bg5  { animation-delay: 1.53s; }
#盗-s5   { stroke-dasharray: 34.7903; stroke-dashoffset: 34.7903; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#盗-bg6  { animation-delay: 1.90s; }
#盗-s6   { stroke-dasharray: 37.8760; stroke-dashoffset: 37.8760; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#盗-bg7  { animation-delay: 2.27s; }
#盗-s7   { stroke-dasharray: 21.0076; stroke-dashoffset: 21.0076; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#盗-bg8  { animation-delay: 2.64s; }
#盗-s8   { stroke-dasharray: 73.4583; stroke-dashoffset: 73.4583; animation: drawStroke 0.40s ease-out 2.77s forwards; }
#盗-bg9  { animation-delay: 3.19s; }
#盗-s9   { stroke-dasharray: 19.6412; stroke-dashoffset: 19.6412; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#盗-bg10  { animation-delay: 3.56s; }
#盗-s10   { stroke-dasharray: 19.5393; stroke-dashoffset: 19.5393; animation: drawStroke 0.22s ease-out 3.69s forwards; }
#盗-bg11  { animation-delay: 3.93s; }
#盗-s11   { stroke-dasharray: 81.9767; stroke-dashoffset: 81.9767; animation: drawStroke 0.45s ease-out 4.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #盗-s[i]) -->
<path id="盗-s1"  class="stroke" stroke="#bf0909" d="M23.12,18.92C27.37,21.62,32.24,26.37,34.22,30.200000000000003"/>
<path id="盗-s2"  class="stroke" stroke="#bf6c09" d="M17.51,58.74C19.17,59.830000000000005,20.07,59.410000000000004,21.23,58.49C22.36,57.6,29.93,50.79,34.25,46.25"/>
