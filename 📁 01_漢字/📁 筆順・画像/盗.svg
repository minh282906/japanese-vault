<path id="盗-s5"  class="stroke" stroke="#09bf2a" d="M60.41,37.55C61,38.37,60.949999999999996,39.51,60.79,40.489999999999995C59.78,46.589999999999996,54.16,58.39999999999999,41.44,64.24"/>
<path id="盗-s6"  class="stroke" stroke="#09bf8d" d="M60.32,44.59C66.75,48.370000000000005,77.5,55.75,85.89,60.95C87.44,61.91,90,63,92.75,64"/>
<path id="盗-s7"  class="stroke" stroke="#098dbf" d="M27.67,73.48C28.590000000000003,74.4,29.020000000000003,75.59,29.150000000000002,76.45C30.14,83.27000000000001,30.71,87,31.630000000000003,93.91"/>
<path id="盗-s8"  class="stroke" stroke="#092abf" d="M29.8,74.62C39.89,73.39,66.48,70.38000000000001,75.76,69.68C79.5,69.4,81.05000000000001,70.59,80.26,74.75C79.31,79.73,77.2,88.28,76.03,92.93"/>
<path id="盗-s9"  class="stroke" stroke="#4b09bf" d="M45.75,74.42C46.54,75.21000000000001,46.66,76.12,46.66,77.42C46.66,83.24000000000001,46.669999999999995,88.49000000000001,46.669999999999995,93.83"/>
<path id="盗-s10"  class="stroke" stroke="#ae09bf" d="M59.61,73.33C60.39,74.11,60.49,75.25,60.49,76.69C60.49,82.56,59.95,90,59.95,92.65"/>
<path id="盗-s11"  class="stroke" stroke="#bf096c" d="M15.38,95.29C18.630000000000003,96.45,22.15,95.99000000000001,25.51,95.81C40.160000000000004,95.02,62.260000000000005,93.63,86.38,93C90.19999999999999,92.9,93.44,93.17,97.13,93.96"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="盗-bg1"  class="badge-group"><circle cx="23.12" cy="18.92" r="3.5" fill="#bf0909"/><text class="num-single" x="23.12" y="18.92" dx="0" dy="-0.5">1</text></g>
<g id="盗-bg2"  class="badge-group"><circle cx="17.51" cy="58.74" r="3.5" fill="#bf6c09"/><text class="num-single" x="17.51" y="58.74" dx="0" dy="-0.5">2</text></g>
