<g id="盗-bg9"  class="badge-group"><circle cx="45.75" cy="74.42" r="3.5" fill="#4b09bf"/><text class="num-single" x="45.75" y="74.42" dx="0" dy="-0.5">9</text></g>
<g id="盗-bg10" class="badge-group"><circle cx="59.61" cy="73.33" r="3.5" fill="#ae09bf"/><text class="num-double" x="59.61" y="73.33" dx="-0.4" dy="-0.475">10</text></g>
<g id="盗-bg11" class="badge-group"><circle cx="15.38" cy="95.29" r="3.5" fill="#bf096c"/><text class="num-double" x="15.38" y="95.29" dx="-0.4" dy="-0.475">11</text></g>
</svg>