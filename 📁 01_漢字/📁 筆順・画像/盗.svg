<g id="盗-bg6"  class="badge-group"><circle cx="60.32" cy="44.59" r="3.5" fill="#09bf8d"/><text class="num-single" x="60.32" y="44.59" dx="0" dy="-0.5">6</text></g>
<g id="盗-bg7"  class="badge-group"><circle cx="27.67" cy="69.98" r="3.5" fill="#098dbf"/><text class="num-single" x="27.67" y="69.98" dx="0" dy="-0.5">7</text></g>
