<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (解)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #解-bg[i]: Thời gian quả bóng số nảy lên
   - #解-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#解-bg1  { animation-delay: 0.05s; }
#解-s1   { stroke-dasharray: 26.3490; stroke-dashoffset: 26.3490; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#解-bg2  { animation-delay: 0.42s; }
#解-s2   { stroke-dasharray: 37.8928; stroke-dashoffset: 37.8928; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#解-bg3  { animation-delay: 0.79s; }
#解-s3   { stroke-dasharray: 59.4033; stroke-dashoffset: 59.4033; animation: drawStroke 0.33s ease-out 0.92s forwards; }
#解-bg4  { animation-delay: 1.27s; }
#解-s4   { stroke-dasharray: 96.1968; stroke-dashoffset: 96.1968; animation: drawStroke 0.53s ease-out 1.40s forwards; }
#解-bg5  { animation-delay: 1.95s; }
#解-s5   { stroke-dasharray: 28.9468; stroke-dashoffset: 28.9468; animation: drawStroke 0.22s ease-out 2.08s forwards; }
#解-bg6  { animation-delay: 2.32s; }
#解-s6   { stroke-dasharray: 26.3073; stroke-dashoffset: 26.3073; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#解-bg7  { animation-delay: 2.69s; }
#解-s7   { stroke-dasharray: 27.1093; stroke-dashoffset: 27.1093; animation: drawStroke 0.22s ease-out 2.82s forwards; }
#解-bg8  { animation-delay: 3.06s; }
#解-s8   { stroke-dasharray: 66.3664; stroke-dashoffset: 66.3664; animation: drawStroke 0.37s ease-out 3.19s forwards; }
#解-bg9  { animation-delay: 3.58s; }
#解-s9   { stroke-dasharray: 24.1365; stroke-dashoffset: 24.1365; animation: drawStroke 0.22s ease-out 3.71s forwards; }
#解-bg10  { animation-delay: 3.95s; }
#解-s10   { stroke-dasharray: 20.2587; stroke-dashoffset: 20.2587; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#解-bg11  { animation-delay: 4.32s; }
#解-s11   { stroke-dasharray: 31.9984; stroke-dashoffset: 31.9984; animation: drawStroke 0.22s ease-out 4.45s forwards; }
#解-bg12  { animation-delay: 4.69s; }
#解-s12   { stroke-dasharray: 41.3020; stroke-dashoffset: 41.3020; animation: drawStroke 0.23s ease-out 4.82s forwards; }
#解-bg13  { animation-delay: 5.07s; }
#解-s13   { stroke-dasharray: 51.9749; stroke-dashoffset: 51.9749; animation: drawStroke 0.29s ease-out 5.20s forwards; }
]]>
</style>

