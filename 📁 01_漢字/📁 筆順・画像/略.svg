<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (略)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #略-bg[i]: Thời gian quả bóng số nảy lên
   - #略-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#略-bg1  { animation-delay: 0.05s; }
#略-s1   { stroke-dasharray: 45.8712; stroke-dashoffset: 45.8712; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#略-bg2  { animation-delay: 0.45s; }
#略-s2   { stroke-dasharray: 68.0949; stroke-dashoffset: 68.0949; animation: drawStroke 0.37s ease-out 0.58s forwards; }
#略-bg3  { animation-delay: 0.97s; }
#略-s3   { stroke-dasharray: 38.7526; stroke-dashoffset: 38.7526; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#略-bg4  { animation-delay: 1.34s; }
#略-s4   { stroke-dasharray: 24.5355; stroke-dashoffset: 24.5355; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#略-bg5  { animation-delay: 1.71s; }
#略-s5   { stroke-dasharray: 23.4320; stroke-dashoffset: 23.4320; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#略-bg6  { animation-delay: 2.08s; }
#略-s6   { stroke-dasharray: 33.7715; stroke-dashoffset: 33.7715; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#略-bg7  { animation-delay: 2.45s; }
#略-s7   { stroke-dasharray: 80.2007; stroke-dashoffset: 80.2007; animation: drawStroke 0.44s ease-out 2.58s forwards; }
#略-bg8  { animation-delay: 3.04s; }
#略-s8   { stroke-dasharray: 49.6255; stroke-dashoffset: 49.6255; animation: drawStroke 0.27s ease-out 3.17s forwards; }
#略-bg9  { animation-delay: 3.46s; }
#略-s9   { stroke-dasharray: 26.2006; stroke-dashoffset: 26.2006; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#略-bg10  { animation-delay: 3.83s; }
#略-s10   { stroke-dasharray: 54.5913; stroke-dashoffset: 54.5913; animation: drawStroke 0.30s ease-out 3.96s forwards; }
#略-bg11  { animation-delay: 4.28s; }
#略-s11   { stroke-dasharray: 29.7049; stroke-dashoffset: 29.7049; animation: drawStroke 0.22s ease-out 4.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #略-s[i]) -->
<path id="略-s1"  class="stroke" stroke="#bf0909" d="M12.37,33.18C13.03,33.839999999999996,13.34,35.21,13.459999999999999,36.16C14.319999999999999,43.129999999999995,14.7,60.199999999999996,15.18,74C15.24,75.64,15.29,77.23,15.35,78.76"/>
