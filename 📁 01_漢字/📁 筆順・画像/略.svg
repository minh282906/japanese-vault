<path id="略-s6"  class="stroke" stroke="#09bf8d" d="M60.81,14C60.81,14.88,60.800000000000004,15.89,60.480000000000004,16.88C58.5,23,53.88,35.38,46.87,44.42"/>
<path id="略-s7"  class="stroke" stroke="#098dbf" d="M61.48,23.93C61.809999999999995,23.97,63.209999999999994,23.93,64.14999999999999,23.81C67.24,23.439999999999998,73.92999999999999,21.36,78.33999999999999,20.22C81.36999999999999,19.439999999999998,82.22999999999999,21.61,81.46,23.74C77.22,35.38,63.25,58,45.75,66.25"/>
<path id="略-s8"  class="stroke" stroke="#092abf" d="M56.66,32.47C61.75,36.75,78.82,51.42,87.78,58.08C89.1,59.059999999999995,92.75,61.37,95.79,62.82"/>
<path id="略-s9"  class="stroke" stroke="#4b09bf" d="M51.36,70.35C52.38,71.36999999999999,52.86,72.38,53.04,73.64999999999999C53.88,79.63,54.13,85.00999999999999,54.88,91.24C55.07,92.83,55.150000000000006,94.42,55.28,95.96"/>
<path id="略-s10"  class="stroke" stroke="#ae09bf" d="M53.69,72.32C62.629999999999995,70.91,76.49,69.05,82.75999999999999,68.16C85.63,67.75,87.24999999999999,69.75,86.80999999999999,72.02C85.83999999999999,77.03999999999999,84.68999999999998,83.86999999999999,83.28999999999999,90.22"/>
<path id="略-s11"  class="stroke" stroke="#bf096c" d="M56.22,93.61C61.26,93.04,73.97,92.1,82.27,91.2C83.36999999999999,91.08,84.75,91.10000000000001,85.81,91.10000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="略-bg1"  class="badge-group"><circle cx="12.37" cy="29.68" r="3.5" fill="#bf0909"/><text class="num-single" x="12.37" y="29.68" dx="0" dy="-0.5">1</text></g>
