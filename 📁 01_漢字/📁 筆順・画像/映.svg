<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (映)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #映-bg[i]: Thời gian quả bóng số nảy lên
   - #映-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#映-bg1  { animation-delay: 0.05s; }
#映-s1   { stroke-dasharray: 48.1020; stroke-dashoffset: 48.1020; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#映-bg2  { animation-delay: 0.46s; }
#映-s2   { stroke-dasharray: 66.9456; stroke-dashoffset: 66.9456; animation: drawStroke 0.37s ease-out 0.59s forwards; }
#映-bg3  { animation-delay: 0.98s; }
#映-s3   { stroke-dasharray: 17.4311; stroke-dashoffset: 17.4311; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#映-bg4  { animation-delay: 1.35s; }
#映-s4   { stroke-dasharray: 17.2209; stroke-dashoffset: 17.2209; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#映-bg5  { animation-delay: 1.72s; }
#映-s5   { stroke-dasharray: 22.8746; stroke-dashoffset: 22.8746; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#映-bg6  { animation-delay: 2.09s; }
#映-s6   { stroke-dasharray: 58.9399; stroke-dashoffset: 58.9399; animation: drawStroke 0.32s ease-out 2.22s forwards; }
#映-bg7  { animation-delay: 2.56s; }
#映-s7   { stroke-dasharray: 56.6531; stroke-dashoffset: 56.6531; animation: drawStroke 0.31s ease-out 2.69s forwards; }
#映-bg8  { animation-delay: 3.02s; }
#映-s8   { stroke-dasharray: 88.5508; stroke-dashoffset: 88.5508; animation: drawStroke 0.49s ease-out 3.15s forwards; }
#映-bg9  { animation-delay: 3.66s; }
#映-s9   { stroke-dasharray: 44.8346; stroke-dashoffset: 44.8346; animation: drawStroke 0.25s ease-out 3.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #映-s[i]) -->
<path id="映-s1"  class="stroke" stroke="#bf0909" d="M12.77,28.5C13.58,29.31,14.04,30.65,14.04,32.12C14.04,33.33,13.879999999999999,61.589999999999996,13.879999999999999,72C13.879999999999999,73.43,13.87,75.12,13.87,76.29"/>
<path id="映-s2"  class="stroke" stroke="#bf8209" d="M14.22,29.93C16.75,29.5,28.89,27.3,30.22,27C32.37,26.5,33.5,28,33.48,29.87C33.459999999999994,31.64,33.5,59.08,33.419999999999995,70.5C33.39999999999999,73.34,33.38999999999999,75.18,33.38999999999999,75.4"/>
<path id="映-s3"  class="stroke" stroke="#82bf09" d="M14.99,51.09C18.38,50.620000000000005,29,49.120000000000005,32.28,48.89"/>
<path id="映-s4"  class="stroke" stroke="#09bf09" d="M15.14,73.62C19.75,73,26.75,72.13000000000001,32.260000000000005,71.79"/>
<path id="映-s5"  class="stroke" stroke="#09bf82" d="M45.21,35.97C46.12,36.879999999999995,46.6,37.94,46.83,39.25C47.059999999999995,40.56,48.25,54.62,48.72,58.31"/>
<path id="映-s6"  class="stroke" stroke="#0982bf" d="M47.36,37.52C50.51,37.080000000000005,76.06,33.440000000000005,80.32,32.77C83.61999999999999,32.25,85.49,33.5,84.96,36.64C84.61999999999999,38.63,82.17999999999999,52.08,81.80999999999999,54.5"/>
<path id="映-s7"  class="stroke" stroke="#0909bf" d="M39.02,59.2C42.25,59.870000000000005,45.050000000000004,59.64,48,59.290000000000006C57.63,58.120000000000005,71.38,56.50000000000001,85.75999999999999,55.25000000000001C88.92999999999999,54.970000000000006,92.38,54.75000000000001,95.36999999999999,55.440000000000005"/>
<path id="映-s8"  class="stroke" stroke="#8209bf" d="M63.59,14C64.54,14.95,64.69,16.25,64.73,17.69C66.12,64.88,59.75,77.75,37.67,92.75"/>
<path id="映-s9"  class="stroke" stroke="#bf0982" d="M63.85,57.69C70.5,68.62,77.96,77.4,85.18,84.82C88.30000000000001,88.02,90.63000000000001,90,92.91000000000001,91.52"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="映-bg1"  class="badge-group"><circle cx="12.77" cy="25.0" r="3.5" fill="#bf0909"/><text class="num-single" x="12.77" y="25.0" dx="0" dy="-0.5">1</text></g>
<g id="映-bg2"  class="badge-group"><circle cx="14.22" cy="33.43" r="3.5" fill="#bf8209"/><text class="num-single" x="14.22" y="33.43" dx="0" dy="-0.5">2</text></g>
<g id="映-bg3"  class="badge-group"><circle cx="14.99" cy="51.09" r="3.5" fill="#82bf09"/><text class="num-single" x="14.99" y="51.09" dx="0" dy="-0.5">3</text></g>
<g id="映-bg4"  class="badge-group"><circle cx="15.14" cy="73.62" r="3.5" fill="#09bf09"/><text class="num-single" x="15.14" y="73.62" dx="0" dy="-0.5">4</text></g>
<g id="映-bg5"  class="badge-group"><circle cx="45.21" cy="32.47" r="3.5" fill="#09bf82"/><text class="num-single" x="45.21" y="32.47" dx="0" dy="-0.5">5</text></g>
<g id="映-bg6"  class="badge-group"><circle cx="47.36" cy="41.02" r="3.5" fill="#0982bf"/><text class="num-single" x="47.36" y="41.02" dx="0" dy="-0.5">6</text></g>
<g id="映-bg7"  class="badge-group"><circle cx="39.02" cy="59.2" r="3.5" fill="#0909bf"/><text class="num-single" x="39.02" y="59.2" dx="0" dy="-0.5">7</text></g>
<g id="映-bg8"  class="badge-group"><circle cx="63.59" cy="14" r="3.5" fill="#8209bf"/><text class="num-single" x="63.59" y="14" dx="0" dy="-0.5">8</text></g>
<g id="映-bg9"  class="badge-group"><circle cx="63.85" cy="57.69" r="3.5" fill="#bf0982"/><text class="num-single" x="63.85" y="57.69" dx="0" dy="-0.5">9</text></g>
