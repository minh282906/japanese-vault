<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (五)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #五-bg[i]: Thời gian quả bóng số nảy lên
   - #五-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#五-bg1  { animation-delay: 0.05s; }
#五-s1   { stroke-dasharray: 50.2265; stroke-dashoffset: 50.2265; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#五-bg2  { animation-delay: 0.48s; }
#五-s2   { stroke-dasharray: 67.3695; stroke-dashoffset: 67.3695; animation: drawStroke 0.37s ease-out 0.61s forwards; }
#五-bg3  { animation-delay: 1.00s; }
#五-s3   { stroke-dasharray: 88.4164; stroke-dashoffset: 88.4164; animation: drawStroke 0.49s ease-out 1.13s forwards; }
#五-bg4  { animation-delay: 1.64s; }
#五-s4   { stroke-dasharray: 87.8340; stroke-dashoffset: 87.8340; animation: drawStroke 0.48s ease-out 1.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #五-s[i]) -->
<path id="五-s1"  class="stroke" stroke="#bf0909" d="M31.75,23.15C34.55,23.82,37.29,23.57,40.11,23.27C49.41,22.28,62.29,20.87,74.25,20.06C76.74,19.889999999999997,79.29,19.73,81.75,20.259999999999998"/>
<path id="五-s2"  class="stroke" stroke="#64bf09" d="M55.75,25.25C56.37,26.5,56.77,28.259999999999998,56.25,30.25C53.13,42.13,42.25,74.37,36.5,89.25"/>
<path id="五-s3"  class="stroke" stroke="#09bfbf" d="M25.5,55.25C27.57,56.49,30.23,56.28,32.5,56.06C47.99,54.61,62.39,53.03,74.75,52C77.75,51.75,79,53.75,78.25,55.75C76.01,61.71,72.25,76.5,70.5,87.25"/>
<path id="五-s4"  class="stroke" stroke="#6409bf" d="M11.25,90.5C14.29,91.31,17.77,91.13,20.880000000000003,90.91C36.59,89.81,64.78,88.11,88.63,87.11C92.03999999999999,86.97,95.53,86.71,98.88,87.5"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="五-bg1"  class="badge-group"><circle cx="31.75" cy="23.15" r="3.5" fill="#bf0909"/><text class="num-single" x="31.75" y="23.15" dx="0" dy="-0.5">1</text></g>
<g id="五-bg2"  class="badge-group"><circle cx="55.75" cy="25.25" r="3.5" fill="#64bf09"/><text class="num-single" x="55.75" y="25.25" dx="0" dy="-0.5">2</text></g>
<g id="五-bg3"  class="badge-group"><circle cx="25.5" cy="55.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="25.5" y="55.25" dx="0" dy="-0.5">3</text></g>
<g id="五-bg4"  class="badge-group"><circle cx="11.25" cy="90.5" r="3.5" fill="#6409bf"/><text class="num-single" x="11.25" y="90.5" dx="0" dy="-0.5">4</text></g>
</svg>