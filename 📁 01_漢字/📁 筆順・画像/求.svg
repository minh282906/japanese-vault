<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (求)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #求-bg[i]: Thời gian quả bóng số nảy lên
   - #求-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#求-bg1  { animation-delay: 0.05s; }
#求-s1   { stroke-dasharray: 64.7969; stroke-dashoffset: 64.7969; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#求-bg2  { animation-delay: 0.56s; }
#求-s2   { stroke-dasharray: 95.7313; stroke-dashoffset: 95.7313; animation: drawStroke 0.53s ease-out 0.69s forwards; }
#求-bg3  { animation-delay: 1.24s; }
#求-s3   { stroke-dasharray: 14.2541; stroke-dashoffset: 14.2541; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#求-bg4  { animation-delay: 1.61s; }
#求-s4   { stroke-dasharray: 35.8039; stroke-dashoffset: 35.8039; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#求-bg5  { animation-delay: 1.98s; }
#求-s5   { stroke-dasharray: 22.7895; stroke-dashoffset: 22.7895; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#求-bg6  { animation-delay: 2.35s; }
#求-s6   { stroke-dasharray: 40.9240; stroke-dashoffset: 40.9240; animation: drawStroke 0.23s ease-out 2.48s forwards; }
#求-bg7  { animation-delay: 2.73s; }
#求-s7   { stroke-dasharray: 14.9948; stroke-dashoffset: 14.9948; animation: drawStroke 0.22s ease-out 2.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #求-s[i]) -->
<path id="求-s1"  class="stroke" stroke="#bf0909" d="M19.75,35.4C22.5,35.87,25.83,35.73,28.52,35.42C41,34,62.3,31.74,74.38,30.83C77.61999999999999,30.58,81.03999999999999,30.18,84.25,30.88"/>
<path id="求-s2"  class="stroke" stroke="#bfa509" d="M52.27,11.33C53.53,12.59,54.03,14,54.03,16.1C54.03,31.87,54.02,84.12,54.02,93.22C54.02,101.75,48.25,95.75,45.31,93.47"/>
<path id="求-s3"  class="stroke" stroke="#3dbf09" d="M26.27,49.08C30.259999999999998,50.559999999999995,36.57,55.16,37.56,57.46"/>
<path id="求-s4"  class="stroke" stroke="#09bf71" d="M18.45,83.33C19.63,83.88,21.38,83.75,22.75,82.63C24.45,81.24,37.25,69.25,45.5,61.25"/>
<path id="求-s5"  class="stroke" stroke="#0971bf" d="M81,42.25C81,43.13,80.78,44.33,80.22,45.06C76.85,49.42,70.63,54.190000000000005,64.75,57.25"/>
<path id="求-s6"  class="stroke" stroke="#3d09bf" d="M60.25,62.5C63.75,63.5,77.64,78.03,84.7,82.64C86.76,83.98,90,86.12,92.75,87"/>
<path id="求-s7"  class="stroke" stroke="#bf09a5" d="M69.5,11.5C73.58,13.129999999999999,80.03999999999999,18.19,81.06,20.72"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="求-bg1"  class="badge-group"><circle cx="19.75" cy="35.4" r="3.5" fill="#bf0909"/><text class="num-single" x="19.75" y="35.4" dx="0" dy="-0.5">1</text></g>
<g id="求-bg2"  class="badge-group"><circle cx="52.27" cy="11.33" r="3.5" fill="#bfa509"/><text class="num-single" x="52.27" y="11.33" dx="0" dy="-0.5">2</text></g>
<g id="求-bg3"  class="badge-group"><circle cx="26.27" cy="49.08" r="3.5" fill="#3dbf09"/><text class="num-single" x="26.27" y="49.08" dx="0" dy="-0.5">3</text></g>
<g id="求-bg4"  class="badge-group"><circle cx="18.45" cy="83.33" r="3.5" fill="#09bf71"/><text class="num-single" x="18.45" y="83.33" dx="0" dy="-0.5">4</text></g>
<g id="求-bg5"  class="badge-group"><circle cx="81" cy="42.25" r="3.5" fill="#0971bf"/><text class="num-single" x="81" y="42.25" dx="0" dy="-0.5">5</text></g>
<g id="求-bg6"  class="badge-group"><circle cx="60.25" cy="62.5" r="3.5" fill="#3d09bf"/><text class="num-single" x="60.25" y="62.5" dx="0" dy="-0.5">6</text></g>
<g id="求-bg7"  class="badge-group"><circle cx="69.5" cy="11.5" r="3.5" fill="#bf09a5"/><text class="num-single" x="69.5" y="11.5" dx="0" dy="-0.5">7</text></g>
</svg>