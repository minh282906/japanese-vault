<path id="零-s11"  class="stroke" stroke="#7909bf" d="M47.77,61.4C51.31,62.559999999999995,56.93000000000001,66.16,57.81,67.97"/>
<path id="零-s12"  class="stroke" stroke="#bf09b1" d="M34.08,76.52C36.519999999999996,77.86,39.55,77.21,42.14,76.86C49.120000000000005,75.92999999999999,64.43,73.79,69.88,73.06C73.47,72.58,75.42999999999999,73.08,72.05,76.18C67.2,80.63000000000001,60.9,86.68,56.15,91.01"/>
<path id="零-s13"  class="stroke" stroke="#bf095d" d="M46.32,87.14C50.13,88.56,59.980000000000004,94.03,61.78,97.75"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="零-bg1"  class="badge-group"><circle cx="33.21" cy="16.07" r="3.5" fill="#bf0909"/><text class="num-single" x="33.21" y="16.07" dx="0" dy="-0.5">1</text></g>
