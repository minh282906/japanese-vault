<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (零)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #零-bg[i]: Thời gian quả bóng số nảy lên
   - #零-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#零-bg1  { animation-delay: 0.05s; }
#零-s1   { stroke-dasharray: 40.6869; stroke-dashoffset: 40.6869; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#零-bg2  { animation-delay: 0.42s; }
#零-s2   { stroke-dasharray: 15.8357; stroke-dashoffset: 15.8357; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#零-bg3  { animation-delay: 0.79s; }
#零-s3   { stroke-dasharray: 80.0006; stroke-dashoffset: 80.0006; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#零-bg4  { animation-delay: 1.38s; }
#零-s4   { stroke-dasharray: 25.5278; stroke-dashoffset: 25.5278; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#零-bg5  { animation-delay: 1.75s; }
#零-s5   { stroke-dasharray: 9.2275; stroke-dashoffset: 9.2275; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#零-bg6  { animation-delay: 2.12s; }
#零-s6   { stroke-dasharray: 12.2896; stroke-dashoffset: 12.2896; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#零-bg7  { animation-delay: 2.49s; }
#零-s7   { stroke-dasharray: 10.2084; stroke-dashoffset: 10.2084; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#零-bg8  { animation-delay: 2.86s; }
#零-s8   { stroke-dasharray: 10.7715; stroke-dashoffset: 10.7715; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#零-bg9  { animation-delay: 3.23s; }
#零-s9   { stroke-dasharray: 48.7887; stroke-dashoffset: 48.7887; animation: drawStroke 0.27s ease-out 3.36s forwards; }
#零-bg10  { animation-delay: 3.65s; }
#零-s10   { stroke-dasharray: 45.2113; stroke-dashoffset: 45.2113; animation: drawStroke 0.25s ease-out 3.78s forwards; }
#零-bg11  { animation-delay: 4.05s; }
#零-s11   { stroke-dasharray: 12.1533; stroke-dashoffset: 12.1533; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#零-bg12  { animation-delay: 4.42s; }
#零-s12   { stroke-dasharray: 65.3319; stroke-dashoffset: 65.3319; animation: drawStroke 0.36s ease-out 4.55s forwards; }
#零-bg13  { animation-delay: 4.93s; }
#零-s13   { stroke-dasharray: 18.9906; stroke-dashoffset: 18.9906; animation: drawStroke 0.22s ease-out 5.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

