<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (浅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #浅-bg[i]: Thời gian quả bóng số nảy lên
   - #浅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#浅-bg1  { animation-delay: 0.05s; }
#浅-s1   { stroke-dasharray: 14.7004; stroke-dashoffset: 14.7004; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#浅-bg2  { animation-delay: 0.42s; }
#浅-s2   { stroke-dasharray: 14.7098; stroke-dashoffset: 14.7098; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#浅-bg3  { animation-delay: 0.79s; }
#浅-s3   { stroke-dasharray: 25.2826; stroke-dashoffset: 25.2826; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#浅-bg4  { animation-delay: 1.16s; }
#浅-s4   { stroke-dasharray: 44.2885; stroke-dashoffset: 44.2885; animation: drawStroke 0.24s ease-out 1.29s forwards; }
#浅-bg5  { animation-delay: 1.55s; }
#浅-s5   { stroke-dasharray: 39.3757; stroke-dashoffset: 39.3757; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#浅-bg6  { animation-delay: 1.92s; }
#浅-s6   { stroke-dasharray: 57.6696; stroke-dashoffset: 57.6696; animation: drawStroke 0.32s ease-out 2.05s forwards; }
#浅-bg7  { animation-delay: 2.39s; }
#浅-s7   { stroke-dasharray: 109.9510; stroke-dashoffset: 109.9510; animation: drawStroke 0.55s ease-out 2.52s forwards; }
#浅-bg8  { animation-delay: 3.09s; }
#浅-s8   { stroke-dasharray: 58.5253; stroke-dashoffset: 58.5253; animation: drawStroke 0.32s ease-out 3.22s forwards; }
#浅-bg9  { animation-delay: 3.56s; }
#浅-s9   { stroke-dasharray: 12.9421; stroke-dashoffset: 12.9421; animation: drawStroke 0.22s ease-out 3.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #浅-s[i]) -->
<path id="浅-s1"  class="stroke" stroke="#bf0909" d="M19.26,17.25C23.32,18.81,29.740000000000002,23.66,30.75,26.09"/>
<path id="浅-s2"  class="stroke" stroke="#bf8209" d="M13.62,44C17.9,45.41,24.67,49.8,25.74,52"/>
<path id="浅-s3"  class="stroke" stroke="#82bf09" d="M15.88,91.62C17.41,91.68,18.39,90.67,19.080000000000002,89.44C22.150000000000002,83.95,25.220000000000002,77.24,28,70.24"/>
<path id="浅-s4"  class="stroke" stroke="#09bf09" d="M39.45,31.88C40.82,32.29,43.36,32.269999999999996,44.7,32.04C51.84,30.8,67.87,27.38,78.12,26.5C80.29,26.31,81.87,26.38,83.22,26.61"/>
<path id="浅-s5"  class="stroke" stroke="#09bf82" d="M42.99,45.42C44.35,45.9,46.88,45.910000000000004,48.21,45.61C56.74,43.74,67.5,41.37,75.72,40.05C78.31,39.64,80.46,39.629999999999995,81.72,39.949999999999996"/>
<path id="浅-s6"  class="stroke" stroke="#0982bf" d="M37.55,60.38C39.68,61,43.629999999999995,60.88,45.709999999999994,60.480000000000004C55.49999999999999,58.63,75.91999999999999,54.39,88.84,53C91.33,52.73,93.3,52.88,94.5,53"/>
<path id="浅-s7"  class="stroke" stroke="#0909bf" d="M50.88,11C52.5,12.25,53.550000000000004,14.620000000000001,53.84,17.490000000000002C57.25,52,66.12,77.19,89.31,93.61C96.48,98.69,95.98,94.42,94.99000000000001,86.03"/>
<path id="浅-s8"  class="stroke" stroke="#8209bf" d="M84.75,60.25C84.87,61.09,84.64,62.22,84.01,63.35C79,72.25,65,87.12,40.78,96.23"/>
<path id="浅-s9"  class="stroke" stroke="#bf0982" d="M68.55,11.08C72.02,12.52,77.56,15.8,79.17,18.259999999999998"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="浅-bg1"  class="badge-group"><circle cx="19.26" cy="17.25" r="3.5" fill="#bf0909"/><text class="num-single" x="19.26" y="17.25" dx="0" dy="-0.5">1</text></g>
<g id="浅-bg2"  class="badge-group"><circle cx="13.62" cy="44" r="3.5" fill="#bf8209"/><text class="num-single" x="13.62" y="44" dx="0" dy="-0.5">2</text></g>
<g id="浅-bg3"  class="badge-group"><circle cx="15.88" cy="91.62" r="3.5" fill="#82bf09"/><text class="num-single" x="15.88" y="91.62" dx="0" dy="-0.5">3</text></g>
<g id="浅-bg4"  class="badge-group"><circle cx="39.45" cy="31.88" r="3.5" fill="#09bf09"/><text class="num-single" x="39.45" y="31.88" dx="0" dy="-0.5">4</text></g>
<g id="浅-bg5"  class="badge-group"><circle cx="42.99" cy="45.42" r="3.5" fill="#09bf82"/><text class="num-single" x="42.99" y="45.42" dx="0" dy="-0.5">5</text></g>
<g id="浅-bg6"  class="badge-group"><circle cx="37.55" cy="60.38" r="3.5" fill="#0982bf"/><text class="num-single" x="37.55" y="60.38" dx="0" dy="-0.5">6</text></g>
<g id="浅-bg7"  class="badge-group"><circle cx="50.88" cy="11" r="3.5" fill="#0909bf"/><text class="num-single" x="50.88" y="11" dx="0" dy="-0.5">7</text></g>
<g id="浅-bg8"  class="badge-group"><circle cx="84.75" cy="60.25" r="3.5" fill="#8209bf"/><text class="num-single" x="84.75" y="60.25" dx="0" dy="-0.5">8</text></g>
<g id="浅-bg9"  class="badge-group"><circle cx="68.55" cy="11.08" r="3.5" fill="#bf0982"/><text class="num-single" x="68.55" y="11.08" dx="0" dy="-0.5">9</text></g>
</svg>