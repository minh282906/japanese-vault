<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (花)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #花-bg[i]: Thời gian quả bóng số nảy lên
   - #花-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#花-bg1  { animation-delay: 0.05s; }
#花-s1   { stroke-dasharray: 73.5532; stroke-dashoffset: 73.5532; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#花-bg2  { animation-delay: 0.60s; }
#花-s2   { stroke-dasharray: 25.1992; stroke-dashoffset: 25.1992; animation: drawStroke 0.22s ease-out 0.73s forwards; }
#花-bg3  { animation-delay: 0.97s; }
#花-s3   { stroke-dasharray: 26.3893; stroke-dashoffset: 26.3893; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#花-bg4  { animation-delay: 1.34s; }
#花-s4   { stroke-dasharray: 32.8553; stroke-dashoffset: 32.8553; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#花-bg5  { animation-delay: 1.71s; }
#花-s5   { stroke-dasharray: 32.7612; stroke-dashoffset: 32.7612; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#花-bg6  { animation-delay: 2.08s; }
#花-s6   { stroke-dasharray: 25.8147; stroke-dashoffset: 25.8147; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#花-bg7  { animation-delay: 2.45s; }
#花-s7   { stroke-dasharray: 88.9615; stroke-dashoffset: 88.9615; animation: drawStroke 0.49s ease-out 2.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #花-s[i]) -->
<path id="花-s1"  class="stroke" stroke="#bf0909" d="M17,29.77C20,30.5,23.35,30.31,26.369999999999997,30.06C42.589999999999996,28.709999999999997,62.68,25.419999999999998,83.13,25.27C85.53,25.25,87.89999999999999,25.31,90.25,25.78"/>
<path id="花-s2"  class="stroke" stroke="#bfa509" d="M32.25,16C33.5,16.5,34.5,17.62,34.75,18.75C36.08,24.72,39.61,38.67,39.75,39.5"/>
<path id="花-s3"  class="stroke" stroke="#3dbf09" d="M71.25,12.5C71.67,13.68,71.72,15.55,71.25,17C69.06,23.77,65.11,36.120000000000005,64.5,37.75"/>
<path id="花-s4"  class="stroke" stroke="#09bf71" d="M38.25,48.25C38.5,50,37.88,51.56,37.27,52.69C33.25,60,24.8,69.67,19.5,74.5"/>
<path id="花-s5"  class="stroke" stroke="#0971bf" d="M30.75,65.5C31.5,66.5,31.87,67.47,31.87,68.5C31.87,75.14,31.790000000000003,84.97,31.76,92.5C31.75,94.46,31.75,96.32,31.75,98"/>
<path id="花-s6"  class="stroke" stroke="#3d09bf" d="M84.25,50.25C84.13,51.87,83.41,53.12,82.25,54C77.63,57.5,71.25,60.75,63.25,63.75"/>
<path id="花-s7"  class="stroke" stroke="#bf09a5" d="M58.25,43.75C59.31,44.81,59.75,46.25,59.75,48.5C59.75,51.46,59.53,69.09,59.53,79.75C59.53,93,63,94.15,77,94.15C93.25,94.15,95,91.5,95,83"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="花-bg1"  class="badge-group"><circle cx="17" cy="29.77" r="3.5" fill="#bf0909"/><text class="num-single" x="17" y="29.77" dx="0" dy="-0.5">1</text></g>
<g id="花-bg2"  class="badge-group"><circle cx="32.25" cy="16" r="3.5" fill="#bfa509"/><text class="num-single" x="32.25" y="16" dx="0" dy="-0.5">2</text></g>
<g id="花-bg3"  class="badge-group"><circle cx="71.25" cy="12.5" r="3.5" fill="#3dbf09"/><text class="num-single" x="71.25" y="12.5" dx="0" dy="-0.5">3</text></g>
<g id="花-bg4"  class="badge-group"><circle cx="38.25" cy="48.25" r="3.5" fill="#09bf71"/><text class="num-single" x="38.25" y="48.25" dx="0" dy="-0.5">4</text></g>
<g id="花-bg5"  class="badge-group"><circle cx="30.75" cy="65.5" r="3.5" fill="#0971bf"/><text class="num-single" x="30.75" y="65.5" dx="0" dy="-0.5">5</text></g>
<g id="花-bg6"  class="badge-group"><circle cx="84.25" cy="50.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="84.25" y="50.25" dx="0" dy="-0.5">6</text></g>
<g id="花-bg7"  class="badge-group"><circle cx="58.25" cy="43.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="58.25" y="43.75" dx="0" dy="-0.5">7</text></g>
</svg>