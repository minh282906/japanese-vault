<g id="純-bg9"  class="badge-group"><circle cx="88.17" cy="39.27" r="3.5" fill="#9a09bf"/><text class="num-single" x="88.17" y="39.27" dx="0" dy="-0.5">9</text></g>
<g id="純-bg10" class="badge-group"><circle cx="67.12" cy="14.87" r="3.5" fill="#bf0976"/><text class="num-double" x="67.12" y="14.87" dx="-0.4" dy="-0.475">10</text></g>
</svg>