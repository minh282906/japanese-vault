<path id="暮-s10"  class="stroke" stroke="#0923bf" d="M59.75,55.6C63.04,55.620000000000005,77.56,70.47,86.66,77.23C89.36999999999999,79.24000000000001,91.86999999999999,80.87,94.5,81.89"/>
<path id="暮-s11"  class="stroke" stroke="#3d09bf" d="M38,73.71C38.83,74.53999999999999,39.28,75.47999999999999,39.4,76.74C40,83.25,40.629999999999995,87.63,41.4,95.02C41.58,96.72999999999999,41.62,97.92,41.79,98.89999999999999"/>
<path id="暮-s12"  class="stroke" stroke="#8b09bf" d="M40.14,75.05C44.64,74.48,60.97,72.45,67.48,71.75C70.48,71.42,72.53,72.71,72.08,76.25C71.5,80.85,71.1,86.67,69.71,93.3C69.44999999999999,94.55,69.16,95.82,68.83999999999999,97.08"/>
