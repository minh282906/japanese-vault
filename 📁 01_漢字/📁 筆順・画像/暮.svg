<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (暮)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #暮-bg[i]: Thời gian quả bóng số nảy lên
   - #暮-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#暮-bg1  { animation-delay: 0.05s; }
#暮-s1   { stroke-dasharray: 64.7248; stroke-dashoffset: 64.7248; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#暮-bg2  { animation-delay: 0.56s; }
#暮-s2   { stroke-dasharray: 16.6349; stroke-dashoffset: 16.6349; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#暮-bg3  { animation-delay: 0.93s; }
#暮-s3   { stroke-dasharray: 16.8968; stroke-dashoffset: 16.8968; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#暮-bg4  { animation-delay: 1.30s; }
#暮-s4   { stroke-dasharray: 18.8282; stroke-dashoffset: 18.8282; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#暮-bg5  { animation-delay: 1.67s; }
#暮-s5   { stroke-dasharray: 56.4892; stroke-dashoffset: 56.4892; animation: drawStroke 0.31s ease-out 1.80s forwards; }
#暮-bg6  { animation-delay: 2.13s; }
#暮-s6   { stroke-dasharray: 35.5630; stroke-dashoffset: 35.5630; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#暮-bg7  { animation-delay: 2.50s; }
#暮-s7   { stroke-dasharray: 32.0016; stroke-dashoffset: 32.0016; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#暮-bg8  { animation-delay: 2.87s; }
#暮-s8   { stroke-dasharray: 74.6217; stroke-dashoffset: 74.6217; animation: drawStroke 0.41s ease-out 3.00s forwards; }
#暮-bg9  { animation-delay: 3.43s; }
#暮-s9   { stroke-dasharray: 46.2288; stroke-dashoffset: 46.2288; animation: drawStroke 0.25s ease-out 3.56s forwards; }
#暮-bg10  { animation-delay: 3.83s; }
#暮-s10   { stroke-dasharray: 43.8094; stroke-dashoffset: 43.8094; animation: drawStroke 0.24s ease-out 3.96s forwards; }
#暮-bg11  { animation-delay: 4.22s; }
#暮-s11   { stroke-dasharray: 25.7018; stroke-dashoffset: 25.7018; animation: drawStroke 0.22s ease-out 4.35s forwards; }
#暮-bg12  { animation-delay: 4.59s; }
#暮-s12   { stroke-dasharray: 56.4246; stroke-dashoffset: 56.4246; animation: drawStroke 0.31s ease-out 4.72s forwards; }
#暮-bg13  { animation-delay: 5.05s; }
#暮-s13   { stroke-dasharray: 28.9244; stroke-dashoffset: 28.9244; animation: drawStroke 0.22s ease-out 5.18s forwards; }
#暮-bg14  { animation-delay: 5.42s; }
#暮-s14   { stroke-dasharray: 25.9537; stroke-dashoffset: 25.9537; animation: drawStroke 0.22s ease-out 5.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

