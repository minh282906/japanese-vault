<path id="煙-s8"  class="stroke" stroke="#0995bf" d="M59.12,25.16C60.11,26.15,60.57,27.25,60.589999999999996,28.59C60.74999999999999,38.379999999999995,60.87,43.5,61.16,52.769999999999996"/>
<path id="煙-s9"  class="stroke" stroke="#0941bf" d="M74.37,23.47C75,24.38,75.41000000000001,25.75,75.38000000000001,27.25C75.24000000000001,34.26,74.87,44.260000000000005,74.57000000000001,51.65"/>
<path id="煙-s10"  class="stroke" stroke="#2509bf" d="M49.63,55.26C56.75,54.5,77.13,52.25,88.05000000000001,51.68"/>
<path id="煙-s11"  class="stroke" stroke="#7909bf" d="M51.75,71.1C53.31,71.71,55.73,71.6,57.38,71.42999999999999C64.16,70.71,75.48,69.17999999999999,82.63,68.75999999999999C84.21,68.66999999999999,85.69999999999999,68.63,87.25,68.99"/>
<path id="煙-s12"  class="stroke" stroke="#bf09b1" d="M67.55,58.62C68.53,59.599999999999994,68.82,61.25,68.82,62.76C68.82,67.50999999999999,68.71,78.25999999999999,68.71,86.31"/>
<path id="煙-s13"  class="stroke" stroke="#bf095d" d="M43.25,88.2C45.38,88.96000000000001,48.4,88.82000000000001,50.64,88.64C63.33,87.63,77,86.51,90.25,86.24C92.8,86.19,95.25,86.21,97.75,86.74"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
