<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (煙)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #煙-bg[i]: Thời gian quả bóng số nảy lên
   - #煙-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#煙-bg1  { animation-delay: 0.05s; }
#煙-s1   { stroke-dasharray: 17.3366; stroke-dashoffset: 17.3366; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#煙-bg2  { animation-delay: 0.42s; }
#煙-s2   { stroke-dasharray: 18.0310; stroke-dashoffset: 18.0310; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#煙-bg3  { animation-delay: 0.79s; }
#煙-s3   { stroke-dasharray: 81.5842; stroke-dashoffset: 81.5842; animation: drawStroke 0.45s ease-out 0.92s forwards; }
#煙-bg4  { animation-delay: 1.39s; }
#煙-s4   { stroke-dasharray: 18.2762; stroke-dashoffset: 18.2762; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#煙-bg5  { animation-delay: 1.76s; }
#煙-s5   { stroke-dasharray: 46.2409; stroke-dashoffset: 46.2409; animation: drawStroke 0.25s ease-out 1.89s forwards; }
#煙-bg6  { animation-delay: 2.16s; }
#煙-s6   { stroke-dasharray: 20.0775; stroke-dashoffset: 20.0775; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#煙-bg7  { animation-delay: 2.53s; }
#煙-s7   { stroke-dasharray: 63.4228; stroke-dashoffset: 63.4228; animation: drawStroke 0.35s ease-out 2.66s forwards; }
#煙-bg8  { animation-delay: 3.03s; }
#煙-s8   { stroke-dasharray: 28.0219; stroke-dashoffset: 28.0219; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#煙-bg9  { animation-delay: 3.40s; }
#煙-s9   { stroke-dasharray: 28.3871; stroke-dashoffset: 28.3871; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#煙-bg10  { animation-delay: 3.77s; }
#煙-s10   { stroke-dasharray: 38.5902; stroke-dashoffset: 38.5902; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#煙-bg11  { animation-delay: 4.14s; }
#煙-s11   { stroke-dasharray: 35.7217; stroke-dashoffset: 35.7217; animation: drawStroke 0.22s ease-out 4.27s forwards; }
#煙-bg12  { animation-delay: 4.51s; }
#煙-s12   { stroke-dasharray: 27.9884; stroke-dashoffset: 27.9884; animation: drawStroke 0.22s ease-out 4.64s forwards; }
#煙-bg13  { animation-delay: 4.88s; }
#煙-s13   { stroke-dasharray: 54.6762; stroke-dashoffset: 54.6762; animation: drawStroke 0.30s ease-out 5.01s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

