<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (筆)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #筆-bg[i]: Thời gian quả bóng số nảy lên
   - #筆-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#筆-bg1  { animation-delay: 0.05s; }
#筆-s1   { stroke-dasharray: 26.4262; stroke-dashoffset: 26.4262; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#筆-bg2  { animation-delay: 0.42s; }
#筆-s2   { stroke-dasharray: 22.5549; stroke-dashoffset: 22.5549; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#筆-bg3  { animation-delay: 0.79s; }
#筆-s3   { stroke-dasharray: 9.3790; stroke-dashoffset: 9.3790; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#筆-bg4  { animation-delay: 1.16s; }
#筆-s4   { stroke-dasharray: 16.1278; stroke-dashoffset: 16.1278; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#筆-bg5  { animation-delay: 1.53s; }
#筆-s5   { stroke-dasharray: 22.9175; stroke-dashoffset: 22.9175; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#筆-bg6  { animation-delay: 1.90s; }
#筆-s6   { stroke-dasharray: 10.5725; stroke-dashoffset: 10.5725; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#筆-bg7  { animation-delay: 2.27s; }
#筆-s7   { stroke-dasharray: 66.5035; stroke-dashoffset: 66.5035; animation: drawStroke 0.37s ease-out 2.40s forwards; }
#筆-bg8  { animation-delay: 2.79s; }
#筆-s8   { stroke-dasharray: 80.7963; stroke-dashoffset: 80.7963; animation: drawStroke 0.44s ease-out 2.92s forwards; }
#筆-bg9  { animation-delay: 3.38s; }
#筆-s9   { stroke-dasharray: 42.9452; stroke-dashoffset: 42.9452; animation: drawStroke 0.24s ease-out 3.51s forwards; }
#筆-bg10  { animation-delay: 3.77s; }
#筆-s10   { stroke-dasharray: 47.8643; stroke-dashoffset: 47.8643; animation: drawStroke 0.26s ease-out 3.90s forwards; }
#筆-bg11  { animation-delay: 4.18s; }
#筆-s11   { stroke-dasharray: 68.7645; stroke-dashoffset: 68.7645; animation: drawStroke 0.38s ease-out 4.31s forwards; }
#筆-bg12  { animation-delay: 4.71s; }
#筆-s12   { stroke-dasharray: 71.8864; stroke-dashoffset: 71.8864; animation: drawStroke 0.40s ease-out 4.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

