<path id="筆-s8"  class="stroke" stroke="#0964bf" d="M16.25,52.07C19.43,52.32,21.94,52.44,25.45,52.07C43.25,50.19,67.84,47.45,87.91,46.82C91.81,46.7,94.99,47.32,96.75,47.57"/>
<path id="筆-s9"  class="stroke" stroke="#0909bf" d="M33.75,61.57C35.16,61.82,37.7,61.99,39.37,61.82C51.75,60.57,61.25,59.2,71.15,58.57C73.4,58.43,74.81,58.57,76.49000000000001,58.82"/>
<path id="筆-s10"  class="stroke" stroke="#6409bf" d="M31.25,72.73C32.68,73.11,35.31,73.23,36.74,73.11C49.49,72.06,62.870000000000005,70.56,73.86,69.48C76.23,69.25,77.67999999999999,69.66000000000001,78.87,69.85000000000001"/>
<path id="筆-s11"  class="stroke" stroke="#bf09bf" d="M20.63,85.29C23.15,85.83000000000001,26.89,86.08000000000001,29.4,85.83000000000001C48.379999999999995,83.94000000000001,63,82.44000000000001,80.32,81.35000000000001C84.5,81.09,87.02999999999999,81.36000000000001,89.13,81.63000000000001"/>
<path id="筆-s12"  class="stroke" stroke="#bf0964" d="M53.12,30.07C54.37,31.32,54.58,32.82,54.58,33.82C54.58,34.72,54.22,78.91,54.129999999999995,96.07C54.12,98.52999999999999,54.10999999999999,100.42999999999999,54.10999999999999,101.57"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="筆-bg1"  class="badge-group"><circle cx="30.75" cy="11.07" r="3.5" fill="#bf0909"/><text class="num-single" x="30.75" y="11.07" dx="0" dy="-0.5">1</text></g>
