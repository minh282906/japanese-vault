<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (借)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #借-bg[i]: Thời gian quả bóng số nảy lên
   - #借-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#借-bg1  { animation-delay: 0.05s; }
#借-s1   { stroke-dasharray: 50.6468; stroke-dashoffset: 50.6468; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#借-bg2  { animation-delay: 0.48s; }
#借-s2   { stroke-dasharray: 51.3836; stroke-dashoffset: 51.3836; animation: drawStroke 0.28s ease-out 0.61s forwards; }
#借-bg3  { animation-delay: 0.91s; }
#借-s3   { stroke-dasharray: 44.2119; stroke-dashoffset: 44.2119; animation: drawStroke 0.24s ease-out 1.04s forwards; }
#借-bg4  { animation-delay: 1.30s; }
#借-s4   { stroke-dasharray: 30.4573; stroke-dashoffset: 30.4573; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#借-bg5  { animation-delay: 1.67s; }
#借-s5   { stroke-dasharray: 34.4815; stroke-dashoffset: 34.4815; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#借-bg6  { animation-delay: 2.04s; }
#借-s6   { stroke-dasharray: 58.6203; stroke-dashoffset: 58.6203; animation: drawStroke 0.32s ease-out 2.17s forwards; }
#借-bg7  { animation-delay: 2.51s; }
#借-s7   { stroke-dasharray: 34.4066; stroke-dashoffset: 34.4066; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#借-bg8  { animation-delay: 2.88s; }
#借-s8   { stroke-dasharray: 61.9818; stroke-dashoffset: 61.9818; animation: drawStroke 0.34s ease-out 3.01s forwards; }
#借-bg9  { animation-delay: 3.37s; }
#借-s9   { stroke-dasharray: 26.8404; stroke-dashoffset: 26.8404; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#借-bg10  { animation-delay: 3.74s; }
#借-s10   { stroke-dasharray: 26.6864; stroke-dashoffset: 26.6864; animation: drawStroke 0.22s ease-out 3.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #借-s[i]) -->
<path id="借-s1"  class="stroke" stroke="#bf0909" d="M32.88,18C33.11,20.28,32.82,21.73,32.09,23.69C27.46,36.16,22.5,48,11,63.04"/>
<path id="借-s2"  class="stroke" stroke="#bf7609" d="M25.03,44.5C25.89,45.36,26.53,46.83,26.52,48.25C26.48,58.769999999999996,26.32,78.4,26.259999999999998,89.5C26.249999999999996,91.98,26.24,94.04,26.24,95.5"/>
<path id="借-s3"  class="stroke" stroke="#9abf09" d="M44.65,34.14C46.87,34.5,49.32,34.33,51.379999999999995,34.09C59.16,33.190000000000005,75.44,31.250000000000004,82.86999999999999,30.770000000000003C84.71999999999998,30.650000000000002,86.82,30.51,88.63,31.020000000000003"/>
<path id="借-s4"  class="stroke" stroke="#2dbf09" d="M54.33,20.25C55.29,21.21,55.75,22.63,56.019999999999996,24.25C56.19,25.25,56.87,39.25,57.529999999999994,50.25"/>
<path id="借-s5"  class="stroke" stroke="#09bf52" d="M76.88,14.25C77.69,15.06,78.19,16.490000000000002,78.07,17.5C77.74,20.25,76.11999999999999,35.379999999999995,74.83,48.25"/>
<path id="借-s6"  class="stroke" stroke="#09bfbf" d="M37.25,52.7C40.25,53.25,42.97,53.02,45.730000000000004,52.720000000000006C58.900000000000006,51.260000000000005,71.57000000000001,49.650000000000006,87.38,48.690000000000005C90.21,48.52,92.86999999999999,48.38,95.61999999999999,48.800000000000004"/>
<path id="借-s7"  class="stroke" stroke="#0952bf" d="M51.43,61.83C52.18,62.58,52.64,63.72,52.64,64.78C52.64,65.6,52.63,83.64,52.63,91.88C52.63,94.24,52.63,95.8,52.63,95.92"/>
<path id="借-s8"  class="stroke" stroke="#2d09bf" d="M53.29,63.16C55.15,63.05,70.7,60.8,76.75,60.01C80.17,59.57,81.57,60.26,81.45,63.75C81.29,68.23,81.45,79.97,81.43,89.5C81.43,91.32,81.42,93.05,81.43,94.64"/>
<path id="借-s9"  class="stroke" stroke="#9a09bf" d="M53.68,77.24C60.88,76.61999999999999,73,75.25,80.39,74.6"/>
<path id="借-s10"  class="stroke" stroke="#bf0976" d="M53.79,92.78C59.839999999999996,92.21000000000001,72.83,90.89,80.37,90.41"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="借-bg1"  class="badge-group"><circle cx="32.88" cy="18" r="3.5" fill="#bf0909"/><text class="num-single" x="32.88" y="18" dx="0" dy="-0.5">1</text></g>
<g id="借-bg2"  class="badge-group"><circle cx="25.03" cy="44.5" r="3.5" fill="#bf7609"/><text class="num-single" x="25.03" y="44.5" dx="0" dy="-0.5">2</text></g>
<g id="借-bg3"  class="badge-group"><circle cx="44.65" cy="34.14" r="3.5" fill="#9abf09"/><text class="num-single" x="44.65" y="34.14" dx="0" dy="-0.5">3</text></g>
<g id="借-bg4"  class="badge-group"><circle cx="54.33" cy="20.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="54.33" y="20.25" dx="0" dy="-0.5">4</text></g>
<g id="借-bg5"  class="badge-group"><circle cx="76.88" cy="14.25" r="3.5" fill="#09bf52"/><text class="num-single" x="76.88" y="14.25" dx="0" dy="-0.5">5</text></g>
<g id="借-bg6"  class="badge-group"><circle cx="37.25" cy="52.7" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.25" y="52.7" dx="0" dy="-0.5">6</text></g>
<g id="借-bg7"  class="badge-group"><circle cx="51.43" cy="58.33" r="3.5" fill="#0952bf"/><text class="num-single" x="51.43" y="58.33" dx="0" dy="-0.5">7</text></g>
<g id="借-bg8"  class="badge-group"><circle cx="53.29" cy="66.66" r="3.5" fill="#2d09bf"/><text class="num-single" x="53.29" y="66.66" dx="0" dy="-0.5">8</text></g>
<g id="借-bg9"  class="badge-group"><circle cx="53.68" cy="77.24" r="3.5" fill="#9a09bf"/><text class="num-single" x="53.68" y="77.24" dx="0" dy="-0.5">9</text></g>
<g id="借-bg10" class="badge-group"><circle cx="53.79" cy="92.78" r="3.5" fill="#bf0976"/><text class="num-double" x="53.79" y="92.78" dx="-0.4" dy="-0.475">10</text></g>
</svg>