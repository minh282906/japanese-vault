<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (塔)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #塔-bg[i]: Thời gian quả bóng số nảy lên
   - #塔-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#塔-bg1  { animation-delay: 0.05s; }
#塔-s1   { stroke-dasharray: 26.6237; stroke-dashoffset: 26.6237; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#塔-bg2  { animation-delay: 0.42s; }
#塔-s2   { stroke-dasharray: 51.0391; stroke-dashoffset: 51.0391; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#塔-bg3  { animation-delay: 0.85s; }
#塔-s3   { stroke-dasharray: 31.2162; stroke-dashoffset: 31.2162; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#塔-bg4  { animation-delay: 1.22s; }
#塔-s4   { stroke-dasharray: 52.4573; stroke-dashoffset: 52.4573; animation: drawStroke 0.29s ease-out 1.35s forwards; }
#塔-bg5  { animation-delay: 1.66s; }
#塔-s5   { stroke-dasharray: 18.8756; stroke-dashoffset: 18.8756; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#塔-bg6  { animation-delay: 2.03s; }
#塔-s6   { stroke-dasharray: 20.9659; stroke-dashoffset: 20.9659; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#塔-bg7  { animation-delay: 2.40s; }
#塔-s7   { stroke-dasharray: 45.9617; stroke-dashoffset: 45.9617; animation: drawStroke 0.25s ease-out 2.53s forwards; }
#塔-bg8  { animation-delay: 2.80s; }
#塔-s8   { stroke-dasharray: 39.8397; stroke-dashoffset: 39.8397; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#塔-bg9  { animation-delay: 3.17s; }
#塔-s9   { stroke-dasharray: 24.2096; stroke-dashoffset: 24.2096; animation: drawStroke 0.22s ease-out 3.30s forwards; }
#塔-bg10  { animation-delay: 3.54s; }
#塔-s10   { stroke-dasharray: 22.7709; stroke-dashoffset: 22.7709; animation: drawStroke 0.22s ease-out 3.67s forwards; }
#塔-bg11  { animation-delay: 3.91s; }
#塔-s11   { stroke-dasharray: 49.6354; stroke-dashoffset: 49.6354; animation: drawStroke 0.27s ease-out 4.04s forwards; }
#塔-bg12  { animation-delay: 4.33s; }
#塔-s12   { stroke-dasharray: 25.5025; stroke-dashoffset: 25.5025; animation: drawStroke 0.22s ease-out 4.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

