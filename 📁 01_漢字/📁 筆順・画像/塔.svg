<path id="塔-s9"  class="stroke" stroke="#0909bf" d="M52.2,61.73C53.52,62.13999999999999,55.410000000000004,61.88999999999999,56.760000000000005,61.73C61.95,61.15,66,60.199999999999996,72.13000000000001,59.559999999999995C73.35000000000001,59.42999999999999,74.99000000000001,59.44,76.21000000000001,59.669999999999995"/>
<path id="塔-s10"  class="stroke" stroke="#6409bf" d="M49.49,73.8C50.160000000000004,74.47,50.620000000000005,75.38,50.93,76.58C52.72,83.7,53.19,86.52,54.09,91.23C54.35,92.59,54.6,94.06,54.84,95.78"/>
<path id="塔-s11"  class="stroke" stroke="#bf09bf" d="M51.57,75.29C62,73.88000000000001,74.38,72.14,80.02,71.44000000000001C82.08,71.18,83.32,72.96000000000001,83.02,74.46000000000001C81.8,80.68,80.75,84.88,79.43,90"/>
<path id="塔-s12"  class="stroke" stroke="#bf0964" d="M55.71,93.3C62.1,92.78999999999999,68.6,92.02,76.51,91.36C78.02000000000001,91.23,79.56,91.12,81.11,91.03"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="塔-bg1"  class="badge-group"><circle cx="11.25" cy="42.85" r="3.5" fill="#bf0909"/><text class="num-single" x="11.25" y="42.85" dx="0" dy="-0.5">1</text></g>
