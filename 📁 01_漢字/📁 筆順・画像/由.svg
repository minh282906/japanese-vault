<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (由)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #由-bg[i]: Thời gian quả bóng số nảy lên
   - #由-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#由-bg1  { animation-delay: 0.05s; }
#由-s1   { stroke-dasharray: 50.0388; stroke-dashoffset: 50.0388; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#由-bg2  { animation-delay: 0.48s; }
#由-s2   { stroke-dasharray: 114.3340; stroke-dashoffset: 114.3340; animation: drawStroke 0.55s ease-out 0.61s forwards; }
#由-bg3  { animation-delay: 1.18s; }
#由-s3   { stroke-dasharray: 77.3325; stroke-dashoffset: 77.3325; animation: drawStroke 0.43s ease-out 1.31s forwards; }
#由-bg4  { animation-delay: 1.76s; }
#由-s4   { stroke-dasharray: 60.4860; stroke-dashoffset: 60.4860; animation: drawStroke 0.33s ease-out 1.89s forwards; }
#由-bg5  { animation-delay: 2.24s; }
#由-s5   { stroke-dasharray: 54.1772; stroke-dashoffset: 54.1772; animation: drawStroke 0.30s ease-out 2.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #由-s[i]) -->
<path id="由-s1"  class="stroke" stroke="#bf0909" d="M20,45.96C21.21,47.17,22,49.24,22.21,50.76C23.57,60.879999999999995,24.630000000000003,75.67,25.67,89.63C25.810000000000002,91.53,25.950000000000003,93.41,26.090000000000003,95.25999999999999"/>
<path id="由-s2"  class="stroke" stroke="#9abf09" d="M23.02,48.58C43.5,45.87,68.97,43.62,81.67999999999999,42.739999999999995C86.35,42.41,88.66,45.03999999999999,88.47,47.47C87.78,56.3,85.63,72.25,82.99,85.53999999999999C82.44999999999999,88.25999999999999,81.77,90.71,81.17,92.8"/>
<path id="由-s3"  class="stroke" stroke="#09bf52" d="M51.74,13.32C53.21,14.790000000000001,54.25,16.5,54.25,19C54.25,34.3,54.48,85.95,54.48,89.94"/>
<path id="由-s4"  class="stroke" stroke="#0952bf" d="M25.3,68.36C44.870000000000005,66.5,67.87,64.88,85.64,64.28"/>
<path id="由-s5"  class="stroke" stroke="#9a09bf" d="M26.98,91.89C41,91.25,62.379999999999995,89.37,81.07000000000001,88.87"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="由-bg1"  class="badge-group"><circle cx="20" cy="42.46" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="42.46" dx="0" dy="-0.5">1</text></g>
<g id="由-bg2"  class="badge-group"><circle cx="23.02" cy="52.08" r="3.5" fill="#9abf09"/><text class="num-single" x="23.02" y="52.08" dx="0" dy="-0.5">2</text></g>
<g id="由-bg3"  class="badge-group"><circle cx="51.74" cy="13.32" r="3.5" fill="#09bf52"/><text class="num-single" x="51.74" y="13.32" dx="0" dy="-0.5">3</text></g>
<g id="由-bg4"  class="badge-group"><circle cx="25.3" cy="68.36" r="3.5" fill="#0952bf"/><text class="num-single" x="25.3" y="68.36" dx="0" dy="-0.5">4</text></g>
<g id="由-bg5"  class="badge-group"><circle cx="26.98" cy="91.89" r="3.5" fill="#9a09bf"/><text class="num-single" x="26.98" y="91.89" dx="0" dy="-0.5">5</text></g>
</svg>