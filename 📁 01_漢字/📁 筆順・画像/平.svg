<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (平)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #平-bg[i]: Thời gian quả bóng số nảy lên
   - #平-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#平-bg1  { animation-delay: 0.05s; }
#平-s1   { stroke-dasharray: 51.5366; stroke-dashoffset: 51.5366; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#平-bg2  { animation-delay: 0.48s; }
#平-s2   { stroke-dasharray: 21.3123; stroke-dashoffset: 21.3123; animation: drawStroke 0.22s ease-out 0.61s forwards; }
#平-bg3  { animation-delay: 0.85s; }
#平-s3   { stroke-dasharray: 26.0056; stroke-dashoffset: 26.0056; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#平-bg4  { animation-delay: 1.22s; }
#平-s4   { stroke-dasharray: 82.0389; stroke-dashoffset: 82.0389; animation: drawStroke 0.45s ease-out 1.35s forwards; }
#平-bg5  { animation-delay: 1.82s; }
#平-s5   { stroke-dasharray: 80.6930; stroke-dashoffset: 80.6930; animation: drawStroke 0.44s ease-out 1.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #平-s[i]) -->
<path id="平-s1"  class="stroke" stroke="#bf0909" d="M29.13,18.37C31.38,18.880000000000003,35.339999999999996,18.45,37.739999999999995,18.18C45.63999999999999,17.28,61.099999999999994,15.559999999999999,71.22999999999999,14.57C74.27,14.27,77.38,14.02,80.38,14.84"/>
<path id="平-s2"  class="stroke" stroke="#9abf09" d="M26.75,30.38C31.44,34.21,36.63,42.26,37.81,48.22"/>
<path id="平-s3"  class="stroke" stroke="#09bf52" d="M80.77,24.64C80.85,25.72,80.86,26.76,80.45,27.77C78.5,32.5,73.5,40.5,67.56,46.47"/>
<path id="平-s4"  class="stroke" stroke="#0952bf" d="M14.88,61.03C18.380000000000003,61.88,22.12,61.92,25.62,61.51C41.760000000000005,59.629999999999995,70.52,57.39,86.88,56.73C90.16,56.599999999999994,93.39,56.44,96.63,57.029999999999994"/>
<path id="平-s5"  class="stroke" stroke="#9a09bf" d="M53.31,18.88C54.47,20.04,55.1,22,55.1,23.71C55.1,27.96,54.97,73.15,54.93,91.87C54.92,95.35000000000001,54.92,97.91000000000001,54.92,99.13000000000001"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="平-bg1"  class="badge-group"><circle cx="29.13" cy="18.37" r="3.5" fill="#bf0909"/><text class="num-single" x="29.13" y="18.37" dx="0" dy="-0.5">1</text></g>
<g id="平-bg2"  class="badge-group"><circle cx="26.75" cy="30.38" r="3.5" fill="#9abf09"/><text class="num-single" x="26.75" y="30.38" dx="0" dy="-0.5">2</text></g>
<g id="平-bg3"  class="badge-group"><circle cx="80.77" cy="24.64" r="3.5" fill="#09bf52"/><text class="num-single" x="80.77" y="24.64" dx="0" dy="-0.5">3</text></g>
<g id="平-bg4"  class="badge-group"><circle cx="14.88" cy="61.03" r="3.5" fill="#0952bf"/><text class="num-single" x="14.88" y="61.03" dx="0" dy="-0.5">4</text></g>
<g id="平-bg5"  class="badge-group"><circle cx="53.31" cy="18.88" r="3.5" fill="#9a09bf"/><text class="num-single" x="53.31" y="18.88" dx="0" dy="-0.5">5</text></g>
</svg>