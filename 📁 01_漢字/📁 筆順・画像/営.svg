<path id="営-s7"  class="stroke" stroke="#09bfbf" d="M36.02,48.98C45.260000000000005,47.68,60.34,45.9,66.87,45.31999999999999C69.97,45.03999999999999,72.24000000000001,45.93999999999999,71.06,49.519999999999996C70.02,52.669999999999995,68.52,55.42999999999999,66.62,60.22"/>
<path id="営-s8"  class="stroke" stroke="#0964bf" d="M39.67,63.52C44.43,63.18,57.09,61.63,64.98,60.980000000000004C66.24000000000001,60.88,67.37,60.790000000000006,68.34,60.74"/>
<path id="営-s9"  class="stroke" stroke="#0909bf" d="M51.57,65.78C51.87,66.88,51.79,67.53,51.34,68.49C50.89,69.44999999999999,47.050000000000004,74.22,46.24,75.5"/>
<path id="営-s10"  class="stroke" stroke="#6409bf" d="M29.59,76.71C30.07,77.08999999999999,30.81,78.16,31.02,78.63C32.45,81.81,33.55,88.72999999999999,34.55,94.77C34.699999999999996,95.7,34.86,96.61999999999999,35,97.49"/>
<path id="営-s11"  class="stroke" stroke="#bf09bf" d="M32.57,78.31C44.620000000000005,76.73,66.02000000000001,74.78,73.5,74.35000000000001C76.11,74.2,78.17,76.08000000000001,76.96,78.95C75,83.63,74.47999999999999,85.27000000000001,72.08,92.68"/>
<path id="営-s12"  class="stroke" stroke="#bf0964" d="M35.98,95.48C42.099999999999994,95.21000000000001,59.589999999999996,94.37,70.25,93.98C71.99,93.92,73.53,93.87,74.79,93.83"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="営-bg1"  class="badge-group"><circle cx="26.12" cy="17.25" r="3.5" fill="#bf0909"/><text class="num-single" x="26.12" y="17.25" dx="0" dy="-0.5">1</text></g>
