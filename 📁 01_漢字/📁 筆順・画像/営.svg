<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (営)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #営-bg[i]: Thời gian quả bóng số nảy lên
   - #営-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#営-bg1  { animation-delay: 0.05s; }
#営-s1   { stroke-dasharray: 14.6508; stroke-dashoffset: 14.6508; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#営-bg2  { animation-delay: 0.42s; }
#営-s2   { stroke-dasharray: 14.8480; stroke-dashoffset: 14.8480; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#営-bg3  { animation-delay: 0.79s; }
#営-s3   { stroke-dasharray: 17.0500; stroke-dashoffset: 17.0500; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#営-bg4  { animation-delay: 1.16s; }
#営-s4   { stroke-dasharray: 16.9714; stroke-dashoffset: 16.9714; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#営-bg5  { animation-delay: 1.53s; }
#営-s5   { stroke-dasharray: 77.8324; stroke-dashoffset: 77.8324; animation: drawStroke 0.43s ease-out 1.66s forwards; }
#営-bg6  { animation-delay: 2.11s; }
#営-s6   { stroke-dasharray: 18.4307; stroke-dashoffset: 18.4307; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#営-bg7  { animation-delay: 2.48s; }
#営-s7   { stroke-dasharray: 50.3259; stroke-dashoffset: 50.3259; animation: drawStroke 0.28s ease-out 2.61s forwards; }
#営-bg8  { animation-delay: 2.91s; }
#営-s8   { stroke-dasharray: 28.8065; stroke-dashoffset: 28.8065; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#営-bg9  { animation-delay: 3.28s; }
#営-s9   { stroke-dasharray: 11.4667; stroke-dashoffset: 11.4667; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#営-bg10  { animation-delay: 3.65s; }
#営-s10   { stroke-dasharray: 21.7174; stroke-dashoffset: 21.7174; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#営-bg11  { animation-delay: 4.02s; }
#営-s11   { stroke-dasharray: 62.8333; stroke-dashoffset: 62.8333; animation: drawStroke 0.35s ease-out 4.15s forwards; }
#営-bg12  { animation-delay: 4.52s; }
#営-s12   { stroke-dasharray: 38.8453; stroke-dashoffset: 38.8453; animation: drawStroke 0.22s ease-out 4.65s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

