<g id="寒-bg9"  class="badge-group"><circle cx="41.96" cy="60.5" r="3.5" fill="#0909bf"/><text class="num-single" x="41.96" y="60.5" dx="0" dy="-0.5">9</text></g>
<g id="寒-bg10" class="badge-group"><circle cx="61" cy="58.25" r="3.5" fill="#6409bf"/><text class="num-double" x="61" y="58.25" dx="-0.4" dy="-0.475">10</text></g>
<g id="寒-bg11" class="badge-group"><circle cx="50.5" cy="70.25" r="3.5" fill="#bf09bf"/><text class="num-double" x="50.5" y="70.25" dx="-0.4" dy="-0.475">11</text></g>
