<path id="焼-s6"  class="stroke" stroke="#09bf64" d="M67.86,12.63C68.61,13.39,69.14,14.620000000000001,69.14,15.870000000000001C69.14,16.560000000000002,69.19,25.25,69.21,31.87C69.21,33.45,69.22,34.910000000000004,69.22,36.120000000000005"/>
<path id="焼-s7"  class="stroke" stroke="#09bfbf" d="M43.65,48.13C46.25,48.620000000000005,48.23,48.52,50.379999999999995,48.29C60.36,47.22,77.5,45.629999999999995,89.5,44.67C91.94,44.480000000000004,94.39,44.35,96.77,45.04"/>
<path id="焼-s8"  class="stroke" stroke="#0964bf" d="M55.56,37.57C56.49,38.5,56.97,39.88,57.02,40.75C57.5,48.5,57.77,56.75,57.77,62.22"/>
<path id="焼-s9"  class="stroke" stroke="#0909bf" d="M83.43,35.2C84,36,84.35000000000001,37.720000000000006,83.99000000000001,39.440000000000005C82,49,80.62,55,79.36,60.82"/>
<path id="焼-s10"  class="stroke" stroke="#6409bf" d="M43.98,63.2C46.48,63.760000000000005,48.97,63.550000000000004,51.5,63.32C61.33,62.43,77.55,61.09,88,60.52C90.45,60.39,92.83,60.150000000000006,95.21,60.84"/>
<path id="焼-s11"  class="stroke" stroke="#bf09bf" d="M60.67,66.12C60.730000000000004,66.78,60.59,67.84,60.29,68.79C58.25,75.25,50.879999999999995,86.37,37.41,94.29"/>
<path id="焼-s12"  class="stroke" stroke="#bf0964" d="M73.07,64.26C73.91,65.10000000000001,74.44,66.46000000000001,74.44,67.83C74.44,75.75,74.36,80.2,74.36,84.38C74.36,91.5,75.88,93.03,85.55,93.03C96.25999999999999,93.03,97.25,91.24,97.25,85.43"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="焼-bg1"  class="badge-group"><circle cx="12.62" cy="36.75" r="3.5" fill="#bf0909"/><text class="num-single" x="12.62" y="36.75" dx="0" dy="-0.5">1</text></g>
<g id="焼-bg2"  class="badge-group"><circle cx="40.49" cy="30.75" r="3.5" fill="#bf6409"/><text class="num-single" x="40.49" y="30.75" dx="0" dy="-0.5">2</text></g>
