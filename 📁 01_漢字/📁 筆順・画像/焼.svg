<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (焼)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #焼-bg[i]: Thời gian quả bóng số nảy lên
   - #焼-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#焼-bg1  { animation-delay: 0.05s; }
#焼-s1   { stroke-dasharray: 12.9061; stroke-dashoffset: 12.9061; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#焼-bg2  { animation-delay: 0.42s; }
#焼-s2   { stroke-dasharray: 15.9211; stroke-dashoffset: 15.9211; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#焼-bg3  { animation-delay: 0.79s; }
#焼-s3   { stroke-dasharray: 77.3260; stroke-dashoffset: 77.3260; animation: drawStroke 0.43s ease-out 0.92s forwards; }
#焼-bg4  { animation-delay: 1.37s; }
#焼-s4   { stroke-dasharray: 19.8409; stroke-dashoffset: 19.8409; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#焼-bg5  { animation-delay: 1.74s; }
#焼-s5   { stroke-dasharray: 38.5189; stroke-dashoffset: 38.5189; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#焼-bg6  { animation-delay: 2.11s; }
#焼-s6   { stroke-dasharray: 23.8177; stroke-dashoffset: 23.8177; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#焼-bg7  { animation-delay: 2.48s; }
#焼-s7   { stroke-dasharray: 53.3689; stroke-dashoffset: 53.3689; animation: drawStroke 0.29s ease-out 2.61s forwards; }
#焼-bg8  { animation-delay: 2.92s; }
#焼-s8   { stroke-dasharray: 25.0525; stroke-dashoffset: 25.0525; animation: drawStroke 0.22s ease-out 3.05s forwards; }
#焼-bg9  { animation-delay: 3.29s; }
#焼-s9   { stroke-dasharray: 26.2534; stroke-dashoffset: 26.2534; animation: drawStroke 0.22s ease-out 3.42s forwards; }
#焼-bg10  { animation-delay: 3.66s; }
#焼-s10   { stroke-dasharray: 51.4182; stroke-dashoffset: 51.4182; animation: drawStroke 0.28s ease-out 3.79s forwards; }
#焼-bg11  { animation-delay: 4.09s; }
#焼-s11   { stroke-dasharray: 37.6342; stroke-dashoffset: 37.6342; animation: drawStroke 0.22s ease-out 4.22s forwards; }
#焼-bg12  { animation-delay: 4.46s; }
#焼-s12   { stroke-dasharray: 54.1445; stroke-dashoffset: 54.1445; animation: drawStroke 0.30s ease-out 4.59s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #焼-s[i]) -->
<path id="焼-s1"  class="stroke" stroke="#bf0909" d="M12.62,36.75C14.319999999999999,39.23,16.78,46.269999999999996,17.24,48.75"/>
<path id="焼-s2"  class="stroke" stroke="#bf6409" d="M40.49,30.75C40.870000000000005,31.75,40.75,33.09,40.11,33.97C38.25,36.5,36.13,39.5,32.25,43.75"/>
