<g id="焼-bg7"  class="badge-group"><circle cx="43.65" cy="48.13" r="3.5" fill="#09bfbf"/><text class="num-single" x="43.65" y="48.13" dx="0" dy="-0.5">7</text></g>
<g id="焼-bg8"  class="badge-group"><circle cx="55.56" cy="37.57" r="3.5" fill="#0964bf"/><text class="num-single" x="55.56" y="37.57" dx="0" dy="-0.5">8</text></g>
<g id="焼-bg9"  class="badge-group"><circle cx="83.43" cy="35.2" r="3.5" fill="#0909bf"/><text class="num-single" x="83.43" y="35.2" dx="0" dy="-0.5">9</text></g>
<g id="焼-bg10" class="badge-group"><circle cx="43.98" cy="63.2" r="3.5" fill="#6409bf"/><text class="num-double" x="43.98" y="63.2" dx="-0.4" dy="-0.475">10</text></g>
<g id="焼-bg11" class="badge-group"><circle cx="60.67" cy="66.12" r="3.5" fill="#bf09bf"/><text class="num-double" x="60.67" y="66.12" dx="-0.4" dy="-0.475">11</text></g>
<g id="焼-bg12" class="badge-group"><circle cx="73.07" cy="64.26" r="3.5" fill="#bf0964"/><text class="num-double" x="73.07" y="64.26" dx="-0.4" dy="-0.475">12</text></g>
</svg>