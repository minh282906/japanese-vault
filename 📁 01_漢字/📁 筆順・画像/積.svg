<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (積)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #積-bg[i]: Thời gian quả bóng số nảy lên
   - #積-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#積-bg1  { animation-delay: 0.05s; }
#積-s1   { stroke-dasharray: 26.7396; stroke-dashoffset: 26.7396; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#積-bg2  { animation-delay: 0.42s; }
#積-s2   { stroke-dasharray: 33.0167; stroke-dashoffset: 33.0167; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#積-bg3  { animation-delay: 0.79s; }
#積-s3   { stroke-dasharray: 71.2271; stroke-dashoffset: 71.2271; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#積-bg4  { animation-delay: 1.33s; }
#積-s4   { stroke-dasharray: 37.9622; stroke-dashoffset: 37.9622; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#積-bg5  { animation-delay: 1.70s; }
#積-s5   { stroke-dasharray: 13.9810; stroke-dashoffset: 13.9810; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#積-bg6  { animation-delay: 2.07s; }
#積-s6   { stroke-dasharray: 32.8074; stroke-dashoffset: 32.8074; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#積-bg7  { animation-delay: 2.44s; }
#積-s7   { stroke-dasharray: 28.6086; stroke-dashoffset: 28.6086; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#積-bg8  { animation-delay: 2.81s; }
#積-s8   { stroke-dasharray: 32.2557; stroke-dashoffset: 32.2557; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#積-bg9  { animation-delay: 3.18s; }
#積-s9   { stroke-dasharray: 49.1776; stroke-dashoffset: 49.1776; animation: drawStroke 0.27s ease-out 3.31s forwards; }
#積-bg10  { animation-delay: 3.60s; }
#積-s10   { stroke-dasharray: 34.3097; stroke-dashoffset: 34.3097; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#積-bg11  { animation-delay: 3.97s; }
#積-s11   { stroke-dasharray: 62.0573; stroke-dashoffset: 62.0573; animation: drawStroke 0.34s ease-out 4.10s forwards; }
#積-bg12  { animation-delay: 4.46s; }
#積-s12   { stroke-dasharray: 27.4439; stroke-dashoffset: 27.4439; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#積-bg13  { animation-delay: 4.83s; }
#積-s13   { stroke-dasharray: 27.8442; stroke-dashoffset: 27.8442; animation: drawStroke 0.22s ease-out 4.96s forwards; }
#積-bg14  { animation-delay: 5.20s; }
#積-s14   { stroke-dasharray: 26.8473; stroke-dashoffset: 26.8473; animation: drawStroke 0.22s ease-out 5.33s forwards; }
#積-bg15  { animation-delay: 5.57s; }
#積-s15   { stroke-dasharray: 18.8847; stroke-dashoffset: 18.8847; animation: drawStroke 0.22s ease-out 5.70s forwards; }
#積-bg16  { animation-delay: 5.94s; }
#積-s16   { stroke-dasharray: 16.8383; stroke-dashoffset: 16.8383; animation: drawStroke 0.22s ease-out 6.07s forwards; }
]]>
</style>

