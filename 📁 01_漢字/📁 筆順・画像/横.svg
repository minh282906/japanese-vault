<path id="横-s10"  class="stroke" stroke="#0952bf" d="M51.01,53.23C61.04,52.239999999999995,80.27,50.11,86.09,49.989999999999995C88.85000000000001,49.92999999999999,90.38000000000001,51.129999999999995,90.10000000000001,53.55C89.64000000000001,57.589999999999996,88.55000000000001,64.78999999999999,87.39000000000001,71.91C87.16000000000001,73.28999999999999,86.92000000000002,74.66,86.64000000000001,75.99"/>
