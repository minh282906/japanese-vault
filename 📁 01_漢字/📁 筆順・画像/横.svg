<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (横)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #横-bg[i]: Thời gian quả bóng số nảy lên
   - #横-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#横-bg1  { animation-delay: 0.05s; }
#横-s1   { stroke-dasharray: 31.2526; stroke-dashoffset: 31.2526; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#横-bg2  { animation-delay: 0.42s; }
#横-s2   { stroke-dasharray: 83.7609; stroke-dashoffset: 83.7609; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#横-bg3  { animation-delay: 1.03s; }
#横-s3   { stroke-dasharray: 38.8278; stroke-dashoffset: 38.8278; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#横-bg4  { animation-delay: 1.40s; }
#横-s4   { stroke-dasharray: 13.0598; stroke-dashoffset: 13.0598; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#横-bg5  { animation-delay: 1.77s; }
#横-s5   { stroke-dasharray: 44.3939; stroke-dashoffset: 44.3939; animation: drawStroke 0.24s ease-out 1.90s forwards; }
#横-bg6  { animation-delay: 2.16s; }
#横-s6   { stroke-dasharray: 27.4634; stroke-dashoffset: 27.4634; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#横-bg7  { animation-delay: 2.53s; }
#横-s7   { stroke-dasharray: 28.0585; stroke-dashoffset: 28.0585; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#横-bg8  { animation-delay: 2.90s; }
#横-s8   { stroke-dasharray: 55.1292; stroke-dashoffset: 55.1292; animation: drawStroke 0.30s ease-out 3.03s forwards; }
#横-bg9  { animation-delay: 3.35s; }
#横-s9   { stroke-dasharray: 27.8932; stroke-dashoffset: 27.8932; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#横-bg10  { animation-delay: 3.72s; }
#横-s10   { stroke-dasharray: 64.2405; stroke-dashoffset: 64.2405; animation: drawStroke 0.35s ease-out 3.85s forwards; }
#横-bg11  { animation-delay: 4.22s; }
#横-s11   { stroke-dasharray: 31.8226; stroke-dashoffset: 31.8226; animation: drawStroke 0.22s ease-out 4.35s forwards; }
#横-bg12  { animation-delay: 4.59s; }
#横-s12   { stroke-dasharray: 34.1671; stroke-dashoffset: 34.1671; animation: drawStroke 0.22s ease-out 4.72s forwards; }
#横-bg13  { animation-delay: 4.96s; }
#横-s13   { stroke-dasharray: 30.9461; stroke-dashoffset: 30.9461; animation: drawStroke 0.22s ease-out 5.09s forwards; }
#横-bg14  { animation-delay: 5.33s; }
#横-s14   { stroke-dasharray: 23.1147; stroke-dashoffset: 23.1147; animation: drawStroke 0.22s ease-out 5.46s forwards; }
#横-bg15  { animation-delay: 5.70s; }
#横-s15   { stroke-dasharray: 21.3417; stroke-dashoffset: 21.3417; animation: drawStroke 0.22s ease-out 5.83s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
