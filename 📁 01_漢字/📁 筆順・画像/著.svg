<g id="著-bg6"  class="badge-group"><circle cx="15.25" cy="55.43" r="3.5" fill="#09bf8d"/><text class="num-single" x="15.25" y="55.43" dx="0" dy="-0.5">6</text></g>
<g id="著-bg7"  class="badge-group"><circle cx="78.6" cy="28.48" r="3.5" fill="#098dbf"/><text class="num-single" x="78.6" y="28.48" dx="0" dy="-0.5">7</text></g>
<g id="著-bg8"  class="badge-group"><circle cx="41.75" cy="61.16" r="3.5" fill="#092abf"/><text class="num-single" x="41.75" y="61.16" dx="0" dy="-0.5">8</text></g>
<g id="著-bg9"  class="badge-group"><circle cx="43.63" cy="69.3" r="3.5" fill="#4b09bf"/><text class="num-single" x="43.63" y="69.3" dx="0" dy="-0.5">9</text></g>
<g id="著-bg10" class="badge-group"><circle cx="44.08" cy="80.43" r="3.5" fill="#ae09bf"/><text class="num-double" x="44.08" y="80.43" dx="-0.4" dy="-0.475">10</text></g>
<g id="著-bg11" class="badge-group"><circle cx="44.17" cy="96.77" r="3.5" fill="#bf096c"/><text class="num-double" x="44.17" y="96.77" dx="-0.4" dy="-0.475">11</text></g>
</svg>