<path id="著-s4"  class="stroke" stroke="#4bbf09" d="M34.46,40.23C35.910000000000004,40.79,38.34,40.72,39.88,40.54C45.31,39.92,54.47,38.37,61.75,37.519999999999996C63.08,37.36,64.54,37.089999999999996,65.87,37.38999999999999"/>
<path id="著-s5"  class="stroke" stroke="#09bf2a" d="M51,28.87C51.76,29.630000000000003,52.24,30.73,52.24,32.39C52.24,36.12,52.13,46.51,52.13,51.25"/>
<path id="著-s6"  class="stroke" stroke="#09bf8d" d="M15.25,55.43C18.36,56.19,21.72,56.01,24.9,55.61C37.95,53.99,72.97,49.55,86.25999999999999,48.519999999999996C89.27,48.29,92.17999999999999,48.22,95.13999999999999,48.92999999999999"/>
<path id="著-s7"  class="stroke" stroke="#098dbf" d="M78.6,28.48C78.77,29.71,78.58999999999999,31.060000000000002,77.50999999999999,32.67C63.5,53.5,45.25,70.5,14.45,82.26"/>
<path id="著-s8"  class="stroke" stroke="#092abf" d="M41.75,64.66C42.54,65.45,42.89,66.61,42.89,67.67C42.89,70.34,42.89,84.68,42.89,94.37C42.89,96.31,42.89,98.06,42.89,99.5"/>
<path id="著-s9"  class="stroke" stroke="#4b09bf" d="M43.63,65.8C46.14,65.67,72.04,62.83,74.33,62.669999999999995C76.24,62.53999999999999,77.37,63.82999999999999,77.37,65.38C77.37,68.33,77.45,82.88,77.45,92.5C77.45,95.33,77.48,97.25,77.48,97.44"/>
<path id="著-s10"  class="stroke" stroke="#ae09bf" d="M44.08,80.43C51.5,79.88000000000001,71.5,78.63000000000001,76.19999999999999,78.58000000000001"/>
<path id="著-s11"  class="stroke" stroke="#bf096c" d="M44.17,96.77C51.09,96.2,67.56,95.42,76.19,94.94"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="著-bg1"  class="badge-group"><circle cx="22.11" cy="24.07" r="3.5" fill="#bf0909"/><text class="num-single" x="22.11" y="24.07" dx="0" dy="-0.5">1</text></g>
<g id="著-bg2"  class="badge-group"><circle cx="37.29" cy="13.43" r="3.5" fill="#bf6c09"/><text class="num-single" x="37.29" y="13.43" dx="0" dy="-0.5">2</text></g>
