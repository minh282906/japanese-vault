<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (著)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #著-bg[i]: Thời gian quả bóng số nảy lên
   - #著-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#著-bg1  { animation-delay: 0.05s; }
#著-s1   { stroke-dasharray: 63.1599; stroke-dashoffset: 63.1599; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#著-bg2  { animation-delay: 0.55s; }
#著-s2   { stroke-dasharray: 18.6322; stroke-dashoffset: 18.6322; animation: drawStroke 0.22s ease-out 0.68s forwards; }
#著-bg3  { animation-delay: 0.92s; }
#著-s3   { stroke-dasharray: 21.5234; stroke-dashoffset: 21.5234; animation: drawStroke 0.22s ease-out 1.05s forwards; }
#著-bg4  { animation-delay: 1.29s; }
#著-s4   { stroke-dasharray: 31.6943; stroke-dashoffset: 31.6943; animation: drawStroke 0.22s ease-out 1.42s forwards; }
#著-bg5  { animation-delay: 1.66s; }
#著-s5   { stroke-dasharray: 22.6949; stroke-dashoffset: 22.6949; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#著-bg6  { animation-delay: 2.03s; }
#著-s6   { stroke-dasharray: 80.4048; stroke-dashoffset: 80.4048; animation: drawStroke 0.44s ease-out 2.16s forwards; }
#著-bg7  { animation-delay: 2.62s; }
#著-s7   { stroke-dasharray: 86.0604; stroke-dashoffset: 86.0604; animation: drawStroke 0.47s ease-out 2.75s forwards; }
#著-bg8  { animation-delay: 3.24s; }
#著-s8   { stroke-dasharray: 35.1303; stroke-dashoffset: 35.1303; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#著-bg9  { animation-delay: 3.61s; }
#著-s9   { stroke-dasharray: 67.5429; stroke-dashoffset: 67.5429; animation: drawStroke 0.37s ease-out 3.74s forwards; }
#著-bg10  { animation-delay: 4.13s; }
#著-s10   { stroke-dasharray: 32.1751; stroke-dashoffset: 32.1751; animation: drawStroke 0.22s ease-out 4.26s forwards; }
#著-bg11  { animation-delay: 4.50s; }
#著-s11   { stroke-dasharray: 32.0729; stroke-dashoffset: 32.0729; animation: drawStroke 0.22s ease-out 4.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #著-s[i]) -->
<path id="著-s1"  class="stroke" stroke="#bf0909" d="M22.11,24.07C24.75,24.5,27.34,24.490000000000002,29.5,24.22C42.87,22.509999999999998,61.370000000000005,20.13,76.62,18.75C79.37,18.5,82.18,18.41,84.88000000000001,19.07"/>
<path id="著-s2"  class="stroke" stroke="#bf6c09" d="M37.29,13.43C38.11,14.26,38.74,15.24,38.88,15.98C39.75,20.62,41.6,28.740000000000002,42.02,31.25"/>
