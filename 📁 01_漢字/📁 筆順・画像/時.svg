<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (時)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #時-bg[i]: Thời gian quả bóng số nảy lên
   - #時-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#時-bg1  { animation-delay: 0.05s; }
#時-s1   { stroke-dasharray: 48.3389; stroke-dashoffset: 48.3389; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#時-bg2  { animation-delay: 0.47s; }
#時-s2   { stroke-dasharray: 67.2524; stroke-dashoffset: 67.2524; animation: drawStroke 0.37s ease-out 0.60s forwards; }
#時-bg3  { animation-delay: 0.99s; }
#時-s3   { stroke-dasharray: 18.3782; stroke-dashoffset: 18.3782; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#時-bg4  { animation-delay: 1.36s; }
#時-s4   { stroke-dasharray: 19.1336; stroke-dashoffset: 19.1336; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#時-bg5  { animation-delay: 1.73s; }
#時-s5   { stroke-dasharray: 35.8987; stroke-dashoffset: 35.8987; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#時-bg6  { animation-delay: 2.10s; }
#時-s6   { stroke-dasharray: 31.7764; stroke-dashoffset: 31.7764; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#時-bg7  { animation-delay: 2.47s; }
#時-s7   { stroke-dasharray: 50.4044; stroke-dashoffset: 50.4044; animation: drawStroke 0.28s ease-out 2.60s forwards; }
#時-bg8  { animation-delay: 2.90s; }
#時-s8   { stroke-dasharray: 50.4335; stroke-dashoffset: 50.4335; animation: drawStroke 0.28s ease-out 3.03s forwards; }
#時-bg9  { animation-delay: 3.33s; }
#時-s9   { stroke-dasharray: 57.4776; stroke-dashoffset: 57.4776; animation: drawStroke 0.32s ease-out 3.46s forwards; }
#時-bg10  { animation-delay: 3.80s; }
#時-s10   { stroke-dasharray: 11.8512; stroke-dashoffset: 11.8512; animation: drawStroke 0.22s ease-out 3.93s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #時-s[i]) -->
<path id="時-s1"  class="stroke" stroke="#bf0909" d="M16,29.84C16.75,30.5,17.21,31.46,17.21,32.91C17.21,34.089999999999996,17.05,62.989999999999995,17,73.75999999999999C16.99,76.17999999999999,16.98,77.71,16.98,77.83999999999999"/>
<path id="時-s2"  class="stroke" stroke="#bf7609" d="M17.78,30.74C22.43,30.11,33.900000000000006,28.669999999999998,35.38,28.49C36.900000000000006,28.31,38.38,29.99,38.260000000000005,31.06C38.02,33.23,37.900000000000006,55.959999999999994,37.910000000000004,71.85C37.910000000000004,73.47999999999999,37.790000000000006,75.19999999999999,37.790000000000006,76.28"/>
<path id="時-s3"  class="stroke" stroke="#9abf09" d="M18.75,52C23.25,51.25,32.25,49.88,36.97,49.65"/>
<path id="時-s4"  class="stroke" stroke="#2dbf09" d="M17.8,74.52C24,73.6,29.25,72.63,36.74,71.82"/>
<path id="時-s5"  class="stroke" stroke="#09bf52" d="M51.44,29.03C52.809999999999995,29.470000000000002,55.07,29.37,56.44,29.220000000000002C66.22999999999999,28.130000000000003,72.78,26.880000000000003,82.06,26.14C84.33,25.96,85.96000000000001,26.1,87.10000000000001,26.32"/>
<path id="時-s6"  class="stroke" stroke="#09bfbf" d="M67.59,11.37C68.48,12.27,69.18,13.61,69.18,15.12C69.18,23.509999999999998,69.21000000000001,42.14,69.21000000000001,42.72"/>
<path id="時-s7"  class="stroke" stroke="#0952bf" d="M45.38,45.35C46.870000000000005,45.79,49.59,45.940000000000005,51.09,45.79C62.38,44.63,76.75,42.5,90.29,41.8C92.77000000000001,41.669999999999995,94.26,42.01,95.5,42.23"/>
<path id="時-s8"  class="stroke" stroke="#2d09bf" d="M46,60.99C47.43,61.45,50.04,61.57,51.49,61.45C63.5,60.38,78.38,58.38,90.56,57.56C92.94,57.400000000000006,94.97,57.78,96.16,58"/>
<path id="時-s9"  class="stroke" stroke="#9a09bf" d="M78.07,46.08C79.17999999999999,47.19,79.72999999999999,48.64,79.77999999999999,51.14C80.00999999999999,63.17,79.68999999999998,85.57,79.68999999999998,89.66C79.68999999999998,99.49,74.26999999999998,91.85,72.02999999999999,89.61999999999999"/>
<path id="時-s10"  class="stroke" stroke="#bf0976" d="M56.75,70.38C59.62,72.14,63.3,76.75999999999999,64.02,79.5"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="時-bg1"  class="badge-group"><circle cx="16" cy="26.34" r="3.5" fill="#bf0909"/><text class="num-single" x="16" y="26.34" dx="0" dy="-0.5">1</text></g>
<g id="時-bg2"  class="badge-group"><circle cx="17.78" cy="34.24" r="3.5" fill="#bf7609"/><text class="num-single" x="17.78" y="34.24" dx="0" dy="-0.5">2</text></g>
<g id="時-bg3"  class="badge-group"><circle cx="18.75" cy="52" r="3.5" fill="#9abf09"/><text class="num-single" x="18.75" y="52" dx="0" dy="-0.5">3</text></g>
<g id="時-bg4"  class="badge-group"><circle cx="17.8" cy="74.52" r="3.5" fill="#2dbf09"/><text class="num-single" x="17.8" y="74.52" dx="0" dy="-0.5">4</text></g>
<g id="時-bg5"  class="badge-group"><circle cx="51.44" cy="29.03" r="3.5" fill="#09bf52"/><text class="num-single" x="51.44" y="29.03" dx="0" dy="-0.5">5</text></g>
