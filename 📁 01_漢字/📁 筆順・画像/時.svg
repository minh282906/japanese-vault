<g id="時-bg9"  class="badge-group"><circle cx="78.07" cy="46.08" r="3.5" fill="#9a09bf"/><text class="num-single" x="78.07" y="46.08" dx="0" dy="-0.5">9</text></g>
<g id="時-bg10" class="badge-group"><circle cx="56.75" cy="70.38" r="3.5" fill="#bf0976"/><text class="num-double" x="56.75" y="70.38" dx="-0.4" dy="-0.475">10</text></g>
</svg>