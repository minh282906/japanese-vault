<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (貧)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #貧-bg[i]: Thời gian quả bóng số nảy lên
   - #貧-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#貧-bg1  { animation-delay: 0.05s; }
#貧-s1   { stroke-dasharray: 31.3942; stroke-dashoffset: 31.3942; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#貧-bg2  { animation-delay: 0.42s; }
#貧-s2   { stroke-dasharray: 42.1051; stroke-dashoffset: 42.1051; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#貧-bg3  { animation-delay: 0.80s; }
#貧-s3   { stroke-dasharray: 53.7084; stroke-dashoffset: 53.7084; animation: drawStroke 0.30s ease-out 0.93s forwards; }
#貧-bg4  { animation-delay: 1.25s; }
#貧-s4   { stroke-dasharray: 34.0688; stroke-dashoffset: 34.0688; animation: drawStroke 0.22s ease-out 1.38s forwards; }
#貧-bg5  { animation-delay: 1.62s; }
#貧-s5   { stroke-dasharray: 33.8207; stroke-dashoffset: 33.8207; animation: drawStroke 0.22s ease-out 1.75s forwards; }
#貧-bg6  { animation-delay: 1.99s; }
#貧-s6   { stroke-dasharray: 69.1993; stroke-dashoffset: 69.1993; animation: drawStroke 0.38s ease-out 2.12s forwards; }
#貧-bg7  { animation-delay: 2.52s; }
#貧-s7   { stroke-dasharray: 35.1563; stroke-dashoffset: 35.1563; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#貧-bg8  { animation-delay: 2.89s; }
#貧-s8   { stroke-dasharray: 34.4905; stroke-dashoffset: 34.4905; animation: drawStroke 0.22s ease-out 3.02s forwards; }
#貧-bg9  { animation-delay: 3.26s; }
#貧-s9   { stroke-dasharray: 34.7057; stroke-dashoffset: 34.7057; animation: drawStroke 0.22s ease-out 3.39s forwards; }
#貧-bg10  { animation-delay: 3.63s; }
#貧-s10   { stroke-dasharray: 21.8081; stroke-dashoffset: 21.8081; animation: drawStroke 0.22s ease-out 3.76s forwards; }
#貧-bg11  { animation-delay: 4.00s; }
#貧-s11   { stroke-dasharray: 19.7754; stroke-dashoffset: 19.7754; animation: drawStroke 0.22s ease-out 4.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

