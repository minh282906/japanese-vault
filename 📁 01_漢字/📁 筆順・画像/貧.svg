<path id="貧-s6"  class="stroke" stroke="#09bf8d" d="M37.07,52.64C40.43,52.51,67,49.72,70.07,49.74C72,49.75,73.41,51,73.41,53.14C73.41,56.25,73.31,71,73.31,79C73.31,81.48,73.23,83.66,73.23,83.84"/>
<path id="貧-s7"  class="stroke" stroke="#098dbf" d="M37.51,62.86C45.37,62.38,65.5,60.88,72.59,60.55"/>
<path id="貧-s8"  class="stroke" stroke="#092abf" d="M37.54,72.69C45.879999999999995,72,63.25,70.5,71.94999999999999,70.42"/>
<path id="貧-s9"  class="stroke" stroke="#4b09bf" d="M37.41,82.71C46.129999999999995,82.25,62.5,81.25,72.07,80.94"/>
<path id="貧-s10"  class="stroke" stroke="#ae09bf" d="M42.76,88.86C42.76,90,41.98,91.13,41.01,91.85C38.089999999999996,94.03999999999999,30.839999999999996,97.91,24.999999999999996,100.5"/>
<path id="貧-s11"  class="stroke" stroke="#bf096c" d="M63.54,88.25C70.14,91.26,77.94,96.72,79.74,99.36"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="貧-bg1"  class="badge-group"><circle cx="39.95" cy="14.61" r="3.5" fill="#bf0909"/><text class="num-single" x="39.95" y="14.61" dx="0" dy="-0.5">1</text></g>
