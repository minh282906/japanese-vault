<path id="貧-s1"  class="stroke" stroke="#bf0909" d="M39.95,14.61C39.95,15.75,39.220000000000006,17.05,38.71,17.58C33.5,22.959999999999997,23.86,29.909999999999997,15.75,33.57"/>
