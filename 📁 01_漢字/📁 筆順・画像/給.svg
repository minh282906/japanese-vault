<path id="給-s10"  class="stroke" stroke="#6409bf" d="M50.34,67.08C51.24,68.22,51.900000000000006,69.27,52.120000000000005,70.72C53.410000000000004,79.03999999999999,54.43000000000001,85.13,55.35,91.89C55.5,93,55.65,94.12,55.79,95.28"/>
<path id="給-s11"  class="stroke" stroke="#bf09bf" d="M52.81,68.34C63.75,66.75,75.93,65.57000000000001,81.39,64.8C83.38,64.52,84.58,66.72,84.3,68.36999999999999C83.11999999999999,75.21999999999998,82.41,80.60999999999999,79.97999999999999,90.19999999999999"/>
