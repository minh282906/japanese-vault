<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (給)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #給-bg[i]: Thời gian quả bóng số nảy lên
   - #給-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#給-bg1  { animation-delay: 0.05s; }
#給-s1   { stroke-dasharray: 39.6412; stroke-dashoffset: 39.6412; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#給-bg2  { animation-delay: 0.42s; }
#給-s2   { stroke-dasharray: 65.8396; stroke-dashoffset: 65.8396; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#給-bg3  { animation-delay: 0.93s; }
#給-s3   { stroke-dasharray: 13.6740; stroke-dashoffset: 13.6740; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#給-bg4  { animation-delay: 1.30s; }
#給-s4   { stroke-dasharray: 35.3113; stroke-dashoffset: 35.3113; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#給-bg5  { animation-delay: 1.67s; }
#給-s5   { stroke-dasharray: 18.1032; stroke-dashoffset: 18.1032; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#給-bg6  { animation-delay: 2.04s; }
#給-s6   { stroke-dasharray: 15.5164; stroke-dashoffset: 15.5164; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#給-bg7  { animation-delay: 2.41s; }
#給-s7   { stroke-dasharray: 49.4578; stroke-dashoffset: 49.4578; animation: drawStroke 0.27s ease-out 2.54s forwards; }
#給-bg8  { animation-delay: 2.83s; }
#給-s8   { stroke-dasharray: 48.6511; stroke-dashoffset: 48.6511; animation: drawStroke 0.27s ease-out 2.96s forwards; }
#給-bg9  { animation-delay: 3.25s; }
#給-s9   { stroke-dasharray: 23.0182; stroke-dashoffset: 23.0182; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#給-bg10  { animation-delay: 3.62s; }
#給-s10   { stroke-dasharray: 28.9370; stroke-dashoffset: 28.9370; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#給-bg11  { animation-delay: 3.99s; }
#給-s11   { stroke-dasharray: 56.3834; stroke-dashoffset: 56.3834; animation: drawStroke 0.31s ease-out 4.12s forwards; }
#給-bg12  { animation-delay: 4.45s; }
#給-s12   { stroke-dasharray: 25.3242; stroke-dashoffset: 25.3242; animation: drawStroke 0.22s ease-out 4.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

