<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (庫)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #庫-bg[i]: Thời gian quả bóng số nảy lên
   - #庫-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#庫-bg1  { animation-delay: 0.05s; }
#庫-s1   { stroke-dasharray: 12.1479; stroke-dashoffset: 12.1479; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#庫-bg2  { animation-delay: 0.42s; }
#庫-s2   { stroke-dasharray: 65.9922; stroke-dashoffset: 65.9922; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#庫-bg3  { animation-delay: 0.93s; }
#庫-s3   { stroke-dasharray: 63.7098; stroke-dashoffset: 63.7098; animation: drawStroke 0.35s ease-out 1.06s forwards; }
#庫-bg4  { animation-delay: 1.43s; }
#庫-s4   { stroke-dasharray: 44.5236; stroke-dashoffset: 44.5236; animation: drawStroke 0.24s ease-out 1.56s forwards; }
#庫-bg5  { animation-delay: 1.82s; }
#庫-s5   { stroke-dasharray: 25.1358; stroke-dashoffset: 25.1358; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#庫-bg6  { animation-delay: 2.19s; }
#庫-s6   { stroke-dasharray: 64.9453; stroke-dashoffset: 64.9453; animation: drawStroke 0.36s ease-out 2.32s forwards; }
#庫-bg7  { animation-delay: 2.70s; }
#庫-s7   { stroke-dasharray: 35.9607; stroke-dashoffset: 35.9607; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#庫-bg8  { animation-delay: 3.07s; }
#庫-s8   { stroke-dasharray: 32.5395; stroke-dashoffset: 32.5395; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#庫-bg9  { animation-delay: 3.44s; }
#庫-s9   { stroke-dasharray: 64.2721; stroke-dashoffset: 64.2721; animation: drawStroke 0.35s ease-out 3.57s forwards; }
#庫-bg10  { animation-delay: 3.94s; }
#庫-s10   { stroke-dasharray: 73.8948; stroke-dashoffset: 73.8948; animation: drawStroke 0.41s ease-out 4.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #庫-s[i]) -->
<path id="庫-s1"  class="stroke" stroke="#bf0909" d="M53.88,10.13C54.82,11.07,55.52,12.63,55.52,14.100000000000001C55.52,14.850000000000001,55.45,18.25,55.45,21.85"/>
