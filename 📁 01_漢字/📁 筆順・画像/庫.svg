<g id="庫-bg9"  class="badge-group"><circle cx="28.25" cy="82.75" r="3.5" fill="#9a09bf"/><text class="num-single" x="28.25" y="82.75" dx="0" dy="-0.5">9</text></g>
<g id="庫-bg10" class="badge-group"><circle cx="57.01" cy="26.79" r="3.5" fill="#bf0976"/><text class="num-double" x="57.01" y="26.79" dx="-0.4" dy="-0.475">10</text></g>
</svg>