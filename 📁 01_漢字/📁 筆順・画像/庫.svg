<g id="庫-bg5"  class="badge-group"><circle cx="36.76" cy="44.11" r="3.5" fill="#09bf52"/><text class="num-single" x="36.76" y="44.11" dx="0" dy="-0.5">5</text></g>
<g id="庫-bg6"  class="badge-group"><circle cx="39.2" cy="52.52" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.2" y="52.52" dx="0" dy="-0.5">6</text></g>
