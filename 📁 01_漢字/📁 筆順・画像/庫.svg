<path id="庫-s3"  class="stroke" stroke="#9abf09" d="M25.83,25.58C26.63,26.38,27.009999999999998,27.25,26.97,28.529999999999998C26.38,48.129999999999995,23.75,70.38,9.16,84.73"/>
<path id="庫-s4"  class="stroke" stroke="#2dbf09" d="M37.62,36.88C38.91,37.230000000000004,41.019999999999996,37.36,42.3,37.230000000000004C53.379999999999995,36.120000000000005,66.5,34.25000000000001,77.13,33.470000000000006C79.27,33.31000000000001,80.81,33.64000000000001,81.88,33.81000000000001"/>
<path id="庫-s5"  class="stroke" stroke="#09bf52" d="M36.76,47.61C37.699999999999996,48.55,38.62,49.62,38.82,50.78C39.43,54.4,40.31,60.64,41.27,67.35C41.480000000000004,68.83,41.7,70.33999999999999,41.92,71.85"/>
<path id="庫-s6"  class="stroke" stroke="#09bfbf" d="M39.2,49.02C50.07,47.790000000000006,66.68,45.67,76.13,44.940000000000005C79.03,44.720000000000006,80.61999999999999,45.290000000000006,80.3,48.38C79.89,52.32,78.34,58.800000000000004,76.67999999999999,65.04C76.32,66.38000000000001,75.96,67.7,75.61,68.99000000000001"/>
<path id="庫-s7"  class="stroke" stroke="#0952bf" d="M41.97,59.01C51.75,58,66.87,56.879999999999995,77.81,56.08"/>
<path id="庫-s8"  class="stroke" stroke="#2d09bf" d="M42.72,69.73C53.25,68.25,63.25,67.5,75.1,66.57000000000001"/>
<path id="庫-s9"  class="stroke" stroke="#9a09bf" d="M28.25,82.75C31.5,83.62,34.4,83.42,37.12,83.19C54,81.75,72.7,79.77,84.26,79.43C86.94000000000001,79.35000000000001,89.63000000000001,79.38000000000001,92.25,80.08000000000001"/>
<path id="庫-s10"  class="stroke" stroke="#bf0976" d="M57.01,26.79C58.05,27.83,58.73,29.369999999999997,58.73,30.97C58.73,31.89,58.68,75.35,58.61,93.25C58.6,96.66,58.58,99.14,58.56,100.23"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="庫-bg1"  class="badge-group"><circle cx="53.88" cy="10.13" r="3.5" fill="#bf0909"/><text class="num-single" x="53.88" y="10.13" dx="0" dy="-0.5">1</text></g>
<g id="庫-bg2"  class="badge-group"><circle cx="23.46" cy="21.44" r="3.5" fill="#bf7609"/><text class="num-single" x="23.46" y="21.44" dx="0" dy="-0.5">2</text></g>
<g id="庫-bg3"  class="badge-group"><circle cx="25.83" cy="29.08" r="3.5" fill="#9abf09"/><text class="num-single" x="25.83" y="29.08" dx="0" dy="-0.5">3</text></g>
