<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (友)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #友-bg[i]: Thời gian quả bóng số nảy lên
   - #友-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#友-bg1  { animation-delay: 0.05s; }
#友-s1   { stroke-dasharray: 70.3492; stroke-dashoffset: 70.3492; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#友-bg2  { animation-delay: 0.59s; }
#友-s2   { stroke-dasharray: 80.6557; stroke-dashoffset: 80.6557; animation: drawStroke 0.44s ease-out 0.72s forwards; }
#友-bg3  { animation-delay: 1.18s; }
#友-s3   { stroke-dasharray: 99.0904; stroke-dashoffset: 99.0904; animation: drawStroke 0.54s ease-out 1.31s forwards; }
#友-bg4  { animation-delay: 1.87s; }
#友-s4   { stroke-dasharray: 60.0790; stroke-dashoffset: 60.0790; animation: drawStroke 0.33s ease-out 2.00s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #友-s[i]) -->
<path id="友-s1"  class="stroke" stroke="#bf0909" d="M17.88,37.23C20.009999999999998,37.769999999999996,23.66,37.809999999999995,25.77,37.519999999999996C43.25,35.129999999999995,61.75,33.129999999999995,80.42,32.03999999999999C83.96000000000001,31.82999999999999,86.1,32.04999999999999,87.88,32.31999999999999"/>
<path id="友-s2"  class="stroke" stroke="#64bf09" d="M48.22,14.14C48.75,16.25,48.75,18.44,48.53,20.87C47,38,33,72.5,15.5,85.25"/>
<path id="友-s3"  class="stroke" stroke="#09bfbf" d="M42.66,54.86C43.75,55.13,45.169999999999995,55.14,46.25,55C53.13,54.12,62.870000000000005,51.75,68.68,50.12C72.13000000000001,49.15,73.28,51.57,71.79,54.669999999999995C66.5,65.62,48.12,87.75,24,96.5"/>
<path id="友-s4"  class="stroke" stroke="#6409bf" d="M41.25,63.5C46.4,63.95,68.75,82.12,82.18,89.86C85.38000000000001,91.7,88.83000000000001,93.62,92.5,94.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="友-bg1"  class="badge-group"><circle cx="17.88" cy="37.23" r="3.5" fill="#bf0909"/><text class="num-single" x="17.88" y="37.23" dx="0" dy="-0.5">1</text></g>
<g id="友-bg2"  class="badge-group"><circle cx="48.22" cy="14.14" r="3.5" fill="#64bf09"/><text class="num-single" x="48.22" y="14.14" dx="0" dy="-0.5">2</text></g>
<g id="友-bg3"  class="badge-group"><circle cx="42.66" cy="54.86" r="3.5" fill="#09bfbf"/><text class="num-single" x="42.66" y="54.86" dx="0" dy="-0.5">3</text></g>
<g id="友-bg4"  class="badge-group"><circle cx="41.25" cy="63.5" r="3.5" fill="#6409bf"/><text class="num-single" x="41.25" y="63.5" dx="0" dy="-0.5">4</text></g>
</svg>