<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (守)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #守-bg[i]: Thời gian quả bóng số nảy lên
   - #守-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#守-bg1  { animation-delay: 0.05s; }
#守-s1   { stroke-dasharray: 13.7839; stroke-dashoffset: 13.7839; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#守-bg2  { animation-delay: 0.42s; }
#守-s2   { stroke-dasharray: 20.3476; stroke-dashoffset: 20.3476; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#守-bg3  { animation-delay: 0.79s; }
#守-s3   { stroke-dasharray: 80.7064; stroke-dashoffset: 80.7064; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#守-bg4  { animation-delay: 1.38s; }
#守-s4   { stroke-dasharray: 76.4697; stroke-dashoffset: 76.4697; animation: drawStroke 0.42s ease-out 1.51s forwards; }
#守-bg5  { animation-delay: 1.95s; }
#守-s5   { stroke-dasharray: 73.3409; stroke-dashoffset: 73.3409; animation: drawStroke 0.40s ease-out 2.08s forwards; }
#守-bg6  { animation-delay: 2.50s; }
#守-s6   { stroke-dasharray: 15.8490; stroke-dashoffset: 15.8490; animation: drawStroke 0.22s ease-out 2.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #守-s[i]) -->
<path id="守-s1"  class="stroke" stroke="#bf0909" d="M52.04,9.25C53.15,10.36,53.68,11.75,53.68,13.52C53.68,17.419999999999998,53.61,19.06,53.6,22.6"/>
<path id="守-s2"  class="stroke" stroke="#bfbf09" d="M20.86,24.13C20.86,28.509999999999998,16.83,40.57,15,43.5"/>
<path id="守-s3"  class="stroke" stroke="#09bf09" d="M21.51,27.78C41.75,25.25,70.12,21.75,85.10000000000001,21.580000000000002C98.00000000000001,21.44,85.98,29.740000000000002,84.18,30.61"/>
<path id="守-s4"  class="stroke" stroke="#09bfbf" d="M15.63,56.92C18.57,57.5,21.85,57.74,24.05,57.47C44.7,54.87,73.44,51.12,83.94,50.79C87.6,50.67,89.8,50.92,91.63,51.32"/>
<path id="守-s5"  class="stroke" stroke="#0909bf" d="M66.27,34.33C67.41,35.47,68.03,37.25,68.03,39.599999999999994C68.03,54.16,68.27,87.00999999999999,68.27,91.97C68.27,103.75,61.75,93.75,59.559999999999995,92.22"/>
<path id="守-s6"  class="stroke" stroke="#bf09bf" d="M36.46,67.24C39.72,69.47,44.89,76.39999999999999,45.71,79.86"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="守-bg1"  class="badge-group"><circle cx="52.04" cy="9.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.04" y="9.25" dx="0" dy="-0.5">1</text></g>
<g id="守-bg2"  class="badge-group"><circle cx="20.86" cy="20.63" r="3.5" fill="#bfbf09"/><text class="num-single" x="20.86" y="20.63" dx="0" dy="-0.5">2</text></g>
<g id="守-bg3"  class="badge-group"><circle cx="21.51" cy="31.28" r="3.5" fill="#09bf09"/><text class="num-single" x="21.51" y="31.28" dx="0" dy="-0.5">3</text></g>
<g id="守-bg4"  class="badge-group"><circle cx="15.63" cy="56.92" r="3.5" fill="#09bfbf"/><text class="num-single" x="15.63" y="56.92" dx="0" dy="-0.5">4</text></g>
<g id="守-bg5"  class="badge-group"><circle cx="66.27" cy="34.33" r="3.5" fill="#0909bf"/><text class="num-single" x="66.27" y="34.33" dx="0" dy="-0.5">5</text></g>
<g id="守-bg6"  class="badge-group"><circle cx="36.46" cy="67.24" r="3.5" fill="#bf09bf"/><text class="num-single" x="36.46" y="67.24" dx="0" dy="-0.5">6</text></g>
</svg>