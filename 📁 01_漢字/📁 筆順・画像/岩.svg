<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (岩)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #岩-bg[i]: Thời gian quả bóng số nảy lên
   - #岩-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#岩-bg1  { animation-delay: 0.05s; }
#岩-s1   { stroke-dasharray: 24.7556; stroke-dashoffset: 24.7556; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#岩-bg2  { animation-delay: 0.42s; }
#岩-s2   { stroke-dasharray: 73.6462; stroke-dashoffset: 73.6462; animation: drawStroke 0.41s ease-out 0.55s forwards; }
#岩-bg3  { animation-delay: 0.98s; }
#岩-s3   { stroke-dasharray: 23.4302; stroke-dashoffset: 23.4302; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#岩-bg4  { animation-delay: 1.35s; }
#岩-s4   { stroke-dasharray: 76.3772; stroke-dashoffset: 76.3772; animation: drawStroke 0.42s ease-out 1.48s forwards; }
#岩-bg5  { animation-delay: 1.92s; }
#岩-s5   { stroke-dasharray: 45.4965; stroke-dashoffset: 45.4965; animation: drawStroke 0.25s ease-out 2.05s forwards; }
#岩-bg6  { animation-delay: 2.32s; }
#岩-s6   { stroke-dasharray: 28.1576; stroke-dashoffset: 28.1576; animation: drawStroke 0.22s ease-out 2.45s forwards; }
#岩-bg7  { animation-delay: 2.69s; }
#岩-s7   { stroke-dasharray: 64.4030; stroke-dashoffset: 64.4030; animation: drawStroke 0.35s ease-out 2.82s forwards; }
#岩-bg8  { animation-delay: 3.19s; }
#岩-s8   { stroke-dasharray: 38.1797; stroke-dashoffset: 38.1797; animation: drawStroke 0.22s ease-out 3.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #岩-s[i]) -->
<path id="岩-s1"  class="stroke" stroke="#bf0909" d="M54.84,12.5C55.75,13.25,56.550000000000004,14.5,56.550000000000004,16.4C56.550000000000004,16.849999999999998,56.510000000000005,30.409999999999997,56.46,36.75"/>
<path id="岩-s2"  class="stroke" stroke="#bf9109" d="M30.03,21.6C30.75,22.5,31,23.25,31.060000000000002,24.82C31.17,27.57,29.740000000000002,33.69,28.17,39.19C27.62,41.129999999999995,28.540000000000003,41.739999999999995,30.51,41.349999999999994C45.24,38.379999999999995,69.41,37.099999999999994,81.49,36.86999999999999"/>
<path id="岩-s3"  class="stroke" stroke="#64bf09" d="M84.65,17.67C85.5,18.75,85.75,19.5,85.51,21.3C85.15,24.02,84.23,30.55,83.12,36.08C82.81,37.64,82.48,39.17,82.14,40.56"/>
<path id="岩-s4"  class="stroke" stroke="#09bf36" d="M17.57,55.43C21,56,23.71,55.81,26.65,55.57C40.25,54.49,68.13,51.74,85.63,51.51C88.33999999999999,51.47,91.07,51.46,93.75,51.879999999999995"/>
<path id="岩-s5"  class="stroke" stroke="#09bfbf" d="M40.86,57.86C41.12,58.75,41,60.5,40.2,62.129999999999995C36.790000000000006,69.11999999999999,29.380000000000003,83.89999999999999,14.250000000000004,93.25"/>
<path id="岩-s6"  class="stroke" stroke="#0936bf" d="M38.27,69.52C39.52,70.53999999999999,39.82,70.81,40.050000000000004,72.46C40.71,77.19999999999999,41.21,85.44999999999999,42.06,93.25C42.2,94.49,42.34,95.72,42.49,96.92"/>
<path id="岩-s7"  class="stroke" stroke="#6409bf" d="M40.99,71.41C51.78,70.21,73.53999999999999,67.6,79.36,67.46C82.12,67.39,83.69,69.41999999999999,83.36,70.91C82.12,76.49,80.39,83.67,79.26,90.28999999999999"/>
<path id="岩-s8"  class="stroke" stroke="#bf0991" d="M43.02,94.1C49.6,93.66999999999999,66.5,92.25,77.25,91.41999999999999C79.21,91.26999999999998,79.53,91.26999999999998,81.09,91.24999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="岩-bg1"  class="badge-group"><circle cx="54.84" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="54.84" y="12.5" dx="0" dy="-0.5">1</text></g>
<g id="岩-bg2"  class="badge-group"><circle cx="30.03" cy="21.6" r="3.5" fill="#bf9109"/><text class="num-single" x="30.03" y="21.6" dx="0" dy="-0.5">2</text></g>
<g id="岩-bg3"  class="badge-group"><circle cx="84.65" cy="17.67" r="3.5" fill="#64bf09"/><text class="num-single" x="84.65" y="17.67" dx="0" dy="-0.5">3</text></g>
<g id="岩-bg4"  class="badge-group"><circle cx="17.57" cy="55.43" r="3.5" fill="#09bf36"/><text class="num-single" x="17.57" y="55.43" dx="0" dy="-0.5">4</text></g>
<g id="岩-bg5"  class="badge-group"><circle cx="40.86" cy="57.86" r="3.5" fill="#09bfbf"/><text class="num-single" x="40.86" y="57.86" dx="0" dy="-0.5">5</text></g>
<g id="岩-bg6"  class="badge-group"><circle cx="38.27" cy="66.02" r="3.5" fill="#0936bf"/><text class="num-single" x="38.27" y="66.02" dx="0" dy="-0.5">6</text></g>
<g id="岩-bg7"  class="badge-group"><circle cx="40.99" cy="74.91" r="3.5" fill="#6409bf"/><text class="num-single" x="40.99" y="74.91" dx="0" dy="-0.5">7</text></g>
<g id="岩-bg8"  class="badge-group"><circle cx="43.02" cy="94.1" r="3.5" fill="#bf0991"/><text class="num-single" x="43.02" y="94.1" dx="0" dy="-0.5">8</text></g>
</svg>