<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (助)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #助-bg[i]: Thời gian quả bóng số nảy lên
   - #助-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#助-bg1  { animation-delay: 0.05s; }
#助-s1   { stroke-dasharray: 55.7263; stroke-dashoffset: 55.7263; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#助-bg2  { animation-delay: 0.51s; }
#助-s2   { stroke-dasharray: 68.9633; stroke-dashoffset: 68.9633; animation: drawStroke 0.38s ease-out 0.64s forwards; }
#助-bg3  { animation-delay: 1.04s; }
#助-s3   { stroke-dasharray: 19.9240; stroke-dashoffset: 19.9240; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#助-bg4  { animation-delay: 1.41s; }
#助-s4   { stroke-dasharray: 19.6848; stroke-dashoffset: 19.6848; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#助-bg5  { animation-delay: 1.78s; }
#助-s5   { stroke-dasharray: 35.1765; stroke-dashoffset: 35.1765; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#助-bg6  { animation-delay: 2.15s; }
#助-s6   { stroke-dasharray: 104.8540; stroke-dashoffset: 104.8540; animation: drawStroke 0.55s ease-out 2.28s forwards; }
#助-bg7  { animation-delay: 2.85s; }
#助-s7   { stroke-dasharray: 81.8805; stroke-dashoffset: 81.8805; animation: drawStroke 0.45s ease-out 2.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #助-s[i]) -->
<path id="助-s1"  class="stroke" stroke="#bf0909" d="M22.75,24.79C23.55,25.59,24.1,27,24.1,28.39C24.1,29.26,24.41,78.28,24.360000000000003,80.18"/>
<path id="助-s2"  class="stroke" stroke="#bfa509" d="M24.93,26.01C26.61,25.92,41.53,23.450000000000003,42.78,23.330000000000002C44.870000000000005,23.130000000000003,46.120000000000005,24.130000000000003,46.1,27.310000000000002C46.09,28.540000000000003,45.89,55.63,45.89,72.12"/>
<path id="助-s3"  class="stroke" stroke="#3dbf09" d="M25.24,43.99C34.75,42.5,37.5,41.75,44.92,40.900000000000006"/>
<path id="助-s4"  class="stroke" stroke="#09bf71" d="M25.33,60.72C31.5,59.5,37.5,58.75,44.81,57.93"/>
<path id="助-s5"  class="stroke" stroke="#0971bf" d="M15.44,82.34C16.45,83.03,17.689999999999998,83.38000000000001,19.73,82.75C25.37,81,39.370000000000005,76.75,49,73.5"/>
<path id="助-s6"  class="stroke" stroke="#3d09bf" d="M54.58,45.41C57.379999999999995,46.129999999999995,60.21,45.83,62.93,45.18C71.99,43.03,85.75999999999999,39.21,89.88,38.56C92.71,38.120000000000005,94.82,40.550000000000004,94.61,43.660000000000004C93.63,57.870000000000005,87.13,79.62,80.44,89.39C76.6,95,74.75999999999999,91.25,70.97999999999999,87.72"/>
<path id="助-s7"  class="stroke" stroke="#bf09a5" d="M74.23,19.55C75.28,20.6,75.64,22.25,75.59,23.85C74.88000000000001,47.13,66.13,75.75999999999999,45.13,92.31"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="助-bg1"  class="badge-group"><circle cx="22.75" cy="21.29" r="3.5" fill="#bf0909"/><text class="num-single" x="22.75" y="21.29" dx="0" dy="-0.5">1</text></g>
<g id="助-bg2"  class="badge-group"><circle cx="24.93" cy="29.51" r="3.5" fill="#bfa509"/><text class="num-single" x="24.93" y="29.51" dx="0" dy="-0.5">2</text></g>
<g id="助-bg3"  class="badge-group"><circle cx="25.24" cy="43.99" r="3.5" fill="#3dbf09"/><text class="num-single" x="25.24" y="43.99" dx="0" dy="-0.5">3</text></g>
<g id="助-bg4"  class="badge-group"><circle cx="25.33" cy="60.72" r="3.5" fill="#09bf71"/><text class="num-single" x="25.33" y="60.72" dx="0" dy="-0.5">4</text></g>
<g id="助-bg5"  class="badge-group"><circle cx="15.44" cy="82.34" r="3.5" fill="#0971bf"/><text class="num-single" x="15.44" y="82.34" dx="0" dy="-0.5">5</text></g>
<g id="助-bg6"  class="badge-group"><circle cx="54.58" cy="45.41" r="3.5" fill="#3d09bf"/><text class="num-single" x="54.58" y="45.41" dx="0" dy="-0.5">6</text></g>
<g id="助-bg7"  class="badge-group"><circle cx="74.23" cy="19.55" r="3.5" fill="#bf09a5"/><text class="num-single" x="74.23" y="19.55" dx="0" dy="-0.5">7</text></g>
</svg>