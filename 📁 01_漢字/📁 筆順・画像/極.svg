<path id="極-s8"  class="stroke" stroke="#0964bf" d="M43.65,51.44C48.97,50.269999999999996,52.11,49.5,55.25,48.989999999999995C58,48.55,59.83,48.71999999999999,59.15,51.99999999999999C58.36,55.849999999999994,57.47,60.129999999999995,56.98,66.25"/>
<path id="極-s9"  class="stroke" stroke="#0909bf" d="M47.26,69.04C49.86,68.49000000000001,52.65,67.87,56.019999999999996,67.48C56.67999999999999,67.4,57.37,67.34,58.08,67.28"/>
<path id="極-s10"  class="stroke" stroke="#6409bf" d="M75.4,45.7C76.63000000000001,45.870000000000005,78.14,45.650000000000006,79.51,45.330000000000005C82.15,44.720000000000006,87.54,43.190000000000005,90.17,42.290000000000006C92.13,41.620000000000005,93.33,43.52,92.81,45.13000000000001C88.62,58,84.25,68.62,75.63,77.54"/>
<path id="極-s11"  class="stroke" stroke="#bf09bf" d="M77.3,54.27C83.5,59,89.5,64.75,94.11,73.1"/>
