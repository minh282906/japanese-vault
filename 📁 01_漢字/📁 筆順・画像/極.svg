<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (極)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #極-bg[i]: Thời gian quả bóng số nảy lên
   - #極-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#極-bg1  { animation-delay: 0.05s; }
#極-s1   { stroke-dasharray: 29.6759; stroke-dashoffset: 29.6759; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#極-bg2  { animation-delay: 0.42s; }
#極-s2   { stroke-dasharray: 83.9046; stroke-dashoffset: 83.9046; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#極-bg3  { animation-delay: 1.03s; }
#極-s3   { stroke-dasharray: 40.9585; stroke-dashoffset: 40.9585; animation: drawStroke 0.23s ease-out 1.16s forwards; }
#極-bg4  { animation-delay: 1.41s; }
#極-s4   { stroke-dasharray: 12.7057; stroke-dashoffset: 12.7057; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#極-bg5  { animation-delay: 1.78s; }
#極-s5   { stroke-dasharray: 47.1049; stroke-dashoffset: 47.1049; animation: drawStroke 0.26s ease-out 1.91s forwards; }
#極-bg6  { animation-delay: 2.19s; }
#極-s6   { stroke-dasharray: 78.6871; stroke-dashoffset: 78.6871; animation: drawStroke 0.43s ease-out 2.32s forwards; }
#極-bg7  { animation-delay: 2.77s; }
#極-s7   { stroke-dasharray: 21.8352; stroke-dashoffset: 21.8352; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#極-bg8  { animation-delay: 3.14s; }
#極-s8   { stroke-dasharray: 32.7671; stroke-dashoffset: 32.7671; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#極-bg9  { animation-delay: 3.51s; }
#極-s9   { stroke-dasharray: 10.9715; stroke-dashoffset: 10.9715; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#極-bg10  { animation-delay: 3.88s; }
#極-s10   { stroke-dasharray: 57.1469; stroke-dashoffset: 57.1469; animation: drawStroke 0.31s ease-out 4.01s forwards; }
#極-bg11  { animation-delay: 4.34s; }
#極-s11   { stroke-dasharray: 25.4342; stroke-dashoffset: 25.4342; animation: drawStroke 0.22s ease-out 4.47s forwards; }
#極-bg12  { animation-delay: 4.71s; }
#極-s12   { stroke-dasharray: 59.5596; stroke-dashoffset: 59.5596; animation: drawStroke 0.33s ease-out 4.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

