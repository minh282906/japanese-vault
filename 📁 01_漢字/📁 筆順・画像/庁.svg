<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (庁)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #庁-bg[i]: Thời gian quả bóng số nảy lên
   - #庁-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#庁-bg1  { animation-delay: 0.05s; }
#庁-s1   { stroke-dasharray: 13.9884; stroke-dashoffset: 13.9884; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#庁-bg2  { animation-delay: 0.42s; }
#庁-s2   { stroke-dasharray: 65.5358; stroke-dashoffset: 65.5358; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#庁-bg3  { animation-delay: 0.93s; }
#庁-s3   { stroke-dasharray: 63.5003; stroke-dashoffset: 63.5003; animation: drawStroke 0.35s ease-out 1.06s forwards; }
#庁-bg4  { animation-delay: 1.43s; }
#庁-s4   { stroke-dasharray: 56.0033; stroke-dashoffset: 56.0033; animation: drawStroke 0.31s ease-out 1.56s forwards; }
#庁-bg5  { animation-delay: 1.89s; }
#庁-s5   { stroke-dasharray: 57.2878; stroke-dashoffset: 57.2878; animation: drawStroke 0.32s ease-out 2.02s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #庁-s[i]) -->
<path id="庁-s1"  class="stroke" stroke="#bf0909" d="M54.81,12.38C55.900000000000006,13.47,56.32,15,56.32,16.78C56.32,18.240000000000002,56.25,23.490000000000002,56.25,25.990000000000002"/>
<path id="庁-s2"  class="stroke" stroke="#9abf09" d="M23.63,29.23C27.13,30,30.52,29.57,33.629999999999995,29.26C49.029999999999994,27.720000000000002,65.47999999999999,26.290000000000003,81.02,25.01C83.75,24.78,86.19999999999999,24.75,88.89,25.330000000000002"/>
<path id="庁-s3"  class="stroke" stroke="#09bf52" d="M26.24,30.25C27.31,31.32,27.5,32.78,27.389999999999997,34.75C26.5,50.75,24,76.5,10.56,89.72"/>
<path id="庁-s4"  class="stroke" stroke="#0952bf" d="M35.24,48.8C37.88,49.25,40.68,49.129999999999995,42.99,48.86C54.63,47.5,70.13,45.75,83.49000000000001,45.28C86.04,45.19,88.51,45.160000000000004,91.01,45.75"/>
<path id="庁-s5"  class="stroke" stroke="#9a09bf" d="M61.91,49.49C62.769999999999996,50.35,63.209999999999994,51.620000000000005,63.209999999999994,53.42C63.209999999999994,65.77,63.11999999999999,88.53999999999999,63.11999999999999,92.74000000000001C63.11999999999999,102.27000000000001,55.86999999999999,92.66000000000001,54.60999999999999,91.60000000000001"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="庁-bg1"  class="badge-group"><circle cx="54.81" cy="12.38" r="3.5" fill="#bf0909"/><text class="num-single" x="54.81" y="12.38" dx="0" dy="-0.5">1</text></g>
<g id="庁-bg2"  class="badge-group"><circle cx="23.63" cy="25.73" r="3.5" fill="#9abf09"/><text class="num-single" x="23.63" y="25.73" dx="0" dy="-0.5">2</text></g>
<g id="庁-bg3"  class="badge-group"><circle cx="26.24" cy="33.75" r="3.5" fill="#09bf52"/><text class="num-single" x="26.24" y="33.75" dx="0" dy="-0.5">3</text></g>
<g id="庁-bg4"  class="badge-group"><circle cx="35.24" cy="48.8" r="3.5" fill="#0952bf"/><text class="num-single" x="35.24" y="48.8" dx="0" dy="-0.5">4</text></g>
<g id="庁-bg5"  class="badge-group"><circle cx="61.91" cy="49.49" r="3.5" fill="#9a09bf"/><text class="num-single" x="61.91" y="49.49" dx="0" dy="-0.5">5</text></g>
</svg>