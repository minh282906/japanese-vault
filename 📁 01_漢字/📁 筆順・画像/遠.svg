<path id="遠-s9"  class="stroke" stroke="#0941bf" d="M78.35,58.42C78.25,59.370000000000005,78,60.25,76.97,61.33C75.49,62.89,73.37,64.63,69.33,67.42999999999999"/>
<path id="遠-s10"  class="stroke" stroke="#2509bf" d="M64.75,66.6C70.72,68.69,80.24,75.04,84.5,81"/>
<path id="遠-s11"  class="stroke" stroke="#7909bf" d="M20.71,19.25C24.34,20.99,30.090000000000003,26.42,31,29.130000000000003"/>
<path id="遠-s12"  class="stroke" stroke="#bf09b1" d="M13.25,50.5C14.870000000000001,51,17.009999999999998,51.03,18,50.75C20.62,50,24.62,48.37,27.75,47.25C31.13,46.03,32.7,47.31,30.36,50.99C24,61,24,61.25,29.75,67.13C32.6,70.05,32.25,71.13,29.75,73.5C28.33,74.84,21,81,19.5,81.5"/>
