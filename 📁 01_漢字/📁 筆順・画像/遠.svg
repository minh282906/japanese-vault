<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (遠)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #遠-bg[i]: Thời gian quả bóng số nảy lên
   - #遠-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#遠-bg1  { animation-delay: 0.05s; }
#遠-s1   { stroke-dasharray: 30.7373; stroke-dashoffset: 30.7373; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#遠-bg2  { animation-delay: 0.42s; }
#遠-s2   { stroke-dasharray: 22.2960; stroke-dashoffset: 22.2960; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#遠-bg3  { animation-delay: 0.79s; }
#遠-s3   { stroke-dasharray: 51.6519; stroke-dashoffset: 51.6519; animation: drawStroke 0.28s ease-out 0.92s forwards; }
#遠-bg4  { animation-delay: 1.22s; }
#遠-s4   { stroke-dasharray: 14.9575; stroke-dashoffset: 14.9575; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#遠-bg5  { animation-delay: 1.59s; }
#遠-s5   { stroke-dasharray: 39.1405; stroke-dashoffset: 39.1405; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#遠-bg6  { animation-delay: 1.96s; }
#遠-s6   { stroke-dasharray: 23.7200; stroke-dashoffset: 23.7200; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#遠-bg7  { animation-delay: 2.33s; }
#遠-s7   { stroke-dasharray: 29.1428; stroke-dashoffset: 29.1428; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#遠-bg8  { animation-delay: 2.70s; }
#遠-s8   { stroke-dasharray: 22.5250; stroke-dashoffset: 22.5250; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#遠-bg9  { animation-delay: 3.07s; }
#遠-s9   { stroke-dasharray: 13.0828; stroke-dashoffset: 13.0828; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#遠-bg10  { animation-delay: 3.44s; }
#遠-s10   { stroke-dasharray: 24.7270; stroke-dashoffset: 24.7270; animation: drawStroke 0.22s ease-out 3.57s forwards; }
#遠-bg11  { animation-delay: 3.81s; }
#遠-s11   { stroke-dasharray: 14.4726; stroke-dashoffset: 14.4726; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#遠-bg12  { animation-delay: 4.18s; }
#遠-s12   { stroke-dasharray: 62.4173; stroke-dashoffset: 62.4173; animation: drawStroke 0.34s ease-out 4.31s forwards; }
#遠-bg13  { animation-delay: 4.67s; }
#遠-s13   { stroke-dasharray: 79.9375; stroke-dashoffset: 79.9375; animation: drawStroke 0.44s ease-out 4.80s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

