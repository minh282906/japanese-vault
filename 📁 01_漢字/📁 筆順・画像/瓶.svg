<path id="瓶-s5"  class="stroke" stroke="#09bf2a" d="M25.17,37.62C26.090000000000003,38.54,26.28,39.48,26.28,41.48C26.28,59.769999999999996,26.87,80.37,12.840000000000002,95.28"/>
<path id="瓶-s6"  class="stroke" stroke="#09bf8d" d="M39.91,35.53C40.75,36.370000000000005,40.919999999999995,37.5,40.919999999999995,38.77C40.919999999999995,39.53,41.05,73.43,40.94,89.38C40.919999999999995,93.08,40.89,95.78999999999999,40.86,96.88"/>
<path id="瓶-s7"  class="stroke" stroke="#098dbf" d="M53.8,21.2C56.5,21.88,59.099999999999994,21.599999999999998,61.269999999999996,21.32C68.97,20.330000000000002,80.27,18.54,86.89999999999999,17.95C89.08,17.75,91.16,17.64,93.27999999999999,18.3"/>
<path id="瓶-s8"  class="stroke" stroke="#092abf" d="M65.92,24.25C66.63,25.5,66.75,26.5,66.53,28.25C65.53,36.07,57.13,80.63,54.5,89.97999999999999"/>
<path id="瓶-s9"  class="stroke" stroke="#4b09bf" d="M51.5,91.48C53.01,92.44,54.56,92,56.019999999999996,91.15C61.559999999999995,87.92,68.86,84.82000000000001,74.50999999999999,82"/>
<path id="瓶-s10"  class="stroke" stroke="#ae09bf" d="M66.99,41.54C68.32,41.86,69.61999999999999,41.61,70.91,41.3C73.95,40.559999999999995,80.35,39.029999999999994,83.12,38.239999999999995C84.77000000000001,37.769999999999996,86.57000000000001,38.779999999999994,86.31,40.78999999999999C85.74000000000001,45.279999999999994,83.12,65,81.32000000000001,75.79999999999998C78.25000000000001,94.25999999999999,79.25000000000001,95.62999999999998,88.52000000000001,95.62999999999998C97.38000000000001,95.62999999999998,97.98000000000002,94.25999999999998,97.98000000000002,85.77999999999999"/>
<path id="瓶-s11"  class="stroke" stroke="#bf096c" d="M67.88,56.38C70.32,58.34,74.17999999999999,64.43,74.78999999999999,67.47"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="瓶-bg1"  class="badge-group"><circle cx="17.71" cy="16.59" r="3.5" fill="#bf0909"/><text class="num-single" x="17.71" y="16.59" dx="0" dy="-0.5">1</text></g>
