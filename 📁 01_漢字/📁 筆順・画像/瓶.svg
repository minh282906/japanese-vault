<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (瓶)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #瓶-bg[i]: Thời gian quả bóng số nảy lên
   - #瓶-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#瓶-bg1  { animation-delay: 0.05s; }
#瓶-s1   { stroke-dasharray: 13.7825; stroke-dashoffset: 13.7825; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#瓶-bg2  { animation-delay: 0.42s; }
#瓶-s2   { stroke-dasharray: 17.6453; stroke-dashoffset: 17.6453; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#瓶-bg3  { animation-delay: 0.79s; }
#瓶-s3   { stroke-dasharray: 35.4977; stroke-dashoffset: 35.4977; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#瓶-bg4  { animation-delay: 1.16s; }
#瓶-s4   { stroke-dasharray: 44.5906; stroke-dashoffset: 44.5906; animation: drawStroke 0.25s ease-out 1.29s forwards; }
#瓶-bg5  { animation-delay: 1.56s; }
#瓶-s5   { stroke-dasharray: 61.1060; stroke-dashoffset: 61.1060; animation: drawStroke 0.34s ease-out 1.69s forwards; }
#瓶-bg6  { animation-delay: 2.05s; }
#瓶-s6   { stroke-dasharray: 61.6004; stroke-dashoffset: 61.6004; animation: drawStroke 0.34s ease-out 2.18s forwards; }
#瓶-bg7  { animation-delay: 2.54s; }
#瓶-s7   { stroke-dasharray: 39.8055; stroke-dashoffset: 39.8055; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#瓶-bg8  { animation-delay: 2.91s; }
#瓶-s8   { stroke-dasharray: 67.0390; stroke-dashoffset: 67.0390; animation: drawStroke 0.37s ease-out 3.04s forwards; }
#瓶-bg9  { animation-delay: 3.43s; }
#瓶-s9   { stroke-dasharray: 25.4325; stroke-dashoffset: 25.4325; animation: drawStroke 0.22s ease-out 3.56s forwards; }
#瓶-bg10  { animation-delay: 3.80s; }
#瓶-s10   { stroke-dasharray: 100.0490; stroke-dashoffset: 100.0490; animation: drawStroke 0.55s ease-out 3.93s forwards; }
#瓶-bg11  { animation-delay: 4.50s; }
#瓶-s11   { stroke-dasharray: 13.2167; stroke-dashoffset: 13.2167; animation: drawStroke 0.22s ease-out 4.63s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #瓶-s[i]) -->
<path id="瓶-s1"  class="stroke" stroke="#bf0909" d="M17.71,16.59C20.17,18.66,24.07,25.08,24.69,28.3"/>
<path id="瓶-s2"  class="stroke" stroke="#bf6c09" d="M45.05,14.39C45.07,14.74,45.099999999999994,15.3,45,15.81C44.42,18.8,41.38,24,36.71,29.61"/>
