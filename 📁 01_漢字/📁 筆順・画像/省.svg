<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (省)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #省-bg[i]: Thời gian quả bóng số nảy lên
   - #省-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#省-bg1  { animation-delay: 0.05s; }
#省-s1   { stroke-dasharray: 35.5793; stroke-dashoffset: 35.5793; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#省-bg2  { animation-delay: 0.42s; }
#省-s2   { stroke-dasharray: 24.7052; stroke-dashoffset: 24.7052; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#省-bg3  { animation-delay: 0.79s; }
#省-s3   { stroke-dasharray: 20.5989; stroke-dashoffset: 20.5989; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#省-bg4  { animation-delay: 1.16s; }
#省-s4   { stroke-dasharray: 67.4501; stroke-dashoffset: 67.4501; animation: drawStroke 0.37s ease-out 1.29s forwards; }
#省-bg5  { animation-delay: 1.68s; }
#省-s5   { stroke-dasharray: 45.6939; stroke-dashoffset: 45.6939; animation: drawStroke 0.25s ease-out 1.81s forwards; }
#省-bg6  { animation-delay: 2.08s; }
#省-s6   { stroke-dasharray: 81.5550; stroke-dashoffset: 81.5550; animation: drawStroke 0.45s ease-out 2.21s forwards; }
#省-bg7  { animation-delay: 2.68s; }
#省-s7   { stroke-dasharray: 35.6344; stroke-dashoffset: 35.6344; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#省-bg8  { animation-delay: 3.05s; }
#省-s8   { stroke-dasharray: 35.3895; stroke-dashoffset: 35.3895; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#省-bg9  { animation-delay: 3.42s; }
#省-s9   { stroke-dasharray: 35.4961; stroke-dashoffset: 35.4961; animation: drawStroke 0.22s ease-out 3.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #省-s[i]) -->
<path id="省-s1"  class="stroke" stroke="#bf0909" d="M55.6,11.75C56.43,12.58,57.09,13.77,57.09,15.32C57.09,24.62,57.09,32.25,57.09,35.94C57.09,43.5,53,39.989999999999995,50.470000000000006,37.82"/>
<path id="省-s2"  class="stroke" stroke="#bf8209" d="M35.88,24.75C35.93,25.12,35.82,25.97,35.54,26.49C33.5,30.21,24.9,37.38,17.92,40.8"/>
<path id="省-s3"  class="stroke" stroke="#82bf09" d="M76.67,20.92C83.26,23.080000000000002,90.87,28,93.75,31.980000000000004"/>
<path id="省-s4"  class="stroke" stroke="#09bf09" d="M69.75,25.75C69.89,26.68,69.67,28.16,68.96,29.48C63.099999999999994,40.36,40.559999999999995,57.94,17.68999999999999,65.25"/>
<path id="省-s5"  class="stroke" stroke="#09bf82" d="M41.25,51.39C42.37,52.51,42.78,54.18,42.78,55.56C42.78,58.260000000000005,42.84,80.95,42.86,91.63C42.86,94.08,42.87,95.89,42.87,96.69999999999999"/>
<path id="省-s6"  class="stroke" stroke="#0982bf" d="M43.82,53.31C48.86,52.81,68.78999999999999,50.150000000000006,75.38,49.42C79.14,49,80.75999999999999,50.5,80.75999999999999,53.63C80.75999999999999,58.95,80.71999999999998,76.67,80.71999999999998,90.38C80.71999999999998,92.1,80.71999999999998,93.75,80.71999999999998,95.31"/>
<path id="省-s7"  class="stroke" stroke="#0909bf" d="M44.01,65.33C55.87,64.5,72.62,63.12,79.56,62.9"/>
<path id="省-s8"  class="stroke" stroke="#8209bf" d="M44.05,78.66C53.4,78.08,68.88,77,79.39,76.85"/>
<path id="省-s9"  class="stroke" stroke="#bf0982" d="M44.16,93.04C53,92.75,70.55,91.5,79.62,91.5"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="省-bg1"  class="badge-group"><circle cx="55.6" cy="11.75" r="3.5" fill="#bf0909"/><text class="num-single" x="55.6" y="11.75" dx="0" dy="-0.5">1</text></g>
<g id="省-bg2"  class="badge-group"><circle cx="35.88" cy="24.75" r="3.5" fill="#bf8209"/><text class="num-single" x="35.88" y="24.75" dx="0" dy="-0.5">2</text></g>
<g id="省-bg3"  class="badge-group"><circle cx="76.67" cy="20.92" r="3.5" fill="#82bf09"/><text class="num-single" x="76.67" y="20.92" dx="0" dy="-0.5">3</text></g>
<g id="省-bg4"  class="badge-group"><circle cx="69.75" cy="25.75" r="3.5" fill="#09bf09"/><text class="num-single" x="69.75" y="25.75" dx="0" dy="-0.5">4</text></g>
<g id="省-bg5"  class="badge-group"><circle cx="41.25" cy="47.89" r="3.5" fill="#09bf82"/><text class="num-single" x="41.25" y="47.89" dx="0" dy="-0.5">5</text></g>
<g id="省-bg6"  class="badge-group"><circle cx="43.82" cy="56.81" r="3.5" fill="#0982bf"/><text class="num-single" x="43.82" y="56.81" dx="0" dy="-0.5">6</text></g>
<g id="省-bg7"  class="badge-group"><circle cx="44.01" cy="65.33" r="3.5" fill="#0909bf"/><text class="num-single" x="44.01" y="65.33" dx="0" dy="-0.5">7</text></g>
<g id="省-bg8"  class="badge-group"><circle cx="44.05" cy="78.66" r="3.5" fill="#8209bf"/><text class="num-single" x="44.05" y="78.66" dx="0" dy="-0.5">8</text></g>
<g id="省-bg9"  class="badge-group"><circle cx="44.16" cy="93.04" r="3.5" fill="#bf0982"/><text class="num-single" x="44.16" y="93.04" dx="0" dy="-0.5">9</text></g>
</svg>