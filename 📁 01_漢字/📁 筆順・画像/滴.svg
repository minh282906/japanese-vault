<path id="滴-s10"  class="stroke" stroke="#0923bf" d="M50.01,57.47C51.66,57.96,53.22,57.76,54.89,57.57C59.9,57,69.32,55.6,75.38,55.15C76.96,55.03,78.91,54.72,80.5,55.01"/>
