<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (滴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #滴-bg[i]: Thời gian quả bóng số nảy lên
   - #滴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#滴-bg1  { animation-delay: 0.05s; }
#滴-s1   { stroke-dasharray: 13.1350; stroke-dashoffset: 13.1350; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#滴-bg2  { animation-delay: 0.42s; }
#滴-s2   { stroke-dasharray: 13.1348; stroke-dashoffset: 13.1348; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#滴-bg3  { animation-delay: 0.79s; }
#滴-s3   { stroke-dasharray: 22.8339; stroke-dashoffset: 22.8339; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#滴-bg4  { animation-delay: 1.16s; }
#滴-s4   { stroke-dasharray: 11.9028; stroke-dashoffset: 11.9028; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#滴-bg5  { animation-delay: 1.53s; }
#滴-s5   { stroke-dasharray: 51.3382; stroke-dashoffset: 51.3382; animation: drawStroke 0.28s ease-out 1.66s forwards; }
#滴-bg6  { animation-delay: 1.96s; }
#滴-s6   { stroke-dasharray: 12.7325; stroke-dashoffset: 12.7325; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#滴-bg7  { animation-delay: 2.33s; }
#滴-s7   { stroke-dasharray: 14.5031; stroke-dashoffset: 14.5031; animation: drawStroke 0.22s ease-out 2.46s forwards; }
#滴-bg8  { animation-delay: 2.70s; }
#滴-s8   { stroke-dasharray: 51.2976; stroke-dashoffset: 51.2976; animation: drawStroke 0.28s ease-out 2.83s forwards; }
#滴-bg9  { animation-delay: 3.13s; }
#滴-s9   { stroke-dasharray: 107.2040; stroke-dashoffset: 107.2040; animation: drawStroke 0.55s ease-out 3.26s forwards; }
#滴-bg10  { animation-delay: 3.83s; }
#滴-s10   { stroke-dasharray: 30.6904; stroke-dashoffset: 30.6904; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#滴-bg11  { animation-delay: 4.20s; }
#滴-s11   { stroke-dasharray: 19.2845; stroke-dashoffset: 19.2845; animation: drawStroke 0.22s ease-out 4.33s forwards; }
#滴-bg12  { animation-delay: 4.57s; }
#滴-s12   { stroke-dasharray: 16.5187; stroke-dashoffset: 16.5187; animation: drawStroke 0.22s ease-out 4.70s forwards; }
#滴-bg13  { animation-delay: 4.94s; }
#滴-s13   { stroke-dasharray: 33.2044; stroke-dashoffset: 33.2044; animation: drawStroke 0.22s ease-out 5.07s forwards; }
#滴-bg14  { animation-delay: 5.31s; }
#滴-s14   { stroke-dasharray: 18.1983; stroke-dashoffset: 18.1983; animation: drawStroke 0.22s ease-out 5.44s forwards; }
]]>
</style>

