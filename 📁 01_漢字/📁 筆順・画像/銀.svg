<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (銀)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #銀-bg[i]: Thời gian quả bóng số nảy lên
   - #銀-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#銀-bg1  { animation-delay: 0.05s; }
#銀-s1   { stroke-dasharray: 37.3310; stroke-dashoffset: 37.3310; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#銀-bg2  { animation-delay: 0.42s; }
#銀-s2   { stroke-dasharray: 17.0322; stroke-dashoffset: 17.0322; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#銀-bg3  { animation-delay: 0.79s; }
#銀-s3   { stroke-dasharray: 21.3149; stroke-dashoffset: 21.3149; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#銀-bg4  { animation-delay: 1.16s; }
#銀-s4   { stroke-dasharray: 32.5986; stroke-dashoffset: 32.5986; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#銀-bg5  { animation-delay: 1.53s; }
#銀-s5   { stroke-dasharray: 38.8918; stroke-dashoffset: 38.8918; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#銀-bg6  { animation-delay: 1.90s; }
#銀-s6   { stroke-dasharray: 12.2481; stroke-dashoffset: 12.2481; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#銀-bg7  { animation-delay: 2.27s; }
#銀-s7   { stroke-dasharray: 12.3427; stroke-dashoffset: 12.3427; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#銀-bg8  { animation-delay: 2.64s; }
#銀-s8   { stroke-dasharray: 34.0798; stroke-dashoffset: 34.0798; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#銀-bg9  { animation-delay: 3.01s; }
#銀-s9   { stroke-dasharray: 54.5869; stroke-dashoffset: 54.5869; animation: drawStroke 0.30s ease-out 3.14s forwards; }
#銀-bg10  { animation-delay: 3.46s; }
#銀-s10   { stroke-dasharray: 22.1201; stroke-dashoffset: 22.1201; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#銀-bg11  { animation-delay: 3.83s; }
#銀-s11   { stroke-dasharray: 20.3797; stroke-dashoffset: 20.3797; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#銀-bg12  { animation-delay: 4.20s; }
#銀-s12   { stroke-dasharray: 86.6908; stroke-dashoffset: 86.6908; animation: drawStroke 0.48s ease-out 4.33s forwards; }
#銀-bg13  { animation-delay: 4.83s; }
#銀-s13   { stroke-dasharray: 20.6849; stroke-dashoffset: 20.6849; animation: drawStroke 0.22s ease-out 4.96s forwards; }
#銀-bg14  { animation-delay: 5.20s; }
#銀-s14   { stroke-dasharray: 49.3903; stroke-dashoffset: 49.3903; animation: drawStroke 0.27s ease-out 5.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

