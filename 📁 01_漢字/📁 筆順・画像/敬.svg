<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (敬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #敬-bg[i]: Thời gian quả bóng số nảy lên
   - #敬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#敬-bg1  { animation-delay: 0.05s; }
#敬-s1   { stroke-dasharray: 43.9503; stroke-dashoffset: 43.9503; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#敬-bg2  { animation-delay: 0.44s; }
#敬-s2   { stroke-dasharray: 19.0024; stroke-dashoffset: 19.0024; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#敬-bg3  { animation-delay: 0.81s; }
#敬-s3   { stroke-dasharray: 21.4264; stroke-dashoffset: 21.4264; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#敬-bg4  { animation-delay: 1.18s; }
#敬-s4   { stroke-dasharray: 26.8446; stroke-dashoffset: 26.8446; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#敬-bg5  { animation-delay: 1.55s; }
#敬-s5   { stroke-dasharray: 80.0973; stroke-dashoffset: 80.0973; animation: drawStroke 0.44s ease-out 1.68s forwards; }
#敬-bg6  { animation-delay: 2.14s; }
#敬-s6   { stroke-dasharray: 16.3445; stroke-dashoffset: 16.3445; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#敬-bg7  { animation-delay: 2.51s; }
#敬-s7   { stroke-dasharray: 28.2586; stroke-dashoffset: 28.2586; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#敬-bg8  { animation-delay: 2.88s; }
#敬-s8   { stroke-dasharray: 12.4467; stroke-dashoffset: 12.4467; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#敬-bg9  { animation-delay: 3.25s; }
#敬-s9   { stroke-dasharray: 36.8634; stroke-dashoffset: 36.8634; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#敬-bg10  { animation-delay: 3.62s; }
#敬-s10   { stroke-dasharray: 25.0106; stroke-dashoffset: 25.0106; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#敬-bg11  { animation-delay: 3.99s; }
#敬-s11   { stroke-dasharray: 60.9430; stroke-dashoffset: 60.9430; animation: drawStroke 0.34s ease-out 4.12s forwards; }
#敬-bg12  { animation-delay: 4.48s; }
#敬-s12   { stroke-dasharray: 48.8802; stroke-dashoffset: 48.8802; animation: drawStroke 0.27s ease-out 4.61s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

