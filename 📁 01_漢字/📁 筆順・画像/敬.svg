<path id="敬-s9"  class="stroke" stroke="#0909bf" d="M69.19,16.64C69.5,17.62,69.64,18.61,69.38,19.77C67.72,27.2,63.74,41.1,58,51.37"/>
<path id="敬-s10"  class="stroke" stroke="#6409bf" d="M67.08,38.15C68.28,38.339999999999996,69.46,38.309999999999995,70.64999999999999,38.059999999999995C75.05,37.41,80.99,35.72,86.77999999999999,34.349999999999994C88.07,34.03999999999999,90.37999999999998,33.879999999999995,91.60999999999999,34.14999999999999"/>
<path id="敬-s11"  class="stroke" stroke="#bf09bf" d="M78.38,41.24C78.83,42.52,78.86999999999999,43.690000000000005,78.36,46.010000000000005C74,65.62,66.38,84.38,50.08,92.25"/>
