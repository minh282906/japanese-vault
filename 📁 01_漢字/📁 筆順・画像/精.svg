<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (精)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #精-bg[i]: Thời gian quả bóng số nảy lên
   - #精-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#精-bg1  { animation-delay: 0.05s; }
#精-s1   { stroke-dasharray: 13.3583; stroke-dashoffset: 13.3583; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#精-bg2  { animation-delay: 0.42s; }
#精-s2   { stroke-dasharray: 14.3637; stroke-dashoffset: 14.3637; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#精-bg3  { animation-delay: 0.79s; }
#精-s3   { stroke-dasharray: 32.2084; stroke-dashoffset: 32.2084; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#精-bg4  { animation-delay: 1.16s; }
#精-s4   { stroke-dasharray: 81.5033; stroke-dashoffset: 81.5033; animation: drawStroke 0.45s ease-out 1.29s forwards; }
#精-bg5  { animation-delay: 1.76s; }
#精-s5   { stroke-dasharray: 39.6872; stroke-dashoffset: 39.6872; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#精-bg6  { animation-delay: 2.13s; }
#精-s6   { stroke-dasharray: 13.9565; stroke-dashoffset: 13.9565; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#精-bg7  { animation-delay: 2.50s; }
#精-s7   { stroke-dasharray: 33.7418; stroke-dashoffset: 33.7418; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#精-bg8  { animation-delay: 2.87s; }
#精-s8   { stroke-dasharray: 29.7366; stroke-dashoffset: 29.7366; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#精-bg9  { animation-delay: 3.24s; }
#精-s9   { stroke-dasharray: 31.5088; stroke-dashoffset: 31.5088; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#精-bg10  { animation-delay: 3.61s; }
#精-s10   { stroke-dasharray: 48.6380; stroke-dashoffset: 48.6380; animation: drawStroke 0.27s ease-out 3.74s forwards; }
#精-bg11  { animation-delay: 4.03s; }
#精-s11   { stroke-dasharray: 45.7783; stroke-dashoffset: 45.7783; animation: drawStroke 0.25s ease-out 4.16s forwards; }
#精-bg12  { animation-delay: 4.43s; }
#精-s12   { stroke-dasharray: 78.7223; stroke-dashoffset: 78.7223; animation: drawStroke 0.43s ease-out 4.56s forwards; }
#精-bg13  { animation-delay: 5.01s; }
#精-s13   { stroke-dasharray: 26.0360; stroke-dashoffset: 26.0360; animation: drawStroke 0.22s ease-out 5.14s forwards; }
#精-bg14  { animation-delay: 5.38s; }
#精-s14   { stroke-dasharray: 26.2311; stroke-dashoffset: 26.2311; animation: drawStroke 0.22s ease-out 5.51s forwards; }
]]>
</style>

