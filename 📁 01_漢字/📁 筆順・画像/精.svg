<path id="精-s9"  class="stroke" stroke="#0971bf" d="M53.64,32.82C55.33,33.31,57.32,33.24,59,32.910000000000004C65.62,31.630000000000003,74.6,30.760000000000005,79.99,30.190000000000005C81.63,30.020000000000003,83.25999999999999,29.930000000000003,84.91,30.020000000000003"/>
<path id="精-s10"  class="stroke" stroke="#0923bf" d="M48.38,44.39C50.96,44.910000000000004,53.410000000000004,44.67,55.980000000000004,44.31C65.98,42.89,78.58000000000001,41.45,90.13,40.74C92.36,40.6,95,40.760000000000005,96.75,41.17"/>
