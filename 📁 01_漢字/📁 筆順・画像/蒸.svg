<path id="蒸-s8"  class="stroke" stroke="#0995bf" d="M62.3,53.29C64.73,53.66,77.1,63.81,85,68.87C86.39,69.76,89.62,71.62,91.62,72.52000000000001"/>
<path id="蒸-s9"  class="stroke" stroke="#0941bf" d="M31.9,79.04C34.5,79.5,36.98,79.34,39.37,79.12C48.3,78.29,59.959999999999994,76.44,69.62,76.18C71.73,76.12,73.85000000000001,76.09,75.93,76.48"/>
<path id="蒸-s10"  class="stroke" stroke="#2509bf" d="M23.08,85.68C23.08,90.59,16.47,97.84,14.749999999999998,99.25"/>
<path id="蒸-s11"  class="stroke" stroke="#7909bf" d="M39.13,85.87C41.78,88.2,44.290000000000006,94.62,44.95,98.25"/>
<path id="蒸-s12"  class="stroke" stroke="#bf09b1" d="M58.18,85.55C61.24,87.81,66.07,94.85,66.84,98.37"/>
<path id="蒸-s13"  class="stroke" stroke="#bf095d" d="M80.42,84.52C84.36,87.11,90.59,95.17999999999999,91.58,99.22"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
