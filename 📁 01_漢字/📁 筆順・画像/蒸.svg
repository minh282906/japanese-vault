<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (蒸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #蒸-bg[i]: Thời gian quả bóng số nảy lên
   - #蒸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#蒸-bg1  { animation-delay: 0.05s; }
#蒸-s1   { stroke-dasharray: 65.0025; stroke-dashoffset: 65.0025; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#蒸-bg2  { animation-delay: 0.56s; }
#蒸-s2   { stroke-dasharray: 19.4320; stroke-dashoffset: 19.4320; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#蒸-bg3  { animation-delay: 0.93s; }
#蒸-s3   { stroke-dasharray: 19.4356; stroke-dashoffset: 19.4356; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#蒸-bg4  { animation-delay: 1.30s; }
#蒸-s4   { stroke-dasharray: 48.5849; stroke-dashoffset: 48.5849; animation: drawStroke 0.27s ease-out 1.43s forwards; }
#蒸-bg5  { animation-delay: 1.72s; }
#蒸-s5   { stroke-dasharray: 32.4640; stroke-dashoffset: 32.4640; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#蒸-bg6  { animation-delay: 2.09s; }
#蒸-s6   { stroke-dasharray: 58.9524; stroke-dashoffset: 58.9524; animation: drawStroke 0.32s ease-out 2.22s forwards; }
#蒸-bg7  { animation-delay: 2.56s; }
#蒸-s7   { stroke-dasharray: 20.3169; stroke-dashoffset: 20.3169; animation: drawStroke 0.22s ease-out 2.69s forwards; }
#蒸-bg8  { animation-delay: 2.93s; }
#蒸-s8   { stroke-dasharray: 35.1425; stroke-dashoffset: 35.1425; animation: drawStroke 0.22s ease-out 3.06s forwards; }
#蒸-bg9  { animation-delay: 3.30s; }
#蒸-s9   { stroke-dasharray: 44.2255; stroke-dashoffset: 44.2255; animation: drawStroke 0.24s ease-out 3.43s forwards; }
#蒸-bg10  { animation-delay: 3.69s; }
#蒸-s10   { stroke-dasharray: 16.2551; stroke-dashoffset: 16.2551; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#蒸-bg11  { animation-delay: 4.06s; }
#蒸-s11   { stroke-dasharray: 13.8534; stroke-dashoffset: 13.8534; animation: drawStroke 0.22s ease-out 4.19s forwards; }
#蒸-bg12  { animation-delay: 4.43s; }
#蒸-s12   { stroke-dasharray: 15.6612; stroke-dashoffset: 15.6612; animation: drawStroke 0.22s ease-out 4.56s forwards; }
#蒸-bg13  { animation-delay: 4.80s; }
#蒸-s13   { stroke-dasharray: 18.7019; stroke-dashoffset: 18.7019; animation: drawStroke 0.22s ease-out 4.93s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

