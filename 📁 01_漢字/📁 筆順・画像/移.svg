<g id="移-bg9"  class="badge-group"><circle cx="74.42" cy="45" r="3.5" fill="#4b09bf"/><text class="num-single" x="74.42" y="45" dx="0" dy="-0.5">9</text></g>
<g id="移-bg10" class="badge-group"><circle cx="74.33" cy="54.44" r="3.5" fill="#ae09bf"/><text class="num-double" x="74.33" y="54.44" dx="-0.4" dy="-0.475">10</text></g>
<g id="移-bg11" class="badge-group"><circle cx="64" cy="66.5" r="3.5" fill="#bf096c"/><text class="num-double" x="64" y="66.5" dx="-0.4" dy="-0.475">11</text></g>
</svg>