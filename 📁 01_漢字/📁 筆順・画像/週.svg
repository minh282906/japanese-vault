<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (週)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #週-bg[i]: Thời gian quả bóng số nảy lên
   - #週-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#週-bg1  { animation-delay: 0.05s; }
#週-s1   { stroke-dasharray: 65.1492; stroke-dashoffset: 65.1492; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#週-bg2  { animation-delay: 0.56s; }
#週-s2   { stroke-dasharray: 113.7990; stroke-dashoffset: 113.7990; animation: drawStroke 0.55s ease-out 0.69s forwards; }
#週-bg3  { animation-delay: 1.26s; }
#週-s3   { stroke-dasharray: 23.6746; stroke-dashoffset: 23.6746; animation: drawStroke 0.22s ease-out 1.39s forwards; }
#週-bg4  { animation-delay: 1.63s; }
#週-s4   { stroke-dasharray: 20.6113; stroke-dashoffset: 20.6113; animation: drawStroke 0.22s ease-out 1.76s forwards; }
#週-bg5  { animation-delay: 2.00s; }
#週-s5   { stroke-dasharray: 28.4116; stroke-dashoffset: 28.4116; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#週-bg6  { animation-delay: 2.37s; }
#週-s6   { stroke-dasharray: 16.8641; stroke-dashoffset: 16.8641; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#週-bg7  { animation-delay: 2.74s; }
#週-s7   { stroke-dasharray: 30.5073; stroke-dashoffset: 30.5073; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#週-bg8  { animation-delay: 3.11s; }
#週-s8   { stroke-dasharray: 16.8291; stroke-dashoffset: 16.8291; animation: drawStroke 0.22s ease-out 3.24s forwards; }
#週-bg9  { animation-delay: 3.48s; }
#週-s9   { stroke-dasharray: 12.0592; stroke-dashoffset: 12.0592; animation: drawStroke 0.22s ease-out 3.61s forwards; }
#週-bg10  { animation-delay: 3.85s; }
#週-s10   { stroke-dasharray: 61.4089; stroke-dashoffset: 61.4089; animation: drawStroke 0.34s ease-out 3.98s forwards; }
#週-bg11  { animation-delay: 4.34s; }
#週-s11   { stroke-dasharray: 80.6588; stroke-dashoffset: 80.6588; animation: drawStroke 0.44s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #週-s[i]) -->
<path id="週-s1"  class="stroke" stroke="#bf0909" d="M45.93,17.66C46.95,18.68,47.6,20.21,47.6,21.96C47.6,43,50.13,67.5,39.5,80.75"/>
