<path id="週-s6"  class="stroke" stroke="#09bf8d" d="M56.17,53.75C57.25,54.5,57.77,55.76,57.88,56.72C58.38,61.25,58.93,63.35,59.36,66.99C59.53,68.44999999999999,59.66,69.57,59.7,69.92999999999999"/>
<path id="週-s7"  class="stroke" stroke="#098dbf" d="M58.6,55.4C64.46000000000001,54.01,72.29,52.57,74.89,52.379999999999995C76.62,52.24999999999999,77.37,53.379999999999995,77.17,54.959999999999994C76.79,57.879999999999995,75.83,60.89999999999999,75.05,64.57"/>
<path id="週-s8"  class="stroke" stroke="#092abf" d="M60.65,67.64C62.97,67.2,68.95,66.54,73.75,66.01C75.18,65.85000000000001,76.44,65.73,77.36,65.67"/>
<path id="週-s9"  class="stroke" stroke="#4b09bf" d="M20.71,19C23.810000000000002,20.41,28.73,24.8,29.5,27"/>
<path id="週-s10"  class="stroke" stroke="#ae09bf" d="M13.25,54.95C15.5,55.870000000000005,17.54,55.790000000000006,18.5,55.43C21,54.5,26.810000000000002,51.37,28.25,50.75C31.13,49.51,32.39,51.65,29.75,54.53C23.37,61.510000000000005,23.75,62.760000000000005,29,68.63C30.83,70.67,31.03,72.07,27.5,74.75C22.25,78.75,20,80.5,16.75,83.25"/>
<path id="週-s11"  class="stroke" stroke="#bf096c" d="M13.75,85.75C17.87,84.87,24.16,84.78,28.75,85.25C36,86,58.72,90.38,63.25,91.25C76.25,93.75,84.5,95.75,93.5,94"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="週-bg1"  class="badge-group"><circle cx="45.93" cy="14.16" r="3.5" fill="#bf0909"/><text class="num-single" x="45.93" y="14.16" dx="0" dy="-0.5">1</text></g>
