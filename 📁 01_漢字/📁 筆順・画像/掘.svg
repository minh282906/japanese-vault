<path id="掘-s9"  class="stroke" stroke="#4b09bf" d="M87.93,48.6C88.73,49.4,89,50.63,88.82000000000001,52.21C88.37,56.25,88.35000000000001,57.45,87.78,61.760000000000005C87.65,62.75000000000001,87.48,63.93000000000001,87.26,65.35000000000001"/>
<path id="掘-s10"  class="stroke" stroke="#ae09bf" d="M53.58,77.4C54.339999999999996,78.16000000000001,54.5,79.63000000000001,54.379999999999995,80.51C54.06999999999999,82.74000000000001,53.35999999999999,86.09,52.279999999999994,90.63000000000001C51.82999999999999,92.53000000000002,52.46999999999999,92.81000000000002,54.10999999999999,92.34C63.74999999999999,89.62,79.8,88.35000000000001,89.19,87.89"/>
<path id="掘-s11"  class="stroke" stroke="#bf096c" d="M90.59,73.18C91.51,74.11000000000001,92.01,75.14,91.77000000000001,77.04C91.25000000000001,81.25,90.85000000000001,84.35000000000001,90.35000000000001,87.55000000000001C90.10000000000001,89.12,89.80000000000001,90.77000000000001,89.46000000000001,92.62"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="掘-bg1"  class="badge-group"><circle cx="13" cy="39.42" r="3.5" fill="#bf0909"/><text class="num-single" x="13" y="39.42" dx="0" dy="-0.5">1</text></g>
