<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (掘)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #掘-bg[i]: Thời gian quả bóng số nảy lên
   - #掘-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#掘-bg1  { animation-delay: 0.05s; }
#掘-s1   { stroke-dasharray: 29.4846; stroke-dashoffset: 29.4846; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#掘-bg2  { animation-delay: 0.42s; }
#掘-s2   { stroke-dasharray: 85.4880; stroke-dashoffset: 85.4880; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#掘-bg3  { animation-delay: 1.04s; }
#掘-s3   { stroke-dasharray: 29.4622; stroke-dashoffset: 29.4622; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#掘-bg4  { animation-delay: 1.41s; }
#掘-s4   { stroke-dasharray: 51.4856; stroke-dashoffset: 51.4856; animation: drawStroke 0.28s ease-out 1.54s forwards; }
#掘-bg5  { animation-delay: 1.84s; }
#掘-s5   { stroke-dasharray: 33.8282; stroke-dashoffset: 33.8282; animation: drawStroke 0.22s ease-out 1.97s forwards; }
#掘-bg6  { animation-delay: 2.21s; }
#掘-s6   { stroke-dasharray: 66.3114; stroke-dashoffset: 66.3114; animation: drawStroke 0.36s ease-out 2.34s forwards; }
#掘-bg7  { animation-delay: 2.72s; }
#掘-s7   { stroke-dasharray: 47.1605; stroke-dashoffset: 47.1605; animation: drawStroke 0.26s ease-out 2.85s forwards; }
#掘-bg8  { animation-delay: 3.13s; }
#掘-s8   { stroke-dasharray: 44.6597; stroke-dashoffset: 44.6597; animation: drawStroke 0.25s ease-out 3.26s forwards; }
#掘-bg9  { animation-delay: 3.53s; }
#掘-s9   { stroke-dasharray: 17.0833; stroke-dashoffset: 17.0833; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#掘-bg10  { animation-delay: 3.90s; }
#掘-s10   { stroke-dasharray: 52.6540; stroke-dashoffset: 52.6540; animation: drawStroke 0.29s ease-out 4.03s forwards; }
#掘-bg11  { animation-delay: 4.34s; }
#掘-s11   { stroke-dasharray: 19.9614; stroke-dashoffset: 19.9614; animation: drawStroke 0.22s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

