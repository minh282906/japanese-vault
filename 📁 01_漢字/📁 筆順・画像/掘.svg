<path id="掘-s1"  class="stroke" stroke="#bf0909" d="M13,39.42C15.15,39.68,16.88,40.11,19.14,39.82C23.87,39.21,31.3,37.54,38.019999999999996,36.57C39.419999999999995,36.37,40.87,36.38,42.16,36.51"/>
