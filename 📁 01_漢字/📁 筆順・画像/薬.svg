<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (薬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #薬-bg[i]: Thời gian quả bóng số nảy lên
   - #薬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#薬-bg1  { animation-delay: 0.05s; }
#薬-s1   { stroke-dasharray: 72.7210; stroke-dashoffset: 72.7210; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#薬-bg2  { animation-delay: 0.60s; }
#薬-s2   { stroke-dasharray: 19.5906; stroke-dashoffset: 19.5906; animation: drawStroke 0.22s ease-out 0.73s forwards; }
#薬-bg3  { animation-delay: 0.97s; }
#薬-s3   { stroke-dasharray: 19.8148; stroke-dashoffset: 19.8148; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#薬-bg4  { animation-delay: 1.34s; }
#薬-s4   { stroke-dasharray: 8.4526; stroke-dashoffset: 8.4526; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#薬-bg5  { animation-delay: 1.71s; }
#薬-s5   { stroke-dasharray: 22.2631; stroke-dashoffset: 22.2631; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#薬-bg6  { animation-delay: 2.08s; }
#薬-s6   { stroke-dasharray: 45.8039; stroke-dashoffset: 45.8039; animation: drawStroke 0.25s ease-out 2.21s forwards; }
#薬-bg7  { animation-delay: 2.48s; }
#薬-s7   { stroke-dasharray: 21.5449; stroke-dashoffset: 21.5449; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#薬-bg8  { animation-delay: 2.85s; }
#薬-s8   { stroke-dasharray: 19.4406; stroke-dashoffset: 19.4406; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#薬-bg9  { animation-delay: 3.22s; }
#薬-s9   { stroke-dasharray: 13.1192; stroke-dashoffset: 13.1192; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#薬-bg10  { animation-delay: 3.59s; }
#薬-s10   { stroke-dasharray: 18.5100; stroke-dashoffset: 18.5100; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#薬-bg11  { animation-delay: 3.96s; }
#薬-s11   { stroke-dasharray: 14.6685; stroke-dashoffset: 14.6685; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#薬-bg12  { animation-delay: 4.33s; }
#薬-s12   { stroke-dasharray: 16.3298; stroke-dashoffset: 16.3298; animation: drawStroke 0.22s ease-out 4.46s forwards; }
#薬-bg13  { animation-delay: 4.70s; }
#薬-s13   { stroke-dasharray: 75.7130; stroke-dashoffset: 75.7130; animation: drawStroke 0.42s ease-out 4.83s forwards; }
#薬-bg14  { animation-delay: 5.27s; }
#薬-s14   { stroke-dasharray: 37.4642; stroke-dashoffset: 37.4642; animation: drawStroke 0.22s ease-out 5.40s forwards; }
#薬-bg15  { animation-delay: 5.64s; }
#薬-s15   { stroke-dasharray: 41.9745; stroke-dashoffset: 41.9745; animation: drawStroke 0.23s ease-out 5.77s forwards; }
#薬-bg16  { animation-delay: 6.02s; }
#薬-s16   { stroke-dasharray: 41.9718; stroke-dashoffset: 41.9718; animation: drawStroke 0.23s ease-out 6.15s forwards; }
]]>
</style>

