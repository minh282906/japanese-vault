<g id="胸-bg8"  class="badge-group"><circle cx="56.83" cy="45.25" r="3.5" fill="#2d09bf"/><text class="num-single" x="56.83" y="45.25" dx="0" dy="-0.5">8</text></g>
<g id="胸-bg9"  class="badge-group"><circle cx="48.32" cy="48.4" r="3.5" fill="#9a09bf"/><text class="num-single" x="48.32" y="48.4" dx="0" dy="-0.5">9</text></g>
<g id="胸-bg10" class="badge-group"><circle cx="81.14" cy="42.84" r="3.5" fill="#bf0976"/><text class="num-double" x="81.14" y="42.84" dx="-0.4" dy="-0.475">10</text></g>
</svg>