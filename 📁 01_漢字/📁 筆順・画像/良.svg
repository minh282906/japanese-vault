<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (良)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #良-bg[i]: Thời gian quả bóng số nảy lên
   - #良-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#良-bg1  { animation-delay: 0.05s; }
#良-s1   { stroke-dasharray: 14.1732; stroke-dashoffset: 14.1732; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#良-bg2  { animation-delay: 0.42s; }
#良-s2   { stroke-dasharray: 73.1892; stroke-dashoffset: 73.1892; animation: drawStroke 0.40s ease-out 0.55s forwards; }
#良-bg3  { animation-delay: 0.97s; }
#良-s3   { stroke-dasharray: 37.5447; stroke-dashoffset: 37.5447; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#良-bg4  { animation-delay: 1.34s; }
#良-s4   { stroke-dasharray: 34.9500; stroke-dashoffset: 34.9500; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#良-bg5  { animation-delay: 1.71s; }
#良-s5   { stroke-dasharray: 89.0285; stroke-dashoffset: 89.0285; animation: drawStroke 0.49s ease-out 1.84s forwards; }
#良-bg6  { animation-delay: 2.35s; }
#良-s6   { stroke-dasharray: 23.8920; stroke-dashoffset: 23.8920; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#良-bg7  { animation-delay: 2.72s; }
#良-s7   { stroke-dasharray: 58.9376; stroke-dashoffset: 58.9376; animation: drawStroke 0.32s ease-out 2.85s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #良-s[i]) -->
<path id="良-s1"  class="stroke" stroke="#bf0909" d="M51.34,9.75C52.230000000000004,10.64,52.620000000000005,12.25,52.620000000000005,13.53C52.620000000000005,15.52,52.68000000000001,20.63,52.68000000000001,23.619999999999997"/>
<path id="良-s2"  class="stroke" stroke="#bfa509" d="M31.12,26.12C32.24,26.87,33.99,27.21,35.870000000000005,26.92C47.620000000000005,25.12,69.06,22.490000000000002,71.41,22.360000000000003C73.71,22.240000000000002,75.11999999999999,23.860000000000003,75.02,25.640000000000004C74.77,30.010000000000005,73.08,40.260000000000005,71.42,48.400000000000006C71.15,49.71000000000001,70.88,50.970000000000006,70.62,52.150000000000006"/>
<path id="良-s3"  class="stroke" stroke="#3dbf09" d="M35.19,39.95C45.75,38.370000000000005,65.17,36.370000000000005,72.50999999999999,35.910000000000004"/>
<path id="良-s4"  class="stroke" stroke="#09bf71" d="M35.33,53.33C46.379999999999995,52.129999999999995,58.769999999999996,51.1,70.14,50.22"/>
<path id="良-s5"  class="stroke" stroke="#0971bf" d="M32.51,27.24C33.629999999999995,28.36,34.12,29.95,34.12,31.119999999999997C34.12,35.75,34.22,85.87,34.22,90.69C34.22,93.23,35.25,95.5,37.839999999999996,93.64C42.8,90.07000000000001,46.75,87,52.75,82.25"/>
<path id="良-s6"  class="stroke" stroke="#3d09bf" d="M82.05,52.69C82.25,54.25,81.61999999999999,55.559999999999995,80.50999999999999,56.699999999999996C78.75999999999999,58.49999999999999,72.00999999999999,64.61999999999999,65.63999999999999,69.19"/>
<path id="良-s7"  class="stroke" stroke="#bf09a5" d="M44.32,61.84C50.04,61.84,79.56,86.7,83.96000000000001,89.17C87.87,91.37,89.87,92.49,93.57000000000001,93.54"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="良-bg1"  class="badge-group"><circle cx="51.34" cy="9.75" r="3.5" fill="#bf0909"/><text class="num-single" x="51.34" y="9.75" dx="0" dy="-0.5">1</text></g>
<g id="良-bg2"  class="badge-group"><circle cx="31.12" cy="22.62" r="3.5" fill="#bfa509"/><text class="num-single" x="31.12" y="22.62" dx="0" dy="-0.5">2</text></g>
<g id="良-bg3"  class="badge-group"><circle cx="35.19" cy="39.95" r="3.5" fill="#3dbf09"/><text class="num-single" x="35.19" y="39.95" dx="0" dy="-0.5">3</text></g>
<g id="良-bg4"  class="badge-group"><circle cx="35.33" cy="53.33" r="3.5" fill="#09bf71"/><text class="num-single" x="35.33" y="53.33" dx="0" dy="-0.5">4</text></g>
<g id="良-bg5"  class="badge-group"><circle cx="32.51" cy="30.74" r="3.5" fill="#0971bf"/><text class="num-single" x="32.51" y="30.74" dx="0" dy="-0.5">5</text></g>
<g id="良-bg6"  class="badge-group"><circle cx="82.05" cy="52.69" r="3.5" fill="#3d09bf"/><text class="num-single" x="82.05" y="52.69" dx="0" dy="-0.5">6</text></g>
<g id="良-bg7"  class="badge-group"><circle cx="44.32" cy="61.84" r="3.5" fill="#bf09a5"/><text class="num-single" x="44.32" y="61.84" dx="0" dy="-0.5">7</text></g>
</svg>