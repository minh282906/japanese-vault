<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (元)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #元-bg[i]: Thời gian quả bóng số nảy lên
   - #元-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#元-bg1  { animation-delay: 0.05s; }
#元-s1   { stroke-dasharray: 45.3166; stroke-dashoffset: 45.3166; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#元-bg2  { animation-delay: 0.45s; }
#元-s2   { stroke-dasharray: 72.2465; stroke-dashoffset: 72.2465; animation: drawStroke 0.40s ease-out 0.58s forwards; }
#元-bg3  { animation-delay: 1.00s; }
#元-s3   { stroke-dasharray: 53.9833; stroke-dashoffset: 53.9833; animation: drawStroke 0.30s ease-out 1.13s forwards; }
#元-bg4  { animation-delay: 1.45s; }
#元-s4   { stroke-dasharray: 89.3815; stroke-dashoffset: 89.3815; animation: drawStroke 0.49s ease-out 1.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #元-s[i]) -->
<path id="元-s1"  class="stroke" stroke="#bf0909" d="M28.59,21.36C30.37,21.689999999999998,33.63,21.84,35.41,21.689999999999998C46.25,20.749999999999996,56.92999999999999,19.119999999999997,67.49,18.659999999999997C70.44999999999999,18.529999999999998,72.24,18.819999999999997,73.72,18.979999999999997"/>
<path id="元-s2"  class="stroke" stroke="#64bf09" d="M16.13,44.06C18.29,44.53,22.009999999999998,44.68,24.169999999999998,44.53C42.25,43.26,60.879999999999995,40.63,80.56,40.03C84.16,39.92,86.33,40.25,88.13,40.49"/>
<path id="元-s3"  class="stroke" stroke="#09bfbf" d="M41.29,46.69C41.88,47.87,42.03,49.66,41.65,51.129999999999995C38.75,62.489999999999995,32.87,79.11999999999999,16.25,92.49"/>
<path id="元-s4"  class="stroke" stroke="#6409bf" d="M56.7,44.12C58.230000000000004,45.65,58.7,47.23,58.7,49.78C58.7,59.370000000000005,58.71,69.27,58.71,77.75C58.71,92.13,59.74,93.37,76.99000000000001,93.37C91.87,93.37,93.13000000000001,92.25,93.13000000000001,80.68"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="元-bg1"  class="badge-group"><circle cx="28.59" cy="21.36" r="3.5" fill="#bf0909"/><text class="num-single" x="28.59" y="21.36" dx="0" dy="-0.5">1</text></g>
<g id="元-bg2"  class="badge-group"><circle cx="16.13" cy="44.06" r="3.5" fill="#64bf09"/><text class="num-single" x="16.13" y="44.06" dx="0" dy="-0.5">2</text></g>
<g id="元-bg3"  class="badge-group"><circle cx="41.29" cy="46.69" r="3.5" fill="#09bfbf"/><text class="num-single" x="41.29" y="46.69" dx="0" dy="-0.5">3</text></g>
<g id="元-bg4"  class="badge-group"><circle cx="56.7" cy="44.12" r="3.5" fill="#6409bf"/><text class="num-single" x="56.7" y="44.12" dx="0" dy="-0.5">4</text></g>
</svg>