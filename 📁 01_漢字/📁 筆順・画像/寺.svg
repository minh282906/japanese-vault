<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (寺)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #寺-bg[i]: Thời gian quả bóng số nảy lên
   - #寺-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#寺-bg1  { animation-delay: 0.05s; }
#寺-s1   { stroke-dasharray: 49.5823; stroke-dashoffset: 49.5823; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#寺-bg2  { animation-delay: 0.47s; }
#寺-s2   { stroke-dasharray: 32.8879; stroke-dashoffset: 32.8879; animation: drawStroke 0.22s ease-out 0.60s forwards; }
#寺-bg3  { animation-delay: 0.84s; }
#寺-s3   { stroke-dasharray: 81.4648; stroke-dashoffset: 81.4648; animation: drawStroke 0.45s ease-out 0.97s forwards; }
#寺-bg4  { animation-delay: 1.44s; }
#寺-s4   { stroke-dasharray: 69.5594; stroke-dashoffset: 69.5594; animation: drawStroke 0.38s ease-out 1.57s forwards; }
#寺-bg5  { animation-delay: 1.97s; }
#寺-s5   { stroke-dasharray: 57.4809; stroke-dashoffset: 57.4809; animation: drawStroke 0.32s ease-out 2.10s forwards; }
#寺-bg6  { animation-delay: 2.44s; }
#寺-s6   { stroke-dasharray: 14.2160; stroke-dashoffset: 14.2160; animation: drawStroke 0.22s ease-out 2.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #寺-s[i]) -->
<path id="寺-s1"  class="stroke" stroke="#bf0909" d="M29.88,28.28C31.54,28.59,33.75,28.880000000000003,36.25,28.59C46.480000000000004,27.41,60.629999999999995,26,73.44,25.28C76.2,25.12,77.87,25.43,79.25999999999999,25.580000000000002"/>
<path id="寺-s2"  class="stroke" stroke="#bfbf09" d="M52.55,10.37C53.75,11.5,54.37,12.989999999999998,54.37,14.969999999999999C54.37,23.419999999999998,54.5,41.87,54.5,42.76"/>
<path id="寺-s3"  class="stroke" stroke="#09bf09" d="M13.38,45.54C16.09,46.18,21.07,46.39,23.770000000000003,46.18C44.63,44.62,69.13,42.71,85.15,42.24C89.66000000000001,42.11,92.37,42.550000000000004,94.63000000000001,42.870000000000005"/>
<path id="寺-s4"  class="stroke" stroke="#09bfbf" d="M21.13,64.99C23.029999999999998,65.44999999999999,26.52,65.53,28.43,65.44999999999999C44.629999999999995,64.74999999999999,68.63,62.249999999999986,83.85,61.80999999999999C87.02,61.719999999999985,88.91999999999999,62.02999999999999,90.50999999999999,62.249999999999986"/>
<path id="寺-s5"  class="stroke" stroke="#0909bf" d="M66.07,49.33C67.05999999999999,50.32,67.72,52.12,67.72,54.14C67.72,66.18,67.57,89.06,67.57,93.16C67.57,102.99,61.60999999999999,94.63,59.60999999999999,93.36999999999999"/>
<path id="寺-s6"  class="stroke" stroke="#bf09bf" d="M36,74.25C39.18,76.15,44.21,82.05,45,85"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="寺-bg1"  class="badge-group"><circle cx="29.88" cy="28.28" r="3.5" fill="#bf0909"/><text class="num-single" x="29.88" y="28.28" dx="0" dy="-0.5">1</text></g>
<g id="寺-bg2"  class="badge-group"><circle cx="52.55" cy="10.37" r="3.5" fill="#bfbf09"/><text class="num-single" x="52.55" y="10.37" dx="0" dy="-0.5">2</text></g>
<g id="寺-bg3"  class="badge-group"><circle cx="13.38" cy="45.54" r="3.5" fill="#09bf09"/><text class="num-single" x="13.38" y="45.54" dx="0" dy="-0.5">3</text></g>
<g id="寺-bg4"  class="badge-group"><circle cx="21.13" cy="64.99" r="3.5" fill="#09bfbf"/><text class="num-single" x="21.13" y="64.99" dx="0" dy="-0.5">4</text></g>
<g id="寺-bg5"  class="badge-group"><circle cx="66.07" cy="49.33" r="3.5" fill="#0909bf"/><text class="num-single" x="66.07" y="49.33" dx="0" dy="-0.5">5</text></g>
<g id="寺-bg6"  class="badge-group"><circle cx="36" cy="74.25" r="3.5" fill="#bf09bf"/><text class="num-single" x="36" y="74.25" dx="0" dy="-0.5">6</text></g>
</svg>