<path id="靴-s8"  class="stroke" stroke="#0995bf" d="M10.81,75.04C12.63,75.75,15.11,75.64,16.9,75.33000000000001C24.04,74.08000000000001,33.64,72.61000000000001,40.37,71.87000000000002C41.91,71.70000000000002,43.379999999999995,71.62000000000002,44.949999999999996,71.96000000000002"/>
<path id="靴-s9"  class="stroke" stroke="#0941bf" d="M27.99,40.41C28.61,40.86,29.11,42.449999999999996,29.11,43.36C29.11,47.31,29.07,72.6,29.06,89.25C29.06,91.62,29.06,93.82,29.06,95.75"/>
<path id="靴-s10"  class="stroke" stroke="#2509bf" d="M59.7,22.51C60.13,23.880000000000003,60.11,25.240000000000002,59.57,26.92C56.25,37.25,52.5,48,44.25,62.18"/>
<path id="靴-s11"  class="stroke" stroke="#7909bf" d="M53.12,48.59C54.21,49.68000000000001,54.629999999999995,51.13,54.629999999999995,53.25C54.629999999999995,61.17,54.65,79.63,54.66,89.38C54.66,91.64,54.66,93.42,54.66,94.5"/>
