<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (靴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #靴-bg[i]: Thời gian quả bóng số nảy lên
   - #靴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#靴-bg1  { animation-delay: 0.05s; }
#靴-s1   { stroke-dasharray: 38.4632; stroke-dashoffset: 38.4632; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#靴-bg2  { animation-delay: 0.42s; }
#靴-s2   { stroke-dasharray: 24.1239; stroke-dashoffset: 24.1239; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#靴-bg3  { animation-delay: 0.79s; }
#靴-s3   { stroke-dasharray: 22.5418; stroke-dashoffset: 22.5418; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#靴-bg4  { animation-delay: 1.16s; }
#靴-s4   { stroke-dasharray: 14.1646; stroke-dashoffset: 14.1646; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#靴-bg5  { animation-delay: 1.53s; }
#靴-s5   { stroke-dasharray: 17.5384; stroke-dashoffset: 17.5384; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#靴-bg6  { animation-delay: 1.90s; }
#靴-s6   { stroke-dasharray: 38.1796; stroke-dashoffset: 38.1796; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#靴-bg7  { animation-delay: 2.27s; }
#靴-s7   { stroke-dasharray: 22.6708; stroke-dashoffset: 22.6708; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#靴-bg8  { animation-delay: 2.64s; }
#靴-s8   { stroke-dasharray: 34.4939; stroke-dashoffset: 34.4939; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#靴-bg9  { animation-delay: 3.01s; }
#靴-s9   { stroke-dasharray: 55.6209; stroke-dashoffset: 55.6209; animation: drawStroke 0.31s ease-out 3.14s forwards; }
#靴-bg10  { animation-delay: 3.47s; }
#靴-s10   { stroke-dasharray: 43.0203; stroke-dashoffset: 43.0203; animation: drawStroke 0.24s ease-out 3.60s forwards; }
#靴-bg11  { animation-delay: 3.86s; }
#靴-s11   { stroke-dasharray: 46.2870; stroke-dashoffset: 46.2870; animation: drawStroke 0.25s ease-out 3.99s forwards; }
#靴-bg12  { animation-delay: 4.26s; }
#靴-s12   { stroke-dasharray: 25.7326; stroke-dashoffset: 25.7326; animation: drawStroke 0.22s ease-out 4.39s forwards; }
#靴-bg13  { animation-delay: 4.63s; }
#靴-s13   { stroke-dasharray: 101.0550; stroke-dashoffset: 101.0550; animation: drawStroke 0.55s ease-out 4.76s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

