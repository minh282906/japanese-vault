<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (満)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #満-bg[i]: Thời gian quả bóng số nảy lên
   - #満-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#満-bg1  { animation-delay: 0.05s; }
#満-s1   { stroke-dasharray: 13.4095; stroke-dashoffset: 13.4095; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#満-bg2  { animation-delay: 0.42s; }
#満-s2   { stroke-dasharray: 13.3491; stroke-dashoffset: 13.3491; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#満-bg3  { animation-delay: 0.79s; }
#満-s3   { stroke-dasharray: 25.4952; stroke-dashoffset: 25.4952; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#満-bg4  { animation-delay: 1.16s; }
#満-s4   { stroke-dasharray: 55.0613; stroke-dashoffset: 55.0613; animation: drawStroke 0.30s ease-out 1.29s forwards; }
#満-bg5  { animation-delay: 1.61s; }
#満-s5   { stroke-dasharray: 26.2125; stroke-dashoffset: 26.2125; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#満-bg6  { animation-delay: 1.98s; }
#満-s6   { stroke-dasharray: 26.4018; stroke-dashoffset: 26.4018; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#満-bg7  { animation-delay: 2.35s; }
#満-s7   { stroke-dasharray: 59.2235; stroke-dashoffset: 59.2235; animation: drawStroke 0.33s ease-out 2.48s forwards; }
#満-bg8  { animation-delay: 2.83s; }
#満-s8   { stroke-dasharray: 38.6599; stroke-dashoffset: 38.6599; animation: drawStroke 0.22s ease-out 2.96s forwards; }
#満-bg9  { animation-delay: 3.20s; }
#満-s9   { stroke-dasharray: 102.0000; stroke-dashoffset: 102.0000; animation: drawStroke 0.55s ease-out 3.33s forwards; }
#満-bg10  { animation-delay: 3.90s; }
#満-s10   { stroke-dasharray: 34.4742; stroke-dashoffset: 34.4742; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#満-bg11  { animation-delay: 4.27s; }
#満-s11   { stroke-dasharray: 37.2693; stroke-dashoffset: 37.2693; animation: drawStroke 0.22s ease-out 4.40s forwards; }
#満-bg12  { animation-delay: 4.64s; }
#満-s12   { stroke-dasharray: 17.2823; stroke-dashoffset: 17.2823; animation: drawStroke 0.22s ease-out 4.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

