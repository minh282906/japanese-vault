<path id="満-s9"  class="stroke" stroke="#0909bf" d="M41.75,57.27C49.19,56.74,86.6,52,88.07,51.9C92.25,51.62,93.94,53.49,93.94,58.269999999999996C93.94,61.04,93.63,79.66999999999999,92.66,91.58C92,99.62,87.25,92.87,85.50999999999999,90.8"/>
<path id="満-s10"  class="stroke" stroke="#6409bf" d="M64.8,43.91C65.63,44.739999999999995,66.05,45.87,66.05,47.239999999999995C66.05,47.949999999999996,65.99,73.67999999999999,65.89999999999999,78.06"/>
<path id="満-s11"  class="stroke" stroke="#bf09bf" d="M53.41,67.46C54.23,68.27999999999999,54.5,69.5,54.36,70.75C54.019999999999996,73.88,53.87,75.5,53.58,78C53.379999999999995,79.73,54.42,81.19,55.699999999999996,80.94C62.24999999999999,79.62,70.86999999999999,78.37,77.66999999999999,77.53"/>
<path id="満-s12"  class="stroke" stroke="#bf0964" d="M78.22,64.99C79.05,65.82,79.25,67.13,79.17999999999999,68.32C78.99999999999999,71.27999999999999,78.86999999999999,74.16999999999999,78.74999999999999,77.25C78.68999999999998,78.78,78.63999999999999,80.36,78.57999999999998,82.02"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
