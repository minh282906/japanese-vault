<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (歯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #歯-bg[i]: Thời gian quả bóng số nảy lên
   - #歯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#歯-bg1  { animation-delay: 0.05s; }
#歯-s1   { stroke-dasharray: 27.5220; stroke-dashoffset: 27.5220; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#歯-bg2  { animation-delay: 0.42s; }
#歯-s2   { stroke-dasharray: 24.0269; stroke-dashoffset: 24.0269; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#歯-bg3  { animation-delay: 0.79s; }
#歯-s3   { stroke-dasharray: 19.4787; stroke-dashoffset: 19.4787; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#歯-bg4  { animation-delay: 1.16s; }
#歯-s4   { stroke-dasharray: 78.3852; stroke-dashoffset: 78.3852; animation: drawStroke 0.43s ease-out 1.29s forwards; }
#歯-bg5  { animation-delay: 1.74s; }
#歯-s5   { stroke-dasharray: 11.0936; stroke-dashoffset: 11.0936; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#歯-bg6  { animation-delay: 2.11s; }
#歯-s6   { stroke-dasharray: 12.1482; stroke-dashoffset: 12.1482; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#歯-bg7  { animation-delay: 2.48s; }
#歯-s7   { stroke-dasharray: 43.8471; stroke-dashoffset: 43.8471; animation: drawStroke 0.24s ease-out 2.61s forwards; }
#歯-bg8  { animation-delay: 2.87s; }
#歯-s8   { stroke-dasharray: 41.3309; stroke-dashoffset: 41.3309; animation: drawStroke 0.23s ease-out 3.00s forwards; }
#歯-bg9  { animation-delay: 3.25s; }
#歯-s9   { stroke-dasharray: 26.2487; stroke-dashoffset: 26.2487; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#歯-bg10  { animation-delay: 3.62s; }
#歯-s10   { stroke-dasharray: 18.6629; stroke-dashoffset: 18.6629; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#歯-bg11  { animation-delay: 3.99s; }
#歯-s11   { stroke-dasharray: 105.5850; stroke-dashoffset: 105.5850; animation: drawStroke 0.55s ease-out 4.12s forwards; }
#歯-bg12  { animation-delay: 4.69s; }
#歯-s12   { stroke-dasharray: 52.4175; stroke-dashoffset: 52.4175; animation: drawStroke 0.29s ease-out 4.82s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #歯-s[i]) -->
<path id="歯-s1"  class="stroke" stroke="#bf0909" d="M52.25,12C53.5,13.25,54.19,14.879999999999999,54.19,16.75C54.19,22.88,54.379999999999995,30.869999999999997,54.47,39"/>
<path id="歯-s2"  class="stroke" stroke="#bf6409" d="M55.49,25.75C62.03,25.05,67.25,24.25,74.51,23.37C76.05000000000001,23.18,77.80000000000001,22.89,79.34,23.25"/>
