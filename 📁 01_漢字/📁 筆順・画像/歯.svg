<g id="歯-bg9"  class="badge-group"><circle cx="51.48" cy="63.2" r="3.5" fill="#0909bf"/><text class="num-single" x="51.48" y="63.2" dx="0" dy="-0.5">9</text></g>
<g id="歯-bg10" class="badge-group"><circle cx="58.25" cy="68.62" r="3.5" fill="#6409bf"/><text class="num-double" x="58.25" y="68.62" dx="-0.4" dy="-0.475">10</text></g>
<g id="歯-bg11" class="badge-group"><circle cx="24.06" cy="50.88" r="3.5" fill="#bf09bf"/><text class="num-double" x="24.06" y="50.88" dx="-0.4" dy="-0.475">11</text></g>
