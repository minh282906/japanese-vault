<path id="歯-s5"  class="stroke" stroke="#09bf09" d="M36.88,49.38C39.300000000000004,50.99,42.95,55.550000000000004,43.550000000000004,58.050000000000004"/>
<path id="歯-s6"  class="stroke" stroke="#09bf64" d="M69.91,46.78C69.88,47.620000000000005,69.67,48.660000000000004,69.05,49.5C67.3,51.88,64.85,54.5,62.75,56.25"/>
<path id="歯-s7"  class="stroke" stroke="#09bfbf" d="M32.69,63.52C35.25,64,37.339999999999996,63.96,39.12,63.77C47.37,62.88,63.269999999999996,61.02,71.12,60.57C72.67,60.48,74.77000000000001,60.42,76.33,60.74"/>
<path id="歯-s8"  class="stroke" stroke="#0964bf" d="M53.23,45.75C53.989999999999995,46.51,54.43,47.63,54.43,48.23C54.43,48.68,54.43,72.38,54.35,82.5C54.33,84.64,54.32,86.17,54.29,86.75"/>
<path id="歯-s9"  class="stroke" stroke="#0909bf" d="M51.48,63.2C51.48,63.870000000000005,51.3,64.64,50.88999999999999,65.26C47.13999999999999,71.03,39.96999999999999,78.19,33.28999999999999,81.31"/>
<path id="歯-s10"  class="stroke" stroke="#6409bf" d="M58.25,68.62C62.43,70.33,69.13,74.59,72.75,80"/>
<path id="歯-s11"  class="stroke" stroke="#bf09bf" d="M24.06,50.88C25.15,51.970000000000006,25.369999999999997,53.75,25.32,55.13C25.22,57.75,22.89,92.01,22.82,93.38S23.98,96.49,25.47,96.27C42.25,93.75,68.25,91.5,83.5,91"/>
<path id="歯-s12"  class="stroke" stroke="#bf0964" d="M84.04,44.88C85.21000000000001,46.050000000000004,85.61,47.5,85.61,49.13C85.61,49.93,85.17,71.41,84.83,90.25C84.78999999999999,92.51,84.75,94.74,84.7,96.88"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="歯-bg1"  class="badge-group"><circle cx="52.25" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="52.25" y="12" dx="0" dy="-0.5">1</text></g>
<g id="歯-bg2"  class="badge-group"><circle cx="55.49" cy="25.75" r="3.5" fill="#bf6409"/><text class="num-single" x="55.49" y="25.75" dx="0" dy="-0.5">2</text></g>
