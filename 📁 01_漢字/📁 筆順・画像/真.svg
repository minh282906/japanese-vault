<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (真)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #真-bg[i]: Thời gian quả bóng số nảy lên
   - #真-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#真-bg1  { animation-delay: 0.05s; }
#真-s1   { stroke-dasharray: 61.2056; stroke-dashoffset: 61.2056; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#真-bg2  { animation-delay: 0.54s; }
#真-s2   { stroke-dasharray: 24.0270; stroke-dashoffset: 24.0270; animation: drawStroke 0.22s ease-out 0.67s forwards; }
#真-bg3  { animation-delay: 0.91s; }
#真-s3   { stroke-dasharray: 38.6212; stroke-dashoffset: 38.6212; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#真-bg4  { animation-delay: 1.28s; }
#真-s4   { stroke-dasharray: 78.1794; stroke-dashoffset: 78.1794; animation: drawStroke 0.43s ease-out 1.41s forwards; }
#真-bg5  { animation-delay: 1.86s; }
#真-s5   { stroke-dasharray: 39.0485; stroke-dashoffset: 39.0485; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#真-bg6  { animation-delay: 2.23s; }
#真-s6   { stroke-dasharray: 37.5231; stroke-dashoffset: 37.5231; animation: drawStroke 0.22s ease-out 2.36s forwards; }
#真-bg7  { animation-delay: 2.60s; }
#真-s7   { stroke-dasharray: 35.3847; stroke-dashoffset: 35.3847; animation: drawStroke 0.22s ease-out 2.73s forwards; }
#真-bg8  { animation-delay: 2.97s; }
#真-s8   { stroke-dasharray: 78.8258; stroke-dashoffset: 78.8258; animation: drawStroke 0.43s ease-out 3.10s forwards; }
#真-bg9  { animation-delay: 3.55s; }
#真-s9   { stroke-dasharray: 26.9467; stroke-dashoffset: 26.9467; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#真-bg10  { animation-delay: 3.92s; }
#真-s10   { stroke-dasharray: 23.6656; stroke-dashoffset: 23.6656; animation: drawStroke 0.22s ease-out 4.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #真-s[i]) -->
<path id="真-s1"  class="stroke" stroke="#bf0909" d="M23.63,23.92C26.88,24.25,29.669999999999998,24.270000000000003,32.25,24C44.25,22.75,64.97999999999999,20.97,76,20.54C78.8,20.43,81.9,20.439999999999998,84.63,21.119999999999997"/>
<path id="真-s2"  class="stroke" stroke="#bf7609" d="M51.96,9C53,10,53.44,11.379999999999999,53.24,13.17C52.5,19.75,51.5,26.75,50.7,32.5"/>
<path id="真-s3"  class="stroke" stroke="#9abf09" d="M31.5,34.33C32.27,35.1,32.72,36.37,32.82,37.55C33.160000000000004,41.629999999999995,34.85,60.41,35.57,68.63C35.77,70.89999999999999,35.89,72.36,35.89,72.49"/>
<path id="真-s4"  class="stroke" stroke="#2dbf09" d="M33.88,35.7C40.25,35.13,67.28,31.92,70.57,31.740000000000002C73.30999999999999,31.590000000000003,75.21,33.260000000000005,75,36.400000000000006C74.5,43.75000000000001,74,52.75000000000001,73.19,66.62C73.14,67.5,73,68.88000000000001,72.98,70.16000000000001"/>
<path id="真-s5"  class="stroke" stroke="#09bf52" d="M34.82,46.58C48.5,45.38,65,43.75,73.74,43.46"/>
<path id="真-s6"  class="stroke" stroke="#09bfbf" d="M35.62,57.69C46.25,56.75,61.25,55.75,73.07,55.43"/>
<path id="真-s7"  class="stroke" stroke="#0952bf" d="M36.76,69.46C51,68.25,60.25,67.25,72.03,66.64"/>
<path id="真-s8"  class="stroke" stroke="#2d09bf" d="M16.25,80.12C18.43,80.74000000000001,22.42,80.87,24.6,80.74000000000001C38.120000000000005,79.89000000000001,65.63,77.63000000000001,87.25,77.02000000000001C90.88,76.92000000000002,93.06,77.32000000000001,94.87,77.63000000000001"/>
<path id="真-s9"  class="stroke" stroke="#9a09bf" d="M42,82.89C42.14,83.88,42.01,84.81,41.44,85.6C38.62,89.5,32.25,95.61999999999999,23.06,100.97"/>
<path id="真-s10"  class="stroke" stroke="#bf0976" d="M67.88,83.75C74.12,86.43,84,94.79,85.56,98.97"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="真-bg1"  class="badge-group"><circle cx="23.63" cy="23.92" r="3.5" fill="#bf0909"/><text class="num-single" x="23.63" y="23.92" dx="0" dy="-0.5">1</text></g>
<g id="真-bg2"  class="badge-group"><circle cx="51.96" cy="9" r="3.5" fill="#bf7609"/><text class="num-single" x="51.96" y="9" dx="0" dy="-0.5">2</text></g>
<g id="真-bg3"  class="badge-group"><circle cx="31.5" cy="30.83" r="3.5" fill="#9abf09"/><text class="num-single" x="31.5" y="30.83" dx="0" dy="-0.5">3</text></g>
<g id="真-bg4"  class="badge-group"><circle cx="33.88" cy="39.2" r="3.5" fill="#2dbf09"/><text class="num-single" x="33.88" y="39.2" dx="0" dy="-0.5">4</text></g>
<g id="真-bg5"  class="badge-group"><circle cx="34.82" cy="46.58" r="3.5" fill="#09bf52"/><text class="num-single" x="34.82" y="46.58" dx="0" dy="-0.5">5</text></g>
<g id="真-bg6"  class="badge-group"><circle cx="35.62" cy="57.69" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.62" y="57.69" dx="0" dy="-0.5">6</text></g>
<g id="真-bg7"  class="badge-group"><circle cx="36.76" cy="69.46" r="3.5" fill="#0952bf"/><text class="num-single" x="36.76" y="69.46" dx="0" dy="-0.5">7</text></g>
<g id="真-bg8"  class="badge-group"><circle cx="16.25" cy="80.12" r="3.5" fill="#2d09bf"/><text class="num-single" x="16.25" y="80.12" dx="0" dy="-0.5">8</text></g>
<g id="真-bg9"  class="badge-group"><circle cx="42" cy="82.89" r="3.5" fill="#9a09bf"/><text class="num-single" x="42" y="82.89" dx="0" dy="-0.5">9</text></g>
<g id="真-bg10" class="badge-group"><circle cx="67.88" cy="83.75" r="3.5" fill="#bf0976"/><text class="num-double" x="67.88" y="83.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>