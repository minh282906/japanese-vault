<g id="菜-bg6"  class="badge-group"><circle cx="48.71" cy="41.78" r="3.5" fill="#09bf8d"/><text class="num-single" x="48.71" y="41.78" dx="0" dy="-0.5">6</text></g>
<g id="菜-bg7"  class="badge-group"><circle cx="75.35" cy="35.75" r="3.5" fill="#098dbf"/><text class="num-single" x="75.35" y="35.75" dx="0" dy="-0.5">7</text></g>
<g id="菜-bg8"  class="badge-group"><circle cx="22.75" cy="65.43" r="3.5" fill="#092abf"/><text class="num-single" x="22.75" y="65.43" dx="0" dy="-0.5">8</text></g>
<g id="菜-bg9"  class="badge-group"><circle cx="52.75" cy="53.75" r="3.5" fill="#4b09bf"/><text class="num-single" x="52.75" y="53.75" dx="0" dy="-0.5">9</text></g>
<g id="菜-bg10" class="badge-group"><circle cx="51.25" cy="60.75" r="3.5" fill="#ae09bf"/><text class="num-double" x="51.25" y="60.75" dx="-0.4" dy="-0.475">10</text></g>
<g id="菜-bg11" class="badge-group"><circle cx="55.5" cy="68.5" r="3.5" fill="#bf096c"/><text class="num-double" x="55.5" y="68.5" dx="-0.4" dy="-0.475">11</text></g>
</svg>