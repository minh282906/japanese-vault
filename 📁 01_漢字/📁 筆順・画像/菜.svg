<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (菜)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #菜-bg[i]: Thời gian quả bóng số nảy lên
   - #菜-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#菜-bg1  { animation-delay: 0.05s; }
#菜-s1   { stroke-dasharray: 67.3300; stroke-dashoffset: 67.3300; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#菜-bg2  { animation-delay: 0.57s; }
#菜-s2   { stroke-dasharray: 18.6527; stroke-dashoffset: 18.6527; animation: drawStroke 0.22s ease-out 0.70s forwards; }
#菜-bg3  { animation-delay: 0.94s; }
#菜-s3   { stroke-dasharray: 19.2057; stroke-dashoffset: 19.2057; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#菜-bg4  { animation-delay: 1.31s; }
#菜-s4   { stroke-dasharray: 29.9972; stroke-dashoffset: 29.9972; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#菜-bg5  { animation-delay: 1.68s; }
#菜-s5   { stroke-dasharray: 11.3023; stroke-dashoffset: 11.3023; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#菜-bg6  { animation-delay: 2.05s; }
#菜-s6   { stroke-dasharray: 9.9827; stroke-dashoffset: 9.9827; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#菜-bg7  { animation-delay: 2.42s; }
#菜-s7   { stroke-dasharray: 18.9642; stroke-dashoffset: 18.9642; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#菜-bg8  { animation-delay: 2.79s; }
#菜-s8   { stroke-dasharray: 62.4025; stroke-dashoffset: 62.4025; animation: drawStroke 0.34s ease-out 2.92s forwards; }
#菜-bg9  { animation-delay: 3.28s; }
#菜-s9   { stroke-dasharray: 47.2198; stroke-dashoffset: 47.2198; animation: drawStroke 0.26s ease-out 3.41s forwards; }
#菜-bg10  { animation-delay: 3.69s; }
#菜-s10   { stroke-dasharray: 44.8016; stroke-dashoffset: 44.8016; animation: drawStroke 0.25s ease-out 3.82s forwards; }
#菜-bg11  { animation-delay: 4.09s; }
#菜-s11   { stroke-dasharray: 44.6611; stroke-dashoffset: 44.6611; animation: drawStroke 0.25s ease-out 4.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #菜-s[i]) -->
<path id="菜-s1"  class="stroke" stroke="#bf0909" d="M20,23.77C23,24.5,25.69,24.5,28.380000000000003,24.16C41.620000000000005,22.5,64.51,19.98,78.12,19.38C81.08,19.25,84.09,19.06,86.99000000000001,19.779999999999998"/>
<path id="菜-s2"  class="stroke" stroke="#bf6c09" d="M37,12.75C37.88,13.63,38.84,14.86,39,15.75C40.12,22,41.25,27.5,41.75,30.5"/>
<path id="菜-s3"  class="stroke" stroke="#aebf09" d="M68.75,9C69.17,10.18,69.55,11.51,69.25,13C68.5,16.75,67,21.75,65,27.5"/>
<path id="菜-s4"  class="stroke" stroke="#4bbf09" d="M58.62,28.5C58.62,29.1,58.29,29.99,57.849999999999994,30.43C55.75999999999999,32.5,46.56999999999999,36.76,31.739999999999995,39.59"/>
<path id="菜-s5"  class="stroke" stroke="#09bf2a" d="M30.77,45.83C32.9,47.339999999999996,36.78,52.54,37.31,54.89"/>
<path id="菜-s6"  class="stroke" stroke="#09bf8d" d="M48.71,41.78C50.69,43.21,53.81,47.67,54.3,49.9"/>
<path id="菜-s7"  class="stroke" stroke="#098dbf" d="M75.35,35.75C75.39999999999999,36.18,75.28999999999999,36.89,75,37.49C73.38,40.78,69.57,45.43,63.38,49.93"/>
<path id="菜-s8"  class="stroke" stroke="#092abf" d="M22.75,65.43C24.1,65.73,27.4,66.07000000000001,30.97,65.73C42.629999999999995,64.62,64.13,62.00000000000001,76.65,61.260000000000005C80.22,61.050000000000004,82.64,61.260000000000005,84.88000000000001,61.56"/>
<path id="菜-s9"  class="stroke" stroke="#4b09bf" d="M52.75,53.75C53.69,54.69,54.5,56.25,54.5,57.75C54.5,59.79,54.58,82.01,54.52,94.13C54.510000000000005,96.88,54.5,99.11999999999999,54.5,100.5"/>
<path id="菜-s10"  class="stroke" stroke="#ae09bf" d="M51.25,64.25C51.25,65.5,50.73,66.64,49.79,67.76C42.36,76.75,28.89,87.27,17.25,92"/>
<path id="菜-s11"  class="stroke" stroke="#bf096c" d="M55.5,65C59.63,68.01,75.72,80.6,83.59,86.35C86.17,88.24,88.5,89.61999999999999,91.88,90.61999999999999"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="菜-bg1"  class="badge-group"><circle cx="20" cy="23.77" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="23.77" dx="0" dy="-0.5">1</text></g>
<g id="菜-bg2"  class="badge-group"><circle cx="37" cy="12.75" r="3.5" fill="#bf6c09"/><text class="num-single" x="37" y="12.75" dx="0" dy="-0.5">2</text></g>
<g id="菜-bg3"  class="badge-group"><circle cx="68.75" cy="9" r="3.5" fill="#aebf09"/><text class="num-single" x="68.75" y="9" dx="0" dy="-0.5">3</text></g>
<g id="菜-bg4"  class="badge-group"><circle cx="58.62" cy="28.5" r="3.5" fill="#4bbf09"/><text class="num-single" x="58.62" y="28.5" dx="0" dy="-0.5">4</text></g>
