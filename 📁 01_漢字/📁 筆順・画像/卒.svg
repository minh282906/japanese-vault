<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (卒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #卒-bg[i]: Thời gian quả bóng số nảy lên
   - #卒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#卒-bg1  { animation-delay: 0.05s; }
#卒-s1   { stroke-dasharray: 12.6872; stroke-dashoffset: 12.6872; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#卒-bg2  { animation-delay: 0.42s; }
#卒-s2   { stroke-dasharray: 61.3168; stroke-dashoffset: 61.3168; animation: drawStroke 0.34s ease-out 0.55s forwards; }
#卒-bg3  { animation-delay: 0.91s; }
#卒-s3   { stroke-dasharray: 28.0351; stroke-dashoffset: 28.0351; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#卒-bg4  { animation-delay: 1.28s; }
#卒-s4   { stroke-dasharray: 13.8732; stroke-dashoffset: 13.8732; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#卒-bg5  { animation-delay: 1.65s; }
#卒-s5   { stroke-dasharray: 23.6741; stroke-dashoffset: 23.6741; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#卒-bg6  { animation-delay: 2.02s; }
#卒-s6   { stroke-dasharray: 22.2375; stroke-dashoffset: 22.2375; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#卒-bg7  { animation-delay: 2.39s; }
#卒-s7   { stroke-dasharray: 80.0164; stroke-dashoffset: 80.0164; animation: drawStroke 0.44s ease-out 2.52s forwards; }
#卒-bg8  { animation-delay: 2.98s; }
#卒-s8   { stroke-dasharray: 44.4680; stroke-dashoffset: 44.4680; animation: drawStroke 0.24s ease-out 3.11s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #卒-s[i]) -->
<path id="卒-s1"  class="stroke" stroke="#bf0909" d="M52.72,11.25C53.74,12.27,54.25,13.5,54.25,14.69C54.25,18.1,53.98,20.63,54.14,23.509999999999998"/>
<path id="卒-s2"  class="stroke" stroke="#bf9109" d="M24.45,26.31C26.97,26.88,30.02,26.66,31.669999999999998,26.5C44.5,25.26,65.12,23.509999999999998,78.98,22.84C81.77000000000001,22.7,83.45,22.88,85.54,23.39"/>
<path id="卒-s3"  class="stroke" stroke="#64bf09" d="M39.5,32.24C39.5,32.85,39.41,33.63,39.06,34.33C37.010000000000005,38.37,29.76,46.75,20.76,52.3"/>
<path id="卒-s4"  class="stroke" stroke="#09bf36" d="M39.62,40.62C43.01,42.22,47.339999999999996,46.47,49,50.5"/>
<path id="卒-s5"  class="stroke" stroke="#09bfbf" d="M70,30.74C70,31.349999999999998,70.16,32.12,69.83,32.82C68.17,36.36,63.91,42.8,56.01,49.16"/>
<path id="卒-s6"  class="stroke" stroke="#0936bf" d="M70.38,39.25C77.75999999999999,41.87,84.88,46.25,89,51"/>
<path id="卒-s7"  class="stroke" stroke="#6409bf" d="M14.88,67.59C17.34,68.13000000000001,21.86,68.35000000000001,24.3,68.13000000000001C42.75,66.50000000000001,72.12,64.50000000000001,86.02,64.15C89.89999999999999,64.05000000000001,92.25,64.49000000000001,94.61999999999999,65.18"/>
<path id="卒-s8"  class="stroke" stroke="#bf0991" d="M52.84,55C53.86000000000001,56.02,54.57,57.38,54.57,59.230000000000004C54.57,64,54.46,80.19,54.42,92.12C54.410000000000004,95.04,54.4,97.47,54.4,99"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="卒-bg1"  class="badge-group"><circle cx="52.72" cy="11.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.72" y="11.25" dx="0" dy="-0.5">1</text></g>
<g id="卒-bg2"  class="badge-group"><circle cx="24.45" cy="26.31" r="3.5" fill="#bf9109"/><text class="num-single" x="24.45" y="26.31" dx="0" dy="-0.5">2</text></g>
<g id="卒-bg3"  class="badge-group"><circle cx="39.5" cy="32.24" r="3.5" fill="#64bf09"/><text class="num-single" x="39.5" y="32.24" dx="0" dy="-0.5">3</text></g>
<g id="卒-bg4"  class="badge-group"><circle cx="39.62" cy="40.62" r="3.5" fill="#09bf36"/><text class="num-single" x="39.62" y="40.62" dx="0" dy="-0.5">4</text></g>
<g id="卒-bg5"  class="badge-group"><circle cx="70" cy="30.74" r="3.5" fill="#09bfbf"/><text class="num-single" x="70" y="30.74" dx="0" dy="-0.5">5</text></g>
<g id="卒-bg6"  class="badge-group"><circle cx="70.38" cy="39.25" r="3.5" fill="#0936bf"/><text class="num-single" x="70.38" y="39.25" dx="0" dy="-0.5">6</text></g>
<g id="卒-bg7"  class="badge-group"><circle cx="14.88" cy="67.59" r="3.5" fill="#6409bf"/><text class="num-single" x="14.88" y="67.59" dx="0" dy="-0.5">7</text></g>
<g id="卒-bg8"  class="badge-group"><circle cx="52.84" cy="55" r="3.5" fill="#bf0991"/><text class="num-single" x="52.84" y="55" dx="0" dy="-0.5">8</text></g>
</svg>