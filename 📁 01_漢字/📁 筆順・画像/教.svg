<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (教)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #教-bg[i]: Thời gian quả bóng số nảy lên
   - #教-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#教-bg1  { animation-delay: 0.05s; }
#教-s1   { stroke-dasharray: 28.5542; stroke-dashoffset: 28.5542; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#教-bg2  { animation-delay: 0.42s; }
#教-s2   { stroke-dasharray: 28.9892; stroke-dashoffset: 28.9892; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#教-bg3  { animation-delay: 0.79s; }
#教-s3   { stroke-dasharray: 42.4350; stroke-dashoffset: 42.4350; animation: drawStroke 0.23s ease-out 0.92s forwards; }
#教-bg4  { animation-delay: 1.17s; }
#教-s4   { stroke-dasharray: 62.6383; stroke-dashoffset: 62.6383; animation: drawStroke 0.34s ease-out 1.30s forwards; }
#教-bg5  { animation-delay: 1.66s; }
#教-s5   { stroke-dasharray: 32.6416; stroke-dashoffset: 32.6416; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#教-bg6  { animation-delay: 2.03s; }
#教-s6   { stroke-dasharray: 38.6413; stroke-dashoffset: 38.6413; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#教-bg7  { animation-delay: 2.40s; }
#教-s7   { stroke-dasharray: 32.9643; stroke-dashoffset: 32.9643; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#教-bg8  { animation-delay: 2.77s; }
#教-s8   { stroke-dasharray: 43.8366; stroke-dashoffset: 43.8366; animation: drawStroke 0.24s ease-out 2.90s forwards; }
#教-bg9  { animation-delay: 3.16s; }
#教-s9   { stroke-dasharray: 28.8964; stroke-dashoffset: 28.8964; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#教-bg10  { animation-delay: 3.53s; }
#教-s10   { stroke-dasharray: 62.8824; stroke-dashoffset: 62.8824; animation: drawStroke 0.35s ease-out 3.66s forwards; }
#教-bg11  { animation-delay: 4.03s; }
#教-s11   { stroke-dasharray: 55.2747; stroke-dashoffset: 55.2747; animation: drawStroke 0.30s ease-out 4.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #教-s[i]) -->
<path id="教-s1"  class="stroke" stroke="#bf0909" d="M15.82,30.26C16.81,30.490000000000002,18.63,30.630000000000003,19.62,30.490000000000002C25.87,29.630000000000003,34.25,28.380000000000003,40.650000000000006,27.53C42.28000000000001,27.310000000000002,43.300000000000004,27.64,44.120000000000005,27.75"/>
<path id="教-s2"  class="stroke" stroke="#bf6c09" d="M29.8,13.37C30.900000000000002,14.469999999999999,31.5,15.899999999999999,31.5,17.77C31.5,25.38,31.62,36.07,31.58,41.91"/>
