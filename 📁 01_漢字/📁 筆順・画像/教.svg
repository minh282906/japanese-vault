<g id="教-bg10" class="badge-group"><circle cx="81.07" cy="44.07" r="3.5" fill="#ae09bf"/><text class="num-double" x="81.07" y="44.07" dx="-0.4" dy="-0.475">10</text></g>
<g id="教-bg11" class="badge-group"><circle cx="57.5" cy="54.25" r="3.5" fill="#bf096c"/><text class="num-double" x="57.5" y="54.25" dx="-0.4" dy="-0.475">11</text></g>
</svg>