<path id="教-s4"  class="stroke" stroke="#4bbf09" d="M50.62,20.75C50.73,21.9,50.23,23.490000000000002,49.41,24.85C38.94,42.29,27.54,54.68,10.5,67.75"/>
<path id="教-s5"  class="stroke" stroke="#09bf2a" d="M29.5,54.75C30.06,54.99,31.38,54.86,32.25,54.75C35.25,54.37,40.12,53.84,43.25,53C46.5,52.12,47.25,53.25,44.81,56C42.02,59.14,39.28,62.11,36.190000000000005,64.81"/>
<path id="教-s6"  class="stroke" stroke="#09bf8d" d="M33.05,65.99C37.379999999999995,70.38,41.81999999999999,82.16999999999999,36.379999999999995,92.85C33.74999999999999,98,31.249999999999996,94.25,29.179999999999996,91.61"/>
<path id="教-s7"  class="stroke" stroke="#098dbf" d="M19.35,78.33C20.5,79.25,21.62,79.38,23.240000000000002,78.84C26.96,77.61,39.92,72.69,50.08,68.31"/>
<path id="教-s8"  class="stroke" stroke="#092abf" d="M70.25,15.38C70.5,16.630000000000003,70.29,17.82,69.89,19.11C67.12,28.009999999999998,61.49,43.18,51.74,54.51"/>
<path id="教-s9"  class="stroke" stroke="#4b09bf" d="M64.77,40.23C66.25,40.379999999999995,67.11999999999999,40.379999999999995,68.25,40.25C73.87,39.63,82.39,37.45,89.18,36.25C90.62,36,92,36,93.24,36.34"/>
<path id="教-s10"  class="stroke" stroke="#ae09bf" d="M81.07,44.07C81.6,45.3,81.66999999999999,46.69,81.08999999999999,48.93C76.5,66.5,66.62,85.25,48,94.25"/>
<path id="教-s11"  class="stroke" stroke="#bf096c" d="M57.5,54.25C62.62,57.75,79.07,80.31,89.18,89.33C91.33000000000001,91.25,93.75,93,95.87,93.5"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="教-bg1"  class="badge-group"><circle cx="15.82" cy="30.26" r="3.5" fill="#bf0909"/><text class="num-single" x="15.82" y="30.26" dx="0" dy="-0.5">1</text></g>
<g id="教-bg2"  class="badge-group"><circle cx="29.8" cy="13.37" r="3.5" fill="#bf6c09"/><text class="num-single" x="29.8" y="13.37" dx="0" dy="-0.5">2</text></g>
