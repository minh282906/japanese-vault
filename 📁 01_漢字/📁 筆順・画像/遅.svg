<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (遅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #遅-bg[i]: Thời gian quả bóng số nảy lên
   - #遅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#遅-bg1  { animation-delay: 0.05s; }
#遅-s1   { stroke-dasharray: 53.6520; stroke-dashoffset: 53.6520; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#遅-bg2  { animation-delay: 0.50s; }
#遅-s2   { stroke-dasharray: 34.3817; stroke-dashoffset: 34.3817; animation: drawStroke 0.22s ease-out 0.63s forwards; }
#遅-bg3  { animation-delay: 0.87s; }
#遅-s3   { stroke-dasharray: 63.1768; stroke-dashoffset: 63.1768; animation: drawStroke 0.35s ease-out 1.00s forwards; }
#遅-bg4  { animation-delay: 1.37s; }
#遅-s4   { stroke-dasharray: 8.3326; stroke-dashoffset: 8.3326; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#遅-bg5  { animation-delay: 1.74s; }
#遅-s5   { stroke-dasharray: 12.7685; stroke-dashoffset: 12.7685; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#遅-bg6  { animation-delay: 2.11s; }
#遅-s6   { stroke-dasharray: 36.1088; stroke-dashoffset: 36.1088; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#遅-bg7  { animation-delay: 2.48s; }
#遅-s7   { stroke-dasharray: 32.3325; stroke-dashoffset: 32.3325; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#遅-bg8  { animation-delay: 2.85s; }
#遅-s8   { stroke-dasharray: 44.5045; stroke-dashoffset: 44.5045; animation: drawStroke 0.24s ease-out 2.98s forwards; }
#遅-bg9  { animation-delay: 3.24s; }
#遅-s9   { stroke-dasharray: 38.1836; stroke-dashoffset: 38.1836; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#遅-bg10  { animation-delay: 3.61s; }
#遅-s10   { stroke-dasharray: 15.5192; stroke-dashoffset: 15.5192; animation: drawStroke 0.22s ease-out 3.74s forwards; }
#遅-bg11  { animation-delay: 3.98s; }
#遅-s11   { stroke-dasharray: 61.3261; stroke-dashoffset: 61.3261; animation: drawStroke 0.34s ease-out 4.11s forwards; }
#遅-bg12  { animation-delay: 4.47s; }
#遅-s12   { stroke-dasharray: 76.8229; stroke-dashoffset: 76.8229; animation: drawStroke 0.42s ease-out 4.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

