<path id="遅-s8"  class="stroke" stroke="#0964bf" d="M50.25,70.63C52.49,71.42999999999999,55.08,71.08,57.37,70.83C65.41,69.96,79.42,68.02,88.38,67.7C90.41,67.63000000000001,92.50999999999999,67.54,94.5,67.97"/>
<path id="遅-s9"  class="stroke" stroke="#0909bf" d="M70.65,48.56C71.48,49.39,71.67,50.620000000000005,71.67,52.120000000000005C71.67,58.63,71.81,67.62,71.74,81C71.72999999999999,82.91,71.72,84.76,71.72,86.5"/>
<path id="遅-s10"  class="stroke" stroke="#6409bf" d="M20.25,18.75C24.13,20.63,30.28,26.46,31.25,29.380000000000003"/>
<path id="遅-s11"  class="stroke" stroke="#bf09bf" d="M13.25,50.75C15.5,51.75,17,51.25,18,51S26.75,47.5,28.25,47S31.84,48.16,31,49.75C23.75,63.5,23,59,30.75,68.75C31.79,70.06,31.5,71.5,30,72.75S21,81,19.5,81.5"/>
<path id="遅-s12"  class="stroke" stroke="#bf0964" d="M15.25,83.5C18.25,83,24.21,81.95,28.75,82.75C37.25,84.25,57.5,89.75,63.25,91.25C75.35,94.41,80.5,95.5,90.5,95.75"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
