<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (憎)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #憎-bg[i]: Thời gian quả bóng số nảy lên
   - #憎-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#憎-bg1  { animation-delay: 0.05s; }
#憎-s1   { stroke-dasharray: 18.2863; stroke-dashoffset: 18.2863; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#憎-bg2  { animation-delay: 0.42s; }
#憎-s2   { stroke-dasharray: 12.9137; stroke-dashoffset: 12.9137; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#憎-bg3  { animation-delay: 0.79s; }
#憎-s3   { stroke-dasharray: 83.0449; stroke-dashoffset: 83.0449; animation: drawStroke 0.46s ease-out 0.92s forwards; }
#憎-bg4  { animation-delay: 1.40s; }
#憎-s4   { stroke-dasharray: 14.8721; stroke-dashoffset: 14.8721; animation: drawStroke 0.22s ease-out 1.53s forwards; }
#憎-bg5  { animation-delay: 1.77s; }
#憎-s5   { stroke-dasharray: 17.3267; stroke-dashoffset: 17.3267; animation: drawStroke 0.22s ease-out 1.90s forwards; }
#憎-bg6  { animation-delay: 2.14s; }
#憎-s6   { stroke-dasharray: 27.0058; stroke-dashoffset: 27.0058; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#憎-bg7  { animation-delay: 2.51s; }
#憎-s7   { stroke-dasharray: 73.9782; stroke-dashoffset: 73.9782; animation: drawStroke 0.41s ease-out 2.64s forwards; }
#憎-bg8  { animation-delay: 3.07s; }
#憎-s8   { stroke-dasharray: 21.1927; stroke-dashoffset: 21.1927; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#憎-bg9  { animation-delay: 3.44s; }
#憎-s9   { stroke-dasharray: 44.0101; stroke-dashoffset: 44.0101; animation: drawStroke 0.24s ease-out 3.57s forwards; }
#憎-bg10  { animation-delay: 3.83s; }
#憎-s10   { stroke-dasharray: 39.6145; stroke-dashoffset: 39.6145; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#憎-bg11  { animation-delay: 4.20s; }
#憎-s11   { stroke-dasharray: 31.3474; stroke-dashoffset: 31.3474; animation: drawStroke 0.22s ease-out 4.33s forwards; }
#憎-bg12  { animation-delay: 4.57s; }
#憎-s12   { stroke-dasharray: 61.7101; stroke-dashoffset: 61.7101; animation: drawStroke 0.34s ease-out 4.70s forwards; }
#憎-bg13  { animation-delay: 5.06s; }
#憎-s13   { stroke-dasharray: 28.9491; stroke-dashoffset: 28.9491; animation: drawStroke 0.22s ease-out 5.19s forwards; }
#憎-bg14  { animation-delay: 5.43s; }
#憎-s14   { stroke-dasharray: 28.7538; stroke-dashoffset: 28.7538; animation: drawStroke 0.22s ease-out 5.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

