<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (欧)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #欧-bg[i]: Thời gian quả bóng số nảy lên
   - #欧-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#欧-bg1  { animation-delay: 0.05s; }
#欧-s1   { stroke-dasharray: 37.8391; stroke-dashoffset: 37.8391; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#欧-bg2  { animation-delay: 0.42s; }
#欧-s2   { stroke-dasharray: 49.5191; stroke-dashoffset: 49.5191; animation: drawStroke 0.27s ease-out 0.55s forwards; }
#欧-bg3  { animation-delay: 0.84s; }
#欧-s3   { stroke-dasharray: 37.4475; stroke-dashoffset: 37.4475; animation: drawStroke 0.22s ease-out 0.97s forwards; }
#欧-bg4  { animation-delay: 1.21s; }
#欧-s4   { stroke-dasharray: 95.1695; stroke-dashoffset: 95.1695; animation: drawStroke 0.52s ease-out 1.34s forwards; }
#欧-bg5  { animation-delay: 1.88s; }
#欧-s5   { stroke-dasharray: 38.7745; stroke-dashoffset: 38.7745; animation: drawStroke 0.22s ease-out 2.01s forwards; }
#欧-bg6  { animation-delay: 2.25s; }
#欧-s6   { stroke-dasharray: 49.4980; stroke-dashoffset: 49.4980; animation: drawStroke 0.27s ease-out 2.38s forwards; }
#欧-bg7  { animation-delay: 2.67s; }
#欧-s7   { stroke-dasharray: 59.3673; stroke-dashoffset: 59.3673; animation: drawStroke 0.33s ease-out 2.80s forwards; }
#欧-bg8  { animation-delay: 3.15s; }
#欧-s8   { stroke-dasharray: 43.4313; stroke-dashoffset: 43.4313; animation: drawStroke 0.24s ease-out 3.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #欧-s[i]) -->
<path id="欧-s1"  class="stroke" stroke="#bf0909" d="M11.15,25.74C12.84,26.569999999999997,14.97,26.229999999999997,16.75,26.049999999999997C26.28,25.099999999999998,34.370000000000005,24.129999999999995,42.39,23.229999999999997C44.45,22.999999999999996,46.870000000000005,22.749999999999996,48.730000000000004,22.869999999999997"/>
<path id="欧-s2"  class="stroke" stroke="#bf9109" d="M42.2,32.54C42.550000000000004,33.61,42.38,34.94,41.870000000000005,36.83C38,51.25,31.75,65,20.76,76.17"/>
<path id="欧-s3"  class="stroke" stroke="#64bf09" d="M21.68,44.54C30.5,50.25,40.5,62.25,45.83,72.7"/>
<path id="欧-s4"  class="stroke" stroke="#09bf36" d="M12.43,26.76C13.34,27.67,13.68,28.75,13.68,30.25C13.68,43.5,13.68,81.35,13.68,84C13.68,86.75,14.75,88,17.23,87.67C24.880000000000003,86.65,41.35,84.46000000000001,43.3,84.46000000000001C45.419999999999995,84.46000000000001,47.22,84.17,48.53,84.59"/>
<path id="欧-s5"  class="stroke" stroke="#09bfbf" d="M63.07,15.25C63.25,16.25,63.3,17.42,62.98,18.59C60.75,26.75,55.25,38.5,47,50"/>
<path id="欧-s6"  class="stroke" stroke="#0936bf" d="M57.47,39.49C58.48,39.85,60.379999999999995,39.67,61.9,39.35C63.75,38.96,84.02,33.64,87.5,32.81C94.49,31.130000000000003,88.99,39.25,82.62,45.75"/>
<path id="欧-s7"  class="stroke" stroke="#6409bf" d="M67.04,45C67.5,46.25,67.67,48.13,67.41000000000001,49.9C65.12,65.25,58.5,86.62,43.5,97.25"/>
<path id="欧-s8"  class="stroke" stroke="#bf0991" d="M65.5,63C70.13,68.16,80,80.25,88.28,88.72C90.69,91.19,93.13,93,95.25,94.5"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="欧-bg1"  class="badge-group"><circle cx="11.15" cy="22.24" r="3.5" fill="#bf0909"/><text class="num-single" x="11.15" y="22.24" dx="0" dy="-0.5">1</text></g>
<g id="欧-bg2"  class="badge-group"><circle cx="42.2" cy="32.54" r="3.5" fill="#bf9109"/><text class="num-single" x="42.2" y="32.54" dx="0" dy="-0.5">2</text></g>
<g id="欧-bg3"  class="badge-group"><circle cx="21.68" cy="44.54" r="3.5" fill="#64bf09"/><text class="num-single" x="21.68" y="44.54" dx="0" dy="-0.5">3</text></g>
<g id="欧-bg4"  class="badge-group"><circle cx="12.43" cy="30.26" r="3.5" fill="#09bf36"/><text class="num-single" x="12.43" y="30.26" dx="0" dy="-0.5">4</text></g>
<g id="欧-bg5"  class="badge-group"><circle cx="63.07" cy="15.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="63.07" y="15.25" dx="0" dy="-0.5">5</text></g>
<g id="欧-bg6"  class="badge-group"><circle cx="57.47" cy="39.49" r="3.5" fill="#0936bf"/><text class="num-single" x="57.47" y="39.49" dx="0" dy="-0.5">6</text></g>
<g id="欧-bg7"  class="badge-group"><circle cx="67.04" cy="45" r="3.5" fill="#6409bf"/><text class="num-single" x="67.04" y="45" dx="0" dy="-0.5">7</text></g>
<g id="欧-bg8"  class="badge-group"><circle cx="65.5" cy="63" r="3.5" fill="#bf0991"/><text class="num-single" x="65.5" y="63" dx="0" dy="-0.5">8</text></g>
</svg>