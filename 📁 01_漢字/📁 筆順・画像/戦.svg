<path id="戦-s6"  class="stroke" stroke="#09bf41" d="M21.8,50.1C24.380000000000003,49.75,43.120000000000005,46.5,48.35,46.17"/>
<path id="戦-s7"  class="stroke" stroke="#09bf95" d="M22.84,60.36C30.31,58.97,38.34,57.96,46.519999999999996,57.11"/>
<path id="戦-s8"  class="stroke" stroke="#0995bf" d="M13.42,73.48C14.67,73.93,16.96,74.12,18.21,73.93C27.130000000000003,72.62,36.38,69.99000000000001,47.96,68.55000000000001C50.02,68.29,51.3,68.52000000000001,52.34,68.75000000000001"/>
<path id="戦-s9"  class="stroke" stroke="#0941bf" d="M33.31,39.75C34.2,41.04,34.59,42.41,34.5,43.87C34.5,53.78,34.48,77.59,34.48,89.72999999999999C34.48,92.74999999999999,34.379999999999995,94.24,34.379999999999995,95.99"/>
<path id="戦-s10"  class="stroke" stroke="#2509bf" d="M55,43.46C56.02,43.76,57.89,43.88,58.89,43.76C66.7,42.809999999999995,77.5,39.25,83.92,37.519999999999996C85.52,37.089999999999996,86.63,37.129999999999995,87.47,37.279999999999994"/>
<path id="戦-s11"  class="stroke" stroke="#7909bf" d="M63.06,14.25C64.4,15.97,65,16.44,65.23,20.14C67.13000000000001,50.5,75.88000000000001,79.25,91.64,91.53C96.69,95.46000000000001,95.9,92.27,95.24,84.66"/>
<path id="戦-s12"  class="stroke" stroke="#bf09b1" d="M84.49,47.33C84.46,48.97,84.08999999999999,50.51,83.39,51.94C79.41,60.98,70.84,75.1,53,86.5"/>
