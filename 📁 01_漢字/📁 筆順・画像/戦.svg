<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (戦)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #戦-bg[i]: Thời gian quả bóng số nảy lên
   - #戦-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#戦-bg1  { animation-delay: 0.05s; }
#戦-s1   { stroke-dasharray: 12.9527; stroke-dashoffset: 12.9527; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#戦-bg2  { animation-delay: 0.42s; }
#戦-s2   { stroke-dasharray: 14.9104; stroke-dashoffset: 14.9104; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#戦-bg3  { animation-delay: 0.79s; }
#戦-s3   { stroke-dasharray: 15.2465; stroke-dashoffset: 15.2465; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#戦-bg4  { animation-delay: 1.16s; }
#戦-s4   { stroke-dasharray: 24.5506; stroke-dashoffset: 24.5506; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#戦-bg5  { animation-delay: 1.53s; }
#戦-s5   { stroke-dasharray: 54.1862; stroke-dashoffset: 54.1862; animation: drawStroke 0.30s ease-out 1.66s forwards; }
#戦-bg6  { animation-delay: 1.98s; }
#戦-s6   { stroke-dasharray: 26.8442; stroke-dashoffset: 26.8442; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#戦-bg7  { animation-delay: 2.35s; }
#戦-s7   { stroke-dasharray: 23.9084; stroke-dashoffset: 23.9084; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#戦-bg8  { animation-delay: 2.72s; }
#戦-s8   { stroke-dasharray: 39.4956; stroke-dashoffset: 39.4956; animation: drawStroke 0.22s ease-out 2.85s forwards; }
#戦-bg9  { animation-delay: 3.09s; }
#戦-s9   { stroke-dasharray: 56.4934; stroke-dashoffset: 56.4934; animation: drawStroke 0.31s ease-out 3.22s forwards; }
#戦-bg10  { animation-delay: 3.55s; }
#戦-s10   { stroke-dasharray: 33.3282; stroke-dashoffset: 33.3282; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#戦-bg11  { animation-delay: 3.92s; }
#戦-s11   { stroke-dasharray: 97.1497; stroke-dashoffset: 97.1497; animation: drawStroke 0.53s ease-out 4.05s forwards; }
#戦-bg12  { animation-delay: 4.60s; }
#戦-s12   { stroke-dasharray: 51.4671; stroke-dashoffset: 51.4671; animation: drawStroke 0.28s ease-out 4.73s forwards; }
#戦-bg13  { animation-delay: 5.03s; }
#戦-s13   { stroke-dasharray: 15.2190; stroke-dashoffset: 15.2190; animation: drawStroke 0.22s ease-out 5.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

