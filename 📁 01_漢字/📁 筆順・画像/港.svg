<path id="港-s10"  class="stroke" stroke="#6409bf" d="M48.44,62.39C50.37,63,51.68,63.14,53.26,62.89C56.46,62.38,70.89,59.87,71.87,59.77C73.16000000000001,59.64,74.18,60.84,73.72,62.78C73.58,63.36,71.96,67.58,71.06,73.13"/>
<path id="港-s11"  class="stroke" stroke="#bf09bf" d="M47.5,75.12C48.38,75.74000000000001,50.23,76.19,51.62,76.12C56.5,75.87,63.12,74.74000000000001,68.63,74.22C70.36,74.05,71.61999999999999,73.75,72.72999999999999,73.92999999999999"/>
<path id="港-s12"  class="stroke" stroke="#bf0964" d="M48.36,75.6C49.07,76.30999999999999,49.42,77.25,49.42,78.5C49.42,80.78,49.34,83.11,49.34,85.26C49.34,93.51,50.88,94.81,65.39,94.81C81.51,94.81,82.96000000000001,93.26,82.96000000000001,85.35"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="港-bg1"  class="badge-group"><circle cx="19.25" cy="18.38" r="3.5" fill="#bf0909"/><text class="num-single" x="19.25" y="18.38" dx="0" dy="-0.5">1</text></g>
