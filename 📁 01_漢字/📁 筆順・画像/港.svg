<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (港)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #港-bg[i]: Thời gian quả bóng số nảy lên
   - #港-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#港-bg1  { animation-delay: 0.05s; }
#港-s1   { stroke-dasharray: 14.7643; stroke-dashoffset: 14.7643; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#港-bg2  { animation-delay: 0.42s; }
#港-s2   { stroke-dasharray: 15.0065; stroke-dashoffset: 15.0065; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#港-bg3  { animation-delay: 0.79s; }
#港-s3   { stroke-dasharray: 22.8320; stroke-dashoffset: 22.8320; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#港-bg4  { animation-delay: 1.16s; }
#港-s4   { stroke-dasharray: 42.1299; stroke-dashoffset: 42.1299; animation: drawStroke 0.23s ease-out 1.29s forwards; }
#港-bg5  { animation-delay: 1.54s; }
#港-s5   { stroke-dasharray: 28.3715; stroke-dashoffset: 28.3715; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#港-bg6  { animation-delay: 1.91s; }
#港-s6   { stroke-dasharray: 28.4416; stroke-dashoffset: 28.4416; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#港-bg7  { animation-delay: 2.28s; }
#港-s7   { stroke-dasharray: 60.7881; stroke-dashoffset: 60.7881; animation: drawStroke 0.33s ease-out 2.41s forwards; }
#港-bg8  { animation-delay: 2.76s; }
#港-s8   { stroke-dasharray: 33.1308; stroke-dashoffset: 33.1308; animation: drawStroke 0.22s ease-out 2.89s forwards; }
#港-bg9  { animation-delay: 3.13s; }
#港-s9   { stroke-dasharray: 37.4423; stroke-dashoffset: 37.4423; animation: drawStroke 0.22s ease-out 3.26s forwards; }
#港-bg10  { animation-delay: 3.50s; }
#港-s10   { stroke-dasharray: 38.6599; stroke-dashoffset: 38.6599; animation: drawStroke 0.22s ease-out 3.63s forwards; }
#港-bg11  { animation-delay: 3.87s; }
#港-s11   { stroke-dasharray: 25.5403; stroke-dashoffset: 25.5403; animation: drawStroke 0.22s ease-out 4.00s forwards; }
#港-bg12  { animation-delay: 4.24s; }
#港-s12   { stroke-dasharray: 55.9962; stroke-dashoffset: 55.9962; animation: drawStroke 0.31s ease-out 4.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #港-s[i]) -->
<path id="港-s1"  class="stroke" stroke="#bf0909" d="M19.25,18.38C24.35,20.119999999999997,29.3,23.59,31.25,26.6"/>
