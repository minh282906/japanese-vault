<path id="港-s7"  class="stroke" stroke="#09bfbf" d="M32.13,47.04C33.79,47.4,36.84,47.57,38.480000000000004,47.4C50.870000000000005,46.059999999999995,70.62,43.69,86.83000000000001,42.66C89.59000000000002,42.489999999999995,91.25000000000001,42.83,92.63000000000001,43.01"/>
