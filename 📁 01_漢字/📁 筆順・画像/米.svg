<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (米)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #米-bg[i]: Thời gian quả bóng số nảy lên
   - #米-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#米-bg1  { animation-delay: 0.05s; }
#米-s1   { stroke-dasharray: 17.5762; stroke-dashoffset: 17.5762; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#米-bg2  { animation-delay: 0.42s; }
#米-s2   { stroke-dasharray: 20.1077; stroke-dashoffset: 20.1077; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#米-bg3  { animation-delay: 0.79s; }
#米-s3   { stroke-dasharray: 69.8768; stroke-dashoffset: 69.8768; animation: drawStroke 0.38s ease-out 0.92s forwards; }
#米-bg4  { animation-delay: 1.32s; }
#米-s4   { stroke-dasharray: 83.0697; stroke-dashoffset: 83.0697; animation: drawStroke 0.46s ease-out 1.45s forwards; }
#米-bg5  { animation-delay: 1.93s; }
#米-s5   { stroke-dasharray: 53.0671; stroke-dashoffset: 53.0671; animation: drawStroke 0.29s ease-out 2.06s forwards; }
#米-bg6  { animation-delay: 2.37s; }
#米-s6   { stroke-dasharray: 51.7589; stroke-dashoffset: 51.7589; animation: drawStroke 0.28s ease-out 2.50s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #米-s[i]) -->
<path id="米-s1"  class="stroke" stroke="#bf0909" d="M26.64,25.46C30.67,27.93,36.74,34.91,37.75,38.75"/>
<path id="米-s2"  class="stroke" stroke="#bfbf09" d="M78.52,19.64C78.61999999999999,20.490000000000002,78.31,21.830000000000002,77.89,22.55C75.25,27,72.25,30.5,66.56,35.22"/>
<path id="米-s3"  class="stroke" stroke="#09bf09" d="M18,49.25C20.25,49.87,22.8,50.08,26.240000000000002,49.75C45.910000000000004,47.87,65.01,45.25,78.99000000000001,44.5C82.45,44.31,85.12,44.38,87.50000000000001,45"/>
<path id="米-s4"  class="stroke" stroke="#09bfbf" d="M51.75,13.25C53.06,14.56,54,17,54,18.75C54,23.5,54.06,69.68,53.86,89.26C53.82,92.80000000000001,53.79,94.80000000000001,53.75,95.75"/>
<path id="米-s5"  class="stroke" stroke="#0909bf" d="M49.38,48.25C49.38,49.72,48.57,51.75,48.120000000000005,52.54C41,64.89,27.22,78.84,13.5,85.75"/>
<path id="米-s6"  class="stroke" stroke="#bf09bf" d="M55.75,48.25C60,53,75.38,68.74,83.7,76.96C86.5,79.72999999999999,89.44,82.11999999999999,93.13,83.75"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="米-bg1"  class="badge-group"><circle cx="26.64" cy="25.46" r="3.5" fill="#bf0909"/><text class="num-single" x="26.64" y="25.46" dx="0" dy="-0.5">1</text></g>
<g id="米-bg2"  class="badge-group"><circle cx="78.52" cy="19.64" r="3.5" fill="#bfbf09"/><text class="num-single" x="78.52" y="19.64" dx="0" dy="-0.5">2</text></g>
<g id="米-bg3"  class="badge-group"><circle cx="18" cy="49.25" r="3.5" fill="#09bf09"/><text class="num-single" x="18" y="49.25" dx="0" dy="-0.5">3</text></g>
<g id="米-bg4"  class="badge-group"><circle cx="51.75" cy="13.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.75" y="13.25" dx="0" dy="-0.5">4</text></g>
<g id="米-bg5"  class="badge-group"><circle cx="49.38" cy="44.75" r="3.5" fill="#0909bf"/><text class="num-single" x="49.38" y="44.75" dx="0" dy="-0.5">5</text></g>
<g id="米-bg6"  class="badge-group"><circle cx="55.75" cy="51.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="55.75" y="51.75" dx="0" dy="-0.5">6</text></g>
</svg>