<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (雲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #雲-bg[i]: Thời gian quả bóng số nảy lên
   - #雲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#雲-bg1  { animation-delay: 0.05s; }
#雲-s1   { stroke-dasharray: 39.7173; stroke-dashoffset: 39.7173; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#雲-bg2  { animation-delay: 0.42s; }
#雲-s2   { stroke-dasharray: 15.7335; stroke-dashoffset: 15.7335; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#雲-bg3  { animation-delay: 0.79s; }
#雲-s3   { stroke-dasharray: 72.0152; stroke-dashoffset: 72.0152; animation: drawStroke 0.40s ease-out 0.92s forwards; }
#雲-bg4  { animation-delay: 1.34s; }
#雲-s4   { stroke-dasharray: 30.9085; stroke-dashoffset: 30.9085; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#雲-bg5  { animation-delay: 1.71s; }
#雲-s5   { stroke-dasharray: 8.8638; stroke-dashoffset: 8.8638; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#雲-bg6  { animation-delay: 2.08s; }
#雲-s6   { stroke-dasharray: 8.6648; stroke-dashoffset: 8.6648; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#雲-bg7  { animation-delay: 2.45s; }
#雲-s7   { stroke-dasharray: 10.2628; stroke-dashoffset: 10.2628; animation: drawStroke 0.22s ease-out 2.58s forwards; }
#雲-bg8  { animation-delay: 2.82s; }
#雲-s8   { stroke-dasharray: 9.5231; stroke-dashoffset: 9.5231; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#雲-bg9  { animation-delay: 3.19s; }
#雲-s9   { stroke-dasharray: 35.7626; stroke-dashoffset: 35.7626; animation: drawStroke 0.22s ease-out 3.32s forwards; }
#雲-bg10  { animation-delay: 3.56s; }
#雲-s10   { stroke-dasharray: 74.8365; stroke-dashoffset: 74.8365; animation: drawStroke 0.41s ease-out 3.69s forwards; }
#雲-bg11  { animation-delay: 4.12s; }
#雲-s11   { stroke-dasharray: 67.8579; stroke-dashoffset: 67.8579; animation: drawStroke 0.37s ease-out 4.25s forwards; }
#雲-bg12  { animation-delay: 4.64s; }
#雲-s12   { stroke-dasharray: 20.0384; stroke-dashoffset: 20.0384; animation: drawStroke 0.22s ease-out 4.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

