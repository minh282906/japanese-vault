<path id="雲-s1"  class="stroke" stroke="#bf0909" d="M34.21,18.07C35.800000000000004,18.25,37.86,18.37,39.29,18.21C39.64,18.17,40.01,18.130000000000003,40.39,18.09C47.31,17.34,59.120000000000005,15.95,68.2,15.14C70.21000000000001,14.96,71.89,14.99,73.74000000000001,15.24"/>
