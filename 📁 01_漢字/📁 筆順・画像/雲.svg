<path id="雲-s10"  class="stroke" stroke="#6409bf" d="M17.5,72.41C21.1,72.85,24.69,72.88,28.259999999999998,72.46C44.879999999999995,70.5,64.86,68.97999999999999,82.15,68.28999999999999C86.9,68.1,89.75,68.22999999999999,92.13000000000001,68.41999999999999"/>
<path id="雲-s11"  class="stroke" stroke="#bf09bf" d="M51.43,73.28C51.5,74.5,50.96,76.15,50.07,77.15C45.75,82,40.5,87,34.78,91.61C32.81,93.2,32.67,94.82,35.79,94.09C42.5,92.5,61.58,89,72.5,87.5"/>
<path id="雲-s12"  class="stroke" stroke="#bf0964" d="M66.46,79.93C71,82.58,76.88,89.62,79.31,95"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="雲-bg1"  class="badge-group"><circle cx="34.21" cy="18.07" r="3.5" fill="#bf0909"/><text class="num-single" x="34.21" y="18.07" dx="0" dy="-0.5">1</text></g>
