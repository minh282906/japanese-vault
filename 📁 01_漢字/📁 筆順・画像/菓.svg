<path id="菓-s4"  class="stroke" stroke="#4bbf09" d="M30.77,34.69C31.599999999999998,35.519999999999996,32.19,36.5,32.3,37.3C32.879999999999995,41.5,34.14,50.23,35.029999999999994,56C35.339999999999996,58.01,35.53999999999999,59.36,35.53999999999999,59.46"/>
<path id="菓-s5"  class="stroke" stroke="#09bf2a" d="M32.94,36.51C36.47,35.98,62.989999999999995,33.22,72.39,32.25C77.24,31.75,79.79,33.39,78.85,37.93C78.14,41.39,76.82,47.730000000000004,75.46,52.81C75.1,54.150000000000006,74.75999999999999,55.31,74.44999999999999,56.150000000000006"/>
<path id="菓-s6"  class="stroke" stroke="#09bf8d" d="M34.58,47.25C42.37,46.37,68.75,43.25,76.55,43.04"/>
<path id="菓-s7"  class="stroke" stroke="#098dbf" d="M36.44,57.57C43.75,56.69,66,54.61,74.03999999999999,54.22"/>
<path id="菓-s8"  class="stroke" stroke="#092abf" d="M16.25,69.48C19.45,70.34,22.53,70.23,25.75,69.91000000000001C38.78,68.63000000000001,69.33,66.01,85.13,65.37C87.89999999999999,65.26,90.52,65.43,93.25,65.88000000000001"/>
<path id="菓-s9"  class="stroke" stroke="#4b09bf" d="M53.5,36.4C54.43,37.33,54.75,38.73,54.75,40.28C54.75,48.61,54.83,76.64,54.85,92.38C54.85,94.61999999999999,54.85,96.61,54.85,98.25999999999999"/>
<path id="菓-s10"  class="stroke" stroke="#ae09bf" d="M50.75,68.22C50.75,69.13,50.18,70.16,49.21,71.19C41.94,78.89,28.23,88.27,17,92.31"/>
<path id="菓-s11"  class="stroke" stroke="#bf096c" d="M59,68C62.75,71.12,72.15,79.7,79.65,85.09C81.96000000000001,86.75,84.63000000000001,88.75,88.5,90.25"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="菓-bg1"  class="badge-group"><circle cx="22.25" cy="23.27" r="3.5" fill="#bf0909"/><text class="num-single" x="22.25" y="23.27" dx="0" dy="-0.5">1</text></g>
<g id="菓-bg2"  class="badge-group"><circle cx="38.75" cy="11" r="3.5" fill="#bf6c09"/><text class="num-single" x="38.75" y="11" dx="0" dy="-0.5">2</text></g>
