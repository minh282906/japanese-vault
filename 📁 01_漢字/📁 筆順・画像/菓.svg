<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (菓)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #菓-bg[i]: Thời gian quả bóng số nảy lên
   - #菓-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#菓-bg1  { animation-delay: 0.05s; }
#菓-s1   { stroke-dasharray: 65.2574; stroke-dashoffset: 65.2574; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#菓-bg2  { animation-delay: 0.56s; }
#菓-s2   { stroke-dasharray: 20.0792; stroke-dashoffset: 20.0792; animation: drawStroke 0.22s ease-out 0.69s forwards; }
#菓-bg3  { animation-delay: 0.93s; }
#菓-s3   { stroke-dasharray: 19.1332; stroke-dashoffset: 19.1332; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#菓-bg4  { animation-delay: 1.30s; }
#菓-s4   { stroke-dasharray: 25.4687; stroke-dashoffset: 25.4687; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#菓-bg5  { animation-delay: 1.67s; }
#菓-s5   { stroke-dasharray: 69.1620; stroke-dashoffset: 69.1620; animation: drawStroke 0.38s ease-out 1.80s forwards; }
#菓-bg6  { animation-delay: 2.20s; }
#菓-s6   { stroke-dasharray: 42.1870; stroke-dashoffset: 42.1870; animation: drawStroke 0.23s ease-out 2.33s forwards; }
#菓-bg7  { animation-delay: 2.58s; }
#菓-s7   { stroke-dasharray: 37.7526; stroke-dashoffset: 37.7526; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#菓-bg8  { animation-delay: 2.95s; }
#菓-s8   { stroke-dasharray: 77.2744; stroke-dashoffset: 77.2744; animation: drawStroke 0.43s ease-out 3.08s forwards; }
#菓-bg9  { animation-delay: 3.53s; }
#菓-s9   { stroke-dasharray: 62.1639; stroke-dashoffset: 62.1639; animation: drawStroke 0.34s ease-out 3.66s forwards; }
#菓-bg10  { animation-delay: 4.02s; }
#菓-s10   { stroke-dasharray: 42.2199; stroke-dashoffset: 42.2199; animation: drawStroke 0.23s ease-out 4.15s forwards; }
#菓-bg11  { animation-delay: 4.40s; }
#菓-s11   { stroke-dasharray: 37.0907; stroke-dashoffset: 37.0907; animation: drawStroke 0.22s ease-out 4.53s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #菓-s[i]) -->
<path id="菓-s1"  class="stroke" stroke="#bf0909" d="M22.25,23.27C24.72,24.28,28.15,23.9,30.759999999999998,23.68C43.739999999999995,22.57,66.82,20.63,79.88,20.31C82.36,20.25,84.83,20.18,87.25999999999999,20.779999999999998"/>
<path id="菓-s2"  class="stroke" stroke="#bf6c09" d="M38.75,11C39.87,12.120000000000001,40.23,13.43,40.35,14.22C41.47,21.65,42.18,27.8,42.5,30.5"/>
