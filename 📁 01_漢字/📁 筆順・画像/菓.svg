<g id="菓-bg7"  class="badge-group"><circle cx="36.44" cy="57.57" r="3.5" fill="#098dbf"/><text class="num-single" x="36.44" y="57.57" dx="0" dy="-0.5">7</text></g>
<g id="菓-bg8"  class="badge-group"><circle cx="16.25" cy="69.48" r="3.5" fill="#092abf"/><text class="num-single" x="16.25" y="69.48" dx="0" dy="-0.5">8</text></g>
<g id="菓-bg9"  class="badge-group"><circle cx="53.5" cy="36.4" r="3.5" fill="#4b09bf"/><text class="num-single" x="53.5" y="36.4" dx="0" dy="-0.5">9</text></g>
<g id="菓-bg10" class="badge-group"><circle cx="50.75" cy="68.22" r="3.5" fill="#ae09bf"/><text class="num-double" x="50.75" y="68.22" dx="-0.4" dy="-0.475">10</text></g>
<g id="菓-bg11" class="badge-group"><circle cx="59" cy="68" r="3.5" fill="#bf096c"/><text class="num-double" x="59" y="68" dx="-0.4" dy="-0.475">11</text></g>
</svg>