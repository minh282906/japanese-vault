<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (食)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #食-bg[i]: Thời gian quả bóng số nảy lên
   - #食-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#食-bg1  { animation-delay: 0.05s; }
#食-s1   { stroke-dasharray: 57.5277; stroke-dashoffset: 57.5277; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#食-bg2  { animation-delay: 0.52s; }
#食-s2   { stroke-dasharray: 51.1748; stroke-dashoffset: 51.1748; animation: drawStroke 0.28s ease-out 0.65s forwards; }
#食-bg3  { animation-delay: 0.95s; }
#食-s3   { stroke-dasharray: 9.4088; stroke-dashoffset: 9.4088; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#食-bg4  { animation-delay: 1.32s; }
#食-s4   { stroke-dasharray: 55.9276; stroke-dashoffset: 55.9276; animation: drawStroke 0.31s ease-out 1.45s forwards; }
#食-bg5  { animation-delay: 1.78s; }
#食-s5   { stroke-dasharray: 25.2494; stroke-dashoffset: 25.2494; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#食-bg6  { animation-delay: 2.15s; }
#食-s6   { stroke-dasharray: 24.6858; stroke-dashoffset: 24.6858; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#食-bg7  { animation-delay: 2.52s; }
#食-s7   { stroke-dasharray: 72.7924; stroke-dashoffset: 72.7924; animation: drawStroke 0.40s ease-out 2.65s forwards; }
#食-bg8  { animation-delay: 3.07s; }
#食-s8   { stroke-dasharray: 14.1486; stroke-dashoffset: 14.1486; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#食-bg9  { animation-delay: 3.44s; }
#食-s9   { stroke-dasharray: 45.1318; stroke-dashoffset: 45.1318; animation: drawStroke 0.25s ease-out 3.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #食-s[i]) -->
<path id="食-s1"  class="stroke" stroke="#bf0909" d="M52.75,10.5C52.86,11.48,52.56,13.17,51.78,14.43C45,25.34,31.75,41.19,14,51.5"/>
<path id="食-s2"  class="stroke" stroke="#bf8209" d="M52.75,16.25C57.84,21.05,78.46000000000001,35.86,86.45,41.15C89.13000000000001,42.93,91.82000000000001,43.94,95,44.5"/>
<path id="食-s3"  class="stroke" stroke="#82bf09" d="M52.25,29.25C53.25,30.25,53.75,31.5,53.75,32.75C53.75,34.75,53.75,35.75,53.75,38.25"/>
<path id="食-s4"  class="stroke" stroke="#09bf09" d="M38,40C38.83,40.47,40.19,41,41.86,40.83C51.25,39.87,63.81,38.07,65.11,37.989999999999995C66.78,37.88999999999999,68.25,38.87,68.22,40.519999999999996C68.2,41.8,67,53.25,66.34,62.4C66.27000000000001,63.339999999999996,66.21000000000001,63.76,66.21000000000001,64.39"/>
<path id="食-s5"  class="stroke" stroke="#09bf82" d="M40.83,51.73C47.25,51.25,59.5,50,66,49.75"/>
<path id="食-s6"  class="stroke" stroke="#0982bf" d="M40.69,63.9C47.73,63.379999999999995,57.239999999999995,62.28,65.28999999999999,61.86"/>
<path id="食-s7"  class="stroke" stroke="#0909bf" d="M38.25,40.25C39.37,41.37,39.75,42.87,39.75,44.25C39.75,53.37,39.75,87.87,39.75,91.5C39.75,95.5,40.75,96.38,43.87,94.38C46.8,92.50999999999999,50.62,89.13,54.75,86"/>
<path id="食-s8"  class="stroke" stroke="#8209bf" d="M74,64C74.25,65.25,74.09,66.57,73.25,67.5C69.75,71.38,68.75,72.38,66,75"/>
<path id="食-s9"  class="stroke" stroke="#bf0982" d="M51.5,71C55.75,71,77,90,81,92.75C83.49,94.46,85.62,95.37,88.5,96.25"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="食-bg1"  class="badge-group"><circle cx="52.75" cy="7.0" r="3.5" fill="#bf0909"/><text class="num-single" x="52.75" y="7.0" dx="0" dy="-0.5">1</text></g>
<g id="食-bg2"  class="badge-group"><circle cx="52.75" cy="19.75" r="3.5" fill="#bf8209"/><text class="num-single" x="52.75" y="19.75" dx="0" dy="-0.5">2</text></g>
<g id="食-bg3"  class="badge-group"><circle cx="52.25" cy="29.25" r="3.5" fill="#82bf09"/><text class="num-single" x="52.25" y="29.25" dx="0" dy="-0.5">3</text></g>
<g id="食-bg4"  class="badge-group"><circle cx="38" cy="36.5" r="3.5" fill="#09bf09"/><text class="num-single" x="38" y="36.5" dx="0" dy="-0.5">4</text></g>
<g id="食-bg5"  class="badge-group"><circle cx="40.83" cy="51.73" r="3.5" fill="#09bf82"/><text class="num-single" x="40.83" y="51.73" dx="0" dy="-0.5">5</text></g>
<g id="食-bg6"  class="badge-group"><circle cx="40.69" cy="63.9" r="3.5" fill="#0982bf"/><text class="num-single" x="40.69" y="63.9" dx="0" dy="-0.5">6</text></g>
<g id="食-bg7"  class="badge-group"><circle cx="38.25" cy="43.75" r="3.5" fill="#0909bf"/><text class="num-single" x="38.25" y="43.75" dx="0" dy="-0.5">7</text></g>
<g id="食-bg8"  class="badge-group"><circle cx="74" cy="64" r="3.5" fill="#8209bf"/><text class="num-single" x="74" y="64" dx="0" dy="-0.5">8</text></g>
<g id="食-bg9"  class="badge-group"><circle cx="51.5" cy="71" r="3.5" fill="#bf0982"/><text class="num-single" x="51.5" y="71" dx="0" dy="-0.5">9</text></g>
</svg>