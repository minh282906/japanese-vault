<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (贈)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #贈-bg[i]: Thời gian quả bóng số nảy lên
   - #贈-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#贈-bg1  { animation-delay: 0.05s; }
#贈-s1   { stroke-dasharray: 51.4545; stroke-dashoffset: 51.4545; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#贈-bg2  { animation-delay: 0.48s; }
#贈-s2   { stroke-dasharray: 69.2609; stroke-dashoffset: 69.2609; animation: drawStroke 0.38s ease-out 0.61s forwards; }
#贈-bg3  { animation-delay: 1.01s; }
#贈-s3   { stroke-dasharray: 18.5491; stroke-dashoffset: 18.5491; animation: drawStroke 0.22s ease-out 1.14s forwards; }
#贈-bg4  { animation-delay: 1.38s; }
#贈-s4   { stroke-dasharray: 17.8655; stroke-dashoffset: 17.8655; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#贈-bg5  { animation-delay: 1.75s; }
#贈-s5   { stroke-dasharray: 18.0577; stroke-dashoffset: 18.0577; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#贈-bg6  { animation-delay: 2.12s; }
#贈-s6   { stroke-dasharray: 18.5540; stroke-dashoffset: 18.5540; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#贈-bg7  { animation-delay: 2.49s; }
#贈-s7   { stroke-dasharray: 15.5780; stroke-dashoffset: 15.5780; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#贈-bg8  { animation-delay: 2.86s; }
#贈-s8   { stroke-dasharray: 12.4848; stroke-dashoffset: 12.4848; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#贈-bg9  { animation-delay: 3.23s; }
#贈-s9   { stroke-dasharray: 16.3270; stroke-dashoffset: 16.3270; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#贈-bg10  { animation-delay: 3.60s; }
#贈-s10   { stroke-dasharray: 25.4047; stroke-dashoffset: 25.4047; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#贈-bg11  { animation-delay: 3.97s; }
#贈-s11   { stroke-dasharray: 70.1948; stroke-dashoffset: 70.1948; animation: drawStroke 0.39s ease-out 4.10s forwards; }
#贈-bg12  { animation-delay: 4.51s; }
#贈-s12   { stroke-dasharray: 19.6483; stroke-dashoffset: 19.6483; animation: drawStroke 0.22s ease-out 4.64s forwards; }
#贈-bg13  { animation-delay: 4.88s; }
#贈-s13   { stroke-dasharray: 38.7797; stroke-dashoffset: 38.7797; animation: drawStroke 0.22s ease-out 5.01s forwards; }
#贈-bg14  { animation-delay: 5.25s; }
#贈-s14   { stroke-dasharray: 33.0565; stroke-dashoffset: 33.0565; animation: drawStroke 0.22s ease-out 5.38s forwards; }
#贈-bg15  { animation-delay: 5.62s; }
#贈-s15   { stroke-dasharray: 32.0118; stroke-dashoffset: 32.0118; animation: drawStroke 0.22s ease-out 5.75s forwards; }
#贈-bg16  { animation-delay: 5.99s; }
#贈-s16   { stroke-dasharray: 60.1175; stroke-dashoffset: 60.1175; animation: drawStroke 0.33s ease-out 6.12s forwards; }
#贈-bg17  { animation-delay: 6.47s; }
#贈-s17   { stroke-dasharray: 28.2713; stroke-dashoffset: 28.2713; animation: drawStroke 0.22s ease-out 6.60s forwards; }
#贈-bg18  { animation-delay: 6.84s; }
#贈-s18   { stroke-dasharray: 26.1859; stroke-dashoffset: 26.1859; animation: drawStroke 0.22s ease-out 6.97s forwards; }
]]>
</style>

