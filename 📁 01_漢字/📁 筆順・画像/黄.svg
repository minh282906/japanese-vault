<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (黄)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #黄-bg[i]: Thời gian quả bóng số nảy lên
   - #黄-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#黄-bg1  { animation-delay: 0.05s; }
#黄-s1   { stroke-dasharray: 53.6475; stroke-dashoffset: 53.6475; animation: drawStroke 0.30s ease-out 0.18s forwards; }
#黄-bg2  { animation-delay: 0.50s; }
#黄-s2   { stroke-dasharray: 30.0181; stroke-dashoffset: 30.0181; animation: drawStroke 0.22s ease-out 0.63s forwards; }
#黄-bg3  { animation-delay: 0.87s; }
#黄-s3   { stroke-dasharray: 29.8930; stroke-dashoffset: 29.8930; animation: drawStroke 0.22s ease-out 1.00s forwards; }
#黄-bg4  { animation-delay: 1.24s; }
#黄-s4   { stroke-dasharray: 80.1826; stroke-dashoffset: 80.1826; animation: drawStroke 0.44s ease-out 1.37s forwards; }
#黄-bg5  { animation-delay: 1.83s; }
#黄-s5   { stroke-dasharray: 28.0786; stroke-dashoffset: 28.0786; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#黄-bg6  { animation-delay: 2.20s; }
#黄-s6   { stroke-dasharray: 73.6874; stroke-dashoffset: 73.6874; animation: drawStroke 0.41s ease-out 2.33s forwards; }
#黄-bg7  { animation-delay: 2.76s; }
#黄-s7   { stroke-dasharray: 31.5545; stroke-dashoffset: 31.5545; animation: drawStroke 0.22s ease-out 2.89s forwards; }
#黄-bg8  { animation-delay: 3.13s; }
#黄-s8   { stroke-dasharray: 41.1975; stroke-dashoffset: 41.1975; animation: drawStroke 0.23s ease-out 3.26s forwards; }
#黄-bg9  { animation-delay: 3.51s; }
#黄-s9   { stroke-dasharray: 35.9124; stroke-dashoffset: 35.9124; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#黄-bg10  { animation-delay: 3.88s; }
#黄-s10   { stroke-dasharray: 27.2241; stroke-dashoffset: 27.2241; animation: drawStroke 0.22s ease-out 4.01s forwards; }
#黄-bg11  { animation-delay: 4.25s; }
#黄-s11   { stroke-dasharray: 24.1945; stroke-dashoffset: 24.1945; animation: drawStroke 0.22s ease-out 4.38s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #黄-s[i]) -->
<path id="黄-s1"  class="stroke" stroke="#bf0909" d="M28.38,27.18C30.02,27.55,33.03,27.72,34.66,27.55C47,26.25,64.5,24.12,76.02,23.29C78.74,23.09,80.39,23.47,81.75,23.65"/>
<path id="黄-s2"  class="stroke" stroke="#bf6c09" d="M39.54,12.38C40.39,12.790000000000001,42,14.25,42.24,16.22C42.92,21.71,43.84,31.61,44.74,41.25"/>
