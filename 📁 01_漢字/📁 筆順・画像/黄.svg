<g id="黄-bg10" class="badge-group"><circle cx="42.63" cy="84.62" r="3.5" fill="#ae09bf"/><text class="num-double" x="42.63" y="84.62" dx="-0.4" dy="-0.475">10</text></g>
<g id="黄-bg11" class="badge-group"><circle cx="65.25" cy="84.25" r="3.5" fill="#bf096c"/><text class="num-double" x="65.25" y="84.25" dx="-0.4" dy="-0.475">11</text></g>
</svg>