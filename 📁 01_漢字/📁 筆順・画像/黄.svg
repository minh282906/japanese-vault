<path id="黄-s4"  class="stroke" stroke="#4bbf09" d="M14.88,43.73C17.1,44.269999999999996,21.18,44.48,23.380000000000003,44.269999999999996C41.88,42.49999999999999,69,39.379999999999995,87,39.03999999999999C90.69,38.96999999999999,92.91,39.29999999999999,94.76,39.56999999999999"/>
<path id="黄-s5"  class="stroke" stroke="#09bf2a" d="M30.22,53.37C31.419999999999998,54.57,32,55.62,32.35,57.019999999999996C33.26,60.629999999999995,34.45,67.52,35.480000000000004,74.78C35.75000000000001,76.69,35.99,78.61,36.18000000000001,80.49"/>
<path id="黄-s6"  class="stroke" stroke="#09bf8d" d="M32.76,54.61C46.87,52.87,68.72,50.839999999999996,74.91999999999999,50.74C78.21,50.68,79.99999999999999,52.25,79.43999999999998,55.050000000000004C78.71999999999998,58.67,77.49999999999999,65,75.44999999999999,72.67C74.89999999999999,74.75,74.36999999999999,76.5,73.72999999999999,78.24000000000001"/>
<path id="黄-s7"  class="stroke" stroke="#098dbf" d="M52.72,44.59C53.629999999999995,45.5,54.22,46.75,54.22,48.5C54.22,54.36,54.3,69.24,54.35,75.75"/>
<path id="黄-s8"  class="stroke" stroke="#092abf" d="M35.63,66.57C39.53,66.33,73.44,62.879999999999995,76.66,62.879999999999995"/>
<path id="黄-s9"  class="stroke" stroke="#4b09bf" d="M37.55,78.72C48.62,77.5,60.03999999999999,76.32,73.33,75.72"/>
<path id="黄-s10"  class="stroke" stroke="#ae09bf" d="M42.63,84.62C42.81,85.65,42.81,86.42,41.07,88.09C37.980000000000004,91.05,32.35,94.51,20.51,98.5"/>
<path id="黄-s11"  class="stroke" stroke="#bf096c" d="M65.25,84.25C71.78,86.81,81,93.5,84.25,98.75"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="黄-bg1"  class="badge-group"><circle cx="28.38" cy="27.18" r="3.5" fill="#bf0909"/><text class="num-single" x="28.38" y="27.18" dx="0" dy="-0.5">1</text></g>
<g id="黄-bg2"  class="badge-group"><circle cx="39.54" cy="12.38" r="3.5" fill="#bf6c09"/><text class="num-single" x="39.54" y="12.38" dx="0" dy="-0.5">2</text></g>
