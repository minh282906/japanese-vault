<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (在)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #在-bg[i]: Thời gian quả bóng số nảy lên
   - #在-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#在-bg1  { animation-delay: 0.05s; }
#在-s1   { stroke-dasharray: 66.8079; stroke-dashoffset: 66.8079; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#在-bg2  { animation-delay: 0.57s; }
#在-s2   { stroke-dasharray: 75.5859; stroke-dashoffset: 75.5859; animation: drawStroke 0.42s ease-out 0.70s forwards; }
#在-bg3  { animation-delay: 1.14s; }
#在-s3   { stroke-dasharray: 44.8328; stroke-dashoffset: 44.8328; animation: drawStroke 0.25s ease-out 1.27s forwards; }
#在-bg4  { animation-delay: 1.54s; }
#在-s4   { stroke-dasharray: 42.5373; stroke-dashoffset: 42.5373; animation: drawStroke 0.23s ease-out 1.67s forwards; }
#在-bg5  { animation-delay: 1.92s; }
#在-s5   { stroke-dasharray: 46.8860; stroke-dashoffset: 46.8860; animation: drawStroke 0.26s ease-out 2.05s forwards; }
#在-bg6  { animation-delay: 2.33s; }
#在-s6   { stroke-dasharray: 57.4450; stroke-dashoffset: 57.4450; animation: drawStroke 0.32s ease-out 2.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #在-s[i]) -->
<path id="在-s1"  class="stroke" stroke="#bf0909" d="M20.5,35.15C23.38,35.87,25.71,35.65,28.38,35.4C40.06,34.309999999999995,66.96,31.52,79.12,30.529999999999998C81.56,30.33,85,30.49,87,30.869999999999997"/>
<path id="在-s2"  class="stroke" stroke="#bfbf09" d="M53.89,12.68C54.62,14.25,54.410000000000004,15.969999999999999,53.92,18.07C50.26,33.6,38.95,58.41,14.89,74.4"/>
<path id="在-s3"  class="stroke" stroke="#09bf09" d="M27.46,53.75C28.23,54.52,28.78,55.87,28.78,57.18C28.78,57.73,28.720000000000002,80.25,28.720000000000002,92.50999999999999C28.720000000000002,95.33999999999999,28.67,97.42999999999999,28.640000000000004,98.24999999999999"/>
<path id="在-s4"  class="stroke" stroke="#09bfbf" d="M43.44,67.81C45.059999999999995,68.41,47.57,68.19,49.25,68.01C57.980000000000004,67.07000000000001,71.26,65.45,80,64.91000000000001C81.83,64.79,83.93,64.88000000000001,85.74,65.28000000000002"/>
<path id="在-s5"  class="stroke" stroke="#0909bf" d="M63.8,44.37C64.78,45.349999999999994,65.8,47.059999999999995,65.8,48.82C65.8,60.16,65.69,75.71000000000001,65.69,90.71000000000001"/>
<path id="在-s6"  class="stroke" stroke="#bf09bf" d="M37.24,92.9C40.25,93.37,42.79,93.43,45.370000000000005,93.22C57.17,92.28,73.12,90.62,85.87,90.37C88.77000000000001,90.31,91.65,90.41000000000001,94.51,91"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="在-bg1"  class="badge-group"><circle cx="20.5" cy="35.15" r="3.5" fill="#bf0909"/><text class="num-single" x="20.5" y="35.15" dx="0" dy="-0.5">1</text></g>
<g id="在-bg2"  class="badge-group"><circle cx="53.89" cy="12.68" r="3.5" fill="#bfbf09"/><text class="num-single" x="53.89" y="12.68" dx="0" dy="-0.5">2</text></g>
<g id="在-bg3"  class="badge-group"><circle cx="27.46" cy="53.75" r="3.5" fill="#09bf09"/><text class="num-single" x="27.46" y="53.75" dx="0" dy="-0.5">3</text></g>
<g id="在-bg4"  class="badge-group"><circle cx="43.44" cy="67.81" r="3.5" fill="#09bfbf"/><text class="num-single" x="43.44" y="67.81" dx="0" dy="-0.5">4</text></g>
<g id="在-bg5"  class="badge-group"><circle cx="63.8" cy="44.37" r="3.5" fill="#0909bf"/><text class="num-single" x="63.8" y="44.37" dx="0" dy="-0.5">5</text></g>
<g id="在-bg6"  class="badge-group"><circle cx="37.24" cy="92.9" r="3.5" fill="#bf09bf"/><text class="num-single" x="37.24" y="92.9" dx="0" dy="-0.5">6</text></g>
</svg>