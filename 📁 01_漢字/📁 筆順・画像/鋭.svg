<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鋭)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鋭-bg[i]: Thời gian quả bóng số nảy lên
   - #鋭-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鋭-bg1  { animation-delay: 0.05s; }
#鋭-s1   { stroke-dasharray: 37.1546; stroke-dashoffset: 37.1546; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鋭-bg2  { animation-delay: 0.42s; }
#鋭-s2   { stroke-dasharray: 16.1331; stroke-dashoffset: 16.1331; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鋭-bg3  { animation-delay: 0.79s; }
#鋭-s3   { stroke-dasharray: 22.0703; stroke-dashoffset: 22.0703; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#鋭-bg4  { animation-delay: 1.16s; }
#鋭-s4   { stroke-dasharray: 32.8495; stroke-dashoffset: 32.8495; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#鋭-bg5  { animation-delay: 1.53s; }
#鋭-s5   { stroke-dasharray: 40.2133; stroke-dashoffset: 40.2133; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#鋭-bg6  { animation-delay: 1.90s; }
#鋭-s6   { stroke-dasharray: 14.5440; stroke-dashoffset: 14.5440; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#鋭-bg7  { animation-delay: 2.27s; }
#鋭-s7   { stroke-dasharray: 12.7096; stroke-dashoffset: 12.7096; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#鋭-bg8  { animation-delay: 2.64s; }
#鋭-s8   { stroke-dasharray: 31.2186; stroke-dashoffset: 31.2186; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#鋭-bg9  { animation-delay: 3.01s; }
#鋭-s9   { stroke-dasharray: 14.3663; stroke-dashoffset: 14.3663; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#鋭-bg10  { animation-delay: 3.38s; }
#鋭-s10   { stroke-dasharray: 21.1443; stroke-dashoffset: 21.1443; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#鋭-bg11  { animation-delay: 3.75s; }
#鋭-s11   { stroke-dasharray: 19.9262; stroke-dashoffset: 19.9262; animation: drawStroke 0.22s ease-out 3.88s forwards; }
#鋭-bg12  { animation-delay: 4.12s; }
#鋭-s12   { stroke-dasharray: 47.0644; stroke-dashoffset: 47.0644; animation: drawStroke 0.26s ease-out 4.25s forwards; }
#鋭-bg13  { animation-delay: 4.53s; }
#鋭-s13   { stroke-dasharray: 26.2050; stroke-dashoffset: 26.2050; animation: drawStroke 0.22s ease-out 4.66s forwards; }
#鋭-bg14  { animation-delay: 4.90s; }
#鋭-s14   { stroke-dasharray: 39.1692; stroke-dashoffset: 39.1692; animation: drawStroke 0.22s ease-out 5.03s forwards; }
#鋭-bg15  { animation-delay: 5.27s; }
#鋭-s15   { stroke-dasharray: 59.6251; stroke-dashoffset: 59.6251; animation: drawStroke 0.33s ease-out 5.40s forwards; }
]]>
</style>

