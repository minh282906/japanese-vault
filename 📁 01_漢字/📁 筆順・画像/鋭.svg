<path id="鋭-s11"  class="stroke" stroke="#0909bf" d="M52.95,39.58C53.75,40.379999999999995,54.35,41.61,54.440000000000005,42.739999999999995C55.02,45.739999999999995,55.89000000000001,50.33,56.480000000000004,54.97C56.650000000000006,56.32,56.82000000000001,57.64,57.00000000000001,58.9"/>
<path id="鋭-s12"  class="stroke" stroke="#5209bf" d="M54.79,40.49C61.44,39.42,74.84,37.88,81.17,36.99C84.2,36.57,86.58,37.32,85.82000000000001,40.88C84.98,44.790000000000006,83.87,48.11,82.78,53.32"/>
