<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (育)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #育-bg[i]: Thời gian quả bóng số nảy lên
   - #育-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#育-bg1  { animation-delay: 0.05s; }
#育-s1   { stroke-dasharray: 12.4290; stroke-dashoffset: 12.4290; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#育-bg2  { animation-delay: 0.42s; }
#育-s2   { stroke-dasharray: 82.8776; stroke-dashoffset: 82.8776; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#育-bg3  { animation-delay: 1.03s; }
#育-s3   { stroke-dasharray: 65.7396; stroke-dashoffset: 65.7396; animation: drawStroke 0.36s ease-out 1.16s forwards; }
#育-bg4  { animation-delay: 1.54s; }
#育-s4   { stroke-dasharray: 19.1007; stroke-dashoffset: 19.1007; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#育-bg5  { animation-delay: 1.91s; }
#育-s5   { stroke-dasharray: 44.8607; stroke-dashoffset: 44.8607; animation: drawStroke 0.25s ease-out 2.04s forwards; }
#育-bg6  { animation-delay: 2.31s; }
#育-s6   { stroke-dasharray: 85.8549; stroke-dashoffset: 85.8549; animation: drawStroke 0.47s ease-out 2.44s forwards; }
#育-bg7  { animation-delay: 2.93s; }
#育-s7   { stroke-dasharray: 30.1341; stroke-dashoffset: 30.1341; animation: drawStroke 0.22s ease-out 3.06s forwards; }
#育-bg8  { animation-delay: 3.30s; }
#育-s8   { stroke-dasharray: 29.8271; stroke-dashoffset: 29.8271; animation: drawStroke 0.22s ease-out 3.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #育-s[i]) -->
<path id="育-s1"  class="stroke" stroke="#bf0909" d="M52.61,11.07C53.64,12.1,54.089999999999996,13.780000000000001,54.089999999999996,14.98C54.089999999999996,16.740000000000002,54.19,20.240000000000002,54.19,23.130000000000003"/>
<path id="育-s2"  class="stroke" stroke="#bf9109" d="M12.75,27.18C16.19,27.75,19.009999999999998,28.07,22.009999999999998,27.73C43.75,25.25,64.24,22.75,86.57,22.03C90.16,21.91,92.57,22.080000000000002,95.25,22.73"/>
<path id="育-s3"  class="stroke" stroke="#64bf09" d="M49.66,27.5C49.75,28.75,49.629999999999995,30,48.75,31C45.13,35.12,40.63,39.5,34.75,43.75C32.47,45.4,33.49,48.35,37,47.5C45.25,45.5,60,42,72,38.75"/>
<path id="育-s4"  class="stroke" stroke="#09bf36" d="M65.25,32.38C69.84,34.78,77.1,42.260000000000005,78.25,46"/>
<path id="育-s5"  class="stroke" stroke="#09bfbf" d="M39.24,53.98C40.2,54.93,40.75,56.129999999999995,40.75,58.05C40.75,63.75,41.01,82.44999999999999,40.99,93.5C40.99,96.3,40.980000000000004,98.16,40.96,98.44"/>
<path id="育-s6"  class="stroke" stroke="#0936bf" d="M40.99,55.18C48.300000000000004,54.31,67.56,51.83,69.06,51.7C71.25,51.5,73.27,53,73.27,55.080000000000005C73.27,61.50000000000001,73.14,80.24000000000001,73.14,92.54C73.14,101.5,67.76,95.75,64.51,92.5"/>
<path id="育-s7"  class="stroke" stroke="#6409bf" d="M42.01,67.02C50.629999999999995,66.11,64.47,64.99,72.03999999999999,64.53999999999999"/>
<path id="育-s8"  class="stroke" stroke="#bf0991" d="M42.14,78.27C48.870000000000005,77.81,64.09,76.2,71.87,75.89"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="育-bg1"  class="badge-group"><circle cx="52.61" cy="11.07" r="3.5" fill="#bf0909"/><text class="num-single" x="52.61" y="11.07" dx="0" dy="-0.5">1</text></g>
<g id="育-bg2"  class="badge-group"><circle cx="12.75" cy="27.18" r="3.5" fill="#bf9109"/><text class="num-single" x="12.75" y="27.18" dx="0" dy="-0.5">2</text></g>
<g id="育-bg3"  class="badge-group"><circle cx="49.66" cy="27.5" r="3.5" fill="#64bf09"/><text class="num-single" x="49.66" y="27.5" dx="0" dy="-0.5">3</text></g>
<g id="育-bg4"  class="badge-group"><circle cx="65.25" cy="32.38" r="3.5" fill="#09bf36"/><text class="num-single" x="65.25" y="32.38" dx="0" dy="-0.5">4</text></g>
<g id="育-bg5"  class="badge-group"><circle cx="39.24" cy="50.48" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.24" y="50.48" dx="0" dy="-0.5">5</text></g>
<g id="育-bg6"  class="badge-group"><circle cx="40.99" cy="58.68" r="3.5" fill="#0936bf"/><text class="num-single" x="40.99" y="58.68" dx="0" dy="-0.5">6</text></g>
<g id="育-bg7"  class="badge-group"><circle cx="42.01" cy="67.02" r="3.5" fill="#6409bf"/><text class="num-single" x="42.01" y="67.02" dx="0" dy="-0.5">7</text></g>
<g id="育-bg8"  class="badge-group"><circle cx="42.14" cy="78.27" r="3.5" fill="#bf0991"/><text class="num-single" x="42.14" y="78.27" dx="0" dy="-0.5">8</text></g>
</svg>