<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (皿)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #皿-bg[i]: Thời gian quả bóng số nảy lên
   - #皿-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#皿-bg1  { animation-delay: 0.05s; }
#皿-s1   { stroke-dasharray: 46.6365; stroke-dashoffset: 46.6365; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#皿-bg2  { animation-delay: 0.46s; }
#皿-s2   { stroke-dasharray: 106.0100; stroke-dashoffset: 106.0100; animation: drawStroke 0.55s ease-out 0.59s forwards; }
#皿-bg3  { animation-delay: 1.16s; }
#皿-s3   { stroke-dasharray: 42.9280; stroke-dashoffset: 42.9280; animation: drawStroke 0.24s ease-out 1.29s forwards; }
#皿-bg4  { animation-delay: 1.55s; }
#皿-s4   { stroke-dasharray: 43.7678; stroke-dashoffset: 43.7678; animation: drawStroke 0.24s ease-out 1.68s forwards; }
#皿-bg5  { animation-delay: 1.94s; }
#皿-s5   { stroke-dasharray: 87.7080; stroke-dashoffset: 87.7080; animation: drawStroke 0.48s ease-out 2.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #皿-s[i]) -->
<path id="皿-s1"  class="stroke" stroke="#bf0909" d="M22.82,32.31C23.88,33.370000000000005,24.63,34.79,24.73,35.81C25.75,45.620000000000005,27.3,63.8,28.18,78.25"/>
<path id="皿-s2"  class="stroke" stroke="#9abf09" d="M25.92,34.83C37.83,33.379999999999995,69.43,30.849999999999998,80.62,30.229999999999997C84.75,30,87.5,31.38,86.77,36C85.25999999999999,45.6,81.75,69.87,80.66,76.42"/>
<path id="皿-s3"  class="stroke" stroke="#09bf52" d="M42.66,35.06C43.43,35.830000000000005,43.86,36.96,43.94,37.92C44.629999999999995,46.88,45.599999999999994,63.95,46.349999999999994,77.58"/>
<path id="皿-s4"  class="stroke" stroke="#0952bf" d="M63.92,33.33C64.5,34.25,64.81,35.809999999999995,64.71000000000001,37C63.75000000000001,48.75,62.68000000000001,61.78,61.50000000000001,76.83"/>
<path id="皿-s5"  class="stroke" stroke="#9a09bf" d="M10.13,79.32C12.940000000000001,80.24,18.080000000000002,80.41,20.89,80.24C45.75,78.75,67.38,77.75,87.81,77.55C92.48,77.5,95.29,77.99,97.63,78.45"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="皿-bg1"  class="badge-group"><circle cx="22.82" cy="28.81" r="3.5" fill="#bf0909"/><text class="num-single" x="22.82" y="28.81" dx="0" dy="-0.5">1</text></g>
<g id="皿-bg2"  class="badge-group"><circle cx="25.92" cy="38.33" r="3.5" fill="#9abf09"/><text class="num-single" x="25.92" y="38.33" dx="0" dy="-0.5">2</text></g>
<g id="皿-bg3"  class="badge-group"><circle cx="42.66" cy="35.06" r="3.5" fill="#09bf52"/><text class="num-single" x="42.66" y="35.06" dx="0" dy="-0.5">3</text></g>
<g id="皿-bg4"  class="badge-group"><circle cx="63.92" cy="33.33" r="3.5" fill="#0952bf"/><text class="num-single" x="63.92" y="33.33" dx="0" dy="-0.5">4</text></g>
<g id="皿-bg5"  class="badge-group"><circle cx="10.13" cy="79.32" r="3.5" fill="#9a09bf"/><text class="num-single" x="10.13" y="79.32" dx="0" dy="-0.5">5</text></g>
</svg>