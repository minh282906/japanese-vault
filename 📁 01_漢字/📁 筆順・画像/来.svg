<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (来)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #来-bg[i]: Thời gian quả bóng số nảy lên
   - #来-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#来-bg1  { animation-delay: 0.05s; }
#来-s1   { stroke-dasharray: 55.7538; stroke-dashoffset: 55.7538; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#来-bg2  { animation-delay: 0.51s; }
#来-s2   { stroke-dasharray: 13.8095; stroke-dashoffset: 13.8095; animation: drawStroke 0.22s ease-out 0.64s forwards; }
#来-bg3  { animation-delay: 0.88s; }
#来-s3   { stroke-dasharray: 17.1616; stroke-dashoffset: 17.1616; animation: drawStroke 0.22s ease-out 1.01s forwards; }
#来-bg4  { animation-delay: 1.25s; }
#来-s4   { stroke-dasharray: 75.2284; stroke-dashoffset: 75.2284; animation: drawStroke 0.41s ease-out 1.38s forwards; }
#来-bg5  { animation-delay: 1.81s; }
#来-s5   { stroke-dasharray: 88.6761; stroke-dashoffset: 88.6761; animation: drawStroke 0.49s ease-out 1.94s forwards; }
#来-bg6  { animation-delay: 2.45s; }
#来-s6   { stroke-dasharray: 49.0880; stroke-dashoffset: 49.0880; animation: drawStroke 0.27s ease-out 2.58s forwards; }
#来-bg7  { animation-delay: 2.87s; }
#来-s7   { stroke-dasharray: 51.0797; stroke-dashoffset: 51.0797; animation: drawStroke 0.28s ease-out 3.00s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #来-s[i]) -->
<path id="来-s1"  class="stroke" stroke="#bf0909" d="M25.54,28.33C27.15,28.72,30.119999999999997,28.86,31.73,28.72C48.05,27.259999999999998,58.74,25.259999999999998,75.42,25.049999999999997C78.11,25.019999999999996,79.73,25.229999999999997,81.07000000000001,25.429999999999996"/>
<path id="来-s2"  class="stroke" stroke="#bfa509" d="M30.12,37.62C32.97,39.69,37.28,45.53,38,48.739999999999995"/>
<path id="来-s3"  class="stroke" stroke="#3dbf09" d="M74.52,33C74.6,33.98,74.41,34.9,73.94,35.77C72.61,38.81,69.24,43.540000000000006,64.88,46.63"/>
<path id="来-s4"  class="stroke" stroke="#09bf71" d="M16.62,57C18.900000000000002,57.5,21.520000000000003,57.74,25.04,57.5C39.85,56.5,64.12,54,83.07,53.25C86.61,53.11,89.39999999999999,53.5,91.61999999999999,53.75"/>
<path id="来-s5"  class="stroke" stroke="#0971bf" d="M51.67,10.75C53,11.75,53.85,13.5,53.85,15.25C53.85,16.15,53.910000000000004,74.21000000000001,53.68,93.25C53.65,96.02,53.61,97.96,53.58,98.75"/>
<path id="来-s6"  class="stroke" stroke="#3d09bf" d="M49.75,56.5C49.75,58,49.31,58.98,48.93,59.61C42.37,70.49,29,83.75,15.75,90.5"/>
<path id="来-s7"  class="stroke" stroke="#bf09a5" d="M55,56.25C59.38,60.13,74.75,75.25,84.73,82.53C87.55,84.59,91.25,87.03,94.75,87.75"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="来-bg1"  class="badge-group"><circle cx="25.54" cy="28.33" r="3.5" fill="#bf0909"/><text class="num-single" x="25.54" y="28.33" dx="0" dy="-0.5">1</text></g>
<g id="来-bg2"  class="badge-group"><circle cx="30.12" cy="37.62" r="3.5" fill="#bfa509"/><text class="num-single" x="30.12" y="37.62" dx="0" dy="-0.5">2</text></g>
<g id="来-bg3"  class="badge-group"><circle cx="74.52" cy="33" r="3.5" fill="#3dbf09"/><text class="num-single" x="74.52" y="33" dx="0" dy="-0.5">3</text></g>
<g id="来-bg4"  class="badge-group"><circle cx="16.62" cy="57" r="3.5" fill="#09bf71"/><text class="num-single" x="16.62" y="57" dx="0" dy="-0.5">4</text></g>
<g id="来-bg5"  class="badge-group"><circle cx="51.67" cy="10.75" r="3.5" fill="#0971bf"/><text class="num-single" x="51.67" y="10.75" dx="0" dy="-0.5">5</text></g>
<g id="来-bg6"  class="badge-group"><circle cx="49.75" cy="53.0" r="3.5" fill="#3d09bf"/><text class="num-single" x="49.75" y="53.0" dx="0" dy="-0.5">6</text></g>
<g id="来-bg7"  class="badge-group"><circle cx="55" cy="59.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="55" y="59.75" dx="0" dy="-0.5">7</text></g>
</svg>