<path id="雑-s9"  class="stroke" stroke="#0971bf" d="M82.64,17.1C82.71,18.05,82.62,19.28,82.39,20.080000000000002C80.96,25.18,79.16,29.090000000000003,75.9,35.230000000000004"/>
