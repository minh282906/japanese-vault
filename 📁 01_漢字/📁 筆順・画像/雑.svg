<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (雑)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #雑-bg[i]: Thời gian quả bóng số nảy lên
   - #雑-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#雑-bg1  { animation-delay: 0.05s; }
#雑-s1   { stroke-dasharray: 44.5459; stroke-dashoffset: 44.5459; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#雑-bg2  { animation-delay: 0.45s; }
#雑-s2   { stroke-dasharray: 63.4812; stroke-dashoffset: 63.4812; animation: drawStroke 0.35s ease-out 0.58s forwards; }
#雑-bg3  { animation-delay: 0.95s; }
#雑-s3   { stroke-dasharray: 37.7072; stroke-dashoffset: 37.7072; animation: drawStroke 0.22s ease-out 1.08s forwards; }
#雑-bg4  { animation-delay: 1.32s; }
#雑-s4   { stroke-dasharray: 48.1387; stroke-dashoffset: 48.1387; animation: drawStroke 0.26s ease-out 1.45s forwards; }
#雑-bg5  { animation-delay: 1.73s; }
#雑-s5   { stroke-dasharray: 35.4135; stroke-dashoffset: 35.4135; animation: drawStroke 0.22s ease-out 1.86s forwards; }
#雑-bg6  { animation-delay: 2.10s; }
#雑-s6   { stroke-dasharray: 15.1392; stroke-dashoffset: 15.1392; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#雑-bg7  { animation-delay: 2.47s; }
#雑-s7   { stroke-dasharray: 30.9121; stroke-dashoffset: 30.9121; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#雑-bg8  { animation-delay: 2.84s; }
#雑-s8   { stroke-dasharray: 59.5581; stroke-dashoffset: 59.5581; animation: drawStroke 0.33s ease-out 2.97s forwards; }
#雑-bg9  { animation-delay: 3.32s; }
#雑-s9   { stroke-dasharray: 19.5212; stroke-dashoffset: 19.5212; animation: drawStroke 0.22s ease-out 3.45s forwards; }
#雑-bg10  { animation-delay: 3.69s; }
#雑-s10   { stroke-dasharray: 35.7741; stroke-dashoffset: 35.7741; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#雑-bg11  { animation-delay: 4.06s; }
#雑-s11   { stroke-dasharray: 50.5680; stroke-dashoffset: 50.5680; animation: drawStroke 0.28s ease-out 4.19s forwards; }
#雑-bg12  { animation-delay: 4.49s; }
#雑-s12   { stroke-dasharray: 31.9510; stroke-dashoffset: 31.9510; animation: drawStroke 0.22s ease-out 4.62s forwards; }
#雑-bg13  { animation-delay: 4.86s; }
#雑-s13   { stroke-dasharray: 33.2682; stroke-dashoffset: 33.2682; animation: drawStroke 0.22s ease-out 4.99s forwards; }
#雑-bg14  { animation-delay: 5.23s; }
#雑-s14   { stroke-dasharray: 38.1029; stroke-dashoffset: 38.1029; animation: drawStroke 0.22s ease-out 5.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

