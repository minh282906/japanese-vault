<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (署)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #署-bg[i]: Thời gian quả bóng số nảy lên
   - #署-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#署-bg1  { animation-delay: 0.05s; }
#署-s1   { stroke-dasharray: 17.9083; stroke-dashoffset: 17.9083; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#署-bg2  { animation-delay: 0.42s; }
#署-s2   { stroke-dasharray: 74.0456; stroke-dashoffset: 74.0456; animation: drawStroke 0.41s ease-out 0.55s forwards; }
#署-bg3  { animation-delay: 0.98s; }
#署-s3   { stroke-dasharray: 11.3591; stroke-dashoffset: 11.3591; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#署-bg4  { animation-delay: 1.35s; }
#署-s4   { stroke-dasharray: 11.7005; stroke-dashoffset: 11.7005; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#署-bg5  { animation-delay: 1.72s; }
#署-s5   { stroke-dasharray: 50.3434; stroke-dashoffset: 50.3434; animation: drawStroke 0.28s ease-out 1.85s forwards; }
#署-bg6  { animation-delay: 2.15s; }
#署-s6   { stroke-dasharray: 37.8159; stroke-dashoffset: 37.8159; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#署-bg7  { animation-delay: 2.52s; }
#署-s7   { stroke-dasharray: 26.6072; stroke-dashoffset: 26.6072; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#署-bg8  { animation-delay: 2.89s; }
#署-s8   { stroke-dasharray: 79.1521; stroke-dashoffset: 79.1521; animation: drawStroke 0.44s ease-out 3.02s forwards; }
#署-bg9  { animation-delay: 3.48s; }
#署-s9   { stroke-dasharray: 80.8236; stroke-dashoffset: 80.8236; animation: drawStroke 0.44s ease-out 3.61s forwards; }
#署-bg10  { animation-delay: 4.07s; }
#署-s10   { stroke-dasharray: 30.8287; stroke-dashoffset: 30.8287; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#署-bg11  { animation-delay: 4.44s; }
#署-s11   { stroke-dasharray: 62.3511; stroke-dashoffset: 62.3511; animation: drawStroke 0.34s ease-out 4.57s forwards; }
#署-bg12  { animation-delay: 4.93s; }
#署-s12   { stroke-dasharray: 32.0232; stroke-dashoffset: 32.0232; animation: drawStroke 0.22s ease-out 5.06s forwards; }
#署-bg13  { animation-delay: 5.30s; }
#署-s13   { stroke-dasharray: 31.6411; stroke-dashoffset: 31.6411; animation: drawStroke 0.22s ease-out 5.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

