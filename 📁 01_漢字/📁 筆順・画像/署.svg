<path id="署-s9"  class="stroke" stroke="#0941bf" d="M81.59,34.02C81.59,35,81.02000000000001,36.46,79.75,37.690000000000005C63.34,53.50000000000001,43.75,67.88000000000001,16.310000000000002,79.9"/>
<path id="署-s10"  class="stroke" stroke="#2509bf" d="M39.02,69.98C39.77,70.73,40.18,71.79,40.18,72.73C40.18,76.58,40.18,88.15,40.18,96.12C40.18,97.76,40.18,99.26,40.18,100.5"/>
<path id="署-s11"  class="stroke" stroke="#7909bf" d="M40.93,70.85C43.49,70.72999999999999,68.6,68.24,70.93,68.1C72.87,67.97999999999999,73.97000000000001,68.75,73.97000000000001,70.6C73.97000000000001,72.47999999999999,73.94000000000001,86.14999999999999,73.92000000000002,93.75C73.92000000000002,95.82,73.91000000000001,97.45,73.91000000000001,98.25"/>
