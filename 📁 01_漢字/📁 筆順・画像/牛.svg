<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (牛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #牛-bg[i]: Thời gian quả bóng số nảy lên
   - #牛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#牛-bg1  { animation-delay: 0.05s; }
#牛-s1   { stroke-dasharray: 30.3210; stroke-dashoffset: 30.3210; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#牛-bg2  { animation-delay: 0.42s; }
#牛-s2   { stroke-dasharray: 50.2442; stroke-dashoffset: 50.2442; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#牛-bg3  { animation-delay: 0.85s; }
#牛-s3   { stroke-dasharray: 80.9431; stroke-dashoffset: 80.9431; animation: drawStroke 0.45s ease-out 0.98s forwards; }
#牛-bg4  { animation-delay: 1.45s; }
#牛-s4   { stroke-dasharray: 87.4193; stroke-dashoffset: 87.4193; animation: drawStroke 0.48s ease-out 1.58s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #牛-s[i]) -->
<path id="牛-s1"  class="stroke" stroke="#bf0909" d="M35.12,21.88C35.21,23.23,34.94,24.509999999999998,34.4,25.77C31.97,31.5,26.759999999999998,41.76,20.24,47.76"/>
<path id="牛-s2"  class="stroke" stroke="#64bf09" d="M31.13,38.67C33.21,38.88,35.089999999999996,38.690000000000005,36.48,38.550000000000004C48.5,37.38,63.5,34.88,74.99,32.67C77.25999999999999,32.230000000000004,79.71,32.1,80.86999999999999,32.29"/>
<path id="牛-s3"  class="stroke" stroke="#09bfbf" d="M13.63,63.23C16.02,63.769999999999996,19.59,64.14999999999999,22.810000000000002,63.769999999999996C44.47,61.24999999999999,59.24,58.379999999999995,85.74000000000001,57.03999999999999C89.72000000000001,56.83999999999999,92.13000000000001,57.04999999999999,94.12,57.31999999999999"/>
<path id="牛-s4"  class="stroke" stroke="#6409bf" d="M53.31,11.88C54.5,13,55.32,14.75,55.32,16.630000000000003C55.32,17.410000000000004,55.25,73.58000000000001,55.13,92.75C55.11,95.84,55.09,97.97,55.07,98.75"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="牛-bg1"  class="badge-group"><circle cx="35.12" cy="21.88" r="3.5" fill="#bf0909"/><text class="num-single" x="35.12" y="21.88" dx="0" dy="-0.5">1</text></g>
<g id="牛-bg2"  class="badge-group"><circle cx="31.13" cy="38.67" r="3.5" fill="#64bf09"/><text class="num-single" x="31.13" y="38.67" dx="0" dy="-0.5">2</text></g>
<g id="牛-bg3"  class="badge-group"><circle cx="13.63" cy="63.23" r="3.5" fill="#09bfbf"/><text class="num-single" x="13.63" y="63.23" dx="0" dy="-0.5">3</text></g>
<g id="牛-bg4"  class="badge-group"><circle cx="53.31" cy="11.88" r="3.5" fill="#6409bf"/><text class="num-single" x="53.31" y="11.88" dx="0" dy="-0.5">4</text></g>
</svg>