<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (枯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #枯-bg[i]: Thời gian quả bóng số nảy lên
   - #枯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#枯-bg1  { animation-delay: 0.05s; }
#枯-s1   { stroke-dasharray: 33.7267; stroke-dashoffset: 33.7267; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#枯-bg2  { animation-delay: 0.42s; }
#枯-s2   { stroke-dasharray: 82.6214; stroke-dashoffset: 82.6214; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#枯-bg3  { animation-delay: 1.02s; }
#枯-s3   { stroke-dasharray: 38.9163; stroke-dashoffset: 38.9163; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#枯-bg4  { animation-delay: 1.39s; }
#枯-s4   { stroke-dasharray: 14.8663; stroke-dashoffset: 14.8663; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#枯-bg5  { animation-delay: 1.76s; }
#枯-s5   { stroke-dasharray: 51.0193; stroke-dashoffset: 51.0193; animation: drawStroke 0.28s ease-out 1.89s forwards; }
#枯-bg6  { animation-delay: 2.19s; }
#枯-s6   { stroke-dasharray: 47.3338; stroke-dashoffset: 47.3338; animation: drawStroke 0.26s ease-out 2.32s forwards; }
#枯-bg7  { animation-delay: 2.60s; }
#枯-s7   { stroke-dasharray: 27.4556; stroke-dashoffset: 27.4556; animation: drawStroke 0.22s ease-out 2.73s forwards; }
#枯-bg8  { animation-delay: 2.97s; }
#枯-s8   { stroke-dasharray: 55.3878; stroke-dashoffset: 55.3878; animation: drawStroke 0.30s ease-out 3.10s forwards; }
#枯-bg9  { animation-delay: 3.42s; }
#枯-s9   { stroke-dasharray: 31.0129; stroke-dashoffset: 31.0129; animation: drawStroke 0.22s ease-out 3.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #枯-s[i]) -->
<path id="枯-s1"  class="stroke" stroke="#bf0909" d="M14.78,42.22C16.75,42.75,19.96,42.54,21.41,42.3C27.18,41.339999999999996,37.730000000000004,39.12,43.54,37.959999999999994C44.8,37.709999999999994,46.62,37.379999999999995,48.01,37.61999999999999"/>
<path id="枯-s2"  class="stroke" stroke="#bf8209" d="M33.11,15C34.18,16.07,34.65,17.5,34.65,19.92C34.65,26.44,34.68,65.76,34.69,88.62C34.69,91.88000000000001,34.69,94.80000000000001,34.69,97.24000000000001"/>
<path id="枯-s3"  class="stroke" stroke="#82bf09" d="M33.19,41.53C33.19,43,32.32,45.22,31.569999999999997,46.88C26.52,57.98,21.75,66,14.11,75.09"/>
<path id="枯-s4"  class="stroke" stroke="#09bf09" d="M37.88,48C40.64,49.82,45.18,55.72,47.5,59.25"/>
<path id="枯-s5"  class="stroke" stroke="#09bf82" d="M48.05,45.03C51,45.620000000000005,53.22,45.42,55.629999999999995,45.17C64.66,44.24,80.5,42.13,90.88999999999999,41.010000000000005C93.54999999999998,40.720000000000006,96.03999999999999,40.64000000000001,98.74999999999999,41.220000000000006"/>
<path id="枯-s6"  class="stroke" stroke="#0982bf" d="M70.65,17.25C71.76,18.36,72.48,20,72.48,22.03C72.48,28.130000000000003,72.44,54.25,72.44,64.11"/>
<path id="枯-s7"  class="stroke" stroke="#0909bf" d="M53.54,65.89C54.51,66.86,54.85,68.15,55.08,69.63C55.73,73.8,56.73,81,57.589999999999996,87.52C57.83,89.33999999999999,58.05,91.11,58.26,92.75"/>
<path id="枯-s8"  class="stroke" stroke="#8209bf" d="M56.31,67.44C64.14,66.6,79,65,86.24,64.43C89.94,64.14,91.19999999999999,65.65,90.58999999999999,69.27000000000001C89.75999999999999,74.20000000000002,88.47999999999999,80.31,87.38,86.17000000000002"/>
<path id="枯-s9"  class="stroke" stroke="#bf0982" d="M58.95,88.97C64.58,88.67,75.89,88.1,84.5,87.64C86.5,87.53,88.35,87.43,89.92,87.34"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="枯-bg1"  class="badge-group"><circle cx="14.78" cy="42.22" r="3.5" fill="#bf0909"/><text class="num-single" x="14.78" y="42.22" dx="0" dy="-0.5">1</text></g>
<g id="枯-bg2"  class="badge-group"><circle cx="33.11" cy="15" r="3.5" fill="#bf8209"/><text class="num-single" x="33.11" y="15" dx="0" dy="-0.5">2</text></g>
<g id="枯-bg3"  class="badge-group"><circle cx="33.19" cy="41.53" r="3.5" fill="#82bf09"/><text class="num-single" x="33.19" y="41.53" dx="0" dy="-0.5">3</text></g>
<g id="枯-bg4"  class="badge-group"><circle cx="37.88" cy="48" r="3.5" fill="#09bf09"/><text class="num-single" x="37.88" y="48" dx="0" dy="-0.5">4</text></g>
<g id="枯-bg5"  class="badge-group"><circle cx="48.05" cy="45.03" r="3.5" fill="#09bf82"/><text class="num-single" x="48.05" y="45.03" dx="0" dy="-0.5">5</text></g>
<g id="枯-bg6"  class="badge-group"><circle cx="70.65" cy="17.25" r="3.5" fill="#0982bf"/><text class="num-single" x="70.65" y="17.25" dx="0" dy="-0.5">6</text></g>
<g id="枯-bg7"  class="badge-group"><circle cx="53.54" cy="62.39" r="3.5" fill="#0909bf"/><text class="num-single" x="53.54" y="62.39" dx="0" dy="-0.5">7</text></g>
<g id="枯-bg8"  class="badge-group"><circle cx="56.31" cy="70.94" r="3.5" fill="#8209bf"/><text class="num-single" x="56.31" y="70.94" dx="0" dy="-0.5">8</text></g>
<g id="枯-bg9"  class="badge-group"><circle cx="58.95" cy="88.97" r="3.5" fill="#bf0982"/><text class="num-single" x="58.95" y="88.97" dx="0" dy="-0.5">9</text></g>
</svg>