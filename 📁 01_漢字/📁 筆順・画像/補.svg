<g id="補-bg9"  class="badge-group"><circle cx="54.35" cy="59.86" r="3.5" fill="#0909bf"/><text class="num-single" x="54.35" y="59.86" dx="0" dy="-0.5">9</text></g>
<g id="補-bg10" class="badge-group"><circle cx="54.27" cy="75.54" r="3.5" fill="#6409bf"/><text class="num-double" x="54.27" y="75.54" dx="-0.4" dy="-0.475">10</text></g>
