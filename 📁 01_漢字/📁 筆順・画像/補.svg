<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (補)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #補-bg[i]: Thời gian quả bóng số nảy lên
   - #補-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#補-bg1  { animation-delay: 0.05s; }
#補-s1   { stroke-dasharray: 12.8409; stroke-dashoffset: 12.8409; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#補-bg2  { animation-delay: 0.42s; }
#補-s2   { stroke-dasharray: 77.4810; stroke-dashoffset: 77.4810; animation: drawStroke 0.43s ease-out 0.55s forwards; }
#補-bg3  { animation-delay: 1.00s; }
#補-s3   { stroke-dasharray: 47.0796; stroke-dashoffset: 47.0796; animation: drawStroke 0.26s ease-out 1.13s forwards; }
#補-bg4  { animation-delay: 1.41s; }
#補-s4   { stroke-dasharray: 12.9912; stroke-dashoffset: 12.9912; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#補-bg5  { animation-delay: 1.78s; }
#補-s5   { stroke-dasharray: 13.7763; stroke-dashoffset: 13.7763; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#補-bg6  { animation-delay: 2.15s; }
#補-s6   { stroke-dasharray: 46.2498; stroke-dashoffset: 46.2498; animation: drawStroke 0.25s ease-out 2.28s forwards; }
#補-bg7  { animation-delay: 2.55s; }
#補-s7   { stroke-dasharray: 53.1120; stroke-dashoffset: 53.1120; animation: drawStroke 0.29s ease-out 2.68s forwards; }
#補-bg8  { animation-delay: 2.99s; }
#補-s8   { stroke-dasharray: 103.1060; stroke-dashoffset: 103.1060; animation: drawStroke 0.55s ease-out 3.12s forwards; }
#補-bg9  { animation-delay: 3.69s; }
#補-s9   { stroke-dasharray: 37.7815; stroke-dashoffset: 37.7815; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#補-bg10  { animation-delay: 4.06s; }
#補-s10   { stroke-dasharray: 37.5939; stroke-dashoffset: 37.5939; animation: drawStroke 0.22s ease-out 4.19s forwards; }
#補-bg11  { animation-delay: 4.43s; }
#補-s11   { stroke-dasharray: 85.5128; stroke-dashoffset: 85.5128; animation: drawStroke 0.47s ease-out 4.56s forwards; }
#補-bg12  { animation-delay: 5.05s; }
#補-s12   { stroke-dasharray: 11.0706; stroke-dashoffset: 11.0706; animation: drawStroke 0.22s ease-out 5.18s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #補-s[i]) -->
<path id="補-s1"  class="stroke" stroke="#bf0909" d="M25.62,13.38C28.76,15.47,32.13,18.6,34.82,22.25"/>
<path id="補-s2"  class="stroke" stroke="#bf6409" d="M15.2,33.86C16.939999999999998,34.589999999999996,18.47,34.58,20.31,34.24C27,33,35,31,39.35,29.72C41.67,29.04,42.93,30.799999999999997,41.61,32.82C33.86,44.65,24,58,12,69.5"/>
<path id="補-s3"  class="stroke" stroke="#bfbf09" d="M29.25,52.61C30.19,53.55,30.77,54.5,30.77,56C30.77,61.29,30.81,83.75,30.82,94.25C30.82,96.67,30.82,98.45,30.82,99.25"/>
<path id="補-s4"  class="stroke" stroke="#64bf09" d="M42.5,47.39C42.7,48.24,42.4,49.22,42,49.84C40.8,51.71,37.35,55.290000000000006,34.95,57.5"/>
<path id="補-s5"  class="stroke" stroke="#09bf09" d="M33.58,59.12C36.739999999999995,61.5,40.12,65.07,42.83,69.24"/>
<path id="補-s6"  class="stroke" stroke="#09bf64" d="M51,28.45C53.53,29.2,56.3,28.82,58.87,28.55C67.12,27.69,80.05,26.12,89.75,25.52C92.2,25.37,94.61,25.13,97,25.8"/>
<path id="補-s7"  class="stroke" stroke="#09bfbf" d="M51.66,42.86C52.59,43.79,53,45,53,46.31C53,46.910000000000004,53.17,73.24000000000001,53.08,87.75C53.059999999999995,91.44,53.04,94.28,53.05,95.62"/>
<path id="補-s8"  class="stroke" stroke="#0964bf" d="M54.35,45.3C61.95,44.459999999999994,83.51,42.029999999999994,88.77000000000001,41.41C91.94000000000001,41.04,93.52000000000001,42.23,93.50000000000001,45.37C93.46000000000001,50.15,93.39000000000001,75.8,93.39000000000001,91.71000000000001C93.39000000000001,103.69000000000001,87.63000000000001,95.12,85.60000000000001,93.03"/>
<path id="補-s9"  class="stroke" stroke="#0909bf" d="M54.35,59.86C64,58.88,82.88,56.88,91.98,56.53"/>
<path id="補-s10"  class="stroke" stroke="#6409bf" d="M54.27,75.54C60.1,74.99000000000001,84.98,72.75,91.73,72.38000000000001"/>
<path id="補-s11"  class="stroke" stroke="#bf09bf" d="M70.2,13.3C71.26,14.360000000000001,71.77,15.5,71.77,17.150000000000002C71.77,18.020000000000003,71.75999999999999,72.25,71.75999999999999,91.75C71.75999999999999,95.24,71.75999999999999,97.62,71.75999999999999,98.38"/>
<path id="補-s12"  class="stroke" stroke="#bf0964" d="M82.5,10.5C85.25,12.120000000000001,89,15.25,90.5,18"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="補-bg1"  class="badge-group"><circle cx="25.62" cy="13.38" r="3.5" fill="#bf0909"/><text class="num-single" x="25.62" y="13.38" dx="0" dy="-0.5">1</text></g>
