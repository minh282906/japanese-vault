<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (他)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #他-bg[i]: Thời gian quả bóng số nảy lên
   - #他-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#他-bg1  { animation-delay: 0.05s; }
#他-s1   { stroke-dasharray: 45.3890; stroke-dashoffset: 45.3890; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#他-bg2  { animation-delay: 0.45s; }
#他-s2   { stroke-dasharray: 53.0580; stroke-dashoffset: 53.0580; animation: drawStroke 0.29s ease-out 0.58s forwards; }
#他-bg3  { animation-delay: 0.89s; }
#他-s3   { stroke-dasharray: 90.4232; stroke-dashoffset: 90.4232; animation: drawStroke 0.50s ease-out 1.02s forwards; }
#他-bg4  { animation-delay: 1.54s; }
#他-s4   { stroke-dasharray: 56.7923; stroke-dashoffset: 56.7923; animation: drawStroke 0.31s ease-out 1.67s forwards; }
#他-bg5  { animation-delay: 2.00s; }
#他-s5   { stroke-dasharray: 104.2920; stroke-dashoffset: 104.2920; animation: drawStroke 0.55s ease-out 2.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #他-s[i]) -->
<path id="他-s1"  class="stroke" stroke="#bf0909" d="M30.25,19.62C30.46,21.62,30.19,23.46,29.52,25.18C25.24,36.1,19,48.12,10,59.62"/>
<path id="他-s2"  class="stroke" stroke="#9abf09" d="M22.91,43C23.830000000000002,43.92,24.16,45.38,24.16,46.5C24.19,57.17,24.330000000000002,78.56,24.38,89.87C24.39,92.36,24.4,94.39,24.4,95.75"/>
<path id="他-s3"  class="stroke" stroke="#09bf52" d="M34,50.11C36.38,50.75,39.71,50.39,41.12,49.97C55.16,45.75,74.25,39.5,83.36,35.87C86.89,34.47,89.53,35.51,88.87,39.01C87.37,46.989999999999995,85.75,53.12,83.83,57.12C80.51,64.06,78.25,60.989999999999995,75.96,57.73"/>
<path id="他-s4"  class="stroke" stroke="#0952bf" d="M63.76,14.75C64.82,15.81,65.34,17.11,65.34,18.12C65.34,20.53,65.29,49.86,65.28,64.5C65.28,67.37,65.28,69.67,65.28,71.1"/>
<path id="他-s5"  class="stroke" stroke="#9a09bf" d="M45.09,38.81C46.050000000000004,40.53,46.370000000000005,42.75,46.370000000000005,44.72C46.370000000000005,55.97,46.13,65.41,46.13,72.5C46.13,88.13,47.25,90,71.67,90C94.37,90,95.64,88.25,95.64,77.3"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="他-bg1"  class="badge-group"><circle cx="30.25" cy="19.62" r="3.5" fill="#bf0909"/><text class="num-single" x="30.25" y="19.62" dx="0" dy="-0.5">1</text></g>
<g id="他-bg2"  class="badge-group"><circle cx="22.91" cy="43" r="3.5" fill="#9abf09"/><text class="num-single" x="22.91" y="43" dx="0" dy="-0.5">2</text></g>
<g id="他-bg3"  class="badge-group"><circle cx="34" cy="50.11" r="3.5" fill="#09bf52"/><text class="num-single" x="34" y="50.11" dx="0" dy="-0.5">3</text></g>
<g id="他-bg4"  class="badge-group"><circle cx="63.76" cy="14.75" r="3.5" fill="#0952bf"/><text class="num-single" x="63.76" y="14.75" dx="0" dy="-0.5">4</text></g>
<g id="他-bg5"  class="badge-group"><circle cx="45.09" cy="38.81" r="3.5" fill="#9a09bf"/><text class="num-single" x="45.09" y="38.81" dx="0" dy="-0.5">5</text></g>
</svg>