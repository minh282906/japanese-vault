<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (頭)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #頭-bg[i]: Thời gian quả bóng số nảy lên
   - #頭-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#頭-bg1  { animation-delay: 0.05s; }
#頭-s1   { stroke-dasharray: 30.8296; stroke-dashoffset: 30.8296; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#頭-bg2  { animation-delay: 0.42s; }
#頭-s2   { stroke-dasharray: 19.3182; stroke-dashoffset: 19.3182; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#頭-bg3  { animation-delay: 0.79s; }
#頭-s3   { stroke-dasharray: 42.6750; stroke-dashoffset: 42.6750; animation: drawStroke 0.23s ease-out 0.92s forwards; }
#頭-bg4  { animation-delay: 1.17s; }
#頭-s4   { stroke-dasharray: 24.5649; stroke-dashoffset: 24.5649; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#頭-bg5  { animation-delay: 1.54s; }
#頭-s5   { stroke-dasharray: 13.6020; stroke-dashoffset: 13.6020; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#頭-bg6  { animation-delay: 1.91s; }
#頭-s6   { stroke-dasharray: 18.9770; stroke-dashoffset: 18.9770; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#頭-bg7  { animation-delay: 2.28s; }
#頭-s7   { stroke-dasharray: 35.9107; stroke-dashoffset: 35.9107; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#頭-bg8  { animation-delay: 2.65s; }
#頭-s8   { stroke-dasharray: 42.6879; stroke-dashoffset: 42.6879; animation: drawStroke 0.23s ease-out 2.78s forwards; }
#頭-bg9  { animation-delay: 3.03s; }
#頭-s9   { stroke-dasharray: 12.0726; stroke-dashoffset: 12.0726; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#頭-bg10  { animation-delay: 3.40s; }
#頭-s10   { stroke-dasharray: 42.0488; stroke-dashoffset: 42.0488; animation: drawStroke 0.23s ease-out 3.53s forwards; }
#頭-bg11  { animation-delay: 3.78s; }
#頭-s11   { stroke-dasharray: 71.0754; stroke-dashoffset: 71.0754; animation: drawStroke 0.39s ease-out 3.91s forwards; }
#頭-bg12  { animation-delay: 4.32s; }
#頭-s12   { stroke-dasharray: 28.3803; stroke-dashoffset: 28.3803; animation: drawStroke 0.22s ease-out 4.45s forwards; }
#頭-bg13  { animation-delay: 4.69s; }
#頭-s13   { stroke-dasharray: 27.8287; stroke-dashoffset: 27.8287; animation: drawStroke 0.22s ease-out 4.82s forwards; }
#頭-bg14  { animation-delay: 5.06s; }
#頭-s14   { stroke-dasharray: 28.0880; stroke-dashoffset: 28.0880; animation: drawStroke 0.22s ease-out 5.19s forwards; }
#頭-bg15  { animation-delay: 5.43s; }
#頭-s15   { stroke-dasharray: 21.8527; stroke-dashoffset: 21.8527; animation: drawStroke 0.22s ease-out 5.56s forwards; }
#頭-bg16  { animation-delay: 5.80s; }
#頭-s16   { stroke-dasharray: 18.9043; stroke-dashoffset: 18.9043; animation: drawStroke 0.22s ease-out 5.93s forwards; }
]]>
</style>

