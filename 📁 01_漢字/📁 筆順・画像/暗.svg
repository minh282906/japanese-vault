<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (暗)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #暗-bg[i]: Thời gian quả bóng số nảy lên
   - #暗-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#暗-bg1  { animation-delay: 0.05s; }
#暗-s1   { stroke-dasharray: 48.3799; stroke-dashoffset: 48.3799; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#暗-bg2  { animation-delay: 0.47s; }
#暗-s2   { stroke-dasharray: 64.8507; stroke-dashoffset: 64.8507; animation: drawStroke 0.36s ease-out 0.60s forwards; }
#暗-bg3  { animation-delay: 0.98s; }
#暗-s3   { stroke-dasharray: 17.7207; stroke-dashoffset: 17.7207; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#暗-bg4  { animation-delay: 1.35s; }
#暗-s4   { stroke-dasharray: 17.1094; stroke-dashoffset: 17.1094; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#暗-bg5  { animation-delay: 1.72s; }
#暗-s5   { stroke-dasharray: 13.8114; stroke-dashoffset: 13.8114; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#暗-bg6  { animation-delay: 2.09s; }
#暗-s6   { stroke-dasharray: 43.5383; stroke-dashoffset: 43.5383; animation: drawStroke 0.24s ease-out 2.22s forwards; }
#暗-bg7  { animation-delay: 2.48s; }
#暗-s7   { stroke-dasharray: 14.2931; stroke-dashoffset: 14.2931; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#暗-bg8  { animation-delay: 2.85s; }
#暗-s8   { stroke-dasharray: 17.9588; stroke-dashoffset: 17.9588; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#暗-bg9  { animation-delay: 3.22s; }
#暗-s9   { stroke-dasharray: 57.4015; stroke-dashoffset: 57.4015; animation: drawStroke 0.32s ease-out 3.35s forwards; }
#暗-bg10  { animation-delay: 3.69s; }
#暗-s10   { stroke-dasharray: 37.5029; stroke-dashoffset: 37.5029; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#暗-bg11  { animation-delay: 4.06s; }
#暗-s11   { stroke-dasharray: 65.3777; stroke-dashoffset: 65.3777; animation: drawStroke 0.36s ease-out 4.19s forwards; }
#暗-bg12  { animation-delay: 4.57s; }
#暗-s12   { stroke-dasharray: 28.1211; stroke-dashoffset: 28.1211; animation: drawStroke 0.22s ease-out 4.70s forwards; }
#暗-bg13  { animation-delay: 4.94s; }
#暗-s13   { stroke-dasharray: 27.0114; stroke-dashoffset: 27.0114; animation: drawStroke 0.22s ease-out 5.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

