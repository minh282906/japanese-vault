<path id="暗-s10"  class="stroke" stroke="#2509bf" d="M51.59,61.52C52.080000000000005,62.330000000000005,52.580000000000005,63.330000000000005,52.580000000000005,64.44C52.580000000000005,65.35,52.50000000000001,87.13,52.480000000000004,95.56C52.470000000000006,97.41,52.470000000000006,98.61,52.470000000000006,98.82000000000001"/>
