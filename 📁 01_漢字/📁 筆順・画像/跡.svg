<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (跡)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #跡-bg[i]: Thời gian quả bóng số nảy lên
   - #跡-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#跡-bg1  { animation-delay: 0.05s; }
#跡-s1   { stroke-dasharray: 20.9354; stroke-dashoffset: 20.9354; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#跡-bg2  { animation-delay: 0.42s; }
#跡-s2   { stroke-dasharray: 38.9789; stroke-dashoffset: 38.9789; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#跡-bg3  { animation-delay: 0.79s; }
#跡-s3   { stroke-dasharray: 19.3774; stroke-dashoffset: 19.3774; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#跡-bg4  { animation-delay: 1.16s; }
#跡-s4   { stroke-dasharray: 39.3062; stroke-dashoffset: 39.3062; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#跡-bg5  { animation-delay: 1.53s; }
#跡-s5   { stroke-dasharray: 12.9984; stroke-dashoffset: 12.9984; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#跡-bg6  { animation-delay: 1.90s; }
#跡-s6   { stroke-dasharray: 27.8617; stroke-dashoffset: 27.8617; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#跡-bg7  { animation-delay: 2.27s; }
#跡-s7   { stroke-dasharray: 32.6604; stroke-dashoffset: 32.6604; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#跡-bg8  { animation-delay: 2.64s; }
#跡-s8   { stroke-dasharray: 17.2220; stroke-dashoffset: 17.2220; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#跡-bg9  { animation-delay: 3.01s; }
#跡-s9   { stroke-dasharray: 47.2648; stroke-dashoffset: 47.2648; animation: drawStroke 0.26s ease-out 3.14s forwards; }
#跡-bg10  { animation-delay: 3.42s; }
#跡-s10   { stroke-dasharray: 63.2608; stroke-dashoffset: 63.2608; animation: drawStroke 0.35s ease-out 3.55s forwards; }
#跡-bg11  { animation-delay: 3.92s; }
#跡-s11   { stroke-dasharray: 69.3913; stroke-dashoffset: 69.3913; animation: drawStroke 0.38s ease-out 4.05s forwards; }
#跡-bg12  { animation-delay: 4.45s; }
#跡-s12   { stroke-dasharray: 28.1545; stroke-dashoffset: 28.1545; animation: drawStroke 0.22s ease-out 4.58s forwards; }
#跡-bg13  { animation-delay: 4.82s; }
#跡-s13   { stroke-dasharray: 28.2808; stroke-dashoffset: 28.2808; animation: drawStroke 0.22s ease-out 4.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #跡-s[i]) -->
<path id="跡-s1"  class="stroke" stroke="#bf0909" d="M15.53,20.74C16.27,21.479999999999997,16.8,22.22,16.93,23.24C17.88,28.13,18.61,31.79,19.31,36.72C19.52,38.21,19.72,39.66,19.91,41"/>
