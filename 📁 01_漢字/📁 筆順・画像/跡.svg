<path id="跡-s9"  class="stroke" stroke="#0941bf" d="M48.75,33.33C51.6,33.53,54.04,33.65,56.87,33.25C65.87,31.95,79.89,30.28,88.62,29.81C90.93,29.689999999999998,93.52000000000001,29.299999999999997,95.74000000000001,30.13"/>
<path id="跡-s10"  class="stroke" stroke="#2509bf" d="M63.17,35.28C64.32000000000001,36.43,64.61,37.910000000000004,64.61,39.92C64.61,58.3,63.12,82.38,49,94.25"/>
<path id="跡-s11"  class="stroke" stroke="#7909bf" d="M77.27,33.83C78.41,34.97,78.53,36.5,78.53,38.849999999999994C78.53,56.49999999999999,78.52,83.75999999999999,78.52,88.72C78.52,99.11,71.31,90.22,69.81,88.97"/>
<path id="跡-s12"  class="stroke" stroke="#bf09b1" d="M53.8,51.89C53.849999999999994,53.01,53.86,54.02,53.57,55.11C51.85,61.56,48.17,70.16,43.81,77.97"/>
<path id="跡-s13"  class="stroke" stroke="#bf095d" d="M87.38,50.75C91.14999999999999,55.33,97.11999999999999,69.59,98.06,76.72"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="跡-bg1"  class="badge-group"><circle cx="15.53" cy="17.24" r="3.5" fill="#bf0909"/><text class="num-single" x="15.53" y="17.24" dx="0" dy="-0.5">1</text></g>
