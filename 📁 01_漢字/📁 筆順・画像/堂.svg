<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (堂)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #堂-bg[i]: Thời gian quả bóng số nảy lên
   - #堂-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#堂-bg1  { animation-delay: 0.05s; }
#堂-s1   { stroke-dasharray: 22.3564; stroke-dashoffset: 22.3564; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#堂-bg2  { animation-delay: 0.42s; }
#堂-s2   { stroke-dasharray: 13.8847; stroke-dashoffset: 13.8847; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#堂-bg3  { animation-delay: 0.79s; }
#堂-s3   { stroke-dasharray: 15.7249; stroke-dashoffset: 15.7249; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#堂-bg4  { animation-delay: 1.16s; }
#堂-s4   { stroke-dasharray: 18.5972; stroke-dashoffset: 18.5972; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#堂-bg5  { animation-delay: 1.53s; }
#堂-s5   { stroke-dasharray: 81.7423; stroke-dashoffset: 81.7423; animation: drawStroke 0.45s ease-out 1.66s forwards; }
#堂-bg6  { animation-delay: 2.13s; }
#堂-s6   { stroke-dasharray: 17.7700; stroke-dashoffset: 17.7700; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#堂-bg7  { animation-delay: 2.50s; }
#堂-s7   { stroke-dasharray: 46.3416; stroke-dashoffset: 46.3416; animation: drawStroke 0.25s ease-out 2.63s forwards; }
#堂-bg8  { animation-delay: 2.90s; }
#堂-s8   { stroke-dasharray: 29.1468; stroke-dashoffset: 29.1468; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#堂-bg9  { animation-delay: 3.27s; }
#堂-s9   { stroke-dasharray: 39.0290; stroke-dashoffset: 39.0290; animation: drawStroke 0.22s ease-out 3.40s forwards; }
#堂-bg10  { animation-delay: 3.64s; }
#堂-s10   { stroke-dasharray: 26.5510; stroke-dashoffset: 26.5510; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#堂-bg11  { animation-delay: 4.01s; }
#堂-s11   { stroke-dasharray: 66.5912; stroke-dashoffset: 66.5912; animation: drawStroke 0.37s ease-out 4.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #堂-s[i]) -->
<path id="堂-s1"  class="stroke" stroke="#bf0909" d="M52.32,12.62C53.48,13.78,53.92,15,53.92,17.09C53.92,27.259999999999998,53.89,31.66,53.89,34.55"/>
