<path id="堂-s5"  class="stroke" stroke="#09bf2a" d="M19.46,38.84C37.870000000000005,36.75,67.80000000000001,34.010000000000005,85.64000000000001,33.38C96.24000000000001,33.010000000000005,86.61000000000001,41.410000000000004,84.94000000000001,42.77"/>
<path id="堂-s6"  class="stroke" stroke="#09bf8d" d="M33.38,48.75C34.38,49.13,35.07,50.56,35.07,51.57C35.83,54.42,36.97,59.3,37.78,62.870000000000005C38.01,63.88,38.21,64.78,38.36,65.5"/>
<path id="堂-s7"  class="stroke" stroke="#098dbf" d="M35.71,50.29C40.5,49.8,55.25,48.25,64.63,47.58C67.85,47.35,69.61999999999999,48.25,69,51.12C68.43,53.769999999999996,67.78,56.43,66.69,61.19"/>
<path id="堂-s8"  class="stroke" stroke="#092abf" d="M39.47,64.29C46.2,63.510000000000005,57.459999999999994,62.830000000000005,65,62.400000000000006C66.33,62.330000000000005,67.52,62.27,68.54,62.230000000000004"/>
<path id="堂-s9"  class="stroke" stroke="#4b09bf" d="M33.96,78.72C35.25,79.03999999999999,37.63,78.95,38.92,78.78999999999999C47.25,77.74999999999999,61,76.24999999999999,68.28,75.88999999999999C70.43,75.77999999999999,71.73,76.03999999999999,72.8,76.19999999999999"/>
<path id="堂-s10"  class="stroke" stroke="#ae09bf" d="M52.86,66.12C53.69,66.95,54.08,68.13000000000001,54.08,69.44C54.08,76.5,54.03,89.08,54.03,92.36"/>
<path id="堂-s11"  class="stroke" stroke="#bf096c" d="M21.09,94.58C22.97,95.03,26.42,95.16,28.3,95.03C48.25,93.63,66.5,92.25,80.96,92.18C84.08999999999999,92.16000000000001,85.97,92.39,87.53999999999999,92.62"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="堂-bg1"  class="badge-group"><circle cx="52.32" cy="12.62" r="3.5" fill="#bf0909"/><text class="num-single" x="52.32" y="12.62" dx="0" dy="-0.5">1</text></g>
