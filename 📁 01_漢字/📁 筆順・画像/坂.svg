<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (坂)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #坂-bg[i]: Thời gian quả bóng số nảy lên
   - #坂-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#坂-bg1  { animation-delay: 0.05s; }
#坂-s1   { stroke-dasharray: 28.3315; stroke-dashoffset: 28.3315; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#坂-bg2  { animation-delay: 0.42s; }
#坂-s2   { stroke-dasharray: 47.1198; stroke-dashoffset: 47.1198; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#坂-bg3  { animation-delay: 0.83s; }
#坂-s3   { stroke-dasharray: 29.0622; stroke-dashoffset: 29.0622; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#坂-bg4  { animation-delay: 1.20s; }
#坂-s4   { stroke-dasharray: 43.7978; stroke-dashoffset: 43.7978; animation: drawStroke 0.24s ease-out 1.33s forwards; }
#坂-bg5  { animation-delay: 1.59s; }
#坂-s5   { stroke-dasharray: 67.6060; stroke-dashoffset: 67.6060; animation: drawStroke 0.37s ease-out 1.72s forwards; }
#坂-bg6  { animation-delay: 2.11s; }
#坂-s6   { stroke-dasharray: 90.6889; stroke-dashoffset: 90.6889; animation: drawStroke 0.50s ease-out 2.24s forwards; }
#坂-bg7  { animation-delay: 2.76s; }
#坂-s7   { stroke-dasharray: 51.0711; stroke-dashoffset: 51.0711; animation: drawStroke 0.28s ease-out 2.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #坂-s[i]) -->
<path id="坂-s1"  class="stroke" stroke="#bf0909" d="M10.88,40.23C12.38,40.62,13.96,40.76,14.93,40.63999999999999C20.259999999999998,39.989999999999995,30.83,38.11999999999999,35.41,37.279999999999994C37.029999999999994,36.989999999999995,38.05,37.10999999999999,38.879999999999995,37.18999999999999"/>
<path id="坂-s2"  class="stroke" stroke="#bfa509" d="M25.62,18.5C26.5,19.38,27.080000000000002,21,27.080000000000002,22C27.080000000000002,23.02,27.000000000000004,49.75,27.000000000000004,65.25"/>
<path id="坂-s3"  class="stroke" stroke="#3dbf09" d="M11.38,72.97C12.950000000000001,73.67999999999999,14.520000000000001,73.42,16.07,72.6C17.64,71.77,30.32,64.46,37,60.49999999999999"/>
<path id="坂-s4"  class="stroke" stroke="#09bf71" d="M47.75,23.49C49.54,23.619999999999997,50.38,23.799999999999997,51.94,23.66C63.309999999999995,22.57,79.25999999999999,19.52,87.69,19.3C90.28999999999999,19.23,88.36,19.26,91.25999999999999,19.26"/>
<path id="坂-s5"  class="stroke" stroke="#0971bf" d="M51.25,24.12C51.75,25.12,52.15,26.240000000000002,52.15,27.990000000000002C52.15,50.040000000000006,48.62,73.94,34.25,87.24000000000001"/>
<path id="坂-s6"  class="stroke" stroke="#3d09bf" d="M54.09,47C55.39,47.31,57.050000000000004,47.28,59.650000000000006,46.81C62.25000000000001,46.34,77.43,42.56,79.27000000000001,42.33C82,42,83.5,44.5,82.45,47.25C74.77000000000001,67.45,66.75,82.37,47.480000000000004,90.99000000000001"/>
<path id="坂-s7"  class="stroke" stroke="#bf09a5" d="M55.88,56.12C61.38,56.62,75.45,78.88,87.42,88.21000000000001C89.28,89.66000000000001,90.64,90.63000000000001,92.38,91.12"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="坂-bg1"  class="badge-group"><circle cx="10.88" cy="40.23" r="3.5" fill="#bf0909"/><text class="num-single" x="10.88" y="40.23" dx="0" dy="-0.5">1</text></g>
<g id="坂-bg2"  class="badge-group"><circle cx="25.62" cy="18.5" r="3.5" fill="#bfa509"/><text class="num-single" x="25.62" y="18.5" dx="0" dy="-0.5">2</text></g>
<g id="坂-bg3"  class="badge-group"><circle cx="11.38" cy="72.97" r="3.5" fill="#3dbf09"/><text class="num-single" x="11.38" y="72.97" dx="0" dy="-0.5">3</text></g>
<g id="坂-bg4"  class="badge-group"><circle cx="47.75" cy="19.99" r="3.5" fill="#09bf71"/><text class="num-single" x="47.75" y="19.99" dx="0" dy="-0.5">4</text></g>
<g id="坂-bg5"  class="badge-group"><circle cx="51.25" cy="27.62" r="3.5" fill="#0971bf"/><text class="num-single" x="51.25" y="27.62" dx="0" dy="-0.5">5</text></g>
<g id="坂-bg6"  class="badge-group"><circle cx="54.09" cy="47" r="3.5" fill="#3d09bf"/><text class="num-single" x="54.09" y="47" dx="0" dy="-0.5">6</text></g>
<g id="坂-bg7"  class="badge-group"><circle cx="55.88" cy="56.12" r="3.5" fill="#bf09a5"/><text class="num-single" x="55.88" y="56.12" dx="0" dy="-0.5">7</text></g>
</svg>