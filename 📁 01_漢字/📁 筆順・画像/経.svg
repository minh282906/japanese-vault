<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (経)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #経-bg[i]: Thời gian quả bóng số nảy lên
   - #経-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#経-bg1  { animation-delay: 0.05s; }
#経-s1   { stroke-dasharray: 39.9679; stroke-dashoffset: 39.9679; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#経-bg2  { animation-delay: 0.42s; }
#経-s2   { stroke-dasharray: 67.2326; stroke-dashoffset: 67.2326; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#経-bg3  { animation-delay: 0.94s; }
#経-s3   { stroke-dasharray: 13.0519; stroke-dashoffset: 13.0519; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#経-bg4  { animation-delay: 1.31s; }
#経-s4   { stroke-dasharray: 36.7995; stroke-dashoffset: 36.7995; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#経-bg5  { animation-delay: 1.68s; }
#経-s5   { stroke-dasharray: 19.5280; stroke-dashoffset: 19.5280; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#経-bg6  { animation-delay: 2.05s; }
#経-s6   { stroke-dasharray: 12.9665; stroke-dashoffset: 12.9665; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#経-bg7  { animation-delay: 2.42s; }
#経-s7   { stroke-dasharray: 88.2566; stroke-dashoffset: 88.2566; animation: drawStroke 0.49s ease-out 2.55s forwards; }
#経-bg8  { animation-delay: 3.06s; }
#経-s8   { stroke-dasharray: 50.9573; stroke-dashoffset: 50.9573; animation: drawStroke 0.28s ease-out 3.19s forwards; }
#経-bg9  { animation-delay: 3.49s; }
#経-s9   { stroke-dasharray: 37.9626; stroke-dashoffset: 37.9626; animation: drawStroke 0.22s ease-out 3.62s forwards; }
#経-bg10  { animation-delay: 3.86s; }
#経-s10   { stroke-dasharray: 33.8882; stroke-dashoffset: 33.8882; animation: drawStroke 0.22s ease-out 3.99s forwards; }
#経-bg11  { animation-delay: 4.23s; }
#経-s11   { stroke-dasharray: 54.0688; stroke-dashoffset: 54.0688; animation: drawStroke 0.30s ease-out 4.36s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #経-s[i]) -->
<path id="経-s1"  class="stroke" stroke="#bf0909" d="M27.9,14C28.209999999999997,15.21,28.41,16.2,27.74,17.44C24.25,24,19.75,30.75,15.92,35.49C15.379999999999999,36.160000000000004,15.3,38.300000000000004,15.92,38.53C19.57,39.89,23.71,42.13,26.060000000000002,44"/>
