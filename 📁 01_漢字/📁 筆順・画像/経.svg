<path id="経-s8"  class="stroke" stroke="#092abf" d="M50.97,28.98C54.75,29.59,70.5,41.5,84.53,51.59C87.83,53.970000000000006,90.38,55.620000000000005,93.63,56.5"/>
<path id="経-s9"  class="stroke" stroke="#4b09bf" d="M49.38,72.42C52,73.13,54.040000000000006,72.74,56.13,72.51C66.07000000000001,71.41000000000001,71.16,70.39,81.25,70C83.24,69.92,85.18,69.84,87.13,70.29"/>
<path id="経-s10"  class="stroke" stroke="#ae09bf" d="M65.92,55.62C66.84,56.54,67.43,57.89,67.44,59.76C67.5,71.25999999999999,67.33,86.08,67.33,89.12"/>
<path id="経-s11"  class="stroke" stroke="#bf096c" d="M41.38,91.1C43.35,91.8,46.980000000000004,91.97999999999999,48.95,91.8C62.17,90.63,78.07000000000001,89.69,88.35,89.73C91.64,89.74000000000001,93.61,90.06,95.25999999999999,90.42"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="経-bg1"  class="badge-group"><circle cx="27.9" cy="14" r="3.5" fill="#bf0909"/><text class="num-single" x="27.9" y="14" dx="0" dy="-0.5">1</text></g>
