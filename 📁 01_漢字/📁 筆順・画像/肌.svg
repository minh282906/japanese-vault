<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (肌)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #肌-bg[i]: Thời gian quả bóng số nảy lên
   - #肌-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#肌-bg1  { animation-delay: 0.05s; }
#肌-s1   { stroke-dasharray: 72.0863; stroke-dashoffset: 72.0863; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#肌-bg2  { animation-delay: 0.60s; }
#肌-s2   { stroke-dasharray: 95.2298; stroke-dashoffset: 95.2298; animation: drawStroke 0.52s ease-out 0.73s forwards; }
#肌-bg3  { animation-delay: 1.27s; }
#肌-s3   { stroke-dasharray: 15.3562; stroke-dashoffset: 15.3562; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#肌-bg4  { animation-delay: 1.64s; }
#肌-s4   { stroke-dasharray: 16.5012; stroke-dashoffset: 16.5012; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#肌-bg5  { animation-delay: 2.01s; }
#肌-s5   { stroke-dasharray: 76.7536; stroke-dashoffset: 76.7536; animation: drawStroke 0.42s ease-out 2.14s forwards; }
#肌-bg6  { animation-delay: 2.58s; }
#肌-s6   { stroke-dasharray: 115.0810; stroke-dashoffset: 115.0810; animation: drawStroke 0.55s ease-out 2.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #肌-s[i]) -->
<path id="肌-s1"  class="stroke" stroke="#bf0909" d="M18.71,19.97C19.560000000000002,20.82,19.69,22.06,19.71,22.979999999999997C20.25,60.25,16.16,76.94999999999999,9.5,90.38999999999999"/>
<path id="肌-s2"  class="stroke" stroke="#bfbf09" d="M20.71,22.01C23.79,21.380000000000003,29.25,20,33.16,19.39C35.839999999999996,18.97,37.04,19.73,37.04,22.62C37.04,29.47,37.04,66.6,37.04,83.65C37.04,96.42,32.41,89.23,29.81,86.15"/>
<path id="肌-s3"  class="stroke" stroke="#09bf09" d="M20.71,40.41C26.07,39.72,30.89,38.989999999999995,35.93,38.37"/>
<path id="肌-s4"  class="stroke" stroke="#09bfbf" d="M19.4,57.12C24,56.75,30.95,56.11,35.84,55.699999999999996"/>
<path id="肌-s5"  class="stroke" stroke="#0909bf" d="M55.22,18.5C56.36,19.64,56.56,20.75,56.58,22.75C56.88,51.12,57.75,78,42.2,91.25"/>
<path id="肌-s6"  class="stroke" stroke="#bf09bf" d="M57.7,20.75C61.45,20,70.2,18.25,73.2,17.5S77.95,18,77.95,20.75C77.95,24.57,77.95,79.5,77.95,82.25C77.95,88.83,79.33,90.75,87.25,90.75C94.5,90.75,95.7,89.42,95.7,81"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="肌-bg1"  class="badge-group"><circle cx="18.71" cy="16.47" r="3.5" fill="#bf0909"/><text class="num-single" x="18.71" y="16.47" dx="0" dy="-0.5">1</text></g>
<g id="肌-bg2"  class="badge-group"><circle cx="20.71" cy="25.51" r="3.5" fill="#bfbf09"/><text class="num-single" x="20.71" y="25.51" dx="0" dy="-0.5">2</text></g>
<g id="肌-bg3"  class="badge-group"><circle cx="20.71" cy="40.41" r="3.5" fill="#09bf09"/><text class="num-single" x="20.71" y="40.41" dx="0" dy="-0.5">3</text></g>
<g id="肌-bg4"  class="badge-group"><circle cx="19.4" cy="57.12" r="3.5" fill="#09bfbf"/><text class="num-single" x="19.4" y="57.12" dx="0" dy="-0.5">4</text></g>
<g id="肌-bg5"  class="badge-group"><circle cx="55.22" cy="15.0" r="3.5" fill="#0909bf"/><text class="num-single" x="55.22" y="15.0" dx="0" dy="-0.5">5</text></g>
<g id="肌-bg6"  class="badge-group"><circle cx="57.7" cy="24.25" r="3.5" fill="#bf09bf"/><text class="num-single" x="57.7" y="24.25" dx="0" dy="-0.5">6</text></g>
</svg>