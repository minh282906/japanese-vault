<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (候)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #候-bg[i]: Thời gian quả bóng số nảy lên
   - #候-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#候-bg1  { animation-delay: 0.05s; }
#候-s1   { stroke-dasharray: 46.5945; stroke-dashoffset: 46.5945; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#候-bg2  { animation-delay: 0.46s; }
#候-s2   { stroke-dasharray: 53.6316; stroke-dashoffset: 53.6316; animation: drawStroke 0.29s ease-out 0.59s forwards; }
#候-bg3  { animation-delay: 0.90s; }
#候-s3   { stroke-dasharray: 52.0860; stroke-dashoffset: 52.0860; animation: drawStroke 0.29s ease-out 1.03s forwards; }
#候-bg4  { animation-delay: 1.34s; }
#候-s4   { stroke-dasharray: 45.8155; stroke-dashoffset: 45.8155; animation: drawStroke 0.25s ease-out 1.47s forwards; }
#候-bg5  { animation-delay: 1.74s; }
#候-s5   { stroke-dasharray: 50.9951; stroke-dashoffset: 50.9951; animation: drawStroke 0.28s ease-out 1.87s forwards; }
#候-bg6  { animation-delay: 2.17s; }
#候-s6   { stroke-dasharray: 23.7047; stroke-dashoffset: 23.7047; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#候-bg7  { animation-delay: 2.54s; }
#候-s7   { stroke-dasharray: 28.8570; stroke-dashoffset: 28.8570; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#候-bg8  { animation-delay: 2.91s; }
#候-s8   { stroke-dasharray: 49.6126; stroke-dashoffset: 49.6126; animation: drawStroke 0.27s ease-out 3.04s forwards; }
#候-bg9  { animation-delay: 3.33s; }
#候-s9   { stroke-dasharray: 53.6655; stroke-dashoffset: 53.6655; animation: drawStroke 0.30s ease-out 3.46s forwards; }
#候-bg10  { animation-delay: 3.78s; }
#候-s10   { stroke-dasharray: 38.3548; stroke-dashoffset: 38.3548; animation: drawStroke 0.22s ease-out 3.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #候-s[i]) -->
<path id="候-s1"  class="stroke" stroke="#bf0909" d="M29.5,16C29.88,17.53,29.7,18.79,29.07,20.59C25.05,32.05,19.71,44.09,10.510000000000002,58.040000000000006"/>
<path id="候-s2"  class="stroke" stroke="#bf7609" d="M22.28,42C23.26,42.98,23.78,44.45,23.78,46C23.78,56.93,23.76,77.8,23.75,89.13C23.75,91.77,23.75,93.89999999999999,23.75,95.25"/>
<path id="候-s3"  class="stroke" stroke="#9abf09" d="M35.52,32.37C36.52,33.37,37.28,34.879999999999995,37.28,37.39C37.28,48.44,37.28,67.23,37.28,77.63C37.28,80.52,37.28,82.75999999999999,37.28,84.00999999999999"/>
<path id="候-s4"  class="stroke" stroke="#2dbf09" d="M50.5,17.25C51.5,17.75,53.49,17.9,55.5,17.75C62,17.25,75.25,15.25,78,15S82.25,15.75,81.25,18.5C80.68,20.08,79,26.38,78.5,30"/>
<path id="候-s5"  class="stroke" stroke="#09bf52" d="M44,33.94C46.07,34.25,48.47,34.379999999999995,50.05,34.23C61.5,33.12,78,30.88,89.23,30.19C91.85000000000001,30.03,93.44,29.950000000000003,94.75,30.220000000000002"/>
<path id="候-s6"  class="stroke" stroke="#09bfbf" d="M56.36,39.97C56.39,40.48,56.43,41.28,56.3,42.01C55.55,46.309999999999995,50.809999999999995,56.879999999999995,46.089999999999996,60.8"/>
<path id="候-s7"  class="stroke" stroke="#0952bf" d="M57.23,49.11C58.37,49.13,59.93,49.06,60.87,48.94C65.24,48.379999999999995,73.92,47.059999999999995,80.37,46.059999999999995C82.11,45.78999999999999,84.08,45.629999999999995,85.84,45.989999999999995"/>
<path id="候-s8"  class="stroke" stroke="#2d09bf" d="M45.13,66.83C48,67.37,50.72,67.05,53.14,66.81C63.61,65.78,77.62,63.72,86.39,63.06C89.18,62.85,91.72,62.580000000000005,94.47,63.13"/>
<path id="候-s9"  class="stroke" stroke="#9a09bf" d="M68.89,50.84C69.37,51.88,69.54,52.99,69.27,54.35C65.75,71.62,59,87.25,43.75,95.46"/>
<path id="候-s10"  class="stroke" stroke="#bf0976" d="M67.88,65.88C76.16,75.25,81.86999999999999,82.24,88.58,88.17999999999999C90.66,90.02,92.5,91.63,95.13,92.5"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="候-bg1"  class="badge-group"><circle cx="29.5" cy="16" r="3.5" fill="#bf0909"/><text class="num-single" x="29.5" y="16" dx="0" dy="-0.5">1</text></g>
<g id="候-bg2"  class="badge-group"><circle cx="22.28" cy="42" r="3.5" fill="#bf7609"/><text class="num-single" x="22.28" y="42" dx="0" dy="-0.5">2</text></g>
<g id="候-bg3"  class="badge-group"><circle cx="35.52" cy="32.37" r="3.5" fill="#9abf09"/><text class="num-single" x="35.52" y="32.37" dx="0" dy="-0.5">3</text></g>
<g id="候-bg4"  class="badge-group"><circle cx="50.5" cy="17.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="50.5" y="17.25" dx="0" dy="-0.5">4</text></g>
<g id="候-bg5"  class="badge-group"><circle cx="44" cy="33.94" r="3.5" fill="#09bf52"/><text class="num-single" x="44" y="33.94" dx="0" dy="-0.5">5</text></g>
<g id="候-bg6"  class="badge-group"><circle cx="56.36" cy="39.97" r="3.5" fill="#09bfbf"/><text class="num-single" x="56.36" y="39.97" dx="0" dy="-0.5">6</text></g>
<g id="候-bg7"  class="badge-group"><circle cx="57.23" cy="49.11" r="3.5" fill="#0952bf"/><text class="num-single" x="57.23" y="49.11" dx="0" dy="-0.5">7</text></g>
<g id="候-bg8"  class="badge-group"><circle cx="45.13" cy="66.83" r="3.5" fill="#2d09bf"/><text class="num-single" x="45.13" y="66.83" dx="0" dy="-0.5">8</text></g>
<g id="候-bg9"  class="badge-group"><circle cx="68.89" cy="50.84" r="3.5" fill="#9a09bf"/><text class="num-single" x="68.89" y="50.84" dx="0" dy="-0.5">9</text></g>
<g id="候-bg10" class="badge-group"><circle cx="67.88" cy="65.88" r="3.5" fill="#bf0976"/><text class="num-double" x="67.88" y="65.88" dx="-0.4" dy="-0.475">10</text></g>
</svg>