<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (夢)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #夢-bg[i]: Thời gian quả bóng số nảy lên
   - #夢-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#夢-bg1  { animation-delay: 0.05s; }
#夢-s1   { stroke-dasharray: 62.4877; stroke-dashoffset: 62.4877; animation: drawStroke 0.34s ease-out 0.18s forwards; }
#夢-bg2  { animation-delay: 0.54s; }
#夢-s2   { stroke-dasharray: 16.7643; stroke-dashoffset: 16.7643; animation: drawStroke 0.22s ease-out 0.67s forwards; }
#夢-bg3  { animation-delay: 0.91s; }
#夢-s3   { stroke-dasharray: 16.4634; stroke-dashoffset: 16.4634; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#夢-bg4  { animation-delay: 1.28s; }
#夢-s4   { stroke-dasharray: 15.2342; stroke-dashoffset: 15.2342; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#夢-bg5  { animation-delay: 1.65s; }
#夢-s5   { stroke-dasharray: 67.2785; stroke-dashoffset: 67.2785; animation: drawStroke 0.37s ease-out 1.78s forwards; }
#夢-bg6  { animation-delay: 2.17s; }
#夢-s6   { stroke-dasharray: 10.2662; stroke-dashoffset: 10.2662; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#夢-bg7  { animation-delay: 2.54s; }
#夢-s7   { stroke-dasharray: 9.2613; stroke-dashoffset: 9.2613; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#夢-bg8  { animation-delay: 2.91s; }
#夢-s8   { stroke-dasharray: 45.9582; stroke-dashoffset: 45.9582; animation: drawStroke 0.25s ease-out 3.04s forwards; }
#夢-bg9  { animation-delay: 3.31s; }
#夢-s9   { stroke-dasharray: 17.2818; stroke-dashoffset: 17.2818; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#夢-bg10  { animation-delay: 3.68s; }
#夢-s10   { stroke-dasharray: 80.8809; stroke-dashoffset: 80.8809; animation: drawStroke 0.44s ease-out 3.81s forwards; }
#夢-bg11  { animation-delay: 4.27s; }
#夢-s11   { stroke-dasharray: 32.7860; stroke-dashoffset: 32.7860; animation: drawStroke 0.22s ease-out 4.40s forwards; }
#夢-bg12  { animation-delay: 4.64s; }
#夢-s12   { stroke-dasharray: 80.9534; stroke-dashoffset: 80.9534; animation: drawStroke 0.45s ease-out 4.77s forwards; }
#夢-bg13  { animation-delay: 5.24s; }
#夢-s13   { stroke-dasharray: 10.7680; stroke-dashoffset: 10.7680; animation: drawStroke 0.22s ease-out 5.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

