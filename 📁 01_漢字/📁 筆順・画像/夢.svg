<path id="夢-s8"  class="stroke" stroke="#0995bf" d="M34.24,46.12C43.620000000000005,45.129999999999995,70.62,43.129999999999995,80.08000000000001,42.91"/>
<path id="夢-s9"  class="stroke" stroke="#0941bf" d="M24.25,53.5C22.75,60.75,20,66.12,17.5,69.25"/>
<path id="夢-s10"  class="stroke" stroke="#2509bf" d="M24.72,56C28.25,56,64.87,52,87.69,51.25C99.74,50.85,91.75,57.25,87.25,61"/>
<path id="夢-s11"  class="stroke" stroke="#7909bf" d="M52.27,56.64C52.5,58,51.910000000000004,59.37,51.32,60.13C47.5,65,39.27,72.91,28.66,77.98"/>
<path id="夢-s12"  class="stroke" stroke="#bf09b1" d="M50.49,65.82C51.5,66,52.74,66.02999999999999,53.480000000000004,65.92999999999999C56.93,65.5,62,65,67.93,64.52C71.43,64.22999999999999,72.10000000000001,66.28,70.41000000000001,68.35C60.5,80.5,47,92,24.25,100.25"/>
<path id="夢-s13"  class="stroke" stroke="#bf095d" d="M44.5,74.38C47.6,75.44,52.51,78.72999999999999,53.28,80.36999999999999"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
