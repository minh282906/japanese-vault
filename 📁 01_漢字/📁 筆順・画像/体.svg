<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (体)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #体-bg[i]: Thời gian quả bóng số nảy lên
   - #体-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#体-bg1  { animation-delay: 0.05s; }
#体-s1   { stroke-dasharray: 49.8969; stroke-dashoffset: 49.8969; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#体-bg2  { animation-delay: 0.47s; }
#体-s2   { stroke-dasharray: 51.5578; stroke-dashoffset: 51.5578; animation: drawStroke 0.28s ease-out 0.60s forwards; }
#体-bg3  { animation-delay: 0.90s; }
#体-s3   { stroke-dasharray: 54.8142; stroke-dashoffset: 54.8142; animation: drawStroke 0.30s ease-out 1.03s forwards; }
#体-bg4  { animation-delay: 1.35s; }
#体-s4   { stroke-dasharray: 84.6493; stroke-dashoffset: 84.6493; animation: drawStroke 0.47s ease-out 1.48s forwards; }
#体-bg5  { animation-delay: 1.97s; }
#体-s5   { stroke-dasharray: 47.3565; stroke-dashoffset: 47.3565; animation: drawStroke 0.26s ease-out 2.10s forwards; }
#体-bg6  { animation-delay: 2.38s; }
#体-s6   { stroke-dasharray: 46.6206; stroke-dashoffset: 46.6206; animation: drawStroke 0.26s ease-out 2.51s forwards; }
#体-bg7  { animation-delay: 2.79s; }
#体-s7   { stroke-dasharray: 33.8763; stroke-dashoffset: 33.8763; animation: drawStroke 0.22s ease-out 2.92s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #体-s[i]) -->
<path id="体-s1"  class="stroke" stroke="#bf0909" d="M31.75,16.25C31.98,18.4,31.7,20.2,30.95,22.03C26.88,32,21,45.88,9.12,60"/>
<path id="体-s2"  class="stroke" stroke="#bfa509" d="M23.78,42.75C24.89,43.86,25.01,45.64,25.09,47.24C25.55,57.36,24.86,77.32,24.59,88.25C24.53,90.63,24.5,92.61,24.5,94"/>
<path id="体-s3"  class="stroke" stroke="#3dbf09" d="M37.28,36.89C38.230000000000004,37.13,40.49,37.480000000000004,43,37.25C54.97,36.13,73.25,33.25,85.78,32.55C88.3,32.41,90.2,32.559999999999995,91.78,32.8"/>
<path id="体-s4"  class="stroke" stroke="#09bf71" d="M61.88,12C62.940000000000005,13.06,63.480000000000004,14.75,63.480000000000004,16.38C63.480000000000004,17.23,63.53,71.88,63.36000000000001,90.50999999999999C63.330000000000005,93.41,63.31000000000001,95.44,63.28000000000001,96.24999999999999"/>
<path id="体-s5"  class="stroke" stroke="#0971bf" d="M61.88,36.37C61.88,37.75,61.370000000000005,39.01,60.940000000000005,39.86C55.07,51.39,42.61,66.29,32.5,72.5"/>
<path id="体-s6"  class="stroke" stroke="#3d09bf" d="M64.38,36.75C68.14999999999999,44,81.49,61.15,88.13,67.53C89.83999999999999,69.17,91.97999999999999,71.29,94.25999999999999,72"/>
<path id="体-s7"  class="stroke" stroke="#bf09a5" d="M46.54,74.65C47.769999999999996,74.94000000000001,50.019999999999996,75.04,51.25,74.94000000000001C62.05,74.01,68.51,72.76,75.95,72.48000000000002C78,72.40000000000002,79.23,72.62000000000002,80.25,72.76000000000002"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="体-bg1"  class="badge-group"><circle cx="31.75" cy="16.25" r="3.5" fill="#bf0909"/><text class="num-single" x="31.75" y="16.25" dx="0" dy="-0.5">1</text></g>
<g id="体-bg2"  class="badge-group"><circle cx="23.78" cy="42.75" r="3.5" fill="#bfa509"/><text class="num-single" x="23.78" y="42.75" dx="0" dy="-0.5">2</text></g>
<g id="体-bg3"  class="badge-group"><circle cx="37.28" cy="36.89" r="3.5" fill="#3dbf09"/><text class="num-single" x="37.28" y="36.89" dx="0" dy="-0.5">3</text></g>
<g id="体-bg4"  class="badge-group"><circle cx="61.88" cy="12" r="3.5" fill="#09bf71"/><text class="num-single" x="61.88" y="12" dx="0" dy="-0.5">4</text></g>
<g id="体-bg5"  class="badge-group"><circle cx="61.88" cy="32.87" r="3.5" fill="#0971bf"/><text class="num-single" x="61.88" y="32.87" dx="0" dy="-0.5">5</text></g>
<g id="体-bg6"  class="badge-group"><circle cx="64.38" cy="40.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="64.38" y="40.25" dx="0" dy="-0.5">6</text></g>
<g id="体-bg7"  class="badge-group"><circle cx="46.54" cy="74.65" r="3.5" fill="#bf09a5"/><text class="num-single" x="46.54" y="74.65" dx="0" dy="-0.5">7</text></g>
</svg>