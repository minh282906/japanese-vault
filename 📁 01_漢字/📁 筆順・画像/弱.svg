<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (弱)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #弱-bg[i]: Thời gian quả bóng số nảy lên
   - #弱-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#弱-bg1  { animation-delay: 0.05s; }
#弱-s1   { stroke-dasharray: 41.3356; stroke-dashoffset: 41.3356; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#弱-bg2  { animation-delay: 0.43s; }
#弱-s2   { stroke-dasharray: 24.2897; stroke-dashoffset: 24.2897; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#弱-bg3  { animation-delay: 0.80s; }
#弱-s3   { stroke-dasharray: 105.8070; stroke-dashoffset: 105.8070; animation: drawStroke 0.55s ease-out 0.93s forwards; }
#弱-bg4  { animation-delay: 1.50s; }
#弱-s4   { stroke-dasharray: 10.3110; stroke-dashoffset: 10.3110; animation: drawStroke 0.22s ease-out 1.63s forwards; }
#弱-bg5  { animation-delay: 1.87s; }
#弱-s5   { stroke-dasharray: 20.1388; stroke-dashoffset: 20.1388; animation: drawStroke 0.22s ease-out 2.00s forwards; }
#弱-bg6  { animation-delay: 2.24s; }
#弱-s6   { stroke-dasharray: 41.4643; stroke-dashoffset: 41.4643; animation: drawStroke 0.23s ease-out 2.37s forwards; }
#弱-bg7  { animation-delay: 2.62s; }
#弱-s7   { stroke-dasharray: 27.7660; stroke-dashoffset: 27.7660; animation: drawStroke 0.22s ease-out 2.75s forwards; }
#弱-bg8  { animation-delay: 2.99s; }
#弱-s8   { stroke-dasharray: 113.6190; stroke-dashoffset: 113.6190; animation: drawStroke 0.55s ease-out 3.12s forwards; }
#弱-bg9  { animation-delay: 3.69s; }
#弱-s9   { stroke-dasharray: 11.2720; stroke-dashoffset: 11.2720; animation: drawStroke 0.22s ease-out 3.82s forwards; }
#弱-bg10  { animation-delay: 4.06s; }
#弱-s10   { stroke-dasharray: 24.1132; stroke-dashoffset: 24.1132; animation: drawStroke 0.22s ease-out 4.19s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #弱-s[i]) -->
<path id="弱-s1"  class="stroke" stroke="#bf0909" d="M21.07,18.41C22.75,19,24.75,19.11,25.86,18.86C26.97,18.62,41.04,15.91,43.33,15.489999999999998C46,14.999999999999998,47.66,16.729999999999997,46.989999999999995,18.669999999999998C46.519999999999996,20.029999999999998,44.559999999999995,27.409999999999997,44.089999999999996,31.009999999999998"/>
