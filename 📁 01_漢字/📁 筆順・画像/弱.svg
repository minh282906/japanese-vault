<path id="弱-s4"  class="stroke" stroke="#2dbf09" d="M19,60C22.14,60.88,27.11,63.62,27.89,64.99"/>
<path id="弱-s5"  class="stroke" stroke="#09bf52" d="M12.75,80.61C14.379999999999999,81.59,16.48,81.41,17.65,80.61C21.52,77.95,23.43,76.18,30,72.12"/>
<path id="弱-s6"  class="stroke" stroke="#09bfbf" d="M63.32,17.66C64.75,18.25,67,18.36,68.11,18.11C69.22,17.87,84.55,15.459999999999999,86.83,14.989999999999998C89.25,14.499999999999998,91.16,16.229999999999997,90.49,18.169999999999998C90.05,19.47,87.74,26.31,86.67999999999999,29.22"/>
<path id="弱-s7"  class="stroke" stroke="#0952bf" d="M60.75,33C62,33.62,63.1,33.36,64.5,33.17C71.12,32.25,81.5,30.75,83.89,30.5C85.44,30.34,87,30.25,88.25,30.25"/>
<path id="弱-s8"  class="stroke" stroke="#2d09bf" d="M62.31,33.37C63.1,34.16,63.370000000000005,35.22,62.940000000000005,36.75C62.45,38.51,59.93000000000001,46.09,59.260000000000005,46.82C57.25000000000001,49.01,59.06,50.230000000000004,61.03000000000001,49.730000000000004C65.75000000000001,48.510000000000005,84.20000000000002,45.43000000000001,87.73,44.650000000000006C94,43.260000000000005,93.9,47.92000000000001,93.15,51.25000000000001C89.75,66.5,86,82,79.13,94.83C76.8,99.17999999999999,74.75,97,72.91,92.8"/>
<path id="弱-s9"  class="stroke" stroke="#9a09bf" d="M59.74,57.75C62.79,58.88,67.63,62.980000000000004,68.39,64.74"/>
<path id="弱-s10"  class="stroke" stroke="#bf0976" d="M56,80.92C57.89,82.2,60.3,81.92,61.68,80.92C65.53,78.12,68.38,75.15,76,69.88"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="弱-bg1"  class="badge-group"><circle cx="21.07" cy="18.41" r="3.5" fill="#bf0909"/><text class="num-single" x="21.07" y="18.41" dx="0" dy="-0.5">1</text></g>
<g id="弱-bg2"  class="badge-group"><circle cx="21.75" cy="30.5" r="3.5" fill="#bf7609"/><text class="num-single" x="21.75" y="30.5" dx="0" dy="-0.5">2</text></g>
