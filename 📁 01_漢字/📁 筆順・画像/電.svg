<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (電)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #電-bg[i]: Thời gian quả bóng số nảy lên
   - #電-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#電-bg1  { animation-delay: 0.05s; }
#電-s1   { stroke-dasharray: 36.8841; stroke-dashoffset: 36.8841; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#電-bg2  { animation-delay: 0.42s; }
#電-s2   { stroke-dasharray: 17.6238; stroke-dashoffset: 17.6238; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#電-bg3  { animation-delay: 0.79s; }
#電-s3   { stroke-dasharray: 80.8806; stroke-dashoffset: 80.8806; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#電-bg4  { animation-delay: 1.38s; }
#電-s4   { stroke-dasharray: 31.9061; stroke-dashoffset: 31.9061; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#電-bg5  { animation-delay: 1.75s; }
#電-s5   { stroke-dasharray: 10.4266; stroke-dashoffset: 10.4266; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#電-bg6  { animation-delay: 2.12s; }
#電-s6   { stroke-dasharray: 10.4574; stroke-dashoffset: 10.4574; animation: drawStroke 0.22s ease-out 2.25s forwards; }
#電-bg7  { animation-delay: 2.49s; }
#電-s7   { stroke-dasharray: 9.7756; stroke-dashoffset: 9.7756; animation: drawStroke 0.22s ease-out 2.62s forwards; }
#電-bg8  { animation-delay: 2.86s; }
#電-s8   { stroke-dasharray: 9.3361; stroke-dashoffset: 9.3361; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#電-bg9  { animation-delay: 3.23s; }
#電-s9   { stroke-dasharray: 28.3785; stroke-dashoffset: 28.3785; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#電-bg10  { animation-delay: 3.60s; }
#電-s10   { stroke-dasharray: 73.6704; stroke-dashoffset: 73.6704; animation: drawStroke 0.41s ease-out 3.73s forwards; }
#電-bg11  { animation-delay: 4.16s; }
#電-s11   { stroke-dasharray: 44.3083; stroke-dashoffset: 44.3083; animation: drawStroke 0.24s ease-out 4.29s forwards; }
#電-bg12  { animation-delay: 4.55s; }
#電-s12   { stroke-dasharray: 40.3918; stroke-dashoffset: 40.3918; animation: drawStroke 0.22s ease-out 4.68s forwards; }
#電-bg13  { animation-delay: 4.92s; }
#電-s13   { stroke-dasharray: 81.6460; stroke-dashoffset: 81.6460; animation: drawStroke 0.45s ease-out 5.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

