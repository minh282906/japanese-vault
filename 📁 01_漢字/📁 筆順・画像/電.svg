<path id="電-s1"  class="stroke" stroke="#bf0909" d="M34.66,16.19C36.97,16.89,39.44,16.44,41.769999999999996,16.150000000000002C47.8,15.400000000000002,57.919999999999995,14.180000000000001,65.25999999999999,13.390000000000002C67.44999999999999,13.160000000000002,69.28999999999999,13.250000000000002,71.30999999999999,13.490000000000002"/>
