<path id="電-s9"  class="stroke" stroke="#0941bf" d="M25.86,55.87C26.75,56.91,26.93,57.39,27.07,58.75C27.54,63.37,29.62,80.59,29.62,80.97C29.62,81.4,29.810000000000002,82.9,29.990000000000002,83.76"/>
<path id="電-s10"  class="stroke" stroke="#2509bf" d="M28.04,57.11C38.83,56.11,69.53,52.879999999999995,71.89,52.74C76,52.5,77.25,54.5,76.62,57.56C76.35000000000001,58.870000000000005,74.25,67.5,72.57000000000001,75.3C72.37,76.25,71.88000000000001,77.69,71.88000000000001,78.34"/>
<path id="電-s11"  class="stroke" stroke="#7909bf" d="M29.46,68.34C36.88,67.37,65.63,64.87,73.6,64.54"/>
<path id="電-s12"  class="stroke" stroke="#bf09b1" d="M31.02,80.34C42.25,79,59.5,77.75,71.25,76.75"/>
<path id="電-s13"  class="stroke" stroke="#bf095d" d="M48.42,57.62C49.5,58.75,49.870000000000005,60.419999999999995,49.870000000000005,62.4C49.870000000000005,67.25,49.77,75.15,49.77,81.25C49.77,94,51.25,95.75,70.27000000000001,95.75C89.50000000000001,95.75,90.45000000000002,93,90.45000000000002,84.93"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="電-bg1"  class="badge-group"><circle cx="34.66" cy="16.19" r="3.5" fill="#bf0909"/><text class="num-single" x="34.66" y="16.19" dx="0" dy="-0.5">1</text></g>
