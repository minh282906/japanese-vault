<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (続)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #続-bg[i]: Thời gian quả bóng số nảy lên
   - #続-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#続-bg1  { animation-delay: 0.05s; }
#続-s1   { stroke-dasharray: 39.3248; stroke-dashoffset: 39.3248; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#続-bg2  { animation-delay: 0.42s; }
#続-s2   { stroke-dasharray: 66.5704; stroke-dashoffset: 66.5704; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#続-bg3  { animation-delay: 0.94s; }
#続-s3   { stroke-dasharray: 13.0230; stroke-dashoffset: 13.0230; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#続-bg4  { animation-delay: 1.31s; }
#続-s4   { stroke-dasharray: 38.0442; stroke-dashoffset: 38.0442; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#続-bg5  { animation-delay: 1.68s; }
#続-s5   { stroke-dasharray: 19.7699; stroke-dashoffset: 19.7699; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#続-bg6  { animation-delay: 2.05s; }
#続-s6   { stroke-dasharray: 15.3403; stroke-dashoffset: 15.3403; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#続-bg7  { animation-delay: 2.42s; }
#続-s7   { stroke-dasharray: 38.0197; stroke-dashoffset: 38.0197; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#続-bg8  { animation-delay: 2.79s; }
#続-s8   { stroke-dasharray: 27.2080; stroke-dashoffset: 27.2080; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#続-bg9  { animation-delay: 3.16s; }
#続-s9   { stroke-dasharray: 29.1133; stroke-dashoffset: 29.1133; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#続-bg10  { animation-delay: 3.53s; }
#続-s10   { stroke-dasharray: 13.7698; stroke-dashoffset: 13.7698; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#続-bg11  { animation-delay: 3.90s; }
#続-s11   { stroke-dasharray: 49.7817; stroke-dashoffset: 49.7817; animation: drawStroke 0.27s ease-out 4.03s forwards; }
#続-bg12  { animation-delay: 4.32s; }
#続-s12   { stroke-dasharray: 38.0708; stroke-dashoffset: 38.0708; animation: drawStroke 0.22s ease-out 4.45s forwards; }
#続-bg13  { animation-delay: 4.69s; }
#続-s13   { stroke-dasharray: 58.6232; stroke-dashoffset: 58.6232; animation: drawStroke 0.32s ease-out 4.82s forwards; }
]]>
</style>

