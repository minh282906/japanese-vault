<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (仲)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #仲-bg[i]: Thời gian quả bóng số nảy lên
   - #仲-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#仲-bg1  { animation-delay: 0.05s; }
#仲-s1   { stroke-dasharray: 48.6098; stroke-dashoffset: 48.6098; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#仲-bg2  { animation-delay: 0.47s; }
#仲-s2   { stroke-dasharray: 49.5635; stroke-dashoffset: 49.5635; animation: drawStroke 0.27s ease-out 0.60s forwards; }
#仲-bg3  { animation-delay: 0.89s; }
#仲-s3   { stroke-dasharray: 24.8375; stroke-dashoffset: 24.8375; animation: drawStroke 0.22s ease-out 1.02s forwards; }
#仲-bg4  { animation-delay: 1.26s; }
#仲-s4   { stroke-dasharray: 69.9371; stroke-dashoffset: 69.9371; animation: drawStroke 0.38s ease-out 1.39s forwards; }
#仲-bg5  { animation-delay: 1.79s; }
#仲-s5   { stroke-dasharray: 44.8601; stroke-dashoffset: 44.8601; animation: drawStroke 0.25s ease-out 1.92s forwards; }
#仲-bg6  { animation-delay: 2.19s; }
#仲-s6   { stroke-dasharray: 80.4559; stroke-dashoffset: 80.4559; animation: drawStroke 0.44s ease-out 2.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #仲-s[i]) -->
<path id="仲-s1"  class="stroke" stroke="#bf0909" d="M35.25,18.38C35.5,19.81,35.43,21.43,34.62,23.24C29.44,34.77,23.88,46.25,11,59.62"/>
<path id="仲-s2"  class="stroke" stroke="#bfbf09" d="M27.28,42.75C28.14,43.61,28.53,44.99,28.53,46.01C28.53,56.25,28.51,75.97999999999999,28.5,86.75C28.5,88.91,28.5,90.71,28.5,92"/>
<path id="仲-s3"  class="stroke" stroke="#09bf09" d="M43.06,40.63C43.84,41.410000000000004,44.370000000000005,42.35,44.63,43.67C45.67,48.870000000000005,46.31,53.64,47.39,60.5C47.6,61.83,47.83,63.24,48.08,64.75"/>
<path id="仲-s4"  class="stroke" stroke="#09bfbf" d="M45.2,42.03C59.870000000000005,39.370000000000005,83.13,36.61,91.83000000000001,36.230000000000004C95.22000000000001,36.080000000000005,95.9,38.660000000000004,95.48000000000002,40.150000000000006C94.04000000000002,45.25000000000001,93.65000000000002,47.690000000000005,91.31000000000002,56.17"/>
<path id="仲-s5"  class="stroke" stroke="#0909bf" d="M48.72,61.71C58.79,60.49,75,58.75,89.64,57.46C90.92,57.35,92.15,57.21,93.34,57.09"/>
<path id="仲-s6"  class="stroke" stroke="#bf09bf" d="M67.76,15C68.88000000000001,16.12,69.49000000000001,17.75,69.49000000000001,19.16C69.49000000000001,23.810000000000002,69.32000000000001,70.87,69.28000000000002,88.75C69.27000000000001,91.39,69.27000000000001,93.89,69.27000000000001,95"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="仲-bg1"  class="badge-group"><circle cx="35.25" cy="18.38" r="3.5" fill="#bf0909"/><text class="num-single" x="35.25" y="18.38" dx="0" dy="-0.5">1</text></g>
<g id="仲-bg2"  class="badge-group"><circle cx="27.28" cy="42.75" r="3.5" fill="#bfbf09"/><text class="num-single" x="27.28" y="42.75" dx="0" dy="-0.5">2</text></g>
<g id="仲-bg3"  class="badge-group"><circle cx="43.06" cy="37.13" r="3.5" fill="#09bf09"/><text class="num-single" x="43.06" y="37.13" dx="0" dy="-0.5">3</text></g>
<g id="仲-bg4"  class="badge-group"><circle cx="45.2" cy="45.53" r="3.5" fill="#09bfbf"/><text class="num-single" x="45.2" y="45.53" dx="0" dy="-0.5">4</text></g>
<g id="仲-bg5"  class="badge-group"><circle cx="48.72" cy="61.71" r="3.5" fill="#0909bf"/><text class="num-single" x="48.72" y="61.71" dx="0" dy="-0.5">5</text></g>
<g id="仲-bg6"  class="badge-group"><circle cx="67.76" cy="15" r="3.5" fill="#bf09bf"/><text class="num-single" x="67.76" y="15" dx="0" dy="-0.5">6</text></g>
</svg>