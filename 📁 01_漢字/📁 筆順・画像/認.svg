<path id="認-s8"  class="stroke" stroke="#09bfbf" d="M51.2,18.19C53,18.91,55.13,18.970000000000002,57,18.78C66.45,17.82,79.56,15.930000000000001,84.07,15.47C87.19,15.15,88.57,16.43,88.39999999999999,18.68C87.94,24.62,84.71999999999998,41.730000000000004,80.47,48.56C77.39,53.510000000000005,75.59,51.92,73.26,48.71"/>
<path id="認-s9"  class="stroke" stroke="#0971bf" d="M67.87,21.37C67.94,22.21,68.13000000000001,23.59,67.73,24.76C64.25,35,59,44,44.78,56.55"/>
