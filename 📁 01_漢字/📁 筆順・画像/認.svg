<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (認)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #認-bg[i]: Thời gian quả bóng số nảy lên
   - #認-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#認-bg1  { animation-delay: 0.05s; }
#認-s1   { stroke-dasharray: 11.5149; stroke-dashoffset: 11.5149; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#認-bg2  { animation-delay: 0.42s; }
#認-s2   { stroke-dasharray: 30.0354; stroke-dashoffset: 30.0354; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#認-bg3  { animation-delay: 0.79s; }
#認-s3   { stroke-dasharray: 21.3814; stroke-dashoffset: 21.3814; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#認-bg4  { animation-delay: 1.16s; }
#認-s4   { stroke-dasharray: 21.2317; stroke-dashoffset: 21.2317; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#認-bg5  { animation-delay: 1.53s; }
#認-s5   { stroke-dasharray: 22.4490; stroke-dashoffset: 22.4490; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#認-bg6  { animation-delay: 1.90s; }
#認-s6   { stroke-dasharray: 37.6406; stroke-dashoffset: 37.6406; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#認-bg7  { animation-delay: 2.27s; }
#認-s7   { stroke-dasharray: 17.5406; stroke-dashoffset: 17.5406; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#認-bg8  { animation-delay: 2.64s; }
#認-s8   { stroke-dasharray: 80.4727; stroke-dashoffset: 80.4727; animation: drawStroke 0.44s ease-out 2.77s forwards; }
#認-bg9  { animation-delay: 3.23s; }
#認-s9   { stroke-dasharray: 43.1367; stroke-dashoffset: 43.1367; animation: drawStroke 0.24s ease-out 3.36s forwards; }
#認-bg10  { animation-delay: 3.62s; }
#認-s10   { stroke-dasharray: 17.7690; stroke-dashoffset: 17.7690; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#認-bg11  { animation-delay: 3.99s; }
#認-s11   { stroke-dasharray: 18.5207; stroke-dashoffset: 18.5207; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#認-bg12  { animation-delay: 4.36s; }
#認-s12   { stroke-dasharray: 57.6921; stroke-dashoffset: 57.6921; animation: drawStroke 0.32s ease-out 4.49s forwards; }
#認-bg13  { animation-delay: 4.83s; }
#認-s13   { stroke-dasharray: 9.7948; stroke-dashoffset: 9.7948; animation: drawStroke 0.22s ease-out 4.96s forwards; }
#認-bg14  { animation-delay: 5.20s; }
#認-s14   { stroke-dasharray: 16.7074; stroke-dashoffset: 16.7074; animation: drawStroke 0.22s ease-out 5.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

