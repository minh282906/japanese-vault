<g id="格-bg8"  class="badge-group"><circle cx="49.67" cy="64.54" r="3.5" fill="#2d09bf"/><text class="num-single" x="49.67" y="64.54" dx="0" dy="-0.5">8</text></g>
<g id="格-bg9"  class="badge-group"><circle cx="51.99" cy="72.98" r="3.5" fill="#9a09bf"/><text class="num-single" x="51.99" y="72.98" dx="0" dy="-0.5">9</text></g>
<g id="格-bg10" class="badge-group"><circle cx="55.23" cy="90.16" r="3.5" fill="#bf0976"/><text class="num-double" x="55.23" y="90.16" dx="-0.4" dy="-0.475">10</text></g>
</svg>