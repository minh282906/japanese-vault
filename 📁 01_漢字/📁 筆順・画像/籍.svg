<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (籍)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #籍-bg[i]: Thời gian quả bóng số nảy lên
   - #籍-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#籍-bg1  { animation-delay: 0.05s; }
#籍-s1   { stroke-dasharray: 22.5073; stroke-dashoffset: 22.5073; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#籍-bg2  { animation-delay: 0.42s; }
#籍-s2   { stroke-dasharray: 23.4177; stroke-dashoffset: 23.4177; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#籍-bg3  { animation-delay: 0.79s; }
#籍-s3   { stroke-dasharray: 9.9947; stroke-dashoffset: 9.9947; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#籍-bg4  { animation-delay: 1.16s; }
#籍-s4   { stroke-dasharray: 20.4264; stroke-dashoffset: 20.4264; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#籍-bg5  { animation-delay: 1.53s; }
#籍-s5   { stroke-dasharray: 26.8979; stroke-dashoffset: 26.8979; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#籍-bg6  { animation-delay: 1.90s; }
#籍-s6   { stroke-dasharray: 10.5250; stroke-dashoffset: 10.5250; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#籍-bg7  { animation-delay: 2.27s; }
#籍-s7   { stroke-dasharray: 27.3863; stroke-dashoffset: 27.3863; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#籍-bg8  { animation-delay: 2.64s; }
#籍-s8   { stroke-dasharray: 25.6261; stroke-dashoffset: 25.6261; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#籍-bg9  { animation-delay: 3.01s; }
#籍-s9   { stroke-dasharray: 32.8710; stroke-dashoffset: 32.8710; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#籍-bg10  { animation-delay: 3.38s; }
#籍-s10   { stroke-dasharray: 63.8545; stroke-dashoffset: 63.8545; animation: drawStroke 0.35s ease-out 3.51s forwards; }
#籍-bg11  { animation-delay: 3.88s; }
#籍-s11   { stroke-dasharray: 32.5833; stroke-dashoffset: 32.5833; animation: drawStroke 0.22s ease-out 4.01s forwards; }
#籍-bg12  { animation-delay: 4.25s; }
#籍-s12   { stroke-dasharray: 13.4067; stroke-dashoffset: 13.4067; animation: drawStroke 0.22s ease-out 4.38s forwards; }
#籍-bg13  { animation-delay: 4.62s; }
#籍-s13   { stroke-dasharray: 38.4224; stroke-dashoffset: 38.4224; animation: drawStroke 0.22s ease-out 4.75s forwards; }
#籍-bg14  { animation-delay: 4.99s; }
#籍-s14   { stroke-dasharray: 23.4243; stroke-dashoffset: 23.4243; animation: drawStroke 0.22s ease-out 5.12s forwards; }
#籍-bg15  { animation-delay: 5.36s; }
#籍-s15   { stroke-dasharray: 24.3245; stroke-dashoffset: 24.3245; animation: drawStroke 0.22s ease-out 5.49s forwards; }
#籍-bg16  { animation-delay: 5.73s; }
#籍-s16   { stroke-dasharray: 45.1407; stroke-dashoffset: 45.1407; animation: drawStroke 0.25s ease-out 5.86s forwards; }
#籍-bg17  { animation-delay: 6.13s; }
#籍-s17   { stroke-dasharray: 30.9669; stroke-dashoffset: 30.9669; animation: drawStroke 0.22s ease-out 6.26s forwards; }
#籍-bg18  { animation-delay: 6.50s; }
#籍-s18   { stroke-dasharray: 55.4589; stroke-dashoffset: 55.4589; animation: drawStroke 0.31s ease-out 6.63s forwards; }
#籍-bg19  { animation-delay: 6.96s; }
#籍-s19   { stroke-dasharray: 24.7515; stroke-dashoffset: 24.7515; animation: drawStroke 0.22s ease-out 7.09s forwards; }
#籍-bg20  { animation-delay: 7.33s; }
#籍-s20   { stroke-dasharray: 24.0658; stroke-dashoffset: 24.0658; animation: drawStroke 0.22s ease-out 7.46s forwards; }
]]>
</style>

