<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (浴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #浴-bg[i]: Thời gian quả bóng số nảy lên
   - #浴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#浴-bg1  { animation-delay: 0.05s; }
#浴-s1   { stroke-dasharray: 13.0770; stroke-dashoffset: 13.0770; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#浴-bg2  { animation-delay: 0.42s; }
#浴-s2   { stroke-dasharray: 14.0949; stroke-dashoffset: 14.0949; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#浴-bg3  { animation-delay: 0.79s; }
#浴-s3   { stroke-dasharray: 24.9915; stroke-dashoffset: 24.9915; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#浴-bg4  { animation-delay: 1.16s; }
#浴-s4   { stroke-dasharray: 23.8861; stroke-dashoffset: 23.8861; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#浴-bg5  { animation-delay: 1.53s; }
#浴-s5   { stroke-dasharray: 18.9220; stroke-dashoffset: 18.9220; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#浴-bg6  { animation-delay: 1.90s; }
#浴-s6   { stroke-dasharray: 42.2674; stroke-dashoffset: 42.2674; animation: drawStroke 0.23s ease-out 2.03s forwards; }
#浴-bg7  { animation-delay: 2.28s; }
#浴-s7   { stroke-dasharray: 41.1292; stroke-dashoffset: 41.1292; animation: drawStroke 0.23s ease-out 2.41s forwards; }
#浴-bg8  { animation-delay: 2.66s; }
#浴-s8   { stroke-dasharray: 24.6119; stroke-dashoffset: 24.6119; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#浴-bg9  { animation-delay: 3.03s; }
#浴-s9   { stroke-dasharray: 55.8122; stroke-dashoffset: 55.8122; animation: drawStroke 0.31s ease-out 3.16s forwards; }
#浴-bg10  { animation-delay: 3.49s; }
#浴-s10   { stroke-dasharray: 29.3862; stroke-dashoffset: 29.3862; animation: drawStroke 0.22s ease-out 3.62s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #浴-s[i]) -->
<path id="浴-s1"  class="stroke" stroke="#bf0909" d="M17.76,15.5C21.380000000000003,16.88,27.1,21.19,28,23.34"/>
<path id="浴-s2"  class="stroke" stroke="#bf7609" d="M12,36.75C15.879999999999999,38.25,22.03,42.92,23,45.25"/>
<path id="浴-s3"  class="stroke" stroke="#9abf09" d="M10.91,86.92C12.4,87.46000000000001,13.9,87.16,14.8,85.84C18.26,80.7,21.73,74.42,24.87,67.87"/>
<path id="浴-s4"  class="stroke" stroke="#2dbf09" d="M51.82,17.73C51.92,18.740000000000002,51.59,20.02,51.05,20.9C48.62,24.849999999999998,43.879999999999995,29.88,36.33,35.08"/>
<path id="浴-s5"  class="stroke" stroke="#09bf52" d="M73.32,18.28C79.13,21.200000000000003,86.19999999999999,26.78,88.19,29.770000000000003"/>
<path id="浴-s6"  class="stroke" stroke="#09bfbf" d="M61.87,31.84C61.949999999999996,32.58,61.93,33.82,61.47,34.82C57.75,42.75,48.5,54.75,34.73,62.8"/>
<path id="浴-s7"  class="stroke" stroke="#0952bf" d="M62.01,36.55C69.89,43.56999999999999,80.2,52.059999999999995,87.49,57.01C90.11,58.79,91.85,59.989999999999995,94.67999999999999,61.4"/>
<path id="浴-s8"  class="stroke" stroke="#2d09bf" d="M44.8,67.14C45.58,67.92,46.269999999999996,68.98,46.48,70.01C47.669999999999995,75.69,48.419999999999995,81.34,49.5,87.75C49.68,88.81,49.86,89.88,50.04,90.95"/>
<path id="浴-s9"  class="stroke" stroke="#9a09bf" d="M47.03,68.93C57.9,67.07000000000001,70.51,65.42,77.88,64.52000000000001C80.96,64.14000000000001,83.27,65.42000000000002,82.32,68.73C80.72999999999999,74.33,79.72999999999999,78.15,78.21,85.18"/>
<path id="浴-s10"  class="stroke" stroke="#bf0976" d="M51.18,88.78C60.879999999999995,87.88,67.88,87.26,76.62,86.5C77.86,86.39,79.13000000000001,86.28,80.45,86.17"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="浴-bg1"  class="badge-group"><circle cx="17.76" cy="15.5" r="3.5" fill="#bf0909"/><text class="num-single" x="17.76" y="15.5" dx="0" dy="-0.5">1</text></g>
<g id="浴-bg2"  class="badge-group"><circle cx="12" cy="36.75" r="3.5" fill="#bf7609"/><text class="num-single" x="12" y="36.75" dx="0" dy="-0.5">2</text></g>
<g id="浴-bg3"  class="badge-group"><circle cx="10.91" cy="86.92" r="3.5" fill="#9abf09"/><text class="num-single" x="10.91" y="86.92" dx="0" dy="-0.5">3</text></g>
<g id="浴-bg4"  class="badge-group"><circle cx="51.82" cy="17.73" r="3.5" fill="#2dbf09"/><text class="num-single" x="51.82" y="17.73" dx="0" dy="-0.5">4</text></g>
<g id="浴-bg5"  class="badge-group"><circle cx="73.32" cy="18.28" r="3.5" fill="#09bf52"/><text class="num-single" x="73.32" y="18.28" dx="0" dy="-0.5">5</text></g>
<g id="浴-bg6"  class="badge-group"><circle cx="61.87" cy="28.34" r="3.5" fill="#09bfbf"/><text class="num-single" x="61.87" y="28.34" dx="0" dy="-0.5">6</text></g>
<g id="浴-bg7"  class="badge-group"><circle cx="62.01" cy="40.05" r="3.5" fill="#0952bf"/><text class="num-single" x="62.01" y="40.05" dx="0" dy="-0.5">7</text></g>
<g id="浴-bg8"  class="badge-group"><circle cx="44.8" cy="63.64" r="3.5" fill="#2d09bf"/><text class="num-single" x="44.8" y="63.64" dx="0" dy="-0.5">8</text></g>
<g id="浴-bg9"  class="badge-group"><circle cx="47.03" cy="72.43" r="3.5" fill="#9a09bf"/><text class="num-single" x="47.03" y="72.43" dx="0" dy="-0.5">9</text></g>
<g id="浴-bg10" class="badge-group"><circle cx="51.18" cy="88.78" r="3.5" fill="#bf0976"/><text class="num-double" x="51.18" y="88.78" dx="-0.4" dy="-0.475">10</text></g>
</svg>