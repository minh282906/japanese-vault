<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (札)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #札-bg[i]: Thời gian quả bóng số nảy lên
   - #札-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#札-bg1  { animation-delay: 0.05s; }
#札-s1   { stroke-dasharray: 36.3496; stroke-dashoffset: 36.3496; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#札-bg2  { animation-delay: 0.42s; }
#札-s2   { stroke-dasharray: 76.6250; stroke-dashoffset: 76.6250; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#札-bg3  { animation-delay: 0.99s; }
#札-s3   { stroke-dasharray: 39.5014; stroke-dashoffset: 39.5014; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#札-bg4  { animation-delay: 1.36s; }
#札-s4   { stroke-dasharray: 15.6277; stroke-dashoffset: 15.6277; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#札-bg5  { animation-delay: 1.73s; }
#札-s5   { stroke-dasharray: 105.9610; stroke-dashoffset: 105.9610; animation: drawStroke 0.55s ease-out 1.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #札-s[i]) -->
<path id="札-s1"  class="stroke" stroke="#bf0909" d="M14.28,40.72C16.5,41.25,18.25,41.129999999999995,20.41,40.9C26.98,40.19,40.9,37.51,47.04,36.87C47.97,36.769999999999996,49.379999999999995,36.629999999999995,50.269999999999996,36.87"/>
<path id="札-s2"  class="stroke" stroke="#9abf09" d="M33.86,16.5C35.05,17.69,35.4,19.5,35.4,21.17C35.4,21.98,35.36,68.24000000000001,35.35,86.37C35.35,89.38000000000001,35.35,91.62,35.35,92.75"/>
<path id="札-s3"  class="stroke" stroke="#09bf52" d="M34.44,39.78C34.44,40.870000000000005,33.919999999999995,42.230000000000004,33.53,43.17C28.68,54.92,23.4,63.77,14.36,73.34"/>
<path id="札-s4"  class="stroke" stroke="#0952bf" d="M39.25,50.25C42.48,51.99,47.78,57.63,50.5,61"/>
<path id="札-s5"  class="stroke" stroke="#9a09bf" d="M62.74,18.87C63.81,19.94,64.32000000000001,21.71,64.36,23.55C64.56,31.740000000000002,64.08,72.19,64.08,77.75C64.08,87.75,65.12,89.53,80,89.53C94.62,89.53,95.39,87.74,95.39,79.16"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="札-bg1"  class="badge-group"><circle cx="14.28" cy="40.72" r="3.5" fill="#bf0909"/><text class="num-single" x="14.28" y="40.72" dx="0" dy="-0.5">1</text></g>
<g id="札-bg2"  class="badge-group"><circle cx="33.86" cy="16.5" r="3.5" fill="#9abf09"/><text class="num-single" x="33.86" y="16.5" dx="0" dy="-0.5">2</text></g>
<g id="札-bg3"  class="badge-group"><circle cx="34.44" cy="39.78" r="3.5" fill="#09bf52"/><text class="num-single" x="34.44" y="39.78" dx="0" dy="-0.5">3</text></g>
<g id="札-bg4"  class="badge-group"><circle cx="39.25" cy="50.25" r="3.5" fill="#0952bf"/><text class="num-single" x="39.25" y="50.25" dx="0" dy="-0.5">4</text></g>
<g id="札-bg5"  class="badge-group"><circle cx="62.74" cy="18.87" r="3.5" fill="#9a09bf"/><text class="num-single" x="62.74" y="18.87" dx="0" dy="-0.5">5</text></g>
</svg>