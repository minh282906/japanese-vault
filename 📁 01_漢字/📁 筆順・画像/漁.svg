<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (漁)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #漁-bg[i]: Thời gian quả bóng số nảy lên
   - #漁-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#漁-bg1  { animation-delay: 0.05s; }
#漁-s1   { stroke-dasharray: 12.8077; stroke-dashoffset: 12.8077; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#漁-bg2  { animation-delay: 0.42s; }
#漁-s2   { stroke-dasharray: 13.9564; stroke-dashoffset: 13.9564; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#漁-bg3  { animation-delay: 0.79s; }
#漁-s3   { stroke-dasharray: 22.4329; stroke-dashoffset: 22.4329; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#漁-bg4  { animation-delay: 1.16s; }
#漁-s4   { stroke-dasharray: 28.1022; stroke-dashoffset: 28.1022; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#漁-bg5  { animation-delay: 1.53s; }
#漁-s5   { stroke-dasharray: 42.7721; stroke-dashoffset: 42.7721; animation: drawStroke 0.24s ease-out 1.66s forwards; }
#漁-bg6  { animation-delay: 1.92s; }
#漁-s6   { stroke-dasharray: 30.3489; stroke-dashoffset: 30.3489; animation: drawStroke 0.22s ease-out 2.05s forwards; }
#漁-bg7  { animation-delay: 2.29s; }
#漁-s7   { stroke-dasharray: 67.9812; stroke-dashoffset: 67.9812; animation: drawStroke 0.37s ease-out 2.42s forwards; }
#漁-bg8  { animation-delay: 2.81s; }
#漁-s8   { stroke-dasharray: 22.9064; stroke-dashoffset: 22.9064; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#漁-bg9  { animation-delay: 3.18s; }
#漁-s9   { stroke-dasharray: 35.8459; stroke-dashoffset: 35.8459; animation: drawStroke 0.22s ease-out 3.31s forwards; }
#漁-bg10  { animation-delay: 3.55s; }
#漁-s10   { stroke-dasharray: 32.5255; stroke-dashoffset: 32.5255; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#漁-bg11  { animation-delay: 3.92s; }
#漁-s11   { stroke-dasharray: 16.0721; stroke-dashoffset: 16.0721; animation: drawStroke 0.22s ease-out 4.05s forwards; }
#漁-bg12  { animation-delay: 4.29s; }
#漁-s12   { stroke-dasharray: 14.2552; stroke-dashoffset: 14.2552; animation: drawStroke 0.22s ease-out 4.42s forwards; }
#漁-bg13  { animation-delay: 4.66s; }
#漁-s13   { stroke-dasharray: 16.1020; stroke-dashoffset: 16.1020; animation: drawStroke 0.22s ease-out 4.79s forwards; }
#漁-bg14  { animation-delay: 5.03s; }
#漁-s14   { stroke-dasharray: 16.6163; stroke-dashoffset: 16.6163; animation: drawStroke 0.22s ease-out 5.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

