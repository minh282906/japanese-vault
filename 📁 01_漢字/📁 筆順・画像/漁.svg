<path id="漁-s6"  class="stroke" stroke="#09bf23" d="M45.53,41.57C46.480000000000004,42.52,47.02,43.67,47.34,45.38C48.27,50.300000000000004,48.81,59.660000000000004,49.42,67.38C49.53,68.75999999999999,49.64,70.08,49.760000000000005,71.32"/>
<path id="漁-s7"  class="stroke" stroke="#09bf71" d="M48.19,43.46C58.12,42.33,73.25,40.370000000000005,82.50999999999999,39.39C86.44,38.97,88.61999999999999,40.24,88.13999999999999,43.5C87.39999999999999,48.51,86.22999999999999,56.16,84.47999999999999,64.37C84.21999999999998,65.59,83.94999999999999,66.83,83.66,68.06"/>
<path id="漁-s8"  class="stroke" stroke="#09bfbf" d="M65.55,43.65C66.50999999999999,44.61,66.92,45.699999999999996,66.96,47.25C67.11999999999999,54.09,66.74,62.79,66.74,66.18"/>
<path id="漁-s9"  class="stroke" stroke="#0971bf" d="M49.67,56.13C57.5,55.25,79.12,52.88,85.33,52.5"/>
<path id="漁-s10"  class="stroke" stroke="#0923bf" d="M50.8,69.01C60.5,67.87,72.62,66.59,83.16,65.75"/>
<path id="漁-s11"  class="stroke" stroke="#3d09bf" d="M42.2,79.6C42.2,84.44999999999999,35.650000000000006,91.61,33.940000000000005,93"/>
<path id="漁-s12"  class="stroke" stroke="#8b09bf" d="M54.12,78.5C55.919999999999995,81.06,57.629999999999995,88.11,58.08,92.1"/>
<path id="漁-s13"  class="stroke" stroke="#bf09a5" d="M68.9,76.67C71.30000000000001,79.22,75.09,87.15,75.69000000000001,91.12"/>
<path id="漁-s14"  class="stroke" stroke="#bf0957" d="M87.29,77.12C90.45,79.55000000000001,95.46000000000001,87.10000000000001,96.25,90.88000000000001"/>

<!-- ============================================================
     BẢNG 14 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="漁-bg1"  class="badge-group"><circle cx="21.88" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="21.88" y="17" dx="0" dy="-0.5">1</text></g>
