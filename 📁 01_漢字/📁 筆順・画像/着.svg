<path id="着-s1"  class="stroke" stroke="#bf0909" d="M35.88,12.25C38.84,13.96,43.540000000000006,19.28,44.28,21.95"/>
<path id="着-s2"  class="stroke" stroke="#bf6409" d="M71.06,10.27C71.25,11.129999999999999,71.10000000000001,12.25,70.8,12.92C69.5,15.870000000000001,67.61999999999999,18.5,64.12,22.869999999999997"/>
