<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (着)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #着-bg[i]: Thời gian quả bóng số nảy lên
   - #着-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#着-bg1  { animation-delay: 0.05s; }
#着-s1   { stroke-dasharray: 13.0132; stroke-dashoffset: 13.0132; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#着-bg2  { animation-delay: 0.42s; }
#着-s2   { stroke-dasharray: 14.7196; stroke-dashoffset: 14.7196; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#着-bg3  { animation-delay: 0.79s; }
#着-s3   { stroke-dasharray: 49.0702; stroke-dashoffset: 49.0702; animation: drawStroke 0.27s ease-out 0.92s forwards; }
#着-bg4  { animation-delay: 1.21s; }
#着-s4   { stroke-dasharray: 20.2624; stroke-dashoffset: 20.2624; animation: drawStroke 0.22s ease-out 1.34s forwards; }
#着-bg5  { animation-delay: 1.58s; }
#着-s5   { stroke-dasharray: 45.0707; stroke-dashoffset: 45.0707; animation: drawStroke 0.25s ease-out 1.71s forwards; }
#着-bg6  { animation-delay: 1.98s; }
#着-s6   { stroke-dasharray: 77.8220; stroke-dashoffset: 77.8220; animation: drawStroke 0.43s ease-out 2.11s forwards; }
#着-bg7  { animation-delay: 2.56s; }
#着-s7   { stroke-dasharray: 37.4991; stroke-dashoffset: 37.4991; animation: drawStroke 0.22s ease-out 2.69s forwards; }
#着-bg8  { animation-delay: 2.93s; }
#着-s8   { stroke-dasharray: 40.5006; stroke-dashoffset: 40.5006; animation: drawStroke 0.22s ease-out 3.06s forwards; }
#着-bg9  { animation-delay: 3.30s; }
#着-s9   { stroke-dasharray: 70.4006; stroke-dashoffset: 70.4006; animation: drawStroke 0.39s ease-out 3.43s forwards; }
#着-bg10  { animation-delay: 3.84s; }
#着-s10   { stroke-dasharray: 29.6783; stroke-dashoffset: 29.6783; animation: drawStroke 0.22s ease-out 3.97s forwards; }
#着-bg11  { animation-delay: 4.21s; }
#着-s11   { stroke-dasharray: 29.3475; stroke-dashoffset: 29.3475; animation: drawStroke 0.22s ease-out 4.34s forwards; }
#着-bg12  { animation-delay: 4.58s; }
#着-s12   { stroke-dasharray: 29.4947; stroke-dashoffset: 29.4947; animation: drawStroke 0.22s ease-out 4.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

