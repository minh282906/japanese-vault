<path id="着-s5"  class="stroke" stroke="#09bf09" d="M31.86,39.49C33.38,39.88,35.47,40.17,36.75,40.06C46.13,39.25,60.629999999999995,37.5,71.7,36.35C73.81,36.13,75.60000000000001,36.25,76.67,36.410000000000004"/>
<path id="着-s6"  class="stroke" stroke="#09bf64" d="M17.8,52.62C19.900000000000002,53.099999999999994,23.76,53.05,25.86,52.849999999999994C39.129999999999995,51.62,68.38,48.61999999999999,87.97999999999999,47.44C91.47999999999999,47.23,93.58999999999999,47.419999999999995,95.33999999999999,47.66"/>
<path id="着-s7"  class="stroke" stroke="#09bfbf" d="M40.77,53.77C40.84,54.400000000000006,40.6,55.470000000000006,40.13,56.290000000000006C37,61.75,28.5,72.25,15.57,80.65"/>
<path id="着-s8"  class="stroke" stroke="#0964bf" d="M41.79,60.32C42.67,61.2,43.07,62.6,43.07,63.77C43.07,64.94,42.97,96.16,42.97,96.75C42.97,97.56,43.07,99.63,43.07,100.5"/>
<path id="着-s9"  class="stroke" stroke="#0909bf" d="M43.93,61.93C46.87,61.78,68.5,59.16,71.17,58.99C73.4,58.84,74.97,59.75,74.97,62.14C74.97,65.63,75.1,82.28,75.11,95.14C75.11,96.46,75.11,98.55,74.94,99.42"/>
<path id="着-s10"  class="stroke" stroke="#6409bf" d="M44.13,73.74C49.92,73.53999999999999,69.02000000000001,71.63,73.73,71.63"/>
<path id="着-s11"  class="stroke" stroke="#bf09bf" d="M44.37,85.28C52.15,84.79,66.25,83.37,73.63,83.03"/>
<path id="着-s12"  class="stroke" stroke="#bf0964" d="M44.29,97.47C51.25,97.13,66.18,95.91,73.74,95.91"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="着-bg1"  class="badge-group"><circle cx="35.88" cy="12.25" r="3.5" fill="#bf0909"/><text class="num-single" x="35.88" y="12.25" dx="0" dy="-0.5">1</text></g>
<g id="着-bg2"  class="badge-group"><circle cx="71.06" cy="10.27" r="3.5" fill="#bf6409"/><text class="num-single" x="71.06" y="10.27" dx="0" dy="-0.5">2</text></g>
