<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (切)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #切-bg[i]: Thời gian quả bóng số nảy lên
   - #切-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#切-bg1  { animation-delay: 0.05s; }
#切-s1   { stroke-dasharray: 31.7781; stroke-dashoffset: 31.7781; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#切-bg2  { animation-delay: 0.42s; }
#切-s2   { stroke-dasharray: 72.4435; stroke-dashoffset: 72.4435; animation: drawStroke 0.40s ease-out 0.55s forwards; }
#切-bg3  { animation-delay: 0.97s; }
#切-s3   { stroke-dasharray: 123.4580; stroke-dashoffset: 123.4580; animation: drawStroke 0.55s ease-out 1.10s forwards; }
#切-bg4  { animation-delay: 1.67s; }
#切-s4   { stroke-dasharray: 58.4664; stroke-dashoffset: 58.4664; animation: drawStroke 0.32s ease-out 1.80s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #切-s[i]) -->
<path id="切-s1"  class="stroke" stroke="#bf0909" d="M11.5,43.98C12.55,44.279999999999994,14.48,44.4,15.51,44.279999999999994C23.25,43.37,31,40.739999999999995,38.18,38.739999999999995C39.839999999999996,38.279999999999994,41.63,38.089999999999996,42.5,38.239999999999995"/>
<path id="切-s2"  class="stroke" stroke="#64bf09" d="M26.75,18.25C27.75,19.25,28.42,20.78,28.48,22.75C28.68,29.77,28,57.24,28,62.75C28,69.5,29,71,37.75,71C43.25,71,46.5,70.12,49.5,69"/>
<path id="切-s3"  class="stroke" stroke="#09bfbf" d="M52.75,29.75C55.14,30.77,57.769999999999996,30.69,60.230000000000004,30.32C70.75,28.75,83.75,26.5,91.5,25C95.95,24.14,98.12,25.88,97.75,30.5C96.68,43.74,92,73,85.5,86C80.3,96.4,75.62,88.5,73.25,86"/>
<path id="切-s4"  class="stroke" stroke="#6409bf" d="M68.25,36.62C68.7,37.949999999999996,68.6,39.769999999999996,68.36,41.53C66.21,57.2,58.36,74.35,43.25,87.5"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="切-bg1"  class="badge-group"><circle cx="11.5" cy="43.98" r="3.5" fill="#bf0909"/><text class="num-single" x="11.5" y="43.98" dx="0" dy="-0.5">1</text></g>
<g id="切-bg2"  class="badge-group"><circle cx="26.75" cy="18.25" r="3.5" fill="#64bf09"/><text class="num-single" x="26.75" y="18.25" dx="0" dy="-0.5">2</text></g>
<g id="切-bg3"  class="badge-group"><circle cx="52.75" cy="29.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.75" y="29.75" dx="0" dy="-0.5">3</text></g>
<g id="切-bg4"  class="badge-group"><circle cx="68.25" cy="36.62" r="3.5" fill="#6409bf"/><text class="num-single" x="68.25" y="36.62" dx="0" dy="-0.5">4</text></g>
</svg>