<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (像)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #像-bg[i]: Thời gian quả bóng số nảy lên
   - #像-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#像-bg1  { animation-delay: 0.05s; }
#像-s1   { stroke-dasharray: 45.8111; stroke-dashoffset: 45.8111; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#像-bg2  { animation-delay: 0.45s; }
#像-s2   { stroke-dasharray: 53.8688; stroke-dashoffset: 53.8688; animation: drawStroke 0.30s ease-out 0.58s forwards; }
#像-bg3  { animation-delay: 0.90s; }
#像-s3   { stroke-dasharray: 21.0646; stroke-dashoffset: 21.0646; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#像-bg4  { animation-delay: 1.27s; }
#像-s4   { stroke-dasharray: 30.6190; stroke-dashoffset: 30.6190; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#像-bg5  { animation-delay: 1.64s; }
#像-s5   { stroke-dasharray: 15.8182; stroke-dashoffset: 15.8182; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#像-bg6  { animation-delay: 2.01s; }
#像-s6   { stroke-dasharray: 56.8797; stroke-dashoffset: 56.8797; animation: drawStroke 0.31s ease-out 2.14s forwards; }
#像-bg7  { animation-delay: 2.47s; }
#像-s7   { stroke-dasharray: 10.5864; stroke-dashoffset: 10.5864; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#像-bg8  { animation-delay: 2.84s; }
#像-s8   { stroke-dasharray: 34.5520; stroke-dashoffset: 34.5520; animation: drawStroke 0.22s ease-out 2.97s forwards; }
#像-bg9  { animation-delay: 3.21s; }
#像-s9   { stroke-dasharray: 26.3666; stroke-dashoffset: 26.3666; animation: drawStroke 0.22s ease-out 3.34s forwards; }
#像-bg10  { animation-delay: 3.58s; }
#像-s10   { stroke-dasharray: 51.7793; stroke-dashoffset: 51.7793; animation: drawStroke 0.28s ease-out 3.71s forwards; }
#像-bg11  { animation-delay: 4.01s; }
#像-s11   { stroke-dasharray: 29.6168; stroke-dashoffset: 29.6168; animation: drawStroke 0.22s ease-out 4.14s forwards; }
#像-bg12  { animation-delay: 4.38s; }
#像-s12   { stroke-dasharray: 37.9257; stroke-dashoffset: 37.9257; animation: drawStroke 0.22s ease-out 4.51s forwards; }
#像-bg13  { animation-delay: 4.75s; }
#像-s13   { stroke-dasharray: 22.2892; stroke-dashoffset: 22.2892; animation: drawStroke 0.22s ease-out 4.88s forwards; }
#像-bg14  { animation-delay: 5.12s; }
#像-s14   { stroke-dasharray: 31.5972; stroke-dashoffset: 31.5972; animation: drawStroke 0.22s ease-out 5.25s forwards; }
]]>
</style>

