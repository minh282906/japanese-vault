<path id="像-s9"  class="stroke" stroke="#0971bf" d="M59.87,45.68C60.019999999999996,46.72,59.11,47.69,58.48,48.35C55.36,51.65,49.459999999999994,55.97,39.199999999999996,61.17"/>
<path id="像-s10"  class="stroke" stroke="#0923bf" d="M57.65,53.31C67.12,58.5,73,77.5,66.38,90.46C63.48,96.13,58.919999999999995,91.21,57.839999999999996,90.5"/>
<path id="像-s11"  class="stroke" stroke="#3d09bf" d="M58.15,57.56C58.32,58.690000000000005,58,59.510000000000005,57.36,60.45C54.81,64.21000000000001,47.1,70.07000000000001,35.620000000000005,75.25"/>
