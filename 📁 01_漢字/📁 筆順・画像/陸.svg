<path id="陸-s1"  class="stroke" stroke="#bf0909" d="M16.88,22.38C17.88,22.88,18.66,23.25,19.61,23.18C24.009999999999998,22.88,29.759999999999998,21.38,33.25,20.42C36.14,19.630000000000003,37.65,21.67,36.4,24S29.8,37.67,27.6,41"/>
