<path id="陸-s7"  class="stroke" stroke="#098dbf" d="M57.49,46.4C57.56,46.9,57.4,47.97,57.09,48.68C54.63,54.23,51.61,59.45,43.63,66.13"/>
<path id="陸-s8"  class="stroke" stroke="#092abf" d="M73.51,44.59C74.27000000000001,45.35,74.52000000000001,46.620000000000005,74.52000000000001,48.050000000000004C74.52000000000001,50.49,74.28000000000002,53.370000000000005,74.28000000000002,55.230000000000004C74.28000000000002,58.99,75.12000000000002,60.290000000000006,82.41000000000001,60.290000000000006C87.24000000000001,60.290000000000006,90.79,59.790000000000006,92.83000000000001,58.580000000000005"/>
<path id="陸-s9"  class="stroke" stroke="#4b09bf" d="M47.86,74.65C50,75.12,51.9,75.05000000000001,53.94,74.73C62,73.5,74.62,72,82.39,71.78C84.44,71.72,85.82000000000001,71.76,87.11,72.03"/>
<path id="陸-s10"  class="stroke" stroke="#ae09bf" d="M65.79,60.66C66.75,61.62,67.15,63,67.15,64.38C67.15,71.25,67.24000000000001,79.63,67.24000000000001,89.88"/>
<path id="陸-s11"  class="stroke" stroke="#bf096c" d="M40,91.65C41.73,92.23,44.97,92.64,47.21,92.51C59.32,91.82000000000001,71.92,90.54,88.19,90.10000000000001C90.28,90.04,93.25999999999999,90.2,96.07,90.69000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="陸-bg1"  class="badge-group"><circle cx="16.88" cy="18.88" r="3.5" fill="#bf0909"/><text class="num-single" x="16.88" y="18.88" dx="0" dy="-0.5">1</text></g>
