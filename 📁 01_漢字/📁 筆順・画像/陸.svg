<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (陸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #陸-bg[i]: Thời gian quả bóng số nảy lên
   - #陸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#陸-bg1  { animation-delay: 0.05s; }
#陸-s1   { stroke-dasharray: 42.4833; stroke-dashoffset: 42.4833; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#陸-bg2  { animation-delay: 0.43s; }
#陸-s2   { stroke-dasharray: 37.9557; stroke-dashoffset: 37.9557; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#陸-bg3  { animation-delay: 0.80s; }
#陸-s3   { stroke-dasharray: 72.2602; stroke-dashoffset: 72.2602; animation: drawStroke 0.40s ease-out 0.93s forwards; }
#陸-bg4  { animation-delay: 1.35s; }
#陸-s4   { stroke-dasharray: 34.2217; stroke-dashoffset: 34.2217; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#陸-bg5  { animation-delay: 1.72s; }
#陸-s5   { stroke-dasharray: 26.9080; stroke-dashoffset: 26.9080; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#陸-bg6  { animation-delay: 2.09s; }
#陸-s6   { stroke-dasharray: 55.2203; stroke-dashoffset: 55.2203; animation: drawStroke 0.30s ease-out 2.22s forwards; }
#陸-bg7  { animation-delay: 2.54s; }
#陸-s7   { stroke-dasharray: 24.6002; stroke-dashoffset: 24.6002; animation: drawStroke 0.22s ease-out 2.67s forwards; }
#陸-bg8  { animation-delay: 2.91s; }
#陸-s8   { stroke-dasharray: 32.8624; stroke-dashoffset: 32.8624; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#陸-bg9  { animation-delay: 3.28s; }
#陸-s9   { stroke-dasharray: 39.4725; stroke-dashoffset: 39.4725; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#陸-bg10  { animation-delay: 3.65s; }
#陸-s10   { stroke-dasharray: 29.5646; stroke-dashoffset: 29.5646; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#陸-bg11  { animation-delay: 4.02s; }
#陸-s11   { stroke-dasharray: 56.2622; stroke-dashoffset: 56.2622; animation: drawStroke 0.31s ease-out 4.15s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

