<path id="郵-s9"  class="stroke" stroke="#4b09bf" d="M67.92,23.27C69.63,23.87,70.49,23.86,72,23.759999999999998C77.87,23.369999999999997,85.25,21.869999999999997,89.09,21.189999999999998C92.72,20.549999999999997,94.12,22.119999999999997,92.57000000000001,25.389999999999997C91.27000000000001,28.119999999999997,83.61000000000001,40.809999999999995,80.87,44.51"/>
<path id="郵-s10"  class="stroke" stroke="#ae09bf" d="M80.87,44.51C101.5,58,94.5,90.5,83.57,76.45"/>
<path id="郵-s11"  class="stroke" stroke="#bf096c" d="M69.12,24.25C70.12,25.25,70.58,26.63,70.58,28.25C70.58,36.87,70.47,78.37,70.47,91.25C70.47,94.74,70.38,96.37,70.38,98.75"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="郵-bg1"  class="badge-group"><circle cx="46.08" cy="12.5" r="3.5" fill="#bf0909"/><text class="num-single" x="46.08" y="12.5" dx="0" dy="-0.5">1</text></g>
