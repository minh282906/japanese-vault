<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (郵)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #郵-bg[i]: Thời gian quả bóng số nảy lên
   - #郵-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#郵-bg1  { animation-delay: 0.05s; }
#郵-s1   { stroke-dasharray: 28.9424; stroke-dashoffset: 28.9424; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#郵-bg2  { animation-delay: 0.42s; }
#郵-s2   { stroke-dasharray: 41.7915; stroke-dashoffset: 41.7915; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#郵-bg3  { animation-delay: 0.80s; }
#郵-s3   { stroke-dasharray: 50.8471; stroke-dashoffset: 50.8471; animation: drawStroke 0.28s ease-out 0.93s forwards; }
#郵-bg4  { animation-delay: 1.23s; }
#郵-s4   { stroke-dasharray: 22.8875; stroke-dashoffset: 22.8875; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#郵-bg5  { animation-delay: 1.60s; }
#郵-s5   { stroke-dasharray: 22.7773; stroke-dashoffset: 22.7773; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#郵-bg6  { animation-delay: 1.97s; }
#郵-s6   { stroke-dasharray: 40.3524; stroke-dashoffset: 40.3524; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#郵-bg7  { animation-delay: 2.34s; }
#郵-s7   { stroke-dasharray: 55.6530; stroke-dashoffset: 55.6530; animation: drawStroke 0.31s ease-out 2.47s forwards; }
#郵-bg8  { animation-delay: 2.80s; }
#郵-s8   { stroke-dasharray: 42.5309; stroke-dashoffset: 42.5309; animation: drawStroke 0.23s ease-out 2.93s forwards; }
#郵-bg9  { animation-delay: 3.18s; }
#郵-s9   { stroke-dasharray: 51.5287; stroke-dashoffset: 51.5287; animation: drawStroke 0.28s ease-out 3.31s forwards; }
#郵-bg10  { animation-delay: 3.61s; }
#郵-s10   { stroke-dasharray: 48.6626; stroke-dashoffset: 48.6626; animation: drawStroke 0.27s ease-out 3.74s forwards; }
#郵-bg11  { animation-delay: 4.03s; }
#郵-s11   { stroke-dasharray: 74.8741; stroke-dashoffset: 74.8741; animation: drawStroke 0.41s ease-out 4.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

