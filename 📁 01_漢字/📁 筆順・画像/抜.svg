<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (抜)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #抜-bg[i]: Thời gian quả bóng số nảy lên
   - #抜-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#抜-bg1  { animation-delay: 0.05s; }
#抜-s1   { stroke-dasharray: 28.1998; stroke-dashoffset: 28.1998; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#抜-bg2  { animation-delay: 0.42s; }
#抜-s2   { stroke-dasharray: 84.0724; stroke-dashoffset: 84.0724; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#抜-bg3  { animation-delay: 1.03s; }
#抜-s3   { stroke-dasharray: 34.8405; stroke-dashoffset: 34.8405; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#抜-bg4  { animation-delay: 1.40s; }
#抜-s4   { stroke-dasharray: 43.9836; stroke-dashoffset: 43.9836; animation: drawStroke 0.24s ease-out 1.53s forwards; }
#抜-bg5  { animation-delay: 1.79s; }
#抜-s5   { stroke-dasharray: 78.2973; stroke-dashoffset: 78.2973; animation: drawStroke 0.43s ease-out 1.92s forwards; }
#抜-bg6  { animation-delay: 2.37s; }
#抜-s6   { stroke-dasharray: 85.7140; stroke-dashoffset: 85.7140; animation: drawStroke 0.47s ease-out 2.50s forwards; }
#抜-bg7  { animation-delay: 2.99s; }
#抜-s7   { stroke-dasharray: 48.1008; stroke-dashoffset: 48.1008; animation: drawStroke 0.26s ease-out 3.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #抜-s[i]) -->
<path id="抜-s1"  class="stroke" stroke="#bf0909" d="M10.75,37.42C12.74,37.660000000000004,14.6,37.870000000000005,16.64,37.59C21.310000000000002,36.95,28.37,35.550000000000004,35,34.52C36.21,34.330000000000005,37.37,34.25,38.66,34.25"/>
<path id="抜-s2"  class="stroke" stroke="#bfa509" d="M27.27,14.75C28.32,15.8,28.78,17.37,28.78,19.77C28.78,35,28.77,73.98,28.77,85.42C28.77,97,23.95,89.2,22.5,87.67"/>
<path id="抜-s3"  class="stroke" stroke="#3dbf09" d="M11,68.68C12.1,69.78,13.620000000000001,69.5,15.5,68.25C20.509999999999998,64.91,28.25,58.5,39.5,50.42"/>
<path id="抜-s4"  class="stroke" stroke="#09bf71" d="M45.13,36.46C47.160000000000004,37.06,50.03,36.93,52.13,36.550000000000004C63.25,34.5,71.88,32.88,82,31.67C84.17,31.41,86.53,31.520000000000003,88.63,31.89"/>
<path id="抜-s5"  class="stroke" stroke="#0971bf" d="M60.97,15.64C61.5,16.5,61.64,17.19,61.58,18.68C60.88,36.5,55.5,69.38,36,87.5"/>
<path id="抜-s6"  class="stroke" stroke="#3d09bf" d="M59.58,51.93C61.18,52.11,62.75,51.94,64.3,51.54C70.11,50.06,74.89999999999999,48.379999999999995,79.14,47.37C82.23,46.629999999999995,83.11,48.46,82.32000000000001,50.47C77.99,61.46,65.25,84,44,94.5"/>
<path id="抜-s7"  class="stroke" stroke="#bf09a5" d="M57,58.75C62.59,63.5,76.07,77.72,84.3,84.84C86.89999999999999,87.09,89.72,89.12,92.75,90.75"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="抜-bg1"  class="badge-group"><circle cx="10.75" cy="37.42" r="3.5" fill="#bf0909"/><text class="num-single" x="10.75" y="37.42" dx="0" dy="-0.5">1</text></g>
<g id="抜-bg2"  class="badge-group"><circle cx="27.27" cy="14.75" r="3.5" fill="#bfa509"/><text class="num-single" x="27.27" y="14.75" dx="0" dy="-0.5">2</text></g>
<g id="抜-bg3"  class="badge-group"><circle cx="11" cy="68.68" r="3.5" fill="#3dbf09"/><text class="num-single" x="11" y="68.68" dx="0" dy="-0.5">3</text></g>
<g id="抜-bg4"  class="badge-group"><circle cx="45.13" cy="36.46" r="3.5" fill="#09bf71"/><text class="num-single" x="45.13" y="36.46" dx="0" dy="-0.5">4</text></g>
<g id="抜-bg5"  class="badge-group"><circle cx="60.97" cy="15.64" r="3.5" fill="#0971bf"/><text class="num-single" x="60.97" y="15.64" dx="0" dy="-0.5">5</text></g>
<g id="抜-bg6"  class="badge-group"><circle cx="59.58" cy="51.93" r="3.5" fill="#3d09bf"/><text class="num-single" x="59.58" y="51.93" dx="0" dy="-0.5">6</text></g>
<g id="抜-bg7"  class="badge-group"><circle cx="57" cy="58.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="57" y="58.75" dx="0" dy="-0.5">7</text></g>
</svg>