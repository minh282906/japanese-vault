<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (文)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #文-bg[i]: Thời gian quả bóng số nảy lên
   - #文-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#文-bg1  { animation-delay: 0.05s; }
#文-s1   { stroke-dasharray: 16.6313; stroke-dashoffset: 16.6313; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#文-bg2  { animation-delay: 0.42s; }
#文-s2   { stroke-dasharray: 74.3583; stroke-dashoffset: 74.3583; animation: drawStroke 0.41s ease-out 0.55s forwards; }
#文-bg3  { animation-delay: 0.98s; }
#文-s3   { stroke-dasharray: 82.2573; stroke-dashoffset: 82.2573; animation: drawStroke 0.45s ease-out 1.11s forwards; }
#文-bg4  { animation-delay: 1.58s; }
#文-s4   { stroke-dasharray: 78.1184; stroke-dashoffset: 78.1184; animation: drawStroke 0.43s ease-out 1.71s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #文-s[i]) -->
<path id="文-s1"  class="stroke" stroke="#bf0909" d="M51.62,12.75C52.68,13.81,53.349999999999994,15.25,53.349999999999994,16.759999999999998C53.349999999999994,21.08,53.239999999999995,24.369999999999997,53.239999999999995,28.909999999999997"/>
<path id="文-s2"  class="stroke" stroke="#64bf09" d="M16.88,32.72C19.58,33.379999999999995,22.59,33.58,25.479999999999997,33.26C41.25,31.499999999999996,65.63,28.25,81.9,27.159999999999997C85.57000000000001,26.909999999999997,88.05000000000001,27.209999999999997,90.78,27.849999999999998"/>
<path id="文-s3"  class="stroke" stroke="#09bfbf" d="M69.89,32.5C70.25,34.62,69.95,36.32,68.96,38.769999999999996C61.62,57,43.75,80.25,18.75,93.75"/>
<path id="文-s4"  class="stroke" stroke="#6409bf" d="M31,43.75C37,43.75,58.269999999999996,70.53999999999999,80.25999999999999,85.85C84.38999999999999,88.72,87.74999999999999,90.61999999999999,91.74999999999999,91.89"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="文-bg1"  class="badge-group"><circle cx="51.62" cy="12.75" r="3.5" fill="#bf0909"/><text class="num-single" x="51.62" y="12.75" dx="0" dy="-0.5">1</text></g>
<g id="文-bg2"  class="badge-group"><circle cx="16.88" cy="32.72" r="3.5" fill="#64bf09"/><text class="num-single" x="16.88" y="32.72" dx="0" dy="-0.5">2</text></g>
<g id="文-bg3"  class="badge-group"><circle cx="69.89" cy="32.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="69.89" y="32.5" dx="0" dy="-0.5">3</text></g>
<g id="文-bg4"  class="badge-group"><circle cx="31" cy="43.75" r="3.5" fill="#6409bf"/><text class="num-single" x="31" y="43.75" dx="0" dy="-0.5">4</text></g>
</svg>