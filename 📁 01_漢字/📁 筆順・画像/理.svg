<path id="理-s6"  class="stroke" stroke="#09bf8d" d="M48.79,20.78C61.25,18.75,79.75,16,88.52,15.280000000000001C91.67,15.020000000000001,93.25,16.93,93.09,18.54C92.61,23.349999999999998,90.86,37.45,89.48,46.58C89.17,48.629999999999995,88.88000000000001,50.44,88.62,51.83"/>
<path id="理-s7"  class="stroke" stroke="#098dbf" d="M51.2,35.59C57.25,34.75,82.25,32.120000000000005,90.34,32.06"/>
<path id="理-s8"  class="stroke" stroke="#092abf" d="M52.67,52.28C62.25,51.5,74.75,50,87.86,49.26"/>
<path id="理-s9"  class="stroke" stroke="#4b09bf" d="M67.75,20.75C68.63,21.63,69.16,22.74,69.19,23.759999999999998C69.49,36.65,69.31,83.06,69.31,87.75"/>
<path id="理-s10"  class="stroke" stroke="#ae09bf" d="M52.15,69.29C53.53,69.68,56.06,69.78,57.449999999999996,69.68C66.47,69.01,73.00999999999999,67.76,81.97,66.51C84.24,66.19000000000001,85.63,66.25,88,66.25"/>
<path id="理-s11"  class="stroke" stroke="#bf096c" d="M40.13,91C41.7,91.54,44.6,91.73,46.17,91.54C63,89.49000000000001,81.25,87.24000000000001,93.62,87.27000000000001C96.24000000000001,87.28000000000002,97.82000000000001,87.53000000000002,99.13000000000001,87.80000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="理-bg1"  class="badge-group"><circle cx="11.75" cy="27.75" r="3.5" fill="#bf0909"/><text class="num-single" x="11.75" y="27.75" dx="0" dy="-0.5">1</text></g>
<g id="理-bg2"  class="badge-group"><circle cx="26.25" cy="30.25" r="3.5" fill="#bf6c09"/><text class="num-single" x="26.25" y="30.25" dx="0" dy="-0.5">2</text></g>
