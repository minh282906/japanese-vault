<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (理)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #理-bg[i]: Thời gian quả bóng số nảy lên
   - #理-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#理-bg1  { animation-delay: 0.05s; }
#理-s1   { stroke-dasharray: 28.5766; stroke-dashoffset: 28.5766; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#理-bg2  { animation-delay: 0.42s; }
#理-s2   { stroke-dasharray: 47.2336; stroke-dashoffset: 47.2336; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#理-bg3  { animation-delay: 0.83s; }
#理-s3   { stroke-dasharray: 24.5849; stroke-dashoffset: 24.5849; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#理-bg4  { animation-delay: 1.20s; }
#理-s4   { stroke-dasharray: 28.8346; stroke-dashoffset: 28.8346; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#理-bg5  { animation-delay: 1.57s; }
#理-s5   { stroke-dasharray: 37.2227; stroke-dashoffset: 37.2227; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#理-bg6  { animation-delay: 1.94s; }
#理-s6   { stroke-dasharray: 80.1068; stroke-dashoffset: 80.1068; animation: drawStroke 0.44s ease-out 2.07s forwards; }
#理-bg7  { animation-delay: 2.53s; }
#理-s7   { stroke-dasharray: 39.3107; stroke-dashoffset: 39.3107; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#理-bg8  { animation-delay: 2.90s; }
#理-s8   { stroke-dasharray: 35.3216; stroke-dashoffset: 35.3216; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#理-bg9  { animation-delay: 3.27s; }
#理-s9   { stroke-dasharray: 67.4049; stroke-dashoffset: 67.4049; animation: drawStroke 0.37s ease-out 3.40s forwards; }
#理-bg10  { animation-delay: 3.79s; }
#理-s10   { stroke-dasharray: 36.1060; stroke-dashoffset: 36.1060; animation: drawStroke 0.22s ease-out 3.92s forwards; }
#理-bg11  { animation-delay: 4.16s; }
#理-s11   { stroke-dasharray: 59.3133; stroke-dashoffset: 59.3133; animation: drawStroke 0.33s ease-out 4.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #理-s[i]) -->
