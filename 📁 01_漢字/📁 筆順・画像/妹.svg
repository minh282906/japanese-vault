<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (妹)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #妹-bg[i]: Thời gian quả bóng số nảy lên
   - #妹-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#妹-bg1  { animation-delay: 0.05s; }
#妹-s1   { stroke-dasharray: 69.4871; stroke-dashoffset: 69.4871; animation: drawStroke 0.38s ease-out 0.18s forwards; }
#妹-bg2  { animation-delay: 0.58s; }
#妹-s2   { stroke-dasharray: 63.5343; stroke-dashoffset: 63.5343; animation: drawStroke 0.35s ease-out 0.71s forwards; }
#妹-bg3  { animation-delay: 1.08s; }
#妹-s3   { stroke-dasharray: 38.7270; stroke-dashoffset: 38.7270; animation: drawStroke 0.22s ease-out 1.21s forwards; }
#妹-bg4  { animation-delay: 1.45s; }
#妹-s4   { stroke-dasharray: 31.1281; stroke-dashoffset: 31.1281; animation: drawStroke 0.22s ease-out 1.58s forwards; }
#妹-bg5  { animation-delay: 1.82s; }
#妹-s5   { stroke-dasharray: 48.1280; stroke-dashoffset: 48.1280; animation: drawStroke 0.26s ease-out 1.95s forwards; }
#妹-bg6  { animation-delay: 2.23s; }
#妹-s6   { stroke-dasharray: 84.2569; stroke-dashoffset: 84.2569; animation: drawStroke 0.46s ease-out 2.36s forwards; }
#妹-bg7  { animation-delay: 2.84s; }
#妹-s7   { stroke-dasharray: 47.2283; stroke-dashoffset: 47.2283; animation: drawStroke 0.26s ease-out 2.97s forwards; }
#妹-bg8  { animation-delay: 3.25s; }
#妹-s8   { stroke-dasharray: 43.9564; stroke-dashoffset: 43.9564; animation: drawStroke 0.24s ease-out 3.38s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #妹-s[i]) -->
<path id="妹-s1"  class="stroke" stroke="#bf0909" d="M26.55,18.62C26.88,19.73,27.240000000000002,21.55,27.060000000000002,23.16C25.76,34.88,23.26,52,20.69,61.84C20.17,63.82,21.03,64.52000000000001,21.450000000000003,64.65C26.290000000000003,66.2,31.480000000000004,68.7,35.45,72.57000000000001C36.86,73.95,38.150000000000006,75.93,39.260000000000005,77.51"/>
<path id="妹-s2"  class="stroke" stroke="#bf9109" d="M39.73,34.75C40.5,36.53,40.379999999999995,37.82,40.089999999999996,39.76C37.71,55.44,30.1,78.2,13.12,89.88"/>
<path id="妹-s3"  class="stroke" stroke="#64bf09" d="M10,47.71C10.88,49,12.27,49.39,14.25,49C23.25,47.25,36.58,44.269999999999996,47.5,41.97"/>
<path id="妹-s4"  class="stroke" stroke="#09bf36" d="M51.84,34.46C53.03,34.660000000000004,54.980000000000004,34.54,56.17,34.410000000000004C62.25,33.75000000000001,72.25,32.260000000000005,78.57,31.500000000000004C80.52999999999999,31.270000000000003,81.75,31.600000000000005,82.75,31.690000000000005"/>
<path id="妹-s5"  class="stroke" stroke="#09bfbf" d="M44.25,51.25C46.51,51.75,48.13,51.86,51.05,51.5C59.25,50.5,75.37,48.25,85.69,47.61C88.39,47.44,90.25,47.75,92.02,48.36"/>
<path id="妹-s6"  class="stroke" stroke="#0936bf" d="M65.14,13.25C66.38,14.49,67,16,67,17.72C67,22.25,67.07,68.86,66.86,89.25C66.82,93.27,66.78,96.06,66.73,97"/>
<path id="妹-s7"  class="stroke" stroke="#6409bf" d="M64.75,51C64.75,52.5,64.33,53.54,63.95,54.33C57.88,66.75,48.5,80,36.25,87.5"/>
<path id="妹-s8"  class="stroke" stroke="#bf0991" d="M68,51C72.56,59.8,81.2,71.09,88.34,78.47C90.36,80.56,93.25,82.88,95.88000000000001,84.5"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="妹-bg1"  class="badge-group"><circle cx="26.55" cy="18.62" r="3.5" fill="#bf0909"/><text class="num-single" x="26.55" y="18.62" dx="0" dy="-0.5">1</text></g>
<g id="妹-bg2"  class="badge-group"><circle cx="39.73" cy="34.75" r="3.5" fill="#bf9109"/><text class="num-single" x="39.73" y="34.75" dx="0" dy="-0.5">2</text></g>
<g id="妹-bg3"  class="badge-group"><circle cx="10" cy="47.71" r="3.5" fill="#64bf09"/><text class="num-single" x="10" y="47.71" dx="0" dy="-0.5">3</text></g>
<g id="妹-bg4"  class="badge-group"><circle cx="51.84" cy="34.46" r="3.5" fill="#09bf36"/><text class="num-single" x="51.84" y="34.46" dx="0" dy="-0.5">4</text></g>
<g id="妹-bg5"  class="badge-group"><circle cx="44.25" cy="51.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="44.25" y="51.25" dx="0" dy="-0.5">5</text></g>
<g id="妹-bg6"  class="badge-group"><circle cx="65.14" cy="13.25" r="3.5" fill="#0936bf"/><text class="num-single" x="65.14" y="13.25" dx="0" dy="-0.5">6</text></g>
<g id="妹-bg7"  class="badge-group"><circle cx="64.75" cy="47.5" r="3.5" fill="#6409bf"/><text class="num-single" x="64.75" y="47.5" dx="0" dy="-0.5">7</text></g>
<g id="妹-bg8"  class="badge-group"><circle cx="68" cy="54.5" r="3.5" fill="#bf0991"/><text class="num-single" x="68" y="54.5" dx="0" dy="-0.5">8</text></g>
</svg>