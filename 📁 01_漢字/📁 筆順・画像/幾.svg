<path id="幾-s5"  class="stroke" stroke="#09bf09" d="M80.95,21.56C81.13000000000001,22.38,80.82000000000001,23.47,80.45,23.99C75.88,30.38,71.63,35.879999999999995,64.49000000000001,43.19C62.89000000000001,44.83,64.88000000000001,45.78,65.92000000000002,45.44C70.26000000000002,44.04,76.13000000000002,41.879999999999995,82.25000000000001,40.07"/>
<path id="幾-s6"  class="stroke" stroke="#09bf64" d="M80,35.25C82.4,37.1,86.76,42.37,87.36,45.25"/>
<path id="幾-s7"  class="stroke" stroke="#09bfbf" d="M16.5,62.48C20,63.37,24.2,63.22,27.73,62.76C40.15,61.14,67.79,57.43,83.12,56.51C86.45,56.309999999999995,89.71000000000001,56.37,93,57.08"/>
<path id="幾-s8"  class="stroke" stroke="#0964bf" d="M33.5,65.43C33.56,66.30000000000001,33.6,67.18,33.34,68.03C30.720000000000002,76.73,25.610000000000003,86.95,15.800000000000004,95.25"/>
<path id="幾-s9"  class="stroke" stroke="#0909bf" d="M34.12,75.62C36.97,76.71000000000001,42.15,80.9,44.739999999999995,85.28"/>
<path id="幾-s10"  class="stroke" stroke="#6409bf" d="M49.75,11.5C51.47,13.34,52.01,15.09,52.29,19.04C54.5,50,64.5,83,84.75,95.25C91.44,99.3,92,98.13,90.85,88.58"/>
<path id="幾-s11"  class="stroke" stroke="#bf09bf" d="M78.71,62.93C78.80999999999999,63.69,78.67999999999999,64.63,78.25,65.72C75.74,72.13,64.06,86.9,44.31,95.50999999999999"/>
<path id="幾-s12"  class="stroke" stroke="#bf0964" d="M73,47.53C75.2,48.43,78.72,50.49,79.75,52.03"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
