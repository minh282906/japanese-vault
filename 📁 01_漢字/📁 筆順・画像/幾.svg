<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (幾)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #幾-bg[i]: Thời gian quả bóng số nảy lên
   - #幾-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#幾-bg1  { animation-delay: 0.05s; }
#幾-s1   { stroke-dasharray: 30.4292; stroke-dashoffset: 30.4292; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#幾-bg2  { animation-delay: 0.42s; }
#幾-s2   { stroke-dasharray: 51.8923; stroke-dashoffset: 51.8923; animation: drawStroke 0.29s ease-out 0.55s forwards; }
#幾-bg3  { animation-delay: 0.86s; }
#幾-s3   { stroke-dasharray: 12.2528; stroke-dashoffset: 12.2528; animation: drawStroke 0.22s ease-out 0.99s forwards; }
#幾-bg4  { animation-delay: 1.23s; }
#幾-s4   { stroke-dasharray: 25.4552; stroke-dashoffset: 25.4552; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#幾-bg5  { animation-delay: 1.60s; }
#幾-s5   { stroke-dasharray: 48.6865; stroke-dashoffset: 48.6865; animation: drawStroke 0.27s ease-out 1.73s forwards; }
#幾-bg6  { animation-delay: 2.02s; }
#幾-s6   { stroke-dasharray: 12.5685; stroke-dashoffset: 12.5685; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#幾-bg7  { animation-delay: 2.39s; }
#幾-s7   { stroke-dasharray: 76.9754; stroke-dashoffset: 76.9754; animation: drawStroke 0.42s ease-out 2.52s forwards; }
#幾-bg8  { animation-delay: 2.96s; }
#幾-s8   { stroke-dasharray: 35.4612; stroke-dashoffset: 35.4612; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#幾-bg9  { animation-delay: 3.33s; }
#幾-s9   { stroke-dasharray: 14.5507; stroke-dashoffset: 14.5507; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#幾-bg10  { animation-delay: 3.70s; }
#幾-s10   { stroke-dasharray: 108.9690; stroke-dashoffset: 108.9690; animation: drawStroke 0.55s ease-out 3.83s forwards; }
#幾-bg11  { animation-delay: 4.40s; }
#幾-s11   { stroke-dasharray: 48.8948; stroke-dashoffset: 48.8948; animation: drawStroke 0.27s ease-out 4.53s forwards; }
#幾-bg12  { animation-delay: 4.82s; }
#幾-s12   { stroke-dasharray: 8.1885; stroke-dashoffset: 8.1885; animation: drawStroke 0.22s ease-out 4.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #幾-s[i]) -->
<path id="幾-s1"  class="stroke" stroke="#bf0909" d="M33.07,15.5C33.35,16.61,33.11,17.8,32.43,18.89C29.45,23.69,27.259999999999998,27,24.15,31.05C23.669999999999998,31.67,23.84,33.11,24.4,33.32C26.029999999999998,33.93,28.63,34.88,33.19,37.31"/>
