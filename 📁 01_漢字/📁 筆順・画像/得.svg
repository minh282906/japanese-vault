<path id="得-s4"  class="stroke" stroke="#4bbf09" d="M52.17,12.66C53.190000000000005,13.68,53.5,14.75,53.67,16.01C53.760000000000005,16.650000000000002,55.18,30.42,55.910000000000004,37.730000000000004C56.17,40.300000000000004,56.34,42.080000000000005,56.34,42.190000000000005"/>
<path id="得-s5"  class="stroke" stroke="#09bf2a" d="M54.26,14.02C58.129999999999995,13.67,74.28999999999999,12.35,80.75,11.879999999999999C84.07,11.639999999999999,86.31,11.69,86,15.639999999999999C85.55,21.369999999999997,84.73,27.31,83.79,34.379999999999995C83.56,36.099999999999994,83.33000000000001,37.879999999999995,83.09,39.739999999999995"/>
<path id="得-s6"  class="stroke" stroke="#09bf8d" d="M56.01,26.17C63.25,25.5,79.67,24.080000000000002,84,24.080000000000002"/>
<path id="得-s7"  class="stroke" stroke="#098dbf" d="M57.51,39.3C65.5,38.75,74.25,37.87,81.92,37.68"/>
<path id="得-s8"  class="stroke" stroke="#092abf" d="M40.75,53C42.83,53.5,46.67,53.47,48.74,53.25C64.12,51.63,77.12,50.13,91.58000000000001,49.01C95.04,48.739999999999995,97.14000000000001,49,98.88000000000001,49.25"/>
<path id="得-s9"  class="stroke" stroke="#4b09bf" d="M45.25,67.67C47.56,68.12,50.13,68.14,52.1,67.97C65.85,66.75,79.74000000000001,64.75,91.06,64.28999999999999C94.3,64.16,96.25,64.16999999999999,97.88,64.57"/>
<path id="得-s10"  class="stroke" stroke="#ae09bf" d="M81.39,55.08C82.65,56.339999999999996,83.15,57.87,83.15,59.849999999999994C83.15,74.41,83.23,87.50999999999999,83.14,92.47C83,100.75,78.13,95.25,75.43,92.47"/>
<path id="得-s11"  class="stroke" stroke="#bf096c" d="M57.83,75.87C60.48,77.46000000000001,64.67,82.4,65.33,84.87"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="得-bg1"  class="badge-group"><circle cx="34.25" cy="12.62" r="3.5" fill="#bf0909"/><text class="num-single" x="34.25" y="12.62" dx="0" dy="-0.5">1</text></g>
