<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (得)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #得-bg[i]: Thời gian quả bóng số nảy lên
   - #得-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#得-bg1  { animation-delay: 0.05s; }
#得-s1   { stroke-dasharray: 28.1629; stroke-dashoffset: 28.1629; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#得-bg2  { animation-delay: 0.42s; }
#得-s2   { stroke-dasharray: 41.0982; stroke-dashoffset: 41.0982; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#得-bg3  { animation-delay: 0.80s; }
#得-s3   { stroke-dasharray: 44.8705; stroke-dashoffset: 44.8705; animation: drawStroke 0.25s ease-out 0.93s forwards; }
#得-bg4  { animation-delay: 1.20s; }
#得-s4   { stroke-dasharray: 30.0627; stroke-dashoffset: 30.0627; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#得-bg5  { animation-delay: 1.57s; }
#得-s5   { stroke-dasharray: 58.8127; stroke-dashoffset: 58.8127; animation: drawStroke 0.32s ease-out 1.70s forwards; }
#得-bg6  { animation-delay: 2.04s; }
#得-s6   { stroke-dasharray: 28.0720; stroke-dashoffset: 28.0720; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#得-bg7  { animation-delay: 2.41s; }
#得-s7   { stroke-dasharray: 24.4663; stroke-dashoffset: 24.4663; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#得-bg8  { animation-delay: 2.78s; }
#得-s8   { stroke-dasharray: 58.3936; stroke-dashoffset: 58.3936; animation: drawStroke 0.32s ease-out 2.91s forwards; }
#得-bg9  { animation-delay: 3.25s; }
#得-s9   { stroke-dasharray: 52.8631; stroke-dashoffset: 52.8631; animation: drawStroke 0.29s ease-out 3.38s forwards; }
#得-bg10  { animation-delay: 3.69s; }
#得-s10   { stroke-dasharray: 50.4851; stroke-dashoffset: 50.4851; animation: drawStroke 0.28s ease-out 3.82s forwards; }
#得-bg11  { animation-delay: 4.12s; }
#得-s11   { stroke-dasharray: 11.8786; stroke-dashoffset: 11.8786; animation: drawStroke 0.22s ease-out 4.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

