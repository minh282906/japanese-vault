<path id="森-s5"  class="stroke" stroke="#09bf09" d="M12.46,61.06C13.23,61.28,15.56,61.480000000000004,17.6,61.31C24.25,60.75,32.75,59.620000000000005,40.730000000000004,58.82C42.77,58.61,44.580000000000005,58.4,45.86000000000001,58.62"/>
<path id="森-s6"  class="stroke" stroke="#09bf64" d="M32.61,46.29C33.47,47.15,34.03,48.25,34.03,49.45C34.03,50.24,34.09,80.91,33.89,93.51C33.86,95.68,33.82,97.29,33.79,98.11"/>
<path id="森-s7"  class="stroke" stroke="#09bfbf" d="M33.07,60.68C33.07,61.88,32.63,62.7,32.03,63.8C28,71.12,19.75,83,13.5,88"/>
<path id="森-s8"  class="stroke" stroke="#0964bf" d="M37.61,67.19C39.69,68.62,42.3,71.25999999999999,44.12,73.5"/>
<path id="森-s9"  class="stroke" stroke="#0909bf" d="M52.28,59.98C54,60.12,55.1,60.07,56.82,59.9C65.75,58.99,74.63,58.24,83.28999999999999,57.47C85.3,57.29,87.05999999999999,57.25,88.33,57.47"/>
<path id="森-s10"  class="stroke" stroke="#6409bf" d="M68.12,42.75C69.19,43.81,69.54,45.37,69.54,46.66C69.54,47.459999999999994,69.60000000000001,81.94,69.39,94.75C69.36,96.76,69.33,98.24,69.29,99"/>
<path id="森-s11"  class="stroke" stroke="#bf09bf" d="M67.84,59.75C67.84,60.75,67.65,61.37,67.03,62.62C62.510000000000005,71.84,52.42,84.36,45.25,88.75999999999999"/>
<path id="森-s12"  class="stroke" stroke="#bf0964" d="M69.77,58.93C76.82,69.45,88.11,82.95,93.84,87.1C95.47,88.28,96.39,89.1,97.76,89.5"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="森-bg1"  class="badge-group"><circle cx="30.12" cy="23.67" r="3.5" fill="#bf0909"/><text class="num-single" x="30.12" y="23.67" dx="0" dy="-0.5">1</text></g>
