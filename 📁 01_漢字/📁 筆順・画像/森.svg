<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (森)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #森-bg[i]: Thời gian quả bóng số nảy lên
   - #森-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#森-bg1  { animation-delay: 0.05s; }
#森-s1   { stroke-dasharray: 47.3134; stroke-dashoffset: 47.3134; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#森-bg2  { animation-delay: 0.46s; }
#森-s2   { stroke-dasharray: 38.5961; stroke-dashoffset: 38.5961; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#森-bg3  { animation-delay: 0.83s; }
#森-s3   { stroke-dasharray: 39.3051; stroke-dashoffset: 39.3051; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#森-bg4  { animation-delay: 1.20s; }
#森-s4   { stroke-dasharray: 39.0029; stroke-dashoffset: 39.0029; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#森-bg5  { animation-delay: 1.57s; }
#森-s5   { stroke-dasharray: 33.5751; stroke-dashoffset: 33.5751; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#森-bg6  { animation-delay: 1.94s; }
#森-s6   { stroke-dasharray: 52.2177; stroke-dashoffset: 52.2177; animation: drawStroke 0.29s ease-out 2.07s forwards; }
#森-bg7  { animation-delay: 2.38s; }
#森-s7   { stroke-dasharray: 33.9497; stroke-dashoffset: 33.9497; animation: drawStroke 0.22s ease-out 2.51s forwards; }
#森-bg8  { animation-delay: 2.75s; }
#森-s8   { stroke-dasharray: 9.0918; stroke-dashoffset: 9.0918; animation: drawStroke 0.22s ease-out 2.88s forwards; }
#森-bg9  { animation-delay: 3.12s; }
#森-s9   { stroke-dasharray: 36.1825; stroke-dashoffset: 36.1825; animation: drawStroke 0.22s ease-out 3.25s forwards; }
#森-bg10  { animation-delay: 3.49s; }
#森-s10   { stroke-dasharray: 56.6097; stroke-dashoffset: 56.6097; animation: drawStroke 0.31s ease-out 3.62s forwards; }
#森-bg11  { animation-delay: 3.95s; }
#森-s11   { stroke-dasharray: 37.3585; stroke-dashoffset: 37.3585; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#森-bg12  { animation-delay: 4.32s; }
#森-s12   { stroke-dasharray: 41.7912; stroke-dashoffset: 41.7912; animation: drawStroke 0.23s ease-out 4.45s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

