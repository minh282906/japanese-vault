<path id="森-s1"  class="stroke" stroke="#bf0909" d="M30.12,23.67C30.990000000000002,23.91,34.52,24.290000000000003,36.82,24C48.19,22.6,56.84,22,72.87,20.79C75.19,20.61,75.79,20.55,77.24000000000001,20.79"/>
