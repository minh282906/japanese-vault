<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (点)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #点-bg[i]: Thời gian quả bóng số nảy lên
   - #点-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#点-bg1  { animation-delay: 0.05s; }
#点-s1   { stroke-dasharray: 35.4901; stroke-dashoffset: 35.4901; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#点-bg2  { animation-delay: 0.42s; }
#点-s2   { stroke-dasharray: 20.8592; stroke-dashoffset: 20.8592; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#点-bg3  { animation-delay: 0.79s; }
#点-s3   { stroke-dasharray: 24.7619; stroke-dashoffset: 24.7619; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#点-bg4  { animation-delay: 1.16s; }
#点-s4   { stroke-dasharray: 63.2803; stroke-dashoffset: 63.2803; animation: drawStroke 0.35s ease-out 1.29s forwards; }
#点-bg5  { animation-delay: 1.66s; }
#点-s5   { stroke-dasharray: 39.2590; stroke-dashoffset: 39.2590; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#点-bg6  { animation-delay: 2.03s; }
#点-s6   { stroke-dasharray: 18.4406; stroke-dashoffset: 18.4406; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#点-bg7  { animation-delay: 2.40s; }
#点-s7   { stroke-dasharray: 15.7332; stroke-dashoffset: 15.7332; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#点-bg8  { animation-delay: 2.77s; }
#点-s8   { stroke-dasharray: 16.3798; stroke-dashoffset: 16.3798; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#点-bg9  { animation-delay: 3.14s; }
#点-s9   { stroke-dasharray: 19.9346; stroke-dashoffset: 19.9346; animation: drawStroke 0.22s ease-out 3.27s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #点-s[i]) -->
<path id="点-s1"  class="stroke" stroke="#bf0909" d="M52.7,10.88C53.910000000000004,12.09,54.6,13.75,54.6,15.09C54.6,15.78,54.53,41.620000000000005,54.410000000000004,45.85"/>
<path id="点-s2"  class="stroke" stroke="#bf8209" d="M56.3,29.5C62.26,28.5,68.78,27.25,73.31,26.42C74.28,26.240000000000002,76.07000000000001,26.42,76.86,26.610000000000003"/>
<path id="点-s3"  class="stroke" stroke="#82bf09" d="M32.11,48.83C32.93,49.53,33.42,50.41,33.589999999999996,51.47C34.79,55.42,36.58,63.16,37.56999999999999,69.24C37.75999999999999,70.42,37.93999999999999,71.57,38.07999999999999,72.64999999999999"/>
<path id="点-s4"  class="stroke" stroke="#09bf09" d="M34.51,50.65C48.75,48,70.25999999999999,44.92,75.44,44.55C78,44.37,79.28,46.98,78.98,48.41C78.3,51.66,76.47,59.379999999999995,75.35000000000001,63.9"/>
<path id="点-s5"  class="stroke" stroke="#09bf82" d="M38.5,69.44C43.67,68.89999999999999,61.83,66.74,72.25999999999999,65.57C74.38,65.33,76.17999999999999,65.13999999999999,77.50999999999999,65.02999999999999"/>
<path id="点-s6"  class="stroke" stroke="#0982bf" d="M23.25,83C23.25,88.79,16.509999999999998,97.34,14.75,99"/>
<path id="点-s7"  class="stroke" stroke="#0909bf" d="M40.02,82.08C42.63,85.03,44.6,92.15,45.25,96.75"/>
<path id="点-s8"  class="stroke" stroke="#8209bf" d="M61.5,80.5C63.9,83.23,67.21,91.22,67.81,95.47"/>
<path id="点-s9"  class="stroke" stroke="#bf0982" d="M82.25,79C86.06,81.82,92.1,91.08,93.06,95.47"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="点-bg1"  class="badge-group"><circle cx="52.7" cy="10.88" r="3.5" fill="#bf0909"/><text class="num-single" x="52.7" y="10.88" dx="0" dy="-0.5">1</text></g>
<g id="点-bg2"  class="badge-group"><circle cx="56.3" cy="29.5" r="3.5" fill="#bf8209"/><text class="num-single" x="56.3" y="29.5" dx="0" dy="-0.5">2</text></g>
<g id="点-bg3"  class="badge-group"><circle cx="32.11" cy="45.33" r="3.5" fill="#82bf09"/><text class="num-single" x="32.11" y="45.33" dx="0" dy="-0.5">3</text></g>
<g id="点-bg4"  class="badge-group"><circle cx="34.51" cy="54.15" r="3.5" fill="#09bf09"/><text class="num-single" x="34.51" y="54.15" dx="0" dy="-0.5">4</text></g>
<g id="点-bg5"  class="badge-group"><circle cx="38.5" cy="69.44" r="3.5" fill="#09bf82"/><text class="num-single" x="38.5" y="69.44" dx="0" dy="-0.5">5</text></g>
<g id="点-bg6"  class="badge-group"><circle cx="23.25" cy="83" r="3.5" fill="#0982bf"/><text class="num-single" x="23.25" y="83" dx="0" dy="-0.5">6</text></g>
<g id="点-bg7"  class="badge-group"><circle cx="40.02" cy="82.08" r="3.5" fill="#0909bf"/><text class="num-single" x="40.02" y="82.08" dx="0" dy="-0.5">7</text></g>
<g id="点-bg8"  class="badge-group"><circle cx="61.5" cy="80.5" r="3.5" fill="#8209bf"/><text class="num-single" x="61.5" y="80.5" dx="0" dy="-0.5">8</text></g>
<g id="点-bg9"  class="badge-group"><circle cx="82.25" cy="79" r="3.5" fill="#bf0982"/><text class="num-single" x="82.25" y="79" dx="0" dy="-0.5">9</text></g>
</svg>