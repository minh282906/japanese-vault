<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (働)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #働-bg[i]: Thời gian quả bóng số nảy lên
   - #働-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#働-bg1  { animation-delay: 0.05s; }
#働-s1   { stroke-dasharray: 48.4234; stroke-dashoffset: 48.4234; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#働-bg2  { animation-delay: 0.47s; }
#働-s2   { stroke-dasharray: 50.4766; stroke-dashoffset: 50.4766; animation: drawStroke 0.28s ease-out 0.60s forwards; }
#働-bg3  { animation-delay: 0.90s; }
#働-s3   { stroke-dasharray: 27.2893; stroke-dashoffset: 27.2893; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#働-bg4  { animation-delay: 1.27s; }
#働-s4   { stroke-dasharray: 39.4663; stroke-dashoffset: 39.4663; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#働-bg5  { animation-delay: 1.64s; }
#働-s5   { stroke-dasharray: 20.9719; stroke-dashoffset: 20.9719; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#働-bg6  { animation-delay: 2.01s; }
#働-s6   { stroke-dasharray: 48.6215; stroke-dashoffset: 48.6215; animation: drawStroke 0.27s ease-out 2.14s forwards; }
#働-bg7  { animation-delay: 2.43s; }
#働-s7   { stroke-dasharray: 24.6906; stroke-dashoffset: 24.6906; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#働-bg8  { animation-delay: 2.80s; }
#働-s8   { stroke-dasharray: 21.5971; stroke-dashoffset: 21.5971; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#働-bg9  { animation-delay: 3.17s; }
#働-s9   { stroke-dasharray: 57.9207; stroke-dashoffset: 57.9207; animation: drawStroke 0.32s ease-out 3.30s forwards; }
#働-bg10  { animation-delay: 3.64s; }
#働-s10   { stroke-dasharray: 28.2738; stroke-dashoffset: 28.2738; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#働-bg11  { animation-delay: 4.01s; }
#働-s11   { stroke-dasharray: 30.5822; stroke-dashoffset: 30.5822; animation: drawStroke 0.22s ease-out 4.14s forwards; }
#働-bg12  { animation-delay: 4.38s; }
#働-s12   { stroke-dasharray: 81.3086; stroke-dashoffset: 81.3086; animation: drawStroke 0.45s ease-out 4.51s forwards; }
#働-bg13  { animation-delay: 4.98s; }
#働-s13   { stroke-dasharray: 79.1691; stroke-dashoffset: 79.1691; animation: drawStroke 0.44s ease-out 5.11s forwards; }
]]>
</style>

