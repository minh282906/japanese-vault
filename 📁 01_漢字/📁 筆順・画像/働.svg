<path id="働-s6"  class="stroke" stroke="#09bf41" d="M36.13,46.05C43.7,44.839999999999996,55.38,43.62,61.95,42.989999999999995C64.05,42.78999999999999,65.62,43.96999999999999,65.33,45.89999999999999C64.84,49.13999999999999,63.879999999999995,54.24999999999999,62.61,59.76999999999999C62.37,60.80999999999999,62.12,61.859999999999985,61.86,62.91999999999999"/>
