<path id="働-s10"  class="stroke" stroke="#2509bf" d="M34.94,73.71C35.97,74.05,37.919999999999995,74.05999999999999,39,73.91C47,72.75,54.88,71.36999999999999,59.260000000000005,70.66C60.43000000000001,70.47,61.71000000000001,70.24,62.900000000000006,70.46"/>
<path id="働-s11"  class="stroke" stroke="#7909bf" d="M32.42,88.36C33.5,89.25,35.13,89.37,36.980000000000004,88.64C46.68000000000001,84.81,49.790000000000006,83.5,60.910000000000004,79.03"/>
