<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (更)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #更-bg[i]: Thời gian quả bóng số nảy lên
   - #更-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#更-bg1  { animation-delay: 0.05s; }
#更-s1   { stroke-dasharray: 49.5708; stroke-dashoffset: 49.5708; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#更-bg2  { animation-delay: 0.47s; }
#更-s2   { stroke-dasharray: 29.8465; stroke-dashoffset: 29.8465; animation: drawStroke 0.22s ease-out 0.60s forwards; }
#更-bg3  { animation-delay: 0.84s; }
#更-s3   { stroke-dasharray: 81.7422; stroke-dashoffset: 81.7422; animation: drawStroke 0.45s ease-out 0.97s forwards; }
#更-bg4  { animation-delay: 1.44s; }
#更-s4   { stroke-dasharray: 46.9231; stroke-dashoffset: 46.9231; animation: drawStroke 0.26s ease-out 1.57s forwards; }
#更-bg5  { animation-delay: 1.85s; }
#更-s5   { stroke-dasharray: 41.0569; stroke-dashoffset: 41.0569; animation: drawStroke 0.23s ease-out 1.98s forwards; }
#更-bg6  { animation-delay: 2.23s; }
#更-s6   { stroke-dasharray: 95.9716; stroke-dashoffset: 95.9716; animation: drawStroke 0.53s ease-out 2.36s forwards; }
#更-bg7  { animation-delay: 2.91s; }
#更-s7   { stroke-dasharray: 66.2069; stroke-dashoffset: 66.2069; animation: drawStroke 0.36s ease-out 3.04s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #更-s[i]) -->
<path id="更-s1"  class="stroke" stroke="#bf0909" d="M30,17.64C33.38,18.25,36.26,18.03,38.89,17.62C48.38,16.130000000000003,61.980000000000004,14.47,70.76,13.830000000000002C73.51,13.630000000000003,76.54,13.600000000000001,79.25,14.260000000000002"/>
<path id="更-s2"  class="stroke" stroke="#bfa509" d="M27.52,31.32C28.349999999999998,32.15,28.88,33,29.04,34.03C29.63,37.75,31.5,49.07,32.66,56.010000000000005C33.08,58.510000000000005,33.37,60.24000000000001,33.37,60.36000000000001"/>
<path id="更-s3"  class="stroke" stroke="#3dbf09" d="M29.85,33.18C34.46,32.35,67.07,28.37,76.25999999999999,27.43C79.94,27.06,83.24999999999999,28.169999999999998,82.21999999999998,32.7C81.19999999999999,37.190000000000005,79.15999999999998,44.88,76.68999999999998,52.22C76.16999999999999,53.76,75.63999999999999,55.29,75.08999999999999,56.769999999999996"/>
<path id="更-s4"  class="stroke" stroke="#09bf71" d="M32.23,45.93C44.629999999999995,44.13,64.88,41.88,78.9,41.2"/>
<path id="更-s5"  class="stroke" stroke="#0971bf" d="M34.25,57.66C47.25,56,60.25,55,75.13,53.91"/>
<path id="更-s6"  class="stroke" stroke="#3d09bf" d="M56,18C56.94,18.94,57.05,20.25,57.05,22.43C57,62.62,56.12,81.62,19,96.54"/>
<path id="更-s7"  class="stroke" stroke="#bf09a5" d="M28,66.5C34.62,66.5,61,81.75,76.64,88.46000000000001C80.64,90.18,84.5,91.26,88.75,92.25000000000001"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="更-bg1"  class="badge-group"><circle cx="30" cy="17.64" r="3.5" fill="#bf0909"/><text class="num-single" x="30" y="17.64" dx="0" dy="-0.5">1</text></g>
<g id="更-bg2"  class="badge-group"><circle cx="27.52" cy="27.82" r="3.5" fill="#bfa509"/><text class="num-single" x="27.52" y="27.82" dx="0" dy="-0.5">2</text></g>
<g id="更-bg3"  class="badge-group"><circle cx="29.85" cy="36.68" r="3.5" fill="#3dbf09"/><text class="num-single" x="29.85" y="36.68" dx="0" dy="-0.5">3</text></g>
<g id="更-bg4"  class="badge-group"><circle cx="32.23" cy="45.93" r="3.5" fill="#09bf71"/><text class="num-single" x="32.23" y="45.93" dx="0" dy="-0.5">4</text></g>
<g id="更-bg5"  class="badge-group"><circle cx="34.25" cy="57.66" r="3.5" fill="#0971bf"/><text class="num-single" x="34.25" y="57.66" dx="0" dy="-0.5">5</text></g>
<g id="更-bg6"  class="badge-group"><circle cx="56" cy="18" r="3.5" fill="#3d09bf"/><text class="num-single" x="56" y="18" dx="0" dy="-0.5">6</text></g>
<g id="更-bg7"  class="badge-group"><circle cx="28" cy="66.5" r="3.5" fill="#bf09a5"/><text class="num-single" x="28" y="66.5" dx="0" dy="-0.5">7</text></g>
</svg>