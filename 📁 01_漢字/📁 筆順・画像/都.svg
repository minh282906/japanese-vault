<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (都)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #都-bg[i]: Thời gian quả bóng số nảy lên
   - #都-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#都-bg1  { animation-delay: 0.05s; }
#都-s1   { stroke-dasharray: 27.4642; stroke-dashoffset: 27.4642; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#都-bg2  { animation-delay: 0.42s; }
#都-s2   { stroke-dasharray: 28.6027; stroke-dashoffset: 28.6027; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#都-bg3  { animation-delay: 0.79s; }
#都-s3   { stroke-dasharray: 50.1361; stroke-dashoffset: 50.1361; animation: drawStroke 0.28s ease-out 0.92s forwards; }
#都-bg4  { animation-delay: 1.22s; }
#都-s4   { stroke-dasharray: 67.0912; stroke-dashoffset: 67.0912; animation: drawStroke 0.37s ease-out 1.35s forwards; }
#都-bg5  { animation-delay: 1.74s; }
#都-s5   { stroke-dasharray: 31.8625; stroke-dashoffset: 31.8625; animation: drawStroke 0.22s ease-out 1.87s forwards; }
#都-bg6  { animation-delay: 2.11s; }
#都-s6   { stroke-dasharray: 55.8055; stroke-dashoffset: 55.8055; animation: drawStroke 0.31s ease-out 2.24s forwards; }
#都-bg7  { animation-delay: 2.57s; }
#都-s7   { stroke-dasharray: 21.1782; stroke-dashoffset: 21.1782; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#都-bg8  { animation-delay: 2.94s; }
#都-s8   { stroke-dasharray: 21.2522; stroke-dashoffset: 21.2522; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#都-bg9  { animation-delay: 3.31s; }
#都-s9   { stroke-dasharray: 47.7224; stroke-dashoffset: 47.7224; animation: drawStroke 0.26s ease-out 3.44s forwards; }
#都-bg10  { animation-delay: 3.72s; }
#都-s10   { stroke-dasharray: 46.4121; stroke-dashoffset: 46.4121; animation: drawStroke 0.26s ease-out 3.85s forwards; }
#都-bg11  { animation-delay: 4.13s; }
#都-s11   { stroke-dasharray: 75.7498; stroke-dashoffset: 75.7498; animation: drawStroke 0.42s ease-out 4.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #都-s[i]) -->
