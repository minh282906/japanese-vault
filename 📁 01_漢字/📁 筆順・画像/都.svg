<path id="都-s2"  class="stroke" stroke="#bf6c09" d="M34.63,11.67C35.67,12.71,36.080000000000005,14.04,36.17,15.719999999999999C36.58,23.759999999999998,36.39,37.14,36.39,39.879999999999995"/>
