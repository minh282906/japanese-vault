<path id="都-s5"  class="stroke" stroke="#09bf2a" d="M28.12,56.89C28.43,57.65,28.740000000000002,58.78,28.740000000000002,59.79C28.740000000000002,60.57,28.87,76.28999999999999,28.810000000000002,84.49C28.790000000000003,86.92999999999999,28.78,88.55,28.78,88.66999999999999"/>
<path id="都-s6"  class="stroke" stroke="#09bf8d" d="M30.02,55.52C31.56,55.410000000000004,44.74,53.910000000000004,49.129999999999995,53.43000000000001C51.49999999999999,53.17000000000001,52.559999999999995,53.980000000000004,52.459999999999994,56.370000000000005C52.31999999999999,59.63,52.239999999999995,72.44,52.21999999999999,82.37C52.21999999999999,84.24000000000001,52.209999999999994,86,52.21999999999999,87.58"/>
<path id="都-s7"  class="stroke" stroke="#098dbf" d="M29.83,69.75C34.129999999999995,69.25,47,67.75,50.89,67.53"/>
<path id="都-s8"  class="stroke" stroke="#092abf" d="M29.97,84.6C34.82,84.05,45.089999999999996,83.1,51.129999999999995,82.63"/>
<path id="都-s9"  class="stroke" stroke="#4b09bf" d="M66.52,22.39C67.86999999999999,22.87,69.36,23,70.64,22.830000000000002C75.87,22.130000000000003,82.24,20.5,85.58,19.720000000000002C88.84,18.96,91,20.250000000000004,89.5,24.250000000000004C88.5,26.910000000000004,83.12,38.71000000000001,80.65,42.230000000000004"/>
<path id="都-s10"  class="stroke" stroke="#ae09bf" d="M80.65,42.48C98.88000000000001,54.87,98.25,81.75,83.05000000000001,74.61"/>
<path id="都-s11"  class="stroke" stroke="#bf096c" d="M67.87,23.64C68.74000000000001,24.51,69.44,25.87,69.44,27.080000000000002C69.44,28.000000000000004,69.45,72.11,69.46,91.37C69.46,94.84,69.46,97.5,69.46,98.96000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="都-bg1"  class="badge-group"><circle cx="20.68" cy="27.91" r="3.5" fill="#bf0909"/><text class="num-single" x="20.68" y="27.91" dx="0" dy="-0.5">1</text></g>
