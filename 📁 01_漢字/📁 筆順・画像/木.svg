<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (木)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #木-bg[i]: Thời gian quả bóng số nảy lên
   - #木-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#木-bg1  { animation-delay: 0.05s; }
#木-s1   { stroke-dasharray: 67.8859; stroke-dashoffset: 67.8859; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#木-bg2  { animation-delay: 0.57s; }
#木-s2   { stroke-dasharray: 88.5237; stroke-dashoffset: 88.5237; animation: drawStroke 0.49s ease-out 0.70s forwards; }
#木-bg3  { animation-delay: 1.21s; }
#木-s3   { stroke-dasharray: 54.5345; stroke-dashoffset: 54.5345; animation: drawStroke 0.30s ease-out 1.34s forwards; }
#木-bg4  { animation-delay: 1.66s; }
#木-s4   { stroke-dasharray: 56.4218; stroke-dashoffset: 56.4218; animation: drawStroke 0.31s ease-out 1.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #木-s[i]) -->
<path id="木-s1"  class="stroke" stroke="#bf0909" d="M19.5,39.86C21.95,40.43,24.73,40.66,27.54,40.43C40.75,39.38,63,36.5,79.78,36.15C82.58,36.089999999999996,84.32000000000001,36.25,87.12,36.65"/>
<path id="木-s2"  class="stroke" stroke="#64bf09" d="M51.75,10.5C52.94,11.69,53.75,13.5,53.75,15.5C53.75,24.15,53.75,70.65,53.61,90.25C53.58,94.44,53.54,97.4,53.5,98.5"/>
<path id="木-s3"  class="stroke" stroke="#09bfbf" d="M50.75,39.5C50.75,40.62,50.14,41.94,49.33,43.45C41.75,57.5,26.7,73.93,15.75,80.25"/>
<path id="木-s4"  class="stroke" stroke="#6409bf" d="M54.5,39C59.12,45,77.5,64.75,86.26,73.61C88.53,75.9,90.87,78,93.75,79.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="木-bg1"  class="badge-group"><circle cx="19.5" cy="39.86" r="3.5" fill="#bf0909"/><text class="num-single" x="19.5" y="39.86" dx="0" dy="-0.5">1</text></g>
<g id="木-bg2"  class="badge-group"><circle cx="51.75" cy="10.5" r="3.5" fill="#64bf09"/><text class="num-single" x="51.75" y="10.5" dx="0" dy="-0.5">2</text></g>
<g id="木-bg3"  class="badge-group"><circle cx="50.75" cy="36.0" r="3.5" fill="#09bfbf"/><text class="num-single" x="50.75" y="36.0" dx="0" dy="-0.5">3</text></g>
<g id="木-bg4"  class="badge-group"><circle cx="54.5" cy="42.5" r="3.5" fill="#6409bf"/><text class="num-single" x="54.5" y="42.5" dx="0" dy="-0.5">4</text></g>
</svg>