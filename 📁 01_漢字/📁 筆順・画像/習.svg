<path id="習-s7"  class="stroke" stroke="#098dbf" d="M53.76,51.25C54.01,51.97,53.78,52.69,53.36,53.49C51.88,56.34,50.57,58.56,47.04,62.6"/>
<path id="習-s8"  class="stroke" stroke="#092abf" d="M32.18,65.01C32.96,65.79,33.53,66.63000000000001,33.62,67.61C33.949999999999996,71,35.8,84.91,36.769999999999996,92.73C36.91,93.89,37.04,94.91000000000001,37.13999999999999,95.75"/>
<path id="習-s9"  class="stroke" stroke="#4b09bf" d="M34.55,67C47.25,65.5,73.03999999999999,62.33,76.74,62.19C79.83,62.07,81.17999999999999,64.27,80.82,67.25C80.3,71.54,79.22999999999999,79.62,77.61999999999999,90.03999999999999C77.44999999999999,91.14999999999999,77.27,92.27999999999999,77.08999999999999,93.41999999999999"/>
<path id="習-s10"  class="stroke" stroke="#ae09bf" d="M36.27,79.48C44.75,78.5,69.5,76.5,78.2,76.16000000000001"/>
<path id="習-s11"  class="stroke" stroke="#bf096c" d="M38.08,93.39C48.87,92.75,64.87,91.13,76.43,90.82000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="習-bg1"  class="badge-group"><circle cx="18" cy="20.7" r="3.5" fill="#bf0909"/><text class="num-single" x="18" y="20.7" dx="0" dy="-0.5">1</text></g>
