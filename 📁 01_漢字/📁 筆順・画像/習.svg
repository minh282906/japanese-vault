<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (習)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #習-bg[i]: Thời gian quả bóng số nảy lên
   - #習-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#習-bg1  { animation-delay: 0.05s; }
#習-s1   { stroke-dasharray: 71.3038; stroke-dashoffset: 71.3038; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#習-bg2  { animation-delay: 0.59s; }
#習-s2   { stroke-dasharray: 10.9695; stroke-dashoffset: 10.9695; animation: drawStroke 0.22s ease-out 0.72s forwards; }
#習-bg3  { animation-delay: 0.96s; }
#習-s3   { stroke-dasharray: 18.2444; stroke-dashoffset: 18.2444; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#習-bg4  { animation-delay: 1.33s; }
#習-s4   { stroke-dasharray: 77.3768; stroke-dashoffset: 77.3768; animation: drawStroke 0.43s ease-out 1.46s forwards; }
#習-bg5  { animation-delay: 1.91s; }
#習-s5   { stroke-dasharray: 12.1247; stroke-dashoffset: 12.1247; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#習-bg6  { animation-delay: 2.28s; }
#習-s6   { stroke-dasharray: 15.9510; stroke-dashoffset: 15.9510; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#習-bg7  { animation-delay: 2.65s; }
#習-s7   { stroke-dasharray: 13.4653; stroke-dashoffset: 13.4653; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#習-bg8  { animation-delay: 3.02s; }
#習-s8   { stroke-dasharray: 31.3940; stroke-dashoffset: 31.3940; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#習-bg9  { animation-delay: 3.39s; }
#習-s9   { stroke-dasharray: 76.5160; stroke-dashoffset: 76.5160; animation: drawStroke 0.42s ease-out 3.52s forwards; }
#習-bg10  { animation-delay: 3.96s; }
#習-s10   { stroke-dasharray: 42.0658; stroke-dashoffset: 42.0658; animation: drawStroke 0.23s ease-out 4.09s forwards; }
#習-bg11  { animation-delay: 4.34s; }
#習-s11   { stroke-dasharray: 38.4393; stroke-dashoffset: 38.4393; animation: drawStroke 0.22s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

