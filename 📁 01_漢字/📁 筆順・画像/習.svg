<path id="習-s1"  class="stroke" stroke="#bf0909" d="M18,20.7C20,21.25,21.77,21.45,24.32,20.97C29.97,19.9,37.11,18.049999999999997,39.91,17.529999999999998C43.73,16.819999999999997,45.519999999999996,18.759999999999998,45.519999999999996,21.629999999999995C45.519999999999996,25.989999999999995,44.849999999999994,40.47,44.849999999999994,49.709999999999994C44.849999999999994,59.129999999999995,38.88999999999999,52.50999999999999,37.239999999999995,51.00999999999999"/>
