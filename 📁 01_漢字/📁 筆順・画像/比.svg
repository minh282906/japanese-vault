<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (比)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #比-bg[i]: Thời gian quả bóng số nảy lên
   - #比-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#比-bg1  { animation-delay: 0.05s; }
#比-s1   { stroke-dasharray: 21.0320; stroke-dashoffset: 21.0320; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#比-bg2  { animation-delay: 0.42s; }
#比-s2   { stroke-dasharray: 88.5212; stroke-dashoffset: 88.5212; animation: drawStroke 0.49s ease-out 0.55s forwards; }
#比-bg3  { animation-delay: 1.06s; }
#比-s3   { stroke-dasharray: 28.6180; stroke-dashoffset: 28.6180; animation: drawStroke 0.22s ease-out 1.19s forwards; }
#比-bg4  { animation-delay: 1.43s; }
#比-s4   { stroke-dasharray: 117.3580; stroke-dashoffset: 117.3580; animation: drawStroke 0.55s ease-out 1.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #比-s[i]) -->
<path id="比-s1"  class="stroke" stroke="#bf0909" d="M29.25,49.75C35.230000000000004,49.09,41.25,46.75,46.46,45.64C47.99,45.31,48.96,45.32,49.75,45.51"/>
<path id="比-s2"  class="stroke" stroke="#64bf09" d="M24.5,23.5C25.5,24.5,26.01,25.95,26.01,27.57C26.01,32.02,25.67,77.72999999999999,25.67,84.66C25.67,90.47999999999999,24.92,90.64,30,87.99C36.25,84.74,41.07,82.1,45.67,79.99"/>
<path id="比-s3"  class="stroke" stroke="#09bfbf" d="M86.84,37.94C86.87,39,86.31,40.129999999999995,85.33,40.919999999999995C82.75,43,72.38,49.38,63.67,53.67"/>
<path id="比-s4"  class="stroke" stroke="#6409bf" d="M59.25,16.25C60.5,17.5,60.83,19.25,60.83,20.83C60.83,32.12,60.72,66.75,60.72,75.81C60.72,92.25,61.5,93.75,77.75,93.75C93.25,93.75,94.75,90.75,94.75,79.87"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="比-bg1"  class="badge-group"><circle cx="29.25" cy="49.75" r="3.5" fill="#bf0909"/><text class="num-single" x="29.25" y="49.75" dx="0" dy="-0.5">1</text></g>
<g id="比-bg2"  class="badge-group"><circle cx="24.5" cy="23.5" r="3.5" fill="#64bf09"/><text class="num-single" x="24.5" y="23.5" dx="0" dy="-0.5">2</text></g>
<g id="比-bg3"  class="badge-group"><circle cx="86.84" cy="37.94" r="3.5" fill="#09bfbf"/><text class="num-single" x="86.84" y="37.94" dx="0" dy="-0.5">3</text></g>
<g id="比-bg4"  class="badge-group"><circle cx="59.25" cy="16.25" r="3.5" fill="#6409bf"/><text class="num-single" x="59.25" y="16.25" dx="0" dy="-0.5">4</text></g>
</svg>