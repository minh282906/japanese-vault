<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (学)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #学-bg[i]: Thời gian quả bóng số nảy lên
   - #学-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#学-bg1  { animation-delay: 0.05s; }
#学-s1   { stroke-dasharray: 12.5225; stroke-dashoffset: 12.5225; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#学-bg2  { animation-delay: 0.42s; }
#学-s2   { stroke-dasharray: 12.6969; stroke-dashoffset: 12.6969; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#学-bg3  { animation-delay: 0.79s; }
#学-s3   { stroke-dasharray: 16.1526; stroke-dashoffset: 16.1526; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#学-bg4  { animation-delay: 1.16s; }
#学-s4   { stroke-dasharray: 16.7584; stroke-dashoffset: 16.7584; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#学-bg5  { animation-delay: 1.53s; }
#学-s5   { stroke-dasharray: 75.4101; stroke-dashoffset: 75.4101; animation: drawStroke 0.41s ease-out 1.66s forwards; }
#学-bg6  { animation-delay: 2.09s; }
#学-s6   { stroke-dasharray: 44.7986; stroke-dashoffset: 44.7986; animation: drawStroke 0.25s ease-out 2.22s forwards; }
#学-bg7  { animation-delay: 2.49s; }
#学-s7   { stroke-dasharray: 52.4745; stroke-dashoffset: 52.4745; animation: drawStroke 0.29s ease-out 2.62s forwards; }
#学-bg8  { animation-delay: 2.93s; }
#学-s8   { stroke-dasharray: 75.8662; stroke-dashoffset: 75.8662; animation: drawStroke 0.42s ease-out 3.06s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #学-s[i]) -->
<path id="学-s1"  class="stroke" stroke="#bf0909" d="M29.5,17.25C33,20.25,36,24.5,37.25,27"/>
<path id="学-s2"  class="stroke" stroke="#bf9109" d="M49,12C50.25,14,53.75,20.25,54.25,23.5"/>
<path id="学-s3"  class="stroke" stroke="#64bf09" d="M75,11C75.25,12.75,74.88,13.75,74.25,15.25C72.96,18.35,70,22.63,67.75,25"/>
<path id="学-s4"  class="stroke" stroke="#09bf36" d="M21.25,33.75C21.13,38.5,19.25,46.25,17.5,50"/>
<path id="学-s5"  class="stroke" stroke="#09bfbf" d="M23.5,36.5C40.5,34.88,65.88,31,83.5,30.75C93,30.62,87.62,35.87,83.5,39.75"/>
<path id="学-s6"  class="stroke" stroke="#0936bf" d="M37.25,46.5C38.25,46.75,41,46.75,42.75,46.25S61,42.25,62.75,42.25S65.5,43,63.75,44.5S54.5,53.5,53,54.75"/>
<path id="学-s7"  class="stroke" stroke="#6409bf" d="M50.75,55.75C54.75,64.5,57.93,80.42,52.5,93.75C49.75,100.5,44.75,95,42.75,91.75"/>
<path id="学-s8"  class="stroke" stroke="#bf0991" d="M15.75,67.75C17.5,68.75,20.39,69.11,23.25,68.75C39.13,66.75,67.68,62.5,84.62,63.25C87.12,63.36,89.34,63.5,91.01,64.25"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="学-bg1"  class="badge-group"><circle cx="29.5" cy="17.25" r="3.5" fill="#bf0909"/><text class="num-single" x="29.5" y="17.25" dx="0" dy="-0.5">1</text></g>
<g id="学-bg2"  class="badge-group"><circle cx="49" cy="12" r="3.5" fill="#bf9109"/><text class="num-single" x="49" y="12" dx="0" dy="-0.5">2</text></g>
<g id="学-bg3"  class="badge-group"><circle cx="75" cy="11" r="3.5" fill="#64bf09"/><text class="num-single" x="75" y="11" dx="0" dy="-0.5">3</text></g>
<g id="学-bg4"  class="badge-group"><circle cx="21.25" cy="30.25" r="3.5" fill="#09bf36"/><text class="num-single" x="21.25" y="30.25" dx="0" dy="-0.5">4</text></g>
<g id="学-bg5"  class="badge-group"><circle cx="23.5" cy="40.0" r="3.5" fill="#09bfbf"/><text class="num-single" x="23.5" y="40.0" dx="0" dy="-0.5">5</text></g>
<g id="学-bg6"  class="badge-group"><circle cx="37.25" cy="46.5" r="3.5" fill="#0936bf"/><text class="num-single" x="37.25" y="46.5" dx="0" dy="-0.5">6</text></g>
<g id="学-bg7"  class="badge-group"><circle cx="50.75" cy="55.75" r="3.5" fill="#6409bf"/><text class="num-single" x="50.75" y="55.75" dx="0" dy="-0.5">7</text></g>
<g id="学-bg8"  class="badge-group"><circle cx="15.75" cy="67.75" r="3.5" fill="#bf0991"/><text class="num-single" x="15.75" y="67.75" dx="0" dy="-0.5">8</text></g>
</svg>