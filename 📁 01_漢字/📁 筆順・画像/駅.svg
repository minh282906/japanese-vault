<path id="駅-s7"  class="stroke" stroke="#09bf71" d="M9.79,73.5C10.069999999999999,79.91,9.219999999999999,85.53999999999999,8.92,86.82"/>
<path id="駅-s8"  class="stroke" stroke="#09bfbf" d="M17.5,71.5C18.58,73.6,19.5,76.25,19.75,80"/>
<path id="駅-s9"  class="stroke" stroke="#0971bf" d="M25.44,68.22C26,69.25,28,72.64,28.25,76"/>
<path id="駅-s10"  class="stroke" stroke="#0923bf" d="M32.75,65.25C34,67.26,36.05,69.34,36.5,72"/>
<path id="駅-s11"  class="stroke" stroke="#3d09bf" d="M55.22,20.32C56.379999999999995,21.09,58.12,21.22,59.36,21.11C66.76,20.5,78.53999999999999,18.47,81.21000000000001,18.14C84.51,17.740000000000002,85.98,19.830000000000002,85.63000000000001,22.080000000000002C84.97,26.2,83.6,34.25,82,40.32"/>
<path id="駅-s12"  class="stroke" stroke="#8b09bf" d="M58.61,44.25C62.12,43.87,72.07,42.72,79.03999999999999,41.83C81.39999999999999,41.53,82.61999999999999,41.5,84.13999999999999,41.739999999999995"/>
