<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (駅)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #駅-bg[i]: Thời gian quả bóng số nảy lên
   - #駅-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#駅-bg1  { animation-delay: 0.05s; }
#駅-s1   { stroke-dasharray: 43.6216; stroke-dashoffset: 43.6216; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#駅-bg2  { animation-delay: 0.44s; }
#駅-s2   { stroke-dasharray: 27.5199; stroke-dashoffset: 27.5199; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#駅-bg3  { animation-delay: 0.81s; }
#駅-s3   { stroke-dasharray: 38.3875; stroke-dashoffset: 38.3875; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#駅-bg4  { animation-delay: 1.18s; }
#駅-s4   { stroke-dasharray: 25.9049; stroke-dashoffset: 25.9049; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#駅-bg5  { animation-delay: 1.55s; }
#駅-s5   { stroke-dasharray: 25.4086; stroke-dashoffset: 25.4086; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#駅-bg6  { animation-delay: 1.92s; }
#駅-s6   { stroke-dasharray: 73.8748; stroke-dashoffset: 73.8748; animation: drawStroke 0.41s ease-out 2.05s forwards; }
#駅-bg7  { animation-delay: 2.48s; }
#駅-s7   { stroke-dasharray: 13.3764; stroke-dashoffset: 13.3764; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#駅-bg8  { animation-delay: 2.85s; }
#駅-s8   { stroke-dasharray: 8.8569; stroke-dashoffset: 8.8569; animation: drawStroke 0.22s ease-out 2.98s forwards; }
#駅-bg9  { animation-delay: 3.22s; }
#駅-s9   { stroke-dasharray: 8.3370; stroke-dashoffset: 8.3370; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#駅-bg10  { animation-delay: 3.59s; }
#駅-s10   { stroke-dasharray: 7.7888; stroke-dashoffset: 7.7888; animation: drawStroke 0.22s ease-out 3.72s forwards; }
#駅-bg11  { animation-delay: 3.96s; }
#駅-s11   { stroke-dasharray: 51.9876; stroke-dashoffset: 51.9876; animation: drawStroke 0.29s ease-out 4.09s forwards; }
#駅-bg12  { animation-delay: 4.40s; }
#駅-s12   { stroke-dasharray: 25.6937; stroke-dashoffset: 25.6937; animation: drawStroke 0.22s ease-out 4.53s forwards; }
#駅-bg13  { animation-delay: 4.77s; }
#駅-s13   { stroke-dasharray: 71.7099; stroke-dashoffset: 71.7099; animation: drawStroke 0.39s ease-out 4.90s forwards; }
#駅-bg14  { animation-delay: 5.31s; }
#駅-s14   { stroke-dasharray: 58.2215; stroke-dashoffset: 58.2215; animation: drawStroke 0.32s ease-out 5.44s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

