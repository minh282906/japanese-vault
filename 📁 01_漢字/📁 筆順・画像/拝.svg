<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (拝)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #拝-bg[i]: Thời gian quả bóng số nảy lên
   - #拝-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#拝-bg1  { animation-delay: 0.05s; }
#拝-s1   { stroke-dasharray: 29.3438; stroke-dashoffset: 29.3438; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#拝-bg2  { animation-delay: 0.42s; }
#拝-s2   { stroke-dasharray: 89.3511; stroke-dashoffset: 89.3511; animation: drawStroke 0.49s ease-out 0.55s forwards; }
#拝-bg3  { animation-delay: 1.06s; }
#拝-s3   { stroke-dasharray: 29.3829; stroke-dashoffset: 29.3829; animation: drawStroke 0.22s ease-out 1.19s forwards; }
#拝-bg4  { animation-delay: 1.43s; }
#拝-s4   { stroke-dasharray: 51.0468; stroke-dashoffset: 51.0468; animation: drawStroke 0.28s ease-out 1.56s forwards; }
#拝-bg5  { animation-delay: 1.86s; }
#拝-s5   { stroke-dasharray: 37.4563; stroke-dashoffset: 37.4563; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#拝-bg6  { animation-delay: 2.23s; }
#拝-s6   { stroke-dasharray: 36.9944; stroke-dashoffset: 36.9944; animation: drawStroke 0.22s ease-out 2.36s forwards; }
#拝-bg7  { animation-delay: 2.60s; }
#拝-s7   { stroke-dasharray: 54.7348; stroke-dashoffset: 54.7348; animation: drawStroke 0.30s ease-out 2.73s forwards; }
#拝-bg8  { animation-delay: 3.05s; }
#拝-s8   { stroke-dasharray: 76.8708; stroke-dashoffset: 76.8708; animation: drawStroke 0.42s ease-out 3.18s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #拝-s[i]) -->
<path id="拝-s1"  class="stroke" stroke="#bf0909" d="M12.75,36.42C14.83,36.67,15.77,36.72,18,36.42C23,35.74,30.119999999999997,34.25,38.05,32.53C39.26,32.27,40.5,32.13,41.669999999999995,32.25"/>
<path id="拝-s2"  class="stroke" stroke="#bf9109" d="M27.52,14.25C28.57,15.3,29.28,17.13,29.28,19.27C29.28,34.5,29.27,75.48,29.27,86.92C29.27,101.17,23.38,91.88,21.5,89.67"/>
<path id="拝-s3"  class="stroke" stroke="#64bf09" d="M11.75,66.68C12.870000000000001,67.5,14.25,67.65,15.9,66.59C23,62,24.12,61.25,36.75,52.92"/>
<path id="拝-s4"  class="stroke" stroke="#09bf36" d="M44.75,19.14C46.68,19.93,49.6,19.63,51.61,19.41C60.08,18.45,79.62,16.08,88.49000000000001,15.67C90.78000000000002,15.57,93.25000000000001,15.459999999999999,95.50000000000001,16.01"/>
<path id="拝-s5"  class="stroke" stroke="#09bfbf" d="M51.75,35.69C54,36,55.73,35.93,57.36,35.739999999999995C63.74,34.99999999999999,76.72,33.449999999999996,83.50999999999999,32.839999999999996C85.38,32.669999999999995,87.16,32.51,88.99999999999999,32.959999999999994"/>
<path id="拝-s6"  class="stroke" stroke="#0936bf" d="M52.75,51.44C54.87,51.879999999999995,56.58,51.699999999999996,58.37,51.48C64.78999999999999,50.69,77.75,48.94,84.37,48.33C86,48.18,87.93,48.089999999999996,89.5,48.47"/>
<path id="拝-s7"  class="stroke" stroke="#6409bf" d="M43.25,67.89C45.87,68.38,49,68.03,51.37,67.78C61.339999999999996,66.69,81.96,64.66,90.87,63.88C93.05000000000001,63.690000000000005,95.62,63.5,97.75,63.760000000000005"/>
<path id="拝-s8"  class="stroke" stroke="#bf0991" d="M69.02,20.5C70.07,21.55,70.78,23.12,70.78,25.27C70.78,38.09,70.85,72.19,70.79,89.25C70.78,92.47,70.77000000000001,95.1,70.77000000000001,96.92"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="拝-bg1"  class="badge-group"><circle cx="12.75" cy="36.42" r="3.5" fill="#bf0909"/><text class="num-single" x="12.75" y="36.42" dx="0" dy="-0.5">1</text></g>
<g id="拝-bg2"  class="badge-group"><circle cx="27.52" cy="14.25" r="3.5" fill="#bf9109"/><text class="num-single" x="27.52" y="14.25" dx="0" dy="-0.5">2</text></g>
<g id="拝-bg3"  class="badge-group"><circle cx="11.75" cy="66.68" r="3.5" fill="#64bf09"/><text class="num-single" x="11.75" y="66.68" dx="0" dy="-0.5">3</text></g>
<g id="拝-bg4"  class="badge-group"><circle cx="44.75" cy="19.14" r="3.5" fill="#09bf36"/><text class="num-single" x="44.75" y="19.14" dx="0" dy="-0.5">4</text></g>
<g id="拝-bg5"  class="badge-group"><circle cx="51.75" cy="35.69" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.75" y="35.69" dx="0" dy="-0.5">5</text></g>
<g id="拝-bg6"  class="badge-group"><circle cx="52.75" cy="51.44" r="3.5" fill="#0936bf"/><text class="num-single" x="52.75" y="51.44" dx="0" dy="-0.5">6</text></g>
<g id="拝-bg7"  class="badge-group"><circle cx="43.25" cy="67.89" r="3.5" fill="#6409bf"/><text class="num-single" x="43.25" y="67.89" dx="0" dy="-0.5">7</text></g>
<g id="拝-bg8"  class="badge-group"><circle cx="69.02" cy="20.5" r="3.5" fill="#bf0991"/><text class="num-single" x="69.02" y="20.5" dx="0" dy="-0.5">8</text></g>
</svg>