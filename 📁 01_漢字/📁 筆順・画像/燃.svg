<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (燃)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #燃-bg[i]: Thời gian quả bóng số nảy lên
   - #燃-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#燃-bg1  { animation-delay: 0.05s; }
#燃-s1   { stroke-dasharray: 13.9584; stroke-dashoffset: 13.9584; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#燃-bg2  { animation-delay: 0.42s; }
#燃-s2   { stroke-dasharray: 13.2977; stroke-dashoffset: 13.2977; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#燃-bg3  { animation-delay: 0.79s; }
#燃-s3   { stroke-dasharray: 74.1483; stroke-dashoffset: 74.1483; animation: drawStroke 0.41s ease-out 0.92s forwards; }
#燃-bg4  { animation-delay: 1.35s; }
#燃-s4   { stroke-dasharray: 14.4289; stroke-dashoffset: 14.4289; animation: drawStroke 0.22s ease-out 1.48s forwards; }
#燃-bg5  { animation-delay: 1.72s; }
#燃-s5   { stroke-dasharray: 28.7587; stroke-dashoffset: 28.7587; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#燃-bg6  { animation-delay: 2.09s; }
#燃-s6   { stroke-dasharray: 60.2660; stroke-dashoffset: 60.2660; animation: drawStroke 0.33s ease-out 2.22s forwards; }
#燃-bg7  { animation-delay: 2.57s; }
#燃-s7   { stroke-dasharray: 8.4618; stroke-dashoffset: 8.4618; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#燃-bg8  { animation-delay: 2.94s; }
#燃-s8   { stroke-dasharray: 9.3504; stroke-dashoffset: 9.3504; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#燃-bg9  { animation-delay: 3.31s; }
#燃-s9   { stroke-dasharray: 24.9770; stroke-dashoffset: 24.9770; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#燃-bg10  { animation-delay: 3.68s; }
#燃-s10   { stroke-dasharray: 53.8868; stroke-dashoffset: 53.8868; animation: drawStroke 0.30s ease-out 3.81s forwards; }
#燃-bg11  { animation-delay: 4.13s; }
#燃-s11   { stroke-dasharray: 32.1049; stroke-dashoffset: 32.1049; animation: drawStroke 0.22s ease-out 4.26s forwards; }
#燃-bg12  { animation-delay: 4.50s; }
#燃-s12   { stroke-dasharray: 10.9113; stroke-dashoffset: 10.9113; animation: drawStroke 0.22s ease-out 4.63s forwards; }
#燃-bg13  { animation-delay: 4.87s; }
#燃-s13   { stroke-dasharray: 15.2190; stroke-dashoffset: 15.2190; animation: drawStroke 0.22s ease-out 5.00s forwards; }
#燃-bg14  { animation-delay: 5.24s; }
#燃-s14   { stroke-dasharray: 14.2922; stroke-dashoffset: 14.2922; animation: drawStroke 0.22s ease-out 5.37s forwards; }
#燃-bg15  { animation-delay: 5.61s; }
#燃-s15   { stroke-dasharray: 14.2225; stroke-dashoffset: 14.2225; animation: drawStroke 0.22s ease-out 5.74s forwards; }
#燃-bg16  { animation-delay: 5.98s; }
#燃-s16   { stroke-dasharray: 17.3273; stroke-dashoffset: 17.3273; animation: drawStroke 0.22s ease-out 6.11s forwards; }
]]>
</style>

