<path id="燃-s10"  class="stroke" stroke="#097bbf" d="M74.07,17.8C74.88,18.61,75.19999999999999,19.75,75.27999999999999,21.19C76.25,40.05,71,56.38,56.81,65.21"/>
<path id="燃-s11"  class="stroke" stroke="#0936bf" d="M76.12,38.25C79.65,44.56,85.12,53.13,90.52000000000001,60.61C91.68,62.21,92.87,63.63,94.13000000000001,64.74"/>
