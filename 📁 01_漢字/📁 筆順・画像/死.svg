<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (死)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #死-bg[i]: Thời gian quả bóng số nảy lên
   - #死-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#死-bg1  { animation-delay: 0.05s; }
#死-s1   { stroke-dasharray: 63.8667; stroke-dashoffset: 63.8667; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#死-bg2  { animation-delay: 0.55s; }
#死-s2   { stroke-dasharray: 32.8020; stroke-dashoffset: 32.8020; animation: drawStroke 0.22s ease-out 0.68s forwards; }
#死-bg3  { animation-delay: 0.92s; }
#死-s3   { stroke-dasharray: 85.0299; stroke-dashoffset: 85.0299; animation: drawStroke 0.47s ease-out 1.05s forwards; }
#死-bg4  { animation-delay: 1.54s; }
#死-s4   { stroke-dasharray: 14.3304; stroke-dashoffset: 14.3304; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#死-bg5  { animation-delay: 1.91s; }
#死-s5   { stroke-dasharray: 28.3228; stroke-dashoffset: 28.3228; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#死-bg6  { animation-delay: 2.28s; }
#死-s6   { stroke-dasharray: 100.5980; stroke-dashoffset: 100.5980; animation: drawStroke 0.55s ease-out 2.41s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #死-s[i]) -->
<path id="死-s1"  class="stroke" stroke="#bf0909" d="M20,21.65C23.12,22.5,27.11,22.16,30.1,21.82C41.910000000000004,20.490000000000002,62.25,18.37,74.25999999999999,17.07C77.22999999999999,16.75,80.55,16.73,83.50999999999999,17.37"/>
<path id="死-s2"  class="stroke" stroke="#bfbf09" d="M32.12,30.14C32.29,30.6,32.4,31.98,32.21,32.9C31.09,38.33,24.26,50.07,15.5,57.37"/>
<path id="死-s3"  class="stroke" stroke="#09bf09" d="M33.56,39.91C34.980000000000004,40.13999999999999,36.230000000000004,39.989999999999995,37.650000000000006,39.75C41.02,39.19,44.42,38.34,46.760000000000005,37.49C49.35000000000001,36.54,51.09,38.03,50.150000000000006,40.93C45.5,55.12,33.75,79.75,13.25,93"/>
<path id="死-s4"  class="stroke" stroke="#09bfbf" d="M26.39,54.21C29.72,56.07,34.980000000000004,61.85,35.81,64.74"/>
<path id="死-s5"  class="stroke" stroke="#0909bf" d="M88.4,38.11C88.49000000000001,39.23,88.25,39.96,87.32000000000001,41.03C83.74000000000001,45.17,76.39000000000001,50.96,66.51,54.65"/>
<path id="死-s6"  class="stroke" stroke="#bf09bf" d="M61.65,28.75C63.01,30.11,63.33,32,63.33,33.68C63.33,35,63.3,78.07,63.3,82.16C63.3,90.62,64.25,93.02,79.05,93.02C92.62,93.02,93.72999999999999,91.36999999999999,93.72999999999999,80.5"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="死-bg1"  class="badge-group"><circle cx="20" cy="21.65" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="21.65" dx="0" dy="-0.5">1</text></g>
<g id="死-bg2"  class="badge-group"><circle cx="32.12" cy="30.14" r="3.5" fill="#bfbf09"/><text class="num-single" x="32.12" y="30.14" dx="0" dy="-0.5">2</text></g>
<g id="死-bg3"  class="badge-group"><circle cx="33.56" cy="39.91" r="3.5" fill="#09bf09"/><text class="num-single" x="33.56" y="39.91" dx="0" dy="-0.5">3</text></g>
<g id="死-bg4"  class="badge-group"><circle cx="26.39" cy="54.21" r="3.5" fill="#09bfbf"/><text class="num-single" x="26.39" y="54.21" dx="0" dy="-0.5">4</text></g>
<g id="死-bg5"  class="badge-group"><circle cx="88.4" cy="38.11" r="3.5" fill="#0909bf"/><text class="num-single" x="88.4" y="38.11" dx="0" dy="-0.5">5</text></g>
<g id="死-bg6"  class="badge-group"><circle cx="61.65" cy="28.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="61.65" y="28.75" dx="0" dy="-0.5">6</text></g>
</svg>