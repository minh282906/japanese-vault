<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (熱)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #熱-bg[i]: Thời gian quả bóng số nảy lên
   - #熱-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#熱-bg1  { animation-delay: 0.05s; }
#熱-s1   { stroke-dasharray: 26.9667; stroke-dashoffset: 26.9667; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#熱-bg2  { animation-delay: 0.42s; }
#熱-s2   { stroke-dasharray: 23.2681; stroke-dashoffset: 23.2681; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#熱-bg3  { animation-delay: 0.79s; }
#熱-s3   { stroke-dasharray: 37.2928; stroke-dashoffset: 37.2928; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#熱-bg4  { animation-delay: 1.16s; }
#熱-s4   { stroke-dasharray: 20.3104; stroke-dashoffset: 20.3104; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#熱-bg5  { animation-delay: 1.53s; }
#熱-s5   { stroke-dasharray: 24.2510; stroke-dashoffset: 24.2510; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#熱-bg6  { animation-delay: 1.90s; }
#熱-s6   { stroke-dasharray: 25.6618; stroke-dashoffset: 25.6618; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#熱-bg7  { animation-delay: 2.27s; }
#熱-s7   { stroke-dasharray: 22.3694; stroke-dashoffset: 22.3694; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#熱-bg8  { animation-delay: 2.64s; }
#熱-s8   { stroke-dasharray: 29.4012; stroke-dashoffset: 29.4012; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#熱-bg9  { animation-delay: 3.01s; }
#熱-s9   { stroke-dasharray: 70.5563; stroke-dashoffset: 70.5563; animation: drawStroke 0.39s ease-out 3.14s forwards; }
#熱-bg10  { animation-delay: 3.55s; }
#熱-s10   { stroke-dasharray: 81.6291; stroke-dashoffset: 81.6291; animation: drawStroke 0.45s ease-out 3.68s forwards; }
#熱-bg11  { animation-delay: 4.15s; }
#熱-s11   { stroke-dasharray: 16.3441; stroke-dashoffset: 16.3441; animation: drawStroke 0.22s ease-out 4.28s forwards; }
#熱-bg12  { animation-delay: 4.52s; }
#熱-s12   { stroke-dasharray: 16.1175; stroke-dashoffset: 16.1175; animation: drawStroke 0.22s ease-out 4.65s forwards; }
#熱-bg13  { animation-delay: 4.89s; }
#熱-s13   { stroke-dasharray: 15.8923; stroke-dashoffset: 15.8923; animation: drawStroke 0.22s ease-out 5.02s forwards; }
#熱-bg14  { animation-delay: 5.26s; }
#熱-s14   { stroke-dasharray: 15.6656; stroke-dashoffset: 15.6656; animation: drawStroke 0.22s ease-out 5.39s forwards; }
#熱-bg15  { animation-delay: 5.63s; }
#熱-s15   { stroke-dasharray: 18.6178; stroke-dashoffset: 18.6178; animation: drawStroke 0.22s ease-out 5.76s forwards; }
]]>
</style>

