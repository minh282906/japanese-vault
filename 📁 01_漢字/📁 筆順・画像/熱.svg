<path id="熱-s9"  class="stroke" stroke="#099abf" d="M69.77,11.62C70.27,12.17,70.66,13.43,70.63,14.419999999999998C69.5,49.739999999999995,62.37,64.37,48.36999999999999,75.74"/>
<path id="熱-s10"  class="stroke" stroke="#0952bf" d="M59.2,35.76C61.13,36.12,62.77,36.08,63.870000000000005,35.76C66.5,35,73.23,33.65,78.94,32.489999999999995C82.00999999999999,31.869999999999994,83.50999999999999,32.489999999999995,82.78,36.349999999999994C82.21000000000001,39.349999999999994,79.01,51.35999999999999,78.51,59.599999999999994C78.10000000000001,66.28,80.02000000000001,71.3,87.2,71.3C93.76,71.3,95.76,71.49,95.95,64.31"/>
