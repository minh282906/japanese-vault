<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (溶)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #溶-bg[i]: Thời gian quả bóng số nảy lên
   - #溶-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#溶-bg1  { animation-delay: 0.05s; }
#溶-s1   { stroke-dasharray: 14.7296; stroke-dashoffset: 14.7296; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#溶-bg2  { animation-delay: 0.42s; }
#溶-s2   { stroke-dasharray: 14.0357; stroke-dashoffset: 14.0357; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#溶-bg3  { animation-delay: 0.79s; }
#溶-s3   { stroke-dasharray: 23.0058; stroke-dashoffset: 23.0058; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#溶-bg4  { animation-delay: 1.16s; }
#溶-s4   { stroke-dasharray: 13.1991; stroke-dashoffset: 13.1991; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#溶-bg5  { animation-delay: 1.53s; }
#溶-s5   { stroke-dasharray: 14.6032; stroke-dashoffset: 14.6032; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#溶-bg6  { animation-delay: 1.90s; }
#溶-s6   { stroke-dasharray: 64.0301; stroke-dashoffset: 64.0301; animation: drawStroke 0.35s ease-out 2.03s forwards; }
#溶-bg7  { animation-delay: 2.40s; }
#溶-s7   { stroke-dasharray: 18.7813; stroke-dashoffset: 18.7813; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#溶-bg8  { animation-delay: 2.77s; }
#溶-s8   { stroke-dasharray: 15.6095; stroke-dashoffset: 15.6095; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#溶-bg9  { animation-delay: 3.14s; }
#溶-s9   { stroke-dasharray: 41.2870; stroke-dashoffset: 41.2870; animation: drawStroke 0.23s ease-out 3.27s forwards; }
#溶-bg10  { animation-delay: 3.52s; }
#溶-s10   { stroke-dasharray: 38.7031; stroke-dashoffset: 38.7031; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#溶-bg11  { animation-delay: 3.89s; }
#溶-s11   { stroke-dasharray: 22.2873; stroke-dashoffset: 22.2873; animation: drawStroke 0.22s ease-out 4.02s forwards; }
#溶-bg12  { animation-delay: 4.26s; }
#溶-s12   { stroke-dasharray: 48.6059; stroke-dashoffset: 48.6059; animation: drawStroke 0.27s ease-out 4.39s forwards; }
#溶-bg13  { animation-delay: 4.68s; }
#溶-s13   { stroke-dasharray: 27.3615; stroke-dashoffset: 27.3615; animation: drawStroke 0.22s ease-out 4.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

