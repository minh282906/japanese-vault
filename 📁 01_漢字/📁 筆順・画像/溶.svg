<path id="溶-s11"  class="stroke" stroke="#7909bf" d="M45.04,73.49C45.74,74.11,46.25,75.5,46.39,76.36C47.25,81.62,48.04,86.06,48.72,91C48.93,92.52,49.129999999999995,93.95,49.32,95.2"/>
<path id="溶-s12"  class="stroke" stroke="#bf09b1" d="M47.32,75.38C57.03,73.94,68.28999999999999,73.17999999999999,74.88,72.53999999999999C77.85,72.24999999999999,79.77,73.19,78.75999999999999,76.49999999999999C77.42999999999999,80.80999999999999,76.1,84.47999999999999,74.80999999999999,89.66999999999999"/>
