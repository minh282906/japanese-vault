<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (笑)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #笑-bg[i]: Thời gian quả bóng số nảy lên
   - #笑-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#笑-bg1  { animation-delay: 0.05s; }
#笑-s1   { stroke-dasharray: 27.0860; stroke-dashoffset: 27.0860; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#笑-bg2  { animation-delay: 0.42s; }
#笑-s2   { stroke-dasharray: 22.0865; stroke-dashoffset: 22.0865; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#笑-bg3  { animation-delay: 0.79s; }
#笑-s3   { stroke-dasharray: 11.9244; stroke-dashoffset: 11.9244; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#笑-bg4  { animation-delay: 1.16s; }
#笑-s4   { stroke-dasharray: 22.2616; stroke-dashoffset: 22.2616; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#笑-bg5  { animation-delay: 1.53s; }
#笑-s5   { stroke-dasharray: 26.3780; stroke-dashoffset: 26.3780; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#笑-bg6  { animation-delay: 1.90s; }
#笑-s6   { stroke-dasharray: 11.8770; stroke-dashoffset: 11.8770; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#笑-bg7  { animation-delay: 2.27s; }
#笑-s7   { stroke-dasharray: 36.5860; stroke-dashoffset: 36.5860; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#笑-bg8  { animation-delay: 2.64s; }
#笑-s8   { stroke-dasharray: 71.4811; stroke-dashoffset: 71.4811; animation: drawStroke 0.39s ease-out 2.77s forwards; }
#笑-bg9  { animation-delay: 3.18s; }
#笑-s9   { stroke-dasharray: 64.2840; stroke-dashoffset: 64.2840; animation: drawStroke 0.35s ease-out 3.31s forwards; }
#笑-bg10  { animation-delay: 3.68s; }
#笑-s10   { stroke-dasharray: 47.9901; stroke-dashoffset: 47.9901; animation: drawStroke 0.26s ease-out 3.81s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #笑-s[i]) -->
<path id="笑-s1"  class="stroke" stroke="#bf0909" d="M30.75,14C30.79,14.55,30.83,15.43,30.68,16.23C29.78,20.92,24.65,30.69,17.62,37"/>
<path id="笑-s2"  class="stroke" stroke="#bf7609" d="M30.48,26.29C33.43,26.29,42.71,23.96,48.260000000000005,23.11C49.68000000000001,22.89,51.120000000000005,22.759999999999998,52.25000000000001,23.009999999999998"/>
<path id="笑-s3"  class="stroke" stroke="#9abf09" d="M36.77,28.83C38.900000000000006,30.619999999999997,42.28,36.18,42.81,38.96"/>
<path id="笑-s4"  class="stroke" stroke="#2dbf09" d="M65.25,14C65.28,14.44,65.39,15.15,65.19,15.77C63.69,20.41,59.519999999999996,27.04,54.01,32.75"/>
<path id="笑-s5"  class="stroke" stroke="#09bf52" d="M64.73,24.91C68.53,24.91,79.59,22.77,86.64,21.92C88.36,21.71,89.5,21.630000000000003,90.88,21.840000000000003"/>
<path id="笑-s6"  class="stroke" stroke="#09bfbf" d="M76.27,26.75C76.3,27.01,76.33,27.42,76.22,27.79C75.67999999999999,29.58,73.05,33.1,69.27,35.93"/>
<path id="笑-s7"  class="stroke" stroke="#0952bf" d="M63,38.62C62.88,39.37,62.4,40.129999999999995,61.87,40.599999999999994C57.379999999999995,44.49999999999999,45.23,49.209999999999994,30.009999999999998,52.559999999999995"/>
<path id="笑-s8"  class="stroke" stroke="#2d09bf" d="M18.24,63.34C21.88,64.13000000000001,25.49,63.99,28.86,63.63C42.87,62.13,65.5,60.13,79.63,59.540000000000006C82.71,59.410000000000004,85.88,59.25000000000001,89.46,59.99000000000001"/>
<path id="笑-s9"  class="stroke" stroke="#9a09bf" d="M53.03,49.17C53.56,49.82,54.09,51.07,54.07,52.47C53.82,76.74,40,90.62,19.87,97.25"/>
<path id="笑-s10"  class="stroke" stroke="#bf0976" d="M54.51,62.75C61.07,69.36,74.41,83.91,82.50999999999999,90.61C84.6,92.34,86.74999999999999,94.13,89.61999999999999,95.13"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="笑-bg1"  class="badge-group"><circle cx="30.75" cy="14" r="3.5" fill="#bf0909"/><text class="num-single" x="30.75" y="14" dx="0" dy="-0.5">1</text></g>
<g id="笑-bg2"  class="badge-group"><circle cx="30.48" cy="22.79" r="3.5" fill="#bf7609"/><text class="num-single" x="30.48" y="22.79" dx="0" dy="-0.5">2</text></g>
<g id="笑-bg3"  class="badge-group"><circle cx="36.77" cy="32.33" r="3.5" fill="#9abf09"/><text class="num-single" x="36.77" y="32.33" dx="0" dy="-0.5">3</text></g>
<g id="笑-bg4"  class="badge-group"><circle cx="65.25" cy="14" r="3.5" fill="#2dbf09"/><text class="num-single" x="65.25" y="14" dx="0" dy="-0.5">4</text></g>
<g id="笑-bg5"  class="badge-group"><circle cx="64.73" cy="24.91" r="3.5" fill="#09bf52"/><text class="num-single" x="64.73" y="24.91" dx="0" dy="-0.5">5</text></g>
<g id="笑-bg6"  class="badge-group"><circle cx="76.27" cy="26.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="76.27" y="26.75" dx="0" dy="-0.5">6</text></g>
<g id="笑-bg7"  class="badge-group"><circle cx="63" cy="38.62" r="3.5" fill="#0952bf"/><text class="num-single" x="63" y="38.62" dx="0" dy="-0.5">7</text></g>
<g id="笑-bg8"  class="badge-group"><circle cx="18.24" cy="63.34" r="3.5" fill="#2d09bf"/><text class="num-single" x="18.24" y="63.34" dx="0" dy="-0.5">8</text></g>
<g id="笑-bg9"  class="badge-group"><circle cx="53.03" cy="49.17" r="3.5" fill="#9a09bf"/><text class="num-single" x="53.03" y="49.17" dx="0" dy="-0.5">9</text></g>
<g id="笑-bg10" class="badge-group"><circle cx="54.51" cy="62.75" r="3.5" fill="#bf0976"/><text class="num-double" x="54.51" y="62.75" dx="-0.4" dy="-0.475">10</text></g>
</svg>