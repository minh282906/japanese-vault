<path id="備-s8"  class="stroke" stroke="#0964bf" d="M49.53,54.65C50.06,55.18,50.35,56,50.35,56.76C50.35,64.53999999999999,50.440000000000005,81.9,50.440000000000005,91C50.440000000000005,94,50.440000000000005,95.99,50.440000000000005,96.26"/>
<path id="備-s9"  class="stroke" stroke="#0909bf" d="M51.3,51.79C59.25,51,84.44999999999999,48.11,85.97,47.95C88.7,47.650000000000006,89.38,48.5,89.38,51.02C89.38,58,89.61999999999999,78.95,89.61999999999999,90.98C89.61999999999999,100.25,84.28999999999999,92.26,83.21,91.74000000000001"/>
<path id="備-s10"  class="stroke" stroke="#6409bf" d="M51.55,64.87C61.87,63.38,80.75,62.00000000000001,88.19,61.68000000000001"/>
<path id="備-s11"  class="stroke" stroke="#bf09bf" d="M51.71,78.45C60.870000000000005,77.25,78.12,75.63000000000001,88.16,75.3"/>
<path id="備-s12"  class="stroke" stroke="#bf0964" d="M67.82,52.4C68.52,53.1,69.02999999999999,54.5,69.02999999999999,56.01C69.02999999999999,59.5,68.97999999999999,77.38,68.97999999999999,87.25999999999999C68.97999999999999,90.21999999999998,68.92999999999999,92.38999999999999,68.89999999999999,93.16"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="備-bg1"  class="badge-group"><circle cx="35.25" cy="15" r="3.5" fill="#bf0909"/><text class="num-single" x="35.25" y="15" dx="0" dy="-0.5">1</text></g>
