<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (備)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #備-bg[i]: Thời gian quả bóng số nảy lên
   - #備-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#備-bg1  { animation-delay: 0.05s; }
#備-s1   { stroke-dasharray: 47.5503; stroke-dashoffset: 47.5503; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#備-bg2  { animation-delay: 0.46s; }
#備-s2   { stroke-dasharray: 55.8717; stroke-dashoffset: 55.8717; animation: drawStroke 0.31s ease-out 0.59s forwards; }
#備-bg3  { animation-delay: 0.92s; }
#備-s3   { stroke-dasharray: 47.9669; stroke-dashoffset: 47.9669; animation: drawStroke 0.26s ease-out 1.05s forwards; }
#備-bg4  { animation-delay: 1.33s; }
#備-s4   { stroke-dasharray: 26.2354; stroke-dashoffset: 26.2354; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#備-bg5  { animation-delay: 1.70s; }
#備-s5   { stroke-dasharray: 26.4034; stroke-dashoffset: 26.4034; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#備-bg6  { animation-delay: 2.07s; }
#備-s6   { stroke-dasharray: 53.3698; stroke-dashoffset: 53.3698; animation: drawStroke 0.29s ease-out 2.20s forwards; }
#備-bg7  { animation-delay: 2.51s; }
#備-s7   { stroke-dasharray: 54.7225; stroke-dashoffset: 54.7225; animation: drawStroke 0.30s ease-out 2.64s forwards; }
#備-bg8  { animation-delay: 2.96s; }
#備-s8   { stroke-dasharray: 41.8196; stroke-dashoffset: 41.8196; animation: drawStroke 0.23s ease-out 3.09s forwards; }
#備-bg9  { animation-delay: 3.34s; }
#備-s9   { stroke-dasharray: 91.7493; stroke-dashoffset: 91.7493; animation: drawStroke 0.50s ease-out 3.47s forwards; }
#備-bg10  { animation-delay: 3.99s; }
#備-s10   { stroke-dasharray: 36.7885; stroke-dashoffset: 36.7885; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#備-bg11  { animation-delay: 4.36s; }
#備-s11   { stroke-dasharray: 36.5959; stroke-dashoffset: 36.5959; animation: drawStroke 0.22s ease-out 4.49s forwards; }
#備-bg12  { animation-delay: 4.73s; }
#備-s12   { stroke-dasharray: 41.0449; stroke-dashoffset: 41.0449; animation: drawStroke 0.23s ease-out 4.86s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #備-s[i]) -->
<path id="備-s1"  class="stroke" stroke="#bf0909" d="M35.25,15C35.5,17,35.18,18.37,34.38,20.08C29.25,31,23.75,42.5,12,55.79"/>
<path id="備-s2"  class="stroke" stroke="#bf6409" d="M26.78,39.25C27.76,40.23,28.290000000000003,41.97,28.290000000000003,43.23C28.290000000000003,54.4,28.270000000000003,76.96,28.250000000000004,88.25C28.250000000000004,91.63,28.240000000000002,94,28.240000000000002,94.75"/>
