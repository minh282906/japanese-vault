<path id="備-s6"  class="stroke" stroke="#09bf64" d="M40.39,39.55C42.75,40,44.96,39.97,47.14,39.82C58.4,39.08,73.89,37.43,86.77000000000001,36.42C89.11000000000001,36.24,91.25000000000001,36.13,93.56000000000002,36.620000000000005"/>
