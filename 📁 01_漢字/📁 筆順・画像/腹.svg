<path id="腹-s8"  class="stroke" stroke="#0995bf" d="M56.44,35.24C62.25,34.14,76.25999999999999,31.930000000000003,80.86,31.37C82.91,31.12,84.99,32.02,84.6,34.39C84.17999999999999,36.88,82.91999999999999,45.49,82.21,50.56C81.91,52.72,81.69999999999999,54.230000000000004,81.69999999999999,54.38"/>
<path id="腹-s9"  class="stroke" stroke="#0941bf" d="M57.58,44.31C64.5,43.25,75.75,41.75,82.55,41.410000000000004"/>
<path id="腹-s10"  class="stroke" stroke="#2509bf" d="M58.69,53.76C64.75,53.379999999999995,73.5,52.12,81.03999999999999,51.79"/>
<path id="腹-s11"  class="stroke" stroke="#7909bf" d="M59.33,60.25C59.42,61.33,59.37,62.31,58.9,63.3C56.62,68.13,53.12,74.5,45.879999999999995,80.42"/>
<path id="腹-s12"  class="stroke" stroke="#bf09b1" d="M60.97,65.73C61.22,65.76,62.82,65.8,63.54,65.65C66.63,65.01,74.36,62.92000000000001,77.77,62.120000000000005C80.11,61.57000000000001,81.53999999999999,62.650000000000006,80.67999999999999,64.75C76.62,74.62,61.12,90.75,45,97"/>
