<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (腹)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #腹-bg[i]: Thời gian quả bóng số nảy lên
   - #腹-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#腹-bg1  { animation-delay: 0.05s; }
#腹-s1   { stroke-dasharray: 72.7549; stroke-dashoffset: 72.7549; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#腹-bg2  { animation-delay: 0.60s; }
#腹-s2   { stroke-dasharray: 98.4845; stroke-dashoffset: 98.4845; animation: drawStroke 0.54s ease-out 0.73s forwards; }
#腹-bg3  { animation-delay: 1.29s; }
#腹-s3   { stroke-dasharray: 17.8840; stroke-dashoffset: 17.8840; animation: drawStroke 0.22s ease-out 1.42s forwards; }
#腹-bg4  { animation-delay: 1.66s; }
#腹-s4   { stroke-dasharray: 18.8686; stroke-dashoffset: 18.8686; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#腹-bg5  { animation-delay: 2.03s; }
#腹-s5   { stroke-dasharray: 24.0580; stroke-dashoffset: 24.0580; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#腹-bg6  { animation-delay: 2.40s; }
#腹-s6   { stroke-dasharray: 32.2967; stroke-dashoffset: 32.2967; animation: drawStroke 0.22s ease-out 2.53s forwards; }
#腹-bg7  { animation-delay: 2.77s; }
#腹-s7   { stroke-dasharray: 21.9497; stroke-dashoffset: 21.9497; animation: drawStroke 0.22s ease-out 2.90s forwards; }
#腹-bg8  { animation-delay: 3.14s; }
#腹-s8   { stroke-dasharray: 50.6555; stroke-dashoffset: 50.6555; animation: drawStroke 0.28s ease-out 3.27s forwards; }
#腹-bg9  { animation-delay: 3.57s; }
#腹-s9   { stroke-dasharray: 25.1461; stroke-dashoffset: 25.1461; animation: drawStroke 0.22s ease-out 3.70s forwards; }
#腹-bg10  { animation-delay: 3.94s; }
#腹-s10   { stroke-dasharray: 22.4395; stroke-dashoffset: 22.4395; animation: drawStroke 0.22s ease-out 4.07s forwards; }
#腹-bg11  { animation-delay: 4.31s; }
#腹-s11   { stroke-dasharray: 24.8217; stroke-dashoffset: 24.8217; animation: drawStroke 0.22s ease-out 4.44s forwards; }
#腹-bg12  { animation-delay: 4.68s; }
#腹-s12   { stroke-dasharray: 71.5751; stroke-dashoffset: 71.5751; animation: drawStroke 0.39s ease-out 4.81s forwards; }
#腹-bg13  { animation-delay: 5.22s; }
#腹-s13   { stroke-dasharray: 42.3555; stroke-dashoffset: 42.3555; animation: drawStroke 0.23s ease-out 5.35s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

