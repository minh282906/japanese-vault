<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (麦)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #麦-bg[i]: Thời gian quả bóng số nảy lên
   - #麦-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#麦-bg1  { animation-delay: 0.05s; }
#麦-s1   { stroke-dasharray: 50.8733; stroke-dashoffset: 50.8733; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#麦-bg2  { animation-delay: 0.48s; }
#麦-s2   { stroke-dasharray: 39.1392; stroke-dashoffset: 39.1392; animation: drawStroke 0.22s ease-out 0.61s forwards; }
#麦-bg3  { animation-delay: 0.85s; }
#麦-s3   { stroke-dasharray: 51.7664; stroke-dashoffset: 51.7664; animation: drawStroke 0.28s ease-out 0.98s forwards; }
#麦-bg4  { animation-delay: 1.28s; }
#麦-s4   { stroke-dasharray: 68.3560; stroke-dashoffset: 68.3560; animation: drawStroke 0.38s ease-out 1.41s forwards; }
#麦-bg5  { animation-delay: 1.81s; }
#麦-s5   { stroke-dasharray: 37.2955; stroke-dashoffset: 37.2955; animation: drawStroke 0.22s ease-out 1.94s forwards; }
#麦-bg6  { animation-delay: 2.18s; }
#麦-s6   { stroke-dasharray: 88.8138; stroke-dashoffset: 88.8138; animation: drawStroke 0.49s ease-out 2.31s forwards; }
#麦-bg7  { animation-delay: 2.82s; }
#麦-s7   { stroke-dasharray: 60.1352; stroke-dashoffset: 60.1352; animation: drawStroke 0.33s ease-out 2.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #麦-s[i]) -->
<path id="麦-s1"  class="stroke" stroke="#bf0909" d="M30.13,26.32C32.06,26.75,34.6,27.13,36.83,26.97C49.28,26.049999999999997,62.51,24.2,73.63,23.299999999999997C75.94,23.109999999999996,78.44,22.849999999999998,80.75,23.139999999999997"/>
<path id="麦-s2"  class="stroke" stroke="#bfa509" d="M53,11.25C54.25,12.5,54.5,14,54.5,15.5C54.5,18.25,54.25,39,54.25,50"/>
<path id="麦-s3"  class="stroke" stroke="#3dbf09" d="M28.88,39.32C30.74,39.62,33.519999999999996,39.9,35.16,39.8C47.949999999999996,39,59.349999999999994,37.12,74.63999999999999,35.66C77.34999999999998,35.4,79.00999999999999,35.769999999999996,80.37999999999998,35.879999999999995"/>
<path id="麦-s4"  class="stroke" stroke="#09bf71" d="M21.88,53.82C24.549999999999997,54.37,27.59,54.29,29.58,54.05C45.5,52.12,65.25,49.5,82.84,48.66C86.18,48.5,88.04,48.62,89.87,49.129999999999995"/>
<path id="麦-s5"  class="stroke" stroke="#0971bf" d="M46,55C46.17,56.43,45.46,58.16,44.67,59.4C41.12,65,33.14,74.61,20.62,80.88"/>
<path id="麦-s6"  class="stroke" stroke="#3d09bf" d="M47.25,62.25C49.25,62.5,50.77,62.5,52.25,62.27C57,61.510000000000005,63.31,59.85,66.93,59.14C69.97000000000001,58.54,70.63000000000001,60.72,69.28,63.11C64.09,72.31,40.24,94.47,19.92,99.38"/>
<path id="麦-s7"  class="stroke" stroke="#bf09a5" d="M40.5,67.75C48.53,72.31,74,90.5,83.9,95.39C86.86,96.85,89.24000000000001,97.56,92.12,98"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="麦-bg1"  class="badge-group"><circle cx="30.13" cy="26.32" r="3.5" fill="#bf0909"/><text class="num-single" x="30.13" y="26.32" dx="0" dy="-0.5">1</text></g>
<g id="麦-bg2"  class="badge-group"><circle cx="53" cy="11.25" r="3.5" fill="#bfa509"/><text class="num-single" x="53" y="11.25" dx="0" dy="-0.5">2</text></g>
<g id="麦-bg3"  class="badge-group"><circle cx="28.88" cy="39.32" r="3.5" fill="#3dbf09"/><text class="num-single" x="28.88" y="39.32" dx="0" dy="-0.5">3</text></g>
<g id="麦-bg4"  class="badge-group"><circle cx="21.88" cy="53.82" r="3.5" fill="#09bf71"/><text class="num-single" x="21.88" y="53.82" dx="0" dy="-0.5">4</text></g>
<g id="麦-bg5"  class="badge-group"><circle cx="46" cy="55" r="3.5" fill="#0971bf"/><text class="num-single" x="46" y="55" dx="0" dy="-0.5">5</text></g>
<g id="麦-bg6"  class="badge-group"><circle cx="47.25" cy="62.25" r="3.5" fill="#3d09bf"/><text class="num-single" x="47.25" y="62.25" dx="0" dy="-0.5">6</text></g>
<g id="麦-bg7"  class="badge-group"><circle cx="40.5" cy="67.75" r="3.5" fill="#bf09a5"/><text class="num-single" x="40.5" y="67.75" dx="0" dy="-0.5">7</text></g>
</svg>