<g id="席-bg8"  class="badge-group"><circle cx="34.13" cy="64.8" r="3.5" fill="#2d09bf"/><text class="num-single" x="34.13" y="64.8" dx="0" dy="-0.5">8</text></g>
<g id="席-bg9"  class="badge-group"><circle cx="36.47" cy="73.06" r="3.5" fill="#9a09bf"/><text class="num-single" x="36.47" y="73.06" dx="0" dy="-0.5">9</text></g>
<g id="席-bg10" class="badge-group"><circle cx="57.23" cy="58" r="3.5" fill="#bf0976"/><text class="num-double" x="57.23" y="58" dx="-0.4" dy="-0.475">10</text></g>
</svg>