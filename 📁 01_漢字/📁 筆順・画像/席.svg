<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (席)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #席-bg[i]: Thời gian quả bóng số nảy lên
   - #席-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#席-bg1  { animation-delay: 0.05s; }
#席-s1   { stroke-dasharray: 11.5139; stroke-dashoffset: 11.5139; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#席-bg2  { animation-delay: 0.42s; }
#席-s2   { stroke-dasharray: 67.5448; stroke-dashoffset: 67.5448; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#席-bg3  { animation-delay: 0.94s; }
#席-s3   { stroke-dasharray: 67.6967; stroke-dashoffset: 67.6967; animation: drawStroke 0.37s ease-out 1.07s forwards; }
#席-bg4  { animation-delay: 1.46s; }
#席-s4   { stroke-dasharray: 57.4912; stroke-dashoffset: 57.4912; animation: drawStroke 0.32s ease-out 1.59s forwards; }
#席-bg5  { animation-delay: 1.93s; }
#席-s5   { stroke-dasharray: 26.4756; stroke-dashoffset: 26.4756; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#席-bg6  { animation-delay: 2.30s; }
#席-s6   { stroke-dasharray: 26.2514; stroke-dashoffset: 26.2514; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#席-bg7  { animation-delay: 2.67s; }
#席-s7   { stroke-dasharray: 20.4292; stroke-dashoffset: 20.4292; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#席-bg8  { animation-delay: 3.04s; }
#席-s8   { stroke-dasharray: 26.1346; stroke-dashoffset: 26.1346; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#席-bg9  { animation-delay: 3.41s; }
#席-s9   { stroke-dasharray: 78.0634; stroke-dashoffset: 78.0634; animation: drawStroke 0.43s ease-out 3.54s forwards; }
#席-bg10  { animation-delay: 3.99s; }
#席-s10   { stroke-dasharray: 43.3460; stroke-dashoffset: 43.3460; animation: drawStroke 0.24s ease-out 4.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #席-s[i]) -->
<path id="席-s1"  class="stroke" stroke="#bf0909" d="M54.81,9.63C55.84,10.66,56.32,12,56.32,13.280000000000001C56.32,15.620000000000001,56.25,18.37,56.25,20.740000000000002"/>
<path id="席-s2"  class="stroke" stroke="#bf7609" d="M22.63,24.23C26.5,24.88,29.63,24.84,32.879999999999995,24.48C47.49999999999999,22.88,65.4,21.01,80.75,19.880000000000003C83.89,19.650000000000002,86.77,19.660000000000004,89.87,20.320000000000004"/>
<path id="席-s3"  class="stroke" stroke="#9abf09" d="M25.99,24.75C26.81,25.57,26.919999999999998,26.87,26.889999999999997,28.27C26.499999999999996,49.370000000000005,23.119999999999997,73.75,10.049999999999997,88.71"/>
<path id="席-s4"  class="stroke" stroke="#2dbf09" d="M30.53,40.5C33.26,41.16,36.29,40.71,39.04,40.43C48.08,39.53,66.87,37.15,78.88,36.19C81.85,35.949999999999996,84.75999999999999,35.699999999999996,87.72999999999999,36.129999999999995"/>
<path id="席-s5"  class="stroke" stroke="#09bf52" d="M43.66,30.79C44.43,31.56,45,32.66,45.089999999999996,33.19C45.66,36.71,46.489999999999995,48.269999999999996,47.019999999999996,54.37C47.099999999999994,55.309999999999995,47.17999999999999,56.11,47.239999999999995,56.739999999999995"/>
<path id="席-s6"  class="stroke" stroke="#09bfbf" d="M68.4,26.75C69.26,27.61,69.5,28.87,69.33000000000001,30.15C68.53,36.29,66.62,47.3,66,52.5"/>
<path id="席-s7"  class="stroke" stroke="#0952bf" d="M48.25,56C51.84,55.62,59.65,54.2,64.75,53.6C66.39,53.410000000000004,67.73,53.52,68.5,53.5"/>
<path id="席-s8"  class="stroke" stroke="#2d09bf" d="M34.13,68.3C35.04,69.21,35.75,70.25,35.980000000000004,71.42999999999999C36.760000000000005,75.5,37.56,80.94999999999999,38.650000000000006,90.24C38.78000000000001,91.33,38.910000000000004,92.46,39.040000000000006,93.66"/>
<path id="席-s9"  class="stroke" stroke="#9a09bf" d="M36.47,69.56C42,69,78.71,65.05,81.32,64.9C84.38,64.73,85.05,67.80000000000001,84.94,69.31C84.39,76.88,83.66,80.16,81.64,87.52000000000001C80.47,91.76,77.37,88.46000000000001,75.82,86.92000000000002"/>
<path id="席-s10"  class="stroke" stroke="#bf0976" d="M57.23,58C58.3,59.07,58.58,60.5,58.58,61.63C58.58,65.88,58.62,84.47,58.64,95.88C58.64,98.25999999999999,58.64,100.08,58.64,101"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="席-bg1"  class="badge-group"><circle cx="54.81" cy="9.63" r="3.5" fill="#bf0909"/><text class="num-single" x="54.81" y="9.63" dx="0" dy="-0.5">1</text></g>
<g id="席-bg2"  class="badge-group"><circle cx="22.63" cy="20.73" r="3.5" fill="#bf7609"/><text class="num-single" x="22.63" y="20.73" dx="0" dy="-0.5">2</text></g>
<g id="席-bg3"  class="badge-group"><circle cx="25.99" cy="28.25" r="3.5" fill="#9abf09"/><text class="num-single" x="25.99" y="28.25" dx="0" dy="-0.5">3</text></g>
<g id="席-bg4"  class="badge-group"><circle cx="30.53" cy="40.5" r="3.5" fill="#2dbf09"/><text class="num-single" x="30.53" y="40.5" dx="0" dy="-0.5">4</text></g>
<g id="席-bg5"  class="badge-group"><circle cx="43.66" cy="30.79" r="3.5" fill="#09bf52"/><text class="num-single" x="43.66" y="30.79" dx="0" dy="-0.5">5</text></g>
<g id="席-bg6"  class="badge-group"><circle cx="68.4" cy="26.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="68.4" y="26.75" dx="0" dy="-0.5">6</text></g>
