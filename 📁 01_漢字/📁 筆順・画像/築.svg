<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (築)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #築-bg[i]: Thời gian quả bóng số nảy lên
   - #築-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#築-bg1  { animation-delay: 0.05s; }
#築-s1   { stroke-dasharray: 25.3588; stroke-dashoffset: 25.3588; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#築-bg2  { animation-delay: 0.42s; }
#築-s2   { stroke-dasharray: 19.1752; stroke-dashoffset: 19.1752; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#築-bg3  { animation-delay: 0.79s; }
#築-s3   { stroke-dasharray: 9.1289; stroke-dashoffset: 9.1289; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#築-bg4  { animation-delay: 1.16s; }
#築-s4   { stroke-dasharray: 20.9561; stroke-dashoffset: 20.9561; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#築-bg5  { animation-delay: 1.53s; }
#築-s5   { stroke-dasharray: 25.3918; stroke-dashoffset: 25.3918; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#築-bg6  { animation-delay: 1.90s; }
#築-s6   { stroke-dasharray: 13.4145; stroke-dashoffset: 13.4145; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#築-bg7  { animation-delay: 2.27s; }
#築-s7   { stroke-dasharray: 24.7549; stroke-dashoffset: 24.7549; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#築-bg8  { animation-delay: 2.64s; }
#築-s8   { stroke-dasharray: 12.7088; stroke-dashoffset: 12.7088; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#築-bg9  { animation-delay: 3.01s; }
#築-s9   { stroke-dasharray: 26.9470; stroke-dashoffset: 26.9470; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#築-bg10  { animation-delay: 3.38s; }
#築-s10   { stroke-dasharray: 24.3814; stroke-dashoffset: 24.3814; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#築-bg11  { animation-delay: 3.75s; }
#築-s11   { stroke-dasharray: 55.7059; stroke-dashoffset: 55.7059; animation: drawStroke 0.31s ease-out 3.88s forwards; }
#築-bg12  { animation-delay: 4.21s; }
#築-s12   { stroke-dasharray: 11.0322; stroke-dashoffset: 11.0322; animation: drawStroke 0.22s ease-out 4.34s forwards; }
#築-bg13  { animation-delay: 4.58s; }
#築-s13   { stroke-dasharray: 73.8596; stroke-dashoffset: 73.8596; animation: drawStroke 0.41s ease-out 4.71s forwards; }
#築-bg14  { animation-delay: 5.14s; }
#築-s14   { stroke-dasharray: 39.7998; stroke-dashoffset: 39.7998; animation: drawStroke 0.22s ease-out 5.27s forwards; }
#築-bg15  { animation-delay: 5.51s; }
#築-s15   { stroke-dasharray: 43.9564; stroke-dashoffset: 43.9564; animation: drawStroke 0.24s ease-out 5.64s forwards; }
#築-bg16  { animation-delay: 5.90s; }
#築-s16   { stroke-dasharray: 41.3774; stroke-dashoffset: 41.3774; animation: drawStroke 0.23s ease-out 6.03s forwards; }
]]>
</style>

