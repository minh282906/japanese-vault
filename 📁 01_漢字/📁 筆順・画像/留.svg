<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (留)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #留-bg[i]: Thời gian quả bóng số nảy lên
   - #留-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#留-bg1  { animation-delay: 0.05s; }
#留-s1   { stroke-dasharray: 19.9582; stroke-dashoffset: 19.9582; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#留-bg2  { animation-delay: 0.42s; }
#留-s2   { stroke-dasharray: 51.6242; stroke-dashoffset: 51.6242; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#留-bg3  { animation-delay: 0.85s; }
#留-s3   { stroke-dasharray: 18.3642; stroke-dashoffset: 18.3642; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#留-bg4  { animation-delay: 1.22s; }
#留-s4   { stroke-dasharray: 74.5686; stroke-dashoffset: 74.5686; animation: drawStroke 0.41s ease-out 1.35s forwards; }
#留-bg5  { animation-delay: 1.78s; }
#留-s5   { stroke-dasharray: 34.3841; stroke-dashoffset: 34.3841; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#留-bg6  { animation-delay: 2.15s; }
#留-s6   { stroke-dasharray: 37.5291; stroke-dashoffset: 37.5291; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#留-bg7  { animation-delay: 2.52s; }
#留-s7   { stroke-dasharray: 93.6274; stroke-dashoffset: 93.6274; animation: drawStroke 0.51s ease-out 2.65s forwards; }
#留-bg8  { animation-delay: 3.18s; }
#留-s8   { stroke-dasharray: 31.0348; stroke-dashoffset: 31.0348; animation: drawStroke 0.22s ease-out 3.31s forwards; }
#留-bg9  { animation-delay: 3.55s; }
#留-s9   { stroke-dasharray: 53.0027; stroke-dashoffset: 53.0027; animation: drawStroke 0.29s ease-out 3.68s forwards; }
#留-bg10  { animation-delay: 3.99s; }
#留-s10   { stroke-dasharray: 47.9828; stroke-dashoffset: 47.9828; animation: drawStroke 0.26s ease-out 4.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #留-s[i]) -->
<path id="留-s1"  class="stroke" stroke="#bf0909" d="M41.07,11.69C41.07,12.379999999999999,40.97,13.07,40.13,13.75C36.120000000000005,17,31.450000000000003,19.89,25.14,22.89"/>
<path id="留-s2"  class="stroke" stroke="#bf7609" d="M21.12,23.1C21.89,23.87,22.44,24.5,22.44,25.69C22.44,26.5,22.59,42.760000000000005,22.59,46.64C22.59,49.64,23.25,50.26,26.02,48.55C30.95,45.51,39.12,40.14,44.32,36.739999999999995"/>
<path id="留-s3"  class="stroke" stroke="#9abf09" d="M40.78,29.37C45,34,48.38,39,50.81,44.65"/>
<path id="留-s4"  class="stroke" stroke="#2dbf09" d="M57.94,17.74C59.059999999999995,18.15,60.47,18.099999999999998,61.449999999999996,17.959999999999997C69.42999999999999,16.819999999999997,81.89,13.619999999999997,86.32,13.199999999999998C89.19999999999999,12.929999999999998,90.63,14.369999999999997,90.50999999999999,17.47C90.32,22.529999999999998,86.74999999999999,39.12,83.07,46.099999999999994C80.69999999999999,50.589999999999996,78.80999999999999,47.959999999999994,76.66,45.23"/>
<path id="留-s5"  class="stroke" stroke="#09bf52" d="M69.43,20.25C69.75,21,69.82000000000001,22.04,69.60000000000001,22.990000000000002C67.38000000000001,32.38,63.50000000000001,42.25,55.55000000000001,50.89"/>
<path id="留-s6"  class="stroke" stroke="#09bfbf" d="M25.19,61.37C26.09,62.279999999999994,26.630000000000003,63.54,26.770000000000003,64.52C28,73.12,29,82.62,30.2,93.74C30.37,95.28999999999999,30.47,96.8,30.599999999999998,98.25"/>
<path id="留-s7"  class="stroke" stroke="#0952bf" d="M27.36,63.34C45.25,61.25,68.75,59.1,79.52,58.470000000000006C83.47999999999999,58.24000000000001,85.39,60.75000000000001,85.02,64.07000000000001C84.24,71.12,82.89999999999999,81.38000000000001,80.92999999999999,91.73C80.66999999999999,93.09,80.39999999999999,94.43,80.13,95.73"/>
<path id="留-s8"  class="stroke" stroke="#2d09bf" d="M52.95,62.16C53.77,62.98,54.14,64.36999999999999,54.14,65.74C54.14,73.69,54.15,90.31,54.15,92.91"/>
<path id="留-s9"  class="stroke" stroke="#9a09bf" d="M29.94,78.32C41,77.38,64.5,75,82.79,74.39"/>
<path id="留-s10"  class="stroke" stroke="#bf0976" d="M31.6,95.58C44,94.75,65.75,93.37,79.50999999999999,92.98"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="留-bg1"  class="badge-group"><circle cx="41.07" cy="11.69" r="3.5" fill="#bf0909"/><text class="num-single" x="41.07" y="11.69" dx="0" dy="-0.5">1</text></g>
<g id="留-bg2"  class="badge-group"><circle cx="21.12" cy="23.1" r="3.5" fill="#bf7609"/><text class="num-single" x="21.12" y="23.1" dx="0" dy="-0.5">2</text></g>
