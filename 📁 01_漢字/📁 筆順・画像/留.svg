<g id="留-bg6"  class="badge-group"><circle cx="25.19" cy="57.87" r="3.5" fill="#09bfbf"/><text class="num-single" x="25.19" y="57.87" dx="0" dy="-0.5">6</text></g>
<g id="留-bg7"  class="badge-group"><circle cx="27.36" cy="66.84" r="3.5" fill="#0952bf"/><text class="num-single" x="27.36" y="66.84" dx="0" dy="-0.5">7</text></g>
<g id="留-bg8"  class="badge-group"><circle cx="52.95" cy="62.16" r="3.5" fill="#2d09bf"/><text class="num-single" x="52.95" y="62.16" dx="0" dy="-0.5">8</text></g>
<g id="留-bg9"  class="badge-group"><circle cx="29.94" cy="78.32" r="3.5" fill="#9a09bf"/><text class="num-single" x="29.94" y="78.32" dx="0" dy="-0.5">9</text></g>
<g id="留-bg10" class="badge-group"><circle cx="31.6" cy="95.58" r="3.5" fill="#bf0976"/><text class="num-double" x="31.6" y="95.58" dx="-0.4" dy="-0.475">10</text></g>
</svg>