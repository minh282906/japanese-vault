<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (複)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #複-bg[i]: Thời gian quả bóng số nảy lên
   - #複-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#複-bg1  { animation-delay: 0.05s; }
#複-s1   { stroke-dasharray: 12.1842; stroke-dashoffset: 12.1842; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#複-bg2  { animation-delay: 0.42s; }
#複-s2   { stroke-dasharray: 77.0668; stroke-dashoffset: 77.0668; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#複-bg3  { animation-delay: 0.99s; }
#複-s3   { stroke-dasharray: 44.8133; stroke-dashoffset: 44.8133; animation: drawStroke 0.25s ease-out 1.12s forwards; }
#複-bg4  { animation-delay: 1.39s; }
#複-s4   { stroke-dasharray: 12.4034; stroke-dashoffset: 12.4034; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#複-bg5  { animation-delay: 1.76s; }
#複-s5   { stroke-dasharray: 13.2313; stroke-dashoffset: 13.2313; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#複-bg6  { animation-delay: 2.13s; }
#複-s6   { stroke-dasharray: 24.1847; stroke-dashoffset: 24.1847; animation: drawStroke 0.22s ease-out 2.26s forwards; }
#複-bg7  { animation-delay: 2.50s; }
#複-s7   { stroke-dasharray: 30.5685; stroke-dashoffset: 30.5685; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#複-bg8  { animation-delay: 2.87s; }
#複-s8   { stroke-dasharray: 22.6138; stroke-dashoffset: 22.6138; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#複-bg9  { animation-delay: 3.24s; }
#複-s9   { stroke-dasharray: 51.4658; stroke-dashoffset: 51.4658; animation: drawStroke 0.28s ease-out 3.37s forwards; }
#複-bg10  { animation-delay: 3.67s; }
#複-s10   { stroke-dasharray: 25.8854; stroke-dashoffset: 25.8854; animation: drawStroke 0.22s ease-out 3.80s forwards; }
#複-bg11  { animation-delay: 4.04s; }
#複-s11   { stroke-dasharray: 23.2079; stroke-dashoffset: 23.2079; animation: drawStroke 0.22s ease-out 4.17s forwards; }
#複-bg12  { animation-delay: 4.41s; }
#複-s12   { stroke-dasharray: 26.0950; stroke-dashoffset: 26.0950; animation: drawStroke 0.22s ease-out 4.54s forwards; }
#複-bg13  { animation-delay: 4.78s; }
#複-s13   { stroke-dasharray: 69.3590; stroke-dashoffset: 69.3590; animation: drawStroke 0.38s ease-out 4.91s forwards; }
#複-bg14  { animation-delay: 5.31s; }
#複-s14   { stroke-dasharray: 42.4182; stroke-dashoffset: 42.4182; animation: drawStroke 0.23s ease-out 5.44s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

