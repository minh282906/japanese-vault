<path id="複-s9"  class="stroke" stroke="#0971bf" d="M56.69,33.99C60.25,33.34,76.15,30.64,81.36,29.92C83.79,29.580000000000002,85.65,30.75,85.34,33.39C85.04,36.01,84.35000000000001,43.26,83.64,48.24C83.24,51.08,82.94,53.21,82.94,53.39"/>
