<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (曇)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #曇-bg[i]: Thời gian quả bóng số nảy lên
   - #曇-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#曇-bg1  { animation-delay: 0.05s; }
#曇-s1   { stroke-dasharray: 19.8487; stroke-dashoffset: 19.8487; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#曇-bg2  { animation-delay: 0.42s; }
#曇-s2   { stroke-dasharray: 60.7425; stroke-dashoffset: 60.7425; animation: drawStroke 0.33s ease-out 0.55s forwards; }
#曇-bg3  { animation-delay: 0.90s; }
#曇-s3   { stroke-dasharray: 37.2003; stroke-dashoffset: 37.2003; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#曇-bg4  { animation-delay: 1.27s; }
#曇-s4   { stroke-dasharray: 33.5900; stroke-dashoffset: 33.5900; animation: drawStroke 0.22s ease-out 1.40s forwards; }
#曇-bg5  { animation-delay: 1.64s; }
#曇-s5   { stroke-dasharray: 38.1831; stroke-dashoffset: 38.1831; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#曇-bg6  { animation-delay: 2.01s; }
#曇-s6   { stroke-dasharray: 15.7181; stroke-dashoffset: 15.7181; animation: drawStroke 0.22s ease-out 2.14s forwards; }
#曇-bg7  { animation-delay: 2.38s; }
#曇-s7   { stroke-dasharray: 77.9189; stroke-dashoffset: 77.9189; animation: drawStroke 0.43s ease-out 2.51s forwards; }
#曇-bg8  { animation-delay: 2.96s; }
#曇-s8   { stroke-dasharray: 24.6579; stroke-dashoffset: 24.6579; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#曇-bg9  { animation-delay: 3.33s; }
#曇-s9   { stroke-dasharray: 8.0699; stroke-dashoffset: 8.0699; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#曇-bg10  { animation-delay: 3.70s; }
#曇-s10   { stroke-dasharray: 8.5921; stroke-dashoffset: 8.5921; animation: drawStroke 0.22s ease-out 3.83s forwards; }
#曇-bg11  { animation-delay: 4.07s; }
#曇-s11   { stroke-dasharray: 8.4490; stroke-dashoffset: 8.4490; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#曇-bg12  { animation-delay: 4.44s; }
#曇-s12   { stroke-dasharray: 8.6661; stroke-dashoffset: 8.6661; animation: drawStroke 0.22s ease-out 4.57s forwards; }
#曇-bg13  { animation-delay: 4.81s; }
#曇-s13   { stroke-dasharray: 30.1297; stroke-dashoffset: 30.1297; animation: drawStroke 0.22s ease-out 4.94s forwards; }
#曇-bg14  { animation-delay: 5.18s; }
#曇-s14   { stroke-dasharray: 71.8034; stroke-dashoffset: 71.8034; animation: drawStroke 0.39s ease-out 5.31s forwards; }
#曇-bg15  { animation-delay: 5.72s; }
#曇-s15   { stroke-dasharray: 55.2768; stroke-dashoffset: 55.2768; animation: drawStroke 0.30s ease-out 5.85s forwards; }
#曇-bg16  { animation-delay: 6.17s; }
#曇-s16   { stroke-dasharray: 18.7903; stroke-dashoffset: 18.7903; animation: drawStroke 0.22s ease-out 6.30s forwards; }
]]>
</style>

