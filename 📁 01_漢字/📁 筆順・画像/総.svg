<path id="総-s9"  class="stroke" stroke="#0971bf" d="M67.4,31.3C67.63000000000001,32.38,67.5,33.88,66.89,34.89C62.97,41.34,60,45.62,55.54,51.31C53.75,53.59,54.68,55.22,56.839999999999996,54.620000000000005C62.879999999999995,52.95,72.5,51.00000000000001,81.46,49.21000000000001"/>
<path id="総-s10"  class="stroke" stroke="#0923bf" d="M78,42.88C81.01,45.11,85.78,52.040000000000006,86.53999999999999,55.5"/>
