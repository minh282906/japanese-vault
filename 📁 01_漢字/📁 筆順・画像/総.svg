<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (総)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #総-bg[i]: Thời gian quả bóng số nảy lên
   - #総-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#総-bg1  { animation-delay: 0.05s; }
#総-s1   { stroke-dasharray: 36.5704; stroke-dashoffset: 36.5704; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#総-bg2  { animation-delay: 0.42s; }
#総-s2   { stroke-dasharray: 61.1156; stroke-dashoffset: 61.1156; animation: drawStroke 0.34s ease-out 0.55s forwards; }
#総-bg3  { animation-delay: 0.91s; }
#総-s3   { stroke-dasharray: 13.1165; stroke-dashoffset: 13.1165; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#総-bg4  { animation-delay: 1.28s; }
#総-s4   { stroke-dasharray: 36.3124; stroke-dashoffset: 36.3124; animation: drawStroke 0.22s ease-out 1.41s forwards; }
#総-bg5  { animation-delay: 1.65s; }
#総-s5   { stroke-dasharray: 18.3475; stroke-dashoffset: 18.3475; animation: drawStroke 0.22s ease-out 1.78s forwards; }
#総-bg6  { animation-delay: 2.02s; }
#総-s6   { stroke-dasharray: 14.9384; stroke-dashoffset: 14.9384; animation: drawStroke 0.22s ease-out 2.15s forwards; }
#総-bg7  { animation-delay: 2.39s; }
#総-s7   { stroke-dasharray: 22.3744; stroke-dashoffset: 22.3744; animation: drawStroke 0.22s ease-out 2.52s forwards; }
#総-bg8  { animation-delay: 2.76s; }
#総-s8   { stroke-dasharray: 32.7550; stroke-dashoffset: 32.7550; animation: drawStroke 0.22s ease-out 2.89s forwards; }
#総-bg9  { animation-delay: 3.13s; }
#総-s9   { stroke-dasharray: 54.2874; stroke-dashoffset: 54.2874; animation: drawStroke 0.30s ease-out 3.26s forwards; }
#総-bg10  { animation-delay: 3.58s; }
#総-s10   { stroke-dasharray: 15.4239; stroke-dashoffset: 15.4239; animation: drawStroke 0.22s ease-out 3.71s forwards; }
#総-bg11  { animation-delay: 3.95s; }
#総-s11   { stroke-dasharray: 14.4797; stroke-dashoffset: 14.4797; animation: drawStroke 0.22s ease-out 4.08s forwards; }
#総-bg12  { animation-delay: 4.32s; }
#総-s12   { stroke-dasharray: 52.5189; stroke-dashoffset: 52.5189; animation: drawStroke 0.29s ease-out 4.45s forwards; }
#総-bg13  { animation-delay: 4.76s; }
#総-s13   { stroke-dasharray: 9.2417; stroke-dashoffset: 9.2417; animation: drawStroke 0.22s ease-out 4.89s forwards; }
#総-bg14  { animation-delay: 5.13s; }
#総-s14   { stroke-dasharray: 12.6440; stroke-dashoffset: 12.6440; animation: drawStroke 0.22s ease-out 5.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

