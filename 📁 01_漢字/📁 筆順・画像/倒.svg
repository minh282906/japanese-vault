<g id="倒-bg7"  class="badge-group"><circle cx="52.73" cy="46.42" r="3.5" fill="#0952bf"/><text class="num-single" x="52.73" y="46.42" dx="0" dy="-0.5">7</text></g>
<g id="倒-bg8"  class="badge-group"><circle cx="37.27" cy="85.62" r="3.5" fill="#2d09bf"/><text class="num-single" x="37.27" y="85.62" dx="0" dy="-0.5">8</text></g>
<g id="倒-bg9"  class="badge-group"><circle cx="77.27" cy="29.83" r="3.5" fill="#9a09bf"/><text class="num-single" x="77.27" y="29.83" dx="0" dy="-0.5">9</text></g>
<g id="倒-bg10" class="badge-group"><circle cx="92.27" cy="16.58" r="3.5" fill="#bf0976"/><text class="num-double" x="92.27" y="16.58" dx="-0.4" dy="-0.475">10</text></g>
</svg>