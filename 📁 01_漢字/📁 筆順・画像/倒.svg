<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (倒)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #倒-bg[i]: Thời gian quả bóng số nảy lên
   - #倒-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#倒-bg1  { animation-delay: 0.05s; }
#倒-s1   { stroke-dasharray: 48.3273; stroke-dashoffset: 48.3273; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#倒-bg2  { animation-delay: 0.47s; }
#倒-s2   { stroke-dasharray: 52.5274; stroke-dashoffset: 52.5274; animation: drawStroke 0.29s ease-out 0.60s forwards; }
#倒-bg3  { animation-delay: 0.91s; }
#倒-s3   { stroke-dasharray: 31.9361; stroke-dashoffset: 31.9361; animation: drawStroke 0.22s ease-out 1.04s forwards; }
#倒-bg4  { animation-delay: 1.28s; }
#倒-s4   { stroke-dasharray: 48.9353; stroke-dashoffset: 48.9353; animation: drawStroke 0.27s ease-out 1.41s forwards; }
#倒-bg5  { animation-delay: 1.70s; }
#倒-s5   { stroke-dasharray: 15.2794; stroke-dashoffset: 15.2794; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#倒-bg6  { animation-delay: 2.07s; }
#倒-s6   { stroke-dasharray: 30.0888; stroke-dashoffset: 30.0888; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#倒-bg7  { animation-delay: 2.44s; }
#倒-s7   { stroke-dasharray: 32.2654; stroke-dashoffset: 32.2654; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#倒-bg8  { animation-delay: 2.81s; }
#倒-s8   { stroke-dasharray: 34.1165; stroke-dashoffset: 34.1165; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#倒-bg9  { animation-delay: 3.18s; }
#倒-s9   { stroke-dasharray: 41.1533; stroke-dashoffset: 41.1533; animation: drawStroke 0.23s ease-out 3.31s forwards; }
#倒-bg10  { animation-delay: 3.56s; }
#倒-s10   { stroke-dasharray: 86.6041; stroke-dashoffset: 86.6041; animation: drawStroke 0.48s ease-out 3.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #倒-s[i]) -->
<path id="倒-s1"  class="stroke" stroke="#bf0909" d="M29.75,17.14C29.87,18.32,29.85,19.35,29.39,20.76C26,31.25,19.25,47.5,9.81,60.72"/>
<path id="倒-s2"  class="stroke" stroke="#bf7609" d="M22.78,41C23.830000000000002,42.05,24.290000000000003,43.47,24.290000000000003,44.73C24.290000000000003,55.089999999999996,24.26,73.9,24.250000000000004,85.75C24.250000000000004,88.79,24.250000000000004,91.34,24.250000000000004,93.13"/>
<path id="倒-s3"  class="stroke" stroke="#9abf09" d="M38.2,23.58C40.13,24,42.040000000000006,23.689999999999998,43.39,23.5C49.67,22.65,57.480000000000004,21.38,64.63,20.759999999999998C66.33999999999999,20.61,68.22,20.259999999999998,69.88,20.849999999999998"/>
<path id="倒-s4"  class="stroke" stroke="#2dbf09" d="M52.19,25.22C52.5,26.13,52.419999999999995,27.099999999999998,52.129999999999995,27.599999999999998C48.74999999999999,33.5,45.879999999999995,37.25,41.13999999999999,43.879999999999995C39.82999999999999,45.709999999999994,40.50999999999999,46.309999999999995,42.49999999999999,45.74999999999999C47.16,44.449999999999996,57.11999999999999,41.709999999999994,64.46,39.56999999999999"/>
<path id="倒-s5"  class="stroke" stroke="#09bf52" d="M59.94,31.94C63.01,34.11,67.88,40.88,68.65,44.260000000000005"/>
<path id="倒-s6"  class="stroke" stroke="#09bfbf" d="M38.51,62.62C39.629999999999995,63.29,42.41,63.23,43.629999999999995,63.029999999999994C49.279999999999994,62.12,58.14999999999999,60.17999999999999,63.50999999999999,59.669999999999995C65.05999999999999,59.519999999999996,66.88,59.62,68.21,59.87"/>
<path id="倒-s7"  class="stroke" stroke="#0952bf" d="M52.73,46.42C53.72,47.410000000000004,53.98,48.75,53.98,50C53.98,55.64,53.98,75.6,53.98,78.37"/>
<path id="倒-s8"  class="stroke" stroke="#2d09bf" d="M37.27,85.62C38.1,86.51,39,86.75,40.290000000000006,86.16000000000001C52.080000000000005,80.78000000000002,56.50000000000001,78.38000000000001,68.35000000000001,73.51"/>
<path id="倒-s9"  class="stroke" stroke="#9a09bf" d="M77.27,29.83C78.25,30.75,79.03,31.819999999999997,79.03,34.849999999999994C79.03,45.309999999999995,79.02,56.22,79.01,63.49999999999999C79.01,66.58999999999999,79.01,69.02,79.01,70.5"/>
<path id="倒-s10"  class="stroke" stroke="#bf0976" d="M92.27,16.58C93.35,17.659999999999997,94.03,19,94.03,21.599999999999998C94.03,30.75,94.02,83.00999999999999,94.02,87.97C94.02,101.11,88.31,90.97,86.81,89.72"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="倒-bg1"  class="badge-group"><circle cx="29.75" cy="17.14" r="3.5" fill="#bf0909"/><text class="num-single" x="29.75" y="17.14" dx="0" dy="-0.5">1</text></g>
<g id="倒-bg2"  class="badge-group"><circle cx="22.78" cy="41" r="3.5" fill="#bf7609"/><text class="num-single" x="22.78" y="41" dx="0" dy="-0.5">2</text></g>
<g id="倒-bg3"  class="badge-group"><circle cx="38.2" cy="23.58" r="3.5" fill="#9abf09"/><text class="num-single" x="38.2" y="23.58" dx="0" dy="-0.5">3</text></g>
<g id="倒-bg4"  class="badge-group"><circle cx="52.19" cy="25.22" r="3.5" fill="#2dbf09"/><text class="num-single" x="52.19" y="25.22" dx="0" dy="-0.5">4</text></g>
