<g id="雪-bg10" class="badge-group"><circle cx="29.89" cy="76.19" r="3.5" fill="#ae09bf"/><text class="num-double" x="29.89" y="76.19" dx="-0.4" dy="-0.475">10</text></g>
<g id="雪-bg11" class="badge-group"><circle cx="27.88" cy="93.44" r="3.5" fill="#bf096c"/><text class="num-double" x="27.88" y="93.44" dx="-0.4" dy="-0.475">11</text></g>
</svg>