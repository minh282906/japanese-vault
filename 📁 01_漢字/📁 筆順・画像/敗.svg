<path id="敗-s6"  class="stroke" stroke="#09bf8d" d="M26.48,77C26.8,78.12,26.2,79.25,25.55,80.06C23.61,82.53,17.62,88,12.5,91.5"/>
<path id="敗-s7"  class="stroke" stroke="#098dbf" d="M36.57,74.57C40.12,78.16,43.75,83.5,45.269999999999996,87.8"/>
<path id="敗-s8"  class="stroke" stroke="#092abf" d="M64.47,17.89C64.62,19,64.5,20.19,64.13,21.26C61.779999999999994,28.11,56.49999999999999,41.63,48.37,51.11"/>
<path id="敗-s9"  class="stroke" stroke="#4b09bf" d="M59.98,39.46C61.05,39.800000000000004,62.44,39.59,63.529999999999994,39.49C69.75,38.88,78,37,84.39,34.74C86.17,34.11,88.12,34,89.74,34.410000000000004"/>
<path id="敗-s10"  class="stroke" stroke="#ae09bf" d="M77.64,40.51C78.13,41.71,78.3,43.29,77.89,45.51C75,60.88,65.62,79.75,49.38,90.5"/>
<path id="敗-s11"  class="stroke" stroke="#bf096c" d="M55.16,50.94C58.62,51.37,74.64999999999999,74.47,85.22999999999999,84.97C87.91999999999999,87.64,89.99,89.31,93.13,91"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="敗-bg1"  class="badge-group"><circle cx="18.94" cy="19.04" r="3.5" fill="#bf0909"/><text class="num-single" x="18.94" y="19.04" dx="0" dy="-0.5">1</text></g>
<g id="敗-bg2"  class="badge-group"><circle cx="21.17" cy="28.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="21.17" y="28.5" dx="0" dy="-0.5">2</text></g>
