<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (験)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #験-bg[i]: Thời gian quả bóng số nảy lên
   - #験-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#験-bg1  { animation-delay: 0.05s; }
#験-s1   { stroke-dasharray: 44.0076; stroke-dashoffset: 44.0076; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#験-bg2  { animation-delay: 0.44s; }
#験-s2   { stroke-dasharray: 26.2522; stroke-dashoffset: 26.2522; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#験-bg3  { animation-delay: 0.81s; }
#験-s3   { stroke-dasharray: 37.7958; stroke-dashoffset: 37.7958; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#験-bg4  { animation-delay: 1.18s; }
#験-s4   { stroke-dasharray: 22.7353; stroke-dashoffset: 22.7353; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#験-bg5  { animation-delay: 1.55s; }
#験-s5   { stroke-dasharray: 21.6672; stroke-dashoffset: 21.6672; animation: drawStroke 0.22s ease-out 1.68s forwards; }
#験-bg6  { animation-delay: 1.92s; }
#験-s6   { stroke-dasharray: 71.2610; stroke-dashoffset: 71.2610; animation: drawStroke 0.39s ease-out 2.05s forwards; }
#験-bg7  { animation-delay: 2.46s; }
#験-s7   { stroke-dasharray: 13.1684; stroke-dashoffset: 13.1684; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#験-bg8  { animation-delay: 2.83s; }
#験-s8   { stroke-dasharray: 10.6999; stroke-dashoffset: 10.6999; animation: drawStroke 0.22s ease-out 2.96s forwards; }
#験-bg9  { animation-delay: 3.20s; }
#験-s9   { stroke-dasharray: 8.7340; stroke-dashoffset: 8.7340; animation: drawStroke 0.22s ease-out 3.33s forwards; }
#験-bg10  { animation-delay: 3.57s; }
#験-s10   { stroke-dasharray: 8.6955; stroke-dashoffset: 8.6955; animation: drawStroke 0.22s ease-out 3.70s forwards; }
#験-bg11  { animation-delay: 3.94s; }
#験-s11   { stroke-dasharray: 37.3793; stroke-dashoffset: 37.3793; animation: drawStroke 0.22s ease-out 4.07s forwards; }
#験-bg12  { animation-delay: 4.31s; }
#験-s12   { stroke-dasharray: 36.9946; stroke-dashoffset: 36.9946; animation: drawStroke 0.22s ease-out 4.44s forwards; }
#験-bg13  { animation-delay: 4.68s; }
#験-s13   { stroke-dasharray: 23.7508; stroke-dashoffset: 23.7508; animation: drawStroke 0.22s ease-out 4.81s forwards; }
#験-bg14  { animation-delay: 5.05s; }
#験-s14   { stroke-dasharray: 20.8311; stroke-dashoffset: 20.8311; animation: drawStroke 0.22s ease-out 5.18s forwards; }
#験-bg15  { animation-delay: 5.42s; }
#験-s15   { stroke-dasharray: 50.1248; stroke-dashoffset: 50.1248; animation: drawStroke 0.28s ease-out 5.55s forwards; }
#験-bg16  { animation-delay: 5.85s; }
#験-s16   { stroke-dasharray: 31.0776; stroke-dashoffset: 31.0776; animation: drawStroke 0.22s ease-out 5.98s forwards; }
#験-bg17  { animation-delay: 6.22s; }
#験-s17   { stroke-dasharray: 63.7574; stroke-dashoffset: 63.7574; animation: drawStroke 0.35s ease-out 6.35s forwards; }
#験-bg18  { animation-delay: 6.72s; }
#験-s18   { stroke-dasharray: 37.3479; stroke-dashoffset: 37.3479; animation: drawStroke 0.22s ease-out 6.85s forwards; }
]]>
</style>

