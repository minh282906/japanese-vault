<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (帰)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #帰-bg[i]: Thời gian quả bóng số nảy lên
   - #帰-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#帰-bg1  { animation-delay: 0.05s; }
#帰-s1   { stroke-dasharray: 27.7370; stroke-dashoffset: 27.7370; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#帰-bg2  { animation-delay: 0.42s; }
#帰-s2   { stroke-dasharray: 69.3572; stroke-dashoffset: 69.3572; animation: drawStroke 0.38s ease-out 0.55s forwards; }
#帰-bg3  { animation-delay: 0.95s; }
#帰-s3   { stroke-dasharray: 59.3911; stroke-dashoffset: 59.3911; animation: drawStroke 0.33s ease-out 1.08s forwards; }
#帰-bg4  { animation-delay: 1.43s; }
#帰-s4   { stroke-dasharray: 34.0980; stroke-dashoffset: 34.0980; animation: drawStroke 0.22s ease-out 1.56s forwards; }
#帰-bg5  { animation-delay: 1.80s; }
#帰-s5   { stroke-dasharray: 33.2916; stroke-dashoffset: 33.2916; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#帰-bg6  { animation-delay: 2.17s; }
#帰-s6   { stroke-dasharray: 12.4419; stroke-dashoffset: 12.4419; animation: drawStroke 0.22s ease-out 2.30s forwards; }
#帰-bg7  { animation-delay: 2.54s; }
#帰-s7   { stroke-dasharray: 60.4154; stroke-dashoffset: 60.4154; animation: drawStroke 0.33s ease-out 2.67s forwards; }
#帰-bg8  { animation-delay: 3.02s; }
#帰-s8   { stroke-dasharray: 20.3378; stroke-dashoffset: 20.3378; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#帰-bg9  { animation-delay: 3.39s; }
#帰-s9   { stroke-dasharray: 61.1353; stroke-dashoffset: 61.1353; animation: drawStroke 0.34s ease-out 3.52s forwards; }
#帰-bg10  { animation-delay: 3.88s; }
#帰-s10   { stroke-dasharray: 46.6517; stroke-dashoffset: 46.6517; animation: drawStroke 0.26s ease-out 4.01s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #帰-s[i]) -->
<path id="帰-s1"  class="stroke" stroke="#bf0909" d="M16.46,35.12C17.17,35.83,17.720000000000002,36.769999999999996,17.720000000000002,38.11C17.720000000000002,43.72,17.640000000000004,51.87,17.6,57.879999999999995C17.59,59.65,17.580000000000002,61.23,17.580000000000002,62.51"/>
<path id="帰-s2"  class="stroke" stroke="#bf7609" d="M26.46,17.62C27.3,18.46,27.69,19.720000000000002,27.720000000000002,21.36C28.380000000000003,64.88,27.51,72.63,17.51,84.25"/>
<path id="帰-s3"  class="stroke" stroke="#9abf09" d="M45.75,15.5C46.76,15.74,48.26,16.13,49.93,15.93C57.5,15,71.38,13.38,78,12.25C79.52,11.99,81.42,13,81.05,14.69C80.02,19.42,78.75999999999999,27.88,77.99,33.03C77.77,34.52,77.58,35.77,77.44999999999999,36.65"/>
<path id="帰-s4"  class="stroke" stroke="#2dbf09" d="M44.89,26.32C46.36,26.7,47.9,26.84,49.38,26.7C59.97,25.7,70.53,24.74,78.85,24.3"/>
<path id="帰-s5"  class="stroke" stroke="#09bf52" d="M43.68,37.85C45.33,38.35,47.09,38.34,48.76,38.120000000000005C57.5,36.99,68.6,35.46000000000001,76.74,34.93000000000001"/>
<path id="帰-s6"  class="stroke" stroke="#09bfbf" d="M40.88,48.75C40.79,52.38,38.56,58.58,37.760000000000005,60.75"/>
<path id="帰-s7"  class="stroke" stroke="#0952bf" d="M41.49,51.15C53,49.25,76.91,45.769999999999996,87.12,45.22C96,44.75,89.25,51,85.65,53.7"/>
<path id="帰-s8"  class="stroke" stroke="#2d09bf" d="M45.88,60.25C46.75,61.25,47.190000000000005,62.7,47.28,63.22C47.35,63.62,47.28,71.49,47.2,77.02C47.18,78.66,47.160000000000004,79.5,47.14,80.24"/>
<path id="帰-s9"  class="stroke" stroke="#9a09bf" d="M48.28,61.54C55.75,60.68,76.02,57.99,77.64,57.9C79.95,57.769999999999996,81.37,58.379999999999995,81.37,60.62C81.37,67.38,81,72.75,80.56,78.09C80.05,84.37,76.36,78.13000000000001,75.48,77.22"/>
<path id="帰-s10"  class="stroke" stroke="#bf0976" d="M61.84,50.88C62.75,52,62.99,53,62.99,54.35C62.99,54.79,62.980000000000004,81.89,62.910000000000004,93.00999999999999C62.900000000000006,95.19999999999999,62.88,96.72999999999999,62.870000000000005,97.25999999999999"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="帰-bg1"  class="badge-group"><circle cx="16.46" cy="35.12" r="3.5" fill="#bf0909"/><text class="num-single" x="16.46" y="35.12" dx="0" dy="-0.5">1</text></g>
<g id="帰-bg2"  class="badge-group"><circle cx="26.46" cy="17.62" r="3.5" fill="#bf7609"/><text class="num-single" x="26.46" y="17.62" dx="0" dy="-0.5">2</text></g>
