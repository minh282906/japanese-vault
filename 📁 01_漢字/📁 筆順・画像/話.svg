<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (話)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #話-bg[i]: Thời gian quả bóng số nảy lên
   - #話-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#話-bg1  { animation-delay: 0.05s; }
#話-s1   { stroke-dasharray: 10.9680; stroke-dashoffset: 10.9680; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#話-bg2  { animation-delay: 0.42s; }
#話-s2   { stroke-dasharray: 32.1885; stroke-dashoffset: 32.1885; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#話-bg3  { animation-delay: 0.79s; }
#話-s3   { stroke-dasharray: 21.8722; stroke-dashoffset: 21.8722; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#話-bg4  { animation-delay: 1.16s; }
#話-s4   { stroke-dasharray: 21.3743; stroke-dashoffset: 21.3743; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#話-bg5  { animation-delay: 1.53s; }
#話-s5   { stroke-dasharray: 20.5141; stroke-dashoffset: 20.5141; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#話-bg6  { animation-delay: 1.90s; }
#話-s6   { stroke-dasharray: 38.7703; stroke-dashoffset: 38.7703; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#話-bg7  { animation-delay: 2.27s; }
#話-s7   { stroke-dasharray: 17.0990; stroke-dashoffset: 17.0990; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#話-bg8  { animation-delay: 2.64s; }
#話-s8   { stroke-dasharray: 36.6106; stroke-dashoffset: 36.6106; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#話-bg9  { animation-delay: 3.01s; }
#話-s9   { stroke-dasharray: 52.6141; stroke-dashoffset: 52.6141; animation: drawStroke 0.29s ease-out 3.14s forwards; }
#話-bg10  { animation-delay: 3.45s; }
#話-s10   { stroke-dasharray: 40.5287; stroke-dashoffset: 40.5287; animation: drawStroke 0.22s ease-out 3.58s forwards; }
#話-bg11  { animation-delay: 3.82s; }
#話-s11   { stroke-dasharray: 26.8508; stroke-dashoffset: 26.8508; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#話-bg12  { animation-delay: 4.19s; }
#話-s12   { stroke-dasharray: 57.8888; stroke-dashoffset: 57.8888; animation: drawStroke 0.32s ease-out 4.32s forwards; }
#話-bg13  { animation-delay: 4.66s; }
#話-s13   { stroke-dasharray: 31.3526; stroke-dashoffset: 31.3526; animation: drawStroke 0.22s ease-out 4.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

