<path id="話-s8"  class="stroke" stroke="#0995bf" d="M81.75,13.75C81.63,15,80.96,16.14,80.09,16.81C75.25,20.5,64.75,26.75,50.75,31.75"/>
<path id="話-s9"  class="stroke" stroke="#0941bf" d="M45.39,45.8C46.94,46.14,49.75,46.419999999999995,52.120000000000005,46.14C62.8,44.9,76.37,43.07,91,42.23C93.28,42.099999999999994,95.49,42.22,97.75,42.519999999999996"/>
<path id="話-s10"  class="stroke" stroke="#2509bf" d="M68.87,27.19C70.27000000000001,28.59,70.72,30.25,70.72,32.07C70.72,33.51,70.51,60.25,70.51,67.22999999999999"/>
<path id="話-s11"  class="stroke" stroke="#7909bf" d="M52.07,67.83C53,69,53.29,69.59,53.42,70.17C54.800000000000004,76.37,55.550000000000004,82.5,56.5,90.5C56.63,91.64,56.77,92.81,56.92,94.03"/>
<path id="話-s12"  class="stroke" stroke="#bf09b1" d="M54.62,69.29C67.52,67.92,80.03,66.56,87.3,65.98C90.24,65.74000000000001,91.09,68.38000000000001,90.67,69.78C89.2,74.65,87.64,81.42,85.63,88.13"/>
