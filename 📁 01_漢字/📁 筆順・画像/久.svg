<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (久)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #久-bg[i]: Thời gian quả bóng số nảy lên
   - #久-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#久-bg1  { animation-delay: 0.05s; }
#久-s1   { stroke-dasharray: 46.7137; stroke-dashoffset: 46.7137; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#久-bg2  { animation-delay: 0.46s; }
#久-s2   { stroke-dasharray: 106.3810; stroke-dashoffset: 106.3810; animation: drawStroke 0.55s ease-out 0.59s forwards; }
#久-bg3  { animation-delay: 1.16s; }
#久-s3   { stroke-dasharray: 51.5014; stroke-dashoffset: 51.5014; animation: drawStroke 0.28s ease-out 1.29s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #久-s[i]) -->
<path id="久-s1"  class="stroke" stroke="#bf0909" d="M43.75,16C43.82,16.91,43.89,18.36,43.62,19.67C42,27.400000000000002,33.22,44.870000000000005,20.509999999999998,55.25"/>
<path id="久-s2"  class="stroke" stroke="#09bf09" d="M43.25,30.38C45,30.75,46.5,30.72,48.5,30.48C52.5,30,59.74,28.34,61.94,27.740000000000002C66,26.630000000000003,67.38,28.630000000000003,66.25,31.75C60.019999999999996,49.05,40.629999999999995,77.75,14.75,89.75"/>
<path id="久-s3"  class="stroke" stroke="#0909bf" d="M53.75,56.25C61.75,62.87,75.47,77.26,83.53999999999999,84.84C86.19,87.33,89.11999999999999,89.62,91.86999999999999,90.62"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="久-bg1"  class="badge-group"><circle cx="43.75" cy="16" r="3.5" fill="#bf0909"/><text class="num-single" x="43.75" y="16" dx="0" dy="-0.5">1</text></g>
<g id="久-bg2"  class="badge-group"><circle cx="43.25" cy="30.38" r="3.5" fill="#09bf09"/><text class="num-single" x="43.25" y="30.38" dx="0" dy="-0.5">2</text></g>
<g id="久-bg3"  class="badge-group"><circle cx="53.75" cy="56.25" r="3.5" fill="#0909bf"/><text class="num-single" x="53.75" y="56.25" dx="0" dy="-0.5">3</text></g>
</svg>