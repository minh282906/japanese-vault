<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (曜)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #曜-bg[i]: Thời gian quả bóng số nảy lên
   - #曜-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#曜-bg1  { animation-delay: 0.05s; }
#曜-s1   { stroke-dasharray: 47.9358; stroke-dashoffset: 47.9358; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#曜-bg2  { animation-delay: 0.46s; }
#曜-s2   { stroke-dasharray: 64.3114; stroke-dashoffset: 64.3114; animation: drawStroke 0.35s ease-out 0.59s forwards; }
#曜-bg3  { animation-delay: 0.96s; }
#曜-s3   { stroke-dasharray: 16.1088; stroke-dashoffset: 16.1088; animation: drawStroke 0.22s ease-out 1.09s forwards; }
#曜-bg4  { animation-delay: 1.33s; }
#曜-s4   { stroke-dasharray: 16.2281; stroke-dashoffset: 16.2281; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#曜-bg5  { animation-delay: 1.70s; }
#曜-s5   { stroke-dasharray: 44.5644; stroke-dashoffset: 44.5644; animation: drawStroke 0.25s ease-out 1.83s forwards; }
#曜-bg6  { animation-delay: 2.10s; }
#曜-s6   { stroke-dasharray: 16.2417; stroke-dashoffset: 16.2417; animation: drawStroke 0.22s ease-out 2.23s forwards; }
#曜-bg7  { animation-delay: 2.47s; }
#曜-s7   { stroke-dasharray: 15.2641; stroke-dashoffset: 15.2641; animation: drawStroke 0.22s ease-out 2.60s forwards; }
#曜-bg8  { animation-delay: 2.84s; }
#曜-s8   { stroke-dasharray: 47.1057; stroke-dashoffset: 47.1057; animation: drawStroke 0.26s ease-out 2.97s forwards; }
#曜-bg9  { animation-delay: 3.25s; }
#曜-s9   { stroke-dasharray: 17.7424; stroke-dashoffset: 17.7424; animation: drawStroke 0.22s ease-out 3.38s forwards; }
#曜-bg10  { animation-delay: 3.62s; }
#曜-s10   { stroke-dasharray: 17.9729; stroke-dashoffset: 17.9729; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#曜-bg11  { animation-delay: 3.99s; }
#曜-s11   { stroke-dasharray: 29.6034; stroke-dashoffset: 29.6034; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#曜-bg12  { animation-delay: 4.36s; }
#曜-s12   { stroke-dasharray: 39.8208; stroke-dashoffset: 39.8208; animation: drawStroke 0.22s ease-out 4.49s forwards; }
#曜-bg13  { animation-delay: 4.73s; }
#曜-s13   { stroke-dasharray: 11.7356; stroke-dashoffset: 11.7356; animation: drawStroke 0.22s ease-out 4.86s forwards; }
#曜-bg14  { animation-delay: 5.10s; }
#曜-s14   { stroke-dasharray: 39.0597; stroke-dashoffset: 39.0597; animation: drawStroke 0.22s ease-out 5.23s forwards; }
#曜-bg15  { animation-delay: 5.47s; }
#曜-s15   { stroke-dasharray: 34.7092; stroke-dashoffset: 34.7092; animation: drawStroke 0.22s ease-out 5.60s forwards; }
#曜-bg16  { animation-delay: 5.84s; }
#曜-s16   { stroke-dasharray: 34.5509; stroke-dashoffset: 34.5509; animation: drawStroke 0.22s ease-out 5.97s forwards; }
#曜-bg17  { animation-delay: 6.21s; }
#曜-s17   { stroke-dasharray: 35.8147; stroke-dashoffset: 35.8147; animation: drawStroke 0.22s ease-out 6.34s forwards; }
#曜-bg18  { animation-delay: 6.58s; }
#曜-s18   { stroke-dasharray: 42.4524; stroke-dashoffset: 42.4524; animation: drawStroke 0.23s ease-out 6.71s forwards; }
]]>
</style>

