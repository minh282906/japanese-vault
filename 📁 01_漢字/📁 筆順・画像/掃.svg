<path id="掃-s7"  class="stroke" stroke="#098dbf" d="M46.03,46.17C45.95,50.910000000000004,44.07,59,43.4,61.83"/>
<path id="掃-s8"  class="stroke" stroke="#092abf" d="M46.77,48.84C59.5,47.25,78.78,45.370000000000005,90.87,44.720000000000006C99.75,44.25000000000001,93,50.25000000000001,89.4,52.940000000000005"/>
<path id="掃-s9"  class="stroke" stroke="#4b09bf" d="M51.88,61.58C52.650000000000006,62.35,53.07,63.5,53.07,64.87C53.07,72.05000000000001,53.08,76.79,53.11,81.73C53.12,83.60000000000001,53,85,53,86.76"/>
<path id="掃-s10"  class="stroke" stroke="#ae09bf" d="M53.95,63.01C58.25,62.5,81.76,59.8,83.78,59.69C86.16,59.55,87.62,60.87,87.62,63.51C87.62,69.66,87.37,76.12,86.78,82.45C86.18,88.9,81.97,82.49000000000001,81.07000000000001,81.56"/>
<path id="掃-s11"  class="stroke" stroke="#bf096c" d="M68.25,49.47C69.39,50.61,69.5,51.879999999999995,69.5,53.15C69.5,57.87,69.62,79.02,69.55,92.22C69.53,96.05,69.50999999999999,98.83,69.5,99.63"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="掃-bg1"  class="badge-group"><circle cx="14.75" cy="39.17" r="3.5" fill="#bf0909"/><text class="num-single" x="14.75" y="39.17" dx="0" dy="-0.5">1</text></g>
