<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (掃)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #掃-bg[i]: Thời gian quả bóng số nảy lên
   - #掃-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#掃-bg1  { animation-delay: 0.05s; }
#掃-s1   { stroke-dasharray: 27.3566; stroke-dashoffset: 27.3566; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#掃-bg2  { animation-delay: 0.42s; }
#掃-s2   { stroke-dasharray: 87.5337; stroke-dashoffset: 87.5337; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#掃-bg3  { animation-delay: 1.05s; }
#掃-s3   { stroke-dasharray: 30.9354; stroke-dashoffset: 30.9354; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#掃-bg4  { animation-delay: 1.42s; }
#掃-s4   { stroke-dasharray: 58.1443; stroke-dashoffset: 58.1443; animation: drawStroke 0.32s ease-out 1.55s forwards; }
#掃-bg5  { animation-delay: 1.89s; }
#掃-s5   { stroke-dasharray: 30.9033; stroke-dashoffset: 30.9033; animation: drawStroke 0.22s ease-out 2.02s forwards; }
#掃-bg6  { animation-delay: 2.26s; }
#掃-s6   { stroke-dasharray: 30.9726; stroke-dashoffset: 30.9726; animation: drawStroke 0.22s ease-out 2.39s forwards; }
#掃-bg7  { animation-delay: 2.63s; }
#掃-s7   { stroke-dasharray: 15.9035; stroke-dashoffset: 15.9035; animation: drawStroke 0.22s ease-out 2.76s forwards; }
#掃-bg8  { animation-delay: 3.00s; }
#掃-s8   { stroke-dasharray: 58.4950; stroke-dashoffset: 58.4950; animation: drawStroke 0.32s ease-out 3.13s forwards; }
#掃-bg9  { animation-delay: 3.47s; }
#掃-s9   { stroke-dasharray: 25.4822; stroke-dashoffset: 25.4822; animation: drawStroke 0.22s ease-out 3.60s forwards; }
#掃-bg10  { animation-delay: 3.84s; }
#掃-s10   { stroke-dasharray: 64.4694; stroke-dashoffset: 64.4694; animation: drawStroke 0.35s ease-out 3.97s forwards; }
#掃-bg11  { animation-delay: 4.34s; }
#掃-s11   { stroke-dasharray: 50.4872; stroke-dashoffset: 50.4872; animation: drawStroke 0.28s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #掃-s[i]) -->
<path id="掃-s1"  class="stroke" stroke="#bf0909" d="M14.75,39.17C16.82,39.42,18.740000000000002,39.6,20.86,39.31C25.619999999999997,38.660000000000004,32.03,37.78,38.739999999999995,36.910000000000004C39.78999999999999,36.77,40.99999999999999,36.75000000000001,41.919999999999995,36.75000000000001"/>
