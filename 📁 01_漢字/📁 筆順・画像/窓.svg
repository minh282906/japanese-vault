<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (窓)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #窓-bg[i]: Thời gian quả bóng số nảy lên
   - #窓-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#窓-bg1  { animation-delay: 0.05s; }
#窓-s1   { stroke-dasharray: 11.4031; stroke-dashoffset: 11.4031; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#窓-bg2  { animation-delay: 0.42s; }
#窓-s2   { stroke-dasharray: 18.3496; stroke-dashoffset: 18.3496; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#窓-bg3  { animation-delay: 0.79s; }
#窓-s3   { stroke-dasharray: 71.6374; stroke-dashoffset: 71.6374; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#窓-bg4  { animation-delay: 1.33s; }
#窓-s4   { stroke-dasharray: 22.3636; stroke-dashoffset: 22.3636; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#窓-bg5  { animation-delay: 1.70s; }
#窓-s5   { stroke-dasharray: 33.1276; stroke-dashoffset: 33.1276; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#窓-bg6  { animation-delay: 2.07s; }
#窓-s6   { stroke-dasharray: 60.2431; stroke-dashoffset: 60.2431; animation: drawStroke 0.33s ease-out 2.20s forwards; }
#窓-bg7  { animation-delay: 2.55s; }
#窓-s7   { stroke-dasharray: 16.1842; stroke-dashoffset: 16.1842; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#窓-bg8  { animation-delay: 2.92s; }
#窓-s8   { stroke-dasharray: 18.8390; stroke-dashoffset: 18.8390; animation: drawStroke 0.22s ease-out 3.05s forwards; }
#窓-bg9  { animation-delay: 3.29s; }
#窓-s9   { stroke-dasharray: 68.2369; stroke-dashoffset: 68.2369; animation: drawStroke 0.38s ease-out 3.42s forwards; }
#窓-bg10  { animation-delay: 3.82s; }
#窓-s10   { stroke-dasharray: 10.4847; stroke-dashoffset: 10.4847; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#窓-bg11  { animation-delay: 4.19s; }
#窓-s11   { stroke-dasharray: 13.4842; stroke-dashoffset: 13.4842; animation: drawStroke 0.22s ease-out 4.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #窓-s[i]) -->
<path id="窓-s1"  class="stroke" stroke="#bf0909" d="M52.76,10.25C53.75,11.24,54.339999999999996,12.5,54.339999999999996,13.95C54.339999999999996,17,54.24999999999999,18.439999999999998,54.24999999999999,21.22"/>
<path id="窓-s2"  class="stroke" stroke="#bf6c09" d="M24.44,22.38C24.44,26.479999999999997,22.580000000000002,37.76,21.73,40.5"/>
<path id="窓-s3"  class="stroke" stroke="#aebf09" d="M25.07,26.24C42.75,23.119999999999997,65.25,20.25,81.09,19.61C91.88,19.169999999999998,83.38000000000001,26.27,80.69,28.16"/>
<path id="窓-s4"  class="stroke" stroke="#4bbf09" d="M40.02,31.5C40.120000000000005,32.6,39.940000000000005,33.29,39.480000000000004,34.3C37.550000000000004,38.56999999999999,33.53,43.94,26.910000000000004,48.919999999999995"/>
<path id="窓-s5"  class="stroke" stroke="#09bf2a" d="M61.99,26.62C62.620000000000005,27.25,63.07,28.37,63.07,29.57C63.07,32.71,63,33.88,63,36.39C63,40,64.13,40.81,73.38,40.81C78.94,40.81,82.61,40.17,83.39,39.800000000000004"/>
<path id="窓-s6"  class="stroke" stroke="#09bf8d" d="M51.75,42.25C52.13,43.5,51.69,44.42,50.98,45.33C46,51.75,43.12,54.879999999999995,36.55,61.33C34.779999999999994,63.07,34.65,64.32,37.47,63.57C48.12,60.75,57.5,58.13,66.99,55.92"/>
<path id="窓-s7"  class="stroke" stroke="#098dbf" d="M62.08,50.55C65.62,52.739999999999995,71.23,59.559999999999995,72.11,62.97"/>
<path id="窓-s8"  class="stroke" stroke="#092abf" d="M24.75,78.12C25.1,80.61,21.29,91.60000000000001,18.52,95.74000000000001"/>
<path id="窓-s9"  class="stroke" stroke="#4b09bf" d="M32.5,76.21C42.38,93.38,55.75,99.38,77.46000000000001,98.5C86.51,98.75,86.26,94.25,80.79,90.77"/>
<path id="窓-s10"  class="stroke" stroke="#ae09bf" d="M50.03,70.12C51.63,74.38000000000001,55.18,78.99000000000001,56.160000000000004,74.9"/>
<path id="窓-s11"  class="stroke" stroke="#bf096c" d="M76.1,71.34C80.16,72.86,84.25,75.25,87,78.96000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="窓-bg1"  class="badge-group"><circle cx="52.76" cy="10.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.76" y="10.25" dx="0" dy="-0.5">1</text></g>
<g id="窓-bg2"  class="badge-group"><circle cx="24.44" cy="18.88" r="3.5" fill="#bf6c09"/><text class="num-single" x="24.44" y="18.88" dx="0" dy="-0.5">2</text></g>
