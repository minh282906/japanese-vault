<g id="窓-bg9"  class="badge-group"><circle cx="32.5" cy="76.21" r="3.5" fill="#4b09bf"/><text class="num-single" x="32.5" y="76.21" dx="0" dy="-0.5">9</text></g>
<g id="窓-bg10" class="badge-group"><circle cx="50.03" cy="70.12" r="3.5" fill="#ae09bf"/><text class="num-double" x="50.03" y="70.12" dx="-0.4" dy="-0.475">10</text></g>
<g id="窓-bg11" class="badge-group"><circle cx="76.1" cy="71.34" r="3.5" fill="#bf096c"/><text class="num-double" x="76.1" y="71.34" dx="-0.4" dy="-0.475">11</text></g>
</svg>