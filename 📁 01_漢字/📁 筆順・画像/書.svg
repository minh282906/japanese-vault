<g id="書-bg6"  class="badge-group"><circle cx="52.69" cy="9.52" r="3.5" fill="#09bfbf"/><text class="num-single" x="52.69" y="9.52" dx="0" dy="-0.5">6</text></g>
<g id="書-bg7"  class="badge-group"><circle cx="31.25" cy="68.25" r="3.5" fill="#0952bf"/><text class="num-single" x="31.25" y="68.25" dx="0" dy="-0.5">7</text></g>
<g id="書-bg8"  class="badge-group"><circle cx="33.75" cy="73.75" r="3.5" fill="#2d09bf"/><text class="num-single" x="33.75" y="73.75" dx="0" dy="-0.5">8</text></g>
<g id="書-bg9"  class="badge-group"><circle cx="35.5" cy="87.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="35.5" y="87.25" dx="0" dy="-0.5">9</text></g>
<g id="書-bg10" class="badge-group"><circle cx="37.25" cy="95.25" r="3.5" fill="#bf0976"/><text class="num-double" x="37.25" y="95.25" dx="-0.4" dy="-0.475">10</text></g>
</svg>