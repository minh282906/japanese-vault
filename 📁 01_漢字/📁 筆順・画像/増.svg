<path id="増-s11"  class="stroke" stroke="#3d09bf" d="M51.56,66.64C52.34,67.42,52.78,68.63,52.78,70.04C52.78,77.75,52.75,88.63000000000001,52.75,93.5C52.75,94.99,52.72,96.81,52.75,98.5"/>
<path id="増-s12"  class="stroke" stroke="#8b09bf" d="M53.73,67.96C60.379999999999995,67.25,78.22,65.28999999999999,81.36,65.14999999999999C83.98,65.03999999999999,84.64,66.49,84.64,68.55C84.64,74,84.65,88.12,84.65,91.50999999999999C84.65,93.16,84.53,94.91,84.46000000000001,96.77999999999999"/>
