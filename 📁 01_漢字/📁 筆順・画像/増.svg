<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (増)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #増-bg[i]: Thời gian quả bóng số nảy lên
   - #増-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#増-bg1  { animation-delay: 0.05s; }
#増-s1   { stroke-dasharray: 25.6219; stroke-dashoffset: 25.6219; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#増-bg2  { animation-delay: 0.42s; }
#増-s2   { stroke-dasharray: 51.1177; stroke-dashoffset: 51.1177; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#増-bg3  { animation-delay: 0.85s; }
#増-s3   { stroke-dasharray: 30.8723; stroke-dashoffset: 30.8723; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#増-bg4  { animation-delay: 1.22s; }
#増-s4   { stroke-dasharray: 15.3236; stroke-dashoffset: 15.3236; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#増-bg5  { animation-delay: 1.59s; }
#増-s5   { stroke-dasharray: 17.9898; stroke-dashoffset: 17.9898; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#増-bg6  { animation-delay: 1.96s; }
#増-s6   { stroke-dasharray: 26.2879; stroke-dashoffset: 26.2879; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#増-bg7  { animation-delay: 2.33s; }
#増-s7   { stroke-dasharray: 74.9186; stroke-dashoffset: 74.9186; animation: drawStroke 0.41s ease-out 2.46s forwards; }
#増-bg8  { animation-delay: 2.89s; }
#増-s8   { stroke-dasharray: 22.4467; stroke-dashoffset: 22.4467; animation: drawStroke 0.22s ease-out 3.02s forwards; }
#増-bg9  { animation-delay: 3.26s; }
#増-s9   { stroke-dasharray: 44.3380; stroke-dashoffset: 44.3380; animation: drawStroke 0.24s ease-out 3.39s forwards; }
#増-bg10  { animation-delay: 3.65s; }
#増-s10   { stroke-dasharray: 41.0582; stroke-dashoffset: 41.0582; animation: drawStroke 0.23s ease-out 3.78s forwards; }
#増-bg11  { animation-delay: 4.03s; }
#増-s11   { stroke-dasharray: 32.1655; stroke-dashoffset: 32.1655; animation: drawStroke 0.22s ease-out 4.16s forwards; }
#増-bg12  { animation-delay: 4.40s; }
#増-s12   { stroke-dasharray: 61.5308; stroke-dashoffset: 61.5308; animation: drawStroke 0.34s ease-out 4.53s forwards; }
#増-bg13  { animation-delay: 4.89s; }
#増-s13   { stroke-dasharray: 29.7032; stroke-dashoffset: 29.7032; animation: drawStroke 0.22s ease-out 5.02s forwards; }
#増-bg14  { animation-delay: 5.26s; }
#増-s14   { stroke-dasharray: 28.8347; stroke-dashoffset: 28.8347; animation: drawStroke 0.22s ease-out 5.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

