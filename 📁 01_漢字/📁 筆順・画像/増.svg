<path id="増-s7"  class="stroke" stroke="#09bf71" d="M44.67,33.02C57.09,31.310000000000002,77.86,29.010000000000005,89.24000000000001,28.020000000000003C91.99000000000001,27.780000000000005,94.19000000000001,28.730000000000004,93.75000000000001,31.870000000000005C93.24000000000001,35.56,92.15000000000002,42.980000000000004,90.57000000000001,49.830000000000005C90.21000000000001,51.39000000000001,89.83000000000001,52.93000000000001,89.45,54.38"/>
<path id="増-s8"  class="stroke" stroke="#09bfbf" d="M66.56,31.84C67.24000000000001,32.52,67.82000000000001,33.5,67.82000000000001,34.75C67.82000000000001,39.94,67.73,46.56,67.80000000000001,53.94"/>
<path id="増-s9"  class="stroke" stroke="#0971bf" d="M46.84,44.51C57.38,43,84.38,40.5,90.97,40.32"/>
