<path id="塗-s7"  class="stroke" stroke="#09bf95" d="M45.93,43.35C48.12,43.620000000000005,49.88,43.49,51.64,43.29C58.49,42.51,69.53,41.089999999999996,75.87,40.57C77.67,40.42,79.45,40.21,81.22,40.63"/>
<path id="塗-s8"  class="stroke" stroke="#0995bf" d="M62.55,34.49C63.279999999999994,35.22,63.709999999999994,36.5,63.709999999999994,37.82C63.709999999999994,44.75,63.61999999999999,55.43,63.61999999999999,58.870000000000005C63.61999999999999,66.68,59.01999999999999,60.71000000000001,57.92999999999999,59.84"/>
<path id="塗-s9"  class="stroke" stroke="#0941bf" d="M50.06,49.12C50.190000000000005,50.08,49.75,50.72,49.14,51.51C46.77,54.55,41.72,58.18,34.07,62.56"/>
<path id="塗-s10"  class="stroke" stroke="#2509bf" d="M74.21,49.22C78.63999999999999,51.26,84.38,56.5,86.75999999999999,60.769999999999996"/>
<path id="塗-s11"  class="stroke" stroke="#7909bf" d="M29.63,79.51C31.95,80.24000000000001,35.129999999999995,79.97,37.51,79.69000000000001C48.5,78.38,60.74,77.38,71,76.85C73.76,76.71,76.44,76.69,79.13,77.21"/>
<path id="塗-s12"  class="stroke" stroke="#bf09b1" d="M53.42,67.37C54.4,68.35000000000001,54.690000000000005,69.64,54.690000000000005,71.51C54.690000000000005,77.01,54.620000000000005,87.02000000000001,54.620000000000005,93.13000000000001"/>
<path id="塗-s13"  class="stroke" stroke="#bf095d" d="M15.13,95.42C18.27,96.18,21.450000000000003,96.36,24.62,96.06C42.769999999999996,94.33,66.89,93.18,82.88,92.69C86.50999999999999,92.58,90.13,92.74,93.38,93.63"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="塗-bg1"  class="badge-group"><circle cx="25.12" cy="13.88" r="3.5" fill="#bf0909"/><text class="num-single" x="25.12" y="13.88" dx="0" dy="-0.5">1</text></g>
