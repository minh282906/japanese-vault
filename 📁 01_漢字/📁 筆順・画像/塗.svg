<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (塗)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #塗-bg[i]: Thời gian quả bóng số nảy lên
   - #塗-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#塗-bg1  { animation-delay: 0.05s; }
#塗-s1   { stroke-dasharray: 9.8812; stroke-dashoffset: 9.8812; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#塗-bg2  { animation-delay: 0.42s; }
#塗-s2   { stroke-dasharray: 10.9479; stroke-dashoffset: 10.9479; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#塗-bg3  { animation-delay: 0.79s; }
#塗-s3   { stroke-dasharray: 21.6847; stroke-dashoffset: 21.6847; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#塗-bg4  { animation-delay: 1.16s; }
#塗-s4   { stroke-dasharray: 35.7395; stroke-dashoffset: 35.7395; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#塗-bg5  { animation-delay: 1.53s; }
#塗-s5   { stroke-dasharray: 36.7644; stroke-dashoffset: 36.7644; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#塗-bg6  { animation-delay: 1.90s; }
#塗-s6   { stroke-dasharray: 20.4274; stroke-dashoffset: 20.4274; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#塗-bg7  { animation-delay: 2.27s; }
#塗-s7   { stroke-dasharray: 35.4836; stroke-dashoffset: 35.4836; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#塗-bg8  { animation-delay: 2.64s; }
#塗-s8   { stroke-dasharray: 34.5172; stroke-dashoffset: 34.5172; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#塗-bg9  { animation-delay: 3.01s; }
#塗-s9   { stroke-dasharray: 21.4235; stroke-dashoffset: 21.4235; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#塗-bg10  { animation-delay: 3.38s; }
#塗-s10   { stroke-dasharray: 17.2720; stroke-dashoffset: 17.2720; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#塗-bg11  { animation-delay: 3.75s; }
#塗-s11   { stroke-dasharray: 49.7107; stroke-dashoffset: 49.7107; animation: drawStroke 0.27s ease-out 3.88s forwards; }
#塗-bg12  { animation-delay: 4.17s; }
#塗-s12   { stroke-dasharray: 26.0739; stroke-dashoffset: 26.0739; animation: drawStroke 0.22s ease-out 4.30s forwards; }
#塗-bg13  { animation-delay: 4.54s; }
#塗-s13   { stroke-dasharray: 78.5022; stroke-dashoffset: 78.5022; animation: drawStroke 0.43s ease-out 4.67s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

