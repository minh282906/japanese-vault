<g id="旅-bg6"  class="badge-group"><circle cx="57.25" cy="31.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="57.25" y="31.25" dx="0" dy="-0.5">6</text></g>
<g id="旅-bg7"  class="badge-group"><circle cx="68.47" cy="32.75" r="3.5" fill="#0952bf"/><text class="num-single" x="68.47" y="32.75" dx="0" dy="-0.5">7</text></g>
<g id="旅-bg8"  class="badge-group"><circle cx="62.27" cy="53.87" r="3.5" fill="#2d09bf"/><text class="num-single" x="62.27" y="53.87" dx="0" dy="-0.5">8</text></g>
<g id="旅-bg9"  class="badge-group"><circle cx="86.77" cy="41.14" r="3.5" fill="#9a09bf"/><text class="num-single" x="86.77" y="41.14" dx="0" dy="-0.5">9</text></g>
<g id="旅-bg10" class="badge-group"><circle cx="69.25" cy="56.25" r="3.5" fill="#bf0976"/><text class="num-double" x="69.25" y="56.25" dx="-0.4" dy="-0.475">10</text></g>
</svg>