<path id="訪-s4"  class="stroke" stroke="#4bbf09" d="M15.8,59.33C17.04,59.71,18.85,59.48,20.12,59.37C24.05,59.04,30.19,57.79,34.25,56.989999999999995C35.59,56.73,37.22,56.46999999999999,38.58,56.709999999999994"/>
<path id="訪-s5"  class="stroke" stroke="#09bf2a" d="M15.01,73.03C15.79,73.72,16.03,74.75,16.25,75.72C17.05,79.13,17.91,84.83,18.65,89.77C18.86,91.21,19.08,92.56,19.31,93.75999999999999"/>
<path id="訪-s6"  class="stroke" stroke="#09bf8d" d="M16.93,74.4C24,73.12,28.82,72.32000000000001,34.53,71.43C37.730000000000004,70.94000000000001,39.63,71.86000000000001,38.760000000000005,75.56C37.88,79.28,37.09,82.92,35.59,88.61"/>
<path id="訪-s7"  class="stroke" stroke="#098dbf" d="M20.12,91.27C24.55,90.85,28.68,90.25,34.24,89.69C35.36,89.58,36.52,89.46,37.74,89.33"/>
<path id="訪-s8"  class="stroke" stroke="#092abf" d="M70.36,12.5C71.61,13.76,72.09,15.120000000000001,72.09,16.91C72.09,20.75,72,26.87,72,30.75"/>
<path id="訪-s9"  class="stroke" stroke="#4b09bf" d="M49.75,33.86C52.5,34.38,54.13,34.4,57.38,33.94C69.37,32.25,81.5,30.669999999999998,91.75,29.979999999999997C93.94,29.83,96.68,29.819999999999997,98.74,30.629999999999995"/>
<path id="訪-s10"  class="stroke" stroke="#ae09bf" d="M70.13,45C77.5,47.75,80.36999999999999,48.38,87.39,50.32C90.56,51.2,92,53.12,90.89,56.39C87.65,65.88,81.76,82.62,75.78,91.5C71.72,97.53,67.88,91.75,66.06,89.75"/>
<path id="訪-s11"  class="stroke" stroke="#bf096c" d="M71.03,36C71.11,37.19,71.22,38.65,70.62,40.28C66,52.75,60.25,69.75,44.5,84"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="訪-bg1"  class="badge-group"><circle cx="21.12" cy="13.88" r="3.5" fill="#bf0909"/><text class="num-single" x="21.12" y="13.88" dx="0" dy="-0.5">1</text></g>
<g id="訪-bg2"  class="badge-group"><circle cx="10.12" cy="33.58" r="3.5" fill="#bf6c09"/><text class="num-single" x="10.12" y="33.58" dx="0" dy="-0.5">2</text></g>
