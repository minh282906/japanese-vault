<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (訪)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #訪-bg[i]: Thời gian quả bóng số nảy lên
   - #訪-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#訪-bg1  { animation-delay: 0.05s; }
#訪-s1   { stroke-dasharray: 13.7719; stroke-dashoffset: 13.7719; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#訪-bg2  { animation-delay: 0.42s; }
#訪-s2   { stroke-dasharray: 33.0532; stroke-dashoffset: 33.0532; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#訪-bg3  { animation-delay: 0.79s; }
#訪-s3   { stroke-dasharray: 22.8511; stroke-dashoffset: 22.8511; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#訪-bg4  { animation-delay: 1.16s; }
#訪-s4   { stroke-dasharray: 23.0432; stroke-dashoffset: 23.0432; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#訪-bg5  { animation-delay: 1.53s; }
#訪-s5   { stroke-dasharray: 21.3159; stroke-dashoffset: 21.3159; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#訪-bg6  { animation-delay: 1.90s; }
#訪-s6   { stroke-dasharray: 38.9382; stroke-dashoffset: 38.9382; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#訪-bg7  { animation-delay: 2.27s; }
#訪-s7   { stroke-dasharray: 17.7269; stroke-dashoffset: 17.7269; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#訪-bg8  { animation-delay: 2.64s; }
#訪-s8   { stroke-dasharray: 18.7175; stroke-dashoffset: 18.7175; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#訪-bg9  { animation-delay: 3.01s; }
#訪-s9   { stroke-dasharray: 49.3537; stroke-dashoffset: 49.3537; animation: drawStroke 0.27s ease-out 3.14s forwards; }
#訪-bg10  { animation-delay: 3.43s; }
#訪-s10   { stroke-dasharray: 76.9765; stroke-dashoffset: 76.9765; animation: drawStroke 0.42s ease-out 3.56s forwards; }
#訪-bg11  { animation-delay: 4.00s; }
#訪-s11   { stroke-dasharray: 55.8494; stroke-dashoffset: 55.8494; animation: drawStroke 0.31s ease-out 4.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #訪-s[i]) -->
<path id="訪-s1"  class="stroke" stroke="#bf0909" d="M21.12,13.88C24.400000000000002,15.620000000000001,29.61,21.04,30.43,23.76"/>
<path id="訪-s2"  class="stroke" stroke="#bf6c09" d="M10.12,33.58C12.069999999999999,34.22,14.389999999999999,34.08,16.39,33.93C23.91,33.38,32.33,31.67,37.91,30.689999999999998C39.62,30.389999999999997,41.129999999999995,30.339999999999996,42.839999999999996,30.669999999999998"/>
