<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (画)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #画-bg[i]: Thời gian quả bóng số nảy lên
   - #画-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#画-bg1  { animation-delay: 0.05s; }
#画-s1   { stroke-dasharray: 56.4535; stroke-dashoffset: 56.4535; animation: drawStroke 0.31s ease-out 0.18s forwards; }
#画-bg2  { animation-delay: 0.51s; }
#画-s2   { stroke-dasharray: 36.5562; stroke-dashoffset: 36.5562; animation: drawStroke 0.22s ease-out 0.64s forwards; }
#画-bg3  { animation-delay: 0.88s; }
#画-s3   { stroke-dasharray: 79.0780; stroke-dashoffset: 79.0780; animation: drawStroke 0.43s ease-out 1.01s forwards; }
#画-bg4  { animation-delay: 1.46s; }
#画-s4   { stroke-dasharray: 46.3626; stroke-dashoffset: 46.3626; animation: drawStroke 0.25s ease-out 1.59s forwards; }
#画-bg5  { animation-delay: 1.86s; }
#画-s5   { stroke-dasharray: 38.9162; stroke-dashoffset: 38.9162; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#画-bg6  { animation-delay: 2.23s; }
#画-s6   { stroke-dasharray: 34.8411; stroke-dashoffset: 34.8411; animation: drawStroke 0.22s ease-out 2.36s forwards; }
#画-bg7  { animation-delay: 2.60s; }
#画-s7   { stroke-dasharray: 112.8790; stroke-dashoffset: 112.8790; animation: drawStroke 0.55s ease-out 2.73s forwards; }
#画-bg8  { animation-delay: 3.30s; }
#画-s8   { stroke-dasharray: 52.8380; stroke-dashoffset: 52.8380; animation: drawStroke 0.29s ease-out 3.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #画-s[i]) -->
<path id="画-s1"  class="stroke" stroke="#bf0909" d="M26.13,23.42C28.11,23.8,30.64,24,32.62,23.8C45.51,22.5,62.26,20.25,75.32,19.17C78.61,18.900000000000002,80.44999999999999,19.130000000000003,82.25999999999999,19.540000000000003"/>
<path id="画-s2"  class="stroke" stroke="#bf9109" d="M30.75,39.44C31.72,40.41,32.21,41.01,32.53,42.71C33.74,49.07,35.04,61,35.870000000000005,71.49000000000001C35.970000000000006,72.76,36.06,74.02000000000001,36.150000000000006,75.25000000000001"/>
<path id="画-s3"  class="stroke" stroke="#64bf09" d="M33.25,41.27C45.5,39.25,65.34,37.120000000000005,72.68,36.56C75.80000000000001,36.32,77.39,38.230000000000004,77.22000000000001,39.99C76.70000000000002,45.35,75.22000000000001,58.53,73.46000000000001,67.48C73.10000000000001,69.33,72.72000000000001,71.02000000000001,72.34,72.45"/>
<path id="画-s4"  class="stroke" stroke="#09bf36" d="M52.65,24.07C53.49,24.92,53.99,26.16,53.99,27.28C53.99,38.120000000000005,53.9,64.37,53.9,70.08"/>
<path id="画-s5"  class="stroke" stroke="#09bfbf" d="M35.63,56.14C43.88,54.75,68.5,52.25,74.33000000000001,52.18"/>
<path id="画-s6"  class="stroke" stroke="#0936bf" d="M37.25,72.82C48.5,71.75,59.75,70,71.94,69.7"/>
<path id="画-s7"  class="stroke" stroke="#6409bf" d="M18.06,46.13C19.4,47.470000000000006,19.83,49.61,19.779999999999998,51.25C19.499999999999996,59.88,19.279999999999998,72.33,18.849999999999998,85.5C18.849999999999998,88.25,19.27,89.23,22.36,88.87C34.31,87.48,74.64,85.32000000000001,89.25,84.61"/>
<path id="画-s8"  class="stroke" stroke="#bf0991" d="M91.86,36.88C92.86,37.88,93.36,39.21,93.26,41.260000000000005C92.73,52.71000000000001,91.96000000000001,66.47,90.78,82.96000000000001C90.63,85.02000000000001,90.48,87.12,90.33,89.26"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="画-bg1"  class="badge-group"><circle cx="26.13" cy="23.42" r="3.5" fill="#bf0909"/><text class="num-single" x="26.13" y="23.42" dx="0" dy="-0.5">1</text></g>
<g id="画-bg2"  class="badge-group"><circle cx="30.75" cy="35.94" r="3.5" fill="#bf9109"/><text class="num-single" x="30.75" y="35.94" dx="0" dy="-0.5">2</text></g>
<g id="画-bg3"  class="badge-group"><circle cx="33.25" cy="44.77" r="3.5" fill="#64bf09"/><text class="num-single" x="33.25" y="44.77" dx="0" dy="-0.5">3</text></g>
<g id="画-bg4"  class="badge-group"><circle cx="52.65" cy="24.07" r="3.5" fill="#09bf36"/><text class="num-single" x="52.65" y="24.07" dx="0" dy="-0.5">4</text></g>
<g id="画-bg5"  class="badge-group"><circle cx="35.63" cy="56.14" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.63" y="56.14" dx="0" dy="-0.5">5</text></g>
<g id="画-bg6"  class="badge-group"><circle cx="37.25" cy="72.82" r="3.5" fill="#0936bf"/><text class="num-single" x="37.25" y="72.82" dx="0" dy="-0.5">6</text></g>
<g id="画-bg7"  class="badge-group"><circle cx="18.06" cy="46.13" r="3.5" fill="#6409bf"/><text class="num-single" x="18.06" y="46.13" dx="0" dy="-0.5">7</text></g>
<g id="画-bg8"  class="badge-group"><circle cx="91.86" cy="36.88" r="3.5" fill="#bf0991"/><text class="num-single" x="91.86" y="36.88" dx="0" dy="-0.5">8</text></g>
</svg>