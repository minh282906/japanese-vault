<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (児)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #児-bg[i]: Thời gian quả bóng số nảy lên
   - #児-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#児-bg1  { animation-delay: 0.05s; }
#児-s1   { stroke-dasharray: 38.2899; stroke-dashoffset: 38.2899; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#児-bg2  { animation-delay: 0.42s; }
#児-s2   { stroke-dasharray: 34.6483; stroke-dashoffset: 34.6483; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#児-bg3  { animation-delay: 0.79s; }
#児-s3   { stroke-dasharray: 64.6761; stroke-dashoffset: 64.6761; animation: drawStroke 0.36s ease-out 0.92s forwards; }
#児-bg4  { animation-delay: 1.30s; }
#児-s4   { stroke-dasharray: 28.2463; stroke-dashoffset: 28.2463; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#児-bg5  { animation-delay: 1.67s; }
#児-s5   { stroke-dasharray: 27.0891; stroke-dashoffset: 27.0891; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#児-bg6  { animation-delay: 2.04s; }
#児-s6   { stroke-dasharray: 43.3410; stroke-dashoffset: 43.3410; animation: drawStroke 0.24s ease-out 2.17s forwards; }
#児-bg7  { animation-delay: 2.43s; }
#児-s7   { stroke-dasharray: 78.9794; stroke-dashoffset: 78.9794; animation: drawStroke 0.43s ease-out 2.56s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #児-s[i]) -->
<path id="児-s1"  class="stroke" stroke="#bf0909" d="M25.37,14C26.18,14.81,26.580000000000002,16.25,26.580000000000002,17.5C26.580000000000002,18.35,26.6,35.91,26.610000000000003,46.620000000000005C26.610000000000003,48.78,26.610000000000003,50.63,26.610000000000003,52.00000000000001"/>
<path id="児-s2"  class="stroke" stroke="#bfa509" d="M45.74,16.05C46.53,16.84,47.050000000000004,18.27,47.050000000000004,19.35C47.050000000000004,21.830000000000002,47.040000000000006,38.95,47.03,47.120000000000005C47.03,48.49,47.03,49.620000000000005,47.03,50.370000000000005"/>
<path id="児-s3"  class="stroke" stroke="#3dbf09" d="M47.72,17.44C49.65,17.32,67.22,15.240000000000002,73.75,14.490000000000002C76.87,14.130000000000003,78.87,15.880000000000003,78.54,19.26C77.87,26.080000000000002,77.05000000000001,34.93,76.14,46C76.04,47.17,75.95,48.37,75.85,49.59"/>
<path id="児-s4"  class="stroke" stroke="#09bf71" d="M48.12,33.08C52.379999999999995,32.62,70.75,31,76.28,30.93"/>
<path id="児-s5"  class="stroke" stroke="#0971bf" d="M47.98,48.71C55.379999999999995,48.25,67.22,47.58,75.02,47.08"/>
<path id="児-s6"  class="stroke" stroke="#3d09bf" d="M39.25,60C39.31,60.82,39.39,62.12,39.12,63.3C37.529999999999994,70.27,29.15,86.88,15.919999999999998,94.91"/>
<path id="児-s7"  class="stroke" stroke="#bf09a5" d="M55.74,56.87C56.81,57.94,57.330000000000005,59.33,57.330000000000005,61.25C57.330000000000005,70.62,57.32000000000001,78.14,57.32000000000001,83.96000000000001C57.32000000000001,94.37,59.010000000000005,96.02000000000001,75.02000000000001,96.02000000000001C90.64000000000001,96.02000000000001,92.4,94.12,92.4,83.97000000000001"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="児-bg1"  class="badge-group"><circle cx="25.37" cy="14" r="3.5" fill="#bf0909"/><text class="num-single" x="25.37" y="14" dx="0" dy="-0.5">1</text></g>
<g id="児-bg2"  class="badge-group"><circle cx="45.74" cy="12.55" r="3.5" fill="#bfa509"/><text class="num-single" x="45.74" y="12.55" dx="0" dy="-0.5">2</text></g>
<g id="児-bg3"  class="badge-group"><circle cx="47.72" cy="20.94" r="3.5" fill="#3dbf09"/><text class="num-single" x="47.72" y="20.94" dx="0" dy="-0.5">3</text></g>
<g id="児-bg4"  class="badge-group"><circle cx="48.12" cy="33.08" r="3.5" fill="#09bf71"/><text class="num-single" x="48.12" y="33.08" dx="0" dy="-0.5">4</text></g>
<g id="児-bg5"  class="badge-group"><circle cx="47.98" cy="48.71" r="3.5" fill="#0971bf"/><text class="num-single" x="47.98" y="48.71" dx="0" dy="-0.5">5</text></g>
<g id="児-bg6"  class="badge-group"><circle cx="39.25" cy="60" r="3.5" fill="#3d09bf"/><text class="num-single" x="39.25" y="60" dx="0" dy="-0.5">6</text></g>
<g id="児-bg7"  class="badge-group"><circle cx="55.74" cy="56.87" r="3.5" fill="#bf09a5"/><text class="num-single" x="55.74" y="56.87" dx="0" dy="-0.5">7</text></g>
</svg>