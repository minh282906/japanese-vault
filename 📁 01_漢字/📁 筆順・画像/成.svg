<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (成)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #成-bg[i]: Thời gian quả bóng số nảy lên
   - #成-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#成-bg1  { animation-delay: 0.05s; }
#成-s1   { stroke-dasharray: 64.1598; stroke-dashoffset: 64.1598; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#成-bg2  { animation-delay: 0.55s; }
#成-s2   { stroke-dasharray: 60.3240; stroke-dashoffset: 60.3240; animation: drawStroke 0.33s ease-out 0.68s forwards; }
#成-bg3  { animation-delay: 1.03s; }
#成-s3   { stroke-dasharray: 59.6194; stroke-dashoffset: 59.6194; animation: drawStroke 0.33s ease-out 1.16s forwards; }
#成-bg4  { animation-delay: 1.51s; }
#成-s4   { stroke-dasharray: 106.3800; stroke-dashoffset: 106.3800; animation: drawStroke 0.55s ease-out 1.64s forwards; }
#成-bg5  { animation-delay: 2.21s; }
#成-s5   { stroke-dasharray: 53.8143; stroke-dashoffset: 53.8143; animation: drawStroke 0.30s ease-out 2.34s forwards; }
#成-bg6  { animation-delay: 2.66s; }
#成-s6   { stroke-dasharray: 12.1694; stroke-dashoffset: 12.1694; animation: drawStroke 0.22s ease-out 2.79s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #成-s[i]) -->
<path id="成-s1"  class="stroke" stroke="#bf0909" d="M25.9,31.5C26.889999999999997,32.49,27.139999999999997,33.88,27.139999999999997,35.24C27.139999999999997,53.25,24.749999999999996,77.5,12.059999999999997,92.21000000000001"/>
<path id="成-s2"  class="stroke" stroke="#bfbf09" d="M27.5,33.7C29.62,34.38,33.04,33.74,35.87,33.440000000000005C45.48,32.400000000000006,66.42,30.030000000000005,78.64,29.030000000000005C81.7,28.780000000000005,84.49,28.650000000000006,87.5,29.290000000000006"/>
<path id="成-s3"  class="stroke" stroke="#09bf09" d="M27.5,56.26C34.38,55.25,44.34,53.099999999999994,46.379999999999995,52.989999999999995C48.74999999999999,52.87,49.97,54.169999999999995,49.60999999999999,56.66C49.25999999999999,59.13999999999999,47.269999999999996,76.47,42.059999999999995,83.22C40.49999999999999,85.25,37.669999999999995,83.36,36.269999999999996,81.88"/>
<path id="成-s4"  class="stroke" stroke="#09bfbf" d="M56,10.5C58.35,13.11,58.42,15.42,58.84,18.880000000000003C62.62,50.38,68,73,91.45,92.7C97.18,97.51,96.95,93.48,96.14,85.46000000000001"/>
<path id="成-s5"  class="stroke" stroke="#0909bf" d="M82.98,45.14C83.25,46.5,83.19,47.85,82.82000000000001,49.34C80.5,58.62,71,77.5,55.06,89.47"/>
<path id="成-s6"  class="stroke" stroke="#bf09bf" d="M75.25,11.75C78.19,13.35,82.88,17.009999999999998,84.25,19.75"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="成-bg1"  class="badge-group"><circle cx="25.9" cy="28.0" r="3.5" fill="#bf0909"/><text class="num-single" x="25.9" y="28.0" dx="0" dy="-0.5">1</text></g>
<g id="成-bg2"  class="badge-group"><circle cx="27.5" cy="37.2" r="3.5" fill="#bfbf09"/><text class="num-single" x="27.5" y="37.2" dx="0" dy="-0.5">2</text></g>
<g id="成-bg3"  class="badge-group"><circle cx="27.5" cy="56.26" r="3.5" fill="#09bf09"/><text class="num-single" x="27.5" y="56.26" dx="0" dy="-0.5">3</text></g>
<g id="成-bg4"  class="badge-group"><circle cx="56" cy="10.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="56" y="10.5" dx="0" dy="-0.5">4</text></g>
<g id="成-bg5"  class="badge-group"><circle cx="82.98" cy="45.14" r="3.5" fill="#0909bf"/><text class="num-single" x="82.98" y="45.14" dx="0" dy="-0.5">5</text></g>
<g id="成-bg6"  class="badge-group"><circle cx="75.25" cy="11.75" r="3.5" fill="#bf09bf"/><text class="num-single" x="75.25" y="11.75" dx="0" dy="-0.5">6</text></g>
</svg>