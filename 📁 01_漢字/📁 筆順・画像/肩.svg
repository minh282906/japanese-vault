<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (肩)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #肩-bg[i]: Thời gian quả bóng số nảy lên
   - #肩-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#肩-bg1  { animation-delay: 0.05s; }
#肩-s1   { stroke-dasharray: 49.4865; stroke-dashoffset: 49.4865; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#肩-bg2  { animation-delay: 0.47s; }
#肩-s2   { stroke-dasharray: 62.4107; stroke-dashoffset: 62.4107; animation: drawStroke 0.34s ease-out 0.60s forwards; }
#肩-bg3  { animation-delay: 0.96s; }
#肩-s3   { stroke-dasharray: 47.9200; stroke-dashoffset: 47.9200; animation: drawStroke 0.26s ease-out 1.09s forwards; }
#肩-bg4  { animation-delay: 1.37s; }
#肩-s4   { stroke-dasharray: 54.7340; stroke-dashoffset: 54.7340; animation: drawStroke 0.30s ease-out 1.50s forwards; }
#肩-bg5  { animation-delay: 1.82s; }
#肩-s5   { stroke-dasharray: 43.1073; stroke-dashoffset: 43.1073; animation: drawStroke 0.24s ease-out 1.95s forwards; }
#肩-bg6  { animation-delay: 2.21s; }
#肩-s6   { stroke-dasharray: 84.1480; stroke-dashoffset: 84.1480; animation: drawStroke 0.46s ease-out 2.34s forwards; }
#肩-bg7  { animation-delay: 2.82s; }
#肩-s7   { stroke-dasharray: 32.1371; stroke-dashoffset: 32.1371; animation: drawStroke 0.22s ease-out 2.95s forwards; }
#肩-bg8  { animation-delay: 3.19s; }
#肩-s8   { stroke-dasharray: 31.9900; stroke-dashoffset: 31.9900; animation: drawStroke 0.22s ease-out 3.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #肩-s[i]) -->
<path id="肩-s1"  class="stroke" stroke="#bf0909" d="M29.38,17.51C32,18,35,17.98,37.519999999999996,17.73C46.169999999999995,16.87,59,15.120000000000001,71.13,14.24C73.61,14.06,76.17,13.98,78.63,14.450000000000001"/>
<path id="肩-s2"  class="stroke" stroke="#bf9109" d="M29.85,29.13C31.5,29.75,33.49,29.93,35.75,29.66C47.5,28.26,68.89,26.18,76.25,25.509999999999998C78.24,25.33,80.32,26.279999999999998,79.5,29.009999999999998C78.75,31.509999999999998,77.75,34.26,76.25,38.26"/>
<path id="肩-s3"  class="stroke" stroke="#64bf09" d="M31.5,43.25C44.25,42.13,56.03,40.89,70.75,39.8C74.28,39.54,77.26,39.339999999999996,79.25,39.25"/>
<path id="肩-s4"  class="stroke" stroke="#09bf36" d="M31.68,30.43C32,31.25,32.07,32.5,31.84,34.19C29.5,51.25,25,67.25,12.75,80.5"/>
<path id="肩-s5"  class="stroke" stroke="#09bfbf" d="M40.57,53.88C41.410000000000004,54.720000000000006,41.63,56.13,41.63,57.46C41.63,60.910000000000004,41.63,78.93,41.63,91.12C41.63,93.2,41.63,95.11,41.63,96.74000000000001"/>
<path id="肩-s6"  class="stroke" stroke="#0936bf" d="M42.95,55.99C45.580000000000005,55.78,67.5,53,71.38,52.650000000000006C73.77,52.43000000000001,75.75999999999999,54.00000000000001,75.75999999999999,56.74000000000001C75.75999999999999,63.50000000000001,75.85,74.14000000000001,75.85,91.58000000000001C75.85,102.77000000000001,70.6,95.46000000000001,68.39999999999999,93.52000000000001"/>
<path id="肩-s7"  class="stroke" stroke="#6409bf" d="M42.7,67.06C52.5,66.25,65.25,65.12,74.73,64.44"/>
<path id="肩-s8"  class="stroke" stroke="#bf0991" d="M42.85,78.57C50.5,77.88,66.68,77.24,74.79,76.80999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="肩-bg1"  class="badge-group"><circle cx="29.38" cy="17.51" r="3.5" fill="#bf0909"/><text class="num-single" x="29.38" y="17.51" dx="0" dy="-0.5">1</text></g>
<g id="肩-bg2"  class="badge-group"><circle cx="29.85" cy="25.63" r="3.5" fill="#bf9109"/><text class="num-single" x="29.85" y="25.63" dx="0" dy="-0.5">2</text></g>
<g id="肩-bg3"  class="badge-group"><circle cx="31.5" cy="43.25" r="3.5" fill="#64bf09"/><text class="num-single" x="31.5" y="43.25" dx="0" dy="-0.5">3</text></g>
<g id="肩-bg4"  class="badge-group"><circle cx="31.68" cy="33.93" r="3.5" fill="#09bf36"/><text class="num-single" x="31.68" y="33.93" dx="0" dy="-0.5">4</text></g>
<g id="肩-bg5"  class="badge-group"><circle cx="40.57" cy="50.38" r="3.5" fill="#09bfbf"/><text class="num-single" x="40.57" y="50.38" dx="0" dy="-0.5">5</text></g>
<g id="肩-bg6"  class="badge-group"><circle cx="42.95" cy="59.49" r="3.5" fill="#0936bf"/><text class="num-single" x="42.95" y="59.49" dx="0" dy="-0.5">6</text></g>
<g id="肩-bg7"  class="badge-group"><circle cx="42.7" cy="67.06" r="3.5" fill="#6409bf"/><text class="num-single" x="42.7" y="67.06" dx="0" dy="-0.5">7</text></g>
<g id="肩-bg8"  class="badge-group"><circle cx="42.85" cy="78.57" r="3.5" fill="#bf0991"/><text class="num-single" x="42.85" y="78.57" dx="0" dy="-0.5">8</text></g>
</svg>