<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (才)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #才-bg[i]: Thời gian quả bóng số nảy lên
   - #才-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#才-bg1  { animation-delay: 0.05s; }
#才-s1   { stroke-dasharray: 74.4117; stroke-dashoffset: 74.4117; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#才-bg2  { animation-delay: 0.61s; }
#才-s2   { stroke-dasharray: 91.3212; stroke-dashoffset: 91.3212; animation: drawStroke 0.50s ease-out 0.74s forwards; }
#才-bg3  { animation-delay: 1.26s; }
#才-s3   { stroke-dasharray: 63.1473; stroke-dashoffset: 63.1473; animation: drawStroke 0.35s ease-out 1.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #才-s[i]) -->
<path id="才-s1"  class="stroke" stroke="#bf0909" d="M18.62,38.5C21.240000000000002,39.12,23.16,39.03,26.44,38.75C41.25,37.5,67.62,35,84.75,34C88.03,33.81,90.61,34,92.75,34.5"/>
<path id="才-s2"  class="stroke" stroke="#09bf09" d="M60.77,13.58C62.160000000000004,14.97,63.03,16.57,63.03,19.6C63.03,35,63.02,86.00999999999999,63.02,90.97C63.02,99.75,55.81,91.47,54.31,90.22"/>
<path id="才-s3"  class="stroke" stroke="#0909bf" d="M73.043742,46.367587C62.856133,57.87424,32.711367,80.494361,23.641472,85.467096"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="才-bg1"  class="badge-group"><circle cx="18.62" cy="38.5" r="3.5" fill="#bf0909"/><text class="num-single" x="18.62" y="38.5" dx="0" dy="-0.5">1</text></g>
<g id="才-bg2"  class="badge-group"><circle cx="60.77" cy="13.58" r="3.5" fill="#09bf09"/><text class="num-single" x="60.77" y="13.58" dx="0" dy="-0.5">2</text></g>
<g id="才-bg3"  class="badge-group"><circle cx="73.04" cy="46.37" r="3.5" fill="#0909bf"/><text class="num-single" x="73.04" y="46.37" dx="0" dy="-0.5">3</text></g>
</svg>