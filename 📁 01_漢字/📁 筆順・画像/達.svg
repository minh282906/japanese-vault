<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (達)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #達-bg[i]: Thời gian quả bóng số nảy lên
   - #達-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#達-bg1  { animation-delay: 0.05s; }
#達-s1   { stroke-dasharray: 29.8341; stroke-dashoffset: 29.8341; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#達-bg2  { animation-delay: 0.42s; }
#達-s2   { stroke-dasharray: 21.7370; stroke-dashoffset: 21.7370; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#達-bg3  { animation-delay: 0.79s; }
#達-s3   { stroke-dasharray: 53.7492; stroke-dashoffset: 53.7492; animation: drawStroke 0.30s ease-out 0.92s forwards; }
#達-bg4  { animation-delay: 1.24s; }
#達-s4   { stroke-dasharray: 9.0177; stroke-dashoffset: 9.0177; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#達-bg5  { animation-delay: 1.61s; }
#達-s5   { stroke-dasharray: 11.5607; stroke-dashoffset: 11.5607; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#達-bg6  { animation-delay: 1.98s; }
#達-s6   { stroke-dasharray: 37.1215; stroke-dashoffset: 37.1215; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#達-bg7  { animation-delay: 2.35s; }
#達-s7   { stroke-dasharray: 33.6738; stroke-dashoffset: 33.6738; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#達-bg8  { animation-delay: 2.72s; }
#達-s8   { stroke-dasharray: 51.2427; stroke-dashoffset: 51.2427; animation: drawStroke 0.28s ease-out 2.85s forwards; }
#達-bg9  { animation-delay: 3.15s; }
#達-s9   { stroke-dasharray: 35.5389; stroke-dashoffset: 35.5389; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#達-bg10  { animation-delay: 3.52s; }
#達-s10   { stroke-dasharray: 15.0689; stroke-dashoffset: 15.0689; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#達-bg11  { animation-delay: 3.89s; }
#達-s11   { stroke-dasharray: 58.6075; stroke-dashoffset: 58.6075; animation: drawStroke 0.32s ease-out 4.02s forwards; }
#達-bg12  { animation-delay: 4.36s; }
#達-s12   { stroke-dasharray: 76.9219; stroke-dashoffset: 76.9219; animation: drawStroke 0.42s ease-out 4.49s forwards; }
]]>
</style>

