<path id="達-s9"  class="stroke" stroke="#0909bf" d="M63.47,49.05C64.49,50.07,64.77,51.519999999999996,64.77,52.559999999999995C64.77,56.17999999999999,64.82,70.72,64.83999999999999,79.75999999999999C64.83999999999999,81.50999999999999,64.85,83.05,64.85,84.25999999999999"/>
<path id="達-s10"  class="stroke" stroke="#6409bf" d="M15.43,20.12C19.53,21.75,26.03,26.84,27.049999999999997,29.380000000000003"/>
