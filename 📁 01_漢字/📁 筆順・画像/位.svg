<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (位)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #位-bg[i]: Thời gian quả bóng số nảy lên
   - #位-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#位-bg1  { animation-delay: 0.05s; }
#位-s1   { stroke-dasharray: 46.4996; stroke-dashoffset: 46.4996; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#位-bg2  { animation-delay: 0.46s; }
#位-s2   { stroke-dasharray: 52.4007; stroke-dashoffset: 52.4007; animation: drawStroke 0.29s ease-out 0.59s forwards; }
#位-bg3  { animation-delay: 0.90s; }
#位-s3   { stroke-dasharray: 22.1939; stroke-dashoffset: 22.1939; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#位-bg4  { animation-delay: 1.27s; }
#位-s4   { stroke-dasharray: 50.8838; stroke-dashoffset: 50.8838; animation: drawStroke 0.28s ease-out 1.40s forwards; }
#位-bg5  { animation-delay: 1.70s; }
#位-s5   { stroke-dasharray: 31.1480; stroke-dashoffset: 31.1480; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#位-bg6  { animation-delay: 2.07s; }
#位-s6   { stroke-dasharray: 37.9099; stroke-dashoffset: 37.9099; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#位-bg7  { animation-delay: 2.44s; }
#位-s7   { stroke-dasharray: 63.0108; stroke-dashoffset: 63.0108; animation: drawStroke 0.35s ease-out 2.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #位-s[i]) -->
<path id="位-s1"  class="stroke" stroke="#bf0909" d="M32.26,17.5C32.48,19.5,32.199999999999996,21.87,31.499999999999996,23.58C27.06,34.5,21.43,45,11.25,58.29"/>
<path id="位-s2"  class="stroke" stroke="#bfa509" d="M25.28,42C26.080000000000002,42.8,26.78,44.21,26.78,45.38C26.75,56.25,26.580000000000002,76.87,26.52,88.13C26.51,90.6,26.5,92.63,26.5,94"/>
<path id="位-s3"  class="stroke" stroke="#3dbf09" d="M63,15.5C64,16.25,64.5,17.5,64.5,19.25S64.5,32.5,64.5,37.25"/>
<path id="位-s4"  class="stroke" stroke="#09bf71" d="M39.84,39.56C42.5,40,45.13,39.68,47.620000000000005,39.400000000000006C56.760000000000005,38.36000000000001,75.05000000000001,35.93000000000001,83.89000000000001,35.21000000000001C86.09000000000002,35.03000000000001,88.25000000000001,34.89000000000001,90.43000000000002,35.31000000000001"/>
<path id="位-s5"  class="stroke" stroke="#0971bf" d="M48.38,47.12C51.32,54.86,54.14,68.13,55.63,77.37"/>
<path id="位-s6"  class="stroke" stroke="#3d09bf" d="M79.6,41.16C80.32,42.379999999999995,80.39999999999999,43,80.32,44C79.75,50.9,74.42999999999999,72.84,73,78.12"/>
<path id="位-s7"  class="stroke" stroke="#bf09a5" d="M35,85.59C38.12,86.37,41.6,86.15,44.769999999999996,85.8C57.44,84.41,76.35,82.78999999999999,89.50999999999999,82.02C92.21999999999998,81.86,95.07,82.17999999999999,97.74999999999999,82.66"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="位-bg1"  class="badge-group"><circle cx="32.26" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="32.26" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="位-bg2"  class="badge-group"><circle cx="25.28" cy="42" r="3.5" fill="#bfa509"/><text class="num-single" x="25.28" y="42" dx="0" dy="-0.5">2</text></g>
<g id="位-bg3"  class="badge-group"><circle cx="63" cy="15.5" r="3.5" fill="#3dbf09"/><text class="num-single" x="63" y="15.5" dx="0" dy="-0.5">3</text></g>
<g id="位-bg4"  class="badge-group"><circle cx="39.84" cy="39.56" r="3.5" fill="#09bf71"/><text class="num-single" x="39.84" y="39.56" dx="0" dy="-0.5">4</text></g>
<g id="位-bg5"  class="badge-group"><circle cx="48.38" cy="47.12" r="3.5" fill="#0971bf"/><text class="num-single" x="48.38" y="47.12" dx="0" dy="-0.5">5</text></g>
<g id="位-bg6"  class="badge-group"><circle cx="79.6" cy="41.16" r="3.5" fill="#3d09bf"/><text class="num-single" x="79.6" y="41.16" dx="0" dy="-0.5">6</text></g>
<g id="位-bg7"  class="badge-group"><circle cx="35" cy="85.59" r="3.5" fill="#bf09a5"/><text class="num-single" x="35" y="85.59" dx="0" dy="-0.5">7</text></g>
</svg>