<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (等)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #等-bg[i]: Thời gian quả bóng số nảy lên
   - #等-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#等-bg1  { animation-delay: 0.05s; }
#等-s1   { stroke-dasharray: 24.4271; stroke-dashoffset: 24.4271; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#等-bg2  { animation-delay: 0.42s; }
#等-s2   { stroke-dasharray: 20.4423; stroke-dashoffset: 20.4423; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#等-bg3  { animation-delay: 0.79s; }
#等-s3   { stroke-dasharray: 11.0300; stroke-dashoffset: 11.0300; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#等-bg4  { animation-delay: 1.16s; }
#等-s4   { stroke-dasharray: 17.8843; stroke-dashoffset: 17.8843; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#等-bg5  { animation-delay: 1.53s; }
#等-s5   { stroke-dasharray: 24.0516; stroke-dashoffset: 24.0516; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#等-bg6  { animation-delay: 1.90s; }
#等-s6   { stroke-dasharray: 11.9193; stroke-dashoffset: 11.9193; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#等-bg7  { animation-delay: 2.27s; }
#等-s7   { stroke-dasharray: 50.2890; stroke-dashoffset: 50.2890; animation: drawStroke 0.28s ease-out 2.40s forwards; }
#等-bg8  { animation-delay: 2.70s; }
#等-s8   { stroke-dasharray: 24.5296; stroke-dashoffset: 24.5296; animation: drawStroke 0.22s ease-out 2.83s forwards; }
#等-bg9  { animation-delay: 3.07s; }
#等-s9   { stroke-dasharray: 76.0312; stroke-dashoffset: 76.0312; animation: drawStroke 0.42s ease-out 3.20s forwards; }
#等-bg10  { animation-delay: 3.64s; }
#等-s10   { stroke-dasharray: 64.2929; stroke-dashoffset: 64.2929; animation: drawStroke 0.35s ease-out 3.77s forwards; }
#等-bg11  { animation-delay: 4.14s; }
#等-s11   { stroke-dasharray: 50.0669; stroke-dashoffset: 50.0669; animation: drawStroke 0.28s ease-out 4.27s forwards; }
#等-bg12  { animation-delay: 4.57s; }
#等-s12   { stroke-dasharray: 10.9848; stroke-dashoffset: 10.9848; animation: drawStroke 0.22s ease-out 4.70s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

