<path id="等-s8"  class="stroke" stroke="#0964bf" d="M52.4,29.87C53.269999999999996,30.740000000000002,53.62,32,53.62,33.160000000000004C53.62,41,53.51,52.03,53.51,54.09"/>
<path id="等-s9"  class="stroke" stroke="#0909bf" d="M16.88,57.94C19.63,58.37,22.82,58.269999999999996,25.75,57.97C44.31,56.1,67,53.62,83.12,52.83C86.28,52.67,89.48,52.9,92.62,53.379999999999995"/>
<path id="等-s10"  class="stroke" stroke="#6409bf" d="M24.5,71.57C27.25,72,30.97,71.88999999999999,33.87,71.66C46.489999999999995,70.69,69.6,68.27,81,67.66C83.54,67.52,86.06,67.45,88.58,67.91"/>
<path id="等-s11"  class="stroke" stroke="#bf09bf" d="M65.97,56.89C66.85,57.77,67.56,59.12,67.56,60.44C67.56,70.47,67.42,90.55,67.42,93.97C67.42,102.37,61.88,95.62,59.6,93.64"/>
<path id="等-s12"  class="stroke" stroke="#bf0964" d="M41.61,76.66C43.94,78.17,47.64,82.89,48.22,85.25"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="等-bg1"  class="badge-group"><circle cx="31.75" cy="11.25" r="3.5" fill="#bf0909"/><text class="num-single" x="31.75" y="11.25" dx="0" dy="-0.5">1</text></g>
