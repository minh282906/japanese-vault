<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (硬)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #硬-bg[i]: Thời gian quả bóng số nảy lên
   - #硬-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#硬-bg1  { animation-delay: 0.05s; }
#硬-s1   { stroke-dasharray: 28.2090; stroke-dashoffset: 28.2090; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#硬-bg2  { animation-delay: 0.42s; }
#硬-s2   { stroke-dasharray: 42.6841; stroke-dashoffset: 42.6841; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#硬-bg3  { animation-delay: 0.80s; }
#硬-s3   { stroke-dasharray: 22.0635; stroke-dashoffset: 22.0635; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#硬-bg4  { animation-delay: 1.17s; }
#硬-s4   { stroke-dasharray: 36.6122; stroke-dashoffset: 36.6122; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#硬-bg5  { animation-delay: 1.54s; }
#硬-s5   { stroke-dasharray: 17.5906; stroke-dashoffset: 17.5906; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#硬-bg6  { animation-delay: 1.91s; }
#硬-s6   { stroke-dasharray: 37.2766; stroke-dashoffset: 37.2766; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#硬-bg7  { animation-delay: 2.28s; }
#硬-s7   { stroke-dasharray: 26.7411; stroke-dashoffset: 26.7411; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#硬-bg8  { animation-delay: 2.65s; }
#硬-s8   { stroke-dasharray: 62.9203; stroke-dashoffset: 62.9203; animation: drawStroke 0.35s ease-out 2.78s forwards; }
#硬-bg9  { animation-delay: 3.15s; }
#硬-s9   { stroke-dasharray: 33.5093; stroke-dashoffset: 33.5093; animation: drawStroke 0.22s ease-out 3.28s forwards; }
#硬-bg10  { animation-delay: 3.52s; }
#硬-s10   { stroke-dasharray: 28.7766; stroke-dashoffset: 28.7766; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#硬-bg11  { animation-delay: 3.89s; }
#硬-s11   { stroke-dasharray: 84.7662; stroke-dashoffset: 84.7662; animation: drawStroke 0.47s ease-out 4.02s forwards; }
#硬-bg12  { animation-delay: 4.51s; }
#硬-s12   { stroke-dasharray: 50.6871; stroke-dashoffset: 50.6871; animation: drawStroke 0.28s ease-out 4.64s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #硬-s[i]) -->
<path id="硬-s1"  class="stroke" stroke="#bf0909" d="M15.13,25.51C16.45,25.89,18.41,25.860000000000003,19.77,25.740000000000002C25.67,25.200000000000003,30.82,24.060000000000002,38.629999999999995,23.17C40.169999999999995,23,41.74999999999999,22.840000000000003,43.12,22.840000000000003"/>
