<path id="硬-s5"  class="stroke" stroke="#09bf09" d="M25.45,70.9C30.63,70,34.14,69.36,39.55,68.53C40.589999999999996,68.37,41.669999999999995,68.21000000000001,42.809999999999995,68.07000000000001"/>
<path id="硬-s6"  class="stroke" stroke="#09bf64" d="M52.88,20.32C55.5,21,58.36,20.82,60.400000000000006,20.55C67.42,19.62,77.34,18.39,84.98,17.64C86.29,17.51,88.5,17.25,89.92,17.48"/>
<path id="硬-s7"  class="stroke" stroke="#09bfbf" d="M50.67,35.04C51.56,35.93,52.050000000000004,36.85,52.21,38.129999999999995C52.53,40.709999999999994,53.87,50.14999999999999,54.82,56.36C55.13,58.41,55.4,60.11,55.58,61.1"/>
<path id="硬-s8"  class="stroke" stroke="#0964bf" d="M53.1,36.98C60.25,35.5,75.75,33,85.28999999999999,32.04C88.82,31.689999999999998,91.22,32.44,90.41999999999999,36.81C89.72999999999999,40.57,88.63999999999999,46.34,87.00999999999999,52.510000000000005C86.53999999999999,54.290000000000006,86.05,56.06,85.53999999999999,57.760000000000005"/>
<path id="硬-s9"  class="stroke" stroke="#0909bf" d="M54.67,47.12C61.160000000000004,46.07,79.38,43.75,87.94,43.18"/>
<path id="硬-s10"  class="stroke" stroke="#6409bf" d="M56.38,58.04C66.37,56.75,72.87,56,85.01,55.2"/>
<path id="硬-s11"  class="stroke" stroke="#bf09bf" d="M68.94,22.18C69.82,23.06,70.07,24.689999999999998,70.08,26.68C70.26,62.51,68.63,81.75999999999999,39.62,93.80000000000001"/>
<path id="硬-s12"  class="stroke" stroke="#bf0964" d="M50.91,66.42C56.25,66.42,73.94,81.8,83.37,88.83C86.72,91.33,89,92.5,92.89,94.28999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="硬-bg1"  class="badge-group"><circle cx="15.13" cy="25.51" r="3.5" fill="#bf0909"/><text class="num-single" x="15.13" y="25.51" dx="0" dy="-0.5">1</text></g>
