<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (輸)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #輸-bg[i]: Thời gian quả bóng số nảy lên
   - #輸-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#輸-bg1  { animation-delay: 0.05s; }
#輸-s1   { stroke-dasharray: 30.7160; stroke-dashoffset: 30.7160; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#輸-bg2  { animation-delay: 0.42s; }
#輸-s2   { stroke-dasharray: 23.4749; stroke-dashoffset: 23.4749; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#輸-bg3  { animation-delay: 0.79s; }
#輸-s3   { stroke-dasharray: 50.0216; stroke-dashoffset: 50.0216; animation: drawStroke 0.28s ease-out 0.92s forwards; }
#輸-bg4  { animation-delay: 1.22s; }
#輸-s4   { stroke-dasharray: 24.7972; stroke-dashoffset: 24.7972; animation: drawStroke 0.22s ease-out 1.35s forwards; }
#輸-bg5  { animation-delay: 1.59s; }
#輸-s5   { stroke-dasharray: 21.5073; stroke-dashoffset: 21.5073; animation: drawStroke 0.22s ease-out 1.72s forwards; }
#輸-bg6  { animation-delay: 1.96s; }
#輸-s6   { stroke-dasharray: 32.1303; stroke-dashoffset: 32.1303; animation: drawStroke 0.22s ease-out 2.09s forwards; }
#輸-bg7  { animation-delay: 2.33s; }
#輸-s7   { stroke-dasharray: 82.8760; stroke-dashoffset: 82.8760; animation: drawStroke 0.46s ease-out 2.46s forwards; }
#輸-bg8  { animation-delay: 2.94s; }
#輸-s8   { stroke-dasharray: 38.8047; stroke-dashoffset: 38.8047; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#輸-bg9  { animation-delay: 3.31s; }
#輸-s9   { stroke-dasharray: 38.1296; stroke-dashoffset: 38.1296; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#輸-bg10  { animation-delay: 3.68s; }
#輸-s10   { stroke-dasharray: 23.4183; stroke-dashoffset: 23.4183; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#輸-bg11  { animation-delay: 4.05s; }
#輸-s11   { stroke-dasharray: 41.8709; stroke-dashoffset: 41.8709; animation: drawStroke 0.23s ease-out 4.18s forwards; }
#輸-bg12  { animation-delay: 4.43s; }
#輸-s12   { stroke-dasharray: 60.0322; stroke-dashoffset: 60.0322; animation: drawStroke 0.33s ease-out 4.56s forwards; }
#輸-bg13  { animation-delay: 4.91s; }
#輸-s13   { stroke-dasharray: 11.3324; stroke-dashoffset: 11.3324; animation: drawStroke 0.22s ease-out 5.04s forwards; }
#輸-bg14  { animation-delay: 5.28s; }
#輸-s14   { stroke-dasharray: 11.3109; stroke-dashoffset: 11.3109; animation: drawStroke 0.22s ease-out 5.41s forwards; }
#輸-bg15  { animation-delay: 5.65s; }
#輸-s15   { stroke-dasharray: 28.8678; stroke-dashoffset: 28.8678; animation: drawStroke 0.22s ease-out 5.78s forwards; }
#輸-bg16  { animation-delay: 6.02s; }
#輸-s16   { stroke-dasharray: 54.5094; stroke-dashoffset: 54.5094; animation: drawStroke 0.30s ease-out 6.15s forwards; }
]]>
</style>

