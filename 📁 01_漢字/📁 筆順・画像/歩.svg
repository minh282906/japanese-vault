<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (歩)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #歩-bg[i]: Thời gian quả bóng số nảy lên
   - #歩-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#歩-bg1  { animation-delay: 0.05s; }
#歩-s1   { stroke-dasharray: 27.7935; stroke-dashoffset: 27.7935; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#歩-bg2  { animation-delay: 0.42s; }
#歩-s2   { stroke-dasharray: 23.8657; stroke-dashoffset: 23.8657; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#歩-bg3  { animation-delay: 0.79s; }
#歩-s3   { stroke-dasharray: 18.6400; stroke-dashoffset: 18.6400; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#歩-bg4  { animation-delay: 1.16s; }
#歩-s4   { stroke-dasharray: 74.0346; stroke-dashoffset: 74.0346; animation: drawStroke 0.41s ease-out 1.29s forwards; }
#歩-bg5  { animation-delay: 1.72s; }
#歩-s5   { stroke-dasharray: 36.4185; stroke-dashoffset: 36.4185; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#歩-bg6  { animation-delay: 2.09s; }
#歩-s6   { stroke-dasharray: 25.2021; stroke-dashoffset: 25.2021; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#歩-bg7  { animation-delay: 2.46s; }
#歩-s7   { stroke-dasharray: 18.7979; stroke-dashoffset: 18.7979; animation: drawStroke 0.22s ease-out 2.59s forwards; }
#歩-bg8  { animation-delay: 2.83s; }
#歩-s8   { stroke-dasharray: 67.6646; stroke-dashoffset: 67.6646; animation: drawStroke 0.37s ease-out 2.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #歩-s[i]) -->
<path id="歩-s1"  class="stroke" stroke="#bf0909" d="M54.39,10.75C55.76,11.870000000000001,56.52,13.25,56.52,14.89C56.52,19.75,56.74,28.75,56.74,37.86"/>
<path id="歩-s2"  class="stroke" stroke="#bf9109" d="M57.65,24.41C65.88,23,70.38,22.25,77.09,21.240000000000002C78.75,20.990000000000002,80.19,21.000000000000004,81.24000000000001,21.200000000000003"/>
<path id="歩-s3"  class="stroke" stroke="#64bf09" d="M32.24,21.98C33,22.75,34.050000000000004,23.9,34.15,24.79C34.5,27.99,34.75,33.87,34.92,39.96"/>
<path id="歩-s4"  class="stroke" stroke="#09bf36" d="M18,41.5C20.84,42.19,23.62,42.18,26.509999999999998,41.9C40.879999999999995,40.5,67.43,37.629999999999995,82.52,36.31C85.61,36.04,88.6,36.02,91.67999999999999,36.5"/>
<path id="歩-s5"  class="stroke" stroke="#09bfbf" d="M56.13,42C56.88,42.75,57.35,43.99,57.35,45.5C57.35,54,57.35,63.97,57.35,66.44C57.35,73.5,53.620000000000005,69.62,50.25,66.25"/>
<path id="歩-s6"  class="stroke" stroke="#0936bf" d="M38.75,50.75C38.87,51.85,38.69,52.51,38.13,53.48C35.6,57.9,29.25,63.5,22,68.75"/>
<path id="歩-s7"  class="stroke" stroke="#6409bf" d="M77,45.5C82.88,47.79,88.62,52.38,91.5,57.01"/>
<path id="歩-s8"  class="stroke" stroke="#bf0991" d="M76.65,55.64C76.79,56.61,76.56,58.17,75.87,59.55C70.15,70.94,48.14,89.35,25.81,97"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="歩-bg1"  class="badge-group"><circle cx="54.39" cy="10.75" r="3.5" fill="#bf0909"/><text class="num-single" x="54.39" y="10.75" dx="0" dy="-0.5">1</text></g>
<g id="歩-bg2"  class="badge-group"><circle cx="57.65" cy="24.41" r="3.5" fill="#bf9109"/><text class="num-single" x="57.65" y="24.41" dx="0" dy="-0.5">2</text></g>
<g id="歩-bg3"  class="badge-group"><circle cx="32.24" cy="21.98" r="3.5" fill="#64bf09"/><text class="num-single" x="32.24" y="21.98" dx="0" dy="-0.5">3</text></g>
<g id="歩-bg4"  class="badge-group"><circle cx="18" cy="41.5" r="3.5" fill="#09bf36"/><text class="num-single" x="18" y="41.5" dx="0" dy="-0.5">4</text></g>
<g id="歩-bg5"  class="badge-group"><circle cx="56.13" cy="42" r="3.5" fill="#09bfbf"/><text class="num-single" x="56.13" y="42" dx="0" dy="-0.5">5</text></g>
<g id="歩-bg6"  class="badge-group"><circle cx="38.75" cy="50.75" r="3.5" fill="#0936bf"/><text class="num-single" x="38.75" y="50.75" dx="0" dy="-0.5">6</text></g>
<g id="歩-bg7"  class="badge-group"><circle cx="77" cy="45.5" r="3.5" fill="#6409bf"/><text class="num-single" x="77" y="45.5" dx="0" dy="-0.5">7</text></g>
<g id="歩-bg8"  class="badge-group"><circle cx="76.65" cy="55.64" r="3.5" fill="#bf0991"/><text class="num-single" x="76.65" y="55.64" dx="0" dy="-0.5">8</text></g>
</svg>