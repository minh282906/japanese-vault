<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (犯)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #犯-bg[i]: Thời gian quả bóng số nảy lên
   - #犯-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#犯-bg1  { animation-delay: 0.05s; }
#犯-s1   { stroke-dasharray: 34.2117; stroke-dashoffset: 34.2117; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#犯-bg2  { animation-delay: 0.42s; }
#犯-s2   { stroke-dasharray: 84.0973; stroke-dashoffset: 84.0973; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#犯-bg3  { animation-delay: 1.03s; }
#犯-s3   { stroke-dasharray: 32.9939; stroke-dashoffset: 32.9939; animation: drawStroke 0.22s ease-out 1.16s forwards; }
#犯-bg4  { animation-delay: 1.40s; }
#犯-s4   { stroke-dasharray: 80.6081; stroke-dashoffset: 80.6081; animation: drawStroke 0.44s ease-out 1.53s forwards; }
#犯-bg5  { animation-delay: 1.99s; }
#犯-s5   { stroke-dasharray: 108.0060; stroke-dashoffset: 108.0060; animation: drawStroke 0.55s ease-out 2.12s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #犯-s[i]) -->
<path id="犯-s1"  class="stroke" stroke="#bf0909" d="M39.31,17.5C39.440000000000005,18.62,39.120000000000005,19.71,38.510000000000005,20.59C33.43000000000001,27.92,27.250000000000007,33.379999999999995,15.750000000000004,41.29"/>
<path id="犯-s2"  class="stroke" stroke="#9abf09" d="M20.5,20.75C50,35.75,38.25,103,25.25,89.25"/>
<path id="犯-s3"  class="stroke" stroke="#09bf52" d="M34.32,46.75C34.32,47.87,34.1,49.04,33.71,49.67C28.62,57.88,23.75,64.12,14,72.04"/>
<path id="犯-s4"  class="stroke" stroke="#0952bf" d="M51.5,26.75C52.5,27,54.75,27.25,56.75,27S79.78999999999999,22.990000000000002,82.25,22.5C85.37,21.88,87.53,23.79,87,26.5C85.25,35.5,84.25,43.75,79.5,55.75C76.2,64.08,73.12,57.5,72,55.75"/>
<path id="犯-s5"  class="stroke" stroke="#9a09bf" d="M52.74,27.37C53.81,28.44,54,30.36,54.02,32.5C54.120000000000005,42.980000000000004,54.470000000000006,72.07,54.470000000000006,77.16C54.470000000000006,89.75,57.00000000000001,92.53,74.47,92.53C94.75,92.53,96.39,89.51,96.39,82.74000000000001"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="犯-bg1"  class="badge-group"><circle cx="39.31" cy="17.5" r="3.5" fill="#bf0909"/><text class="num-single" x="39.31" y="17.5" dx="0" dy="-0.5">1</text></g>
<g id="犯-bg2"  class="badge-group"><circle cx="20.5" cy="20.75" r="3.5" fill="#9abf09"/><text class="num-single" x="20.5" y="20.75" dx="0" dy="-0.5">2</text></g>
<g id="犯-bg3"  class="badge-group"><circle cx="34.32" cy="46.75" r="3.5" fill="#09bf52"/><text class="num-single" x="34.32" y="46.75" dx="0" dy="-0.5">3</text></g>
<g id="犯-bg4"  class="badge-group"><circle cx="51.5" cy="23.25" r="3.5" fill="#0952bf"/><text class="num-single" x="51.5" y="23.25" dx="0" dy="-0.5">4</text></g>
<g id="犯-bg5"  class="badge-group"><circle cx="52.74" cy="30.87" r="3.5" fill="#9a09bf"/><text class="num-single" x="52.74" y="30.87" dx="0" dy="-0.5">5</text></g>
</svg>