<path id="朝-s4"  class="stroke" stroke="#64bf09" d="M20.76,39.32C28.880000000000003,38,44.75,35.88,49.82,35.49C51.88,35.330000000000005,53.25,36.75,52.97,39.190000000000005C52.45,43.78,51,52.5,50,57.5C49.82,58.39,49.51,60.1,49.51,60.7"/>
<path id="朝-s5"  class="stroke" stroke="#09bf09" d="M22.87,50.38C29.37,49.5,45.870000000000005,47.13,50.53,46.730000000000004"/>
<path id="朝-s6"  class="stroke" stroke="#09bf64" d="M24.51,61C31.37,60.25,41.5,58.75,48.58,58.05"/>
<path id="朝-s7"  class="stroke" stroke="#09bfbf" d="M10.13,75.13C12.25,75.88,15.38,75.91,17.12,75.63C31,73.38,42.55,71.25,52.62,70.5C54.419999999999995,70.37,57.23,70.31,58.129999999999995,70.56"/>
<path id="朝-s8"  class="stroke" stroke="#0964bf" d="M34.65,62C35.76,63.11,36.16,64.5,36.16,65.95C36.16,71.5,36.15,82.17,36.08,90.75C36.059999999999995,92.82,36.05,94.43,36.03,95.25"/>
<path id="朝-s9"  class="stroke" stroke="#0909bf" d="M65.6,20.73C66.5,21.63,67.28,22.98,67.33,24.01C69,59.5,64.75,81.5,54.75,93"/>
<path id="朝-s10"  class="stroke" stroke="#6409bf" d="M67.86,21.83C73.65,20.81,87.34,18.29,88.69,18C91.00999999999999,17.5,93.27,18.62,93.27,21.29C93.27,23.75,93.16,71.25,93.16,91.69999999999999C93.16,102.49999999999999,86.75,93.49999999999999,84.72,91.46999999999998"/>
<path id="朝-s11"  class="stroke" stroke="#bf09bf" d="M69.05,40.67C75.5,39.75,85,38.75,91.84,37.940000000000005"/>
<path id="朝-s12"  class="stroke" stroke="#bf0964" d="M67.66,60.85C74.19,60.09,84.38,59.13,91.92999999999999,58.620000000000005"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="朝-bg1"  class="badge-group"><circle cx="16.88" cy="27.13" r="3.5" fill="#bf0909"/><text class="num-single" x="16.88" y="27.13" dx="0" dy="-0.5">1</text></g>
