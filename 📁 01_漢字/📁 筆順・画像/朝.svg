<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (朝)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #朝-bg[i]: Thời gian quả bóng số nảy lên
   - #朝-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#朝-bg1  { animation-delay: 0.05s; }
#朝-s1   { stroke-dasharray: 36.5584; stroke-dashoffset: 36.5584; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#朝-bg2  { animation-delay: 0.42s; }
#朝-s2   { stroke-dasharray: 24.7568; stroke-dashoffset: 24.7568; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#朝-bg3  { animation-delay: 0.79s; }
#朝-s3   { stroke-dasharray: 25.8497; stroke-dashoffset: 25.8497; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#朝-bg4  { animation-delay: 1.16s; }
#朝-s4   { stroke-dasharray: 56.8081; stroke-dashoffset: 56.8081; animation: drawStroke 0.31s ease-out 1.29s forwards; }
#朝-bg5  { animation-delay: 1.62s; }
#朝-s5   { stroke-dasharray: 27.9011; stroke-dashoffset: 27.9011; animation: drawStroke 0.22s ease-out 1.75s forwards; }
#朝-bg6  { animation-delay: 1.99s; }
#朝-s6   { stroke-dasharray: 24.2508; stroke-dashoffset: 24.2508; animation: drawStroke 0.22s ease-out 2.12s forwards; }
#朝-bg7  { animation-delay: 2.36s; }
#朝-s7   { stroke-dasharray: 48.4695; stroke-dashoffset: 48.4695; animation: drawStroke 0.27s ease-out 2.49s forwards; }
#朝-bg8  { animation-delay: 2.78s; }
#朝-s8   { stroke-dasharray: 33.6464; stroke-dashoffset: 33.6464; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#朝-bg9  { animation-delay: 3.15s; }
#朝-s9   { stroke-dasharray: 75.3656; stroke-dashoffset: 75.3656; animation: drawStroke 0.41s ease-out 3.28s forwards; }
#朝-bg10  { animation-delay: 3.71s; }
#朝-s10   { stroke-dasharray: 112.8620; stroke-dashoffset: 112.8620; animation: drawStroke 0.55s ease-out 3.84s forwards; }
#朝-bg11  { animation-delay: 4.41s; }
#朝-s11   { stroke-dasharray: 22.9535; stroke-dashoffset: 22.9535; animation: drawStroke 0.22s ease-out 4.54s forwards; }
#朝-bg12  { animation-delay: 4.78s; }
#朝-s12   { stroke-dasharray: 24.3741; stroke-dashoffset: 24.3741; animation: drawStroke 0.22s ease-out 4.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #朝-s[i]) -->
<path id="朝-s1"  class="stroke" stroke="#bf0909" d="M16.88,27.13C18.75,27.5,21.22,27.47,22.5,27.25C29.85,26.02,40.879999999999995,24.39,47.239999999999995,23.88C48.839999999999996,23.75,51.56999999999999,23.2,53.129999999999995,23.81"/>
