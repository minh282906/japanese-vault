<path id="望-s9"  class="stroke" stroke="#4b09bf" d="M52.62,64.22C53.64,65.24,54.05,66.37,54.05,67.76C54.05,73.68,54.279999999999994,85.63000000000001,54.279999999999994,92.48"/>
<path id="望-s10"  class="stroke" stroke="#ae09bf" d="M34.04,79.21C35.04,79.69,38.33,79.52999999999999,39.35,79.41999999999999C48.12,78.5,58,77.5,68.22,76.78C69.47,76.69,72.21,76.58,74.07,77.01"/>
<path id="望-s11"  class="stroke" stroke="#bf096c" d="M19.25,94.59C22.5,95.25,25.96,95.10000000000001,29.02,94.92C43.4,94.10000000000001,65.05,92.84,80.88,92.34C84.67,92.22,89.25999999999999,92.25,92.50999999999999,93.08"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
