<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (望)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #望-bg[i]: Thời gian quả bóng số nảy lên
   - #望-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#望-bg1  { animation-delay: 0.05s; }
#望-s1   { stroke-dasharray: 13.6530; stroke-dashoffset: 13.6530; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#望-bg2  { animation-delay: 0.42s; }
#望-s2   { stroke-dasharray: 43.1379; stroke-dashoffset: 43.1379; animation: drawStroke 0.24s ease-out 0.55s forwards; }
#望-bg3  { animation-delay: 0.81s; }
#望-s3   { stroke-dasharray: 45.5111; stroke-dashoffset: 45.5111; animation: drawStroke 0.25s ease-out 0.94s forwards; }
#望-bg4  { animation-delay: 1.21s; }
#望-s4   { stroke-dasharray: 43.4584; stroke-dashoffset: 43.4584; animation: drawStroke 0.24s ease-out 1.34s forwards; }
#望-bg5  { animation-delay: 1.60s; }
#望-s5   { stroke-dasharray: 74.1249; stroke-dashoffset: 74.1249; animation: drawStroke 0.41s ease-out 1.73s forwards; }
#望-bg6  { animation-delay: 2.16s; }
#望-s6   { stroke-dasharray: 24.1057; stroke-dashoffset: 24.1057; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#望-bg7  { animation-delay: 2.53s; }
#望-s7   { stroke-dasharray: 24.8326; stroke-dashoffset: 24.8326; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#望-bg8  { animation-delay: 2.90s; }
#望-s8   { stroke-dasharray: 46.0611; stroke-dashoffset: 46.0611; animation: drawStroke 0.25s ease-out 3.03s forwards; }
#望-bg9  { animation-delay: 3.30s; }
#望-s9   { stroke-dasharray: 28.6506; stroke-dashoffset: 28.6506; animation: drawStroke 0.22s ease-out 3.43s forwards; }
#望-bg10  { animation-delay: 3.67s; }
#望-s10   { stroke-dasharray: 40.2135; stroke-dashoffset: 40.2135; animation: drawStroke 0.22s ease-out 3.80s forwards; }
#望-bg11  { animation-delay: 4.04s; }
#望-s11   { stroke-dasharray: 73.4168; stroke-dashoffset: 73.4168; animation: drawStroke 0.40s ease-out 4.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

