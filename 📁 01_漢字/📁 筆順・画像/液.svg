<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (液)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #液-bg[i]: Thời gian quả bóng số nảy lên
   - #液-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#液-bg1  { animation-delay: 0.05s; }
#液-s1   { stroke-dasharray: 12.0860; stroke-dashoffset: 12.0860; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#液-bg2  { animation-delay: 0.42s; }
#液-s2   { stroke-dasharray: 12.7128; stroke-dashoffset: 12.7128; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#液-bg3  { animation-delay: 0.79s; }
#液-s3   { stroke-dasharray: 21.9243; stroke-dashoffset: 21.9243; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#液-bg4  { animation-delay: 1.16s; }
#液-s4   { stroke-dasharray: 12.3880; stroke-dashoffset: 12.3880; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#液-bg5  { animation-delay: 1.53s; }
#液-s5   { stroke-dasharray: 57.4927; stroke-dashoffset: 57.4927; animation: drawStroke 0.32s ease-out 1.66s forwards; }
#液-bg6  { animation-delay: 2.00s; }
#液-s6   { stroke-dasharray: 37.9462; stroke-dashoffset: 37.9462; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#液-bg7  { animation-delay: 2.37s; }
#液-s7   { stroke-dasharray: 38.0342; stroke-dashoffset: 38.0342; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#液-bg8  { animation-delay: 2.74s; }
#液-s8   { stroke-dasharray: 30.8127; stroke-dashoffset: 30.8127; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#液-bg9  { animation-delay: 3.11s; }
#液-s9   { stroke-dasharray: 72.5463; stroke-dashoffset: 72.5463; animation: drawStroke 0.40s ease-out 3.24s forwards; }
#液-bg10  { animation-delay: 3.66s; }
#液-s10   { stroke-dasharray: 10.7325; stroke-dashoffset: 10.7325; animation: drawStroke 0.22s ease-out 3.79s forwards; }
#液-bg11  { animation-delay: 4.03s; }
#液-s11   { stroke-dasharray: 47.2225; stroke-dashoffset: 47.2225; animation: drawStroke 0.26s ease-out 4.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #液-s[i]) -->
<path id="液-s1"  class="stroke" stroke="#bf0909" d="M19.88,18.25C23.189999999999998,19.72,28.419999999999998,23.3,29.25,25.59"/>
<path id="液-s2"  class="stroke" stroke="#bf6c09" d="M15.75,41C19.54,42.15,25.55,45.72,26.5,47.5"/>
