<path id="液-s5"  class="stroke" stroke="#09bf2a" d="M35.83,31.12C39.17,31.39,41.9,31.51,45.26,31.080000000000002C55.43,29.770000000000003,73.25999999999999,27.28,84.74,26.6C87.42,26.44,90.39999999999999,26.020000000000003,92.94999999999999,27.080000000000002"/>
<path id="液-s6"  class="stroke" stroke="#09bf8d" d="M49.48,37.32C49.87,38.62,49.68,40.39,49.08,41.72C45.28,50.17,39.96,59.599999999999994,31.25,69.88"/>
<path id="液-s7"  class="stroke" stroke="#098dbf" d="M42.63,56.59C43.46,57.42,43.82,58.550000000000004,43.82,59.480000000000004C43.82,64.5,43.89,79.25,43.92,89.12C43.92,91.08,43.93,92.85000000000001,43.93,94.31"/>
<path id="液-s8"  class="stroke" stroke="#092abf" d="M68.13,34.46C68.36999999999999,35.5,68.19,36.28,67.99,37.19C66.81,42.56,61.75,52,53.42,60.85"/>
<path id="液-s9"  class="stroke" stroke="#4b09bf" d="M69.48,42.65C70.37,42.75,70.94,42.61,71.75,42.5C74.71,42.09,77.48,41.19,80.67,39.92C83.2,38.92,84.38,40,83.34,42.92C77.56,59.16,67.88,75.25,51.71000000000001,86.89"/>
<path id="液-s10"  class="stroke" stroke="#ae09bf" d="M65.34,51.55C68.45,52.8,72.13000000000001,55.75,73.64,58.14"/>
<path id="液-s11"  class="stroke" stroke="#bf096c" d="M56.38,64.12C60,64,82.52,86.12,89.02,89.89C90.86999999999999,90.96,92.25999999999999,91.77,94,92.14"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="液-bg1"  class="badge-group"><circle cx="19.88" cy="18.25" r="3.5" fill="#bf0909"/><text class="num-single" x="19.88" y="18.25" dx="0" dy="-0.5">1</text></g>
<g id="液-bg2"  class="badge-group"><circle cx="15.75" cy="41" r="3.5" fill="#bf6c09"/><text class="num-single" x="15.75" y="41" dx="0" dy="-0.5">2</text></g>
