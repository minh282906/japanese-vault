<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (机)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #机-bg[i]: Thời gian quả bóng số nảy lên
   - #机-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#机-bg1  { animation-delay: 0.05s; }
#机-s1   { stroke-dasharray: 33.7474; stroke-dashoffset: 33.7474; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#机-bg2  { animation-delay: 0.42s; }
#机-s2   { stroke-dasharray: 81.6198; stroke-dashoffset: 81.6198; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#机-bg3  { animation-delay: 1.02s; }
#机-s3   { stroke-dasharray: 40.5247; stroke-dashoffset: 40.5247; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#机-bg4  { animation-delay: 1.39s; }
#机-s4   { stroke-dasharray: 13.0608; stroke-dashoffset: 13.0608; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#机-bg5  { animation-delay: 1.76s; }
#机-s5   { stroke-dasharray: 70.6514; stroke-dashoffset: 70.6514; animation: drawStroke 0.39s ease-out 1.89s forwards; }
#机-bg6  { animation-delay: 2.30s; }
#机-s6   { stroke-dasharray: 111.3410; stroke-dashoffset: 111.3410; animation: drawStroke 0.55s ease-out 2.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #机-s[i]) -->
<path id="机-s1"  class="stroke" stroke="#bf0909" d="M12.03,37.72C13.879999999999999,38.129999999999995,15.92,38.12,17.169999999999998,38.08C22.63,37.879999999999995,34.87,36.21,40.78,35.1C42.63,34.75,44.01,34.63,45.52,34.870000000000005"/>
<path id="机-s2"  class="stroke" stroke="#bfbf09" d="M30.86,14.5C31.99,15.629999999999999,32.4,17.38,32.4,19.42C32.4,25.6,32.42,70.15,32.36,89.25C32.35,92.03,32.35,94.26,32.35,95.75"/>
<path id="机-s3"  class="stroke" stroke="#09bf09" d="M31.44,38.28C31.44,40,31,42.58,30.51,43.75C25.130000000000003,56.75,20.380000000000003,64.5,13.360000000000003,74.09"/>
<path id="机-s4"  class="stroke" stroke="#09bfbf" d="M34.97,49.4C37.699999999999996,50.83,42.19,55.48,44.5,58.25"/>
<path id="机-s5"  class="stroke" stroke="#0909bf" d="M54,25.51C55.06,26.57,55.39,28.25,55.38,30.03C55.25,58.5,55,76,41,92.65"/>
<path id="机-s6"  class="stroke" stroke="#bf09bf" d="M56.15,27.94C63.37,26.5,68.03999999999999,25.57,72.32,24.84C77.25,24,77.94,26.03,77.41,29.67C75.11999999999999,45.5,73.95,65.13,73.95,81.5C73.95,87,75.75,89.44,85.28,89.44C95.5,89.44,96.27,87.5,96.27,80.06"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="机-bg1"  class="badge-group"><circle cx="12.03" cy="37.72" r="3.5" fill="#bf0909"/><text class="num-single" x="12.03" y="37.72" dx="0" dy="-0.5">1</text></g>
<g id="机-bg2"  class="badge-group"><circle cx="30.86" cy="14.5" r="3.5" fill="#bfbf09"/><text class="num-single" x="30.86" y="14.5" dx="0" dy="-0.5">2</text></g>
<g id="机-bg3"  class="badge-group"><circle cx="31.44" cy="38.28" r="3.5" fill="#09bf09"/><text class="num-single" x="31.44" y="38.28" dx="0" dy="-0.5">3</text></g>
<g id="机-bg4"  class="badge-group"><circle cx="34.97" cy="49.4" r="3.5" fill="#09bfbf"/><text class="num-single" x="34.97" y="49.4" dx="0" dy="-0.5">4</text></g>
<g id="机-bg5"  class="badge-group"><circle cx="54" cy="22.01" r="3.5" fill="#0909bf"/><text class="num-single" x="54" y="22.01" dx="0" dy="-0.5">5</text></g>
<g id="机-bg6"  class="badge-group"><circle cx="56.15" cy="31.44" r="3.5" fill="#bf09bf"/><text class="num-single" x="56.15" y="31.44" dx="0" dy="-0.5">6</text></g>
</svg>