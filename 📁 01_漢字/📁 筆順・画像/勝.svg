<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (勝)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #勝-bg[i]: Thời gian quả bóng số nảy lên
   - #勝-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#勝-bg1  { animation-delay: 0.05s; }
#勝-s1   { stroke-dasharray: 73.3411; stroke-dashoffset: 73.3411; animation: drawStroke 0.40s ease-out 0.18s forwards; }
#勝-bg2  { animation-delay: 0.60s; }
#勝-s2   { stroke-dasharray: 100.6680; stroke-dashoffset: 100.6680; animation: drawStroke 0.55s ease-out 0.73s forwards; }
#勝-bg3  { animation-delay: 1.30s; }
#勝-s3   { stroke-dasharray: 16.5596; stroke-dashoffset: 16.5596; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#勝-bg4  { animation-delay: 1.67s; }
#勝-s4   { stroke-dasharray: 16.7389; stroke-dashoffset: 16.7389; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#勝-bg5  { animation-delay: 2.04s; }
#勝-s5   { stroke-dasharray: 14.4262; stroke-dashoffset: 14.4262; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#勝-bg6  { animation-delay: 2.41s; }
#勝-s6   { stroke-dasharray: 15.4556; stroke-dashoffset: 15.4556; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#勝-bg7  { animation-delay: 2.78s; }
#勝-s7   { stroke-dasharray: 33.9512; stroke-dashoffset: 33.9512; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#勝-bg8  { animation-delay: 3.15s; }
#勝-s8   { stroke-dasharray: 48.7845; stroke-dashoffset: 48.7845; animation: drawStroke 0.27s ease-out 3.28s forwards; }
#勝-bg9  { animation-delay: 3.57s; }
#勝-s9   { stroke-dasharray: 63.5646; stroke-dashoffset: 63.5646; animation: drawStroke 0.35s ease-out 3.70s forwards; }
#勝-bg10  { animation-delay: 4.07s; }
#勝-s10   { stroke-dasharray: 36.4977; stroke-dashoffset: 36.4977; animation: drawStroke 0.22s ease-out 4.20s forwards; }
#勝-bg11  { animation-delay: 4.44s; }
#勝-s11   { stroke-dasharray: 67.3121; stroke-dashoffset: 67.3121; animation: drawStroke 0.37s ease-out 4.57s forwards; }
#勝-bg12  { animation-delay: 4.96s; }
#勝-s12   { stroke-dasharray: 45.3955; stroke-dashoffset: 45.3955; animation: drawStroke 0.25s ease-out 5.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #勝-s[i]) -->
<path id="勝-s1"  class="stroke" stroke="#bf0909" d="M15.48,20.8C16.34,21.66,16.82,23,16.88,24.72C18.13,58.5,14.879999999999999,85.25,8.249999999999998,92.35"/>
