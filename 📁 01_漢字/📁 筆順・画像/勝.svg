<path id="勝-s6"  class="stroke" stroke="#09bf64" d="M85.53,17.89C85.63,18.68,85.5,19.42,85.13,20.11C83.83999999999999,23.08,80.64999999999999,26.419999999999998,76.31,29.71"/>
<path id="勝-s7"  class="stroke" stroke="#09bfbf" d="M48.5,37.39C50.88,37.88,52.91,37.71,54.88,37.480000000000004C60.93,36.760000000000005,70.18,35.49,76.51,35.02C78.33,34.88,80.47,34.830000000000005,82.25,35.27"/>
<path id="勝-s8"  class="stroke" stroke="#0964bf" d="M43,50.14C45.62,50.5,47.71,50.4,49.88,50.13C58.150000000000006,49.09,75.88,47.13,84.61,46.2C86.85,45.96,89.28999999999999,45.980000000000004,91.5,46.52"/>
<path id="勝-s9"  class="stroke" stroke="#0909bf" d="M65.88,12.25C66.75,13.12,67.21,14.32,67.24,16.2C67.5,32.25,58.87,58.370000000000005,42.75,67.75"/>
<path id="勝-s10"  class="stroke" stroke="#6409bf" d="M69.43,41.98C73.04,46.3,88.58000000000001,60.4,92.56,63.56999999999999C93.91,64.63999999999999,95.64,65.1,96.99000000000001,65.41"/>
<path id="勝-s11"  class="stroke" stroke="#bf09bf" d="M49.86,70.76C51.14,71.28,52.82,71.34,54.12,71.22C59.9,70.67999999999999,73.37,68,79.14,66.73C82.06,66.09,83.56,67.27000000000001,83.15,70.26C82.43,75.57000000000001,79,87.37,75.57000000000001,92.08000000000001C73.61000000000001,94.77000000000001,72.38000000000001,94.99000000000001,69.75,91.73000000000002"/>
<path id="勝-s12"  class="stroke" stroke="#bf0964" d="M66.67,56.18C67.25,57.38,67.2,58.55,67.05,59.75C65.88,69.25,58.629999999999995,88,46.33,94.53999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="勝-bg1"  class="badge-group"><circle cx="15.48" cy="17.3" r="3.5" fill="#bf0909"/><text class="num-single" x="15.48" y="17.3" dx="0" dy="-0.5">1</text></g>
