<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (歴)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #歴-bg[i]: Thời gian quả bóng số nảy lên
   - #歴-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#歴-bg1  { animation-delay: 0.05s; }
#歴-s1   { stroke-dasharray: 66.2114; stroke-dashoffset: 66.2114; animation: drawStroke 0.36s ease-out 0.18s forwards; }
#歴-bg2  { animation-delay: 0.56s; }
#歴-s2   { stroke-dasharray: 76.7137; stroke-dashoffset: 76.7137; animation: drawStroke 0.42s ease-out 0.69s forwards; }
#歴-bg3  { animation-delay: 1.13s; }
#歴-s3   { stroke-dasharray: 26.0244; stroke-dashoffset: 26.0244; animation: drawStroke 0.22s ease-out 1.26s forwards; }
#歴-bg4  { animation-delay: 1.50s; }
#歴-s4   { stroke-dasharray: 38.1952; stroke-dashoffset: 38.1952; animation: drawStroke 0.22s ease-out 1.63s forwards; }
#歴-bg5  { animation-delay: 1.87s; }
#歴-s5   { stroke-dasharray: 24.5948; stroke-dashoffset: 24.5948; animation: drawStroke 0.22s ease-out 2.00s forwards; }
#歴-bg6  { animation-delay: 2.24s; }
#歴-s6   { stroke-dasharray: 8.3962; stroke-dashoffset: 8.3962; animation: drawStroke 0.22s ease-out 2.37s forwards; }
#歴-bg7  { animation-delay: 2.61s; }
#歴-s7   { stroke-dasharray: 26.7970; stroke-dashoffset: 26.7970; animation: drawStroke 0.22s ease-out 2.74s forwards; }
#歴-bg8  { animation-delay: 2.98s; }
#歴-s8   { stroke-dasharray: 38.7838; stroke-dashoffset: 38.7838; animation: drawStroke 0.22s ease-out 3.11s forwards; }
#歴-bg9  { animation-delay: 3.35s; }
#歴-s9   { stroke-dasharray: 27.3621; stroke-dashoffset: 27.3621; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#歴-bg10  { animation-delay: 3.72s; }
#歴-s10   { stroke-dasharray: 31.4670; stroke-dashoffset: 31.4670; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#歴-bg11  { animation-delay: 4.09s; }
#歴-s11   { stroke-dasharray: 26.8948; stroke-dashoffset: 26.8948; animation: drawStroke 0.22s ease-out 4.22s forwards; }
#歴-bg12  { animation-delay: 4.46s; }
#歴-s12   { stroke-dasharray: 20.9550; stroke-dashoffset: 20.9550; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#歴-bg13  { animation-delay: 4.83s; }
#歴-s13   { stroke-dasharray: 19.5951; stroke-dashoffset: 19.5951; animation: drawStroke 0.22s ease-out 4.96s forwards; }
#歴-bg14  { animation-delay: 5.20s; }
#歴-s14   { stroke-dasharray: 68.0974; stroke-dashoffset: 68.0974; animation: drawStroke 0.37s ease-out 5.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

