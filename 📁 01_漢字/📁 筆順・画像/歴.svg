<path id="歴-s8"  class="stroke" stroke="#09bfbf" d="M71.09,21.75C71.86,22.52,72.25,23.63,72.25,24.98C72.25,29.630000000000003,72.29,46.82,72.31,55.620000000000005C72.31,57.75000000000001,72.32000000000001,59.39000000000001,72.32000000000001,60.24"/>
<path id="歴-s9"  class="stroke" stroke="#0971bf" d="M71.38,34.75C71.38,35.87,70.94,37.54,70.5,38.48C67.3,45.22,60.75,53.25,55.72,56.459999999999994"/>
<path id="歴-s10"  class="stroke" stroke="#0923bf" d="M72.88,34.88C77.72,41.38,85.08,49.47,89.92999999999999,53.47C91.41,54.69,93.22999999999999,56.25,95.13,56.75"/>
<path id="歴-s11"  class="stroke" stroke="#3d09bf" d="M56.87,63.5C57.75,64.38,58.3,65.5,58.3,66.78C58.3,67.66,58.36,83.5,58.36,90"/>
<path id="歴-s12"  class="stroke" stroke="#8b09bf" d="M59.27,75.43C65.36,74.79,70.89,73.79,77.30000000000001,73.36000000000001C78.79,73.26000000000002,79.16000000000001,73.15000000000002,80.09000000000002,73.36000000000001"/>
