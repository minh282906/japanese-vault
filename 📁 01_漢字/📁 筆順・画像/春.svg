<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (春)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #春-bg[i]: Thời gian quả bóng số nảy lên
   - #春-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#春-bg1  { animation-delay: 0.05s; }
#春-s1   { stroke-dasharray: 48.2558; stroke-dashoffset: 48.2558; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#春-bg2  { animation-delay: 0.47s; }
#春-s2   { stroke-dasharray: 46.9839; stroke-dashoffset: 46.9839; animation: drawStroke 0.26s ease-out 0.60s forwards; }
#春-bg3  { animation-delay: 0.88s; }
#春-s3   { stroke-dasharray: 73.4369; stroke-dashoffset: 73.4369; animation: drawStroke 0.40s ease-out 1.01s forwards; }
#春-bg4  { animation-delay: 1.43s; }
#春-s4   { stroke-dasharray: 84.2306; stroke-dashoffset: 84.2306; animation: drawStroke 0.46s ease-out 1.56s forwards; }
#春-bg5  { animation-delay: 2.04s; }
#春-s5   { stroke-dasharray: 56.6858; stroke-dashoffset: 56.6858; animation: drawStroke 0.31s ease-out 2.17s forwards; }
#春-bg6  { animation-delay: 2.50s; }
#春-s6   { stroke-dasharray: 35.8378; stroke-dashoffset: 35.8378; animation: drawStroke 0.22s ease-out 2.63s forwards; }
#春-bg7  { animation-delay: 2.87s; }
#春-s7   { stroke-dasharray: 63.4596; stroke-dashoffset: 63.4596; animation: drawStroke 0.35s ease-out 3.00s forwards; }
#春-bg8  { animation-delay: 3.37s; }
#春-s8   { stroke-dasharray: 27.3178; stroke-dashoffset: 27.3178; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#春-bg9  { animation-delay: 3.74s; }
#春-s9   { stroke-dasharray: 27.5309; stroke-dashoffset: 27.5309; animation: drawStroke 0.22s ease-out 3.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #春-s[i]) -->
<path id="春-s1"  class="stroke" stroke="#bf0909" d="M28.31,25.18C29.77,25.55,32.46,25.68,33.92,25.55C46.75,24.37,56.25,23.25,70.21000000000001,22.04C72.64000000000001,21.83,74.50000000000001,22,76.33000000000001,22.4"/>
<path id="春-s2"  class="stroke" stroke="#bf8209" d="M28.5,38.67C30.04,39.050000000000004,32.61,38.97,34.15,38.800000000000004C45.75,37.50000000000001,56.379999999999995,35.88,69.28,34.42C71.98,34.11,74,34.260000000000005,75.16,34.54"/>
<path id="春-s3"  class="stroke" stroke="#82bf09" d="M15.38,53.48C18.47,54.54,21.84,54.199999999999996,25,53.75C45.129999999999995,50.88,61.38,48,79.15,45.96C82.18,45.61,85.12,45.59,88.13000000000001,46.07"/>
<path id="春-s4"  class="stroke" stroke="#09bf09" d="M52.75,11.25C53.75,12.75,53.77,14.78,53.29,17.15C50.12,32.62,39.5,68,12.5,80.75"/>
<path id="春-s5"  class="stroke" stroke="#09bf82" d="M53.25,41.25C55.54,41.4,82.85,69.33,89.24000000000001,74.15C91.45,75.82000000000001,94.29,76.53,96.50000000000001,77"/>
<path id="春-s6"  class="stroke" stroke="#0982bf" d="M37.77,64.94C38.6,65.77,39.050000000000004,66.87,39.050000000000004,67.91C39.050000000000004,68.78,38.870000000000005,90.07,38.81,97.75C38.800000000000004,99.34,38.79,100.34,38.79,100.43"/>
<path id="春-s7"  class="stroke" stroke="#0909bf" d="M39.76,67.17C46.699999999999996,66.31,64.02,63.620000000000005,65.61,63.49C67.28,63.36,68.72,64.87,68.72,66.21000000000001C68.72,67.47000000000001,68.56,86.86000000000001,68.48,95.25C68.46000000000001,97.41,68.45,98.82,68.45,98.98"/>
<path id="春-s8"  class="stroke" stroke="#8209bf" d="M40.08,80.98C44.62,80.63000000000001,63.12,79,67.3,78.67"/>
<path id="春-s9"  class="stroke" stroke="#bf0982" d="M40.08,96.98C44.37,96.75,62.87,95.25,67.55,95.17"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="春-bg1"  class="badge-group"><circle cx="28.31" cy="25.18" r="3.5" fill="#bf0909"/><text class="num-single" x="28.31" y="25.18" dx="0" dy="-0.5">1</text></g>
<g id="春-bg2"  class="badge-group"><circle cx="28.5" cy="38.67" r="3.5" fill="#bf8209"/><text class="num-single" x="28.5" y="38.67" dx="0" dy="-0.5">2</text></g>
<g id="春-bg3"  class="badge-group"><circle cx="15.38" cy="53.48" r="3.5" fill="#82bf09"/><text class="num-single" x="15.38" y="53.48" dx="0" dy="-0.5">3</text></g>
<g id="春-bg4"  class="badge-group"><circle cx="52.75" cy="11.25" r="3.5" fill="#09bf09"/><text class="num-single" x="52.75" y="11.25" dx="0" dy="-0.5">4</text></g>
<g id="春-bg5"  class="badge-group"><circle cx="53.25" cy="41.25" r="3.5" fill="#09bf82"/><text class="num-single" x="53.25" y="41.25" dx="0" dy="-0.5">5</text></g>
<g id="春-bg6"  class="badge-group"><circle cx="37.77" cy="61.44" r="3.5" fill="#0982bf"/><text class="num-single" x="37.77" y="61.44" dx="0" dy="-0.5">6</text></g>
<g id="春-bg7"  class="badge-group"><circle cx="39.76" cy="70.67" r="3.5" fill="#0909bf"/><text class="num-single" x="39.76" y="70.67" dx="0" dy="-0.5">7</text></g>
<g id="春-bg8"  class="badge-group"><circle cx="40.08" cy="80.98" r="3.5" fill="#8209bf"/><text class="num-single" x="40.08" y="80.98" dx="0" dy="-0.5">8</text></g>
<g id="春-bg9"  class="badge-group"><circle cx="40.08" cy="96.98" r="3.5" fill="#bf0982"/><text class="num-single" x="40.08" y="96.98" dx="0" dy="-0.5">9</text></g>
</svg>