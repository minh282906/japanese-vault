<path id="問-s6"  class="stroke" stroke="#09bf8d" d="M66.55,14.16C72.37,13.13,81.03999999999999,11.870000000000001,86.12,11.21C88.79,10.860000000000001,90.97,12,90.97,14.13C90.97,34.26,91.01,77.89,91.01,91.69C91.01,100.38,85.5,95.25,81.11,91.05"/>
<path id="問-s7"  class="stroke" stroke="#098dbf" d="M67.24,25.22C73.86999999999999,24.38,84.61999999999999,23.38,89.38999999999999,22.979999999999997"/>
<path id="問-s8"  class="stroke" stroke="#092abf" d="M67.05,36.76C73.25,36.25,82.5,35.25,89.6,34.699999999999996"/>
<path id="問-s9"  class="stroke" stroke="#4b09bf" d="M36.25,57.11C37.13,57.75,37.87,58.87,38.12,60.03C39.04,64.38,39.96,71.06,40.73,77.1C40.879999999999995,78.27,41.019999999999996,79.41,41.16,80.50999999999999"/>
<path id="問-s10"  class="stroke" stroke="#ae09bf" d="M38.71,59.66C47.82,58.629999999999995,60.16,57.339999999999996,66.03999999999999,56.68C69.38,56.31,70.8,57.58,70.05,61.05C69.14999999999999,65.22,68.32,69.14999999999999,66.46,75.28"/>
<path id="問-s11"  class="stroke" stroke="#bf096c" d="M42.01,78.52C46.48,78,57.75,77.07,65.12,76.44C66.41000000000001,76.33,67.58,76.22,68.58,76.13"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="問-bg1"  class="badge-group"><circle cx="18.39" cy="11.54" r="3.5" fill="#bf0909"/><text class="num-single" x="18.39" y="11.54" dx="0" dy="-0.5">1</text></g>
<g id="問-bg2"  class="badge-group"><circle cx="20.52" cy="20.41" r="3.5" fill="#bf6c09"/><text class="num-single" x="20.52" y="20.41" dx="0" dy="-0.5">2</text></g>
