<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (問)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #問-bg[i]: Thời gian quả bóng số nảy lên
   - #問-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#問-bg1  { animation-delay: 0.05s; }
#問-s1   { stroke-dasharray: 84.0949; stroke-dashoffset: 84.0949; animation: drawStroke 0.46s ease-out 0.18s forwards; }
#問-bg2  { animation-delay: 0.66s; }
#問-s2   { stroke-dasharray: 52.3354; stroke-dashoffset: 52.3354; animation: drawStroke 0.29s ease-out 0.79s forwards; }
#問-bg3  { animation-delay: 1.10s; }
#問-s3   { stroke-dasharray: 21.5746; stroke-dashoffset: 21.5746; animation: drawStroke 0.22s ease-out 1.23s forwards; }
#問-bg4  { animation-delay: 1.47s; }
#問-s4   { stroke-dasharray: 20.4526; stroke-dashoffset: 20.4526; animation: drawStroke 0.22s ease-out 1.60s forwards; }
#問-bg5  { animation-delay: 1.84s; }
#問-s5   { stroke-dasharray: 28.0101; stroke-dashoffset: 28.0101; animation: drawStroke 0.22s ease-out 1.97s forwards; }
#問-bg6  { animation-delay: 2.21s; }
#問-s6   { stroke-dasharray: 119.1320; stroke-dashoffset: 119.1320; animation: drawStroke 0.55s ease-out 2.34s forwards; }
#問-bg7  { animation-delay: 2.91s; }
#問-s7   { stroke-dasharray: 22.2642; stroke-dashoffset: 22.2642; animation: drawStroke 0.22s ease-out 3.04s forwards; }
#問-bg8  { animation-delay: 3.28s; }
#問-s8   { stroke-dasharray: 22.6442; stroke-dashoffset: 22.6442; animation: drawStroke 0.22s ease-out 3.41s forwards; }
#問-bg9  { animation-delay: 3.65s; }
#問-s9   { stroke-dasharray: 24.2490; stroke-dashoffset: 24.2490; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#問-bg10  { animation-delay: 4.02s; }
#問-s10   { stroke-dasharray: 49.7152; stroke-dashoffset: 49.7152; animation: drawStroke 0.27s ease-out 4.15s forwards; }
#問-bg11  { animation-delay: 4.44s; }
#問-s11   { stroke-dasharray: 26.6778; stroke-dashoffset: 26.6778; animation: drawStroke 0.22s ease-out 4.57s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #問-s[i]) -->
<path id="問-s1"  class="stroke" stroke="#bf0909" d="M18.39,15.04C19.61,16.259999999999998,20.32,18.16,20.32,19.96C20.32,20.85,20.330000000000002,69.96000000000001,20.330000000000002,90.63C20.330000000000002,94.39999999999999,20.330000000000002,97.22999999999999,20.330000000000002,98.64"/>
