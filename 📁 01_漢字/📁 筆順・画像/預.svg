<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (預)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #預-bg[i]: Thời gian quả bóng số nảy lên
   - #預-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#預-bg1  { animation-delay: 0.05s; }
#預-s1   { stroke-dasharray: 49.0884; stroke-dashoffset: 49.0884; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#預-bg2  { animation-delay: 0.47s; }
#預-s2   { stroke-dasharray: 12.5388; stroke-dashoffset: 12.5388; animation: drawStroke 0.22s ease-out 0.60s forwards; }
#預-bg3  { animation-delay: 0.84s; }
#預-s3   { stroke-dasharray: 52.4945; stroke-dashoffset: 52.4945; animation: drawStroke 0.29s ease-out 0.97s forwards; }
#預-bg4  { animation-delay: 1.28s; }
#預-s4   { stroke-dasharray: 60.9070; stroke-dashoffset: 60.9070; animation: drawStroke 0.33s ease-out 1.41s forwards; }
#預-bg5  { animation-delay: 1.76s; }
#預-s5   { stroke-dasharray: 41.1870; stroke-dashoffset: 41.1870; animation: drawStroke 0.23s ease-out 1.89s forwards; }
#預-bg6  { animation-delay: 2.14s; }
#預-s6   { stroke-dasharray: 14.9572; stroke-dashoffset: 14.9572; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#預-bg7  { animation-delay: 2.51s; }
#預-s7   { stroke-dasharray: 43.4248; stroke-dashoffset: 43.4248; animation: drawStroke 0.24s ease-out 2.64s forwards; }
#預-bg8  { animation-delay: 2.90s; }
#預-s8   { stroke-dasharray: 70.8706; stroke-dashoffset: 70.8706; animation: drawStroke 0.39s ease-out 3.03s forwards; }
#預-bg9  { animation-delay: 3.44s; }
#預-s9   { stroke-dasharray: 28.4590; stroke-dashoffset: 28.4590; animation: drawStroke 0.22s ease-out 3.57s forwards; }
#預-bg10  { animation-delay: 3.81s; }
#預-s10   { stroke-dasharray: 28.6293; stroke-dashoffset: 28.6293; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#預-bg11  { animation-delay: 4.18s; }
#預-s11   { stroke-dasharray: 29.0959; stroke-dashoffset: 29.0959; animation: drawStroke 0.22s ease-out 4.31s forwards; }
#預-bg12  { animation-delay: 4.55s; }
#預-s12   { stroke-dasharray: 23.0100; stroke-dashoffset: 23.0100; animation: drawStroke 0.22s ease-out 4.68s forwards; }
#預-bg13  { animation-delay: 4.92s; }
#預-s13   { stroke-dasharray: 21.4447; stroke-dashoffset: 21.4447; animation: drawStroke 0.22s ease-out 5.05s forwards; }
]]>
</style>

