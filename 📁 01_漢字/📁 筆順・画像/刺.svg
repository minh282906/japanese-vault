<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (刺)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #刺-bg[i]: Thời gian quả bóng số nảy lên
   - #刺-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#刺-bg1  { animation-delay: 0.05s; }
#刺-s1   { stroke-dasharray: 37.7671; stroke-dashoffset: 37.7671; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#刺-bg2  { animation-delay: 0.42s; }
#刺-s2   { stroke-dasharray: 20.8780; stroke-dashoffset: 20.8780; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#刺-bg3  { animation-delay: 0.79s; }
#刺-s3   { stroke-dasharray: 59.1866; stroke-dashoffset: 59.1866; animation: drawStroke 0.33s ease-out 0.92s forwards; }
#刺-bg4  { animation-delay: 1.27s; }
#刺-s4   { stroke-dasharray: 85.5607; stroke-dashoffset: 85.5607; animation: drawStroke 0.47s ease-out 1.40s forwards; }
#刺-bg5  { animation-delay: 1.89s; }
#刺-s5   { stroke-dasharray: 41.1001; stroke-dashoffset: 41.1001; animation: drawStroke 0.23s ease-out 2.02s forwards; }
#刺-bg6  { animation-delay: 2.27s; }
#刺-s6   { stroke-dasharray: 21.3094; stroke-dashoffset: 21.3094; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#刺-bg7  { animation-delay: 2.64s; }
#刺-s7   { stroke-dasharray: 38.5932; stroke-dashoffset: 38.5932; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#刺-bg8  { animation-delay: 3.01s; }
#刺-s8   { stroke-dasharray: 94.7339; stroke-dashoffset: 94.7339; animation: drawStroke 0.52s ease-out 3.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #刺-s[i]) -->
<path id="刺-s1"  class="stroke" stroke="#bf0909" d="M17.45,26.05C20.13,26.5,21.99,26.44,23.99,26.18C30.419999999999998,25.35,40.379999999999995,23.99,48.89,23.31C51.25,23.119999999999997,52.88,23.119999999999997,54.97,23.709999999999997"/>
<path id="刺-s2"  class="stroke" stroke="#bf9109" d="M17.88,39.62C18.759999999999998,40.5,19.299999999999997,41.879999999999995,19.43,43.269999999999996C19.54,44.41,20.1,49.36,20.68,54.01C21.03,56.76,21.3,59.14,21.3,60"/>
<path id="刺-s3"  class="stroke" stroke="#64bf09" d="M19.92,41.31C26.580000000000002,40.49,44.17,38.36,51.14,37.47C55.230000000000004,36.94,56.07,37.92,55.620000000000005,42.28C55.25000000000001,45.86,54.43000000000001,50.72,53.510000000000005,53.370000000000005C51.60000000000001,58.82000000000001,49.99,55.81,48.57000000000001,53.800000000000004"/>
<path id="刺-s4"  class="stroke" stroke="#09bf36" d="M35.49,12C36.45,12.96,36.75,14.25,36.75,15.5C36.75,18.759999999999998,36.75,68.13,36.75,88.62C36.75,93.29,36.75,96.46000000000001,36.75,97.24000000000001"/>
<path id="刺-s5"  class="stroke" stroke="#09bfbf" d="M36.41,53.25C36.25,54.75,35.73,56.6,34.62,58.45C28.38,68.88,23,74.88,11.5,85.25"/>
<path id="刺-s6"  class="stroke" stroke="#0936bf" d="M40,62.25C46.92,65.04,52.11,69.47,56,75.75"/>
<path id="刺-s7"  class="stroke" stroke="#6409bf" d="M67.77,23.83C68.75,24.75,69.28,25.75,69.28,27.849999999999998C69.28,38.25,69.44,49.26,69.34,55.75C69.3,58.42,69.26,60.56,69.26,62"/>
<path id="刺-s8"  class="stroke" stroke="#bf0991" d="M87.27,11.83C88.53,13.09,89.03,14.5,89.03,16.85C89.03,31.410000000000004,89.02,85.00999999999999,89.02,89.97C89.02,103.11,81.81,91.47,80.31,90.22"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="刺-bg1"  class="badge-group"><circle cx="17.45" cy="26.05" r="3.5" fill="#bf0909"/><text class="num-single" x="17.45" y="26.05" dx="0" dy="-0.5">1</text></g>
<g id="刺-bg2"  class="badge-group"><circle cx="17.88" cy="36.12" r="3.5" fill="#bf9109"/><text class="num-single" x="17.88" y="36.12" dx="0" dy="-0.5">2</text></g>
<g id="刺-bg3"  class="badge-group"><circle cx="19.92" cy="44.81" r="3.5" fill="#64bf09"/><text class="num-single" x="19.92" y="44.81" dx="0" dy="-0.5">3</text></g>
<g id="刺-bg4"  class="badge-group"><circle cx="35.49" cy="12" r="3.5" fill="#09bf36"/><text class="num-single" x="35.49" y="12" dx="0" dy="-0.5">4</text></g>
<g id="刺-bg5"  class="badge-group"><circle cx="36.41" cy="53.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="36.41" y="53.25" dx="0" dy="-0.5">5</text></g>
<g id="刺-bg6"  class="badge-group"><circle cx="40" cy="62.25" r="3.5" fill="#0936bf"/><text class="num-single" x="40" y="62.25" dx="0" dy="-0.5">6</text></g>
<g id="刺-bg7"  class="badge-group"><circle cx="67.77" cy="23.83" r="3.5" fill="#6409bf"/><text class="num-single" x="67.77" y="23.83" dx="0" dy="-0.5">7</text></g>
<g id="刺-bg8"  class="badge-group"><circle cx="87.27" cy="11.83" r="3.5" fill="#bf0991"/><text class="num-single" x="87.27" y="11.83" dx="0" dy="-0.5">8</text></g>
</svg>