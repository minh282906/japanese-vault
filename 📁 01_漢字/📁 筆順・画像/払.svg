<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (払)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #払-bg[i]: Thời gian quả bóng số nảy lên
   - #払-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#払-bg1  { animation-delay: 0.05s; }
#払-s1   { stroke-dasharray: 34.3591; stroke-dashoffset: 34.3591; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#払-bg2  { animation-delay: 0.42s; }
#払-s2   { stroke-dasharray: 87.0837; stroke-dashoffset: 87.0837; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#払-bg3  { animation-delay: 1.05s; }
#払-s3   { stroke-dasharray: 38.8642; stroke-dashoffset: 38.8642; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#払-bg4  { animation-delay: 1.42s; }
#払-s4   { stroke-dasharray: 104.5840; stroke-dashoffset: 104.5840; animation: drawStroke 0.55s ease-out 1.55s forwards; }
#払-bg5  { animation-delay: 2.12s; }
#払-s5   { stroke-dasharray: 31.1792; stroke-dashoffset: 31.1792; animation: drawStroke 0.22s ease-out 2.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #払-s[i]) -->
<path id="払-s1"  class="stroke" stroke="#bf0909" d="M14.5,38.17C16.38,38.75,18.009999999999998,38.910000000000004,20.25,38.67C25.37,38.13,35.21,36.25,44.010000000000005,34.59C45.550000000000004,34.300000000000004,46.75000000000001,34.260000000000005,48.42,34.260000000000005"/>
<path id="払-s2"  class="stroke" stroke="#9abf09" d="M34.02,15.25C35.260000000000005,16.49,35.53,18,35.53,20.02C35.53,35.25,35.52,74.48,35.52,85.92C35.52,100.17,29.200000000000003,89.45,27.750000000000004,87.92"/>
<path id="払-s3"  class="stroke" stroke="#09bf52" d="M14,73.18C15.5,73.88000000000001,16.62,73.63000000000001,18.25,72.5C23.2,69.07,32.75,61.83,45.75,52"/>
<path id="払-s4"  class="stroke" stroke="#0952bf" d="M73.21,26C73.75999999999999,27.17,73.61999999999999,28.53,73.11999999999999,29.990000000000002C67.63,46.13,59.62999999999999,66.25,52.389999999999986,81.77000000000001C50.34999999999999,86.15,50.819999999999986,86.49000000000001,54.97999999999999,85.23C64.74999999999999,82.25,75.99999999999999,79.13000000000001,90.25,74.63000000000001"/>
<path id="払-s5"  class="stroke" stroke="#9a09bf" d="M83.2,60.03C87.87,64.96000000000001,95.26,80.3,96.43,87.97"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="払-bg1"  class="badge-group"><circle cx="14.5" cy="38.17" r="3.5" fill="#bf0909"/><text class="num-single" x="14.5" y="38.17" dx="0" dy="-0.5">1</text></g>
<g id="払-bg2"  class="badge-group"><circle cx="34.02" cy="15.25" r="3.5" fill="#9abf09"/><text class="num-single" x="34.02" y="15.25" dx="0" dy="-0.5">2</text></g>
<g id="払-bg3"  class="badge-group"><circle cx="14" cy="73.18" r="3.5" fill="#09bf52"/><text class="num-single" x="14" y="73.18" dx="0" dy="-0.5">3</text></g>
<g id="払-bg4"  class="badge-group"><circle cx="73.21" cy="26" r="3.5" fill="#0952bf"/><text class="num-single" x="73.21" y="26" dx="0" dy="-0.5">4</text></g>
<g id="払-bg5"  class="badge-group"><circle cx="83.2" cy="60.03" r="3.5" fill="#9a09bf"/><text class="num-single" x="83.2" y="60.03" dx="0" dy="-0.5">5</text></g>
</svg>