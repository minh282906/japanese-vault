<path id="演-s8"  class="stroke" stroke="#09bfbf" d="M44,47.98C45.01,48.989999999999995,45.34,50.22,45.51,51.62C46.239999999999995,57.5,47.07,63.69,47.71,70.5C47.85,71.96,47.97,73.38,48.08,74.73"/>
<path id="演-s9"  class="stroke" stroke="#0971bf" d="M45.96,48.93C56.1,47.82,72.65,45.9,80.5,45.29C84.08,45.01,85.94,46.25,85.48,50.01C84.97,54.23,83.99000000000001,61.55,82.83,67.17C82.44,69.06,82.03999999999999,70.76,81.62,72.09"/>
<path id="演-s10"  class="stroke" stroke="#0923bf" d="M62.88,38.25C63.63,38.99,64,40,64,41.03C64,48.910000000000004,64.13,67.58,64.13,69.63"/>
<path id="演-s11"  class="stroke" stroke="#3d09bf" d="M47.91,60.12C56.629999999999995,59.12,75.25,57.25,83.37,57.03"/>
<path id="演-s12"  class="stroke" stroke="#8b09bf" d="M48.84,71.5C57.620000000000005,70.62,71.76,69.45,81.21000000000001,69.32"/>
<path id="演-s13"  class="stroke" stroke="#bf09a5" d="M54.21,80.06C54.25,80.44,54.17,81.35000000000001,53.87,81.84C51.37,86,47.62,90.37,38.68,96.46000000000001"/>
<path id="演-s14"  class="stroke" stroke="#bf0957" d="M73.88,80.62C80,83.74000000000001,86.13,89.24000000000001,89.84,95.47"/>

<!-- ============================================================
     BẢNG 14 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="演-bg1"  class="badge-group"><circle cx="19.38" cy="17" r="3.5" fill="#bf0909"/><text class="num-single" x="19.38" y="17" dx="0" dy="-0.5">1</text></g>
