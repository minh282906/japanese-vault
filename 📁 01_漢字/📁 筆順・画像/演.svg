<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (演)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #演-bg[i]: Thời gian quả bóng số nảy lên
   - #演-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#演-bg1  { animation-delay: 0.05s; }
#演-s1   { stroke-dasharray: 12.6237; stroke-dashoffset: 12.6237; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#演-bg2  { animation-delay: 0.42s; }
#演-s2   { stroke-dasharray: 13.8398; stroke-dashoffset: 13.8398; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#演-bg3  { animation-delay: 0.79s; }
#演-s3   { stroke-dasharray: 22.2839; stroke-dashoffset: 22.2839; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#演-bg4  { animation-delay: 1.16s; }
#演-s4   { stroke-dasharray: 11.5450; stroke-dashoffset: 11.5450; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#演-bg5  { animation-delay: 1.53s; }
#演-s5   { stroke-dasharray: 15.2213; stroke-dashoffset: 15.2213; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#演-bg6  { animation-delay: 1.90s; }
#演-s6   { stroke-dasharray: 58.0184; stroke-dashoffset: 58.0184; animation: drawStroke 0.32s ease-out 2.03s forwards; }
#演-bg7  { animation-delay: 2.37s; }
#演-s7   { stroke-dasharray: 29.4802; stroke-dashoffset: 29.4802; animation: drawStroke 0.22s ease-out 2.50s forwards; }
#演-bg8  { animation-delay: 2.74s; }
#演-s8   { stroke-dasharray: 27.2766; stroke-dashoffset: 27.2766; animation: drawStroke 0.22s ease-out 2.87s forwards; }
#演-bg9  { animation-delay: 3.11s; }
#演-s9   { stroke-dasharray: 65.5299; stroke-dashoffset: 65.5299; animation: drawStroke 0.36s ease-out 3.24s forwards; }
#演-bg10  { animation-delay: 3.62s; }
#演-s10   { stroke-dasharray: 31.6776; stroke-dashoffset: 31.6776; animation: drawStroke 0.22s ease-out 3.75s forwards; }
#演-bg11  { animation-delay: 3.99s; }
#演-s11   { stroke-dasharray: 35.6012; stroke-dashoffset: 35.6012; animation: drawStroke 0.22s ease-out 4.12s forwards; }
#演-bg12  { animation-delay: 4.36s; }
#演-s12   { stroke-dasharray: 32.4514; stroke-dashoffset: 32.4514; animation: drawStroke 0.22s ease-out 4.49s forwards; }
#演-bg13  { animation-delay: 4.73s; }
#演-s13   { stroke-dasharray: 23.0899; stroke-dashoffset: 23.0899; animation: drawStroke 0.22s ease-out 4.86s forwards; }
#演-bg14  { animation-delay: 5.10s; }
#演-s14   { stroke-dasharray: 22.0686; stroke-dashoffset: 22.0686; animation: drawStroke 0.22s ease-out 5.23s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

