<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (埋)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #埋-bg[i]: Thời gian quả bóng số nảy lên
   - #埋-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#埋-bg1  { animation-delay: 0.05s; }
#埋-s1   { stroke-dasharray: 28.7466; stroke-dashoffset: 28.7466; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#埋-bg2  { animation-delay: 0.42s; }
#埋-s2   { stroke-dasharray: 47.8801; stroke-dashoffset: 47.8801; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#埋-bg3  { animation-delay: 0.83s; }
#埋-s3   { stroke-dasharray: 33.2029; stroke-dashoffset: 33.2029; animation: drawStroke 0.22s ease-out 0.96s forwards; }
#埋-bg4  { animation-delay: 1.20s; }
#埋-s4   { stroke-dasharray: 34.6208; stroke-dashoffset: 34.6208; animation: drawStroke 0.22s ease-out 1.33s forwards; }
#埋-bg5  { animation-delay: 1.57s; }
#埋-s5   { stroke-dasharray: 77.5732; stroke-dashoffset: 77.5732; animation: drawStroke 0.43s ease-out 1.70s forwards; }
#埋-bg6  { animation-delay: 2.15s; }
#埋-s6   { stroke-dasharray: 38.6106; stroke-dashoffset: 38.6106; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#埋-bg7  { animation-delay: 2.52s; }
#埋-s7   { stroke-dasharray: 34.1980; stroke-dashoffset: 34.1980; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#埋-bg8  { animation-delay: 2.89s; }
#埋-s8   { stroke-dasharray: 67.2843; stroke-dashoffset: 67.2843; animation: drawStroke 0.37s ease-out 3.02s forwards; }
#埋-bg9  { animation-delay: 3.41s; }
#埋-s9   { stroke-dasharray: 43.0716; stroke-dashoffset: 43.0716; animation: drawStroke 0.24s ease-out 3.54s forwards; }
#埋-bg10  { animation-delay: 3.80s; }
#埋-s10   { stroke-dasharray: 60.3365; stroke-dashoffset: 60.3365; animation: drawStroke 0.33s ease-out 3.93s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #埋-s[i]) -->
<path id="埋-s1"  class="stroke" stroke="#bf0909" d="M12,42.64C13.64,43.47,16.45,43.29,18.15,42.99C23.549999999999997,42.03,32.089999999999996,40.27,37,39.25C38.24,38.99,39.62,38.82,40.25,39.01"/>
<path id="埋-s2"  class="stroke" stroke="#bf7609" d="M26.12,19.25C27.25,20.38,27.580000000000002,21.75,27.580000000000002,23.25C27.580000000000002,30.5,27.610000000000003,56,27.610000000000003,66.75"/>
<path id="埋-s3"  class="stroke" stroke="#9abf09" d="M11.25,74.54C12,75.5,13.5,75.75,15.75,74.5C22,71,34.5,64.75,40.75,61.25"/>
<path id="埋-s4"  class="stroke" stroke="#2dbf09" d="M46.04,19.75C47.019999999999996,20.73,47.42,21.74,47.68,23.11C49.01,30.25,50.66,40.08,51.53,49.25C51.67,50.75,51.800000000000004,52.21,51.910000000000004,53.62"/>
<path id="埋-s5"  class="stroke" stroke="#09bf52" d="M48.01,21.04C60.07,19.07,75.45,17.439999999999998,85.27,16.36C89.94,15.85,92.75,16,92.13,21.25C91.44,27.12,89.69999999999999,37.41,88.50999999999999,45.75C88.25999999999999,47.55,88.00999999999999,48.75,87.8,50.3"/>
<path id="埋-s6"  class="stroke" stroke="#09bfbf" d="M51.05,35.24C54.629999999999995,34.660000000000004,83,31.87,89.49,31.680000000000003"/>
<path id="埋-s7"  class="stroke" stroke="#0952bf" d="M52.97,50.89C62.5,50,73.12,48.75,87.03999999999999,47.97"/>
<path id="埋-s8"  class="stroke" stroke="#2d09bf" d="M68.08,21.38C69.23,22.529999999999998,69.67999999999999,24,69.67999999999999,25.74C69.67999999999999,38.64,69.63,83.59,69.63,88.25"/>
<path id="埋-s9"  class="stroke" stroke="#9a09bf" d="M49.97,70.42C52.75,71,54.87,70.71000000000001,57.14,70.37C65.84,69.06,77.6,67.26,86.38,66.79C88.36999999999999,66.68,90.78999999999999,66.75,92.72,67.30000000000001"/>
<path id="埋-s10"  class="stroke" stroke="#bf0976" d="M39.13,90.98C42.13,92.23,45.510000000000005,91.69,48.64,91.43C60.99,90.4,76.99000000000001,88.16000000000001,90.63,87.84C93.58999999999999,87.77000000000001,96.25,87.85000000000001,99.13,88.58"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="埋-bg1"  class="badge-group"><circle cx="12" cy="42.64" r="3.5" fill="#bf0909"/><text class="num-single" x="12" y="42.64" dx="0" dy="-0.5">1</text></g>
<g id="埋-bg2"  class="badge-group"><circle cx="26.12" cy="19.25" r="3.5" fill="#bf7609"/><text class="num-single" x="26.12" y="19.25" dx="0" dy="-0.5">2</text></g>
<g id="埋-bg3"  class="badge-group"><circle cx="11.25" cy="74.54" r="3.5" fill="#9abf09"/><text class="num-single" x="11.25" y="74.54" dx="0" dy="-0.5">3</text></g>
<g id="埋-bg4"  class="badge-group"><circle cx="46.04" cy="16.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="46.04" y="16.25" dx="0" dy="-0.5">4</text></g>
<g id="埋-bg5"  class="badge-group"><circle cx="48.01" cy="24.54" r="3.5" fill="#09bf52"/><text class="num-single" x="48.01" y="24.54" dx="0" dy="-0.5">5</text></g>
<g id="埋-bg6"  class="badge-group"><circle cx="51.05" cy="35.24" r="3.5" fill="#09bfbf"/><text class="num-single" x="51.05" y="35.24" dx="0" dy="-0.5">6</text></g>
<g id="埋-bg7"  class="badge-group"><circle cx="52.97" cy="50.89" r="3.5" fill="#0952bf"/><text class="num-single" x="52.97" y="50.89" dx="0" dy="-0.5">7</text></g>
<g id="埋-bg8"  class="badge-group"><circle cx="68.08" cy="21.38" r="3.5" fill="#2d09bf"/><text class="num-single" x="68.08" y="21.38" dx="0" dy="-0.5">8</text></g>
<g id="埋-bg9"  class="badge-group"><circle cx="49.97" cy="70.42" r="3.5" fill="#9a09bf"/><text class="num-single" x="49.97" y="70.42" dx="0" dy="-0.5">9</text></g>
<g id="埋-bg10" class="badge-group"><circle cx="39.13" cy="90.98" r="3.5" fill="#bf0976"/><text class="num-double" x="39.13" y="90.98" dx="-0.4" dy="-0.475">10</text></g>
</svg>