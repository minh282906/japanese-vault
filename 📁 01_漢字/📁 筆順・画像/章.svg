<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (章)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #章-bg[i]: Thời gian quả bóng số nảy lên
   - #章-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#章-bg1  { animation-delay: 0.05s; }
#章-s1   { stroke-dasharray: 10.2205; stroke-dashoffset: 10.2205; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#章-bg2  { animation-delay: 0.42s; }
#章-s2   { stroke-dasharray: 52.9624; stroke-dashoffset: 52.9624; animation: drawStroke 0.29s ease-out 0.55s forwards; }
#章-bg3  { animation-delay: 0.86s; }
#章-s3   { stroke-dasharray: 11.4433; stroke-dashoffset: 11.4433; animation: drawStroke 0.22s ease-out 0.99s forwards; }
#章-bg4  { animation-delay: 1.23s; }
#章-s4   { stroke-dasharray: 12.0995; stroke-dashoffset: 12.0995; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#章-bg5  { animation-delay: 1.60s; }
#章-s5   { stroke-dasharray: 80.0635; stroke-dashoffset: 80.0635; animation: drawStroke 0.44s ease-out 1.73s forwards; }
#章-bg6  { animation-delay: 2.19s; }
#章-s6   { stroke-dasharray: 24.6668; stroke-dashoffset: 24.6668; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#章-bg7  { animation-delay: 2.56s; }
#章-s7   { stroke-dasharray: 65.6088; stroke-dashoffset: 65.6088; animation: drawStroke 0.36s ease-out 2.69s forwards; }
#章-bg8  { animation-delay: 3.07s; }
#章-s8   { stroke-dasharray: 38.8225; stroke-dashoffset: 38.8225; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#章-bg9  { animation-delay: 3.44s; }
#章-s9   { stroke-dasharray: 34.4539; stroke-dashoffset: 34.4539; animation: drawStroke 0.22s ease-out 3.57s forwards; }
#章-bg10  { animation-delay: 3.81s; }
#章-s10   { stroke-dasharray: 71.9048; stroke-dashoffset: 71.9048; animation: drawStroke 0.40s ease-out 3.94s forwards; }
#章-bg11  { animation-delay: 4.36s; }
#章-s11   { stroke-dasharray: 33.1208; stroke-dashoffset: 33.1208; animation: drawStroke 0.22s ease-out 4.49s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #章-s[i]) -->
<path id="章-s1"  class="stroke" stroke="#bf0909" d="M51.75,9.25C52.75,10,53.25,11,53.25,12.75S53.25,14.25,53.25,19"/>
<path id="章-s2"  class="stroke" stroke="#bf6c09" d="M28,21.95C30.75,22.25,33.21,22.14,35.75,21.88C44.91,20.95,60.379999999999995,19.22,73,18.27C75.64,18.07,78.13,17.89,80.75,18.33"/>
