<g id="章-bg9"  class="badge-group"><circle cx="37.58" cy="71.59" r="3.5" fill="#4b09bf"/><text class="num-single" x="37.58" y="71.59" dx="0" dy="-0.5">9</text></g>
<g id="章-bg10" class="badge-group"><circle cx="20.13" cy="81.17" r="3.5" fill="#ae09bf"/><text class="num-double" x="20.13" y="81.17" dx="-0.4" dy="-0.475">10</text></g>
<g id="章-bg11" class="badge-group"><circle cx="53.21" cy="68.5" r="3.5" fill="#bf096c"/><text class="num-double" x="53.21" y="68.5" dx="-0.4" dy="-0.475">11</text></g>
</svg>