<path id="章-s4"  class="stroke" stroke="#4bbf09" d="M67.97,23C68.13,23.88,68.12,24.85,67.78,25.6C66.63,28.130000000000003,64.14,32.24,63.010000000000005,33.75"/>
<path id="章-s5"  class="stroke" stroke="#09bf2a" d="M14.75,40.05C18.04,40.769999999999996,21.5,40.739999999999995,24.83,40.419999999999995C42.489999999999995,38.739999999999995,64.84,35.739999999999995,84.75,35.08C88.05,34.97,91.23,34.89,94.5,35.33"/>
<path id="章-s6"  class="stroke" stroke="#09bf8d" d="M30.54,47.49C31.619999999999997,48.25,32.5,49.49,32.85,50.92C34,55.53,35.230000000000004,61.620000000000005,36.34,67.36C36.57,68.57,36.800000000000004,69.77,37.03,70.92999999999999"/>
<path id="章-s7"  class="stroke" stroke="#098dbf" d="M33.07,48.74C39.19,47.85,63.81,45.11,71.62,44.57C75.2,44.32,77.64,45.58,77.01,49.65C76.80000000000001,51.01,75.60000000000001,56.66,73.85000000000001,62.7C73.45,64.10000000000001,73.01,65.51,72.55000000000001,66.91"/>
<path id="章-s8"  class="stroke" stroke="#092abf" d="M35.85,58.04C45,57,64.38,55,74.48,54.19"/>
<path id="章-s9"  class="stroke" stroke="#4b09bf" d="M37.58,68.09C49.879999999999995,66.63000000000001,63.879999999999995,65,71.85,64.58"/>
<path id="章-s10"  class="stroke" stroke="#ae09bf" d="M20.13,81.17C23.38,81.75,28.119999999999997,81.81,31.89,81.41C45.12,80,66.75,77.75,81.67,77.1C85.77,76.91999999999999,89.13,76.75,91.76,77.47999999999999"/>
<path id="章-s11"  class="stroke" stroke="#bf096c" d="M53.21,68.5C54.230000000000004,69.52,54.56,70.5,54.56,72.01C54.56,75.87,54.480000000000004,87.45,54.45,95.25C54.440000000000005,97.78,54.43,99.91,54.43,101.25"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="章-bg1"  class="badge-group"><circle cx="51.75" cy="9.25" r="3.5" fill="#bf0909"/><text class="num-single" x="51.75" y="9.25" dx="0" dy="-0.5">1</text></g>
<g id="章-bg2"  class="badge-group"><circle cx="28" cy="21.95" r="3.5" fill="#bf6c09"/><text class="num-single" x="28" y="21.95" dx="0" dy="-0.5">2</text></g>
