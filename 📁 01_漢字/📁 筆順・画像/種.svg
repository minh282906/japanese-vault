<path id="種-s9"  class="stroke" stroke="#0971bf" d="M52.43,45.45C63.85,43.95,77.89,42.290000000000006,85.63,41.56C89.28,41.22,90.88,42.010000000000005,90.39999999999999,45.64C89.88999999999999,49.57,88.99999999999999,55.65,87.89999999999999,61.370000000000005C87.61999999999999,62.830000000000005,87.33,64.26,87.02,65.63000000000001"/>
