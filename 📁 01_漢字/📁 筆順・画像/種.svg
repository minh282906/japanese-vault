<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (種)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #種-bg[i]: Thời gian quả bóng số nảy lên
   - #種-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#種-bg1  { animation-delay: 0.05s; }
#種-s1   { stroke-dasharray: 27.6401; stroke-dashoffset: 27.6401; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#種-bg2  { animation-delay: 0.42s; }
#種-s2   { stroke-dasharray: 33.2183; stroke-dashoffset: 33.2183; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#種-bg3  { animation-delay: 0.79s; }
#種-s3   { stroke-dasharray: 72.6944; stroke-dashoffset: 72.6944; animation: drawStroke 0.40s ease-out 0.92s forwards; }
#種-bg4  { animation-delay: 1.34s; }
#種-s4   { stroke-dasharray: 39.9483; stroke-dashoffset: 39.9483; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#種-bg5  { animation-delay: 1.71s; }
#種-s5   { stroke-dasharray: 14.8277; stroke-dashoffset: 14.8277; animation: drawStroke 0.22s ease-out 1.84s forwards; }
#種-bg6  { animation-delay: 2.08s; }
#種-s6   { stroke-dasharray: 31.3712; stroke-dashoffset: 31.3712; animation: drawStroke 0.22s ease-out 2.21s forwards; }
#種-bg7  { animation-delay: 2.45s; }
#種-s7   { stroke-dasharray: 49.0710; stroke-dashoffset: 49.0710; animation: drawStroke 0.27s ease-out 2.58s forwards; }
#種-bg8  { animation-delay: 2.87s; }
#種-s8   { stroke-dasharray: 26.2124; stroke-dashoffset: 26.2124; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#種-bg9  { animation-delay: 3.24s; }
#種-s9   { stroke-dasharray: 61.5659; stroke-dashoffset: 61.5659; animation: drawStroke 0.34s ease-out 3.37s forwards; }
#種-bg10  { animation-delay: 3.73s; }
#種-s10   { stroke-dasharray: 34.6994; stroke-dashoffset: 34.6994; animation: drawStroke 0.22s ease-out 3.86s forwards; }
#種-bg11  { animation-delay: 4.10s; }
#種-s11   { stroke-dasharray: 31.0003; stroke-dashoffset: 31.0003; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#種-bg12  { animation-delay: 4.47s; }
#種-s12   { stroke-dasharray: 68.3884; stroke-dashoffset: 68.3884; animation: drawStroke 0.38s ease-out 4.60s forwards; }
#種-bg13  { animation-delay: 5.00s; }
#種-s13   { stroke-dasharray: 37.4795; stroke-dashoffset: 37.4795; animation: drawStroke 0.22s ease-out 5.13s forwards; }
#種-bg14  { animation-delay: 5.37s; }
#種-s14   { stroke-dasharray: 54.3508; stroke-dashoffset: 54.3508; animation: drawStroke 0.30s ease-out 5.50s forwards; }
]]>
</style>

