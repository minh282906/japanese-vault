<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (相)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #相-bg[i]: Thời gian quả bóng số nảy lên
   - #相-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#相-bg1  { animation-delay: 0.05s; }
#相-s1   { stroke-dasharray: 37.7191; stroke-dashoffset: 37.7191; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#相-bg2  { animation-delay: 0.42s; }
#相-s2   { stroke-dasharray: 84.3553; stroke-dashoffset: 84.3553; animation: drawStroke 0.46s ease-out 0.55s forwards; }
#相-bg3  { animation-delay: 1.03s; }
#相-s3   { stroke-dasharray: 46.5123; stroke-dashoffset: 46.5123; animation: drawStroke 0.26s ease-out 1.16s forwards; }
#相-bg4  { animation-delay: 1.44s; }
#相-s4   { stroke-dasharray: 15.8056; stroke-dashoffset: 15.8056; animation: drawStroke 0.22s ease-out 1.57s forwards; }
#相-bg5  { animation-delay: 1.81s; }
#相-s5   { stroke-dasharray: 65.1952; stroke-dashoffset: 65.1952; animation: drawStroke 0.36s ease-out 1.94s forwards; }
#相-bg6  { animation-delay: 2.32s; }
#相-s6   { stroke-dasharray: 96.5805; stroke-dashoffset: 96.5805; animation: drawStroke 0.53s ease-out 2.45s forwards; }
#相-bg7  { animation-delay: 3.00s; }
#相-s7   { stroke-dasharray: 32.0614; stroke-dashoffset: 32.0614; animation: drawStroke 0.22s ease-out 3.13s forwards; }
#相-bg8  { animation-delay: 3.37s; }
#相-s8   { stroke-dasharray: 31.9106; stroke-dashoffset: 31.9106; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#相-bg9  { animation-delay: 3.74s; }
#相-s9   { stroke-dasharray: 31.9239; stroke-dashoffset: 31.9239; animation: drawStroke 0.22s ease-out 3.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #相-s[i]) -->
<path id="相-s1"  class="stroke" stroke="#bf0909" d="M12.5,38C14.620000000000001,38.38,16.97,38.29,19.009999999999998,38.1C25.959999999999997,37.45,38.41,35.800000000000004,45.75,35C47.74,34.78,48.75,34.75,50,35"/>
<path id="相-s2"  class="stroke" stroke="#bf8209" d="M32.98,13.62C34.12,14.76,34.779999999999994,16.24,34.779999999999994,17.99C34.779999999999994,21.639999999999997,34.589999999999996,70.95,34.53999999999999,90.78C34.529999999999994,94.06,34.529999999999994,96.43,34.529999999999994,97.49"/>
<path id="相-s3"  class="stroke" stroke="#82bf09" d="M34,37.5C34,38.88,33.63,40.18,33.28,41.18C28.63,54.23,20.25,67.75,11.25,77.5"/>
<path id="相-s4"  class="stroke" stroke="#09bf09" d="M38,47.75C42.28,50.22,46.62,54.25,49.25,58.63"/>
<path id="相-s5"  class="stroke" stroke="#09bf82" d="M57.43,29.48C58.48,30.53,59.07,31.97,59.07,33.87C59.07,37.12,59.07,74.72999999999999,59.07,89C59.07,91.77,59.07,93.66,59.07,94.25"/>
<path id="相-s6"  class="stroke" stroke="#0982bf" d="M59.75,30.82C62.74,30.6,83.12,28.36,88.13,27.83C91.19999999999999,27.509999999999998,93.57,28.75,93.57,31.75C93.57,38.019999999999996,93.22999999999999,74.1,93.19999999999999,87.63C93.19999999999999,89.83,93.18999999999998,91.39,93.18999999999998,92.05"/>
<path id="相-s7"  class="stroke" stroke="#0909bf" d="M60.2,50.48C67.25,49.75,86.5,48,92.14,47.709999999999994"/>
<path id="相-s8"  class="stroke" stroke="#8209bf" d="M60.21,69.42C68.67,68.62,82.88,67.13,92.01,66.82000000000001"/>
<path id="相-s9"  class="stroke" stroke="#bf0982" d="M60.22,90.57C68.38,89.88,82.75,88.75,92.07,88.44"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="相-bg1"  class="badge-group"><circle cx="12.5" cy="38" r="3.5" fill="#bf0909"/><text class="num-single" x="12.5" y="38" dx="0" dy="-0.5">1</text></g>
<g id="相-bg2"  class="badge-group"><circle cx="32.98" cy="13.62" r="3.5" fill="#bf8209"/><text class="num-single" x="32.98" y="13.62" dx="0" dy="-0.5">2</text></g>
<g id="相-bg3"  class="badge-group"><circle cx="34" cy="37.5" r="3.5" fill="#82bf09"/><text class="num-single" x="34" y="37.5" dx="0" dy="-0.5">3</text></g>
<g id="相-bg4"  class="badge-group"><circle cx="38" cy="47.75" r="3.5" fill="#09bf09"/><text class="num-single" x="38" y="47.75" dx="0" dy="-0.5">4</text></g>
<g id="相-bg5"  class="badge-group"><circle cx="57.43" cy="25.98" r="3.5" fill="#09bf82"/><text class="num-single" x="57.43" y="25.98" dx="0" dy="-0.5">5</text></g>
<g id="相-bg6"  class="badge-group"><circle cx="59.75" cy="34.32" r="3.5" fill="#0982bf"/><text class="num-single" x="59.75" y="34.32" dx="0" dy="-0.5">6</text></g>
<g id="相-bg7"  class="badge-group"><circle cx="60.2" cy="50.48" r="3.5" fill="#0909bf"/><text class="num-single" x="60.2" y="50.48" dx="0" dy="-0.5">7</text></g>
<g id="相-bg8"  class="badge-group"><circle cx="60.21" cy="69.42" r="3.5" fill="#8209bf"/><text class="num-single" x="60.21" y="69.42" dx="0" dy="-0.5">8</text></g>
<g id="相-bg9"  class="badge-group"><circle cx="60.22" cy="90.57" r="3.5" fill="#bf0982"/><text class="num-single" x="60.22" y="90.57" dx="0" dy="-0.5">9</text></g>
</svg>