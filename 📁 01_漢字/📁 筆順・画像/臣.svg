<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (臣)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #臣-bg[i]: Thời gian quả bóng số nảy lên
   - #臣-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#臣-bg1  { animation-delay: 0.05s; }
#臣-s1   { stroke-dasharray: 82.6164; stroke-dashoffset: 82.6164; animation: drawStroke 0.45s ease-out 0.18s forwards; }
#臣-bg2  { animation-delay: 0.65s; }
#臣-s2   { stroke-dasharray: 62.0932; stroke-dashoffset: 62.0932; animation: drawStroke 0.34s ease-out 0.78s forwards; }
#臣-bg3  { animation-delay: 1.14s; }
#臣-s3   { stroke-dasharray: 20.6241; stroke-dashoffset: 20.6241; animation: drawStroke 0.22s ease-out 1.27s forwards; }
#臣-bg4  { animation-delay: 1.51s; }
#臣-s4   { stroke-dasharray: 78.0993; stroke-dashoffset: 78.0993; animation: drawStroke 0.43s ease-out 1.64s forwards; }
#臣-bg5  { animation-delay: 2.09s; }
#臣-s5   { stroke-dasharray: 55.5728; stroke-dashoffset: 55.5728; animation: drawStroke 0.31s ease-out 2.22s forwards; }
#臣-bg6  { animation-delay: 2.55s; }
#臣-s6   { stroke-dasharray: 26.6480; stroke-dashoffset: 26.6480; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#臣-bg7  { animation-delay: 2.92s; }
#臣-s7   { stroke-dasharray: 66.5878; stroke-dashoffset: 66.5878; animation: drawStroke 0.37s ease-out 3.05s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #臣-s[i]) -->
<path id="臣-s1"  class="stroke" stroke="#bf0909" d="M24.37,16.25C25.25,17.13,25.830000000000002,18.63,25.830000000000002,19.75C25.830000000000002,24.08,25.680000000000003,72.3,25.630000000000003,91.37C25.62,94.89,25.62,97.42,25.62,98.49000000000001"/>
<path id="臣-s2"  class="stroke" stroke="#bfa509" d="M26.57,18.49C33.35,17.79,61.79,15.86,79.62,14.709999999999999C82.31,14.54,85.83,14.219999999999999,88.5,14.79"/>
<path id="臣-s3"  class="stroke" stroke="#3dbf09" d="M54.12,18.5C55.25,19.63,55.58,21.23,55.58,22.25C55.58,27,55.5,32.37,55.5,38.75"/>
<path id="臣-s4"  class="stroke" stroke="#09bf71" d="M27,42.5C45.379999999999995,40.75,66.32,39.26,78.25,38C83.08,37.49,84.5,39,83.5,43C82.28,47.88,80.74,53.88,79.5,59.75"/>
<path id="臣-s5"  class="stroke" stroke="#0971bf" d="M26.82,64.74C32.84,64.12,61.85,62,76,61.13C78.72,60.96,80.9,60.84,82.25,60.79"/>
<path id="臣-s6"  class="stroke" stroke="#3d09bf" d="M55.12,64.5C56.059999999999995,65.44,56.58,66.73,56.58,67.75C56.58,71.75,56.5,84.63,56.5,90.75"/>
<path id="臣-s7"  class="stroke" stroke="#bf09a5" d="M26.57,93.49C35.120000000000005,92.86999999999999,65.25,91.11999999999999,84.5,89.63C87.07,89.42999999999999,90.46,89.24,93,89.78999999999999"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="臣-bg1"  class="badge-group"><circle cx="24.37" cy="12.75" r="3.5" fill="#bf0909"/><text class="num-single" x="24.37" y="12.75" dx="0" dy="-0.5">1</text></g>
<g id="臣-bg2"  class="badge-group"><circle cx="26.57" cy="21.99" r="3.5" fill="#bfa509"/><text class="num-single" x="26.57" y="21.99" dx="0" dy="-0.5">2</text></g>
<g id="臣-bg3"  class="badge-group"><circle cx="54.12" cy="18.5" r="3.5" fill="#3dbf09"/><text class="num-single" x="54.12" y="18.5" dx="0" dy="-0.5">3</text></g>
<g id="臣-bg4"  class="badge-group"><circle cx="27" cy="42.5" r="3.5" fill="#09bf71"/><text class="num-single" x="27" y="42.5" dx="0" dy="-0.5">4</text></g>
<g id="臣-bg5"  class="badge-group"><circle cx="26.82" cy="64.74" r="3.5" fill="#0971bf"/><text class="num-single" x="26.82" y="64.74" dx="0" dy="-0.5">5</text></g>
<g id="臣-bg6"  class="badge-group"><circle cx="55.12" cy="64.5" r="3.5" fill="#3d09bf"/><text class="num-single" x="55.12" y="64.5" dx="0" dy="-0.5">6</text></g>
<g id="臣-bg7"  class="badge-group"><circle cx="26.57" cy="93.49" r="3.5" fill="#bf09a5"/><text class="num-single" x="26.57" y="93.49" dx="0" dy="-0.5">7</text></g>
</svg>