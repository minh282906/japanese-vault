<path id="順-s8"  class="stroke" stroke="#0964bf" d="M64.43,46.5C72.25,45.25,81.75,44,90.94000000000001,43.01"/>
<path id="順-s9"  class="stroke" stroke="#0909bf" d="M64.14,58.9C70.75,58,82,56.5,90.22,55.89"/>
<path id="順-s10"  class="stroke" stroke="#6409bf" d="M64.55,71.8C70.75,71.25,83.39,70.11,90.88,69.59"/>
<path id="順-s11"  class="stroke" stroke="#bf09bf" d="M71.38,77.75C71.5,78.87,71.00999999999999,80.09,70.17999999999999,81.02C67.67999999999999,83.82,59.959999999999994,90.69,54.94999999999999,94"/>
<path id="順-s12"  class="stroke" stroke="#bf0964" d="M83.93,77.15C89.42,81.5,95.9,89.38000000000001,97.39000000000001,93.19"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
