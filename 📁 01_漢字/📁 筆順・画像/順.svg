<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (順)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #順-bg[i]: Thời gian quả bóng số nảy lên
   - #順-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#順-bg1  { animation-delay: 0.05s; }
#順-s1   { stroke-dasharray: 64.3090; stroke-dashoffset: 64.3090; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#順-bg2  { animation-delay: 0.55s; }
#順-s2   { stroke-dasharray: 45.7772; stroke-dashoffset: 45.7772; animation: drawStroke 0.25s ease-out 0.68s forwards; }
#順-bg3  { animation-delay: 0.95s; }
#順-s3   { stroke-dasharray: 70.1375; stroke-dashoffset: 70.1375; animation: drawStroke 0.39s ease-out 1.08s forwards; }
#順-bg4  { animation-delay: 1.49s; }
#順-s4   { stroke-dasharray: 38.4249; stroke-dashoffset: 38.4249; animation: drawStroke 0.22s ease-out 1.62s forwards; }
#順-bg5  { animation-delay: 1.86s; }
#順-s5   { stroke-dasharray: 15.2967; stroke-dashoffset: 15.2967; animation: drawStroke 0.22s ease-out 1.99s forwards; }
#順-bg6  { animation-delay: 2.23s; }
#順-s6   { stroke-dasharray: 41.6953; stroke-dashoffset: 41.6953; animation: drawStroke 0.23s ease-out 2.36s forwards; }
#順-bg7  { animation-delay: 2.61s; }
#順-s7   { stroke-dasharray: 69.3372; stroke-dashoffset: 69.3372; animation: drawStroke 0.38s ease-out 2.74s forwards; }
#順-bg8  { animation-delay: 3.14s; }
#順-s8   { stroke-dasharray: 26.7415; stroke-dashoffset: 26.7415; animation: drawStroke 0.22s ease-out 3.27s forwards; }
#順-bg9  { animation-delay: 3.51s; }
#順-s9   { stroke-dasharray: 26.2568; stroke-dashoffset: 26.2568; animation: drawStroke 0.22s ease-out 3.64s forwards; }
#順-bg10  { animation-delay: 3.88s; }
#順-s10   { stroke-dasharray: 26.4229; stroke-dashoffset: 26.4229; animation: drawStroke 0.22s ease-out 4.01s forwards; }
#順-bg11  { animation-delay: 4.25s; }
#順-s11   { stroke-dasharray: 23.6264; stroke-dashoffset: 23.6264; animation: drawStroke 0.22s ease-out 4.38s forwards; }
#順-bg12  { animation-delay: 4.62s; }
#順-s12   { stroke-dasharray: 21.0897; stroke-dashoffset: 21.0897; animation: drawStroke 0.22s ease-out 4.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

