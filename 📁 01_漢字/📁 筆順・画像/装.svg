<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (装)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #装-bg[i]: Thời gian quả bóng số nảy lên
   - #装-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#装-bg1  { animation-delay: 0.05s; }
#装-s1   { stroke-dasharray: 38.3223; stroke-dashoffset: 38.3223; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#装-bg2  { animation-delay: 0.42s; }
#装-s2   { stroke-dasharray: 11.4695; stroke-dashoffset: 11.4695; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#装-bg3  { animation-delay: 0.79s; }
#装-s3   { stroke-dasharray: 15.5638; stroke-dashoffset: 15.5638; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#装-bg4  { animation-delay: 1.16s; }
#装-s4   { stroke-dasharray: 39.9515; stroke-dashoffset: 39.9515; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#装-bg5  { animation-delay: 1.53s; }
#装-s5   { stroke-dasharray: 28.4594; stroke-dashoffset: 28.4594; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#装-bg6  { animation-delay: 1.90s; }
#装-s6   { stroke-dasharray: 33.9443; stroke-dashoffset: 33.9443; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#装-bg7  { animation-delay: 2.27s; }
#装-s7   { stroke-dasharray: 9.0514; stroke-dashoffset: 9.0514; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#装-bg8  { animation-delay: 2.64s; }
#装-s8   { stroke-dasharray: 72.7213; stroke-dashoffset: 72.7213; animation: drawStroke 0.40s ease-out 2.77s forwards; }
#装-bg9  { animation-delay: 3.19s; }
#装-s9   { stroke-dasharray: 42.5937; stroke-dashoffset: 42.5937; animation: drawStroke 0.23s ease-out 3.32s forwards; }
#装-bg10  { animation-delay: 3.57s; }
#装-s10   { stroke-dasharray: 42.8393; stroke-dashoffset: 42.8393; animation: drawStroke 0.24s ease-out 3.70s forwards; }
#装-bg11  { animation-delay: 3.96s; }
#装-s11   { stroke-dasharray: 14.3908; stroke-dashoffset: 14.3908; animation: drawStroke 0.22s ease-out 4.09s forwards; }
#装-bg12  { animation-delay: 4.33s; }
#装-s12   { stroke-dasharray: 45.8019; stroke-dashoffset: 45.8019; animation: drawStroke 0.25s ease-out 4.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

