<path id="装-s8"  class="stroke" stroke="#0964bf" d="M18.75,61.18C21.5,61.75,24.52,61.73,27.630000000000003,61.39C40.38,60,67.45,57.8,82.25,57.21C85.21,57.09,88.63,57.12,91.25,57.5"/>
<path id="装-s9"  class="stroke" stroke="#0909bf" d="M48.63,59.91C48.63,60.629999999999995,48.330000000000005,61.61,47.7,62.379999999999995C43,68.12,32.5,78.5,15.8,85.77"/>
<path id="装-s10"  class="stroke" stroke="#6409bf" d="M39.62,74.66C40.54,75.58,40.809999999999995,76.86999999999999,40.809999999999995,78.3C40.809999999999995,81.5,40.74999999999999,91.25,40.74999999999999,94.34C40.74999999999999,96.23,41.779999999999994,96.96000000000001,43.279999999999994,95.63000000000001C46,93.25,55.25,87,58.74,85.03"/>
<path id="装-s11"  class="stroke" stroke="#bf09bf" d="M75.63,63.42C75.63,64.13,75.5,64.63,75.00999999999999,65.27C72.94,68.02,70.36999999999999,70.25,65.79999999999998,73.49"/>
<path id="装-s12"  class="stroke" stroke="#bf0964" d="M52.25,68.25C55.5,68.25,73.63,82.63,83.83,90.06C85.39999999999999,91.21000000000001,87.75,92.62,90.25,93.49000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
