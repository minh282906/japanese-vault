<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (編)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #編-bg[i]: Thời gian quả bóng số nảy lên
   - #編-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#編-bg1  { animation-delay: 0.05s; }
#編-s1   { stroke-dasharray: 38.9945; stroke-dashoffset: 38.9945; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#編-bg2  { animation-delay: 0.42s; }
#編-s2   { stroke-dasharray: 64.3059; stroke-dashoffset: 64.3059; animation: drawStroke 0.35s ease-out 0.55s forwards; }
#編-bg3  { animation-delay: 0.92s; }
#編-s3   { stroke-dasharray: 13.9650; stroke-dashoffset: 13.9650; animation: drawStroke 0.22s ease-out 1.05s forwards; }
#編-bg4  { animation-delay: 1.29s; }
#編-s4   { stroke-dasharray: 36.8248; stroke-dashoffset: 36.8248; animation: drawStroke 0.22s ease-out 1.42s forwards; }
#編-bg5  { animation-delay: 1.66s; }
#編-s5   { stroke-dasharray: 18.0817; stroke-dashoffset: 18.0817; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#編-bg6  { animation-delay: 2.03s; }
#編-s6   { stroke-dasharray: 9.8410; stroke-dashoffset: 9.8410; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#編-bg7  { animation-delay: 2.40s; }
#編-s7   { stroke-dasharray: 42.4146; stroke-dashoffset: 42.4146; animation: drawStroke 0.23s ease-out 2.53s forwards; }
#編-bg8  { animation-delay: 2.78s; }
#編-s8   { stroke-dasharray: 52.0515; stroke-dashoffset: 52.0515; animation: drawStroke 0.29s ease-out 2.91s forwards; }
#編-bg9  { animation-delay: 3.22s; }
#編-s9   { stroke-dasharray: 36.1911; stroke-dashoffset: 36.1911; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#編-bg10  { animation-delay: 3.59s; }
#編-s10   { stroke-dasharray: 56.9995; stroke-dashoffset: 56.9995; animation: drawStroke 0.31s ease-out 3.72s forwards; }
#編-bg11  { animation-delay: 4.05s; }
#編-s11   { stroke-dasharray: 39.5391; stroke-dashoffset: 39.5391; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#編-bg12  { animation-delay: 4.42s; }
#編-s12   { stroke-dasharray: 87.9142; stroke-dashoffset: 87.9142; animation: drawStroke 0.48s ease-out 4.55s forwards; }
#編-bg13  { animation-delay: 5.05s; }
#編-s13   { stroke-dasharray: 38.2531; stroke-dashoffset: 38.2531; animation: drawStroke 0.22s ease-out 5.18s forwards; }
#編-bg14  { animation-delay: 5.42s; }
#編-s14   { stroke-dasharray: 31.1828; stroke-dashoffset: 31.1828; animation: drawStroke 0.22s ease-out 5.55s forwards; }
#編-bg15  { animation-delay: 5.79s; }
#編-s15   { stroke-dasharray: 31.2219; stroke-dashoffset: 31.2219; animation: drawStroke 0.22s ease-out 5.92s forwards; }
]]>
</style>

