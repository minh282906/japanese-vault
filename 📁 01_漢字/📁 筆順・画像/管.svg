<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (管)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #管-bg[i]: Thời gian quả bóng số nảy lên
   - #管-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#管-bg1  { animation-delay: 0.05s; }
#管-s1   { stroke-dasharray: 24.4850; stroke-dashoffset: 24.4850; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#管-bg2  { animation-delay: 0.42s; }
#管-s2   { stroke-dasharray: 21.4274; stroke-dashoffset: 21.4274; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#管-bg3  { animation-delay: 0.79s; }
#管-s3   { stroke-dasharray: 10.0254; stroke-dashoffset: 10.0254; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#管-bg4  { animation-delay: 1.16s; }
#管-s4   { stroke-dasharray: 19.5404; stroke-dashoffset: 19.5404; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#管-bg5  { animation-delay: 1.53s; }
#管-s5   { stroke-dasharray: 26.6582; stroke-dashoffset: 26.6582; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#管-bg6  { animation-delay: 1.90s; }
#管-s6   { stroke-dasharray: 11.3614; stroke-dashoffset: 11.3614; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#管-bg7  { animation-delay: 2.27s; }
#管-s7   { stroke-dasharray: 9.0094; stroke-dashoffset: 9.0094; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#管-bg8  { animation-delay: 2.64s; }
#管-s8   { stroke-dasharray: 16.9480; stroke-dashoffset: 16.9480; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#管-bg9  { animation-delay: 3.01s; }
#管-s9   { stroke-dasharray: 77.6553; stroke-dashoffset: 77.6553; animation: drawStroke 0.43s ease-out 3.14s forwards; }
#管-bg10  { animation-delay: 3.59s; }
#管-s10   { stroke-dasharray: 50.6528; stroke-dashoffset: 50.6528; animation: drawStroke 0.28s ease-out 3.72s forwards; }
#管-bg11  { animation-delay: 4.02s; }
#管-s11   { stroke-dasharray: 44.3059; stroke-dashoffset: 44.3059; animation: drawStroke 0.24s ease-out 4.15s forwards; }
#管-bg12  { animation-delay: 4.41s; }
#管-s12   { stroke-dasharray: 28.6595; stroke-dashoffset: 28.6595; animation: drawStroke 0.22s ease-out 4.54s forwards; }
#管-bg13  { animation-delay: 4.78s; }
#管-s13   { stroke-dasharray: 46.5526; stroke-dashoffset: 46.5526; animation: drawStroke 0.26s ease-out 4.91s forwards; }
#管-bg14  { animation-delay: 5.19s; }
#管-s14   { stroke-dasharray: 29.5944; stroke-dashoffset: 29.5944; animation: drawStroke 0.22s ease-out 5.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

