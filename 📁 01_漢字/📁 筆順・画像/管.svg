<path id="管-s10"  class="stroke" stroke="#0923bf" d="M37.87,50.74C38.94,51.81,39.33,53,39.33,54.49C39.33,55.230000000000004,39.35,83.06,39.36,95.88C39.36,98.11999999999999,39.36,99.91,39.36,101"/>
<path id="管-s11"  class="stroke" stroke="#3d09bf" d="M40.25,52.54C48.55,51.37,60.92,49.67,66.63,49.03C69.08,48.76,71.03,49.11,70.25,51.910000000000004C69.25,55.49,68.34,58.35,66.91,63.150000000000006"/>
<path id="管-s12"  class="stroke" stroke="#8b09bf" d="M40.25,67.75C46.88,67,57.18,65.62,65,64.76C66.32,64.62,67.56,64.49000000000001,68.71,64.38000000000001"/>
<path id="管-s13"  class="stroke" stroke="#bf09a5" d="M40.5,80.59C49.06,79.48,60.69,77.94,66.75,77.26C70.94,76.79,71.95,77.93,71.25,80.54C70.25,84.29,69.09,87.67,67.66,92.92"/>
<path id="管-s14"  class="stroke" stroke="#bf0957" d="M40.5,96.75C45.45,96.29,56.769999999999996,95.07,65.63,94.29C67.16,94.16000000000001,68.61999999999999,94.04,69.96,93.94000000000001"/>

<!-- ============================================================
     BẢNG 14 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="管-bg1"  class="badge-group"><circle cx="32.25" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="32.25" y="12" dx="0" dy="-0.5">1</text></g>
