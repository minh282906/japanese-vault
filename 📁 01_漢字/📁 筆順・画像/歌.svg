<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (歌)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #歌-bg[i]: Thời gian quả bóng số nảy lên
   - #歌-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#歌-bg1  { animation-delay: 0.05s; }
#歌-s1   { stroke-dasharray: 39.5160; stroke-dashoffset: 39.5160; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#歌-bg2  { animation-delay: 0.42s; }
#歌-s2   { stroke-dasharray: 13.4775; stroke-dashoffset: 13.4775; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#歌-bg3  { animation-delay: 0.79s; }
#歌-s3   { stroke-dasharray: 24.8794; stroke-dashoffset: 24.8794; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#歌-bg4  { animation-delay: 1.16s; }
#歌-s4   { stroke-dasharray: 13.0186; stroke-dashoffset: 13.0186; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#歌-bg5  { animation-delay: 1.53s; }
#歌-s5   { stroke-dasharray: 27.7648; stroke-dashoffset: 27.7648; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#歌-bg6  { animation-delay: 1.90s; }
#歌-s6   { stroke-dasharray: 43.5868; stroke-dashoffset: 43.5868; animation: drawStroke 0.24s ease-out 2.03s forwards; }
#歌-bg7  { animation-delay: 2.29s; }
#歌-s7   { stroke-dasharray: 14.2201; stroke-dashoffset: 14.2201; animation: drawStroke 0.22s ease-out 2.42s forwards; }
#歌-bg8  { animation-delay: 2.66s; }
#歌-s8   { stroke-dasharray: 27.5465; stroke-dashoffset: 27.5465; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#歌-bg9  { animation-delay: 3.03s; }
#歌-s9   { stroke-dasharray: 14.6358; stroke-dashoffset: 14.6358; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#歌-bg10  { animation-delay: 3.40s; }
#歌-s10   { stroke-dasharray: 46.7870; stroke-dashoffset: 46.7870; animation: drawStroke 0.26s ease-out 3.53s forwards; }
#歌-bg11  { animation-delay: 3.81s; }
#歌-s11   { stroke-dasharray: 32.9516; stroke-dashoffset: 32.9516; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#歌-bg12  { animation-delay: 4.18s; }
#歌-s12   { stroke-dasharray: 39.9997; stroke-dashoffset: 39.9997; animation: drawStroke 0.22s ease-out 4.31s forwards; }
#歌-bg13  { animation-delay: 4.55s; }
#歌-s13   { stroke-dasharray: 50.9913; stroke-dashoffset: 50.9913; animation: drawStroke 0.28s ease-out 4.68s forwards; }
#歌-bg14  { animation-delay: 4.98s; }
#歌-s14   { stroke-dasharray: 40.2489; stroke-dashoffset: 40.2489; animation: drawStroke 0.22s ease-out 5.11s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

