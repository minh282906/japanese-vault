<path id="歌-s10"  class="stroke" stroke="#0923bf" d="M43.91,54.26C43.97,54.519999999999996,44.699999999999996,55.61,44.76,57.26C45.03,65.16,44.589999999999996,89.15,44.589999999999996,91.85C44.589999999999996,96.50999999999999,40.339999999999996,90.86999999999999,38.239999999999995,89.72999999999999"/>
