<path id="歌-s8"  class="stroke" stroke="#09bfbf" d="M16.31,66.05C21.31,65.03,29.119999999999997,63.8,31.849999999999998,63.54C33.05,63.43,33.76,64.2,33.589999999999996,64.86C33.06999999999999,66.86,31.729999999999997,71.18,31.029999999999998,73.76"/>
