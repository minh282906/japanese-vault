<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (類)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #類-bg[i]: Thời gian quả bóng số nảy lên
   - #類-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#類-bg1  { animation-delay: 0.05s; }
#類-s1   { stroke-dasharray: 12.5023; stroke-dashoffset: 12.5023; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#類-bg2  { animation-delay: 0.42s; }
#類-s2   { stroke-dasharray: 13.5600; stroke-dashoffset: 13.5600; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#類-bg3  { animation-delay: 0.79s; }
#類-s3   { stroke-dasharray: 39.1013; stroke-dashoffset: 39.1013; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#類-bg4  { animation-delay: 1.16s; }
#類-s4   { stroke-dasharray: 44.6600; stroke-dashoffset: 44.6600; animation: drawStroke 0.25s ease-out 1.29s forwards; }
#類-bg5  { animation-delay: 1.56s; }
#類-s5   { stroke-dasharray: 30.6522; stroke-dashoffset: 30.6522; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#類-bg6  { animation-delay: 1.93s; }
#類-s6   { stroke-dasharray: 17.9836; stroke-dashoffset: 17.9836; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#類-bg7  { animation-delay: 2.30s; }
#類-s7   { stroke-dasharray: 38.4995; stroke-dashoffset: 38.4995; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#類-bg8  { animation-delay: 2.67s; }
#類-s8   { stroke-dasharray: 45.0999; stroke-dashoffset: 45.0999; animation: drawStroke 0.25s ease-out 2.80s forwards; }
#類-bg9  { animation-delay: 3.07s; }
#類-s9   { stroke-dasharray: 17.9230; stroke-dashoffset: 17.9230; animation: drawStroke 0.22s ease-out 3.20s forwards; }
#類-bg10  { animation-delay: 3.44s; }
#類-s10   { stroke-dasharray: 40.9440; stroke-dashoffset: 40.9440; animation: drawStroke 0.23s ease-out 3.57s forwards; }
#類-bg11  { animation-delay: 3.82s; }
#類-s11   { stroke-dasharray: 13.6749; stroke-dashoffset: 13.6749; animation: drawStroke 0.22s ease-out 3.95s forwards; }
#類-bg12  { animation-delay: 4.19s; }
#類-s12   { stroke-dasharray: 46.9752; stroke-dashoffset: 46.9752; animation: drawStroke 0.26s ease-out 4.32s forwards; }
#類-bg13  { animation-delay: 4.60s; }
#類-s13   { stroke-dasharray: 75.0857; stroke-dashoffset: 75.0857; animation: drawStroke 0.41s ease-out 4.73s forwards; }
#類-bg14  { animation-delay: 5.16s; }
#類-s14   { stroke-dasharray: 28.1666; stroke-dashoffset: 28.1666; animation: drawStroke 0.22s ease-out 5.29s forwards; }
#類-bg15  { animation-delay: 5.53s; }
#類-s15   { stroke-dasharray: 27.8872; stroke-dashoffset: 27.8872; animation: drawStroke 0.22s ease-out 5.66s forwards; }
#類-bg16  { animation-delay: 5.90s; }
#類-s16   { stroke-dasharray: 27.9069; stroke-dashoffset: 27.9069; animation: drawStroke 0.22s ease-out 6.03s forwards; }
#類-bg17  { animation-delay: 6.27s; }
#類-s17   { stroke-dasharray: 22.3067; stroke-dashoffset: 22.3067; animation: drawStroke 0.22s ease-out 6.40s forwards; }
#類-bg18  { animation-delay: 6.64s; }
#類-s18   { stroke-dasharray: 19.9056; stroke-dashoffset: 19.9056; animation: drawStroke 0.22s ease-out 6.77s forwards; }
]]>
</style>

