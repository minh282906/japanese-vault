<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (具)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #具-bg[i]: Thời gian quả bóng số nảy lên
   - #具-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#具-bg1  { animation-delay: 0.05s; }
#具-s1   { stroke-dasharray: 44.6553; stroke-dashoffset: 44.6553; animation: drawStroke 0.25s ease-out 0.18s forwards; }
#具-bg2  { animation-delay: 0.45s; }
#具-s2   { stroke-dasharray: 80.0791; stroke-dashoffset: 80.0791; animation: drawStroke 0.44s ease-out 0.58s forwards; }
#具-bg3  { animation-delay: 1.04s; }
#具-s3   { stroke-dasharray: 37.2756; stroke-dashoffset: 37.2756; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#具-bg4  { animation-delay: 1.41s; }
#具-s4   { stroke-dasharray: 36.8954; stroke-dashoffset: 36.8954; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#具-bg5  { animation-delay: 1.78s; }
#具-s5   { stroke-dasharray: 36.6444; stroke-dashoffset: 36.6444; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#具-bg6  { animation-delay: 2.15s; }
#具-s6   { stroke-dasharray: 78.4868; stroke-dashoffset: 78.4868; animation: drawStroke 0.43s ease-out 2.28s forwards; }
#具-bg7  { animation-delay: 2.73s; }
#具-s7   { stroke-dasharray: 29.0873; stroke-dashoffset: 29.0873; animation: drawStroke 0.22s ease-out 2.86s forwards; }
#具-bg8  { animation-delay: 3.10s; }
#具-s8   { stroke-dasharray: 24.9325; stroke-dashoffset: 24.9325; animation: drawStroke 0.22s ease-out 3.23s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #具-s[i]) -->
<path id="具-s1"  class="stroke" stroke="#bf0909" d="M33.34,17.63C34.42,18.71,34.64,20.169999999999998,34.64,21.529999999999998C34.64,25.869999999999997,34.7,48.87,34.71,58.379999999999995C34.71,60.05,34.71,61.3,34.71,61.959999999999994"/>
<path id="具-s2"  class="stroke" stroke="#bf9109" d="M35.45,20.05C41,19.25,65.78,15.950000000000001,69.04,15.740000000000002C72.67,15.510000000000002,74.01,17.12,74.01,20.25C74.01,26.54,73.89,41.620000000000005,73.87,53.87C73.87,55.5,73.87,57.08,73.87,58.58"/>
<path id="具-s3"  class="stroke" stroke="#64bf09" d="M35.89,33.24C46.25,32,66.25,30.25,73,29.75"/>
<path id="具-s4"  class="stroke" stroke="#09bf36" d="M36,46.5C50.25,45.25,62.739999999999995,43.8,72.75,43.25"/>
<path id="具-s5"  class="stroke" stroke="#09bfbf" d="M36,58.75C44,58,61.5,56.5,72.5,55.5"/>
<path id="具-s6"  class="stroke" stroke="#0936bf" d="M15.75,71.7C19.5,72.38000000000001,24.17,72.36,28.14,71.96000000000001C40.9,70.68,67.75,68.25000000000001,83.38,67.91000000000001C86.86999999999999,67.83000000000001,90.5,67.88000000000001,94,68.54"/>
<path id="具-s7"  class="stroke" stroke="#6409bf" d="M41.25,77.14C41.38,78.12,41.29,78.98,40.71,79.78C37.88,83.75,30.630000000000003,89.87,19.810000000000002,95.46000000000001"/>
<path id="具-s8"  class="stroke" stroke="#bf0991" d="M67.25,78C73.71,80.91,82.87,89.25,85.56,94.47"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="具-bg1"  class="badge-group"><circle cx="33.34" cy="14.13" r="3.5" fill="#bf0909"/><text class="num-single" x="33.34" y="14.13" dx="0" dy="-0.5">1</text></g>
<g id="具-bg2"  class="badge-group"><circle cx="35.45" cy="23.55" r="3.5" fill="#bf9109"/><text class="num-single" x="35.45" y="23.55" dx="0" dy="-0.5">2</text></g>
<g id="具-bg3"  class="badge-group"><circle cx="35.89" cy="33.24" r="3.5" fill="#64bf09"/><text class="num-single" x="35.89" y="33.24" dx="0" dy="-0.5">3</text></g>
<g id="具-bg4"  class="badge-group"><circle cx="36" cy="46.5" r="3.5" fill="#09bf36"/><text class="num-single" x="36" y="46.5" dx="0" dy="-0.5">4</text></g>
<g id="具-bg5"  class="badge-group"><circle cx="36" cy="58.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="36" y="58.75" dx="0" dy="-0.5">5</text></g>
<g id="具-bg6"  class="badge-group"><circle cx="15.75" cy="71.7" r="3.5" fill="#0936bf"/><text class="num-single" x="15.75" y="71.7" dx="0" dy="-0.5">6</text></g>
<g id="具-bg7"  class="badge-group"><circle cx="41.25" cy="77.14" r="3.5" fill="#6409bf"/><text class="num-single" x="41.25" y="77.14" dx="0" dy="-0.5">7</text></g>
<g id="具-bg8"  class="badge-group"><circle cx="67.25" cy="78" r="3.5" fill="#bf0991"/><text class="num-single" x="67.25" y="78" dx="0" dy="-0.5">8</text></g>
</svg>