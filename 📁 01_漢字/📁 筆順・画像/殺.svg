<g id="殺-bg9"  class="badge-group"><circle cx="58.97" cy="55.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="58.97" y="55.5" dx="0" dy="-0.5">9</text></g>
<g id="殺-bg10" class="badge-group"><circle cx="55.39" cy="63.69" r="3.5" fill="#bf0976"/><text class="num-double" x="55.39" y="63.69" dx="-0.4" dy="-0.475">10</text></g>
</svg>