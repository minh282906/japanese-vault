<path id="殺-s4"  class="stroke" stroke="#2dbf09" d="M35.77,39C37.14,40.37,37.63,42.5,37.63,44.17C37.63,44.96,37.550000000000004,75.1,37.53,89.75C37.52,92.82,37.52,95.2,37.52,96.5"/>
<path id="殺-s5"  class="stroke" stroke="#09bf52" d="M36.33,49.78C36.33,50.75,36.129999999999995,51.870000000000005,35.8,52.65C29.919999999999998,66.09,25.849999999999998,74.68,16.769999999999996,84.34"/>
<path id="殺-s6"  class="stroke" stroke="#09bfbf" d="M40.75,58.88C43.24,60.440000000000005,47.33,65.49000000000001,49.43,68.5"/>
<path id="殺-s7"  class="stroke" stroke="#0952bf" d="M61.21,20.34C61.81,20.94,62.18,21.74,62.160000000000004,22.81C61.93000000000001,33.879999999999995,58.35,46.09,51.910000000000004,51.019999999999996"/>
<path id="殺-s8"  class="stroke" stroke="#2d09bf" d="M62.79,22.25C65.88,22,74.68,20.42,75.99,19.88C77.94,19.08,79.17,20.83,78.97,22.61C78.58,26.09,77.89,31.97,77.89,35.45C77.89,42.13,78.86,43.74,85.29,43.74C91.76,43.74,92.7,42.080000000000005,92.7,35.06"/>
<path id="殺-s9"  class="stroke" stroke="#9a09bf" d="M58.97,55.5C60.28,55.88,61.69,55.96,64.32,55.38C66.94,54.800000000000004,76.71,52.18,78.53,51.660000000000004C81.25,50.88,82.88,52.63,81.74,55.39C73.29,75.9,59.25,90.75,46.48,97.17"/>
<path id="殺-s10"  class="stroke" stroke="#bf0976" d="M55.39,63.69C60.88,64.12,73.84,80.78,85.74000000000001,89.66C88.10000000000001,91.42,90.71000000000001,93.44,93.63000000000001,94.11999999999999"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="殺-bg1"  class="badge-group"><circle cx="44.38" cy="15.38" r="3.5" fill="#bf0909"/><text class="num-single" x="44.38" y="15.38" dx="0" dy="-0.5">1</text></g>
<g id="殺-bg2"  class="badge-group"><circle cx="21.45" cy="22.72" r="3.5" fill="#bf7609"/><text class="num-single" x="21.45" y="22.72" dx="0" dy="-0.5">2</text></g>
<g id="殺-bg3"  class="badge-group"><circle cx="17.28" cy="51.22" r="3.5" fill="#9abf09"/><text class="num-single" x="17.28" y="51.22" dx="0" dy="-0.5">3</text></g>
