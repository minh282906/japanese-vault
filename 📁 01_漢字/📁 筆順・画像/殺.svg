<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (殺)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #殺-bg[i]: Thời gian quả bóng số nảy lên
   - #殺-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#殺-bg1  { animation-delay: 0.05s; }
#殺-s1   { stroke-dasharray: 41.3032; stroke-dashoffset: 41.3032; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#殺-bg2  { animation-delay: 0.43s; }
#殺-s2   { stroke-dasharray: 30.7668; stroke-dashoffset: 30.7668; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#殺-bg3  { animation-delay: 0.80s; }
#殺-s3   { stroke-dasharray: 32.4340; stroke-dashoffset: 32.4340; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#殺-bg4  { animation-delay: 1.17s; }
#殺-s4   { stroke-dasharray: 57.9603; stroke-dashoffset: 57.9603; animation: drawStroke 0.32s ease-out 1.30s forwards; }
#殺-bg5  { animation-delay: 1.64s; }
#殺-s5   { stroke-dasharray: 40.1204; stroke-dashoffset: 40.1204; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#殺-bg6  { animation-delay: 2.01s; }
#殺-s6   { stroke-dasharray: 13.0127; stroke-dashoffset: 13.0127; animation: drawStroke 0.22s ease-out 2.14s forwards; }
#殺-bg7  { animation-delay: 2.38s; }
#殺-s7   { stroke-dasharray: 33.5828; stroke-dashoffset: 33.5828; animation: drawStroke 0.22s ease-out 2.51s forwards; }
#殺-bg8  { animation-delay: 2.75s; }
#殺-s8   { stroke-dasharray: 58.5177; stroke-dashoffset: 58.5177; animation: drawStroke 0.32s ease-out 2.88s forwards; }
#殺-bg9  { animation-delay: 3.22s; }
#殺-s9   { stroke-dasharray: 82.4888; stroke-dashoffset: 82.4888; animation: drawStroke 0.45s ease-out 3.35s forwards; }
#殺-bg10  { animation-delay: 3.82s; }
#殺-s10   { stroke-dasharray: 49.3198; stroke-dashoffset: 49.3198; animation: drawStroke 0.27s ease-out 3.95s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #殺-s[i]) -->
<path id="殺-s1"  class="stroke" stroke="#bf0909" d="M44.38,15.38C44.74,16.490000000000002,44.61,17.42,43.870000000000005,18.560000000000002C37.2,28.76,29.02,37.47,16.5,44.25"/>
