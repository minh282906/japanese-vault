<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (付)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #付-bg[i]: Thời gian quả bóng số nảy lên
   - #付-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#付-bg1  { animation-delay: 0.05s; }
#付-s1   { stroke-dasharray: 51.8761; stroke-dashoffset: 51.8761; animation: drawStroke 0.29s ease-out 0.18s forwards; }
#付-bg2  { animation-delay: 0.49s; }
#付-s2   { stroke-dasharray: 54.3933; stroke-dashoffset: 54.3933; animation: drawStroke 0.30s ease-out 0.62s forwards; }
#付-bg3  { animation-delay: 0.94s; }
#付-s3   { stroke-dasharray: 57.7604; stroke-dashoffset: 57.7604; animation: drawStroke 0.32s ease-out 1.07s forwards; }
#付-bg4  { animation-delay: 1.41s; }
#付-s4   { stroke-dasharray: 92.2569; stroke-dashoffset: 92.2569; animation: drawStroke 0.51s ease-out 1.54s forwards; }
#付-bg5  { animation-delay: 2.07s; }
#付-s5   { stroke-dasharray: 16.6074; stroke-dashoffset: 16.6074; animation: drawStroke 0.22s ease-out 2.20s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #付-s[i]) -->
<path id="付-s1"  class="stroke" stroke="#bf0909" d="M38.12,14.62C38.37,16.68,38.05,18.349999999999998,37.23,20.119999999999997C32.03,31.39,24.93,45.58,13,59.29"/>
<path id="付-s2"  class="stroke" stroke="#9abf09" d="M29.03,40.75C30.080000000000002,41.8,30.540000000000003,43.13,30.540000000000003,44.980000000000004C30.540000000000003,55.17,30.180000000000003,76.63,30.040000000000003,88.38C30.02,91.12,30,93.33,30,94.75"/>
<path id="付-s3"  class="stroke" stroke="#09bf52" d="M40.88,42.17C43.34,42.75,46.07,42.72,47.910000000000004,42.47C61.370000000000005,40.62,76.62,38.25,91.83000000000001,37.29C94.88000000000001,37.1,96.72000000000001,37.17,98.25000000000001,37.57"/>
<path id="付-s4"  class="stroke" stroke="#0952bf" d="M74.27,12.83C75.47,14.03,76.03,15.75,76.03,17.6C76.03,32.120000000000005,76.02,85.50999999999999,76.02,90.47C76.02,99.75,69.75,93.88,67.06,91.22"/>
<path id="付-s5"  class="stroke" stroke="#9a09bf" d="M50.12,56.62C53.41,59,58.629999999999995,66.41,59.449999999999996,70.11"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="付-bg1"  class="badge-group"><circle cx="38.12" cy="14.62" r="3.5" fill="#bf0909"/><text class="num-single" x="38.12" y="14.62" dx="0" dy="-0.5">1</text></g>
<g id="付-bg2"  class="badge-group"><circle cx="29.03" cy="40.75" r="3.5" fill="#9abf09"/><text class="num-single" x="29.03" y="40.75" dx="0" dy="-0.5">2</text></g>
<g id="付-bg3"  class="badge-group"><circle cx="40.88" cy="42.17" r="3.5" fill="#09bf52"/><text class="num-single" x="40.88" y="42.17" dx="0" dy="-0.5">3</text></g>
<g id="付-bg4"  class="badge-group"><circle cx="74.27" cy="12.83" r="3.5" fill="#0952bf"/><text class="num-single" x="74.27" y="12.83" dx="0" dy="-0.5">4</text></g>
<g id="付-bg5"  class="badge-group"><circle cx="50.12" cy="56.62" r="3.5" fill="#9a09bf"/><text class="num-single" x="50.12" y="56.62" dx="0" dy="-0.5">5</text></g>
</svg>