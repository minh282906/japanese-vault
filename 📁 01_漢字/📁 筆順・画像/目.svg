<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (目)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #目-bg[i]: Thời gian quả bóng số nảy lên
   - #目-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#目-bg1  { animation-delay: 0.05s; }
#目-s1   { stroke-dasharray: 74.5266; stroke-dashoffset: 74.5266; animation: drawStroke 0.41s ease-out 0.18s forwards; }
#目-bg2  { animation-delay: 0.61s; }
#目-s2   { stroke-dasharray: 120.4320; stroke-dashoffset: 120.4320; animation: drawStroke 0.55s ease-out 0.74s forwards; }
#目-bg3  { animation-delay: 1.31s; }
#目-s3   { stroke-dasharray: 45.3697; stroke-dashoffset: 45.3697; animation: drawStroke 0.25s ease-out 1.44s forwards; }
#目-bg4  { animation-delay: 1.71s; }
#目-s4   { stroke-dasharray: 44.9531; stroke-dashoffset: 44.9531; animation: drawStroke 0.25s ease-out 1.84s forwards; }
#目-bg5  { animation-delay: 2.11s; }
#目-s5   { stroke-dasharray: 44.8668; stroke-dashoffset: 44.8668; animation: drawStroke 0.25s ease-out 2.24s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #目-s[i]) -->
<path id="目-s1"  class="stroke" stroke="#bf0909" d="M29.75,19.05C31.1,20.400000000000002,31.61,22.26,31.61,24.52C31.61,26.29,31.8,66.89,31.669999999999998,84.75C31.63,89.66,31.61,92.86,31.61,93.11"/>
<path id="目-s2"  class="stroke" stroke="#9abf09" d="M32.54,21.39C43.46,20.16,70.87,17.28,73.96000000000001,17.01C77.21000000000001,16.73,79.50000000000001,18.26,79.50000000000001,21.19C79.50000000000001,30.14,79.24000000000001,61.120000000000005,79.24000000000001,86.00999999999999C79.24000000000001,89.00999999999999,79.25000000000001,89.75999999999999,79.25000000000001,92.00999999999999"/>
<path id="目-s3"  class="stroke" stroke="#09bf52" d="M33.05,43.64C45.5,42.13,67.88,40.13,78.22999999999999,39.55"/>
<path id="目-s4"  class="stroke" stroke="#0952bf" d="M32.9,65.95C44.25,65,66,62.88,77.72,62.56"/>
<path id="目-s5"  class="stroke" stroke="#9a09bf" d="M33,90.5C42.75,90,66.25,88,77.78999999999999,87.97"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="目-bg1"  class="badge-group"><circle cx="29.75" cy="15.55" r="3.5" fill="#bf0909"/><text class="num-single" x="29.75" y="15.55" dx="0" dy="-0.5">1</text></g>
<g id="目-bg2"  class="badge-group"><circle cx="32.54" cy="24.89" r="3.5" fill="#9abf09"/><text class="num-single" x="32.54" y="24.89" dx="0" dy="-0.5">2</text></g>
<g id="目-bg3"  class="badge-group"><circle cx="33.05" cy="43.64" r="3.5" fill="#09bf52"/><text class="num-single" x="33.05" y="43.64" dx="0" dy="-0.5">3</text></g>
<g id="目-bg4"  class="badge-group"><circle cx="32.9" cy="65.95" r="3.5" fill="#0952bf"/><text class="num-single" x="32.9" y="65.95" dx="0" dy="-0.5">4</text></g>
<g id="目-bg5"  class="badge-group"><circle cx="33" cy="90.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="33" y="90.5" dx="0" dy="-0.5">5</text></g>
</svg>