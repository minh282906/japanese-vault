<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (合)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #合-bg[i]: Thời gian quả bóng số nảy lên
   - #合-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#合-bg1  { animation-delay: 0.05s; }
#合-s1   { stroke-dasharray: 63.5480; stroke-dashoffset: 63.5480; animation: drawStroke 0.35s ease-out 0.18s forwards; }
#合-bg2  { animation-delay: 0.55s; }
#合-s2   { stroke-dasharray: 62.3261; stroke-dashoffset: 62.3261; animation: drawStroke 0.34s ease-out 0.68s forwards; }
#合-bg3  { animation-delay: 1.04s; }
#合-s3   { stroke-dasharray: 36.6780; stroke-dashoffset: 36.6780; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#合-bg4  { animation-delay: 1.41s; }
#合-s4   { stroke-dasharray: 28.5079; stroke-dashoffset: 28.5079; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#合-bg5  { animation-delay: 1.78s; }
#合-s5   { stroke-dasharray: 67.4718; stroke-dashoffset: 67.4718; animation: drawStroke 0.37s ease-out 1.91s forwards; }
#合-bg6  { animation-delay: 2.30s; }
#合-s6   { stroke-dasharray: 37.8303; stroke-dashoffset: 37.8303; animation: drawStroke 0.22s ease-out 2.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #合-s[i]) -->
<path id="合-s1"  class="stroke" stroke="#bf0909" d="M48.5,10.5C48.87,12.25,48.51,13.64,47.79,15.23C42.75,26.25,32.5,45.12,11,60"/>
<path id="合-s2"  class="stroke" stroke="#bfbf09" d="M50.25,14.75C55.66,21.52,76.17,41.14,85.71000000000001,49.67C89.04,52.65,92.08000000000001,54.71,96.5,55.75"/>
<path id="合-s3"  class="stroke" stroke="#09bf09" d="M31.38,53.77C33.31,54.25,35.03,54.27,38.26,54.02C44.629999999999995,53.510000000000005,53.449999999999996,52.38,62.28,51.720000000000006C64.17,51.580000000000005,66.1,51.510000000000005,67.88,51.96000000000001"/>
<path id="合-s4"  class="stroke" stroke="#09bfbf" d="M27.5,72.08C28.34,72.92,29.27,73.92,29.44,74.72C31.37,83.53,32.04,89.46,33.11,95.98C33.32,97.26,33.55,98.09,33.8,99.53"/>
<path id="合-s5"  class="stroke" stroke="#0909bf" d="M30.5,74.23C41,72.25,63.5,69.37,70.25999999999999,68.96000000000001C73.21,68.78,74.99999999999999,70.12,74.3,73.16000000000001C72.88,79.28000000000002,71.13,84.37,68.8,92.61000000000001"/>
<path id="合-s6"  class="stroke" stroke="#bf09bf" d="M33.63,96.19C43.28,95.58,54.77,94.58,66.76,93.84C68.27000000000001,93.75,69.81,93.66,71.37,93.59"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="合-bg1"  class="badge-group"><circle cx="48.5" cy="7.0" r="3.5" fill="#bf0909"/><text class="num-single" x="48.5" y="7.0" dx="0" dy="-0.5">1</text></g>
<g id="合-bg2"  class="badge-group"><circle cx="50.25" cy="18.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="50.25" y="18.25" dx="0" dy="-0.5">2</text></g>
<g id="合-bg3"  class="badge-group"><circle cx="31.38" cy="53.77" r="3.5" fill="#09bf09"/><text class="num-single" x="31.38" y="53.77" dx="0" dy="-0.5">3</text></g>
<g id="合-bg4"  class="badge-group"><circle cx="27.5" cy="68.58" r="3.5" fill="#09bfbf"/><text class="num-single" x="27.5" y="68.58" dx="0" dy="-0.5">4</text></g>
<g id="合-bg5"  class="badge-group"><circle cx="30.5" cy="77.73" r="3.5" fill="#0909bf"/><text class="num-single" x="30.5" y="77.73" dx="0" dy="-0.5">5</text></g>
<g id="合-bg6"  class="badge-group"><circle cx="33.63" cy="96.19" r="3.5" fill="#bf09bf"/><text class="num-single" x="33.63" y="96.19" dx="0" dy="-0.5">6</text></g>
</svg>