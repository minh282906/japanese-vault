<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (団)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #団-bg[i]: Thời gian quả bóng số nảy lên
   - #団-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#団-bg1  { animation-delay: 0.05s; }
#団-s1   { stroke-dasharray: 78.0821; stroke-dashoffset: 78.0821; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#団-bg2  { animation-delay: 0.63s; }
#団-s2   { stroke-dasharray: 150.5180; stroke-dashoffset: 150.5180; animation: drawStroke 0.55s ease-out 0.76s forwards; }
#団-bg3  { animation-delay: 1.33s; }
#団-s3   { stroke-dasharray: 51.3352; stroke-dashoffset: 51.3352; animation: drawStroke 0.28s ease-out 1.46s forwards; }
#団-bg4  { animation-delay: 1.76s; }
#団-s4   { stroke-dasharray: 62.2659; stroke-dashoffset: 62.2659; animation: drawStroke 0.34s ease-out 1.89s forwards; }
#団-bg5  { animation-delay: 2.25s; }
#団-s5   { stroke-dasharray: 16.3566; stroke-dashoffset: 16.3566; animation: drawStroke 0.22s ease-out 2.38s forwards; }
#団-bg6  { animation-delay: 2.62s; }
#団-s6   { stroke-dasharray: 68.7287; stroke-dashoffset: 68.7287; animation: drawStroke 0.38s ease-out 2.75s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #団-s[i]) -->
<path id="団-s1"  class="stroke" stroke="#bf0909" d="M17.5,17.32C18.47,18.29,19.15,20.38,19.15,21.73C19.15,30.630000000000003,19.169999999999998,80,19.169999999999998,88.76C19.169999999999998,90.69000000000001,19.08,92.76,19.08,95.01"/>
<path id="団-s2"  class="stroke" stroke="#bfbf09" d="M20.05,19.4C43.379999999999995,16.75,66.38,14.499999999999998,84.75,13.79C88.6,13.64,90,15.6,90,19.5C90,34,90.1,63,90.1,86.5C90.1,89.7,89.97999999999999,93.12,89.97999999999999,96"/>
<path id="団-s3"  class="stroke" stroke="#09bf09" d="M28.89,43.81C30.63,44.13,33.29,44.09,35.38,43.870000000000005C45.85,42.74,62.77,39.85000000000001,73.88,39.06C75.91,38.92,77.86999999999999,38.82,79.88,39.230000000000004"/>
<path id="団-s4"  class="stroke" stroke="#09bfbf" d="M62.37,24.33C63.14,25.099999999999998,63.93,26.369999999999997,63.93,27.869999999999997C63.93,40.959999999999994,64.02,72.6,64.02,75.78C64.02,83.5,59.199999999999996,76.92,57.78999999999999,75.94"/>
<path id="団-s5"  class="stroke" stroke="#0909bf" d="M39.07,54.03C42.63,57,46.63,62.75,48.32,67.34"/>
<path id="団-s6"  class="stroke" stroke="#bf09bf" d="M20.3,91.01C37.879999999999995,90.12,70.57000000000001,89.16000000000001,88.99,88.75"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="団-bg1"  class="badge-group"><circle cx="17.5" cy="13.82" r="3.5" fill="#bf0909"/><text class="num-single" x="17.5" y="13.82" dx="0" dy="-0.5">1</text></g>
<g id="団-bg2"  class="badge-group"><circle cx="20.05" cy="22.9" r="3.5" fill="#bfbf09"/><text class="num-single" x="20.05" y="22.9" dx="0" dy="-0.5">2</text></g>
<g id="団-bg3"  class="badge-group"><circle cx="28.89" cy="43.81" r="3.5" fill="#09bf09"/><text class="num-single" x="28.89" y="43.81" dx="0" dy="-0.5">3</text></g>
<g id="団-bg4"  class="badge-group"><circle cx="62.37" cy="24.33" r="3.5" fill="#09bfbf"/><text class="num-single" x="62.37" y="24.33" dx="0" dy="-0.5">4</text></g>
<g id="団-bg5"  class="badge-group"><circle cx="39.07" cy="54.03" r="3.5" fill="#0909bf"/><text class="num-single" x="39.07" y="54.03" dx="0" dy="-0.5">5</text></g>
<g id="団-bg6"  class="badge-group"><circle cx="20.3" cy="91.01" r="3.5" fill="#bf09bf"/><text class="num-single" x="20.3" y="91.01" dx="0" dy="-0.5">6</text></g>
</svg>