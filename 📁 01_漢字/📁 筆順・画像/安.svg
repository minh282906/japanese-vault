<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (安)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #安-bg[i]: Thời gian quả bóng số nảy lên
   - #安-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#安-bg1  { animation-delay: 0.05s; }
#安-s1   { stroke-dasharray: 14.4981; stroke-dashoffset: 14.4981; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#安-bg2  { animation-delay: 0.42s; }
#安-s2   { stroke-dasharray: 16.7093; stroke-dashoffset: 16.7093; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#安-bg3  { animation-delay: 0.79s; }
#安-s3   { stroke-dasharray: 70.6145; stroke-dashoffset: 70.6145; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#安-bg4  { animation-delay: 1.33s; }
#安-s4   { stroke-dasharray: 93.7162; stroke-dashoffset: 93.7162; animation: drawStroke 0.52s ease-out 1.46s forwards; }
#安-bg5  { animation-delay: 2.00s; }
#安-s5   { stroke-dasharray: 68.2261; stroke-dashoffset: 68.2261; animation: drawStroke 0.38s ease-out 2.13s forwards; }
#安-bg6  { animation-delay: 2.53s; }
#安-s6   { stroke-dasharray: 82.1863; stroke-dashoffset: 82.1863; animation: drawStroke 0.45s ease-out 2.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #安-s[i]) -->
<path id="安-s1"  class="stroke" stroke="#bf0909" d="M53.06,13.73C53.980000000000004,14.65,54.690000000000005,16.330000000000002,54.660000000000004,17.48C54.57,21.1,54.57,24.51,54.57,27.810000000000002"/>
<path id="安-s2"  class="stroke" stroke="#bfbf09" d="M26.67,28.85C26.67,32.45,23.35,42.35,21.840000000000003,44.75"/>
<path id="安-s3"  class="stroke" stroke="#09bf09" d="M27.53,30.96C40.25,29.380000000000003,68.5,26.75,81.67,26.1C91.49000000000001,25.62,83.12,32.75,79.5,36"/>
<path id="安-s4"  class="stroke" stroke="#09bfbf" d="M49.87,36.87C50.379999999999995,38.32,50.39,40.419999999999995,49.87,42.19C47.129999999999995,51.41,42.839999999999996,62.28,36.019999999999996,72.61C34.589999999999996,74.78,35.26,75.56,37.279999999999994,75.75C45.50999999999999,76.5,58.88999999999999,80.25,71.02,87.52C75.38,90.13,79.25999999999999,93.5,81.25999999999999,97"/>
<path id="安-s5"  class="stroke" stroke="#0909bf" d="M70,50C70.38,51.48,70.22,53.46,69.74,55.13C65.86,68.65,52.28999999999999,89.73,26.499999999999993,97.62"/>
<path id="安-s6"  class="stroke" stroke="#bf09bf" d="M15.13,60.22C17.98,60.96,21.35,60.64,24.25,60.42C35.58,59.57,64.97999999999999,55.870000000000005,88.97,55.78C91.24,55.77,95.16,56.11,97,56.74"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="安-bg1"  class="badge-group"><circle cx="53.06" cy="13.73" r="3.5" fill="#bf0909"/><text class="num-single" x="53.06" y="13.73" dx="0" dy="-0.5">1</text></g>
<g id="安-bg2"  class="badge-group"><circle cx="26.67" cy="25.35" r="3.5" fill="#bfbf09"/><text class="num-single" x="26.67" y="25.35" dx="0" dy="-0.5">2</text></g>
<g id="安-bg3"  class="badge-group"><circle cx="27.53" cy="34.46" r="3.5" fill="#09bf09"/><text class="num-single" x="27.53" y="34.46" dx="0" dy="-0.5">3</text></g>
<g id="安-bg4"  class="badge-group"><circle cx="49.87" cy="36.87" r="3.5" fill="#09bfbf"/><text class="num-single" x="49.87" y="36.87" dx="0" dy="-0.5">4</text></g>
<g id="安-bg5"  class="badge-group"><circle cx="70" cy="50" r="3.5" fill="#0909bf"/><text class="num-single" x="70" y="50" dx="0" dy="-0.5">5</text></g>
<g id="安-bg6"  class="badge-group"><circle cx="15.13" cy="60.22" r="3.5" fill="#bf09bf"/><text class="num-single" x="15.13" y="60.22" dx="0" dy="-0.5">6</text></g>
</svg>