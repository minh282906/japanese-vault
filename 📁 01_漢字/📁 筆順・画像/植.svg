<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (植)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #植-bg[i]: Thời gian quả bóng số nảy lên
   - #植-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#植-bg1  { animation-delay: 0.05s; }
#植-s1   { stroke-dasharray: 30.9853; stroke-dashoffset: 30.9853; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#植-bg2  { animation-delay: 0.42s; }
#植-s2   { stroke-dasharray: 75.9645; stroke-dashoffset: 75.9645; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#植-bg3  { animation-delay: 0.99s; }
#植-s3   { stroke-dasharray: 38.3841; stroke-dashoffset: 38.3841; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#植-bg4  { animation-delay: 1.36s; }
#植-s4   { stroke-dasharray: 13.0646; stroke-dashoffset: 13.0646; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#植-bg5  { animation-delay: 1.73s; }
#植-s5   { stroke-dasharray: 42.0267; stroke-dashoffset: 42.0267; animation: drawStroke 0.23s ease-out 1.86s forwards; }
#植-bg6  { animation-delay: 2.11s; }
#植-s6   { stroke-dasharray: 25.3101; stroke-dashoffset: 25.3101; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#植-bg7  { animation-delay: 2.48s; }
#植-s7   { stroke-dasharray: 38.8874; stroke-dashoffset: 38.8874; animation: drawStroke 0.22s ease-out 2.61s forwards; }
#植-bg8  { animation-delay: 2.85s; }
#植-s8   { stroke-dasharray: 65.2840; stroke-dashoffset: 65.2840; animation: drawStroke 0.36s ease-out 2.98s forwards; }
#植-bg9  { animation-delay: 3.36s; }
#植-s9   { stroke-dasharray: 26.2472; stroke-dashoffset: 26.2472; animation: drawStroke 0.22s ease-out 3.49s forwards; }
#植-bg10  { animation-delay: 3.73s; }
#植-s10   { stroke-dasharray: 26.2329; stroke-dashoffset: 26.2329; animation: drawStroke 0.22s ease-out 3.86s forwards; }
#植-bg11  { animation-delay: 4.10s; }
#植-s11   { stroke-dasharray: 26.2705; stroke-dashoffset: 26.2705; animation: drawStroke 0.22s ease-out 4.23s forwards; }
#植-bg12  { animation-delay: 4.47s; }
#植-s12   { stroke-dasharray: 79.1729; stroke-dashoffset: 79.1729; animation: drawStroke 0.44s ease-out 4.60s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

