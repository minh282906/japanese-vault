<path id="植-s8"  class="stroke" stroke="#0964bf" d="M60.47,42.84C63.15,42.690000000000005,82.28999999999999,40.080000000000005,84.75,39.900000000000006C86.68,39.760000000000005,88.29,41.82000000000001,88.29,42.900000000000006C88.29,45.10000000000001,88.09,61.760000000000005,88.05000000000001,74.25C88.04,75.8,88.04,77.29,88.04,78.67"/>
<path id="植-s9"  class="stroke" stroke="#0909bf" d="M60.92,54.52C66.01,54.32,82.94,52.68,87.1,52.68"/>
<path id="植-s10"  class="stroke" stroke="#6409bf" d="M60.62,66.43C67.41,65.94000000000001,80.19999999999999,64.69000000000001,86.78999999999999,64.69000000000001"/>
<path id="植-s11"  class="stroke" stroke="#bf09bf" d="M60.63,77.97C65.36,77.53,83.41,75.95,86.82000000000001,75.95"/>
<path id="植-s12"  class="stroke" stroke="#bf0964" d="M48.18,58.72C48.87,59.86,49.21,60.32,49.21,62.6S48.88,81.37,48.93,85.22C48.96,87.56,50.089999999999996,88.55,52.17,88.39C66.13,87.37,76.75,86.75,93.01,86.26C94.9,86.2,97.38000000000001,86.12,99.25,86.63000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="植-bg1"  class="badge-group"><circle cx="12.53" cy="36.47" r="3.5" fill="#bf0909"/><text class="num-single" x="12.53" y="36.47" dx="0" dy="-0.5">1</text></g>
