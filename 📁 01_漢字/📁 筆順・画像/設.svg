<path id="設-s6"  class="stroke" stroke="#09bf8d" d="M21.14,72.69C27.66,71.95,32.620000000000005,70.58,38.510000000000005,69.75999999999999C40.92,69.42999999999999,42.28000000000001,70.24,41.68000000000001,72.72999999999999C40.82000000000001,76.30999999999999,39.980000000000004,80.38999999999999,38.440000000000005,86.01999999999998"/>
<path id="設-s7"  class="stroke" stroke="#098dbf" d="M23.71,88.75C27.91,88.36,31.060000000000002,87.79,36.27,87.29C37.470000000000006,87.18,38.870000000000005,87.12,40.040000000000006,87.17"/>
<path id="設-s8"  class="stroke" stroke="#092abf" d="M55.6,16.86C56.25,17.5,56.58,18.91,56.56,19.919999999999998C56.38,30.36,54.78,39.62,49.86,44.269999999999996"/>
<path id="設-s9"  class="stroke" stroke="#4b09bf" d="M57.25,17.88C62.25,17.259999999999998,71.46000000000001,15.479999999999999,73.1,14.909999999999998C75.38,14.129999999999999,76.63,15.379999999999999,76.22,17.529999999999998C75.45,21.599999999999998,75.5,25.119999999999997,75.5,29.24C75.5,37.26,76.75,39.31,83.89,39.31C90.97,39.31,92.28,37.300000000000004,92.28,30.21"/>
<path id="設-s10"  class="stroke" stroke="#ae09bf" d="M51.93,52.93C53.37,53.31,54.78,53.46,57.69,53.06C61.62,52.510000000000005,73.67,49.89,75.67999999999999,49.42C78.49,48.760000000000005,80.36999999999999,51.010000000000005,78.88999999999999,54.06C71.59,69.06,61,85.75,45.88,94.17"/>
<path id="設-s11"  class="stroke" stroke="#bf096c" d="M50.29,60.24C56.129999999999995,60.120000000000005,72.13,78.5,85.97,88.98C88.25,90.7,90.82,92.75,93.42999999999999,93.91"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="設-bg1"  class="badge-group"><circle cx="26.05" cy="15" r="3.5" fill="#bf0909"/><text class="num-single" x="26.05" y="15" dx="0" dy="-0.5">1</text></g>
