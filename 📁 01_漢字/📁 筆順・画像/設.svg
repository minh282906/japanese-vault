<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (設)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #設-bg[i]: Thời gian quả bóng số nảy lên
   - #設-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#設-bg1  { animation-delay: 0.05s; }
#設-s1   { stroke-dasharray: 10.5695; stroke-dashoffset: 10.5695; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#設-bg2  { animation-delay: 0.42s; }
#設-s2   { stroke-dasharray: 30.6536; stroke-dashoffset: 30.6536; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#設-bg3  { animation-delay: 0.79s; }
#設-s3   { stroke-dasharray: 20.5105; stroke-dashoffset: 20.5105; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#設-bg4  { animation-delay: 1.16s; }
#設-s4   { stroke-dasharray: 20.9920; stroke-dashoffset: 20.9920; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#設-bg5  { animation-delay: 1.53s; }
#設-s5   { stroke-dasharray: 20.1336; stroke-dashoffset: 20.1336; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#設-bg6  { animation-delay: 1.90s; }
#設-s6   { stroke-dasharray: 36.8479; stroke-dashoffset: 36.8479; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#設-bg7  { animation-delay: 2.27s; }
#設-s7   { stroke-dasharray: 16.4198; stroke-dashoffset: 16.4198; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#設-bg8  { animation-delay: 2.64s; }
#設-s8   { stroke-dasharray: 29.1330; stroke-dashoffset: 29.1330; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#設-bg9  { animation-delay: 3.01s; }
#設-s9   { stroke-dasharray: 63.7437; stroke-dashoffset: 63.7437; animation: drawStroke 0.35s ease-out 3.14s forwards; }
#設-bg10  { animation-delay: 3.51s; }
#設-s10   { stroke-dasharray: 84.3470; stroke-dashoffset: 84.3470; animation: drawStroke 0.46s ease-out 3.64s forwards; }
#設-bg11  { animation-delay: 4.12s; }
#設-s11   { stroke-dasharray: 55.0898; stroke-dashoffset: 55.0898; animation: drawStroke 0.30s ease-out 4.25s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

