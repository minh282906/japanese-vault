<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (力)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #力-bg[i]: Thời gian quả bóng số nảy lên
   - #力-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#力-bg1  { animation-delay: 0.05s; }
#力-s1   { stroke-dasharray: 145.8030; stroke-dashoffset: 145.8030; animation: drawStroke 0.55s ease-out 0.18s forwards; }
#力-bg2  { animation-delay: 0.75s; }
#力-s2   { stroke-dasharray: 90.3927; stroke-dashoffset: 90.3927; animation: drawStroke 0.50s ease-out 0.88s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 2 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #力-s[i]) -->
<path id="力-s1"  class="stroke" stroke="#bf0909" d="M21.5,38.25C24.21,39.41,26.98,39.38,29.77,38.96C44.21,36.82,69.13,32.75,83,30.75C87.48,30.1,89.25,32.13,88.5,36.5C85.69,52.870000000000005,79.5,75.25,68.5,89.75C62.36,97.84,59,92.75,56,89"/>
<path id="力-s2"  class="stroke" stroke="#09bfbf" d="M56.88,13.68C57.5,16.25,57.440000000000005,18.31,56.88,20.87C52.77,39.84,40.35,70.14,13.39,89.66000000000001"/>

<!-- ============================================================
     BẢNG 2 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="力-bg1"  class="badge-group"><circle cx="21.5" cy="38.25" r="3.5" fill="#bf0909"/><text class="num-single" x="21.5" y="38.25" dx="0" dy="-0.5">1</text></g>
<g id="力-bg2"  class="badge-group"><circle cx="56.88" cy="13.68" r="3.5" fill="#09bfbf"/><text class="num-single" x="56.88" y="13.68" dx="0" dy="-0.5">2</text></g>
</svg>