<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (迷)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #迷-bg[i]: Thời gian quả bóng số nảy lên
   - #迷-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#迷-bg1  { animation-delay: 0.05s; }
#迷-s1   { stroke-dasharray: 15.9044; stroke-dashoffset: 15.9044; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#迷-bg2  { animation-delay: 0.42s; }
#迷-s2   { stroke-dasharray: 16.9423; stroke-dashoffset: 16.9423; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#迷-bg3  { animation-delay: 0.79s; }
#迷-s3   { stroke-dasharray: 51.3283; stroke-dashoffset: 51.3283; animation: drawStroke 0.28s ease-out 0.92s forwards; }
#迷-bg4  { animation-delay: 1.22s; }
#迷-s4   { stroke-dasharray: 73.1640; stroke-dashoffset: 73.1640; animation: drawStroke 0.40s ease-out 1.35s forwards; }
#迷-bg5  { animation-delay: 1.77s; }
#迷-s5   { stroke-dasharray: 36.6938; stroke-dashoffset: 36.6938; animation: drawStroke 0.22s ease-out 1.90s forwards; }
#迷-bg6  { animation-delay: 2.14s; }
#迷-s6   { stroke-dasharray: 29.1170; stroke-dashoffset: 29.1170; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#迷-bg7  { animation-delay: 2.51s; }
#迷-s7   { stroke-dasharray: 14.4726; stroke-dashoffset: 14.4726; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#迷-bg8  { animation-delay: 2.88s; }
#迷-s8   { stroke-dasharray: 58.7409; stroke-dashoffset: 58.7409; animation: drawStroke 0.32s ease-out 3.01s forwards; }
#迷-bg9  { animation-delay: 3.35s; }
#迷-s9   { stroke-dasharray: 75.7016; stroke-dashoffset: 75.7016; animation: drawStroke 0.42s ease-out 3.48s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #迷-s[i]) -->
<path id="迷-s1"  class="stroke" stroke="#bf0909" d="M44.32,24.39C47.56,26.79,52.44,33.57,53.25,37.3"/>
<path id="迷-s2"  class="stroke" stroke="#bf8209" d="M85.76,21.47C85.84,22.29,85.80000000000001,23.099999999999998,85.41000000000001,23.82C83.75000000000001,26.88,80.62,31.15,76.57000000000001,35.3"/>
<path id="迷-s3"  class="stroke" stroke="#82bf09" d="M40.35,47.23C42.5,47.62,45.050000000000004,47.589999999999996,47.25,47.26C57.44,45.76,74.44,43.94,83.89,43.03C86.36,42.79,88.92,42.68,91.36,43.300000000000004"/>
<path id="迷-s4"  class="stroke" stroke="#09bf09" d="M64.77,11.96C65.64999999999999,12.840000000000002,66.11,14.25,66.11,15.65C66.11,20.87,66.03,71.12,66.03,76.25C66.03,80.61,65.97,83.73,65.93,84.78999999999999"/>
<path id="迷-s5"  class="stroke" stroke="#09bf82" d="M62.27,46.71C62.27,47.62,61.92,48.63,61.080000000000005,50.18C56.14000000000001,59.26,47.290000000000006,69.68,39.25000000000001,74.48"/>
<path id="迷-s6"  class="stroke" stroke="#0982bf" d="M70.62,51.32C78.23,56.45,84.82000000000001,62.58,90.52000000000001,72.22"/>
<path id="迷-s7"  class="stroke" stroke="#0909bf" d="M18.21,20.25C21.84,21.99,27.590000000000003,27.42,28.5,30.130000000000003"/>
<path id="迷-s8"  class="stroke" stroke="#8209bf" d="M12.5,56.25C14.120000000000001,56.75,16.27,56.79,17.25,56.48C20.37,55.5,25.04,52.949999999999996,27.25,51.989999999999995C29.25,51.12,30.73,52.03999999999999,29.5,54.559999999999995C23,67.86999999999999,21.62,62.12,29.25,71.57C30.25,72.80999999999999,30.25,74.38999999999999,28.75,75.55999999999999S21.87,81.11999999999999,18.5,83.48999999999998"/>
<path id="迷-s9"  class="stroke" stroke="#bf0982" d="M13.5,85.25C16.5,84.75,22.67,84.47,27.25,85C34.75,85.88,57.32,91.96,61.75,93.25C73.75,96.75,80.13,97.13,87.75,97.5"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="迷-bg1"  class="badge-group"><circle cx="44.32" cy="24.39" r="3.5" fill="#bf0909"/><text class="num-single" x="44.32" y="24.39" dx="0" dy="-0.5">1</text></g>
<g id="迷-bg2"  class="badge-group"><circle cx="85.76" cy="21.47" r="3.5" fill="#bf8209"/><text class="num-single" x="85.76" y="21.47" dx="0" dy="-0.5">2</text></g>
<g id="迷-bg3"  class="badge-group"><circle cx="40.35" cy="47.23" r="3.5" fill="#82bf09"/><text class="num-single" x="40.35" y="47.23" dx="0" dy="-0.5">3</text></g>
<g id="迷-bg4"  class="badge-group"><circle cx="64.77" cy="11.96" r="3.5" fill="#09bf09"/><text class="num-single" x="64.77" y="11.96" dx="0" dy="-0.5">4</text></g>
<g id="迷-bg5"  class="badge-group"><circle cx="62.27" cy="46.71" r="3.5" fill="#09bf82"/><text class="num-single" x="62.27" y="46.71" dx="0" dy="-0.5">5</text></g>
<g id="迷-bg6"  class="badge-group"><circle cx="70.62" cy="51.32" r="3.5" fill="#0982bf"/><text class="num-single" x="70.62" y="51.32" dx="0" dy="-0.5">6</text></g>
<g id="迷-bg7"  class="badge-group"><circle cx="18.21" cy="20.25" r="3.5" fill="#0909bf"/><text class="num-single" x="18.21" y="20.25" dx="0" dy="-0.5">7</text></g>
<g id="迷-bg8"  class="badge-group"><circle cx="12.5" cy="56.25" r="3.5" fill="#8209bf"/><text class="num-single" x="12.5" y="56.25" dx="0" dy="-0.5">8</text></g>
<g id="迷-bg9"  class="badge-group"><circle cx="13.5" cy="85.25" r="3.5" fill="#bf0982"/><text class="num-single" x="13.5" y="85.25" dx="0" dy="-0.5">9</text></g>
</svg>