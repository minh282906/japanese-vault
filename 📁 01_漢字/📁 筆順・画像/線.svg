<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (線)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #線-bg[i]: Thời gian quả bóng số nảy lên
   - #線-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#線-bg1  { animation-delay: 0.05s; }
#線-s1   { stroke-dasharray: 42.5081; stroke-dashoffset: 42.5081; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#線-bg2  { animation-delay: 0.43s; }
#線-s2   { stroke-dasharray: 65.0988; stroke-dashoffset: 65.0988; animation: drawStroke 0.36s ease-out 0.56s forwards; }
#線-bg3  { animation-delay: 0.94s; }
#線-s3   { stroke-dasharray: 14.6930; stroke-dashoffset: 14.6930; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#線-bg4  { animation-delay: 1.31s; }
#線-s4   { stroke-dasharray: 36.9732; stroke-dashoffset: 36.9732; animation: drawStroke 0.22s ease-out 1.44s forwards; }
#線-bg5  { animation-delay: 1.68s; }
#線-s5   { stroke-dasharray: 18.4331; stroke-dashoffset: 18.4331; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#線-bg6  { animation-delay: 2.05s; }
#線-s6   { stroke-dasharray: 14.0811; stroke-dashoffset: 14.0811; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#線-bg7  { animation-delay: 2.42s; }
#線-s7   { stroke-dasharray: 13.5724; stroke-dashoffset: 13.5724; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#線-bg8  { animation-delay: 2.79s; }
#線-s8   { stroke-dasharray: 25.4325; stroke-dashoffset: 25.4325; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#線-bg9  { animation-delay: 3.16s; }
#線-s9   { stroke-dasharray: 61.4135; stroke-dashoffset: 61.4135; animation: drawStroke 0.34s ease-out 3.29s forwards; }
#線-bg10  { animation-delay: 3.65s; }
#線-s10   { stroke-dasharray: 32.4023; stroke-dashoffset: 32.4023; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#線-bg11  { animation-delay: 4.02s; }
#線-s11   { stroke-dasharray: 28.1270; stroke-dashoffset: 28.1270; animation: drawStroke 0.22s ease-out 4.15s forwards; }
#線-bg12  { animation-delay: 4.39s; }
#線-s12   { stroke-dasharray: 50.8482; stroke-dashoffset: 50.8482; animation: drawStroke 0.28s ease-out 4.52s forwards; }
#線-bg13  { animation-delay: 4.82s; }
#線-s13   { stroke-dasharray: 49.7786; stroke-dashoffset: 49.7786; animation: drawStroke 0.27s ease-out 4.95s forwards; }
#線-bg14  { animation-delay: 5.24s; }
#線-s14   { stroke-dasharray: 16.0852; stroke-dashoffset: 16.0852; animation: drawStroke 0.22s ease-out 5.37s forwards; }
#線-bg15  { animation-delay: 5.61s; }
#線-s15   { stroke-dasharray: 39.3863; stroke-dashoffset: 39.3863; animation: drawStroke 0.22s ease-out 5.74s forwards; }
]]>
</style>

