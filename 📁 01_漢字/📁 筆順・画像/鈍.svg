<path id="鈍-s1"  class="stroke" stroke="#bf0909" d="M31.5,14.99C31.5,15.77,31.55,16.39,31.35,17.32C30.310000000000002,22.19,20.68,38.42,12.220000000000002,45.620000000000005"/>
