<path id="鈍-s7"  class="stroke" stroke="#09bfbf" d="M43.04,63.3C43.269999999999996,64.00999999999999,43.28,64.84,43.05,65.39999999999999C42.12,67.63,41,69.75999999999999,38.419999999999995,74.27999999999999"/>
<path id="鈍-s8"  class="stroke" stroke="#0964bf" d="M14.25,91.25C15.13,92.13,16.25,92.25,17.75,91.5C23.75,88.5,29.25,86.25,42.25,80.25"/>
<path id="鈍-s9"  class="stroke" stroke="#0909bf" d="M83.49,23.54C83.49,24.369999999999997,82.99,25.34,82.32,25.83C76.61999999999999,30,67.36999999999999,34.87,50.29999999999999,40.599999999999994"/>
<path id="鈍-s10"  class="stroke" stroke="#6409bf" d="M51.47,48.92C52.28,49.730000000000004,52.61,50.88,52.55,52.34C52.379999999999995,56.13,52.279999999999994,60.260000000000005,52.01,64.64C51.87,66.9,52.01,67.76,54.16,67.33C64.75,65.22,73.50999999999999,63.76,83.71,62.269999999999996"/>
<path id="鈍-s11"  class="stroke" stroke="#bf09bf" d="M85.42,42.27C86.45,43.300000000000004,86.56,44.52,86.49,45.540000000000006C86.25999999999999,49.190000000000005,85.75,53.870000000000005,85.19,59.77000000000001C85.02,61.53000000000001,84.82,63.41000000000001,84.59,65.39000000000001"/>
<path id="鈍-s12"  class="stroke" stroke="#bf0964" d="M66.12,13.37C67.44,14.69,67.64,15.87,67.64,18C67.64,27.04,67.74,69.35,67.63,81.55C67.53,92.58,69.03999999999999,94.27,81.16,94.27C94.92,94.27,96,93.08,96,84.21"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="鈍-bg1"  class="badge-group"><circle cx="31.5" cy="11.49" r="3.5" fill="#bf0909"/><text class="num-single" x="31.5" y="11.49" dx="0" dy="-0.5">1</text></g>
