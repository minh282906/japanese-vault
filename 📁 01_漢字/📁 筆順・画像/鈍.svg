<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (鈍)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #鈍-bg[i]: Thời gian quả bóng số nảy lên
   - #鈍-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#鈍-bg1  { animation-delay: 0.05s; }
#鈍-s1   { stroke-dasharray: 36.8084; stroke-dashoffset: 36.8084; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#鈍-bg2  { animation-delay: 0.42s; }
#鈍-s2   { stroke-dasharray: 16.0068; stroke-dashoffset: 16.0068; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#鈍-bg3  { animation-delay: 0.79s; }
#鈍-s3   { stroke-dasharray: 23.0274; stroke-dashoffset: 23.0274; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#鈍-bg4  { animation-delay: 1.16s; }
#鈍-s4   { stroke-dasharray: 31.4459; stroke-dashoffset: 31.4459; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#鈍-bg5  { animation-delay: 1.53s; }
#鈍-s5   { stroke-dasharray: 38.6176; stroke-dashoffset: 38.6176; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#鈍-bg6  { animation-delay: 1.90s; }
#鈍-s6   { stroke-dasharray: 11.6172; stroke-dashoffset: 11.6172; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#鈍-bg7  { animation-delay: 2.27s; }
#鈍-s7   { stroke-dasharray: 12.1598; stroke-dashoffset: 12.1598; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#鈍-bg8  { animation-delay: 2.64s; }
#鈍-s8   { stroke-dasharray: 30.7512; stroke-dashoffset: 30.7512; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#鈍-bg9  { animation-delay: 3.01s; }
#鈍-s9   { stroke-dasharray: 38.0451; stroke-dashoffset: 38.0451; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#鈍-bg10  { animation-delay: 3.38s; }
#鈍-s10   { stroke-dasharray: 50.4728; stroke-dashoffset: 50.4728; animation: drawStroke 0.28s ease-out 3.51s forwards; }
#鈍-bg11  { animation-delay: 3.81s; }
#鈍-s11   { stroke-dasharray: 23.5010; stroke-dashoffset: 23.5010; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#鈍-bg12  { animation-delay: 4.18s; }
#鈍-s12   { stroke-dasharray: 113.2350; stroke-dashoffset: 113.2350; animation: drawStroke 0.55s ease-out 4.31s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

