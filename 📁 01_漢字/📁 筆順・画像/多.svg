<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (多)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #多-bg[i]: Thời gian quả bóng số nảy lên
   - #多-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#多-bg1  { animation-delay: 0.05s; }
#多-s1   { stroke-dasharray: 26.6908; stroke-dashoffset: 26.6908; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#多-bg2  { animation-delay: 0.42s; }
#多-s2   { stroke-dasharray: 85.4182; stroke-dashoffset: 85.4182; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#多-bg3  { animation-delay: 1.04s; }
#多-s3   { stroke-dasharray: 12.0343; stroke-dashoffset: 12.0343; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#多-bg4  { animation-delay: 1.41s; }
#多-s4   { stroke-dasharray: 37.3527; stroke-dashoffset: 37.3527; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#多-bg5  { animation-delay: 1.78s; }
#多-s5   { stroke-dasharray: 99.5223; stroke-dashoffset: 99.5223; animation: drawStroke 0.55s ease-out 1.91s forwards; }
#多-bg6  { animation-delay: 2.48s; }
#多-s6   { stroke-dasharray: 13.2972; stroke-dashoffset: 13.2972; animation: drawStroke 0.22s ease-out 2.61s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #多-s[i]) -->
<path id="多-s1"  class="stroke" stroke="#bf0909" d="M45.82,11.92C46,13,45.6,14.219999999999999,45.160000000000004,14.93C42.5,19.25,37,26.33,28.5,31.25"/>
<path id="多-s2"  class="stroke" stroke="#bfbf09" d="M48.24,16.65C49.620000000000005,16.869999999999997,51.39,16.729999999999997,53.03,16.529999999999998C58.620000000000005,15.869999999999997,62.75,15.249999999999998,67.93,14.229999999999997C71.08000000000001,13.609999999999998,72,15.379999999999997,70.94000000000001,17.689999999999998C66.48000000000002,27.43,46.12000000000001,49.129999999999995,26.66000000000001,55.349999999999994"/>
<path id="多-s3"  class="stroke" stroke="#09bf09" d="M40,28.25C42.67,29.81,47,34.75,47.75,37.25"/>
<path id="多-s4"  class="stroke" stroke="#09bfbf" d="M58.5,42.25C58.75,43.75,58.39,45.03,58.02,45.85C55.25,52,48.75,59.5,33.75,68.5"/>
<path id="多-s5"  class="stroke" stroke="#0909bf" d="M60.42,48.62C62,48.75,63.43,48.71,65.02,48.529999999999994C70.88,47.87,74.25,47.37,78.5,46.49999999999999C81.63,45.85999999999999,83.12,48.11999999999999,81.98,50.58999999999999C76.98,61.37999999999999,58.370000000000005,85.49999999999999,27.250000000000007,98.74999999999999"/>
<path id="多-s6"  class="stroke" stroke="#bf09bf" d="M48.25,63C51.18,64.73,55.92,70.22,56.75,73"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="多-bg1"  class="badge-group"><circle cx="45.82" cy="8.42" r="3.5" fill="#bf0909"/><text class="num-single" x="45.82" y="8.42" dx="0" dy="-0.5">1</text></g>
<g id="多-bg2"  class="badge-group"><circle cx="48.24" cy="20.15" r="3.5" fill="#bfbf09"/><text class="num-single" x="48.24" y="20.15" dx="0" dy="-0.5">2</text></g>
<g id="多-bg3"  class="badge-group"><circle cx="40" cy="28.25" r="3.5" fill="#09bf09"/><text class="num-single" x="40" y="28.25" dx="0" dy="-0.5">3</text></g>
<g id="多-bg4"  class="badge-group"><circle cx="58.5" cy="38.75" r="3.5" fill="#09bfbf"/><text class="num-single" x="58.5" y="38.75" dx="0" dy="-0.5">4</text></g>
<g id="多-bg5"  class="badge-group"><circle cx="60.42" cy="52.12" r="3.5" fill="#0909bf"/><text class="num-single" x="60.42" y="52.12" dx="0" dy="-0.5">5</text></g>
<g id="多-bg6"  class="badge-group"><circle cx="48.25" cy="63" r="3.5" fill="#bf09bf"/><text class="num-single" x="48.25" y="63" dx="0" dy="-0.5">6</text></g>
</svg>