<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (放)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #放-bg[i]: Thời gian quả bóng số nảy lên
   - #放-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#放-bg1  { animation-delay: 0.05s; }
#放-s1   { stroke-dasharray: 16.1218; stroke-dashoffset: 16.1218; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#放-bg2  { animation-delay: 0.42s; }
#放-s2   { stroke-dasharray: 39.3016; stroke-dashoffset: 39.3016; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#放-bg3  { animation-delay: 0.79s; }
#放-s3   { stroke-dasharray: 66.3227; stroke-dashoffset: 66.3227; animation: drawStroke 0.36s ease-out 0.92s forwards; }
#放-bg4  { animation-delay: 1.30s; }
#放-s4   { stroke-dasharray: 49.1650; stroke-dashoffset: 49.1650; animation: drawStroke 0.27s ease-out 1.43s forwards; }
#放-bg5  { animation-delay: 1.72s; }
#放-s5   { stroke-dasharray: 40.1360; stroke-dashoffset: 40.1360; animation: drawStroke 0.22s ease-out 1.85s forwards; }
#放-bg6  { animation-delay: 2.09s; }
#放-s6   { stroke-dasharray: 32.4023; stroke-dashoffset: 32.4023; animation: drawStroke 0.22s ease-out 2.22s forwards; }
#放-bg7  { animation-delay: 2.46s; }
#放-s7   { stroke-dasharray: 64.7062; stroke-dashoffset: 64.7062; animation: drawStroke 0.36s ease-out 2.59s forwards; }
#放-bg8  { animation-delay: 2.97s; }
#放-s8   { stroke-dasharray: 52.5485; stroke-dashoffset: 52.5485; animation: drawStroke 0.29s ease-out 3.10s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #放-s[i]) -->
<path id="放-s1"  class="stroke" stroke="#bf0909" d="M33.36,14.75C34.68,16.07,35.339999999999996,17.5,35.339999999999996,19.16C35.339999999999996,23.12,35.19,26.75,35.19,30.310000000000002"/>
<path id="放-s2"  class="stroke" stroke="#bf9109" d="M13.25,33.12C15.5,33.5,17.259999999999998,33.62,19.39,33.43C29.270000000000003,32.55,37.25,31.37,45.41,30C47.69,29.62,50.01,29.37,52.26,29.62"/>
<path id="放-s3"  class="stroke" stroke="#64bf09" d="M33,45.75C36.34,46.27,39.63,46.78,42.99,47.11C46.400000000000006,47.45,46.81,50.1,46.5,52.75C45.5,61.25,37.76,82.18,33.12,87.58C28.249999999999996,93.25,25.4,87.84,24.029999999999998,87.01"/>
<path id="放-s4"  class="stroke" stroke="#09bf36" d="M32.75,34.75C33.37,35.87,33.66,37.29,33.37,38.7C31.22,49.12,24.6,65.77,10.5,76.5"/>
<path id="放-s5"  class="stroke" stroke="#09bfbf" d="M68,15.39C68.25,16.5,68.2,17.41,67.92,18.62C66.13,26.130000000000003,60.83,41.56,53.010000000000005,52.120000000000005"/>
<path id="放-s6"  class="stroke" stroke="#0936bf" d="M62.76,39.82C64.41,40.08,65.72,40.27,67.39,40.08C74.35,39.309999999999995,82.87,36.989999999999995,90.51,35.78C91.7,35.59,93.48,35.300000000000004,94.7,35.68"/>
<path id="放-s7"  class="stroke" stroke="#6409bf" d="M80.35,42C80.89999999999999,43.26,81.19999999999999,44.17,80.61999999999999,46.480000000000004C75.43,67.47,65,84.38,46.48,93.5"/>
<path id="放-s8"  class="stroke" stroke="#bf0991" d="M59.15,53.28C61.839999999999996,53.92,77.42,75.95,87.66,85.56C89.83,87.60000000000001,92.39999999999999,90.01,95.36999999999999,90.75"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="放-bg1"  class="badge-group"><circle cx="33.36" cy="14.75" r="3.5" fill="#bf0909"/><text class="num-single" x="33.36" y="14.75" dx="0" dy="-0.5">1</text></g>
<g id="放-bg2"  class="badge-group"><circle cx="13.25" cy="33.12" r="3.5" fill="#bf9109"/><text class="num-single" x="13.25" y="33.12" dx="0" dy="-0.5">2</text></g>
<g id="放-bg3"  class="badge-group"><circle cx="33" cy="45.75" r="3.5" fill="#64bf09"/><text class="num-single" x="33" y="45.75" dx="0" dy="-0.5">3</text></g>
<g id="放-bg4"  class="badge-group"><circle cx="32.75" cy="34.75" r="3.5" fill="#09bf36"/><text class="num-single" x="32.75" y="34.75" dx="0" dy="-0.5">4</text></g>
<g id="放-bg5"  class="badge-group"><circle cx="68" cy="15.39" r="3.5" fill="#09bfbf"/><text class="num-single" x="68" y="15.39" dx="0" dy="-0.5">5</text></g>
<g id="放-bg6"  class="badge-group"><circle cx="62.76" cy="39.82" r="3.5" fill="#0936bf"/><text class="num-single" x="62.76" y="39.82" dx="0" dy="-0.5">6</text></g>
<g id="放-bg7"  class="badge-group"><circle cx="80.35" cy="42" r="3.5" fill="#6409bf"/><text class="num-single" x="80.35" y="42" dx="0" dy="-0.5">7</text></g>
<g id="放-bg8"  class="badge-group"><circle cx="59.15" cy="53.28" r="3.5" fill="#bf0991"/><text class="num-single" x="59.15" y="53.28" dx="0" dy="-0.5">8</text></g>
</svg>