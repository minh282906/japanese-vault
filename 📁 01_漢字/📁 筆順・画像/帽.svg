<path id="帽-s1"  class="stroke" stroke="#bf0909" d="M15.49,35.56C16.28,36.35,16.66,37.5,16.66,38.96C16.66,44.03,16.74,53.28,16.69,60.45C16.67,63.230000000000004,16.650000000000002,65.54,16.630000000000003,66.88"/>
