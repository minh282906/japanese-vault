<path id="帽-s9"  class="stroke" stroke="#0909bf" d="M57.93,51.69C60.42,51.54,79.02,49.669999999999995,83.88,49.23C86.78999999999999,48.959999999999994,88.28999999999999,50.22,88.28999999999999,53.279999999999994C88.28999999999999,57.25999999999999,88.47,72.3,88.35,85.75999999999999C88.32,89.02,88.3,92.17999999999999,88.30999999999999,95.05999999999999"/>
<path id="帽-s10"  class="stroke" stroke="#6409bf" d="M58.49,64.4C65.63,63.50000000000001,83,62.050000000000004,87.33,62.050000000000004"/>
<path id="帽-s11"  class="stroke" stroke="#bf09bf" d="M58.36,77.47C65.51,76.91,80.32,75.23,87.25999999999999,75.23"/>
<path id="帽-s12"  class="stroke" stroke="#bf0964" d="M58.08,92.06C63.989999999999995,91.76,80.42,90.33,87.1,90.33"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
