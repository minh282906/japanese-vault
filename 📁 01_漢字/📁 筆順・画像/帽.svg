<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (帽)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #帽-bg[i]: Thời gian quả bóng số nảy lên
   - #帽-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#帽-bg1  { animation-delay: 0.05s; }
#帽-s1   { stroke-dasharray: 31.6126; stroke-dashoffset: 31.6126; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#帽-bg2  { animation-delay: 0.42s; }
#帽-s2   { stroke-dasharray: 64.0446; stroke-dashoffset: 64.0446; animation: drawStroke 0.35s ease-out 0.55s forwards; }
#帽-bg3  { animation-delay: 0.92s; }
#帽-s3   { stroke-dasharray: 83.6416; stroke-dashoffset: 83.6416; animation: drawStroke 0.46s ease-out 1.05s forwards; }
#帽-bg4  { animation-delay: 1.53s; }
#帽-s4   { stroke-dasharray: 27.5821; stroke-dashoffset: 27.5821; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#帽-bg5  { animation-delay: 1.90s; }
#帽-s5   { stroke-dasharray: 65.6628; stroke-dashoffset: 65.6628; animation: drawStroke 0.36s ease-out 2.03s forwards; }
#帽-bg6  { animation-delay: 2.41s; }
#帽-s6   { stroke-dasharray: 35.2909; stroke-dashoffset: 35.2909; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#帽-bg7  { animation-delay: 2.78s; }
#帽-s7   { stroke-dasharray: 33.2638; stroke-dashoffset: 33.2638; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#帽-bg8  { animation-delay: 3.15s; }
#帽-s8   { stroke-dasharray: 46.0199; stroke-dashoffset: 46.0199; animation: drawStroke 0.25s ease-out 3.28s forwards; }
#帽-bg9  { animation-delay: 3.55s; }
#帽-s9   { stroke-dasharray: 74.8944; stroke-dashoffset: 74.8944; animation: drawStroke 0.41s ease-out 3.68s forwards; }
#帽-bg10  { animation-delay: 4.11s; }
#帽-s10   { stroke-dasharray: 28.9430; stroke-dashoffset: 28.9430; animation: drawStroke 0.22s ease-out 4.24s forwards; }
#帽-bg11  { animation-delay: 4.48s; }
#帽-s11   { stroke-dasharray: 28.9935; stroke-dashoffset: 28.9935; animation: drawStroke 0.22s ease-out 4.61s forwards; }
#帽-bg12  { animation-delay: 4.85s; }
#帽-s12   { stroke-dasharray: 29.0750; stroke-dashoffset: 29.0750; animation: drawStroke 0.22s ease-out 4.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

