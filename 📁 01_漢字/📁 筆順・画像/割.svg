<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (割)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #割-bg[i]: Thời gian quả bóng số nảy lên
   - #割-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#割-bg1  { animation-delay: 0.05s; }
#割-s1   { stroke-dasharray: 12.1379; stroke-dashoffset: 12.1379; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#割-bg2  { animation-delay: 0.42s; }
#割-s2   { stroke-dasharray: 15.0813; stroke-dashoffset: 15.0813; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#割-bg3  { animation-delay: 0.79s; }
#割-s3   { stroke-dasharray: 52.8164; stroke-dashoffset: 52.8164; animation: drawStroke 0.29s ease-out 0.92s forwards; }
#割-bg4  { animation-delay: 1.23s; }
#割-s4   { stroke-dasharray: 30.5310; stroke-dashoffset: 30.5310; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#割-bg5  { animation-delay: 1.60s; }
#割-s5   { stroke-dasharray: 30.3457; stroke-dashoffset: 30.3457; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#割-bg6  { animation-delay: 1.97s; }
#割-s6   { stroke-dasharray: 30.3312; stroke-dashoffset: 30.3312; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#割-bg7  { animation-delay: 2.34s; }
#割-s7   { stroke-dasharray: 47.6414; stroke-dashoffset: 47.6414; animation: drawStroke 0.26s ease-out 2.47s forwards; }
#割-bg8  { animation-delay: 2.75s; }
#割-s8   { stroke-dasharray: 20.9978; stroke-dashoffset: 20.9978; animation: drawStroke 0.22s ease-out 2.88s forwards; }
#割-bg9  { animation-delay: 3.12s; }
#割-s9   { stroke-dasharray: 44.5466; stroke-dashoffset: 44.5466; animation: drawStroke 0.25s ease-out 3.25s forwards; }
#割-bg10  { animation-delay: 3.52s; }
#割-s10   { stroke-dasharray: 23.5075; stroke-dashoffset: 23.5075; animation: drawStroke 0.22s ease-out 3.65s forwards; }
#割-bg11  { animation-delay: 3.89s; }
#割-s11   { stroke-dasharray: 44.8617; stroke-dashoffset: 44.8617; animation: drawStroke 0.25s ease-out 4.02s forwards; }
#割-bg12  { animation-delay: 4.29s; }
#割-s12   { stroke-dasharray: 90.9586; stroke-dashoffset: 90.9586; animation: drawStroke 0.50s ease-out 4.42s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

