<path id="割-s7"  class="stroke" stroke="#09bfbf" d="M14.39,67.41C16.25,67.86999999999999,18.75,67.6,20.37,67.38C28.66,66.27,47.71,63.059999999999995,55.980000000000004,62.31999999999999C57.800000000000004,62.16,59.81,61.97999999999999,61.6,62.50999999999999"/>
<path id="割-s8"  class="stroke" stroke="#0964bf" d="M23.05,76.1C23.67,76.72999999999999,24.23,77.75,24.36,78.63C25,83,26.3,88.44,26.85,92.19C27.080000000000002,93.74,27.28,95.2,27.43,96.47"/>
<path id="割-s9"  class="stroke" stroke="#0909bf" d="M24.86,77.47C31.75,76.51,44.69,74.82,50.25,74.09C52.95,73.74000000000001,54.07,74.69,53.44,77.76C52.69,81.47,52.04,84.64,50.47,90.08000000000001"/>
<path id="割-s10"  class="stroke" stroke="#6409bf" d="M28.21,93.31C31.830000000000002,92.87,41.55,91.63,48.24,90.93C49.54,90.80000000000001,50.67,90.68,51.56,90.60000000000001"/>
<path id="割-s11"  class="stroke" stroke="#bf09bf" d="M73.27,28.58C74.25,29.5,75.03,31.25,75.03,33.599999999999994C75.03,44.14999999999999,74.93,58.31999999999999,74.83,66.25C74.78999999999999,69.27,74.76,71.63,74.76,73"/>
<path id="割-s12"  class="stroke" stroke="#bf0964" d="M89.27,15.08C90.41,16.22,91.03,18,91.03,20.1C91.03,34.660000000000004,91.02,84.50999999999999,91.02,89.47C91.02,102.61,83.81,90.97,82.31,89.72"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
