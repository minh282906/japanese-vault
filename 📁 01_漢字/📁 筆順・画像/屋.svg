<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (屋)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #屋-bg[i]: Thời gian quả bóng số nảy lên
   - #屋-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#屋-bg1  { animation-delay: 0.05s; }
#屋-s1   { stroke-dasharray: 68.9757; stroke-dashoffset: 68.9757; animation: drawStroke 0.38s ease-out 0.18s forwards; }
#屋-bg2  { animation-delay: 0.58s; }
#屋-s2   { stroke-dasharray: 49.3613; stroke-dashoffset: 49.3613; animation: drawStroke 0.27s ease-out 0.71s forwards; }
#屋-bg3  { animation-delay: 1.00s; }
#屋-s3   { stroke-dasharray: 75.4532; stroke-dashoffset: 75.4532; animation: drawStroke 0.41s ease-out 1.13s forwards; }
#屋-bg4  { animation-delay: 1.56s; }
#屋-s4   { stroke-dasharray: 46.4271; stroke-dashoffset: 46.4271; animation: drawStroke 0.26s ease-out 1.69s forwards; }
#屋-bg5  { animation-delay: 1.97s; }
#屋-s5   { stroke-dasharray: 54.7915; stroke-dashoffset: 54.7915; animation: drawStroke 0.30s ease-out 2.10s forwards; }
#屋-bg6  { animation-delay: 2.42s; }
#屋-s6   { stroke-dasharray: 17.2239; stroke-dashoffset: 17.2239; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#屋-bg7  { animation-delay: 2.79s; }
#屋-s7   { stroke-dasharray: 42.5499; stroke-dashoffset: 42.5499; animation: drawStroke 0.23s ease-out 2.92s forwards; }
#屋-bg8  { animation-delay: 3.17s; }
#屋-s8   { stroke-dasharray: 27.0944; stroke-dashoffset: 27.0944; animation: drawStroke 0.22s ease-out 3.30s forwards; }
#屋-bg9  { animation-delay: 3.54s; }
#屋-s9   { stroke-dasharray: 65.7487; stroke-dashoffset: 65.7487; animation: drawStroke 0.36s ease-out 3.67s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #屋-s[i]) -->
<path id="屋-s1"  class="stroke" stroke="#bf0909" d="M26.66,20.23C28.44,20.79,29.89,20.82,31.77,20.68C42.49,19.88,72.76,16.86,76.84,16.41C79.5,16.12,81.13000000000001,17.53,80.75,19.48C80.46,20.94,78.91,25.75,77.91,28.89C77.5,30.18,77.17999999999999,31.19,77.08,31.57"/>
<path id="屋-s2"  class="stroke" stroke="#bf8209" d="M30.94,35.74C35.2,35.580000000000005,62.38,33.38,74.88,32.190000000000005C77.35,31.960000000000004,78.5,32.00000000000001,80.14,32.25000000000001"/>
<path id="屋-s3"  class="stroke" stroke="#82bf09" d="M29.13,21.17C29.669999999999998,21.69,30.56,23.080000000000002,30.54,25.130000000000003C30.25,60,24,80.12,13.25,92.73"/>
<path id="屋-s4"  class="stroke" stroke="#09bf09" d="M37.26,46.35C39.1,46.61,41.989999999999995,46.56,43.82,46.36C54.370000000000005,45.25,63.67,44.5,77.08,43.37C80.13,43.11,81.99,43.25,83.53,43.379999999999995"/>
<path id="屋-s5"  class="stroke" stroke="#09bf82" d="M56.93,48.43C57.25,49.87,56.63,51,55.73,51.89C51.029999999999994,56.54,50.129999999999995,57.59,44.14,62.41C42.21,63.959999999999994,42.59,65.63,45.67,65.05C53.88,63.5,63.510000000000005,61.75,74.99000000000001,59.36"/>
<path id="屋-s6"  class="stroke" stroke="#0982bf" d="M70.5,52.62C74.6,54.81,81.1,61.6,82.12,65"/>
<path id="屋-s7"  class="stroke" stroke="#0909bf" d="M39.25,78.38C40.53,78.6,42.89,78.69,44.15,78.6C52.5,78,67.38,76,77.18,75.76C79.31,75.71000000000001,80.59,75.86,81.65,75.97"/>
<path id="屋-s8"  class="stroke" stroke="#8209bf" d="M58.08,64.24C59.25,65,59.54,66.36999999999999,59.54,68.16C59.54,74.19,59.5,89.16,59.5,90.88"/>
<path id="屋-s9"  class="stroke" stroke="#bf0982" d="M28.97,93.1C31.529999999999998,93.75,34.45,93.83,36.42,93.75C56.05,92.88,67.59,91.13,87.73,90.98C90.97,90.96000000000001,92.91,91.29,94.54,91.61"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="屋-bg1"  class="badge-group"><circle cx="26.66" cy="16.73" r="3.5" fill="#bf0909"/><text class="num-single" x="26.66" y="16.73" dx="0" dy="-0.5">1</text></g>
<g id="屋-bg2"  class="badge-group"><circle cx="30.94" cy="35.74" r="3.5" fill="#bf8209"/><text class="num-single" x="30.94" y="35.74" dx="0" dy="-0.5">2</text></g>
<g id="屋-bg3"  class="badge-group"><circle cx="29.13" cy="24.67" r="3.5" fill="#82bf09"/><text class="num-single" x="29.13" y="24.67" dx="0" dy="-0.5">3</text></g>
<g id="屋-bg4"  class="badge-group"><circle cx="37.26" cy="46.35" r="3.5" fill="#09bf09"/><text class="num-single" x="37.26" y="46.35" dx="0" dy="-0.5">4</text></g>
<g id="屋-bg5"  class="badge-group"><circle cx="56.93" cy="48.43" r="3.5" fill="#09bf82"/><text class="num-single" x="56.93" y="48.43" dx="0" dy="-0.5">5</text></g>
<g id="屋-bg6"  class="badge-group"><circle cx="70.5" cy="52.62" r="3.5" fill="#0982bf"/><text class="num-single" x="70.5" y="52.62" dx="0" dy="-0.5">6</text></g>
<g id="屋-bg7"  class="badge-group"><circle cx="39.25" cy="78.38" r="3.5" fill="#0909bf"/><text class="num-single" x="39.25" y="78.38" dx="0" dy="-0.5">7</text></g>
<g id="屋-bg8"  class="badge-group"><circle cx="58.08" cy="64.24" r="3.5" fill="#8209bf"/><text class="num-single" x="58.08" y="64.24" dx="0" dy="-0.5">8</text></g>
<g id="屋-bg9"  class="badge-group"><circle cx="28.97" cy="93.1" r="3.5" fill="#bf0982"/><text class="num-single" x="28.97" y="93.1" dx="0" dy="-0.5">9</text></g>
</svg>