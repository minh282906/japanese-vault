<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (直)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #直-bg[i]: Thời gian quả bóng số nảy lên
   - #直-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#直-bg1  { animation-delay: 0.05s; }
#直-s1   { stroke-dasharray: 60.5137; stroke-dashoffset: 60.5137; animation: drawStroke 0.33s ease-out 0.18s forwards; }
#直-bg2  { animation-delay: 0.53s; }
#直-s2   { stroke-dasharray: 25.0293; stroke-dashoffset: 25.0293; animation: drawStroke 0.22s ease-out 0.66s forwards; }
#直-bg3  { animation-delay: 0.90s; }
#直-s3   { stroke-dasharray: 46.9240; stroke-dashoffset: 46.9240; animation: drawStroke 0.26s ease-out 1.03s forwards; }
#直-bg4  { animation-delay: 1.31s; }
#直-s4   { stroke-dasharray: 78.6781; stroke-dashoffset: 78.6781; animation: drawStroke 0.43s ease-out 1.44s forwards; }
#直-bg5  { animation-delay: 1.89s; }
#直-s5   { stroke-dasharray: 33.7125; stroke-dashoffset: 33.7125; animation: drawStroke 0.22s ease-out 2.02s forwards; }
#直-bg6  { animation-delay: 2.26s; }
#直-s6   { stroke-dasharray: 34.0531; stroke-dashoffset: 34.0531; animation: drawStroke 0.22s ease-out 2.39s forwards; }
#直-bg7  { animation-delay: 2.63s; }
#直-s7   { stroke-dasharray: 33.7127; stroke-dashoffset: 33.7127; animation: drawStroke 0.22s ease-out 2.76s forwards; }
#直-bg8  { animation-delay: 3.00s; }
#直-s8   { stroke-dasharray: 119.2020; stroke-dashoffset: 119.2020; animation: drawStroke 0.55s ease-out 3.13s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #直-s[i]) -->
<path id="直-s1"  class="stroke" stroke="#bf0909" d="M25.15,27.9C27.07,28.25,30.58,28.259999999999998,32.5,28.09C49.22,26.56,61.980000000000004,25.49,78.77000000000001,24.35C81.96000000000001,24.130000000000003,83.88000000000001,24.39,85.48,24.55"/>
<path id="直-s2"  class="stroke" stroke="#bf9109" d="M53.73,12.51C55.11,13.89,55.739999999999995,15.629999999999999,55.739999999999995,17.4C55.739999999999995,20.75,55.83,26,55.83,37"/>
<path id="直-s3"  class="stroke" stroke="#64bf09" d="M36.56,37.49C37.75,38.75,38.22,40.63,38.22,42.06C38.22,43.260000000000005,38.61,66.39,38.41,80C38.38999999999999,81.46,38.37,82.82,38.339999999999996,84.01"/>
<path id="直-s4"  class="stroke" stroke="#09bf36" d="M39.52,39.91C47.660000000000004,39.129999999999995,67.97,36.83,70.51,36.66C72.97,36.489999999999995,74.5,38.25,74.7,40.81999999999999C74.81,42.25999999999999,74.58,63.10999999999999,74.51,77.75C74.5,79.12,74.5,80.44,74.5,81.69"/>
<path id="直-s5"  class="stroke" stroke="#09bfbf" d="M39.61,52.51C47.62,51.879999999999995,67.12,50.129999999999995,73.22,49.9"/>
<path id="直-s6"  class="stroke" stroke="#0936bf" d="M39.63,65.91C48.27,65.35,64.5,63.75,73.59,63.419999999999995"/>
<path id="直-s7"  class="stroke" stroke="#6409bf" d="M39.75,80.42C45.769999999999996,79.92,69.05,78.10000000000001,73.38,78.10000000000001"/>
<path id="直-s8"  class="stroke" stroke="#bf0991" d="M19.75,50.5C20.75,51.75,21.5,53.25,21.5,55.75S20.38,85.63,19.75,91.5C19.47,94.1,20.02,95.65,23,95.25C43.5,92.5,64.5,91.25,86.75,91.25C89.5,91.25,92.25,91.75,94.25,92.5"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="直-bg1"  class="badge-group"><circle cx="25.15" cy="27.9" r="3.5" fill="#bf0909"/><text class="num-single" x="25.15" y="27.9" dx="0" dy="-0.5">1</text></g>
<g id="直-bg2"  class="badge-group"><circle cx="53.73" cy="12.51" r="3.5" fill="#bf9109"/><text class="num-single" x="53.73" y="12.51" dx="0" dy="-0.5">2</text></g>
<g id="直-bg3"  class="badge-group"><circle cx="36.56" cy="33.99" r="3.5" fill="#64bf09"/><text class="num-single" x="36.56" y="33.99" dx="0" dy="-0.5">3</text></g>
<g id="直-bg4"  class="badge-group"><circle cx="39.52" cy="43.41" r="3.5" fill="#09bf36"/><text class="num-single" x="39.52" y="43.41" dx="0" dy="-0.5">4</text></g>
<g id="直-bg5"  class="badge-group"><circle cx="39.61" cy="52.51" r="3.5" fill="#09bfbf"/><text class="num-single" x="39.61" y="52.51" dx="0" dy="-0.5">5</text></g>
<g id="直-bg6"  class="badge-group"><circle cx="39.63" cy="65.91" r="3.5" fill="#0936bf"/><text class="num-single" x="39.63" y="65.91" dx="0" dy="-0.5">6</text></g>
<g id="直-bg7"  class="badge-group"><circle cx="39.75" cy="80.42" r="3.5" fill="#6409bf"/><text class="num-single" x="39.75" y="80.42" dx="0" dy="-0.5">7</text></g>
<g id="直-bg8"  class="badge-group"><circle cx="19.75" cy="50.5" r="3.5" fill="#bf0991"/><text class="num-single" x="19.75" y="50.5" dx="0" dy="-0.5">8</text></g>
</svg>