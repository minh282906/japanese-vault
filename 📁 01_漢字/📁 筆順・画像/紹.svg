<path id="紹-s8"  class="stroke" stroke="#092abf" d="M69.98,24.89C70.03,25.57,69.94,26.650000000000002,69.62,27.62C66.75,36.38,62.5,45,51.42,55.1"/>
<path id="紹-s9"  class="stroke" stroke="#4b09bf" d="M54.64,63.17C55.480000000000004,64.01,56.21,65.14,56.39,66.59C57.13,72.5,57.92,79.39,58.85,88.01C59.04,89.76,59.11,91.45,59.230000000000004,93"/>
<path id="紹-s10"  class="stroke" stroke="#ae09bf" d="M57.12,64.97C68.17,63.519999999999996,76.55,62.61,85.46,62.03C88.41,61.84,90.94,62.6,89.99,67.3C88.61999999999999,74.12,87.75,78.12,85.64,87.49"/>
<path id="紹-s11"  class="stroke" stroke="#bf096c" d="M60.21,90.62C69.25,89.62,73.22,89.2,82.75,88.62C84.29,88.53,85.93,88.45,87.69,88.38000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="紹-bg1"  class="badge-group"><circle cx="30.38" cy="13.42" r="3.5" fill="#bf0909"/><text class="num-single" x="30.38" y="13.42" dx="0" dy="-0.5">1</text></g>
