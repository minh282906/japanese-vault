<path id="紹-s1"  class="stroke" stroke="#bf0909" d="M30.38,13.42C30.72,14.76,30.64,15.82,29.959999999999997,17.22C27.629999999999995,22,24.879999999999995,26.369999999999997,20.409999999999997,32.44C19.849999999999998,33.21,19.729999999999997,35.54,20.409999999999997,35.79C24.009999999999998,37.13,27.039999999999996,39.4,30.129999999999995,41.85"/>
