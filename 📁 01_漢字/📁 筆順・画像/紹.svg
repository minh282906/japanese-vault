<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (紹)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #紹-bg[i]: Thời gian quả bóng số nảy lên
   - #紹-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#紹-bg1  { animation-delay: 0.05s; }
#紹-s1   { stroke-dasharray: 36.9941; stroke-dashoffset: 36.9941; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#紹-bg2  { animation-delay: 0.42s; }
#紹-s2   { stroke-dasharray: 65.4598; stroke-dashoffset: 65.4598; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#紹-bg3  { animation-delay: 0.93s; }
#紹-s3   { stroke-dasharray: 15.0369; stroke-dashoffset: 15.0369; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#紹-bg4  { animation-delay: 1.30s; }
#紹-s4   { stroke-dasharray: 35.5657; stroke-dashoffset: 35.5657; animation: drawStroke 0.22s ease-out 1.43s forwards; }
#紹-bg5  { animation-delay: 1.67s; }
#紹-s5   { stroke-dasharray: 22.2937; stroke-dashoffset: 22.2937; animation: drawStroke 0.22s ease-out 1.80s forwards; }
#紹-bg6  { animation-delay: 2.04s; }
#紹-s6   { stroke-dasharray: 17.1492; stroke-dashoffset: 17.1492; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#紹-bg7  { animation-delay: 2.41s; }
#紹-s7   { stroke-dasharray: 80.2641; stroke-dashoffset: 80.2641; animation: drawStroke 0.44s ease-out 2.54s forwards; }
#紹-bg8  { animation-delay: 3.00s; }
#紹-s8   { stroke-dasharray: 36.1478; stroke-dashoffset: 36.1478; animation: drawStroke 0.22s ease-out 3.13s forwards; }
#紹-bg9  { animation-delay: 3.37s; }
#紹-s9   { stroke-dasharray: 30.4807; stroke-dashoffset: 30.4807; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#紹-bg10  { animation-delay: 3.74s; }
#紹-s10   { stroke-dasharray: 57.8186; stroke-dashoffset: 57.8186; animation: drawStroke 0.32s ease-out 3.87s forwards; }
#紹-bg11  { animation-delay: 4.21s; }
#紹-s11   { stroke-dasharray: 27.5778; stroke-dashoffset: 27.5778; animation: drawStroke 0.22s ease-out 4.34s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

