<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (貨)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #貨-bg[i]: Thời gian quả bóng số nảy lên
   - #貨-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#貨-bg1  { animation-delay: 0.05s; }
#貨-s1   { stroke-dasharray: 33.1716; stroke-dashoffset: 33.1716; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#貨-bg2  { animation-delay: 0.42s; }
#貨-s2   { stroke-dasharray: 26.1090; stroke-dashoffset: 26.1090; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#貨-bg3  { animation-delay: 0.79s; }
#貨-s3   { stroke-dasharray: 23.6930; stroke-dashoffset: 23.6930; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#貨-bg4  { animation-delay: 1.16s; }
#貨-s4   { stroke-dasharray: 59.4233; stroke-dashoffset: 59.4233; animation: drawStroke 0.33s ease-out 1.29s forwards; }
#貨-bg5  { animation-delay: 1.64s; }
#貨-s5   { stroke-dasharray: 38.4312; stroke-dashoffset: 38.4312; animation: drawStroke 0.22s ease-out 1.77s forwards; }
#貨-bg6  { animation-delay: 2.01s; }
#貨-s6   { stroke-dasharray: 67.6406; stroke-dashoffset: 67.6406; animation: drawStroke 0.37s ease-out 2.14s forwards; }
#貨-bg7  { animation-delay: 2.53s; }
#貨-s7   { stroke-dasharray: 30.3640; stroke-dashoffset: 30.3640; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#貨-bg8  { animation-delay: 2.90s; }
#貨-s8   { stroke-dasharray: 30.3224; stroke-dashoffset: 30.3224; animation: drawStroke 0.22s ease-out 3.03s forwards; }
#貨-bg9  { animation-delay: 3.27s; }
#貨-s9   { stroke-dasharray: 30.5227; stroke-dashoffset: 30.5227; animation: drawStroke 0.22s ease-out 3.40s forwards; }
#貨-bg10  { animation-delay: 3.64s; }
#貨-s10   { stroke-dasharray: 20.2797; stroke-dashoffset: 20.2797; animation: drawStroke 0.22s ease-out 3.77s forwards; }
#貨-bg11  { animation-delay: 4.01s; }
#貨-s11   { stroke-dasharray: 19.1103; stroke-dashoffset: 19.1103; animation: drawStroke 0.22s ease-out 4.14s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

