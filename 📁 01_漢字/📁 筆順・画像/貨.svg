<path id="貨-s6"  class="stroke" stroke="#09bf8d" d="M40.85,48.83C43.4,48.65,61.06,46.22,67.01,45.489999999999995C70.45,45.06999999999999,72.48,46.019999999999996,72.46000000000001,49.629999999999995C72.44000000000001,54.669999999999995,72.38000000000001,67.55,72.37,78.75C72.37,80.11,72.37,81.44,72.37,82.73"/>
<path id="貨-s7"  class="stroke" stroke="#098dbf" d="M41.05,60.05C47.879999999999995,59.25,66.61,57.14,71.25999999999999,57.04"/>
<path id="貨-s8"  class="stroke" stroke="#092abf" d="M41.29,71.9C49.129999999999995,70.87,62.5,69.12,71.42,68.53"/>
<path id="貨-s9"  class="stroke" stroke="#4b09bf" d="M41.03,83.16C49.5,82.25,63.95,80.45,71.41,80.28999999999999"/>
<path id="貨-s10"  class="stroke" stroke="#ae09bf" d="M46.73,88.03C47.12,88.99,46.75,90.01,45.98,90.71000000000001C43.66,92.83000000000001,39,96.50000000000001,31.629999999999995,100.31"/>
<path id="貨-s11"  class="stroke" stroke="#bf096c" d="M66.44,88.97C72.62,92.06,79.92999999999999,97.66,81.62,100.36"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="貨-bg1"  class="badge-group"><circle cx="37.57" cy="12.11" r="3.5" fill="#bf0909"/><text class="num-single" x="37.57" y="12.11" dx="0" dy="-0.5">1</text></g>
