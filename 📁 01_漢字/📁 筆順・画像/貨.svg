<path id="貨-s1"  class="stroke" stroke="#bf0909" d="M37.57,12.11C37.79,13.309999999999999,37.51,14.879999999999999,36.81,15.91C32.33,22.47,26.650000000000002,28.630000000000003,16.380000000000003,36.61"/>
