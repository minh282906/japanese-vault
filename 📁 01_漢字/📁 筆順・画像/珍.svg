<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (珍)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #珍-bg[i]: Thời gian quả bóng số nảy lên
   - #珍-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#珍-bg1  { animation-delay: 0.05s; }
#珍-s1   { stroke-dasharray: 29.6765; stroke-dashoffset: 29.6765; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#珍-bg2  { animation-delay: 0.42s; }
#珍-s2   { stroke-dasharray: 45.2554; stroke-dashoffset: 45.2554; animation: drawStroke 0.25s ease-out 0.55s forwards; }
#珍-bg3  { animation-delay: 0.82s; }
#珍-s3   { stroke-dasharray: 25.8546; stroke-dashoffset: 25.8546; animation: drawStroke 0.22s ease-out 0.95s forwards; }
#珍-bg4  { animation-delay: 1.19s; }
#珍-s4   { stroke-dasharray: 27.2470; stroke-dashoffset: 27.2470; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#珍-bg5  { animation-delay: 1.56s; }
#珍-s5   { stroke-dasharray: 37.6833; stroke-dashoffset: 37.6833; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#珍-bg6  { animation-delay: 1.93s; }
#珍-s6   { stroke-dasharray: 42.1461; stroke-dashoffset: 42.1461; animation: drawStroke 0.23s ease-out 2.06s forwards; }
#珍-bg7  { animation-delay: 2.31s; }
#珍-s7   { stroke-dasharray: 27.7136; stroke-dashoffset: 27.7136; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#珍-bg8  { animation-delay: 2.68s; }
#珍-s8   { stroke-dasharray: 34.5172; stroke-dashoffset: 34.5172; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#珍-bg9  { animation-delay: 3.05s; }
#珍-s9   { stroke-dasharray: 50.0836; stroke-dashoffset: 50.0836; animation: drawStroke 0.28s ease-out 3.18s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #珍-s[i]) -->
<path id="珍-s1"  class="stroke" stroke="#bf0909" d="M11,28.42C12.5,28.87,14.77,28.810000000000002,16.13,28.700000000000003C20.49,28.360000000000003,30.409999999999997,27.03,36.379999999999995,26.46C37.599999999999994,26.34,39.37,26.12,40.49999999999999,26.42"/>
<path id="珍-s2"  class="stroke" stroke="#bf8209" d="M25.32,30.44C26.32,31.44,26.55,32.5,26.55,33.92C26.55,39.870000000000005,26.5,70.13,26.5,75.37"/>
<path id="珍-s3"  class="stroke" stroke="#82bf09" d="M12.25,52.42C13.629999999999999,53,15.45,52.95,16.509999999999998,52.79C21,52.12,30.25,50.17,34.739999999999995,49.6C35.42999999999999,49.51,36.489999999999995,49.25,37.739999999999995,49.54"/>
<path id="珍-s4"  class="stroke" stroke="#09bf09" d="M12.25,81.02C13.370000000000001,82.11999999999999,14.11,82.22999999999999,15.75,81.42C23.75,77.5,28.369999999999997,75.25,36.75,71.17"/>
<path id="珍-s5"  class="stroke" stroke="#09bf82" d="M61.03,14.25C61.08,14.98,61.08,16.21,60.67,17.21C57.4,25.08,52,34.88,41.05,45.5"/>
<path id="珍-s6"  class="stroke" stroke="#0982bf" d="M61.59,17.92C65.22,21.880000000000003,79.23,33.33,86.52000000000001,39.010000000000005C89.09,41.010000000000005,91.57000000000001,42.68000000000001,94.49000000000001,44.10000000000001"/>
<path id="珍-s7"  class="stroke" stroke="#0909bf" d="M67.89,38.9C67.95,39.35,67.68,40.67,67.27,41.199999999999996C64,45.5,57.12,51.62,47.72,57.03"/>
<path id="珍-s8"  class="stroke" stroke="#8209bf" d="M73.59,55.99C73.67,56.5,73.43,57.42,72.94,58.03C68.47,63.53,62.129999999999995,69.13,46.92999999999999,76.81"/>
<path id="珍-s9"  class="stroke" stroke="#bf0982" d="M82.68,70.96C82.80000000000001,71.58,82.64,72.67999999999999,81.95,73.41999999999999C76.23,79.62,63.38,91,41.47,96.97"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="珍-bg1"  class="badge-group"><circle cx="11" cy="28.42" r="3.5" fill="#bf0909"/><text class="num-single" x="11" y="28.42" dx="0" dy="-0.5">1</text></g>
<g id="珍-bg2"  class="badge-group"><circle cx="25.32" cy="30.44" r="3.5" fill="#bf8209"/><text class="num-single" x="25.32" y="30.44" dx="0" dy="-0.5">2</text></g>
<g id="珍-bg3"  class="badge-group"><circle cx="12.25" cy="52.42" r="3.5" fill="#82bf09"/><text class="num-single" x="12.25" y="52.42" dx="0" dy="-0.5">3</text></g>
<g id="珍-bg4"  class="badge-group"><circle cx="12.25" cy="81.02" r="3.5" fill="#09bf09"/><text class="num-single" x="12.25" y="81.02" dx="0" dy="-0.5">4</text></g>
<g id="珍-bg5"  class="badge-group"><circle cx="61.03" cy="10.75" r="3.5" fill="#09bf82"/><text class="num-single" x="61.03" y="10.75" dx="0" dy="-0.5">5</text></g>
<g id="珍-bg6"  class="badge-group"><circle cx="61.59" cy="21.42" r="3.5" fill="#0982bf"/><text class="num-single" x="61.59" y="21.42" dx="0" dy="-0.5">6</text></g>
<g id="珍-bg7"  class="badge-group"><circle cx="67.89" cy="38.9" r="3.5" fill="#0909bf"/><text class="num-single" x="67.89" y="38.9" dx="0" dy="-0.5">7</text></g>
<g id="珍-bg8"  class="badge-group"><circle cx="73.59" cy="55.99" r="3.5" fill="#8209bf"/><text class="num-single" x="73.59" y="55.99" dx="0" dy="-0.5">8</text></g>
<g id="珍-bg9"  class="badge-group"><circle cx="82.68" cy="70.96" r="3.5" fill="#bf0982"/><text class="num-single" x="82.68" y="70.96" dx="0" dy="-0.5">9</text></g>
</svg>