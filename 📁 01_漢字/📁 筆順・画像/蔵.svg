<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (蔵)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #蔵-bg[i]: Thời gian quả bóng số nảy lên
   - #蔵-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#蔵-bg1  { animation-delay: 0.05s; }
#蔵-s1   { stroke-dasharray: 67.8011; stroke-dashoffset: 67.8011; animation: drawStroke 0.37s ease-out 0.18s forwards; }
#蔵-bg2  { animation-delay: 0.57s; }
#蔵-s2   { stroke-dasharray: 17.7152; stroke-dashoffset: 17.7152; animation: drawStroke 0.22s ease-out 0.70s forwards; }
#蔵-bg3  { animation-delay: 0.94s; }
#蔵-s3   { stroke-dasharray: 17.6430; stroke-dashoffset: 17.6430; animation: drawStroke 0.22s ease-out 1.07s forwards; }
#蔵-bg4  { animation-delay: 1.31s; }
#蔵-s4   { stroke-dasharray: 58.2246; stroke-dashoffset: 58.2246; animation: drawStroke 0.32s ease-out 1.44s forwards; }
#蔵-bg5  { animation-delay: 1.78s; }
#蔵-s5   { stroke-dasharray: 57.5894; stroke-dashoffset: 57.5894; animation: drawStroke 0.32s ease-out 1.91s forwards; }
#蔵-bg6  { animation-delay: 2.25s; }
#蔵-s6   { stroke-dasharray: 44.7074; stroke-dashoffset: 44.7074; animation: drawStroke 0.25s ease-out 2.38s forwards; }
#蔵-bg7  { animation-delay: 2.65s; }
#蔵-s7   { stroke-dasharray: 25.4633; stroke-dashoffset: 25.4633; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#蔵-bg8  { animation-delay: 3.02s; }
#蔵-s8   { stroke-dasharray: 10.1036; stroke-dashoffset: 10.1036; animation: drawStroke 0.22s ease-out 3.15s forwards; }
#蔵-bg9  { animation-delay: 3.39s; }
#蔵-s9   { stroke-dasharray: 35.7384; stroke-dashoffset: 35.7384; animation: drawStroke 0.22s ease-out 3.52s forwards; }
#蔵-bg10  { animation-delay: 3.76s; }
#蔵-s10   { stroke-dasharray: 24.2857; stroke-dashoffset: 24.2857; animation: drawStroke 0.22s ease-out 3.89s forwards; }
#蔵-bg11  { animation-delay: 4.13s; }
#蔵-s11   { stroke-dasharray: 10.7777; stroke-dashoffset: 10.7777; animation: drawStroke 0.22s ease-out 4.26s forwards; }
#蔵-bg12  { animation-delay: 4.50s; }
#蔵-s12   { stroke-dasharray: 26.2843; stroke-dashoffset: 26.2843; animation: drawStroke 0.22s ease-out 4.63s forwards; }
#蔵-bg13  { animation-delay: 4.87s; }
#蔵-s13   { stroke-dasharray: 82.1527; stroke-dashoffset: 82.1527; animation: drawStroke 0.45s ease-out 5.00s forwards; }
#蔵-bg14  { animation-delay: 5.47s; }
#蔵-s14   { stroke-dasharray: 46.7079; stroke-dashoffset: 46.7079; animation: drawStroke 0.26s ease-out 5.60s forwards; }
#蔵-bg15  { animation-delay: 5.88s; }
#蔵-s15   { stroke-dasharray: 12.5243; stroke-dashoffset: 12.5243; animation: drawStroke 0.22s ease-out 6.01s forwards; }
]]>
</style>

