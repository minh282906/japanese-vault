<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (接)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #接-bg[i]: Thời gian quả bóng số nảy lên
   - #接-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#接-bg1  { animation-delay: 0.05s; }
#接-s1   { stroke-dasharray: 27.6758; stroke-dashoffset: 27.6758; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#接-bg2  { animation-delay: 0.42s; }
#接-s2   { stroke-dasharray: 85.3727; stroke-dashoffset: 85.3727; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#接-bg3  { animation-delay: 1.04s; }
#接-s3   { stroke-dasharray: 32.6661; stroke-dashoffset: 32.6661; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#接-bg4  { animation-delay: 1.41s; }
#接-s4   { stroke-dasharray: 12.3745; stroke-dashoffset: 12.3745; animation: drawStroke 0.22s ease-out 1.54s forwards; }
#接-bg5  { animation-delay: 1.78s; }
#接-s5   { stroke-dasharray: 39.0060; stroke-dashoffset: 39.0060; animation: drawStroke 0.22s ease-out 1.91s forwards; }
#接-bg6  { animation-delay: 2.15s; }
#接-s6   { stroke-dasharray: 11.6664; stroke-dashoffset: 11.6664; animation: drawStroke 0.22s ease-out 2.28s forwards; }
#接-bg7  { animation-delay: 2.52s; }
#接-s7   { stroke-dasharray: 16.0626; stroke-dashoffset: 16.0626; animation: drawStroke 0.22s ease-out 2.65s forwards; }
#接-bg8  { animation-delay: 2.89s; }
#接-s8   { stroke-dasharray: 50.9306; stroke-dashoffset: 50.9306; animation: drawStroke 0.28s ease-out 3.02s forwards; }
#接-bg9  { animation-delay: 3.32s; }
#接-s9   { stroke-dasharray: 72.6208; stroke-dashoffset: 72.6208; animation: drawStroke 0.40s ease-out 3.45s forwards; }
#接-bg10  { animation-delay: 3.87s; }
#接-s10   { stroke-dasharray: 51.1756; stroke-dashoffset: 51.1756; animation: drawStroke 0.28s ease-out 4.00s forwards; }
#接-bg11  { animation-delay: 4.30s; }
#接-s11   { stroke-dasharray: 54.5322; stroke-dashoffset: 54.5322; animation: drawStroke 0.30s ease-out 4.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #接-s[i]) -->
<path id="接-s1"  class="stroke" stroke="#bf0909" d="M15.75,37.92C17.5,38.38,19.02,38.49,21.25,38.17C29.25,37,32.6,36.45,39.78,35.45C40.910000000000004,35.290000000000006,41.75,35.25,43.17,35.25"/>
<path id="接-s2"  class="stroke" stroke="#bf6c09" d="M31.52,15C32.7,16.18,33.28,18.12,33.28,20.52C33.28,35.75,33.27,72.48,33.27,83.92C33.27,98.17,26.950000000000003,87.45,25.500000000000004,85.92"/>
