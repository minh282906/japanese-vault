<path id="接-s4"  class="stroke" stroke="#4bbf09" d="M65.47,12.75C66.24,13.52,66.95,14.74,66.95,15.870000000000001C66.95,17,66.95,21.630000000000003,66.95,24.71"/>
<path id="接-s5"  class="stroke" stroke="#09bf2a" d="M48.5,27.3C49.94,27.7,52.02,27.76,53.5,27.57C60.87,26.63,75.02,24.82,82.24,24.3C83.92999999999999,24.18,85.58999999999999,24.1,87.27,24.38"/>
<path id="接-s6"  class="stroke" stroke="#09bf8d" d="M54.62,32.75C57.37,35.5,59.739999999999995,39.37,60.43,42.7"/>
<path id="接-s7"  class="stroke" stroke="#098dbf" d="M77.13,28.32C77.5,29.13,77.69,30.69,77.27,31.65C75.63,35.37,73.31,40.69,72.03999999999999,43.17"/>
<path id="接-s8"  class="stroke" stroke="#092abf" d="M43.94,46.72C45.83,47.22,48.22,47.14,50.15,46.89C62,45.38,76.96,44.17,88,43.58C90.17,43.47,92.51,43.57,94.66,43.92"/>
<path id="接-s9"  class="stroke" stroke="#4b09bf" d="M63.82,49.24C64.19,50.31,64.07,51.72,63.64,53C61.47,59.43,57.51,68.67,52.52,75.78C51.790000000000006,76.82000000000001,52.330000000000005,77.64,53.080000000000005,77.65C62.540000000000006,77.73,71.93,80.7,80.58000000000001,86.4C83.74000000000001,88.48,86.76000000000002,90.92,89.60000000000001,93.72"/>
<path id="接-s10"  class="stroke" stroke="#ae09bf" d="M79.75,58.38C80.12,59.75,79.97,61.45,79.56,62.72C76.13,73.37,68.39,86.99,47.83,94.75"/>
<path id="接-s11"  class="stroke" stroke="#bf096c" d="M41.79,65.28C43.519999999999996,65.93,46.47,65.8,48.26,65.58C60.12,64.13,74.8,62.769999999999996,88.37,62.33C90.82000000000001,62.25,93.75,62.129999999999995,96.08,62.769999999999996"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="接-bg1"  class="badge-group"><circle cx="15.75" cy="37.92" r="3.5" fill="#bf0909"/><text class="num-single" x="15.75" y="37.92" dx="0" dy="-0.5">1</text></g>
<g id="接-bg2"  class="badge-group"><circle cx="31.52" cy="15" r="3.5" fill="#bf6c09"/><text class="num-single" x="31.52" y="15" dx="0" dy="-0.5">2</text></g>
