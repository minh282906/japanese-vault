<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (止)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #止-bg[i]: Thời gian quả bóng số nảy lên
   - #止-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#止-bg1  { animation-delay: 0.05s; }
#止-s1   { stroke-dasharray: 71.0538; stroke-dashoffset: 71.0538; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#止-bg2  { animation-delay: 0.59s; }
#止-s2   { stroke-dasharray: 28.6639; stroke-dashoffset: 28.6639; animation: drawStroke 0.22s ease-out 0.72s forwards; }
#止-bg3  { animation-delay: 0.96s; }
#止-s3   { stroke-dasharray: 41.4724; stroke-dashoffset: 41.4724; animation: drawStroke 0.23s ease-out 1.09s forwards; }
#止-bg4  { animation-delay: 1.34s; }
#止-s4   { stroke-dasharray: 79.5467; stroke-dashoffset: 79.5467; animation: drawStroke 0.44s ease-out 1.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #止-s[i]) -->
<path id="止-s1"  class="stroke" stroke="#bf0909" d="M53.43,16.25C54.65,17.47,55.51,19.5,55.51,20.87C55.51,26.130000000000003,55.62,68.38,55.62,86.75"/>
<path id="止-s2"  class="stroke" stroke="#64bf09" d="M55.88,49.75C64.8,49,71.51,47.75,80.28,47C82.45,46.81,83.01,46.75,84.37,47"/>
<path id="止-s3"  class="stroke" stroke="#09bfbf" d="M31.43,47.5C32.53,48.6,33.26,50.5,33.26,51.86C33.26,56.37,33.58,77.52,33.379999999999995,88.5"/>
<path id="止-s4"  class="stroke" stroke="#6409bf" d="M14,90C15.75,90.62,17.87,90.95,20.66,90.75C37.870000000000005,89.5,68.62,86.75,84.47,86.5C87.28,86.46,91.12,86.62,93.25,87.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="止-bg1"  class="badge-group"><circle cx="53.43" cy="16.25" r="3.5" fill="#bf0909"/><text class="num-single" x="53.43" y="16.25" dx="0" dy="-0.5">1</text></g>
<g id="止-bg2"  class="badge-group"><circle cx="55.88" cy="49.75" r="3.5" fill="#64bf09"/><text class="num-single" x="55.88" y="49.75" dx="0" dy="-0.5">2</text></g>
<g id="止-bg3"  class="badge-group"><circle cx="31.43" cy="47.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="31.43" y="47.5" dx="0" dy="-0.5">3</text></g>
<g id="止-bg4"  class="badge-group"><circle cx="14" cy="90" r="3.5" fill="#6409bf"/><text class="num-single" x="14" y="90" dx="0" dy="-0.5">4</text></g>
</svg>