<path id="税-s7"  class="stroke" stroke="#09bfbf" d="M80.53,13.46C80.59,14.530000000000001,80.54,15.530000000000001,80.22,16.57C78.88,21,76.27,26.93,71.73,33.4"/>
<path id="税-s8"  class="stroke" stroke="#0964bf" d="M50.37,38.99C51.25,39.870000000000005,51.86,41.400000000000006,51.919999999999995,42.620000000000005C52.48,46.010000000000005,53.209999999999994,51.59,53.82999999999999,56.49C54.029999999999994,58.080000000000005,54.23999999999999,59.38,54.44999999999999,60.82"/>
<path id="税-s9"  class="stroke" stroke="#0909bf" d="M52.57,40.7C61.019999999999996,39.11,71.59,37.59,78.89,36.68000000000001C82.09,36.28000000000001,84.29,37.900000000000006,83.55,41.42000000000001C82.63,45.790000000000006,81.42999999999999,50.52000000000001,80.25,55.98000000000001"/>
<path id="税-s10"  class="stroke" stroke="#6409bf" d="M54.88,58.69C60.010000000000005,58.36,69.92,57.4,77.79,56.739999999999995C79,56.63999999999999,80.17,56.53999999999999,81.26,56.459999999999994"/>
<path id="税-s11"  class="stroke" stroke="#bf09bf" d="M60.24,64.21C60.5,65.11999999999999,60.35,66.24,60.13,67.22999999999999C58.82,73.07,52.370000000000005,86.36999999999999,41.07000000000001,93.24"/>
<path id="税-s12"  class="stroke" stroke="#bf0964" d="M73.1,60C73.92999999999999,60.83,74.46,62.5,74.46,63.92C74.46,68.95,74.46,76.63,74.46,83.02000000000001C74.46,93.70000000000002,76.03999999999999,95.05000000000001,86.72999999999999,95.05000000000001C96.58999999999999,95.05000000000001,98.32,92.84000000000002,98.32,85.74000000000001"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
