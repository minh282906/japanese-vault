<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (税)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #税-bg[i]: Thời gian quả bóng số nảy lên
   - #税-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#税-bg1  { animation-delay: 0.05s; }
#税-s1   { stroke-dasharray: 30.6071; stroke-dashoffset: 30.6071; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#税-bg2  { animation-delay: 0.42s; }
#税-s2   { stroke-dasharray: 34.1619; stroke-dashoffset: 34.1619; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#税-bg3  { animation-delay: 0.79s; }
#税-s3   { stroke-dasharray: 71.5090; stroke-dashoffset: 71.5090; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#税-bg4  { animation-delay: 1.33s; }
#税-s4   { stroke-dasharray: 37.7975; stroke-dashoffset: 37.7975; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#税-bg5  { animation-delay: 1.70s; }
#税-s5   { stroke-dasharray: 14.0028; stroke-dashoffset: 14.0028; animation: drawStroke 0.22s ease-out 1.83s forwards; }
#税-bg6  { animation-delay: 2.07s; }
#税-s6   { stroke-dasharray: 17.8991; stroke-dashoffset: 17.8991; animation: drawStroke 0.22s ease-out 2.20s forwards; }
#税-bg7  { animation-delay: 2.44s; }
#税-s7   { stroke-dasharray: 22.0696; stroke-dashoffset: 22.0696; animation: drawStroke 0.22s ease-out 2.57s forwards; }
#税-bg8  { animation-delay: 2.81s; }
#税-s8   { stroke-dasharray: 22.4005; stroke-dashoffset: 22.4005; animation: drawStroke 0.22s ease-out 2.94s forwards; }
#税-bg9  { animation-delay: 3.18s; }
#税-s9   { stroke-dasharray: 49.7160; stroke-dashoffset: 49.7160; animation: drawStroke 0.27s ease-out 3.31s forwards; }
#税-bg10  { animation-delay: 3.60s; }
#税-s10   { stroke-dasharray: 26.4745; stroke-dashoffset: 26.4745; animation: drawStroke 0.22s ease-out 3.73s forwards; }
#税-bg11  { animation-delay: 3.97s; }
#税-s11   { stroke-dasharray: 36.0085; stroke-dashoffset: 36.0085; animation: drawStroke 0.22s ease-out 4.10s forwards; }
#税-bg12  { animation-delay: 4.34s; }
#税-s12   { stroke-dasharray: 62.1340; stroke-dashoffset: 62.1340; animation: drawStroke 0.34s ease-out 4.47s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #税-s[i]) -->
<path id="税-s1"  class="stroke" stroke="#bf0909" d="M39.24,14.5C39.120000000000005,15.5,38.870000000000005,16.23,38.080000000000005,16.96C34.72,20.05,25.35,24.69,12.75,28"/>
