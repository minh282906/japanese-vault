<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (加)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #加-bg[i]: Thời gian quả bóng số nảy lên
   - #加-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#加-bg1  { animation-delay: 0.05s; }
#加-s1   { stroke-dasharray: 96.1851; stroke-dashoffset: 96.1851; animation: drawStroke 0.53s ease-out 0.18s forwards; }
#加-bg2  { animation-delay: 0.73s; }
#加-s2   { stroke-dasharray: 77.6778; stroke-dashoffset: 77.6778; animation: drawStroke 0.43s ease-out 0.86s forwards; }
#加-bg3  { animation-delay: 1.31s; }
#加-s3   { stroke-dasharray: 41.5205; stroke-dashoffset: 41.5205; animation: drawStroke 0.23s ease-out 1.44s forwards; }
#加-bg4  { animation-delay: 1.69s; }
#加-s4   { stroke-dasharray: 65.4290; stroke-dashoffset: 65.4290; animation: drawStroke 0.36s ease-out 1.82s forwards; }
#加-bg5  { animation-delay: 2.20s; }
#加-s5   { stroke-dasharray: 23.7627; stroke-dashoffset: 23.7627; animation: drawStroke 0.22s ease-out 2.33s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #加-s[i]) -->
<path id="加-s1"  class="stroke" stroke="#bf0909" d="M15.4,43.01C17.62,43.879999999999995,20.43,43.83,23.05,43.32C31.87,41.63,45.95,38.7,49.64,38.12C52.28,37.71,53.53,39.489999999999995,53.36,42.39C52.87,50.88,48.45,73.16,41.75,83.75C37.87,89.87,35.87,87,33.33,83.96"/>
<path id="加-s2"  class="stroke" stroke="#9abf09" d="M35.57,16.68C36.38,17.75,36.69,19.3,36.5,21.25C34.38,43.129999999999995,28.380000000000003,69.13,10.04,87.64"/>
<path id="加-s3"  class="stroke" stroke="#09bf52" d="M62.86,42.32C63.71,43.17,64.34,44.34,64.47,45.21C65.49,52.33,66.59,66.09,67.58,78.49000000000001C67.71,80.09,67.83,81.67000000000002,67.96,83.21000000000001"/>
<path id="加-s4"  class="stroke" stroke="#0952bf" d="M64.79,43.93C74.26,42.63,83.01,41.35,88.87,40.66C93.5,40.12,95.59,42.239999999999995,94.88000000000001,47.379999999999995C93.46000000000001,57.55,92.22000000000001,64.03,90.63000000000001,77.09"/>
<path id="加-s5"  class="stroke" stroke="#9a09bf" d="M69.06,80.16C75.58,79.58,81.32000000000001,79.19,89.26,78.47999999999999C90.38000000000001,78.38,91.54,78.27999999999999,92.74000000000001,78.17999999999999"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="加-bg1"  class="badge-group"><circle cx="15.4" cy="43.01" r="3.5" fill="#bf0909"/><text class="num-single" x="15.4" y="43.01" dx="0" dy="-0.5">1</text></g>
<g id="加-bg2"  class="badge-group"><circle cx="35.57" cy="16.68" r="3.5" fill="#9abf09"/><text class="num-single" x="35.57" y="16.68" dx="0" dy="-0.5">2</text></g>
<g id="加-bg3"  class="badge-group"><circle cx="62.86" cy="38.82" r="3.5" fill="#09bf52"/><text class="num-single" x="62.86" y="38.82" dx="0" dy="-0.5">3</text></g>
<g id="加-bg4"  class="badge-group"><circle cx="64.79" cy="47.43" r="3.5" fill="#0952bf"/><text class="num-single" x="64.79" y="47.43" dx="0" dy="-0.5">4</text></g>
<g id="加-bg5"  class="badge-group"><circle cx="69.06" cy="80.16" r="3.5" fill="#9a09bf"/><text class="num-single" x="69.06" y="80.16" dx="0" dy="-0.5">5</text></g>
</svg>