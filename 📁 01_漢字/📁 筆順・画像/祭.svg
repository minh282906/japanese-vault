<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (祭)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #祭-bg[i]: Thời gian quả bóng số nảy lên
   - #祭-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#祭-bg1  { animation-delay: 0.05s; }
#祭-s1   { stroke-dasharray: 25.0085; stroke-dashoffset: 25.0085; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#祭-bg2  { animation-delay: 0.42s; }
#祭-s2   { stroke-dasharray: 71.9370; stroke-dashoffset: 71.9370; animation: drawStroke 0.40s ease-out 0.55s forwards; }
#祭-bg3  { animation-delay: 0.97s; }
#祭-s3   { stroke-dasharray: 10.3340; stroke-dashoffset: 10.3340; animation: drawStroke 0.22s ease-out 1.10s forwards; }
#祭-bg4  { animation-delay: 1.34s; }
#祭-s4   { stroke-dasharray: 11.6466; stroke-dashoffset: 11.6466; animation: drawStroke 0.22s ease-out 1.47s forwards; }
#祭-bg5  { animation-delay: 1.71s; }
#祭-s5   { stroke-dasharray: 48.6518; stroke-dashoffset: 48.6518; animation: drawStroke 0.27s ease-out 1.84s forwards; }
#祭-bg6  { animation-delay: 2.13s; }
#祭-s6   { stroke-dasharray: 45.9129; stroke-dashoffset: 45.9129; animation: drawStroke 0.25s ease-out 2.26s forwards; }
#祭-bg7  { animation-delay: 2.53s; }
#祭-s7   { stroke-dasharray: 30.8408; stroke-dashoffset: 30.8408; animation: drawStroke 0.22s ease-out 2.66s forwards; }
#祭-bg8  { animation-delay: 2.90s; }
#祭-s8   { stroke-dasharray: 63.6935; stroke-dashoffset: 63.6935; animation: drawStroke 0.35s ease-out 3.03s forwards; }
#祭-bg9  { animation-delay: 3.40s; }
#祭-s9   { stroke-dasharray: 34.7357; stroke-dashoffset: 34.7357; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#祭-bg10  { animation-delay: 3.77s; }
#祭-s10   { stroke-dasharray: 26.3230; stroke-dashoffset: 26.3230; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#祭-bg11  { animation-delay: 4.14s; }
#祭-s11   { stroke-dasharray: 21.0511; stroke-dashoffset: 21.0511; animation: drawStroke 0.22s ease-out 4.27s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #祭-s[i]) -->
<path id="祭-s1"  class="stroke" stroke="#bf0909" d="M30.5,14.5C30.87,16.08,30.49,17.64,29.76,18.96C27.720000000000002,22.66,23.12,29.380000000000003,16.75,34.5"/>
<path id="祭-s2"  class="stroke" stroke="#bf6c09" d="M33.75,18.5C34.87,18.75,36.5,18.41,38.01,18.08C41.239999999999995,17.369999999999997,45.03,16.09,47.25,15.749999999999998C50.5,15.249999999999998,51.64,16.58,50.75,19C46.75,29.880000000000003,33.75,47.25,16.25,56.25"/>
