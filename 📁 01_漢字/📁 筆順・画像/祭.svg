<g id="祭-bg8"  class="badge-group"><circle cx="22.46" cy="66.99" r="3.5" fill="#092abf"/><text class="num-single" x="22.46" y="66.99" dx="0" dy="-0.5">8</text></g>
<g id="祭-bg9"  class="badge-group"><circle cx="53.08" cy="68.74" r="3.5" fill="#4b09bf"/><text class="num-single" x="53.08" y="68.74" dx="0" dy="-0.5">9</text></g>
<g id="祭-bg10" class="badge-group"><circle cx="35.7" cy="76.51" r="3.5" fill="#ae09bf"/><text class="num-double" x="35.7" y="76.51" dx="-0.4" dy="-0.475">10</text></g>
<g id="祭-bg11" class="badge-group"><circle cx="69.88" cy="75.96" r="3.5" fill="#bf096c"/><text class="num-double" x="69.88" y="75.96" dx="-0.4" dy="-0.475">11</text></g>
</svg>