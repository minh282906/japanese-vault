<path id="祭-s4"  class="stroke" stroke="#4bbf09" d="M20.62,35.5C22.400000000000002,36.53,27.76,40.92,29.240000000000002,43.25"/>
<path id="祭-s5"  class="stroke" stroke="#09bf2a" d="M58.75,19.25C60.75,20,62.19,19.99,63.75,19.75C67,19.25,72.5,18.13,77.25,16.75C80.91,15.69,82.18,17.71,80.75,20.5C78.5,24.88,72.5,33,66.5,37.5"/>
<path id="祭-s6"  class="stroke" stroke="#09bf8d" d="M54.75,28.75C59.75,28.75,80.7,45.33,83,46.75C86.25,48.75,90.75,51.25,94,52"/>
<path id="祭-s7"  class="stroke" stroke="#098dbf" d="M38.35,52.08C39.480000000000004,52.379999999999995,41.56,52.46,42.69,52.379999999999995C49.75,51.87,59,50.49999999999999,65.08,50.31999999999999C66.97,50.25999999999999,68.1,50.459999999999994,69.05,50.60999999999999"/>
<path id="祭-s8"  class="stroke" stroke="#092abf" d="M22.46,66.99C24.62,67.42,28.6,67.86,30.76,67.67C47,66.25,62.620000000000005,65.13,78.39,64.79C81.99,64.71000000000001,83.77,65,85.96000000000001,65.46000000000001"/>
<path id="祭-s9"  class="stroke" stroke="#4b09bf" d="M53.08,68.74C54.23,69.89,54.66,71.5,54.66,73.47C54.66,77.5,54.69,86.35,54.69,90.6C54.69,100,48.4,91.8,47.22,90.80999999999999"/>
<path id="祭-s10"  class="stroke" stroke="#ae09bf" d="M35.7,76.51C35.85,77.49000000000001,35.68,78.39,35.18,79.22C32.51,83.25,25.259999999999998,89.5,17.08,93.94"/>
<path id="祭-s11"  class="stroke" stroke="#bf096c" d="M69.88,75.96C75.1,78.53999999999999,82.75,85.61999999999999,84.92999999999999,90.3"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="祭-bg1"  class="badge-group"><circle cx="30.5" cy="11.0" r="3.5" fill="#bf0909"/><text class="num-single" x="30.5" y="11.0" dx="0" dy="-0.5">1</text></g>
<g id="祭-bg2"  class="badge-group"><circle cx="33.75" cy="18.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="33.75" y="18.5" dx="0" dy="-0.5">2</text></g>
