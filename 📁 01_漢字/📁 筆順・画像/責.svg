<path id="責-s4"  class="stroke" stroke="#4bbf09" d="M16.63,42.8C19.18,43.32,22.32,43.309999999999995,24.89,42.959999999999994C40.25,40.879999999999995,64.75,37.129999999999995,82.27000000000001,35.949999999999996C85.46000000000001,35.739999999999995,88.83000000000001,35.44,92.00000000000001,36.019999999999996"/>
<path id="責-s5"  class="stroke" stroke="#09bf2a" d="M37.22,50.05C37.96,50.79,38.519999999999996,52.059999999999995,38.519999999999996,53.07C38.519999999999996,56,38.449999999999996,72,38.419999999999995,80.12C38.419999999999995,81.51,38.41,82.68,38.41,83.5"/>
<path id="責-s6"  class="stroke" stroke="#09bf8d" d="M39.4,51.27C44.12,50.620000000000005,64.91,47.540000000000006,67.61,47.150000000000006C69.5,46.88,70.97,47.63,70.97,50.120000000000005C70.97,56.60000000000001,70.89,66.87,70.87,77.01C70.87,78.22,70.87,79.43,70.87,80.63000000000001"/>
<path id="責-s7"  class="stroke" stroke="#098dbf" d="M39.6,60.9C45.88,60,65.16,57.26,69.94,57.05"/>
<path id="責-s8"  class="stroke" stroke="#092abf" d="M39.59,70.89C47.5,70,61.910000000000004,67.68,69.59,67.35"/>
<path id="責-s9"  class="stroke" stroke="#4b09bf" d="M39.61,81.53C47.87,80.62,59.620000000000005,78.87,70.11,78.24"/>
<path id="責-s10"  class="stroke" stroke="#ae09bf" d="M43.51,85.75C43.5,86.63,43.11,87.5,42.33,88.24C39.96,90.44999999999999,31.659999999999997,95.89,26.919999999999998,98.5"/>
<path id="責-s11"  class="stroke" stroke="#bf096c" d="M66.92,87.38C74.01,90.42,82.39,95.92999999999999,84.33,98.59"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="責-bg1"  class="badge-group"><circle cx="29.55" cy="21.13" r="3.5" fill="#bf0909"/><text class="num-single" x="29.55" y="21.13" dx="0" dy="-0.5">1</text></g>
<g id="責-bg2"  class="badge-group"><circle cx="52.67" cy="9.38" r="3.5" fill="#bf6c09"/><text class="num-single" x="52.67" y="9.38" dx="0" dy="-0.5">2</text></g>
