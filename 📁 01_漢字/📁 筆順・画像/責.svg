<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (責)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #責-bg[i]: Thời gian quả bóng số nảy lên
   - #責-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#責-bg1  { animation-delay: 0.05s; }
#責-s1   { stroke-dasharray: 46.7287; stroke-dashoffset: 46.7287; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#責-bg2  { animation-delay: 0.46s; }
#責-s2   { stroke-dasharray: 29.0147; stroke-dashoffset: 29.0147; animation: drawStroke 0.22s ease-out 0.59s forwards; }
#責-bg3  { animation-delay: 0.83s; }
#責-s3   { stroke-dasharray: 43.4618; stroke-dashoffset: 43.4618; animation: drawStroke 0.24s ease-out 0.96s forwards; }
#責-bg4  { animation-delay: 1.22s; }
#責-s4   { stroke-dasharray: 75.8716; stroke-dashoffset: 75.8716; animation: drawStroke 0.42s ease-out 1.35s forwards; }
#責-bg5  { animation-delay: 1.79s; }
#責-s5   { stroke-dasharray: 33.7912; stroke-dashoffset: 33.7912; animation: drawStroke 0.22s ease-out 1.92s forwards; }
#責-bg6  { animation-delay: 2.16s; }
#責-s6   { stroke-dasharray: 64.3155; stroke-dashoffset: 64.3155; animation: drawStroke 0.35s ease-out 2.29s forwards; }
#責-bg7  { animation-delay: 2.66s; }
#責-s7   { stroke-dasharray: 30.5882; stroke-dashoffset: 30.5882; animation: drawStroke 0.22s ease-out 2.79s forwards; }
#責-bg8  { animation-delay: 3.03s; }
#責-s8   { stroke-dasharray: 30.2151; stroke-dashoffset: 30.2151; animation: drawStroke 0.22s ease-out 3.16s forwards; }
#責-bg9  { animation-delay: 3.40s; }
#責-s9   { stroke-dasharray: 30.6818; stroke-dashoffset: 30.6818; animation: drawStroke 0.22s ease-out 3.53s forwards; }
#責-bg10  { animation-delay: 3.77s; }
#責-s10   { stroke-dasharray: 21.3690; stroke-dashoffset: 21.3690; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#責-bg11  { animation-delay: 4.14s; }
#責-s11   { stroke-dasharray: 20.8388; stroke-dashoffset: 20.8388; animation: drawStroke 0.22s ease-out 4.27s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #責-s[i]) -->
<path id="責-s1"  class="stroke" stroke="#bf0909" d="M29.55,21.13C31.5,21.369999999999997,33.85,21.169999999999998,35.53,20.91C44,19.62,60.13,17.12,69.50999999999999,16.3C71.57,16.12,73.86999999999999,15.91,75.92999999999999,16.060000000000002"/>
