<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (亡)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #亡-bg[i]: Thời gian quả bóng số nảy lên
   - #亡-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#亡-bg1  { animation-delay: 0.05s; }
#亡-s1   { stroke-dasharray: 21.8830; stroke-dashoffset: 21.8830; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#亡-bg2  { animation-delay: 0.42s; }
#亡-s2   { stroke-dasharray: 84.6027; stroke-dashoffset: 84.6027; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#亡-bg3  { animation-delay: 1.04s; }
#亡-s3   { stroke-dasharray: 100.6620; stroke-dashoffset: 100.6620; animation: drawStroke 0.55s ease-out 1.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 3 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #亡-s[i]) -->
<path id="亡-s1"  class="stroke" stroke="#bf0909" d="M52.79,14.36C54.4,15.969999999999999,54.75,18,54.75,20.5C54.75,25.38,54.75,30.93,54.75,35.75"/>
<path id="亡-s2"  class="stroke" stroke="#09bf09" d="M13.38,39.42C16.92,40.510000000000005,20.65,39.980000000000004,24.25,39.63C39.09,38.190000000000005,72,35.31,88.25,34.67C91.38,34.550000000000004,94.62,34.230000000000004,97.61,35.35"/>
<path id="亡-s3"  class="stroke" stroke="#0909bf" d="M29.75,43.5C30.81,44.56,31.25,46.38,31.25,48.75C31.25,61.09,31.25,72.78999999999999,31.25,77.46000000000001C31.25,87.5,33.25,90.28,59,90.28C71.88,90.28,80.63,89.87,89.5,87.08"/>

<!-- ============================================================
     BẢNG 3 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="亡-bg1"  class="badge-group"><circle cx="52.79" cy="14.36" r="3.5" fill="#bf0909"/><text class="num-single" x="52.79" y="14.36" dx="0" dy="-0.5">1</text></g>
<g id="亡-bg2"  class="badge-group"><circle cx="13.38" cy="39.42" r="3.5" fill="#09bf09"/><text class="num-single" x="13.38" y="39.42" dx="0" dy="-0.5">2</text></g>
<g id="亡-bg3"  class="badge-group"><circle cx="29.75" cy="43.5" r="3.5" fill="#0909bf"/><text class="num-single" x="29.75" y="43.5" dx="0" dy="-0.5">3</text></g>
</svg>