<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (部)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #部-bg[i]: Thời gian quả bóng số nảy lên
   - #部-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#部-bg1  { animation-delay: 0.05s; }
#部-s1   { stroke-dasharray: 12.6364; stroke-dashoffset: 12.6364; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#部-bg2  { animation-delay: 0.42s; }
#部-s2   { stroke-dasharray: 39.2091; stroke-dashoffset: 39.2091; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#部-bg3  { animation-delay: 0.79s; }
#部-s3   { stroke-dasharray: 13.0834; stroke-dashoffset: 13.0834; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#部-bg4  { animation-delay: 1.16s; }
#部-s4   { stroke-dasharray: 18.2711; stroke-dashoffset: 18.2711; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#部-bg5  { animation-delay: 1.53s; }
#部-s5   { stroke-dasharray: 47.4206; stroke-dashoffset: 47.4206; animation: drawStroke 0.26s ease-out 1.66s forwards; }
#部-bg6  { animation-delay: 1.94s; }
#部-s6   { stroke-dasharray: 22.6372; stroke-dashoffset: 22.6372; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#部-bg7  { animation-delay: 2.31s; }
#部-s7   { stroke-dasharray: 45.6366; stroke-dashoffset: 45.6366; animation: drawStroke 0.25s ease-out 2.44s forwards; }
#部-bg8  { animation-delay: 2.71s; }
#部-s8   { stroke-dasharray: 21.7886; stroke-dashoffset: 21.7886; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#部-bg9  { animation-delay: 3.08s; }
#部-s9   { stroke-dasharray: 54.6705; stroke-dashoffset: 54.6705; animation: drawStroke 0.30s ease-out 3.21s forwards; }
#部-bg10  { animation-delay: 3.53s; }
#部-s10   { stroke-dasharray: 47.7039; stroke-dashoffset: 47.7039; animation: drawStroke 0.26s ease-out 3.66s forwards; }
#部-bg11  { animation-delay: 3.94s; }
#部-s11   { stroke-dasharray: 77.0717; stroke-dashoffset: 77.0717; animation: drawStroke 0.42s ease-out 4.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #部-s[i]) -->
<path id="部-s1"  class="stroke" stroke="#bf0909" d="M35.6,13.25C36.480000000000004,13.91,36.92,15.16,36.92,16.7S36.92,21.33,36.92,25.509999999999998"/>
<path id="部-s2"  class="stroke" stroke="#bf6c09" d="M16.79,27.98C18.599999999999998,28.490000000000002,20.54,28.44,22.39,28.32C29.26,27.88,41.260000000000005,26.13,49.379999999999995,24.34C51.42999999999999,23.89,53.529999999999994,23.88,55.61,24.23"/>
