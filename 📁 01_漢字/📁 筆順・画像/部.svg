<g id="部-bg10" class="badge-group"><circle cx="80.65" cy="40.73" r="3.5" fill="#ae09bf"/><text class="num-double" x="80.65" y="40.73" dx="-0.4" dy="-0.475">10</text></g>
<g id="部-bg11" class="badge-group"><circle cx="67.37" cy="23.64" r="3.5" fill="#bf096c"/><text class="num-double" x="67.37" y="23.64" dx="-0.4" dy="-0.475">11</text></g>
</svg>