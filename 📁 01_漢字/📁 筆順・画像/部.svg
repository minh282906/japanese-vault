<path id="部-s5"  class="stroke" stroke="#09bf2a" d="M12.67,50.39C14.96,51,17.2,50.69,19.509999999999998,50.43C30.98,49.12,39,47.72,52.13,47C54.74,46.86,57.25,46.76,59.84,47.18"/>
<path id="部-s6"  class="stroke" stroke="#09bf8d" d="M22.16,63.08C22.96,63.72,23.42,64.55,23.54,65.57C24.52,69.16999999999999,25.509999999999998,75.86999999999999,26.29,81.35C26.48,82.66,26.65,83.89,26.81,85"/>
<path id="部-s7"  class="stroke" stroke="#098dbf" d="M24.07,64.38C31.22,63.349999999999994,41.64,62.019999999999996,47.14,61.33C49.75,61,51.620000000000005,62.379999999999995,51.09,65.17C50.25,69.59,49,75.55,47.75,80.49000000000001"/>
<path id="部-s8"  class="stroke" stroke="#092abf" d="M28.25,83.78C32.730000000000004,83.33,39.46,82.61,46.239999999999995,81.91C47.519999999999996,81.78,48.76,81.64,49.919999999999995,81.50999999999999"/>
<path id="部-s9"  class="stroke" stroke="#4b09bf" d="M65.27,19.39C66.5,20,68.03,19.96,69.5,19.86C75.66,19.43,84.38,18,88.83,16.97C92.09,16.22,94.25,17.25,92.75,21.25C91.75,23.91,85.13,34.13,80.65,40.480000000000004"/>
<path id="部-s10"  class="stroke" stroke="#ae09bf" d="M80.65,40.73C101.13000000000001,50.75,98.13000000000001,83.87,85.30000000000001,72.36"/>
<path id="部-s11"  class="stroke" stroke="#bf096c" d="M67.37,20.14C68.11,20.88,68.44,22.240000000000002,68.44,23.330000000000002C68.44,26.240000000000002,68.46,72.97,68.46,91.37C68.46,93.77000000000001,68.46,95.68,68.46,96.96000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="部-bg1"  class="badge-group"><circle cx="35.6" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="35.6" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="部-bg2"  class="badge-group"><circle cx="16.79" cy="27.98" r="3.5" fill="#bf6c09"/><text class="num-single" x="16.79" y="27.98" dx="0" dy="-0.5">2</text></g>
