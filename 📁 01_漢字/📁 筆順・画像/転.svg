<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (転)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #転-bg[i]: Thời gian quả bóng số nảy lên
   - #転-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#転-bg1  { animation-delay: 0.05s; }
#転-s1   { stroke-dasharray: 33.2374; stroke-dashoffset: 33.2374; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#転-bg2  { animation-delay: 0.42s; }
#転-s2   { stroke-dasharray: 25.3369; stroke-dashoffset: 25.3369; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#転-bg3  { animation-delay: 0.79s; }
#転-s3   { stroke-dasharray: 55.4060; stroke-dashoffset: 55.4060; animation: drawStroke 0.30s ease-out 0.92s forwards; }
#転-bg4  { animation-delay: 1.24s; }
#転-s4   { stroke-dasharray: 30.2682; stroke-dashoffset: 30.2682; animation: drawStroke 0.22s ease-out 1.37s forwards; }
#転-bg5  { animation-delay: 1.61s; }
#転-s5   { stroke-dasharray: 27.7701; stroke-dashoffset: 27.7701; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#転-bg6  { animation-delay: 1.98s; }
#転-s6   { stroke-dasharray: 40.1372; stroke-dashoffset: 40.1372; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#転-bg7  { animation-delay: 2.35s; }
#転-s7   { stroke-dasharray: 84.3773; stroke-dashoffset: 84.3773; animation: drawStroke 0.46s ease-out 2.48s forwards; }
#転-bg8  { animation-delay: 2.96s; }
#転-s8   { stroke-dasharray: 33.2463; stroke-dashoffset: 33.2463; animation: drawStroke 0.22s ease-out 3.09s forwards; }
#転-bg9  { animation-delay: 3.33s; }
#転-s9   { stroke-dasharray: 40.2507; stroke-dashoffset: 40.2507; animation: drawStroke 0.22s ease-out 3.46s forwards; }
#転-bg10  { animation-delay: 3.70s; }
#転-s10   { stroke-dasharray: 74.4178; stroke-dashoffset: 74.4178; animation: drawStroke 0.41s ease-out 3.83s forwards; }
#転-bg11  { animation-delay: 4.26s; }
#転-s11   { stroke-dasharray: 23.8737; stroke-dashoffset: 23.8737; animation: drawStroke 0.22s ease-out 4.39s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #転-s[i]) -->
<path id="転-s1"  class="stroke" stroke="#bf0909" d="M15.87,27.09C17.13,27.37,18.619999999999997,27.38,19.61,27.31C26,26.88,37.25,25,45.34,23.42C46.95,23.110000000000003,47.940000000000005,23.240000000000002,48.760000000000005,23.400000000000002"/>
<path id="転-s2"  class="stroke" stroke="#bf6c09" d="M15.2,39.78C15.959999999999999,40.54,16.619999999999997,41.620000000000005,16.78,42.64C17.380000000000003,46.47,18.16,53.89,19.03,61.24C19.16,62.330000000000005,19.290000000000003,63.42,19.42,64.5"/>
