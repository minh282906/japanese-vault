<path id="転-s7"  class="stroke" stroke="#098dbf" d="M31.66,12.7C32.85,13.889999999999999,33.34,15.26,33.34,16.43C33.34,18.66,33.290000000000006,71.97,33.21,90.75C33.2,93.59,33.19,95.64,33.17,96.61"/>
<path id="転-s8"  class="stroke" stroke="#092abf" d="M57.99,25.62C59.75,26,62.010000000000005,25.82,63.1,25.69C70.13,24.880000000000003,80.23,23.310000000000002,86.06,22.76C87.5,22.62,89.5,22.5,91.01,22.82"/>
<path id="転-s9"  class="stroke" stroke="#4b09bf" d="M56.5,50.17C58.36,50.5,60.22,50.45,61.75,50.300000000000004C70.36,49.50000000000001,82.93,47.50000000000001,91.56,46.900000000000006C93.09,46.790000000000006,95.21000000000001,46.870000000000005,96.5,47.27"/>
<path id="転-s10"  class="stroke" stroke="#ae09bf" d="M74.17,52.46C74.42,53.660000000000004,74.25,54.980000000000004,73.71000000000001,56.43C69.75000000000001,67.17,64.41000000000001,76.44,58.60000000000001,86.42C57.02000000000001,89.13,57.900000000000006,90.39,60.38000000000001,89.84C65.60000000000001,88.69,78.75000000000001,85.5,90.51,82.58"/>
<path id="転-s11"  class="stroke" stroke="#bf096c" d="M82.63,70.83C87.32,74.35,94.11999999999999,85.23,95.28999999999999,90.72"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="転-bg1"  class="badge-group"><circle cx="15.87" cy="27.09" r="3.5" fill="#bf0909"/><text class="num-single" x="15.87" y="27.09" dx="0" dy="-0.5">1</text></g>
