<g id="転-bg9"  class="badge-group"><circle cx="56.5" cy="50.17" r="3.5" fill="#4b09bf"/><text class="num-single" x="56.5" y="50.17" dx="0" dy="-0.5">9</text></g>
<g id="転-bg10" class="badge-group"><circle cx="74.17" cy="52.46" r="3.5" fill="#ae09bf"/><text class="num-double" x="74.17" y="52.46" dx="-0.4" dy="-0.475">10</text></g>
