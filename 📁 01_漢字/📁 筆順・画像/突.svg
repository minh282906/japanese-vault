<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (突)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #突-bg[i]: Thời gian quả bóng số nảy lên
   - #突-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#突-bg1  { animation-delay: 0.05s; }
#突-s1   { stroke-dasharray: 10.4336; stroke-dashoffset: 10.4336; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#突-bg2  { animation-delay: 0.42s; }
#突-s2   { stroke-dasharray: 18.9896; stroke-dashoffset: 18.9896; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#突-bg3  { animation-delay: 0.79s; }
#突-s3   { stroke-dasharray: 79.5449; stroke-dashoffset: 79.5449; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#突-bg4  { animation-delay: 1.38s; }
#突-s4   { stroke-dasharray: 26.3433; stroke-dashoffset: 26.3433; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#突-bg5  { animation-delay: 1.75s; }
#突-s5   { stroke-dasharray: 36.4066; stroke-dashoffset: 36.4066; animation: drawStroke 0.22s ease-out 1.88s forwards; }
#突-bg6  { animation-delay: 2.12s; }
#突-s6   { stroke-dasharray: 58.7620; stroke-dashoffset: 58.7620; animation: drawStroke 0.32s ease-out 2.25s forwards; }
#突-bg7  { animation-delay: 2.59s; }
#突-s7   { stroke-dasharray: 63.9302; stroke-dashoffset: 63.9302; animation: drawStroke 0.35s ease-out 2.72s forwards; }
#突-bg8  { animation-delay: 3.09s; }
#突-s8   { stroke-dasharray: 46.6955; stroke-dashoffset: 46.6955; animation: drawStroke 0.26s ease-out 3.22s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #突-s[i]) -->
<path id="突-s1"  class="stroke" stroke="#bf0909" d="M52.29,12.75C53.33,13.79,53.74,14.870000000000001,53.74,16.2C53.74,19.29,53.660000000000004,19.97,53.660000000000004,22.78"/>
<path id="突-s2"  class="stroke" stroke="#bf9109" d="M20.62,24.38C20.62,28.61,18.42,40.239999999999995,17.42,43.06"/>
<path id="突-s3"  class="stroke" stroke="#64bf09" d="M21.57,27.61C37.75,25.25,64.63,22.5,82.86,22.03C97.27,21.66,87.25,28.75,83.85,30.76"/>
<path id="突-s4"  class="stroke" stroke="#09bf36" d="M38.51,35.51C38.6,36.03,38.44,36.879999999999995,38.08,37.599999999999994C34.86,44.05,31,50.38,22.5,55.62"/>
<path id="突-s5"  class="stroke" stroke="#09bfbf" d="M60.26,31.98C61.199999999999996,32.92,61.44,33.89,61.5,35.07C61.75,40.32,61.5,37.5,61.5,41C61.5,45.75,62.5,47.25,72,47.25C79.25,47.25,83,47,84.25,45.5"/>
<path id="突-s6"  class="stroke" stroke="#0936bf" d="M25.23,67.43C28.37,68.12,31.29,67.84,33.85,67.56C47.13,66.08,63.45,64.23,75.5,63.42C78.26,63.230000000000004,80.98,63.07,83.71000000000001,63.64"/>
<path id="突-s7"  class="stroke" stroke="#6409bf" d="M50.97,49.28C51.48,49.96,51.75,50.74,51.73,52.21C51.38,76.88,40.62,89.5,19.5,99"/>
<path id="突-s8"  class="stroke" stroke="#bf0991" d="M52.29,67.33C59.9,74.39,71.85,85.39,80.25,91.50999999999999C82.87,93.41999999999999,85.64,95.08999999999999,88.5,96.61999999999999"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="突-bg1"  class="badge-group"><circle cx="52.29" cy="12.75" r="3.5" fill="#bf0909"/><text class="num-single" x="52.29" y="12.75" dx="0" dy="-0.5">1</text></g>
<g id="突-bg2"  class="badge-group"><circle cx="20.62" cy="20.88" r="3.5" fill="#bf9109"/><text class="num-single" x="20.62" y="20.88" dx="0" dy="-0.5">2</text></g>
<g id="突-bg3"  class="badge-group"><circle cx="21.57" cy="31.11" r="3.5" fill="#64bf09"/><text class="num-single" x="21.57" y="31.11" dx="0" dy="-0.5">3</text></g>
<g id="突-bg4"  class="badge-group"><circle cx="38.51" cy="35.51" r="3.5" fill="#09bf36"/><text class="num-single" x="38.51" y="35.51" dx="0" dy="-0.5">4</text></g>
<g id="突-bg5"  class="badge-group"><circle cx="60.26" cy="31.98" r="3.5" fill="#09bfbf"/><text class="num-single" x="60.26" y="31.98" dx="0" dy="-0.5">5</text></g>
<g id="突-bg6"  class="badge-group"><circle cx="25.23" cy="67.43" r="3.5" fill="#0936bf"/><text class="num-single" x="25.23" y="67.43" dx="0" dy="-0.5">6</text></g>
<g id="突-bg7"  class="badge-group"><circle cx="50.97" cy="49.28" r="3.5" fill="#6409bf"/><text class="num-single" x="50.97" y="49.28" dx="0" dy="-0.5">7</text></g>
<g id="突-bg8"  class="badge-group"><circle cx="52.29" cy="67.33" r="3.5" fill="#bf0991"/><text class="num-single" x="52.29" y="67.33" dx="0" dy="-0.5">8</text></g>
</svg>