<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (届)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #届-bg[i]: Thời gian quả bóng số nảy lên
   - #届-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#届-bg1  { animation-delay: 0.05s; }
#届-s1   { stroke-dasharray: 78.1667; stroke-dashoffset: 78.1667; animation: drawStroke 0.43s ease-out 0.18s forwards; }
#届-bg2  { animation-delay: 0.63s; }
#届-s2   { stroke-dasharray: 54.9501; stroke-dashoffset: 54.9501; animation: drawStroke 0.30s ease-out 0.76s forwards; }
#届-bg3  { animation-delay: 1.08s; }
#届-s3   { stroke-dasharray: 71.2455; stroke-dashoffset: 71.2455; animation: drawStroke 0.39s ease-out 1.21s forwards; }
#届-bg4  { animation-delay: 1.62s; }
#届-s4   { stroke-dasharray: 39.3722; stroke-dashoffset: 39.3722; animation: drawStroke 0.22s ease-out 1.75s forwards; }
#届-bg5  { animation-delay: 1.99s; }
#届-s5   { stroke-dasharray: 89.4027; stroke-dashoffset: 89.4027; animation: drawStroke 0.49s ease-out 2.12s forwards; }
#届-bg6  { animation-delay: 2.63s; }
#届-s6   { stroke-dasharray: 49.9889; stroke-dashoffset: 49.9889; animation: drawStroke 0.27s ease-out 2.76s forwards; }
#届-bg7  { animation-delay: 3.05s; }
#届-s7   { stroke-dasharray: 48.1658; stroke-dashoffset: 48.1658; animation: drawStroke 0.26s ease-out 3.18s forwards; }
#届-bg8  { animation-delay: 3.46s; }
#届-s8   { stroke-dasharray: 42.6188; stroke-dashoffset: 42.6188; animation: drawStroke 0.23s ease-out 3.59s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #届-s[i]) -->
<path id="届-s1"  class="stroke" stroke="#bf0909" d="M25.5,17.49C27.24,18.139999999999997,28.62,18.479999999999997,30.47,18.34C39.58,17.68,71.58,14.44,80.12,13.68C83.32000000000001,13.4,85.29,14.43,84.56,18C83.8,21.72,82.63,27.240000000000002,81.14,33.1"/>
<path id="届-s2"  class="stroke" stroke="#bf9109" d="M29.5,38.5C34.17,38.3,61.4,35.54,76.25,34.33C79.7,34.05,81.62,33.87,84.25,34"/>
<path id="届-s3"  class="stroke" stroke="#64bf09" d="M28.25,18.25C29.37,19.37,29.51,21.35,29.47,22.5C28.619999999999997,50.75,24.369999999999997,70,11.25,85.25"/>
<path id="届-s4"  class="stroke" stroke="#09bf36" d="M34.42,58.01C35.39,58.98,36.1,60.16,36.260000000000005,61.019999999999996C37.50000000000001,67.74,38.50000000000001,77.87,39.86000000000001,89.49C40.150000000000006,91.97,40.50000000000001,94.17999999999999,40.68000000000001,96.53999999999999"/>
<path id="届-s5"  class="stroke" stroke="#09bfbf" d="M37.21,60.33C53.62,58.5,73,56.38,84.94,55.68C88.07,55.5,90.57,56.98,90.2,60.25C89.51,66.38,87.82000000000001,78.7,85.84,87.8C85.42,89.74,84.98,91.52,84.54,93.03"/>
<path id="届-s6"  class="stroke" stroke="#0936bf" d="M59.74,42.32C60.65,43.23,61.25,44.87,61.25,46.5C61.25,61.75,61.23,87.95,61.23,91.94"/>
<path id="届-s7"  class="stroke" stroke="#6409bf" d="M39.57,75.8C49.38,74.75,74.25,72.36999999999999,87.57,71.89"/>
<path id="届-s8"  class="stroke" stroke="#bf0991" d="M41.64,93.94C53.63,93,70.81,91.34,84.16,91.16"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="届-bg1"  class="badge-group"><circle cx="25.5" cy="13.99" r="3.5" fill="#bf0909"/><text class="num-single" x="25.5" y="13.99" dx="0" dy="-0.5">1</text></g>
<g id="届-bg2"  class="badge-group"><circle cx="29.5" cy="38.5" r="3.5" fill="#bf9109"/><text class="num-single" x="29.5" y="38.5" dx="0" dy="-0.5">2</text></g>
<g id="届-bg3"  class="badge-group"><circle cx="28.25" cy="21.75" r="3.5" fill="#64bf09"/><text class="num-single" x="28.25" y="21.75" dx="0" dy="-0.5">3</text></g>
<g id="届-bg4"  class="badge-group"><circle cx="34.42" cy="54.51" r="3.5" fill="#09bf36"/><text class="num-single" x="34.42" y="54.51" dx="0" dy="-0.5">4</text></g>
<g id="届-bg5"  class="badge-group"><circle cx="37.21" cy="63.83" r="3.5" fill="#09bfbf"/><text class="num-single" x="37.21" y="63.83" dx="0" dy="-0.5">5</text></g>
<g id="届-bg6"  class="badge-group"><circle cx="59.74" cy="42.32" r="3.5" fill="#0936bf"/><text class="num-single" x="59.74" y="42.32" dx="0" dy="-0.5">6</text></g>
<g id="届-bg7"  class="badge-group"><circle cx="39.57" cy="75.8" r="3.5" fill="#6409bf"/><text class="num-single" x="39.57" y="75.8" dx="0" dy="-0.5">7</text></g>
<g id="届-bg8"  class="badge-group"><circle cx="41.64" cy="93.94" r="3.5" fill="#bf0991"/><text class="num-single" x="41.64" y="93.94" dx="0" dy="-0.5">8</text></g>
</svg>