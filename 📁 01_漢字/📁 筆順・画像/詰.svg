<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (詰)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #詰-bg[i]: Thời gian quả bóng số nảy lên
   - #詰-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#詰-bg1  { animation-delay: 0.05s; }
#詰-s1   { stroke-dasharray: 12.3433; stroke-dashoffset: 12.3433; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#詰-bg2  { animation-delay: 0.42s; }
#詰-s2   { stroke-dasharray: 32.9687; stroke-dashoffset: 32.9687; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#詰-bg3  { animation-delay: 0.79s; }
#詰-s3   { stroke-dasharray: 20.8290; stroke-dashoffset: 20.8290; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#詰-bg4  { animation-delay: 1.16s; }
#詰-s4   { stroke-dasharray: 20.7220; stroke-dashoffset: 20.7220; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#詰-bg5  { animation-delay: 1.53s; }
#詰-s5   { stroke-dasharray: 20.6059; stroke-dashoffset: 20.6059; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#詰-bg6  { animation-delay: 1.90s; }
#詰-s6   { stroke-dasharray: 38.2591; stroke-dashoffset: 38.2591; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#詰-bg7  { animation-delay: 2.27s; }
#詰-s7   { stroke-dasharray: 17.4650; stroke-dashoffset: 17.4650; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#詰-bg8  { animation-delay: 2.64s; }
#詰-s8   { stroke-dasharray: 49.2654; stroke-dashoffset: 49.2654; animation: drawStroke 0.27s ease-out 2.77s forwards; }
#詰-bg9  { animation-delay: 3.06s; }
#詰-s9   { stroke-dasharray: 40.3464; stroke-dashoffset: 40.3464; animation: drawStroke 0.22s ease-out 3.19s forwards; }
#詰-bg10  { animation-delay: 3.43s; }
#詰-s10   { stroke-dasharray: 41.6127; stroke-dashoffset: 41.6127; animation: drawStroke 0.23s ease-out 3.56s forwards; }
#詰-bg11  { animation-delay: 3.81s; }
#詰-s11   { stroke-dasharray: 27.0364; stroke-dashoffset: 27.0364; animation: drawStroke 0.22s ease-out 3.94s forwards; }
#詰-bg12  { animation-delay: 4.18s; }
#詰-s12   { stroke-dasharray: 55.7452; stroke-dashoffset: 55.7452; animation: drawStroke 0.31s ease-out 4.31s forwards; }
#詰-bg13  { animation-delay: 4.64s; }
#詰-s13   { stroke-dasharray: 29.4608; stroke-dashoffset: 29.4608; animation: drawStroke 0.22s ease-out 4.77s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

