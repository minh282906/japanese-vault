<path id="詰-s9"  class="stroke" stroke="#0941bf" d="M68.98,13.26C70.11,14.39,70.49000000000001,15.629999999999999,70.49000000000001,17.15C70.49000000000001,23.5,70.50000000000001,40.5,70.50000000000001,53.199999999999996"/>
<path id="詰-s10"  class="stroke" stroke="#2509bf" d="M51.31,55.44C53.14,56.08,55.6,55.97,57.5,55.769999999999996C66.02,54.88999999999999,74.85,53.83,86.74,52.98C88.74,52.839999999999996,90.75,53.05,92.69999999999999,53.419999999999995"/>
<path id="詰-s11"  class="stroke" stroke="#7909bf" d="M53.98,68.06C54.959999999999994,69.04,55.239999999999995,70.16,55.459999999999994,71.52C56.36999999999999,77.13,57.349999999999994,82.41,58.11999999999999,88.47C58.38999999999999,90.58,58.62999999999999,92.62,58.83999999999999,94.47"/>
