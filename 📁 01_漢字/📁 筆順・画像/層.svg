<path id="層-s7"  class="stroke" stroke="#09bf71" d="M35.37,49.11C47.28,47.83,69.61,45.51,81,44.76C85.13,44.489999999999995,86.12,45.21,85.43,49.129999999999995C84.85000000000001,52.379999999999995,83.88000000000001,57.37,82.57000000000001,62.019999999999996C82.19000000000001,63.349999999999994,81.80000000000001,64.67,81.4,65.94"/>
<path id="層-s8"  class="stroke" stroke="#09bfbf" d="M57.43,47.9C58.27,48.74,58.43,49.97,58.42,51.269999999999996C58.38,55.629999999999995,58.2,61.75,58.2,64.67999999999999"/>
<path id="層-s9"  class="stroke" stroke="#0971bf" d="M37.33,57.52C48,56.38,76.9,54.67,83.44,54.42"/>
