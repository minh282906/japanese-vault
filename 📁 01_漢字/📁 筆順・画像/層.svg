<path id="層-s11"  class="stroke" stroke="#3d09bf" d="M41.82,74.26C42.59,75.03,42.93,76.46000000000001,42.99,77.36C43.370000000000005,82.8,43.97,89.07,44.410000000000004,94.73C44.510000000000005,96.02000000000001,44.6,97.29,44.67,98.5"/>
<path id="層-s12"  class="stroke" stroke="#8b09bf" d="M44.18,76.21C50.5,75.5,70.16,73.47999999999999,73.17,73.36999999999999C75.68,73.27999999999999,76.38,75.42999999999999,76.31,75.96999999999998C75.97,78.69999999999999,75.54,85.00999999999999,74.89,93.00999999999999C74.78,94.30999999999999,74.67,95.66,74.53,97.02999999999999"/>
