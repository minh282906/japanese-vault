<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (層)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #層-bg[i]: Thời gian quả bóng số nảy lên
   - #層-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#層-bg1  { animation-delay: 0.05s; }
#層-s1   { stroke-dasharray: 69.6581; stroke-dashoffset: 69.6581; animation: drawStroke 0.38s ease-out 0.18s forwards; }
#層-bg2  { animation-delay: 0.58s; }
#層-s2   { stroke-dasharray: 52.4033; stroke-dashoffset: 52.4033; animation: drawStroke 0.29s ease-out 0.71s forwards; }
#層-bg3  { animation-delay: 1.02s; }
#層-s3   { stroke-dasharray: 72.8258; stroke-dashoffset: 72.8258; animation: drawStroke 0.40s ease-out 1.15s forwards; }
#層-bg4  { animation-delay: 1.57s; }
#層-s4   { stroke-dasharray: 11.2446; stroke-dashoffset: 11.2446; animation: drawStroke 0.22s ease-out 1.70s forwards; }
#層-bg5  { animation-delay: 1.94s; }
#層-s5   { stroke-dasharray: 16.2272; stroke-dashoffset: 16.2272; animation: drawStroke 0.22s ease-out 2.07s forwards; }
#層-bg6  { animation-delay: 2.31s; }
#層-s6   { stroke-dasharray: 22.9512; stroke-dashoffset: 22.9512; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#層-bg7  { animation-delay: 2.68s; }
#層-s7   { stroke-dasharray: 71.2296; stroke-dashoffset: 71.2296; animation: drawStroke 0.39s ease-out 2.81s forwards; }
#層-bg8  { animation-delay: 3.22s; }
#層-s8   { stroke-dasharray: 17.0220; stroke-dashoffset: 17.0220; animation: drawStroke 0.22s ease-out 3.35s forwards; }
#層-bg9  { animation-delay: 3.59s; }
#層-s9   { stroke-dasharray: 46.2179; stroke-dashoffset: 46.2179; animation: drawStroke 0.25s ease-out 3.72s forwards; }
#層-bg10  { animation-delay: 3.99s; }
#層-s10   { stroke-dasharray: 42.1387; stroke-dashoffset: 42.1387; animation: drawStroke 0.23s ease-out 4.12s forwards; }
#層-bg11  { animation-delay: 4.37s; }
#層-s11   { stroke-dasharray: 24.5823; stroke-dashoffset: 24.5823; animation: drawStroke 0.22s ease-out 4.50s forwards; }
#層-bg12  { animation-delay: 4.74s; }
#層-s12   { stroke-dasharray: 54.8076; stroke-dashoffset: 54.8076; animation: drawStroke 0.30s ease-out 4.87s forwards; }
#層-bg13  { animation-delay: 5.19s; }
#層-s13   { stroke-dasharray: 30.2222; stroke-dashoffset: 30.2222; animation: drawStroke 0.22s ease-out 5.32s forwards; }
#層-bg14  { animation-delay: 5.56s; }
#層-s14   { stroke-dasharray: 28.2380; stroke-dashoffset: 28.2380; animation: drawStroke 0.22s ease-out 5.69s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

