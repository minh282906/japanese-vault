<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (頼)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #頼-bg[i]: Thời gian quả bóng số nảy lên
   - #頼-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#頼-bg1  { animation-delay: 0.05s; }
#頼-s1   { stroke-dasharray: 33.4346; stroke-dashoffset: 33.4346; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#頼-bg2  { animation-delay: 0.42s; }
#頼-s2   { stroke-dasharray: 17.7737; stroke-dashoffset: 17.7737; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#頼-bg3  { animation-delay: 0.79s; }
#頼-s3   { stroke-dasharray: 45.3365; stroke-dashoffset: 45.3365; animation: drawStroke 0.25s ease-out 0.92s forwards; }
#頼-bg4  { animation-delay: 1.19s; }
#頼-s4   { stroke-dasharray: 28.9416; stroke-dashoffset: 28.9416; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#頼-bg5  { animation-delay: 1.56s; }
#頼-s5   { stroke-dasharray: 85.3775; stroke-dashoffset: 85.3775; animation: drawStroke 0.47s ease-out 1.69s forwards; }
#頼-bg6  { animation-delay: 2.18s; }
#頼-s6   { stroke-dasharray: 36.2948; stroke-dashoffset: 36.2948; animation: drawStroke 0.22s ease-out 2.31s forwards; }
#頼-bg7  { animation-delay: 2.55s; }
#頼-s7   { stroke-dasharray: 16.9362; stroke-dashoffset: 16.9362; animation: drawStroke 0.22s ease-out 2.68s forwards; }
#頼-bg8  { animation-delay: 2.92s; }
#頼-s8   { stroke-dasharray: 40.9646; stroke-dashoffset: 40.9646; animation: drawStroke 0.23s ease-out 3.05s forwards; }
#頼-bg9  { animation-delay: 3.30s; }
#頼-s9   { stroke-dasharray: 12.4816; stroke-dashoffset: 12.4816; animation: drawStroke 0.22s ease-out 3.43s forwards; }
#頼-bg10  { animation-delay: 3.67s; }
#頼-s10   { stroke-dasharray: 43.6905; stroke-dashoffset: 43.6905; animation: drawStroke 0.24s ease-out 3.80s forwards; }
#頼-bg11  { animation-delay: 4.06s; }
#頼-s11   { stroke-dasharray: 69.9994; stroke-dashoffset: 69.9994; animation: drawStroke 0.38s ease-out 4.19s forwards; }
#頼-bg12  { animation-delay: 4.59s; }
#頼-s12   { stroke-dasharray: 25.7904; stroke-dashoffset: 25.7904; animation: drawStroke 0.22s ease-out 4.72s forwards; }
#頼-bg13  { animation-delay: 4.96s; }
#頼-s13   { stroke-dasharray: 25.8476; stroke-dashoffset: 25.8476; animation: drawStroke 0.22s ease-out 5.09s forwards; }
#頼-bg14  { animation-delay: 5.33s; }
#頼-s14   { stroke-dasharray: 25.8203; stroke-dashoffset: 25.8203; animation: drawStroke 0.22s ease-out 5.46s forwards; }
#頼-bg15  { animation-delay: 5.70s; }
#頼-s15   { stroke-dasharray: 20.8654; stroke-dashoffset: 20.8654; animation: drawStroke 0.22s ease-out 5.83s forwards; }
#頼-bg16  { animation-delay: 6.07s; }
#頼-s16   { stroke-dasharray: 17.1576; stroke-dashoffset: 17.1576; animation: drawStroke 0.22s ease-out 6.20s forwards; }
]]>
</style>

