<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (報)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #報-bg[i]: Thời gian quả bóng số nảy lên
   - #報-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#報-bg1  { animation-delay: 0.05s; }
#報-s1   { stroke-dasharray: 28.9317; stroke-dashoffset: 28.9317; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#報-bg2  { animation-delay: 0.42s; }
#報-s2   { stroke-dasharray: 26.7654; stroke-dashoffset: 26.7654; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#報-bg3  { animation-delay: 0.79s; }
#報-s3   { stroke-dasharray: 41.3604; stroke-dashoffset: 41.3604; animation: drawStroke 0.23s ease-out 0.92s forwards; }
#報-bg4  { animation-delay: 1.17s; }
#報-s4   { stroke-dasharray: 9.7302; stroke-dashoffset: 9.7302; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#報-bg5  { animation-delay: 1.54s; }
#報-s5   { stroke-dasharray: 14.1142; stroke-dashoffset: 14.1142; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#報-bg6  { animation-delay: 1.91s; }
#報-s6   { stroke-dasharray: 31.6854; stroke-dashoffset: 31.6854; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#報-bg7  { animation-delay: 2.28s; }
#報-s7   { stroke-dasharray: 40.1146; stroke-dashoffset: 40.1146; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#報-bg8  { animation-delay: 2.65s; }
#報-s8   { stroke-dasharray: 39.2669; stroke-dashoffset: 39.2669; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#報-bg9  { animation-delay: 3.02s; }
#報-s9   { stroke-dasharray: 63.3770; stroke-dashoffset: 63.3770; animation: drawStroke 0.35s ease-out 3.15s forwards; }
#報-bg10  { animation-delay: 3.52s; }
#報-s10   { stroke-dasharray: 82.9141; stroke-dashoffset: 82.9141; animation: drawStroke 0.46s ease-out 3.65s forwards; }
#報-bg11  { animation-delay: 4.13s; }
#報-s11   { stroke-dasharray: 77.9913; stroke-dashoffset: 77.9913; animation: drawStroke 0.43s ease-out 4.26s forwards; }
#報-bg12  { animation-delay: 4.71s; }
#報-s12   { stroke-dasharray: 43.9303; stroke-dashoffset: 43.9303; animation: drawStroke 0.24s ease-out 4.84s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

