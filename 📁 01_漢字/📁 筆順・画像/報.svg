<path id="報-s9"  class="stroke" stroke="#0909bf" d="M55.5,16C56.58,16.5,57.83,16.5,59.39,16.42C63.25,16.240000000000002,82,13.3,83.95,13.180000000000001C85.89,13.070000000000002,87.18,14.230000000000002,86.76,16.57C86.01,20.740000000000002,84.28,29.009999999999998,81.29,33.85C76.26,41.99,73.9,34.410000000000004,73.32000000000001,34.190000000000005"/>
<path id="報-s10"  class="stroke" stroke="#6409bf" d="M56.58,16.5C57.6,17.52,58.15,18.88,58.15,20.5C58.15,33.32,58.12,73.08,58.12,91C58.12,94.74,58.12,97.55,58.12,99"/>
<path id="報-s11"  class="stroke" stroke="#bf09bf" d="M61.86,54.44C63.03,54.73,64.42999999999999,54.919999999999995,66.76,54.48S84.64,50.44,86.26,50.05C88.62,49.489999999999995,90.12,50.739999999999995,89.45,53.26C86.61,64.03,78,82.75,65.5,93.25"/>
