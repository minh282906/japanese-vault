<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (描)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #描-bg[i]: Thời gian quả bóng số nảy lên
   - #描-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#描-bg1  { animation-delay: 0.05s; }
#描-s1   { stroke-dasharray: 29.7336; stroke-dashoffset: 29.7336; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#描-bg2  { animation-delay: 0.42s; }
#描-s2   { stroke-dasharray: 86.0868; stroke-dashoffset: 86.0868; animation: drawStroke 0.47s ease-out 0.55s forwards; }
#描-bg3  { animation-delay: 1.04s; }
#描-s3   { stroke-dasharray: 30.9764; stroke-dashoffset: 30.9764; animation: drawStroke 0.22s ease-out 1.17s forwards; }
#描-bg4  { animation-delay: 1.41s; }
#描-s4   { stroke-dasharray: 53.0184; stroke-dashoffset: 53.0184; animation: drawStroke 0.29s ease-out 1.54s forwards; }
#描-bg5  { animation-delay: 1.85s; }
#描-s5   { stroke-dasharray: 28.8502; stroke-dashoffset: 28.8502; animation: drawStroke 0.22s ease-out 1.98s forwards; }
#描-bg6  { animation-delay: 2.22s; }
#描-s6   { stroke-dasharray: 30.8849; stroke-dashoffset: 30.8849; animation: drawStroke 0.22s ease-out 2.35s forwards; }
#描-bg7  { animation-delay: 2.59s; }
#描-s7   { stroke-dasharray: 38.3286; stroke-dashoffset: 38.3286; animation: drawStroke 0.22s ease-out 2.72s forwards; }
#描-bg8  { animation-delay: 2.96s; }
#描-s8   { stroke-dasharray: 76.2758; stroke-dashoffset: 76.2758; animation: drawStroke 0.42s ease-out 3.09s forwards; }
#描-bg9  { animation-delay: 3.53s; }
#描-s9   { stroke-dasharray: 30.1120; stroke-dashoffset: 30.1120; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#描-bg10  { animation-delay: 3.90s; }
#描-s10   { stroke-dasharray: 37.2491; stroke-dashoffset: 37.2491; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#描-bg11  { animation-delay: 4.27s; }
#描-s11   { stroke-dasharray: 33.0764; stroke-dashoffset: 33.0764; animation: drawStroke 0.22s ease-out 4.40s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

