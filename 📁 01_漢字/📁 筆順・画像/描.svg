<path id="描-s8"  class="stroke" stroke="#092abf" d="M52.6,57.69C63.92,56.11,79.7,54.65,87.89,53.839999999999996C91.3,53.49999999999999,93.75,54.169999999999995,93.39,58.019999999999996C92.87,63.66,91.74,74.82,90.31,84.3C90,86.35,89.68,88.32,89.34,90.14"/>
<path id="描-s9"  class="stroke" stroke="#4b09bf" d="M70.41,57.78C71.25,58.620000000000005,71.41,59.57,71.41,60.6C71.41,68.5,71.42,81.64,71.38,87.63"/>
<path id="描-s10"  class="stroke" stroke="#ae09bf" d="M54.12,73.13C65.75,71.63,82.37,69.88,91.16999999999999,69.33"/>
<path id="描-s11"  class="stroke" stroke="#bf096c" d="M55.59,90.26C63.75,89.51,78.54,88.02000000000001,88.56,87.66000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="描-bg1"  class="badge-group"><circle cx="16.25" cy="35.42" r="3.5" fill="#bf0909"/><text class="num-single" x="16.25" y="35.42" dx="0" dy="-0.5">1</text></g>
