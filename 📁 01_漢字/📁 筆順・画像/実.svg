<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (実)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #実-bg[i]: Thời gian quả bóng số nảy lên
   - #実-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#実-bg1  { animation-delay: 0.05s; }
#実-s1   { stroke-dasharray: 14.1937; stroke-dashoffset: 14.1937; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#実-bg2  { animation-delay: 0.42s; }
#実-s2   { stroke-dasharray: 16.3431; stroke-dashoffset: 16.3431; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#実-bg3  { animation-delay: 0.79s; }
#実-s3   { stroke-dasharray: 71.2071; stroke-dashoffset: 71.2071; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#実-bg4  { animation-delay: 1.33s; }
#実-s4   { stroke-dasharray: 37.9547; stroke-dashoffset: 37.9547; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#実-bg5  { animation-delay: 1.70s; }
#実-s5   { stroke-dasharray: 43.6747; stroke-dashoffset: 43.6747; animation: drawStroke 0.24s ease-out 1.83s forwards; }
#実-bg6  { animation-delay: 2.09s; }
#実-s6   { stroke-dasharray: 62.2305; stroke-dashoffset: 62.2305; animation: drawStroke 0.34s ease-out 2.22s forwards; }
#実-bg7  { animation-delay: 2.58s; }
#実-s7   { stroke-dasharray: 79.6519; stroke-dashoffset: 79.6519; animation: drawStroke 0.44s ease-out 2.71s forwards; }
#実-bg8  { animation-delay: 3.17s; }
#実-s8   { stroke-dasharray: 46.6819; stroke-dashoffset: 46.6819; animation: drawStroke 0.26s ease-out 3.30s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 8 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #実-s[i]) -->
<path id="実-s1"  class="stroke" stroke="#bf0909" d="M52.54,11.25C53.71,12.42,54.38,13.99,54.36,15C54.28,18.16,54.28,22.05,54.28,24.93"/>
<path id="実-s2"  class="stroke" stroke="#bf9109" d="M26.63,26.78C26.63,29.6,22.669999999999998,40.370000000000005,21.549999999999997,42.25"/>
<path id="実-s3"  class="stroke" stroke="#64bf09" d="M27.03,28.49C43.75,26.619999999999997,71,23.799999999999997,83.27000000000001,23.189999999999998C92.26,22.74,87.51,27.619999999999997,82.41000000000001,31.22"/>
<path id="実-s4"  class="stroke" stroke="#09bf36" d="M35,42.8C36.75,43.25,38.66,43.18,40.41,42.98C46.92999999999999,42.23,61.059999999999995,40.83,67.61,40.209999999999994C69.42999999999999,40.03999999999999,70.98,39.989999999999995,72.75,40.419999999999995"/>
<path id="実-s5"  class="stroke" stroke="#09bfbf" d="M32.75,55.15C35,55.62,37.53,55.39,39.62,55.22C47,54.62,60,53.38,68.99,52.6C71.39999999999999,52.39,73.86999999999999,52.35,76.25,52.870000000000005"/>
<path id="実-s6"  class="stroke" stroke="#0936bf" d="M23.75,69.4C27,70,29.18,69.87,31.62,69.62C41.54,68.61,65.17,66.27000000000001,77.12,65.67C79.97,65.53,82.93,65.25,85.74000000000001,65.87"/>
<path id="実-s7"  class="stroke" stroke="#6409bf" d="M52.27,31.5C53.57,32.8,54.02,34.63,54.1,36.56C55.88,79.62,44,88.12,24,97.75"/>
<path id="実-s8"  class="stroke" stroke="#bf0991" d="M53.5,70C62.75,78.25,75.7,89.32,82.7,94.65C85.08,96.46000000000001,88.12,97.23,90.5,97.75"/>

<!-- ============================================================
     BẢNG 8 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="実-bg1"  class="badge-group"><circle cx="52.54" cy="11.25" r="3.5" fill="#bf0909"/><text class="num-single" x="52.54" y="11.25" dx="0" dy="-0.5">1</text></g>
<g id="実-bg2"  class="badge-group"><circle cx="26.63" cy="23.28" r="3.5" fill="#bf9109"/><text class="num-single" x="26.63" y="23.28" dx="0" dy="-0.5">2</text></g>
<g id="実-bg3"  class="badge-group"><circle cx="27.03" cy="31.99" r="3.5" fill="#64bf09"/><text class="num-single" x="27.03" y="31.99" dx="0" dy="-0.5">3</text></g>
<g id="実-bg4"  class="badge-group"><circle cx="35" cy="42.8" r="3.5" fill="#09bf36"/><text class="num-single" x="35" y="42.8" dx="0" dy="-0.5">4</text></g>
<g id="実-bg5"  class="badge-group"><circle cx="32.75" cy="55.15" r="3.5" fill="#09bfbf"/><text class="num-single" x="32.75" y="55.15" dx="0" dy="-0.5">5</text></g>
<g id="実-bg6"  class="badge-group"><circle cx="23.75" cy="69.4" r="3.5" fill="#0936bf"/><text class="num-single" x="23.75" y="69.4" dx="0" dy="-0.5">6</text></g>
<g id="実-bg7"  class="badge-group"><circle cx="52.27" cy="31.5" r="3.5" fill="#6409bf"/><text class="num-single" x="52.27" y="31.5" dx="0" dy="-0.5">7</text></g>
<g id="実-bg8"  class="badge-group"><circle cx="53.5" cy="70" r="3.5" fill="#bf0991"/><text class="num-single" x="53.5" y="70" dx="0" dy="-0.5">8</text></g>
</svg>