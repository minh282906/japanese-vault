<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (動)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #動-bg[i]: Thời gian quả bóng số nảy lên
   - #動-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#動-bg1  { animation-delay: 0.05s; }
#動-s1   { stroke-dasharray: 32.9754; stroke-dashoffset: 32.9754; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#動-bg2  { animation-delay: 0.42s; }
#動-s2   { stroke-dasharray: 42.1145; stroke-dashoffset: 42.1145; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#動-bg3  { animation-delay: 0.80s; }
#動-s3   { stroke-dasharray: 22.7545; stroke-dashoffset: 22.7545; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#動-bg4  { animation-delay: 1.17s; }
#動-s4   { stroke-dasharray: 55.4965; stroke-dashoffset: 55.4965; animation: drawStroke 0.31s ease-out 1.30s forwards; }
#動-bg5  { animation-delay: 1.63s; }
#動-s5   { stroke-dasharray: 31.2073; stroke-dashoffset: 31.2073; animation: drawStroke 0.22s ease-out 1.76s forwards; }
#動-bg6  { animation-delay: 2.00s; }
#動-s6   { stroke-dasharray: 27.4713; stroke-dashoffset: 27.4713; animation: drawStroke 0.22s ease-out 2.13s forwards; }
#動-bg7  { animation-delay: 2.37s; }
#動-s7   { stroke-dasharray: 61.6128; stroke-dashoffset: 61.6128; animation: drawStroke 0.34s ease-out 2.50s forwards; }
#動-bg8  { animation-delay: 2.86s; }
#動-s8   { stroke-dasharray: 30.0531; stroke-dashoffset: 30.0531; animation: drawStroke 0.22s ease-out 2.99s forwards; }
#動-bg9  { animation-delay: 3.23s; }
#動-s9   { stroke-dasharray: 34.5117; stroke-dashoffset: 34.5117; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#動-bg10  { animation-delay: 3.60s; }
#動-s10   { stroke-dasharray: 100.4540; stroke-dashoffset: 100.4540; animation: drawStroke 0.55s ease-out 3.73s forwards; }
#動-bg11  { animation-delay: 4.30s; }
#動-s11   { stroke-dasharray: 77.7562; stroke-dashoffset: 77.7562; animation: drawStroke 0.43s ease-out 4.43s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #動-s[i]) -->
