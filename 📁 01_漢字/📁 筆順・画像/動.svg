<path id="動-s2"  class="stroke" stroke="#bf6c09" d="M11.97,34.81C13.92,35.09,15.8,34.96,17.740000000000002,34.7C25.46,33.660000000000004,39.370000000000005,31.590000000000003,47.620000000000005,30.640000000000004C49.6,30.410000000000004,51.99,30.240000000000006,53.77,30.540000000000003"/>
