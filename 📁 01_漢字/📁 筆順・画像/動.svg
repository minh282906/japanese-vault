<path id="動-s4"  class="stroke" stroke="#4bbf09" d="M16.91,45.8C26.57,44.349999999999994,39.129999999999995,42.519999999999996,47.4,41.449999999999996C50.87,40.99999999999999,52.85,43.13999999999999,52.489999999999995,45.28999999999999C51.74999999999999,49.74999999999999,50.73,55.15999999999999,49.669999999999995,59.669999999999995C49.449999999999996,60.60999999999999,49.239999999999995,61.459999999999994,49.059999999999995,62.17999999999999"/>
<path id="動-s5"  class="stroke" stroke="#09bf2a" d="M19.3,54.39C25.37,53.5,46.07,51.37,50.32,50.99"/>
<path id="動-s6"  class="stroke" stroke="#09bf8d" d="M21.3,64.09C30,62.63,38.629999999999995,61.5,48.57,60.88"/>
<path id="動-s7"  class="stroke" stroke="#098dbf" d="M32.96,24.91C33.96,25.91,34.54,27.25,34.54,28.45C34.54,31.89,34.61,80,34.61,86.09"/>
<path id="動-s8"  class="stroke" stroke="#092abf" d="M19.57,76.63C21.12,77,22.67,76.83,23.89,76.69C32,75.75,38.75,74.5,44.510000000000005,73.16C46.39000000000001,72.72,48.13,72.63,49.25000000000001,72.75999999999999"/>
<path id="動-s9"  class="stroke" stroke="#4b09bf" d="M14.55,91.36C15.63,92.37,16.96,92.88,20.060000000000002,91.89C29.12,89,33.75,88,47.47,83.53"/>
<path id="動-s10"  class="stroke" stroke="#ae09bf" d="M59.67,43.15C61.13,43.75,62.980000000000004,43.74,64.94,43.51C73.75999999999999,42.5,84.62,40.44,89.99,39.23C93.75999999999999,38.379999999999995,96.05,40.25,95.77,43.379999999999995C94.38,59,90.5,78.12,83.67,90.85C81,95.82,77.62,93.86999999999999,74.42,90.17999999999999"/>
<path id="動-s11"  class="stroke" stroke="#bf096c" d="M76.39,18.43C77.61,19.65,77.87,21.009999999999998,77.76,23.43C76.88,42.5,70.38,75.5,54.14,90.27"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="動-bg1"  class="badge-group"><circle cx="46.84" cy="14.89" r="3.5" fill="#bf0909"/><text class="num-single" x="46.84" y="14.89" dx="0" dy="-0.5">1</text></g>
