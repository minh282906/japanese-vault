<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (楽)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #楽-bg[i]: Thời gian quả bóng số nảy lên
   - #楽-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#楽-bg1  { animation-delay: 0.05s; }
#楽-s1   { stroke-dasharray: 13.3570; stroke-dashoffset: 13.3570; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#楽-bg2  { animation-delay: 0.42s; }
#楽-s2   { stroke-dasharray: 29.0551; stroke-dashoffset: 29.0551; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#楽-bg3  { animation-delay: 0.79s; }
#楽-s3   { stroke-dasharray: 51.9928; stroke-dashoffset: 51.9928; animation: drawStroke 0.29s ease-out 0.92s forwards; }
#楽-bg4  { animation-delay: 1.23s; }
#楽-s4   { stroke-dasharray: 20.7382; stroke-dashoffset: 20.7382; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#楽-bg5  { animation-delay: 1.60s; }
#楽-s5   { stroke-dasharray: 18.8809; stroke-dashoffset: 18.8809; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#楽-bg6  { animation-delay: 1.97s; }
#楽-s6   { stroke-dasharray: 14.9338; stroke-dashoffset: 14.9338; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#楽-bg7  { animation-delay: 2.34s; }
#楽-s7   { stroke-dasharray: 20.7101; stroke-dashoffset: 20.7101; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#楽-bg8  { animation-delay: 2.71s; }
#楽-s8   { stroke-dasharray: 16.2668; stroke-dashoffset: 16.2668; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#楽-bg9  { animation-delay: 3.08s; }
#楽-s9   { stroke-dasharray: 18.7562; stroke-dashoffset: 18.7562; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#楽-bg10  { animation-delay: 3.45s; }
#楽-s10   { stroke-dasharray: 74.9110; stroke-dashoffset: 74.9110; animation: drawStroke 0.41s ease-out 3.58s forwards; }
#楽-bg11  { animation-delay: 4.01s; }
#楽-s11   { stroke-dasharray: 43.6807; stroke-dashoffset: 43.6807; animation: drawStroke 0.24s ease-out 4.14s forwards; }
#楽-bg12  { animation-delay: 4.40s; }
#楽-s12   { stroke-dasharray: 42.0659; stroke-dashoffset: 42.0659; animation: drawStroke 0.23s ease-out 4.53s forwards; }
#楽-bg13  { animation-delay: 4.78s; }
#楽-s13   { stroke-dasharray: 44.8792; stroke-dashoffset: 44.8792; animation: drawStroke 0.25s ease-out 4.91s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 13 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #楽-s[i]) -->
<path id="楽-s1"  class="stroke" stroke="#bf0909" d="M52.99,11C53,12,52.86,12.85,52.5,13.5C51.54,15.78,48.44,19.3,45.59,21.68"/>
