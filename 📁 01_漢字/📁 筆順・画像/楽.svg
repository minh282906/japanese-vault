<path id="楽-s7"  class="stroke" stroke="#09bf95" d="M16.92,54.38C18.380000000000003,55.25,19.73,54.760000000000005,20.810000000000002,53.88C21.860000000000003,53.03,28.230000000000004,46.32,32.25,42"/>
<path id="楽-s8"  class="stroke" stroke="#0995bf" d="M87.2,17.13C87.22,18.119999999999997,86.96000000000001,18.99,86.44,19.74C84.77,22.47,80.41,26.86,76.75,29"/>
<path id="楽-s9"  class="stroke" stroke="#0941bf" d="M77,40.5C82.12,42.53,89,47.75,91.5,52"/>
<path id="楽-s10"  class="stroke" stroke="#2509bf" d="M17.28,67.66C18.76,67.85,22.720000000000002,68.58,26.64,68.22999999999999C41.870000000000005,66.88,64.87,64.63,82.84,64.03999999999999C86.77000000000001,63.90999999999999,89.45,63.99999999999999,91.95,64.53999999999999"/>
<path id="楽-s11"  class="stroke" stroke="#7909bf" d="M52.45,54.75C53.5,55.75,54.080000000000005,57.41,54.1,58.49C54.190000000000005,63.18,54.1,83.6,53.980000000000004,93.25C53.95,95.65,53.92,97.37,53.89,97.99"/>
<path id="楽-s12"  class="stroke" stroke="#bf09b1" d="M49.25,66.75C49.25,68,48.11,69.49,47.44,70.38C40.9,79.16,28.88,89.01,18,93.75"/>
<path id="楽-s13"  class="stroke" stroke="#bf095d" d="M56.76,67.11C62.25,72,82.25,86,88.79,89.82C90.64,90.89999999999999,92.17,91.42999999999999,94,91.75"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="楽-bg1"  class="badge-group"><circle cx="52.99" cy="11" r="3.5" fill="#bf0909"/><text class="num-single" x="52.99" y="11" dx="0" dy="-0.5">1</text></g>
