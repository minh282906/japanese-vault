<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (件)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #件-bg[i]: Thời gian quả bóng số nảy lên
   - #件-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#件-bg1  { animation-delay: 0.05s; }
#件-s1   { stroke-dasharray: 46.4873; stroke-dashoffset: 46.4873; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#件-bg2  { animation-delay: 0.46s; }
#件-s2   { stroke-dasharray: 57.8151; stroke-dashoffset: 57.8151; animation: drawStroke 0.32s ease-out 0.59s forwards; }
#件-bg3  { animation-delay: 0.93s; }
#件-s3   { stroke-dasharray: 30.7599; stroke-dashoffset: 30.7599; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#件-bg4  { animation-delay: 1.30s; }
#件-s4   { stroke-dasharray: 43.4793; stroke-dashoffset: 43.4793; animation: drawStroke 0.24s ease-out 1.43s forwards; }
#件-bg5  { animation-delay: 1.69s; }
#件-s5   { stroke-dasharray: 61.0688; stroke-dashoffset: 61.0688; animation: drawStroke 0.34s ease-out 1.82s forwards; }
#件-bg6  { animation-delay: 2.18s; }
#件-s6   { stroke-dasharray: 85.3489; stroke-dashoffset: 85.3489; animation: drawStroke 0.47s ease-out 2.31s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #件-s[i]) -->
<path id="件-s1"  class="stroke" stroke="#bf0909" d="M30.76,15.25C31.12,16.63,30.950000000000003,17.73,30.28,19.490000000000002C26,30.67,19.82,42.67,10,56.29"/>
<path id="件-s2"  class="stroke" stroke="#bfbf09" d="M24.03,37.25C24.89,38.11,25.28,39.22,25.28,40.62C25.28,51.809999999999995,25.26,75.05,25.25,87.62C25.25,90.80000000000001,25.25,93.30000000000001,25.25,94.74000000000001"/>
<path id="件-s3"  class="stroke" stroke="#09bf09" d="M51.13,20.62C51.260000000000005,21.46,51.14,22.94,50.81,23.73C47.88,30.740000000000002,43.63,38.370000000000005,36.650000000000006,47.33"/>
<path id="件-s4"  class="stroke" stroke="#09bfbf" d="M47.43,38.11C48.87,38.38,50.19,38.32,51.08,38.24C61.96,37.2,74.25,35.010000000000005,85.08,32.93C86.53,32.65,89,32.38,90.42999999999999,32.8"/>
<path id="件-s5"  class="stroke" stroke="#0909bf" d="M38.09,60.63C40.6,61.440000000000005,43.42,61.32,46,61.03C58.76,59.620000000000005,79.38,56.870000000000005,91.38,56.160000000000004C93.97,56.010000000000005,96.25999999999999,55.800000000000004,98.8,56.290000000000006"/>
<path id="件-s6"  class="stroke" stroke="#bf09bf" d="M67.16,11.88C68.33,13.05,69.03,14.75,69.03,16.580000000000002C69.03,17.340000000000003,69.04,69.54,69.04,89.62C69.04,93.11,69.04,95.63000000000001,69.04,96.74000000000001"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="件-bg1"  class="badge-group"><circle cx="30.76" cy="15.25" r="3.5" fill="#bf0909"/><text class="num-single" x="30.76" y="15.25" dx="0" dy="-0.5">1</text></g>
<g id="件-bg2"  class="badge-group"><circle cx="24.03" cy="37.25" r="3.5" fill="#bfbf09"/><text class="num-single" x="24.03" y="37.25" dx="0" dy="-0.5">2</text></g>
<g id="件-bg3"  class="badge-group"><circle cx="51.13" cy="20.62" r="3.5" fill="#09bf09"/><text class="num-single" x="51.13" y="20.62" dx="0" dy="-0.5">3</text></g>
<g id="件-bg4"  class="badge-group"><circle cx="47.43" cy="38.11" r="3.5" fill="#09bfbf"/><text class="num-single" x="47.43" y="38.11" dx="0" dy="-0.5">4</text></g>
<g id="件-bg5"  class="badge-group"><circle cx="38.09" cy="60.63" r="3.5" fill="#0909bf"/><text class="num-single" x="38.09" y="60.63" dx="0" dy="-0.5">5</text></g>
<g id="件-bg6"  class="badge-group"><circle cx="67.16" cy="11.88" r="3.5" fill="#bf09bf"/><text class="num-single" x="67.16" y="11.88" dx="0" dy="-0.5">6</text></g>
</svg>