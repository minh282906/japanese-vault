<path id="漢-s8"  class="stroke" stroke="#0995bf" d="M44.63,35.3C54.13,34,71.5,31.929999999999996,78.49000000000001,31.179999999999996C81.37,30.869999999999997,83.32000000000001,31.069999999999997,82.36000000000001,34.29C81.39000000000001,37.57,80.53000000000002,41.14,79.15000000000002,45.43"/>
<path id="漢-s9"  class="stroke" stroke="#0941bf" d="M47.7,49.58C52.760000000000005,49.18,67.2,47.61,77.01,46.55C78.44000000000001,46.4,79.78,46.25,80.97,46.12"/>
<path id="漢-s10"  class="stroke" stroke="#2509bf" d="M43.84,59.47C45.230000000000004,59.92,47.78,60.05,49.17,59.92C55.21,59.370000000000005,70.19,57.75,77.11,57.230000000000004C79.42,57.06,80.82,57.440000000000005,81.98,57.67"/>
<path id="漢-s11"  class="stroke" stroke="#7909bf" d="M37.34,72.25C38.96,72.62,41.92,72.7,43.540000000000006,72.62C51.550000000000004,72.24000000000001,71.25,69.63000000000001,84.79,69.13000000000001C87.48,69.03000000000002,89.10000000000001,69.31000000000002,90.45,69.49000000000001"/>
<path id="漢-s12"  class="stroke" stroke="#bf09b1" d="M61.6,34.8C62.08,35.75,62.51,37.14,62.51,38.98C62.51,83,55.12,87.25,34.739999999999995,96.5"/>
<path id="漢-s13"  class="stroke" stroke="#bf095d" d="M61,72C69,77.75,79.25,87.12,86.74,91.39C89.16,92.77,91,93.63,92.63,94.13"/>

<!-- ============================================================
     BẢNG 13 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="漢-bg1"  class="badge-group"><circle cx="20" cy="19.5" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="19.5" dx="0" dy="-0.5">1</text></g>
