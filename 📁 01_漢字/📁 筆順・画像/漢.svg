<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (漢)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #漢-bg[i]: Thời gian quả bóng số nảy lên
   - #漢-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#漢-bg1  { animation-delay: 0.05s; }
#漢-s1   { stroke-dasharray: 13.3956; stroke-dashoffset: 13.3956; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#漢-bg2  { animation-delay: 0.42s; }
#漢-s2   { stroke-dasharray: 14.6777; stroke-dashoffset: 14.6777; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#漢-bg3  { animation-delay: 0.79s; }
#漢-s3   { stroke-dasharray: 22.4110; stroke-dashoffset: 22.4110; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#漢-bg4  { animation-delay: 1.16s; }
#漢-s4   { stroke-dasharray: 54.6412; stroke-dashoffset: 54.6412; animation: drawStroke 0.30s ease-out 1.29s forwards; }
#漢-bg5  { animation-delay: 1.61s; }
#漢-s5   { stroke-dasharray: 16.5327; stroke-dashoffset: 16.5327; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#漢-bg6  { animation-delay: 1.98s; }
#漢-s6   { stroke-dasharray: 17.4995; stroke-dashoffset: 17.4995; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#漢-bg7  { animation-delay: 2.35s; }
#漢-s7   { stroke-dasharray: 18.1410; stroke-dashoffset: 18.1410; animation: drawStroke 0.22s ease-out 2.48s forwards; }
#漢-bg8  { animation-delay: 2.72s; }
#漢-s8   { stroke-dasharray: 52.3060; stroke-dashoffset: 52.3060; animation: drawStroke 0.29s ease-out 2.85s forwards; }
#漢-bg9  { animation-delay: 3.16s; }
#漢-s9   { stroke-dasharray: 33.4500; stroke-dashoffset: 33.4500; animation: drawStroke 0.22s ease-out 3.29s forwards; }
#漢-bg10  { animation-delay: 3.53s; }
#漢-s10   { stroke-dasharray: 38.3549; stroke-dashoffset: 38.3549; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#漢-bg11  { animation-delay: 3.90s; }
#漢-s11   { stroke-dasharray: 53.3087; stroke-dashoffset: 53.3087; animation: drawStroke 0.29s ease-out 4.03s forwards; }
#漢-bg12  { animation-delay: 4.34s; }
#漢-s12   { stroke-dasharray: 74.1479; stroke-dashoffset: 74.1479; animation: drawStroke 0.41s ease-out 4.47s forwards; }
#漢-bg13  { animation-delay: 4.90s; }
#漢-s13   { stroke-dasharray: 38.7580; stroke-dashoffset: 38.7580; animation: drawStroke 0.22s ease-out 5.03s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

