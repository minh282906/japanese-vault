<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (常)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #常-bg[i]: Thời gian quả bóng số nảy lên
   - #常-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#常-bg1  { animation-delay: 0.05s; }
#常-s1   { stroke-dasharray: 20.1272; stroke-dashoffset: 20.1272; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#常-bg2  { animation-delay: 0.42s; }
#常-s2   { stroke-dasharray: 13.6452; stroke-dashoffset: 13.6452; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#常-bg3  { animation-delay: 0.79s; }
#常-s3   { stroke-dasharray: 15.3886; stroke-dashoffset: 15.3886; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#常-bg4  { animation-delay: 1.16s; }
#常-s4   { stroke-dasharray: 17.2933; stroke-dashoffset: 17.2933; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#常-bg5  { animation-delay: 1.53s; }
#常-s5   { stroke-dasharray: 77.9326; stroke-dashoffset: 77.9326; animation: drawStroke 0.43s ease-out 1.66s forwards; }
#常-bg6  { animation-delay: 2.11s; }
#常-s6   { stroke-dasharray: 18.1521; stroke-dashoffset: 18.1521; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#常-bg7  { animation-delay: 2.48s; }
#常-s7   { stroke-dasharray: 46.8623; stroke-dashoffset: 46.8623; animation: drawStroke 0.26s ease-out 2.61s forwards; }
#常-bg8  { animation-delay: 2.89s; }
#常-s8   { stroke-dasharray: 27.4527; stroke-dashoffset: 27.4527; animation: drawStroke 0.22s ease-out 3.02s forwards; }
#常-bg9  { animation-delay: 3.26s; }
#常-s9   { stroke-dasharray: 24.4262; stroke-dashoffset: 24.4262; animation: drawStroke 0.22s ease-out 3.39s forwards; }
#常-bg10  { animation-delay: 3.63s; }
#常-s10   { stroke-dasharray: 78.1131; stroke-dashoffset: 78.1131; animation: drawStroke 0.43s ease-out 3.76s forwards; }
#常-bg11  { animation-delay: 4.21s; }
#常-s11   { stroke-dasharray: 44.2644; stroke-dashoffset: 44.2644; animation: drawStroke 0.24s ease-out 4.34s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

