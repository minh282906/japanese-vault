<path id="常-s7"  class="stroke" stroke="#098dbf" d="M38.1,42.57C42.730000000000004,42.1,60.32,39.83,66.9,39.04C69.97,38.67,71.02000000000001,39.46,69.99000000000001,42.54C68.98,45.55,67.27000000000001,50.55,66.12,53.31"/>
<path id="常-s8"  class="stroke" stroke="#092abf" d="M40.94,55.96C46.129999999999995,55.39,55.989999999999995,54.49,63.239999999999995,53.95C65.14999999999999,53.81,66.86999999999999,53.690000000000005,68.28999999999999,53.61"/>
<path id="常-s9"  class="stroke" stroke="#4b09bf" d="M29.06,68.13C30.029999999999998,69.1,30.619999999999997,70.63,30.939999999999998,72.49C31.04,73.07,31.229999999999997,81.24,31.259999999999998,87.25C31.27,89.2,31.259999999999998,90.92,31.229999999999997,92.09"/>
<path id="常-s10"  class="stroke" stroke="#ae09bf" d="M31.27,70.28C36.75,69.75,68,66.25,75.54,65.7C78.9,65.45,79.42,68.63000000000001,79.51,70.28C79.76,74.75,79.51,83.25,78.57000000000001,87.01C77.11000000000001,92.85000000000001,73.53,87.82000000000001,71.91000000000001,85.80000000000001"/>
<path id="常-s11"  class="stroke" stroke="#bf096c" d="M53,57.02C53.93,57.95,54.31,59.75,54.31,61.59C54.31,67.32000000000001,54.2,80.88,54.2,94.75C54.2,97.8,54.160000000000004,100.08,54.13,100.99"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="常-bg1"  class="badge-group"><circle cx="52.96" cy="8.12" r="3.5" fill="#bf0909"/><text class="num-single" x="52.96" y="8.12" dx="0" dy="-0.5">1</text></g>
