<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (路)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #路-bg[i]: Thời gian quả bóng số nảy lên
   - #路-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#路-bg1  { animation-delay: 0.05s; }
#路-s1   { stroke-dasharray: 22.0350; stroke-dashoffset: 22.0350; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#路-bg2  { animation-delay: 0.42s; }
#路-s2   { stroke-dasharray: 41.7262; stroke-dashoffset: 41.7262; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#路-bg3  { animation-delay: 0.80s; }
#路-s3   { stroke-dasharray: 19.8837; stroke-dashoffset: 19.8837; animation: drawStroke 0.22s ease-out 0.93s forwards; }
#路-bg4  { animation-delay: 1.17s; }
#路-s4   { stroke-dasharray: 37.2210; stroke-dashoffset: 37.2210; animation: drawStroke 0.22s ease-out 1.30s forwards; }
#路-bg5  { animation-delay: 1.54s; }
#路-s5   { stroke-dasharray: 13.7389; stroke-dashoffset: 13.7389; animation: drawStroke 0.22s ease-out 1.67s forwards; }
#路-bg6  { animation-delay: 1.91s; }
#路-s6   { stroke-dasharray: 26.3800; stroke-dashoffset: 26.3800; animation: drawStroke 0.22s ease-out 2.04s forwards; }
#路-bg7  { animation-delay: 2.28s; }
#路-s7   { stroke-dasharray: 30.3923; stroke-dashoffset: 30.3923; animation: drawStroke 0.22s ease-out 2.41s forwards; }
#路-bg8  { animation-delay: 2.65s; }
#路-s8   { stroke-dasharray: 33.4303; stroke-dashoffset: 33.4303; animation: drawStroke 0.22s ease-out 2.78s forwards; }
#路-bg9  { animation-delay: 3.02s; }
#路-s9   { stroke-dasharray: 79.1529; stroke-dashoffset: 79.1529; animation: drawStroke 0.44s ease-out 3.15s forwards; }
#路-bg10  { animation-delay: 3.61s; }
#路-s10   { stroke-dasharray: 52.9626; stroke-dashoffset: 52.9626; animation: drawStroke 0.29s ease-out 3.74s forwards; }
#路-bg11  { animation-delay: 4.05s; }
#路-s11   { stroke-dasharray: 25.1641; stroke-dashoffset: 25.1641; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#路-bg12  { animation-delay: 4.42s; }
#路-s12   { stroke-dasharray: 51.5933; stroke-dashoffset: 51.5933; animation: drawStroke 0.28s ease-out 4.55s forwards; }
#路-bg13  { animation-delay: 4.85s; }
#路-s13   { stroke-dasharray: 26.2113; stroke-dashoffset: 26.2113; animation: drawStroke 0.22s ease-out 4.98s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

