<path id="路-s10"  class="stroke" stroke="#2509bf" d="M52.93,32.27C56.64,33.650000000000006,78.21000000000001,52.95,87.22999999999999,59.690000000000005C89.66999999999999,61.510000000000005,92.21999999999998,63.03,95.24999999999999,63.63"/>
<path id="路-s11"  class="stroke" stroke="#7909bf" d="M48.98,70.17C49.69,70.85000000000001,50.059999999999995,71.68,50.25,72.63C51.38,78.02,52.86,85,53.72,91.02C53.9,92.25999999999999,54.06,93.46,54.199999999999996,94.61999999999999"/>
<path id="路-s12"  class="stroke" stroke="#bf09b1" d="M50.85,71.29C58.99,70.24000000000001,72.38,68.77000000000001,78.14,68.09C81.39,67.71000000000001,82.93,68.95,82.32,72.24000000000001C81.47,76.86000000000001,80.63,82.72000000000001,79.35,88.71000000000001"/>
