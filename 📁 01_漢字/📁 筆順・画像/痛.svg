<path id="痛-s7"  class="stroke" stroke="#09bfbf" d="M56.62,42C59.08,43.01,65.42999999999999,46.89,66.59,49.519999999999996"/>
<path id="痛-s8"  class="stroke" stroke="#0964bf" d="M43.69,53.34C44.489999999999995,54.14,44.809999999999995,55.370000000000005,44.809999999999995,56.71C44.809999999999995,58.92,44.769999999999996,79.74000000000001,44.74999999999999,91C44.74999999999999,93.91,44.739999999999995,96.18,44.739999999999995,97.33"/>
<path id="痛-s9"  class="stroke" stroke="#0909bf" d="M45.69,54.58C51.25,54.1,74,50.92,80.53999999999999,50.07C83.82,49.64,85.83999999999999,50.88,85.83999999999999,54.01C85.83999999999999,59.309999999999995,85.63999999999999,80.66,85.63999999999999,90.71000000000001C85.63999999999999,101.25,79.77999999999999,92.2,78.58999999999999,91.78"/>
<path id="痛-s10"  class="stroke" stroke="#6409bf" d="M45.69,66.9C55.37,65.75,73.87,63.370000000000005,84.89,62.940000000000005"/>
<path id="痛-s11"  class="stroke" stroke="#bf09bf" d="M45.67,80.22C51.67,79.51,75.25,76.63,84.66,76.31"/>
<path id="痛-s12"  class="stroke" stroke="#bf0964" d="M63.11,55.17C64.03,56.09,64.2,57.370000000000005,64.2,58.61C64.2,64.06,64.09,77.82,64.06,90C64.05,92.1,64.05,94.07,64.05,95.85"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="痛-bg1"  class="badge-group"><circle cx="55.06" cy="11.38" r="3.5" fill="#bf0909"/><text class="num-single" x="55.06" y="11.38" dx="0" dy="-0.5">1</text></g>
