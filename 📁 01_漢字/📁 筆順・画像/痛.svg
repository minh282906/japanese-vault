<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (痛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #痛-bg[i]: Thời gian quả bóng số nảy lên
   - #痛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#痛-bg1  { animation-delay: 0.05s; }
#痛-s1   { stroke-dasharray: 11.6641; stroke-dashoffset: 11.6641; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#痛-bg2  { animation-delay: 0.42s; }
#痛-s2   { stroke-dasharray: 65.3029; stroke-dashoffset: 65.3029; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#痛-bg3  { animation-delay: 0.93s; }
#痛-s3   { stroke-dasharray: 69.7657; stroke-dashoffset: 69.7657; animation: drawStroke 0.38s ease-out 1.06s forwards; }
#痛-bg4  { animation-delay: 1.46s; }
#痛-s4   { stroke-dasharray: 13.8417; stroke-dashoffset: 13.8417; animation: drawStroke 0.22s ease-out 1.59s forwards; }
#痛-bg5  { animation-delay: 1.83s; }
#痛-s5   { stroke-dasharray: 18.0695; stroke-dashoffset: 18.0695; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#痛-bg6  { animation-delay: 2.20s; }
#痛-s6   { stroke-dasharray: 57.5230; stroke-dashoffset: 57.5230; animation: drawStroke 0.32s ease-out 2.33s forwards; }
#痛-bg7  { animation-delay: 2.67s; }
#痛-s7   { stroke-dasharray: 12.6543; stroke-dashoffset: 12.6543; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#痛-bg8  { animation-delay: 3.04s; }
#痛-s8   { stroke-dasharray: 44.2633; stroke-dashoffset: 44.2633; animation: drawStroke 0.24s ease-out 3.17s forwards; }
#痛-bg9  { animation-delay: 3.43s; }
#痛-s9   { stroke-dasharray: 92.1744; stroke-dashoffset: 92.1744; animation: drawStroke 0.51s ease-out 3.56s forwards; }
#痛-bg10  { animation-delay: 4.09s; }
#痛-s10   { stroke-dasharray: 39.4084; stroke-dashoffset: 39.4084; animation: drawStroke 0.22s ease-out 4.22s forwards; }
#痛-bg11  { animation-delay: 4.46s; }
#痛-s11   { stroke-dasharray: 39.1930; stroke-dashoffset: 39.1930; animation: drawStroke 0.22s ease-out 4.59s forwards; }
#痛-bg12  { animation-delay: 4.83s; }
#痛-s12   { stroke-dasharray: 40.9491; stroke-dashoffset: 40.9491; animation: drawStroke 0.23s ease-out 4.96s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #痛-s[i]) -->
<path id="痛-s1"  class="stroke" stroke="#bf0909" d="M55.06,11.38C56.03,12.350000000000001,56.32,13.870000000000001,56.32,15.280000000000001C56.32,16.07,56.25,19.87,56.25,22.740000000000002"/>
