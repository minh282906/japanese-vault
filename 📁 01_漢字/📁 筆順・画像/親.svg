<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (親)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #親-bg[i]: Thời gian quả bóng số nảy lên
   - #親-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#親-bg1  { animation-delay: 0.05s; }
#親-s1   { stroke-dasharray: 12.8744; stroke-dashoffset: 12.8744; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#親-bg2  { animation-delay: 0.42s; }
#親-s2   { stroke-dasharray: 30.1029; stroke-dashoffset: 30.1029; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#親-bg3  { animation-delay: 0.79s; }
#親-s3   { stroke-dasharray: 11.9299; stroke-dashoffset: 11.9299; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#親-bg4  { animation-delay: 1.16s; }
#親-s4   { stroke-dasharray: 12.5854; stroke-dashoffset: 12.5854; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#親-bg5  { animation-delay: 1.53s; }
#親-s5   { stroke-dasharray: 38.4673; stroke-dashoffset: 38.4673; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#親-bg6  { animation-delay: 1.90s; }
#親-s6   { stroke-dasharray: 35.1881; stroke-dashoffset: 35.1881; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#親-bg7  { animation-delay: 2.27s; }
#親-s7   { stroke-dasharray: 46.8953; stroke-dashoffset: 46.8953; animation: drawStroke 0.26s ease-out 2.40s forwards; }
#親-bg8  { animation-delay: 2.68s; }
#親-s8   { stroke-dasharray: 32.8735; stroke-dashoffset: 32.8735; animation: drawStroke 0.22s ease-out 2.81s forwards; }
#親-bg9  { animation-delay: 3.05s; }
#親-s9   { stroke-dasharray: 11.8862; stroke-dashoffset: 11.8862; animation: drawStroke 0.22s ease-out 3.18s forwards; }
#親-bg10  { animation-delay: 3.42s; }
#親-s10   { stroke-dasharray: 45.6388; stroke-dashoffset: 45.6388; animation: drawStroke 0.25s ease-out 3.55s forwards; }
#親-bg11  { animation-delay: 3.82s; }
#親-s11   { stroke-dasharray: 72.4480; stroke-dashoffset: 72.4480; animation: drawStroke 0.40s ease-out 3.95s forwards; }
#親-bg12  { animation-delay: 4.37s; }
#親-s12   { stroke-dasharray: 25.3557; stroke-dashoffset: 25.3557; animation: drawStroke 0.22s ease-out 4.50s forwards; }
#親-bg13  { animation-delay: 4.74s; }
#親-s13   { stroke-dasharray: 24.7684; stroke-dashoffset: 24.7684; animation: drawStroke 0.22s ease-out 4.87s forwards; }
#親-bg14  { animation-delay: 5.11s; }
#親-s14   { stroke-dasharray: 24.7217; stroke-dashoffset: 24.7217; animation: drawStroke 0.22s ease-out 5.24s forwards; }
#親-bg15  { animation-delay: 5.48s; }
#親-s15   { stroke-dasharray: 38.7343; stroke-dashoffset: 38.7343; animation: drawStroke 0.22s ease-out 5.61s forwards; }
#親-bg16  { animation-delay: 5.85s; }
#親-s16   { stroke-dasharray: 57.3679; stroke-dashoffset: 57.3679; animation: drawStroke 0.32s ease-out 5.98s forwards; }
]]>
</style>

