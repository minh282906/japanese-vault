<path id="違-s8"  class="stroke" stroke="#0995bf" d="M49.74,61.3C50.120000000000005,62.12,50.25,62.75,50.25,63.75C50.25,67.21,50.37,71.13,50.48,72.77"/>
<path id="違-s9"  class="stroke" stroke="#0941bf" d="M40.23,74.01C42.68,74.62,45.39,74.24000000000001,47.87,74.08C57.42,73.44,74.28,72.07,85.75,71.53C88.43,71.4,91.08,71.23,93.75,71.63"/>
<path id="違-s10"  class="stroke" stroke="#2509bf" d="M67.75,51.96C68.64,52.86,68.99,54.120000000000005,68.99,55.64C68.99,56.25,69,70.61,68.91,80C68.88,83.53,68.86999999999999,85.12,68.86999999999999,86.5"/>
<path id="違-s11"  class="stroke" stroke="#7909bf" d="M20.96,19.25C24.59,20.99,30.340000000000003,26.42,31.25,29.130000000000003"/>
