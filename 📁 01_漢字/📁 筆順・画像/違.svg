<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (違)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #違-bg[i]: Thời gian quả bóng số nảy lên
   - #違-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#違-bg1  { animation-delay: 0.05s; }
#違-s1   { stroke-dasharray: 21.0864; stroke-dashoffset: 21.0864; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#違-bg2  { animation-delay: 0.42s; }
#違-s2   { stroke-dasharray: 41.4222; stroke-dashoffset: 41.4222; animation: drawStroke 0.23s ease-out 0.55s forwards; }
#違-bg3  { animation-delay: 0.80s; }
#違-s3   { stroke-dasharray: 50.2899; stroke-dashoffset: 50.2899; animation: drawStroke 0.28s ease-out 0.93s forwards; }
#違-bg4  { animation-delay: 1.23s; }
#違-s4   { stroke-dasharray: 13.6452; stroke-dashoffset: 13.6452; animation: drawStroke 0.22s ease-out 1.36s forwards; }
#違-bg5  { animation-delay: 1.60s; }
#違-s5   { stroke-dasharray: 39.3458; stroke-dashoffset: 39.3458; animation: drawStroke 0.22s ease-out 1.73s forwards; }
#違-bg6  { animation-delay: 1.97s; }
#違-s6   { stroke-dasharray: 26.1403; stroke-dashoffset: 26.1403; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#違-bg7  { animation-delay: 2.34s; }
#違-s7   { stroke-dasharray: 39.2137; stroke-dashoffset: 39.2137; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#違-bg8  { animation-delay: 2.71s; }
#違-s8   { stroke-dasharray: 11.5504; stroke-dashoffset: 11.5504; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#違-bg9  { animation-delay: 3.08s; }
#違-s9   { stroke-dasharray: 53.6560; stroke-dashoffset: 53.6560; animation: drawStroke 0.30s ease-out 3.21s forwards; }
#違-bg10  { animation-delay: 3.53s; }
#違-s10   { stroke-dasharray: 34.8476; stroke-dashoffset: 34.8476; animation: drawStroke 0.22s ease-out 3.66s forwards; }
#違-bg11  { animation-delay: 3.90s; }
#違-s11   { stroke-dasharray: 14.4726; stroke-dashoffset: 14.4726; animation: drawStroke 0.22s ease-out 4.03s forwards; }
#違-bg12  { animation-delay: 4.27s; }
#違-s12   { stroke-dasharray: 63.1970; stroke-dashoffset: 63.1970; animation: drawStroke 0.35s ease-out 4.40s forwards; }
#違-bg13  { animation-delay: 4.77s; }
#違-s13   { stroke-dasharray: 76.2993; stroke-dashoffset: 76.2993; animation: drawStroke 0.42s ease-out 4.90s forwards; }
]]>
</style>

