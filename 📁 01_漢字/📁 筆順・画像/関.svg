<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (関)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #関-bg[i]: Thời gian quả bóng số nảy lên
   - #関-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#関-bg1  { animation-delay: 0.05s; }
#関-s1   { stroke-dasharray: 80.7056; stroke-dashoffset: 80.7056; animation: drawStroke 0.44s ease-out 0.18s forwards; }
#関-bg2  { animation-delay: 0.64s; }
#関-s2   { stroke-dasharray: 48.7776; stroke-dashoffset: 48.7776; animation: drawStroke 0.27s ease-out 0.77s forwards; }
#関-bg3  { animation-delay: 1.06s; }
#関-s3   { stroke-dasharray: 22.5510; stroke-dashoffset: 22.5510; animation: drawStroke 0.22s ease-out 1.19s forwards; }
#関-bg4  { animation-delay: 1.43s; }
#関-s4   { stroke-dasharray: 21.9642; stroke-dashoffset: 21.9642; animation: drawStroke 0.22s ease-out 1.56s forwards; }
#関-bg5  { animation-delay: 1.80s; }
#関-s5   { stroke-dasharray: 25.7139; stroke-dashoffset: 25.7139; animation: drawStroke 0.22s ease-out 1.93s forwards; }
#関-bg6  { animation-delay: 2.17s; }
#関-s6   { stroke-dasharray: 119.7860; stroke-dashoffset: 119.7860; animation: drawStroke 0.55s ease-out 2.30s forwards; }
#関-bg7  { animation-delay: 2.87s; }
#関-s7   { stroke-dasharray: 22.9901; stroke-dashoffset: 22.9901; animation: drawStroke 0.22s ease-out 3.00s forwards; }
#関-bg8  { animation-delay: 3.24s; }
#関-s8   { stroke-dasharray: 23.1494; stroke-dashoffset: 23.1494; animation: drawStroke 0.22s ease-out 3.37s forwards; }
#関-bg9  { animation-delay: 3.61s; }
#関-s9   { stroke-dasharray: 9.0424; stroke-dashoffset: 9.0424; animation: drawStroke 0.22s ease-out 3.74s forwards; }
#関-bg10  { animation-delay: 3.98s; }
#関-s10   { stroke-dasharray: 11.9453; stroke-dashoffset: 11.9453; animation: drawStroke 0.22s ease-out 4.11s forwards; }
#関-bg11  { animation-delay: 4.35s; }
#関-s11   { stroke-dasharray: 32.3646; stroke-dashoffset: 32.3646; animation: drawStroke 0.22s ease-out 4.48s forwards; }
#関-bg12  { animation-delay: 4.72s; }
#関-s12   { stroke-dasharray: 41.1851; stroke-dashoffset: 41.1851; animation: drawStroke 0.23s ease-out 4.85s forwards; }
#関-bg13  { animation-delay: 5.10s; }
#関-s13   { stroke-dasharray: 41.7683; stroke-dashoffset: 41.7683; animation: drawStroke 0.23s ease-out 5.23s forwards; }
#関-bg14  { animation-delay: 5.48s; }
#関-s14   { stroke-dasharray: 27.5044; stroke-dashoffset: 27.5044; animation: drawStroke 0.22s ease-out 5.61s forwards; }
]]>
</style>

