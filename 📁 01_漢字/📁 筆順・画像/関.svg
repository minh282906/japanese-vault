<path id="関-s11"  class="stroke" stroke="#3d09bf" d="M37.1,57.11C38.690000000000005,57.72,40.620000000000005,57.35,42.25,57.17C48.09,56.52,59.29,54.910000000000004,64.77,54.42C66.3,54.28,67.72,54.22,69.22,54.57"/>
