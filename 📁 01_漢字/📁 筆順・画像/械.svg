<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (械)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #械-bg[i]: Thời gian quả bóng số nảy lên
   - #械-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#械-bg1  { animation-delay: 0.05s; }
#械-s1   { stroke-dasharray: 29.4947; stroke-dashoffset: 29.4947; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#械-bg2  { animation-delay: 0.42s; }
#械-s2   { stroke-dasharray: 77.1461; stroke-dashoffset: 77.1461; animation: drawStroke 0.42s ease-out 0.55s forwards; }
#械-bg3  { animation-delay: 0.99s; }
#械-s3   { stroke-dasharray: 37.4248; stroke-dashoffset: 37.4248; animation: drawStroke 0.22s ease-out 1.12s forwards; }
#械-bg4  { animation-delay: 1.36s; }
#械-s4   { stroke-dasharray: 12.2192; stroke-dashoffset: 12.2192; animation: drawStroke 0.22s ease-out 1.49s forwards; }
#械-bg5  { animation-delay: 1.73s; }
#械-s5   { stroke-dasharray: 47.6050; stroke-dashoffset: 47.6050; animation: drawStroke 0.26s ease-out 1.86s forwards; }
#械-bg6  { animation-delay: 2.14s; }
#械-s6   { stroke-dasharray: 28.3160; stroke-dashoffset: 28.3160; animation: drawStroke 0.22s ease-out 2.27s forwards; }
#械-bg7  { animation-delay: 2.51s; }
#械-s7   { stroke-dasharray: 36.5731; stroke-dashoffset: 36.5731; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#械-bg8  { animation-delay: 2.88s; }
#械-s8   { stroke-dasharray: 34.4194; stroke-dashoffset: 34.4194; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#械-bg9  { animation-delay: 3.25s; }
#械-s9   { stroke-dasharray: 95.7838; stroke-dashoffset: 95.7838; animation: drawStroke 0.53s ease-out 3.38s forwards; }
#械-bg10  { animation-delay: 3.93s; }
#械-s10   { stroke-dasharray: 48.8532; stroke-dashoffset: 48.8532; animation: drawStroke 0.27s ease-out 4.06s forwards; }
#械-bg11  { animation-delay: 4.35s; }
#械-s11   { stroke-dasharray: 13.6358; stroke-dashoffset: 13.6358; animation: drawStroke 0.22s ease-out 4.48s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #械-s[i]) -->
<path id="械-s1"  class="stroke" stroke="#bf0909" d="M14.03,39.98C15.629999999999999,40.37,18.169999999999998,40.25,19.4,40.099999999999994C24.779999999999998,39.449999999999996,32.9,37.16,38.64,36.029999999999994C40.13,35.739999999999995,41.76,35.37,43.02,35.48"/>
<path id="械-s2"  class="stroke" stroke="#bf6c09" d="M27.84,17.5C29.04,18.7,29.43,20.38,29.43,22.22C29.43,23,29.57,70.03999999999999,29.61,88C29.62,91.03,29.62,93.24,29.62,94.25"/>
<path id="械-s3"  class="stroke" stroke="#aebf09" d="M28.71,40.59C28.71,41.75,28.43,43.63,28.14,44.510000000000005C24.4,56.11000000000001,18.759999999999998,65.86000000000001,12.370000000000001,73.80000000000001"/>
<path id="械-s4"  class="stroke" stroke="#4bbf09" d="M31.75,48.12C33.88,49.41,39.15,53.589999999999996,40.95,56.089999999999996"/>
<path id="械-s5"  class="stroke" stroke="#09bf2a" d="M42.32,41.88C44.88,42.5,47.12,42.43,49.38,41.93C58.620000000000005,39.88,72.62,36.88,82.49000000000001,35.22C84.62,34.86,87.03000000000002,34.64,89.13000000000001,35.23"/>
<path id="械-s6"  class="stroke" stroke="#09bf8d" d="M40.45,63.6C42,64,43.78,63.95,45.120000000000005,63.7C51.620000000000005,62.49,57.06,61.220000000000006,63.14,60.120000000000005C65.25,59.74,66.5,59.61000000000001,68.34,59.95"/>
<path id="械-s7"  class="stroke" stroke="#098dbf" d="M48.62,51.64C49.489999999999995,52.51,49.98,53.95,50.019999999999996,55.43C50.379999999999995,67.25,49.99999999999999,77.75,43.05,86.35"/>
<path id="械-s8"  class="stroke" stroke="#092abf" d="M60,48.24C60.5,49.25,60.98,50.5,60.98,51.59C60.98,52.06,60.98,69.15,60.93,77.87C60.92,80.08,60.9,81.76,60.88,82.49000000000001"/>
<path id="械-s9"  class="stroke" stroke="#4b09bf" d="M66.17,13.96C67.36,15.670000000000002,67.84,16.14,68.10000000000001,19.830000000000002C70.25000000000001,49.63,77.87,80.13,92.55000000000001,91.28C97.26,94.86,96.57000000000001,92.01,95.97000000000001,84.43"/>
<path id="械-s10"  class="stroke" stroke="#ae09bf" d="M86.59,46.51C86.88000000000001,47.25,86.75,49.07,86.47,50.489999999999995C84.5,60.24999999999999,78,76.75,64.47,88.74"/>
<path id="械-s11"  class="stroke" stroke="#bf096c" d="M78.5,16.5C81.64,18.39,86.67,22.7,88.14,25.939999999999998"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="械-bg1"  class="badge-group"><circle cx="14.03" cy="39.98" r="3.5" fill="#bf0909"/><text class="num-single" x="14.03" y="39.98" dx="0" dy="-0.5">1</text></g>
<g id="械-bg2"  class="badge-group"><circle cx="27.84" cy="17.5" r="3.5" fill="#bf6c09"/><text class="num-single" x="27.84" y="17.5" dx="0" dy="-0.5">2</text></g>
