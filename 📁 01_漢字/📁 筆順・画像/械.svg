<g id="械-bg8"  class="badge-group"><circle cx="60" cy="48.24" r="3.5" fill="#092abf"/><text class="num-single" x="60" y="48.24" dx="0" dy="-0.5">8</text></g>
<g id="械-bg9"  class="badge-group"><circle cx="66.17" cy="13.96" r="3.5" fill="#4b09bf"/><text class="num-single" x="66.17" y="13.96" dx="0" dy="-0.5">9</text></g>
<g id="械-bg10" class="badge-group"><circle cx="86.59" cy="46.51" r="3.5" fill="#ae09bf"/><text class="num-double" x="86.59" y="46.51" dx="-0.4" dy="-0.475">10</text></g>
