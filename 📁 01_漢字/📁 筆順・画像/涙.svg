<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (涙)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #涙-bg[i]: Thời gian quả bóng số nảy lên
   - #涙-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#涙-bg1  { animation-delay: 0.05s; }
#涙-s1   { stroke-dasharray: 14.4049; stroke-dashoffset: 14.4049; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#涙-bg2  { animation-delay: 0.42s; }
#涙-s2   { stroke-dasharray: 16.8230; stroke-dashoffset: 16.8230; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#涙-bg3  { animation-delay: 0.79s; }
#涙-s3   { stroke-dasharray: 23.2430; stroke-dashoffset: 23.2430; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#涙-bg4  { animation-delay: 1.16s; }
#涙-s4   { stroke-dasharray: 47.8411; stroke-dashoffset: 47.8411; animation: drawStroke 0.26s ease-out 1.29s forwards; }
#涙-bg5  { animation-delay: 1.57s; }
#涙-s5   { stroke-dasharray: 57.0785; stroke-dashoffset: 57.0785; animation: drawStroke 0.31s ease-out 1.70s forwards; }
#涙-bg6  { animation-delay: 2.03s; }
#涙-s6   { stroke-dasharray: 39.6415; stroke-dashoffset: 39.6415; animation: drawStroke 0.22s ease-out 2.16s forwards; }
#涙-bg7  { animation-delay: 2.40s; }
#涙-s7   { stroke-dasharray: 62.1420; stroke-dashoffset: 62.1420; animation: drawStroke 0.34s ease-out 2.53s forwards; }
#涙-bg8  { animation-delay: 2.89s; }
#涙-s8   { stroke-dasharray: 42.2856; stroke-dashoffset: 42.2856; animation: drawStroke 0.23s ease-out 3.02s forwards; }
#涙-bg9  { animation-delay: 3.27s; }
#涙-s9   { stroke-dasharray: 57.4018; stroke-dashoffset: 57.4018; animation: drawStroke 0.32s ease-out 3.40s forwards; }
#涙-bg10  { animation-delay: 3.74s; }
#涙-s10   { stroke-dasharray: 41.0872; stroke-dashoffset: 41.0872; animation: drawStroke 0.23s ease-out 3.87s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #涙-s[i]) -->
<path id="涙-s1"  class="stroke" stroke="#bf0909" d="M18.63,14.75C22.549999999999997,16.31,28.759999999999998,21.16,29.75,23.59"/>
<path id="涙-s2"  class="stroke" stroke="#bf7609" d="M10.25,37.5C15.54,38.78,23.93,42.76,25.25,44.75"/>
<path id="涙-s3"  class="stroke" stroke="#9abf09" d="M11.6,90.11C13.03,90.7,14.25,90.23,15.11,88.99C18.25,84.41999999999999,21.65,78.08,24.5,72.25"/>
<path id="涙-s4"  class="stroke" stroke="#2dbf09" d="M39.43,18.49C42,18.88,45.24,18.77,47.629999999999995,18.52C57.059999999999995,17.52,67.89999999999999,16.37,78.64999999999999,15.1C81.47999999999999,14.77,84.19,14.74,87.02,15.35"/>
<path id="涙-s5"  class="stroke" stroke="#09bf52" d="M41.2,30.85C43.59,31.740000000000002,45.900000000000006,31.650000000000002,48.35,31.34C58.33,30.06,73.03,28.16,80.15,27.36C83.77000000000001,26.95,85.54,28.33,84.64,32.16C83.58,36.65,83.17,38.61,82.34,41.3"/>
<path id="涙-s6"  class="stroke" stroke="#09bfbf" d="M45.36,45.18C46.38,45.18,67.53999999999999,43.09,79.75999999999999,42.35C81.77999999999999,42.230000000000004,83.52999999999999,42.160000000000004,84.88,42.160000000000004"/>
<path id="涙-s7"  class="stroke" stroke="#0952bf" d="M43.69,32C44.54,32.85,44.86,34.24,44.79,36.19C43.88,61.5,38.88,77.62,27.72,90"/>
<path id="涙-s8"  class="stroke" stroke="#2d09bf" d="M47.84,62.79C50.25,63.25,52.46,63.199999999999996,54.5,62.97C63.83,61.89,74.4,60.29,83.01,59.75C85.47,59.59,87.46000000000001,59.87,89.86,60.37"/>
<path id="涙-s9"  class="stroke" stroke="#9a09bf" d="M66.22,49.21C66.66,49.84,66.88,50.57,66.87,51.93C66.66000000000001,75.53,56.67,87.49000000000001,39.400000000000006,94.74000000000001"/>
<path id="涙-s10"  class="stroke" stroke="#bf0976" d="M67.35,62.56C73.38,71,79.62,80.75,87.67,88.59C89.61,90.48,91.63,92.14,94.03,93.42"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="涙-bg1"  class="badge-group"><circle cx="18.63" cy="14.75" r="3.5" fill="#bf0909"/><text class="num-single" x="18.63" y="14.75" dx="0" dy="-0.5">1</text></g>
<g id="涙-bg2"  class="badge-group"><circle cx="10.25" cy="37.5" r="3.5" fill="#bf7609"/><text class="num-single" x="10.25" y="37.5" dx="0" dy="-0.5">2</text></g>
<g id="涙-bg3"  class="badge-group"><circle cx="11.6" cy="90.11" r="3.5" fill="#9abf09"/><text class="num-single" x="11.6" y="90.11" dx="0" dy="-0.5">3</text></g>
<g id="涙-bg4"  class="badge-group"><circle cx="39.43" cy="18.49" r="3.5" fill="#2dbf09"/><text class="num-single" x="39.43" y="18.49" dx="0" dy="-0.5">4</text></g>
<g id="涙-bg5"  class="badge-group"><circle cx="41.2" cy="27.35" r="3.5" fill="#09bf52"/><text class="num-single" x="41.2" y="27.35" dx="0" dy="-0.5">5</text></g>
<g id="涙-bg6"  class="badge-group"><circle cx="45.36" cy="45.18" r="3.5" fill="#09bfbf"/><text class="num-single" x="45.36" y="45.18" dx="0" dy="-0.5">6</text></g>
<g id="涙-bg7"  class="badge-group"><circle cx="43.69" cy="35.5" r="3.5" fill="#0952bf"/><text class="num-single" x="43.69" y="35.5" dx="0" dy="-0.5">7</text></g>
<g id="涙-bg8"  class="badge-group"><circle cx="47.84" cy="62.79" r="3.5" fill="#2d09bf"/><text class="num-single" x="47.84" y="62.79" dx="0" dy="-0.5">8</text></g>
<g id="涙-bg9"  class="badge-group"><circle cx="66.22" cy="49.21" r="3.5" fill="#9a09bf"/><text class="num-single" x="66.22" y="49.21" dx="0" dy="-0.5">9</text></g>
<g id="涙-bg10" class="badge-group"><circle cx="67.35" cy="62.56" r="3.5" fill="#bf0976"/><text class="num-double" x="67.35" y="62.56" dx="-0.4" dy="-0.475">10</text></g>
</svg>