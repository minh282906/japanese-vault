<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (談)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #談-bg[i]: Thời gian quả bóng số nảy lên
   - #談-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#談-bg1  { animation-delay: 0.05s; }
#談-s1   { stroke-dasharray: 11.1421; stroke-dashoffset: 11.1421; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#談-bg2  { animation-delay: 0.42s; }
#談-s2   { stroke-dasharray: 31.6789; stroke-dashoffset: 31.6789; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#談-bg3  { animation-delay: 0.79s; }
#談-s3   { stroke-dasharray: 20.4281; stroke-dashoffset: 20.4281; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#談-bg4  { animation-delay: 1.16s; }
#談-s4   { stroke-dasharray: 20.4511; stroke-dashoffset: 20.4511; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#談-bg5  { animation-delay: 1.53s; }
#談-s5   { stroke-dasharray: 20.0341; stroke-dashoffset: 20.0341; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#談-bg6  { animation-delay: 1.90s; }
#談-s6   { stroke-dasharray: 36.0422; stroke-dashoffset: 36.0422; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#談-bg7  { animation-delay: 2.27s; }
#談-s7   { stroke-dasharray: 16.0853; stroke-dashoffset: 16.0853; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#談-bg8  { animation-delay: 2.64s; }
#談-s8   { stroke-dasharray: 10.9170; stroke-dashoffset: 10.9170; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#談-bg9  { animation-delay: 3.01s; }
#談-s9   { stroke-dasharray: 13.3870; stroke-dashoffset: 13.3870; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#談-bg10  { animation-delay: 3.38s; }
#談-s10   { stroke-dasharray: 48.2852; stroke-dashoffset: 48.2852; animation: drawStroke 0.27s ease-out 3.51s forwards; }
#談-bg11  { animation-delay: 3.80s; }
#談-s11   { stroke-dasharray: 37.0663; stroke-dashoffset: 37.0663; animation: drawStroke 0.22s ease-out 3.93s forwards; }
#談-bg12  { animation-delay: 4.17s; }
#談-s12   { stroke-dasharray: 9.9761; stroke-dashoffset: 9.9761; animation: drawStroke 0.22s ease-out 4.30s forwards; }
#談-bg13  { animation-delay: 4.54s; }
#談-s13   { stroke-dasharray: 14.5270; stroke-dashoffset: 14.5270; animation: drawStroke 0.22s ease-out 4.67s forwards; }
#談-bg14  { animation-delay: 4.91s; }
#談-s14   { stroke-dasharray: 56.9360; stroke-dashoffset: 56.9360; animation: drawStroke 0.31s ease-out 5.04s forwards; }
#談-bg15  { animation-delay: 5.37s; }
#談-s15   { stroke-dasharray: 39.3036; stroke-dashoffset: 39.3036; animation: drawStroke 0.22s ease-out 5.50s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
