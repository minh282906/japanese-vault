<path id="傾-s8"  class="stroke" stroke="#0995bf" d="M62.93,31.78C66.63,31.380000000000003,84.83,28.34,87.2,28.28C89.18,28.23,90.56,29.25,90.56,31.85C90.56,34.67,90.51,52.790000000000006,90.5,67.88C90.5,69.64,90.5,71.36,90.5,73"/>
<path id="傾-s9"  class="stroke" stroke="#0941bf" d="M62.86,45.32C68.75,44.75,83.84,42.75,89.42,42.730000000000004"/>
<path id="傾-s10"  class="stroke" stroke="#2509bf" d="M62.74,58.11C72.62,57.12,82.26,56.26,89.38,56.22"/>
<path id="傾-s11"  class="stroke" stroke="#7909bf" d="M62.86,72.48C68.87,71.81,81.7,70.59,89.28,70.56"/>
