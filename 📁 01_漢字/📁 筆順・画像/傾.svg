<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (傾)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #傾-bg[i]: Thời gian quả bóng số nảy lên
   - #傾-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#傾-bg1  { animation-delay: 0.05s; }
#傾-s1   { stroke-dasharray: 50.2887; stroke-dashoffset: 50.2887; animation: drawStroke 0.28s ease-out 0.18s forwards; }
#傾-bg2  { animation-delay: 0.48s; }
#傾-s2   { stroke-dasharray: 55.0813; stroke-dashoffset: 55.0813; animation: drawStroke 0.30s ease-out 0.61s forwards; }
#傾-bg3  { animation-delay: 0.93s; }
#傾-s3   { stroke-dasharray: 13.5953; stroke-dashoffset: 13.5953; animation: drawStroke 0.22s ease-out 1.06s forwards; }
#傾-bg4  { animation-delay: 1.30s; }
#傾-s4   { stroke-dasharray: 58.2888; stroke-dashoffset: 58.2888; animation: drawStroke 0.32s ease-out 1.43s forwards; }
#傾-bg5  { animation-delay: 1.77s; }
#傾-s5   { stroke-dasharray: 44.4780; stroke-dashoffset: 44.4780; animation: drawStroke 0.24s ease-out 1.90s forwards; }
#傾-bg6  { animation-delay: 2.16s; }
#傾-s6   { stroke-dasharray: 10.5750; stroke-dashoffset: 10.5750; animation: drawStroke 0.22s ease-out 2.29s forwards; }
#傾-bg7  { animation-delay: 2.53s; }
#傾-s7   { stroke-dasharray: 44.3751; stroke-dashoffset: 44.3751; animation: drawStroke 0.24s ease-out 2.66s forwards; }
#傾-bg8  { animation-delay: 2.92s; }
#傾-s8   { stroke-dasharray: 71.3060; stroke-dashoffset: 71.3060; animation: drawStroke 0.39s ease-out 3.05s forwards; }
#傾-bg9  { animation-delay: 3.46s; }
#傾-s9   { stroke-dasharray: 26.6933; stroke-dashoffset: 26.6933; animation: drawStroke 0.22s ease-out 3.59s forwards; }
#傾-bg10  { animation-delay: 3.83s; }
#傾-s10   { stroke-dasharray: 26.7157; stroke-dashoffset: 26.7157; animation: drawStroke 0.22s ease-out 3.96s forwards; }
#傾-bg11  { animation-delay: 4.20s; }
#傾-s11   { stroke-dasharray: 26.4990; stroke-dashoffset: 26.4990; animation: drawStroke 0.22s ease-out 4.33s forwards; }
#傾-bg12  { animation-delay: 4.57s; }
#傾-s12   { stroke-dasharray: 27.6866; stroke-dashoffset: 27.6866; animation: drawStroke 0.22s ease-out 4.70s forwards; }
#傾-bg13  { animation-delay: 4.94s; }
#傾-s13   { stroke-dasharray: 19.9874; stroke-dashoffset: 19.9874; animation: drawStroke 0.22s ease-out 5.07s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

