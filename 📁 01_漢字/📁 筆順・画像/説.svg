<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (説)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #説-bg[i]: Thời gian quả bóng số nảy lên
   - #説-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#説-bg1  { animation-delay: 0.05s; }
#説-s1   { stroke-dasharray: 13.9671; stroke-dashoffset: 13.9671; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#説-bg2  { animation-delay: 0.42s; }
#説-s2   { stroke-dasharray: 30.3689; stroke-dashoffset: 30.3689; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#説-bg3  { animation-delay: 0.79s; }
#説-s3   { stroke-dasharray: 22.8255; stroke-dashoffset: 22.8255; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#説-bg4  { animation-delay: 1.16s; }
#説-s4   { stroke-dasharray: 21.4579; stroke-dashoffset: 21.4579; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#説-bg5  { animation-delay: 1.53s; }
#説-s5   { stroke-dasharray: 23.2327; stroke-dashoffset: 23.2327; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#説-bg6  { animation-delay: 1.90s; }
#説-s6   { stroke-dasharray: 39.8138; stroke-dashoffset: 39.8138; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#説-bg7  { animation-delay: 2.27s; }
#説-s7   { stroke-dasharray: 17.5356; stroke-dashoffset: 17.5356; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#説-bg8  { animation-delay: 2.64s; }
#説-s8   { stroke-dasharray: 16.8573; stroke-dashoffset: 16.8573; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#説-bg9  { animation-delay: 3.01s; }
#説-s9   { stroke-dasharray: 21.8915; stroke-dashoffset: 21.8915; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#説-bg10  { animation-delay: 3.38s; }
#説-s10   { stroke-dasharray: 23.4811; stroke-dashoffset: 23.4811; animation: drawStroke 0.22s ease-out 3.51s forwards; }
#説-bg11  { animation-delay: 3.75s; }
#説-s11   { stroke-dasharray: 51.3036; stroke-dashoffset: 51.3036; animation: drawStroke 0.28s ease-out 3.88s forwards; }
#説-bg12  { animation-delay: 4.18s; }
#説-s12   { stroke-dasharray: 29.1850; stroke-dashoffset: 29.1850; animation: drawStroke 0.22s ease-out 4.31s forwards; }
#説-bg13  { animation-delay: 4.55s; }
#説-s13   { stroke-dasharray: 38.5684; stroke-dashoffset: 38.5684; animation: drawStroke 0.22s ease-out 4.68s forwards; }
#説-bg14  { animation-delay: 4.92s; }
#説-s14   { stroke-dasharray: 59.7836; stroke-dashoffset: 59.7836; animation: drawStroke 0.33s ease-out 5.05s forwards; }
]]>
</style>

