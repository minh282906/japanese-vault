<path id="説-s10"  class="stroke" stroke="#0923bf" d="M51.73,38.63C52.61,39.510000000000005,53,40.25,53.23,41.24C53.919999999999995,44.29,54.94,51.31,55.87,57.620000000000005C56.059999999999995,58.93000000000001,56.25,60.2,56.43,61.410000000000004"/>
