<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (未)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #未-bg[i]: Thời gian quả bóng số nảy lên
   - #未-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#未-bg1  { animation-delay: 0.05s; }
#未-s1   { stroke-dasharray: 48.8864; stroke-dashoffset: 48.8864; animation: drawStroke 0.27s ease-out 0.18s forwards; }
#未-bg2  { animation-delay: 0.47s; }
#未-s2   { stroke-dasharray: 75.9112; stroke-dashoffset: 75.9112; animation: drawStroke 0.42s ease-out 0.60s forwards; }
#未-bg3  { animation-delay: 1.04s; }
#未-s3   { stroke-dasharray: 89.5388; stroke-dashoffset: 89.5388; animation: drawStroke 0.49s ease-out 1.17s forwards; }
#未-bg4  { animation-delay: 1.68s; }
#未-s4   { stroke-dasharray: 55.3652; stroke-dashoffset: 55.3652; animation: drawStroke 0.30s ease-out 1.81s forwards; }
#未-bg5  { animation-delay: 2.13s; }
#未-s5   { stroke-dasharray: 51.8182; stroke-dashoffset: 51.8182; animation: drawStroke 0.29s ease-out 2.26s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #未-s[i]) -->
<path id="未-s1"  class="stroke" stroke="#bf0909" d="M30.13,30.77C32.75,31.25,35.14,31.11,37.379999999999995,30.8C47.62,29.400000000000002,62.349999999999994,27.6,72.27,26.61C74.38,26.4,76.88,26.37,78.72,26.599999999999998"/>
<path id="未-s2"  class="stroke" stroke="#9abf09" d="M16.69,51.25C19.86,52.14,22.810000000000002,52.06,26.03,51.64C39.88,49.87,66.25,47,83.00999999999999,45.76C86.16999999999999,45.53,89.05999999999999,45.47,92.19,46"/>
<path id="未-s3"  class="stroke" stroke="#09bf52" d="M52.66,11C53.83,12.17,54.58,13.620000000000001,54.58,15.25C54.58,20.41,54.55,70.96000000000001,54.54,92.25C54.54,95.72,54.54,98.41,54.54,100"/>
<path id="未-s4"  class="stroke" stroke="#0952bf" d="M51.5,49.25C51.5,50.37,50.84,51.87,50,53.13C41.92,65.24,25.89,81.18,12.75,87.5"/>
<path id="未-s5"  class="stroke" stroke="#9a09bf" d="M56.12,49.75C61.739999999999995,56,76.37,70.25,86.44999999999999,78.68C88.97999999999999,80.79,91.49,82.5,94.86999999999999,83.75"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="未-bg1"  class="badge-group"><circle cx="30.13" cy="30.77" r="3.5" fill="#bf0909"/><text class="num-single" x="30.13" y="30.77" dx="0" dy="-0.5">1</text></g>
<g id="未-bg2"  class="badge-group"><circle cx="16.69" cy="51.25" r="3.5" fill="#9abf09"/><text class="num-single" x="16.69" y="51.25" dx="0" dy="-0.5">2</text></g>
<g id="未-bg3"  class="badge-group"><circle cx="52.66" cy="11" r="3.5" fill="#09bf52"/><text class="num-single" x="52.66" y="11" dx="0" dy="-0.5">3</text></g>
<g id="未-bg4"  class="badge-group"><circle cx="51.5" cy="45.75" r="3.5" fill="#0952bf"/><text class="num-single" x="51.5" y="45.75" dx="0" dy="-0.5">4</text></g>
<g id="未-bg5"  class="badge-group"><circle cx="56.12" cy="53.25" r="3.5" fill="#9a09bf"/><text class="num-single" x="56.12" y="53.25" dx="0" dy="-0.5">5</text></g>
</svg>