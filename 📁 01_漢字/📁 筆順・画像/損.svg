<path id="損-s8"  class="stroke" stroke="#0995bf" d="M55.85,40.8C58.86,40.65,82.28,38.519999999999996,85.02000000000001,38.339999999999996C87.30000000000001,38.19,88.91000000000001,39.739999999999995,88.91000000000001,41.75C88.91000000000001,44.74,88.99000000000001,63.120000000000005,88.99000000000001,72.49C88.99000000000001,75.08999999999999,88.85000000000001,76.36999999999999,88.85000000000001,77.75999999999999"/>
<path id="損-s9"  class="stroke" stroke="#0941bf" d="M56.8,52.23C66.5,51.5,83.03999999999999,50.339999999999996,87.86,50.339999999999996"/>
<path id="損-s10"  class="stroke" stroke="#2509bf" d="M56.8,64.05C64.75,63.37,80.25,62,87.75999999999999,61.79"/>
<path id="損-s11"  class="stroke" stroke="#7909bf" d="M56.33,76.29C63.629999999999995,75.75,80.63,74.5,87.78999999999999,74.27000000000001"/>
