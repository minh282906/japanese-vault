<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (損)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #損-bg[i]: Thời gian quả bóng số nảy lên
   - #損-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#損-bg1  { animation-delay: 0.05s; }
#損-s1   { stroke-dasharray: 30.1484; stroke-dashoffset: 30.1484; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#損-bg2  { animation-delay: 0.42s; }
#損-s2   { stroke-dasharray: 86.4572; stroke-dashoffset: 86.4572; animation: drawStroke 0.48s ease-out 0.55s forwards; }
#損-bg3  { animation-delay: 1.05s; }
#損-s3   { stroke-dasharray: 30.3987; stroke-dashoffset: 30.3987; animation: drawStroke 0.22s ease-out 1.18s forwards; }
#損-bg4  { animation-delay: 1.42s; }
#損-s4   { stroke-dasharray: 17.9366; stroke-dashoffset: 17.9366; animation: drawStroke 0.22s ease-out 1.55s forwards; }
#損-bg5  { animation-delay: 1.79s; }
#損-s5   { stroke-dasharray: 45.6710; stroke-dashoffset: 45.6710; animation: drawStroke 0.25s ease-out 1.92s forwards; }
#損-bg6  { animation-delay: 2.19s; }
#損-s6   { stroke-dasharray: 30.0308; stroke-dashoffset: 30.0308; animation: drawStroke 0.22s ease-out 2.32s forwards; }
#損-bg7  { animation-delay: 2.56s; }
#損-s7   { stroke-dasharray: 40.5052; stroke-dashoffset: 40.5052; animation: drawStroke 0.22s ease-out 2.69s forwards; }
#損-bg8  { animation-delay: 2.93s; }
#損-s8   { stroke-dasharray: 71.1306; stroke-dashoffset: 71.1306; animation: drawStroke 0.39s ease-out 3.06s forwards; }
#損-bg9  { animation-delay: 3.47s; }
#損-s9   { stroke-dasharray: 31.1206; stroke-dashoffset: 31.1206; animation: drawStroke 0.22s ease-out 3.60s forwards; }
#損-bg10  { animation-delay: 3.84s; }
#損-s10   { stroke-dasharray: 31.0454; stroke-dashoffset: 31.0454; animation: drawStroke 0.22s ease-out 3.97s forwards; }
#損-bg11  { animation-delay: 4.21s; }
#損-s11   { stroke-dasharray: 31.5262; stroke-dashoffset: 31.5262; animation: drawStroke 0.22s ease-out 4.34s forwards; }
#損-bg12  { animation-delay: 4.58s; }
#損-s12   { stroke-dasharray: 21.1599; stroke-dashoffset: 21.1599; animation: drawStroke 0.22s ease-out 4.71s forwards; }
#損-bg13  { animation-delay: 4.95s; }
#損-s13   { stroke-dasharray: 19.0915; stroke-dashoffset: 19.0915; animation: drawStroke 0.22s ease-out 5.08s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

