<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (磨)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #磨-bg[i]: Thời gian quả bóng số nảy lên
   - #磨-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#磨-bg1  { animation-delay: 0.05s; }
#磨-s1   { stroke-dasharray: 11.4187; stroke-dashoffset: 11.4187; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#磨-bg2  { animation-delay: 0.42s; }
#磨-s2   { stroke-dasharray: 66.1125; stroke-dashoffset: 66.1125; animation: drawStroke 0.36s ease-out 0.55s forwards; }
#磨-bg3  { animation-delay: 0.93s; }
#磨-s3   { stroke-dasharray: 69.7417; stroke-dashoffset: 69.7417; animation: drawStroke 0.38s ease-out 1.06s forwards; }
#磨-bg4  { animation-delay: 1.46s; }
#磨-s4   { stroke-dasharray: 24.9571; stroke-dashoffset: 24.9571; animation: drawStroke 0.22s ease-out 1.59s forwards; }
#磨-bg5  { animation-delay: 1.83s; }
#磨-s5   { stroke-dasharray: 32.2310; stroke-dashoffset: 32.2310; animation: drawStroke 0.22s ease-out 1.96s forwards; }
#磨-bg6  { animation-delay: 2.20s; }
#磨-s6   { stroke-dasharray: 22.7522; stroke-dashoffset: 22.7522; animation: drawStroke 0.22s ease-out 2.33s forwards; }
#磨-bg7  { animation-delay: 2.57s; }
#磨-s7   { stroke-dasharray: 9.7234; stroke-dashoffset: 9.7234; animation: drawStroke 0.22s ease-out 2.70s forwards; }
#磨-bg8  { animation-delay: 2.94s; }
#磨-s8   { stroke-dasharray: 25.6799; stroke-dashoffset: 25.6799; animation: drawStroke 0.22s ease-out 3.07s forwards; }
#磨-bg9  { animation-delay: 3.31s; }
#磨-s9   { stroke-dasharray: 32.7361; stroke-dashoffset: 32.7361; animation: drawStroke 0.22s ease-out 3.44s forwards; }
#磨-bg10  { animation-delay: 3.68s; }
#磨-s10   { stroke-dasharray: 25.4935; stroke-dashoffset: 25.4935; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#磨-bg11  { animation-delay: 4.05s; }
#磨-s11   { stroke-dasharray: 22.6528; stroke-dashoffset: 22.6528; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#磨-bg12  { animation-delay: 4.42s; }
#磨-s12   { stroke-dasharray: 59.4446; stroke-dashoffset: 59.4446; animation: drawStroke 0.33s ease-out 4.55s forwards; }
#磨-bg13  { animation-delay: 4.90s; }
#磨-s13   { stroke-dasharray: 34.5253; stroke-dashoffset: 34.5253; animation: drawStroke 0.22s ease-out 5.03s forwards; }
#磨-bg14  { animation-delay: 5.27s; }
#磨-s14   { stroke-dasharray: 19.5354; stroke-dashoffset: 19.5354; animation: drawStroke 0.22s ease-out 5.40s forwards; }
#磨-bg15  { animation-delay: 5.64s; }
#磨-s15   { stroke-dasharray: 48.8288; stroke-dashoffset: 48.8288; animation: drawStroke 0.27s ease-out 5.77s forwards; }
#磨-bg16  { animation-delay: 6.06s; }
#磨-s16   { stroke-dasharray: 30.7914; stroke-dashoffset: 30.7914; animation: drawStroke 0.22s ease-out 6.19s forwards; }
]]>
</style>

