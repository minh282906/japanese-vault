#競-s6   { stroke-dasharray: 14.9852; stroke-dashoffset: 14.9852; animation: drawStroke 0.22s ease-out 2.03s forwards; }
#競-bg7  { animation-delay: 2.27s; }
#競-s7   { stroke-dasharray: 33.8908; stroke-dashoffset: 33.8908; animation: drawStroke 0.22s ease-out 2.40s forwards; }
#競-bg8  { animation-delay: 2.64s; }
#競-s8   { stroke-dasharray: 18.9909; stroke-dashoffset: 18.9909; animation: drawStroke 0.22s ease-out 2.77s forwards; }
#競-bg9  { animation-delay: 3.01s; }
#競-s9   { stroke-dasharray: 27.6609; stroke-dashoffset: 27.6609; animation: drawStroke 0.22s ease-out 3.14s forwards; }
#競-bg10  { animation-delay: 3.38s; }
#競-s10   { stroke-dasharray: 43.9647; stroke-dashoffset: 43.9647; animation: drawStroke 0.24s ease-out 3.51s forwards; }
#競-bg11  { animation-delay: 3.77s; }
#競-s11   { stroke-dasharray: 10.8969; stroke-dashoffset: 10.8969; animation: drawStroke 0.22s ease-out 3.90s forwards; }
#競-bg12  { animation-delay: 4.14s; }
#競-s12   { stroke-dasharray: 33.6359; stroke-dashoffset: 33.6359; animation: drawStroke 0.22s ease-out 4.27s forwards; }
