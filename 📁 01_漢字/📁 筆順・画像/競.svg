#競-s13   { stroke-dasharray: 9.7844; stroke-dashoffset: 9.7844; animation: drawStroke 0.22s ease-out 4.64s forwards; }
#競-bg14  { animation-delay: 4.88s; }
#競-s14   { stroke-dasharray: 12.7061; stroke-dashoffset: 12.7061; animation: drawStroke 0.22s ease-out 5.01s forwards; }
#競-bg15  { animation-delay: 5.25s; }
#競-s15   { stroke-dasharray: 43.1568; stroke-dashoffset: 43.1568; animation: drawStroke 0.24s ease-out 5.38s forwards; }
#競-bg16  { animation-delay: 5.64s; }
#競-s16   { stroke-dasharray: 16.9053; stroke-dashoffset: 16.9053; animation: drawStroke 0.22s ease-out 5.77s forwards; }
#競-bg17  { animation-delay: 6.01s; }
#競-s17   { stroke-dasharray: 39.1807; stroke-dashoffset: 39.1807; animation: drawStroke 0.22s ease-out 6.14s forwards; }
#競-bg18  { animation-delay: 6.38s; }
#競-s18   { stroke-dasharray: 22.7083; stroke-dashoffset: 22.7083; animation: drawStroke 0.22s ease-out 6.51s forwards; }
#競-bg19  { animation-delay: 6.75s; }
#競-s19   { stroke-dasharray: 30.5495; stroke-dashoffset: 30.5495; animation: drawStroke 0.22s ease-out 6.88s forwards; }
#競-bg20  { animation-delay: 7.12s; }
#競-s20   { stroke-dasharray: 52.0504; stroke-dashoffset: 52.0504; animation: drawStroke 0.29s ease-out 7.25s forwards; }
]]>
</style>

