<path id="勤-s6"  class="stroke" stroke="#09bf64" d="M20.61,55.02C25.34,54.63,38.32,53.160000000000004,46.519999999999996,52.42C48.089999999999996,52.28,49.49999999999999,52.160000000000004,50.65,52.09"/>
