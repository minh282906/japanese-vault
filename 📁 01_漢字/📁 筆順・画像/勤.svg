<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (勤)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #勤-bg[i]: Thời gian quả bóng số nảy lên
   - #勤-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#勤-bg1  { animation-delay: 0.05s; }
#勤-s1   { stroke-dasharray: 44.5290; stroke-dashoffset: 44.5290; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#勤-bg2  { animation-delay: 0.44s; }
#勤-s2   { stroke-dasharray: 20.5909; stroke-dashoffset: 20.5909; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#勤-bg3  { animation-delay: 0.81s; }
#勤-s3   { stroke-dasharray: 22.0405; stroke-dashoffset: 22.0405; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#勤-bg4  { animation-delay: 1.18s; }
#勤-s4   { stroke-dasharray: 18.3646; stroke-dashoffset: 18.3646; animation: drawStroke 0.22s ease-out 1.31s forwards; }
#勤-bg5  { animation-delay: 1.55s; }
#勤-s5   { stroke-dasharray: 46.0981; stroke-dashoffset: 46.0981; animation: drawStroke 0.25s ease-out 1.68s forwards; }
#勤-bg6  { animation-delay: 1.95s; }
#勤-s6   { stroke-dasharray: 30.1837; stroke-dashoffset: 30.1837; animation: drawStroke 0.22s ease-out 2.08s forwards; }
#勤-bg7  { animation-delay: 2.32s; }
#勤-s7   { stroke-dasharray: 42.8937; stroke-dashoffset: 42.8937; animation: drawStroke 0.24s ease-out 2.45s forwards; }
#勤-bg8  { animation-delay: 2.71s; }
#勤-s8   { stroke-dasharray: 29.2250; stroke-dashoffset: 29.2250; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#勤-bg9  { animation-delay: 3.08s; }
#勤-s9   { stroke-dasharray: 28.5526; stroke-dashoffset: 28.5526; animation: drawStroke 0.22s ease-out 3.21s forwards; }
#勤-bg10  { animation-delay: 3.45s; }
#勤-s10   { stroke-dasharray: 32.5575; stroke-dashoffset: 32.5575; animation: drawStroke 0.22s ease-out 3.58s forwards; }
#勤-bg11  { animation-delay: 3.82s; }
#勤-s11   { stroke-dasharray: 99.0110; stroke-dashoffset: 99.0110; animation: drawStroke 0.54s ease-out 3.95s forwards; }
#勤-bg12  { animation-delay: 4.51s; }
#勤-s12   { stroke-dasharray: 81.5333; stroke-dashoffset: 81.5333; animation: drawStroke 0.45s ease-out 4.64s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #勤-s[i]) -->
<path id="勤-s1"  class="stroke" stroke="#bf0909" d="M12.75,26.02C14.129999999999999,26.5,16.240000000000002,26.41,17.27,26.29C25.28,25.33,39.25,23.75,51.75,22.799999999999997C53.51,22.669999999999998,55.31,22.599999999999998,57,23.229999999999997"/>
