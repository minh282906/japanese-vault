<path id="勤-s8"  class="stroke" stroke="#0964bf" d="M20,65.31C21.29,65.76,23.09,65.47,24.39,65.36C29.32,64.92,37.38,63.88,43.879999999999995,62.8C45.53999999999999,62.519999999999996,47.379999999999995,62.379999999999995,48.99999999999999,62.47"/>
<path id="勤-s9"  class="stroke" stroke="#0909bf" d="M19.75,75.81C21.25,76,23.17,76.03,24.65,75.86C30.82,75.13,36.83,73.99,44.15,72.67C45.37,72.45,46.769999999999996,72.21000000000001,48,72.47"/>
<path id="勤-s10"  class="stroke" stroke="#6409bf" d="M16.25,88.95C16.75,90,17.87,90.87,19.69,90.32000000000001C26.520000000000003,88.23,40.14,84.25,47,82.25"/>
<path id="勤-s11"  class="stroke" stroke="#bf09bf" d="M59.5,40.1C61.75,40.620000000000005,63.79,40.63,65.52,40.4C74.55,39.22,85.5,37.72,89.39,37.08C92.15,36.629999999999995,94,38.489999999999995,93.76,42.3C93.24000000000001,50.68,85.75,83.75,80.69,89.66C75.8,95.36999999999999,74,90.49,72.33,87.97999999999999"/>
<path id="勤-s12"  class="stroke" stroke="#bf0964" d="M75.68,16.93C76.13000000000001,18.25,76.41000000000001,19.47,76.02000000000001,21.97C71.88,49,66,75.62,48.39,91.65"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="勤-bg1"  class="badge-group"><circle cx="12.75" cy="26.02" r="3.5" fill="#bf0909"/><text class="num-single" x="12.75" y="26.02" dx="0" dy="-0.5">1</text></g>
