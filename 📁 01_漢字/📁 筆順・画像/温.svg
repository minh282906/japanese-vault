<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (温)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #温-bg[i]: Thời gian quả bóng số nảy lên
   - #温-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#温-bg1  { animation-delay: 0.05s; }
#温-s1   { stroke-dasharray: 13.1319; stroke-dashoffset: 13.1319; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#温-bg2  { animation-delay: 0.42s; }
#温-s2   { stroke-dasharray: 13.4212; stroke-dashoffset: 13.4212; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#温-bg3  { animation-delay: 0.79s; }
#温-s3   { stroke-dasharray: 24.8320; stroke-dashoffset: 24.8320; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#温-bg4  { animation-delay: 1.16s; }
#温-s4   { stroke-dasharray: 32.0631; stroke-dashoffset: 32.0631; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#温-bg5  { animation-delay: 1.53s; }
#温-s5   { stroke-dasharray: 65.8482; stroke-dashoffset: 65.8482; animation: drawStroke 0.36s ease-out 1.66s forwards; }
#温-bg6  { animation-delay: 2.04s; }
#温-s6   { stroke-dasharray: 32.1207; stroke-dashoffset: 32.1207; animation: drawStroke 0.22s ease-out 2.17s forwards; }
#温-bg7  { animation-delay: 2.41s; }
#温-s7   { stroke-dasharray: 27.6099; stroke-dashoffset: 27.6099; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#温-bg8  { animation-delay: 2.78s; }
#温-s8   { stroke-dasharray: 24.2990; stroke-dashoffset: 24.2990; animation: drawStroke 0.22s ease-out 2.91s forwards; }
#温-bg9  { animation-delay: 3.15s; }
#温-s9   { stroke-dasharray: 69.7109; stroke-dashoffset: 69.7109; animation: drawStroke 0.38s ease-out 3.28s forwards; }
#温-bg10  { animation-delay: 3.68s; }
#温-s10   { stroke-dasharray: 21.9628; stroke-dashoffset: 21.9628; animation: drawStroke 0.22s ease-out 3.81s forwards; }
#温-bg11  { animation-delay: 4.05s; }
#温-s11   { stroke-dasharray: 22.7759; stroke-dashoffset: 22.7759; animation: drawStroke 0.22s ease-out 4.18s forwards; }
#温-bg12  { animation-delay: 4.42s; }
#温-s12   { stroke-dasharray: 68.9198; stroke-dashoffset: 68.9198; animation: drawStroke 0.38s ease-out 4.55s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #温-s[i]) -->
<path id="温-s1"  class="stroke" stroke="#bf0909" d="M21.38,18.75C24.86,20.23,30.369999999999997,24.83,31.25,27.130000000000003"/>
<path id="温-s2"  class="stroke" stroke="#bf6409" d="M16.25,40.5C19.87,41.78,25,45.25,27,48.25"/>
