<path id="温-s5"  class="stroke" stroke="#09bf09" d="M46.24,23.31C54.5,22.38,76.46000000000001,20.09,78.55000000000001,20C81.25000000000001,19.88,82.87,21.63,82.72000000000001,23.759999999999998C82.61000000000001,25.209999999999997,79.62000000000002,40.39,78.12000000000002,47.64C77.90000000000002,48.69,77.74000000000002,49.39,77.52000000000002,50.2"/>
<path id="温-s6"  class="stroke" stroke="#09bf64" d="M47.72,36.04C53.879999999999995,35.5,74.13,33.87,79.74000000000001,33.5"/>
<path id="温-s7"  class="stroke" stroke="#09bfbf" d="M49.38,50C56.730000000000004,49.49,67.78,48.48,76.92,48.05"/>
<path id="温-s8"  class="stroke" stroke="#0964bf" d="M40.14,64.11C41.39,65.36,41.92,66.53,42.29,68.47C43.26,73.57,43.5,78.5,44.66,87.67"/>
<path id="温-s9"  class="stroke" stroke="#0909bf" d="M42.26,65.3C54,63.79,81.9,61.18,85.2,61.18C87.5,61.18,88.62,62.77,88.10000000000001,65.23C87.72000000000001,67.03,84.98,79.48,83.68,85.41"/>
<path id="温-s10"  class="stroke" stroke="#6409bf" d="M55.88,65.24C56.25,65.75,56.870000000000005,66.36999999999999,56.940000000000005,67.55C57.39000000000001,75.00999999999999,57.68000000000001,79.25,58.220000000000006,86.88"/>
<path id="温-s11"  class="stroke" stroke="#bf09bf" d="M70.95,63.9C71.62,64.75,71.58,66.02,71.46000000000001,67C70.50000000000001,74.5,69.67,79.94,69.03,86.4"/>
<path id="温-s12"  class="stroke" stroke="#bf0964" d="M30.63,89.08C33.14,89.66,37.72,89.58,40.26,89.45C55.62,88.63000000000001,74.37,87.13000000000001,90.21000000000001,86.4C94.4,86.21000000000001,97.14000000000001,86.38000000000001,99.38000000000001,86.93"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="温-bg1"  class="badge-group"><circle cx="21.38" cy="18.75" r="3.5" fill="#bf0909"/><text class="num-single" x="21.38" y="18.75" dx="0" dy="-0.5">1</text></g>
