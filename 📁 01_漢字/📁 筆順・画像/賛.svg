<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (賛)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #賛-bg[i]: Thời gian quả bóng số nảy lên
   - #賛-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#賛-bg1  { animation-delay: 0.05s; }
#賛-s1   { stroke-dasharray: 26.0242; stroke-dashoffset: 26.0242; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#賛-bg2  { animation-delay: 0.42s; }
#賛-s2   { stroke-dasharray: 32.2524; stroke-dashoffset: 32.2524; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#賛-bg3  { animation-delay: 0.79s; }
#賛-s3   { stroke-dasharray: 45.9644; stroke-dashoffset: 45.9644; animation: drawStroke 0.25s ease-out 0.92s forwards; }
#賛-bg4  { animation-delay: 1.19s; }
#賛-s4   { stroke-dasharray: 13.8025; stroke-dashoffset: 13.8025; animation: drawStroke 0.22s ease-out 1.32s forwards; }
#賛-bg5  { animation-delay: 1.56s; }
#賛-s5   { stroke-dasharray: 27.5737; stroke-dashoffset: 27.5737; animation: drawStroke 0.22s ease-out 1.69s forwards; }
#賛-bg6  { animation-delay: 1.93s; }
#賛-s6   { stroke-dasharray: 34.5211; stroke-dashoffset: 34.5211; animation: drawStroke 0.22s ease-out 2.06s forwards; }
#賛-bg7  { animation-delay: 2.30s; }
#賛-s7   { stroke-dasharray: 39.2152; stroke-dashoffset: 39.2152; animation: drawStroke 0.22s ease-out 2.43s forwards; }
#賛-bg8  { animation-delay: 2.67s; }
#賛-s8   { stroke-dasharray: 27.3859; stroke-dashoffset: 27.3859; animation: drawStroke 0.22s ease-out 2.80s forwards; }
#賛-bg9  { animation-delay: 3.04s; }
#賛-s9   { stroke-dasharray: 34.9210; stroke-dashoffset: 34.9210; animation: drawStroke 0.22s ease-out 3.17s forwards; }
#賛-bg10  { animation-delay: 3.41s; }
#賛-s10   { stroke-dasharray: 66.9474; stroke-dashoffset: 66.9474; animation: drawStroke 0.37s ease-out 3.54s forwards; }
#賛-bg11  { animation-delay: 3.93s; }
#賛-s11   { stroke-dasharray: 31.5451; stroke-dashoffset: 31.5451; animation: drawStroke 0.22s ease-out 4.06s forwards; }
#賛-bg12  { animation-delay: 4.30s; }
#賛-s12   { stroke-dasharray: 31.4198; stroke-dashoffset: 31.4198; animation: drawStroke 0.22s ease-out 4.43s forwards; }
#賛-bg13  { animation-delay: 4.67s; }
#賛-s13   { stroke-dasharray: 31.3937; stroke-dashoffset: 31.3937; animation: drawStroke 0.22s ease-out 4.80s forwards; }
#賛-bg14  { animation-delay: 5.04s; }
#賛-s14   { stroke-dasharray: 24.1511; stroke-dashoffset: 24.1511; animation: drawStroke 0.22s ease-out 5.17s forwards; }
#賛-bg15  { animation-delay: 5.41s; }
#賛-s15   { stroke-dasharray: 22.0709; stroke-dashoffset: 22.0709; animation: drawStroke 0.22s ease-out 5.54s forwards; }
]]>
</style>

