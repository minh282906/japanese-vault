<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (洋)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #洋-bg[i]: Thời gian quả bóng số nảy lên
   - #洋-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#洋-bg1  { animation-delay: 0.05s; }
#洋-s1   { stroke-dasharray: 14.7213; stroke-dashoffset: 14.7213; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#洋-bg2  { animation-delay: 0.42s; }
#洋-s2   { stroke-dasharray: 15.3128; stroke-dashoffset: 15.3128; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#洋-bg3  { animation-delay: 0.79s; }
#洋-s3   { stroke-dasharray: 30.2909; stroke-dashoffset: 30.2909; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#洋-bg4  { animation-delay: 1.16s; }
#洋-s4   { stroke-dasharray: 13.6850; stroke-dashoffset: 13.6850; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#洋-bg5  { animation-delay: 1.53s; }
#洋-s5   { stroke-dasharray: 19.5138; stroke-dashoffset: 19.5138; animation: drawStroke 0.22s ease-out 1.66s forwards; }
#洋-bg6  { animation-delay: 1.90s; }
#洋-s6   { stroke-dasharray: 47.0146; stroke-dashoffset: 47.0146; animation: drawStroke 0.26s ease-out 2.03s forwards; }
#洋-bg7  { animation-delay: 2.31s; }
#洋-s7   { stroke-dasharray: 37.6827; stroke-dashoffset: 37.6827; animation: drawStroke 0.22s ease-out 2.44s forwards; }
#洋-bg8  { animation-delay: 2.68s; }
#洋-s8   { stroke-dasharray: 58.7882; stroke-dashoffset: 58.7882; animation: drawStroke 0.32s ease-out 2.81s forwards; }
#洋-bg9  { animation-delay: 3.15s; }
#洋-s9   { stroke-dasharray: 65.1473; stroke-dashoffset: 65.1473; animation: drawStroke 0.36s ease-out 3.28s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 9 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #洋-s[i]) -->
<path id="洋-s1"  class="stroke" stroke="#bf0909" d="M20.47,16.1C24.74,17.75,31.36,22.400000000000002,32.31,24.55"/>
<path id="洋-s2"  class="stroke" stroke="#bf8209" d="M14.75,38.62C19.3,40.3,26.39,44.86,27.439999999999998,46.91"/>
<path id="洋-s3"  class="stroke" stroke="#82bf09" d="M12,90.11C13.27,90.42999999999999,14.51,90.15,15.35,89.11C19.27,84.25,26.72,73.53,30.39,67.21000000000001"/>
<path id="洋-s4"  class="stroke" stroke="#09bf09" d="M47.88,14.25C50.660000000000004,16.19,55.07,22.21,55.77,25.22"/>
<path id="洋-s5"  class="stroke" stroke="#09bf82" d="M83.37,11.75C83.41000000000001,12.19,83.54,12.92,83.29,13.53C81.65,17.5,78.46000000000001,22.13,72.7,27.57"/>
<path id="洋-s6"  class="stroke" stroke="#0982bf" d="M43.07,32.89C45.38,33.38,48.38,33.09,50.46,32.9C59.21,32.1,73.86,30.419999999999998,82.28999999999999,29.84C84.71,29.669999999999998,87.49999999999999,29.27,89.85999999999999,30.01"/>
<path id="洋-s7"  class="stroke" stroke="#0909bf" d="M48.28,50.89C50.870000000000005,51.38,53.34,51.24,55.38,51.13C62.84,50.690000000000005,72.05000000000001,49.38,79.25,48.57C81.39,48.33,83.63,47.93,85.77,48.27"/>
<path id="洋-s8"  class="stroke" stroke="#8209bf" d="M38,72.45C40.5,73,43.3,72.98,45.74,72.64C56.5,71.13,76.05,69.19,88.38,68.26C90.81,68.08,94.08999999999999,68.16000000000001,96.5,68.51"/>
<path id="洋-s9"  class="stroke" stroke="#bf0982" d="M65.26,34.25C66.19000000000001,35.18,66.72,36.48,66.72,37.5C66.72,40.33,66.6,74.56,66.55,91C66.53999999999999,94.86,66.53,97.74,66.53,99"/>

<!-- ============================================================
     BẢNG 9 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="洋-bg1"  class="badge-group"><circle cx="20.47" cy="16.1" r="3.5" fill="#bf0909"/><text class="num-single" x="20.47" y="16.1" dx="0" dy="-0.5">1</text></g>
<g id="洋-bg2"  class="badge-group"><circle cx="14.75" cy="38.62" r="3.5" fill="#bf8209"/><text class="num-single" x="14.75" y="38.62" dx="0" dy="-0.5">2</text></g>
<g id="洋-bg3"  class="badge-group"><circle cx="12" cy="90.11" r="3.5" fill="#82bf09"/><text class="num-single" x="12" y="90.11" dx="0" dy="-0.5">3</text></g>
<g id="洋-bg4"  class="badge-group"><circle cx="47.88" cy="14.25" r="3.5" fill="#09bf09"/><text class="num-single" x="47.88" y="14.25" dx="0" dy="-0.5">4</text></g>
<g id="洋-bg5"  class="badge-group"><circle cx="83.37" cy="11.75" r="3.5" fill="#09bf82"/><text class="num-single" x="83.37" y="11.75" dx="0" dy="-0.5">5</text></g>
<g id="洋-bg6"  class="badge-group"><circle cx="43.07" cy="32.89" r="3.5" fill="#0982bf"/><text class="num-single" x="43.07" y="32.89" dx="0" dy="-0.5">6</text></g>
<g id="洋-bg7"  class="badge-group"><circle cx="48.28" cy="50.89" r="3.5" fill="#0909bf"/><text class="num-single" x="48.28" y="50.89" dx="0" dy="-0.5">7</text></g>
<g id="洋-bg8"  class="badge-group"><circle cx="38" cy="72.45" r="3.5" fill="#8209bf"/><text class="num-single" x="38" y="72.45" dx="0" dy="-0.5">8</text></g>
<g id="洋-bg9"  class="badge-group"><circle cx="65.26" cy="34.25" r="3.5" fill="#bf0982"/><text class="num-single" x="65.26" y="34.25" dx="0" dy="-0.5">9</text></g>
</svg>