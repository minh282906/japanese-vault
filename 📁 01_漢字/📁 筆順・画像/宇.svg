<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (宇)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #宇-bg[i]: Thời gian quả bóng số nảy lên
   - #宇-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#宇-bg1  { animation-delay: 0.05s; }
#宇-s1   { stroke-dasharray: 14.5338; stroke-dashoffset: 14.5338; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#宇-bg2  { animation-delay: 0.42s; }
#宇-s2   { stroke-dasharray: 16.2347; stroke-dashoffset: 16.2347; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#宇-bg3  { animation-delay: 0.79s; }
#宇-s3   { stroke-dasharray: 70.0849; stroke-dashoffset: 70.0849; animation: drawStroke 0.39s ease-out 0.92s forwards; }
#宇-bg4  { animation-delay: 1.33s; }
#宇-s4   { stroke-dasharray: 35.3709; stroke-dashoffset: 35.3709; animation: drawStroke 0.22s ease-out 1.46s forwards; }
#宇-bg5  { animation-delay: 1.70s; }
#宇-s5   { stroke-dasharray: 71.1586; stroke-dashoffset: 71.1586; animation: drawStroke 0.39s ease-out 1.83s forwards; }
#宇-bg6  { animation-delay: 2.24s; }
#宇-s6   { stroke-dasharray: 60.3352; stroke-dashoffset: 60.3352; animation: drawStroke 0.33s ease-out 2.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #宇-s[i]) -->
<path id="宇-s1"  class="stroke" stroke="#bf0909" d="M53.56,13.75C54.59,14.78,54.870000000000005,16.48,54.85,17.57C54.77,21,54.77,24.84,54.76,27.97"/>
<path id="宇-s2"  class="stroke" stroke="#bfbf09" d="M26.68,28.85C26.68,32.21,23.15,42.010000000000005,21.8,44.25"/>
<path id="宇-s3"  class="stroke" stroke="#09bf09" d="M27.79,31.45C37.25,30.25,70.62,26.88,82.86,26.38C93.48,25.95,85.11,32.69,82.46,34.55"/>
<path id="宇-s4"  class="stroke" stroke="#09bfbf" d="M35.67,44.5C37.32,45.09,39.68,44.84,41.39,44.59C46.79,43.800000000000004,57.97,42.63,65.26,41.89C67.15,41.7,68.94000000000001,41.5,70.81,41.9"/>
<path id="宇-s5"  class="stroke" stroke="#0909bf" d="M20.19,63.12C22.700000000000003,64,26.16,63.73,28.75,63.489999999999995C40.59,62.39999999999999,68.25999999999999,59.42999999999999,82.5,58.949999999999996C85.35,58.849999999999994,88.25,58.73,91.05,59.31999999999999"/>
<path id="宇-s6"  class="stroke" stroke="#bf09bf" d="M53.08,45.83C54.19,46.94,54.809999999999995,48.62,54.809999999999995,50.21C54.809999999999995,64.45,54.85999999999999,87.57,54.85999999999999,92.42C54.85999999999999,102.68,47.93999999999999,93.62,47.059999999999995,92.69"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="宇-bg1"  class="badge-group"><circle cx="53.56" cy="13.75" r="3.5" fill="#bf0909"/><text class="num-single" x="53.56" y="13.75" dx="0" dy="-0.5">1</text></g>
<g id="宇-bg2"  class="badge-group"><circle cx="26.68" cy="25.35" r="3.5" fill="#bfbf09"/><text class="num-single" x="26.68" y="25.35" dx="0" dy="-0.5">2</text></g>
<g id="宇-bg3"  class="badge-group"><circle cx="27.79" cy="34.95" r="3.5" fill="#09bf09"/><text class="num-single" x="27.79" y="34.95" dx="0" dy="-0.5">3</text></g>
<g id="宇-bg4"  class="badge-group"><circle cx="35.67" cy="44.5" r="3.5" fill="#09bfbf"/><text class="num-single" x="35.67" y="44.5" dx="0" dy="-0.5">4</text></g>
<g id="宇-bg5"  class="badge-group"><circle cx="20.19" cy="63.12" r="3.5" fill="#0909bf"/><text class="num-single" x="20.19" y="63.12" dx="0" dy="-0.5">5</text></g>
<g id="宇-bg6"  class="badge-group"><circle cx="53.08" cy="45.83" r="3.5" fill="#bf09bf"/><text class="num-single" x="53.08" y="45.83" dx="0" dy="-0.5">6</text></g>
</svg>