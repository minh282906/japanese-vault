<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (正)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #正-bg[i]: Thời gian quả bóng số nảy lên
   - #正-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#正-bg1  { animation-delay: 0.05s; }
#正-s1   { stroke-dasharray: 57.8215; stroke-dashoffset: 57.8215; animation: drawStroke 0.32s ease-out 0.18s forwards; }
#正-bg2  { animation-delay: 0.52s; }
#正-s2   { stroke-dasharray: 63.4178; stroke-dashoffset: 63.4178; animation: drawStroke 0.35s ease-out 0.65s forwards; }
#正-bg3  { animation-delay: 1.02s; }
#正-s3   { stroke-dasharray: 25.6113; stroke-dashoffset: 25.6113; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#正-bg4  { animation-delay: 1.39s; }
#正-s4   { stroke-dasharray: 33.7159; stroke-dashoffset: 33.7159; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#正-bg5  { animation-delay: 1.76s; }
#正-s5   { stroke-dasharray: 79.6628; stroke-dashoffset: 79.6628; animation: drawStroke 0.44s ease-out 1.89s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #正-s[i]) -->
<path id="正-s1"  class="stroke" stroke="#bf0909" d="M26.75,23.79C29.87,24.419999999999998,33.1,24.29,36.25,24.009999999999998C48.06,22.979999999999997,62.019999999999996,21.45,76,20.72C78.84,20.57,81.56,20.689999999999998,84.38,21.029999999999998"/>
<path id="正-s2"  class="stroke" stroke="#9abf09" d="M52.96,25.62C54.36,27.02,54.97,28.5,54.97,31.16C54.97,42.71,54.96,87.46,54.96,88.5"/>
<path id="正-s3"  class="stroke" stroke="#09bf52" d="M56.36,53.48C63.5,53,71.88,52.12,78.28,51.63999999999999C79.87,51.519999999999996,80.75,51.61999999999999,81.88,51.79999999999999"/>
<path id="正-s4"  class="stroke" stroke="#0952bf" d="M27.54,56.37C28.71,57.54,29.59,58.989999999999995,29.689999999999998,61.58C30.119999999999997,72.38,30.119999999999997,81.88,30.31,89.5"/>
<path id="正-s5"  class="stroke" stroke="#9a09bf" d="M14.25,90.04C18,91,21.38,91.23,25,91C39,90.12,64.22999999999999,88.93,83.63,88.61C86.99,88.55,90.39999999999999,88.92999999999999,93.63,89.98"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="正-bg1"  class="badge-group"><circle cx="26.75" cy="23.79" r="3.5" fill="#bf0909"/><text class="num-single" x="26.75" y="23.79" dx="0" dy="-0.5">1</text></g>
<g id="正-bg2"  class="badge-group"><circle cx="52.96" cy="25.62" r="3.5" fill="#9abf09"/><text class="num-single" x="52.96" y="25.62" dx="0" dy="-0.5">2</text></g>
<g id="正-bg3"  class="badge-group"><circle cx="56.36" cy="53.48" r="3.5" fill="#09bf52"/><text class="num-single" x="56.36" y="53.48" dx="0" dy="-0.5">3</text></g>
<g id="正-bg4"  class="badge-group"><circle cx="27.54" cy="56.37" r="3.5" fill="#0952bf"/><text class="num-single" x="27.54" y="56.37" dx="0" dy="-0.5">4</text></g>
<g id="正-bg5"  class="badge-group"><circle cx="14.25" cy="90.04" r="3.5" fill="#9a09bf"/><text class="num-single" x="14.25" y="90.04" dx="0" dy="-0.5">5</text></g>
</svg>