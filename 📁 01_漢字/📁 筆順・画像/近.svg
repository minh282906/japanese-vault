<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (近)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #近-bg[i]: Thời gian quả bóng số nảy lên
   - #近-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#近-bg1  { animation-delay: 0.05s; }
#近-s1   { stroke-dasharray: 29.7940; stroke-dashoffset: 29.7940; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#近-bg2  { animation-delay: 0.42s; }
#近-s2   { stroke-dasharray: 50.8949; stroke-dashoffset: 50.8949; animation: drawStroke 0.28s ease-out 0.55s forwards; }
#近-bg3  { animation-delay: 0.85s; }
#近-s3   { stroke-dasharray: 40.6282; stroke-dashoffset: 40.6282; animation: drawStroke 0.22s ease-out 0.98s forwards; }
#近-bg4  { animation-delay: 1.22s; }
#近-s4   { stroke-dasharray: 43.9899; stroke-dashoffset: 43.9899; animation: drawStroke 0.24s ease-out 1.35s forwards; }
#近-bg5  { animation-delay: 1.61s; }
#近-s5   { stroke-dasharray: 14.4726; stroke-dashoffset: 14.4726; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#近-bg6  { animation-delay: 1.98s; }
#近-s6   { stroke-dasharray: 63.0588; stroke-dashoffset: 63.0588; animation: drawStroke 0.35s ease-out 2.11s forwards; }
#近-bg7  { animation-delay: 2.48s; }
#近-s7   { stroke-dasharray: 79.9375; stroke-dashoffset: 79.9375; animation: drawStroke 0.44s ease-out 2.61s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #近-s[i]) -->
<path id="近-s1"  class="stroke" stroke="#bf0909" d="M77.75,13.25C77.5,14.75,76.01,15.96,74.89,16.65C70.25,19.5,62.5,23,51.81,26.72"/>
<path id="近-s2"  class="stroke" stroke="#bfa509" d="M48.54,25.5C49.5,26.75,49.99,28.43,49.99,30.06C49.99,48.5,50.13,62,40.81,74.21"/>
<path id="近-s3"  class="stroke" stroke="#3dbf09" d="M52.75,40.9C53.33,41.019999999999996,55.81,41.21,57.35,41.019999999999996C65.62,40,78.72,37.99,87.9,37.2C89.44000000000001,37.07,92.15,37.080000000000005,93.12,37.2"/>
<path id="近-s4"  class="stroke" stroke="#09bf71" d="M72.87,41.75C74.06,42.94,74.58,44.13,74.58,45.5C74.58,47.58,74.51,67.88,74.49,80.5C74.49,82.25,74.49,83.86,74.49,85.25"/>
<path id="近-s5"  class="stroke" stroke="#0971bf" d="M20.96,19.25C24.59,20.99,30.340000000000003,26.42,31.25,29.130000000000003"/>
<path id="近-s6"  class="stroke" stroke="#3d09bf" d="M13.11,50.5C15.36,51.5,16.86,51,17.86,50.75S26.61,47.5,28.11,47C31.11,46,32.94,47.21,29.86,51.75C23.75,60.75,24,61,30.11,67.25C33.15,70.36,31.75,71.75,29.36,73.75C27.86,75,20.86,81,19.36,81.5"/>
<path id="近-s7"  class="stroke" stroke="#bf09a5" d="M15.25,83C18.25,82.5,24.25,81.25,28.75,82.25S58.82,89.96,63.25,91.25C75.25,94.75,84.5,95.75,93.5,94"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="近-bg1"  class="badge-group"><circle cx="77.75" cy="13.25" r="3.5" fill="#bf0909"/><text class="num-single" x="77.75" y="13.25" dx="0" dy="-0.5">1</text></g>
<g id="近-bg2"  class="badge-group"><circle cx="48.54" cy="25.5" r="3.5" fill="#bfa509"/><text class="num-single" x="48.54" y="25.5" dx="0" dy="-0.5">2</text></g>
<g id="近-bg3"  class="badge-group"><circle cx="52.75" cy="40.9" r="3.5" fill="#3dbf09"/><text class="num-single" x="52.75" y="40.9" dx="0" dy="-0.5">3</text></g>
<g id="近-bg4"  class="badge-group"><circle cx="72.87" cy="41.75" r="3.5" fill="#09bf71"/><text class="num-single" x="72.87" y="41.75" dx="0" dy="-0.5">4</text></g>
<g id="近-bg5"  class="badge-group"><circle cx="20.96" cy="19.25" r="3.5" fill="#0971bf"/><text class="num-single" x="20.96" y="19.25" dx="0" dy="-0.5">5</text></g>
<g id="近-bg6"  class="badge-group"><circle cx="13.11" cy="50.5" r="3.5" fill="#3d09bf"/><text class="num-single" x="13.11" y="50.5" dx="0" dy="-0.5">6</text></g>
<g id="近-bg7"  class="badge-group"><circle cx="15.25" cy="83" r="3.5" fill="#bf09a5"/><text class="num-single" x="15.25" y="83" dx="0" dy="-0.5">7</text></g>
</svg>