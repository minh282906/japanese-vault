<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (州)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #州-bg[i]: Thời gian quả bóng số nảy lên
   - #州-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#州-bg1  { animation-delay: 0.05s; }
#州-s1   { stroke-dasharray: 16.6115; stroke-dashoffset: 16.6115; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#州-bg2  { animation-delay: 0.42s; }
#州-s2   { stroke-dasharray: 74.8420; stroke-dashoffset: 74.8420; animation: drawStroke 0.41s ease-out 0.55s forwards; }
#州-bg3  { animation-delay: 0.98s; }
#州-s3   { stroke-dasharray: 14.0006; stroke-dashoffset: 14.0006; animation: drawStroke 0.22s ease-out 1.11s forwards; }
#州-bg4  { animation-delay: 1.35s; }
#州-s4   { stroke-dasharray: 67.9243; stroke-dashoffset: 67.9243; animation: drawStroke 0.37s ease-out 1.48s forwards; }
#州-bg5  { animation-delay: 1.87s; }
#州-s5   { stroke-dasharray: 16.2644; stroke-dashoffset: 16.2644; animation: drawStroke 0.22s ease-out 2.00s forwards; }
#州-bg6  { animation-delay: 2.24s; }
#州-s6   { stroke-dasharray: 78.2927; stroke-dashoffset: 78.2927; animation: drawStroke 0.43s ease-out 2.37s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 6 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #州-s[i]) -->
<path id="州-s1"  class="stroke" stroke="#bf0909" d="M20,42.75C19.98,48.730000000000004,18.73,53.01,14.309999999999999,57.88"/>
<path id="州-s2"  class="stroke" stroke="#bfbf09" d="M29.24,20.93C30.349999999999998,22.04,30.84,23.75,30.86,25.82C31.38,71.75,26,79,13.56,90.49"/>
<path id="州-s3"  class="stroke" stroke="#09bf09" d="M41.38,43.62C43.77,45.75,47.550000000000004,52.39,48.150000000000006,55.709999999999994"/>
<path id="州-s4"  class="stroke" stroke="#09bfbf" d="M56,17.88C57.12,19,57.66,20.75,57.66,22.03C57.66,22.630000000000003,57.62,62.64,57.559999999999995,78.87C57.55,82.25,57.529999999999994,84.61,57.519999999999996,85.38000000000001"/>
<path id="州-s5"  class="stroke" stroke="#0909bf" d="M68.75,42C71.71,44.42,76.4,51.95,77.14,55.72"/>
<path id="州-s6"  class="stroke" stroke="#bf09bf" d="M87.31,17.13C88.59,18.41,89.32000000000001,20,89.32000000000001,22.13C89.32000000000001,25.41,89.25000000000001,71.03999999999999,89.14,88.61999999999999C89.12,91.78999999999999,89.1,94.02,89.07000000000001,94.88"/>

<!-- ============================================================
     BẢNG 6 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="州-bg1"  class="badge-group"><circle cx="20" cy="42.75" r="3.5" fill="#bf0909"/><text class="num-single" x="20" y="42.75" dx="0" dy="-0.5">1</text></g>
<g id="州-bg2"  class="badge-group"><circle cx="29.24" cy="20.93" r="3.5" fill="#bfbf09"/><text class="num-single" x="29.24" y="20.93" dx="0" dy="-0.5">2</text></g>
<g id="州-bg3"  class="badge-group"><circle cx="41.38" cy="43.62" r="3.5" fill="#09bf09"/><text class="num-single" x="41.38" y="43.62" dx="0" dy="-0.5">3</text></g>
<g id="州-bg4"  class="badge-group"><circle cx="56" cy="17.88" r="3.5" fill="#09bfbf"/><text class="num-single" x="56" y="17.88" dx="0" dy="-0.5">4</text></g>
<g id="州-bg5"  class="badge-group"><circle cx="68.75" cy="42" r="3.5" fill="#0909bf"/><text class="num-single" x="68.75" y="42" dx="0" dy="-0.5">5</text></g>
<g id="州-bg6"  class="badge-group"><circle cx="87.31" cy="17.13" r="3.5" fill="#bf09bf"/><text class="num-single" x="87.31" y="17.13" dx="0" dy="-0.5">6</text></g>
</svg>