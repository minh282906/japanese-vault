<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (劇)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #劇-bg[i]: Thời gian quả bóng số nảy lên
   - #劇-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#劇-bg1  { animation-delay: 0.05s; }
#劇-s1   { stroke-dasharray: 18.0502; stroke-dashoffset: 18.0502; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#劇-bg2  { animation-delay: 0.42s; }
#劇-s2   { stroke-dasharray: 17.5559; stroke-dashoffset: 17.5559; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#劇-bg3  { animation-delay: 0.79s; }
#劇-s3   { stroke-dasharray: 58.6737; stroke-dashoffset: 58.6737; animation: drawStroke 0.32s ease-out 0.92s forwards; }
#劇-bg4  { animation-delay: 1.26s; }
#劇-s4   { stroke-dasharray: 49.0485; stroke-dashoffset: 49.0485; animation: drawStroke 0.27s ease-out 1.39s forwards; }
#劇-bg5  { animation-delay: 1.68s; }
#劇-s5   { stroke-dasharray: 26.1726; stroke-dashoffset: 26.1726; animation: drawStroke 0.22s ease-out 1.81s forwards; }
#劇-bg6  { animation-delay: 2.05s; }
#劇-s6   { stroke-dasharray: 26.5898; stroke-dashoffset: 26.5898; animation: drawStroke 0.22s ease-out 2.18s forwards; }
#劇-bg7  { animation-delay: 2.42s; }
#劇-s7   { stroke-dasharray: 27.8257; stroke-dashoffset: 27.8257; animation: drawStroke 0.22s ease-out 2.55s forwards; }
#劇-bg8  { animation-delay: 2.79s; }
#劇-s8   { stroke-dasharray: 19.4778; stroke-dashoffset: 19.4778; animation: drawStroke 0.22s ease-out 2.92s forwards; }
#劇-bg9  { animation-delay: 3.16s; }
#劇-s9   { stroke-dasharray: 44.2483; stroke-dashoffset: 44.2483; animation: drawStroke 0.24s ease-out 3.29s forwards; }
#劇-bg10  { animation-delay: 3.55s; }
#劇-s10   { stroke-dasharray: 24.2767; stroke-dashoffset: 24.2767; animation: drawStroke 0.22s ease-out 3.68s forwards; }
#劇-bg11  { animation-delay: 3.92s; }
#劇-s11   { stroke-dasharray: 29.5261; stroke-dashoffset: 29.5261; animation: drawStroke 0.22s ease-out 4.05s forwards; }
#劇-bg12  { animation-delay: 4.29s; }
#劇-s12   { stroke-dasharray: 14.9621; stroke-dashoffset: 14.9621; animation: drawStroke 0.22s ease-out 4.42s forwards; }
#劇-bg13  { animation-delay: 4.66s; }
#劇-s13   { stroke-dasharray: 20.6348; stroke-dashoffset: 20.6348; animation: drawStroke 0.22s ease-out 4.79s forwards; }
#劇-bg14  { animation-delay: 5.03s; }
#劇-s14   { stroke-dasharray: 38.3752; stroke-dashoffset: 38.3752; animation: drawStroke 0.22s ease-out 5.16s forwards; }
#劇-bg15  { animation-delay: 5.40s; }
#劇-s15   { stroke-dasharray: 90.3545; stroke-dashoffset: 90.3545; animation: drawStroke 0.50s ease-out 5.53s forwards; }
]]>
</style>

