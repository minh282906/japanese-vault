<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (途)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #途-bg[i]: Thời gian quả bóng số nảy lên
   - #途-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#途-bg1  { animation-delay: 0.05s; }
#途-s1   { stroke-dasharray: 43.1366; stroke-dashoffset: 43.1366; animation: drawStroke 0.24s ease-out 0.18s forwards; }
#途-bg2  { animation-delay: 0.44s; }
#途-s2   { stroke-dasharray: 40.5572; stroke-dashoffset: 40.5572; animation: drawStroke 0.22s ease-out 0.57s forwards; }
#途-bg3  { animation-delay: 0.81s; }
#途-s3   { stroke-dasharray: 26.3004; stroke-dashoffset: 26.3004; animation: drawStroke 0.22s ease-out 0.94s forwards; }
#途-bg4  { animation-delay: 1.18s; }
#途-s4   { stroke-dasharray: 41.7510; stroke-dashoffset: 41.7510; animation: drawStroke 0.23s ease-out 1.31s forwards; }
#途-bg5  { animation-delay: 1.56s; }
#途-s5   { stroke-dasharray: 47.4130; stroke-dashoffset: 47.4130; animation: drawStroke 0.26s ease-out 1.69s forwards; }
#途-bg6  { animation-delay: 1.97s; }
#途-s6   { stroke-dasharray: 20.7167; stroke-dashoffset: 20.7167; animation: drawStroke 0.22s ease-out 2.10s forwards; }
#途-bg7  { animation-delay: 2.34s; }
#途-s7   { stroke-dasharray: 18.0913; stroke-dashoffset: 18.0913; animation: drawStroke 0.22s ease-out 2.47s forwards; }
#途-bg8  { animation-delay: 2.71s; }
#途-s8   { stroke-dasharray: 14.3370; stroke-dashoffset: 14.3370; animation: drawStroke 0.22s ease-out 2.84s forwards; }
#途-bg9  { animation-delay: 3.08s; }
#途-s9   { stroke-dasharray: 55.3559; stroke-dashoffset: 55.3559; animation: drawStroke 0.30s ease-out 3.21s forwards; }
#途-bg10  { animation-delay: 3.53s; }
#途-s10   { stroke-dasharray: 77.4625; stroke-dashoffset: 77.4625; animation: drawStroke 0.43s ease-out 3.66s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #途-s[i]) -->
<path id="途-s1"  class="stroke" stroke="#bf0909" d="M60.66,13C60.73,13.78,60.79,14.86,60.26,15.879999999999999C56.379999999999995,23.38,49,34.75,34.459999999999994,46.3"/>
<path id="途-s2"  class="stroke" stroke="#bf7609" d="M61.02,17.36C64.69,21.02,78.73,31.89,85.98,37.04C87.87,38.38,90.25,40.01,93.54,41.42"/>
<path id="途-s3"  class="stroke" stroke="#9abf09" d="M49.92,39.59C50.92,40.09,52.92,40.260000000000005,54,40.150000000000006C58.78,39.690000000000005,66.98,38.88,71.77,38.440000000000005C73.21,38.31,74.63,38.06,76.03,38.49"/>
<path id="途-s4"  class="stroke" stroke="#2dbf09" d="M43.15,54.25C44.89,55.02,47.06,54.51,48.86,54.31C56.76,53.43,70.47,51.64,78.25,50.99C80.28,50.82,82.63,50.81,84.6,51.330000000000005"/>
<path id="途-s5"  class="stroke" stroke="#09bf52" d="M62.41,42.44C63.36,43.39,63.76,44.75,63.76,46.32C63.76,62.86,63.839999999999996,74.38,63.839999999999996,78.53C63.839999999999996,87.96000000000001,59.38999999999999,80.21000000000001,58.379999999999995,79.16"/>
<path id="途-s6"  class="stroke" stroke="#09bfbf" d="M49.5,63.04C49.58,63.87,49.52,64.45,49.12,65.19C47.44,68.28999999999999,42.22,74.81,37.06999999999999,79.12"/>
<path id="途-s7"  class="stroke" stroke="#0952bf" d="M74.62,63C78.88000000000001,65.32,85.62,72.53999999999999,86.68,76.14"/>
<path id="途-s8"  class="stroke" stroke="#2d09bf" d="M18.46,23C22.27,24.61,28.3,29.63,29.25,32.13"/>
<path id="途-s9"  class="stroke" stroke="#9a09bf" d="M12.25,56.45C14.370000000000001,57.370000000000005,16.05,57.21,16.97,56.93C19.25,56.25,25.29,54.29,26.669999999999998,53.75C28.869999999999997,52.88,29.77,54.54,29.009999999999998,56.03C22.75,68.26,21.869999999999997,63.510000000000005,28.02,71.52C28.96,72.75,28.89,74.21,27.56,75.45C25.36,77.5,21.74,81.88,18.669999999999998,85"/>
<path id="途-s10"  class="stroke" stroke="#bf0976" d="M14.75,85.72C17.73,85.35,23.64,85.09,28.16,85.41C38.25,86.13,49.120000000000005,88.38,62.44,91.64999999999999C74.28999999999999,94.57,82.75,95.61999999999999,91.25,95.46"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="途-bg1"  class="badge-group"><circle cx="60.66" cy="9.5" r="3.5" fill="#bf0909"/><text class="num-single" x="60.66" y="9.5" dx="0" dy="-0.5">1</text></g>
<g id="途-bg2"  class="badge-group"><circle cx="61.02" cy="20.86" r="3.5" fill="#bf7609"/><text class="num-single" x="61.02" y="20.86" dx="0" dy="-0.5">2</text></g>
<g id="途-bg3"  class="badge-group"><circle cx="49.92" cy="39.59" r="3.5" fill="#9abf09"/><text class="num-single" x="49.92" y="39.59" dx="0" dy="-0.5">3</text></g>
<g id="途-bg4"  class="badge-group"><circle cx="43.15" cy="54.25" r="3.5" fill="#2dbf09"/><text class="num-single" x="43.15" y="54.25" dx="0" dy="-0.5">4</text></g>
<g id="途-bg5"  class="badge-group"><circle cx="62.41" cy="42.44" r="3.5" fill="#09bf52"/><text class="num-single" x="62.41" y="42.44" dx="0" dy="-0.5">5</text></g>
<g id="途-bg6"  class="badge-group"><circle cx="49.5" cy="63.04" r="3.5" fill="#09bfbf"/><text class="num-single" x="49.5" y="63.04" dx="0" dy="-0.5">6</text></g>
<g id="途-bg7"  class="badge-group"><circle cx="74.62" cy="63" r="3.5" fill="#0952bf"/><text class="num-single" x="74.62" y="63" dx="0" dy="-0.5">7</text></g>
<g id="途-bg8"  class="badge-group"><circle cx="18.46" cy="23" r="3.5" fill="#2d09bf"/><text class="num-single" x="18.46" y="23" dx="0" dy="-0.5">8</text></g>
<g id="途-bg9"  class="badge-group"><circle cx="12.25" cy="56.45" r="3.5" fill="#9a09bf"/><text class="num-single" x="12.25" y="56.45" dx="0" dy="-0.5">9</text></g>
<g id="途-bg10" class="badge-group"><circle cx="14.75" cy="85.72" r="3.5" fill="#bf0976"/><text class="num-double" x="14.75" y="85.72" dx="-0.4" dy="-0.475">10</text></g>
</svg>