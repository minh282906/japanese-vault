<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (察)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #察-bg[i]: Thời gian quả bóng số nảy lên
   - #察-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#察-bg1  { animation-delay: 0.05s; }
#察-s1   { stroke-dasharray: 11.9923; stroke-dashoffset: 11.9923; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#察-bg2  { animation-delay: 0.42s; }
#察-s2   { stroke-dasharray: 17.6021; stroke-dashoffset: 17.6021; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#察-bg3  { animation-delay: 0.79s; }
#察-s3   { stroke-dasharray: 80.4931; stroke-dashoffset: 80.4931; animation: drawStroke 0.44s ease-out 0.92s forwards; }
#察-bg4  { animation-delay: 1.38s; }
#察-s4   { stroke-dasharray: 24.9055; stroke-dashoffset: 24.9055; animation: drawStroke 0.22s ease-out 1.51s forwards; }
#察-bg5  { animation-delay: 1.75s; }
#察-s5   { stroke-dasharray: 64.5315; stroke-dashoffset: 64.5315; animation: drawStroke 0.35s ease-out 1.88s forwards; }
#察-bg6  { animation-delay: 2.25s; }
#察-s6   { stroke-dasharray: 6.3658; stroke-dashoffset: 6.3658; animation: drawStroke 0.22s ease-out 2.38s forwards; }
#察-bg7  { animation-delay: 2.62s; }
#察-s7   { stroke-dasharray: 7.7990; stroke-dashoffset: 7.7990; animation: drawStroke 0.22s ease-out 2.75s forwards; }
#察-bg8  { animation-delay: 2.99s; }
#察-s8   { stroke-dasharray: 43.3391; stroke-dashoffset: 43.3391; animation: drawStroke 0.24s ease-out 3.12s forwards; }
#察-bg9  { animation-delay: 3.38s; }
#察-s9   { stroke-dasharray: 46.1782; stroke-dashoffset: 46.1782; animation: drawStroke 0.25s ease-out 3.51s forwards; }
#察-bg10  { animation-delay: 3.78s; }
#察-s10   { stroke-dasharray: 30.4710; stroke-dashoffset: 30.4710; animation: drawStroke 0.22s ease-out 3.91s forwards; }
#察-bg11  { animation-delay: 4.15s; }
#察-s11   { stroke-dasharray: 53.0112; stroke-dashoffset: 53.0112; animation: drawStroke 0.29s ease-out 4.28s forwards; }
#察-bg12  { animation-delay: 4.59s; }
#察-s12   { stroke-dasharray: 32.7054; stroke-dashoffset: 32.7054; animation: drawStroke 0.22s ease-out 4.72s forwards; }
#察-bg13  { animation-delay: 4.96s; }
#察-s13   { stroke-dasharray: 23.1474; stroke-dashoffset: 23.1474; animation: drawStroke 0.22s ease-out 5.09s forwards; }
#察-bg14  { animation-delay: 5.33s; }
#察-s14   { stroke-dasharray: 20.0473; stroke-dashoffset: 20.0473; animation: drawStroke 0.22s ease-out 5.46s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

