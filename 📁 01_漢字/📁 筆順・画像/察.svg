<path id="察-s10"  class="stroke" stroke="#0923bf" d="M38.22,60.23C40.37,60.629999999999995,42,60.41,43.75,60.22C49.019999999999996,59.629999999999995,58.12,58.56,63.370000000000005,58.21C65.10000000000001,58.09,66.84,57.980000000000004,68.54,58.37"/>
<path id="察-s11"  class="stroke" stroke="#3d09bf" d="M26.46,73.07C29.080000000000002,73.94999999999999,32.19,73.41,34.870000000000005,73.14999999999999C43.620000000000005,72.30999999999999,60.870000000000005,70.13,71.37,69.71C73.99000000000001,69.61,76.63000000000001,69.5,79.21000000000001,70.02"/>
<path id="察-s12"  class="stroke" stroke="#8b09bf" d="M53.08,74.02C53.839999999999996,74.78,54.41,76.13,54.41,77.92999999999999C54.41,81.24999999999999,54.44,91.92999999999999,54.44,95.89999999999999C54.44,103.13,50,97.13,48.22,95.35"/>
