<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (覚)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #覚-bg[i]: Thời gian quả bóng số nảy lên
   - #覚-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#覚-bg1  { animation-delay: 0.05s; }
#覚-s1   { stroke-dasharray: 13.1238; stroke-dashoffset: 13.1238; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#覚-bg2  { animation-delay: 0.42s; }
#覚-s2   { stroke-dasharray: 12.3042; stroke-dashoffset: 12.3042; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#覚-bg3  { animation-delay: 0.79s; }
#覚-s3   { stroke-dasharray: 17.0144; stroke-dashoffset: 17.0144; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#覚-bg4  { animation-delay: 1.16s; }
#覚-s4   { stroke-dasharray: 17.9529; stroke-dashoffset: 17.9529; animation: drawStroke 0.22s ease-out 1.29s forwards; }
#覚-bg5  { animation-delay: 1.53s; }
#覚-s5   { stroke-dasharray: 77.2749; stroke-dashoffset: 77.2749; animation: drawStroke 0.43s ease-out 1.66s forwards; }
#覚-bg6  { animation-delay: 2.11s; }
#覚-s6   { stroke-dasharray: 35.4657; stroke-dashoffset: 35.4657; animation: drawStroke 0.22s ease-out 2.24s forwards; }
#覚-bg7  { animation-delay: 2.48s; }
#覚-s7   { stroke-dasharray: 66.7256; stroke-dashoffset: 66.7256; animation: drawStroke 0.37s ease-out 2.61s forwards; }
#覚-bg8  { animation-delay: 3.00s; }
#覚-s8   { stroke-dasharray: 31.1766; stroke-dashoffset: 31.1766; animation: drawStroke 0.22s ease-out 3.13s forwards; }
#覚-bg9  { animation-delay: 3.37s; }
#覚-s9   { stroke-dasharray: 30.5757; stroke-dashoffset: 30.5757; animation: drawStroke 0.22s ease-out 3.50s forwards; }
#覚-bg10  { animation-delay: 3.74s; }
#覚-s10   { stroke-dasharray: 30.2798; stroke-dashoffset: 30.2798; animation: drawStroke 0.22s ease-out 3.87s forwards; }
#覚-bg11  { animation-delay: 4.11s; }
#覚-s11   { stroke-dasharray: 34.7794; stroke-dashoffset: 34.7794; animation: drawStroke 0.22s ease-out 4.24s forwards; }
#覚-bg12  { animation-delay: 4.48s; }
#覚-s12   { stroke-dasharray: 55.9565; stroke-dashoffset: 55.9565; animation: drawStroke 0.31s ease-out 4.61s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #覚-s[i]) -->
<path id="覚-s1"  class="stroke" stroke="#bf0909" d="M30.5,16.5C34,19.73,37.75,25.380000000000003,38.25,27"/>
<path id="覚-s2"  class="stroke" stroke="#bf6409" d="M49.25,13C50.89,15,54.84,20.25,55.5,23.5"/>
