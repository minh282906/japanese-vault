<path id="覚-s4"  class="stroke" stroke="#64bf09" d="M22.67,33.25C22.37,38.87,20.62,45,18.080000000000002,50.5"/>
<path id="覚-s5"  class="stroke" stroke="#09bf09" d="M24,35.5C45.75,33.12,68.88,30.62,85.5,29.75C97.26,29.13,90.25,35,87,37.75"/>
<path id="覚-s6"  class="stroke" stroke="#09bf64" d="M36.28,42.83C36.81,43.58,37.59,45.62,37.59,46.66C37.59,47.47,37.59,64.94,37.59,73.5C37.59,75.9,37.59,77.59,37.59,78.04"/>
<path id="覚-s7"  class="stroke" stroke="#09bfbf" d="M38.22,44.28C41.22,44.03,63.86,40.94,66.6,40.67C68.88,40.45,70.49,41.75,70.49,43.68C70.49,47.7,70.32,62.66,70.22999999999999,70.87C70.19999999999999,73.63000000000001,70.17999999999999,75.62,70.17999999999999,76.19"/>
<path id="覚-s8"  class="stroke" stroke="#0964bf" d="M38.92,54.45C42.72,54.02,62.38,51.88,69.94,51.34"/>
<path id="覚-s9"  class="stroke" stroke="#0909bf" d="M39.16,64.17C45.87,63.5,61.86,61.46,69.58,61.13"/>
<path id="覚-s10"  class="stroke" stroke="#6409bf" d="M38.94,74.82C45.879999999999995,74.11999999999999,61.39,72.6,69.11,72.27999999999999"/>
<path id="覚-s11"  class="stroke" stroke="#bf09bf" d="M46.76,78.4C46.83,78.92,46.989999999999995,79.78,46.62,80.48C44.129999999999995,85.13000000000001,34.76,93.25,21.13,100.38"/>
<path id="覚-s12"  class="stroke" stroke="#bf0964" d="M59.19,76.27C59.8,77.08999999999999,60.309999999999995,78.06,60.309999999999995,79.33C60.309999999999995,83.65,60.239999999999995,87.16,60.239999999999995,90C60.239999999999995,96,61.87,97.96,75.27,97.96C90.24,97.96,91.66,97.36999999999999,91.66,89.41999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="覚-bg1"  class="badge-group"><circle cx="30.5" cy="16.5" r="3.5" fill="#bf0909"/><text class="num-single" x="30.5" y="16.5" dx="0" dy="-0.5">1</text></g>
<g id="覚-bg2"  class="badge-group"><circle cx="49.25" cy="13" r="3.5" fill="#bf6409"/><text class="num-single" x="49.25" y="13" dx="0" dy="-0.5">2</text></g>
