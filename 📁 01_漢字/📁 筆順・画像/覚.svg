<g id="覚-bg9"  class="badge-group"><circle cx="39.16" cy="67.67" r="3.5" fill="#0909bf"/><text class="num-single" x="39.16" y="67.67" dx="0" dy="-0.5">9</text></g>
<g id="覚-bg10" class="badge-group"><circle cx="38.94" cy="74.82" r="3.5" fill="#6409bf"/><text class="num-double" x="38.94" y="74.82" dx="-0.4" dy="-0.475">10</text></g>
<g id="覚-bg11" class="badge-group"><circle cx="46.76" cy="78.4" r="3.5" fill="#bf09bf"/><text class="num-double" x="46.76" y="78.4" dx="-0.4" dy="-0.475">11</text></g>
<g id="覚-bg12" class="badge-group"><circle cx="59.19" cy="76.27" r="3.5" fill="#bf0964"/><text class="num-double" x="59.19" y="76.27" dx="-0.4" dy="-0.475">12</text></g>
</svg>