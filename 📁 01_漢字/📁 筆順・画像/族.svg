<path id="族-s4"  class="stroke" stroke="#4bbf09" d="M29.3,36.75C29.88,37.75,29.970000000000002,38.91,29.69,40.12C26.75,53.12,21.75,67.62,11.57,80"/>
<path id="族-s5"  class="stroke" stroke="#09bf2a" d="M59.52,15.39C59.75,16.37,59.86000000000001,17.09,59.71,17.89C58.62,23.490000000000002,54.870000000000005,31.87,49.06,39.46"/>
<path id="族-s6"  class="stroke" stroke="#09bf8d" d="M58.92,29.89C61,30,62.56,29.75,63.83,29.580000000000002C68.12,29.000000000000004,76.25,27.75,81.49,26.790000000000003C83.58999999999999,26.400000000000002,85,26.380000000000003,86.5,26.500000000000004"/>
<path id="族-s7"  class="stroke" stroke="#098dbf" d="M60.09,39.25C60.13,39.73,60.17,40.48,60.02,41.16C59.150000000000006,45.17999999999999,55.13,52.379999999999995,48.75,58.75"/>
<path id="族-s8"  class="stroke" stroke="#092abf" d="M58.32,49.51C59.24,49.809999999999995,60.94,49.669999999999995,61.85,49.559999999999995C67.37,48.87,73.75,47.74999999999999,79.33,46.67999999999999C80.83,46.38999999999999,82.87,46.24999999999999,84.32,46.47999999999999"/>
<path id="族-s9"  class="stroke" stroke="#4b09bf" d="M46.8,68.16C49.25,68.75,51.959999999999994,68.61,54.28,68.25999999999999C64.37,66.74999999999999,77.62,64.74999999999999,86.74000000000001,64.22999999999999C89.06,64.1,91.30000000000001,64.24,93.59,64.67999999999999"/>
<path id="族-s10"  class="stroke" stroke="#ae09bf" d="M67.34,51.7C68,52.5,68.22,53.470000000000006,68.2,54.74C67.88000000000001,75.37,58.38,88.25,42.75,94.67"/>
<path id="族-s11"  class="stroke" stroke="#bf096c" d="M67.62,68.93C72.44,72.01,82.96000000000001,84.10000000000001,89.43,89.84C91.07000000000001,91.3,93.01,92.62,95.26,93.52000000000001"/>

<!-- ============================================================
     BẢNG 11 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="族-bg1"  class="badge-group"><circle cx="29.36" cy="16.5" r="3.5" fill="#bf0909"/><text class="num-single" x="29.36" y="16.5" dx="0" dy="-0.5">1</text></g>
<g id="族-bg2"  class="badge-group"><circle cx="12.5" cy="35.36" r="3.5" fill="#bf6c09"/><text class="num-single" x="12.5" y="35.36" dx="0" dy="-0.5">2</text></g>
