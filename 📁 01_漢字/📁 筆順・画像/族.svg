<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (族)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #族-bg[i]: Thời gian quả bóng số nảy lên
   - #族-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#族-bg1  { animation-delay: 0.05s; }
#族-s1   { stroke-dasharray: 16.6014; stroke-dashoffset: 16.6014; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#族-bg2  { animation-delay: 0.42s; }
#族-s2   { stroke-dasharray: 34.8402; stroke-dashoffset: 34.8402; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#族-bg3  { animation-delay: 0.79s; }
#族-s3   { stroke-dasharray: 61.5425; stroke-dashoffset: 61.5425; animation: drawStroke 0.34s ease-out 0.92s forwards; }
#族-bg4  { animation-delay: 1.28s; }
#族-s4   { stroke-dasharray: 47.6887; stroke-dashoffset: 47.6887; animation: drawStroke 0.26s ease-out 1.41s forwards; }
#族-bg5  { animation-delay: 1.69s; }
#族-s5   { stroke-dasharray: 26.7664; stroke-dashoffset: 26.7664; animation: drawStroke 0.22s ease-out 1.82s forwards; }
#族-bg6  { animation-delay: 2.06s; }
#族-s6   { stroke-dasharray: 27.8437; stroke-dashoffset: 27.8437; animation: drawStroke 0.22s ease-out 2.19s forwards; }
#族-bg7  { animation-delay: 2.43s; }
#族-s7   { stroke-dasharray: 23.0304; stroke-dashoffset: 23.0304; animation: drawStroke 0.22s ease-out 2.56s forwards; }
#族-bg8  { animation-delay: 2.80s; }
#族-s8   { stroke-dasharray: 26.2856; stroke-dashoffset: 26.2856; animation: drawStroke 0.22s ease-out 2.93s forwards; }
#族-bg9  { animation-delay: 3.17s; }
#族-s9   { stroke-dasharray: 47.1277; stroke-dashoffset: 47.1277; animation: drawStroke 0.26s ease-out 3.30s forwards; }
#族-bg10  { animation-delay: 3.58s; }
#族-s10   { stroke-dasharray: 53.7594; stroke-dashoffset: 53.7594; animation: drawStroke 0.30s ease-out 3.71s forwards; }
#族-bg11  { animation-delay: 4.03s; }
#族-s11   { stroke-dasharray: 37.1731; stroke-dashoffset: 37.1731; animation: drawStroke 0.22s ease-out 4.16s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 11 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #族-s[i]) -->
<path id="族-s1"  class="stroke" stroke="#bf0909" d="M29.36,16.5C30.49,17.63,31.22,18.88,31.22,20.41C31.22,26.5,31.29,28.37,31.29,32.56"/>
