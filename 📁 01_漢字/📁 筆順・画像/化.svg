<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (化)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #化-bg[i]: Thời gian quả bóng số nảy lên
   - #化-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#化-bg1  { animation-delay: 0.05s; }
#化-s1   { stroke-dasharray: 47.1439; stroke-dashoffset: 47.1439; animation: drawStroke 0.26s ease-out 0.18s forwards; }
#化-bg2  { animation-delay: 0.46s; }
#化-s2   { stroke-dasharray: 52.0047; stroke-dashoffset: 52.0047; animation: drawStroke 0.29s ease-out 0.59s forwards; }
#化-bg3  { animation-delay: 0.90s; }
#化-s3   { stroke-dasharray: 35.4934; stroke-dashoffset: 35.4934; animation: drawStroke 0.22s ease-out 1.03s forwards; }
#化-bg4  { animation-delay: 1.27s; }
#化-s4   { stroke-dasharray: 119.2430; stroke-dashoffset: 119.2430; animation: drawStroke 0.55s ease-out 1.40s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 4 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #化-s[i]) -->
<path id="化-s1"  class="stroke" stroke="#bf0909" d="M37.25,20.25C37.49,22.18,37.18,24.71,36.42,26.37C31.53,36.93,24.840000000000003,47.32,13.630000000000003,60.16"/>
<path id="化-s2"  class="stroke" stroke="#64bf09" d="M29.03,44.25C30,45.63,30.290000000000003,47.23,30.290000000000003,48.5C30.290000000000003,60.62,30.390000000000004,77.17,30.12,88.5C30.05,91.52,30,94.11,30,96"/>
<path id="化-s3"  class="stroke" stroke="#09bfbf" d="M89.25,29.25C89.25,30.91,88.46,32.18,87,33.75C82.38,38.730000000000004,71.62,46.25,61.5,49.730000000000004"/>
<path id="化-s4"  class="stroke" stroke="#6409bf" d="M56.75,15.25C58,16.25,58.5,17.9,58.5,19.46C58.5,23.12,58.57,55.92,58.57,73.95C58.57,93.25,59.75,93.82000000000001,77.5,93.82000000000001C93.75,93.82000000000001,95.25,92.12,95.25,82.25"/>

<!-- ============================================================
     BẢNG 4 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="化-bg1"  class="badge-group"><circle cx="37.25" cy="20.25" r="3.5" fill="#bf0909"/><text class="num-single" x="37.25" y="20.25" dx="0" dy="-0.5">1</text></g>
<g id="化-bg2"  class="badge-group"><circle cx="29.03" cy="44.25" r="3.5" fill="#64bf09"/><text class="num-single" x="29.03" y="44.25" dx="0" dy="-0.5">2</text></g>
<g id="化-bg3"  class="badge-group"><circle cx="89.25" cy="29.25" r="3.5" fill="#09bfbf"/><text class="num-single" x="89.25" y="29.25" dx="0" dy="-0.5">3</text></g>
<g id="化-bg4"  class="badge-group"><circle cx="56.75" cy="15.25" r="3.5" fill="#6409bf"/><text class="num-single" x="56.75" y="15.25" dx="0" dy="-0.5">4</text></g>
</svg>