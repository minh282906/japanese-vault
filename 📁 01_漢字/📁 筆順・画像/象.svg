<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (象)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #象-bg[i]: Thời gian quả bóng số nảy lên
   - #象-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#象-bg1  { animation-delay: 0.05s; }
#象-s1   { stroke-dasharray: 28.1068; stroke-dashoffset: 28.1068; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#象-bg2  { animation-delay: 0.42s; }
#象-s2   { stroke-dasharray: 39.4273; stroke-dashoffset: 39.4273; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#象-bg3  { animation-delay: 0.79s; }
#象-s3   { stroke-dasharray: 16.8303; stroke-dashoffset: 16.8303; animation: drawStroke 0.22s ease-out 0.92s forwards; }
#象-bg4  { animation-delay: 1.16s; }
#象-s4   { stroke-dasharray: 63.5496; stroke-dashoffset: 63.5496; animation: drawStroke 0.35s ease-out 1.29s forwards; }
#象-bg5  { animation-delay: 1.66s; }
#象-s5   { stroke-dasharray: 9.4046; stroke-dashoffset: 9.4046; animation: drawStroke 0.22s ease-out 1.79s forwards; }
#象-bg6  { animation-delay: 2.03s; }
#象-s6   { stroke-dasharray: 40.9734; stroke-dashoffset: 40.9734; animation: drawStroke 0.23s ease-out 2.16s forwards; }
#象-bg7  { animation-delay: 2.41s; }
#象-s7   { stroke-dasharray: 29.3906; stroke-dashoffset: 29.3906; animation: drawStroke 0.22s ease-out 2.54s forwards; }
#象-bg8  { animation-delay: 2.78s; }
#象-s8   { stroke-dasharray: 54.8076; stroke-dashoffset: 54.8076; animation: drawStroke 0.30s ease-out 2.91s forwards; }
#象-bg9  { animation-delay: 3.23s; }
#象-s9   { stroke-dasharray: 35.5010; stroke-dashoffset: 35.5010; animation: drawStroke 0.22s ease-out 3.36s forwards; }
#象-bg10  { animation-delay: 3.60s; }
#象-s10   { stroke-dasharray: 47.3791; stroke-dashoffset: 47.3791; animation: drawStroke 0.26s ease-out 3.73s forwards; }
#象-bg11  { animation-delay: 4.01s; }
#象-s11   { stroke-dasharray: 25.0407; stroke-dashoffset: 25.0407; animation: drawStroke 0.22s ease-out 4.14s forwards; }
#象-bg12  { animation-delay: 4.38s; }
#象-s12   { stroke-dasharray: 43.2322; stroke-dashoffset: 43.2322; animation: drawStroke 0.24s ease-out 4.51s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 12 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #象-s[i]) -->
<path id="象-s1"  class="stroke" stroke="#bf0909" d="M45,10.88C45.06,11.31,45.12,12,44.89,12.620000000000001C43.52,16.28,35.71,24.33,25,29.25"/>
<path id="象-s2"  class="stroke" stroke="#bf6409" d="M45.66,15C46.62,15.13,47.33,15.17,48.63999999999999,15.05C52.849999999999994,14.65,59.699999999999996,13.73,62.669999999999995,13.15C65.36999999999999,12.620000000000001,66.14999999999999,14.11,64.67999999999999,15.89C60.86999999999999,20.5,57.97999999999999,25.310000000000002,54.74999999999999,29.75"/>
<path id="象-s3"  class="stroke" stroke="#bfbf09" d="M25.58,34.83C26.5,35.25,27.209999999999997,36.01,27.43,36.85C28.56,41.17,29.07,43.300000000000004,29.87,46.28C30.18,47.45,30.540000000000003,48.76,31,50.39"/>
