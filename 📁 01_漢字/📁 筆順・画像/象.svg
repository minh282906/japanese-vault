<path id="象-s6"  class="stroke" stroke="#09bf64" d="M31.46,47.27C40.5,46.120000000000005,62.75,43.5,72.21000000000001,43.06"/>
<path id="象-s7"  class="stroke" stroke="#09bfbf" d="M48.4,47.68C48.5,48.08,48.23,49.07,47.71,49.54C44.25,52.629999999999995,35.370000000000005,58.51,23.59,62.03"/>
<path id="象-s8"  class="stroke" stroke="#0964bf" d="M46.5,53.81C55.88,61,62.25,78,53.83,93.46C51.64,97.49,47.87,95.75,44.44,93"/>
<path id="象-s9"  class="stroke" stroke="#0909bf" d="M48.25,58.31C48.34,58.77,48.43,59.5,48.08,60.160000000000004C46.08,63.900000000000006,34.98,71.93,19.61,77.21000000000001"/>
<path id="象-s10"  class="stroke" stroke="#6409bf" d="M53.49,67.48C53.6,68.07000000000001,53.36,69.11,52.77,69.87C48.620000000000005,75.25,36.24,84.87,14.740000000000002,92.75"/>
<path id="象-s11"  class="stroke" stroke="#bf09bf" d="M77.5,50C77.62,50.81,77.28,51.9,76.86,52.29C74.25,54.75,67.86,59.35,57.16,63.06"/>
<path id="象-s12"  class="stroke" stroke="#bf0964" d="M56.75,65.23C62,69.12,77.72,80.42,85.33,85.6C87.7,87.22,90.15,88.47,92.62,89.11999999999999"/>

<!-- ============================================================
     BẢNG 12 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="象-bg1"  class="badge-group"><circle cx="45" cy="7.38" r="3.5" fill="#bf0909"/><text class="num-single" x="45" y="7.38" dx="0" dy="-0.5">1</text></g>
