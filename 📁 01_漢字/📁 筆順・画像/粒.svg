<g id="粒-bg6"  class="badge-group"><circle cx="35.12" cy="53.82" r="3.5" fill="#09bf8d"/><text class="num-single" x="35.12" y="53.82" dx="0" dy="-0.5">6</text></g>
<g id="粒-bg7"  class="badge-group"><circle cx="68.51" cy="16" r="3.5" fill="#098dbf"/><text class="num-single" x="68.51" y="16" dx="0" dy="-0.5">7</text></g>
