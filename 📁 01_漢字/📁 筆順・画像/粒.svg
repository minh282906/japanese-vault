<g id="粒-bg9"  class="badge-group"><circle cx="55.25" cy="51.5" r="3.5" fill="#4b09bf"/><text class="num-single" x="55.25" y="51.5" dx="0" dy="-0.5">9</text></g>
<g id="粒-bg10" class="badge-group"><circle cx="83.88" cy="46" r="3.5" fill="#ae09bf"/><text class="num-double" x="83.88" y="46" dx="-0.4" dy="-0.475">10</text></g>
<g id="粒-bg11" class="badge-group"><circle cx="42.25" cy="86.8" r="3.5" fill="#bf096c"/><text class="num-double" x="42.25" y="86.8" dx="-0.4" dy="-0.475">11</text></g>
</svg>