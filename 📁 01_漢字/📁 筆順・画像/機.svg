<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (機)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #機-bg[i]: Thời gian quả bóng số nảy lên
   - #機-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#機-bg1  { animation-delay: 0.05s; }
#機-s1   { stroke-dasharray: 28.1840; stroke-dashoffset: 28.1840; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#機-bg2  { animation-delay: 0.42s; }
#機-s2   { stroke-dasharray: 81.7325; stroke-dashoffset: 81.7325; animation: drawStroke 0.45s ease-out 0.55s forwards; }
#機-bg3  { animation-delay: 1.02s; }
#機-s3   { stroke-dasharray: 38.6367; stroke-dashoffset: 38.6367; animation: drawStroke 0.22s ease-out 1.15s forwards; }
#機-bg4  { animation-delay: 1.39s; }
#機-s4   { stroke-dasharray: 12.9364; stroke-dashoffset: 12.9364; animation: drawStroke 0.22s ease-out 1.52s forwards; }
#機-bg5  { animation-delay: 1.76s; }
#機-s5   { stroke-dasharray: 27.7894; stroke-dashoffset: 27.7894; animation: drawStroke 0.22s ease-out 1.89s forwards; }
#機-bg6  { animation-delay: 2.13s; }
#機-s6   { stroke-dasharray: 41.4297; stroke-dashoffset: 41.4297; animation: drawStroke 0.23s ease-out 2.26s forwards; }
#機-bg7  { animation-delay: 2.51s; }
#機-s7   { stroke-dasharray: 9.3436; stroke-dashoffset: 9.3436; animation: drawStroke 0.22s ease-out 2.64s forwards; }
#機-bg8  { animation-delay: 2.88s; }
#機-s8   { stroke-dasharray: 27.2028; stroke-dashoffset: 27.2028; animation: drawStroke 0.22s ease-out 3.01s forwards; }
#機-bg9  { animation-delay: 3.25s; }
#機-s9   { stroke-dasharray: 45.6045; stroke-dashoffset: 45.6045; animation: drawStroke 0.25s ease-out 3.38s forwards; }
#機-bg10  { animation-delay: 3.65s; }
#機-s10   { stroke-dasharray: 10.7223; stroke-dashoffset: 10.7223; animation: drawStroke 0.22s ease-out 3.78s forwards; }
#機-bg11  { animation-delay: 4.02s; }
#機-s11   { stroke-dasharray: 59.0763; stroke-dashoffset: 59.0763; animation: drawStroke 0.32s ease-out 4.15s forwards; }
#機-bg12  { animation-delay: 4.49s; }
#機-s12   { stroke-dasharray: 30.4523; stroke-dashoffset: 30.4523; animation: drawStroke 0.22s ease-out 4.62s forwards; }
#機-bg13  { animation-delay: 4.86s; }
#機-s13   { stroke-dasharray: 11.0149; stroke-dashoffset: 11.0149; animation: drawStroke 0.22s ease-out 4.99s forwards; }
#機-bg14  { animation-delay: 5.23s; }
#機-s14   { stroke-dasharray: 104.8710; stroke-dashoffset: 104.8710; animation: drawStroke 0.55s ease-out 5.36s forwards; }
#機-bg15  { animation-delay: 5.93s; }
#機-s15   { stroke-dasharray: 41.8694; stroke-dashoffset: 41.8694; animation: drawStroke 0.23s ease-out 6.06s forwards; }
#機-bg16  { animation-delay: 6.31s; }
#機-s16   { stroke-dasharray: 9.3751; stroke-dashoffset: 9.3751; animation: drawStroke 0.22s ease-out 6.44s forwards; }
]]>
</style>

