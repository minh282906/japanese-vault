<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (失)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #失-bg[i]: Thời gian quả bóng số nảy lên
   - #失-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#失-bg1  { animation-delay: 0.05s; }
#失-s1   { stroke-dasharray: 29.0966; stroke-dashoffset: 29.0966; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#失-bg2  { animation-delay: 0.42s; }
#失-s2   { stroke-dasharray: 46.7525; stroke-dashoffset: 46.7525; animation: drawStroke 0.26s ease-out 0.55s forwards; }
#失-bg3  { animation-delay: 0.83s; }
#失-s3   { stroke-dasharray: 68.9278; stroke-dashoffset: 68.9278; animation: drawStroke 0.38s ease-out 0.96s forwards; }
#失-bg4  { animation-delay: 1.36s; }
#失-s4   { stroke-dasharray: 95.8145; stroke-dashoffset: 95.8145; animation: drawStroke 0.53s ease-out 1.49s forwards; }
#失-bg5  { animation-delay: 2.04s; }
#失-s5   { stroke-dasharray: 55.1564; stroke-dashoffset: 55.1564; animation: drawStroke 0.30s ease-out 2.17s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #失-s[i]) -->
<path id="失-s1"  class="stroke" stroke="#bf0909" d="M36.51,23.14C36.55,23.71,36.72,24.64,36.419999999999995,25.42C33.99999999999999,31.75,29.369999999999994,38.620000000000005,20.559999999999995,46.72"/>
<path id="失-s2"  class="stroke" stroke="#9abf09" d="M32.75,38.39C35,38.88,37.01,38.71,39.01,38.480000000000004C46.44,37.61000000000001,63.349999999999994,35.43000000000001,72.5,34.970000000000006C74.73,34.86000000000001,77.06,34.720000000000006,79.25,35.260000000000005"/>
<path id="失-s3"  class="stroke" stroke="#09bf52" d="M19.75,60.14C22.46,61.11,26.45,60.67,29.240000000000002,60.27C42.38,58.370000000000005,67.49000000000001,55.540000000000006,79.75,54.800000000000004C82.56,54.63,85.47,54.67,88.25,55.260000000000005"/>
<path id="失-s4"  class="stroke" stroke="#0952bf" d="M53.62,14.25C54.25,15.5,54.48,16.66,54.489999999999995,19.08C54.75,63.75,43.75,83,17.5,95.5"/>
<path id="失-s5"  class="stroke" stroke="#9a09bf" d="M54.5,57.5C64.49,69.02,78.02,85.93,87.96000000000001,92.28C90.86000000000001,94.13,92.81,95.03,94.00000000000001,95.25"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="失-bg1"  class="badge-group"><circle cx="36.51" cy="23.14" r="3.5" fill="#bf0909"/><text class="num-single" x="36.51" y="23.14" dx="0" dy="-0.5">1</text></g>
<g id="失-bg2"  class="badge-group"><circle cx="32.75" cy="38.39" r="3.5" fill="#9abf09"/><text class="num-single" x="32.75" y="38.39" dx="0" dy="-0.5">2</text></g>
<g id="失-bg3"  class="badge-group"><circle cx="19.75" cy="60.14" r="3.5" fill="#09bf52"/><text class="num-single" x="19.75" y="60.14" dx="0" dy="-0.5">3</text></g>
<g id="失-bg4"  class="badge-group"><circle cx="53.62" cy="14.25" r="3.5" fill="#0952bf"/><text class="num-single" x="53.62" y="14.25" dx="0" dy="-0.5">4</text></g>
<g id="失-bg5"  class="badge-group"><circle cx="54.5" cy="57.5" r="3.5" fill="#9a09bf"/><text class="num-single" x="54.5" y="57.5" dx="0" dy="-0.5">5</text></g>
</svg>