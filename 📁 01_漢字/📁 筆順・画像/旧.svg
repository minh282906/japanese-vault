<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (旧)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #旧-bg[i]: Thời gian quả bóng số nảy lên
   - #旧-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#旧-bg1  { animation-delay: 0.05s; }
#旧-s1   { stroke-dasharray: 70.2147; stroke-dashoffset: 70.2147; animation: drawStroke 0.39s ease-out 0.18s forwards; }
#旧-bg2  { animation-delay: 0.59s; }
#旧-s2   { stroke-dasharray: 69.5803; stroke-dashoffset: 69.5803; animation: drawStroke 0.38s ease-out 0.72s forwards; }
#旧-bg3  { animation-delay: 1.12s; }
#旧-s3   { stroke-dasharray: 104.2870; stroke-dashoffset: 104.2870; animation: drawStroke 0.55s ease-out 1.25s forwards; }
#旧-bg4  { animation-delay: 1.82s; }
#旧-s4   { stroke-dasharray: 36.9202; stroke-dashoffset: 36.9202; animation: drawStroke 0.22s ease-out 1.95s forwards; }
#旧-bg5  { animation-delay: 2.19s; }
#旧-s5   { stroke-dasharray: 36.3092; stroke-dashoffset: 36.3092; animation: drawStroke 0.22s ease-out 2.32s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 5 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #旧-s[i]) -->
<path id="旧-s1"  class="stroke" stroke="#bf0909" d="M23.16,23C24.21,24.05,24.86,25.5,24.86,26.82C24.86,27.59,24.7,69.34,24.66,86.5C24.65,89.38,24.65,91.57,24.65,92.75"/>
<path id="旧-s2"  class="stroke" stroke="#9abf09" d="M46,23.3C47.1,24.400000000000002,47.51,25.830000000000002,47.51,27.86C47.51,31.14,47.51,69.45,47.51,85.62C47.51,89.21000000000001,47.51,91.71000000000001,47.51,92.5"/>
<path id="旧-s3"  class="stroke" stroke="#09bf52" d="M48.55,25.3C52.089999999999996,25.05,78.56,22.3,81.78999999999999,22C84.47999999999999,21.75,86.24999999999999,23.25,86.24999999999999,26.06C86.24999999999999,28.54,86.19999999999999,67.41,86.17999999999999,83.37C86.17999999999999,87.2,86.16999999999999,89.69,86.16999999999999,89.98"/>
<path id="旧-s4"  class="stroke" stroke="#0952bf" d="M48.43,54.99C56.75,54.25,79.78999999999999,51.95,85.22,51.95"/>
<path id="旧-s5"  class="stroke" stroke="#9a09bf" d="M48.8,86.71C59.88,86,73.12,85,85.05,84.68"/>

<!-- ============================================================
     BẢNG 5 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="旧-bg1"  class="badge-group"><circle cx="23.16" cy="23" r="3.5" fill="#bf0909"/><text class="num-single" x="23.16" y="23" dx="0" dy="-0.5">1</text></g>
<g id="旧-bg2"  class="badge-group"><circle cx="46" cy="19.8" r="3.5" fill="#9abf09"/><text class="num-single" x="46" y="19.8" dx="0" dy="-0.5">2</text></g>
<g id="旧-bg3"  class="badge-group"><circle cx="48.55" cy="28.8" r="3.5" fill="#09bf52"/><text class="num-single" x="48.55" y="28.8" dx="0" dy="-0.5">3</text></g>
<g id="旧-bg4"  class="badge-group"><circle cx="48.43" cy="54.99" r="3.5" fill="#0952bf"/><text class="num-single" x="48.43" y="54.99" dx="0" dy="-0.5">4</text></g>
<g id="旧-bg5"  class="badge-group"><circle cx="48.8" cy="86.71" r="3.5" fill="#9a09bf"/><text class="num-single" x="48.8" y="86.71" dx="0" dy="-0.5">5</text></g>
</svg>