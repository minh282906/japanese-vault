<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (際)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #際-bg[i]: Thời gian quả bóng số nảy lên
   - #際-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#際-bg1  { animation-delay: 0.05s; }
#際-s1   { stroke-dasharray: 42.1118; stroke-dashoffset: 42.1118; animation: drawStroke 0.23s ease-out 0.18s forwards; }
#際-bg2  { animation-delay: 0.43s; }
#際-s2   { stroke-dasharray: 35.5487; stroke-dashoffset: 35.5487; animation: drawStroke 0.22s ease-out 0.56s forwards; }
#際-bg3  { animation-delay: 0.80s; }
#際-s3   { stroke-dasharray: 77.0746; stroke-dashoffset: 77.0746; animation: drawStroke 0.42s ease-out 0.93s forwards; }
#際-bg4  { animation-delay: 1.37s; }
#際-s4   { stroke-dasharray: 22.5160; stroke-dashoffset: 22.5160; animation: drawStroke 0.22s ease-out 1.50s forwards; }
#際-bg5  { animation-delay: 1.74s; }
#際-s5   { stroke-dasharray: 57.4596; stroke-dashoffset: 57.4596; animation: drawStroke 0.32s ease-out 1.87s forwards; }
#際-bg6  { animation-delay: 2.21s; }
#際-s6   { stroke-dasharray: 9.0254; stroke-dashoffset: 9.0254; animation: drawStroke 0.22s ease-out 2.34s forwards; }
#際-bg7  { animation-delay: 2.58s; }
#際-s7   { stroke-dasharray: 10.0803; stroke-dashoffset: 10.0803; animation: drawStroke 0.22s ease-out 2.71s forwards; }
#際-bg8  { animation-delay: 2.95s; }
#際-s8   { stroke-dasharray: 46.1973; stroke-dashoffset: 46.1973; animation: drawStroke 0.25s ease-out 3.08s forwards; }
#際-bg9  { animation-delay: 3.35s; }
#際-s9   { stroke-dasharray: 38.8129; stroke-dashoffset: 38.8129; animation: drawStroke 0.22s ease-out 3.48s forwards; }
#際-bg10  { animation-delay: 3.72s; }
#際-s10   { stroke-dasharray: 24.6064; stroke-dashoffset: 24.6064; animation: drawStroke 0.22s ease-out 3.85s forwards; }
#際-bg11  { animation-delay: 4.09s; }
#際-s11   { stroke-dasharray: 45.4372; stroke-dashoffset: 45.4372; animation: drawStroke 0.25s ease-out 4.22s forwards; }
#際-bg12  { animation-delay: 4.49s; }
#際-s12   { stroke-dasharray: 38.6182; stroke-dashoffset: 38.6182; animation: drawStroke 0.22s ease-out 4.62s forwards; }
#際-bg13  { animation-delay: 4.86s; }
#際-s13   { stroke-dasharray: 24.0911; stroke-dashoffset: 24.0911; animation: drawStroke 0.22s ease-out 4.99s forwards; }
#際-bg14  { animation-delay: 5.23s; }
#際-s14   { stroke-dasharray: 22.2171; stroke-dashoffset: 22.2171; animation: drawStroke 0.22s ease-out 5.36s forwards; }
]]>
</style>

