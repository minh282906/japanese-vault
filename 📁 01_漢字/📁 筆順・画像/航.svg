<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (航)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #航-bg[i]: Thời gian quả bóng số nảy lên
   - #航-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#航-bg1  { animation-delay: 0.05s; }
#航-s1   { stroke-dasharray: 17.9414; stroke-dashoffset: 17.9414; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#航-bg2  { animation-delay: 0.42s; }
#航-s2   { stroke-dasharray: 67.9953; stroke-dashoffset: 67.9953; animation: drawStroke 0.37s ease-out 0.55s forwards; }
#航-bg3  { animation-delay: 0.94s; }
#航-s3   { stroke-dasharray: 95.0300; stroke-dashoffset: 95.0300; animation: drawStroke 0.52s ease-out 1.07s forwards; }
#航-bg4  { animation-delay: 1.61s; }
#航-s4   { stroke-dasharray: 8.9324; stroke-dashoffset: 8.9324; animation: drawStroke 0.22s ease-out 1.74s forwards; }
#航-bg5  { animation-delay: 1.98s; }
#航-s5   { stroke-dasharray: 24.1591; stroke-dashoffset: 24.1591; animation: drawStroke 0.22s ease-out 2.11s forwards; }
#航-bg6  { animation-delay: 2.35s; }
#航-s6   { stroke-dasharray: 41.8646; stroke-dashoffset: 41.8646; animation: drawStroke 0.23s ease-out 2.48s forwards; }
#航-bg7  { animation-delay: 2.73s; }
#航-s7   { stroke-dasharray: 14.0041; stroke-dashoffset: 14.0041; animation: drawStroke 0.22s ease-out 2.86s forwards; }
#航-bg8  { animation-delay: 3.10s; }
#航-s8   { stroke-dasharray: 45.0227; stroke-dashoffset: 45.0227; animation: drawStroke 0.25s ease-out 3.23s forwards; }
#航-bg9  { animation-delay: 3.50s; }
#航-s9   { stroke-dasharray: 56.6159; stroke-dashoffset: 56.6159; animation: drawStroke 0.31s ease-out 3.63s forwards; }
#航-bg10  { animation-delay: 3.96s; }
#航-s10   { stroke-dasharray: 88.1727; stroke-dashoffset: 88.1727; animation: drawStroke 0.48s ease-out 4.09s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 10 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #航-s[i]) -->
<path id="航-s1"  class="stroke" stroke="#bf0909" d="M32.87,12C33.309999999999995,13.22,33.309999999999995,14.44,32.879999999999995,15.71C32.3,17.43,29.989999999999995,22.03,26.059999999999995,28.090000000000003"/>
<path id="航-s2"  class="stroke" stroke="#bf7609" d="M18.52,29.57C19.349999999999998,30.85,19.74,32.59,19.81,34.19C21.5,75,17.38,87.38,9.79,95"/>
<path id="航-s3"  class="stroke" stroke="#9abf09" d="M20.44,31.67C24.8,31.03,36.06,28.790000000000003,40.010000000000005,28.150000000000002C43.96000000000001,27.51,43.75000000000001,29.430000000000003,43.75000000000001,31.67C43.75000000000001,33.910000000000004,43.580000000000005,85.22,43.580000000000005,88.42C43.580000000000005,97.25,40.42,92.23,37.14000000000001,89.7"/>
<path id="航-s4"  class="stroke" stroke="#2dbf09" d="M28.25,38.38C29.59,39.89,32.93,43.93,33.269999999999996,45.7"/>
<path id="航-s5"  class="stroke" stroke="#09bf52" d="M30.35,56.15C31.16,56.96,31.35,58.21,31.35,59.489999999999995C31.35,60.51,31.240000000000002,70.28,31.200000000000003,76.36999999999999C31.19,77.89999999999999,31.180000000000003,79.19999999999999,31.180000000000003,80.07"/>
<path id="航-s6"  class="stroke" stroke="#09bfbf" d="M9.5,59.51C10.38,60.5,11.74,60.73,13.15,60.269999999999996C15.5,59.5,39.5,50.75,49,47.96"/>
<path id="航-s7"  class="stroke" stroke="#0952bf" d="M72.18,13.5C73.15,14.47,73.83000000000001,15.879999999999999,73.83000000000001,17.41C73.83000000000001,21.87,73.96000000000001,23.490000000000002,73.96000000000001,27.060000000000002"/>
<path id="航-s8"  class="stroke" stroke="#2d09bf" d="M51.52,30.11C53.760000000000005,30.63,56.06,30.52,57.410000000000004,30.41C70.03,29.38,76.96000000000001,28,91.16,27.21C93.44,27.080000000000002,94.88,27.26,96.31,27.66"/>
<path id="航-s9"  class="stroke" stroke="#9a09bf" d="M61.71,44.5C62.54,45.33,62.980000000000004,47.13,63.02,48.9C63.5,71.13,59.25,88.88,47.5,96.25"/>
<path id="航-s10"  class="stroke" stroke="#bf0976" d="M63.87,46.75C68.42,45.75,74.2,44.76,78.75,43.5C82.37,42.5,84.44,44.39,83.74,48.05C81.75,58.5,81.03,69.75,81.03,80.5C81.03,90.25,83.62,92.03,90.57,92.03C97.86,92.03,98.63,90.5,98.63,83.91"/>

<!-- ============================================================
     BẢNG 10 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="航-bg1"  class="badge-group"><circle cx="32.87" cy="12" r="3.5" fill="#bf0909"/><text class="num-single" x="32.87" y="12" dx="0" dy="-0.5">1</text></g>
<g id="航-bg2"  class="badge-group"><circle cx="18.52" cy="26.07" r="3.5" fill="#bf7609"/><text class="num-single" x="18.52" y="26.07" dx="0" dy="-0.5">2</text></g>
<g id="航-bg3"  class="badge-group"><circle cx="20.44" cy="35.17" r="3.5" fill="#9abf09"/><text class="num-single" x="20.44" y="35.17" dx="0" dy="-0.5">3</text></g>
<g id="航-bg4"  class="badge-group"><circle cx="28.25" cy="38.38" r="3.5" fill="#2dbf09"/><text class="num-single" x="28.25" y="38.38" dx="0" dy="-0.5">4</text></g>
<g id="航-bg5"  class="badge-group"><circle cx="30.35" cy="56.15" r="3.5" fill="#09bf52"/><text class="num-single" x="30.35" y="56.15" dx="0" dy="-0.5">5</text></g>
<g id="航-bg6"  class="badge-group"><circle cx="9.5" cy="59.51" r="3.5" fill="#09bfbf"/><text class="num-single" x="9.5" y="59.51" dx="0" dy="-0.5">6</text></g>
<g id="航-bg7"  class="badge-group"><circle cx="72.18" cy="13.5" r="3.5" fill="#0952bf"/><text class="num-single" x="72.18" y="13.5" dx="0" dy="-0.5">7</text></g>
<g id="航-bg8"  class="badge-group"><circle cx="51.52" cy="30.11" r="3.5" fill="#2d09bf"/><text class="num-single" x="51.52" y="30.11" dx="0" dy="-0.5">8</text></g>
<g id="航-bg9"  class="badge-group"><circle cx="61.71" cy="41.0" r="3.5" fill="#9a09bf"/><text class="num-single" x="61.71" y="41.0" dx="0" dy="-0.5">9</text></g>
<g id="航-bg10" class="badge-group"><circle cx="63.87" cy="50.25" r="3.5" fill="#bf0976"/><text class="num-double" x="63.87" y="50.25" dx="-0.4" dy="-0.475">10</text></g>
</svg>