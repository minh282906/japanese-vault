<?xml version="1.0" encoding="UTF-8"?>
<svg height="100%" version="1.1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" style="background:#181a1f; border-radius:16px;">
<style type="text/css"><![CDATA[
/* ============================================================
   BẢNG THÔNG SỐ ĐIỀU CHỈNH (対)
   ============================================================ */

/* 1. HIỆU ỨNG VẼ NÉT & HIỆN SỐ */
@keyframes drawStroke {
    0%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes softFade {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 2. ĐƯỜNG LƯỚI CHỮ THẬP NỀN (Màu xám tối, nét đứt 4-2) */
.grid-cross {
    stroke: #2d333b;
    stroke-width: 0.6;
    stroke-dasharray: 4, 2;
}

/* 3. NÉT VẼ BÚT THUẬN:
   - stroke-width: Độ dày nét bút (2.8 là chuẩn thanh mảnh)
   - opacity: 0 để triệt tiêu lỗi chấm đầu nét lúc chưa vẽ */
.stroke {
    stroke-width: 2.8 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    fill: none;
    opacity: 0;
}

/* 4. HIỆU ỨNG HIỆN QUẢ BÓNG */
.badge-group {
    opacity: 0;
    animation: softFade 0.2s ease-out forwards;
}

/* 5. ĐỊNH DẠNG SỐ MỘT CHỮ SỐ (1-9) */
.num-single {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 7.6px !important;        /* Cỡ chữ */
    font-weight: 375 !important;        /* Độ mảnh */
    font-style: normal !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* 5. ĐỊNH DẠNG SỐ HAI CHỮ SỐ (10 TRỞ LÊN) */
.num-double {
    font-family: "Segoe UI", -apple-system, sans-serif, "Arial Narrow", "Roboto Condensed";
    font-size: 6.5px !important;        /* Giảm cỡ chữ để trông gọn hơn so với số một chữ số */
    font-weight: 375 !important;        /* Tăng nhẹ nét mực để độ dày phù hợp hơn */
    font-style: normal !important;
    letter-spacing: -0.35px !important;
    fill: #ffffff !important;
    text-anchor: middle;
    dominant-baseline: central;
}

/* ============================================================
   TIMELINE ĐIỀU KHIỂN THỜI GIAN:
   - #対-bg[i]: Thời gian quả bóng số nảy lên
   - #対-s[i]:  Độ dài nét vẽ và thời gian ngọn bút bắt đầu chạy
   ============================================================ */
#対-bg1  { animation-delay: 0.05s; }
#対-s1   { stroke-dasharray: 18.3259; stroke-dashoffset: 18.3259; animation: drawStroke 0.22s ease-out 0.18s forwards; }
#対-bg2  { animation-delay: 0.42s; }
#対-s2   { stroke-dasharray: 39.4397; stroke-dashoffset: 39.4397; animation: drawStroke 0.22s ease-out 0.55s forwards; }
#対-bg3  { animation-delay: 0.79s; }
#対-s3   { stroke-dasharray: 55.7104; stroke-dashoffset: 55.7104; animation: drawStroke 0.31s ease-out 0.92s forwards; }
#対-bg4  { animation-delay: 1.25s; }
#対-s4   { stroke-dasharray: 39.4199; stroke-dashoffset: 39.4199; animation: drawStroke 0.22s ease-out 1.38s forwards; }
#対-bg5  { animation-delay: 1.62s; }
#対-s5   { stroke-dasharray: 43.1672; stroke-dashoffset: 43.1672; animation: drawStroke 0.24s ease-out 1.75s forwards; }
#対-bg6  { animation-delay: 2.01s; }
#対-s6   { stroke-dasharray: 89.8282; stroke-dashoffset: 89.8282; animation: drawStroke 0.49s ease-out 2.14s forwards; }
#対-bg7  { animation-delay: 2.65s; }
#対-s7   { stroke-dasharray: 12.5180; stroke-dashoffset: 12.5180; animation: drawStroke 0.22s ease-out 2.78s forwards; }
]]>
</style>

<!-- LƯỚI CHỮ THẬP CỐ ĐỊNH -->
<path class="grid-cross" d="M55,0 L55,110" /><path class="grid-cross" d="M0,55 L110,55" />

<!-- 7 ĐƯỜNG NÉT VẼ (QUY TẮC ID SCOPING: #対-s[i]) -->
<path id="対-s1"  class="stroke" stroke="#bf0909" d="M33.81,16C34.910000000000004,17.09,35.620000000000005,18.38,35.620000000000005,19.990000000000002C35.620000000000005,24,35.6,30.93,35.540000000000006,33.81"/>
<path id="対-s2"  class="stroke" stroke="#bfa509" d="M13.25,37.54C15,38,16.81,37.98,18.759999999999998,37.64C27.5,36.12,40.5,34,46.99,33.02C48.730000000000004,32.760000000000005,50.75,32.75,52.25,33"/>
<path id="対-s3"  class="stroke" stroke="#3dbf09" d="M41.84,41.31C42.190000000000005,42.35,42.34,43.61,41.760000000000005,45.510000000000005C36.75000000000001,62.13000000000001,26.630000000000003,78.38,13.880000000000006,87.75"/>
<path id="対-s4"  class="stroke" stroke="#09bf71" d="M21.21,52.76C31.25,58.5,43.07,72.34,48.25,81"/>
<path id="対-s5"  class="stroke" stroke="#0971bf" d="M54.38,43.11C55.96,43.64,58.89,43.64,60.45,43.39C67.75,42.24,85.5,38.91,91.59,38.77C94.23,38.71,95.81,38.690000000000005,97.13000000000001,38.96"/>
<path id="対-s6"  class="stroke" stroke="#3d09bf" d="M78.52,13.08C79.85,14.41,80.53,16,80.53,18.1C80.53,32.660000000000004,80.52,84.50999999999999,80.52,89.47C80.52,98.88,76,93.13,73.31,90.47"/>
<path id="対-s7"  class="stroke" stroke="#bf09a5" d="M56.25,59.12C59.32,60.66,64.19,65.46,64.96000000000001,67.86"/>

<!-- ============================================================
     BẢNG 7 QUẢ BÓNG SỐ (ĐỒNG BỘ BÁN KÍNH r="3.5"):
     - circle: cx, cy là tâm quả bóng; r="3.5" là bán kính quả bóng
     - text:   x, y luôn đặt BẰNG ĐÚNG cx, cy của hình tròn
     - dx:     Cần gạt ngang (âm: kéo sang trái | dương: sang phải)
     - dy:     Cần gạt dọc   (âm: nhấc lên trên | dương: hạ xuống dưới)
     ============================================================ -->
<g id="対-bg1"  class="badge-group"><circle cx="33.81" cy="16" r="3.5" fill="#bf0909"/><text class="num-single" x="33.81" y="16" dx="0" dy="-0.5">1</text></g>
<g id="対-bg2"  class="badge-group"><circle cx="13.25" cy="37.54" r="3.5" fill="#bfa509"/><text class="num-single" x="13.25" y="37.54" dx="0" dy="-0.5">2</text></g>
<g id="対-bg3"  class="badge-group"><circle cx="41.84" cy="41.31" r="3.5" fill="#3dbf09"/><text class="num-single" x="41.84" y="41.31" dx="0" dy="-0.5">3</text></g>
<g id="対-bg4"  class="badge-group"><circle cx="21.21" cy="52.76" r="3.5" fill="#09bf71"/><text class="num-single" x="21.21" y="52.76" dx="0" dy="-0.5">4</text></g>
<g id="対-bg5"  class="badge-group"><circle cx="54.38" cy="43.11" r="3.5" fill="#0971bf"/><text class="num-single" x="54.38" y="43.11" dx="0" dy="-0.5">5</text></g>
<g id="対-bg6"  class="badge-group"><circle cx="78.52" cy="13.08" r="3.5" fill="#3d09bf"/><text class="num-single" x="78.52" y="13.08" dx="0" dy="-0.5">6</text></g>
<g id="対-bg7"  class="badge-group"><circle cx="56.25" cy="59.12" r="3.5" fill="#bf09a5"/><text class="num-single" x="56.25" y="59.12" dx="0" dy="-0.5">7</text></g>
</svg>